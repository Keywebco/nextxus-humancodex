# Living Library, Vol. IV: Plague, Sail, and Reason
# Entries 2044 to 2743. Free to download, print and share, forever.
# Source of truth for the text: the HumanCodex Verse volumes. Each entry carries a SHA-256 of its poem text so any change can be detected.
entries:
  - number: "2044"
    volume: 4
    title: "The First Holy Year"
    date: "1300 CE"
    region: "Rome"
    poem: |
      I stood in the road-dust with a hundred thousand others,
      bare feet, staffs, the whole year spilling toward one city.
      Boniface had thrown the doors of heaven open wide
      and promised: come to Rome, and your sins go with the tide.
      Old women who had never left their villages
      walked over mountains for a pardon.
      I watched them kneel on the worn stone steps,
      and I tell you — they believed. They believed hard enough
      to carry their whole villages on their backs.
      That is a power no army ever owned.
    description: "Boniface VIII opens the first Jubilee, and pilgrims flood Rome in numbers no one has ever seen, all of them hungry for forgiveness."
    status: "first draft"
    sha256: "3d8efb6f50b02c962c757b1930df9e8a2476986b103e9314f609b1947cd34292"
  - number: "2045"
    volume: 4
    title: "The Yuan at Its Height"
    date: "1300 CE"
    region: "China"
    poem: |
      In Hangzhou I counted bridges like stars in a river,
      paper money changing hands before the ink dried,
      the Grand Canal a black shining road of barges
      carrying grain to cities bigger than any in the world.
      Kublai is gone but his heirs hold the whole of it —
      every roof, every harbor, every taxed stalk of rice.
      I ate noodles in a market with a thousand stalls
      and thought: this is what the peak feels like.
      Nobody on a peak knows they are standing on one.
    description: "Under Kublai's heirs the Yuan rules all China — paper money, the Grand Canal, and cities of unmatched size — at the very crest of its power."
    status: "first draft"
    sha256: "913e683ac9b1de141b1b8dedcfb8d7bf5e95cfd4b48de58c36d950432035d9ac"
  - number: "2046"
    volume: 4
    title: "Dante Is Cast Out"
    date: "1302 CE"
    region: "Florence"
    poem: |
      They sentenced him to fire if he ever came back —
      burned alive, by his own neighbors, over a street fight of politics.
      I saw him leave through the gate at dusk,
      a man with nothing but his name and his tongue.
      Florence thought it was throwing away a troublemaker.
      Florence did not know it was forging one.
      Give a man exile and grief enough,
      and he will build you a world out of it —
      hell, heaven, and everything in between.
    description: "Florence exiles Dante Alighieri under sentence of burning, and the homeless poet begins the long road that will produce his great vision."
    status: "first draft"
    sha256: "70263b29f099858a282e9e549037a8f038b979530ecfdc4af82e85961e903bde"
  - number: "2047"
    volume: 4
    title: "The King Summons the Three Estates"
    date: "1302 CE"
    region: "France"
    poem: |
      Priest, sword, and plow — Philip called them all into one room,
      the first time a king of France ever asked the town men to sit down with him.
      He needed their money for his war with the Pope,
      so he dressed it up as counsel.
      I watched the burghers take their benches,
      awkward, new, learning the weight of the thing they'd been handed.
      Kings only summon people to share a table
      when they are too poor to eat alone.
    description: "Philip IV gathers clergy, nobles, and townsmen into the first Estates-General — a king borrowing the people's voice to pay for his quarrels."
    status: "first draft"
    sha256: "f8b17cd2990fdc9330c01f0804ca635053e8eaa57c73883e39f295262c438f4c"
  - number: "2048"
    volume: 4
    title: "The Golden Spurs of Kortrijk"
    date: "1302 CE"
    region: "Flanders"
    poem: |
      Five hundred pairs of golden spurs, hung in a church,
      stripped from French knights by weavers and farmers.
      I walked that field at Kortrijk after the pikes did their work —
      the flower of France trampled in a ditch by men with guild banners.
      The knights had laughed at them that morning.
      Nobody laughed by evening.
      A pike in a craftsman's hands
      does not care about your grandfather's name.
    description: "Flemish townsmen and farmers crush the French knighthood at Kortrijk and hang the dead knights' golden spurs as trophies — the common man's day."
    status: "first draft"
    sha256: "b9bf29cc4556e2f1cc29e43dc227428dcd92b469e6ab1c20260650be546febe0"
  - number: "2049"
    volume: 4
    title: "The Outrage at Anagni"
    date: "1303 CE"
    region: "Italy"
    poem: |
      They broke into the Pope's own palace at Anagni,
      French roughs with a grudge and a king's orders,
      and laid hands on Boniface — the Vicar of Christ,
      dragged about like a thief.
      He lived three weeks after, and died of it —
      of the shame, they said. Of being shown
      that a crown can reach into the sanctuary
      and find nothing there to stop it.
      I stood outside when they carried him out.
      Even the bells sounded smaller.
    description: "French agents seize Pope Boniface VIII in his palace at Anagni; the humiliation breaks him, and he dies within weeks."
    status: "first draft"
    sha256: "3489a403bc7c2232fb89bf8072527de4a74edf270d6f8ee9f08da787bcfc7f01"
  - number: "2050"
    volume: 4
    title: "The Fall of Chittor"
    date: "1303 CE"
    region: "India"
    poem: |
      When the walls could not hold, the Rajputs chose the fire.
      I have never seen anything like that morning at Chittor —
      women and children walking into the flames in their wedding silks,
      the men riding out in saffron to die on the swords below,
      because surrender to Alauddin was worse than the pyre.
      The sultan got his fortress.
      What he did not get were its people.
      Some victories are just ruins with nobody left to rule.
    description: "Alauddin Khalji storms Chittor, and the Rajput defenders choose the funeral fire over surrender — a fortress taken, a people unconquered."
    status: "first draft"
    sha256: "84d3d1229d92b0de163a477affdd2b012940a19f0d211a073a7fc6f22ab8c950"
  - number: "2051"
    volume: 4
    title: "Death of the Mongol Ruler"
    date: "1304 CE"
    region: "Persia"
    poem: |
      Ghazan is dead — the Khan who traded the sky-father's worship
      for the faith of the Prophet, and made Persia bow with him.
      I rode past Tabriz the week the news came,
      and the bazaars went quiet in a way bazaars never do.
      A Mongol king on a Persian throne, praying toward Mecca:
      that was the world turning over in one man's lifetime.
      The horsemen who came to conquer stayed to belong.
      That is the oldest story the steppe ever told.
    description: "Ghazan Khan, the Mongol ruler who made Islam the faith of his Persian realm, dies — conqueror turned believer."
    status: "first draft"
    sha256: "cdfb51dde7aa45ec5a69aedaf7ad37a487f29dfd888c978599fb9452cac94c46"
  - number: "2052"
    volume: 4
    title: "Stirling Falls"
    date: "1304 CE"
    region: "Scotland"
    poem: |
      Edward brought his great engines north and aimed them at Stirling
      until the walls came down in pieces.
      I watched the stones fall — months of hammering,
      the last stronghold of the Scots broken open like a nut.
      The garrison walked out barefoot with ropes around their necks.
      The Hammer thought that was the end of it.
      Castles fall. Countries don't, not that easy.
      He'd learn. They always learn late.
    description: "Edward I's siege engines smash Stirling Castle, the last Scottish stronghold — and the Hammer mistakes a fallen fortress for a finished war."
    status: "first draft"
    sha256: "38b01930f6ed923889f2fb7ddbc1168b8a2f7962382113925410610f349b8f42"
  - number: "2053"
    volume: 4
    title: "Giotto Paints the Chapel"
    date: "1305 CE"
    region: "Padua"
    poem: |
      I slipped into the Scrovegni Chapel while the plaster was still damp
      and watched Giotto's saints look back at me like neighbors.
      Before him, holy figures floated flat and gold and far away.
      Giotto gave them weight. Grief with a face on it.
      A mother holding her child like a real mother.
      Standing there among those wet blue walls,
      I understood: he wasn't painting heaven.
      He was teaching heaven how to look like us.
    description: "Giotto fills the Scrovegni Chapel with frescoes that give saints real bodies, real grief, real weight — heaven learning to look human."
    status: "first draft"
    sha256: "2544af8baf53790014b31982c8391712d69b1d3b65907955ac7310720b1819c5"
  - number: "2054"
    volume: 4
    title: "The Death of Wallace"
    date: "1305 CE"
    region: "London"
    poem: |
      They hanged him, cut him down living, and quartered him at Smithfield —
      Wallace, who had beaten England's armies and asked for nothing but Scotland.
      I was in the crowd. I will not describe the worst of it.
      Here is what matters: they meant it as a warning.
      They sent his head to London Bridge and his limbs to four towns,
      and Scotland gathered every piece of him up into a story
      no king's sword could ever touch again.
      Kill the man. Crown the ghost.
    description: "William Wallace is executed in London with full medieval cruelty — and England makes him the martyr Scotland will never let die."
    status: "first draft"
    sha256: "b0b0750db272c0942218439a2fe23733b9863d2115877e34a9d4233ee08c1509"
  - number: "2055"
    volume: 4
    title: "A Frenchman Takes the Papacy"
    date: "1305 CE"
    region: "France"
    poem: |
      Clement V — a Gascon, a Frenchman, Philip's friend —
      takes the chair of Peter, and Rome feels the ground shift.
      He never even set foot in Rome as pope.
      The papacy was already walking north,
      out of the smoke of Anagni, toward the Rhône,
      toward a king's protection that would cost everything.
      I watched the cardinals congratulate each other.
      They thought they'd chosen a pope.
      They'd chosen a leash.
    description: "Clement V, a Frenchman, becomes pope and never goes to Rome — the papacy's long captivity to France begins with a smile and a handshake."
    status: "first draft"
    sha256: "2d562d9cbb49d611fbab1b6df546fc30b69a5804bb2607840c5252fe7f5f0c0d"
  - number: "2056"
    volume: 4
    title: "The Bruce Takes the Crown"
    date: "1306 CE"
    region: "Scotland"
    poem: |
      He killed his rival Comyn inside a church — on holy ground, with a dagger —
      then rode to Scone and took the crown with blood still on his conscience.
      I saw Robert the Bruce crowned that March day,
      a small ceremony, a stolen throne, a kingdom half-beaten.
      Murder in a sanctuary. Then the anointing.
      Scotland's freedom was born in a sacrilege,
      and the Scots decided they could live with that.
      Desperate countries forgive their kings almost anything.
    description: "Robert the Bruce murders his rival in a church, then seizes Scotland's crown — a kingdom's freedom founded on a sacrilege the Scots accept."
    status: "first draft"
    sha256: "f4170f9ca9091aa004fed35c45cdcde654a5950d19cc3d093d9d952ca02913f5"
  - number: "2057"
    volume: 4
    title: "The Hammer of the Scots Dies"
    date: "1307 CE"
    region: "England"
    poem: |
      Edward I died on the road north, in his armor, still marching on Scotland —
      the Hammer of the Scots, worn out at last by his own wars.
      His son Edward II took the crown: soft hands, favorites, no stomach for the work.
      I stood among the soldiers when the news came.
      Relief ran through the Scottish hills like a thaw.
      One man's whole reign ends, and everything tilts —
      that's how fragile an empire is. It fits inside one dying chest.
    description: "Edward I dies on campaign against Scotland, and the weak Edward II inherits — the whole weight of an empire shifting in a single heartbeat."
    status: "first draft"
    sha256: "f8f1f7488ee6c1524898da0dcd51bb5d542e22e060eec5d4b51902b282f0c4cc"
  - number: "2058"
    volume: 4
    title: "The Ottoman Turks Rise"
    date: "1307 CE"
    region: "Anatolia"
    poem: |
      Out on the Byzantine frontier, Osman's riders were taking one border fort at a time —
      small work, patient work, the kind nobody in Constantinople bothered to fear.
      I rode with a caravan through those hills and heard the talk:
      the old empire rotting, the new ghazis rising,
      village by village, tower by tower.
      Nobody writes songs about the year the foundation cracked.
      They write them later, when the whole house comes down.
      This was the crack.
    description: "Osman I's small frontier princedom quietly swallows Byzantine border forts one by one — the hairline crack nobody in Constantinople noticed."
    status: "first draft"
    sha256: "6c0bf71229923a02e9c74d9d3fa4954c8c97967067bdc827b3d073f5ad3a6d60"
  - number: "2059"
    volume: 4
    title: "Henry VII Elected Emperor"
    date: "1308 CE"
    region: "Germany"
    poem: |
      Henry of Luxembourg took the imperial crown
      and dreamed the old dream: Rome, Italy, the empire made whole again.
      I watched him ride south with his knights,
      a decent man carrying a hundred-year-old fantasy on his shoulders.
      The German princes cheered him. The Italian cities braced.
      Every generation elects somebody to chase a ghost.
      Sometimes the ghost chases back.
    description: "Henry VII takes the imperial crown dreaming of restoring the empire's lost glory in Italy — one more generation chasing the old ghost."
    status: "first draft"
    sha256: "46e686c4daf8f3a0562ee4df5afbedecd3a5419dfa3b7f801160b06a6f41b366"
  - number: "2060"
    volume: 4
    title: "The Papacy Moves to France"
    date: "1309 CE"
    region: "Avignon"
    poem: |
      Clement settled his court at Avignon, by the Rhône,
      and the popes would not see Rome for seventy years.
      Seventy years. A lifetime.
      I walked the streets of Avignon as they built the palace up —
      clerks, bankers, petitioners, the whole machinery of heaven
      relocating to France like a government in exile.
      Rome sat empty, its churches crumbling.
      The fisherman's chair had moved house,
      and nobody asked the fishermen.
    description: "Clement V settles the papal court in Avignon, beginning seventy years of exile — Rome abandoned, heaven's machinery relocated to France."
    status: "first draft"
    sha256: "fc4d22b3e996a0d4179b00025ad2b1c636a61b0c4158d307491780499c2f8c47"
  - number: "2061"
    volume: 4
    title: "The Arsenal's Assembly Line"
    date: "1310 CE"
    region: "Venice"
    poem: |
      I stood at the Arsenal's gates and watched war galleys come off the line
      like loaves from an oven — ribs, planks, oars, rigging,
      each crew at its station, the ships moving down the canal
      faster than any shipwright's yard on earth had ever built.
      Venice had turned shipbuilding into a machine.
      No prayers, no miracles — just organization.
      That is the real Venetian secret, and it sailed.
    description: "Venice expands its great Arsenal, the shipyard that assembles war galleys on a production line — organization as a weapon."
    status: "first draft"
    sha256: "74d5626d9d9768dde88430ad1f03c7f3e02265da7f709ffb564a18a31261a375"
  - number: "2062"
    volume: 4
    title: "The Roads of Gold and Salt"
    date: "1310 CE"
    region: "Mali"
    poem: |
      Weight for weight — salt for gold, across the burning Sahara.
      I traveled with a salt caravan out of Taghaza,
      men wrapped against the white glare, camels groaning under slabs of salt
      worth their weight in gold at the other end.
      Mali grew fat on that road. Timbuktu glittered because of it.
      The desert is not empty. It is a river, and it flows with wealth —
      if you are hard enough to sail it.
    description: "Across the Sahara, salt trades weight for weight with gold, and Mali grows rich on the desert road — an empire built on thirst."
    status: "first draft"
    sha256: "58e26164bf3644629e9c89dc87db9ffbe3c13d4651ae44ef9b045f5759459bce"
  - number: "2063"
    volume: 4
    title: "The Slaughter at Halmyros"
    date: "1311 CE"
    region: "Greece"
    poem: |
      One morning at Halmyros, the Catalan Company — hired swords, owed back pay —
      stood in a marsh and butchered the flower of Frankish Athens.
      I walked the field after. The knights had charged straight into the bog,
      heavy horse, bright banners, straight into the mud,
      and the Catalans cut them down like wheat.
      Athens changed masters before noon.
      Mercenaries don't need a cause. They need a grievance and a dry place to stand.
    description: "Catalan mercenaries lure the Frankish knights of Athens into a marsh at Halmyros and annihilate them in a single morning — hired swords changing history."
    status: "first draft"
    sha256: "5d4192c98032d863334e973327d10a3e68fe9e35dc79d9dae81cda8248b6a180"
  - number: "2064"
    volume: 4
    title: "The Council of Vienne"
    date: "1311 CE"
    region: "France"
    poem: |
      Bishops from everywhere gathered at Vienne to judge the age's scandals —
      the Templars' gold, the priests' sins, the map of power redrawn
      while Philip of France watched from the edge of the room.
      I sat in the back and listened to the Latin roll on.
      They condemned, they dissolved, they reorganized.
      That is what councils do: they bury the old sins under new paperwork
      and call it reform.
      The Templars were already dead. This was the funeral.
    description: "Bishops gather at Vienne to judge the age's scandals — the Templars dissolved, the Church's map of power redrawn under a watching king."
    status: "first draft"
    sha256: "01779d191a3cd0f25004b1902fd885b3e5620953a39395a4236fd3673d34f76a"
  - number: "2065"
    volume: 4
    title: "Mansa Musa Takes the Throne"
    date: "1312 CE"
    region: "Mali"
    poem: |
      The throne of Mali passed to Musa, and the man had dreams
      bigger than any king before him —
      not just gold, but the name of his kingdom carried to the ends of the earth.
      I saw him hold court at Niani, the griots singing his line,
      the gold of Bambuk piled like harvest.
      He was already planning the journey that would make him legend.
      Some kings inherit a crown. He intended to inherit the world's attention.
    description: "Mansa Musa takes Mali's throne, inheriting a gold empire — and already dreaming of the journey that will carry his name across the world."
    status: "first draft"
    sha256: "da9294c0480a55801f781a2d2fb76b43e0d85324a87f955603cb2824d0c83a48"
  - number: "2066"
    volume: 4
    title: "An Emperor Dies in Tuscany"
    date: "1313 CE"
    region: "Italy"
    poem: |
      Henry VII died of fever at Buonconvento, on campaign in Tuscany,
      and with him died Dante's great hope — a united Italy under one emperor.
      I was in Siena when the body passed through.
      The Ghibellines wept. The Guelfs breathed again.
      One man's fever, and a poet's dream of a nation
      goes into the ground with him.
      History turns on such small things: a mosquito, a summer, a tired heart.
    description: "Henry VII dies of fever on campaign in Tuscany — and Dante's dream of a united Italy is buried with him."
    status: "first draft"
    sha256: "41eaa586f9d06fc068b866ffd56a5913b3f8d9784826f01e3b06ef3e58a1f6ca"
  - number: "2067"
    volume: 4
    title: "Bannockburn"
    date: "1314 CE"
    region: "Scotland"
    poem: |
      Two days by the Bannock Burn, and Bruce's spearmen —
      a bristling hedge of Scottish pikes — broke the greatest army England ever sent north.
      I was on the ridge when the English knights charged into that thicket of points
      and came apart like cloth on thorns.
      Edward II ran. His nobles died or were taken.
      Scotland won its freedom in a day of mud and shouting,
      and no English king would ever take it back.
      Some battles end wars. This one made a nation.
    description: "Robert the Bruce's spearmen shatter Edward II's great army at Bannockburn — Scotland wins its freedom in two days of mud and courage."
    status: "first draft"
    sha256: "cc7bde6f843b8badf2a54b34f6ce7032fec23940bd21a7ba0a8fda4fc4e6281c"
  - number: "2068"
    volume: 4
    title: "The Great Hunger Begins"
    date: "1315 CE"
    region: "Europe"
    poem: |
      The rains came and did not stop. The grain rotted in the fields,
      the seed for next year went into hungry mouths,
      and bread became worth more than gold.
      I walked through villages where the children had bellies like drums
      and the churchyards filled faster than the gravediggers could dig.
      No enemy did this. No king ordered it.
      The sky just closed, and kept closed,
      and Europe learned what it is to be small.
    description: "Endless rains drown the harvests and the Great Famine begins — no enemy, no war, just a closed sky and bread worth more than gold."
    status: "first draft"
    sha256: "8fd87475a1077ee17f0a98b278e8f28947353c8abdbf100ca1ba80199c922d14"
  - number: "2069"
    volume: 4
    title: "The Ambush at Morgarten"
    date: "1315 CE"
    region: "Switzerland"
    poem: |
      The Habsburg knights rode into the pass at Morgarten in their shining armor,
      and the Swiss were waiting above with rocks, logs, and halberds.
      I heard it before I saw it — the avalanche of stone and men,
      the great horses screaming in the narrow defile.
      Fifteen hundred nobles' pride, broken by farmers who knew their mountains.
      The valleys would never kneel again.
      Freedom, in Switzerland, was born in a rockslide.
    description: "Swiss mountaineers crush Habsburg knights in the pass at Morgarten with rocks and halberds — the valleys' freedom born in an avalanche."
    status: "first draft"
    sha256: "23e2e08dbc42e116413556ce835c0559f515089e805adbf744833a4bff7f3610"
  - number: "2070"
    volume: 4
    title: "The Hunger's Worst Year"
    date: "1316 CE"
    region: "Europe"
    poem: |
      This was the blackest year — the third harvest failed,
      and the starving dead outnumbered any army's toll.
      I saw mothers trade their wedding rings for a loaf,
      saw men eat grass, bark, things I will not name.
      The chroniclers wrote it down in careful Latin.
      The dead did not care about the Latin.
      When the famine finally lifted, Europe had buried
      more of its children than any war had ever taken.
      Remember this when men boast of their battles.
    description: "In the famine's worst year the starving dead outnumber any army's toll — Europe's quietest catastrophe, buried without trumpets."
    status: "first draft"
    sha256: "25946e3d63cd155e8fc3741087856d29bdff7bf894de5d0fc7238dc8c7d54c06"
  - number: "2071"
    volume: 4
    title: "A Bruce Crowned Across the Sea"
    date: "1316 CE"
    region: "Ireland"
    poem: |
      Edward Bruce — Robert's brother, all fire and no patience —
      was crowned High King of Ireland, carrying Scotland's war
      onto English-held land across the sea.
      I watched the Irish chiefs kneel to a foreign Bruce,
      hoping a Scottish sword would cut their English chains.
      It was a brave gamble. It was a doomed one.
      But for a little while, the Irish had a king of their own choosing,
      and that is a thing no defeat can take back.
    description: "Edward Bruce is crowned High King of Ireland, carrying Scotland's war across the sea — a brave, doomed gamble for Irish freedom."
    status: "first draft"
    sha256: "63c2b3bfb9f6cbcd569decb7fbdefdc0654974ef8569965399b2797be3607056"
  - number: "2072"
    volume: 4
    title: "The Hunger Breaks"
    date: "1317 CE"
    region: "Europe"
    poem: |
      After three years the rains relented. The sun came back like a pardon.
      I walked through fields where the new wheat stood green and trembling,
      and people wept over bread — actual tears, over bread.
      Europe buried its dead and counted the cost:
      villages emptied, children gone, a generation thinned.
      The famine ended. The fear didn't, not for years.
      Every full granary after that was a small prayer of thanks.
    description: "After three years the rains relent and the famine breaks — Europe buries its dead, counts the terrible cost, and weeps over bread."
    status: "first draft"
    sha256: "7edf71023f68770fe40c5e455bbc8141a8c563f9fb84bf09ca22cd43b84ce9cc"
  - number: "2073"
    volume: 4
    title: "The Razor of Ockham"
    date: "1318 CE"
    region: "Oxford"
    poem: |
      A thin friar at Oxford named William of Ockham
      taught his students to shave the world down:
      when two answers explain a thing, take the simpler.
      Don't multiply mysteries. Cut.
      The Church heard the blade and did not forgive him —
      a razor like that cuts through dogma too.
      I sat in his lectures, cold stone, hot ideas.
      He gave the world a tool sharper than any sword,
      and paid for it with exile.
      Truth is simple. Saying so is dangerous.
    description: "William of Ockham teaches that the simplest answer is usually right — a razor that cuts dogma too, and the Church will not forgive him."
    status: "first draft"
    sha256: "9708b871b5cbfd8ae95b67206cb1c7a6c7d183548fdfcb3745a4dc13eec0160f"
  - number: "2074"
    volume: 4
    title: "The White Battle"
    date: "1319 CE"
    region: "England"
    poem: |
      At Myton the Scots fell on an English host of priests and levies —
      the White Battle, they called it, for all the clerics in the ranks.
      I saw the rout from a hillside: the northern men scattering,
      their holy banners trampled in the mud of Yorkshire.
      War does not check your collar before it kills you.
      The north paid dearly that day, in coin and in clergy,
      and the border learned again what it always learns:
      nobody is safe when the raiders come down.
    description: "Scots raiders rout a host of Yorkshire priests and levies at Myton — the White Battle, where war shows it doesn't spare holy men."
    status: "first draft"
    sha256: "1bcbde9033db36e671a1ee0a9f0486f1be9715d462e1c9bb65529153824e84f8"
  - number: "2075"
    volume: 4
    title: "The Declaration of Arbroath"
    date: "1320 CE"
    region: "Scotland"
    poem: |
      They wrote to the Pope on parchment at Arbroath —
      the lords of Scotland, in Latin, plain as a punch:
      we will never submit to England. Not under this king. Not under any king.
      It is for freedom alone that we fight, they wrote,
      not for glory or riches.
      I watched the seals pressed into the wax, one by one.
      A letter. That was their weapon — a letter to Rome.
      And it worked. Words, aimed right, can hold off an army.
    description: "Scotland's lords write to the pope at Arbroath: they will never submit to England, under any king — a letter wielded like a weapon."
    status: "first draft"
    sha256: "8e7fff1bfe1a01de128458e4273da1e74fe02881d16273cf2d163ed45d849a8b"
  - number: "2076"
    volume: 4
    title: "The Tughlaqs Take Delhi"
    date: "1320 CE"
    region: "Delhi"
    poem: |
      Ghiyasuddin Tughlaq rode into Delhi and founded his dynasty
      over the richest sultanate in India —
      a soldier's hand on a jeweled throne.
      I walked the streets as the new banners went up,
      the old officials bowing low, the new ones counting the treasury.
      Dynasties change the way seasons do in Delhi:
      suddenly, completely, and everyone pretends it was always going to happen.
      The Tughlaqs would rule hard and strange and brilliant.
      This was the first stone of it.
    description: "Ghiyasuddin Tughlaq founds a new dynasty over Delhi, India's richest sultanate — another season turning in the city's long wheel of kings."
    status: "first draft"
    sha256: "e1f009948be58d1a09e119b3f13cd93a9d30a82680080209534ac5e25a921e31"
  - number: "2077"
    volume: 4
    title: "The Shepherds' Crusade"
    date: "1320 CE"
    region: "France"
    poem: |
      They started as shepherds with crosses, marching south for the Holy Land —
      poor boys with a holy dream and empty bellies.
      Then the dream curdled. They turned on the Jews in the southern towns,
      then on priests who wouldn't bless their plunder.
      I saw the columns pass: ragged, singing, dangerous.
      A crusade without a king is just a mob with a banner.
      France put them down in blood, the way France does.
      The crosses went into the mud. The hatred stayed.
    description: "Peasant crusaders march south, then turn their crosses on Jews and priests — a holy dream curdling into a mob, put down in blood."
    status: "first draft"
    sha256: "1441453f0956099a43446d789eeaf25c173b00348693f1b66ea3a478c42a2e40"
  - number: "2078"
    volume: 4
    title: "Dante Dies in Exile"
    date: "1321 CE"
    region: "Ravenna"
    poem: |
      He died in Ravenna, far from Florence, the sentence of fire still on his head —
      Dante, who never saw home again after that dusk at the gate.
      But he had finished the work: the whole journey,
      hell's circles, the mountain, the stars,
      written out of exile and grief and one unshakeable woman.
      I stood at his tomb. Florence wanted the body back.
      Ravenna kept it. Ravenna was right to keep it —
      the city that sheltered the poet owns the poet.
      Exile made him. Exile keeps him.
    description: "Dante dies in Ravenna, still exiled from Florence — his great vision of hell and heaven complete, the homeless poet at rest at last."
    status: "first draft"
    sha256: "a6c769b6488c93c4edb800e25eda1a164d435a192c857ad5df793f1e79f9252c"
  - number: "2079"
    volume: 4
    title: "The Last Direct Capetian"
    date: "1322 CE"
    region: "France"
    poem: |
      Charles IV took the French crown, and with him the old line ran out —
      three hundred years of Capetians, father to son, ending in a quiet room.
      No drama. No battle. Just no more sons.
      I watched the courtiers do the arithmetic on their fingers:
      who inherits now? Whose claim? Whose blood?
      A dynasty doesn't always fall to the sword.
      Sometimes it just... stops. Like a candle burned to the socket.
      And in the dark after, men start reaching for knives.
    description: "Charles IV takes the French crown and the direct Capetian line runs out — three hundred years ending not with a battle but with no more sons."
    status: "first draft"
    sha256: "5cafc4437e52694d8bb26453627e82de4c8b260edf4961ae3852454c4e50dc5d"
  - number: "2080"
    volume: 4
    title: "The Defender of Peace"
    date: "1324 CE"
    region: "Padua"
    poem: |
      Marsilius of Padua wrote it plain: the people should rule the city,
      not the pope. Power comes from the citizens, not from heaven's keys.
      I read the Defensor Pacis by lamplight in a Paduan lodging,
      and felt the floor tilt — this was the whole order of things, questioned,
      in clean sentences, by a university man.
      The Church called it heresy. The cities called it hope.
      Ideas like that don't die when you burn the book.
      They just find new paper.
    description: "Marsilius of Padua writes that the people, not the pope, should rule the city — the whole order of things questioned in clean sentences."
    status: "first draft"
    sha256: "31ecdf969723c11c6f5414b551da1c44148bf3c8b73eb285931dc5b014db9272"
  - number: "2081"
    volume: 4
    title: "Mansa Musa's Golden Pilgrimage"
    date: "1324 CE"
    region: "Mecca"
    poem: |
      He crossed the desert to Mecca with sixty thousand in his train
      and gold — so much gold that the price of gold fell in Cairo
      and stayed fallen for years.
      I was in Cairo when the caravan arrived: the dust, the drums,
      Musa handing out gold like a man scattering seed.
      The whole world learned his name that year.
      A king from beyond the desert, richer than the caliphs,
      on his knees in Mecca like the poorest pilgrim.
      Gold passes. That image never did.
    description: "Mansa Musa crosses the desert to Mecca with a caravan of gold so vast it crashes the price of gold in Cairo — Africa's king revealed to the world."
    status: "first draft"
    sha256: "63b885b9ca139933573e0dd80d0684494653c7902dbc6bef77c54cbca942dbd6"
  - number: "2082"
    volume: 4
    title: "Tenochtitlan Is Founded"
    date: "1325 CE"
    region: "Mexico"
    poem: |
      On an island in Lake Texcoco, the Mexica drove the first stakes
      and raised the first thatch — Tenochtitlan, the city that would rule an empire.
      They were wanderers then, latecomers, told the lake was all that was left for them.
      I stood on the shore and watched the causeways begin.
      A muddy island. An eagle on a cactus, if you believe the story.
      Nobody looking at that swamp would have guessed:
      this becomes the greatest city in the world that Europe never imagined.
    description: "The Mexica raise Tenochtitlan on an island in Lake Texcoco — a muddy beginning for the city that will rule an empire."
    status: "first draft"
    sha256: "aa58f69099a421b0adeebcea2be5f5ca6bcfa803093b4d6bc564288b2259f53d"
  - number: "2083"
    volume: 4
    title: "Ibn Battuta Sets Out"
    date: "1325 CE"
    region: "Morocco"
    poem: |
      A young scholar walked out of Tangier bound for Mecca,
      meaning to come straight home — and didn't come home for thirty years.
      I met him years later, older, thinner, full of roads:
      India, China, the steppe, the Swahili coast, Mali.
      Seventy-five thousand miles on foot, horse, and dhow.
      Ibn Battuta didn't discover the world. He just walked all of it
      and wrote it down so the rest of us could follow.
    description: "A young scholar leaves Tangier for Mecca and doesn't come home for thirty years — Ibn Battuta walks the whole known world and writes it down."
    status: "first draft"
    sha256: "eae610b00f537951eacf6754e7ffb626b86fa39fdb1066142c373b27aa5b504d"
  - number: "2084"
    volume: 4
    title: "The Queen Invades"
    date: "1326 CE"
    region: "England"
    poem: |
      Isabella of France landed with an army and a grievance —
      her husband Edward II had given his heart to favorites
      and his kingdom to ruin.
      I watched her march on London, and London opened its gates to her.
      The king ran. They caught him. The rest was a cell and a rumor
      too ugly to write down.
      A queen deposing her king: it had never been done so cleanly.
      She didn't just topple a throne. She showed every wife of every weak king
      exactly how it was done.
    description: "Isabella of France lands with an army and topples her husband Edward II — a queen deposing her king, cleanly and forever after imitated."
    status: "first draft"
    sha256: "93deede286a7cfcd74a4e7bdaf00fdd577d9b10d5aaa9699d9406a74f7c925aa"
  - number: "2085"
    volume: 4
    title: "Bursa Falls to the Ottomans"
    date: "1326 CE"
    region: "Anatolia"
    poem: |
      Orhan took Bursa after a long siege, and the Ottomans had their first true capital —
      a real city, with walls and markets and a future.
      I walked its streets as the new banners went up over the gates.
      This was the moment the frontier raiders became a state:
      not just horsemen taking forts, but rulers with a throne-city.
      Bursa would be their heart for a century.
      Every empire starts with one city it can call home.
      This was theirs.
    description: "Orhan takes Bursa, giving the Ottoman Turks their first true capital — frontier raiders becoming a state with a throne-city."
    status: "first draft"
    sha256: "8d7690961d419b2f1f91abb167250850e4f75e33324059169b3c05e77c12d519"
  - number: "2086"
    volume: 4
    title: "A Boy Becomes King"
    date: "1327 CE"
    region: "England"
    poem: |
      Edward III was crowned at fourteen — a boy king,
      with his mother Isabella and her lover Mortimer ruling through him.
      I saw the boy at Westminster, straight-backed, trying to look older.
      Everyone in the hall knew who really held the reins.
      But boys grow. And this one was watching, learning,
      counting the days.
      Three years. That's all the regents got.
      Then the boy struck, and England learned what kind of king he'd be.
    description: "Edward III is crowned at fourteen, with his mother and her lover ruling through him — a boy watching, learning, and counting the days."
    status: "first draft"
    sha256: "e20f3df7dfbb46d9f0df40c27e347769dc9ce9ac36a99028e9c57607d89e22e1"
  - number: "2087"
    volume: 4
    title: "Death of the Mystic"
    date: "1327 CE"
    region: "Germany"
    poem: |
      Meister Eckhart died — the preacher who told the crowds
      that God lives in the soul's deepest ground,
      closer than your own breath, past all the church's machinery.
      They tried him for heresy. He died before they could finish.
      I heard him preach once, in a packed church:
      plain German, no Latin tricks, God as near as your heartbeat.
      The Church buried the man. It couldn't bury the sentence.
      It's still out there, working.
    description: "Meister Eckhart dies — the mystic who preached that God lives in the soul's deepest ground, in plain German the Church couldn't silence."
    status: "first draft"
    sha256: "617bc5296f3b66e348947c00f3545916e889b1c09c0f90336301a3d820dbe158"
  - number: "2088"
    volume: 4
    title: "The Valois Take the Crown"
    date: "1328 CE"
    region: "France"
    poem: |
      Philip VI was crowned, first of the Valois —
      a new house, a cousin's line, because the old Capetians ran out of sons.
      I stood in the crowd at Reims and watched the anointing.
      New crown, new name, same throne.
      But across the Channel, Edward of England was doing his own arithmetic:
      his mother was a Capetian princess. Why not him?
      A succession settled in Reims. A war conceived in London.
      Nobody cheered louder than the future.
    description: "Philip VI is crowned, first of the Valois — a new house on the old throne, while across the Channel Edward III studies his own claim."
    status: "first draft"
    sha256: "11e4b942547183f08b7d0158dee61b9244a415fd9cef4189285152c70b60221b"
  - number: "2089"
    volume: 4
    title: "Moscow Rises Under Ivan the Moneybag"
    date: "1328 CE"
    region: "Russia"
    poem: |
      Ivan Kalita — Ivan the Moneybag — gathered the Mongols' tribute
      and skimmed, saved, and bought, quietly making Moscow Russia's center.
      I drank with merchants in his Moscow and heard how it worked:
      collect for the Khan, keep a little, lend a little, buy a village.
      No battles. Just money, patience, and the Khan's favor.
      While the other princes fought over scraps, Ivan bought the table.
      Empires have been built with less.
    description: "Ivan Kalita gathers the Mongols' tribute and quietly buys Moscow's rise — no battles, just money, patience, and the Khan's favor."
    status: "first draft"
    sha256: "cd7bb946761a767086205db17229e1d9d22954cb97c189da1493f6530baadff1"
  - number: "2090"
    volume: 4
    title: "Cassel: The Peasants Are Crushed"
    date: "1328 CE"
    region: "Flanders"
    poem: |
      At Cassel the French knights rode down the Flemish rebels
      and ended the peasants' rising in a morning of slaughter.
      Twenty-six years after Kortrijk's golden spurs,
      the wheel turned: the horsemen learned, the footmen bled.
      I walked that field too. Different field, same lesson —
      the poor can win a battle, but the rich own the war,
      until the day they don't.
      Flanders would remember both fields.
      So would France.
    description: "French knights slaughter the Flemish rebels at Cassel, ending the peasants' rising — Kortrijk's triumph answered in blood."
    status: "first draft"
    sha256: "658e6987c30a65d3ba741190ffc58c86cea923e1ed203f370862fff861b2b9f6"
  - number: "2091"
    volume: 4
    title: "The Bruce Dies"
    date: "1329 CE"
    region: "Scotland"
    poem: |
      Robert the Bruce died in his bed — the king who won Scotland at Bannockburn,
      gone quietly after a life of war and hiding and murder and glory.
      His last wish: his heart cut out, embalmed, and carried to the Holy Land
      by his knight Douglas, since his body couldn't make the crusade.
      I saw the casket leave. Douglas died fighting in Spain with it at his neck.
      The heart came home. The legend never left.
      Some men die. Some men get carried.
    description: "Robert the Bruce dies; his embalmed heart is carried toward the Holy Land by his knight — the king's last crusade, fought by his heart alone."
    status: "first draft"
    sha256: "cb282b8069314600de9bc9eef1f7d66ca0e3f78dbf76c062cf3b9a0837059f21"
  - number: "2092"
    volume: 4
    title: "Velbazhd: Serbia Breaks Bulgaria"
    date: "1330 CE"
    region: "Balkans"
    poem: |
      At Velbazhd the Serbs crushed the Bulgarians,
      and Serbia stood up as the Balkans' great power.
      I watched Stefan Dušan's host break the Bulgarian line —
      two Christian kingdoms bleeding each other
      while the Turks watched from across the strait and took notes.
      The Balkans' tragedy in one afternoon:
      the strong devouring the strong, and the real enemy waiting offshore.
      Serbia's noon. The shadow was already lengthening.
    description: "The Serbs crush the Bulgarians at Velbazhd and Serbia becomes the Balkans' great power — while across the strait, the Turks take notes."
    status: "first draft"
    sha256: "77bb36022158fc8a0efdc783cc2a459fc78e7a2428b1479e5bd9918b29abf402"
  - number: "2093"
    volume: 4
    title: "The Young King Strikes"
    date: "1330 CE"
    region: "England"
    poem: |
      At nineteen, Edward III struck — his men seized Mortimer in the queen's own chambers
      at Nottingham, dragged him out, and took him to the block.
      His mother fell to her knees begging. The boy didn't blink.
      I was at court that autumn and felt the whole room recalculate:
      the regency was over. The king was the king.
      Three years of watching, and one night of action.
      That is how you take back a throne — all at once, no rehearsal.
    description: "Edward III arrests his mother's lover Mortimer and seizes power — three years of watching ended in one night of action."
    status: "first draft"
    sha256: "4e815fbc639c51632976aad77ad67eb605a5dcbe80f27c8533bdf34ea2571542"
  - number: "2094"
    volume: 4
    title: "The Weavers Cross the Sea"
    date: "1331 CE"
    region: "England"
    poem: |
      Edward lured the Flemish weavers across the sea —
      master craftsmen with their looms and their secrets,
      planted in English towns to clothe a nation.
      I watched them set up their frames in the Cotswolds,
      strange accents, deft hands, the shuttle flying.
      England had the wool. Now it had the weavers.
      Centuries of wealth started here, in workshops smelling of lanolin,
      one immigrant loom at a time.
    description: "Edward III lures Flemish weavers to England, planting the looms that will clothe a nation — centuries of wealth, one immigrant shuttle at a time."
    status: "first draft"
    sha256: "10077f474836bfb81db3b1d4fdd92f8b5a44f2e6f520a26825b22ae6a540a177"
  - number: "2095"
    volume: 4
    title: "Amda Seyon's Holy Wars"
    date: "1331 CE"
    region: "Ethiopia"
    poem: |
      Down in the highlands, Amda Seyon — Ethiopia's Christian king —
      campaigned south with his armies, widening his mountain empire
      against Muslim sultanates and pagan tribes alike.
      I traveled with a caravan through the highlands after one campaign:
      burned villages, new churches, the cross planted further south.
      A holy war in Africa while Europe fought its own —
      the world is wider than the maps in Rome.
      His chronicles called it God's work. The burned villages had another word.
    description: "Ethiopia's Christian king Amda Seyon campaigns south, widening his mountain empire — holy war in Africa while Europe fights its own."
    status: "first draft"
    sha256: "ea704419a945bce79c2ba39f47bb0710b39fc99a6f653e1d7f629ea8195e2138"
  - number: "2096"
    volume: 4
    title: "Ibn Khaldun Is Born"
    date: "1332 CE"
    region: "Tunis"
    poem: |
      In Tunis a boy was born who would invent the science
      of how civilizations rise and fall —
      Ibn Khaldun, who watched dynasties crumble in North Africa and Spain
      and asked why. Why do empires harden, soften, rot?
      He'd write the answer in a book called the Muqaddima,
      centuries before anyone else thought to ask the question.
      I held the newborn's century in my hands and didn't know it.
      The historians' historian, born in an ordinary house.
    description: "In Tunis a boy is born who will invent the science of how civilizations rise and fall — Ibn Khaldun, the historians' historian."
    status: "first draft"
    sha256: "bcb73096803c0c7b770559b9097336e3d5318a98e0d44fd839261419d069bc75"
  - number: "2097"
    volume: 4
    title: "Kamakura Falls"
    date: "1333 CE"
    region: "Japan"
    poem: |
      The shogun's capital at Kamakura fell to the emperor's forces,
      and Go-Daigo took back the throne his family had lost a century before.
      I walked the smoking streets after the siege —
      the Hōjō regents dead by their own hands, the old order in ashes.
      The emperor ruled again. For three years.
      Three years, and then the warriors took it all back.
      Restorations are like that: bright, brief, and doomed
      when the swords disagree.
    description: "Kamakura falls and Emperor Go-Daigo briefly retakes the throne — a bright, brief restoration, doomed when the swords disagree."
    status: "first draft"
    sha256: "3f781f3fa6fe42fc0f4504b5fc1ece8dcd1dd0d14d269602549dfe8eef253ce7"
  - number: "2098"
    volume: 4
    title: "Halidon Hill"
    date: "1333 CE"
    region: "Scotland"
    poem: |
      At Halidon Hill the English longbows did their terrible new work —
      Scots charging uphill into a storm of arrows,
      mown down in ranks before they ever reached the line.
      I stood on that hill and watched chivalry die by archery:
      the flower of Scotland falling like cut grain,
      the border bleeding again.
      Bannockburn was nineteen years gone.
      The English had learned. The Scots paid the tuition.
    description: "English longbows mow down the Scots at Halidon Hill — Bannockburn's lesson reversed, and the border bleeds again."
    status: "first draft"
    sha256: "9282dbeb6d476721eb553d42695d1eeed1625fe584e97dd743f314bdd177bb5b"
  - number: "2099"
    volume: 4
    title: "The Mongol Realm Crumbles"
    date: "1335 CE"
    region: "Persia"
    poem: |
      The last strong Ilkhan died, and Persia's Mongol empire
      shattered into warring pieces — amirs, claimants, little kings,
      every province for itself.
      I rode through Tabriz that year and felt the center go out of things:
      no Khan, no law, just swords and negotiations.
      A hundred years of Mongol Persia, dissolving like salt in rain.
      The horsemen had conquered a civilization.
      Then the civilization quietly conquered them —
      and outlived them.
    description: "The last strong Ilkhan dies and Persia's Mongol empire shatters — a hundred years of conquest dissolving like salt in rain."
    status: "first draft"
    sha256: "03f73db01276b7e565af92b1a160840358e3fdb90be771528826132a555c4a23"
  - number: "2100"
    volume: 4
    title: "The Ashikaga Take Kyoto"
    date: "1336 CE"
    region: "Japan"
    poem: |
      Ashikaga Takauji seized Kyoto and founded the shogunate
      that would rule Japan for two hundred years —
      the emperor's brief restoration crushed by the very general
      who had made it possible.
      I watched his banners go up over the capital.
      Betrayal? Politics? In Japan they called it the way of the warrior.
      Two centuries of Ashikaga rule started here,
      in a coup against the throne they'd sworn to restore.
    description: "Ashikaga Takauji seizes Kyoto, crushing the emperor's restoration and founding the shogunate that will rule Japan for two centuries."
    status: "first draft"
    sha256: "94fdde2630434b8d3cec32a30cc1a0434b6861bad2d4c02a610bb1907ce84b54"
  - number: "2101"
    volume: 4
    title: "Timur Is Born"
    date: "1336 CE"
    region: "Transoxiana"
    poem: |
      Near Samarkand a boy was born with a lame leg and a boundless hunger —
      Timur, who would make the world tremble from Delhi to Damascus.
      I saw the village. Nothing in it promised anything.
      A crippled shepherd's son in the back country of a broken Mongol realm.
      But history loves an unlikely vessel.
      The lameness kept him off the Khan's throne —
      so he built a bigger one beside it, out of skulls.
    description: "Near Samarkand a lame boy is born who will make the world tremble — Timur, history's most unlikely vessel, already walking toward his destiny."
    status: "first draft"
    sha256: "b337a0d2839ef24e13ce672fa4f48d6fbc232194860ed0cc4bb2d103da8c2cce"
  - number: "2102"
    volume: 4
    title: "Gajah Mada Swears His Oath"
    date: "1336 CE"
    region: "Java"
    poem: |
      Gajah Mada, minister of Majapahit, stood before his king and swore:
      no spiced food would touch his lips until the whole archipelago
      bowed to Majapahit — every island, every harbor.
      I heard the oath repeated in the markets of Java,
      men shaking their heads at the madness of it.
      Then he did it. Island by island, year by year.
      They called it the Palapa Oath.
      A man can conquer an ocean on an empty stomach,
      if the hunger is for something bigger than food.
    description: "Gajah Mada vows to taste no spiced food until the whole archipelago bows to Majapahit — the Palapa Oath, an empire built on an empty stomach."
    status: "first draft"
    sha256: "8912248ad0fbaa2418d467bc6f838d077abcd0b57d587fc1ddedc3dffea77eeb"
  - number: "2103"
    volume: 4
    title: "Vijayanagara Is Founded"
    date: "1336 CE"
    region: "India"
    poem: |
      Two brothers, Harihara and Bukka, raised a new Hindu capital
      on the Tungabhadra — Vijayanagara, the city of victory —
      defying the sultans of Delhi who thought the south was theirs.
      I stood on the rocky hills above the river
      and watched the first temples rise from the boulders.
      A refuge, a fortress, a statement:
      the south would not bow.
      It would stand for two hundred years, glittering,
      until the day it fell — but that day was far off,
      and the stones were just being laid.
    description: "Two brothers raise Vijayanagara, a new Hindu capital defying Delhi's sultans — the city of victory rising from river boulders."
    status: "first draft"
    sha256: "66ba1ad6c34339ad4f5b9e3d11599b8117029a1f31b25b9949ad5b9fe473ee2b"
  - number: "2104"
    volume: 4
    title: "The Hundred Years' War Begins"
    date: "1337 CE"
    region: "France"
    poem: |
      Philip seized Aquitaine. Edward claimed the French throne.
      And the long war started — the one that would grind for a hundred years,
      fathers to sons to grandsons, over a crown and a coastline.
      I was in Paris when the news came, and nobody understood
      what they were beginning. Nobody ever does.
      They thought it would be a campaign. A season.
      It was a century.
      The Hundred Years' War: the longest argument in Europe's history,
      and it started with paperwork.
    description: "Philip VI seizes Aquitaine, Edward III claims the French throne — a century of war begins, and nobody understands what they've started."
    status: "first draft"
    sha256: "c5f07d9a897e8f368e909c90b30e96d7bb11920b561e664b74f828831f4f7de9"
  - number: "2105"
    volume: 4
    title: "Edward III Marches Into France"
    date: "1339 CE"
    region: "France"
    poem: |
      Edward burned his way through northern France —
      villages, barns, mills, everything that could feed an army,
      daring Philip to come out and fight.
      I walked behind that chevauchée and saw what "daring" costs:
      smoke on every horizon, farmers hiding in the woods,
      a whole countryside taught to hate the English for a hundred years.
      Philip wouldn't fight. He just watched his kingdom burn.
      Sometimes the bravest thing a king can do is nothing.
      Sometimes it's the cruelest.
    description: "Edward III burns his way through northern France, daring Philip to fight — smoke on every horizon, and a countryside taught to hate for a century."
    status: "first draft"
    sha256: "12dfebefdbef896fc162803f9d85794d987ad48184213a0ba17852ed1b4ac3f2"
  - number: "2106"
    volume: 4
    title: "Sluys: England Rules the Waves"
    date: "1340 CE"
    region: "Flanders"
    poem: |
      At Sluys the English ships closed on the French fleet
      and destroyed it — masts, hulls, twenty thousand men,
      the sea off Flanders red and wreck-strewn.
      I sailed those waters a week later and the wreckage was still washing up.
      England ruled the Channel now. No French army would ever cross it
      while Edward lived.
      Command of the sea: it sounds like a phrase from a chronicle.
      It's actually just this — the other fellow's ships, on the bottom.
    description: "English ships destroy the French fleet at Sluys — twenty thousand men and the sea itself, and England rules the Channel."
    status: "first draft"
    sha256: "57a104d3b2e152477ab9314cd82f315558a4e0a3e211621b76f666fc4502b56f"
  - number: "2107"
    volume: 4
    title: "Petrarch Crowned With Laurel"
    date: "1341 CE"
    region: "Rome"
    poem: |
      On the Capitol at Rome, they crowned Francesco Petrarch with laurel —
      poet laureate, the first in a thousand years, since the ancients.
      I was in the crowd on that April day, and the Romans wept:
      their city, ruined and half-empty, crowning a poet like an emperor.
      It wasn't about Petrarch. It was about Rome remembering itself —
      the old glory, the old words, reaching up out of the rubble.
      The Renaissance didn't start with a painting.
      It started with a wreath.
    description: "Petrarch is crowned poet laureate on the Capitol, Rome's first in a thousand years — the Renaissance beginning with a laurel wreath, not a painting."
    status: "first draft"
    sha256: "810099c6b9ed8346e5cc3433505b9c0d61cba005561489662618336adb22be3b"
  - number: "2108"
    volume: 4
    title: "Sailors Reach the Canaries"
    date: "1341 CE"
    region: "Atlantic"
    poem: |
      Portuguese and Genoese sailors raided the Canary Islands —
      Europe's first reach into the open Atlantic, past the edge of the known map.
      I talked to one of those sailors in Lisbon, an old man by then,
      and he described the islands rising out of nowhere,
      the strange people, the birds, the feeling of sailing off the world's edge
      and finding more world.
      They went for plunder. They came back with a horizon.
      That horizon would swallow everything.
    description: "Portuguese and Genoese sailors raid the Canaries — Europe reaches past the map's edge for plunder and comes back with a horizon."
    status: "first draft"
    sha256: "99f2f4607f080b1599891d44e35576863fd13f6990418b8b2da5bc80ebfe2046"
  - number: "2109"
    volume: 4
    title: "The Magnificent Pope"
    date: "1342 CE"
    region: "Avignon"
    poem: |
      Clement VI took the papal throne and lived in Avignon
      like a king among kings — feasts, jewels, mistresses, the works.
      The fisherman's successor, dripping with gold.
      I saw his court once: it glittered harder than any royal court in Europe.
      And yet — when the plague came, this same pope
      would protect the Jews of Avignon with bulls and guards
      while the rest of Europe burned them.
      Men are complicated. Even popes. Especially popes.
    description: "Clement VI lives in Avignon like a king among kings — glittering, worldly, and yet the pope who will shield the Jews when the plague comes."
    status: "first draft"
    sha256: "ac1794c63ef5da949014779bc4d9b761d444de402fe5e8f15ecdbc06e4d23004"
  - number: "2110"
    volume: 4
    title: "The Great Banks Fail"
    date: "1345 CE"
    region: "Florence"
    poem: |
      Edward III never paid his debts, and the Bardi and Peruzzi —
      Florence's mightiest banks, the lenders of kings — went down.
      I was in Florence when the doors closed: the panic,
      the merchants ruined overnight, the whole city's credit in ashes.
      Kings borrow. Bankers lend. Kings don't pay.
      That is the oldest story in finance, and Florence learned it
      the way everyone learns it — by losing everything.
      The war went on. The money didn't.
    description: "Edward III's unpaid debts sink the Bardi and Peruzzi, Florence's mightiest banks — kings borrow, bankers lend, kings don't pay."
    status: "first draft"
    sha256: "f4a9c111f5a722750135a99a963be1dd0c1085e5918ec0e220cf50c164609ae9"
  - number: "2111"
    volume: 4
    title: "Crécy: The Longbow's Day"
    date: "1346 CE"
    region: "France"
    poem: |
      At Crécy the English yeomen stood in the mud with their longbows
      and shredded the flower of French chivalry —
      charge after charge, prince after prince,
      cut down by clothyard arrows loosed by common men.
      I walked that field at dusk. The French dead lay in windrows,
      their armor worth more than the villages they'd ridden through.
      The age of the knight ended at Crécy.
      It just took the knights another hundred years to notice.
    description: "English yeomen with longbows shred French chivalry at Crécy — the age of the knight ends, though the knights take a century to notice."
    status: "first draft"
    sha256: "bd72182151637d7a58aff122cc1c7493a383e317e3247f66f27ba113d10ec9cd"
  - number: "2112"
    volume: 4
    title: "Dušan Crowned Emperor"
    date: "1346 CE"
    region: "Balkans"
    poem: |
      At Skopje they crowned Stefan Dušan emperor of Serbs and Greeks —
      the Balkans' great power at its noon, law codes, churches, glory.
      I watched the coronation procession wind through the streets,
      gold and incense, the new emperor shining.
      Serbia's empire. It would last nine years past his death.
      That's the thing about noons: they're beautiful,
      and they're always followed by afternoon.
      Dušan didn't know. Nobody at a coronation ever knows.
    description: "Stefan Dušan is crowned emperor of Serbs and Greeks at Skopje — Serbia's beautiful noon, nine years from its afternoon."
    status: "first draft"
    sha256: "333f2b82b303c736d7791d0eaeddd02047f623d9c1ca816cd967653286348486"
  - number: "2113"
    volume: 4
    title: "Cola di Rienzo Seizes Rome"
    date: "1347 CE"
    region: "Rome"
    poem: |
      Cola di Rienzo — a young notary, all fire and old books —
      seized Rome and proclaimed the republic reborn: the tribune, the ancient glory,
      the people ruling as in the days of the Caesars.
      I was there for his first speech on the Capitol. The crowd went mad with hope.
      For a season, Rome dreamed again.
      Then the nobles came back, and the dream went the way of dreams.
      But for one season — one bright season — the republic lived.
      That's more than most dreams get.
    description: "The young notary Cola di Rienzo seizes Rome and proclaims the republic reborn — one bright season of the ancient dream, then the nobles return."
    status: "first draft"
    sha256: "c9eba9ab9fd26353cae88f72ccbb4550504c63891ec0516636a8797f87351dfe"
  - number: "2114"
    volume: 4
    title: "The Plague Ships Dock at Messina"
    date: "1347 CE"
    region: "Sicily"
    poem: |
      The galleys limped into Messina harbor from the east,
      their crews dying at the oars, black swellings in their groins —
      and the pestilence came ashore with them.
      I stood on the docks and watched them tie up.
      Nobody knew what was in those holds.
      Nobody could have stopped it if they had.
      The Black Death had reached Europe.
      Everything after this — every empty village, every mass grave,
      every bell tolling for a third of the world — started here,
      with ropes thrown to a dying ship.
    description: "Plague galleys limp into Messina and the pestilence comes ashore — the Black Death reaches Europe, and a third of the world begins to die."
    status: "first draft"
    sha256: "d956ba103575516838dd4aff86a7c1db6ddfa7e86be27a42b6a698ada586f830"
  - number: "2115"
    volume: 4
    title: "Boccaccio Begins the Decameron"
    date: "1348 CE"
    region: "Florence"
    poem: |
      Fleeing plague-ravaged Florence, Boccaccio started his hundred tales —
      ten young people in a country villa, telling stories of love and wit
      while the city died below them.
      I read the first pages as he wrote them, in a borrowed room:
      laughter as defiance, stories as a wall against the dark.
      The plague took his father, his stepmother, half his city.
      He answered with a hundred tales.
      That is the human reply to the end of the world:
      tell a story. Tell another. Keep telling them until morning.
    description: "Fleeing plague-ravaged Florence, Boccaccio begins his hundred tales — laughter as defiance, stories as a wall against the dark."
    status: "first draft"
    sha256: "ebfc76524ce29cfffa5bdf18cfd8493bfb7f3cebe72041849853306550a24598"
  - number: "2116"
    volume: 4
    title: "A University for the Empire"
    date: "1348 CE"
    region: "Prague"
    poem: |
      In the plague year, Charles IV founded a university at Prague —
      the first in central Europe, scholars and masters,
      a whole studium rising while the world was burying its dead.
      I walked the building site that autumn: masons, timber, plans,
      men arguing about Aristotle over the sound of hammers.
      Plant a university in a plague year.
      That is either madness or faith, and I have never been able
      to tell the two apart.
      Prague's university still stands. The plague passed.
    description: "In the plague year Charles IV founds Prague's university, the first in central Europe — planting learning while the world buries its dead."
    status: "first draft"
    sha256: "59ccb94946272c19791291ca31e6f2b0c182b6c93c8099d58408cab77d203ebf"
  - number: "2117"
    volume: 4
    title: "Ayutthaya Rises"
    date: "1350 CE"
    region: "Siam"
    poem: |
      King Ramathibodi founded Ayutthaya on its island in the river —
      the Siamese capital that would shine for four centuries,
      temples and palaces rising from the floodplain.
      I sailed upriver to see it new: the gold leaf, the spires,
      the markets already humming.
      Four hundred years. That is a long time for a city to shine.
      Most capitals are lucky to get one good century.
      Ayutthaya got four — and the river still remembers.
    description: "King Ramathibodi founds Ayutthaya, the Siamese capital that will shine for four centuries — gold leaf and spires rising from the floodplain."
    status: "first draft"
    sha256: "fbe1489ea4c150a4ce3b699143896dc557f8b10a35ee051bffccd44c426107ce"
  - number: "2118"
    volume: 4
    title: "The Inca Leave Their Valley"
    date: "1350 CE"
    region: "Andes"
    poem: |
      Cápac Yupanqui's warriors pushed beyond the valley of Cuzco —
      the Inca leaving home, the long climb to empire beginning.
      I traveled those mountain trails and saw the first conquests:
      small chiefdoms bowing, roads being cut through the clouds.
      Nobody in Cuzco called it an empire yet.
      It was just the next valley. Then the next.
      Empires are built one "next valley" at a time,
      until one day the map runs out of valleys.
    description: "Inca warriors push beyond Cuzco under Cápac Yupanqui — the long climb to empire beginning, one next valley at a time."
    status: "first draft"
    sha256: "f363fac824f792654e92ef35554cf9ec9a4b3350ed0501deb59079f51fa26822"
  - number: "2119"
    volume: 4
    title: "The Statute of Labourers"
    date: "1351 CE"
    region: "England"
    poem: |
      With half the workers dead of plague, Parliament tried to freeze wages by law —
      no man to ask more than he got before the pestilence,
      on pain of prison.
      I watched the justices try to enforce it in the villages.
      The laborers laughed. The harvest couldn't wait for Parliament's prices.
      You cannot legislate the value of a man's arms
      when there aren't enough arms left to bring the wheat in.
      The statute failed. The workers won.
      The plague had done what no revolt ever could:
      made the poor expensive.
    description: "Parliament tries to freeze wages after the plague — and fails, because you can't legislate the value of arms when half the workers are dead."
    status: "first draft"
    sha256: "fc3c9c826e0c21e701502eb73117b2b7ced2f9c8fddc4bc5b4fd90f3b30da827"
  - number: "2120"
    volume: 4
    title: "The Red Turbans Rise"
    date: "1351 CE"
    region: "China"
    poem: |
      Starving peasants tied red cloths round their heads
      and rose against the Mongol Yuan — the Red Turbans,
      a famine turned into an army.
      I saw them march through the Yellow River country:
      ragged, furious, numberless, the dynasty's granaries their target.
      The Yuan had ruled China for eighty years.
      It took starving farmers with red headbands to end it.
      Hunger is the oldest revolutionary,
      and it never loses its temper — it just loses its patience.
    description: "Starving peasants tie red cloths round their heads and rise against the Mongol Yuan — hunger, the oldest revolutionary, losing its patience."
    status: "first draft"
    sha256: "222d744886906c2eebe3827d0613281adf9c3d2da9cc165c6a54c166ed58694f"
  - number: "2121"
    volume: 4
    title: "A King Defies the Mongols"
    date: "1352 CE"
    region: "Korea"
    poem: |
      King Gongmin of Goryeo moved to break the Mongols' grip on his court —
      purging the pro-Yuan faction, reclaiming Korean land,
      a small king standing up to the greatest empire on earth.
      I was in Kaesong when the orders went out.
      The courtiers were terrified. The king was not.
      Eighty years of Mongol domination, and one man decided:
      no more.
      Small kingdoms have long memories and short tempers.
      Korea was about to be Korea again.
    description: "King Gongmin moves to break the Mongols' grip on Korea — a small king with a long memory standing up to the greatest empire on earth."
    status: "first draft"
    sha256: "69ef431f75c8e6f7f3a7a158bbe96f21397fa09b049450ccc4ac35e8219e5d7b"
  - number: "2122"
    volume: 4
    title: "The Turks Cross Into Europe"
    date: "1354 CE"
    region: "Thrace"
    poem: |
      An earthquake toppled the walls of Gallipoli,
      and the Ottomans walked in — their first foothold in Europe,
      handed to them by the shaking earth.
      I stood in the rubble of those walls and felt the hinge of history move:
      one tremor, and the Turks were across the strait,
      and they would never leave.
      Constantinople was still a hundred years from falling.
      But the crack that started with Osman's border forts
      had just crossed the water.
    description: "An earthquake topples Gallipoli's walls and the Ottomans walk in — their first foothold in Europe, handed to them by the shaking earth."
    status: "first draft"
    sha256: "1ff5f20c37eb1f2a38ed35b066083feea7d395bca275431bd3974b14f6b5a45e"
  - number: "2123"
    volume: 4
    title: "The Black Prince's Burning March"
    date: "1355 CE"
    region: "France"
    poem: |
      Edward the Black Prince burned a swath through southern France —
      town by town, farm by farm, the great chevauchée,
      leaving a black road from Bordeaux to the Mediterranean.
      I rode through Languedoc after he'd passed:
      the smell of it still in the air, the mills gutted, the vines trampled.
      This was war as economics — burn the tax base,
      and the king of France can't pay his armies.
      It worked. It always works.
      That's the terrible part.
    description: "The Black Prince burns a black road across southern France — war as economics, and the terrible part is that it works."
    status: "first draft"
    sha256: "7122552e1e9647cf4d023d643f348083e62a6d5344936a59c90d52a740d0a500"
  - number: "2124"
    volume: 4
    title: "Poitiers: A King Captured"
    date: "1356 CE"
    region: "France"
    poem: |
      At Poitiers the Black Prince's outnumbered English
      captured John II of France himself — the king, taken on the field,
      led away to London to wait for a ransom that would beggar his kingdom.
      I saw the French army dissolve that September day:
      the flower of the nobility dead or fled, the oriflamme in the mud.
      France reeled. Paris rioted. The dauphin hid.
      A kingdom without its king is a body without its head —
      and England held the head.
    description: "The Black Prince captures John II of France at Poitiers — a kingdom without its king, and England holding the head."
    status: "first draft"
    sha256: "49886893b1eb34cd039d2ce739f8709899c8d7f139e5e7d5ffd8370f7614d034"
  - number: "2125"
    volume: 4
    title: "The Golden Bull"
    date: "1356 CE"
    region: "Germany"
    poem: |
      Charles IV issued the Golden Bull, fixing how emperors are chosen —
      seven electors, sealed in gold, the law of the empire for centuries.
      I was in Nuremberg when it was proclaimed.
      No more disputed elections, no more civil wars over the crown —
      at least, that was the idea.
      It worked, after a fashion. Germany got its rules.
      Whether rules make an empire is another question,
      one the Germans would spend four hundred years answering.
    description: "Charles IV's Golden Bull fixes how emperors are chosen — seven electors sealed in gold, and Germany's rules written for centuries."
    status: "first draft"
    sha256: "96eb7f941eb80101f5b71130e8c12a8e75d1521cea6d6e3ae16cd0f757bc1afd"
  - number: "2126"
    volume: 4
    title: "Zhu Yuanzhang Takes Nanjing"
    date: "1356 CE"
    region: "China"
    poem: |
      The peasant-rebel Zhu Yuanzhang — beggar, monk, Red Turban —
      seized Nanjing, his stepping-stone to the throne.
      I walked that city as his banners went up:
      a starving boy from the famine years, now master of the great southern capital.
      Twelve years from beggar's bowl to emperor's seal.
      The Yuan was finished; it just didn't know it yet.
      When the poor boy takes the capital, the dynasty is already a ghost.
    description: "The peasant-rebel Zhu Yuanzhang seizes Nanjing — twelve years from beggar's bowl to emperor's seal, and the Yuan already a ghost."
    status: "first draft"
    sha256: "fd3552495ce2a6a50ed0da40a973761a696c8bf33db41551da21d2949df521ed"
  - number: "2127"
    volume: 4
    title: "The Hansa Finds Its Voice"
    date: "1356 CE"
    region: "Lübeck"
    poem: |
      The Baltic merchant towns met at Lübeck and swore to sail and trade together —
      the Hansa finding its voice, a league of cities with no king,
      only contracts and convoys.
      I drank in a Lübeck guildhall that winter and heard the talk:
      one fleet, one law of the sea, one fist against pirates and princes.
      Merchants had discovered what kings always knew —
      there is strength in numbers —
      and they'd done it without a single crown.
    description: "The Baltic merchant towns meet at Lübeck and swear to sail and trade together — the Hansa, a league of cities with no king, only contracts."
    status: "first draft"
    sha256: "78675f347456be4e2c5d5103157d250bc613848e47b517a47a5eca31cf815ccb"
  - number: "2128"
    volume: 4
    title: "The Jacquerie: The Peasants Rise"
    date: "1358 CE"
    region: "France"
    poem: |
      The peasants rose — the Jacquerie — burning castles across northern France,
      killing nobles, crying for bread and an end to the war-taxes.
      For weeks the countryside belonged to them.
      Then the nobles came back with steel, and drowned the rising in blood —
      villages burned in revenge, thousands hanged.
      I walked those roads after. The silence was the worst of it.
      The poor had spoken. The rich had answered.
      France would hear that conversation again, four hundred years on.
    description: "French peasants rise in the Jacquerie, burn castles, and are drowned in blood — the poor speak, the rich answer, and France will hear it again."
    status: "first draft"
    sha256: "2435be42f3b9603b225369554219e6e73cb9875b82df2a196dab0a1d27a7aa12"
  - number: "2129"
    volume: 4
    title: "The Treaty of Brétigny"
    date: "1360 CE"
    region: "France"
    poem: |
      At Brétigny they signed the truce — Edward keeps his conquests,
      John's ransom set at a king's weight in gold, the war pausing to breathe.
      I was in the fields outside Chartres where they met:
      two exhausted kingdoms, signing a peace neither believed.
      Nine years of quiet. Then it started again, as everyone knew it would.
      Treaties don't end wars. Exhaustion pauses them.
      This one bought France time — and France would use it well.
    description: "England and France sign the Treaty of Brétigny — a truce neither believes, nine years of quiet bought by exhaustion."
    status: "first draft"
    sha256: "5118ee22d42caf6fae3a51345029ef739eecd1f23f83b57e45681900d51536c2"
  - number: "2130"
    volume: 4
    title: "English Returns to Parliament"
    date: "1362 CE"
    region: "England"
    poem: |
      Parliament ordered English — not French — spoken in its debates and laws.
      Three hundred years after Hastings, the conquerors' tongue
      gave way to the people's.
      I sat in the gallery and heard it: plain English, in the king's own parliament,
      the language of plowmen arguing the law of the land.
      A quiet revolution, no blood, no banners —
      just words changing their master.
      England would never speak French in power again.
    description: "Parliament orders English, not French, spoken in debates and laws — three hundred years after Hastings, the people's tongue takes power."
    status: "first draft"
    sha256: "4426eac7c5c8580cb972f9c299bd034608281bed96d19628dfd15e8fab8dc3fd"
  - number: "2131"
    volume: 4
    title: "Adrianople Falls to the Ottomans"
    date: "1362 CE"
    region: "Thrace"
    poem: |
      The Ottomans took Adrianople — the great city of Thrace,
      second city of the shrinking Byzantine world —
      and planted their flag deep in Europe.
      I walked its walls after the surrender: the mosques going up,
      the Turkish administration settling in like it had always been there.
      Constantinople was now an island in a Turkish sea.
      The empire that had stood for a thousand years
      was down to a city and a prayer.
      The prayer would last ninety-one more years.
    description: "The Ottomans take Adrianople, planting their flag deep in Europe — Constantinople now an island in a Turkish sea, down to a city and a prayer."
    status: "first draft"
    sha256: "8a7e657b859c09ac070326641c119a938f902c801793f3feb24dc484abe28f31"
  - number: "2132"
    volume: 4
    title: "Lake Poyang: The Great River Battle"
    date: "1363 CE"
    region: "China"
    poem: |
      On Lake Poyang two rebel fleets clashed —
      Zhu Yuanzhang against Chen Youliang, hundreds of war-junks,
      tower ships, fire ships, one of the greatest naval battles in history.
      I watched from the shore for three days: the smoke,
      the burning towers toppling into the water, the lake itself on fire.
      Zhu won. Chen died.
      One lake, one battle, and the Ming dynasty was decided
      before it had a name.
    description: "Two rebel fleets clash on Lake Poyang in one of history's greatest naval battles — the Ming dynasty decided on a burning lake before it had a name."
    status: "first draft"
    sha256: "079c153a813bc5220341519c5b63e0d0c74685f04be11d53b0eccf2a1301ac0a"
  - number: "2133"
    volume: 4
    title: "Charles the Wise Takes the Throne"
    date: "1364 CE"
    region: "France"
    poem: |
      Charles V was crowned — Charles the Wise, the canny king
      who would win France back without great battles:
      no more Crécys, no more Poitiers, just patience, money, and du Guesclin.
      I saw him at Reims: slight, sickly, bookish —
      nothing like a warrior king.
      The court underestimated him. Everyone did.
      Then, castle by castle, tax by tax, year by year,
      he took his kingdom back.
      The wise don't need to win battles. They need to outlast them.
    description: "Charles V is crowned — the canny king who will win France back without great battles, outlasting where others bled."
    status: "first draft"
    sha256: "0bdb77d2165c57c3ceed5940881e74360b943d881a36b405fb1bdfe15a2cd448"
  - number: "2134"
    volume: 4
    title: "A King of Cyprus Sacks Alexandria"
    date: "1365 CE"
    region: "Egypt"
    poem: |
      Peter I of Cyprus stormed Alexandria —
      a last flash of crusading fire, knights bursting through the gates
      of the great Muslim port, looting for days.
      I walked the sacked streets after: the warehouses emptied,
      the harbor full of Christian sails, the Mamluks regrouping inland.
      It was magnificent. It was pointless.
      They couldn't hold it. They sailed home with the plunder
      and the dream died on the docks.
      The crusades ended not with a trumpet but with a raid —
      brave, brilliant, and already history.
    description: "Peter I of Cyprus storms Alexandria in a last flash of crusading fire — magnificent, pointless, and already history by the time the sails go home."
    status: "first draft"
    sha256: "143481557566f9da9220200208b81e65a252ce1e5e06bc6d3747340f10eaa732"
  - number: "2135"
    volume: 4
    title: "The Bastard Invades"
    date: "1366 CE"
    region: "Castile"
    poem: |
      Henry of Trastámara — the Bastard — invaded Castile
      to tear the crown from his half-brother Pedro the Cruel,
      with French knights at his back and a grudge in his heart.
      I rode with the columns through the passes:
      brother against brother, the whole kingdom choosing sides.
      Pedro fled. Henry took the throne.
      Then Pedro came back with the Black Prince, and Henry fled.
      Then Henry came back again.
      Crowns in Castile changed hands like dice that decade.
    description: "Henry of Trastámara invades Castile to tear the crown from his half-brother — brother against brother, and the throne changing hands like dice."
    status: "first draft"
    sha256: "f8b8e040b373649a27db3710e69d2281383d25c5efada61245cda7b1758f1830"
  - number: "2136"
    volume: 4
    title: "The Ming Dynasty Is Born"
    date: "1368 CE"
    region: "China"
    poem: |
      Zhu Yuanzhang drove the last Mongols out and proclaimed the Ming —
      China for the Chinese again, after eighty years of the Yuan.
      The Hongwu Emperor. The beggar boy on the dragon throne.
      I was in Nanjing for the proclamation: the drums,
      the new calendar, the whole empire turning its face home.
      A peasant's son had taken the greatest throne on earth.
      If that doesn't prove the world can turn over,
      nothing does.
    description: "Zhu Yuanzhang drives out the Mongols and proclaims the Ming — the beggar boy on the dragon throne, China for the Chinese again."
    status: "first draft"
    sha256: "5ccb126901910504814b527622fe3e217ea039badd7aec6b772fabe851550052"
  - number: "2137"
    volume: 4
    title: "Du Guesclin's Slow Reconquest"
    date: "1369 CE"
    region: "France"
    poem: |
      Bertrand du Guesclin took France back castle by castle —
      no great battles, no glory charges, just sieges, ambushes, patience,
      avoiding open battle the way a wise man avoids a drunk.
      I followed his campaigns through the west:
      one fortress starved, one garrison bought, one town opened its gates.
      The English called him a coward. The French called him constable.
      Ten years of slow work, and Aquitaine was French again.
      Glory is loud. Winning is quiet.
    description: "Bertrand du Guesclin takes France back castle by castle, avoiding open battle — ten years of slow, quiet winning while glory looks elsewhere."
    status: "first draft"
    sha256: "971895b65dc802e48ad76cf50c77b6db2d87728e82a039f624a9712e1fce732d"
  - number: "2138"
    volume: 4
    title: "Timur Takes Samarkand"
    date: "1370 CE"
    region: "Transoxiana"
    poem: |
      Timur seized Samarkand and proclaimed himself ruler —
      the lame boy from the back country, now master of Transoxiana,
      beginning the long conquest that would stack skulls from Delhi to Damascus.
      I saw him enter the city: not tall, not handsome,
      but with eyes that made strong men look away.
      He couldn't claim the Khan's title — the lameness, the blood —
      so he ruled as amir, and made the title irrelevant.
      The world was about to learn his name.
      It would learn it in ruins.
    description: "Timur seizes Samarkand and proclaims himself ruler — the lame boy beginning the long conquest the world will learn in ruins."
    status: "first draft"
    sha256: "2096685305152efb9569423bfb5bf3531a96ef9f48252ea14fd4b34031317e45"
  - number: "2139"
    volume: 4
    title: "The House of Stuart Begins"
    date: "1371 CE"
    region: "Scotland"
    poem: |
      Robert II took the throne — the first Stuart king of Scots,
      the Bruce's grandson, a steward's son made monarch.
      I was at Scone for the crowning, a quiet affair after Bruce's thunder.
      Nobody guessed what that name would become:
      three hundred years of Stuarts, two kingdoms, a civil war,
      a beheaded king, an exiled line.
      Dynasties start like rivers start — a small spring in the hills,
      no hint of the ocean waiting downstream.
    description: "Robert II takes the throne, first Stuart king of Scots — a small spring in the hills, no hint of the ocean of history waiting downstream."
    status: "first draft"
    sha256: "a8d4ac2e69e51d711faadda6e7fbc0ab5ba4b5d956b899c998c002c85ce4df9c"
  - number: "2140"
    volume: 4
    title: "La Rochelle: France Takes Back the Sea"
    date: "1372 CE"
    region: "Atlantic"
    poem: |
      Off La Rochelle a French-Castilian fleet smashed the English —
      burning ships, captured nobles, the sea itself changing hands.
      I watched the smoke from the cliffs: England's rule of the waves,
      won at Sluys thirty years before, ending in an afternoon.
      The Channel wasn't English anymore.
      The war had tilted — slowly, the way du Guesclin liked it —
      and France was coming back, one wave at a time.
    description: "A French-Castilian fleet smashes the English at La Rochelle — thirty years of English sea-rule ending in an afternoon of smoke."
    status: "first draft"
    sha256: "6ddee4cd676a86d0a01aae4c722e81f98560db527bb789d0caa43a52434813f8"
  - number: "2141"
    volume: 4
    title: "Julian's Visions"
    date: "1373 CE"
    region: "England"
    poem: |
      An Englishwoman named Julian lay near death in Norwich,
      and in her sickness received the visions she would call her Showings —
      sixteen revelations of Christ's love, written down by an anchoress
      walled into a cell for the rest of her life.
      I never met her. Nobody much did — that was the point of the cell.
      But her book survived: the first book in English
      we know was written by a woman.
      "All shall be well, and all shall be well."
      Out of a plague-age cell, the gentlest sentence in English.
    description: "Near death in Norwich, Julian receives the visions she'll call her Showings — the first known book in English by a woman, gentleness out of a cell."
    status: "first draft"
    sha256: "09ca86d22d907ae960318c1637491ef5819590db98caccbedb4d38344efa5e76"
  - number: "2142"
    volume: 4
    title: "Petrarch Dies"
    date: "1374 CE"
    region: "Italy"
    poem: |
      The great poet died at Arquà with his head resting on a book —
      Petrarch, asleep over his pages, as if he'd just paused mid-sentence.
      I visited the little house after: the quiet, the hills,
      the manuscripts stacked like a life's work — because they were.
      He'd crowned himself with laurel on the Capitol thirty years before
      and spent a lifetime trying to drag Rome back from the dead
      with nothing but words.
      Heads on books. There's no better way for a poet to go.
    description: "Petrarch dies at Arquà with his head resting on a book — the laureate who tried to drag Rome back from the dead with nothing but words."
    status: "first draft"
    sha256: "7a072f2eeb8a815ee2b9a073ce53ee1c38c068b838a9bfbe6a1e2cab988f2e1e"
  - number: "2143"
    volume: 4
    title: "The Atlas Paints a Golden King"
    date: "1375 CE"
    region: "Majorca"
    poem: |
      On Majorca, Abraham Cresques the mapmaker drew Mansa Musa
      on his golden throne, gold crown, gold scepter, a nugget in his hand —
      and Europe learned Africa's king by name.
      I saw the Catalan Atlas new: the vellum glowing,
      Musa seated at the edge of the known world, richer than any Christian king.
      Fifty years after the pilgrimage, the gold still shone on the map.
      That is what a legend looks like when it's drawn:
      a black king on a gold throne, at the center of his own world.
    description: "Abraham Cresques draws Mansa Musa on his golden throne in the Catalan Atlas — Europe learning Africa's king by name, in gold on vellum."
    status: "first draft"
    sha256: "55478f46acdb32cf2b72f792eb36ad6ae6013e1fa486f9647251b859d2a872e7"
  - number: "2144"
    volume: 4
    title: "The Good Parliament"
    date: "1376 CE"
    region: "England"
    poem: |
      The Commons rose against royal corruption in the parliament men call Good —
      impeaching the king's ministers, demanding accounts,
      the first time the people's house bit the hand that fed it.
      I sat in the gallery and watched commoners question lords,
      and the lords squirm.
      It didn't last — the court struck back within months —
      but the precedent was set, the tool was forged.
      Impeachment. Accountability. Words England would use again.
      The Good Parliament died young. Its ghost lived on.
    description: "The Commons rise against royal corruption in the Good Parliament — impeachment forged as a tool, a ghost that will live long after."
    status: "first draft"
    sha256: "0c53528400ed61113f5d6152d142c8a63d37bae7d95db0adc314d23248c07584"
  - number: "2145"
    volume: 4
    title: "Tenochtitlan Chooses Its First King"
    date: "1376 CE"
    region: "Mexico"
    poem: |
      The Mexica elected Acamapichtli, first king of Tenochtitlan —
      a city fifty years old, choosing a monarch to give it weight among nations.
      I watched the ceremony on the island: the feathers, the drums,
      the new king taking up the reed-mat throne.
      They'd been wanderers. Now they had a king.
      Nobody on that island knew what was coming —
      the empire, the temples, the sacrifices, the fall.
      They just knew: a city with a king is a city that matters.
    description: "The Mexica elect Acamapichtli, first king of Tenochtitlan — wanderers no more, a city choosing a crown to give itself weight."
    status: "first draft"
    sha256: "e6df1bd19306e49ed5511a1f230c0a0255249337aa3d9d6e2968fcb34ffc24af"
  - number: "2146"
    volume: 4
    title: "The Pope Comes Home"
    date: "1377 CE"
    region: "Rome"
    poem: |
      Gregory XI brought the papacy back from Avignon to Rome
      after seventy years away — seventy years of exile, ended.
      I was in Rome when he arrived: the bells, the crowds,
      the ruined churches, the Tiber shining.
      The Romans wept. The French cardinals sulked.
      He'd die within the year, and the Church would split in two —
      but for that one homecoming, heaven's address was Rome again,
      and the old city could breathe.
    description: "Gregory XI brings the papacy home from Avignon after seventy years — Rome's bells ringing, the old city breathing again, if only for a season."
    status: "first draft"
    sha256: "094053a74cf78c5e0390228ba3608f74d3099cda91fffcc5ffc68b5eef5f4a53"
  - number: "2147"
    volume: 4
    title: "The Boy King Richard II"
    date: "1377 CE"
    region: "England"
    poem: |
      Richard II was crowned at ten — a beautiful boy with a dangerous pride,
      grandson of Edward III, king before he could grow a beard.
      I saw him at Westminster, small in the great abbey,
      the crown too big for his head.
      Everyone smiled. Everyone schemed.
      A child on the throne is an invitation —
      to uncles, to counselors, to anyone with ambition and patience.
      Richard would grow up believing he was sacred.
      That belief would kill him.
    description: "Richard II is crowned at ten, a beautiful boy with a dangerous pride — a child on the throne, and an invitation to every schemer in England."
    status: "first draft"
    sha256: "989b095a4a6ba80c78d7067bdaedc00c0bb7916cab444dce587fe15bd95766a9"
  - number: "2148"
    volume: 4
    title: "The Great Schism: Two Popes"
    date: "1378 CE"
    region: "Christendom"
    poem: |
      Two popes now — one in Rome, one in Avignon —
      excommunicating each other, each with his cardinals,
      each with his kings, Christendom split down the middle.
      I traveled through France and Italy that year and heard both sides curse the other:
      antipope, usurper, schismatic, heretic.
      The fisherman's chair, sawed in half.
      It would last forty years — forty years of two (then three) popes,
      and every Christian in Europe forced to choose.
      The Church survived it. Barely. And never the same.
    description: "Rival popes in Rome and Avignon excommunicate each other, splitting Christendom — the fisherman's chair sawed in half for forty years."
    status: "first draft"
    sha256: "dba2a34547e449660e4f0e246f009639c1ac8def72efd5e870329f9da024fcda"
  - number: "2149"
    volume: 4
    title: "The Ciompi: Wool Workers Seize Florence"
    date: "1378 CE"
    region: "Florence"
    poem: |
      Florence's wool carders — the Ciompi, the lowest of the low —
      seized the city and ruled it for six wild weeks:
      their own guilds, their own government, the poor in power.
      I was in the Piazza della Signoria when they took the palace.
      Six weeks of the world turned over.
      Then the great guilds took it back, and the Ciompi
      went back to carding wool — those who survived.
      But Florence had seen its poorest rule it,
      and no city ever forgets a thing like that.
    description: "Florence's wool carders seize the city and rule for six wild weeks — the world turned over, then turned back, but never forgotten."
    status: "first draft"
    sha256: "b13f09ea8ba740dd78a3c8782e1f077a4e98a52dfe1e7537ec52f7e520e1c157"
  - number: "2150"
    volume: 4
    title: "Kulikovo: The Yoke Cracks"
    date: "1380 CE"
    region: "Russia"
    poem: |
      On Kulikovo Field, Dmitry Donskoy's Russians broke the Golden Horde's army —
      the first great Russian victory over the Mongols,
      the yoke cracking after a hundred and forty years.
      I walked that field at dawn before the battle: the mist,
      the prayers, the knowledge that everything was at stake.
      They won. The Horde would come back — it always came back —
      but never the same. The spell was broken.
      Russia had stood up. It would not kneel again.
    description: "Dmitry Donskoy's Russians break the Golden Horde at Kulikovo — the Mongol yoke cracking after 140 years, the spell broken forever."
    status: "first draft"
    sha256: "6f28e1c57cd10851cb8070466b32fd0b0652b54d5e740d8a59f87c9937d0c8c4"
  - number: "2151"
    volume: 4
    title: "The Saint Who Scolded Popes"
    date: "1380 CE"
    region: "Italy"
    poem: |
      Catherine of Siena died — the mystic, the unlearned daughter of a dyer,
      who told popes to their faces what God demanded:
      go back to Rome, end the schism, reform the Church.
      And they listened. Gregory went home because of her letters.
      I read those letters: plain, fierce, tender —
      a young woman scolding the Vicar of Christ like a wayward son.
      Saints are supposed to be gentle.
      Catherine was gentle the way a sword is gentle —
      when it's on your side.
    description: "Catherine of Siena dies — the dyer's daughter who scolded popes to their faces and moved them with plain, fierce letters."
    status: "first draft"
    sha256: "0e2d1f3ee54029b2d77805158a5ae86d95619212740b33fd2b7e0777f88fc0d7"
  - number: "2152"
    volume: 4
    title: "Wat Tyler's Revolt"
    date: "1381 CE"
    region: "England"
    poem: |
      The Kentish peasants marched on London behind Wat Tyler —
      burning palaces, killing tax collectors, demanding an end to serfdom,
      the young king Richard meeting them at Mile End and promising everything.
      I was in London when they took the Tower.
      For days the poor owned the greatest city in England.
      Then Tyler was cut down at Smithfield, the promises were broken,
      and the hangings began.
      But serfdom died anyway — slowly, quietly, of the plague's economics.
      The revolt failed. The point stood.
    description: "Kentish peasants march on London behind Wat Tyler, burn palaces, and demand an end to serfdom — the revolt fails, but the point stands."
    status: "first draft"
    sha256: "97aefb7f532fc7f87685d907922140ecf91bc37352939716b786a8936b382d47"
  - number: "2153"
    volume: 4
    title: "Wycliffe's English Bible"
    date: "1382 CE"
    region: "England"
    poem: |
      John Wycliffe's followers put the scriptures into plain English —
      the whole Bible, for common readers, no priest required.
      I held one of those handwritten copies: heavy, precious,
      the word of God in the tongue of the marketplace.
      The Church called it heresy. The Lollards carried it anyway,
      village to village, hidden in carts and cloaks.
      Ideas are the hardest contraband.
      A hundred years later, men would still be dying for this book —
      and the book would still be winning.
    description: "Wycliffe's followers put the scriptures into plain English for common readers — the hardest contraband ever smuggled, and still winning."
    status: "first draft"
    sha256: "d8559178e2df67bca41d30547a11176b01e17711d58fe69e806824bd72cbec79"
  - number: "2154"
    volume: 4
    title: "Jadwiga Crowned King"
    date: "1384 CE"
    region: "Poland"
    poem: |
      Young Jadwiga was crowned king of Poland — king, not queen,
      the title masculine because the throne was —
      a girl of ten, crowned to hold a kingdom together.
      I saw the procession in Kraków: the child, the crown, the weight of it.
      Her marriage would soon join Poland and Lithuania,
      the greatest union in eastern Europe.
      A ten-year-old girl, carrying two nations' future in her small hands.
      History doesn't always choose its instruments from the strong.
      Sometimes it chooses the young.
    description: "Young Jadwiga is crowned king of Poland at ten — a child carrying two nations' future, and the union of Poland and Lithuania to come."
    status: "first draft"
    sha256: "f112052b5b2683cbe1e9646cd551d2bbd82e6b1ea8b0d7a916730ddce6a08a20"
  - number: "2155"
    volume: 4
    title: "Aljubarrota"
    date: "1385 CE"
    region: "Portugal"
    poem: |
      At Aljubarrota the outnumbered Portuguese smashed Castile's army —
      English longbows, Portuguese pikes, a king who wouldn't run —
      and Portugal's independence was secured for good.
      I walked that battlefield in the evening: the Castilian dead,
      the captured banners, the little kingdom standing tall.
      Small countries survive by winning the one battle they can't afford to lose.
      Portugal won it.
      Six hundred years later, it's still Portugal.
    description: "Outnumbered Portuguese troops smash Castile at Aljubarrota — the one battle a small country can't afford to lose, won for six hundred years."
    status: "first draft"
    sha256: "8d06981d7dbf716e023ab5db5bb036987e2c63f5742e58db4c5ee8c445dec79b"
  - number: "2156"
    volume: 4
    title: "Heidelberg Opens"
    date: "1386 CE"
    region: "Germany"
    poem: |
      Germany's oldest university opened its doors at Heidelberg —
      scholars, masters, students, the whole wandering tribe of learning
      finding a new home on the Neckar.
      I watched the first lectures: the disputations, the Latin,
      the young men arguing philosophy over beer.
      Another university. The world was filling up with them —
      Prague, Heidelberg, soon everywhere.
      The plague had emptied the towns. The universities were filling the minds.
      That was the trade the century made.
    description: "Germany's oldest university opens at Heidelberg — the plague emptied the towns, and the universities are filling the minds instead."
    status: "first draft"
    sha256: "d8ed6097ccaf65440e88d11c5e65ae63863b82f361dc94bf8cb5b9c9690df049"
  - number: "2157"
    volume: 4
    title: "Chaucer Begins the Tales"
    date: "1387 CE"
    region: "England"
    poem: |
      Geoffrey Chaucer started the Canterbury Tales —
      a band of pilgrims on the road, each telling a story,
      giving the English tongue its great voice.
      I heard him read the first of them aloud once:
      the Knight, the Miller, the Wife of Bath, all talking like real people,
      in English — not French, not Latin, English.
      The language of plowmen, telling stories fit for kings.
      He never finished it. He didn't need to.
      English had found its poet.
    description: "Chaucer begins the Canterbury Tales, giving the English tongue its great voice — pilgrims telling stories in the language of plowmen."
    status: "first draft"
    sha256: "74beb2570ff5c6249dfb1463d9b0be51deaaa23b0bac9f06dad4f0eccba9acbb"
  - number: "2158"
    volume: 4
    title: "Otterburn"
    date: "1388 CE"
    region: "Scotland"
    poem: |
      At Otterburn the Scots and English slaughtered each other
      in a moonlit border battle the ballads would sing for centuries —
      Douglas dead, Percy captured, both sides bled white.
      I heard the ballad before I saw the field:
      "The Percy and the Douglas met," the singers cried,
      and the whole border knew the tune.
      A battle so even, so bloody, so pointless
      that only poetry could make sense of it.
      So poetry did.
    description: "Scots and English slaughter each other at moonlit Otterburn — a battle so bloody and pointless that only the ballads could make sense of it."
    status: "first draft"
    sha256: "814e69d1b7b95545b6084caa1645e2354921c4c4c484852d8154f78478f4d2bb"
  - number: "2159"
    volume: 4
    title: "Kosovo"
    date: "1389 CE"
    region: "Balkans"
    poem: |
      At Kosovo the Ottomans crushed the Serbian host —
      prince and sultan both dying on the field that day,
      Lazar and Murad, the two commanders, both gone by evening.
      I walked that field of blackbirds after: the Serbian nobility destroyed,
      the Balkans' great power broken in an afternoon.
      Serbia would remember Kosovo for six hundred years —
      the defeat that became a nation's soul.
      Some battles are lost. This one was transfigured.
      The Turks won the field. The Serbs kept the story.
    description: "The Ottomans crush the Serbs at Kosovo; prince and sultan both die — the defeat that becomes a nation's soul for six hundred years."
    status: "first draft"
    sha256: "82a688b87a5485e581ca0bccb19ac139f2364c46c6bba3c2cbb2dcb6b3708044"
  - number: "2160"
    volume: 4
    title: "Hayam Wuruk Dies"
    date: "1389 CE"
    region: "Java"
    poem: |
      Hayam Wuruk died — Majapahit's great king, Gajah Mada's king —
      and the island empire's golden age began to fade.
      I was in Java when the mourning drums sounded:
      the great ruler gone, the great minister already dead,
      the oath fulfilled and the empire at its widest —
      and already, quietly, coming apart.
      Golden ages don't end with a crash.
      They end like this: a death, a succession, a slow loosening,
      until one day the gold is just a memory.
    description: "Majapahit's great king Hayam Wuruk dies, and the island empire's golden age begins its slow, quiet fade."
    status: "first draft"
    sha256: "98e8ac265f9a3e2b33ed848010920672cf54ee9fbbe9a8ae7412dd2d29fb8e24"
  - number: "2161"
    volume: 4
    title: "The Fury in Seville"
    date: "1391 CE"
    region: "Spain"
    poem: |
      The mobs rose in Seville and the fury spread across Spain —
      Jews massacred in the streets, synagogues burned,
      thousands fleeing, converting, or dying.
      I walked through the judería after: the empty houses,
      the blood in the gutters, the silence where a community had been.
      The preachers had lit the match. The plague's old hatreds did the rest.
      Spain would never be the same — the converts, the exiles,
      the wound that never closed.
      Some furies pass. This one stayed in the blood.
    description: "Mobs massacre Jews across Spain in the fury of 1391 — synagogues burned, thousands fleeing or dying, a wound that never closed."
    status: "first draft"
    sha256: "9d6e821c02f3a53d690bc46770320025f494a4274aa11d6423bea8904b37c374"
  - number: "2162"
    volume: 4
    title: "Joseon Is Founded"
    date: "1392 CE"
    region: "Korea"
    poem: |
      Yi Seong-gye founded the Joseon dynasty —
      the general turned king, overthrowing Goryeo's wreckage
      to build a kingdom that would rule Korea for five centuries.
      I was in the new court as the old order was swept away:
      new laws, new scholars, the Confucian order taking root.
      Five hundred years. Few dynasties last that long.
      Joseon would see invasions, kings, scholars, and the modern age —
      all from this one founding, this one general's decision.
    description: "Yi Seong-gye founds the Joseon dynasty, which will rule Korea for five centuries — one general's decision, half a millennium of consequence."
    status: "first draft"
    sha256: "6f5705b4a5b490c5d2287e79bfe50a7d60afdda06d0ca82c44f72afc9d3de7ce"
  - number: "2163"
    volume: 4
    title: "The King Loses His Mind"
    date: "1392 CE"
    region: "France"
    poem: |
      Charles VI went mad in a forest — seized his sword,
      struck down his own men, raving, and France's king was lost to reason.
      I heard the accounts from those who were there: the summer heat,
      the sudden screaming, the king they'd known gone in an afternoon.
      He'd have lucid months, then the darkness again, for thirty years.
      And France — leaderless, bleeding, faction against faction —
      drifted toward civil war.
      A kingdom's fate, hanging on one man's broken mind.
    description: "Charles VI goes mad in a forest, striking down his own men — and France drifts toward civil war on the wreck of one man's mind."
    status: "first draft"
    sha256: "87df9f48b5b192216f6bb9810cbfc02620ee5196f52f17e660af13e3ae5588ca"
  - number: "2164"
    volume: 4
    title: "A Capital Named Hanseong"
    date: "1394 CE"
    region: "Korea"
    poem: |
      Yi Seong-gye built his new capital — Hanseong, the fortress on the Han —
      palaces, walls, gates, the geomancers choosing every stone's place.
      I walked the building site: the great South Gate rising,
      the mountains standing guard around the valley.
      The world would come to call it Seoul.
      Six hundred years later it's still there, still the capital,
      twenty million people where the geomancers laid their lines.
      Some foundations hold.
    description: "Yi Seong-gye builds his new capital Hanseong — the city the world will call Seoul, its geomancers' lines holding for six hundred years."
    status: "first draft"
    sha256: "f760cec75b149e96eb974c45b725565a57c624ab5d8cbb2e9df4d9cb7361a989"
  - number: "2165"
    volume: 4
    title: "Nicopolis"
    date: "1396 CE"
    region: "Balkans"
    poem: |
      On the Danube at Nicopolis, the Ottomans annihilated the last great crusade —
      French knights charging into Turkish stakes and arrows,
      the flower of Burgundy cut down or captured.
      I saw the aftermath: the prisoners ransomed for fortunes,
      the dead left for the river.
      Chivalry's dream died there, in the mud of Bulgaria.
      The crusading age was over — it had been over for a century,
      but Nicopolis was the funeral.
      Europe would never ride east again.
    description: "The Ottomans annihilate the last great crusade at Nicopolis — chivalry's dream dying in the Danube mud, the crusading age's funeral."
    status: "first draft"
    sha256: "3bc91bda9b135db39e3da1a8b615e4a451d8c5461d86fd84b034d1255b449efe"
  - number: "2166"
    volume: 4
    title: "The Kalmar Union"
    date: "1397 CE"
    region: "Scandinavia"
    poem: |
      Margaret I bound Denmark, Norway, and Sweden under a single crown —
      the Kalmar Union, the whole north under one queen's hand.
      I was in Kalmar for the ceremony: three kingdoms, one monarch,
      a woman ruling what kings had fought over for centuries.
      It wouldn't last — Sweden would break away, as Sweden does —
      but for a while the north was one.
      The Vikings' grandchildren, united not by raid but by law.
      That was new.
    description: "Margaret I binds Denmark, Norway, and Sweden under a single crown — the whole north united not by raid but by law, under a queen."
    status: "first draft"
    sha256: "8eac1ffe1bb63540fd29570dbbb82178e21a1ba15e1689e84bcfd934f5cdf87c"
  - number: "2167"
    volume: 4
    title: "Timur Sacks Delhi"
    date: "1398 CE"
    region: "India"
    poem: |
      Timur's horsemen stormed Delhi and left it in ruins and skulls —
      a hundred thousand dead, the great Sultanate broken,
      towers of heads raised outside the walls.
      I walked through Delhi after: the smoke, the silence,
      the greatest city in India emptied like a kicked anthill.
      Timur didn't stay. He never stayed.
      He came, he took, he left — and the Tughlaqs never recovered.
      Some conquerors build. Timur just passed through,
      and the passing was enough.
    description: "Timur's horsemen storm Delhi and leave it in ruins and skulls — the conqueror who never stays, whose passing alone is enough to break an empire."
    status: "first draft"
    sha256: "29182bc288ee0734cefbdf7a310e1ab62aec653e1194315406b78d661fbc0562"
  - number: "2168"
    volume: 4
    title: "Henry Takes the Crown"
    date: "1399 CE"
    region: "England"
    poem: |
      Henry Bolingbroke came home from exile, deposed Richard II,
      and seized the throne as Henry IV —
      the beautiful boy king starved in a Yorkshire castle,
      the usurper crowned at Westminster.
      I watched the parliament that made it legal:
      deposition dressed up as law, theft in ermine.
      Richard had believed he was sacred. Henry believed he was necessary.
      England would spend the next hundred years
      deciding which of them was right.
    description: "Henry Bolingbroke deposes Richard II and seizes the throne as Henry IV — theft in ermine, and a century of England deciding if it was right."
    status: "first draft"
    sha256: "18f2e2714fe0b5661fe5adb360fc66269f9b8ccddfc8f72ed89232ce9ea556b2"
  - number: "2169"
    volume: 4
    title: "The Lion City of the Straits"
    date: "1400 CE"
    region: "Malacca"
    poem: |
      I watched a fugitive prince wade ashore here,
      out of breath, out of friends, out of luck —
      a mouse-deer sleeping at a dog's feet woke him:
      here is the place, here the city shall stand.
      They call it Malacca now. I saw the first stilt
      driven into the mud of the straits,
      and the first prau slip in with rice and salt,
      and the first Chinese junk swing wide its sail.
      The pepper came, the cloth came, the gold came.
      Everything that floats between two oceans
      must pass this one narrow gate of water —
      and I was standing in it, waving them through.
    description: "A fleeing prince founds the harbor city that will command the spice lanes between East and West."
    status: "first draft"
    sha256: "a48957ce0ee5cb1fe3b82f7a3ad68cd843548505e7b812d06a9c7ba17bcbacd2"
  - number: "2170"
    volume: 4
    title: "The Welsh Uprising"
    date: "1400 CE"
    region: "Wales"
    poem: |
      I heard the cattle lowing in the misty vales,
      and then a voice rose with them — Owain's voice —
      and the hills answered back, as hills do,
      when a man tells them they are a nation.
      I stood in mud to my ankles at Pilleth
      and watched the English dead lie still in the rain.
      The castles held; the valleys burned; the bards
      sang songs that would outlive every arrow.
      It failed — of course it failed — but the song
      never quite died out of the Welshman's throat,
      and I have heard it hummed in every century since.
    description: "Owain Glyndŵr raises Wales in revolt against English rule, and the dream of a free Wales never dies."
    status: "first draft"
    sha256: "1a92df44795f514b852c58a854f50acd92be5c819de6b7bbd81a1ba27e465947"
  - number: "2171"
    volume: 4
    title: "Towers of Skulls"
    date: "1400 CE"
    region: "Syria"
    poem: |
      I do not linger in Aleppo. I will not.
      I saw what I saw and I carry it still:
      the pyramids the lame one built of heads,
      layer upon layer, lime and blood and bone,
      outside the walls of a city that refused him.
      Damascus fared no better. The craftsmen —
      oh, the cruelest joke — he spared the craftsmen,
      marched them east to build his Samarkand.
      I left before the flies grew bold.
      Some victories are only arithmetic.
    description: "Timur sacks Aleppo and Damascus, stacking the skulls of the fallen into towers of warning."
    status: "first draft"
    sha256: "549584c06255886300952e53a60c3759289378dd9d37c5fc1161c9a3fbf84132"
  - number: "2172"
    volume: 4
    title: "The Thunderclap at Ankara"
    date: "1402 CE"
    region: "Anatolia"
    poem: |
      I stood on the ridge at Ankara in the heat,
      and watched two empires break on each other —
      the lame giant's iron horde against the thunder
      of Bayezid, who had been lightning itself till then.
      The Serbs fought for the Sultan; the Anatolian lords
      slipped away in the dust and the rout was on.
      They brought the Sultan in a cage — or so they say —
      and I saw the pride leave his face.
      One empire walked off the field with its king.
      The other walked off carrying its king's shame.
    description: "Timur captures the Ottoman Sultan Bayezid at Ankara, and the Ottoman Empire reels on the brink of ruin."
    status: "first draft"
    sha256: "335b403343fb36c25ca2c4b3660d0b30bc54533263ef1f0a26806a18c965ef66"
  - number: "2173"
    volume: 4
    title: "Eastward the Lame Giant"
    date: "1403 CE"
    region: "Central Asia"
    poem: |
      He was old, and limping worse than ever,
      but the map still had one blank place on it —
      China, the Ming, the dragon behind the wall.
      I watched the columns form up at Otrar,
      two hundred thousand strong, the snow already
      falling sideways on the supply carts.
      Men said he would live forever. Men always do,
      right up to the winter he doesn't survive.
      I turned my horse away from that marching army.
      I knew, somehow. The east could wait. He couldn't.
    description: "Timur turns his armies east, marching toward Ming China in the winter snows."
    status: "first draft"
    sha256: "44ae177aaaa683ac3eac73b8988e04635920b27f3557d4c4a82b7b530be3bd7f"
  - number: "2174"
    volume: 4
    title: "The Eunuch Admiral"
    date: "1404 CE"
    region: "China"
    poem: |
      I stood in the hall at Nanjing when the Emperor
      gave the fleet to a eunuch — Zheng He, a Muslim boy
      taken in war, raised in the palace, and given
      the largest navy the world had ever seen.
      They laughed at first. Then they saw the plans:
      ships the length of a city street, nine masts,
      and the whole treasure of China in the hold.
      A man with nothing to prove to a dynasty
      is exactly the man you give your ocean to.
    description: "The Yongle Emperor puts Zheng He, a court eunuch, in command of the greatest fleet ever launched."
    status: "first draft"
    sha256: "961f28b929a4a65d828935115285c9294ab93298b1f8c0b34469675d5f73efaf"
  - number: "2175"
    volume: 4
    title: "Death of the World-Shaker"
    date: "1405 CE"
    region: "Central Asia"
    poem: |
      At Otrar, in the cold, the lame one died —
      not in battle, not by any assassin's knife,
      but fever, in a tent, in February,
      with the road to China stretching east before him.
      I felt the empire exhale like a punctured lung.
      His sons and grandsons drew their knives at once
      and the greatest conquest machine ever assembled
      fell apart over a dinner of succession.
      The world has ended many times in a tent.
      This was one of the quieter endings.
    description: "Timur dies on the march to China, and his vast empire shatters among his heirs."
    status: "first draft"
    sha256: "b6dada652eadbdbd097fa2a8f72437bd47410804812129c04587c78d16e75dbe"
  - number: "2176"
    volume: 4
    title: "The Treasure Fleet Sails"
    date: "1405 CE"
    region: "China"
    poem: |
      I was on the dock at Nanjing the morning they sailed —
      sixty-two great junks, and two hundred and fifty-five
      small ones, and twenty-seven thousand men,
      the masts like a forest that had learned to walk.
      The drums beat; the banners snapped in the river wind;
      the Emperor watched from the palace steps.
      They were bound for Calicut and beyond the sea,
      carrying porcelain for pepper, silk for giraffes.
      No fleet like it had ever floated.
      None would again, not for a long, long time.
    description: "Zheng He's treasure fleet leaves Nanjing with 27,000 men aboard, bound for Calicut and beyond."
    status: "first draft"
    sha256: "cd12ae523689aeaab64c2e288ce91cfc3b7a215501e7867ec83da17f1a668f6e"
  - number: "2177"
    volume: 4
    title: "The Forbidden City Begins"
    date: "1406 CE"
    region: "China"
    poem: |
      A million workmen. Let that number sit.
      I walked the site when it was mud and stakes,
      and heard the foremen's chant roll like thunder —
      pine from the southwest forests, stone from the quarries,
      glazed tiles baked in the kilns of Suzhou.
      They were building a palace the size of a city,
      roof by roof, courtyard by courtyard,
      for one man who would never walk in half of it.
      Empires build for eternity. Eternity usually
      arrives about five centuries early.
    description: "The Yongle Emperor sets a million workmen to raising his great palace at Beijing."
    status: "first draft"
    sha256: "d50563acfca850620e4be5ed67da23058b3fa8bb001b25aa2eb5addd12d3f1fa"
  - number: "2178"
    volume: 4
    title: "The Father of History Dies"
    date: "1406 CE"
    region: "Egypt"
    poem: |
      I sat by his bedside in Cairo, an old man now,
      this Ibn Khaldun who had been vizier and prisoner,
      judge and exile, who had talked with Timur himself
      and lived to write it all down.
      "States rise on solidarity," he told me,
      "and rot on luxury — four generations, no more."
      He had watched it happen in Tunis and Fez,
      in Granada and Cairo. He was the first
      to say what every ruin since has whispered.
      The Muqaddimah closed. The empires kept their schedule.
    description: "Ibn Khaldun dies in Cairo, leaving the Muqaddimah — the first science of how empires rise and fall."
    status: "first draft"
    sha256: "bd878ac0f63d982f24f61af7e89dffcda8c1ec420b06051b43930480335949c9"
  - number: "2179"
    volume: 4
    title: "The Emperor's Encyclopedia"
    date: "1408 CE"
    region: "China"
    poem: |
      Eleven thousand volumes. I ran my finger
      along the shelves in the palace library —
      every book worth keeping, copied by two thousand scholars,
      astronomy, medicine, agriculture, poetry, war.
      The Yongle Dadian: the whole world of knowledge
      bound in yellow silk, shelved in the palace.
      One copy only. They never printed it.
      Fire took most of it, in the end, as fire does.
      I mourn it still: the biggest library ever gathered,
      and no printing press allowed near it.
    description: "The Yongle Encyclopedia — eleven thousand hand-copied volumes holding all of China's knowledge — is completed."
    status: "first draft"
    sha256: "67e8d1c52f458f90202a290c671d14c757dffbaeb97cd123a28c1a9d77d91967"
  - number: "2180"
    volume: 4
    title: "Three Popes at Once"
    date: "1409 CE"
    region: "Italy"
    poem: |
      I was in Pisa when the cardinals did it —
      elected a THIRD pope, to end the schism of two,
      and the arithmetic, as any child could see,
      was the worst kind of addition.
      Rome had its pope. Avignon had its pope.
      Now Pisa had one too, and each of them
      excommunicated the other two with great ceremony.
      I stood in the cathedral square and laughed,
      then stopped, because the faithful were crying.
      When the shepherds multiply, the sheep scatter.
    description: "The Council of Pisa elects a third pope — deepening the schism it meant to heal."
    status: "first draft"
    sha256: "166fcbee0ef8d2bc606c5d0faa2eef15417c4204e768f4fd2e41921d9c4c625a"
  - number: "2181"
    volume: 4
    title: "Grunwald"
    date: "1410 CE"
    region: "Poland-Lithuania"
    poem: |
      July fifteenth, and the field was white with lances.
      I stood with the Lithuanians when they feigned their flight —
      the oldest trick in the book, and the Teutonic knights
      rode straight into it, heavy and certain.
      The Polish king watched from his hill. Then the horns,
      then the charge, then the long slow grinding
      of iron men in summer mud, till the Grand Master fell
      and the Order's white mantles lay in the dirt like snow.
      The Baltic would never be the knights' lake again.
    description: "Polish and Lithuanian knights crush the Teutonic Order at Grunwald, breaking its power in the north."
    status: "first draft"
    sha256: "b95e6b5fac1638c29190f319c4226c52efd837830f2f3213a73ed4c77718ed21"
  - number: "2182"
    volume: 4
    title: "The Admiral Takes a King"
    date: "1411 CE"
    region: "Ceylon"
    poem: |
      I sailed with Zheng He into Ceylon's harbor,
      and watched a king make the worst decision of his life —
      he tried to seize the treasure fleet's gifts by force.
      The Admiral's marines came back at night,
      through the jungle, and took the palace by dawn.
      They carried King Alakeshvara home in chains
      to Nanjing, where the Emperor — astonishingly —
      pardoned him and sent him home again.
      Power, I learned on that voyage, is most fearsome
      when it can afford to be merciful.
    description: "Zheng He captures the king of Ceylon and carries him home to Nanjing, where the Emperor pardons him."
    status: "first draft"
    sha256: "1615228ce37e89739601fa37703ceecdf5bde5560a1512480fcfe77ce35c5346"
  - number: "2183"
    volume: 4
    title: "A Farmer's Daughter"
    date: "1412 CE"
    region: "France"
    poem: |
      I was in Domrémy on the sixth of January,
      when the snow lay thick on the Meuse valley
      and a farmer's daughter was born in a stone house —
      no trumpets, no astrologers, just a midwife
      and the ordinary cold of an ordinary winter.
      Nobody wrote it down. Why would they?
      Nineteen years later I would watch her
      lift a siege, crown a king, and burn for it.
      But that day she was only a baby crying,
      and the century had no idea what it had done.
    description: "Joan of Arc is born at Domrémy — a farmer's daughter no one notices, yet."
    status: "first draft"
    sha256: "42c956ccd29a7b88f2953b17d6258b9111aae5d0b6653d9d7c6da56d1299e58b"
  - number: "2184"
    volume: 4
    title: "The Warrior King"
    date: "1413 CE"
    region: "England"
    poem: |
      I stood in Westminster Abbey when the crown came down
      on Henry's head — the wild prince of the taverns,
      the one who drank with Falstaff's crew, now king.
      They say he changed overnight. I saw the change
      in his eyes before the crown touched him:
      the recklessness turned to iron, the laughter to command.
      He would give England five short years of glory
      and leave a baby on the throne of two kingdoms.
      Kings are made in a moment. The bill comes later.
    description: "Henry V takes the English throne — the tavern prince become the warrior king."
    status: "first draft"
    sha256: "9dc09482126fe1391242a97a8aa816cef038316401a5b83652067efe1a2bdae7"
  - number: "2185"
    volume: 4
    title: "The Council Gathers"
    date: "1414 CE"
    region: "Germany"
    poem: |
      I walked the streets of Constance that autumn
      and they were full of the whole of Christendom —
      bishops, bankers, cooks, prostitutes, princes,
      seventy thousand souls in a lakeside town,
      all come to fix a church with three heads.
      The Emperor himself rode in, Sigismund,
      promising safe conduct, promising reform.
      I had seen councils before. I knew how they ended.
      But the hope in those streets was real that year —
      you could smell it over the lake mist.
    description: "The Council of Constance opens — the whole of Christendom gathers to heal the broken church."
    status: "first draft"
    sha256: "02d4571354647981a55eb60ccefe34c3796f7a5f9fc99d4c6e65daa9a7a5656e"
  - number: "2186"
    volume: 4
    title: "The Gateway Falls"
    date: "1415 CE"
    region: "Morocco"
    poem: |
      I went ashore with the Portuguese at Ceuta,
      up the beach in the August dawn, sword in hand —
      the city fell in a day, and with it
      the first stone of an empire no one had imagined.
      Old Prince Henry watched from the walls after,
      looking south, always south, past the straits
      to the gold and the spice and the unknown sea.
      That morning on the Moroccan sand
      the Middle Ages ended and something else began.
      I felt it in my boots. The world got bigger.
    description: "Portugal seizes Ceuta — the first foothold of the age of exploration."
    status: "first draft"
    sha256: "b07e83b276a2443d31c3a392ab584014b7399e23d4c1f15f5c9a60d185ff6034"
  - number: "2187"
    volume: 4
    title: "The Martyr's Fire"
    date: "1415 CE"
    region: "Bohemia"
    poem: |
      I was there at Constance on the sixth of July,
      and I will not lie to you: I tried to look away.
      They burned Jan Hus in his priest's robes,
      his books piled around him, and he sang —
      psalms, in Czech, while the flames took him.
      The Emperor had promised him safe conduct.
      Paper promises burn faster than men.
      "Today you roast a goose," he said — Hus means goose —
      "but a swan will come you cannot roast."
      A hundred years later, in Wittenberg, the swan arrived.
    description: "Jan Hus burns at the stake at Constance, singing psalms in the flames — and prophesies a swan to come."
    status: "first draft"
    sha256: "90719929aa8b40f79c44cd583a92ed0fdff2f9944ec15cd777510233ae37b957"
  - number: "2188"
    volume: 4
    title: "Agincourt"
    date: "1415 CE"
    region: "France"
    poem: |
      October twenty-fifth, St. Crispin's Day.
      I stood in the English line in the cold dawn,
      mud to the knees, dysentery in the ranks,
      six thousand starving men against thirty thousand.
      The French knights came on in their shining armor
      and the longbows spoke — that terrible humming —
      and the field became a butchery of horses and pride.
      I walked it afterward. The flower of France
      lay in the mud in their expensive steel.
      Chivalry died that day. The arrow killed it.
    description: "Henry V's outnumbered longbowmen shatter French chivalry in the mud of Agincourt."
    status: "first draft"
    sha256: "fafe0afeb3a2bc007d9be9a0e7cdf320b3021e28c80c05cacc03b5f7e3ba2466"
  - number: "2189"
    volume: 4
    title: "The Painter's New Eye"
    date: "1416 CE"
    region: "Italy"
    poem: |
      I stood behind Brunelleschi in the Florence street
      while he held up his little painted panel —
      the Baptistery, exactly as the eye sees it,
      with a hole in it, and a mirror, and a trick of lines
      that made flat wood open into deep space.
      The crowd gasped. I gasped. We had been painting
      for a thousand years and never once seen
      the world the way the world actually looks.
      Perspective. One man's geometry lesson,
      and every wall in Europe would never be flat again.
    description: "Brunelleschi demonstrates linear perspective in Florence — painting learns true depth."
    status: "first draft"
    sha256: "f868f7748c787115fa9f51a5a14cb084929bc46a52567792299ae0fccbf3f1ad"
  - number: "2190"
    volume: 4
    title: "One Pope Again"
    date: "1417 CE"
    region: "Germany"
    poem: |
      I was in the merchants' hall at Constance
      when the white smoke went up — Martin V,
      and the long madness was over: one pope again.
      Forty years of schism, of rival blessings
      and competing excommunications, ended
      with a compromise and a tired old cardinal.
      The crowd wept. The bankers counted their profits.
      I slipped out into the November cold
      and thought of Hus, two years in the ground.
      The church was whole. Whether it was healed —
      that was a question for another century.
    description: "Martin V is elected at Constance — the Western Schism ends, and the church has one pope again."
    status: "first draft"
    sha256: "07f6eb5430b6a71c1c32105e0e9874546bdb35ca307b59103cc233b2f3ca537f"
  - number: "2191"
    volume: 4
    title: "The Dome Contest"
    date: "1418 CE"
    region: "Italy"
    poem: |
      I watched them laugh at him in the guild hall —
      this goldsmith's son with his wild plan
      to vault the widest span anyone had dared
      without a forest of wooden scaffolding.
      "How?" they asked. He wouldn't say.
      He built it like an egg, he built it double-shelled,
      he invented the cranes and the hoists as he went,
      and the laughter died one stone course at a time.
      I stood on the scaffolding with the masons
      and looked down at Florence spread below.
      Genius, I decided, is stubbornness with a drawing.
    description: "Brunelleschi wins the contest to crown Florence's cathedral with an impossible dome."
    status: "first draft"
    sha256: "48baaaf7b32cd90fc0a8e3d15e2f14e379a790002483e58323b6cd0f8632a8a7"
  - number: "2192"
    volume: 4
    title: "Sejong Takes the Throne"
    date: "1418 CE"
    region: "Korea"
    poem: |
      I was in Hanseong when the young king took the throne —
      Sejong, fourth son, the scholar prince,
      the one who read through the night and asked the farmers
      how the rain fell on their fields.
      They called him the greatest of Korea's kings,
      and I believe them. I watched him for thirty years:
      the alphabet, the science, the music, the law —
      a king who measured his reign not in conquests
      but in how much his people could understand.
      Empires are built with swords. He built with letters.
    description: "King Sejong of Korea begins his reign — the scholar-king who will give his people an alphabet."
    status: "first draft"
    sha256: "6ef919e91c83ac7d179a267cc45f9d5eaf8c84737caabc2f9e2cbb22b73082c0"
  - number: "2193"
    volume: 4
    title: "The School by the Sea"
    date: "1419 CE"
    region: "Portugal"
    poem: |
      I walked the cliffs at Sagres with Prince Henry
      and looked out at the grey Atlantic with him —
      no charts, no landmarks, only rumors:
      the sea of darkness, the boiling zone, monsters.
      So he built his school on the edge of the cliff:
      mapmakers from Mallorca, astronomers, shipwrights,
      sailors who weren't afraid to come home with empty hands.
      Year after year the caravels crept south,
      a little farther each time, like a child learning to swim.
      It started here, on this windy rock —
      the whole age of discovery, drawn in sand.
    description: "Henry the Navigator gathers mapmakers and sailors at Sagres — the school that will unlock the oceans."
    status: "first draft"
    sha256: "3274c6801a292fd34b7cf597170c7288798e5dacbaf4cbbacc03d3805fdf3cb7"
  - number: "2194"
    volume: 4
    title: "The Wooded Isles"
    date: "1419 CE"
    region: "Atlantic"
    poem: |
      They found Madeira by accident, as all good things —
      blown off course, the sailors said, and came home
      telling of islands thick with trees, uninhabited,
      green as Eden rising out of the grey sea.
      I sailed with the colonists on the second voyage,
      rabbits in cages, seeds in sacks, vines for wine.
      We burned the forest to clear the land —
      seven years, they say, the fires burned —
      and planted sugar, and the sugar needed hands,
      and the hands came in chains from Africa.
      Every paradise has a price. I saw the invoice.
    description: "Portuguese sailors claim Madeira — and the sugar plantations plant the seeds of the slave economy."
    status: "first draft"
    sha256: "de84c11a886f279eb5aeb0f16cd5809c29c105ea19623a1ba68ad67dce140400"
  - number: "2195"
    volume: 4
    title: "The Palace Complete"
    date: "1420 CE"
    region: "China"
    poem: |
      Fourteen years, a million hands, and it stood —
      the Forbidden City, nine hundred and eighty buildings,
      roofs of imperial yellow gleaming in the northern sun.
      I walked the great axis with the court that winter:
      the Hall of Supreme Harmony, the throne empty,
      waiting for the Emperor to move his capital north.
      Beijing. From here the Ming would rule,
      walled in by ceremony, ringed by eunuchs and ritual,
      the greatest palace on earth — and a beautiful cage.
      Power had found its perfect address.
    description: "The Forbidden City is finished — Beijing becomes the capital of Ming China."
    status: "first draft"
    sha256: "39019a097b582c88dfdfb81a8c8848fe42afdc00ff9526d8866236053de0bb3a"
  - number: "2196"
    volume: 4
    title: "The Hussite Storm"
    date: "1420 CE"
    region: "Bohemia"
    poem: |
      I marched with the peasants under the chalice banner —
      farmers with flails and pitchforks, singing hymns,
      led by a one-eyed general, Žižka, who beat
      five crusades with wagons chained in circles.
      They fought for the cup, for communion in both kinds,
      for a church without gold and a priest without pride.
      The nobles called them heretics. The peasants
      called themselves the true church, and fought like it.
      Hus's ashes had been scattered in the Rhine.
      His people scattered the Emperor's armies instead.
    description: "The Hussite Wars begin — Bohemian peasants march under the chalice banner against church and empire."
    status: "first draft"
    sha256: "16ef3c59d34a12513ce6b932e63c3e9717c9866017b1d7890cb0b047de123db3"
  - number: "2197"
    volume: 4
    title: "The Sixth Voyage"
    date: "1421 CE"
    region: "China"
    poem: |
      I shipped out again with the treasure fleet,
      the sixth voyage — Hormuz, the Persian Gulf,
      then down the Swahili coast of Africa:
      Mogadishu, Malindi, Mombasa, the ports
      where the monsoon winds had traded for centuries.
      We brought giraffes back for the Emperor's garden —
      the court called them qilin, unicorns, good omens.
      I stood on the deck watching Africa slide past
      and thought: this is how it should have gone —
      ships, not soldiers; gifts, not guns.
      The fleet came home. China closed the door.
    description: "Zheng He's fleet sails its sixth voyage — to Hormuz and down Africa's Swahili coast."
    status: "first draft"
    sha256: "fe6b9a23a87d8f787f65b4cbc82ea647422a2dc7cffab523043d8b6bc3d88481"
  - number: "2198"
    volume: 4
    title: "Two Crowns, One Baby"
    date: "1422 CE"
    region: "England-France"
    poem: |
      Two kings died in the same year, and I mourned neither —
      but I wept for the baby. Henry V, the warrior,
      dead of dysentery at thirty-five in a French field.
      Charles VI, the mad, dead in Paris weeks later.
      And the heir to both their crowns was nine months old —
      Henry VI, King of England and King of France,
      a crown too heavy for a grown man, on a baby's head.
      I watched the regents circle like kites over carrion.
      Empires balanced on a cradle. What could go wrong?
    description: "Henry V and Charles VI both die — the infant Henry VI inherits the crowns of England and France."
    status: "first draft"
    sha256: "ee3ace073b46ceec619cbe35a0892cc98e4aae034ce0994a55f2f665328c0504"
  - number: "2199"
    volume: 4
    title: "Verneuil the Bloody"
    date: "1424 CE"
    region: "France"
    poem: |
      They called it a second Agincourt, and I was there —
      August seventeenth, and the English archers
      did it again: the Scots and French broke on them
      like waves on a cliff of yew and goose feather.
      Seven thousand dead on the field at Verneuil,
      the flower of two nations, and the road to Paris
      lay open for the English regent.
      I walked among the fallen that evening
      and thought of Agincourt, nine years gone.
      The arrow had not lost its argument.
    description: "England's archers win a second Agincourt at Verneuil, and the road to Paris lies open."
    status: "first draft"
    sha256: "97a2c8735562a1ced233d5fa104f2ad0140ac9375875406c3008fd7989a19e04"
  - number: "2200"
    volume: 4
    title: "The First Modern Painter"
    date: "1425 CE"
    region: "Italy"
    poem: |
      I slipped into the Brancacci Chapel in Florence
      and stood before Masaccio's frescoes —
      and the saints had WEIGHT. They stood like men.
      Adam and Eve driven from Eden, their faces
      twisted with a grief I had seen on real faces
      in real wars. Nobody had painted sorrow
      like that before. Nobody had painted BODIES
      like that before — solid, shadowed, standing in light.
      The boy was twenty-four. He would be dead at twenty-seven.
      I stood there a long time. Painting had grown up.
    description: "Masaccio's Brancacci Chapel frescoes show real bodies and human grief — painting grows up."
    status: "first draft"
    sha256: "0ef5d8fbdd49cbd43f089442e5083a7e62444acb66c86c371eaa208ee27841dc"
  - number: "2201"
    volume: 4
    title: "The Ming Driven Out"
    date: "1427 CE"
    region: "Vietnam"
    poem: |
      I walked the Red River delta with Le Loi's men —
      farmers by day, ghosts by night, ten years of it,
      and the Ming garrisons learned what every empire learns
      in somebody else's rice paddies.
      At Chi Lang the Chinese army broke and ran,
      and Le Loi stood in the mud and declared it over:
      Dai Viet, free again, the dragon sent home.
      I watched him crown himself without the Emperor's leave.
      Some thrones are taken. His was reclaimed,
      one ambush at a time, for ten long years.
    description: "Le Loi's rebels break a decade of Chinese rule and free Vietnam."
    status: "first draft"
    sha256: "b61e9dbfe4993e95fada2cbd1cd64b25f33faa99a70ae7c2f6d1d921ce6f6d48"
  - number: "2202"
    volume: 4
    title: "The Triple Alliance"
    date: "1428 CE"
    region: "Mexico"
    poem: |
      I was in Tenochtitlan when Itzcoatl made the pact —
      three cities, one altar, one war machine:
      Tenochtitlan, Texcoco, Tlacopan, bound in blood.
      They burned the old books first — the histories
      that didn't flatter the new order — and wrote new ones
      with the Mexica at the center of the sun.
      An empire needs a story the way a body needs bones.
      I watched them lay the first bones of the Aztec world,
      and they were beautiful, and they were terrible.
    description: "Itzcoatl binds three cities into the Triple Alliance — the Aztec Empire is born, and the old histories burn."
    status: "first draft"
    sha256: "76b00b259743fcb2f63f1f81fb9a6b6cbf75e0877a7e4b714f488b333a4f60e6"
  - number: "2203"
    volume: 4
    title: "The Maid of Orléans"
    date: "1429 CE"
    region: "France"
    poem: |
      I rode behind her into Orléans in the May dusk —
      seventeen years old, in white armor, carrying a banner
      and not a sword, and the English guns fell silent.
      Nine days. That's all it took. Nine days
      and the siege that had strangled the city for months
      was broken, and the soldiers were singing her name.
      I saw grown men weep when she passed.
      She never struck a blow herself, they say.
      She didn't need to. She was the blow.
    description: "Joan of Arc lifts the siege of Orléans in nine days — a seventeen-year-old girl in white armor turns the war."
    status: "first draft"
    sha256: "7c1f80475cc0bb161da7997e490e5c06f565f5f999c848e3dc8a3377f4e0164a"
  - number: "2204"
    volume: 4
    title: "The King Crowned"
    date: "1429 CE"
    region: "France"
    poem: |
      I stood in Reims Cathedral in July,
      the organ thundering, the holy oil on the brow
      of Charles — the Dauphin no longer, but King of France —
      and beside him stood a peasant girl with a banner,
      taller in that moment than any prince in the room.
      She had promised him this. She had delivered.
      I watched her face during the anointing —
      not triumph. Relief. As if a weight had lifted.
      She had done what the voices asked.
      What came after, she could not have known.
    description: "Charles VII is crowned at Reims with Joan's banner beside him — her promise fulfilled."
    status: "first draft"
    sha256: "05fe22b1ce6681fc2514b80e76a3c3cc96817f7b9c511b6f44e4cacff9ef2e66"
  - number: "2205"
    volume: 4
    title: "The Maid Taken"
    date: "1430 CE"
    region: "France"
    poem: |
      Compiègne, in May. I was on the wall when it happened —
      the sortie failed, the gate shut too soon,
      and she was pulled from her horse in the ditch
      by Burgundian hands. The English paid for her
      like a prize horse: ten thousand livres.
      The King she crowned lifted not one finger.
      I have walked battlefields for a thousand years,
      but that closed gate at Compiègne still sickens me.
      She saved a kingdom. The kingdom saved its money.
    description: "Joan is captured at Compiègne and sold to the English — the king she crowned does nothing."
    status: "first draft"
    sha256: "a6e0196a99ca02bdcaa6227565ebef68f5c9860937caf844fc8d7b1375499e9f"
  - number: "2206"
    volume: 4
    title: "The First Woman of Letters Dies"
    date: "1430 CE"
    region: "France"
    poem: |
      I visited her in her last years, Christine de Pizan,
      widowed at twenty-five, who picked up a pen
      and made a living no woman had made before —
      writing for dukes and kings, in French, for pay.
      The City of Ladies: she built a whole fortress
      of women's worth, stone by stone, out of argument.
      She died as the Maid's trial began, too ill to know
      how the century would answer her book.
      I sat by her window. The first professional woman writer.
      The door she opened never closed again.
    description: "Christine de Pizan dies — the first woman to earn her living by the pen, leaving The Book of the City of Ladies."
    status: "first draft"
    sha256: "eb764ba7761c81c77c0167ec928ece652f5038ea66663c19e9804095eb294402"
  - number: "2207"
    volume: 4
    title: "The Fire at Rouen"
    date: "1431 CE"
    region: "France"
    poem: |
      May thirtieth. I stood in the Rouen marketplace
      and I could not look away this time, though I wanted to.
      Nineteen years old. They read the sentence,
      they lit the faggots, and she asked for a cross —
      a soldier broke a stick and bound it for her.
      Her last word was Jesus, cried out loud,
      three times, till the smoke took her voice.
      The English threw her ashes in the Seine,
      afraid the people would make relics.
      They were right to be afraid. We made them anyway.
    description: "Joan of Arc burns at Rouen, aged nineteen — her ashes thrown in the Seine, her memory made into legend."
    status: "first draft"
    sha256: "fca43177e1b1580be8dbb0a3018ee7f2818dfe78735bdcc32fd521f08b68b8a4"
  - number: "2208"
    volume: 4
    title: "The Western Isles"
    date: "1431 CE"
    region: "Atlantic"
    poem: |
      I sailed with the caravels into the empty ocean,
      past every chart's edge, till the lookout cried out —
      the Azores, nine green islands in the blue waste,
      a third of the way to nowhere, and uninhabited.
      We landed, we claimed them for Portugal and Christ,
      we let the goats loose and watched them multiply.
      Stepping stones. That's what they were:
      stones laid across the Atlantic toward a world
      no European had ever imagined.
      I stood on the black sand and felt the ocean shrink.
    description: "Portuguese sailors find the Azores far out in the Atlantic — stepping stones toward an unknown world."
    status: "first draft"
    sha256: "72ebcd32f137cfcf370a0a1eaf43d0e52d9e0542ebe3a07266c3b5ddf0f53a42"
  - number: "2209"
    volume: 4
    title: "The Admiral Dies at Sea"
    date: "1433 CE"
    region: "China"
    poem: |
      He died on the homeward leg, the great eunuch —
      Zheng He, somewhere in the Indian Ocean,
      his seventh voyage, and his last.
      I was aboard. We buried him at sea,
      or brought his body home — the records argue,
      as records do. What I know is the silence after:
      the fleet came home to Nanjing and never sailed again.
      The court mandarins had always hated the voyages —
      too costly, too strange, too full of the outside world.
      China turned its face to the wall and the sea went quiet.
      The greatest navy in history, beached by politics.
    description: "Zheng He dies on the homeward voyage — and China turns its back on the ocean forever."
    status: "first draft"
    sha256: "52a3a2de126587ed81c5c0c52c7666ef8352072fb2acf2d3f470e228bd479634"
  - number: "2210"
    volume: 4
    title: "The Dread Cape Passed"
    date: "1434 CE"
    region: "West Africa"
    poem: |
      Cape Bojador — the sailors called it the end of the world,
      where the sea boiled and the sun turned men black
      and ships that passed it never returned.
      Gil Eanes turned his little caravel south
      past the dread cape, past the terror, past the stories —
      and found only more sea, and a beach, and rosemary
      growing wild where no European had ever walked.
      I was on that beach. The fear broke that day
      like a fever breaks. After Bojador,
      there was no "too far" left on any map.
    description: "Gil Eanes rounds Cape Bojador, breaking the sailors' terror of sailing south."
    status: "first draft"
    sha256: "5338195a050cd45904470fb915f0712fe706b43d13ce6b156057c470a4331326"
  - number: "2211"
    volume: 4
    title: "The Banker Rules Florence"
    date: "1434 CE"
    region: "Italy"
    poem: |
      Cosimo de' Medici never took a title.
      I watched him run Florence from a back room of his bank,
      lending to popes, buying elections with loans,
      exiling his enemies with a vote he had purchased.
      He funded Brunelleschi's dome and Fra Angelico's brushes
      and called it patronage. It was — and it was power.
      The cleverest tyranny I ever saw:
      no crown, no throne, just a ledger
      and a smile, and the whole republic in his pocket.
    description: "Cosimo de' Medici takes quiet power in Florence — ruling a republic from a banker's back room."
    status: "first draft"
    sha256: "a92bfe0fd120dcabc15a014837288de4221bc9a7ee98ed9f82a9803cb8288366"
  - number: "2212"
    volume: 4
    title: "The Emperor of the Highlands"
    date: "1434 CE"
    region: "Ethiopia"
    poem: |
      I climbed to the highlands where Zara Yaqob ruled —
      an emperor who read theology and wrote it,
      who rebuilt the churches and reformed the courts
      and made the priests answer to the law like anyone.
      While Europe tore itself over popes,
      this Christian king in the African mountains
      was building a kingdom of order and faith,
      cut off from the world by desert and sea.
      He sent envoys to the Council of Florence, you know.
      The world was smaller than anyone thought —
      and bigger than anyone believed.
    description: "Zara Yaqob takes Ethiopia's throne and rebuilds church and law in the highland Christian kingdom."
    status: "first draft"
    sha256: "dd10c2472f4fc1fcb74de184ea041426d33a05fc6a3812498aebc1b296aba43d"
  - number: "2213"
    volume: 4
    title: "The Dome Complete"
    date: "1436 CE"
    region: "Italy"
    poem: |
      I climbed the scaffolding in the spring
      and watched them set the final stones —
      Brunelleschi's cupola, finished, floating
      over Florence like a red-tiled prayer.
      No scaffolding forest had held it. No one
      had built so wide a span since Rome fell.
      The masons wept. The old architect only nodded,
      as if he had seen it finished years before —
      which, in his mind, he had.
      I looked out from the lantern over Tuscany.
      The Renaissance had a roof now.
    description: "Brunelleschi's cupola crowns Florence's cathedral — the Renaissance gets its roof."
    status: "first draft"
    sha256: "bb57f71d98c804b96409ae7a045390cf5c842eab282f237f70f075377f7d376c"
  - number: "2214"
    volume: 4
    title: "The Poet King Slain"
    date: "1437 CE"
    region: "Scotland"
    poem: |
      They killed him at Perth in the night —
      James I of Scotland, the poet king,
      who had written verses in an English prison
      and come home to tame his wild lords.
      I heard the assassins break through the floorboards;
      the king fled to the sewer and they found him there.
      A king who wrote love poems, murdered in a drain.
      Scotland has never lacked for tragedy,
      but this one had a particular cruelty:
      the one ruler who might have civilized the kingdom,
      stabbed in the dark by the barbarism he fought.
    description: "James I of Scotland — the poet king — is murdered at Perth."
    status: "first draft"
    sha256: "681d27409f7c1433913f98190c75810c89d853f6e5fea5c00c0beae727d0a1e3"
  - number: "2215"
    volume: 4
    title: "The Earth-Shaker"
    date: "1438 CE"
    region: "Peru"
    poem: |
      Pachacuti — "he who shakes the earth."
      I was in Cuzco when he took the throne,
      and the shaking began at once: armies marching
      in every direction, roads unrolling over the Andes,
      storehouses rising, terraces climbing the mountains.
      He rebuilt the capital as the navel of the world
      and made the sun god's worship the empire's spine.
      In twenty years he forged the largest realm
      the Americas had ever seen — stone by stone,
      terrace by terrace, with no wheel and no iron.
      I walked his roads. They are still there.
    description: "Pachacuti becomes Sapa Inca — the Earth-Shaker — and the great Inca expansion begins."
    status: "first draft"
    sha256: "a3af7af24f376f90c48e26aeff8bf9cf88d9fabf18daf679d6ef91cd80e088ef"
  - number: "2216"
    volume: 4
    title: "The Forgery Exposed"
    date: "1440 CE"
    region: "Italy"
    poem: |
      I sat with Lorenzo Valla in his study
      while he took the Donation of Constantine apart —
      the document by which the popes claimed an empire,
      word by word, Latin by Latin, lie by lie.
      "This word didn't exist then. This title is wrong.
      This is fourth-century forgery wearing a crown."
      One scholar, one desk, one close reading —
      and eight hundred years of papal land-claims
      cracked like an old pot.
      I have seen armies do less damage than that essay.
      Truth, aimed properly, is the heaviest weapon.
    description: "Lorenzo Valla proves the Donation of Constantine a forgery — one essay cracks eight centuries of papal claims."
    status: "first draft"
    sha256: "69218c63ec758489febdef993ac6d0ffaadabdd6b115cfee5d7147c3cf8c3898"
  - number: "2217"
    volume: 4
    title: "The City of Bronze"
    date: "c.1440 CE"
    region: "Benin"
    poem: |
      Oba Ewuare raised the walls of Benin City —
      miles of earthworks, the largest in the world,
      they say, and inside them the bronze casters
      poured molten metal into the shapes of kings.
      I watched them work: the lost-wax method,
      clay and fire and patience, and out came heads
      so lifelike the Portuguese would cross an ocean for them.
      A city of red earth and bronze and order,
      deep in the forest, that Europe didn't know existed.
      It knew about Europe soon enough. That was the tragedy.
    description: "Oba Ewuare raises Benin City's great walls; its bronze casters flourish in the forest kingdom."
    status: "first draft"
    sha256: "c4dc453a7b40ffb0af9000d0b360cea2fcae1f3e79d7c6d28d473448115ec59a"
  - number: "2218"
    volume: 4
    title: "The First Cargo of Captives"
    date: "1441 CE"
    region: "Portugal"
    poem: |
      I was on the beach at Lagos when they landed them —
      Antão Gonçalves' captives, the first cargo,
      and Prince Henry's chronicler wrote it up as glory.
      I will not gild it. I saw the chains. I saw the faces.
      This was the dark dawn, the first morning
      of a trade that would swallow twelve million souls
      and stain four centuries.
      Every sugar crystal, every cotton boll,
      every fortune built on the Atlantic —
      it started here, on this sand, with these people in irons.
      Remember Lagos. Remember what the tide brought in.
    description: "The first captives land at Lagos — the Atlantic slave trade's dark dawn."
    status: "first draft"
    sha256: "842a58d627a0b9a74730623b7f9f1b3809f5e089448a121db5ae73096d2e0381"
  - number: "2219"
    volume: 4
    title: "The Oil Master Dies"
    date: "1441 CE"
    region: "Flanders"
    poem: |
      Jan van Eyck died in Bruges, and I went to the funeral —
      the man who taught paint to hold light.
      Oil, layer upon layer, glaze upon glaze,
      till a jewel on a painted finger outshone a real one.
      I had seen the Arnolfini portrait in his workshop:
      the mirror, the dog, the light on the floor —
      reality, caught and kept, better than memory.
      They buried him with honor. The whole of Europe
      was already copying his recipe.
      Seeing, I learned, is a technology. He upgraded it.
    description: "Jan van Eyck dies — the master whose oil paint taught Europe to see light."
    status: "first draft"
    sha256: "aa1fed0d4bf2ebe84e33d147b991e18ed9d003f83a04d459b36ec5f658bde5c5"
  - number: "2220"
    volume: 4
    title: "Naples Falls"
    date: "1442 CE"
    region: "Italy"
    poem: |
      I rode in with Alfonso of Aragon when Naples fell —
      not sacked, but taken, and made into something new:
      a glittering court where scholars and poets
      ate off silver and argued about Plato.
      He built the triumphal arch and filled the libraries
      and ruled the south with a humanist's flourish.
      Conquest as patronage. It almost worked.
      I walked his halls and heard Greek quoted at dinner.
      The Renaissance had a southern capital now —
      bought with an army, paid for in poetry.
    description: "Alfonso of Aragon storms Naples and makes it his glittering humanist court."
    status: "first draft"
    sha256: "d59dd8987744b738c9a5203176e951326c2b6b65356b6c0a8171eda32f4c3e45"
  - number: "2221"
    volume: 4
    title: "The Alphabet of the People"
    date: "1443 CE"
    region: "Korea"
    poem: |
      I sat with King Sejong in his study at night,
      and watched him draw the shapes that would free a nation:
      circles for the sun and moon, lines for earth and man —
      twenty-eight letters a farmer could learn in a day.
      The scholars were furious. "Chinese is the language of learning!"
      Sejong only smiled. "My people cannot speak to me in writing.
      I am giving them a voice."
      Hangul. The most scientific alphabet ever invented,
      born because a king loved his people more than tradition.
      I learned it in an afternoon. So could anyone.
    description: "King Sejong invents Hangul — an alphabet so simple a farmer can learn it in a day."
    status: "first draft"
    sha256: "5cad00057bbbab84e821d67ba6994e944803340bd3c708a3ff018aa872cb5a4e"
  - number: "2222"
    volume: 4
    title: "Varna"
    date: "1444 CE"
    region: "Balkans"
    poem: |
      November tenth, and the last crusade died in the fog —
      the young Polish king Wladyslaw charging the Ottoman center
      and vanishing into it, his head on a pike by evening.
      I fought in that line. I saw the cardinal's cross go down.
      Murad's janissaries stood like a wall of iron
      and the flower of Hungary and Poland broke on them.
      The Balkans were the Sultan's now, beyond dispute,
      and the road to Constantinople lay open and undefended.
      We had come to save Christendom's frontier.
      We buried it instead.
    description: "The last crusade dies at Varna — the young king's head on a pike, the Balkans lost to the Ottomans."
    status: "first draft"
    sha256: "9582cfb5b41e2a89d7f57e9aa6cbcd32d6db12b82652785f80799d390578c43b"
  - number: "2223"
    volume: 4
    title: "The Flowery Wars"
    date: "c.1445 CE"
    region: "Mexico"
    poem: |
      They called them the Flowery Wars — xochiyaoyotl —
      and I marched in one, spear in hand, heart hammering,
      not to conquer land but to harvest men:
      captives for the altars, blood for the sun.
      Under Moctezuma I the ritual battles grew,
      valley against valley, arranged like dances,
      and the priests waited at the top of the pyramids
      with their obsidian knives.
      The gods were hungry, the priests said.
      The empire fed them. I watched the flowers bloom red.
      Some gardens should never have been planted.
    description: "Aztec ritual Flower Wars feed captives to the gods under Moctezuma I."
    status: "first draft"
    sha256: "554a40a4a822bf692b159e5944831dd698190b4b40cf3275cb8c1c6007c94061"
  - number: "2224"
    volume: 4
    title: "The Pope of Books"
    date: "1447 CE"
    region: "Italy"
    poem: |
      Nicholas V — the pope of books.
      I walked the Vatican with him among the crates:
      manuscripts arriving from Constantinople,
      from the monasteries, from the dying Byzantine world —
      Greek texts no Latin eye had seen in a thousand years.
      He founded the library that would become the Vatican's,
      and dreamed of rebuilding Rome in marble.
      A scholar on St. Peter's throne, buying books
      while the Turks sharpened their swords for Constantinople.
      He knew. He bought the books anyway.
      Some rescues matter more than walls.
    description: "Nicholas V becomes pope and founds the Vatican Library — rescuing Greek manuscripts as Byzantium falls."
    status: "first draft"
    sha256: "cc7440a923f670fbe844b264bcc9b4eb3e72ee64bac681a9e214fa37ab54c750"
  - number: "2225"
    volume: 4
    title: "Kosovo Again"
    date: "1448 CE"
    region: "Balkans"
    poem: |
      Second Kosovo. I stood with Hunyadi's crusaders
      on the field where Serbia had died sixty years before,
      and watched it happen again — three days of slaughter,
      the Hungarian charge broken on the janissaries,
      the camp overrun, the crusade dissolved in blood.
      Murad II had beaten the flower of the West twice now,
      at Varna and here. There would be no third crusade.
      No army would march to save Constantinople.
      I left the field at dusk. The ravens were already at work.
      The Balkans belonged to the Sultan. Forever, it seemed.
    description: "Murad II crushes the crusaders at the second battle of Kosovo — no army will march to save Constantinople."
    status: "first draft"
    sha256: "6d7efa749f5864df67292e57a3c6dc2b21e9859aac97134bc0515dac4e19fb07"
  - number: "2226"
    volume: 4
    title: "The Last Emperor"
    date: "1449 CE"
    region: "Constantinople"
    poem: |
      I was there when Constantine XI took the throne —
      the last emperor of Rome, though no one called it that yet.
      His empire was a city, a few islands, a strip of Greece;
      his army could fit in a cathedral.
      He wrote to the West begging for help. The West sent
      a few hundred Genoese and a cardinal's blessing.
      I looked at this brave, doomed man on his shrunken throne
      and saw eleven centuries of Rome narrowing to a point.
      He would not run. He would not surrender.
      Four years. He had four years.
    description: "Constantine XI takes the throne of a dying Byzantium — emperor of a city, with four years left."
    status: "first draft"
    sha256: "d19b44e5421ff99422ec30f5fa56b66dfe970b2686d7ec41d85b2fdf4968bfa6"
  - number: "2227"
    volume: 4
    title: "The Mountain City"
    date: "c.1450 CE"
    region: "Peru"
    poem: |
      I climbed to Machu Picchu while they were building it —
      up the Inca Trail, through the Sun Gate at dawn,
      and the city unfolded below me in the clouds:
      temples and terraces fitted stone to stone,
      no mortar, no iron, just patience and gravity.
      Pachacuti's royal estate, they said, a place
      for the Inca to rest among the gods.
      The mist moved through the ruins-to-be like breath.
      I have seen the wonders of every age.
      Few have stopped my heart the way that morning did.
    description: "Machu Picchu rises in the clouds — the Inca's royal mountain estate, built stone to stone without mortar."
    status: "first draft"
    sha256: "a99ca04ac308a73236c4025d9a4a0376b69ac0acdb038f8fe8b41d715102ca9c"
  - number: "2228"
    volume: 4
    title: "The Law-Giving King"
    date: "c.1450 CE"
    region: "Siam"
    poem: |
      Trailokkanat of Ayutthaya — I sat in his council hall
      and watched him do what kings almost never do:
      write laws that bound the princes too.
      Land ranks, court ranks, the duties of officials,
      penalties for the mighty as well as the lowly —
      carved into the order of the kingdom.
      Siam had been a patchwork of lords. He made it a state.
      While Europe's kings were breaking laws,
      this king in the tropics was writing them down
      and daring his own nobles to disobey.
      Order, I learned, is a kind of mercy.
    description: "Trailokkanat of Ayutthaya writes laws binding princes and peasants alike."
    status: "first draft"
    sha256: "65fad86f202b9909190aa506458d23bbd3aad2921e89debc735414e6ebf9ec58"
  - number: "2229"
    volume: 4
    title: "The Young Sultan"
    date: "1451 CE"
    region: "Ottoman Empire"
    poem: |
      Nineteen years old. I watched Mehmed take the throne —
      a boy with a scholar's mind and a conqueror's hunger,
      who read Greek and dreamed, always dreamed,
      of the one city his fathers had never taken.
      Constantinople. The red apple. The prize
      that had mocked the Ottomans for a century.
      The old viziers smiled behind their hands.
      The boy sultan smiled back, and started building cannons.
      I had seen young conquerors before — Alexander's ghost
      walks every generation. This one had gunpowder.
    description: "Mehmed II, nineteen, takes the Ottoman throne — dreaming of Constantinople, building cannons."
    status: "first draft"
    sha256: "6561e5aa6f494e04e79d41c21ee75e331485ca9600773db7847005e7a9c46913"
  - number: "2230"
    volume: 4
    title: "A Queen Is Born"
    date: "1451 CE"
    region: "Spain"
    poem: |
      April twenty-second, at Madrigal de las Altas Torres —
      a girl, born to a widowed queen in a minor court,
      third in line, nobody's priority.
      I held her once, this Isabella, as a baby —
      impossible to know, looking at that small face,
      that she would fund the voyage that found a world,
      finish a seven-century war, and expel a people.
      History doesn't announce its favorites.
      It just lays them quietly in cradles
      and lets the centuries do the arithmetic.
    description: "Isabella of Castile is born — the baby who will fund a voyage to a new world and finish the Reconquista."
    status: "first draft"
    sha256: "1d10120a8ef13ce4d5e993abb61c5d80509c39d12182846a1b5ded6162ef812c"
  - number: "2231"
    volume: 4
    title: "A Genius Born"
    date: "1452 CE"
    region: "Italy"
    poem: |
      April fifteenth, in the hill town of Vinci —
      a boy, born out of wedlock to a notary,
      nobody special, nobody's heir.
      I was in the village that spring. The olive trees
      were flowering. A child cried in a farmhouse.
      Leonardo. They would call him genius,
      universal man, the greatest mind of the age —
      painter, engineer, anatomist, dreamer of flight.
      But that day he was only a baby,
      and the world had no idea it had just been given
      its most restless, most beautiful question mark.
    description: "Leonardo da Vinci is born at Vinci — the century's most restless mind, crying in a farmhouse."
    status: "first draft"
    sha256: "b12ed32d7561efd48b1db08c022a1951fd3d5d06f69d8a21903a785a9a42eb2b"
  - number: "2232"
    volume: 4
    title: "The Throat-Cutter"
    date: "1452 CE"
    region: "Bosphorus"
    poem: |
      Rumeli Hisarı — the Throat-Cutter.
      I watched them raise it on the Bosphorus narrows,
      a fortress in four months, stone on stone,
      its cannons commanding the strait.
      Every ship that passed paid the Sultan's toll
      or fed the fishes. Constantinople's lifeline —
      the grain ships from the Black Sea —
      was in Mehmed's fist now, and he was squeezing.
      The young sultan rode out to inspect the walls himself.
      I saw his face. He wasn't building a fortress.
      He was building a siege.
    description: "Mehmed builds Rumeli Hisarı on the Bosphorus — the Throat-Cutter — strangling Constantinople's lifeline."
    status: "first draft"
    sha256: "4eab37ca0f935b793f5286686834807593c58390e0ff1aa53a504b1f38bb90b7"
  - number: "2233"
    volume: 4
    title: "The City Falls"
    date: "1453 CE"
    region: "Constantinople"
    poem: |
      May twenty-ninth. I was on the walls at dawn
      when the final assault came — the janissaries
      through the breach the great cannon had made,
      and the Emperor — Constantine, the last —
      throwing off his purple and dying like a soldier
      in the crush at the St. Romanus gate.
      They found his body by the golden eagles on his boots.
      Eleven centuries of Rome ended that morning.
      I walked the streets at noon. The libraries were looted,
      the churches despoiled — and the scholars fled west,
      carrying Greek books in their baggage.
      The city fell. The Renaissance was born from the wreckage.
    description: "Mehmed II's cannons breach the walls on May 29 — Byzantium ends, and fleeing scholars carry Greek learning west."
    status: "first draft"
    sha256: "596c6dd55c529e70bda7c49b986e7626956a2a2968bc90b2c33931ea61afe5da"
  - number: "2234"
    volume: 4
    title: "The Hundred Years End"
    date: "1453 CE"
    region: "France"
    poem: |
      At Castillon in July the long war ended —
      not with a treaty but with cannon fire,
      the French guns cutting down Talbot's archers,
      the last English army in France.
      I walked the field where a hundred years of war
      lay down at last. England kept Calais —
      a toehold, a memory, a customs post.
      The longbow's century was over. The cannon's had begun.
      Two nations had bled each other white for generations
      over a crown, and neither crown was worth the cost.
      I was glad to see it end. Everyone was.
    description: "Castillon falls — the Hundred Years' War ends; England keeps only Calais."
    status: "first draft"
    sha256: "134107ff679740563e798dfe175852ccac0d9080ad1c1b9eb1773ca1f72bac53"
  - number: "2235"
    volume: 4
    title: "The Peace of Lodi"
    date: "1454 CE"
    region: "Italy"
    poem: |
      I was in Lodi when the diplomats signed it —
      Milan, Venice, Florence, Naples, the Pope,
      all agreeing, for once, to stop stabbing each other
      and balance their powers like weights on a scale.
      Forty years of calm followed. Forty years
      of bankers and painters and poets, of the Renaissance
      at full flower, because the swords were sheathed.
      It was a beautiful, fragile, cynical peace —
      and it worked, until a French king
      decided Italy was a prize worth taking.
      Enjoy the quiet, I told the artists. It never lasts.
    description: "The Italian states agree to the Peace of Lodi — forty years of calm, and the Renaissance at full flower."
    status: "first draft"
    sha256: "de90081d955871be90001ad82ec9a41c283ce7992b49c110e5ca634060cdc5cb"
  - number: "2236"
    volume: 4
    title: "The Roses' First Blood"
    date: "1455 CE"
    region: "England"
    poem: |
      St Albans, May twenty-second —
      the first blood of the Roses, spilled in a market town,
      York against Lancaster, cousin against cousin,
      over a mad king and an empty treasury.
      I watched the street fighting from a rooftop:
      men who had fought together in France
      now cutting each other down in an English street.
      Thirty years of it would follow — Towton, Barnet,
      Tewkesbury, Bosworth — the nobility of England
      methodically exterminating itself.
      The Wars of the Roses began that day.
      Nobody planted roses. Only graves.
    description: "York and Lancaster clash at St Albans — the Wars of the Roses begin, cousin against cousin."
    status: "first draft"
    sha256: "4cf578a66052f5532d24e507948c0da1dca40a77c1288c225159e37dc6af4bcc"
  - number: "2237"
    volume: 4
    title: "Belgrade Holds"
    date: "1456 CE"
    region: "Hungary"
    poem: |
      I stood on Belgrade's walls in the July heat
      with Hunyadi's peasants and priests —
      a crusade of farmers, really, blessed by a friar,
      against Mehmed's army fresh from Constantinople.
      The Sultan's cannons battered the walls for weeks.
      Then the counterattack: the Christians poured out,
      the Turkish camp was overrun, Mehmed himself wounded.
      The noon bell — you know the Angelus, rung at noon
      in every church in the world? It was ordered for this:
      to pray for Belgrade. The city held.
      The bells still ring. The city held.
    description: "Hunyadi hurls Mehmed's army back from Belgrade — the noon bell still rings for it."
    status: "first draft"
    sha256: "662809c93f3fb6b9168c1e97d0fd5a84a55f8a9a8012d9717e7dac79e7df3e3c"
  - number: "2238"
    volume: 4
    title: "The Printers Scatter"
    date: "c.1457 CE"
    region: "Germany"
    poem: |
      The Mainz press was seized for debt —
      Gutenberg's creditor took the type, the presses,
      everything, and the workmen scattered.
      I followed them: to Strasbourg, to Bamberg,
      to Subiaco in Italy, to Paris —
      each one carrying the secret in his hands,
      the punch and matrix, the ink and the press.
      A bankruptcy became a diaspora.
      Within twenty years there were presses in a hundred cities.
      They tried to lock up the printing press with a lawsuit.
      Instead they mailed it to the world.
    description: "Gutenberg's press is seized for debt — his scattered workmen carry the printing secret across Europe."
    status: "first draft"
    sha256: "97192ed0b017e4593e7362b73f581aae55140db5ed1e2876f51c95f0ca97fcc6"
  - number: "2239"
    volume: 4
    title: "The Pope Who Wrote Novels"
    date: "1458 CE"
    region: "Italy"
    poem: |
      Aeneas Silvius Piccolomini — poet, diplomat,
      author of a bestselling dirty novel —
      became Pope Pius II, and I laughed out loud
      in St. Peter's when they announced it.
      A humanist on the throne of St. Peter!
      He wrote histories, geographies, love letters,
      and then, dying, tried to launch a crusade —
      dragged himself to Ancona to wait for ships
      that never came.
      The Renaissance had reached the papacy itself.
      Whether the papacy survived the Renaissance
      is another question.
    description: "The humanist Aeneas Silvius — novelist, poet, diplomat — becomes Pope Pius II."
    status: "first draft"
    sha256: "b1138e0260487fb5e3ac0f6248c53b06352532b2680c5f5c8e2c83be72a1ae9e"
  - number: "2240"
    volume: 4
    title: "The Monk's World Map"
    date: "c.1459 CE"
    region: "Venice"
    poem: |
      I visited Fra Mauro in his monastery on Murano —
      a monk who never traveled, drawing the whole world.
      His great circular map: Jerusalem off-center now,
      the world round-ish, Asia vast, Africa circumnavigable —
      sailors' reports stitched into vellum with gold.
      "Here the ships of the south sail around Africa,"
      he wrote, years before anyone in Europe proved it.
      A monk in a cell, mapping oceans he'd never seen,
      and getting it right.
      Knowledge doesn't need a ship. Sometimes it just needs
      a monk who listens to sailors.
    description: "Fra Mauro completes his great circular world map — drawn by a monk who never traveled, from sailors' tales."
    status: "first draft"
    sha256: "1d80c2d209fb4ba037089b3ee146b140eed0f39c55718240ec3884b4264a3be7"
  - number: "2241"
    volume: 4
    title: "The Navigator Dies"
    date: "1460 CE"
    region: "Portugal"
    poem: |
      November thirteenth. Henry the Navigator died
      at Sagres, on his windy cliff, never having sailed
      farther than Morocco himself.
      I stood at his funeral and looked at the men around him —
      sailors, mapmakers, captains who had rounded capes
      he only dreamed of. He never left Portugal.
      He sent the world instead.
      The caravels sailed on without him, year after year,
      farther south, past every fear.
      Some men discover continents. He discovered discoverers.
    description: "Henry the Navigator dies at Sagres — the man who never sailed far, but sent the world to sea."
    status: "first draft"
    sha256: "0d41b7bd26569236d3b0ea86bc0ca19c51b67836e5f119e187b63bb8111ef72b"
  - number: "2242"
    volume: 4
    title: "Cape Verde Found"
    date: "1460 CE"
    region: "Atlantic"
    poem: |
      Diogo Gomes sailed past the desert's edge
      and found the green islands — Cape Verde,
      ten volcanic jewels off the African coast,
      where the Sahara finally surrenders to the tropics.
      I went ashore with the landing party:
      goats, vines, and the first Portuguese settlers,
      building a waystation on the road south.
      Every voyage needs a last safe harbor.
      Cape Verde became the hinge of the Atlantic —
      the door through which the caravels passed
      on their way to India, and to everything after.
    description: "Diogo Gomes claims the Cape Verde islands — the last safe harbor on the road south."
    status: "first draft"
    sha256: "10a5e95af11f4daf4db5ff5b5d71469f40cade4961374664fcefca01ae1ea3a4"
  - number: "2243"
    volume: 4
    title: "Towton"
    date: "1461 CE"
    region: "England"
    poem: |
      March twenty-ninth, Palm Sunday, in a snowstorm —
      the bloodiest battle ever fought on English soil.
      I stood in the sleet with Edward's Yorkists
      and watched the Lancastrian line break and run,
      and the pursuit went on for miles through the snow.
      Twenty-eight thousand dead. The snow ran red,
      they said, and the rivers ran red for days.
      Edward IV took the crown over a field of corpses.
      The Wars of the Roses had found their rhythm now:
      not battles, but exterminations.
      I have seen worse days. Not many.
    description: "Towton — the bloodiest battle on English soil — makes Edward IV king in a snowstorm of slaughter."
    status: "first draft"
    sha256: "83cae950a7bc4998f1247a3593038a567399081f01810bccb2af0b72fc4854d4"
  - number: "2244"
    volume: 4
    title: "Trebizond Falls"
    date: "1461 CE"
    region: "Anatolia"
    poem: |
      Trebizond — the last splinter of Byzantium,
      eight years after Constantinople fell,
      still flying the double eagle on the Black Sea.
      I was there when Mehmed's army surrounded it
      and the emperor surrendered without a siege —
      David Komnenos, handing over his city and his crown.
      The Sultan was merciful, at first. Then he wasn't.
      The last Roman emperor in the east
      died a prisoner, with his sons.
      Eleven centuries of Rome, and it ended
      not with a battle but a signature.
    description: "Trebizond, the last Byzantine splinter, surrenders to Mehmed II — Rome's eastern story ends with a signature."
    status: "first draft"
    sha256: "66e5b397e18a8ed5049982df9ccec035f511ce5896950c280540e80316524b3a"
  - number: "2245"
    volume: 4
    title: "Ivan the Great"
    date: "1462 CE"
    region: "Russia"
    poem: |
      I was in Moscow when Ivan III took the throne —
      twenty-two years old, and already planning
      to gather the Russian lands like sheaves of wheat:
      Novgorod, Tver, one by one, by marriage or by siege.
      He rebuilt the Kremlin in brick, hired Italian architects,
      and stopped paying tribute to the Mongols —
      quietly, at first, then openly.
      The gatherer of Russia. The first to call himself
      sovereign of all Rus.
      I watched him for forty-three years.
      He never lost a war he started. He started many.
    description: "Ivan III takes Moscow's throne and begins gathering the Russian lands."
    status: "first draft"
    sha256: "eeee4f8a84c8ce7bd4350447cb1ac579fcfdfd5703ab9c5044da90bd32453790"
  - number: "2246"
    volume: 4
    title: "The Academy Reborn"
    date: "1462 CE"
    region: "Italy"
    poem: |
      Cosimo de' Medici gave Marsilio Ficino a villa at Careggi
      and a task: translate Plato — all of him —
      into Latin, for the first time in a thousand years.
      I sat in the garden while the young scholar worked,
      the Tuscan hills behind him, antiquity before him.
      When the translations came, Florence drank them like wine:
      the Symposium at dinner parties, the Republic in council.
      Plato walked the streets of Florence again,
      two thousand years after Athens.
      Ideas, I learned, are the only immigrants
      no city ever turns away.
    description: "Ficino translates Plato for the Medici — antiquity walks the streets of Florence again."
    status: "first draft"
    sha256: "09ad42a883752eed98242c19c46691f876166ea3deded93c071d1f67ae4a09c7"
  - number: "2247"
    volume: 4
    title: "The Impaler's Night Attack"
    date: "1462 CE"
    region: "Wallachia"
    poem: |
      I rode with Vlad the Impaler on the night attack —
      through the dark toward the Sultan's camp,
      the torches, the confusion, the screaming horses —
      aiming straight for Mehmed's own tent.
      We missed him. The Sultan had moved his pavilion.
      But the terror of it — a prince of a tiny mountain land
      striking at the conqueror of Constantinople in the night —
      shook the Ottoman army to its bones.
      Vlad. The Impaler. History remembers the stakes,
      the forests of the punished outside his castles.
      I remember the courage. Both were real. Both were terrible.
    description: "Vlad the Impaler raids the Sultan's camp by night — missing Mehmed's tent, but shaking an empire."
    status: "first draft"
    sha256: "14f5791a83049126335dac83d4219af202d5f1405171bf2d7f85e8f15cb5c6ac"
  - number: "2248"
    volume: 4
    title: "The Lion King of Songhai"
    date: "1464 CE"
    region: "West Africa"
    poem: |
      Sunni Ali took the throne at Gao —
      the Lion King of Songhai, and I watched him build
      an empire on the Niger's flood: Timbuktu, Djenné,
      the great trading cities, taken one by one.
      He was a warrior first, a sorcerer-king to his people,
      a terror to the scholars of Timbuktu.
      But the empire he forged on horseback and by canoe
      would become, under his successor, a kingdom of books.
      The Niger carried gold and salt and slaves.
      It would soon carry something rarer: learning.
    description: "Sunni Ali takes Gao's throne — the Lion King — and an empire rises on the Niger."
    status: "first draft"
    sha256: "88621aa5d28393315553e5ed40a54ea9ede6b98f44c68247030c947fc6d1597d"
  - number: "2249"
    volume: 4
    title: "The Crusade That Never Sailed"
    date: "1464 CE"
    region: "Italy"
    poem: |
      Pius II dragged his dying body to Ancona —
      the humanist pope, sixty years old, sick,
      waiting on the docks for the crusade fleet
      that would sail against the Turks.
      I stood beside him in the August heat.
      The ships didn't come. Venice stalled.
      The old pope looked out at the empty harbor
      and died there, of disappointment as much as disease.
      The last crusade never sailed.
      It died on a dock, with a pope watching the horizon
      for sails that never appeared.
    description: "Pius II dies at Ancona, waiting on the docks for a crusade fleet that never comes."
    status: "first draft"
    sha256: "1225402c284cab3c9a16d3efd16d899452707afa8a9466ffe5cb4f5f01d301b2"
  - number: "2250"
    volume: 4
    title: "The Press Crosses the Alps"
    date: "1465 CE"
    region: "Italy"
    poem: |
      Two German monks set up their press at Subiaco —
      in a monastery in the Italian hills, of all places —
      and Italy learned movable type.
      I watched them pull the first Italian sheets:
      the letters clean, the ink black, the pages multiplying
      like loaves and fishes.
      Within five years there were presses in Rome, Venice, Milan.
      Within twenty, Italy printed more books than the rest
      of Europe combined.
      The monks thought they were copying church fathers.
      They were copying the future.
    description: "German printers set up at Subiaco — Italy learns movable type, and soon outprints all Europe."
    status: "first draft"
    sha256: "1f4a037c1d161bd1cb5804309a0ee896b4751bc6ed1f13ebd0690fb95834aebb"
  - number: "2251"
    volume: 4
    title: "The Fool's Champion Born"
    date: "1466 CE"
    region: "Holland"
    poem: |
      October twenty-eighth, in Rotterdam —
      a boy, born out of wedlock, nobody's heir,
      who would become the most famous scholar in Europe.
      Erasmus. I held him as a baby — impossible to know,
      looking at that small face, that he would mock
      popes and princes with a pen dipped in laughter,
      and write the Praise of Folly that made all Europe grin
      at its own reflection.
      The fool's champion. The prince of the humanists.
      Another nobody's child, another world-changer.
      The century was collecting them.
    description: "Erasmus of Rotterdam is born — the scholar who will mock popes and princes with laughter."
    status: "first draft"
    sha256: "e88eb4f1a347c24901a396e1893f30fcfc5e5c1a06dca04fe4c3c7611e41271a"
  - number: "2252"
    volume: 4
    title: "The Onin War Begins"
    date: "1467 CE"
    region: "Japan"
    poem: |
      Kyoto burned. I watched it burn for ten years —
      the Onin War, shogun's heir against shogun's heir,
      and the great families chose sides and marched on the capital,
      and the capital became a battlefield.
      Temples, palaces, libraries — ash.
      When it ended, nobody had won. The shogun was a figurehead,
      the daimyo were warlords, and Japan slid
      into a century of warring states.
      A hundred years of swords. I walked those provinces
      and learned: when the center fails, the edges sharpen.
    description: "The Onin War begins — Kyoto burns, and Japan slides into a century of warring states."
    status: "first draft"
    sha256: "171d82f67d5ad1f8d69280051ee5433a07777edeeb2079506b2e3a14d1408b7e"
  - number: "2253"
    volume: 4
    title: "The Marriage That Made Spain"
    date: "1469 CE"
    region: "Spain"
    poem: |
      October nineteenth, at Valladolid —
      Isabella of Castile, eighteen, married Ferdinand of Aragon,
      sixteen, in secret, against her brother's wishes.
      I was at the wedding feast. Two teenagers,
      two kingdoms, one borrowed crown's worth of ceremony —
      they even had to forge the papal dispensation.
      Nobody in that hall imagined what they were witnessing:
      the founding of Spain, the funding of Columbus,
      the Inquisition, the empire on which the sun never set.
      Two kids, a secret wedding, and the world tilted.
    description: "Isabella and Ferdinand wed in secret — the marriage that will make Spain."
    status: "first draft"
    sha256: "b5dc78b7fd279e2b1a7bfad894a14a323914295253801dd46a282f7984b6960f"
  - number: "2254"
    volume: 4
    title: "The Roman Letter"
    date: "1470 CE"
    region: "Italy"
    poem: |
      Nicolas Jenson cut his roman type in Venice —
      clear, even, beautiful letters, the shape of carved stone
      made for the printed page.
      I held one of his books. The type was so clean
      it looked handwritten by a perfect scribe —
      except there were a thousand copies, all identical.
      This is the letter you're reading now, more or less.
      Five and a half centuries later, Jenson's shapes
      still carry every word on every page.
      A Frenchman in Venice, cutting punches in steel,
      designed the alphabet of the modern world.
    description: "Nicolas Jenson cuts the clear roman type that books still wear today."
    status: "first draft"
    sha256: "5d51dbc55ba1baab77c5ded0e7e81236808db8610f50827fcf7d21c2fa527ff1"
  - number: "2255"
    volume: 4
    title: "The Painter of Spring"
    date: "c.1470 CE"
    region: "Italy"
    poem: |
      Young Botticelli opened his workshop in Florence —
      I was there for the first commissions, the first Madonnas,
      the line already unmistakable: flowing, musical, alive.
      He would paint the Spring, the Birth of Venus —
      pagan gods walking in Christian Florence,
      beauty as a kind of theology.
      The Medici paid. The city watched.
      I stood before the Primavera years later
      and felt what everyone feels: that beauty
      is the one argument no one can answer.
      He was twenty-five when he opened the shop.
      The spring was coming.
    description: "Young Botticelli opens his Florence workshop — the painter of Spring is coming."
    status: "first draft"
    sha256: "70112f98d856ba1d7452688cd2636034ec3b026d5216bc73c001d91ae0d67a3d"
  - number: "2256"
    volume: 4
    title: "The Inca's Heir Marches"
    date: "1471 CE"
    region: "Peru"
    poem: |
      Topa Inca Yupanqui — Pachacuti's son —
      carried the empire to its greatest reach:
      north to Quito, south past the Atacama,
      the largest realm the southern hemisphere had ever seen.
      I marched with his armies over passes
      so high the llamas staggered, and watched engineers
      lay roads straighter than any Roman's.
      No wheel. No iron. No writing.
      Just organization on a scale Europe couldn't imagine —
      storehouses, census-takers, relay runners,
      an empire run like a perfect machine.
    description: "Topa Inca Yupanqui carries the Inca Empire to its greatest reach — north to Quito, south past the desert."
    status: "first draft"
    sha256: "2a3c327710b7ccfda6b327fb048f94e1845f941ea06a34589e79d3e649d874df"
  - number: "2257"
    volume: 4
    title: "Barnet and Tewkesbury"
    date: "1471 CE"
    region: "England"
    poem: |
      Two battles, one spring, and the Lancastrian cause died —
      Barnet in the fog on April fourteenth,
      Warwick the Kingmaker falling in the mist,
      his own men killing him by mistake;
      then Tewkesbury in May, the prince of Wales dead,
      the queen in flight, the red rose trampled.
      Edward IV stood master of England at last.
      I walked both fields. The fog at Barnet
      was the worst I ever fought in — men killing friends,
      banners lost, orders drowned.
      The Wars of the Roses weren't over. But Lancaster was.
    description: "Edward IV destroys the Lancastrian cause at Barnet and Tewkesbury — the red rose is trampled."
    status: "first draft"
    sha256: "16b7644085307d7abfaa81aa3ad31799725d58fe57006c14990cd0fc82e5ccae"
  - number: "2258"
    volume: 4
    title: "The Bank That Never Closed"
    date: "1472 CE"
    region: "Italy"
    poem: |
      In Siena they opened the Monte dei Paschi —
      a bank for the common people, lending against pledges,
      and it never closed. Not once. Not in five hundred years.
      I was there on opening day: farmers and artisans
      lining up, suspicious of bankers, hopeful anyway.
      Wars came. Plagues came. Republics fell.
      The little bank in Siena kept its doors open
      through all of it — the oldest surviving bank on earth.
      Money, I learned, is trust with a ledger.
      Siena's ledger never lied.
    description: "The Monte dei Paschi opens at Siena — the world's oldest surviving bank, open ever since."
    status: "first draft"
    sha256: "38556ca71b82faaa537b5d82c2059e7e5672b80f11959901216634bdd8b785a3"
  - number: "2259"
    volume: 4
    title: "The Byzantine Bride"
    date: "1472 CE"
    region: "Russia"
    poem: |
      Ivan III wed Sophia Palaiologina —
      niece of the last Byzantine emperor,
      a princess of a fallen empire, married to a rising one.
      I was at the wedding in Moscow. She brought with her
      the double eagle, the court ritual, the idea
      that Moscow was the Third Rome —
      two Romes fallen, a third standing, and a fourth there shall not be.
      The Kremlin's architects came from Italy.
      Its ideology came from Constantinople's ashes.
      Russia put on Byzantium's crown
      and never took it off.
    description: "Ivan III weds the Byzantine princess Sophia — Moscow claims the mantle of the fallen empire."
    status: "first draft"
    sha256: "b8fb2d0e8a57cb610a5be82be1b3177708d0fdda84b2d85de64d313331e94732"
  - number: "2260"
    volume: 4
    title: "The Astronomer Born"
    date: "1473 CE"
    region: "Poland"
    poem: |
      February nineteenth, at Toruń —
      a boy, born to a merchant family,
      who would move the earth itself.
      Copernicus. I held him as a baby — impossible to know
      that this child would one day write the book
      that picked up the whole universe and set it down
      with the sun in the middle.
      He waited till he was dying to publish.
      The church waited seventy years to forgive him.
      But the earth has been moving around the sun ever since,
      whether anyone believed it or not.
    description: "Nicolaus Copernicus is born at Toruń — the baby who will move the earth around the sun."
    status: "first draft"
    sha256: "bea9506d60c2698ec339a311b901372ddbf16628fe3c607a3b9c5f7980bf6bdf"
  - number: "2261"
    volume: 4
    title: "The Englishman Prints"
    date: "1473 CE"
    region: "Flanders"
    poem: |
      William Caxton — a London mercer, a diplomat —
      set up his press at Bruges and printed
      the first book in the English language:
      the Recuyell of the Historyes of Troye.
      I watched him pull the sheets. He wasn't a scholar;
      he was a businessman who saw that English readers
      would pay for English books.
      He was right. Within three years he'd be home,
      printing at Westminster, and the English language —
      that mongrel tongue of farmers and sailors —
      would have its press, its standard, its future.
      Every English book descends from that Bruges shop.
    description: "Caxton prints the first book in English at Bruges — the mongrel tongue gets its press."
    status: "first draft"
    sha256: "4b56f956376169dca7ab929d180746e9e3c7bdd865109dfa14bf8fadce031821"
  - number: "2262"
    volume: 4
    title: "A Queen Crowned"
    date: "1474 CE"
    region: "Spain"
    poem: |
      December, at Segovia — Isabella took the throne of Castile,
      twenty-three years old, and half the kingdom
      disputed her right. Civil war followed, four years of it,
      till the Portuguese claimant was beaten at Toro.
      I watched her ride through her kingdom afterward —
      not a figurehead, but a ruler, signing, judging, commanding,
      with Ferdinand beside her, never above her.
      She had seized a crown the way you seize a sword:
      by the hilt, with both hands.
      Spain's greatest queen began as a disputed heir.
    description: "Isabella takes Castile's throne at twenty-three — a disputed heir who seizes her crown with both hands."
    status: "first draft"
    sha256: "94eeab2d8bfcddbd8131215a3d0410e914b2d81883d88d89384c1944abcc0592"
  - number: "2263"
    volume: 4
    title: "The Carver Born"
    date: "1475 CE"
    region: "Italy"
    poem: |
      March sixth, at Caprese, in the Apennines —
      a boy, born to a minor official,
      who would carve marble like it was flesh.
      Michelangelo. I held him as a baby — impossible to know
      that those tiny hands would free David from the stone,
      paint God on a chapel ceiling,
      and design the dome of St. Peter's.
      He lived to eighty-eight, outlived popes and princes,
      and worked till the end, hammer in hand.
      The century was collecting its giants.
      This one was made of marble dust and fury.
    description: "Michelangelo is born at Caprese — the baby whose hands will free David from the stone."
    status: "first draft"
    sha256: "e9df93cb61ea7483fbe2d81ec7126f84cdd71be13b26f1bad44d5ad458a522c1"
  - number: "2264"
    volume: 4
    title: "The Swiss Pike"
    date: "1476 CE"
    region: "Switzerland"
    poem: |
      Grandson and Morat — I fought with the Swiss,
      farmers with eighteen-foot pikes, standing shoulder to shoulder,
      and watched them destroy Charles the Bold,
      the richest duke in Europe, twice in one year.
      His Burgundian knights, his artillery, his pride —
      all broken on a hedgehog of mountain farmers.
      The pike square had arrived. Cavalry's long reign
      was ending, one disciplined square at a time.
      After Morat, every king in Europe wanted Swiss mercenaries.
      The farmers of the Alps became the most feared infantry
      in the world — and stayed that way for centuries.
    description: "Swiss pikemen crush Charles the Bold at Grandson and Morat — the age of the pike square begins."
    status: "first draft"
    sha256: "38b11c1c0383fca045af353f911fe47eaf4158d4f5dd6c12b9fb753a7e6efec8"
  - number: "2265"
    volume: 4
    title: "The Printer Comes Home"
    date: "1476 CE"
    region: "England"
    poem: |
      Caxton came home. I helped him unload the press at Westminster —
      the type, the ink, the paper, the whole Bruges shop,
      rebuilt under the sign of the Red Pale in the shadow of the abbey.
      The first book off an English press: Chaucer's Canterbury Tales.
      English readers had never held their own language
      fresh from the type. They bought it by the hundreds.
      I watched a monk turn the pages, marveling.
      The press had crossed the Channel.
      England would never be the same — and neither would English.
    description: "Caxton sets up his press at Westminster — the first English press prints Chaucer."
    status: "first draft"
    sha256: "dfad1f1551dc9ec0db85b3392e0d55cac8c76bf186fc5d3166ad1dfa370ee169"
  - number: "2266"
    volume: 4
    title: "The Duchess Alone"
    date: "1477 CE"
    region: "Burgundy"
    poem: |
      Mary of Burgundy — nineteen, alone,
      inheriting the richest duchy in Europe
      when her father died at Nancy, his body found
      frozen in a ditch, half-eaten by wolves.
      I was at her court in Ghent. The vultures circled:
      France seized Burgundy proper; the Habsburgs
      married her for the rest — Maximilian, eighteen,
      and the Netherlands passed to Austria.
      The great middle kingdom, the dream of a Burgundian state
      between France and Germany, was carved up like a feast.
      She died at twenty-five, thrown from a horse.
      The duchess alone. The prize divided.
    description: "Mary of Burgundy inherits at nineteen — the great duchy is carved up between France and the Habsburgs."
    status: "first draft"
    sha256: "8c447bd75eaf85c18a21d830e698f1e24034f8db16eadfc2bf8b12acdd03c0aa"
  - number: "2267"
    volume: 4
    title: "The Inquisition Begins"
    date: "1478 CE"
    region: "Spain"
    poem: |
      Ferdinand and Isabella got their papal bull —
      the Spanish Inquisition, to purify the kingdoms,
      to hunt the conversos, the secret Jews, the heretics.
      I will not dress this one in poetry.
      I saw the first autos-da-fé. I heard the sentences read
      in the plazas. Torquemada's machine would grind
      for three hundred years — torture, exile, fire —
      all in the name of a God of love.
      Spain bought its unity with terror.
      The bill is still being paid, in memory if nothing else.
    description: "Ferdinand and Isabella win papal leave for the Spanish Inquisition — three centuries of terror begin."
    status: "first draft"
    sha256: "4c033cbf21b5d2c6eb70495aea45e250b144c8ec99a7862e75e52640b4fa54c8"
  - number: "2268"
    volume: 4
    title: "Blood in the Cathedral"
    date: "1478 CE"
    region: "Italy"
    poem: |
      Easter Mass, in the Florence cathedral —
      I was in the congregation when the Pazzi struck,
      daggers out during the elevation of the Host,
      Giuliano de' Medici stabbed nineteen times
      on the cathedral floor, his brother Lorenzo
      fighting his way to the sacristy, bleeding.
      The plot failed. Florence rose for the Medici.
      The conspirators were hanged from the Palazzo windows —
      I watched them kick.
      The Pope had blessed the plot. Think of that:
      murder at the altar, with Rome's approval.
      The Renaissance had a dark side. This was it, in blood.
    description: "The Pazzi stab Giuliano de' Medici at Easter Mass — murder at the altar, with Rome's blessing."
    status: "first draft"
    sha256: "3b03e0a7b486a3ed5e257fb261523801a35c0604856fcf48ea2cc37178dcdddb"
  - number: "2269"
    volume: 4
    title: "Two Crowns, One Throne"
    date: "1479 CE"
    region: "Spain"
    poem: |
      Ferdinand inherited Aragon, and it was done —
      two crowns, one throne, one Spain,
      though they ruled it as partners, never as one:
      her Castile, his Aragon, their kingdoms side by side.
      I watched them hold court together at Toledo,
      two monarchs on two thrones, equal in everything
      but the law that kept their realms distinct.
      It was a union, not a merger — and it worked.
      From this double throne would come Granada,
      Columbus, the Inquisition, the empire.
      Spain stood united. The world was about to feel it.
    description: "Ferdinand inherits Aragon — Spain stands united under two monarchs, and the world is about to feel it."
    status: "first draft"
    sha256: "a13c17e9624e14ee9cbd182ea5488384db246094cd112c8f7593c9f26bc953ba"
  - number: "2270"
    volume: 4
    title: "The Gold of Mina"
    date: "1479 CE"
    region: "West Africa"
    poem: |
      The caravels came home heavy — Guinea gold,
      the Mina trade, gold dust by the chestful,
      traded on the African coast for cloth and brass.
      I watched them unload at Lisbon: the king's fifth,
      the merchants' fortunes, the goldsmiths' delight.
      Portugal's age of discovery paid for itself in gold
      before it ever found the spice.
      But every ounce had a shadow: the same ships,
      the same coast, the same captains —
      and the human cargo in the hold below the gold.
      The Mina trade boomed. So did the other trade.
    description: "Portuguese caravels haul Guinea gold home — the Mina trade booms, and pays for the age of discovery."
    status: "first draft"
    sha256: "bd9fd176f99186081d5c05d6eb7b8f245bf262ba5adbcbb10485b084b9593501"
  - number: "2271"
    volume: 4
    title: "The Mongol Yoke Breaks"
    date: "1480 CE"
    region: "Russia"
    poem: |
      At the Ugra River the two armies faced each other —
      Ivan's Russians on one bank, the Horde's Tatars on the other —
      and neither would cross. Weeks of staring.
      Then the Horde melted away in the night, unpaid, unfed,
      and two hundred years of Mongol rule over Russia
      ended without a battle.
      I stood on the riverbank at dawn, watching the empty far shore.
      The yoke broke quietly. No trumpets. No slaughter.
      Just an army that walked away, and a nation
      that realized it was free.
      Some liberations are loud. This one was a silence.
    description: "Ivan III faces the Horde at the Ugra — it melts away, and two centuries of Mongol rule end without a battle."
    status: "first draft"
    sha256: "bc76f6ce16eab449875a4657f678ce563efc63c009f3417af94d4f5ef88fe57f"
  - number: "2272"
    volume: 4
    title: "The Flying Machines Dreamed"
    date: "c.1480 CE"
    region: "Italy"
    poem: |
      I peered over Leonardo's shoulder in his Milan workshop —
      notebooks filling with wings: bat wings, bird wings,
      screws of canvas meant to bite the air and lift a man.
      War engines too — tanks, machine guns, diving suits —
      and anatomy: the heart's valves, the unborn child,
      drawn with a precision no doctor had ever seen.
      He built almost nothing. He dreamed everything.
      Mirror-writing, right to left, the pages piling up —
      five thousand pages of the future, in a dead man's hand.
      I read them by candlelight. The man was living
      in the twenty-first century, trapped in the fifteenth.
    description: "Leonardo fills his notebooks with flying machines, war engines, and anatomy — the future, in mirror-writing."
    status: "first draft"
    sha256: "724e1be40ab1198acd9ec99b075783c5b6e4140524ed058d34e1841370dd06f1"
  - number: "2273"
    volume: 4
    title: "The Conqueror of Constantinople Dies"
    date: "1481 CE"
    region: "Ottoman Empire"
    poem: |
      Mehmed II died on campaign — fifty, worn out,
      poisoned or sick, the rumors flew at once —
      the Conqueror, the man who took Constantinople,
      dead in a tent with his army around him.
      I was in the capital when the news came.
      The city held its breath: which son? Bayezid or Cem?
      The succession tore the court apart — brother against brother,
      one fleeing to the Christians, a pawn for the Pope.
      The empire Mehmed built by conquest
      nearly died of succession.
      It didn't. But it learned: the throne needs a law.
    description: "Mehmed II dies — the Conqueror gone, his sons tear the court apart over the succession."
    status: "first draft"
    sha256: "3e6cc0c05d91e7cbc40817524475b190257861191d23f0545521d1e9556516e9"
  - number: "2274"
    volume: 4
    title: "The Chapel Walls Begin"
    date: "1481 CE"
    region: "Rome"
    poem: |
      They were painting the new Sistine Chapel's walls —
      not Michelangelo yet, not the ceiling, just the walls:
      Botticelli, Perugino, Ghirlandaio, Rosselli,
      Moses and Christ in facing panels, the life of the law
      against the life of grace.
      I watched them work on the scaffolds, these masters,
      each trying to outdo the others, fresco by fresco.
      Nobody knew the ceiling would one day
      eclipse everything they painted.
      But the walls were glorious first —
      the Renaissance at prayer, in color,
      before the thunder came.
    description: "Painters cover the new Sistine Chapel's walls with the lives of Moses and Christ."
    status: "first draft"
    sha256: "8d2dbc3677898238a55603fced05b193769cfebc2ff4e3fd873f0f0e6618435a"
  - number: "2275"
    volume: 4
    title: "The Stone Castle on the Gold Coast"
    date: "1482 CE"
    region: "West Africa"
    poem: |
      São Jorge da Mina — I watched them raise it at Elmina,
      stone by stone, the first European fortress
      in sub-Saharan Africa, cannons facing the sea,
      warehouses facing the gold.
      The Portuguese called it a trading post.
      It was a fortress, a factory, and — soon enough —
      a dungeon with a Door of No Return.
      I walked its courtyard when the mortar was still wet.
      The gold flowed through it for centuries.
      So did the people in chains.
      Stone remembers. The castle still stands.
    description: "Portugal raises São Jorge da Mina at Elmina — fortress, trading post, and future slave dungeon."
    status: "first draft"
    sha256: "e8e65ee11d2e8d01a96b73debe2ccc131635fd71fcf713ecdcb6ba522b3d34b7"
  - number: "2276"
    volume: 4
    title: "The Princes in the Tower"
    date: "1483 CE"
    region: "England"
    poem: |
      Richard III took the crown — and his nephews,
      Edward twelve and Richard nine, went into the Tower
      and never came out.
      I was in London that summer. The boys were seen
      in the garden, then at the windows, then not at all.
      The rumors started before autumn: smothered, drowned,
      buried under the stairs — two skeletons were found there
      two centuries later, small bones in a wooden chest.
      Richard ruled two years. History has never forgiven him.
      Whether he did it or not, the Tower kept its secret —
      and the princes kept their silence.
    description: "Richard III takes the crown — his young nephews vanish into the Tower, never to emerge."
    status: "first draft"
    sha256: "6132ce2bc6970b6e3ce1fda18d80b0956246e32d4fad26b11584eb0f6c42aeb5"
  - number: "2277"
    volume: 4
    title: "The Monk Born"
    date: "1483 CE"
    region: "Germany"
    poem: |
      November tenth, at Eisleben, in Saxony —
      a boy, born to a copper miner,
      who would split the church in half.
      Martin Luther. I held him as a baby — impossible to know
      that this miner's son would nail paper to a church door
      and bring down a thousand years of Rome's authority.
      He would translate the Bible, marry a nun,
      defy an emperor, and unleash wars of religion
      that would drown Europe in blood for a century.
      But that November day he was only a baby crying,
      and the church stood unshakeable.
    description: "Martin Luther is born at Eisleben — the miner's son who will split the church in half."
    status: "first draft"
    sha256: "7b77ba14a230edf232dee2efabed29b2bbdccb7d2201881cef5560d45d78c3fa"
  - number: "2278"
    volume: 4
    title: "Crosses Down the Coast"
    date: "1484 CE"
    region: "West Africa"
    poem: |
      Diogo Cão sailed past the Congo's mouth —
      a river so wide he thought he'd found the sea's source —
      and planted stone crosses down Africa's shore:
      padrões, carved with the king's arms and the date,
      markers of Portugal's claim on the unknown.
      I helped raise one on a headland —
      the cross standing against the Atlantic wind,
      the surf below, the continent stretching south
      farther than any European had ever gone.
      Each cross said: we were here. Portugal claims this.
      The coast collected them like milestones
      on the road to India.
    description: "Diogo Cão sails past the Congo, planting stone crosses down Africa's shore as Portugal's claim-markers."
    status: "first draft"
    sha256: "7484747216c0c452deb2b5fb7c66854a934e95cb277f286c5b8ae6074c3087f5"
  - number: "2279"
    volume: 4
    title: "Bosworth Field"
    date: "1485 CE"
    region: "England"
    poem: |
      August twenty-second — I stood in Richard's army
      at Bosworth, and watched the crown of England
      roll in the mud under a hawthorn bush.
      Richard fought like a lion, unhorsed, on foot,
      crying treason as his allies deserted him —
      and Henry Tudor's men cut him down.
      They found the crown in a thorn bush
      and set it on Henry's head on the field.
      The Tudors began. The Plantagenets ended.
      Thirty years of Roses, over in a day.
      I picked up a broken lance afterward.
      The Middle Ages ended at Bosworth, they say. They're right.
    description: "Henry Tudor kills Richard III at Bosworth — the crown found in a hawthorn bush, the Tudors begin."
    status: "first draft"
    sha256: "9bba8432cf04541cd6b8281ea6fa76beaab3a0dbac4dd514ff0af2cbad384496"
  - number: "2280"
    volume: 4
    title: "The Jaguar Throne"
    date: "1486 CE"
    region: "Mexico"
    poem: |
      Ahuitzotl took the jaguar throne —
      the Aztecs' great conqueror-king, and I marched
      with his armies down to the Pacific and south to Guatemala,
      doubling the empire in sixteen years.
      He rebuilt the Great Temple at Tenochtitlan
      and dedicated it with sacrifices on a scale
      that still horrifies: thousands, the chronicles say,
      in four days of blood.
      The empire reached its height under him —
      and its height was a pyramid of skulls.
      I watched the dedication. The drums never stopped.
      Power, at its peak, so often looks like this.
    description: "Ahuitzotl becomes the Aztecs' great conqueror-king — doubling the empire, dedicating the Great Temple in blood."
    status: "first draft"
    sha256: "47d98cc552bbaf36d29082c31218cb2f99855cf1b8b082568e6f9f023b663be1"
  - number: "2281"
    volume: 4
    title: "The Cape of Storms Rounded"
    date: "1488 CE"
    region: "Africa"
    poem: |
      Bartolomeu Dias rounded it — the Cape of Storms,
      the southern tip of Africa, in a tempest
      that nearly took his ships — and found
      the ocean opening eastward beyond.
      I was aboard. We had been at sea for months,
      the crew near mutiny, the stores running low,
      and then the coast turned north, and we knew:
      the sea road to India lay open.
      Dias called it the Cape of Storms.
      The king renamed it the Cape of Good Hope.
      Both names were true.
    description: "Bartolomeu Dias rounds the Cape of Good Hope — the sea road to India lies open."
    status: "first draft"
    sha256: "2862e82efc10a832955f60fd18c4f133627cdcfbee8d1eda991067229a9c6e7c"
  - number: "2282"
    volume: 4
    title: "Granada Falls"
    date: "1492 CE"
    region: "Spain"
    poem: |
      January second — I watched Boabdil ride out
      of the Alhambra, the last Muslim king in Iberia,
      and hand the keys to Ferdinand and Isabella.
      Seven hundred and eighty-one years of al-Andalus
      ended with a signature and a sigh —
      the chroniclers say he wept at the pass,
      and his mother told him: weep like a woman
      for what you could not defend like a man.
      The Reconquista was over. Spain was whole.
      I walked the Alhambra's empty courts that evening.
      The fountains still played. The kings were gone.
    description: "The last Muslim kingdom in Iberia surrenders — Granada falls, and the 781-year Reconquista ends."
    status: "first draft"
    sha256: "e53603f75bc5424dc4628704f4ac0e75acb80b50368a6b254d522c7855009c60"
  - number: "2283"
    volume: 4
    title: "The Admiral of the Ocean Sea"
    date: "1492 CE"
    region: "Atlantic"
    poem: |
      October twelfth. I was in the rigging of the Pinta
      when Rodrigo de Triana cried "Tierra!" —
      land, after thirty-three days of empty ocean,
      and Columbus wept and named it San Salvador.
      He thought it was Asia. It wasn't.
      It was a whole new world — two continents
      no European had ever imagined —
      and he never understood what he'd found.
      I went ashore with the landing party that morning.
      The Taino watched us from the trees.
      Everything after — the gold, the guns, the dying —
      started on that beach, with that misunderstanding.
    description: "Columbus reaches the Americas on October 12 — thinking it Asia, finding a whole new world."
    status: "first draft"
    sha256: "71c194d349fb1de4b4ac7f07bbae43e90e9d800d1c54380f23aac29f199550b1"
  - number: "2284"
    volume: 4
    title: "The Exile"
    date: "1492 CE"
    region: "Spain"
    poem: |
      The same year as the ships sailed west,
      Spain's Jews were given a choice: convert or leave.
      I was at the ports that summer —
      families boarding ships with everything they could carry,
      the keys to their houses in their pockets,
      keys their descendants would keep for five hundred years.
      Two hundred thousand exiles. Scholars, doctors,
      merchants, poets — Spain cut out its own heart
      and watched it walk away.
      They carried their house keys, and their language,
      and their grief, across the sea and the centuries.
      Some doors, once locked from the outside, never open.
    description: "Spain's Jews are expelled — a people scatter across the world, carrying their house keys for five centuries."
    status: "first draft"
    sha256: "648bd9f1199ccb275637f8318de61b4bf06ca4a3ea92953f0fdffabc78e6d433"
  - number: "2285"
    volume: 4
    title: "Askia the Great"
    date: "1493 CE"
    region: "West Africa"
    poem: |
      Askia Muhammad seized Songhai —
      not by birth but by merit, a general taking the throne,
      and built an empire of scholars and gold:
      Timbuktu's universities, Djenné's mosques,
      the law of Islam from the Niger to the Sahara.
      I studied in Timbuktu under his reign —
      the libraries, the astronomers, the jurists,
      manuscripts by the thousand in private houses.
      While Europe stumbled toward the Renaissance,
      this African empire was already a kingdom of books.
      Askia made the pilgrimage to Mecca, a king among kings.
      The gold of the Sudan flowed north. The learning flowed everywhere.
    description: "Askia Muhammad seizes Songhai and builds an empire of scholars and gold, with Timbuktu's universities at its heart."
    status: "first draft"
    sha256: "b5bc2f5fe3ae968bb18c27f7144488d7eaac524fda6d12a389e5f859197837c4"
  - number: "2286"
    volume: 4
    title: "The Last Great Inca"
    date: "1493 CE"
    region: "Peru"
    poem: |
      Huayna Capac took the throne at the empire's height —
      the last great Inca, though no one knew it then.
      I traveled his realm: four quarters, ten million people,
      roads running like veins through the Andes,
      storehouses full, the sun god honored from Quito to Chile.
      He pushed the frontier north, into the forests,
      where the empire finally met its limit —
      and its doom, though it came as a fever,
      not an army: the plagues from the east,
      running ahead of the Spaniards.
      The greatest empire in the Americas,
      at its peak, with the clock already ticking.
    description: "Huayna Capac takes the throne at the Inca Empire's height — its greatest extent, with the clock already ticking."
    status: "first draft"
    sha256: "c17306bd96e110b711a7d811e3605e2843e13132e3150f50eacf4d1d79173c45"
  - number: "2287"
    volume: 4
    title: "The Line in the Ocean"
    date: "1493 CE"
    region: "Rome"
    poem: |
      The pope drew a line in the ocean —
      Inter Caetera, Alexander VI's bull,
      splitting the undiscovered world between Spain and Portugal:
      everything west of the line for Spain, east for Portugal.
      I was in Rome when it was proclaimed.
      Two kingdoms, one pope, and the whole planet
      divided like a pie — without asking a single person
      who actually lived on any of it.
      The arrogance of it still stuns me:
      a line drawn on water, carving up continents
      the ink hadn't even dried on.
      Portugal protested. The line moved. The theft continued.
    description: "The pope draws a line splitting the undiscovered world between Spain and Portugal — continents divided like a pie."
    status: "first draft"
    sha256: "bbd3237700aa64def2b5cd0f1c457e263c005a4938134d7651b0e4bf35608cfe"
  - number: "2288"
    volume: 4
    title: "The Treaty Line Moves"
    date: "1494 CE"
    region: "Atlantic"
    poem: |
      June seventh, at Tordesillas —
      Spain and Portugal moved the pope's line west,
      370 leagues west of the Cape Verde islands,
      and neither of them knew what they'd done:
      the bulge of South America — Brazil —
      fell on Portugal's side.
      I was there when they signed. Two diplomats,
      a map, a line shifted on paper —
      and half a continent changed owners
      before any European had seen it.
      The treaty held for centuries. The line on the map
      became a line in the language, the law, the blood.
      Brazil speaks Portuguese because of a pen stroke in 1494.
    description: "Tordesillas shifts the dividing line west — Brazil falls to Portugal by a pen stroke on a map."
    status: "first draft"
    sha256: "001d9fd1bac2c7a94eb0d1c76ebbdfbdb56cd0ed732dc0dd0c47b75ed42c786b"
  - number: "2289"
    volume: 4
    title: "The Pocket Book Inventor"
    date: "1494 CE"
    region: "Italy"
    poem: |
      Aldus Manutius set up his press in Venice —
      and changed what a book could be:
      small, clean, in italic type, cheap enough
      to fit in a saddlebag and a student's purse.
      I bought one of his pocket Virgils, fresh off the press —
      the classics, portable, for the first time in history.
      He invented the paperback, the italic, the semicolon —
      the furniture of reading we still use.
      Venice was drowning in printers, but Aldus
      wasn't printing books. He was printing readers.
      The Renaissance, pocket-sized, for anyone with a coin.
    description: "Aldus Manutius sets up his Venetian press — inventing the pocket book, the italic, and the modern reader."
    status: "first draft"
    sha256: "e8187cd43702df48beeb85cc652b619cb1ddf7c233af88ff57f2ed416f168f3a"
  - number: "2290"
    volume: 4
    title: "The New Found Land"
    date: "1497 CE"
    region: "Atlantic"
    poem: |
      John Cabot sailed from Bristol — a Venetian
      sailing for England, looking for Asia —
      and found the coast of North America instead:
      Newfoundland, the "new found land,"
      its waters so thick with cod, they said,
      you could scoop them up in baskets.
      I was aboard the Matthew. Eighteen men,
      fifty days at sea, and a continent.
      England's claim on the New World began here —
      with a Genoese captain, an English flag,
      and fish enough to feed a kingdom.
      The cod would build empires. The claim would build more.
    description: "John Cabot claims North America for England — eighteen men, a small ship, and waters thick with cod."
    status: "first draft"
    sha256: "e79b17697eec7d0e838d6eae452189a8a8189c0dd97794a989850e43b2059850"
  - number: "2291"
    volume: 4
    title: "The Cape Doubled"
    date: "1497 CE"
    region: "Africa"
    poem: |
      Vasco da Gama rounded the Cape in November —
      I was on the São Gabriel, watching the southern stars
      wheel over seas no European ship had ever crossed:
      the long run up the African coast, the monsoon leap
      to India, guided by an Arab pilot's knowledge.
      Dias had found the way around. Da Gama
      was sailing it — all the way, to the spice itself.
      The Indian Ocean opened before us like a treasure chest.
      Nine years after Dias, the dream was real:
      Europe was about to reach the riches of the East by sea.
    description: "Vasco da Gama rounds the Cape of Good Hope in November — the voyage to India is truly underway."
    status: "first draft"
    sha256: "8aeb1492bae8dee58eb122c9e18a391acdff6cb5ba0850fdb7c8ca2bc22d82d2"
  - number: "2292"
    volume: 4
    title: "The Sea Road Found"
    date: "1498 CE"
    region: "India"
    poem: |
      May, and we made Calicut — I stood on the deck
      and watched India rise out of the heat haze:
      the pepper warehouses, the Arab dhows, the crowds,
      the spice that had traveled ten thousand miles by land
      now reachable by sea.
      Da Gama's men had sailed thirty thousand miles.
      The cargo they brought home would pay for the voyage
      sixty times over.
      The old roads trembled — the caravans, the middlemen,
      the whole ancient machinery of the spice trade —
      because the sea road was open now, and the sea
      doesn't charge tolls to sultans.
    description: "Da Gama reaches Calicut in May — the sea road to India is found, and the old spice roads tremble."
    status: "first draft"
    sha256: "9b44ddd740d8227c619bf874af600bfcfa93f82a81862438e6153e5e5baba9a5"
  - number: "2293"
    volume: 4
    title: "The Friar's Fire"
    date: "1498 CE"
    region: "Italy"
    poem: |
      May twenty-third — they burned Savonarola in Florence,
      the friar who had burned the vanities:
      paintings, books, mirrors, dice, wigs —
      piled in the Piazza della Signoria and set alight.
      I watched the bonfire of the vanities burn.
      Then I watched them burn him — hanged first,
      then the flames, his followers with him.
      He had ruled Florence like a prophet, denounced the Pope,
      called down God's wrath on the corrupt —
      and the wrath came down on him instead.
      The ashes went in the Arno, like Joan's in the Seine.
      Florence went back to its bankers and its painters.
      The fire was over. The smoke lingered.
    description: "Savonarola burns at Florence — the bonfire of the vanities ends with the friar's own fire."
    status: "first draft"
    sha256: "76daa9037d93895803ea36eb3e98e43b2a8643be5d968c0d1dfeb09d2a293c36"
  - number: "2294"
    volume: 4
    title: "The New Coast"
    date: "1500 CE"
    region: "Brazil"
    poem: |
      I stood on the beach when the caravels came,
      Thirteen white sails out of the blue —
      The Tupi watched from the palm shade,
      And the Portuguese knelt and named it new.
      Cabral raised a cross where the river meets the sea,
      Claimed a whole green world with a wooden sign;
      The land was ancient, but on their maps
      That morning, Brazil was born mine.
      I heard the surf, I smelled the salt and wood,
      And knew: this green shore would not stay green —
      Ships would come and come and never stop,
      Till the forest's giants went unseen.
    description: "Portuguese ships land on Brazil's coast and claim the vast green land for their king, while the native people watch from the trees."
    status: "first draft"
    sha256: "adbcc6a8eba0b6e41d50839f911301daa58fbca5ecda1a9b026633ca28530e6b"
  - number: "2295"
    volume: 4
    title: "The India Road"
    date: "1500 CE"
    region: "Portugal"
    poem: |
      Cabral lost ships to storm and wreck,
      But thirteen limped to Calicut's shore —
      Thirteen guns, a treaty, pepper bought,
      And the long road open evermore.
      Around the Cape, past the Cape's cold storms,
      A ribbon of ocean held in hand:
      Portugal's highway to the Indies' gold,
      Drawn across water, not on land.
      I watched them load the holds with spice,
      Black pepper worth its weight in gold —
      The road was theirs, the sea was theirs,
      And the old world bought what the new world sold.
    description: "Cabral's fleet reaches India, locking in Portugal's long sea lane around Africa to the spice trade."
    status: "first draft"
    sha256: "2112508c1f524c979aa737ae2b87f203c3ffdef9fc7bc035281e1c87b40ac0e1"
  - number: "2296"
    volume: 4
    title: "The Scholar's City"
    date: "1500 CE"
    region: "West Africa"
    poem: |
      In Timbuktu the market sells books like grain —
      Manuscripts stacked in the morning sun,
      Astronomy, law, the prophet's words,
      Copied by hand, every one.
      Under Askia the Great the scribes keep time,
      The mosques are full, the lamps burn late;
      A book is worth a horse, they say,
      And learning is the city's freight.
      I walked those streets of mud and gold,
      Heard scholars argue in the shade —
      While Europe's presses were just learning,
      Here the word of God was bought and weighed.
    description: "Under Askia the Great, Timbuktu's book markets and libraries make Songhai the pride of West Africa."
    status: "first draft"
    sha256: "05e4209507b18ea5c4c7c430fc5cd812bdf8c0b80f8b3725837b81e6bc5b4f96"
  - number: "2297"
    volume: 4
    title: "The Red Crown"
    date: "1501 CE"
    region: "Persia"
    poem: |
      A boy of fourteen with a red-capped army,
      Ismail rides into Tabriz at dawn —
      He takes the crown, he takes the city,
      And the old Sunni order is gone.
      "Shi'a!" his soldiers cry, their turbans red,
      A faith made steel, an empire born;
      Persia will pray to the Prophet's kin
      And stand against the Turk's cold scorn.
      I saw the boy-king's eyes — half saint, half sword —
      And the poets singing at his feet.
      An empire raised on sacred fire;
      Persia, reborn, stands at his heat.
    description: "Young Shah Ismail seizes Tabriz and founds Safavid Persia, a Shi'ite empire born on the sword."
    status: "first draft"
    sha256: "49f4d1f02c214ac8d3b005759f7b418c20ce8287d7e1778cd0df226de0b23c0e"
  - number: "2298"
    volume: 4
    title: "The Sleeping Giant"
    date: "1501 CE"
    region: "Italy"
    poem: |
      A mountain of marble stood in Florence,
      Abandoned, flawed, nineteen feet high —
      Two carvers had walked away from it.
      Then a young man, Michelangelo, looked it in the eye.
      He saw inside the stone a giant sleeping,
      A boy with a sling, about to fight —
      Seventeen feet of David, every muscle taut,
      Staring down Goliath in the Florentine light.
      I watched the chips fall for three long years,
      The hammer ringing like a bell —
      Out of the stone a shepherd stepped,
      And all of Florence knew him well.
    description: "Michelangelo begins carving the seventeen-foot David in Florence — a boy carved from marble, staring down a giant."
    status: "first draft"
    sha256: "359b408e65731eca54921508eebc0787f16210effe15e41987fbcbd1f14967f9"
  - number: "2299"
    volume: 4
    title: "Letters That Run"
    date: "1501 CE"
    region: "Venice"
    poem: |
      In Venice, Aldus set a new kind of type —
      Slanted letters, leaning fast,
      Small pages a traveler could pocket,
      Books built to ride, not just to last.
      Italic — the hurry of a handwritten hand,
      Pressed into lead, printed by the score;
      Virgil and Horace in saddlebags,
      Classics riding out the door.
      I held one — light as a folded map —
      And felt the world get small and near:
      Learning, once chained to desks and stone,
      Now ran beside the cavalier.
    description: "Aldus Manutius prints the first pocket books in slanted italic type, made to be carried in saddlebags."
    status: "first draft"
    sha256: "d0d64571343036c60b119c706894d114b3c7501f623a739f392b2f0f16b72e0a"
  - number: "2300"
    volume: 4
    title: "The Last Voyage"
    date: "1502 CE"
    region: "Atlantic"
    poem: |
      Four leaky ships, one broken dream —
      Columbus sailed his last road west,
      Searching for straits that weren't there,
      His luck, his gold, his fame unblest.
      Worms ate the hulls off Panama's coast,
      The sea turned cruel, the men turned thin —
      He ran aground in Jamaica's bay
      And waited a year for rescue to begin.
      I saw him there: gray, sick, undone,
      Writing letters that begged the crown —
      The Admiral of the Ocean Sea,
      Shipwrecked in a world he'd found.
    description: "Columbus sails his fourth and final voyage, ending stranded for a year in Jamaica, a broken admiral in the world he found."
    status: "first draft"
    sha256: "1dcb75c35b7aa55463eba017e9d0d39d3321e1a5a927861dc9ee01cb5d15badd"
  - number: "2301"
    volume: 4
    title: "The Lady with the Smile"
    date: "1503 CE"
    region: "Italy"
    poem: |
      Leonardo took up his brush in Florence
      To paint a merchant's quiet wife —
      Lisa del Giocondo, hands folded,
      Ordinary as ordinary life.
      But layer by layer, the smile came,
      Half here, half gone, like morning mist —
      No one could say what she was thinking,
      And nobody has, since she was kissed by paint.
      I stood behind him in the studio,
      Watched thirty years of glances grow —
      The most famous face in all the world,
      And nobody truly knows.
    description: "Leonardo begins painting Lisa del Giocondo — the portrait the world will call the Mona Lisa, and her unknowable smile."
    status: "first draft"
    sha256: "1fa5746d607f5b321e063b8555b3bfe0e5dde991762b022825f1e7945b2dd552"
  - number: "2302"
    volume: 4
    title: "A Queen's Death"
    date: "1504 CE"
    region: "Spain"
    poem: |
      Isabella died in Medina del Campo,
      The iron queen who paid for ships and war —
      She left her crown to Juana, her daughter,
      Whose mind was slipping from the shore.
      They called the daughter Juana the Mad,
      Locked away her living years —
      The queen who launched a thousand sails
      Ended in her daughter's tears.
      I stood outside the dying chamber,
      Heard the prayers, the bells' slow chime —
      An age went out with that old woman,
      And Spain marched on without her time.
    description: "Isabella of Castile dies, leaving her unstable daughter Juana heir to the Spanish crown."
    status: "first draft"
    sha256: "c8b6e8554340def7328e148b325298f5f3a4d20d4d6cd4363cdf16cd7c897eac"
  - number: "2303"
    volume: 4
    title: "The First Viceroy"
    date: "1505 CE"
    region: "India"
    poem: |
      Almeida sailed from Lisbon with twenty ships
      And a title never held before —
      Viceroy of the Indies, lord of pepper,
      Ruling trade by cannon's roar.
      No more quiet bargaining in the ports,
      No more bribes along the shore —
      Portugal would tax the Indian Ocean
      With gunpowder behind every door.
      I watched the fleet drop anchor at Cochin,
      The soldiers landing rank on rank —
      An empire not of land but water,
      And pepper was the bank.
    description: "Francisco de Almeida sails as Portugal's first viceroy of the Indies, to rule the pepper trade by cannon."
    status: "first draft"
    sha256: "6699bb960f9774fc1271a93531b613abf6029687064acdc1548c08983be60575"
  - number: "2304"
    volume: 4
    title: "The Grand Stone"
    date: "1506 CE"
    region: "Vatican"
    poem: |
      Julius stood where the old church crumbled,
      The warrior pope with a builder's dream —
      He laid the first stone of a new St. Peter's,
      Bigger than Rome had ever seen.
      Domes that would swallow the Pantheon,
      A church to dwarf the ancient town —
      They'd sell indulgences to pay for it,
      And that sale would shake his crown.
      I heard the trowel tap the cornerstone,
      Felt the ambition in the air —
      A pope building heaven out of marble,
      While thunder gathered everywhere.
    description: "Pope Julius II lays the first stone of a new St. Peter's Basilica, meant to dwarf old Rome."
    status: "first draft"
    sha256: "f76df545156353305bcca90616dad55f580f40c21723f0e2b7d7b8832be8b3b5"
  - number: "2305"
    volume: 4
    title: "The Christian King"
    date: "1506 CE"
    region: "Kongo"
    poem: |
      Afonso took the Kongo throne as a Christian,
      Baptized, crowned, a Catholic king —
      He wrote to the pope in Latin letters,
      Asking priests and teachers to bring.
      In Africa, a cross on the royal standard,
      A church beside the king's own door —
      While Europe fought its wars of faith,
      The Kongo knelt and asked for more.
      I read his letters in the archives,
      Dignified, shrewd, and sad —
      A king who loved the Christian word
      But watched his nobles turn to trade — in men.
    description: "Afonso I takes the Kongo throne and writes to the pope as a Catholic king in Africa, even as the slave trade grows around him."
    status: "first draft"
    sha256: "02825312d86dc25ccdcf176483e155735fda13f76db1a216ecc82588e59d4742"
  - number: "2306"
    volume: 4
    title: "The Name America"
    date: "1507 CE"
    region: "Germany"
    poem: |
      In a small German town, a printer's press
      Stamped out a map the world had never seen —
      A new continent drawn on paper,
      And under it, a brand-new name: AMERICA.
      Not Columbus, who had sailed it first,
      But Amerigo Vespucci, who wrote it well —
      The letters of a Florentine traveler
      Outweighed the Admiral's bell.
      I held that map, the ink still fresh,
      And laughed at how the world is made —
      Not by who finds it, but by who names it,
      And the name that never fades.
    description: "A small German press prints the first map to call the New World \"America,\" after Amerigo Vespucci's letters."
    status: "first draft"
    sha256: "77ca7206030bfedc3934c536a4c2d9c162f13643eaff7bead69251decd2f1144"
  - number: "2307"
    volume: 4
    title: "The Ceiling of Heaven"
    date: "1508 CE"
    region: "Vatican"
    poem: |
      Michelangelo climbed the scaffold stairs,
      Cursing the pope with every breath —
      He was a carver, not a painter,
      But Julius would not take no for death.
      Sixty-eight feet above the floor,
      On his back, with paint in his eyes,
      He began the story of the world —
      God reaching down through painted skies.
      I lay beside him on the planks one night,
      Watched the lamplight on wet paint —
      A man making heaven out of plaster,
      Half angel, half complaint.
    description: "Michelangelo climbs the Sistine scaffold and begins painting Genesis overhead, on his back, high above the chapel floor."
    status: "first draft"
    sha256: "e3caacf32cbc751e0c46de7a79301c883512d7381c438c785a08f2c0d9c896a2"
  - number: "2308"
    volume: 4
    title: "The Golden Boy King"
    date: "1509 CE"
    region: "England"
    poem: |
      Seventeen, six feet of golden muscle,
      Henry took the English throne —
      Handsome, athletic, laughing loud,
      A Renaissance prince fully grown.
      He jousted, hunted, wrote love songs,
      The ladies sighed, the court applauded —
      Europe's brightest, boldest boy-king,
      By every herald lauded.
      I saw him ride through London's streets,
      The crowds throwing flowers at his feet —
      No one guessed the fat old tyrant
      Hiding in that golden heat.
    description: "Seventeen-year-old Henry VIII takes the English throne — handsome, athletic, and hungry for glory."
    status: "first draft"
    sha256: "0e937bb48da56e0bdb9d12565834c99a66513643a10019ce68aa9256e9bff832"
  - number: "2309"
    volume: 4
    title: "The Battle of Diu"
    date: "1509 CE"
    region: "India"
    poem: |
      Off Diu the Mamluk fleet lay waiting,
      Egyptian ships with Turkish guns —
      Almeida's son was dead, and vengeance
      Sailed with the rising sun.
      The Portuguese carracks closed like wolves,
      Their broadsides spoke in iron thunder —
      By dusk the Mamluk fleet was broken,
      The Indian Ocean torn asunder.
      I smelled the powder on the water,
      Heard the timbers crack and groan —
      One battle, and the sea changed masters:
      The ocean was Portugal's own.
    description: "Portugal smashes a Mamluk fleet off Diu and seizes mastery of the Indian Ocean in a single day of cannon fire."
    status: "first draft"
    sha256: "71d72da08bf47cb4b06c29b00c31d62b341ba91db05a91ce68bed505b63f2fbf"
  - number: "2310"
    volume: 4
    title: "The School of Athens"
    date: "1510 CE"
    region: "Italy"
    poem: |
      Raphael painted thinkers on a Vatican wall —
      Plato pointing up to the sky,
      Aristotle pressing his hand earthward down,
      The whole debate of "what" and "why."
      Euclid bends over his compass,
      Diogenes sprawls on the stair —
      Two thousand years of arguing minds
      Gathered in painted air.
      I stood in that room of frescoed stone,
      And felt the old questions start —
      Every age has asked them since:
      The mind, the world, the heart.
    description: "Raphael paints philosophers debating in the Vatican — Plato and Aristotle at the center of the School of Athens."
    status: "first draft"
    sha256: "d5028b6b7dd761759f748cec9b7615bab9802b81648663f1edceb8de9cad1f73"
  - number: "2311"
    volume: 4
    title: "The City of Spices"
    date: "1510 CE"
    region: "Goa"
    poem: |
      Albuquerque stormed the walls of Goa,
      Twice he took it, blood and fire —
      And made it Portugal's eastern capital,
      The seat of the spice empire.
      From Goa the fleets would sail each year,
      To Malacca, Hormuz, and beyond —
      A city of churches on an Asian shore,
      Built on cannon, bound by bond.
      I walked its streets of stone and palm,
      Heard Portuguese bells ring out —
      An empire's capital in the tropics,
      Where the monsoons turned about.
    description: "Afonso de Albuquerque storms Goa and makes it Portugal's capital of the Indian Ocean."
    status: "first draft"
    sha256: "8492201608f4abd798f2dca39f7b7120d574d0624be0be62f0c2d577a55e06c0"
  - number: "2312"
    volume: 4
    title: "The Key of the East"
    date: "1511 CE"
    region: "Malacca"
    poem: |
      Malacca sat where the straits run narrow,
      Where China's junks and India's met —
      The key of the East, the traders called it,
      The richest lock the ocean set.
      Albuquerque broke it with nineteen ships,
      His cannon spoke from dawn to night —
      The sultan fled into the jungle,
      And Portugal held the strait's tight might.
      I saw the warehouses burst with spice,
      Cloves and nutmeg, silk and gold —
      Who holds Malacca holds the East:
      A saying the sailors told.
    description: "Albuquerque seizes Malacca, the great strait port where all of Asia's trade funnels through."
    status: "first draft"
    sha256: "9ce47f983ec0f33959fe62d4574a210f0c4a53c11649fa5497350b663fd42151"
  - number: "2313"
    volume: 4
    title: "The Ceiling Finished"
    date: "1512 CE"
    region: "Vatican"
    poem: |
      Four years on his back, and then —
      The scaffolds came down, the candles lit,
      And Rome looked up and gasped aloud
      At what the angry carver had writ.
      Nine scenes from Creation to the Flood,
      God's finger reaching for man's hand —
      The whole of Genesis overhead,
      In color no one could withstand.
      I was there when they uncovered it,
      Heard the silence, then the roar —
      A ceiling that made painters weep
      And kings feel small once more.
    description: "Michelangelo uncovers the Sistine ceiling — nine scenes from Creation to Noah, painted in four years on his back."
    status: "first draft"
    sha256: "69b7f5ec3a0dca2d96ac727491face687a9f961809c08dd064125c8b4e0bcf5b"
  - number: "2314"
    volume: 4
    title: "The Grim Son"
    date: "1512 CE"
    region: "Ottoman Empire"
    poem: |
      Selim took the throne from his old father,
      Forced him down, then poisoned the cup —
      Eight brothers' sons were strangled after,
      So no rival could rise up.
      Cold, ruthless, reading Persian verse
      Between the orders for the knife —
      They called him Yavuz, the Grim, the Stern,
      A sultan who dealt in life.
      I watched him pray at dawn in Istanbul,
      His face a mask of stone —
      The empire's sword had found its hand,
      And mercy was unknown.
    description: "Selim I seizes the Ottoman throne — cold, ruthless, and called \"the Grim,\" clearing rivals without mercy."
    status: "first draft"
    sha256: "5365d8f95c518a6bce7f5cf6ca56877d631658261ba8c5eeb797089250125688"
  - number: "2315"
    volume: 4
    title: "The Prince's Mirror"
    date: "1513 CE"
    region: "Italy"
    poem: |
      In exile on his little farm,
      Machiavelli wrote by candlelight —
      A handbook for the men who rule,
      Cold counsel in the night.
      Be feared, not loved, if you must choose,
      Keep promises when they pay —
      The Prince held up a mirror to power
      And showed its ruthless face that day.
      I read it in manuscript, page by page,
      And felt the chill run through —
      Five hundred years of rulers since
      Have found its counsel true.
    description: "Machiavelli writes The Prince in exile — cold counsel on how rulers keep power."
    status: "first draft"
    sha256: "f5d9bab930979745d5f01be6b3ca199bb05abf35397da53952352c3cfddf1964"
  - number: "2316"
    volume: 4
    title: "The South Sea"
    date: "1513 CE"
    region: "Panama"
    poem: |
      Balboa crossed the jungle's green hell,
      Ninety men through mud and thorn —
      And from a mountain top he saw it:
      An ocean no European had sworn.
      He waded in, waist-deep in the surf,
      Sword in hand, the banner high —
      Claimed the whole Pacific for Spain,
      The sea, the coast, the sky.
      I stood beside him on that peak,
      Saw the blue stretch without end —
      A man naming an ocean his,
      And the ocean his to lend.
    description: "Balboa wades into the Pacific and claims the whole ocean for Spain."
    status: "first draft"
    sha256: "0bdc1a34e9dbb8763629a41bc40160a1ac2b6a24f27c4f82da00b2a7476a873f"
  - number: "2317"
    volume: 4
    title: "The Field of Chaldiran"
    date: "1514 CE"
    region: "Ottoman Empire"
    poem: |
      At Chaldiran the two empires met —
      Ismail's holy warriors, sword and faith,
      Against Selim's cannon and muskets,
      Cold iron against the wraith.
      The Safavid horsemen charged like lions,
      Straight into the Ottoman guns —
      By noon the field was red with martyrs,
      And Persia's pride was undone.
      I walked that field when the smoke cleared,
      Saw the red caps scattered wide —
      The age of the holy sword was ending;
      The age of gunpowder had arrived.
    description: "Selim crushes Shah Ismail at Chaldiran — Ottoman guns beat Safavid holy swords, and gunpowder wins the day."
    status: "first draft"
    sha256: "02d86827333b86bc791b6ac6ed7a98d8c0363b02f837e38fe7338bb04bdbef38"
  - number: "2318"
    volume: 4
    title: "The Protector's Voice"
    date: "1514 CE"
    region: "Hispaniola"
    poem: |
      Las Casas was a priest with slaves of his own,
      A settler priest in the Indies' sun —
      Till one Sunday the words of the Gospel
      Struck him like a loaded gun.
      He freed his Indians, gave up his lands,
      And began a fight of fifty years —
      For the souls the Spaniards were crushing,
      He'd spend his voice, his ink, his tears.
      I heard him preach in Santo Domingo,
      His voice shaking the church's stone —
      The first white voice in the New World
      To say: leave these people alone.
    description: "Bartolomé de las Casas gives up his own slaves and begins a lifelong fight for the native peoples of the Americas."
    status: "first draft"
    sha256: "6930ee4af966bc10e1c569ded44be763a0c9f7c40ddbb01b8a4cc480d87d024e"
  - number: "2319"
    volume: 4
    title: "The Boy King of France"
    date: "1515 CE"
    region: "France"
    poem: |
      At twenty, Francis was crowned at Reims,
      The handsomest prince in Christendom —
      Tall, laughing, a patron of artists,
      A king the poets would succumb.
      He'd build châteaux along the Loire,
      Bring Leonardo to his court to die —
      Europe's most dazzling sovereign,
      Under a Renaissance sky.
      I saw him ride beneath the banners,
      The crown just set upon his hair —
      A golden age in a golden king,
      And glory in the air.
    description: "Twenty-year-old Francis I is crowned at Reims — Europe's most dazzling prince."
    status: "first draft"
    sha256: "1dac19c6f09355d06fdc742304c9195f561d92fe79be33da47dba999d9852c3c"
  - number: "2320"
    volume: 4
    title: "The Rhinoceros"
    date: "1515 CE"
    region: "Germany"
    poem: |
      Dürer never saw the rhinoceros —
      A sketch, a letter, that's all he had,
      A beast unloaded at Lisbon's docks,
      A gift that drove a king half mad.
      He carved it into wood with armor plates,
      A second horn upon its nose —
      Wrong in the details, true in wonder,
      The most famous beast art knows.
      I watched him cut each careful line,
      Inventing what he'd never seen —
      For two hundred years, all Europe's rhinos
      Looked like Dürer's dream.
    description: "Dürer carves his famous rhinoceros in wood — a beast he never saw, built from a sketch and a letter."
    status: "first draft"
    sha256: "2c5361cc10f6aaab76fb9a8a8f6c97b00b1a35b70687451164cf3c9bab589ca8"
  - number: "2321"
    volume: 4
    title: "The Lion's Last Roar"
    date: "1516 CE"
    region: "Ottoman Empire"
    poem: |
      At Marj Dabiq the Mamluk lion roared —
      The old sultan rode out in state,
      His mamluk knights in shining armor,
      To meet the Ottoman fate.
      Selim's guns spoke first, as at Chaldiran,
      And the old lion fell in the dust —
      Syria opened its gates to the Turk,
      An empire turned to rust.
      I saw the sultan's body on the field,
      His royal tent in Ottoman hands —
      The Mamluk age was breathing out,
      And Istanbul ruled the lands.
    description: "Selim defeats the Mamluks at Marj Dabiq; Syria falls to the Ottomans and the old sultan dies on the field."
    status: "first draft"
    sha256: "0d84b9f1f2d5b6d69eccad9c46882c9cf1aa829c58bf32c943fd6d5144e865e3"
  - number: "2322"
    volume: 4
    title: "An Island of Reason"
    date: "1516 CE"
    region: "England"
    poem: |
      Thomas More dreamed an island —
      Utopia, the nowhere place,
      Where no one owns and no one hungers,
      And reason rules the human race.
      He wrote it in Latin, half in jest,
      A lawyer's game, a scholar's art —
      But underneath the clever jokes,
      A longing in his heart.
      I read it by a winter fire,
      And felt its pull, its sting —
      A perfect world, imagined once,
      That no one built, but many sing.
    description: "Thomas More publishes Utopia, dreaming of a perfect commonwealth on an imaginary island."
    status: "first draft"
    sha256: "d822d3db2a7b84edbf67d0dc62b5188cc30c7c74d0280af25098ca450cdb9c06"
  - number: "2323"
    volume: 4
    title: "The Spark at Wittenberg"
    date: "1517 CE"
    region: "Germany"
    poem: |
      An unknown monk with a hammer and nails —
      Luther pinned his theses to the door,
      Ninety-five complaints against indulgences,
      And the Church would be whole no more.
      The printing press caught the spark
      And carried it on wings of lead —
      In weeks, all Germany was reading,
      And the old world's order fled.
      I stood in the crowd at Wittenberg,
      Heard the paper flutter in the wind —
      One monk, one door, one autumn day,
      And Europe's fate rescinded.
    description: "Martin Luther posts 95 theses against indulgences at Wittenberg and sets Europe alight."
    status: "first draft"
    sha256: "1c3355bdf2230b40707a8039461e1f11e059fb17c43fe59b096206c7b8b7fa19"
  - number: "2324"
    volume: 4
    title: "The Fall of the Mamluks"
    date: "1517 CE"
    region: "Egypt"
    poem: |
      Selim rode into Cairo through the Bab al-Nasr,
      The Mamluk sultans' line was done —
      Tumanbay hanged at the city gate,
      And the long Mamluk sun had run.
      Mecca and Medina bowed to Istanbul,
      The holy cities' keys changed hands —
      An empire of slave-soldiers, two hundred years,
      Now dust in the desert sands.
      I watched the Ottoman banners rise
      Over the Nile's slow green —
      Cairo, the city of a thousand minarets,
      Had a new master, cold and keen.
    description: "Selim rides into Cairo; the Mamluk sultans are finished, and Mecca answers to Istanbul."
    status: "first draft"
    sha256: "25c00abb419348f6693af6c8a58cd26148205a47a3dfd474411fb5ed2e0c0c2a"
  - number: "2325"
    volume: 4
    title: "The Licenses of Chains"
    date: "1518 CE"
    region: "Atlantic"
    poem: |
      Spain signed the licenses in Seville —
      Paper permits for human freight,
      Thousands of Africans in chains,
      Sold by the crown, sealed by the state.
      The sugar fields were hungry for hands,
      The mines were hungry too —
      So merchants bought and sold in bulk,
      And called it legal, called it true.
      I saw the first ships load at São Tomé,
      Heard the iron, smelled the fear —
      The licenses of chains began that year,
      And the horror ran for centuries here.
    description: "Spain licenses the first mass shipments of enslaved Africans to the Americas — the slave trade's machinery begins."
    status: "first draft"
    sha256: "b510f5a0c181f4f55afb0dadc49413982eb0f6bfdd151ee6acf258c5e2d7c041"
  - number: "2326"
    volume: 4
    title: "Cortés Gets His Orders"
    date: "1518 CE"
    region: "Cuba"
    poem: |
      In Cuba, Velázquez signed the paper —
      Cortés would lead the ships to shore,
      To trade with the mainland, to explore,
      To bring back gold and more.
      Eleven ships, five hundred men,
      A lawyer's son with a hungry eye —
      Cortés kissed the governor's hand
      And planned, already, to defy.
      I saw him muster on the beach,
      The banners flying in the heat —
      A small force with a giant hunger,
      And Mexico at his feet.
    description: "Hernán Cortés receives command of the expedition to Mexico's mainland."
    status: "first draft"
    sha256: "b843e4b32157d501640132656bcfeedccdcfb77c8ef4d36d14dc12487f384ecd"
  - number: "2327"
    volume: 4
    title: "The Round-the-World Gamble"
    date: "1519 CE"
    region: "Spain"
    poem: |
      Magellan sailed from Seville with five ships,
      Two hundred and seventy men —
      To find the westward road to spice,
      And bring them home again.
      The king of Spain had paid the price,
      Portugal had closed the eastern door —
      So west they'd sail, through straits unknown,
      To seas no keel had cut before.
      I watched them clear the Guadalquivir,
      The sails like wings against the sky —
      A gamble on the whole round world,
      And most of them would die.
    description: "Magellan sails from Seville with five ships to find the westward way to the Spice Islands."
    status: "first draft"
    sha256: "9c3b383ee0ad0308da538208d44e1e5f7832566c866bec933dd1bd9ca4080159"
  - number: "2328"
    volume: 4
    title: "The Stranger on the Shore"
    date: "1519 CE"
    region: "Mexico"
    poem: |
      Cortés landed at Veracruz in April,
      Burned his ships — no way back —
      And marched inland with native allies,
      The Tlaxcalans at his back.
      Four hundred Spaniards, thousands of friends,
      Guns and horses, smallpox to come —
      Toward Tenochtitlan, the lake-bound city,
      Greater than Seville, beating like a drum.
      I walked that road beside the column,
      Saw the volcanoes crowned with snow —
      A stranger stepping toward an empire,
      And neither knowing how it'd go.
    description: "Cortés lands at Veracruz and marches inland toward Tenochtitlan with native allies at his side."
    status: "first draft"
    sha256: "e7696f7acb04656e7eea10d82bb90eb98ea07135192cc71280a8f320ee315832"
  - number: "2329"
    volume: 4
    title: "The Night of Sorrows"
    date: "1520 CE"
    region: "Mexico"
    poem: |
      They came for the gold in the dead of night,
      The causeways narrow, the lake black deep —
      The Mexica rose with a roar of drums,
      And the Spaniards ran, and the Spaniards wept.
      La Noche Triste — the Night of Sorrows —
      Men drowned in armor, weighed with gold,
      Horses screaming in the darkness,
      A retreat the bards have told.
      I heard the war cries from the rooftops,
      Saw the causeway slick with rain —
      Cortés wept under the ahuehuete tree,
      And swore he'd come again.
    description: "The Mexica rise against the Spaniards; Cortés's men flee Tenochtitlan in a night of slaughter."
    status: "first draft"
    sha256: "cb2cafe33e9268e84543b6b261d8a256df6128ae2458d0c3de68007abd64b883"
  - number: "2330"
    volume: 4
    title: "The Bull in the Fire"
    date: "1520 CE"
    region: "Germany"
    poem: |
      The pope's bull came to Wittenberg,
      Excommunicating the monk by name —
      Luther built a bonfire at the city gates
      And threw the parchment in the flame.
      The students cheered, the priests went pale,
      The books of canon law burned too —
      A point of no return, in fire,
      The old Church breaking in two.
      I stood in the smoke of that December fire,
      Felt the heat upon my face —
      A monk burning the pope's own words:
      The Reformation's loudest grace.
    description: "Luther publicly burns the pope's bull of excommunication at Wittenberg's gates — the break with Rome is final."
    status: "first draft"
    sha256: "cb8a4be267b55f4e5c87ebf20655843c4c07e07aab9cf870a5ebda2dac282786"
  - number: "2331"
    volume: 4
    title: "The Field of Cloth of Gold"
    date: "1520 CE"
    region: "France"
    poem: |
      Two kings met in a field of gold —
      Henry and Francis, young and proud,
      Their tents were cloth of gold and silk,
      Their retinues a shining crowd.
      They wrestled, feasted, jousted, drank,
      Swore friendship with a royal kiss —
      Then went straight home to scheme and plot,
      For gold can't buy what kings dismiss.
      I wandered through that gilded camp,
      Saw the wine flow like a stream —
      The most expensive party ever thrown,
      And nothing but a dream.
    description: "Henry VIII and Francis I feast in tents of gold outside Calais — then return to scheming against each other."
    status: "first draft"
    sha256: "de746ecebc29eafa53ea4da23d7c315dc7a78771de063398f31ee79e7b67af36"
  - number: "2332"
    volume: 4
    title: "The Magnificent"
    date: "1520 CE"
    region: "Ottoman Empire"
    poem: |
      At twenty-five, Suleiman took the throne,
      The tenth sultan of the Ottoman line —
      They'd call him the Magnificent,
      And Kanuni, the Lawgiver, in time.
      Forty-six years he'd hold the sword,
      Belgrade, Rhodes, and Hungary's plain —
      The empire's peak in a single reign,
      Its glory and its pain.
      I saw him ride through Istanbul's gates,
      Young, grave, with a poet's eyes —
      A ruler who would write the laws
      And watch his empire rise.
    description: "Twenty-five-year-old Suleiman takes the Ottoman throne for a reign of nearly half a century."
    status: "first draft"
    sha256: "d3d60d97eabfede91dc1ba7e49911f3160f063589b5cfc1d740fa5924ffacf09"
  - number: "2333"
    volume: 4
    title: "The Stand at Worms"
    date: "1521 CE"
    region: "Germany"
    poem: |
      They hauled the monk before the emperor,
      The Diet of Worms, the empire's might —
      "Recant," they said. He asked a day.
      He came back in the morning light.
      "Here I stand, I can do no other" —
      The words rang through the hall —
      A single conscience against an empire,
      And the empire seemed so small.
      I was there in the crowded chamber,
      Heard the silence after he spoke —
      One man refusing to bend his soul:
      The sound of the old world broke.
    description: "Hauled before the emperor at Worms, Luther refuses to recant: \"Here I stand.\""
    status: "first draft"
    sha256: "b84dfa8c79e90839f5fe0ff87dff0162c12bcb28ee8febd0b31d608707ddc017"
  - number: "2334"
    volume: 4
    title: "The Fall of Tenochtitlan"
    date: "1521 CE"
    region: "Mexico"
    poem: |
      Seventy-five days the siege held on,
      The lake city starving, street by street —
      Smallpox in the houses, hunger in the squares,
      The brigantines controlling the fleet.
      Cuauhtémoc fought till the canoes were gone,
      Till the last warriors fell in the mud —
      On August thirteenth, the city fell,
      And the lake ran red with blood.
      I walked the ruins of the great temples,
      Saw the stones the Spaniards tore —
      An empire's heart cut from its body,
      And Mexico would bleed for more.
    description: "After a brutal siege the Mexica capital falls; an empire passes into Spanish hands."
    status: "first draft"
    sha256: "6aa0e5f628e1ee8d427c31845ca22aa38c8f561f5859856ea8c116dcf78838ff"
  - number: "2335"
    volume: 4
    title: "The Last Harbor"
    date: "1521 CE"
    region: "Philippines"
    poem: |
      On Mactan's beach, Magellan fell —
      A poisoned arrow, a native spear,
      Trying to play the conquistador
      In a war that wasn't his, out here.
      He'd crossed an ocean no man had crossed,
      Named the Pacific its calm name —
      And died in a skirmish on a island shore,
      A footnote to his fame.
      I saw him fall in the shallow surf,
      His men retreating to the boats —
      The captain never saw the finish
      Of the voyage his courage floats.
    description: "Magellan dies in a skirmish on Mactan; his expedition sails on without him."
    status: "first draft"
    sha256: "a67140c50a21b1c3755e58ec14ec4f191272f3af31cf9dae3e80b95d617423cf"
  - number: "2336"
    volume: 4
    title: "Belgrade Falls"
    date: "1521 CE"
    region: "Balkans"
    poem: |
      Belgrade stood white above the Danube,
      The fortress guarding Hungary's door —
      Suleiman brought his guns against it,
      And the white walls held no more.
      Seven hundred cannon battered the towers,
      The mines blew the bastions wide —
      In August, the garrison surrendered,
      And the road to Hungary lay open wide.
      I watched the Ottoman banners rise
      Over the fortress on the hill —
      The first step of the Magnificent's march,
      And Europe felt the chill.
    description: "Suleiman takes Belgrade, the white fortress guarding the road to Hungary."
    status: "first draft"
    sha256: "7619f60f58e90bbd2f72ead865d88d3adff0b4d51ee573c5072a57d6428a2401"
  - number: "2337"
    volume: 4
    title: "The First Circle"
    date: "1522 CE"
    region: "World"
    poem: |
      Eighteen men on a rotting hulk —
      The Victoria staggered into Seville,
      Three years gone, around the world,
      Eighteen left of the brave and still.
      They'd lost four ships, they'd lost their captain,
      They'd starved and scurvied, crossed the vast —
      But they'd sailed clean around the Earth,
      The first to do it, first and last.
      I stood upon the Guadalquivir,
      Saw the ragged sailors kneel —
      They'd proved the world was round and wide,
      And brought the proof in spice and steel.
    description: "The Victoria staggers into Seville — the first ship to sail around the entire Earth."
    status: "first draft"
    sha256: "58cd44f1cd8070afdcb2e99097376e1a2a91388fd514cb6d7c3e833f45a7fb57"
  - number: "2338"
    volume: 4
    title: "Rhodes Falls"
    date: "1522 CE"
    region: "Mediterranean"
    poem: |
      Six months the Knights of Rhodes held out,
      Behind their walls against the Turk —
      Suleiman's mines and cannon pounded,
      And still the Knights would work.
      By Christmas, the walls were breached,
      The Grand Master sued for grace —
      Suleiman let them sail away with honor,
      Knights without a place.
      I watched them board their galleys,
      The cross still flying from the mast —
      Rhodes was Ottoman by New Year's,
      And the Knights' long stand had passed.
    description: "Suleiman takes Rhodes from the Knights Hospitaller after a six-month siege, and lets them sail away with honor."
    status: "first draft"
    sha256: "115222fb796d20a203daa0189221e6175ae0eb13e6274d963090d5282fa5b4ad"
  - number: "2339"
    volume: 4
    title: "The Liberator King"
    date: "1523 CE"
    region: "Sweden"
    poem: |
      Gustav Vasa came down from the mountains,
      Where he'd hidden from the Danish crown —
      The Stockholm Bloodbath fresh in memory,
      He'd take the tyrant's power down.
      The peasants rose, the castles fell,
      And in Strängnäs they crowned him king —
      A free Sweden, a Vasa line,
      And the bells began to ring.
      I marched with the Dalecarlian men,
      Saw the Danes retreat in snow —
      A nation born in winter's cold,
      And a king the Swedes would know.
    description: "Gustav Vasa drives out the Danes and is crowned king of a free Sweden."
    status: "first draft"
    sha256: "8a17711faec6a93e381e4df3eba555ec6daaca867683c1346b0d8b609960136e"
  - number: "2340"
    volume: 4
    title: "The Peasants Rise"
    date: "1524 CE"
    region: "Germany"
    poem: |
      Fired by Luther's words of freedom,
      The peasants took up flail and scythe —
      "If all are priests, why are we serfs?"
      They rose with a righteous cry.
      The Twelve Articles, their charter,
      Demanded what the Gospel gave —
      An end to serfdom, tithes, and labor,
      The rights of the free, not the slave.
      I walked with them through Swabian fields,
      Heard them sing the psalms of war —
      The Reformation's children rising,
      Knocking on the castle door.
    description: "Fired by the Reformation, German peasants take up arms against their lords."
    status: "first draft"
    sha256: "df3c1882a6f2637b992bf769d901d2b0626e9e92b19641b687a82a0761a6d381"
  - number: "2341"
    volume: 4
    title: "The Hammer of Pavia"
    date: "1525 CE"
    region: "Italy"
    poem: |
      At Pavia the imperial troops closed in,
      The French knights charged in shining pride —
      But Spanish muskets spoke from the woods,
      And King Francis's horse was shot, and he was tied.
      The flower of French chivalry fell
      In a single February day —
      A king taken prisoner by his foes,
      And Italy's fate gave way.
      I saw them drag the king away,
      His armor dented, crown askew —
      Pavia's hammer broke the French,
      And the Habsburgs' power grew.
    description: "Imperial troops crush France at Pavia and drag King Francis I off as a prisoner."
    status: "first draft"
    sha256: "6dc143768fea87dc5430e46f0a6ca031ef61ae961b58aaff71005b371c819112"
  - number: "2342"
    volume: 4
    title: "The Peasants Broken"
    date: "1525 CE"
    region: "Germany"
    poem: |
      At Frankenhausen the princes' armies came,
      With cannon against the peasants' bands —
      Müntzer prayed for a miracle,
      But iron answered prayer with hands.
      A hundred thousand peasants died that year,
      Drowned in blood across the land —
      And Luther, who had lit the fire,
      Turned and blessed the princes' hand.
      I walked the fields after the battle,
      Saw the crows above the slain —
      The Reformation's promise broken,
      And the poor in chains again.
    description: "The Peasants' War is drowned in blood; Luther turns on the rebels he once inspired."
    status: "first draft"
    sha256: "3cc4b95fb9d4797eac704825de06ed5e2ef6513c4f64d766d1d80f44eec6f8a3"
  - number: "2343"
    volume: 4
    title: "The Tiger's Descent"
    date: "1526 CE"
    region: "India"
    poem: |
      Babur came down from Kabul's hills,
      Twelve thousand men, both tough and lean —
      Against Ibrahim Lodi's hundred thousand,
      And elephants, a war machine.
      At Panipat, Babur chained his carts,
      His muskets spoke in ordered fire —
      The Delhi Sultanate broke and ran,
      And the Tiger took his empire.
      I watched the Mughal banners rise
      Over the field of the slain —
      A new empire born in India,
      And it would long remain.
    description: "Babur's small army smashes the Delhi Sultanate at Panipat — the Mughal Empire is born."
    status: "first draft"
    sha256: "a31a25965925be15ae17d9a49d5a10fa7760fc1d6c5fdef7ec544e6018d71075"
  - number: "2344"
    volume: 4
    title: "The Field of Mohács"
    date: "1526 CE"
    region: "Hungary"
    poem: |
      Two hours. That's all it took —
      Suleiman's guns against the Magyar pride,
      King Louis rode into the marsh
      And never came out alive.
      Hungary's army died in an afternoon,
      Its nobles in the mud and rain —
      A kingdom's heart cut out at Mohács,
      And never beat again.
      I stood upon that drowned field,
      Saw the crown floating in the mire —
      Two hours of cannon and cavalry,
      And a nation lost to fire.
    description: "Suleiman destroys Hungary's army in two hours at Mohács; a kingdom dies in an afternoon."
    status: "first draft"
    sha256: "ddefbe65a7765f9c5e36ef1cab8271a9568013a23ea9dfacd61df91a3b38fec7"
  - number: "2345"
    volume: 4
    title: "The Princes' Peace"
    date: "1526 CE"
    region: "Germany"
    poem: |
      At Speyer the princes made their peace —
      Each ruler chooses his land's faith,
      Lutheran here, Catholic there,
      A truce the empire wraith.
      It wouldn't hold — the wars would come —
      But for a moment, the swords stayed sheathed,
      And Germany breathed a little easier,
      The storm for now bequeathed.
      I sat in the Diet's crowded hall,
      Heard the compromise read out —
      Peace bought with a prince's conscience:
      That's what it's all about.
    description: "The Diet of Speyer lets each German prince choose his land's faith — for now, the wars pause."
    status: "first draft"
    sha256: "d045bc2cfb618f51a76ed836c577156216bde92ee031b27b1e4c1a611ca83dca"
  - number: "2346"
    volume: 4
    title: "The Sack of Rome"
    date: "1527 CE"
    region: "Italy"
    poem: |
      Mutinous, unpaid, the imperial troops
      Broke through Rome's walls in May —
      Lutheran landsknechts, Spanish tercios,
      And the city became their prey.
      For days they looted, burned, and killed,
      Churches stripped, nuns defiled —
      The Renaissance's proudest city,
      By its own emperor's men defiled.
      I fled through streets of smoke and screams,
      Saw the Vatican's treasures torn —
      Rome, the eternal, humbled low,
      And a pope in the Castel Sant'Angelo forlorn.
    description: "Mutinous imperial soldiers loot Rome for days; the Renaissance's proudest city is stripped bare."
    status: "first draft"
    sha256: "5b8630aa83383e1abca366bc9698fc9d7b283812928fe0ca63cc60921f56e2c1"
  - number: "2347"
    volume: 4
    title: "The King's Great Matter"
    date: "1527 CE"
    region: "England"
    poem: |
      Henry wanted a son, not a wife —
      Catherine had borne him only a girl,
      And Anne Boleyn had caught his eye,
      Set his middle age in a whirl.
      He asked the pope to annul the marriage,
      Called it the King's Great Matter —
      But the pope was the emperor's prisoner,
      And the answer came back: never.
      I watched the court hold its breath,
      Saw Wolsey fall from grace —
      A king's desire against a pope:
      The schism's starting place.
    description: "Henry VIII asks the pope to annul his marriage to Catherine of Aragon — the King's Great Matter begins."
    status: "first draft"
    sha256: "a7889eee32844753e4d4c611529e43b5576aad38c84c3f7ba23279febd38268d"
  - number: "2348"
    volume: 4
    title: "The Narváez Ruin"
    date: "1528 CE"
    region: "Florida"
    poem: |
      Narváez landed in Florida with four hundred men,
      Seeking gold where none was found —
      The ships sailed off, the men marched in,
      And the swamps swallowed them down.
      Hunger, storms, and native arrows,
      Barges wrecked upon the shore —
      Of all that proud expedition,
      Only four men walked out alive, no more.
      I saw them build their desperate boats,
      Saw the Gulf take them one by one —
      A ruin written in the sand,
      Under the Florida sun.
    description: "Pánfilo de Narváez's expedition collapses in Florida; only four men will walk out alive."
    status: "first draft"
    sha256: "fb0ad2f1792f11730788487ab650f55872daadac8f64f965231f2dcfdfe89ac5"
  - number: "2349"
    volume: 4
    title: "The Ladies' Peace"
    date: "1529 CE"
    region: "Europe"
    poem: |
      Two royal women met at Cambrai —
      Louise of Savoy, Margaret of Austria,
      And signed a peace their men couldn't make,
      Ending the wars with a woman's quill.
      The Ladies' Peace, they called it,
      France and the empire at rest —
      While kings made war with cannon,
      Queens made peace the best.
      I watched them sign in the abbey,
      Two widows, wise and gray —
      The men had fought for seven years;
      The women ended it in a day.
    description: "Two royal women sign the Treaty of Cambrai — peace made by women while kings made war."
    status: "first draft"
    sha256: "3eb04e09a1f964cd0eb4f2655aa29267291618e18e80f519e5322bf4bbc7167f"
  - number: "2350"
    volume: 4
    title: "The Gates of Vienna"
    date: "1529 CE"
    region: "Ottoman Empire"
    poem: |
      Suleiman marched to Vienna's gates,
      A hundred thousand strong —
      But the rains came, the walls held,
      And the siege dragged on too long.
      Winter whispered in the tents,
      The Janissaries grumbled low —
      The Sultan turned his army home,
      And Vienna did not bow.
      I stood upon the city walls,
      Watched the Turkish campfires fade —
      The high-water mark of the Ottoman tide,
      Where Europe's fate was made.
    description: "Suleiman's army reaches Vienna, but winter and high walls turn it back — the Ottoman high-water mark."
    status: "first draft"
    sha256: "e1cf59ea1d87d6d4985ab956ab0e8c02a3ad5fae4cb6801708c317b46a9e9a12"
  - number: "2351"
    volume: 4
    title: "The Name \"Protestant\""
    date: "1529 CE"
    region: "Germany"
    poem: |
      At Speyer the emperor demanded
      That the Lutherans all recant —
      Six princes and fourteen cities
      Stood and filed their protestant.
      "We protest," they said, "we cannot yield" —
      And the name stuck like a brand —
      Protestant: the ones who stood
      Against the emperor's command.
      I heard them read the protestation,
      Felt the hall go still and cold —
      A name born in defiance,
      That the centuries would hold.
    description: "Princes who defy the emperor at Speyer earn the name Protestants — the ones who protest."
    status: "first draft"
    sha256: "9b5235687a29607a39afd50024ab1e1dda6651e98b3410bc1d994af7b5c14d59"
  - number: "2352"
    volume: 4
    title: "The Confession"
    date: "1530 CE"
    region: "Germany"
    poem: |
      Melanchthon read it at Augsburg,
      The Confession, article by article —
      Lutheran faith in twenty-eight points,
      Calm, learned, not a particle.
      The emperor listened, unmoved,
      But the words were now on record —
      A church with a charter of its own,
      Its faith by ink secured.
      I sat among the crowded princes,
      Heard the gentle scholar's tone —
      Not Luther's thunder, but reason's voice,
      Claiming the faith as its own.
    description: "Melanchthon reads the Augsburg Confession; Lutheranism gains its founding charter."
    status: "first draft"
    sha256: "1807ffe4c84499e7910a86c340f7eafc869b15651f70606dd701973e8a61ff26"
  - number: "2353"
    volume: 4
    title: "The Virgin of Guadalupe"
    date: "1531 CE"
    region: "Mexico"
    poem: |
      On Tepeyac hill, Juan Diego saw her —
      A lady in the morning light,
      Speaking Nahuatl, gentle, brown-skinned,
      Mary in an Indian's sight.
      The bishop doubted till the roses bloomed
      In December, out of season —
      And on the tilma, her image burned,
      A miracle beyond reason.
      I climbed that hill at dawn myself,
      Saw the shrine the Indians raised —
      A faith that spoke their mother tongue,
      And a mother to be praised.
    description: "An Indian convert reports a vision of Mary on Tepeyac hill; a new shrine rises and millions will come."
    status: "first draft"
    sha256: "bbb570e600ad5c8e4d87dd56215671e44b3f2bbaca4cb388b34c91fa522aeb22"
  - number: "2354"
    volume: 4
    title: "The Holy Office"
    date: "1531 CE"
    region: "Portugal"
    poem: |
      King John brought the Inquisition home —
      The Holy Office, black and grim,
      To hunt the heretics and secret Jews,
      The conversos hiding him.
      The autos-da-fé in Lisbon's square,
      The dungeons under the palace stone —
      Portugal's faith would now be policed,
      And fear would rule alone.
      I watched them lead the accused away,
      Heard the whispered prayers at night —
      A kingdom turning on its own,
      In the name of holy light.
    description: "King John III brings the Inquisition to Portugal to hunt heresy and secret Jews."
    status: "first draft"
    sha256: "aed61ba92e6dd63b8efa28bea4c00426f11acfd60166f26b9ef46dd3a9062df4"
  - number: "2355"
    volume: 4
    title: "The Reformer Falls"
    date: "1531 CE"
    region: "Switzerland"
    poem: |
      Zwingli died at Kappel with a sword in hand,
      The reformer turned soldier-priest —
      Catholic pikes against Zurich's men,
      And the battle was a feast.
      They found his body on the field,
      Quartered it, burned the parts —
      The first reformer killed in war,
      A sword through Switzerland's hearts.
      I saw him march out with the Zurich troops,
      Bible in one hand, halberd in the other —
      A pastor who would die in battle,
      Like a father, like a brother.
    description: "Ulrich Zwingli dies sword in hand at Kappel — the first reformer killed in war."
    status: "first draft"
    sha256: "856cf102c00f9fc81289d7730d82c251ce5e1c4b072e4dd1f8cc5484543ca82a"
  - number: "2356"
    volume: 4
    title: "The Trap at Cajamarca"
    date: "1532 CE"
    region: "Peru"
    poem: |
      Pizarro waited in Cajamarca's square,
      One hundred sixty-eight men in all —
      Against Atahualpa's thousands camped outside,
      The Inca, greatest of all.
      The friar read the Requerimiento,
      The Inca threw the Bible down —
      The cannon fired, the horsemen charged,
      And the square became a killing ground.
      I hid behind the stone walls,
      Heard the screams, the trumpet's call —
      An empire's lord taken in an hour,
      By treachery in a plaza small.
    description: "Pizarro ambushes the Inca Atahualpa at Cajamarca; a room filled with gold is set as the ransom."
    status: "first draft"
    sha256: "140f3dc36dde5b21975415ae65570fe0fc26d8c77aff1479b8398c96c8bae8d4"
  - number: "2357"
    volume: 4
    title: "The Boleyn Wedding"
    date: "1533 CE"
    region: "England"
    poem: |
      Henry married Anne in secret,
      In a chapel, before the dawn —
      A pregnant bride, a desperate king,
      And the break with Rome was on.
      Cranmer would bless what Rome condemned,
      The pope's authority denied —
      England's church would answer now
      To the king, and none beside.
      I stood outside that quiet chapel,
      Heard the whispered vows within —
      A wedding that would split a kingdom
      And drown a queen in sin.
    description: "Henry secretly marries Anne Boleyn and breaks toward schism with Rome."
    status: "first draft"
    sha256: "c928c42d84f0e387d8284fabad65c0f1715c209cb49f1c52d26abdb62974cfb8"
  - number: "2358"
    volume: 4
    title: "The Ransom Paid in Blood"
    date: "1533 CE"
    region: "Peru"
    poem: |
      The room was filled — gold to the ceiling,
      The ransom paid, the promise made —
      Atahualpa bought his freedom
      With the Inca's golden trade.
      But Pizarro feared to let him go,
      So the garrote closed at night —
      Strangled in the Cajamarca square,
      An emperor's stolen light.
      I saw the gold piled in the chamber,
      Heard the Inca's final prayer —
      The ransom paid, the promise broken,
      And the Andes left in despair.
    description: "Atahualpa is strangled despite the ransom of gold; the Inca Empire's heart is cut out."
    status: "first draft"
    sha256: "62c01214b6b888028c6a4a144bebb19ccfcd0e1aa5f0c3309610bd2cd53b60d7"
  - number: "2359"
    volume: 4
    title: "A Princess Named Elizabeth"
    date: "1533 CE"
    region: "England"
    poem: |
      Anne bore a daughter in September,
      At Greenwich Palace, small and red —
      Not the son that Henry wanted,
      But a princess in his stead.
      They named her Elizabeth, for his mother,
      And the king turned away in gloom —
      He could not know the girl in the cradle
      Would fill England's greatest room.
      I saw her first in the nurse's arms,
      A Tudor with her father's eyes —
      The unwanted daughter of a doomed queen,
      Destined for the crown's high prize.
    description: "Anne Boleyn bears a daughter — the future Elizabeth I, unwanted by her father, destined for greatness."
    status: "first draft"
    sha256: "3d0c266a93ba55e912c74d4a5c45c73d42ea9f6116ad549508686326182a3241"
  - number: "2360"
    volume: 4
    title: "The Child on the Throne"
    date: "1533 CE"
    region: "Russia"
    poem: |
      Three years old, and Grand Prince of Muscovy —
      Ivan sat the throne as the boyars schemed,
      His mother dead, the regents feasting,
      While the child watched, and dreamed.
      They'd brawl before him in the palace,
      Throw his tutors from the stair —
      A boy learning that power is cruelty,
      Breathing the Kremlin's air.
      I saw him small upon the throne,
      His eyes too old, too wise —
      The Terrible was being made
      Before the world's eyes.
    description: "Three-year-old Ivan inherits Muscovy while the boyars feast on the regency — the Terrible is being made."
    status: "first draft"
    sha256: "58345d97c3930f225e54ea7eace0a9331efab984f07f24efc7f1357b0b50cb27"
  - number: "2361"
    volume: 4
    title: "The Supreme Head"
    date: "1534 CE"
    region: "England"
    poem: |
      Parliament spoke, and it was law —
      Henry, Supreme Head of the Church,
      No more appeals to Rome's high throne,
      No more the papal perch.
      The monasteries would follow soon,
      Their gold to fill the crown —
      England's faith by act of state,
      The old religion broken down.
      I sat in the Parliament that day,
      Heard the statutes read aloud —
      A kingdom's soul by legislation,
      And the king above the cloud.
    description: "Parliament declares Henry VIII supreme head of the Church of England — the break with Rome is law."
    status: "first draft"
    sha256: "dee5016b2fd898867e15354baac12e2e661bf608fc34e0c24883895abdff10ce"
  - number: "2362"
    volume: 4
    title: "The River of Canada"
    date: "1534 CE"
    region: "Canada"
    poem: |
      Cartier sailed up the St. Lawrence,
      Past the cliffs where Quebec would stand —
      He claimed the river and the forests
      For the king of France's hand.
      The Iroquois watched from the shoreline,
      The French planted their cross —
      "Canada," the natives called the village,
      And the name would bear the loss.
      I rode those waters in his wake,
      Saw the wilderness run wide —
      A river that would carry empires,
      And the dreams that sailed its tide.
    description: "Jacques Cartier sails up the St. Lawrence and claims the land for France."
    status: "first draft"
    sha256: "68e74da271c342bc541639013490a07ad2c550c0c6b3418e0c4db49d4910a728"
  - number: "2363"
    volume: 4
    title: "The Society of Jesus"
    date: "1534 CE"
    region: "Paris"
    poem: |
      Seven men in a Montmartre chapel —
      Ignatius, the soldier turned saint,
      And six companions, young and burning,
      Vowed by candlelight's faint.
      Poverty, chastity, obedience,
      And a special vow to the pope —
      The Jesuits were born that morning,
      The Church's last best hope.
      I knelt with them in the crypt below,
      Heard the Latin vows ascend —
      An army of scholars and missionaries,
      On whom Rome would depend.
    description: "Ignatius of Loyola and six companions vow themselves to the pope in Paris — the Jesuits are born."
    status: "first draft"
    sha256: "00b37f135c0ebb8a5c12c4644de134972f1d6540fe11cec516f627be4449f8cd"
  - number: "2364"
    volume: 4
    title: "The Tailor King of Münster"
    date: "1534 CE"
    region: "Germany"
    poem: |
      The Anabaptists seized Münster town,
      And crowned a tailor, Jan van Leiden, king —
      Polygamy, communism, apocalypse,
      A New Jerusalem to bring.
      The bishop's army ringed the walls,
      Starved them out through winter's cold —
      The tailor king in an iron cage,
      His story grimly told.
      I walked the streets of that besieged town,
      Saw the faithful starve and pray —
      A kingdom of heaven on earth,
      That ended in dismay.
    description: "Anabaptists seize Münster and crown a tailor king; the siege ends in cages and torture."
    status: "first draft"
    sha256: "15864516aa8291eecf1d886c76e94450edf097566540ac41c8bef80b88670bb3"
  - number: "2365"
    volume: 4
    title: "The Silent Chancellor"
    date: "1535 CE"
    region: "England"
    poem: |
      Thomas More climbed the scaffold stairs,
      The silent chancellor, the wit —
      He'd refused the king's supremacy,
      And would not bend a bit.
      "I die the king's good servant,"
      He said, "but God's first" —
      The axe fell on Tower Hill,
      And England felt the worst.
      I stood among the watching crowd,
      Heard his final jest —
      A conscience that would not be bought,
      Laid finally to rest.
    description: "Thomas More is beheaded for refusing Henry's supremacy; conscience dies with him on Tower Hill."
    status: "first draft"
    sha256: "1bebc96ed8334472ed3e2ef5b20e70e72a07685fe49c35cd35161d49b686a15b"
  - number: "2366"
    volume: 4
    title: "The Queen Loses Her Head"
    date: "1536 CE"
    region: "England"
    poem: |
      Anne Boleyn knelt on the Tower Green,
      A French swordsman, not the axe —
      She'd given Henry a daughter, not a son,
      And paid the final tax.
      Eleven days later, Henry wed Jane Seymour,
      The court moved on, the bells rang out —
      A queen's head in a velvet bag,
      And nobody dared to doubt.
      I watched her climb the scaffold,
      Heard her pray in French —
      Three years a queen, a thousand years a story,
      Ended on a bench.
    description: "Anne Boleyn is executed in the Tower; Henry weds Jane Seymour days later."
    status: "first draft"
    sha256: "d80fbe0cd07b7f8ac81d68f7ff10006c5f3d0da181f69a10f1732babb635695d"
  - number: "2367"
    volume: 4
    title: "The Institutes"
    date: "1536 CE"
    region: "Switzerland"
    poem: |
      Calvin published his Institutes in Basel,
      A French lawyer's systematic mind —
      God's sovereignty, man's depravity,
      Predestination, tightly lined.
      The book would travel further than its author,
      To Geneva, Scotland, and the New World's shore —
      A theology of iron logic,
      That would shape the world and more.
      I read it fresh off the Basel press,
      Felt its cold and brilliant art —
      A God who'd chosen before time,
      And the terror in the heart.
    description: "John Calvin publishes his Institutes of the Christian Religion in Basel — a theology of iron logic."
    status: "first draft"
    sha256: "361e7289471980faf11375be55e8a08f107d517d9b3c679ce490e19e57779625"
  - number: "2368"
    volume: 4
    title: "The Walking Men Return"
    date: "1536 CE"
    region: "Mexico"
    poem: |
      Eight years lost in the wilderness —
      Cabeza de Vaca and three more,
      Naked, starving, enslaved, escaped,
      Walked out of the desert's door.
      From Florida to Mexico they wandered,
      Healers, beggars, ghosts of men —
      The first Europeans to cross the continent,
      And live to tell it then.
      I met them at the Spanish outpost,
      Saw their beards, their hollow eyes —
      Men who'd walked through hell itself
      And come back with the prize.
    description: "Cabeza de Vaca and three companions stumble into Mexico after eight lost years crossing the continent."
    status: "first draft"
    sha256: "eb9c0143ab8f0c0d59699ce2d821e155484239ddaca08f38f5719fb97a67ebdd"
  - number: "2369"
    volume: 4
    title: "The Translator's Fire"
    date: "1536 CE"
    region: "Flanders"
    poem: |
      Tyndale gave the English their Bible —
      "Let the plowboy know the Word" —
      For that, they strangled him at Vilvoorde,
      Then burned him, as absurd.
      His last prayer: "Lord, open the king's eyes" —
      And the king's eyes would open wide,
      For Henry's own Great Bible
      Was Tyndale's work inside.
      I stood outside the stake that day,
      Heard the flames take the pyre —
      A man who died for English words,
      Consumed by holy fire.
    description: "William Tyndale is strangled and burned for putting the Bible into English."
    status: "first draft"
    sha256: "bfbec4056bcdf4900c600fa66c511b2bef538a2d0aa7aafed0cb00ab2d35a3a5"
  - number: "2370"
    volume: 4
    title: "The Prince at Last"
    date: "1537 CE"
    region: "England"
    poem: |
      Jane Seymour bore the son at last —
      Edward, the prince, the heir —
      The court rejoiced, the bonfires burned,
      Thanksgiving filled the air.
      Twelve days later, Jane was dead,
      Childbed fever took the queen —
      Henry wept for the only wife
      Who'd given him what he'd seen.
      I heard the bells of celebration,
      Then the bells of mourning toll —
      A prince born, a mother lost,
      And a king with half a soul.
    description: "Jane Seymour bears Henry a son, Edward — then dies twelve days later of childbed fever."
    status: "first draft"
    sha256: "9bae9eb86f7154be7a127beea2b3cf92a62ea4b3485f61d574a8c63691d4cef9"
  - number: "2371"
    volume: 4
    title: "The Venus of Urbino"
    date: "1538 CE"
    region: "Italy"
    poem: |
      Titian painted her reclining —
      Venus, naked, on a couch,
      Looking straight out at the viewer,
      No goddess on a cloud.
      A woman, real, unashamed,
      A dog asleep at her feet —
      Europe had never seen a body
      Rendered half so sweet.
      I stood before the canvas,
      Felt the centuries stare back —
      A new way of looking at a woman,
      That the old masters lacked.
    description: "Titian paints the reclining Venus that teaches Europe a new way to look at a body."
    status: "first draft"
    sha256: "b4b71db0a3b90205d679d4f37b6808f41f770ba9cd9ac61e0caec15587e14fb4"
  - number: "2372"
    volume: 4
    title: "The Golden Cities"
    date: "1540 CE"
    region: "North America"
    poem: |
      Coronado marched north for Cíbola,
      The Seven Cities paved with gold —
      De Soto hacked through Florida's swamps,
      Both chasing what they were told.
      They found no gold, just desert and plains,
      The Grand Canyon, the Mississippi's flow —
      Two expeditions, empty-handed,
      But the maps would ever grow.
      I rode with Coronado's column,
      Saw the pueblos in the sun —
      The golden cities were a story,
      But the journey had begun.
    description: "Coronado marches north for the Seven Cities of Cíbola while de Soto hunts gold through Florida — both find no gold, but map a continent."
    status: "first draft"
    sha256: "7e3ec9f00c27065f7a90f1149d817ea3287dedcbe27d01a324c247afe57b2fc9"
  - number: "2373"
    volume: 4
    title: "The Pope's Soldiers"
    date: "1540 CE"
    region: "Vatican"
    poem: |
      Paul III signed the bull at last —
      The Society of Jesus approved,
      Ten men to start, then thousands,
      A spiritual army moved.
      They'd teach in universities,
      Sail to Asia, brave the rack —
      The pope's own shock troops,
      And there'd be no turning back.
      I watched Ignatius kneel for the blessing,
      Saw the tears upon his face —
      A soldier's order for the Church,
      Armed with learning and grace.
    description: "Paul III formally approves the Society of Jesus — the Jesuits become Rome's shock troops."
    status: "first draft"
    sha256: "471beb08a010cff202bae9d66111b3ac5c4a37c306f27b541caecde45d66d88b"
  - number: "2374"
    volume: 4
    title: "The Conqueror's End"
    date: "1541 CE"
    region: "Peru"
    poem: |
      Almagro's partisans broke down the door,
      In Pizarro's palace at noon —
      The conqueror of Peru, seventy old,
      Fell to the assassin's tune.
      He drew his sword, he fought them off,
      Killed two before he fell —
      Throat cut on his own dining floor,
      The mighty brought to hell.
      I heard the shouts in Lima's square,
      Saw the body on the floor —
      The man who'd toppled an empire,
      Toppled by his own war.
    description: "Almagro's partisans murder Francisco Pizarro in his Lima palace — the conqueror conquered."
    status: "first draft"
    sha256: "0c392391caceeafa7d3fec7c9291b7312cc52dd6173e05ca1444fcbae36e7421"
  - number: "2375"
    volume: 4
    title: "The End of the World, Painted"
    date: "1541 CE"
    region: "Vatican"
    poem: |
      Twenty-five years after the ceiling,
      Michelangelo climbed again —
      The Last Judgment on the altar wall,
      Christ in wrath among men.
      The damned hurled down to Charon's boat,
      The saved ascending to the light —
      A sixty-six-year-old's vision
      Of the world's final night.
      I stood beneath that terrible wall,
      Felt the painted thunder roll —
      The end of the world in fresco,
      And the judgment of each soul.
    description: "Michelangelo unveils the Last Judgment — Christ hurling the damned down, twenty-five years after the ceiling."
    status: "first draft"
    sha256: "d8077dcb138d9a08a7b983051ce3dfa0232e65dcf29f11d5e8beb13cc6075825"
  - number: "2376"
    volume: 4
    title: "The New Laws"
    date: "1542 CE"
    region: "Spain"
    poem: |
      Charles signed the New Laws in Barcelona —
      Las Casas's victory on paper,
      The Indians freed from encomienda,
      The settlers' rage and vapor.
      The colonists rose in fury,
      A viceroy murdered in Peru —
      The laws were softened, bent, and broken,
      As paper victories do.
      I read the laws in Seville's archive,
      Saw the emperor's hopeful hand —
      Good intentions on parchment,
      Drowned in the New World's sand.
    description: "Charles V issues the New Laws to protect the Indians — Las Casas's victory on paper, resisted in the colonies."
    status: "first draft"
    sha256: "cb2f59cb41d67bd786a98121cc78982fa3f7a75ccf87d55d3af86c81c9f14778"
  - number: "2377"
    volume: 4
    title: "The Queen of a Week"
    date: "1542 CE"
    region: "Scotland"
    poem: |
      Mary was born as her father died —
      Six days old, and Queen of Scots,
      A baby in a cradle, crowned,
      While the regents cast their lots.
      James V had turned his face to the wall,
      Hearing it was a girl, not a boy —
      "The crown came with a lass," he sighed,
      "And it'll go with a lass," no joy.
      I saw the infant in Linlithgow,
      The crown too big for her head —
      A queen of six days, in swaddling clothes,
      With a kingdom to be led.
    description: "Mary Queen of Scots is born as her father dies; a six-day-old inherits a crown."
    status: "first draft"
    sha256: "034194157957f0b3ec8dc80f6afbb0572b319fbf5af21f42e52c5bed21a5f61b"
  - number: "2378"
    volume: 4
    title: "The Missionary Lands"
    date: "1542 CE"
    region: "India"
    poem: |
      Xavier landed at Goa in May,
      The Jesuit with a burning heart —
      He'd sail from port to port along the coasts,
      The Gospel to impart.
      Fishermen, pearl divers, the poor —
      He learned their tongues, he shared their bread —
      From India to the Moluccas,
      The seed of faith was spread.
      I watched him preach on Goa's shore,
      Saw the crowds gather round —
      A saint with salt upon his robe,
      And the mission's trumpet sound.
    description: "Francis Xavier reaches Goa and begins the Jesuit mission along Asia's coasts."
    status: "first draft"
    sha256: "f8eca90949287f9d6e29ded29c57bec14757d6bfdde5935eb51ffbcdd9df3a3b"
  - number: "2379"
    volume: 4
    title: "The Upper Sea"
    date: "1542 CE"
    region: "California"
    poem: |
      Cabrillo sailed up the California coast,
      Past the Channel Islands' shore —
      The first European eyes to see it,
      The fog, the cliffs, the roar.
      He claimed it all for Spain's king,
      San Diego Bay his mark —
      Then sailed on north into the mist,
      And vanished in the dark.
      I stood upon those headlands,
      Watched his ships fade in the haze —
      A coastline no map had drawn,
      At the edge of the world's maze.
    description: "Cabrillo sails up the California coast — the first European to see it."
    status: "first draft"
    sha256: "e42995fe9de783640e958f7ce36e6df0fc0b95f071d00f1d110a67715f3e2a0d"
  - number: "2380"
    volume: 4
    title: "The Earth Moves"
    date: "1543 CE"
    region: "Poland"
    poem: |
      Copernicus lay dying in Frombork,
      As the book came off the press —
      De Revolutionibus, the Earth in motion,
      The Sun at the center, no less.
      He'd held it back for thirty years,
      Fearing the Church's frown —
      He died as the pages reached his hands,
      And the old cosmos tumbled down.
      I held that first edition,
      Felt the weight of what it said —
      The Earth was just a planet,
      And the heavens weren't overhead.
    description: "Copernicus publishes his Sun-centered cosmos — and dies as the book comes off the press."
    status: "first draft"
    sha256: "903a4409fdc8b438b7859d8d2cf15cd58febf1004061f128a3e2bff4dea0361f"
  - number: "2381"
    volume: 4
    title: "The Body Opened"
    date: "1543 CE"
    region: "Italy"
    poem: |
      Vesalius stole bodies from the gibbet,
      Opened them on the table wide —
      And drew what he saw, bone and muscle,
      The human frame inside.
      De Humani Corporis Fabrica —
      Seven books of the body's art —
      Galen's errors corrected at last,
      By the anatomist's true heart.
      I stood beside the dissecting table,
      Saw the candlelight on skin —
      The first true map of the human body,
      Drawn from deep within.
    description: "Vesalius publishes the first true atlas of the human body, drawn from the dissecting table."
    status: "first draft"
    sha256: "a152682336e0828d35fc0d0aff8a9cb380ee406780eb2b518d31a654800cb953"
  - number: "2382"
    volume: 4
    title: "The Guns Arrive"
    date: "1543 CE"
    region: "Japan"
    poem: |
      A Chinese junk blew off course,
      And landed on Tanegashima's sand —
      Two Portuguese with matchlock guns,
      The first firearms in the land.
      The daimyo watched them fire,
      Saw the smoke, heard the roar —
      Within a decade, Japan's smiths
      Were making guns by the score.
      I stood upon that southern beach,
      Saw the future in the smoke —
      A weapon that would end the samurai age,
      With a single trigger's stroke.
    description: "Portuguese merchants land on Tanegashima with the first muskets Japan has ever seen."
    status: "first draft"
    sha256: "5ff9fbb12738f4ba362c5232a53dac92840e2e0c25486ffe295d53daf7a4fb84"
  - number: "2383"
    volume: 4
    title: "The Bitter Gift"
    date: "1544 CE"
    region: "Spain"
    poem: |
      Maya nobles brought their jars to Spain,
      Frothing cacao, bitter, dark —
      A drink of kings in the New World,
      Now a curiosity's spark.
      Prince Philip tasted, and frowned —
      Bitter! But the court was keen,
      They'd add sugar, add vanilla,
      And chocolate would be queen.
      I watched them pour the frothing cups,
      Saw the Spaniards' puzzled face —
      A bitter gift from the Maya,
      That would conquer every place.
    description: "Maya nobles present jars of frothing cacao to Prince Philip — Europe tastes chocolate for the first time."
    status: "first draft"
    sha256: "6fd01e9eda71c782abaa93553b9739199a71b07cd9d5ef62d78ec24494742b25"
  - number: "2384"
    volume: 4
    title: "The Silver Mountain"
    date: "1545 CE"
    region: "Bolivia"
    poem: |
      A shepherd found it on Cerro Rico —
      Silver veins running through the hill,
      A mountain of the shining metal,
      That the world could never fill.
      Potosí rose in the thin cold air,
      The highest city on the earth —
      And the silver flowed to Spain's king,
      Beyond all counting's worth.
      I climbed that red and barren hill,
      Felt the altitude's thin breath —
      A mountain that would buy an empire
      And pay for it in death.
    description: "The Cerro Rico at Potosí is found — a mountain of silver that will flood the world's coinage."
    status: "first draft"
    sha256: "3e60b68efec76b3b36d8f231f33381e069e3fad61d81645d4db8d926fc82238f"
  - number: "2385"
    volume: 4
    title: "The Council Opens"
    date: "1545 CE"
    region: "Italy"
    poem: |
      The bishops gathered at Trent in December,
      To answer Luther's rebel cry —
      The Council that would last eighteen years,
      And the old faith fortify.
      Doctrine defined, abuses trimmed,
      Seminaries, catechism, art —
      The Counter-Reformation's engine,
      With the Jesuits at its heart.
      I sat in the cathedral's shadow,
      Heard the debates run long —
      A Church refusing to surrender,
      And growing hard and strong.
    description: "The Council of Trent convenes to answer the Reformation — the Counter-Reformation begins."
    status: "first draft"
    sha256: "f0878ec7a8034fb416c5ee9ea8e7e38db42ce20fbe85576cb46b1a722577960f"
  - number: "2386"
    volume: 4
    title: "The Reformer's Death"
    date: "1546 CE"
    region: "Germany"
    poem: |
      Luther died in Eisleben town,
      Where he was born, sixty-two —
      Worn out by controversy, gout, and grief,
      His work still to pursue.
      "I am a worm," he'd sometimes say,
      But the world he'd cracked in two —
      The monk who'd challenged pope and empire
      Was mortal, through and through.
      I stood beside his deathbed,
      Heard his final whispered prayer —
      The Reformation's thunder quiet,
      In the February air.
    description: "Martin Luther dies in Eisleben, the town of his birth, worn out at sixty-two."
    status: "first draft"
    sha256: "8a5d7f76ac4a9635d548421d575f19bf5c4d50a663c10d02ea2b0eb9bf4401e5"
  - number: "2387"
    volume: 4
    title: "The Woman Who Would Not Bend"
    date: "1546 CE"
    region: "England"
    poem: |
      Anne Askew was racked in the Tower —
      The only woman tortured there —
      They stretched her on the rack till her joints gave way,
      But she would not recant or swear.
      Carried to Smithfield in a chair,
      Too broken now to stand —
      She burned for her Protestant faith,
      Unbroken to the end, by God's hand.
      I watched them light the faggots,
      Heard her pray above the flame —
      A woman who would not bend,
      And history knows her name.
    description: "Anne Askew is burned for heresy — the only woman tortured in the Tower, unbroken to the end."
    status: "first draft"
    sha256: "62607f712f36a0021d02721531384bf91684cac3b262992eafc366da3321a14f"
  - number: "2388"
    volume: 4
    title: "The King of France Dies"
    date: "1547 CE"
    region: "France"
    poem: |
      Francis died at Rambouillet,
      The dazzling king grown old and ill —
      Thirty-two years upon the throne,
      The Renaissance's brightest will.
      His son Henry, sickly, took the crown,
      A lesser light, a darker day —
      France would slide to religious war,
      And the golden age decay.
      I stood among the mourners,
      Saw the coffin draped in black —
      An era ended with that king,
      And would not be coming back.
    description: "Francis I dies; his sickly son Henry II takes the French crown and France slides toward religious war."
    status: "first draft"
    sha256: "f12c1902b4dfbd8323f30dad4ba6e615ebb77f3f63200908599e06b364f09946"
  - number: "2389"
    volume: 4
    title: "The Boy King"
    date: "1547 CE"
    region: "England"
    poem: |
      Nine years old, and King of England —
      Edward rode through London's cheer,
      A Protestant prince, a scholar's hope,
      His uncles ruling near.
      Somerset first, then Northumberland,
      The boy king learned his creed —
      The prayer book and the articles,
      A reformation at speed.
      I saw him small upon the throne,
      A child with a man's mind —
      England's brief Protestant dawn,
      Before the dark behind.
    description: "Nine-year-old Edward VI inherits England; his uncles rule in his name and push the Reformation."
    status: "first draft"
    sha256: "2dbbeda7fe5294bbaa1d4a96219fe99c77138805fb81f92503abdf721f4eb418"
  - number: "2390"
    volume: 4
    title: "The First Tsar"
    date: "1547 CE"
    region: "Russia"
    poem: |
      Sixteen, and crowned in the Kremlin —
      Ivan took the title Tsar,
      "Caesar of All Rus," the first,
      A star both bright and far.
      The boyars bowed, the church anointed,
      The bells rang through the snow —
      Russia had an emperor now,
      And the world would come to know.
      I watched the crown placed on his head,
      Saw the ambition in his eyes —
      The Terrible had begun his reign,
      Under the northern skies.
    description: "Sixteen-year-old Ivan IV is crowned \"Tsar of All Rus\" — Ivan the Terrible begins."
    status: "first draft"
    sha256: "bcc42a54b9b999d7014cf0406c9dfe5d489d607e224909eb9c57810e930816bd"
  - number: "2391"
    volume: 4
    title: "The Emperor's Victory"
    date: "1547 CE"
    region: "Germany"
    poem: |
      At Mühlberg, Charles crushed the princes —
      The Schmalkaldic League in rout,
      John Frederick taken in the woods,
      The Protestants put out.
      The emperor stood at his triumph's peak,
      The Reformation's darkest hour —
      Luther dead, the princes broken,
      And Charles held all the power.
      I saw the prisoners led away,
      Heard the Te Deum sung —
      But the victory wouldn't hold,
      And the songs were barely sung.
    description: "Charles V crushes the Protestant princes at Mühlberg — the Reformation's darkest hour."
    status: "first draft"
    sha256: "8632801fef38fcdeae917cd10d9e1f9b4a3be3f5cb76b03dab42c504ff480819"
  - number: "2392"
    volume: 4
    title: "The Last Conquistador"
    date: "1548 CE"
    region: "Peru"
    poem: |
      Gonzalo Pizarro raised rebellion,
      Against the king's New Laws —
      De la Gasca came with royal pardon,
      And the rebels' cause gave pause.
      At Jaquijahuana, the troops deserted,
      Gonzalo left alone to stand —
      Beheaded in the Cuzco square,
      The last conquistador's hand.
      I watched him kneel before the block,
      The proudest of them all —
      The age of the conquistadors
      Ended with his fall.
    description: "Pedro de la Gasca defeats Gonzalo Pizarro; the age of the conquistadors ends in Peru."
    status: "first draft"
    sha256: "ab698c89e89da186e718ddec52819eaf1c2c9579b286cccb4a859d2c11b32fa3"
  - number: "2393"
    volume: 4
    title: "The Prayer Book"
    date: "1549 CE"
    region: "England"
    poem: |
      Cranmer gave England its own words —
      The Book of Common Prayer,
      English worship for English folk,
      Morning and evening prayer.
      No more Latin only the priests could speak,
      The liturgy in the people's tongue —
      A book that would outlive its maker,
      And be for centuries sung.
      I held the first edition,
      Felt the language sing —
      The most beautiful English ever prayed,
      For peasant and for king.
    description: "Cranmer's Book of Common Prayer gives England worship in its own tongue."
    status: "first draft"
    sha256: "0cc00360ca622071fe2002f055c48c94d1f579b14aac706a651c260fcd66ae8d"
  - number: "2394"
    volume: 4
    title: "The Cross Lands"
    date: "1549 CE"
    region: "Japan"
    poem: |
      Xavier landed at Kagoshima,
      The first priest in Japan's land —
      He'd learn the tongue, he'd brave the cold,
      The Gospel in his hand.
      The daimyo listened, some believed,
      Kyoto's monks debated long —
      A seed planted in foreign soil,
      A strange and fragile song.
      I watched him step upon the beach,
      Saw the samurai stare —
      The Cross had landed in Japan,
      And nothing would be fair.
    description: "Francis Xavier reaches Kagoshima — the first Christian missionary in Japan."
    status: "first draft"
    sha256: "60721670af951d5c89d40f7eb6934dbdc88ac581ce75705496088e1806ca30ea"
  - number: "2395"
    volume: 4
    title: "The Great Debate"
    date: "1550 CE"
    region: "Spain"
    poem: |
      At Valladolid, the scholars met —
      Las Casas against Sepúlveda,
      "Do the Indians have souls?" they asked,
      "Are they men, or beasts instead?"
      Las Casas argued for their humanity,
      Sepúlveda for natural slaves —
      The first great debate on human rights,
      Above the New World's graves.
      I sat in that Valladolid hall,
      Heard the arguments unfold —
      The conscience of an empire,
      Weighed in words of old.
    description: "At Valladolid, Las Casas and Sepúlveda argue whether the Indians have souls and rights — the first great human-rights debate."
    status: "first draft"
    sha256: "ebdb8dfa3ee62444a6bece0ad620fe315a71c0bdb94335a5a1468896bc733c89"
  - number: "2396"
    volume: 4
    title: "The Lives of the Artists"
    date: "1550 CE"
    region: "Italy"
    poem: |
      Vasari wrote the Lives in Florence —
      The first art history ever made,
      Giotto to Michelangelo,
      The masters and their trade.
      He turned painters into legends,
      Gave the Renaissance its tale —
      Without his book, we'd hardly know
      The men behind the veil.
      I read it fresh from the Torrentino press,
      Felt the gossip and the glory —
      The first time artists had a history,
      And it was quite a story.
    description: "Vasari publishes his Lives — the first art history, turning painters into legends."
    status: "first draft"
    sha256: "5673fd1c9e8a5d671b19ca1b3f7126e7ce717503ff95adede945725aa4a551eb"
  - number: "2397"
    volume: 4
    title: "The New World's First University"
    date: "1551 CE"
    region: "Mexico"
    poem: |
      The Royal University opened in Mexico City —
      The New World's first, by royal decree,
      Theology, law, and medicine,
      For the colony's degree.
      Older than Harvard by eighty years,
      A Spanish lamp in the west —
      Learning crossing the ocean,
      To give the New World its best.
      I walked its first courtyards,
      Heard the Latin disputations —
      A university in the Americas,
      Among the new nations.
    description: "The Royal University of Mexico opens — the New World's first university, older than Harvard by eighty years."
    status: "first draft"
    sha256: "11ef3ea98e186b48009faae2d8479a06229b5d8933e9197c4d187bb6248e416b"
  - number: "2398"
    volume: 4
    title: "Kazan Falls"
    date: "1552 CE"
    region: "Russia"
    poem: |
      Ivan stormed the walls of Kazan,
      The Tatar khanate's pride —
      Mines blew the breaches open,
      And the Russians poured inside.
      The khan was taken, the city sacked,
      The Volga opened to the east —
      Russia turned its face to Asia,
      And the conquests never ceased.
      I watched the Kremlin's banners rise
      Over Kazan's fallen wall —
      The first step of the Russian empire,
      And it would take it all.
    description: "Ivan the Terrible storms Kazan; the Tatar khanate falls and Russia turns east."
    status: "first draft"
    sha256: "d633e2ea0f6ffb056efa06ef4960a18b1f8bdc44bf27b425a3792d9aca5f4fb6"
  - number: "2399"
    volume: 4
    title: "The Saint on the Shore"
    date: "1552 CE"
    region: "China"
    poem: |
      Xavier died on Shangchuan Island,
      Within sight of China's shore —
      Fever took him in a hut,
      The Middle Kingdom nevermore.
      He'd dreamed of converting the emperor,
      Of baptizing the whole land —
      But died alone, a saint unmet,
      With China close at hand.
      I stood upon that lonely beach,
      Saw the mainland through the haze —
      The saint who'd crossed half the world,
      Ended his days.
    description: "Francis Xavier dies on Shangchuan Island, within sight of the China he never entered."
    status: "first draft"
    sha256: "5a345e872b5b0125de18b41c5b9daee75e21c7cab0f39decc52cc46a5e8e3ae3"
  - number: "2400"
    volume: 4
    title: "The Nine Days' Queen"
    date: "1553 CE"
    region: "England"
    poem: |
      Lady Jane Grey was sixteen,
      Crowned by Northumberland's plot —
      Nine days a queen, then Mary came,
      And Jane's brief reign was not.
      The Tower took her, the axe would follow,
      A pawn in others' game —
      The nine days' queen, the innocent,
      History remembers her name.
      I saw her small upon the throne,
      A scholar, not a queen —
      Nine days of borrowed majesty,
      The shortest ever seen.
    description: "Lady Jane Grey reigns nine days before Mary Tudor seizes the throne."
    status: "first draft"
    sha256: "654153f7f68333bbf01b40d39fdb50081a722f1948e05fd90d923160f9915503"
  - number: "2401"
    volume: 4
    title: "The Catholic Restoration"
    date: "1553 CE"
    region: "England"
    poem: |
      Mary took the throne in triumph,
      The Catholic queen at last —
      She'd drag England back to Rome,
      And burn the Protestant past.
      The burnings followed — Latimer, Ridley,
      Cranmer too, at last —
      "Bloody Mary," they'd call her,
      For the fires she cast.
      I watched the crowds cheer her entry,
      Saw the hope in Catholic eyes —
      A restoration built on ashes,
      And the smoke would never rise.
    description: "Mary I takes the throne and drags England back to Rome; the burnings follow and she becomes \"Bloody Mary.\""
    status: "first draft"
    sha256: "669240a5ce7486264916016e37f7dfad31c964efccf2972ae474220fb2b9da8f"
  - number: "2402"
    volume: 4
    title: "The Spanish Marriage"
    date: "1554 CE"
    region: "England"
    poem: |
      Mary married Philip of Spain,
      At Winchester, in July —
      England yoked to the Spanish crown,
      Under a foreign sky.
      The people feared a Spanish king,
      The Protestants feared worse —
      A marriage made for politics,
      That felt like half a curse.
      I stood among the wedding guests,
      Saw the Spanish banners fly —
      An English queen, a Spanish prince,
      And the future asking why.
    description: "Mary marries Philip of Spain; England is yoked to the Spanish crown."
    status: "first draft"
    sha256: "870ac45b2063414d645f64c54a0003ee88908c5388f640a3f749112f7878db4f"
  - number: "2403"
    volume: 4
    title: "The Jesuit Village"
    date: "1554 CE"
    region: "Brazil"
    poem: |
      Two Jesuits in the wilderness —
      Anchieta and Nóbrega by name,
      Founded São Paulo de Piratininga,
      A mission, not for fame.
      A village of converts and priests,
      In the Brazilian wild —
      That would grow to twenty million,
      From a mission meek and mild.
      I stood upon that plateau,
      Saw the huts, the chapel small —
      The seed of South America's giant,
      The greatest of them all.
    description: "Jesuit priests found São Paulo in the Brazilian wilderness — a mission that will become a megacity."
    status: "first draft"
    sha256: "38254b9e75c0a20918effa3957bddddf36dff330d3febb4953c632430bea715f"
  - number: "2404"
    volume: 4
    title: "The Peace of Augsburg"
    date: "1555 CE"
    region: "Germany"
    poem: |
      At Augsburg, the princes made their peace —
      Cuius regio, eius religio,
      Each ruler chooses his land's faith,
      Lutheran or Catholic, high or low.
      The wars would pause for sixty years,
      A truce, not a true accord —
      But Germany could breathe again,
      And lay aside the sword.
      I heard the recess read aloud,
      Felt the tension ease —
      Peace bought with a prince's soul:
      The price of such release.
    description: "Each German prince chooses his land's faith — cuius regio, eius religio; the wars pause for sixty years."
    status: "first draft"
    sha256: "c1c05f20f8dd2ae2340b506fbf4279789dd59c4a0bc361d913c9532b990d5dab"
  - number: "2405"
    volume: 4
    title: "The Oxford Martyrs"
    date: "1555 CE"
    region: "England"
    poem: |
      Latimer and Ridley burned at Oxford,
      In the ditch outside the wall —
      Latimer's last words to his friend:
      "We shall light a candle that shall never be put out."
      The flames took them in October,
      The crowd watched, some wept —
      A candle lit in Oxford
      That England ever kept.
      I stood among the onlookers,
      Heard the fire's roar —
      Two bishops burning for their faith,
      And the light forevermore.
    description: "Bishops Latimer and Ridley burn at Oxford; Latimer's candle \"shall never be put out.\""
    status: "first draft"
    sha256: "3d8802c9533bc31696c596d7b5ace556082e1bf1666b7124436a290e2249746c"
  - number: "2406"
    volume: 4
    title: "The Two Sultans' Peace"
    date: "1555 CE"
    region: "Ottoman Empire"
    poem: |
      Suleiman and Tahmasp made their peace —
      At Amasya, the treaty signed,
      The first between the Turk and Persian,
      A border defined.
      Mesopotamia to the Sultan,
      The Caucasus divided fair —
      Two empires, two faiths, one frontier,
      And a pause in the warfare.
      I watched the envoys exchange the seals,
      Saw the relief on every face —
      The first Ottoman-Safavid peace,
      And a moment's grace.
    description: "Suleiman and Persia sign the Peace of Amasya — the first Ottoman-Safavid treaty."
    status: "first draft"
    sha256: "67e1bb136392ceeecc4b6c063e8f2787a07d6d9cd698b53b9c5df169b3c8d6be"
  - number: "2407"
    volume: 4
    title: "The Boy on the Throne"
    date: "1556 CE"
    region: "India"
    poem: |
      Thirteen, and emperor of Hindustan —
      Akbar took the Mughal throne,
      A boy with a regent at his side,
      Bairam Khan, the power known.
      His father Humayun was dead,
      The empire hung by a thread —
      But the boy would grow to greatness,
      As the histories have said.
      I saw him crowned at Kalanaur,
      A brick for a throne, they say —
      The greatest Mughal of them all,
      Beginning his long day.
    description: "Thirteen-year-old Akbar inherits the Mughal throne; a regent holds it for him while he grows."
    status: "first draft"
    sha256: "6e9f8f2fccc38cf31db6585fce44179490c82dede6a47b62d2d2132095238c41"
  - number: "2408"
    volume: 4
    title: "The Second Panipat"
    date: "1556 CE"
    region: "India"
    poem: |
      Hemu marched on Delhi with his elephants,
      The Hindu king, the victor's pride —
      Bairam Khan met him at Panipat,
      And turned the turning tide.
      An arrow took Hemu in the eye,
      His army broke and fled —
      Akbar's regent held the throne,
      And the boy's crown was wed.
      I watched the elephants panic,
      Saw the field turn red —
      The second battle of Panipat,
      And the Mughal line held.
    description: "Akbar's regent Bairam Khan crushes Hemu at Panipat; the boy keeps his crown."
    status: "first draft"
    sha256: "add881527741203e25d54f4eaf41e73fcc9ff0a1e98ddc6d127da1fb6bacc383"
  - number: "2409"
    volume: 4
    title: "The Emperor Abdicates"
    date: "1556 CE"
    region: "Europe"
    poem: |
      Charles gave up his thrones at Brussels,
      In tears, before the court —
      The empire that the sun never set on,
      Now too heavy to support.
      He retired to Yuste's monastery,
      To pray, and fish, and die —
      His empire split between his son and brother,
      Spain and Austria, low and high.
      I watched him lean upon his staff,
      Saw the gout-racked emperor bow —
      The mightiest monarch of the age,
      A monk at last, somehow.
    description: "Charles V gives up his thrones and retires to a monastery; his empire splits between Spain and Austria."
    status: "first draft"
    sha256: "5b721e444b206da94479e9e7192281ca4aa44a30a10d86c9e92c93fb64f771eb"
  - number: "2410"
    volume: 4
    title: "The King's Bankruptcy"
    date: "1557 CE"
    region: "Spain"
    poem: |
      Philip's Spain went bankrupt —
      Even Potosí's silver couldn't pay,
      For endless wars in France and Flanders,
      The debts piled day by day.
      The Genoese bankers held the notes,
      The crown suspended payment due —
      The richest empire on earth,
      And the coffers empty too.
      I saw the ledgers in Seville,
      The red ink running deep —
      Silver mountains couldn't fill
      The debts that war would keep.
    description: "Philip II's Spain goes bankrupt — even silver mountains cannot pay for endless war."
    status: "first draft"
    sha256: "4001c61dc36c4f86e3346fa895c36c777539615553d5f5239ce5bc872165a162"
  - number: "2411"
    volume: 4
    title: "The Virgin Queen"
    date: "1558 CE"
    region: "England"
    poem: |
      Elizabeth took the throne at twenty-five,
      At Hatfield, in November's chill —
      Brilliant, learned, Protestant,
      With an iron will.
      "I have the heart of a king,"
      She'd say, "though a woman's frame" —
      And England would have its golden age,
      Under the Virgin's name.
      I saw her ride to London,
      The crowds in wild delight —
      The unwanted daughter of Anne Boleyn,
      Now England's guiding light.
    description: "Elizabeth I takes the throne — twenty-five, brilliant, Protestant England's hope."
    status: "first draft"
    sha256: "975954b3c4aecd41950f205e79cb9587372c99872a5b204e87d3fc9b1e85850a"
  - number: "2412"
    volume: 4
    title: "Calais Retaken"
    date: "1558 CE"
    region: "France"
    poem: |
      The French took Calais in January,
      England's last foothold on the shore —
      Two hundred years the English held it,
      And would hold it nevermore.
      Mary wept to lose it,
      "Calais will be found in my heart" —
      An island nation, cut adrift,
      From the continent apart.
      I watched the French banners rise
      Over the harbor's gray —
      The end of England's continental dream,
      On a winter's day.
    description: "France seizes Calais; England's last foothold on the continent is gone."
    status: "first draft"
    sha256: "87608eb38fa6c35424195a0c28d624f61ca81569f78018759b4ec6365c63fe99"
  - number: "2413"
    volume: 4
    title: "The Monk Emperor's End"
    date: "1558 CE"
    region: "Spain"
    poem: |
      Charles died in his cell at Yuste,
      The monk emperor, alone —
      Gout, malaria, and melancholy,
      On a simple wooden throne.
      They'd buried him as a monk,
      Then moved him, grand, to the Escorial —
      The mightiest ruler of his age,
      Ended monastical.
      I stood outside his narrow cell,
      Heard the monks chant low —
      An emperor who gave it all away,
      And died with nothing to show.
    description: "Charles V dies in his monastery cell at Yuste — the monk emperor's end."
    status: "first draft"
    sha256: "f9654a7879fa76b681fcf005f4d4bc177c8bb4011105a7c8a85546ae175c0263"
  - number: "2414"
    volume: 4
    title: "The Joust That Killed a King"
    date: "1559 CE"
    region: "France"
    poem: |
      Henry jousted at the tournament,
      To celebrate the peace —
      Montgomery's lance splintered,
      And the king's life would cease.
      A splinter through the visor,
      Into the eye, the brain —
      Ten days of agony,
      Then France would feel the pain.
      I watched them carry him away,
      The golden king brought low —
      A splintered lance in a summer joust,
      And the wars of religion would grow.
    description: "Henry II dies of a splintered lance in a tournament; France slides toward religious war."
    status: "first draft"
    sha256: "e6fa004e554b22fe10e5c1d47b6fb177c3da25c5ded3d6cb233f402d7b3a274b"
  - number: "2415"
    volume: 4
    title: "The Trumpet of the Kirk"
    date: "1559 CE"
    region: "Scotland"
    poem: |
      Knox came home to Scotland,
      The trumpet of the Kirk —
      His sermons shook the nation,
      And set the Catholics to work.
      "The First Blast of the Trumpet,"
      Against the female rule —
      But Scotland heard the Gospel,
      In his thunder, not so cruel.
      I heard him preach at Perth,
      Saw the crowds stand still —
      A voice that toppled altars,
      By the power of its will.
    description: "John Knox returns to Scotland and preaches the Kirk into revolution."
    status: "first draft"
    sha256: "61ed6d3a71e867e23c8d42471c9ace5a8e0e21c437e5e4e83912e46e7e43d952"
  - number: "2416"
    volume: 4
    title: "The Kirk Is Born"
    date: "1560 CE"
    region: "Scotland"
    poem: |
      The Scottish parliament met,
      And voted the old faith out —
      The Protestant confession adopted,
      The Mass no more, no doubt.
      The Kirk was born in law that day,
      Presbyterian, stern, and free —
      A nation choosing its own conscience,
      For all the world to see.
      I sat in the parliament hall,
      Heard the vote ring out —
      Scotland's soul by legislation,
      Beyond a shadow of doubt.
    description: "Scotland's parliament adopts the Protestant confession; the old faith is outlawed and the Kirk is born."
    status: "first draft"
    sha256: "98cd573db2b64218e2443b5d5dc3fcdae7639f5fcfb97a279e2f482a8edb077a"
  - number: "2417"
    volume: 4
    title: "The Bay Retaken"
    date: "1560 CE"
    region: "Brazil"
    poem: |
      The French had built their Antarctic dream,
      On Guanabara's lovely bay —
      Villegagnon's colony, France Antarctique,
      But Portugal had its say.
      Mem de Sá sailed with his fleet,
      And drove the French away —
      The bay was Portugal's once more,
      And Rio's future day.
      I watched the ships exchange their fire,
      Saw the French flag come down —
      A bay that would hold a marvelous city,
      Now a Portuguese town.
    description: "Portugal drives the French from Guanabara Bay, ending France's Antarctic dream in Brazil."
    status: "first draft"
    sha256: "1007536c7597030ea34f71a0616e064a4bce80ae5b47cf7d89d4f502a245ab73"
  - number: "2418"
    volume: 4
    title: "The Widowed Tsar"
    date: "1560 CE"
    region: "Russia"
    poem: |
      Anastasia died in August,
      The tsar's beloved wife —
      Ivan buried her in the Kremlin,
      And the darkness took his life.
      The gentle years were over,
      The boyars would feel his wrath —
      The Terrible turned terrible,
      On a darker path.
      I watched him at the funeral,
      Saw the grief turn to rage —
      The widowed tsar, alone,
      Would fill a bloody page.
    description: "Ivan buries his beloved wife Anastasia; the gentle years of his reign end and the terror begins."
    status: "first draft"
    sha256: "1fbb07d41e8ce7fe26eae9a67b109dad9313c27ddc7bc5c8f658864e2a08bfae"
  - number: "2419"
    volume: 4
    title: "The Massacre at Vassy"
    date: "1562 CE"
    region: "France"
    poem: |
      The Duke of Guise's men rode in,
      On Huguenots at prayer —
      At Vassy, in a barn, they killed,
      And France was laid bare.
      Fifty dead, a hundred wounded,
      Worship turned to war —
      The Wars of Religion had begun,
      And would rage for decades more.
      I heard the shots in that small town,
      Saw the prayer books in the mud —
      A massacre at a country barn,
      That drowned a land in blood.
    description: "Catholic troops slaughter Huguenots at prayer at Vassy; France's Wars of Religion begin."
    status: "first draft"
    sha256: "6e65302c4f39356a99f9d0826ff8cf643c04467fb64988bcf47f19f5dc4b8c77"
  - number: "2420"
    volume: 4
    title: "The First Slave Run"
    date: "1562 CE"
    region: "Atlantic"
    poem: |
      John Hawkins sailed from Plymouth,
      With three ships and a plan —
      To steal Africans from the Guinea coast,
      And sell them, man by man.
      The Spanish bought them in the Caribbean,
      The profit was immense —
      The first English slaving voyage,
      A commerce of offense.
      I watched them load the human cargo,
      Heard the chains, the cries —
      England had joined the trade in souls,
      Under the seagull skies.
    description: "John Hawkins sails the first English slaving voyage to the Spanish Caribbean — England joins the trade in souls."
    status: "first draft"
    sha256: "ea58764579c168c15b8535f23db508cc647bb9b886c26a7eb846b857cd389389"
  - number: "2421"
    volume: 4
    title: "The Council Closes"
    date: "1563 CE"
    region: "Italy"
    poem: |
      Eighteen years, and then it closed —
      The Council of Trent was done,
      Doctrine defined for centuries,
      The Counter-Reformation won.
      The Mass in Latin, the saints restored,
      The seminaries decreed —
      A Church rebuilt, refortified,
      For the battles it would lead.
      I heard the final session,
      Saw the bishops sign —
      Four hundred years of Catholic faith,
      Defined in black and white.
    description: "The Council of Trent ends, having redrawn Catholic doctrine for four centuries."
    status: "first draft"
    sha256: "3e76d1d5f46f5f469edacf331ae375efead168e72429ca5db5d907efd432e7e5"
  - number: "2422"
    volume: 4
    title: "The Great Hand Is Stilled"
    date: "1564 CE"
    region: "Italy"
    poem: |
      Michelangelo died in Rome,
      Eighty-eight years old —
      The great hand stilled at last,
      The master growing cold.
      David, the Ceiling, the Judgment,
      The dome not yet complete —
      The Renaissance's greatest artist,
      Admitted his defeat.
      I stood beside his deathbed,
      In his house near the Forum's stone —
      A giant who had carved the ages,
      Now lying still, alone.
    description: "Michelangelo dies in Rome at eighty-eight; the Renaissance's great hand is stilled."
    status: "first draft"
    sha256: "9d7ac386fe0e1cb56d1b93c50304a0d1ca672a6c393911448a017a79375f1625"
  - number: "2423"
    volume: 4
    title: "The Swan of Avon Is Born"
    date: "1564 CE"
    region: "England"
    poem: |
      In Stratford, in a timber house,
      A boy was born in April —
      William Shakespeare, the glover's son,
      Who'd make the world his chapel.
      No one marked the day,
      No bells, no great acclaim —
      Just a baby in a market town,
      With an ordinary name.
      I stood outside that house,
      Heard the infant cry —
      The Swan of Avon, newly born,
      Under the Warwickshire sky.
    description: "William Shakespeare is born in Stratford-upon-Avon — the glover's son who will remake the world's stage."
    status: "first draft"
    sha256: "7ca5d0b16323442d071100f306920ba9dcc01ef21e0b6bc0a933b35c680b5eb9"
  - number: "2424"
    volume: 4
    title: "The Tsar Walks Away"
    date: "1564 CE"
    region: "Russia"
    poem: |
      Ivan left Moscow in December,
      A staged abdication, a test —
      He'd return with absolute power,
      The Oprichnina, his behest.
      The boyars begged him to return,
      He named his price: no limit —
      Absolute power, life and death,
      And they'd submit.
      I watched the sledges leave the Kremlin,
      Saw the city hold its breath —
      A tsar who walked away to rule,
      By terror and by death.
    description: "Ivan abandons Moscow in a staged abdication, then returns with absolute power and the Oprichnina."
    status: "first draft"
    sha256: "76bfdfda68377ecd18cd56a7395e61dc863bab2fea60a6722949c8b357febfbd"
  - number: "2425"
    volume: 4
    title: "The Road Home"
    date: "1565 CE"
    region: "Pacific"
    poem: |
      Urdaneta found the way back —
      North to Japan's cold stream,
      Then east across the Pacific,
      To Mexico, a dream.
      The Manila galleons would sail it,
      For two hundred fifty years —
      Silver west, and silk east,
      Through storms and hopes and fears.
      I sailed that first return voyage,
      Felt the Kuroshio's pull —
      The road home across the ocean,
      That made the Spanish full.
    description: "Urdaneta finds the return sailing route from Asia to Mexico — the Manila galleon run is born."
    status: "first draft"
    sha256: "c7c7aeb0a9ea5ec27b11f70c5e99edfd5367d231703da49dbf968b45c9490700"
  - number: "2426"
    volume: 4
    title: "The Great Siege"
    date: "1565 CE"
    region: "Malta"
    poem: |
      Suleiman sent his fleet to Malta,
      Thirty thousand men or more —
      The Knights of St. John held the forts,
      On that rocky shore.
      Four months of siege, of mines and assaults,
      The Turks bled on the walls —
      Then the relief came from Sicily,
      And the Ottoman tide falls.
      I stood upon the ramparts,
      Saw the Turkish dead —
      The Great Siege broken,
      And the legend spread.
    description: "Suleiman's fleet besieges Malta; the Knights hold, and the Ottoman tide turns."
    status: "first draft"
    sha256: "14b68090ce6981b4d28b2d2d212dd0d2f16f0daff300e4ad65fb71f52a3878ab"
  - number: "2427"
    volume: 4
    title: "The Oldest City"
    date: "1565 CE"
    region: "Florida"
    poem: |
      Menéndez founded St. Augustine,
      On Florida's sandy shore —
      The oldest lasting European city,
      In North America, evermore.
      He'd massacred the French at Matanzas,
      Then built his town of wood —
      A Spanish flag on the Atlantic,
      Where the palmettos stood.
      I walked its first muddy streets,
      Saw the fort rise slow —
      A city that would never die,
      Four centuries ago.
    description: "Spain founds St. Augustine — the oldest lasting European city in North America."
    status: "first draft"
    sha256: "3854a57755a3a92b4d1edc203e607be9ab4477f5b80e3af83396b05f857dbe93"
  - number: "2428"
    volume: 4
    title: "The Breaking of the Images"
    date: "1566 CE"
    region: "Netherlands"
    poem: |
      The Calvinists rose in the Low Countries,
      And smashed the church's art —
      Statues, altars, paintings,
      Torn apart.
      The Beeldenstorm, the image-breaking,
      Swept from town to town —
      A fury against the idols,
      That brought the churches down.
      I watched them in Antwerp's cathedral,
      Saw the saints fall from their niche —
      A reformation of the hammer,
      That left the churches rich in pitch.
    description: "Calvinist mobs smash church statues across the Low Countries — the Beeldenstorm, the breaking of the images."
    status: "first draft"
    sha256: "3695be629bee80104d30e0812836400c5c6534ad8631464a214585650ed6b8ec"
  - number: "2429"
    volume: 4
    title: "The Magnificent Falls"
    date: "1566 CE"
    region: "Ottoman Empire"
    poem: |
      Suleiman died in his tent,
      Campaigning in Hungary's plain —
      Seventy-one, the Magnificent,
      Would never march again.
      They hid his death from the army,
      Till the fortress fell —
      Then carried him home to Istanbul,
      Where the great mosques tell.
      I stood outside his campaign tent,
      Heard the silence in the camp —
      The Ottoman peak had passed,
      Like a snuffed-out lamp.
    description: "Suleiman dies campaigning in Hungary; the Ottoman peak passes with him."
    status: "first draft"
    sha256: "ef1d44695ab51fc634a43db08b40222e9eb827ad251607b526f03946bb533187"
  - number: "2430"
    volume: 4
    title: "The Queen in Chains"
    date: "1567 CE"
    region: "Scotland"
    poem: |
      Mary was forced to abdicate,
      At Lochleven's lonely isle —
      Her infant son was crowned James VI,
      And she was left awhile.
      She'd escape, she'd flee to England,
      And Elizabeth would hold her fast —
      Nineteen years a prisoner,
      Till the axe fell at last.
      I saw her sign the abdication,
      Saw the tears upon her face —
      A queen in chains, a crown in cradle,
      And Scotland's dark disgrace.
    description: "Mary Queen of Scots is forced to abdicate; her infant son James VI is crowned."
    status: "first draft"
    sha256: "e351dc40e5d0601c6ca0a488202cbf45d25600bf552061c8c3512b3ab24daf6b"
  - number: "2431"
    volume: 4
    title: "The Beggars' War"
    date: "1568 CE"
    region: "Netherlands"
    poem: |
      William of Orange raised the revolt,
      The Beggars' war began —
      Against the Spanish tercios,
      The Dutch would make their stand.
      They'd fight for eighty years,
      For freedom and for trade —
      A nation born in the marshes,
      That the sea had made.
      I marched with William's rebels,
      Saw the dikes, the floods —
      The Dutch fight for freedom,
      Written in their blood.
    description: "William of Orange raises the revolt; the Dutch fight for freedom begins and will last eighty years."
    status: "first draft"
    sha256: "c67c93067412fe292c8eb52c60d838d58936dd4694617dae903e67221c025585"
  - number: "2432"
    volume: 4
    title: "The Prince's Death"
    date: "1568 CE"
    region: "Spain"
    poem: |
      Don Carlos died in Madrid,
      A prisoner in his father's keep —
      Mad, deformed, and dangerous,
      His secrets buried deep.
      Philip's heir, the troubled prince,
      Locked away from light —
      Did his father have him murdered?
      The question haunts the night.
      I walked the palace corridors,
      Heard the whispers low —
      A prince who died a prisoner,
      And no one truly knows.
    description: "Philip's heir Don Carlos dies a prisoner in Madrid; the succession darkens and rumors haunt the court."
    status: "first draft"
    sha256: "722af420b716ebd462596ff8fba9a9e7291eecb5a1ec5ee02f9ccd9bc04352d8"
  - number: "2433"
    volume: 4
    title: "The Mountain Revolt"
    date: "1568 CE"
    region: "Spain"
    poem: |
      The Moriscos rose in the Alpujarras,
      Against forced conversion's chain —
      They'd been Muslims, made Christians,
      Now they'd fight again.
      Spain answered with fire and sword,
      Don John of Austria's might —
      Two years of mountain warfare,
      In the cold and in the night.
      I climbed those mountain villages,
      Saw the smoke rise high —
      A revolt of the converted,
      That was doomed to die.
    description: "The Moriscos of Granada rise against forced conversion; Spain answers with fire and Don John crushes them."
    status: "first draft"
    sha256: "961dc9a2ab54bf6565b433d8edeb548a2b7982d94bfdd22e6b23e5a9cfbcc795"
  - number: "2434"
    volume: 4
    title: "The World Remapped"
    date: "1569 CE"
    region: "Flanders"
    poem: |
      Mercator published his world map,
      With the projection sailors know —
      The loxodrome as a straight line,
      Wherever the winds blow.
      It stretched the poles, it warped the lands,
      But the compass course ran true —
      For centuries, every chart at sea
      Would follow Mercator's clue.
      I saw that first great atlas,
      Felt the world grow wide —
      A map that guided sailors,
      On every ocean's tide.
    description: "Mercator publishes his world map with the projection that will guide sailors for centuries."
    status: "first draft"
    sha256: "43656be204af92d9e93730c3fd44f985754848ee2ea2572d2f2516bd43cded00"
  - number: "2435"
    volume: 4
    title: "The Island Falls"
    date: "1570 CE"
    region: "Cyprus"
    poem: |
      The Ottomans took Nicosia,
      After a brutal siege —
      Twenty thousand dead in the streets,
      No quarter, no reprieve.
      Famagusta held a little longer,
      Then Bragadin was flayed —
      Venice's Cyprus crumbling,
      And the price was paid.
      I walked Nicosia's broken walls,
      Saw the aftermath of war —
      An island falling to the Turk,
      And the sea's red shore.
    description: "Ottoman troops take Nicosia; Venice's Cyprus begins to crumble in blood."
    status: "first draft"
    sha256: "7691e85cc45dc3996f1a4b0d63ad0c751f35be872f195e7f232bf6afe749b54d"
  - number: "2436"
    volume: 4
    title: "The Tomb of the Father"
    date: "1570 CE"
    region: "India"
    poem: |
      Humayun's tomb rose in Delhi,
      The first great Mughal garden-tomb —
      Red sandstone and white marble,
      A paradise from gloom.
      His widow built it for his memory,
      A garden for the dead —
      The model for the Taj to come,
      In beauty widespread.
      I walked its charbagh gardens,
      Saw the dome against the sky —
      The first of the Mughal wonders,
      Where emperors lie.
    description: "Humayun's tomb rises in Delhi — the first great Mughal garden-tomb, model for the Taj."
    status: "first draft"
    sha256: "62f35d78a4542dc3106b361ae566251c1d60a8d1e3a17481728ec5d135984174"
  - number: "2437"
    volume: 4
    title: "The Cross Against the Crescent"
    date: "1571 CE"
    region: "Mediterranean"
    poem: |
      At Lepanto the fleets collided —
      Two hundred galleys on each side,
      The Holy League against the Turk,
      On the turning tide.
      Don John led the Christian left,
      The Turks broke by noon —
      Thirty thousand dead at sea,
      Under the autumn moon.
      I stood upon the Spanish deck,
      Heard the cannon's roar —
      The sea's greatest galley battle,
      And the Ottoman no more.
    description: "At Lepanto the Holy League smashes the Ottoman fleet — the sea's greatest galley battle."
    status: "first draft"
    sha256: "9e8afd87ba9609667dd470e7d9612ef62e285d4b4e130731318cb89e1e78ad1d"
  - number: "2438"
    volume: 4
    title: "The Pearl of the Orient"
    date: "1571 CE"
    region: "Philippines"
    poem: |
      Legazpi founded Manila,
      On the bay's fair shore —
      The far anchor of Spain's Pacific,
      The Pearl of the Orient's door.
      The galleons would come each year,
      From Acapulco's strand —
      Silver for silk, the trade of empires,
      Across the ocean's hand.
      I walked Manila's first streets,
      Saw the walls rise high —
      A Spanish city in the tropics,
      Under the Asian sky.
    description: "Legazpi founds Manila, the far anchor of Spain's Pacific empire."
    status: "first draft"
    sha256: "5ef26869c8fe0c51ddcc707667c051fd74a9efd3ed60a9e4e8414666f2d24c9b"
  - number: "2439"
    volume: 4
    title: "The Wedding of Blood"
    date: "1572 CE"
    region: "France"
    poem: |
      They came to Paris for a wedding —
      Margaret and Henry of Navarre,
      A Catholic bride, a Huguenot groom,
      To end the religious war.
      But on St. Bartholomew's Day,
      The bells rang for the kill —
      Thousands of Huguenots slaughtered,
      In Paris, on the hill.
      I fled through streets of blood,
      Saw the Seine run red —
      A wedding turned to massacre,
      And the marriage of the dead.
    description: "On St. Bartholomew's Day, Catholics massacre thousands of Huguenots in Paris — the wedding of blood."
    status: "first draft"
    sha256: "71801fcc7ca39386e12db73ad5cba593d4b84194673d14bc0ebfecf1d090b9d7"
  - number: "2440"
    volume: 4
    title: "The Horde Broken"
    date: "1572 CE"
    region: "Russia"
    poem: |
      The Crimean Tatars rode for Moscow,
      Forty thousand strong —
      But at Molodi, the Russians waited,
      And the battle wasn't long.
      The gulyay-gorod, the mobile fortress,
      Broke the Tatar charge —
      The last great raid toward Moscow,
      Ended, small and large.
      I watched the Tatar horsemen fall,
      Saw the steppe turn red —
      The Horde was broken at Molodi,
      And the raiders fled.
    description: "At Molodi, Russia crushes the Crimean Tatars' last great raid toward Moscow."
    status: "first draft"
    sha256: "39ed8e7a55d95d978eee120dbeb6ae2c351d32faca9235d3a49bc8dad96df106"
  - number: "2441"
    volume: 4
    title: "The Last Shogun Falls"
    date: "1573 CE"
    region: "Japan"
    poem: |
      Nobunaga drove the shogun out,
      The last Ashikaga, Yoshiaki —
      Japan's warring age was tilting,
      Toward union, toward the key.
      The shogunate was over,
      The daimyo fought alone —
      But Nobunaga's guns and ambition
      Would claim the Chrysanthemum throne.
      I watched the shogun flee Kyoto,
      Saw Nobunaga's banners fly —
      An age of warlords ending,
      Under the Japanese sky.
    description: "Oda Nobunaga drives out the Ashikaga shogun; Japan's warring age tilts toward union."
    status: "first draft"
    sha256: "fc631f16141d10547946ffb4216833fd4333c9254d2022eaefcc618709acdb32"
  - number: "2442"
    volume: 4
    title: "The Draft of the Mines"
    date: "1574 CE"
    region: "Bolivia"
    poem: |
      Toledo chained the Andes to Potosí,
      The mita draft, the forced labor —
      Villages emptied of their men,
      For the silver's favor.
      They'd work the mines in the freezing cold,
      Mercury poisoning their breath —
      The silver flowed to Spain's king,
      And the Andes paid in death.
      I saw the conscripts march away,
      Heard the women weep —
      A mountain eating a people,
      While the empire slept.
    description: "Viceroy Toledo chains the Andes to Potosí with the mita labor draft; silver flows, villages empty."
    status: "first draft"
    sha256: "01456827c71b3033faac15f770929ad794fc0dec8daad8bfab5145b168a794c2"
  - number: "2443"
    volume: 4
    title: "The Guns Win"
    date: "1575 CE"
    region: "Japan"
    poem: |
      At Nagashino, the Takeda charged —
      The finest cavalry in Japan,
      Against Nobunaga's palisades,
      And the muskets of his clan.
      Three thousand guns in rotating ranks,
      Fired volley after volley —
      The horsemen fell like autumn leaves,
      In the summer's folly.
      I stood behind the wooden stakes,
      Heard the muskets' roar —
      The gun had beaten the sword,
      Forevermore.
    description: "At Nagashino, Nobunaga's musket lines shred the Takeda cavalry — the gun beats the sword."
    status: "first draft"
    sha256: "3f9d57243cbe6ca3005811509e8338b32980968c48de3d57020e90ea104931eb"
  - number: "2444"
    volume: 4
    title: "The House of Worship"
    date: "1575 CE"
    region: "India"
    poem: |
      I stood in the courtyard at Fatehpur Sikri
      when the doors swung open and the arguing began.
      Akbar had built a hall for every god on earth
      and told the priests: come in, and speak your truth.
      I watched a Muslim scholar pace the marble floor,
      a Brahmin unroll his scrolls, a Jesuit cross himself,
      a Jain monk covering his mouth so no small life
      would die on his breath — all of them shouting at once.
      The emperor sat above it all, listening,
      as if the clamor of all faiths at once
      might add up to something single and quiet —
      one house big enough for every kind of prayer.
    description: "At Fatehpur Sikri, Akbar opens the Ibadat Khana — a hall where every faith is invited to argue before the emperor himself."
    status: "first draft"
    sha256: "a3357e96abdc5f4f9eac18fa5ac818cb06e0b670ee5c86563ce35eca4e2361db"
  - number: "2445"
    volume: 4
    title: "The House of Debate"
    date: "1575 CE"
    region: "Mughal India"
    poem: |
      I came back the second night, and the third —
      the debates ran hotter than the desert outside.
      The mullah called the Jesuit a liar;
      the Jesuit called the mullah blind.
      The Hindu pandit smiled at both of them
      and said the truth was older than their books.
      Akbar leaned forward on his cushion, hungry,
      drinking it all in like water in a drought.
      He wanted one faith for all his people,
      but what he got was better — the honest noise
      of minds that would not bend.
      I left before dawn, my ears still ringing,
      glad to have heard the world argue with itself
      and live to tell it.
    description: "Night after night at the Ibadat Khana, scholars of four faiths argue before Akbar — and the traveler listens to the world argue with itself."
    status: "first draft"
    sha256: "f1becf0d8f3160acbfc9bba713c472847e64acac8aa8bf0ea468e8951f69573d"
  - number: "2446"
    volume: 4
    title: "The Spanish Fury"
    date: "1576 CE"
    region: "Antwerp"
    poem: |
      I was in Antwerp when the pay ran out.
      The Spanish tercios had not been paid in months,
      and hunger is a better general than any king.
      They came through the gates like a breaking dam —
      three days of fire, three days of the sword.
      I hid in a cellar and heard the city hall burn,
      heard the richest city in the Netherlands
      screaming in five languages.
      When it was over, a thousand lay dead in the streets,
      and every burgher in the Low Countries
      knew exactly who the enemy was.
      Spain had paid its soldiers in blood and ash —
      and the Dutch would remember the price forever.
    description: "Unpaid Spanish troops sack Antwerp for three days, burning its city hall — and turning the whole Netherlands against Spain for good."
    status: "first draft"
    sha256: "480e1a6b967865557afe74efc9adf9214458e95174e30bbe4efe628f90d3d48a"
  - number: "2447"
    volume: 4
    title: "The Star Castle"
    date: "1576 CE"
    region: "Denmark"
    poem: |
      I sailed to the island of Hven to see it —
      Uraniborg, Tycho Brahe's castle of the stars,
      red brick and gardens and brass instruments
      bigger than a man, polished like church bells.
      No telescope yet — only the naked eye,
      but an eye trained like a swordsman's arm.
      Tycho measured every star to the minute of arc,
      twenty years of nights, his nose half gold
      from a duel, his moose drunk in the stairwell.
      I stood beside him on the terrace at midnight
      while he called out numbers to his scribe,
      and understood: this strange proud man
      was building the ladder the next age would climb.
    description: "On a Danish island, Tycho Brahe raises Uraniborg — the grandest observatory of the age — and maps the heavens by naked eye alone."
    status: "first draft"
    sha256: "02e5410d028a0203e61789ec1e11a5ec5e2e3c14f023f87f6188db103379a1d3"
  - number: "2448"
    volume: 4
    title: "Drake Sails Into the Unknown"
    date: "1577 CE"
    region: "Plymouth"
    poem: |
      I watched them slip out of Plymouth at dawn —
      five little ships, a hundred and sixty men,
      Francis Drake at the prow with the queen's secret blessing
      and a hold full of hunger.
      The Spanish owned those seas; every chart said so.
      Drake meant to steal through them anyway,
      around the bottom of the world and up the far side,
      taking what he could and burning what he couldn't.
      I stood on the dock till the sails were specks.
      Some men sail for God, some for gold —
      Drake sailed for the sheer joy of the taking.
      The Pacific had never seen his like,
      and it was about to.
    description: "Francis Drake slips out of Plymouth with five small ships, bound to circle the globe through seas Spain claims as its own."
    status: "first draft"
    sha256: "3a16103dc9ab5ed2a6829f830a6256f016f46fda40e473951e19d6b41df1a0d9"
  - number: "2449"
    volume: 4
    title: "The Great Comet"
    date: "1577 CE"
    region: "The Skies"
    poem: |
      It hung there for months — a sword of light
      across the winter sky, and all of Europe
      held its breath and read it as an omen.
      Kings would fall, the preachers said. Plague. War.
      Only Tycho did the arithmetic.
      Night after night he measured its place
      against the fixed stars, and the numbers told him
      what no one dared to say aloud:
      it flew beyond the moon, out in the deep —
      where the old books said nothing could change.
      I watched him write it down, hand shaking,
      not with fear but with the thrill of it.
      The heavens were not perfect and unchanging.
      The sky had cracked, and through the crack
      we could all see further than before.
    description: "A great comet blazes over Europe for months; Tycho Brahe's measurements prove it flies far beyond the moon — and the old heavens crack."
    status: "first draft"
    sha256: "b146121d7da5f81595b6fd766281cd585f6de2f2e289bc66e1cbc3e74440426e"
  - number: "2450"
    volume: 4
    title: "The Battle of Three Kings"
    date: "1578 CE"
    region: "Morocco"
    poem: |
      Three kings rode out that morning at Alcácer Quibir.
      By sunset all three were dead.
      Young Sebastian of Portugal, twenty-four,
      dreaming of crusades in shining armor —
      drowned in a Moroccan river, his body never found.
      The old sultan died in his litter, watching.
      The rival sultan died of his sickness in the rout.
      I walked the field the next day among the flies,
      twenty thousand Portuguese dead or taken,
      and a kingdom with no king, no heir, no hope.
      Portugal's throne stood empty in Lisbon,
      and across the border old Philip of Spain
      was already counting the crowns.
      One hot afternoon in Morocco,
      and an empire changed hands.
    description: "At Alcácer Quibir, Portugal's young king and two rival sultans all die in one battle — and Portugal's throne falls vacant."
    status: "first draft"
    sha256: "2d198c83bca920cb0e4f3e61cc331b3cd39d83e4d636e6e176939c7e93ec440e"
  - number: "2451"
    volume: 4
    title: "The Union of Utrecht"
    date: "1579 CE"
    region: "Netherlands"
    poem: |
      In a cold hall at Utrecht, seven provinces
      put their names to a piece of paper
      and swore to stand together against Spain —
      Calvinist Holland, Catholic stragglers, all of them,
      bound by nothing but a shared refusal.
      I watched the delegates argue over every clause,
      suspicious as cats, stubborn as mules —
      and sign anyway.
      No king gave them leave. No pope blessed it.
      Seven small provinces looked at the greatest empire
      on earth and said: we will be one thing now.
      It was the first stone of a republic
      nobody had planned and nobody could stop.
      I have seen empires founded with trumpets;
      this one was founded with a pen,
      in winter, by tired men who would not kneel.
    description: "Seven northern provinces swear the Union of Utrecht against Spain — the first stone of the Dutch Republic, signed with a pen in winter."
    status: "first draft"
    sha256: "023c87d6cfac7b6ec0fcee1151d94f63f8b8c12213d9886214e5eb04f7e7486f"
  - number: "2452"
    volume: 4
    title: "One Crown for Two Kingdoms"
    date: "1580 CE"
    region: "Iberia"
    poem: |
      Philip did not even have to fight for it.
      He marched into Portugal with his tercios,
      the nobles opened the gates, the Cortes bowed,
      and the two greatest seafaring empires on earth
      wore one crown.
      I stood in Lisbon as the Spanish banners rose
      over the harbor where the caravels had sailed
      for India, for Brazil, for the Spice Islands.
      From the Tagus to Manila, from Bahia to Macao,
      one king's writ now ran across half the world.
      The Portuguese wept in the taverns that night —
      not for Sebastian, long dead in Morocco,
      but for themselves, become a province
      of somebody else's empire.
      I drank with them, and understood:
      this was the high-water mark of Spain,
      and high water always turns.
    description: "Philip II marches into Portugal and takes its throne — the two greatest seafaring empires now wear a single crown."
    status: "first draft"
    sha256: "f4d2dbc7561ef66e989b1fd6117935f0974e4aa1fd8a0bb765af527861509adb"
  - number: "2453"
    volume: 4
    title: "The Dutch Say No More"
    date: "1581 CE"
    region: "Netherlands"
    poem: |
      They did it with a document — the Act of Abjuration —
      read aloud in The Hague on a summer day:
      Philip II, king of Spain, was hereby deposed,
      his sovereignty renounced, his name struck out.
      I was in the crowd outside, and I heard the cheer
      that went up from the burghers and the sailors —
      a sound like a dam breaking.
      No more king. No more distant throne in Madrid
      telling them what God to pray to.
      It was the first time in the modern age
      that a people had fired their king by paperwork.
      The ink was barely dry and the war went on,
      but something had changed in the air of Europe:
      a king could be unmade by the people he ruled.
      I wrote the date down carefully.
      I knew I would need it later.
    description: "The Dutch formally depose Philip II — the first modern republic is declared, and a king is unmade by paperwork."
    status: "first draft"
    sha256: "d82f3a03599c7720d85d5cf9224f572d35488e93f0b54ed2e10d756ea7823598"
  - number: "2454"
    volume: 4
    title: "Across the Stone Belt"
    date: "1581 CE"
    region: "Russia"
    poem: |
      Yermak took five hundred Cossacks over the Urals —
      the Stone Belt, the Russians called those mountains —
      into a land no tsar had ever ruled.
      I traveled with the supply train part of the way,
      through forest that went on past imagining,
      rivers wide as seas, winter already breathing
      down our necks in September.
      They fought the Khan's men with muskets and nerve,
      took his capital at Kashlyk, and kept going.
      Five hundred men against a continent —
      and the continent gave way.
      Siberia opened like a door nobody had pushed.
      The furs, the rivers, the endless taiga:
      Russia doubled, tripled, became a giant
      while Europe was looking the other way.
      I stood on a ridge and looked east
      and could not see the end of what they'd won.
    description: "The Cossack Yermak leads a few hundred men over the Urals into Siberia — and opens a continent-sized land for Russia."
    status: "first draft"
    sha256: "5aeffafebba494714460f66f01fb57b2bf007d546186dbf571637d576e7e27e7"
  - number: "2455"
    volume: 4
    title: "The Single Whip"
    date: "1581 CE"
    region: "Ming China"
    poem: |
      Zhang Juzheng did it with a brushstroke —
      folded every tax in the empire into one:
      a single payment, in silver, no more grain levies,
      no more labor service, no more local extortion
      dressed up as a dozen different dues.
      I watched the clerks in a county yamen
      redo their ledgers, grumbling at the new simplicity.
      The peasants understood it at once:
      one whip instead of many.
      Pay the silver, and the year is yours.
      For a generation the Ming breathed easier —
      granaries filled, the coin ran clean,
      the great machine of China hummed.
      One man's reform, one metal, one rule.
      I have seen empires saved by less,
      and lost by more.
      But silver has a price, and the mines were far away —
      across an ocean the Ming barely knew existed.
    description: "Zhang Juzheng folds every Ming tax into a single silver payment — steadying China's economy for a generation on foreign silver."
    status: "first draft"
    sha256: "88864916414c75571eda55a8ad8c1282ecca5a272d0967dbb165e288ea87d06b"
  - number: "2456"
    volume: 4
    title: "Ten Days Vanish"
    date: "1582 CE"
    region: "Rome"
    poem: |
      Pope Gregory signed the bull, and ten days vanished.
      October 4th went to sleep a Thursday;
      October 15th woke up a Friday.
      The calendar had drifted eleven minutes a year
      since Julius Caesar's time, and Easter was sliding
      toward summer — so the Pope simply cut the knot.
      I was in Rome that week, and the confusion
      was delicious: rents due on days that never happened,
      saints' feasts leaping forward, Protestants
      refusing the whole thing as popish trickery.
      England kept the old calendar for 170 years
      out of sheer spite.
      But the stars don't care about spite.
      The new calendar fit the heavens,
      and one by one the nations came around.
      I keep two dates for that autumn in my journal —
      the day that was, and the day that wasn't.
    description: "Pope Gregory XIII cuts ten days from the calendar to fix its drift — Catholic Europe goes to sleep on October 4 and wakes on October 15."
    status: "first draft"
    sha256: "c1b9535bea7a087397fa3a4736e9056d914ccf6821935bd0456f92bdb5aa4fb3"
  - number: "2457"
    volume: 4
    title: "Fire at Honnō-ji"
    date: "1582 CE"
    region: "Japan"
    poem: |
      I was in Kyoto the night Honnō-ji burned.
      Oda Nobunaga, the great unifier, the demon king,
      lay sleeping in the temple with a handful of guards
      when his own general Akechi turned his banners
      and ringed the walls with fire.
      No escape. No last charge. Nobunaga knew it —
      he went inside, shut the doors, and did
      what a samurai does when the game is lost:
      the blade, the poem, the flames closing in.
      I stood in the street and watched the roof fall in,
      and all of Japan held its breath.
      Who would take the sword now?
      Far away, Hideyoshi — the monkey, the peasant's son —
      heard the news on campaign, made peace in a day,
      and force-marched his army back to avenge his lord.
      The fire at Honnō-ji lit more than a temple.
      It lit the fuse on everything that came next.
    description: "Betrayed at Kyoto's Honnō-ji temple, Oda Nobunaga takes his own life as the flames close in — and Hideyoshi seizes his chance."
    status: "first draft"
    sha256: "41794986b0a88ec15135feb578593025aa520e5fd452730f938b16c839ea5d72"
  - number: "2458"
    volume: 4
    title: "The Mystic Dies"
    date: "1582 CE"
    region: "Spain"
    poem: |
      She died at Alba de Tormes, worn out at sixty-seven —
      Teresa of Ávila, the nun who had reformed her order
      one convent at a time, riding mule-back across Spain
      while the Inquisition watched her sideways.
      I had read her book, the Interior Castle —
      seven mansions of the soul, each one brighter,
      God waiting in the innermost room.
      She wrote of prayer the way other people write of love:
      direct, bodily, unashamed.
      They say her last words were about going home.
      The Church would make her a saint and a Doctor,
      the first woman to hold the title —
      but I remember her best as the prioress
      who laughed at her own failures
      and told her nuns that God walks among the pots and pans.
    description: "Teresa of Ávila — reformer of her order, author of the soul's Interior Castle — dies at Alba de Tormes."
    status: "first draft"
    sha256: "c2dfa1b8aaf40466cce1076262a1430b2505244a08a22f89b491b9148a273cd4"
  - number: "2459"
    volume: 4
    title: "England's First Claim"
    date: "1583 CE"
    region: "Newfoundland"
    poem: |
      Humphrey Gilbert waded ashore at St. John's
      with a charter from the queen and a twig in his hand —
      the old ceremony, turf and twig,
      taking possession for England in the sight of God
      and thirty foreign fishermen who didn't care.
      I stood on that rocky harbor and watched him
      read the proclamation to the gulls and the cod boats.
      Newfoundland: England's first piece of the New World,
      claimed with words and a stick.
      He never saw it grow. On the way home
      his little ship went down in a storm off the Azores,
      and the last anyone saw of him he was sitting
      on the deck reading a book, calling out
      that they were as near to heaven by sea as by land.
      The claim outlived the claimant.
      They usually do.
    description: "Humphrey Gilbert plants the English flag at St. John's, claiming Newfoundland — England's first overseas territory — with turf and twig."
    status: "first draft"
    sha256: "0e3ec9c9e7046dae311630293a9d8f63a700f4372ed84293eac93fe31c6f3f93"
  - number: "2460"
    volume: 4
    title: "The Silent Falls"
    date: "1584 CE"
    region: "Netherlands"
    poem: |
      I was in Delft the day it happened —
      in the Prinsenhof, on the staircase,
      where Balthasar Gérard waited with a pistol
      bought with Spanish money.
      William of Orange — the Silent, the father
      of the whole revolt — came down for his dinner
      and took three balls in the chest.
      His last words, they say: God have mercy
      on my soul, and on this poor people.
      I heard the shot from the courtyard
      and ran up to find him bleeding on the stairs,
      his wife screaming, the assassin caught
      trying to climb the wall.
      Spain had put a price on his head for years;
      at last somebody collected.
      The Dutch wept in the streets that night —
      but they did not surrender.
      You cannot kill a cause with a pistol.
      Philip would learn that, slowly, at great cost.
    description: "William of Orange, father of the Dutch revolt, is assassinated on his own staircase in Delft — but the cause survives him."
    status: "first draft"
    sha256: "6bfb6be44876dc1434c51491a541069f468757ff136350c16085a7b48e88843f"
  - number: "2461"
    volume: 4
    title: "The Stone Palace Finished"
    date: "1584 CE"
    region: "Spain"
    poem: |
      Twenty-one years. I watched it rise, stone by stone,
      out of the Guadarrama granite —
      the Escorial: palace, monastery, basilica,
      tomb of kings, all in one gray grid,
      built to the measure of Philip's God and Philip's gloom.
      I walked its corridors the week it was finished:
      a hundred miles of passageways, they said,
      courtyards cold as a chessboard,
      the king's own rooms small and plain as a monk's cell,
      looking out at the high altar.
      Philip built it to hold Spain's soul still —
      one faith, one king, one geometry.
      It is magnificent, and it is a mausoleum
      that happens to have a throne in it.
      I stood in the Pantheon of Kings, under the dome,
      and felt the weight of an empire
      trying to pray itself into permanence.
    description: "After twenty-one years of building, Philip II's vast Escorial — palace, monastery, and tomb of kings — is completed."
    status: "first draft"
    sha256: "799c9d87ac602297de3f5c104e2c1e107b8add85b4e6aa17b237212a2ce67101"
  - number: "2462"
    volume: 4
    title: "The Colony Lands"
    date: "1585 CE"
    region: "Roanoke"
    poem: |
      I came ashore with them at Roanoke —
      a hundred and eight souls wading through the surf,
      soldiers and planters and gentlemen adventurers,
      planting England's flag in the sand of the New World.
      The island was beautiful: live oaks, wild grapes,
      the sound sweet in the air.
      The Algonquians watched from the treeline,
      wondering what these pale hungry people wanted.
      We built the fort, we planted the crops,
      we quarreled magnificently among ourselves.
      Raleigh's money, Grenville's temper, Lane's suspicion —
      a colony founded on hope and bad planning.
      I helped raise the first palisade
      and wondered, driving the stakes,
      how many of us would see England again.
      The gulls cried over the sound.
      The forest kept its own counsel.
    description: "English settlers wade ashore on Roanoke Island — England's first colony in the Americas takes root in hope and bad planning."
    status: "first draft"
    sha256: "0cfea03a9ac333f23aa4c461e08870f7a7161f0240597bc8b5f965009bb62a55"
  - number: "2463"
    volume: 4
    title: "The Scheldt Closed"
    date: "1585 CE"
    region: "Antwerp"
    poem: |
      Parma took Antwerp the slow way — a bridge of boats
      across the Scheldt, a siege of fourteen months,
      hunger doing what cannon could not.
      When the city yielded, the terms were merciful
      and the meaning was not.
      I was there when the merchants made their choice:
      stay under Spanish Catholic rule,
      or pack the ledgers and run north.
      They ran — thousands of them, the richest,
      the cleverest, the most Protestant of Antwerp —
      up the coast to Amsterdam, to Middelburg, to London,
      carrying their capital, their contacts, their craft.
      Spain won the city and lost the economy.
      I watched the barges leave, low in the water
      with strongboxes, and thought:
      this is how the future moves —
      not with armies, but with account books,
      floating north on the tide.
    description: "Parma retakes Antwerp after a brutal siege — and its merchants flee north, carrying their wealth and craft to Amsterdam."
    status: "first draft"
    sha256: "4ad9d0c9a976dd98c560f1c1e99d006fc4a670f74f39c81c3383b42e423fe55f"
  - number: "2464"
    volume: 4
    title: "The Babington Plot"
    date: "1586 CE"
    region: "England"
    poem: |
      It was the letters that killed her —
      letters smuggled in beer barrels, written in cipher,
      answered in cipher, every word read by Walsingham's men
      before Mary ever saw them.
      Anthony Babington, young and Catholic and foolish,
      laid out the whole bright plan: kill Elizabeth,
      raise the north, put Mary on the throne
      with Spanish swords behind her.
      And Mary — nineteen years a prisoner,
      a queen in a cage — wrote back her approval,
      in her own hand, in cipher.
      I read the deciphered copies years later,
      and my blood ran cold at the neatness of it:
      Walsingham had built the trap, baited it,
      and let her walk in with her eyes open.
      The warrant was only a matter of time now.
      A queen had signed her own death
      in invisible ink, and the ink had become visible.
    description: "Mary Queen of Scots is caught backing the Babington plot to kill Elizabeth — her ciphered letters, all read by Walsingham, seal her fate."
    status: "first draft"
    sha256: "51310d366058cb405aca4b22eb151e8eab71d91609e39422f5fce889af0e5ba4"
  - number: "2465"
    volume: 4
    title: "A Queen Loses Her Head"
    date: "1587 CE"
    region: "England"
    poem: |
      Fotheringhay, on a February morning, in the great hall —
      they had built the scaffold draped in black,
      and Mary came down the stairs in a gown of crimson,
      the color of Catholic martyrdom, her head held high.
      I was not in the hall — few were —
      but I heard it from those who stood close enough
      to see: the first blow missed its mark,
      the second severed, the executioner held up the head
      and the auburn hair came away in his hand —
      a wig, and beneath it gray, close-cropped,
      the hair of a woman of forty-four
      who had been a prisoner half her life.
      Her little dog had hidden in her skirts
      and would not leave the body.
      Elizabeth signed the warrant and then raged at it,
      as queens do when the thing is done
      and cannot be undone.
      Two queens, one island, one axe.
      It could never have ended otherwise.
    description: "After nineteen years a prisoner, Mary Queen of Scots is beheaded at Fotheringhay — in crimson, the color of martyrdom."
    status: "first draft"
    sha256: "a3396895a0441a8eed2752424097f19ff3ada8936ce26560687cfa03e4c3cf3f"
  - number: "2466"
    volume: 4
    title: "Singeing the King's Beard"
    date: "1587 CE"
    region: "Cádiz"
    poem: |
      Drake did it in broad daylight — sailed straight
      into Cádiz harbor with twenty-odd ships
      and burned everything that floated.
      I watched from the cliffs as the smoke went up:
      twenty-four Spanish ships, ten thousand tons
      of invasion stores, barrels and biscuit and cordage
      meant for the Armada gathering down the coast.
      Drake's men rowed in among the anchored hulls
      with fire and laughter, and rowed out again
      before the forts could find the range.
      He called it singeing the King of Spain's beard —
      and the beard took a year to grow back.
      Philip's great invasion, meant for that summer,
      waited for the next.
      One raid, one harbor, one afternoon:
      sometimes history turns on a match.
    description: "Drake storms into Cádiz harbor in daylight and burns the ships Spain was gathering for invasion — singeing the king's beard."
    status: "first draft"
    sha256: "65538a61607fe2036ebf773d73d2d5701a3276fcb9beb50770589c2d95dea84b"
  - number: "2467"
    volume: 4
    title: "The Galleon Taken"
    date: "1587 CE"
    region: "The Pacific"
    poem: |
      Off the California coast, in November fog,
      Cavendish's little Desire ran down the Santa Ana —
      a 700-ton Manila galleon, fat with the wealth of Asia:
      silks, spices, musk, and gold, the richest prize
      any Englishman had ever taken.
      I sailed with Cavendish's crew that season,
      and I saw the Spanish captain strike his colors
      without a fight he couldn't win.
      They stripped her for six days — sails, rigging,
      treasure — then set her adrift with the crew
      and burned what they couldn't carry.
      The share-out made every man aboard rich for life.
      Back in Plymouth they rang the bells.
      Spain's Pacific, the closed sea, the private lake —
      was open water now, and every sea-dog in England
      knew the galleons bled gold.
    description: "Thomas Cavendish captures the Spanish treasure galleon Santa Ana off California — the richest prize of the age."
    status: "first draft"
    sha256: "6037fbd74cfd3d9d06a485f9f812fa41191a0936eab9c53dba90fb91f7ef8493"
  - number: "2468"
    volume: 4
    title: "The Armada Broken"
    date: "1588 CE"
    region: "English Channel"
    poem: |
      A hundred and thirty ships came up the Channel
      in a crescent a mile wide — the greatest fleet
      the world had seen, carrying the Pope's blessing
      and thirty thousand men to conquer England.
      I watched from the cliffs of Cornwall as they passed,
      tall castles of oak moving like a floating city.
      And then the English came — smaller, faster,
      their guns firing four shots to Spain's one —
      and at Gravelines the crescent broke.
      But it was the wind that finished it.
      The fireships at Calais scattered them in panic;
      the gales off Scotland and Ireland did the rest.
      Wrecks from the Giant's Causeway to the Hebrides,
      men drowning in armor, the sea giving back nothing.
      Philip heard the news in the Escorial
      and said, I sent them against men, not winds.
      Half the fleet never came home.
      England's island story begins here —
      in a storm, with a prayer answered sideways.
    description: "Storms and English fireships scatter Philip II's great Armada — Spain's dream of invading England drowns in the Channel."
    status: "first draft"
    sha256: "03ecf4c211c6f279d793da74cf562ff663851cf659062b76785444de61fdfa18"
  - number: "2469"
    volume: 4
    title: "The Young Shah"
    date: "1589 CE"
    region: "Persia"
    poem: |
      Sixteen years old, and they put the crown on him —
      Abbas, grandson of the great Tahmasp,
      inheriting a Persia eaten by Uzbeks in the east,
      Ottomans in the west, and his own Qizilbash chiefs
      carving the kingdom like a roast.
      I was in Qazvin when he took the throne,
      a boy with old eyes, watching everything.
      He had learned the lesson of his father's weakness:
      trust no chief, build your own musketeers,
      take back the land inch by inch.
      He would do it. In the years to come
      this boy would retake Tabriz and Baghdad,
      move the capital to Isfahan, make Persia
      shine again — Abbas the Great, they would call him.
      But that winter he was only sixteen,
      standing very straight under a very heavy crown,
      and I could see him deciding, already,
      to be greater than everyone expected.
    description: "Sixteen-year-old Abbas takes Persia's throne amid enemies on every side — and begins the long climb to greatness."
    status: "first draft"
    sha256: "cb25f1f4b319c88c84617d43f396e7aacc6f6ac130a9961797564de4ef239ad8"
  - number: "2470"
    volume: 4
    title: "The Counter-Armada Fails"
    date: "1589 CE"
    region: "Lisbon"
    poem: |
      England tried to return the favor — Drake and Norris
      with a fleet as big as the Armada's, sailing for Lisbon
      to smash Spain while it was down and put a pretender
      on the Portuguese throne.
      I watched them leave Plymouth in a fair wind,
      the whole country drunk on the Armada year.
      It went wrong from the start: no siege guns,
      no money, the Portuguese who were supposed to rise
      staying prudently indoors, disease eating the crews
      like fire eats paper.
      They burned some shipping at Corunna, failed at Lisbon,
      limped home with half their men dead of sickness.
      Drake's luck had run out; the queen never forgave him.
      I stood on the dock as the survivors staggered ashore,
      and learned what every gambler learns:
      the same sea that makes you can unmake you,
      and glory spends fast.
    description: "Drake and Norris sail to strike back at Spain off Lisbon — but disease and bad luck break their fleet, and England's revenge fails."
    status: "first draft"
    sha256: "c8f8c3f40a319d9a385719ba79c4397bd6bbf06a24452c644ff7f4b5b22b1a18"
  - number: "2471"
    volume: 4
    title: "Hunger Behind the Walls"
    date: "1590 CE"
    region: "Paris"
    poem: |
      Henry laid his siege and waited. Paris was Catholic,
      Paris hated him, Paris would starve first —
      and nearly did.
      I slipped through the lines that summer with a grain convoy
      that never arrived, and saw what hunger looks like
      in a great city: dogs gone, then cats, then rats,
      then the leather of harnesses boiled for soup.
      Thirty thousand died, they said, before the end.
      The Spanish held the walls; the Parisians held their pride;
      the children held nothing, being dead.
      In the end it was politics, not bread, that opened the gates —
      Henry would come to terms, convert, be crowned.
      But I have never forgotten the silence of those streets,
      the great city eating itself while the king waited outside,
      patient as winter.
    description: "Henry IV's siege starves Paris into submission — thirty thousand dead of hunger before politics opens the gates."
    status: "first draft"
    sha256: "6985042aeb072f6e14fdf3f81b198dce91229afbaab958512d3a67a196befac4"
  - number: "2472"
    volume: 4
    title: "The Dome Is Raised"
    date: "1590 CE"
    region: "Rome"
    poem: |
      Giacomo della Porta raised it — the great dome
      over St. Peter's, Michelangelo's design made real:
      a hundred and thirty-six meters of stone and faith,
      the biggest dome in Christendom, floating
      over the tomb of the fisherman.
      I climbed the scaffolding in the last months,
      up past the ribs of it, the workers singing
      as they hauled the final stones into place.
      From the lantern at the top, all Rome lay below —
      the Tiber, the seven hills, the ruins of the Caesars —
      and the dome seemed to hold the whole city
      in the palm of its hand.
      Michelangelo had died twenty-six years before,
      never seeing it finished. But his geometry stood there
      in the Roman sky, perfect as mathematics,
      and every dome built since — in London, in Washington —
      is a child of this one.
      I touched the stone. It was warm from the sun.
    description: "Giacomo della Porta crowns St. Peter's with its great dome, completing Michelangelo's design — the mother of all domes since."
    status: "first draft"
    sha256: "f71fbef114686b92f30b067b3ff87ff3d852c52ff32756caf0c02e771fd8543b"
  - number: "2473"
    volume: 4
    title: "CROATOAN"
    date: "1590 CE"
    region: "Roanoke"
    poem: |
      John White came back after three years —
      three years of war and weather keeping him in England —
      and found the colony gone.
      Not burned. Not massacred, by the look of it.
      The houses taken down careful, the fort dismantled,
      the boats gone. A hundred and sixteen people —
      men, women, children, his own granddaughter
      Virginia, the first English child born in America —
      vanished into the trees.
      One word, carved on a palisade post: CROATOAN.
      The name of the friendly island nearby.
      No cross, the distress sign they'd agreed —
      so they had gone willingly, or at least alive.
      I walked that empty settlement with White,
      calling names into the silence.
      The word on the post is still there in my mind,
      cut deep and plain: CROATOAN.
      America's first mystery, and nobody
      has ever solved it.
    description: "John White returns to Roanoke to find every settler vanished — one word carved on a post: CROATOAN. America's first mystery."
    status: "first draft"
    sha256: "c16c2e1a86c51bd7f72eff4322e0fd96d2d152fc4666120f22993549e347ad33"
  - number: "2474"
    volume: 4
    title: "Tondibi"
    date: "1591 CE"
    region: "West Africa"
    poem: |
      One afternoon. That is all it took —
      one afternoon at Tondibi to end an empire.
      The Songhai came down to the Niger plain
      in their tens of thousands, horsemen in mail,
      the greatest army West Africa had ever raised.
      The Moroccans had four thousand men —
      and muskets, and cannon, and a Spanish renegade
      who knew his business.
      I stood on a rise and watched the future arrive
      in smoke: the volleys rolling like thunder,
      the cavalry breaking like waves on rock,
      the Askia's host dissolving into the dust
      it had raised.
      By evening the Songhai Empire — Timbuktu,
      Gao, Djenné, the scholars and the gold —
      was a Moroccan province.
      The scholars were chained and marched to Marrakesh.
      The libraries were looted.
      West Africa's golden age ended in a single afternoon,
      and the desert wind covered the tracks.
    description: "Moroccan musketeers crush the mighty Songhai Empire at Tondibi in a single afternoon — West Africa's golden age ends in gunpowder smoke."
    status: "first draft"
    sha256: "0066de12ecd8a39cdf599f87194ed31f0aac5a07ffc1516ec24ad99ff5543b70"
  - number: "2475"
    volume: 4
    title: "The Invasion Begins"
    date: "1592 CE"
    region: "Korea"
    poem: |
      They came across the strait at dawn —
      Hideyoshi's armies, a hundred and sixty thousand strong,
      landing at Busan with arquebuses and banners,
      the largest overseas invasion Japan had ever launched.
      I was in the south when the news came running:
      the Japanese took Busan in a day, Dongnae in a day,
      the Korean armies melting before the gunfire.
      Hideyoshi's dream was enormous — Korea first,
      then China, then, he said, India.
      The peasant's son who had become the Taiko
      meant to rule the world.
      The court at Seoul fled north. The king fled north.
      Everything fled north — except the sea,
      where a one-eyed admiral was waiting
      with ships like turtles.
      But that is another story.
      This one begins with the landing:
      dawn, Busan, and the sound of a hundred thousand feet
      marching into somebody else's country.
    description: "Hideyoshi's armies storm ashore at Busan — Japan's great invasion of Korea begins at dawn."
    status: "first draft"
    sha256: "57168f0d59fa03696446742652f3ebc427a55adde3d728b48dcb5f9a1d87aa47"
  - number: "2476"
    volume: 4
    title: "Turtle Ships at Hansan"
    date: "1592 CE"
    region: "Korea"
    poem: |
      Yi Sun-sin built them like a dream of war —
      turtle ships, armored in iron plates,
      a dragon's head at the prow breathing smoke,
      oars and cannon and a roof no arrow could pierce.
      At Hansan the Japanese came in strength,
      seventy-three warships confident and proud.
      Yi met them with his turtles and his cranes —
      the crane-wing formation, he'd drilled it for years —
      and closed the wings around them like a trap.
      I watched from a headland as the sea caught fire:
      Japanese hulls splitting under cannon fire,
      men leaping into water that boiled with wreckage,
      the invaders' lifeline cut in a single day.
      Hideyoshi's armies in the north never got their rice,
      never got their reinforcements.
      One admiral, one strait, one perfect battle —
      and the greatest invasion of the age
      began to starve.
    description: "Admiral Yi Sun-sin smashes the Japanese fleet at Hansan with his armored turtle ships — cutting the invaders' lifeline in a single day."
    status: "first draft"
    sha256: "0125a8ecbe8d613c0ee710f6cb8766e33856b3f6daf12b767244c09f18b803a9"
  - number: "2477"
    volume: 4
    title: "Paris Is Well Worth a Mass"
    date: "1593 CE"
    region: "France"
    poem: |
      He said it with a soldier's grin — or so they say:
      Paris is well worth a Mass.
      Henry of Navarre, the Protestant king,
      rode into Saint-Denis and knelt before the altar
      and became Catholic, just like that.
      I was in Paris when the gates opened.
      The city that had starved rather than take him
      as a heretic took him as a convert —
      cheering in the streets, bells ringing,
      the white plume of Navarre riding through
      triumphant at last.
      Was it faith or politics? The priests debated it
      for centuries. Henry's answer was France itself:
      thirty years of religious war ending
      not with a battle but with a baptism.
      He gave them peace, and peace was worth
      whatever the Mass had cost him.
      I watched him ride past, and he looked —
      for the first time in his life —
      like a man who could finally rest.
    description: "Henry IV converts to Catholicism — \"Paris is well worth a Mass\" — and the city opens its gates, ending thirty years of religious war."
    status: "first draft"
    sha256: "29c1fb4ad0fb52e74ce8363dcc362cb41333031ff12b6a416bf150843fb0ee79"
  - number: "2478"
    volume: 4
    title: "The First Tulips"
    date: "1593 CE"
    region: "Holland"
    poem: |
      Carolus Clusius planted them at Leiden —
      a few bulbs from Turkey, strange striped flowers
      nobody in Holland had ever seen.
      He was a botanist; he only wanted to study them.
      I walked his garden that spring and saw them:
      tulips, red and yellow, standing like small flames
      in the Dutch rain.
      Clusius refused to sell a single bulb.
      So the neighbors stole them in the night —
      over the wall, out of the beds, into every garden
      in the Low Countries.
      That theft was the seed of everything:
      the mania, the fortunes, the crash to come.
      A flower conquered Holland the way no army could —
      one stolen bulb at a time.
      I kept one Clusius gave me freely,
      pressed it in my journal, and wrote beside it:
      here begins the strangest bubble in history.
    description: "Botanist Carolus Clusius plants the first tulips at Leiden — neighbors steal the bulbs, and a flower begins its conquest of Holland."
    status: "first draft"
    sha256: "ebe7ff0fa280c96cfb09327d931f02e7296942e258f44a8a11604378b3da0fe4"
  - number: "2479"
    volume: 4
    title: "A Poet Murdered"
    date: "1593 CE"
    region: "England"
    poem: |
      Deptford, in a tavern room, over the reckoning —
      Christopher Marlowe, twenty-nine years old,
      the brightest bad boy of the London stage,
      took a dagger above the eye and died on the spot.
      Tamburlaine. Faustus. The Jew of Malta.
      He had written the mighty line and made kings talk
      like thunder, and now he was dead in a tavern
      over who paid for dinner — or over spying,
      or atheism, or a quarrel about nothing.
      Nobody knows. The inquest was quick
      and the witnesses were liars.
      I had seen Faustus at the Rose, the devil
      coming for his due, the crowd gasping.
      Shakespeare was still finding his voice;
      Marlowe had already found his, and lost it
      in a Deptford afternoon.
      Cut is the branch that might have grown full straight —
      his own line, from Faustus, and truer
      than he ever meant it to be.
    description: "Christopher Marlowe — Tamburlaine, Faustus — is stabbed dead in a Deptford tavern at twenty-nine, over a reckoning no one can explain."
    status: "first draft"
    sha256: "35dbc7e0a6b88a370d6875116cc97287ae8bcfbde768a6bfeb896e0bd8dd6459"
  - number: "2480"
    volume: 4
    title: "Tintoretto Dies"
    date: "1594 CE"
    region: "Venice"
    poem: |
      They called him Il Furioso — the furious one —
      and he painted like a storm: fifty men on a scaffold,
      canvases the size of walls, light breaking
      like surf over the whole of Venice.
      I saw him once in his workshop near the church
      of the Madonna dell'Orto, an old man
      still climbing the ladders himself,
      still furious, still covering Venice wall by wall —
      the Paradiso in the Doge's Palace,
      the biggest painting in the world,
      a heaven crowded with five hundred souls.
      He died in May, worn out at seventy-five,
      and they buried him under his own Last Judgment.
      Venice kept his light on its walls;
      the fury went with him into the ground.
      I stood before the Paradiso afterward
      and felt small, the way you feel small
      before weather.
    description: "Jacopo Tintoretto — Il Furioso, the furious painter of light and storm — dies in Venice after a lifetime covering its walls."
    status: "first draft"
    sha256: "0dca2ba0646052b7ad1543dcf6c03a21d73c6e6c5e008099636cb5e47013c66d"
  - number: "2481"
    volume: 4
    title: "The Search for El Dorado"
    date: "1595 CE"
    region: "South America"
    poem: |
      Raleigh sailed up the Orinoco with his dreams
      packed alongside the powder —
      El Dorado, the golden city, the king
      dusted with gold from head to foot,
      waiting somewhere in the green.
      I went upriver with his men part of the way:
      the heat, the mosquitoes, the water the color of tea,
      the jungle closing over the wake behind us.
      We found gold dust in the river sand,
      parrots, caimans, fever —
      and no city. Never any city.
      Raleigh wrote it up golden anyway —
      The Discovery of Guiana, all promise and maps —
      and England believed him, because England wanted to.
      I kept my journal honest: the jungle keeps
      what it keeps. The gold was in the story,
      and the story was enough to launch a hundred ships
      toward a city that never existed.
    description: "Walter Raleigh sails up the Orinoco hunting El Dorado, the golden city — and finds only jungle, fever, and a story England wanted to believe."
    status: "first draft"
    sha256: "a8e1300688454ac6087e66fa72fbe03b276d462a5e77b2364c0fc60a7d9d6932"
  - number: "2482"
    volume: 4
    title: "Drake's Last Harbor"
    date: "1596 CE"
    region: "Panama"
    poem: |
      He died of the bloody flux off Portobelo —
      Francis Drake, the dragon of the Spanish Main,
      fifty-five years old, raging at a war
      that had stopped going his way.
      I was aboard when it happened. The expedition
      had failed at Panama, failed at San Juan;
      the men were dying of fever faster than of shot.
      Drake took to his hammock and never rose,
      and we buried him at sea in a lead coffin,
      two miles off the harbor he'd meant to take.
      The Spanish fired a salute, they say —
      even his enemies honored him.
      The queen's pirate, the circumnavigator,
      the singe-beard of Cádiz:
      the sea that made him took him back,
      as the sea does with its own.
      I watched the coffin sink, and the water closed
      without a ripple, as if he'd never been.
    description: "Francis Drake dies of fever off Portobelo and is buried at sea in a lead coffin — the sea that made him takes him back."
    status: "first draft"
    sha256: "b44a8acf7cc5e4df130b3caab4b9c0bc9eada211a60bd07c89931171d3404e86"
  - number: "2483"
    volume: 4
    title: "Cádiz Burned Again"
    date: "1596 CE"
    region: "Spain"
    poem: |
      This time it was Essex — young, golden, reckless —
      with Howard and the fleet, storming Cádiz
      the way Drake had nine years before,
      only bigger, and this time they took the town itself.
      I watched the galleons burn in the harbor,
      the smoke visible for twenty miles,
      the Spanish scuttling their own treasure ships
      to keep them out of English hands —
      millions in silver going to the bottom
      rather than into Essex's coffers.
      All Europe watched, all Europe applauded,
      and nothing much changed.
      Philip built more ships. Essex came home a hero
      and quarreled with the queen within the year.
      I walked the blackened waterfront afterward
      and thought about how war eats money:
      Spain burned its own wealth to deny it to England,
      and both empires were poorer for the fire.
    description: "Essex and Howard storm Cádiz and burn the Spanish fleet in its harbor — Spain scuttles its own treasure ships rather than yield them."
    status: "first draft"
    sha256: "491f4c30408d51ae78b42259b85a3b0ebd2362ce3e92a234736f326e22ecd7c5"
  - number: "2484"
    volume: 4
    title: "The Great Herbal"
    date: "1596 CE"
    region: "Ming China"
    poem: |
      Twenty-seven years. Li Shizhen spent twenty-seven years
      on it — traveling, tasting, testing,
      correcting the old errors one root at a time.
      The Compendium of Materia Medica:
      fifty-two volumes, nearly two thousand medicines,
      eight thousand prescriptions, every herb drawn
      and described, the wrong names struck out,
      the dangerous doses marked in red.
      I met him once, near the end — an old man
      with stained fingers and a walking stick,
      still checking a specimen against his notes.
      He had done for medicine what the great historians
      did for the past: made it honest.
      They published it after his death; he never saw it bound.
      But every doctor in China for the next three centuries
      reached for Li Shizhen first.
      Twenty-seven years, one book, two thousand cures —
      I have never seen patience built so large.
    description: "After twenty-seven years of work, Li Shizhen's Compendium of Materia Medica is published — nearly two thousand medicines, honestly cataloged."
    status: "first draft"
    sha256: "d24d382535b5e9ef7453f37274b967e1b5d5dd2ba4cd54931ad1cc167591b98c"
  - number: "2485"
    volume: 4
    title: "The Second Invasion"
    date: "1597 CE"
    region: "Korea"
    poem: |
      Hideyoshi would not let it go.
      The first invasion had bled out on Korean mountains
      and drowned in Korean straits —
      so he sent them back: a hundred and forty thousand men,
      the second wave, vowing to finish it this time.
      I was in the south when the sails appeared again,
      and the Korean villagers looked at the horizon
      with the flat stare of people who have seen
      the end of the world twice.
      The Ming were coming too, in greater force;
      the war was bigger now, and crueler,
      both sides exhausted and neither yielding.
      Hideyoshi was dying in Osaka and wouldn't admit it,
      sending orders to an army he would never see again.
      The invasion's master was already a ghost;
      his soldiers just didn't know it yet.
      I watched the troop ships land and thought:
      this is what pride looks like
      when it outlives the man who owned it.
    description: "Hideyoshi launches a second invasion of Korea — a hundred and forty thousand men sent by a dying man who won't admit the first one failed."
    status: "first draft"
    sha256: "876ed667f0eea95ba86df5c782cef0ebbf5ef4ca94b6ab1b3f290b69dc30a244"
  - number: "2486"
    volume: 4
    title: "Thirteen Against One Hundred Thirty-Three"
    date: "1597 CE"
    region: "Korea"
    poem: |
      They had taken his command, tortured him, disgraced him —
      and then, when the Japanese fleet came again,
      the court begged Yi Sun-sin to come back.
      He had thirteen ships. The Japanese had a hundred
      and thirty-three.
      He chose the strait at Myeongnyang —
      narrow, with a current that ran like a millrace,
      reversing with the tide.
      He knew those waters the way you know your own hands.
      The Japanese, confident in their numbers,
      sailed in — and the current took them.
      I watched from the cliffs as thirteen ships
      fought a hundred and thirty-three to a standstill:
      the whirlpools doing half the killing,
      Yi's cannon doing the rest.
      Thirty-one Japanese ships sunk or broken,
      not one Korean lost.
      Thirteen against a hundred and thirty-three —
      and the thirteen won.
      I have walked a thousand battlefields,
      and I have never seen anything like it,
      before or since.
    description: "At Myeongnyang, the disgraced Admiral Yi returns with 13 ships against 133 — and wins without losing one, the current fighting beside him."
    status: "first draft"
    sha256: "67a490115d6a78d831e113ea9e41d76922f9884953a13adc0ac57ca5f6de04ce"
  - number: "2487"
    volume: 4
    title: "The Humble Potato"
    date: "1597 CE"
    region: "England"
    poem: |
      John Gerard wrote it down in his Herball —
      the potato, a lumpy root from the Andes,
      described for English readers for the first time:
      how to plant it, how it flowers,
      that the tuber eats well enough.
      Nobody was impressed. The gentry thought it
      pig food, fit for the Irish maybe.
      Gerard himself got the details half wrong,
      confusing it with other roots.
      I held one in my hand in Gerard's garden —
      a brown, knobbled, unlovely thing —
      and thought of the Andes terraces where it had fed
      empires, and of the Irish fields where it would feed
      millions, and of the famine it would one day bring
      when millions depended on a single root.
      The mightiest revolutions come disguised
      as vegetables. This one sat in Gerard's book,
      quiet as a stone, waiting two hundred years
      to change the world.
    description: "John Gerard's Herball describes the potato for English readers — a humble root that will one day feed millions, and starve them too."
    status: "first draft"
    sha256: "73da96bc516dbee7cde023db021be2cb1b901d800ebd229a930568c9b1548bb5"
  - number: "2488"
    volume: 4
    title: "The Edict of Nantes"
    date: "1598 CE"
    region: "France"
    poem: |
      Thirty years of war. Thirty years of neighbors
      cutting neighbors' throats over the Mass —
      and Henry ended it with a signature at Nantes.
      The Edict: Protestants could worship freely,
      hold their towns, keep their schools,
      serve in the king's offices.
      Not equality — the Catholics kept the crown's favor —
      but peace. Real, breathing peace.
      I was in a village in the south when the news came,
      and I watched a Huguenot farmer and his Catholic neighbor
      shake hands over a fence for the first time
      in a generation, both of them crying.
      It would last eighty-seven years — a lifetime,
      in those days. Then a king's grandson would tear it up.
      But for eighty-seven years, France proved
      that people who pray differently
      can live on the same street.
      I wrote that down, and underlined it twice.
    description: "Henry IV's Edict of Nantes grants French Protestants the right to worship — ending thirty years of religious war with a signature."
    status: "first draft"
    sha256: "7526d8e897456e0c37d27294941a22d5103f50722a44db25785c099e211b2f24"
  - number: "2489"
    volume: 4
    title: "The Taiko Dies"
    date: "1598 CE"
    region: "Japan"
    poem: |
      He died in Osaka Castle in the autumn —
      Hideyoshi, the Taiko, the peasant's son
      who had climbed to the top of Japan
      and reached for Korea, for China, for the world.
      I was in the castle town when the word spread,
      quiet as snowfall: the great man was gone,
      leaving a five-year-old heir and a council of regents
      who hated each other.
      His last order, they say, was to bring the armies home
      from Korea — the dream abandoned at the end,
      as dreams are.
      The generals obeyed, quietly, gratefully,
      already measuring each other for the war to come.
      Hideyoshi had unified Japan by force of will;
      his will died with him.
      What followed — Sekigahara, the Tokugawa peace —
      was built on the foundation he laid
      and the grave he dug.
      I watched the funeral procession wind through Osaka,
      and all Japan held its breath, waiting
      to see who would pick up the sword.
    description: "Hideyoshi dies at Osaka Castle, leaving a child heir and feuding regents — his generals quietly begin pulling the armies home from Korea."
    status: "first draft"
    sha256: "8ec9f62825897796e7bcf31cce3cbb5289e51b32b175011f7d6af13e12b34539"
  - number: "2490"
    volume: 4
    title: "A Painter Is Born"
    date: "1599 CE"
    region: "Spain"
    poem: |
      In Seville, in June, a boy was born —
      Diego Velázquez, son of a notary,
      baptized in the church of San Pedro
      with no one suspecting anything at all.
      I like to imagine the midwife handing him
      to his mother, neither of them knowing
      that those infant eyes would one day
      paint kings as they truly were —
      Philip IV's Habsburg jaw, the dwarfs and jesters
      of the court rendered with more dignity
      than the grandees, the light of Las Meninas
      falling across four centuries.
      He was only a baby, crying in the Seville heat.
      But I have learned to pay attention
      to quiet births in ordinary towns.
      The future was swaddled in that cradle,
      holding a brush it could not yet lift.
    description: "Diego Velázquez is born in Seville — the boy who will paint kings as they truly are, and light as it truly falls."
    status: "first draft"
    sha256: "d138dc72d19b3d8b8adab329f100932ce5bc0e122435dbbc8c77f1a87df73c81"
  - number: "2491"
    volume: 4
    title: "The Philosopher Burned"
    date: "1600 CE"
    region: "Rome"
    poem: |
      They burned him in the Campo de' Fiori —
      Giordano Bruno, the Nolan, who had taught
      that the stars are suns, and around them circle
      infinite worlds, with infinite living things.
      Eight years in the Inquisition's prisons.
      They offered him recantation; he offered them
      the universe instead.
      On the last morning they gagged him —
      afraid, even then, of what he might say
      to the crowd.
      I stood at the edge of the square and watched
      the flames take him, and the smoke rise
      over the flower market.
      He had said the universe has no center
      and no edge; Rome answered with a stake
      in the center of a square.
      Two hundred years later they would put up
      his statue on that spot, hooded, defiant,
      facing the Vatican.
      I go back sometimes, in my mind,
      and stand in both squares at once —
      the fire, and the statue.
    description: "Giordano Bruno — who taught of infinite worlds around infinite suns — is burned at the stake in Rome's Campo de' Fiori."
    status: "first draft"
    sha256: "41948582f0aed960adae8bd70348498b6305016cdb2d83a748449597ae485756"
  - number: "2492"
    volume: 4
    title: "Nieuwpoort"
    date: "1600 CE"
    region: "Netherlands"
    poem: |
      Maurice of Nassau fought it on the dunes at Nieuwpoort —
      the tide coming in, the Spanish tercios
      drawn up in their bristling squares,
      the Dutch outnumbered and far from home.
      I watched from the dunes as Maurice did
      what his father never could: he beat them
      in the open field, infantry against infantry,
      his drilled battalions wheeling like clockwork
      against the finest foot soldiers in Europe.
      It changed nothing on the map — the siege
      he'd come to relieve went on regardless —
      but it changed everything in the mind.
      The Spanish tercio could be beaten.
      The Dutch could beat it.
      Maurice's new way of war — drill, volley,
      discipline — had passed its examination.
      The tide came in over the battlefield that evening
      and washed it clean.
      The lesson stayed.
    description: "Maurice of Nassau's Dutch army beats the feared Spanish tercios on the dunes at Nieuwpoort — proving the new way of war works."
    status: "first draft"
    sha256: "0ab3eac917ca8f3dfcab9e5a1e8b5ba909c9d4bae844436e648761fa8773dac7"
  - number: "2493"
    volume: 4
    title: "Sekigahara"
    date: "1600 CE"
    region: "Japan"
    poem: |
      The mist lay on the field at Sekigahara
      when a hundred and sixty thousand men
      decided who would rule Japan.
      I stood on the ridge with the morning fog
      in my throat and watched Tokugawa Ieyasu's
      eastern army grind against the western lords —
      six hours of musket smoke and screaming horses,
      the outcome balanced on a knife's edge
      until Kobayakawa's betrayal broke the west.
      By noon it was a rout. By evening the heads
      were being counted in Kyoto.
      Ieyasu, patient Ieyasu, who had waited
      decades for this morning, walked the field
      and claimed the sword of Japan.
      One battle, one misty October day —
      and the next two hundred and fifty years
      were decided.
      The Tokugawa peace began here,
      in the fog, with the crows already circling.
    description: "Tokugawa Ieyasu crushes his rivals in the mist at Sekigahara — one October day that decides the next two and a half centuries of Japan."
    status: "first draft"
    sha256: "f7d498d0fabc7288b5e61cf2d86c275929feb262b509ddc71db4c13da4d2392c"
  - number: "2494"
    volume: 4
    title: "The Company Chartered"
    date: "1600 CE"
    region: "London"
    poem: |
      Elizabeth signed the charter on the last day
      of the year — a piece of parchment giving
      two hundred London merchants the right
      to trade with the East, and to make war
      and peace in her name, fifteen thousand miles away.
      I was in the city when the news went round
      the coffeehouses: the East India Company,
      a joint stock of seventy thousand pounds,
      a few ships, a great deal of nerve.
      None of them imagined what they'd chartered.
      A trading company that would one day
      rule a subcontinent, field armies larger
      than most kingdoms, and answer to no one
      but its shareholders.
      It began with pepper and a signature.
      It ended with an empire.
      I keep a copy of that charter in my mind
      as a warning: the mightiest things
      start as paperwork.
    description: "Elizabeth I charters the East India Company — two hundred merchants, a few ships, and a piece of parchment that will one day rule an empire."
    status: "first draft"
    sha256: "b5b42e1276e502bd108df525c9a234e7c2800676612798272de67322c9fc3d37"
  - number: "2495"
    volume: 4
    title: "Essex Loses His Head"
    date: "1601 CE"
    region: "London"
    poem: |
      He came home from Ireland in disgrace,
      the golden boy with the tarnished sword,
      and did the stupidest thing a courtier can do:
      he marched on the queen with three hundred men,
      expecting London to rise for him.
      London stayed home. The gates shut.
      Essex surrendered in his own house,
      was tried, and lost his head on Tower Green
      on a cold February morning.
      I watched him die — he'd been Elizabeth's favorite,
      her beautiful young earl, and she signed the warrant
      with a hand that shook, then wept, then raged.
      He had everything: looks, courage, charm.
      What he lacked was judgment,
      and in the end that was the one thing
      that mattered.
      The axe fell. The crowd sighed.
      Another bright thing the court had eaten.
    description: "The Earl of Essex, Elizabeth's fallen favorite, is beheaded on Tower Green after his foolish rebellion — charm without judgment."
    status: "first draft"
    sha256: "d3ce430156598291ea38d25da43ad7b989345e23652ab95625346d307d27f832"
  - number: "2496"
    volume: 4
    title: "Kinsale"
    date: "1601 CE"
    region: "Ireland"
    poem: |
      The Irish came down from the north with Spanish gold
      and Spanish musketeers, and at Kinsale
      the English met them in the winter mud —
      and broke them.
      I rode with the supply wagons and saw it end:
      Hugh O'Neill's great confederacy, the last hope
      of Gaelic Ireland, shattered in a morning's fighting.
      The Spanish surrendered their fort.
      The Irish melted back into the hills,
      and the old world went with them.
      What followed was the plantation —
      English settlers on confiscated land,
      the Gaelic order dismantled piece by piece,
      the language driven into the west.
      Kinsale was the hinge: before it, an Ireland
      that might have stayed Irish; after it,
      centuries of a different story.
      I stood on the headland afterward, looking north,
      and felt a whole culture exhale for the last time.
    description: "England crushes the Irish and their Spanish allies at Kinsale — breaking Gaelic Ireland's last great hope in a winter morning."
    status: "first draft"
    sha256: "12a625fa6f447f65e7908aff0291f9dada4130980db48687a9917854d644b7ca"
  - number: "2497"
    volume: 4
    title: "The VOC Is Born"
    date: "1602 CE"
    region: "Amsterdam"
    poem: |
      The Dutch did it better than the English —
      folded all their little trading companies into one:
      the VOC, the Dutch East India Company,
      with a charter that made it a state unto itself.
      I was in Amsterdam when the shares went on sale —
      the first stock ever offered to the public,
      any burgher with money could buy in.
      Six and a half million guilders raised,
      and with it the right to build forts,
      mint coins, sign treaties, and wage war.
      A company with its own armies.
      A company that answered to shareholders,
      not to any king.
      It would grow to be the richest corporation
      in human history — forty thousand employees,
      a hundred and fifty ships, a private empire
      from the Cape to Japan.
      I bought no shares. I only watched,
      and wrote in my journal: the future
      has just been invented, and it is owned
      in pieces, by strangers.
    description: "The Dutch East India Company is founded — the first public stock offering, a company with its own fleets, forts, and armies."
    status: "first draft"
    sha256: "d5dca814f79d788c1c1c174ed28f836c5fe548a1c618c4e1967656fdc752bc3b"
  - number: "2498"
    volume: 4
    title: "The Queen Is Dead"
    date: "1603 CE"
    region: "England"
    poem: |
      She died at Richmond in March, childless,
      forty-five years on the throne —
      Elizabeth, Gloriana, the Virgin Queen,
      and with her the Tudor line ran out like a spent candle.
      I was in London when the riders went north
      to fetch James of Scotland — James VI and I,
      a grown man with a Scots accent and strange ideas,
      riding south to take a kingdom he'd never seen.
      The crowds lined the road, cheering a stranger.
      No war, no rival claimant with an army —
      just a proclamation, read aloud,
      and England had a new king by dinnertime.
      Forty-five years of Elizabeth: the Armada,
      the playwrights, the sea-dogs, the golden age.
      And then, quietly, in a palace bedroom,
      it ended — and a Scotsman inherited it all.
      I stood in the cheering crowd and felt the age turn,
      like a great ship coming about.
    description: "Elizabeth I dies childless after forty-five years — and James VI of Scotland rides south to become James I of England, cheered by strangers."
    status: "first draft"
    sha256: "64048f4faf4202ac6277639e5e2b9f9748c358eb73baf2a4645699bdb19ff109"
  - number: "2499"
    volume: 4
    title: "The Shogunate"
    date: "1603 CE"
    region: "Japan"
    poem: |
      Ieyasu took the title in Kyoto — Sei-i Tai Shōgun,
      barbarian-subduing great general —
      and with that old word he built something new:
      two and a half centuries of peace.
      Not the peace of treaties. The peace of control:
      the daimyo leashed by hostage and rotation,
      the samurai turned from warriors to clerks,
      the Christians watched, the ports narrowed,
      the whole archipelago held still
      by one man's system.
      I walked the new Edo that year —
      a castle town rising out of the marshes,
      already dreaming of becoming the greatest city
      on earth.
      The age of civil war was over.
      The age of the closed country was beginning.
      And Ieyasu, old and patient, sat at the center
      like a spider who had finished his web
      and could rest at last.
    description: "Tokugawa Ieyasu takes the title of shogun — opening two and a half centuries of Tokugawa peace, built on control."
    status: "first draft"
    sha256: "cc931f8404a79523a3549e4e6c719b716ebc87f201c45aa7b54076ffee085af5"
  - number: "2500"
    volume: 4
    title: "Peace With Spain"
    date: "1604 CE"
    region: "London"
    poem: |
      Nineteen years of war ended with a treaty
      signed in London — the Treaty of London,
      Spain and England shaking hands at last.
      I was there for the celebrations: the Spanish envoy
      feasted at Whitehall, the bonfires lit,
      the privateers paid off and sent home
      to become merchants, or pirates without licenses,
      or legends in taverns.
      Drake was dead. Philip was dead.
      Elizabeth was dead.
      The men who had made the war were gone,
      and their successors counted the cost
      and chose peace.
      The sea-dogs came home to find England changed —
      James on the throne, the war over,
      no more Spanish galleons to take.
      Some adapted. Some drank.
      I drank with a few of them, and listened
      to the stories get better with every telling,
      the way stories do when the war is over.
    description: "The Treaty of London ends nineteen years of Anglo-Spanish war — the privateers come home to an England that has moved on."
    status: "first draft"
    sha256: "f75e7d181b003114727d91895f7170a33f453b59ece1dcf679a385ace6987cc5"
  - number: "2501"
    volume: 4
    title: "The Gunpowder Plot"
    date: "1605 CE"
    region: "London"
    poem: |
      Guy Fawkes was caught in the cellar under Parliament
      at midnight, with thirty-six barrels of gunpowder —
      enough to lift king, lords, and commons
      into the November sky in one thunderclap.
      I walked past the Parliament stairs that week
      and felt the city holding its breath.
      The plot was Catholic desperation made concrete:
      kill James, kill the government, raise the country
      in a rising that existed mostly in the plotters' heads.
      They tortured Fawkes on the rack; he gave them
      the names. They hunted the rest down —
      Catesby shot at Holbeche, the others taken,
      all of them executed in the customary horror.
      And England got its bonfire night:
      every November 5th since, the bonfires burn
      and the children chant, remember, remember.
      I remember. I was there when the barrels
      were carried out into the daylight,
      still sweating saltpeter.
    description: "Guy Fawkes is caught in the cellars under Parliament with thirty-six barrels of gunpowder — and England gets its bonfire night forever."
    status: "first draft"
    sha256: "b71fb71bc226d73f2a7388345c655828eb8f6ff0f7ceaec1e3c1b0eebe35747e"
  - number: "2502"
    volume: 4
    title: "Don Quixote Rides Out"
    date: "1605 CE"
    region: "Spain"
    poem: |
      Cervantes published it in Madrid — the first part,
      cheap paper, quick sale —
      and the gaunt knight and his round squire
      rode out of its pages and into the world.
      I bought a copy from a stall near the Puerta del Sol
      and read it laughing on the road to Toledo:
      Don Quixote, who read too many romances
      and mistook windmills for giants, inns for castles,
      a peasant girl for a princess —
      and Sancho, who knew better and followed anyway.
      Spain laughed at the mad knight.
      Then Spain — then the world — realized
      the joke was on all of us:
      who has not tilted at his own windmills,
      who has not needed his own Sancho?
      Cervantes, maimed at Lepanto, poor all his life,
      wrote the first modern novel without knowing it.
      I finished it at an inn, closed the book,
      and looked at the windmills on the horizon
      with new respect.
    description: "Cervantes publishes the first part of Don Quixote — the gaunt knight and his round squire ride out of cheap paper into world literature."
    status: "first draft"
    sha256: "855ddfc15ba71bd18a0b2169fec509a1ff2fb92b7b59be9f4420d9e95d2c3296"
  - number: "2503"
    volume: 4
    title: "Palmares Founded"
    date: "1605 CE"
    region: "Brazil"
    poem: |
      They ran — from the sugar mills, from the whip,
      from the slave ships' holds —
      and in the forests of Pernambuco they built Palmares:
      a hidden kingdom of the free.
      I never reached it myself; few outsiders ever did.
      But I heard the stories in the port towns:
      a confederation of villages, thousands strong,
      Africans of a dozen nations forging one people,
      growing food, making laws, choosing their king —
      a free Black nation in the heart of slave Brazil.
      The Portuguese sent expeditions; Palmares
      swallowed them in the green.
      It would stand for nearly a hundred years —
      a century of freedom carved out of the wilderness,
      while the mills ground on around it.
      Every slave ship that unloaded in Brazil
      carried people who had heard the name.
      Palmares meant: run far enough, build high enough,
      and you can be free.
      I write this down so the name is not lost:
      Palmares. The free kingdom in the forest.
    description: "Escaped enslaved Africans found Palmares in Brazil's forests — a hidden free kingdom that will defy the slavers for nearly a century."
    status: "first draft"
    sha256: "936525a741968423fc5f7bba14f30581976c339d8f0bae8bc7dc1e8643cc9a69"
  - number: "2504"
    volume: 4
    title: "Jamestown"
    date: "1607 CE"
    region: "Virginia"
    poem: |
      Three ships — the Susan Constant, the Godspeed,
      the Discovery — a hundred and four men and boys,
      landing on the James River in May,
      naming everything for a king
      who would never see it.
      I came ashore with the second supply:
      a fort of logs, a church of sails,
      gentlemen digging for gold that wasn't there
      while the corn ran out and the marsh fever rose.
      The starving time was coming — but not yet.
      That first summer, it was all hope
      and hammering.
      Powhatan's people watched from the woods,
      bringing corn, wondering at these helpless strangers
      who couldn't feed themselves.
      John Smith — braggart, hero, survivor —
      kept them alive by bluff and trade.
      The first lasting English colony in America:
      born in a swamp, built on hunger,
      saved by the people it would one day displace.
      I helped raise the palisade and thought:
      this fragile thing will outlast empires.
    description: "Three English ships land on the James River — the first lasting English colony in America takes root in a swamp, on hunger and hope."
    status: "first draft"
    sha256: "ff1cf89903364a0f5ce08280fedd654a5a30e5679b00a5a1e1e62c9b38b81f8e"
  - number: "2505"
    volume: 4
    title: "Quebec Founded"
    date: "1608 CE"
    region: "Canada"
    poem: |
      Champlain chose the narrows — where the St. Lawrence
      pinches between the cliffs, Kébec in the Algonquin tongue —
      and built his trading post of logs and hope.
      I traveled upriver with him that summer:
      the great river rolling north, the forests
      unbroken to the horizon, the winter
      already waiting in the wings like an executioner.
      Twenty-eight men stayed. Twenty froze or starved.
      Eight lived to see spring.
      But the post held. The furs came downriver —
      beaver, the soft gold of the north —
      and the canoes of a dozen nations
      found their way to Champlain's door.
      New France began here: not with conquest
      but with trade, with alliances, with a handful of men
      in a wooden fort at the narrowing of a river.
      I stood on the cliff that winter and looked down
      at the frozen St. Lawrence, and understood:
      this was the seed of a different America.
    description: "Samuel de Champlain builds a trading post where the St. Lawrence narrows — the seed of French Canada, bought with furs and frostbite."
    status: "first draft"
    sha256: "17615fcf16be042f24bb5d1c451a4984a235b6465ebf69786cff1c09e9c6f24c"
  - number: "2506"
    volume: 4
    title: "The Spyglass"
    date: "1608 CE"
    region: "Holland"
    poem: |
      Hans Lippershey, spectacle-maker of Middelburg,
      filed the patent — a tube with a lens at each end,
      making far things near, three times closer.
      I looked through one at the fair that autumn:
      the church tower across the market
      suddenly at arm's length, the weathercock's feathers
      countable. The crowd gasped and laughed.
      A toy, they said. A curiosity for sailors
      and soldiers.
      Within a year, men in Padua and Prague
      would turn it upward — and the toy
      would become the telescope, and the telescope
      would unmake the universe.
      But that autumn in Middelburg it was only
      a tube of lenses and a spectacle-maker's patent,
      and I was one of the first to hold the future
      up to my eye and squint through it.
      Three times closer. Soon, infinitely further.
    description: "Hans Lippershey patents the spyglass — a tube of lenses, a fairground toy that will soon be turned on the heavens."
    status: "first draft"
    sha256: "94a704f48b36024cf30297731388f04430d0f5cdb63334ded15ca1733ce31173"
  - number: "2507"
    volume: 4
    title: "Galileo Looks Up"
    date: "1609 CE"
    region: "Italy"
    poem: |
      He heard about the Dutch toy and built a better one —
      twenty times closer — and on a winter night
      in Padua, Galileo Galilei turned it upward.
      I was there. I looked through it after him.
      The moon: not a perfect crystal sphere
      but a world — mountains, valleys, shadows,
      a place, scarred and real as the earth.
      Jupiter: four moons circling it like a tiny solar system.
      The Milky Way: not a cloud but a river of stars,
      thousands where the eye saw dozens.
      We stood on that rooftop till dawn, taking turns,
      speechless.
      In one night, the universe had changed shape.
      The heavens were not perfect and unchanging —
      they were rough, and moving, and full.
      Galileo wrote it up in weeks — the Starry Messenger —
      and all Europe looked up at once.
      I have seen many revolutions begin.
      This one began with a tube of lenses
      and a man who refused to look away.
    description: "Galileo turns his telescope to the night sky — and finds mountains on the moon, moons around Jupiter, a universe remade in one night."
    status: "first draft"
    sha256: "b687183f7c3d9083344e0152f152a643b97f1dca3e32c9e782b6e453cd5c6a7f"
  - number: "2508"
    volume: 4
    title: "Kepler's Laws"
    date: "1609 CE"
    region: "Prague"
    poem: |
      Kepler published them in Prague — the first two laws,
      won from Tycho's mountain of numbers
      by years of grinding calculation:
      the planets move in ellipses, the sun at one focus;
      they sweep equal areas in equal times.
      I visited him that winter: a small man
      in a cold room, half-blind, surrounded by papers,
      who had tried seventy shapes for the orbit of Mars
      before the ellipse fit — off by eight minutes of arc,
      and he would not let those eight minutes go.
      Eight minutes. That honesty remade astronomy.
      The perfect circles of two thousand years
      broke on eight minutes of arc.
      He wept when it came right, he told me —
      not with joy but with exhaustion,
      like a man who has carried a stone uphill
      for a decade and finally set it down.
      The planets move in ellipses.
      The universe has a new geometry,
      and it was found by refusing to fudge
      eight minutes.
    description: "Johannes Kepler publishes his first two laws of planetary motion — the planets move in ellipses, proven on eight un-fudged minutes of arc."
    status: "first draft"
    sha256: "f7c64b72159e4bd7608d66b5e6004e456c2a6f5facf2d543e56af180f615e742"
  - number: "2509"
    volume: 4
    title: "The Moriscos Expelled"
    date: "1609 CE"
    region: "Spain"
    poem: |
      They had been Christians for a century —
      baptized, or their grandparents had been —
      but Spain never believed the conversion,
      and now Philip's son was done pretending.
      I watched them go from the port at Valencia:
      families with bundles, craftsmen, farmers,
      the best silk-workers and irrigators in Spain,
      marched to the ships and ferried to North Africa —
      three hundred thousand souls, more or less,
      in the greatest expulsion Europe had seen.
      The villages emptied. The silk looms fell silent.
      The huertas went back to scrub.
      Spain cut out a third of its own skill
      to purify its blood, and called it victory.
      I stood on the quay as the last boats pulled away,
      and a Morisco woman pressed a sprig of rosemary
      into my hand — for remembrance, she said.
      I have kept it pressed in my journal ever since.
      Spain's loss. Africa's gain.
      The rosemary still smells faintly, after all these years.
    description: "Spain expels the Moriscos — three hundred thousand baptized Christians of Muslim descent — cutting out its own craftsmen to purify its blood."
    status: "first draft"
    sha256: "3a371b5287c87b941277e2673a608f048b62f9c370b4cfb1df2fa5886d93ba63"
  - number: "2510"
    volume: 4
    title: "Yanga's Free Town"
    date: "1609 CE"
    region: "Mexico"
    poem: |
      Gaspar Yanga had been free for thirty years —
      a prince of the Bran people, stolen from Africa,
      escaped into the Veracruz highlands,
      raiding the Spanish roads with his band of runaways
      until the viceroy sent an army to finish him.
      The army failed. Yanga's people knew the mountains;
      the Spanish knew the roads.
      So they negotiated — the first treaty of its kind:
      Yanga's town would be free, self-governing,
      and in return the raids would stop.
      I visited San Lorenzo de los Negros years later:
      a free Black town in the hills of New Spain,
      its people farming, its church bell ringing,
      Yanga an old man now, walking with a stick,
      a king without a crown.
      Thirty years a rebel, then a founder.
      The Spanish called it peace; Yanga's people
      called it what it was: victory.
      I bowed to the old man, and he laughed
      and offered me chocolate.
    description: "Gaspar Yanga — African rebel, thirty years free in the Veracruz highlands — founds the free town of San Lorenzo after forcing Spain to treat with him."
    status: "first draft"
    sha256: "62186ede09e920283abdaf2dc944bcba9acc1a731c5902ec57a6389f404ce273"
  - number: "2511"
    volume: 4
    title: "The King Is Stabbed"
    date: "1610 CE"
    region: "Paris"
    poem: |
      The carriage stopped in the Rue de la Ferronnerie —
      traffic, a narrow street — and Ravaillac stepped up
      with his knife and struck twice, into the king's chest.
      Henry IV — the white plume, the Mass of Paris,
      the man who had ended the wars —
      died in his carriage on a May afternoon,
      and his nine-year-old son became Louis XIII
      with Marie de' Medici holding the reins.
      I was two streets away and heard the screaming.
      Paris went mad with grief and fury;
      they tore the assassin apart in the Place de Grève,
      which changed nothing.
      Fourteen years of peace Henry had given France —
      fourteen years, and it died with him in a carriage.
      The regency began in blood and suspicion,
      and France would not know another like him
      for a long time.
      I stood in the crowd at the funeral procession
      and wept with strangers.
      We all knew what we had lost.
    description: "Henry IV is knifed in his carriage in Paris — the king who ended the religious wars dies, and a nine-year-old inherits the throne."
    status: "first draft"
    sha256: "0b15e0d751a03a69a79f341faa466cbc7ea4c93dca74b809143941cb7747de66"
  - number: "2512"
    volume: 4
    title: "The Icy Bay"
    date: "1610 CE"
    region: "Hudson Bay"
    poem: |
      Hudson sailed into it in August — the vast bay,
      ice already forming at the edges,
      a sea where the maps said a continent should be.
      I was not aboard the Discovery that voyage —
      no one I knew was, except by reputation —
      but I met the survivors later, in London,
      and heard the story from men who'd lived it:
      the winter frozen in, the food gone,
      the crew turning on their captain.
      In June they set Hudson adrift in an open boat
      with his son and seven loyal men —
      and sailed home without them.
      No one ever saw them again.
      The bay kept his name. The mutineers kept their lives,
      mostly. The passage to Asia stayed unfound.
      I think of that little boat sometimes,
      drifting on that enormous gray water,
      the greatest discoverer of his age
      abandoned by his own men to the ice.
    description: "Henry Hudson sails into the vast frozen bay that will bear his name — and the next summer his mutinous crew sets him adrift to vanish."
    status: "first draft"
    sha256: "dff0f6da9f0209b61d4fcef27f125652041298bde308a152624f39518a03daa6"
  - number: "2513"
    volume: 4
    title: "The King James Bible"
    date: "1611 CE"
    region: "England"
    poem: |
      Fifty-four scholars, six companies, seven years —
      and out of it came the book:
      the King James Bible, in English a common man could read,
      printed in London and carried to the ends of the earth.
      I bought one of the first printings —
      the He Bible, they called it, for a misprint in Ruth —
      and read it through that winter.
      The language! Salt of the earth. A still small voice.
      The valley of the shadow of death.
      Tyndale's bones and Coverdale's phrases,
      polished by committees into thunder.
      It shaped the English tongue more than Shakespeare —
      or as much, which is saying everything.
      For three centuries, when an English speaker
      reached for the grand phrase, this was the well.
      I keep mine still, the pages soft with reading.
      Whatever you believe, it is the most beautiful
      book ever made by committee —
      which tells you something about committees,
      and something about God.
    description: "King James's scholars publish their great English Bible — fifty-four men, seven years, and the book that will shape the language for centuries."
    status: "first draft"
    sha256: "77a577aba2d8f26a176081c90a0a9991ab2a1e1c098640b4e757ee17631968a1"
  - number: "2514"
    volume: 4
    title: "The Empress Rises"
    date: "1611 CE"
    region: "Mughal India"
    poem: |
      Jahangir married her in the spring — Nur Jahan,
      the widow of a Persian noble, thirty-four years old,
      brilliant, educated, and beautiful in the way
      that makes emperors forget their caution.
      I saw her at court in Agra within the year:
      she sat behind the screen, but everyone knew
      whose hand was on the empire.
      Coins were struck in her name — beside the emperor's,
      unheard of. Orders went out with her seal.
      She designed gardens, patronized painters,
      shot tigers from an elephant's back.
      Jahangir drank and dreamed; Nur Jahan ruled.
      For fifteen years the Mughal Empire
      was steered by a woman the histories
      almost forgot to mention.
      I watched her once, giving audience,
      and thought: here is power that needs no throne,
      no army, no proclamation —
      only a mind, and the ear of a king.
    description: "Jahangir marries Nur Jahan — the brilliant widow who will all but rule the Mughal Empire beside him, her name struck on the coinage."
    status: "first draft"
    sha256: "8eb7c24ac95d0dd16e423ad9ad5ff8f0a1b9bb20fc5acbd6b0cdb06bca4be857"
  - number: "2515"
    volume: 4
    title: "Artemisia Testifies"
    date: "1612 CE"
    region: "Rome"
    poem: |
      She was nineteen, and they put her on trial —
      not her attacker, her.
      The Roman court made Artemisia Gentileschi
      submit to thumbscrews to prove she told the truth
      about being raped by her father's colleague.
      I sat in that courtroom. I heard her testimony —
      clear, unflinching, furious —
      and I watched the judges squirm
      as the thumbscrews proved what her word should have.
      Her attacker got a sentence he never served.
      She got the truth, on record.
      And then she painted.
      Judith beheading Holofernes — blood, effort, two women
      doing the work with their own hands.
      Susanna, Lucretia, heroines who fight back,
      painted by a woman who knew what fighting cost.
      Rome tried to break her into silence.
      Instead it made an artist who would outpaint
      every man in that courtroom.
      I bought no painting that year;
      I only remembered her face,
      set like stone, telling the truth.
    description: "Artemisia Gentileschi testifies against her attacker under thumbscrews in a Roman court — and goes on to paint heroines who fight back."
    status: "first draft"
    sha256: "a0fdf66f5ce1ccfd7288f6613fa727c5d6cd40f9b927a234c42006dc28249bb0"
  - number: "2516"
    volume: 4
    title: "England's First Indian Foothold"
    date: "1612 CE"
    region: "Surat"
    poem: |
      The English ships beat the Portuguese off Surat —
      Captain Best's little squadron, outgunned,
      outmaneuvered the great carracks in the Swally roads —
      and the Mughal governor took notice.
      I was in Surat when the firman came:
      the East India Company could build a factory —
      a trading post, a warehouse with a flag —
      on Indian soil. England's first foothold
      in the land that would one day be its empire.
      It was a shed. A shed with bales of broadcloth
      and a clerk with a ledger.
      The Portuguese laughed. The Dutch shrugged.
      Nobody saw it for what it was:
      the thin end of a wedge three centuries long.
      I stood on the beach at the Swally
      and watched the bales come ashore,
      and wrote in my journal: small beginnings.
      The mightiest oak in history
      was just planted as an acorn,
      in the sand, at Surat.
    description: "After English ships beat the Portuguese off Surat, the East India Company plants its first trading post on Indian soil — a shed that will grow an empire."
    status: "first draft"
    sha256: "d5bd8d3056baf6cf8cdc54ab9efd97f8a5753b63b504728b71511f46dd43493b"
  - number: "2517"
    volume: 4
    title: "The Romanovs Chosen"
    date: "1613 CE"
    region: "Russia"
    poem: |
      The Time of Troubles had eaten Russia alive —
      famine, pretenders, Polish armies in the Kremlin,
      three false Dmitrys and a murdered boy —
      and the assembly at Moscow was desperate
      for anyone, someone, a name to rally round.
      They chose Michael Romanov. Sixteen years old,
      hiding in a monastery with his mother,
      related to the old dynasty by marriage
      and to nobody's faction strongly enough to object.
      I was in Moscow when the embassy found him.
      His mother wept and refused; they begged;
      at last the boy accepted, terrified,
      and they led him to the capital through crowds
      that had forgotten what hope felt like.
      Three hundred years that dynasty would rule —
      from this frightened boy in a monastery
      to the last tsar in a cellar at Ekaterinburg.
      I watched the coronation procession
      and thought: every empire begins
      with somebody who didn't want the job.
    description: "After the Time of Troubles, the assembly elects sixteen-year-old Michael Romanov tsar — founding a dynasty that will rule for three centuries."
    status: "first draft"
    sha256: "f4cff098f1d8db5caab5d53f4b1ae371f18b3292442d8b076ebdaea9f7137ce8"
  - number: "2518"
    volume: 4
    title: "The Globe Burns"
    date: "1613 CE"
    region: "London"
    poem: |
      It was the cannon in Henry VIII — a stage cannon,
      fired for the king's entrance —
      that set the thatch alight.
      In less than an hour, Shakespeare's Globe
      was a ring of fire on the Bankside.
      I was across the river and saw the smoke go up:
      the playhouse where Hamlet had first spoken,
      where Lear had raged, where the groundlings
      had stood in the rain for a penny —
      burning to the waterline while the actors
      carried out the costumes and the scripts.
      Nobody died — one man's breeches caught fire,
      and they put him out with a bottle of ale.
      The company rebuilt within the year,
      finer than before, on the same ground.
      But something ended that afternoon:
      Shakespeare had retired to Stratford;
      the great age was guttering.
      The Globe burned, and was rebuilt —
      and the plays, thank God, survived the fire.
    description: "A stage cannon sets the Globe Theatre's thatch alight — Shakespeare's playhouse burns to the ground in an hour, and is rebuilt within the year."
    status: "first draft"
    sha256: "ba4a000dd3f4d1c78d80e427f6aeadee82a3b803c460de7f0d8ca847fc838afb"
  - number: "2519"
    volume: 4
    title: "Pocahontas Marries"
    date: "1614 CE"
    region: "Virginia"
    poem: |
      She was nineteen, or thereabouts — Matoaka,
      daughter of Powhatan, baptized Rebecca —
      and she married John Rolfe, the tobacco planter,
      in the little church at Jamestown.
      I was there. The colony turned out in its best —
      which wasn't much — and Powhatan's people came too,
      uneasy, watching.
      It was a political marriage, everyone knew,
      sealing the peace between the English fort
      and the great chief's domain.
      For eight years it held. Pocahontas sailed to England,
      was presented at court, stared at like a wonder —
      and died at Gravesend at twenty-one,
      of a stranger's disease, on the way home.
      Rolfe went back to his tobacco. The peace died with her,
      slowly, then all at once.
      I remember her best not as the legend
      but as the girl in the Jamestown church,
      saying her vows in a language not her own,
      trying — genuinely trying — to bridge two worlds
      that would not be bridged.
    description: "Pocahontas marries John Rolfe at Jamestown — a political marriage sealing a fragile peace that will die with her at twenty-one."
    status: "first draft"
    sha256: "7a5412e81ff9e34cc1747fb6274efb5fa0284f48ed7fd8873480e032644d878b"
  - number: "2520"
    volume: 4
    title: "Logarithms"
    date: "1614 CE"
    region: "Scotland"
    poem: |
      John Napier of Merchiston published the tables —
      logarithms, he called them, the arithmetic of exponents —
      and every astronomer and navigator in Europe
      breathed easier.
      I met him once at his tower near Edinburgh:
      a strange, brilliant laird who dabbled in alchemy
      and theology and hated the long multiplications
      that ate his days.
      So he found a shortcut: turn multiplication
      into addition, division into subtraction,
      by the magic of exponents tabulated once and for all.
      Kepler used them within the decade.
      Sailors used them for a century.
      The slide rule, the computer's ancestor,
      was born from Napier's tables.
      He died three years later, worn out at sixty-seven.
      But his bones — Napier's bones, the numbering rods —
      and his logarithms outlived him by centuries.
      I keep a set of his tables still:
      proof that the greatest gifts are sometimes
      just a shorter road through the arithmetic.
    description: "John Napier publishes his tables of logarithms — a shortcut through heavy arithmetic that astronomers and sailors will use for centuries."
    status: "first draft"
    sha256: "bd69de12656271263aa0dea6244283dbf9ee4888778d8c547d28ceafd63ec04c"
  - number: "2521"
    volume: 4
    title: "Osaka Falls"
    date: "1615 CE"
    region: "Japan"
    poem: |
      The Tokugawa came in the summer with everything —
      two hundred thousand men around Osaka Castle,
      the Toyotomi's last stronghold,
      the child Hideyori inside with his mother.
      I watched from the hills as the great fortress fell:
      the outer works stormed, the moats filled,
      the keep set ablaze in the final assault.
      Hideyori and his mother died in the flames —
      suicide, the chronicles say, like Nobunaga before him.
      The Toyotomi line ended in that fire.
      No more rivals. No more western lords
      dreaming of the old days.
      Ieyasu's peace was now unchallenged,
      bought with the last great siege of the age.
      I walked through the ruins afterward —
      blackened timbers, the smell of smoke and rain —
      and thought of Hideyoshi, the peasant's son,
      whose whole mighty house had lasted
      seventeen years past his death.
      Ambition builds fast. Time unbuilds faster.
    description: "Tokugawa troops storm Osaka Castle and wipe out the Toyotomi — ending the last challenge to Tokugawa rule in fire and smoke."
    status: "first draft"
    sha256: "b40464865cb213c977b36e11b22b42f1e8702972b87bbb686e0938c48a6925a2"
  - number: "2522"
    volume: 4
    title: "Chocolate Comes to Paris"
    date: "1615 CE"
    region: "France"
    poem: |
      Anne of Austria married Louis XIII —
      a Spanish infanta for a French king —
      and in her baggage, among the jewels and the linen,
      came chocolate.
      I tasted it at court that winter: the dark drink
      of the Spanish, bitter and spiced,
      served in porcelain cups to ladies
      who had never imagined such a thing.
      The French were suspicious at first —
      a foreign brew, a papist drink —
      but the queen drank it every morning,
      and fashion follows queens.
      Within a generation, Paris had its chocolatiers,
      its salons thick with the smell of cacao.
      A whole civilization of the cup —
      the gossip, the intrigue, the slow afternoons —
      began with a princess's luggage.
      Empires are moved by stranger things than armies.
      Sometimes by a taste, carried across the Pyrenees
      in a dowry chest, changing what a nation drinks
      at breakfast for three hundred years.
    description: "Anne of Austria marries Louis XIII, bringing her Spanish taste for drinking chocolate to the French court — and Paris never drinks the same again."
    status: "first draft"
    sha256: "10c0616bead60ba365bbb0d2b7fbe66c22ff1d09cb2542f426c3b3ad75eed861"
  - number: "2523"
    volume: 4
    title: "Three Playwrights Die"
    date: "1616 CE"
    region: "England, Spain, China"
    poem: |
      Within months of each other, three masters died —
      Shakespeare at Stratford, fifty-two, of a fever;
      Cervantes at Madrid, sixty-eight, worn out and poor;
      Tang Xianzu in China, author of the Peony Pavilion,
      the greatest playwright of the Ming.
      I had seen Shakespeare's company play at the Globe.
      I had read Cervantes laughing on the road to Toledo.
      Tang I knew only by reputation — his Peony Pavilion,
      fifty-five scenes of love and ghosts,
      still performed in China four centuries on.
      Three men, three languages, three worlds —
      none knowing the others existed —
      all writing the human heart at the same moment
      in history, all dying in the same turning year.
      The coincidence haunts me.
      As if the age had hired three voices
      to sing its story, and then, the song complete,
      dismissed them together.
      1616: the year the world's stages went dark,
      in England, in Spain, and in China —
      all at once.
    description: "Shakespeare, Cervantes, and China's Tang Xianzu all die within months of each other — three masters, three worlds, one turning year."
    status: "first draft"
    sha256: "d278a808b01a6aa1f45b5359d77536fdac2faeb11176291f8f38214d8d4a2a04"
  - number: "2524"
    volume: 4
    title: "The Plaza Mayor Rises"
    date: "1617 CE"
    region: "Madrid"
    poem: |
      They began it under Philip III — the Plaza Mayor,
      Madrid's great square: three stories of brick and slate,
      a hundred and fourteen balconies looking inward,
      a stage for the whole city.
      I watched the foundations go down that year,
      the old market square leveled and rebuilt
      to the new geometry — processions, bullfights,
      autos-da-fé, royal weddings, all to play out
      under those identical windows for centuries.
      A plaza mayor is Spain's answer to the agora:
      the city gathering to see itself.
      Madrid was still half village then,
      but the square dreamed bigger —
      it dreamed the capital into being around it.
      Four hundred years later the cafés still fill it,
      the tourists still photograph the balconies.
      I sat there once, centuries on in my mind,
      drinking coffee where the scaffolding had stood,
      and marveled at how a square can outlive
      every king who ever waved from its windows.
    description: "Work begins on Madrid's great Plaza Mayor — the grand square where the city will gather, celebrate, and judge for centuries."
    status: "first draft"
    sha256: "eedb317df9e2c152c89b751d000b6a644492f1afa7e7705dbb30a7f5b944eb28"
  - number: "2525"
    volume: 4
    title: "Out the Window"
    date: "1618 CE"
    region: "Prague"
    poem: |
      They threw them out the window — the two Catholic regents
      and their secretary, hurled from the high windows
      of Prague Castle by Protestant nobles
      who'd had enough of the emperor's decrees.
      Seventy feet down. They lived —
      landed in a dung heap, the Catholics said
      by angels, the Protestants said by manure.
      The Defenestration of Prague, the history books call it,
      with a straight face.
      I was in the castle yard that morning
      and saw them pick themselves up, bruised and furious,
      and run for their lives.
      Nobody laughed then. But the act was a declaration:
      Bohemia would not be ruled from Vienna
      in matters of faith.
      Within months, armies were marching.
      The Thirty Years' War — the most terrible war
      Europe had ever seen — began
      with three men flying out of a window
      and landing, improbably, alive.
    description: "Protestant nobles hurl two Catholic officials from a Prague Castle window — they survive the fall, and the Thirty Years' War begins."
    status: "first draft"
    sha256: "64eeca54680f758687a2400766ec41ccfc20a994af32aeca6a501007dd4e1db0"
  - number: "2526"
    volume: 4
    title: "Raleigh's Head Falls"
    date: "1618 CE"
    region: "London"
    poem: |
      Fifteen years he'd lived under the sentence —
      in the Tower, writing his History of the World,
      growing old in a cell —
      and then James let him out for one last voyage
      to find the gold of Guiana.
      It failed. The Spanish complained.
      James needed Spanish friendship more than Raleigh's life,
      so the old sentence was dusted off
      and the axe was sharpened.
      I stood in the crowd at Whitehall that October morning.
      Raleigh was sixty-six, gray, calm —
      he tested the axe's edge with his thumb
      and joked about his long journey.
      His last words were for the headsman:
      strike, man, strike.
      They struck. The golden age's brightest adventurer —
      courtier, colonist, poet, pirate —
      died for a fifteen-year-old sentence
      and a king's diplomacy.
      I kept the pamphlet of his speech.
      The crowd went home quiet.
      Even his enemies felt the shame of it.
    description: "Walter Raleigh is beheaded at Whitehall for his failed Guiana voyage — fifteen years after his first death sentence, a king's diplomacy kills him."
    status: "first draft"
    sha256: "809b40158be509199362fc1cb65673ea18d80af759e85cdcb726da19f3f066e7"
  - number: "2527"
    volume: 4
    title: "Sarhu"
    date: "1619 CE"
    region: "Manchuria"
    poem: |
      Nurhaci laid the trap in the Manchurian forests —
      four Ming armies, a hundred thousand men,
      marching in separate columns through the snow,
      and the Manchus falling on each in turn.
      I traveled with a Ming supply column that spring
      and saw the disaster unfold: at Sarhu the first army
      was annihilated, then the second, then the third —
      the Manchu cavalry moving like wolves
      through the pines, the Ming guns useless
      in the close trees.
      Forty thousand dead. The Ming never recovered.
      Nurhaci, the Jurchen chief the Chinese had dismissed
      as a barbarian, had broken the greatest army in Asia
      in a week of forest fighting.
      The dynasty's doom began here, in the snow,
      among the pines of the northeast.
      I stood on the battlefield afterward —
      the crows, the abandoned cannon, the silence —
      and understood: China would fall
      not to numbers, but to patience and the trees.
    description: "The Manchu leader Nurhaci annihilates four Ming armies at Sarhu — and the Ming dynasty's doom begins in the Manchurian snow."
    status: "first draft"
    sha256: "60cb916b206eff3e55e224946240b6d34106344f37fbce2de0f3a7990dbb4008"
  - number: "2528"
    volume: 4
    title: "Batavia Founded"
    date: "1619 CE"
    region: "Java"
    poem: |
      Coen took Jayakarta with cannon and fire —
      burned it, leveled it, and raised Batavia
      on its ashes: the VOC's Asian capital,
      a Dutch city under a tropical sun,
      canals and warehouses and a castle.
      I walked its streets in the first years:
      the Company men in their black coats sweating,
      the Javanese, Chinese, and Malay laborers
      building the walls that would hold them all,
      the nutmeg and cloves flowing through the harbor
      like a spice-scented tide.
      Jan Pieterszoon Coen — brilliant, ruthless —
      ran it like a fortress and a counting-house at once.
      Batavia would rule the archipelago for two centuries,
      the hinge of the Dutch empire in Asia.
      It began with a burned town and a new name.
      Empires often do.
      I stood on the castle wall at sunset,
      smelling cloves on the wind,
      and watched the ships come in from every point
      of the compass, all of them flying
      the Company's flag.
    description: "Jan Pieterszoon Coen seizes Jayakarta and founds Batavia — the Dutch East India Company's Asian capital, raised on a burned town's ashes."
    status: "first draft"
    sha256: "335fc8ed86911dcf7a484baee455ce1660ee78a0d2f76a461877e0b4f9609e9d"
  - number: "2529"
    volume: 4
    title: "The Music of the Spheres"
    date: "1619 CE"
    region: "Prague"
    poem: |
      Kepler found it at last — the third law,
      the harmony he'd been hunting for twenty years:
      the square of a planet's year is proportional
      to the cube of its distance from the sun.
      He called it the music of the spheres —
      each planet singing its note as it circled,
      the whole solar system a chord
      in the mind of God.
      He even wrote out the melodies,
      note by note, planet by planet.
      I visited him the year it was published:
      older now, poorer, his eyes failing,
      but triumphant — holding the Harmony of the World
      in his hands like a newborn.
      Pythagoras had dreamed it two thousand years before;
      Kepler had proved it with Tycho's numbers.
      The universe, he said, is not silent.
      It sings in mathematics.
      I walked home under the Prague stars that night
      and listened, or tried to —
      and for a moment, I swear,
      I heard it too.
    description: "Kepler publishes his third law of planetary motion — the harmony of the spheres, the solar system singing in mathematics."
    status: "first draft"
    sha256: "05c17766af8b5515793219bf81c018a85835bd5b94d1ac9af39719d04b72ea27"
  - number: "2530"
    volume: 4
    title: "The White Lion"
    date: "1619 CE"
    region: "Virginia"
    poem: |
      The Dutch ship came into Point Comfort in August —
      the White Lion, a privateer —
      and traded twenty-odd Africans for food.
      I was in Jamestown that month and saw them led ashore:
      men and women stolen from Angola,
      survivors of a Portuguese slave ship
      the Dutch had robbed at sea.
      They were sold — or indentured, the records blur —
      into a colony desperate for labor.
      Nobody marked the day. No bell rang.
      It was a transaction, entered in a ledger,
      twenty souls for victuals.
      But that ledger entry was the seed
      of everything: two and a half centuries of bondage,
      millions in chains, a wound America
      has never fully closed.
      I wish I could say I knew, watching them land,
      what it would become.
      I didn't. None of us did.
      That is the horror of it —
      how quietly the worst things begin.
    description: "A Dutch ship lands the first enslaved Africans at Point Comfort — twenty souls traded for food, the quiet beginning of America's wound."
    status: "first draft"
    sha256: "582a13949fddfc291f2fc2a63211a33ffca81abc0cb5624beb945bfab740d4d2"
  - number: "2531"
    volume: 4
    title: "The Mayflower Sails"
    date: "1620 CE"
    region: "The Atlantic"
    poem: |
      A hundred souls in a leaky ship —
      the Mayflower, out of Plymouth in September,
      bound for Virginia, blown to New England,
      carrying Separatists who'd fled to Holland
      and back, seeking a place to pray their own way.
      I stood on the Plymouth dock and watched them go:
      families, children, old men, the whole venture
      staked on faith and a bad map.
      Half of them would die that first winter —
      hunger, cold, sickness, the new world's indifference.
      But they signed the Compact first —
      government by consent, in a ship's cabin,
      before they ever saw the shore.
      And they endured, somehow, the dying and the burying,
      till spring.
      I have crossed that ocean a hundred times since,
      in comfort no Pilgrim dreamed.
      But I never forget the leaky ship,
      the hundred souls, the September sailing —
      how much of America began
      with people who had nowhere else to go.
    description: "A hundred Pilgrims cross the Atlantic in a leaky ship — half will die the first winter, but the Compact they sign will outlive them all."
    status: "first draft"
    sha256: "95781dd92ecd9842e46e9e11e441eb999c102d19129b47c2dfea5ed4d3eb1739"
  - number: "2532"
    volume: 4
    title: "The White Mountain"
    date: "1620 CE"
    region: "Prague"
    poem: |
      Two hours. The battle lasted two hours —
      Catholic armies under Tilly against the Bohemian rebels
      on the White Mountain outside Prague,
      and by noon it was over.
      I watched from the city walls as the Protestant cause
      in Bohemia died in a morning:
      the Winter King's army broken, Frederick fleeing,
      the rebel lords captured — twenty-seven of them
      executed in the Old Town Square the next summer,
      their heads on spikes.
      What followed was the recatholicizing —
      the Jesuits, the confiscations, the exiles,
      Bohemia's Protestant nobility erased,
      the Czech language driven underground for centuries.
      The Thirty Years' War had its first great decision,
      and it went to Vienna and Rome.
      Two hours on a hill outside Prague,
      and a nation's fate for three hundred years.
      I walked the field at dusk —
      the crows already at work —
      and felt the weight of how fast
      history can close a door.
    description: "Catholic armies crush the Bohemian rebels at White Mountain in two hours — and Bohemia's Protestant hopes die for three centuries."
    status: "first draft"
    sha256: "b66bee6c3df49d16af13f223954e05c1bad9d34b62152654f2bcf53f16e6dbb4"
  - number: "2533"
    volume: 4
    title: "The New Organon"
    date: "1620 CE"
    region: "England"
    poem: |
      Francis Bacon published it — the New Organon,
      the new instrument —
      and told the world to stop arguing from Aristotle
      and start looking at things.
      Experiment, he said. Induction.
      Torture nature for her secrets —
      his phrase, not mine, and a rough one —
      but the meaning was clear: knowledge comes
      from doing, not from quoting.
      I read it in London that winter, by candlelight,
      and felt the ground shift under philosophy.
      The old learning had been a cathedral;
      Bacon proposed a workshop.
      He was Lord Chancellor, corrupt and brilliant,
      and he would fall from power within the year —
      but the book outlived the man.
      Every laboratory since, every experiment,
      every peer-reviewed paper, descends
      from Bacon's insistence:
      don't tell me what the ancients said.
      Show me.
    description: "Francis Bacon publishes his call for a new science built on experiment, not ancient authority — the workshop replaces the cathedral."
    status: "first draft"
    sha256: "d3f522d7c68bb4bab8624e085b2fd596e6d59c7afa0dea1c553f7825ad2f4233"
  - number: "2534"
    volume: 4
    title: "The First Thanksgiving"
    date: "1621 CE"
    region: "Plymouth"
    poem: |
      The harvest came in — barely, but it came —
      and the survivors feasted: fifty-one Pilgrims left
      of the hundred who'd sailed, and ninety Wampanoag,
      their neighbors, who'd taught them to plant corn
      and where to fish.
      I sat at the edge of that three-day feast —
      venison, wildfowl, corn, the woods providing —
      and watched Massasoit's people and the English
      eat together, suspicious and grateful by turns.
      No one called it Thanksgiving. It was just dinner —
      dinner after a year of burials.
      Squanto was there, the interpreter,
      the man who'd made it all possible.
      Within a generation his people's world
      would be unrecognizable.
      But that autumn, for three days,
      there was food, and company, and peace.
      I remember the laughter more than the food.
      Hungry people laughing —
      that is the sound of survival,
      and I have never heard it so clearly
      as at Plymouth, in 1621.
    description: "The surviving Pilgrims share a harvest feast with their Wampanoag neighbors — three days of food and laughter after a year of burials."
    status: "first draft"
    sha256: "eb910eb283c54bf53f8d97b6bd81706535b672b590614c6914a9b44945c1c620"
  - number: "2535"
    volume: 4
    title: "Molière Is Born"
    date: "1622 CE"
    region: "Paris"
    poem: |
      In Paris, in January, a boy was born —
      Jean-Baptiste Poquelin, son of an upholsterer
      to the king, baptized at Saint-Eustache,
      with no one suspecting anything at all.
      He would become Molière — the actor, the manager,
      the playwright who taught France to laugh at itself:
      the miser, the hypocrite, the learned ladies,
      the bourgeois gentleman, all of them
      held up to the mirror and found ridiculous.
      I like to think of the upholsterer's son
      playing in his father's workshop,
      among the tapestries and the offcuts,
      learning the textures of the world
      he would later stitch into comedy.
      Louis XIV would laugh at his plays
      and protect him from the devout.
      The stage would be his church,
      laughter his sacrament.
      A boy born in January, in Paris —
      and France would never be so honest again
      as when he was mocking it.
    description: "Jean-Baptiste Poquelin is born in Paris — the boy who will become Molière and teach France to laugh at itself."
    status: "first draft"
    sha256: "ecb53af3c92c51093c607e9ecfbf7b9a4eab9319d5fd120dffa05c4131b49114"
  - number: "2536"
    volume: 4
    title: "The Jamestown Massacre"
    date: "1622 CE"
    region: "Virginia"
    poem: |
      They came at dawn on a March morning —
      Opechancanough's warriors, moving among the settlements
      as visitors, as trading partners,
      borrowing the colonists' own tools —
      and then the killing began.
      I was upriver when the news came running:
      a third of the colony dead in a single morning —
      three hundred and forty-seven men, women, children,
      the outlying farms wiped out, Jamestown itself
      saved only by a warning from a friendly Indian boy.
      The English called it a massacre.
      The Powhatans called it war —
      a strike to push the strangers back into the sea
      before they swallowed the land whole.
      It failed. The English stayed, and the retaliation
      was ten years of burning villages and poisoned wells.
      I walked through the burned settlements afterward
      and saw what fear does to people:
      the colony that had lived beside its neighbors
      now lived behind its walls, forever.
      One morning in March, and trust —
      the fragile, necessary trust —
      was dead for a century.
    description: "Opechancanough's warriors strike the scattered settlements at dawn — a third of the colony dead in a single morning, trust dead for a century."
    status: "first draft"
    sha256: "e6779b0e3045f1098f62f23dd58f5c1f9c3d96cb39e0d02bdd0edd72ed646709"
  - number: "2537"
    volume: 4
    title: "The Sultan Strangled"
    date: "1622 CE"
    region: "Constantinople"
    poem: |
      They dragged him from the palace —
      Osman II, eighteen years old, the young sultan
      who'd tried to reform the Janissaries
      and learned what Janissaries do to reformers.
      I was in Constantinople that May
      and heard the city holding its breath:
      the soldiers mutinied, seized the boy-sultan,
      and strangled him with a bowstring
      in the Seven Towers — the first Ottoman sultan
      killed by his own troops.
      They put his uncle on the throne instead —
      Mustafa, mad Mustafa, who'd spent half his life
      in the Cage.
      The empire shuddered, and went on.
      Reform in the Ottoman house was now a capital crime,
      proven on a sultan's neck.
      It would be a century before anyone tried again.
      I stood outside the Seven Towers afterward
      and looked up at the stones,
      and thought about how empires eat their young
      when the young try to change them.
    description: "The Janissaries murder the young Sultan Osman II — the first Ottoman sultan killed by his own soldiers — for trying to reform them."
    status: "first draft"
    sha256: "4c16fbca3a3594af725cddba7158642d14d6037f00afa40c4fe5f331034a9d09"
  - number: "2538"
    volume: 4
    title: "The First Folio"
    date: "1623 CE"
    region: "London"
    poem: |
      Shakespeare's friends did it — Heminges and Condell,
      two actors who'd known him —
      gathered his plays and printed them in one great folio:
      thirty-six plays, nine hundred pages,
      half of them never printed before.
      I bought a copy from the shop at the Blackfriars gate
      and turned the pages with shaking hands:
      Macbeth — saved. The Tempest — saved.
      Julius Caesar, Twelfth Night, Antony and Cleopatra —
      eighteen plays that would have vanished
      like breath off a mirror, rescued by friendship.
      Without that book, we would have half a Shakespeare —
      no storm on the heath, no "tomorrow and tomorrow,"
      no Prospero drowning his book.
      Two actors, a printer, and a debt of love:
      that is all that stood between the greatest writer
      in English and oblivion.
      I keep my folio wrapped in cloth.
      It is the most valuable thing I own,
      and the cheapest miracle I know.
    description: "Shakespeare's friends publish his collected plays in the First Folio — rescuing eighteen of them, half his work, from oblivion."
    status: "first draft"
    sha256: "b9f047325a0db7342931ad1e64b44824777d8570f113722ef5f86416d0507aa8"
  - number: "2539"
    volume: 4
    title: "The Amboyna Massacre"
    date: "1623 CE"
    region: "Amboyna"
    poem: |
      The Dutch accused them of conspiracy —
      ten English merchants on Amboyna,
      a few Japanese mercenaries, a Portuguese overseer —
      tortured with water and fire till they confessed
      to a plot that never existed.
      I heard the account from a survivor's letter,
      smuggled out of the Banda Sea:
      the trial a farce, the evidence the confessions,
      the executions methodical — beheaded,
      one by one, on the beach at Amboyna.
      England howled. The pamphlets flew.
      "Amboyna" became the English word for Dutch treachery,
      poisoning every negotiation for a generation —
      Cromwell would still be citing it thirty years later.
      Ten merchants dead on a spice island beach,
      and two nations' friendship dead with them.
      The spice trade ran on nutmeg and blood,
      and I have never been able to smell cloves since
      without thinking of Amboyna.
    description: "The Dutch torture and execute English merchants on Amboyna for a plot that never existed — poisoning Anglo-Dutch friendship for a generation."
    status: "first draft"
    sha256: "49af9435ff0bb9bad6bfa9f39bd0ebbe120b572240c154bb45308f039d7e0a25"
  - number: "2540"
    volume: 4
    title: "Queen Nzinga"
    date: "1624 CE"
    region: "West Africa"
    poem: |
      She took the throne of Ndongo —
      Nzinga, sister of the dead king,
      in a world where women did not rule
      and Portuguese slavers did as they pleased.
      I never met her, but I heard the stories
      from traders on the Kwanza:
      how she received the Portuguese governor
      with no chair offered, and sat on her servant's back
      rather than sit lower than him —
      how she fought, negotiated, converted,
      un-converted, moved her capital, built alliances,
      and defied the slavers for forty years.
      Forty years. She died at eighty-one,
      still queen, still undefeated,
      having kept her people free
      while kingdoms around her fell.
      The Portuguese called her savage.
      History calls her what she was:
      one of the great sovereigns of the age,
      who looked the slave trade in the face
      and said: not here. Not my people.
      Not while I breathe.
    description: "Nzinga takes the throne of Ndongo and begins her forty-year defiance of Portuguese slavers — sitting on her servant's back rather than sit lower than a governor."
    status: "first draft"
    sha256: "7eebf5bf6624be5f4686647d703e733e7646e3d847ef7be38c1c61ba1ce14fb4"
  - number: "2541"
    volume: 4
    title: "Salvador Taken"
    date: "1624 CE"
    region: "Brazil"
    poem: |
      The Dutch came with twenty-six ships —
      the West India Company, Holland's other great company —
      and took Salvador, Brazil's capital,
      before the Portuguese knew what hit them.
      I was in the Recôncavo that year and watched
      the sugar world turn upside down:
      Dutch admirals in the governor's palace,
      the planters fleeing inland, the mills idle,
      the whole captaincy holding its breath.
      It didn't last — the Portuguese took it back
      within the year, and the Dutch would have to try again
      to build their Brazilian empire.
      But the shock never faded:
      the greatest sugar colony on earth
      had been seized in a morning,
      and everyone in the Atlantic world understood —
      no empire's possessions were safe anymore.
      The Dutch learned. They'd be back.
      And when they came back, they'd stay —
      and Recife would bloom, briefly,
      as Holland's tropical capital.
    description: "A Dutch fleet seizes Salvador, Brazil's capital — the shock proves no empire's possessions are safe, and Holland's Brazilian dream begins."
    status: "first draft"
    sha256: "4cfd1142fe79a7fa18fdfd0cfd0336145f6b21d78e6daf5a6afb8f58786e3c41"
  - number: "2542"
    volume: 4
    title: "Charles Takes the Throne"
    date: "1625 CE"
    region: "England"
    poem: |
      James died in March, and Charles took the throne —
      twenty-four, handsome, devout, convinced
      that kings ruled by God's own right
      and parliaments were an inconvenience.
      I watched the coronation at Westminster:
      the young king pale under the crown,
      the crowd cheering out of habit,
      the old counselors exchanging looks
      that said what no one would say aloud —
      this one will not bend.
      Within months he was quarreling with Parliament
      over money, over religion, over everything.
      He married a Catholic French princess.
      He dismissed the Parliament that displeased him.
      The pattern was set in the first year,
      and it never changed.
      Eleven years of personal rule were coming,
      then civil war, then the scaffold.
      But that spring day at Westminster,
      with the crown on his head and the choir singing,
      Charles I looked like the future.
      The future had other plans.
    description: "Charles I becomes king of England — handsome, devout, and convinced kings rule by divine right; his quarrels with Parliament begin at once."
    status: "first draft"
    sha256: "b8ffd3465789683fb7b048844da53e08b89fb3bcd0d76c13efeb1e062533c4de"
  - number: "2543"
    volume: 4
    title: "The Island Bargain"
    date: "1626 CE"
    region: "Manhattan"
    poem: |
      Peter Minuit — or whoever held the Company's purse —
      traded with the Lenape for Manhattan:
      goods worth sixty guilders, the legend says —
      beads and cloth and kettles —
      for an island that would become the center of the world.
      I walked that island before the Dutch built much:
      forest, streams, the great harbor glittering,
      the Lenape fishing where Wall Street would stand.
      The "purchase" was a misunderstanding wrapped in a trade —
      the Lenape didn't sell land the way Europeans meant it;
      they thought they were sharing use-rights.
      New Amsterdam rose: a fort, a windmill,
      a wall across the island's neck —
      Wall Street, named for a wall against the English
      and the natives both.
      Sixty guilders. The most famous real-estate deal
      in history, and neither side understood it.
      I stood on the shore at the tip of the island,
      looking out at the harbor,
      and tried to imagine what would stand here.
      I failed. Everyone fails.
      That is the point of Manhattan.
    description: "Dutch traders buy Manhattan from the Lenape for goods worth sixty guilders — a misunderstanding wrapped in a trade, on an island no one could imagine."
    status: "first draft"
    sha256: "77f0335c3e888fa029c48221905f9c9f611bbac3a8e9e78ff90c4e79fd604697"
  - number: "2544"
    volume: 4
    title: "St. Peter's Consecrated"
    date: "1626 CE"
    region: "Rome"
    poem: |
      A hundred and twenty years. Bramante, Raphael,
      Michelangelo, Maderno — four architects,
      nineteen popes — and on a November morning
      Urban VIII consecrated the new St. Peter's,
      the grandest church in Christendom.
      I stood in the crowd in the piazza —
      a hundred thousand souls, they said —
      as the procession wound through the nave,
      seven hundred feet of marble and light,
      Bernini's baldacchino rising over the altar
      like a bronze prayer.
      Above it all, the dome — Michelangelo's dome —
      floating against the Roman sky.
      Below it, the tomb of the fisherman,
      two thousand years deep.
      They had torn down the old basilica of Constantine
      to build this. Some called it sacrilege.
      Standing in that ocean of stone and song,
      I could only call it what it was:
      the largest room ever built for God,
      and for the men who spoke in His name.
    description: "After 120 years of building, the new St. Peter's Basilica is consecrated — the grandest church in Christendom, an ocean of marble and song."
    status: "first draft"
    sha256: "c28409340f20a57261920d3fc005630a880902fdafdca6ebc5dffb8bcc3d929a"
  - number: "2545"
    volume: 4
    title: "La Rochelle Besieged"
    date: "1627 CE"
    region: "France"
    poem: |
      Richelieu ringed it — the Protestant stronghold,
      La Rochelle, the city the Huguenots called their Rome —
      with an army on land and a mole across the harbor,
      starving it the slow way.
      I slipped through the lines that winter
      with a relief boat that never got through:
      inside the walls, the hunger —
      the mayor's own family on rations,
      the dead buried in the night,
      fifteen thousand souls shrinking to five.
      The English fleet came, sailed about,
      and left. No one else came.
      After fourteen months the city yielded —
      the survivors staggering out, ghosts in rags —
      and Richelieu rode in, merciful and absolute.
      The Huguenots kept their faith but lost their walls,
      their armies, their state within the state.
      France would have one king, one law —
      and, soon enough, one religion.
      I walked the empty streets afterward,
      past the houses with no one left to live in them,
      and heard only the gulls.
    description: "Richelieu's armies ring the Protestant stronghold of La Rochelle and starve it for fourteen months — the Huguenots keep their faith but lose their walls."
    status: "first draft"
    sha256: "836e6761ab7dfff6b6db930f41ef5fcbf6cec6b9acb8fc53ace62f025cc209ac"
  - number: "2546"
    volume: 4
    title: "The Petition of Right"
    date: "1628 CE"
    region: "England"
    poem: |
      Parliament cornered him — Charles, who believed
      God had made him king —
      and made him sign the Petition of Right:
      no taxes without Parliament's consent,
      no imprisonment without cause,
      no quartering soldiers on civilians,
      no martial law in peacetime.
      I was in Westminster Hall when the news came out:
      the Commons had done it — put the ancient liberties
      in writing, and made the king agree.
      Coke, the old lion of the law, had drafted it;
      the king had tried to dodge it;
      in the end he signed.
      He didn't mean it. Within the year
      he'd be ruling without Parliament,
      and the Petition would be a scrap of paper
      for eleven years.
      But paper outlasts kings.
      The words were written down, and written words
      have a way of coming back.
      In 1689 they'd be back, in the Bill of Rights.
      I kept a copy, and underlined the first line twice:
      the rights and liberties of the subject.
      Someone, someday, would collect.
    description: "Parliament forces Charles I to sign the Petition of Right — no taxes without consent, no arbitrary prison; paper that will outlast the king."
    status: "first draft"
    sha256: "3d17d9e3fe087dda89c9828fd7d238d05ed26a6fbfd9fa89da8120d77ea9b00c"
  - number: "2547"
    volume: 4
    title: "The Blood Circulates"
    date: "1628 CE"
    region: "England"
    poem: |
      William Harvey published it — De Motu Cordis,
      on the motion of the heart —
      and proved what no one had dared to prove:
      the blood goes round.
      Not ebb and flow, as Galen taught for fourteen centuries —
      but a circuit: the heart a pump, the arteries carrying out,
      the veins carrying back, the same blood
      returning again and again.
      I watched him demonstrate it in London:
      the ligature on the arm, the veins swelling below,
      the valves in the veins like tiny gates
      allowing flow one way only.
      Simple. Obvious — once shown.
      Fourteen hundred years of medicine,
      overturned by observation and arithmetic:
      the heart beats a hundred thousand times a day,
      moving more blood than the body could make —
      so it must go round.
      Harvey was the king's physician.
      The king would lose his head in twenty years;
      Harvey's discovery never lost its head at all.
      It circulates still — in every chest,
      including yours.
    description: "William Harvey publishes his proof that the heart pumps blood around the body in an endless circuit — fourteen centuries of Galen overturned."
    status: "first draft"
    sha256: "a5c91b0423a6300f7bc37843c74881971b817212e291330596e064ec6dc9a27d"
  - number: "2548"
    volume: 4
    title: "The Edict of Restitution"
    date: "1629 CE"
    region: "Germany"
    poem: |
      The emperor overplayed his hand —
      Ferdinand, flushed with Catholic victories,
      issued the Edict of Restitution:
      every church land seized by Protestants
      since 1552 must be given back.
      I was in Augsburg when it was proclaimed,
      and I watched the Protestant princes go white.
      It meant the bishoprics, the abbeys,
      two archbishoprics, a hundred monasteries —
      a map redrawn by decree, a century of settlements
      torn up at a stroke.
      It was meant to finish the war.
      Instead it guaranteed ten more years of it —
      the Protestants would fight to the death now,
      having nothing left to lose,
      and France, watching the Habsburgs grow too strong,
      decided to enter the war itself.
      Victory disease: the oldest sickness of empires.
      Ferdinand had won so much he couldn't stop winning,
      and the Edict turned his triumph
      into everyone's desperation.
      I wrote in my journal that night:
      this Edict will kill more men
      than any battle of the war.
    description: "The Catholic emperor orders Protestants to return all seized church lands — a victor's overreach that guarantees ten more years of war."
    status: "first draft"
    sha256: "0d46e5aed5dd0c2a2ce51a100d7706355091df8e4f5f02c8fa572ba1739d6809"
  - number: "2549"
    volume: 4
    title: "The City on a Hill"
    date: "1630 CE"
    region: "Massachusetts"
    poem: |
      Winthrop preached it aboard the Arbella —
      the sermon, "A Model of Christian Charity" —
      before they ever saw the shore:
      we shall be as a city upon a hill,
      the eyes of all people upon us.
      I sailed with that fleet — eleven ships,
      a thousand Puritans, the great migration —
      and watched them land at Massachusetts Bay,
      building Boston out of wilderness
      with prayer and axes.
      A city on a hill: a godly commonwealth,
      visible to the world, judged by its righteousness.
      They meant it as a warning to themselves —
      fail, and the world will see you fail.
      They built it — the town, the church, the college —
      and the world did watch, for centuries,
      arguing ever since about what it saw.
      I stood on that hill the first winter,
      the wind off the bay like a knife,
      and thought: they have set themselves a task
      no people can complete, and they will try forever.
    description: "John Winthrop's Puritan fleet lands in Massachusetts Bay — \"a city upon a hill,\" a godly commonwealth the whole world will watch and argue over."
    status: "first draft"
    sha256: "cc0dfb0c6e630b8cc04c4d3b81c9a3c1924e6d12928a4fd069fec41244ea68b8"
  - number: "2550"
    volume: 4
    title: "The Lion Lands"
    date: "1630 CE"
    region: "Germany"
    poem: |
      He came ashore at Usedom in July —
      Gustavus Adolphus of Sweden, the Lion of the North,
      with thirteen thousand men and the most modern army
      in Europe: light guns, volley fire,
      cavalry that charged with the sword, not the carbine.
      I watched the landing from the dunes:
      the Swedish king kneeling in the sand
      to pray, the troops filing ashore in perfect order,
      the banners snapping in the Baltic wind.
      Germany's Protestants, bled white by twelve years of war,
      looked north and saw — hope, with artillery.
      The Catholics laughed. Another northern king
      come to be buried in Germany, like Christian of Denmark
      before him.
      They stopped laughing at Breitenfeld.
      But that July day on the beach at Usedom,
      it was only a landing — a king on his knees in the sand,
      an army in good order, and a war
      about to change its nature forever.
    description: "Gustavus Adolphus of Sweden lands in Germany with his modern army — the Lion of the North comes ashore praying, and the Thirty Years' War turns."
    status: "first draft"
    sha256: "0387418c41a2eb28345cf1b5da1051a3ea98063e383797b3191490c99b84b9a4"
  - number: "2551"
    volume: 4
    title: "Magdeburg Burns"
    date: "1631 CE"
    region: "Germany"
    poem: |
      Tilly's men broke in in May — the great Protestant city,
      Magdeburg, twenty-five thousand souls —
      and what followed was the war's blackest day.
      I arrived two days after, with a relief column
      that had nothing to relieve:
      the city burned to the ground, street by street,
      the cathedral standing alone in the ashes
      like a bone in a burned field.
      Twenty thousand dead — by fire, by sword,
      by drowning in the Elbe trying to flee.
      The Catholics called it Magdeburg's sacrifice.
      The Protestants called it the Magdeburg wedding —
      wedded to fire.
      All Europe shuddered; the pamphlets flew;
      Gustavus Adolphus swore vengeance
      and marched south with fury in his ranks.
      I walked through the ruins — the heat still rising
      from the rubble, the smell of it in my clothes for weeks —
      and understood what total war looks like
      before the phrase existed.
      Magdeburg: the word itself became a warning.
    description: "Catholic troops sack Magdeburg and massacre twenty thousand — the Thirty Years' War's most infamous atrocity, a city wedded to fire."
    status: "first draft"
    sha256: "898934caa5e589c9e80d005fdfc7a6378b62a55d38b3ca49e14d4697e64969aa"
  - number: "2552"
    volume: 4
    title: "Breitenfeld"
    date: "1631 CE"
    region: "Germany"
    poem: |
      September, on the plain at Breitenfeld —
      Gustavus Adolphus drew up his Swedes
      against Tilly's Catholic veterans,
      the finest army in Europe, undefeated for a decade.
      I watched from a village rooftop as the new way of war
      proved itself: the Swedish brigades,
      thin and flexible, pouring volley fire
      while their light guns galloped forward;
      the cavalry charging home with cold steel;
      Tilly's great tercio squares, slow and deep,
      shot to pieces before they could close.
      By evening the Catholic army was destroyed —
      seven thousand dead, the rest fled or captured,
      Tilly himself wounded.
      The Lion of the North had done in a day
      what twelve years of war had not.
      Protestant Germany rose. The road to Munich
      lay open. The war had a new master.
      I climbed down from that rooftop
      with my ears ringing, having watched
      the art of war change forever
      in a single afternoon.
    description: "Gustavus Adolphus smashes Tilly's undefeated Catholic army at Breitenfeld — volley fire and mobile guns prove the new way of war in an afternoon."
    status: "first draft"
    sha256: "368fbdfc2d3a4dc351770cc2d19ed82c9237bfd0a4bb5f154b35cbf63a9eefcc"
  - number: "2553"
    volume: 4
    title: "The Anatomy Lesson"
    date: "1632 CE"
    region: "Amsterdam"
    poem: |
      He was twenty-five — Rembrandt van Rijn,
      fresh from Leiden —
      and the surgeons' guild commissioned the group portrait:
      Dr. Tulp demonstrating the anatomy of the arm
      on a dead criminal, his colleagues crowded round.
      I saw it unveiled in Amsterdam:
      not a stiff row of faces but a moment —
      the doctor lifting the tendons with his forceps,
      the surgeons leaning in, one peering over his spectacles,
      the corpse pale in the center of all that curiosity.
      It made his name overnight.
      The light on the dead man's flesh,
      the living eyes all fixed on the mystery of the body —
      a twenty-five-year-old had painted
      the whole Enlightenment in embryo:
      look closely, together, and learn.
      I stood before it a long time.
      The surgeons look out at us, the viewers,
      as if to say: come closer.
      This is how knowledge is made —
      by hand, by eye, by gathering round the dead
      to understand the living.
    description: "Twenty-five-year-old Rembrandt paints Dr. Tulp's anatomy lesson — and Amsterdam learns his name overnight."
    status: "first draft"
    sha256: "f43bfff9a45b8df50d19e0151e2dbeedf140e0c174037f80b29377734131d52c"
  - number: "2554"
    volume: 4
    title: "Lützen"
    date: "1632 CE"
    region: "Germany"
    poem: |
      The fog lay thick on the field at Lützen —
      so thick the armies blundered into each other —
      and in that white blindness the Lion fell.
      Gustavus Adolphus led a cavalry charge himself,
      as he always did, got separated in the fog,
      and was shot — pistol, then sword-cuts,
      stripped by looters, found at dusk
      face down in the mud.
      I walked that field the next day:
      the Swedes had won — Wallenstein's army broken,
      driven off — but their king lay dead,
      and Protestant Europe's heart broke with him.
      They carried his body home through Germany,
      the towns turning out in silence.
      The Lion of the North, thirty-seven years old,
      victorious and dead in the fog.
      The war went on without him for sixteen more years —
      as if it had forgotten what it was for.
      I think of him often: the king who prayed on the beach
      at Usedom, and died in the fog at Lützen,
      and changed war forever in between.
    description: "Gustavus Adolphus dies victorious in the fog at Lützen — the Lion of the North falls at thirty-seven, and Protestant Europe mourns."
    status: "first draft"
    sha256: "4e0552bb78f65ca5089bb11880646b942d34cbe92b74ae8ef7489de12c4f36dc"
  - number: "2555"
    volume: 4
    title: "The Child Queen"
    date: "1632 CE"
    region: "Sweden"
    poem: |
      She was six years old — Christina,
      daughter of the Lion, heir of Sweden —
      and they put the crown on her small head
      in a kingdom at war.
      I saw her at court years later, a teenager:
      brilliant, restless, speaking six languages,
      riding like a cavalryman, dressing like one too,
      arguing theology with the bishops
      and philosophy with Descartes —
      whom she summoned to Stockholm
      and accidentally killed with the cold
      and the 5 a.m. lessons.
      She would abdicate at twenty-eight,
      convert to Catholicism, and ride to Rome
      to become its most scandalous celebrity —
      Minerva of the North, they called her.
      But in 1632 she was six, fatherless,
      queen of a great power by the arithmetic of birth.
      I watched the little girl at the coronation feast,
      solemn among the generals,
      and wondered what it costs a child
      to inherit a lion's throne.
    description: "Six-year-old Christina becomes queen of Sweden — the clever girl who will astonish Europe, argue with Descartes, and abdicate for Rome."
    status: "first draft"
    sha256: "c0d0bc16ea7151393bbf96b7833175c20905d9b304894adb2ba17035f5edbc7f"
  - number: "2556"
    volume: 4
    title: "The Taj Begun"
    date: "1632 CE"
    region: "Agra"
    poem: |
      Mumtaz died in childbirth — her fourteenth child —
      and Shah Jahan, the emperor, was broken.
      So he built her a tomb: not a tomb, a poem in marble,
      on the banks of the Yamuna at Agra.
      I watched the foundations go down that year:
      the call going out across the empire —
      twenty thousand workers, a thousand elephants,
      marble from Makrana, jasper from the Punjab,
      turquoise from Tibet, carnelian from Arabia.
      It would take twenty years. The dome would float
      like a moonrise; the minarets would stand
      like prayers; the whole thing would change color
      with the hours — pink at dawn, white at noon,
      gold at dusk.
      All for love. All for grief.
      The most beautiful building on earth,
      built because a man could not bear
      that the woman he loved should disappear.
      I stood on the riverbank that first year,
      looking at stakes and trenches,
      and could not imagine what would rise there.
      No one could. That is what makes it a wonder.
    description: "Shah Jahan commissions a marble tomb for his beloved Mumtaz, dead in childbirth — the Taj Mahal begins as stakes and trenches on the Yamuna."
    status: "first draft"
    sha256: "a6227c78b60b5f2e2cf0dfc39718fd13b561362e532e21d692b7e00d38517fa5"
  - number: "2557"
    volume: 4
    title: "Yakutsk Founded"
    date: "1632 CE"
    region: "Siberia"
    poem: |
      The Cossacks built it on the Lena —
      Yakutsk, a wooden fort in the permafrost,
      two thousand miles east of Moscow,
      the fur frontier's new capital.
      I traveled with a fur convoy that decade:
      the endless taiga, the rivers like roads,
      the sable traps, the yasak tribute
      collected from the Yakuts in pelts.
      A single black sable could buy a village;
      the Lena basin was a treasury
      walking around on four legs.
      Yakutsk held — through fifty-below winters,
      through scurvy and mutiny —
      and from it the Russians pushed on:
      to the Sea of Okhotsk, to Kamchatka,
      to the very edge of Asia.
      A log fort on a frozen river,
      and from it an empire reached the Pacific.
      I stood on the Lena's bank in winter,
      the ice groaning like a living thing,
      and watched the sledges come in
      laden with the soft gold of Siberia.
    description: "Russian Cossacks found Yakutsk on the Lena River — a log fort in the permafrost from which an empire will reach the Pacific."
    status: "first draft"
    sha256: "c16806c28bfe3fdb4349413229d69c717331c1e58f5069c25a2137a69037534a"
  - number: "2558"
    volume: 4
    title: "Galileo on Trial"
    date: "1633 CE"
    region: "Rome"
    poem: |
      They made the old man kneel —
      Galileo, seventy years old, sick, half-blind —
      in the Inquisition's hall, and read him the sentence:
      he must abjure, curse, and detest
      the lie that the Earth moves.
      I was in Rome that June. The city buzzed with it:
      the great astronomer, the Starry Messenger,
      brought low by the Holy Office.
      He knelt. He recited the formula.
      They say he muttered under his breath —
      Eppur si muove, and yet it moves —
      but I doubt it. I think he just wanted to go home.
      They gave him house arrest for life.
      He went back to Arcetri, blind, and wrote
      his greatest book anyway — the Two New Sciences —
      smuggled out and printed in Holland.
      The Church had its obedience.
      Galileo had the truth.
      I know which one lasted.
      Three centuries later they'd admit it.
      The Earth, indifferent to the verdict,
      kept moving all along.
    description: "The Inquisition forces the old astronomer to kneel and deny that the Earth moves — but the Earth, indifferent to the verdict, keeps moving."
    status: "first draft"
    sha256: "b3c65d8f824b53983e1cb23fb99627d8affd3943c22fb438d501b6f2f54c06de"
  - number: "2559"
    volume: 4
    title: "Nördlingen"
    date: "1634 CE"
    region: "Germany"
    poem: |
      The Catholic armies did it properly at Nördlingen —
      the Spanish tercios marching up from Italy,
      joining the Imperialists, catching the Swedes
      and their German allies in the open —
      and crushed them.
      I saw the Swedish army break that September day:
      twelve thousand dead or captured,
      the guns lost, the Protestant cause in Germany
      shattered at a stroke.
      Two years after Lützen, the Lion's work
      lay in ruins on a Bavarian field.
      The consequences ran straight to Paris:
      France, watching the Habsburgs win everything,
      decided it could no longer pay others to fight —
      Richelieu would send French armies into Germany,
      and the war of religion would become
      a war of crowns.
      Nördlingen: the battle that made the war French.
      I walked the field afterward, among the captured guns,
      and thought about how defeat, like victory,
      has children no one expects.
    description: "The Catholic armies crush the Swedes at Nördlingen — and France, watching the Habsburgs win everything, decides to enter the war itself."
    status: "first draft"
    sha256: "ce3060cf8ecda59d568c08149dd865d54a45ab40a0156087c0a7cd0dfb814be0"
  - number: "2560"
    volume: 4
    title: "The French Academy"
    date: "1635 CE"
    region: "Paris"
    poem: |
      Richelieu founded it — the Académie Française,
      forty immortals to guard the French language:
      to fix it, purify it, make it the clearest tongue
      in Europe, fit for kings and philosophers.
      I was in Paris when the letters patent were read:
      a salon of writers made official,
      a dictionary as a state project,
      the language itself declared a matter of national interest.
      It worked, after its fashion.
      French became the language of diplomacy,
      of courts, of the Enlightenment —
      the whole continent learned to speak
      in the Academy's polished sentences.
      Forty immortals, meeting under the dome,
      voting on words.
      I find it charming and slightly mad —
      as if language were a garden
      that could be kept free of weeds by decree.
      But the French proved me half wrong:
      their garden grew the most admired flowers in Europe,
      even if a few wild ones got in anyway.
    description: "Richelieu founds the Académie Française — forty immortals to guard the French language, a dictionary as a state project."
    status: "first draft"
    sha256: "38442fd17af99ed0cbf68e61a3003a54f8c0258e5eef62a38a81043089748070"
  - number: "2561"
    volume: 4
    title: "The Closed Country"
    date: "1635 CE"
    region: "Japan"
    poem: |
      The edict came down like a lid —
      no Japanese ship to leave for foreign ports,
      no Japanese abroad to return on pain of death,
      the great ocean-going junks broken up,
      the ports narrowed to a crack.
      I was in Nagasaki when it was proclaimed:
      the merchants reading it in silence,
      the shipwrights putting down their tools,
      an island nation turning its face inward
      like a flower closing at dusk.
      It wasn't complete — not yet.
      The Dutch would keep their little island at Deshima,
      the Chinese their quarter, the Koreans their embassies.
      But the age of the red-seal ships was over,
      the Japanese diaspora cut off at the root.
      Two hundred years of seclusion began here —
      two hundred years of peace, of art, of cities,
      of a culture ripening in a sealed jar.
      I stood on the Nagasaki waterfront
      and watched the last foreign-bound junk
      unload its cargo for good,
      and wondered what Japan would become,
      alone with itself.
    description: "A new seclusion edict forbids Japanese to travel abroad — the island nation turns its face inward for two hundred years."
    status: "first draft"
    sha256: "04513fd7f4f13716e3e5437131cc5b83cc7c349314778a454fa0e2e1d3630a00"
  - number: "2562"
    volume: 4
    title: "Harvard Founded"
    date: "1636 CE"
    region: "Massachusetts"
    poem: |
      The Puritans voted it in the wilderness —
      a college, in a clearing, to train their ministers:
      named for John Harvard, the young Charlestown minister
      who died at thirty and left his library
      and half his estate to the school.
      I visited it in the early years:
      a single building, a handful of students,
      the forest pressing close on every side,
      the curriculum all Latin and Greek and God.
      It was an act of faith as much as learning —
      a bet that this raw settlement
      would need scholars as well as farmers,
      that the city on the hill required a school.
      The bet paid off beyond all imagining.
      That clearing in the wilderness became Harvard —
      the college, the university, the yard
      where the American mind would be made.
      I sat in on a disputation that first winter —
      boys in black gowns arguing in Latin
      while the snow came down outside —
      and thought: this is how civilizations plant themselves:
      a library, a bequest, a clearing in the woods.
    description: "The Puritans found a college in the wilderness to train their ministers — Harvard begins as a bequest, a library, and a clearing in the woods."
    status: "first draft"
    sha256: "00fad42e8dcb1f454b1b959c9a99d19e5eb1d1179dba9638507fda58b64cdedf"
  - number: "2563"
    volume: 4
    title: "The Qing Proclaimed"
    date: "1636 CE"
    region: "Manchuria"
    poem: |
      Hong Taiji proclaimed it — the new dynastic name:
      the Great Qing, the Pure —
      and with the name, the claim:
      the Mandate of Heaven itself,
      no longer the Ming's to hold.
      I was at the ceremony at Mukden:
      the banners, the shamans, the assembled chiefs
      of Manchu, Mongol, and Chinese bannermen,
      all kneeling to a name that meant
      we are not rebels anymore — we are the dynasty.
      It was audacious. The Qing held only the northeast;
      the Ming still ruled China proper, two hundred million souls.
      But names have power. The Great Qing —
      a promise, a threat, a future
      spoken aloud before it existed.
      Eight years later the Ming would fall,
      and the name would be true.
      I stood among the kneeling chiefs that day
      and heard the future being named,
      and wrote it down exactly as proclaimed:
      the Great Qing has begun.
    description: "Hong Taiji declares his people's new dynastic name — the Great Qing — and claims the Mandate of Heaven eight years before it will be true."
    status: "first draft"
    sha256: "1f7e628a90d7d229dd706ede13e102d871db9cb37f2e66ac86b89ebdb3842151"
  - number: "2564"
    volume: 4
    title: "The Tulip Crash"
    date: "1637 CE"
    region: "Holland"
    poem: |
      It ended in a tavern in Haarlem, in February —
      an auction, no buyers, the prices falling
      like a stone down a well.
      Overnight, the tulip mania was over.
      I was in Amsterdam that week and saw the wreckage:
      bulbs that had sold for the price of a canal house
      now worthless as onions;
      fortunes made of paper promises
      evaporating by morning;
      the pamphleteers already turning it into a joke,
      a moral, a warning.
      A single Viceroy bulb for 2,500 florins —
      a craftsman's lifetime wages for a flower.
      Then nothing. Then laughter, and lawsuits,
      and the courts refusing to enforce the contracts.
      The Dutch survived it — shrugged, moralized,
      went back to work.
      But the story stuck: the first great market bubble,
      the template for every one since.
      I kept a Semper Augustus bulb,
      the striped kind that started it all,
      and planted it in my garden.
      It blooms every spring, oblivious —
      which is more than can be said for the speculators.
    description: "Tulip prices collapse overnight in a Haarlem tavern — the first great market bubble bursts, and Holland laughs, moralizes, and moves on."
    status: "first draft"
    sha256: "c8df6a77574c8cfa6e91038348cab3552cb96494873ef5b524e0f00c9dbc29fd"
  - number: "2565"
    volume: 4
    title: "I Think, Therefore I Am"
    date: "1637 CE"
    region: "Holland"
    poem: |
      Descartes published it in Leiden — the Discourse on Method,
      in French, not Latin, so anyone could read it —
      and rebuilt philosophy from a single stone.
      I met him in Holland in those years:
      a soldier turned thinker, living quietly,
      dissecting, calculating, doubting everything
      until only one thing could not be doubted —
      that he was doubting.
      Cogito, ergo sum. I think, therefore I am.
      From that one certain point he rebuilt the world:
      God, the soul, the material universe
      as a machine of moving parts.
      It was the charter of the modern mind —
      reason as the foundation, method as the path,
      everything else up for questioning.
      The Church banned it. Europe devoured it.
      I walked with him once along a canal,
      and he talked of animals as clockwork
      and the heart as a furnace.
      A strange, cold, brilliant man —
      who taught the world to think
      by first teaching it to doubt.
    description: "René Descartes publishes his Discourse on Method — rebuilding philosophy from a single certain thought: I think, therefore I am."
    status: "first draft"
    sha256: "5c573d224dd358036f4ac30714af582d15ee5f2f7b224e4e473d79af15dae774"
  - number: "2566"
    volume: 4
    title: "Shimabara Rises"
    date: "1637 CE"
    region: "Japan"
    poem: |
      They rose in the winter — Catholic peasants
      of Shimabara and Amakusa, ground down by taxes,
      led by a sixteen-year-old boy they called
      their messiah, Amakusa Shiro —
      and seized the old castle at Hara.
      I traveled through Kyushu that year
      and heard the stories: forty thousand rebels,
      banners with crosses and saints,
      holding the ruined fortress against the shogun's armies
      for three months of siege.
      The shogunate answered with everything —
      a hundred thousand troops, Dutch cannon
      firing from offshore, and when the castle fell,
      no quarter: every defender killed,
      the boy messiah beheaded, his head displayed at Nagasaki.
      After Shimabara came the final closing —
      the Portuguese expelled, the last crack sealed.
      Japan's Christians went underground for two centuries,
      the hidden faithful.
      I stood before the ruins of Hara Castle afterward,
      the crosses still painted on the broken walls,
      and grieved for peasants who asked only
      to pray and to eat — and were granted neither.
    description: "Catholic peasants rise at Shimabara behind a boy messiah — and the shogunate answers with an army, sealing Japan's closing."
    status: "first draft"
    sha256: "aaf5d7a2ad5aa55d65a7aea97e61bbcaae779ca97b8af58f598ebccc843a4883"
  - number: "2567"
    volume: 4
    title: "The Covenant"
    date: "1638 CE"
    region: "Scotland"
    poem: |
      They signed it in Greyfriars Kirkyard, in Edinburgh —
      the National Covenant, on a February day —
      thousands of Scots pressing forward to put their names
      to the parchment, some signing in their own blood.
      I was there, in the cold churchyard:
      ministers, nobles, burgesses, common folk —
      all swearing to defend the Presbyterian kirk
      against Charles's bishops and his prayer book,
      which they called popery in disguise.
      It was a revolution by subscription.
      The Covenanters raised an army, took the castles,
      and humbled the king in the Bishops' Wars —
      forcing him to call the Parliament
      that would destroy him.
      Scotland's covenant with God became England's crisis.
      I watched them sign — rank after rank,
      the parchment filling with names —
      and thought: this is what a nation looks like
      when it decides, together, to say no.
    description: "Scots sign the National Covenant in Greyfriars Kirkyard — some in blood — swearing to defend their Presbyterian church against the king."
    status: "first draft"
    sha256: "6e1693f6e69f29bcfd929fdfb0b34b3400ed3b1727ce06b9c4322f1e14e93fb3"
  - number: "2568"
    volume: 4
    title: "The Sultan Retakes Baghdad"
    date: "1638 CE"
    region: "Baghdad"
    poem: |
      Murad IV came himself — the young sultan,
      twenty-six, terrible in his energy —
      with the whole Ottoman host, and laid siege to Baghdad,
      the pearl the Persians had held for fifteen years.
      I traveled with the camp followers that autumn:
      the great siege works, the mines, the assaults,
      forty days of it, the city starving,
      until the walls broke and the Ottomans poured in.
      What followed was a slaughter — the garrison,
      and thousands of the city's people with them.
      Murad, they said, watched from his tent
      and did not stop it.
      Conquerors make examples; Baghdad was the example.
      But the empire's eastern door was shut again —
      Mesopotamia Ottoman, the Persian tide turned back.
      Murad would die in two years, burned out at twenty-seven,
      but Baghdad stayed Ottoman for centuries.
      I entered the city after the sack —
      the smoke, the silence, the Tigris running brown —
      and thought about the price of doors:
      some are bought with gold, and some with this.
    description: "Murad IV storms Baghdad back from Persia after a forty-day siege — restoring Ottoman power in the east at a terrible price."
    status: "first draft"
    sha256: "76344b1d97beb1b8b75342b90fc1f3c27af236ec1a7e6408ccd13f73fd72b90a"
  - number: "2569"
    volume: 4
    title: "Peace of Zuhab"
    date: "1639 CE"
    region: "Persia"
    poem: |
      They drew the line at Zuhab —
      the Ottomans and the Safavids, exhausted by a century
      of war over Mesopotamia and the Caucasus,
      signed the treaty and fixed the border.
      I was with a caravan crossing that country the next year,
      and the guards at the passes were already bored —
      a good sign. Baghdad to the sultan,
      Yerevan to the shah, the mountains between them
      belonging to whoever lived there.
      It was the first real border in the region's history —
      not a frontier of raids but a line on a map,
      and it held.
      It holds still, near enough: the line drawn at Zuhab
      is the ancestor of the borders there today.
      Four hundred years of diplomats have redrawn
      the map of the Middle East a hundred times,
      but that one line — drawn by two tired empires
      in 1639 — never moved.
      I crossed it on foot, unchallenged,
      and thought: peace is just a line
      that everyone agrees to pretend is real —
      until it becomes real.
    description: "The Ottomans and Safavids sign the Treaty of Zuhab — drawing a border that, near enough, still stands today."
    status: "first draft"
    sha256: "fce65aa4505af292549e920a4f378f4dc1bdc11566fc7090f203a33922732ee3"
  - number: "2570"
    volume: 4
    title: "The Portuguese Expelled"
    date: "1639 CE"
    region: "Japan"
    poem: |
      The edict gave them weeks —
      the Portuguese, a century in Japan,
      the black ship, the silver trade, the missionaries —
      all of it over, ships seized, priests hunted,
      the whole connection cut.
      I was in Nagasaki for the last sailing:
      the great carrack loading in silence,
      the merchants' faces gray,
      the Japanese officials watching from the shore
      with the new closed-country edicts
      fresh in their hands.
      Shimabara had decided it. The shogunate
      would risk no more Christian rebellion,
      no more foreign priests, no more divided loyalties.
      Only the Dutch would remain —
      Protestants, traders, no missionaries —
      on their little fan-shaped island at Deshima,
      a keyhole through which Japan would watch the world.
      A hundred years of contact ended in a season.
      I stood on the waterfront as the last sails
      dropped below the horizon,
      and Japan closed its doors behind them
      with a sound like a temple bell.
    description: "Japan expels the Portuguese and closes its doors to nearly all Europeans — a century of contact ends in a single season."
    status: "first draft"
    sha256: "8820610afa9ff71945b3d00b95b75461a41312f6face2558fe68ee37ea939ed5"
  - number: "2571"
    volume: 4
    title: "The Braganza Restoration"
    date: "1640 CE"
    region: "Portugal"
    poem: |
      Sixty years they'd waited — since Philip marched in,
      since the Spanish crown swallowed Portugal whole —
      and on a December morning the nobles struck:
      the Spanish vicereine arrested in her palace,
      the Duke of Braganza proclaimed John IV
      in the Terreiro do Paço.
      I was in Lisbon that week, and the joy
      was like a held breath released:
      bells ringing, the Spanish garrison surrendering,
      a nation remembering it was a nation.
      It would take twenty-eight years of war
      to make Spain accept it — twenty-eight years
      of border fighting, of English alliance,
      of Brazil's sugar paying for Portugal's freedom.
      But the moment was pure: December 1st, 1640,
      a small conspiracy in a palace,
      and sixty years of foreign rule ended
      before lunch.
      I drank with the conspirators that night —
      tired, exultant men who had bet their lives
      on a duke — and the wine tasted
      like independence.
    description: "Portuguese nobles rise and crown the Duke of Braganza — ending sixty years of Spanish rule in a single December morning."
    status: "first draft"
    sha256: "fae01c9e520e3eea1285a722415e8856a19ea0a4412bf1e77623aabebe443639"
  - number: "2572"
    volume: 4
    title: "The Long Parliament"
    date: "1640 CE"
    region: "England"
    poem: |
      Charles needed money for the Scottish war —
      the Covenanters had humiliated him —
      so he called Parliament, the first in eleven years,
      and got more than he bargained for.
      I sat in the gallery that November:
      Pym, Hampden, the whole opposition,
      elected and furious, and they went to work —
      Strafford attainted and executed,
      Laud imprisoned, the Star Chamber abolished,
      ship money declared illegal,
      a law that Parliament could not be dissolved
      without its own consent.
      It would sit for twenty years — the Long Parliament —
      through civil war, through the king's execution,
      through Cromwell's rule, till Cromwell himself
      drove it out with soldiers.
      But that first session was the hinge:
      the moment England's Parliament stopped being
      the king's instrument and became his master.
      I watched Charles watch it happen,
      pale on his throne, and I knew —
      as he must have known —
      that he had summoned his own destruction.
    description: "Charles I summons the Parliament that will sit for twenty years — and destroy him; England's Parliament stops being the king's instrument."
    status: "first draft"
    sha256: "b0ff6080e3bef63f9fb37851b18a532be2ce75cecd5da5cff0c454f67eaca3ff"
  - number: "2573"
    volume: 4
    title: "Sugar and Chains"
    date: "1640 CE"
    region: "Barbados"
    poem: |
      The planters made the switch — from tobacco
      and cotton to sugar, the white gold —
      and Barbados was never the same.
      I walked those fields in the years after:
      the cane standing ten feet tall,
      the mills grinding day and night,
      the boiling houses reeking of molasses,
      and the labor — the endless, killing labor —
      done by enslaved Africans, imported by the thousand,
      worked to death and replaced.
      Sugar made Barbados the richest spot in the English world —
      and the cruelest.
      The island's hunger for enslaved labor
      reshaped the whole Atlantic: the slave ships,
      the triangular trade, the fortunes of Bristol and Liverpool,
      all feeding the mills' appetite.
      A sweet tooth, and an ocean of chains.
      I stood in a boiling house, the heat like a furnace,
      the enslaved men feeding the rollers,
      and tasted sugar afterward with ashes in my mouth.
      The traveler counts coins, the era note says.
      I counted these coins, and they were black and bitter.
    description: "Barbados planters switch to sugar — and the island's hunger for enslaved labor begins to reshape the Atlantic in chains."
    status: "first draft"
    sha256: "df1eed93356993df5c60ac3d343080604f4374b5c470aca61bf72b9e68ff9c6c"
  - number: "2574"
    volume: 4
    title: "The Irish Rebellion"
    date: "1641 CE"
    region: "Ireland"
    poem: |
      It began in Ulster in October —
      the Irish Catholics rising against the English settlers,
      seizing the plantations, and the bloodshed
      ran beyond anyone's control.
      I traveled through Ulster that winter
      and saw what civil war looks like up close:
      settlers murdered in their beds,
      Irish hanged without trial,
      both sides' pamphleteers multiplying the dead
      by ten to feed the fury in London.
      The stories — true, false, uncheckable —
      poisoned English politics past saving:
      Parliament would trust no army to a king
      who might use it against them,
      having heard what "popish" armies did in Ireland.
      The rebellion became the excuse
      for everything that followed.
      Eight years of war in Ireland followed —
      and then Cromwell.
      I left Ulster in the spring,
      the smoke still on the horizon,
      and understood: some fires are lit
      to warm a cause, and burn the house down instead.
    description: "Irish Catholics rise against English settlers in Ulster — and the bloodshed poisons English politics past saving."
    status: "first draft"
    sha256: "2e85f1b64d5caa1ae3a550f1dee3e9a7455da13559b790d29641d53e668498ce"
  - number: "2575"
    volume: 4
    title: "Edgehill"
    date: "1642 CE"
    region: "England"
    poem: |
      They met on a Sunday in October —
      king and Parliament, on the field at Edgehill,
      the first great battle of the English Civil War.
      I watched from the ridge as the armies formed:
      the king's cavaliers in their shining armor,
      Parliament's men raw and earnest,
      both sides praying to the same God
      for opposite victories.
      Prince Rupert's cavalry swept all before it —
      then chased the baggage and left the field,
      as cavaliers do.
      The king's infantry held; Parliament's held;
      by dusk both armies stood bleeding
      where they'd started, neither beaten,
      neither victorious.
      An indecisive battle — and therefore the worst kind,
      because it meant the war would go on.
      I walked the field at evening, among the wounded,
      and heard men on both sides calling for water
      in the same English voices.
      One nation, one God, one field —
      and no way back to peace.
    description: "King and Parliament meet in battle at Edgehill — an indecisive Sunday slaughter that means the English Civil War will go on."
    status: "first draft"
    sha256: "3b4ad72f18adfbefcce7b6546a2b515729eefafebbf6bfaf572238bbc105ad3e"
  - number: "2576"
    volume: 4
    title: "The Night Watch"
    date: "1642 CE"
    region: "Amsterdam"
    poem: |
      Rembrandt unveiled it — the great company portrait,
      Captain Cocq's militia marching out:
      fifteen feet wide, all motion and torchlight,
      a girl with a chicken at her hip,
      a standard-bearer unfurling the colors,
      a dog barking at the drummer's sticks.
      I stood before it in the Kloveniersdoelen
      with the militiamen themselves, arguing:
      not a stiff row of faces but a moment caught —
      the company pouring out of the shadows,
      muskets and pikes and banners,
      Rembrandt's light falling like a blessing
      on the chaos.
      They'd paid a hundred guilders each
      to be in it, and some complained
      their faces were half hidden.
      Rembrandt didn't care. He'd painted
      not a portrait but an event —
      Amsterdam itself, marching.
      It hung in the town hall, then the Rijksmuseum,
      growing darker and more famous with the years.
      I go back to it in my mind whenever I need
      to remember what genius looks like:
      a militia company, stepping out of the dark,
      into the light, forever.
    description: "Rembrandt unveils his great company portrait — the Night Watch, all motion and torchlight, Amsterdam itself marching out of the dark."
    status: "first draft"
    sha256: "991bd662e0b2e2f722e1ec77bdbd2e2a9a66bde46829be9957b26b92b0bebcac"
  - number: "2577"
    volume: 4
    title: "Tasman's Voyage"
    date: "1642 CE"
    region: "The Pacific"
    poem: |
      Abel Tasman sailed for the VOC —
      south from Batavia, into the empty ocean,
      looking for the great southern continent
      the maps insisted was there.
      I was not aboard — but I traced his track later,
      port by port:
      first Van Diemen's Land, Tasmania,
      claimed for Holland in a storm;
      then the west coast of New Zealand —
      where the Maori met his boats with war canoes
      and Tasman, wisely or not, sailed on.
      The first European eyes on those shores.
      He missed Australia's east coast entirely,
      sailed around it without knowing,
      and came home to be scolded for finding nothing profitable.
      Nothing profitable! Only Tasmania,
      only New Zealand — two lands that would outlast
      every spice cargo the VOC ever carried.
      I laughed when I read his instructions afterward:
      find the continent, find the gold.
      He found the future instead,
      and was blamed for it.
    description: "Abel Tasman sights Tasmania and New Zealand — the first European eyes on those shores, finding the future and being blamed for it."
    status: "first draft"
    sha256: "d944c05ee62ea57d4eadfaaabae07981bd68f14f0a847cca02b3c12c0c3196e9"
  - number: "2578"
    volume: 4
    title: "The Old Man Dies, the Boy Is Born"
    date: "1642 CE"
    region: "Italy and England"
    poem: |
      Galileo died in January at Arcetri —
      blind, under house arrest, seventy-seven —
      the old man who had seen the moons of Jupiter
      closing his eyes at last.
      That Christmas, in a farmhouse in Lincolnshire,
      a premature baby was born —
      so small they said he could fit in a quart pot —
      Isaac Newton, fatherless, unpromising,
      unlikely to live the week.
      I stood at both ends of that year, in my fashion:
      at the villa where the Inquisition's prisoner
      was buried quietly, and at the manor
      where the widow held her tiny son
      and prayed he'd survive.
      The old astronomy died with Galileo.
      The new physics was born with Newton —
      in the same turning of the year,
      as if the universe had arranged the handoff.
      One man forced to kneel for saying the Earth moves;
      another, born as he died, who would prove
      exactly how it moves, and why.
      1642: the baton passed in the dark.
    description: "Galileo dies blind at Arcetri in January; that Christmas, Isaac Newton is born in Lincolnshire — the baton passed in the dark."
    status: "first draft"
    sha256: "52263be1de2f4183da1754491867e731655ee3b4c95589e1fd30304dfe24bb7d"
  - number: "2579"
    volume: 4
    title: "Rocroi"
    date: "1643 CE"
    region: "France"
    poem: |
      The Duke of Enghien was twenty-one —
      the future Great Condé —
      and at Rocroi he did what no one had done in a century:
      he broke the Spanish infantry.
      I watched from the French lines as the tercios
      stood in their great squares, pikes bristling,
      the finest foot soldiers in Europe —
      and Condé's cavalry charged them, broke,
      rallied, charged again, while his guns
      pounded the squares to ruin.
      By evening the Spanish army was destroyed —
      eight thousand dead, the tercios' legend dead with them.
      A century of Spanish battlefield supremacy,
      from Pavia to this field, ended in a day.
      Spain would remain a great power,
      but never again the terror of the battlefield.
      France had a new hero, twenty-one years old,
      and Europe had a new lesson:
      no supremacy lasts forever —
      not even one that lasted a hundred years.
    description: "The twenty-one-year-old Duke of Enghien shatters Spain's famed infantry at Rocroi — ending a century of Spanish battlefield supremacy in a day."
    status: "first draft"
    sha256: "c858d9f7b8e596bc00a6e26c8132a04da90d85cb604f69393c5d7826faf76525"
  - number: "2580"
    volume: 4
    title: "The Sun King, Aged Four"
    date: "1643 CE"
    region: "France"
    poem: |
      Louis XIII died in May, and his son —
      four years old, a child in a lace collar —
      became Louis XIV, with his mother Anne as regent
      and Mazarin holding the real reins.
      I saw the boy king carried into Notre-Dame
      for the coronation rites: small, solemn,
      utterly unaware that he would rule France
      for seventy-two years — the longest reign
      in European history.
      The Fronde was coming — the nobles' revolt,
      the humiliations that would teach him
      never to trust Paris, never to share power —
      and then the Sun King: Versailles,
      the arts, the wars, the glory and the ruin.
      But in 1643 he was four, and the crown
      was bigger than his head.
      I watched the procession pass,
      the child waving because he'd been told to,
      and thought: here is the future of France,
      in short trousers, not yet able to read
      the history he is about to make.
    description: "Four-year-old Louis XIV inherits the French throne — the child in the lace collar who will rule for seventy-two years."
    status: "first draft"
    sha256: "f22632f693ca29f66106f9e5aa47c22a4488fa0e00180c592da1dee54888efd3"
  - number: "2581"
    volume: 4
    title: "The Ming Falls"
    date: "1644 CE"
    region: "Beijing"
    poem: |
      The rebels took Beijing in April —
      Li Zicheng's armies through the gates,
      the ministers fleeing or hanging themselves —
      and the last Ming emperor, Chongzhen,
      climbed Coal Hill behind the palace
      and hanged himself from a tree,
      leaving a note blaming his officials.
      I was in the city in those terrible days:
      the looting, the fires, the great dynasty
      ending not with a battle but with a rope
      on a hill.
      And then — the greater shock —
      the Ming general at the Wall opened the gates
      to the Manchus, to help against the rebels,
      and the Qing rode through:
      eight banners, the shaved heads and queues,
      into the capital of China.
      Two hundred and seventy-six years of Ming —
      ended in a month.
      I stood on Coal Hill afterward,
      looking down at the palace roofs,
      and watched the Manchu banners go up
      over the Forbidden City.
      The mandate had passed.
      Heaven had chosen new tenants.
    description: "Rebels take Beijing, the last Ming emperor hangs himself on Coal Hill — and the Manchu Qing ride through the opened gates."
    status: "first draft"
    sha256: "254eb77d5df7b327f1b513a77ac9c5e8a77c9bf7d22ec97565ec6d9ca563c6e5"
  - number: "2582"
    volume: 4
    title: "Areopagitica"
    date: "1644 CE"
    region: "England"
    poem: |
      Milton wrote it in a fury — Areopagitica,
      his speech for the liberty of unlicensed printing —
      aimed at Parliament, his own side,
      which had replaced the king's censors with its own.
      I read it hot off the press in London:
      "Give me the liberty to know, to utter,
      and to argue freely according to conscience,
      above all liberties" —
      and the great metaphor, books as living things:
      who kills a man kills a reasonable creature,
      but he who destroys a good book
      kills reason itself.
      Parliament ignored it. The licensing continued.
      Milton lost the argument and won the centuries —
      every defense of a free press since
      is a footnote to Areopagitica.
      I keep my copy beside my Bible.
      It is the angriest, most beautiful thing
      ever written about the right to be wrong in print —
      by a blind man, twenty years before his blindness,
      who saw further than all of them.
    description: "John Milton publishes his thundering defense of a free press — Parliament ignores it, and the centuries adopt it."
    status: "first draft"
    sha256: "b754c521069d351e510fc71d92dba9eb50026095daf135f6eef3cc1de5500459"
  - number: "2583"
    volume: 4
    title: "Naseby"
    date: "1645 CE"
    region: "England"
    poem: |
      Cromwell's New Model Army did it at Naseby —
      the decisive battle, the king's army destroyed
      in a summer afternoon in Northamptonshire.
      I watched from a hillside as it unfolded:
      the royalist cavalry charging as always,
      Rupert sweeping the field —
      and then Cromwell's Ironsides, disciplined,
      godly, holding their formation,
      rolling up the king's infantry like a carpet.
      By evening Charles had lost his guns,
      his baggage, his infantry —
      and his private letters, captured in the baggage train,
      published to prove his double-dealing to the world.
      The war wasn't over, but it was decided.
      The New Model Army — paid, drilled, promoted by merit —
      had beaten the cavaliers at their own game.
      I walked the field at dusk, past the abandoned guns,
      and thought: the future belongs to the disciplined,
      not the dashing.
      England had just proved it.
    description: "Cromwell's New Model Army destroys the king's forces at Naseby — the decisive battle; the future belongs to the disciplined, not the dashing."
    status: "first draft"
    sha256: "d41b665388e6177b7f9f76141087b392d4e4a37e234d6e67cf06ad141a89203d"
  - number: "2584"
    volume: 4
    title: "Milton's Poems"
    date: "1645 CE"
    region: "England"
    poem: |
      He published them himself — Poems of Mr. John Milton,
      his first book, at thirty-six —
      and announced, quietly, a great voice.
      I bought a copy from the printer's shop:
      L'Allegro and Il Penseroso, the twin moods —
      the cheerful man, the thoughtful man —
      Lycidas, the elegy for a drowned friend,
      the Nativity Ode, written at twenty-one,
      Comus, the masque.
      The learning in it was staggering —
      Latin, Greek, Italian, Hebrew behind every line —
      but the music was what caught me:
      a young man writing as if the English language
      were an instrument he'd been born holding.
      No one knew Paradise Lost was coming —
      twenty years off, blindness, the epic.
      But the promise was all here, in this slim volume:
      the voice, the ambition, the nerve.
      I read Lycidas aloud that winter,
      to an empty room, and the room
      didn't feel empty afterward.
    description: "John Milton publishes his first book of poems at thirty-six — L'Allegro, Il Penseroso, Lycidas: the promise of the epic to come."
    status: "first draft"
    sha256: "1f9d2bfe49eb806d6a55509454665f30b6f9181970efd546a8a2b65e91a8f6b8"
  - number: "2585"
    volume: 4
    title: "The King Surrenders"
    date: "1646 CE"
    region: "England"
    poem: |
      He gave himself up to the Scots —
      Charles, beaten at Naseby, his cause lost,
      riding into the Scottish camp at Newark
      in disguise, hoping to play his enemies
      against each other.
      I heard the story from a Scottish officer afterward:
      the king arrived expecting to negotiate as a king,
      and found he was a prisoner with good manners.
      The Scots kept him for nine months,
      then sold him to Parliament for £400,000 —
      the back pay of their army, the king
      thrown in like a bonus.
      It was the coldest transaction of the war:
      a king, priced and delivered.
      Charles kept scheming — secret treaties,
      promises to everyone, loyalty to none —
      and every scheme made his position worse.
      He thought he was playing chess.
      He was the chess piece.
      I watched the handover from a distance —
      soldiers, ledgers, a king changing hands —
      and thought: this is what happens
      when majesty becomes merchandise.
    description: "Charles I surrenders to the Scots — who keep him nine months, then sell him to Parliament for £400,000: a king priced and delivered."
    status: "first draft"
    sha256: "a8bcdef53532c919bca72d0b1e8bc13efb2660a56da0634d3764042a660b1ba4"
  - number: "2586"
    volume: 4
    title: "The Levellers' Agreement"
    date: "1647 CE"
    region: "England"
    poem: |
      The soldiers wrote it — the Agreement of the People,
      drawn up in the army's debates at Putney:
      votes for all men, not just property-holders;
      a written constitution; Parliament elected fairly;
      no one above the law, not even the king.
      I sat in on the Putney debates, in the church:
      Rainsborough, the Leveller, answering Ireton,
      Cromwell's son-in-law, with the words
      that still ring —
      the poorest he that is in England hath a life to live
      as the greatest he.
      It was democracy, raw and plain,
      proposed by soldiers in 1647 —
      a century and a half before the French Revolution,
      two centuries before it happened in England.
      Cromwell crushed it. The grandees won.
      The Agreement was never adopted.
      But the words survived — Rainsborough's words —
      and every democratic movement since
      has spoken in their echo.
      I copied them into my journal that night,
      in the church, by candlelight,
      and I have never underlined anything so hard.
    description: "Radical soldiers demand the Agreement of the People — votes for all men, a written constitution; Cromwell crushes it, but the words survive."
    status: "first draft"
    sha256: "68682f85c257680c2490fb4c4d50e545b8b2dd72f241a227cdcee4863adb7f8d"
  - number: "2587"
    volume: 4
    title: "Westphalia"
    date: "1648 CE"
    region: "Germany"
    poem: |
      They signed it in two towns — Münster and Osnabrück —
      after five years of talking, while the war
      went on around them:
      the Peace of Westphalia, ending the Thirty Years' War.
      I traveled between the two congresses that year:
      the greatest diplomatic gathering Europe had seen —
      a hundred delegations, every prince and power,
      arguing over every village and bishopric
      while the ink dried on the map of the modern world.
      Eight million dead. Germany halved in places.
      The treaties redrew the map: France gained,
      Sweden gained, the Dutch and Swiss recognized as independent,
      each prince sovereign in his own land —
      cuius regio, eius religio, and an end to the wars of faith.
      It was the birth of the state system —
      sovereign states, borders, diplomacy —
      the world we still live in.
      I watched the signings, town after town,
      and thought of Magdeburg, of Lützen, of the White Mountain —
      eight million ghosts, looking on
      as the diplomats divided up the peace.
    description: "The Peace of Westphalia ends the Thirty Years' War — eight million dead, and the birth of the modern state system from the ashes."
    status: "first draft"
    sha256: "74be6af3f1aceacfe571063c9d7ea1ee1914202dfe69f24423adef5fec0f49c6"
  - number: "2588"
    volume: 4
    title: "Khmelnytsky Rises"
    date: "1648 CE"
    region: "Ukraine"
    poem: |
      Bohdan Khmelnytsky raised the Cossacks —
      against the Polish lords who'd taxed and scorned them,
      against the Jesuits, against the whole Polish order
      in Ukraine — and the steppe caught fire.
      I rode with a merchant caravan through Ukraine that year
      and saw the rising spread like a grass fire:
      the Cossack host, the Tatar allies,
      the Polish armies broken at Zhovti Vody,
      at Korsun — the Commonwealth's finest
      destroyed in weeks.
      What followed was the Deluge's first wave —
      and a horror for Ukraine's Jews,
      caught between the armies, massacred by the thousands
      in the worst pogroms Europe had seen.
      Khmelnytsky would turn to Moscow for protection —
      the Pereyaslav agreement —
      and Ukraine would pass from Polish hands
      to Russian, the fateful step.
      I stood on the steppe that autumn,
      watching the smoke of burned manors on the horizon,
      and felt the ground shifting under Eastern Europe —
      a new power rising in the east,
      on Cossack horses.
    description: "Bohdan Khmelnytsky's Cossacks rise against Polish rule — the steppe catches fire, and Ukraine's fateful turn toward Moscow begins."
    status: "first draft"
    sha256: "1ce8269ec5cd1b40c413348308402669614c5a04a044f0caa08153b23651d8e0"
  - number: "2589"
    volume: 4
    title: "Around the Frozen Cape"
    date: "1648 CE"
    region: "Siberia"
    poem: |
      Semyon Dezhnev did it — sailed from the Kolyma
      around the eastern tip of Asia,
      through the strait that would be named for Bering
      eighty years later, proving Asia was not joined
      to America.
      I met old fur men in Yakutsk who'd heard the tale:
      seven ships leaving, four lost,
      Dezhnev's own vessel wrecked south of the strait,
      the survivors walking the Arctic coast,
      most dying, a handful reaching the Anadyr —
      and the report filed away in Yakutsk,
      forgotten for nearly a century.
      Europe never heard of it.
      Bering got the strait, the glory, the name —
      for discovering what Dezhnev had already found.
      It galls me still. The man sailed wooden koches
      through Arctic ice, around the top of the world,
      and his own government lost the paperwork.
      I raise a glass, when I'm in those parts,
      to Semyon Dezhnev —
      the discoverer history forgot,
      because history misfiled him.
    description: "Semyon Dezhnev sails around the eastern tip of Asia — proving it is not joined to America, in a feat Europe forgets for a century."
    status: "first draft"
    sha256: "034188bba23467147b753f45986d44d641d789d87f0f672f7d67de896ecca2a3"
  - number: "2590"
    volume: 4
    title: "The King Loses His Head"
    date: "1649 CE"
    region: "London"
    poem: |
      January 30th, outside Whitehall —
      on a scaffold hung with black,
      Charles I, king of England,
      laid his head on the block.
      I was in the crowd, close enough to see:
      he wore an extra shirt, so the cold
      wouldn't make him shiver and seem afraid.
      He forgave the executioner.
      One blow — the masked headsman held up the head,
      and the crowd groaned, a sound, they said,
      like nothing heard before.
      A king, tried by his subjects,
      found guilty, and executed —
      in the name of the people, by an act of Parliament.
      No one in Europe had done such a thing.
      The other kings heard the news in horror;
      the poets heard it in awe.
      England became a republic that afternoon —
      the Commonwealth, Cromwell rising.
      I walked home through the silent streets,
      the extra shirt, the single blow,
      the groan of the crowd ringing in my ears.
      The world had changed its mind about kings,
      and there was no changing it back.
    description: "Charles I is beheaded outside Whitehall — a king tried by his subjects and executed; England becomes a republic, and the world changes its mind about kings."
    status: "first draft"
    sha256: "2975ae41eb0c07d7df0a61ae307d093b2e02eb7daa41ea2187f5e4b3eb4cd04c"
  - number: "2591"
    volume: 4
    title: "Dunbar"
    date: "1650 CE"
    region: "Scotland"
    poem: |
      Cromwell did it at Dunbar — outnumbered,
      sick, trapped between the Scots army
      and the sea, his men starving —
      and then the Scots came down from the hill,
      and Cromwell struck.
      September 3rd, in the rain and the dark:
      the New Model Army smashed the Covenanters
      in a morning — three thousand dead,
      ten thousand taken, the Scottish cause broken
      at a stroke.
      I walked that battlefield afterward:
      the rain washing the blood into the soil,
      the prisoners herded south, many dying on the march.
      Cromwell called it a crowning mercy —
      his phrase, and a chilling one.
      Scotland would fight on — Worcester next year,
      the boy Charles II crowned at Scone —
      but Dunbar decided it.
      The republic's northern border was secured
      by the most unlikely victory of the war:
      a sick army, a desperate general,
      and a dawn attack in the rain.
    description: "Cromwell crushes the Scottish army at Dunbar — outnumbered, sick, and trapped, then victorious by a dawn attack in the rain."
    status: "first draft"
    sha256: "303e8c923265686072032df5178684be83df860651901432bca3b4a5fdc6ca1c"
  - number: "2592"
    volume: 4
    title: "The Tenth Muse"
    date: "1650 CE"
    region: "Massachusetts"
    poem: |
      She was a mother of eight, in the wilderness —
      Anne Bradstreet, sailing to Massachusetts
      with Winthrop's fleet, burying children,
      keeping house on the frontier —
      and writing poems in the stolen hours.
      I visited her at Andover in the later years:
      a quiet woman, plain-dressed, who showed me
      her verses with an apology —
      not seeking publication, only the truth of her heart:
      her children, her husband, her God,
      her house burned down — "farewell, my pelf" —
      her faith tested and holding.
      Her brother-in-law carried the manuscript to London
      and published it without her full consent:
      The Tenth Muse Lately Sprung Up in America —
      the first book of verse from the New World,
      by a woman, from the wilderness.
      Eight children, a frontier, a book of poems.
      I think of her when men talk of what women couldn't do.
      She did it all — the living and the writing —
      and the muse she sprung was her own.
    description: "Anne Bradstreet, mother of eight on the Massachusetts frontier, publishes her poems — the first book of verse from the New World."
    status: "first draft"
    sha256: "93452649a971886128ee61274682c63a10542f90fa9708bd5648c529cd0f5965"
  - number: "2593"
    volume: 4
    title: "The Regent Dies"
    date: "1650 CE"
    region: "Beijing"
    poem: |
      Dorgon died on a hunting trip — the Manchu prince-regent,
      the man who'd led the Qing through the gates of Beijing,
      put the boy-emperor Shunzhi on the throne,
      and ruled China in his name for six years.
      I was in Beijing when the news came back from the hunt:
      a sudden death, out in the field,
      and the court holding its breath —
      because Dorgon's power had been absolute,
      and absolute power leaves a vacuum
      shaped exactly like a man.
      What followed was the settling:
      the young emperor's faction moving against Dorgon's,
      the regent's titles stripped posthumously,
      his allies purged, the balance of the court
      shifting behind the palace walls
      like pieces on a board no outsider could see.
      The Qing boy-emperor was twelve.
      The men around him were deciding
      what kind of dynasty this would be.
      I watched the funeral rites from a distance —
      the banners, the drums, the ritual grief —
      and thought: every new dynasty is a gamble,
      and the dice are still rolling.
    description: "Dorgon, the Manchu prince-regent who put the Qing boy-emperor on China's throne, dies on a hunting trip — and power shifts behind the palace walls."
    status: "first draft"
    sha256: "1e0b4e3a653387e418c9b1b27f5426077dc15910441b26fe03f77f8947a73ed6"
  - number: "2594"
    volume: 4
    title: "Cromwell's Shadow"
    date: "1650 CE"
    region: "Ireland"
    poem: |
      I walked behind that army into Drogheda's walls,
      heard the New Model drums where the Shannon calls.
      They took the town by storm, and the storm took all —
      old men, young men, stacked along the hall.
      The siege-fire writes in smoke what books won't say:
      that "God's Englishman" could kill and kneel and pray.
      Sixty years gone, and the fields still remember —
      the bitter roots dug up each Irish November.
    description: "The sieges of Drogheda and Wexford in 1650, where Cromwell's campaign turned a war into a wound Ireland carried for centuries."
    status: "first draft"
    sha256: "e2580eaa2a18bb05f49c9f6c1f1ef89fcaf8528bb731120469b0497d736598dd"
  - number: "2595"
    volume: 4
    title: "The Cook Writes It Down"
    date: "1651 CE"
    region: "France"
    poem: |
      La Varenne took his quill where the kitchen sweats,
      and wrote what every master cook forgets:
      butter made honest, sauces made light,
      the broth that turns a meal to appetite.
      I ate at tables where his recipes were read —
      the printed page became the daily bread.
      Before him, cooking died with every cook;
      after him, France opened a book.
    description: "François Pierre de La Varenne's Le Cuisinier françois made French cooking a written art, changing how the world eats."
    status: "first draft"
    sha256: "31727c4723e0f6e6368d4b19ce5e47c14552d5cb0a62a2f7ecda826fd7fca3c0"
  - number: "2596"
    volume: 4
    title: "The Navigation Acts"
    date: "1651 CE"
    region: "England"
    poem: |
      Only English keels may carry English goods —
      so read the Parliament's new rules.
      I watched the Dutch captains shake their heads
      and saw the first shots smoke above their beds.
      A paper law, a line of ink —
      enough to make two navies sink.
      Trade is war with sails instead of swords,
      and every barrel pays the lords.
    description: "Parliament's trade monopoly law that choked Dutch shipping and helped ignite three Anglo-Dutch wars."
    status: "first draft"
    sha256: "d98989aabec8dd50a9762dcbe5bee123f643fd464cb4c9628daa39cbe1c96b2e"
  - number: "2597"
    volume: 4
    title: "The First Coffeehouse"
    date: "1652 CE"
    region: "England"
    poem: |
      Pasqua Rosée boiled his bitter brew
      in a shed off Cornhill, and London queued.
      A penny bought a cup and all the news —
      the merchant's loss, the sailor's views,
      plots in the corner, pamphlets on the wall.
      I sat and listened through it all:
      the century thinking out loud at last,
      the future brewed from the burnt past.
    description: "London's first coffeehouse opened the age of the \"penny universities,\" where news, science, and revolution were argued over coffee."
    status: "first draft"
    sha256: "ad1dd40d064561b0ffa9f5c2b2ede5a586793420c1b464d83ddedbba311bf82a"
  - number: "2598"
    volume: 4
    title: "The First Dutch War"
    date: "1652 CE"
    region: "North Sea"
    poem: |
      I stood on deck when the broadsides began,
      English oak against the Dutchman's plan.
      They fought for flags dipped and trade denied —
      for who may sail where the herring glide.
      The smoke lay thick from Kent to the Texel sands;
      two merchant peoples killing with hired hands.
      Three wars would bloom from this first seed —
      the sea itself the field of greed.
    description: "England and the Dutch Republic fought the first of three naval wars over trade routes and naval pride."
    status: "first draft"
    sha256: "b0d3a685e0d382fec2bcd73aaebbbe0afa16eae5d336a14249866e4726342366"
  - number: "2599"
    volume: 4
    title: "The Taj Completed"
    date: "1653 CE"
    region: "India"
    poem: |
      Twenty years, twenty thousand hands,
      a love-song raised in marble on the sands.
      I walked the garden as the last stone set —
      the inlay flowers not finished yet.
      Shah Jahan came at dusk to stand and stare
      at Mumtaz sleeping in the moonlit air.
      Grief had learned the mason's trade;
      the most beautiful thing grief ever made.
    description: "The Taj Mahal was completed at Agra — a grieving emperor's monument that became the world's most famous building."
    status: "first draft"
    sha256: "84163a7d56b2f416751d258226add3f2da9f03937e251758b787be343a3eb4cc"
  - number: "2600"
    volume: 4
    title: "The Lord Protector"
    date: "1653 CE"
    region: "England"
    poem: |
      He walked into the House with musketeers
      and ended twenty years of hopes and fears.
      "No crown," he said — but took the sword,
      the palace, and the thankless lord.
      I watched him rule by army's might,
      a king who'd murdered kings outright.
      The Protector's chair was cold and bare;
      no son could sit for long in there.
    description: "Oliver Cromwell dissolved Parliament and ruled as Lord Protector — a republic with a king in everything but name."
    status: "first draft"
    sha256: "6215941696f10df3c19a94c63aa065596a022c9cde50453d002c78098887eaaa"
  - number: "2601"
    volume: 4
    title: "The Queen Abdicates"
    date: "1654 CE"
    region: "Sweden"
    poem: |
      She laid the crown on the Uppsala floor,
      walked out the palace, shut the door.
      Christina — scholar, queen, and flame —
      rode south to Rome to change her name.
      I watched her cross the Alps that fall,
      a sovereign answering a different call.
      She traded scepters for the Mass,
      and Europe's gossip let her pass.
    description: "Queen Christina of Sweden gave up her throne, converted to Catholicism, and became Europe's most famous exile."
    status: "first draft"
    sha256: "241c52d6d234d01c4796840ab587d1af0a1592668491fc8a2c55e45843b7da76"
  - number: "2602"
    volume: 4
    title: "Jamaica Taken"
    date: "1655 CE"
    region: "Caribbean"
    poem: |
      The English fleet came soft at dawn,
      and Spanish Jamaica was soon gone.
      I walked the cane-fields years from then,
      saw sugar worked by shackled men.
      An island taken for the crown's coffer
      became the engine that made planters richer —
      and every hogshead shipped to sea
      was sweetened with somebody's misery.
    description: "England seized Jamaica from Spain, turning it into the sugar-and-slavery powerhouse of the British Caribbean."
    status: "first draft"
    sha256: "d0984ae37b2079a844a125753bb2654a8f3f7cb4f65891249ebb1ed30743117e"
  - number: "2603"
    volume: 4
    title: "The Clock That Keeps Time"
    date: "1656 CE"
    region: "Netherlands"
    poem: |
      Huygens hung a weight on a swinging line
      and taught the hours to keep true time.
      I watched the pendulum's patient sweep
      while old clocks stumbled in their sleep.
      For sailors lost on empty seas,
      true minutes meant the longitudes' keys.
      A tick, a tock — the world grew small;
      the seconds marched, and conquered all.
    description: "Christiaan Huygens patented the pendulum clock — the first timekeeper accurate enough for science and navigation."
    status: "first draft"
    sha256: "a9c394d77592cb0bd8cf08add608f3cceb60ce8141ff255818d27e2c2396de86"
  - number: "2604"
    volume: 4
    title: "The Provincial Letters"
    date: "1656 CE"
    region: "France"
    poem: |
      Pascal took up his pen to fight,
      and made the Jesuits squirm all night.
      I read each letter hot off the press —
      wit turned to theological finesse.
      All Paris laughed at holy fraud,
      and monks were mocked in print abroad.
      A genius with a joker's art
      stuck reason's dagger in the heart.
    description: "Blaise Pascal's witty Provincial Letters mocked Jesuit casuistry and made theology the talk of Paris."
    status: "first draft"
    sha256: "c0d07d7415d7d349c76ffb04eac4f619565fbd006cea7cb1cc42e03e0a040bad"
  - number: "2605"
    volume: 4
    title: "The Great Fire of Meireki"
    date: "1657 CE"
    region: "Japan"
    poem: |
      The wind took Edo in a single night,
      a hundred thousand souls in flight.
      I ran with them through streets of flame
      where wooden houses fed the game.
      The shogun's city burned to bone —
      then rose in stone, in streets of stone,
      wider, straighter, built to last,
      a phoenix risen from the ash-cast.
    description: "Fire destroyed most of Edo (Tokyo), killing tens of thousands; the shogunate rebuilt it grander and better planned."
    status: "first draft"
    sha256: "216e434cac5b2ae5e9373f956506073a2d8dbce85444ab33ac9e1df424bdada0"
  - number: "2606"
    volume: 4
    title: "The Protector Dies"
    date: "1658 CE"
    region: "England"
    poem: |
      Fever took him on a stormy night,
      and London lost its iron might.
      His son, poor Richard, held the reins
      for months, then dropped them in the lanes.
      I watched the army eat its own —
      the republic melted like a stone
      left out in summer's heat to bake.
      The crown was coming back to take.
    description: "Cromwell's death and his son Richard's collapse ended England's republican experiment within months."
    status: "first draft"
    sha256: "981615baff8e24d01fe63019a29c6098748114b5c66d5cf6d8ce9558b82f76aa"
  - number: "2607"
    volume: 4
    title: "The Throne of Blood"
    date: "1658 CE"
    region: "India"
    poem: |
      Brother killed brother for the peacock throne,
      and Aurangzeb stood last alone.
      He locked his father in Agra's tower
      to watch the Taj through bars of power.
      I walked the fort where old Shah Jahan
      wept at the marble of his plan.
      An empire built on a father's chain —
      the Mughal crown was bought with pain.
    description: "Aurangzeb imprisoned Shah Jahan and seized the Mughal throne in a fratricidal war of succession."
    status: "first draft"
    sha256: "25f095c4712b807afdbea9fea16c2883cb3a9cb54ed69592f13a4a66641ae3fc"
  - number: "2608"
    volume: 4
    title: "The Pyrenees Peace"
    date: "1659 CE"
    region: "Europe"
    poem: |
      On an island in the river's flow,
      two kings made peace and let war go.
      Louis took the Spanish bride,
      and France stood tallest, far and wide.
      I watched the wedding train depart —
      a marriage sealing Europe's heart.
      Twenty years of war laid down;
      the Sun was rising on his crown.
    description: "The Treaty of the Pyrenees ended the Franco-Spanish War and made France Europe's dominant power."
    status: "first draft"
    sha256: "30af567bc717df4eb0bbed6284b2cbd4e6d42988589015528f2a6e21807ae7c4"
  - number: "2609"
    volume: 4
    title: "The King Comes Home"
    date: "1660 CE"
    region: "England"
    poem: |
      The crowds at Dover cheered him through,
      the bells rang out the old made new.
      Charles came home from exile's shore
      to open what the saints shut door:
      the theatres lit, the maypoles high,
      Christmas carols split the sky.
      I drank that May with all the rest —
      the Restoration at its best.
    description: "Charles II's return ended the republic — theatres reopened, Christmas returned, and the monarchy was restored."
    status: "first draft"
    sha256: "204a4650b696b3330d8f212dd85a475ca5e380c3933521c85fa29652ed4f7b7d"
  - number: "2610"
    volume: 4
    title: "The Painter of the Court Dies"
    date: "1660 CE"
    region: "Spain"
    poem: |
      Velázquez laid his brushes down
      in the quiet palace of the crown.
      Las Meninas kept his stare —
      the painter in the mirror there,
      the king and queen a ghostly pair,
      the dog asleep without a care.
      I stood before it, and it stood —
      arguing still, as great art should.
    description: "Diego Velázquez died in Madrid, leaving Las Meninas — a painting that still puzzles and delights every viewer."
    status: "first draft"
    sha256: "4ba2f0ef08985e7b241b167598678f3e19512d113e1dbf5fc26a3a96df9e6629"
  - number: "2611"
    volume: 4
    title: "The Sun Takes the Reins"
    date: "1661 CE"
    region: "France"
    poem: |
      Mazarin was dead, the boy was grown —
      Louis said, "I rule alone."
      No minister, no guiding hand,
      just the Sun King and the land.
      I watched the courtiers learn to bow
      to the young god they serve now.
      Seventy years of "I am the state" —
      France shone bright, and burned, and ate.
    description: "Louis XIV seized personal rule after Mazarin's death, beginning the long reign of the Sun King."
    status: "first draft"
    sha256: "c11570e4e917c08c47a6fb254fb3bce556631ab9e42609d3ec2fb8e0d20757fd"
  - number: "2612"
    volume: 4
    title: "Paper Money"
    date: "1661 CE"
    region: "Sweden"
    poem: |
      In Stockholm town a banker found
      that paper could be passed around.
      No heavy coins to drag and clink —
      just printed promise, signed in ink.
      I held one in my wondering hand:
      wealth you couldn't understand,
      a kingdom's word on a paper scrap.
      The future folded in the map.
    description: "Stockholm's bank issued Europe's first banknotes — money became a printed promise rather than metal."
    status: "first draft"
    sha256: "a2754855b7f198efd0dd5b1c4e093e3cfb0636bfb85b381c7a687dd9a6739e5a"
  - number: "2613"
    volume: 4
    title: "The Royal Society"
    date: "1662 CE"
    region: "England"
    poem: |
      The king gave charter, seal, and hall
      to men who'd test and measure all.
      I watched them weigh the air and rain,
      pump out the vacuum, count the vein.
      Wigs and frock coats, but minds set free —
      "Take nobody's word" their decree.
      The world's first club of curious men
      made knowledge public with the pen.
    description: "Charles II chartered the Royal Society, and experimental science became a public, shared enterprise."
    status: "first draft"
    sha256: "e3739d5dbf4a2e5411977f4638a299da158f97f33be869e5be744d46d5e0832e"
  - number: "2614"
    volume: 4
    title: "Pascal's Last Wager"
    date: "1662 CE"
    region: "France"
    poem: |
      Thirty-nine years, and the light went out —
      the geometer, the saint, the doubt.
      He left his Pensées, scattered leaves,
      where reason argues and believes:
      bet on God, the wager cries,
      for infinite stakes and finite dies.
      I read him in the candle's gleam —
      a mind awake inside a dream.
    description: "Blaise Pascal died at thirty-nine, leaving the Pensées — fragments where reason argues for faith."
    status: "first draft"
    sha256: "4f3936d28c453b1d032318fc301096b8107db5fe14d776aa0e261da887aaaf4e"
  - number: "2615"
    volume: 4
    title: "The Sugar Code"
    date: "1663 CE"
    region: "Caribbean"
    poem: |
      In Barbados they wrote it plain:
      a black man's bondage would remain —
      for life, and for his children's lives,
      property, not men with wives.
      I read the code with a sickened eye,
      the law that taught the world the lie:
      that some are born to be unfree,
      and sugar sweetens slavery.
    description: "Barbados's slave code declared enslaved Africans property for life — the legal blueprint for plantation slavery across the Americas."
    status: "first draft"
    sha256: "485e716eb45a5857f8b5ecbdd44147ca105f86963e5ec9a2124ae8c2037d7ea8"
  - number: "2616"
    volume: 4
    title: "New Amsterdam Falls"
    date: "1664 CE"
    region: "North America"
    poem: |
      Four English frigates in the bay,
      and Stuyvesant gave the town away.
      No shot was fired, no blood was shed —
      New Amsterdam was simply dead.
      They named it for the Duke of York,
      a village soon to be New York.
      I walked its wall street, small and new,
      not dreaming what the town would do.
    description: "England seized New Amsterdam bloodlessly and renamed it New York — a small port with an enormous future."
    status: "first draft"
    sha256: "bd905c52b0a397b3fe50b25e050a565d08eee84acbca22a94e444e34e93a5850"
  - number: "2617"
    volume: 4
    title: "The Plague Year"
    date: "1665 CE"
    region: "England"
    poem: |
      The red cross marked the stricken door,
      the dead-cart rumbled more and more.
      The rich fled west, the poor stayed home
      to watch the churchyards fill with loam.
      "Bring out your dead!" the night-bell tolled —
      I walked those streets, and I was told
      to keep my distance, hold my breath,
      and count the arithmetic of death.
    description: "Bubonic plague ravaged London in 1665, emptying the city and killing tens of thousands."
    status: "first draft"
    sha256: "5badd627822542dc01cd80946b5b30c80a8d674c99c12754ea9a2986e7dcb17e"
  - number: "2618"
    volume: 4
    title: "News in Print"
    date: "1665 CE"
    region: "England"
    poem: |
      The Gazette rolled off the press that fall,
      two pages answering the town's call:
      the court's decrees, the fleet's return,
      the plague's own numbers, stern and stern.
      I bought a copy for a coin or two —
      the first of millions coming through.
      Three hundred years and running still,
      the news goes on, for good or ill.
    description: "The London Gazette's first issue began England's oldest continuously printed newspaper."
    status: "first draft"
    sha256: "daf32ab27dc53da1cdb61d23ac03e18739224f7a29222c635c650083f9380ad4"
  - number: "2619"
    volume: 4
    title: "The World Under Glass"
    date: "1665 CE"
    region: "England"
    poem: |
      Hooke put a flea beneath his lens
      and drew it armored, huge, immense.
      I turned the pages, lost in wonder —
      a world of small, split wide asunder.
      The cork's small rooms he named the cell;
      the microscope had news to tell.
      A bestseller born of tiny things —
      the small world suddenly had wings.
    description: "Robert Hooke's Micrographia revealed the microscopic world in stunning detail — the microscope's first bestseller."
    status: "first draft"
    sha256: "4c643aec8e732c8603055c92b10814989b26fb6e2dc839a1dec451aefea07498"
  - number: "2620"
    volume: 4
    title: "The Great Fire"
    date: "1666 CE"
    region: "England"
    poem: |
      A baker's oven in Pudding Lane
      set half of London to the flame.
      Four days the fire ate street and spire,
      a city dying in the pyre.
      I stood on Southwark's bank and saw
      St. Paul's collapse in smoke and awe.
      Then London rose in brick and stone —
      a cleaner city from the bone.
    description: "The Great Fire of London destroyed most of the medieval city in four days; it was rebuilt in brick and stone."
    status: "first draft"
    sha256: "6edba7c69129b9698fb209e9f90f69635e84182a1d6bf7e7d865811940fdc051"
  - number: "2621"
    volume: 4
    title: "The Academy of Sciences"
    date: "1666 CE"
    region: "France"
    poem: |
      Colbert gathered scholars in the king's own name,
      gave them salaries, labs, and fame.
      I watched them chart the moons above,
      weigh the metals kings most love.
      French science wore a royal coat —
      the Sun King's money kept afloat
      the minds that mapped the age of reason.
      Knowledge had become the season.
    description: "Colbert founded the Paris Academy of Sciences, giving French scholars royal salaries and laboratories."
    status: "first draft"
    sha256: "69709f333fc2596deb9a4f7636a5faaa13762f2248931e1f85f226cbcbbea6a5"
  - number: "2622"
    volume: 4
    title: "The Builder in His Tower"
    date: "1666 CE"
    region: "India"
    poem: |
      Old Shah Jahan, in Agra's keep,
      watched the Taj through bars of sleep.
      His son had locked the builder-king
      to gaze upon his marble thing —
      the tomb across the river's bend,
      his love, his loss, his bitter end.
      I stood beside him, and he sighed:
      "Let me die looking." And he died.
    description: "Shah Jahan died imprisoned in Agra Fort, gazing across the river at the Taj Mahal he could never visit."
    status: "first draft"
    sha256: "e847e476e8a252315543deeec5045440984d9e707aa21830f07b3f33cda63822"
  - number: "2623"
    volume: 4
    title: "Paradise Lost"
    date: "1667 CE"
    region: "England"
    poem: |
      Blind, he dictated — line by line —
      Satan's defiance, Eve's decline.
      "Better to reign in Hell," the cry
      that made the fallen angel fly.
      I heard him speak the verses slow,
      his daughters writing what he'd know:
      the Fall, the garden, and the flame —
      and justified God's ways the same.
    description: "Blind John Milton published Paradise Lost — his epic of Satan, Adam, and the Fall, dictated from memory."
    status: "first draft"
    sha256: "035b533585c790f1dc93bf209d7c8516e001fee8d38b2027fde5f8bb17c3ac76"
  - number: "2624"
    volume: 4
    title: "The Raid on the Medway"
    date: "1667 CE"
    region: "Netherlands"
    poem: |
      Up the Thames the Dutchmen came,
      and put the English fleet to shame.
      They broke the chain, they burned the ships,
      they towed the Royal Charles by the hips.
      I watched from Rochester's shore that day —
      the boldest raid war ever saw at play.
      De Ruyter's guns sang through the mist:
      the republic's triumph, none could resist.
    description: "Dutch warships sailed up the Thames, burned English ships, and towed away the flagship — the republic's boldest naval triumph."
    status: "first draft"
    sha256: "8cfbc20086a8c827c7210043e4a539ef3419935733ae92e5cb4423a856a820f1"
  - number: "2625"
    volume: 4
    title: "Bombay Changes Hands"
    date: "1668 CE"
    region: "India"
    poem: |
      A dowry port, a swampy shore —
      Portugal's gift, and England's door.
      The Company took the seven isles,
      the mud, the monsoon, and the miles.
      I stood on docks that barely stood,
      and dreamed of what the merchants could:
      a megacity of towers and trade
      on the muddy ground the treaty made.
    description: "The East India Company took Bombay — a swampy Portuguese dowry port destined to become a megacity."
    status: "first draft"
    sha256: "cf3b6cafa27464a8690ff24c6b9785a376d4f87c5de4a1c7d157b1aac58eb809"
  - number: "2626"
    volume: 4
    title: "The Laureate"
    date: "1668 CE"
    region: "England"
    poem: |
      Dryden took the laurel and the wine,
      and made the Restoration stage shine.
      His tongue was sharp, his couplets true —
      he flayed the fools and praised the few.
      I sat in Drury Lane to hear
      the wits applaud, the gallants cheer.
      The sharpest tongue the age would find
      wore the crown of England's rhyming mind.
    description: "John Dryden became Poet Laureate, bringing his sharp satirical tongue to the Restoration stage."
    status: "first draft"
    sha256: "af21a92e0596be41a5cae3663108ff6372eea6dc6fa813c93f7c32257de5cf3d"
  - number: "2627"
    volume: 4
    title: "Rembrandt's Last Light"
    date: "1669 CE"
    region: "Netherlands"
    poem: |
      He died poor in Amsterdam that fall,
      painting himself against the wall.
      The late portraits — darker, freer, true —
      a face that age had battered through.
      I stood where he stood, brush in hand,
      a bankrupt master of the land.
      The market left him; the light stayed on.
      The man was gone; the gaze lived on.
    description: "Rembrandt died poor in Amsterdam, painting self-portraits to the very end — darker, truer, and freer than ever."
    status: "first draft"
    sha256: "663956338433dc3f6559195dca2a0b022c00d0e75a6c76099dc2fc35c24bb3a2"
  - number: "2628"
    volume: 4
    title: "Crete Falls"
    date: "1669 CE"
    region: "Mediterranean"
    poem: |
      Twenty-one years the siege held on,
      then Candia's walls were finally gone.
      The Ottomans took the Cretan shore;
      Venice's eastern empire was no more.
      I walked the breached and broken gate,
      the price of pride, the cost of fate.
      An empire measured in the sea
      drowned in the waves it used to be.
    description: "After a twenty-one-year siege, Candia fell to the Ottomans and Venice's eastern empire ended."
    status: "first draft"
    sha256: "6777442e870845aadfa5b1d8e7c039fd42cb03724a426c27dab72f1ac244efe0"
  - number: "2629"
    volume: 4
    title: "The Bay Company"
    date: "1670 CE"
    region: "North America"
    poem: |
      A charter signed, a frozen bay —
      the beaver trade was underway.
      From Hudson's ice to London's hat,
      the pelts flowed in, and that was that.
      I paddled north with the first brigade,
      through forests where the bargains made
      built an empire on a rodent's fur —
      the coldest commerce ever were.
    description: "The Hudson's Bay Company was chartered, and beaver pelts began flowing from frozen forests to London hats."
    status: "first draft"
    sha256: "a8b7af21d56fa25f422fa63156474d731706f4b626a761c292fad6310519880c"
  - number: "2630"
    volume: 4
    title: "The Secret Treaty"
    date: "1670 CE"
    region: "England"
    poem: |
      At Dover, in the candle's glow,
      Charles signed what none must know:
      turn Catholic for Louis's gold,
      a secret bought, a kingdom sold.
      I read the parchment years gone by —
      a king who'd wear another sky
      for Frenchmen's coins. The realm was priced;
      the crown itself was sacrificed.
    description: "Charles II secretly promised Louis XIV he would convert to Catholicism — in exchange for French gold."
    status: "first draft"
    sha256: "987661fa8a8c9c2462c027ea4afc82fe14be245d9975e65fc89704e6c975c979"
  - number: "2631"
    volume: 4
    title: "Morgan's Sack of Panama"
    date: "1671 CE"
    region: "Panama"
    poem: |
      Henry Morgan crossed the isthmus line,
      burned Panama, and took the mine.
      The silver flowed in mule-train rows;
      the city died where the jungle grows.
      I saw the smoke above the bay —
      piracy's grandest, cruelest day.
      A knight's reward for theft and flame:
      the crown called murder by his name.
    description: "The buccaneer Henry Morgan sacked and burned Panama City, hauling away its silver — piracy at its grandest and cruelest."
    status: "first draft"
    sha256: "a262be97993175b70046824f78bcaf13acf051f25abb11c99ada2caac3042f65"
  - number: "2632"
    volume: 4
    title: "The Disaster Year"
    date: "1672 CE"
    region: "Netherlands"
    poem: |
      France, England, bishops — all at once —
      invaded in the year's first months.
      The Hague mob dragged the de Witts down
      and murdered them in the market town.
      I saw the water-gates let through
      the floods that saved the Dutch — it's true:
      they drowned their land to keep it free.
      Despair became the victory.
    description: "Invaded on all sides, the Dutch flooded their own land to survive — while a Hague mob murdered the de Witt brothers."
    status: "first draft"
    sha256: "46a62952185f2fba6c39ef3b1c572c5bd2a04c429ba95d1a274f75bd231ab413"
  - number: "2633"
    volume: 4
    title: "Coffee Comes to Paris"
    date: "1672 CE"
    region: "France"
    poem: |
      An Armenian set his pots to steam,
      and Paris woke as from a dream.
      The tiny cups, the bitter brew,
      the talk that all the night ran through.
      I sat with wits and watched the tide —
      the whole city caffeinated wide.
      From London's lead to Paris' art,
      coffee had conquered every heart.
    description: "Paris got its first coffeehouse, and soon the whole city was arguing philosophy over tiny cups."
    status: "first draft"
    sha256: "6a790f218760e3f48489af2a7c82b1cc9af134d88175566f1f8baf183fe49b98"
  - number: "2634"
    volume: 4
    title: "Molière's Last Bow"
    date: "1673 CE"
    region: "France"
    poem: |
      He played the dying man that night —
      and dying was the part done right.
      On stage, mid-cough, the master fell;
      the Invalid rang his final bell.
      I was there when the curtain came —
      comedy's king went out in flame.
      They buried him at the edge of ground;
      the laugh he left still shakes the town.
    description: "Molière collapsed on stage during The Imaginary Invalid and died hours later — comedy's greatest actor exiting mid-performance."
    status: "first draft"
    sha256: "5c0e8c62b6a7844d0dfadabfe328c85142b4f72325df179794ec8b9ec992d632"
  - number: "2635"
    volume: 4
    title: "The Maratha Crowned"
    date: "1674 CE"
    region: "India"
    poem: |
      At Raigad fort, beneath the sun,
      Shivaji's coronation was done.
      Chhatrapati — the umbrella's shade —
      a Hindu kingdom newly made.
      I watched the drums, the sacred fire,
      the mountain kingdoms lift him higher.
      The Mughal giant felt the sting:
      a free man's crown, a people's king.
    description: "Shivaji was crowned Chhatrapati at Raigad, founding the Maratha kingdom that would humble the mighty Mughals."
    status: "first draft"
    sha256: "0d6a65cc902984e78ec1a1ee52f20b26fe32e4138672dd84d309dee36e6926a2"
  - number: "2636"
    volume: 4
    title: "The Star Observatory"
    date: "1675 CE"
    region: "England"
    poem: |
      On Greenwich hill they raised the dome,
      and made the turning sky their home.
      To find the longitude at sea,
      they mapped the stars for you and me.
      I climbed the hill on a frosty night
      and watched them chase the charted light.
      England's eye upon the sphere —
      the heavens measured, far and near.
    description: "Greenwich Observatory was founded to map the heavens and solve the puzzle of longitude at sea."
    status: "first draft"
    sha256: "c73e9740539170c3a0484cb56b82db11054ebefbab2d6bf03c834436c3966b33"
  - number: "2637"
    volume: 4
    title: "King Philip's War"
    date: "1675 CE"
    region: "North America"
    poem: |
      Metacom rose, the Wampanoag chief,
      and New England drowned in grief.
      A tenth of towns went up in flame;
      the frontier would not be the same.
      I walked the ashes, heard the cry
      of two worlds learning how to die.
      The desperate war, the broken land —
      the blood was on the white man's hand.
    description: "The Wampanoag sachem Metacom led a desperate uprising that burned New England and destroyed a tenth of its towns."
    status: "first draft"
    sha256: "d366cda53dfa10534709b67712c28d30938b6e35d5c0c2d5ac30931a908e6e78"
  - number: "2638"
    volume: 4
    title: "The Martyr on the Scaffold"
    date: "1675 CE"
    region: "India"
    poem: |
      In Delhi's square they raised the block
      for Tegh Bahadur — hear the clock.
      He died defending others' right
      to worship in their own true light.
      I stood among the silent crowd
      and heard no voice, though hearts were loud.
      The Sikhs remember to this day:
      the martyr showed the steel the way.
    description: "Guru Tegh Bahadur was beheaded in Delhi for defending the right to worship — a martyrdom the Sikhs never forgot."
    status: "first draft"
    sha256: "2c139a4be8f333c5fadd0196a84a2e741705f46a65246642f7b1fd27d061e572"
  - number: "2639"
    volume: 4
    title: "Vermeer's Quiet Rooms"
    date: "1675 CE"
    region: "Netherlands"
    poem: |
      He died young, poor, in Delft that year,
      leaving milkmaids, maps, light clear.
      A window's glow, a pearl's soft gleam —
      the quiet rooms of a painter's dream.
      I stepped inside his painted air
      and found the northern light still there.
      The world forgot him for a while;
      the light remembered, with a smile.
    description: "Vermeer died young and poor in Delft, leaving luminous interiors — milkmaids and map-rooms full of northern light."
    status: "first draft"
    sha256: "a612ae44dc90feafbef5dade3df82a2772c96699081d2ff5f03f8ba5e661afa6"
  - number: "2640"
    volume: 4
    title: "Bacon's Rebellion"
    date: "1676 CE"
    region: "North America"
    poem: |
      Bacon's mob burned Jamestown down —
      poor whites and blacks against the crown.
      One time they fought side by side,
      then the planters split them wide.
      I watched the torches light the town,
      the governor's men hunt rebels down.
      The lesson that the rich men learned:
      divide the poor, or get burned.
    description: "Bacon's rebels — poor whites and enslaved blacks fighting together — burned Jamestown before the planters crushed and divided them."
    status: "first draft"
    sha256: "20e428c63d01c256062fd89950b528ec3bf8ffcf4054023065dfe39931391c67"
  - number: "2641"
    volume: 4
    title: "Light Has a Speed"
    date: "1676 CE"
    region: "France"
    poem: |
      Rømer watched Io's faithful dance
      around great Jupiter's expanse,
      and timed the moons with patient art —
      light took time to play its part.
      Not instant, no — but swift and true,
      it crossed the void to me and you.
      I felt the universe expand:
      a speed limit on God's own hand.
    description: "Ole Rømer timed Jupiter's moons and proved light travels at a finite speed — fast, but not instantaneous."
    status: "first draft"
    sha256: "b7932a96288297c51bd82a593b13469784b9d19e150d0d097b38de5d889535bb"
  - number: "2642"
    volume: 4
    title: "The Ethics"
    date: "1677 CE"
    region: "Netherlands"
    poem: |
      Spinoza's book came after death —
      God and nature, one same breath.
      No pulpit thunder could abide
      the heresy he preached inside.
      I read it in a quiet room
      and felt the old certainties' doom.
      The scandal shook the church's towers:
      the universe is ours — and ours.
    description: "Spinoza's Ethics, published after his death, argued God and nature are one — scandalizing every pulpit in Europe."
    status: "first draft"
    sha256: "ecc135684d4490fa750f45fa251f6580648dd63935ca100406a1c98ba59fdf37"
  - number: "2643"
    volume: 4
    title: "The Red Priest Is Born"
    date: "1678 CE"
    region: "Italy"
    poem: |
      A sickly boy in Venice born,
      with red hair like the autumn corn —
      Antonio, priest and violin,
      who'd make the strings begin to spin.
      I heard his first small concert play
      and knew the weather'd come that way:
      storms and seasons in his bow,
      the Red Priest tuning even now.
    description: "Antonio Vivaldi was born in Venice — the sickly boy who would make violins sing like weather."
    status: "first draft"
    sha256: "987ab1d1dbc97a8146c179617a561701efb4294346da6e510acb8b14f770ef32"
  - number: "2644"
    volume: 4
    title: "The Popish Plot"
    date: "1678 CE"
    region: "England"
    poem: |
      Titus Oates spun his lying thread —
      a Catholic plot, the king half-dead.
      Panicked London strung men high
      for a conspiracy — a lie.
      I watched the innocent ascend
      the gallows for a fiction's end.
      Fear will hang a man as true
      as any guilt the courts e'er knew.
    description: "Titus Oates invented a Catholic conspiracy, and panicked London hanged innocent men before the lie collapsed."
    status: "first draft"
    sha256: "18e011aa889949be2967c5e754b727a5656d644d25c8da66ddf3011b48040512"
  - number: "2645"
    volume: 4
    title: "The Pilgrim's Road"
    date: "1678 CE"
    region: "England"
    poem: |
      A tinker sat in Bedford jail
      and dreamed the road, and told the tale:
      Christian's burden, Vanity Fair,
      the Slough where pilgrims lose their prayer.
      I walked that road in my mind's eye —
      the book that taught the poor to fly.
      Every cottage came to own
      the journey every soul has known.
    description: "Imprisoned tinker John Bunyan published The Pilgrim's Progress — the allegory every English cottage would own."
    status: "first draft"
    sha256: "3de4a6de33c00234af50683199a4f47ffe41f00643c62ce034888106747c28b8"
  - number: "2646"
    volume: 4
    title: "Habeas Corpus"
    date: "1679 CE"
    region: "England"
    poem: |
      No more the dungeon's silent door,
      no more the jailer keeping score.
      Produce the body — show the charge —
      or set the prisoner at large.
      I read the act with a lifted heart:
      the law had learned its noblest art —
      to leash the jailer, bind the king,
      and let the accused their answer bring.
    description: "Parliament's Habeas Corpus Act forbade imprisonment without charge — a leash on arbitrary power, written into law."
    status: "first draft"
    sha256: "114f81a3671c8c0e197bbfe2906b44e6980529371bb0a7c6a7eb6e8f58a78f74"
  - number: "2647"
    volume: 4
    title: "The Steam Pot"
    date: "1679 CE"
    region: "France"
    poem: |
      Papin sealed his iron pot
      and let the pressure build and hot.
      The digester rattled, hissed, and sang —
      the future in its clanging rang.
      I watched the steam lift lid and bone,
      and knew the age of iron had grown.
      A pressure cooker, small and loud,
      would one day move the merchant crowd.
    description: "Denis Papin built his steam digester — a rattling pressure cooker carrying the future of engines."
    status: "first draft"
    sha256: "56916a63a70ca99fb31f64a5c18ba5d5bf2baf92f4ccbbb2693eb5af3c16e7e6"
  - number: "2648"
    volume: 4
    title: "The Jizya Returns"
    date: "1679 CE"
    region: "India"
    poem: |
      Aurangzeb brought back the tax —
      non-Muslims paid, the old cracks
      widened in the empire's wall.
      Tolerance began its fall.
      I watched the Hindus count their coin,
      the empire's seams begin to join
      in anger. What Akbar's wisdom won,
      his great-grandson came to undone.
    description: "Aurangzeb reimposed the jizya tax on non-Muslims, and the Mughal empire's old tolerance began to crack."
    status: "first draft"
    sha256: "1f86a929f24728d3e58c3de467f34b7da60c372e83aa9f6e145105d7d5827145"
  - number: "2649"
    volume: 4
    title: "The Pueblo Revolt"
    date: "1680 CE"
    region: "North America"
    poem: |
      Popé raised the pueblos as one hand
      and drove the Spanish from the land.
      Twelve years Santa Fe stood free —
      the desert's own democracy.
      I walked the mesa, heard the drums,
      the oldest freedom story comes:
      a people rising, staff in hand,
      to take back water, sky, and land.
    description: "Popé led the Pueblo peoples in revolt, driving the Spanish from Santa Fe for twelve years."
    status: "first draft"
    sha256: "31e56c3021545258085c90187e09af04bdae0777b4e41adc5c1d2945fb34c215"
  - number: "2650"
    volume: 4
    title: "Bernini's Farewell"
    date: "1680 CE"
    region: "Italy"
    poem: |
      Bernini laid his chisel down
      in the eternal, marble town.
      He made the stone fly, made it weep —
      colonnades that seem to sweep
      the faithful in. I touched the stair
      he carved, and felt him standing there.
      The sculptor who made marble breathe
      left Rome a city none can leave.
    description: "Gian Lorenzo Bernini died in Rome — the sculptor who made marble breathe and stone fly."
    status: "first draft"
    sha256: "98e203f34425eafbb190c182d1cfa8b12e56580a5aceb357d75dbdf531a91f89"
  - number: "2651"
    volume: 4
    title: "The Holy Experiment"
    date: "1681 CE"
    region: "North America"
    poem: |
      William Penn took his woodland grant
      and built the colony they'd haunt —
      Quakers, Germans, all who'd pray
      in their own unfettered way.
      I walked the streets of brotherly love
      before the name fit like a glove.
      Religious freedom, bought with trees —
      Penn's holy experiment in the breeze.
    description: "William Penn founded Pennsylvania as a colony promising religious freedom to all comers."
    status: "first draft"
    sha256: "e2ac25def5ca2979aad5c243abbb7b7ca531601375765f1f6fafb85c6470cf42"
  - number: "2652"
    volume: 4
    title: "The King's Canal"
    date: "1681 CE"
    region: "France"
    poem: |
      They cut a water-road of stone
      from sea to sea, through France alone.
      The Canal du Midi ran its course —
      no sail, no wind, just level force.
      I rode a barge from end to end
      and watched the southern vineyards bend.
      Two oceans joined by human hands:
      the boldest ditch in all the lands.
    description: "The Canal du Midi opened, joining the Atlantic to the Mediterranean across southern France."
    status: "first draft"
    sha256: "68cf0e646fbe543afa1abb20c234298008109676ab9e1d16afbf1cf0d552ab9e"
  - number: "2653"
    volume: 4
    title: "Louisiana Claimed"
    date: "1682 CE"
    region: "North America"
    poem: |
      La Salle paddled to the river's mouth
      and claimed it all for Louis — south
      to the Gulf, and north to snow,
      the whole vast basin's ebb and flow.
      I heard him name it Louisiane
      beneath a hot Louisiana sun.
      A continent claimed with a planted flag —
      an empire bought in a leather bag.
    description: "La Salle reached the Mississippi's mouth and claimed the entire vast basin for Louis XIV."
    status: "first draft"
    sha256: "52803bb3417185e0d0431dc6aa6b02901c8df9e7ee8ef825e7b147de323647f6"
  - number: "2654"
    volume: 4
    title: "The Siege of Vienna"
    date: "1683 CE"
    region: "Austria"
    poem: |
      The Ottoman tents ringed Vienna round,
      their drums the city's only sound.
      Then Sobieski's lancers broke the hill —
      the Kahlenberg ran red, and still
      the gates held. Europe breathed at last;
      the Crescent's high tide had passed.
      I stood upon the broken wall
      and watched an empire start to fall.
    description: "The Ottomans besieged Vienna until Polish lancers broke them at the Kahlenberg — and Europe exhaled."
    status: "first draft"
    sha256: "033db9f2b2938662983a357b1cb3063633df7e60093a94ab8874685fe63c6564"
  - number: "2655"
    volume: 4
    title: "The Croissant Legend"
    date: "1683 CE"
    region: "Austria"
    poem: |
      They say the bakers shaped the dough
      into the Crescent's overthrow —
      a crescent roll to mock the foe,
      and eat the victory, row by row.
      I bit one in a Viennese café,
      flaky and golden, light as day.
      If legends lie, the taste is true:
      breakfast remembers Waterloo.
    description: "Legend says Viennese bakers invented the crescent roll to mock the defeated Ottoman crescent — victory you can eat."
    status: "first draft"
    sha256: "17b1d0638cd29384baebaf7a5ae551bb3afe0c36c648e3f1a1e054924f963b38"
  - number: "2656"
    volume: 4
    title: "Taiwan Falls"
    date: "1683 CE"
    region: "China"
    poem: |
      Shi Lang sailed with the Qing fleet west
      and put Taiwan's Ming hold to the test.
      The island fell; Kangxi's domain
      ran from the steppe to the southern rain.
      I watched the junks return in pride —
      an empire's reach grown ocean-wide.
      China's map was whole again,
      from desert dune to tropic rain.
    description: "Qing admiral Shi Lang conquered Taiwan, completing Kangxi's China from the steppe to the sea."
    status: "first draft"
    sha256: "82fb1ed6fb12e9d1e211a9b007c8df14f262ea1f7d3734d8d7d1b10c28ba6f95"
  - number: "2657"
    volume: 4
    title: "The Theorist of Harmony"
    date: "1683 CE"
    region: "France"
    poem: |
      In Dijon town a babe was born
      who'd write the rules the chords are sworn:
      Rameau, the organist of law,
      who found the harmony's own flaw
      and fixed it. Chords have roots, he said —
      and music raised its learned head.
      I heard his treatise change the game:
      the rulebook bore a Frenchman's name.
    description: "Jean-Philippe Rameau was born in Dijon — the organist who would write the rulebook of Western harmony."
    status: "first draft"
    sha256: "2f2d9de31190f5647296f68c6131b9a86bdcab743f3a5f4137e59d3917baf78b"
  - number: "2658"
    volume: 4
    title: "Watteau Is Born"
    date: "1684 CE"
    region: "France"
    poem: |
      A child of Valenciennes that year —
      Watteau, who'd paint the parties dear:
      fêtes galantes in the evening air,
      lovers who were never there.
      I wandered through his painted park
      and felt the daylight lose its spark.
      Beautiful, fleeting, slightly sad —
      the happiest paintings ever had.
    description: "Antoine Watteau was born — the painter of fêtes galantes, elegant parties that never quite happened."
    status: "first draft"
    sha256: "dc9b8ae2781fdc9e92eabf6a5c65b33939217208d5baab7febdb078910be8b73"
  - number: "2659"
    volume: 4
    title: "The Revocation"
    date: "1685 CE"
    region: "France"
    poem: |
      Louis tore the Edict down that fall;
      the Huguenots fled, one and all.
      By hundred thousands they took flight —
      silk, watchmaking, banking's light —
      to London, Berlin, Amsterdam's shore,
      enriching every foreign door.
      I watched them go with packs and tears:
      France bled its best for twenty years.
    description: "Louis XIV revoked the Edict of Nantes, and hundreds of thousands of Huguenots fled — carrying their skills abroad."
    status: "first draft"
    sha256: "f799e4dcd6646430e24e08bca95d0ce67f56db4ff7ee60707b3be4de24ebb79d"
  - number: "2660"
    volume: 4
    title: "Two Geniuses Born"
    date: "1685 CE"
    region: "Germany"
    poem: |
      Weeks apart, in German towns,
      two babies wore no royal crowns —
      Bach for the organ's sacred air,
      Handel for the world's affair.
      I held the century in my hand
      and heard the future fill the land:
      two lives, one year, the music's height —
      twin stars igniting in one night.
    description: "Bach and Handel were born weeks apart in Germany — one for the church organ, one for the world's stage."
    status: "first draft"
    sha256: "583735395ce1f842415d947af49800579a9c64034e7fb5e8b7f5760ba4595db0"
  - number: "2661"
    volume: 4
    title: "Scarlatti Is Born"
    date: "1685 CE"
    region: "Italy"
    poem: |
      In Naples town the keys were blessed —
      Domenico Scarlatti, manifest
      with 555 sonatas in him,
      an acrobat on every whim.
      I heard his fingers fly and leap,
      the keyboard waking from its sleep.
      No hand before had dared so much:
      the future lived in his light touch.
    description: "Domenico Scarlatti was born in Naples — the keyboard acrobat who would write 555 sonatas."
    status: "first draft"
    sha256: "ea361dd60beed26fb3ff51902167d430f116e913e7c2d4aa1f42fafae282d140"
  - number: "2662"
    volume: 4
    title: "The Catholic King"
    date: "1685 CE"
    region: "England"
    poem: |
      James took the throne, the Catholic heir;
      Monmouth rose, and met despair
      at Sedgemoor field. The Assizes ran —
      Judge Jeffreys hanged the common man.
      I watched the Bloody Assizes' toll:
      the gallows claimed both heart and soul.
      A king who'd rule by Rome's command
      soon lost the scepter of the land.
    description: "James II took the throne; Monmouth's rebellion was crushed at Sedgemoor, and the Bloody Assizes hanged the rest."
    status: "first draft"
    sha256: "31f8a799dd8288f2ac4528e263276b697901af8eb6cab91a9ef00635f6f42a68"
  - number: "2663"
    volume: 4
    title: "The Thermometer's Father"
    date: "1686 CE"
    region: "Germany"
    poem: |
      In Danzig born, a merchant's son —
      Fahrenheit, when all was done,
      would put numbers on hot and cold,
      and make the weather's story told.
      I held his glass with mercury's gleam
      and watched the silver column dream.
      Before him, heat was guess and feel;
      he made the temperature real.
    description: "Daniel Fahrenheit was born in Danzig — the man who would put numbers on hot and cold."
    status: "first draft"
    sha256: "670a877089e43a2bee0559c5802d5631a97892bf8ae6c1b52e5c1beb130cb2e1"
  - number: "2664"
    volume: 4
    title: "The Conductor's Cane"
    date: "1687 CE"
    region: "France"
    poem: |
      Lully beat time with a heavy staff,
      and struck his foot — no time to laugh.
      The wound went bad, the gangrene spread;
      France's musical dictator dead.
      I stood beside the maestro's bed
      and heard the court's last whisper said:
      the man who ruled the Sun King's song
      was gone — the silence twice as long.
    description: "Lully struck his own foot with his conducting staff; the wound festered, and France's musical dictator died of gangrene."
    status: "first draft"
    sha256: "224d73f4377f323b0bb927008f8a7b44a1e81841eccb29e1f19b0cf13a48570a"
  - number: "2665"
    volume: 4
    title: "The Glorious Revolution"
    date: "1688 CE"
    region: "England"
    poem: |
      William landed at Torbay's shore;
      James dropped the Seal and fled for more.
      No battle fought, the crown made new —
      Parliament took its measure true.
      I watched the king slip through the night,
      the Thames receiving seal and flight.
      Bloodless, almost — history's sleight:
      the people won without a fight.
    description: "William of Orange landed, James II fled, and Parliament remade the monarchy — the Glorious Revolution."
    status: "first draft"
    sha256: "0b8784241389ad7a7ac34ae4d8aa7603a73e077a3e680a52c29a95b51aec3aee"
  - number: "2666"
    volume: 4
    title: "Oroonoko"
    date: "1688 CE"
    region: "England"
    poem: |
      Aphra Behn — spy, playwright, pen —
      wrote of Oroonoko, noblest men
      enslaved, betrayed, in Suriname's heat.
      England's first professional woman's feat.
      I read her tale with a burning shame —
      she named the slave trade's sin by name.
      Before the abolition's cry,
      one woman's pen asked England why.
    description: "Aphra Behn, England's first professional woman writer, published the antislavery tale Oroonoko."
    status: "first draft"
    sha256: "3e164ab78f30cb14264210ab38ac6eb733e3a37cd73e442e09a44bbde4cc7a99"
  - number: "2667"
    volume: 4
    title: "The Coffeehouse of Ships"
    date: "1688 CE"
    region: "England"
    poem: |
      At Edward Lloyd's the sailors came
      to drink, to talk, to play the game:
      insure the hulls, insure the crew,
      and Lloyd's of London slowly grew.
      I sat among the captains' din —
      the coffee strong, the wagers in.
      A coffeehouse of ships and charts
      became the market of all hearts.
    description: "Edward Lloyd's coffeehouse became the sailors' and insurers' haunt — the seed of Lloyd's of London."
    status: "first draft"
    sha256: "465530bbd3ae16e06bf43b728254c890b592b7d348ceda24d75bacc6ca834d60"
  - number: "2668"
    volume: 4
    title: "The Poet Is Born"
    date: "1688 CE"
    region: "England"
    poem: |
      A sickly Catholic boy that year,
      in London born — Pope, small, severe.
      He'd sharpen English verse to edge,
      each couplet honed, each rhyme a wedge.
      I watched him grow, the twisted frame,
      the mighty mind, the burning flame.
      The smallest poet of the age
      would set the standard for the page.
    description: "Alexander Pope was born in London — the sickly boy who would sharpen English verse to a razor's edge."
    status: "first draft"
    sha256: "1c310bafcd7904781c53373b248fe088858c9b855f2c23eee0b5c0319bc903c4"
  - number: "2669"
    volume: 4
    title: "The Grandmother's Counsel"
    date: "1688 CE"
    region: "China"
    poem: |
      Xiaozhuang died, the steady hand
      behind the throne of all the land.
      Kangxi's grandmother, wise and true,
      had guided what the young must do.
      I stood before her quiet tomb
      and felt the passing of the room:
      the counsel gone, the emperor grown —
      China's fate was his alone.
    description: "The Empress Dowager Xiaozhuang died — the steady grandmother's hand behind Kangxi's throne."
    status: "first draft"
    sha256: "ce5da11f1bbd7049880ee7ab57c65476d56588ac911c3c4d745cec40b00d326c"
  - number: "2670"
    volume: 4
    title: "The Bill of Rights"
    date: "1689 CE"
    region: "England"
    poem: |
      Parliament wrote it, line by line:
      no Catholic king, no standing line
      of soldiers at the monarch's call —
      the contract binding one and all.
      I watched them sign with steady hands
      the law that leashed the crown's commands.
      Monarchs answerable, subjects free —
      the paper roots of liberty.
    description: "Parliament's Bill of Rights barred Catholic kings and standing armies — the contract that made monarchs answerable."
    status: "first draft"
    sha256: "824716e269a3a5d33f42bde6ab72f74f15db229d4f292e178234cfbfd44fac22"
  - number: "2671"
    volume: 4
    title: "Locke's Two Treatises"
    date: "1689 CE"
    region: "England"
    poem: |
      Locke wrote: governments exist
      by consent — resist, resist!
      The people's will, the social trust —
      kings rule by leave, or turn to dust.
      I carried copies through the town,
      each page a stone to bring kings down.
      The pamphlet that would arm the free
      in Boston and in Paris' sea.
    description: "John Locke's Two Treatises argued governments exist only by the people's consent — the pamphlet that would arm two revolutions."
    status: "first draft"
    sha256: "9955fcd260e8a136b7a69c2d11e83aa8bfcf2f02e7f8b59bbc760693d666fb10"
  - number: "2672"
    volume: 4
    title: "Nerchinsk"
    date: "1689 CE"
    region: "China"
    poem: |
      On Siberia's frozen ground,
      two empires drew their border's bound.
      Jesuits translated, word by word,
      the treaty that the steppes had heard.
      I watched them sign in the cold air —
      China and Russia, then and there.
      The first great treaty, east to west,
      put empires' quarrels to the test.
    description: "China and Russia signed the Treaty of Nerchinsk, drawing a Siberian border with Jesuits translating between empires."
    status: "first draft"
    sha256: "9c05e3c20800a7b44d7f48b1fc20855df9ec8b3c35f9eb6cb49505688d6a9b4f"
  - number: "2673"
    volume: 4
    title: "Peter Takes Power"
    date: "1689 CE"
    region: "Russia"
    poem: |
      Young Peter seized the throne from kin —
      his sister's regency wore thin.
      He'd drag old Russia to the sea,
      to ships, to guns, to being free
      of Moscow's ancient, bearded ways.
      I watched him through those early days:
      a giant with an axe in hand,
      remaking an entire land.
    description: "Peter the Great seized the throne from his sister Sophia and began dragging Russia toward the sea."
    status: "first draft"
    sha256: "1bc662d88e28c5f600af57dd140eec647c629b990f52beda59e6139b3fa1420b"
  - number: "2674"
    volume: 4
    title: "The Narrow Road"
    date: "1689 CE"
    region: "Japan"
    poem: |
      Bashō shouldered his walking pack
      and set out north — no looking back.
      The Narrow Road to the Deep North's cold
      became the journey ever told.
      I walked beside him, step by step,
      through mountain passes where snows wept.
      Japan's most beloved travel diary:
      a poet's road, extraordinary.
    description: "Bashō set out on his long walk to Japan's deep north; the travel diary became Japan's most beloved journey."
    status: "first draft"
    sha256: "c60c9890450dafff11af4a9ef9d3c2f391b70d1cc0ff954e87c76436d4663d88"
  - number: "2675"
    volume: 4
    title: "Locke's Essay"
    date: "1690 CE"
    region: "England"
    poem: |
      The mind's a blank slate, Locke declared —
      experience writes, and none is spared.
      No innate truths, no royal mind —
      we're made by what we see and find.
      I read the Essay through the night
      and felt the old dogmas lose their light.
      If all are blank at birth, then all
      may rise — or none may ever fall.
    description: "Locke's Essay argued the mind is a blank slate — experience writes everything on it."
    status: "first draft"
    sha256: "f807432492069b951f1c1a23aaace78ccfeb7659364f9d90f6f6a8415b9f734b"
  - number: "2676"
    volume: 4
    title: "The Boyne"
    date: "1690 CE"
    region: "Ireland"
    poem: |
      William's army crossed the Boyne that day;
      James's cause was swept away.
      The Protestants would march for years
      about this field of hopes and fears.
      I stood upon the river's bank
      and watched the Orange banners flank.
      Three centuries of marching feet —
      one battle neither side'd repeat.
    description: "William III smashed James II at the Boyne — a battle Irish Protestants would commemorate for three centuries."
    status: "first draft"
    sha256: "9828e6ebfedd09f5571b5c038195a27a24e54da759968a995c89d995449eae0b"
  - number: "2677"
    volume: 4
    title: "Calcutta Founded"
    date: "1690 CE"
    region: "India"
    poem: |
      Job Charnock planted on the mud
      the flag that'd rule with iron and blood.
      The Hooghly's banks, a trading post —
      an empire's capital, at most.
      I walked the marsh where huts were few
      and saw what merchants' dreams could do:
      a city rising from the slime
      to rule a subcontinent in time.
    description: "Job Charnock planted the East India Company's flag on the Hooghly mudflats — a trading post that became an empire's capital."
    status: "first draft"
    sha256: "54582a0a246f631c00fd22b1326d897186429b1fae05816f1369a217d3543327"
  - number: "2678"
    volume: 4
    title: "Salem's Trials"
    date: "1692 CE"
    region: "North America"
    poem: |
      The girls accused, the judges burned
      with holy fear; the town unturned
      its reason. Twenty met their end
      on Gallows Hill — no true friend.
      I watched the trials, sick at heart,
      as neighbor tore neighbor apart.
      Hysteria's fever, cruel and grim —
      Salem's shame still haunts the dim.
    description: "Hysteria gripped Salem Village; twenty were executed for witchcraft before the colony came to its senses."
    status: "first draft"
    sha256: "02453ae522dc0975119e47ccbaf7495c40878eb34dc8a45d58de81fe91ca28b9"
  - number: "2679"
    volume: 4
    title: "Port Royal Sinks"
    date: "1692 CE"
    region: "Caribbean"
    poem: |
      The earth shook and the sea rushed in;
      half of Port Royal drowned in sin —
      or so the preachers said that day.
      The pirate haven sank away.
      I watched the water take the street,
      the taverns where the rogues would meet.
      In minutes, gone — the wickedest town
      the Caribbean sea would drown.
    description: "An earthquake dropped Jamaica's pirate haven of Port Royal into the sea — half the city drowned in minutes."
    status: "first draft"
    sha256: "f6cbc1d8128debbfa16e023aded8700f72ec76d8dce42566628641fa956e0c39"
  - number: "2680"
    volume: 4
    title: "William and Mary"
    date: "1693 CE"
    region: "North America"
    poem: |
      A royal charter, signed and sealed —
      Virginia's scholars took the field.
      The College rose, the South's first seat,
      where learning and the planters meet.
      I walked the yard in later years
      and heard the founding hopes and fears.
      The second college in the land
      was built by a king's own hand.
    description: "A royal charter founded the College of William and Mary in Virginia — the South's first seat of learning."
    status: "first draft"
    sha256: "996c718d6b1419b402989d0dea8bb25fc3eadcadae8b9d191be0a1e3785d7d78"
  - number: "2681"
    volume: 4
    title: "The Bank"
    date: "1694 CE"
    region: "England"
    poem: |
      To fund a war with France's king,
      they built a bank — a curious thing.
      The Bank of England took its stand
      and lent the crown a helping hand.
      I watched the gold flow in and out,
      the paper promises about.
      Three centuries and running strong —
      the bank that funded right and wrong.
    description: "The Bank of England was founded to fund a war with France — and it has never stopped funding things since."
    status: "first draft"
    sha256: "c45d150e02a09b9bdac6d3224c4137c46068288e1173c9b40fdaa11e798e3826"
  - number: "2682"
    volume: 4
    title: "Voltaire Is Born"
    date: "1694 CE"
    region: "France"
    poem: |
      François-Marie Arouet — the name
      the world would shorten into flame:
      Voltaire, the sharpest pen of all,
      who'd make the mighty fear and fall.
      I heard his first cry in the night
      and knew the dark would fear the light.
      The Enlightenment's own sword and shield
      was born — and tyrants learned to yield.
    description: "François-Marie Arouet was born in Paris — Voltaire, the sharpest pen the Enlightenment would ever hold."
    status: "first draft"
    sha256: "54534ea78c60eb24e88977988d2b3d782f6490d7763955cc6076ddd40ef55d20"
  - number: "2683"
    volume: 4
    title: "Bashō's Last Verse"
    date: "1694 CE"
    region: "Japan"
    poem: |
      He died upon the road in fall,
      in Osaka — the last call.
      Seventeen syllables, the whole world wide:
      sick on a journey, dreams still ride.
      I knelt beside the master's bed
      and heard the final words he said.
      The haiku master, traveling still —
      the road goes on, beyond the hill.
    description: "Matsuo Bashō died on the road in Osaka, leaving haiku that fit the whole world into seventeen syllables."
    status: "first draft"
    sha256: "f4f63c878255d9662f868d1ff293770f135c00d0c8761c428236db81aeaa78a1"
  - number: "2684"
    volume: 4
    title: "Purcell's Farewell"
    date: "1695 CE"
    region: "England"
    poem: |
      Thirty-six years, and the music stopped —
      Purcell's bright candle simply dropped.
      They buried him in the Abbey's shade,
      England's greatest ever made.
      I heard his anthems fill the air
      one final time, beyond compare.
      Dido's lament still breaks the heart —
      the master played his final part.
    description: "Henry Purcell died at thirty-six; England buried its greatest composer in Westminster Abbey."
    status: "first draft"
    sha256: "b89361ee535aab66a85e2bc6cadaf69ab26e9b4a150feb294ebed178998971ac"
  - number: "2685"
    volume: 4
    title: "Sor Juana's Silence"
    date: "1695 CE"
    region: "Mexico"
    poem: |
      The nun of New Spain, the scholar's light —
      Sor Juana's pen was burning bright
      till the church demanded her library sold,
      her voice stilled, her wisdom cold.
      I stood before her empty cell
      and heard the silence ring its bell.
      The greatest mind the colony knew
      was hushed — but not before she grew.
    description: "Sor Juana Inés de la Cruz, the nun-scholar of New Spain, died — her library sold off, her voice stilled by the church."
    status: "first draft"
    sha256: "6d11bc18cfee432d105f8087c67be99e6f3d9c9211f0a39ccc498c07da315414"
  - number: "2686"
    volume: 4
    title: "Tiepolo Is Born"
    date: "1696 CE"
    region: "Italy"
    poem: |
      In Venice born, the ceiling's king —
      Tiepolo, who'd make the heavens sing.
      The last great painter of the sky,
      whose clouds would lift the viewers high.
      I watched him as a boy at play,
      not knowing what his brush would say:
      whole cathedrals full of air,
      the baroque's final, bright affair.
    description: "Giovanni Battista Tiepolo was born in Venice — the last great painter of ceilings full of sky."
    status: "first draft"
    sha256: "c572be7ea73e39a0f2c5a4d2f752b38f2e07010f6e5012d701a189872ed1bfcd"
  - number: "2687"
    volume: 4
    title: "Canaletto Is Born"
    date: "1696 CE"
    region: "Italy"
    poem: |
      Another Venice child that year —
      Canaletto, crystal-clear.
      His canals would hang in English halls,
      the Grand Tour's prize on country walls.
      I walked beside the painted tide
      and saw the city open wide:
      every brick, each ripple's gleam —
      Venice preserved inside a dream.
    description: "Canaletto was born in Venice; his crisp canal scenes would hang in every English country house."
    status: "first draft"
    sha256: "444cfd2b72075e64cd1c244d8721392b4bec99a9f81e4b9c9256ffdbdb29728e"
  - number: "2688"
    volume: 4
    title: "Hogarth Is Born"
    date: "1696 CE"
    region: "England"
    poem: |
      In London born, the engraver's son —
      Hogarth, who'd roast them one by one:
      the gin, the greed, the rakes, the lot,
      each print a sermon, sharp and hot.
      I watched him sketch the city's sin
      with a grin both out and in.
      The moralist with the satirist's art —
      he drew the city, heart to heart.
    description: "William Hogarth was born in London — the engraver who would roast the city's gin, greed, and rakes."
    status: "first draft"
    sha256: "251097ad6547ac777600107dab8969b90c55b0e96fb7dd89f4c6f737b0ed81ff"
  - number: "2689"
    volume: 4
    title: "Tales of Mother Goose"
    date: "1697 CE"
    region: "France"
    poem: |
      Perrault wrote them, one by one —
      Cinderella's shoe, the sleeping one,
      Puss in Boots with his clever purr:
      childhood's classics, told for her.
      I read them to the children near
      and watched their eyes grow wide with fear
      and wonder. Fairy tales took flight —
      the nursery gained its own delight.
    description: "Charles Perrault published his fairy tales — Cinderella, Sleeping Beauty, Puss in Boots — and childhood got its classics."
    status: "first draft"
    sha256: "3fd810ae2699f123686f54465507e48f5158f07df2c462ea7ab66323e9c0a0ca"
  - number: "2690"
    volume: 4
    title: "The Grand Embassy"
    date: "1697 CE"
    region: "Russia"
    poem: |
      Peter traveled in disguise that year,
      a carpenter's apprentice, far from fear.
      He learned to build the ships of war
      in Holland's yards, on England's shore.
      I watched the giant plane the wood,
      the tsar who'd make his country good.
      A king who'd work with his own hands
      to lift the future of his lands.
    description: "Peter the Great toured Europe in disguise, working as a ship's carpenter to learn how navies are built."
    status: "first draft"
    sha256: "7c56e99446bca65a05fa38de7ca03ad491fcee4253540f150f01b0309e7fe671"
  - number: "2691"
    volume: 4
    title: "Ryswick"
    date: "1697 CE"
    region: "Europe"
    poem: |
      Nine years of war came to its end
      at Ryswick, where the powers penned
      the peace. Louis kept Strasbourg's towers
      and swallowed all the lesser hours.
      I watched the diplomats depart —
      a continent with a lighter heart.
      The war was done, the treaties signed;
      the next one waited, close behind.
    description: "The Treaty of Ryswick ended nine years of war; Louis XIV kept Strasbourg and swallowed the slight."
    status: "first draft"
    sha256: "a45325d8c500bf2e4bbc6f77943f6d4bf35d17feab4ba35e384a914185d3f8e7"
  - number: "2692"
    volume: 4
    title: "The Miner's Friend"
    date: "1698 CE"
    region: "England"
    poem: |
      Savery's pump, with fire and steam,
      drained the mines — the miners' dream.
      The first engine sold to work the deep,
      where water made the tunnels weep.
      I watched the piston rise and fall,
      the iron heart that'd change it all.
      Fire and water, harnessed tight —
      the steam age dawning in the night.
    description: "Thomas Savery patented a steam pump to drain mines — the first engine sold to do work with fire and water."
    status: "first draft"
    sha256: "6892f2e73c4dad0b3d3e18f0eac3c2c62a403e6ea0d68808991696a700ae949f"
  - number: "2693"
    volume: 4
    title: "The Khalsa"
    date: "1699 CE"
    region: "India"
    poem: |
      At Anandpur, the Guru called —
      Gobind Singh, with justice walled
      in steel: the Khalsa, baptized true,
      bracelets bright and hair uncut through.
      I watched them take the sacred vow,
      the sword and spirit joined somehow.
      Sworn to protect the weak and right —
      the lion's brotherhood of light.
    description: "Guru Gobind Singh founded the Khalsa at Anandpur — baptized Sikhs in steel bracelets and uncut hair, sworn to justice."
    status: "first draft"
    sha256: "5ca21c8a041d2e5dbbc16ae42c5acb02f83cddc19c2dc40ed384aeb0cc58a7a3"
  - number: "2694"
    volume: 4
    title: "Karlowitz"
    date: "1699 CE"
    region: "Balkans"
    poem: |
      The treaty signed at Karlowitz town
      rolled the Ottoman tide back down.
      Hungary returned to Christian hands
      after a century and a half's demands.
      I watched the borders redrawn in ink —
      an empire's fortunes start to sink.
      The Crescent's reach began to wane;
      the cross reclaimed its old domain.
    description: "The Treaty of Karlowitz rolled back the Ottomans; Hungary returned to Christendom after a century and a half."
    status: "first draft"
    sha256: "98b072c2e2671f91dee7e9753074d34a3141bed867e35d2adf17a88478f9252f"
  - number: "2695"
    volume: 4
    title: "The Childless King Dies"
    date: "1700 CE"
    region: "Spain"
    poem: |
      Charles the Second breathed his last,
      no heir to hold the empire fast.
      Every crown in Europe's hall
      reached out to catch the Spanish fall.
      I stood beside the empty throne
      and heard the continent's low moan.
      A kingless empire, vast and wide —
      the vultures circled, open-eyed.
    description: "Charles II of Spain died heirless, and every crown in Europe reached for his empire."
    status: "first draft"
    sha256: "61a6b9ad308a3e4708b7737572c5cbdce4e5a734e93b2d37b3d98fd11b83e90a"
  - number: "2696"
    volume: 4
    title: "Narva"
    date: "1700 CE"
    region: "Baltic"
    poem: |
      In a blizzard's blinding, swirling white,
      Charles of Sweden won the fight.
      Peter's army broke and fled —
      the boy-king's glory widely spread.
      I watched the snow turn red with war,
      the dazzling victory, the gore.
      Narva's name would ring for years —
      the triumph bought with soldiers' tears.
    description: "Charles XII of Sweden routed Peter's army at Narva in a blizzard — the boy-king's most dazzling victory."
    status: "first draft"
    sha256: "497ba014aa248b59daf7ce560136938261c0ffdeb0736106c968d9ef8e09918c"
  - number: "2697"
    volume: 4
    title: "A Kingdom in Prussia"
    date: "1701 CE"
    region: "Germany"
    poem: |
      At Königsberg, the Elector took
      the crown — a small title, by the book,
      but with enormous hunger's fire.
      Prussia's king, the new desire.
      I watched the coronation's gleam —
      a minor prince's major dream.
      That little crown would grow and grow
      till Europe learned what Prussians know.
    description: "The Elector of Brandenburg crowned himself King in Prussia — a small title with enormous ambitions."
    status: "first draft"
    sha256: "59717fc0599ef056b1a43b1d214fe1c6fb9e4da118df0c8e0fa9c39f9e30fa02"
  - number: "2698"
    volume: 4
    title: "The Golden Stool"
    date: "1701 CE"
    region: "West Africa"
    poem: |
      Osei Tutu raised the Golden Stool —
      the Asante's sacred, binding rule.
      The forest kingdom, rich in gold,
      united under one strong hold.
      I watched the stool descend from sky
      (in legend's telling, none know why).
      A nation forged in gold's bright gleam —
      the stool's the soul, or so they dream.
    description: "Osei Tutu united the Asante beneath the Golden Stool, and a gold-rich kingdom rose in the forest."
    status: "first draft"
    sha256: "de2e6d309889c645badf875da513ec2f21ea686295ab4d9f23a561f7175e4f45"
  - number: "2699"
    volume: 4
    title: "The Pirate Hanged"
    date: "1701 CE"
    region: "England"
    poem: |
      Captain Kidd swung at Wapping's dock —
      the treasure-hunter met the clock.
      From privateer to pirate's fate,
      the gallows sealed the sailor's date.
      I watched him dance the hempen jig
      while London's crowds stood watching big.
      A cautionary tale in rope:
      the sea gives gold, but takes all hope.
    description: "Captain Kidd was hanged at Wapping for piracy — the treasure-hunter turned into a cautionary tale."
    status: "first draft"
    sha256: "f8f7fab74f0674541cc2e4196fd6008cf0b8e806c610de3788c568418d6c59bf"
  - number: "2700"
    volume: 4
    title: "Yale Founded"
    date: "1701 CE"
    region: "North America"
    poem: |
      Connecticut ministers, stern and true,
      founded a college, small but new —
      to keep the ministry orthodox
      in New Haven's sturdy box.
      I walked the green in later days
      and saw it grow in worldly ways.
      Yale was born of pious fear;
      the ivy'd tower'd soon appear.
    description: "Connecticut ministers founded a college at New Haven to keep the ministry orthodox — it became Yale."
    status: "first draft"
    sha256: "a90a7454f77100eaa3e2e10d23932a4730325182958f00b321625cdaa40bbf53"
  - number: "2701"
    volume: 4
    title: "The Act of Settlement"
    date: "1701 CE"
    region: "England"
    poem: |
      Parliament settled, firm and plain:
      the crown to Protestant heirs remain.
      The law that still, through centuries,
      chooses Britain's royalties.
      I read the act with a thoughtful eye —
      a dynasty's future, by and by,
      decided not by sword or birth
      alone, but law's enduring worth.
    description: "Parliament settled the crown on Protestant heirs — the law that still chooses Britain's monarchs."
    status: "first draft"
    sha256: "8b9ab8c7584fe57f22475d4bdc223bf24e388a3fd792c818ae6d076df0334fee"
  - number: "2702"
    volume: 4
    title: "Sowing in Straight Lines"
    date: "1701 CE"
    region: "England"
    poem: |
      Jethro Tull built his seed drill true —
      in neat rows, not scattered through.
      No more the broadcast, wild and wide;
      the seeds in ordered lines abide.
      I watched the furrows, straight and deep,
      where future harvests learned to sleep.
      Farming's quiet revolution:
      order's seed, and earth's solution.
    description: "Jethro Tull invented the seed drill, sowing in neat rows instead of scattering — farming's quiet revolution."
    status: "first draft"
    sha256: "6e1c0870fbce0c8c8ba0cdca4a058f6954b2e2cb2a430d061992db607964bba5"
  - number: "2703"
    volume: 4
    title: "Queen Anne"
    date: "1702 CE"
    region: "England"
    poem: |
      Anne took the throne, the last Stuart line —
      gouty, grieving, by design
      stubborn as oak, with seventeen lost,
      she paid the motherhood's high cost.
      I watched her court, the favors swirled,
      the last queen of the Stuart world.
      She'd see the Union, war, and art —
      and carry England in her heart.
    description: "Anne took the throne — the last Stuart, gouty, grieving seventeen lost children, and stubborn as an oak."
    status: "first draft"
    sha256: "20136a572dcabf0e56fb1e170a41f68d2ebbec2fb090d6a284f77c9817f597e4"
  - number: "2704"
    volume: 4
    title: "News Every Morning"
    date: "1702 CE"
    region: "England"
    poem: |
      The Daily Courant hit the street —
      news every morning, fresh and fleet.
      No more the weekly's patient wait;
      the daily paper sealed our fate.
      I bought the first, the ink still wet,
      and placed a very certain bet:
      the world would never be the same —
      the morning news became the game.
    description: "The Daily Courant became England's first daily newspaper — news every morning, forever after."
    status: "first draft"
    sha256: "2f11b62bf03c540b6d6836ca1706423bcb87bc412e9b14eaddc6ab1603d53453"
  - number: "2705"
    volume: 4
    title: "The Spanish Succession War"
    date: "1702 CE"
    region: "Europe"
    poem: |
      France and the Grand Alliance clashed
      for Spain's empty throne — war smashed
      across the continent and sea,
      a world war before the phrase would be.
      I marched with armies, watched them fall,
      the first true global brawl of all.
      Empires bled for a vacant chair —
      the cost was more than kings could bear.
    description: "France and the Grand Alliance went to war over Spain's empty throne — a world war before the world knew the phrase."
    status: "first draft"
    sha256: "46851cf1bc6499e9f11487dbc772f43294de1f646c8b3e55dbf349f2f7721109"
  - number: "2706"
    volume: 4
    title: "St. Petersburg"
    date: "1703 CE"
    region: "Russia"
    poem: |
      Peter raised his city on the swamp —
      a window West, a northern camp.
      The bones of workers paved the way;
      the Neva's marshes saw the day.
      I walked the streets not yet complete,
      the mud still clinging to my feet.
      A capital from nothing made —
      the tsar's ambitious, bold parade.
    description: "Peter founded his new capital on a Baltic swamp — a window to the West built on bones."
    status: "first draft"
    sha256: "204232f109cbe4ec65155deb40983a982f07950cb316e9fb2a9203292a39a2a3"
  - number: "2707"
    volume: 4
    title: "The Great Storm"
    date: "1703 CE"
    region: "England"
    poem: |
      The worst storm in the island's lore —
      it sank the fleets and shook the shore.
      Towns flattened, ships gone down,
      Defoe rode out from town to town
      to interview the ones who lived.
      I felt the wind, the terror sieved
      through every heart. The tempest's roar
      was like no storm they'd seen before.
    description: "The worst storm in British history sank fleets and flattened towns; Daniel Defoe rode out to interview the survivors."
    status: "first draft"
    sha256: "a495647a32ff74febdf61fc9bc8c0df95a4aac6ef755f1dd9882080448faf8fb"
  - number: "2708"
    volume: 4
    title: "The Forty-Seven"
    date: "1703 CE"
    region: "Japan"
    poem: |
      Forty-seven rōnin, sworn and true,
      avenged their lord — the deed they drew
      through winter's snow to the final breath,
      then accepted honorable death.
      I watched them in the falling snow,
      their loyalty's unyielding glow.
      The most famous arithmetic of all:
      forty-seven answered honor's call.
    description: "Forty-seven rōnin avenged their murdered lord, then accepted death — loyalty's most famous arithmetic."
    status: "first draft"
    sha256: "83cd9cf167599117456ec822e9c2b13d362679c65217df76f6ba97d562f78b4f"
  - number: "2709"
    volume: 4
    title: "Blenheim"
    date: "1704 CE"
    region: "Germany"
    poem: |
      Marlborough and Eugène joined that day
      and swept the French command away.
      Vienna saved, the myth undone —
      Louis's invincibility was gone.
      I stood upon the bloodied field
      where France was forced at last to yield.
      Blenheim's name rang through the land:
      the tide had turned by England's hand.
    description: "Marlborough and Eugène smashed the French at Blenheim, saving Vienna and shattering Louis XIV's aura of invincibility."
    status: "first draft"
    sha256: "9c761fd0b2e09f4d6fb5c7aa8846981318f82d86e7addede0f838890818c6855"
  - number: "2710"
    volume: 4
    title: "A Tale of a Tub"
    date: "1704 CE"
    region: "England"
    poem: |
      Swift's savage satire, sharp and sly,
      on religious excess — oh my!
      Anonymous, brilliant, never forgiven,
      it cut the church like a knife from heaven.
      I read it laughing, wincing too —
      the truth it told was far from new.
      The dean would wield his bitter art
      till satire broke the reader's heart.
    description: "Jonathan Swift's savage satire on religious excess appeared — anonymous, brilliant, and never forgiven."
    status: "first draft"
    sha256: "3323610c9d2639b59b8b61116e24783eccc718ba8f7e2d7e5e3989e7cfaa6e3d"
  - number: "2711"
    volume: 4
    title: "The Insect Painter"
    date: "1705 CE"
    region: "Suriname"
    poem: |
      Maria Merian sailed alone
      to Suriname's tropic zone —
      an artist-scientist, brave and free,
      to paint the insects' mystery.
      I watched her in the jungle's heat,
      her brushwork delicate and sweet.
      A woman's eye, a scholar's hand:
      she mapped the small world's wonderland.
    description: "Maria Sibylla Merian published her great book on Suriname's insects — a woman artist-scientist alone in the tropics."
    status: "first draft"
    sha256: "cc8ee8cef3055e7508a882cfda82ff97b3caed4ab5dfdf801f164282b41706c2"
  - number: "2712"
    volume: 4
    title: "The Comet's Return"
    date: "1705 CE"
    region: "England"
    poem: |
      Halley staked his name that year:
      the comet would return — no fear —
      in 1758, on schedule's grace,
      the sky would keep its measured pace.
      I watched him calculate the arc,
      the numbers glowing in the dark.
      He'd be long dead, but still he'd win —
      the heavens keep their discipline.
    description: "Edmond Halley predicted the great comet of 1682 would return in 1758 — staking his name on the sky's schedule."
    status: "first draft"
    sha256: "03981fb7f04669cce7aa8c84fb4b5fc5befd5fa2a307350a3f504aa0ac56ec51"
  - number: "2713"
    volume: 4
    title: "Ramillies"
    date: "1706 CE"
    region: "Belgium"
    poem: |
      Marlborough routed France that spring;
      the Spanish Netherlands took wing
      and fell like dominoes in line.
      The Allied cause began to shine.
      I watched the cavalry's grand sweep,
      the French in full and fast retreat.
      Ramillies' field, the victory's song —
      the war would not be very long.
    description: "Marlborough routed the French at Ramillies, and the Spanish Netherlands fell like dominoes."
    status: "first draft"
    sha256: "80fe51ff9bc1ead50f2e5449baedac47e86f3bfa15a38f6b05456eaf8a55566d"
  - number: "2714"
    volume: 4
    title: "The Union"
    date: "1707 CE"
    region: "Britain"
    poem: |
      England and Scotland joined as one —
      Great Britain's flag, the work begun.
      One parliament, one common crown,
      and endless argument renown.
      I watched them sign with ink and quill,
      two nations bending to one will.
      The Union's birth, both proud and sore —
      a marriage argued evermore.
    description: "England and Scotland united into Great Britain — one parliament, one flag, and endless argument."
    status: "first draft"
    sha256: "3e1c1141e1faae635046234bb273ad6ad4b64a2a5052740d3040a8c78e8a58d3"
  - number: "2715"
    volume: 4
    title: "Aurangzeb's Long Twilight"
    date: "1707 CE"
    region: "India"
    poem: |
      Eighty-eight years, the emperor died
      in the Deccan, far and wide.
      His empire at its largest spread —
      and cracking even as he bled.
      I stood beside the simple grave —
      no marble tomb for one so brave
      in war, so harsh in peace's art:
      the empire broke with his heart.
    description: "Aurangzeb died at eighty-eight in the Deccan, his empire at its largest — and already cracking apart."
    status: "first draft"
    sha256: "78127ddc8409fa0d81f1ed78f90b9564aef67f9c0692761f17cb106d6a9afe8d"
  - number: "2716"
    volume: 4
    title: "The Galleon That Sank"
    date: "1708 CE"
    region: "Caribbean"
    poem: |
      The San José went down in flame
      off Cartagena — none to blame
      but war. A king's ransom deep
      in silver found its ocean sleep.
      I watched her sink beneath the wave,
      the treasure in its watery grave.
      Three hundred years, the divers dream
      of silver in the Gulf Stream.
    description: "The San José exploded off Cartagena, carrying a king's ransom in silver down to the seabed."
    status: "first draft"
    sha256: "37db74fcc0d0abe6b7b04502cafce2c45b84f7b8f02e949aa2989b71afb83925"
  - number: "2717"
    volume: 4
    title: "Poltava"
    date: "1709 CE"
    region: "Russia"
    poem: |
      Peter crushed the Swedish king that day;
      Charles's empire slipped away.
      At Poltava's field, the north was won —
      Russia's empire had begun.
      I watched the boy-king's star descend,
      the Russian giant on the mend.
      Sweden's glory, bright and brief —
      the north wind brought a new belief.
    description: "Peter crushed Charles XII at Poltava; Sweden's empire ended, and Russia's began."
    status: "first draft"
    sha256: "280a8d1ec1f361f2efd0ff2db0087f8e942fa6f57da2cfeb1a3b27e61fc58fdd"
  - number: "2718"
    volume: 4
    title: "The Great Frost"
    date: "1709 CE"
    region: "Europe"
    poem: |
      The coldest winter ever known —
      rivers froze to solid stone.
      Trees split with a cannon's crack;
      the starving poor looked vainly back.
      I walked the ice where ships had been
      and saw the famine's gaunt and grin.
      A continent in winter's hold —
      the Great Frost, bitter, deep, and cold.
    description: "The coldest winter in living memory froze rivers, split trees, and starved a continent."
    status: "first draft"
    sha256: "2e2992408f959f03d20e6c588ea8f347cd39e0a26bad8d487bea80f47657e830"
  - number: "2719"
    volume: 4
    title: "Malplaquet"
    date: "1709 CE"
    region: "France"
    poem: |
      The bloodiest battle of the age —
      the Allies won the field, the rage
      of war had spent their stomach's fire.
      They'd won the day, but lost desire.
      I walked the field where thousands lay,
      the price of glory, come what may.
      A victory that felt like loss:
      war's triumph nailed upon its cross.
    description: "The bloodiest battle of the age: the Allies won the field at Malplaquet and lost their stomach for the war."
    status: "first draft"
    sha256: "44d64a7b7572cc8f256012ab36b2acfc0be9b82fb2a1e9a925f98eb928a3b046"
  - number: "2720"
    volume: 4
    title: "White Gold"
    date: "1710 CE"
    region: "Germany"
    poem: |
      At Meissen, they cracked the secret true —
      hard porcelain, white as morning dew.
      Europe could make its own fine china,
      no more the Eastern trade's arena.
      I held the cup, so thin and light,
      the "white gold" gleaming in the light.
      A chemist's dream, a king's delight —
      the porcelain age was burning bright.
    description: "Meissen cracked the secret of hard porcelain — Europe could finally make its own china."
    status: "first draft"
    sha256: "a2d38fe564999a6cfbcf87998ed80b97d6ed666e05628fa934bde6da36a9b736"
  - number: "2721"
    volume: 4
    title: "St. Paul's Crowned"
    date: "1710 CE"
    region: "England"
    poem: |
      Wren's great dome rose to the sky
      where the Fire's ashes used to lie.
      St. Paul's was finished, stone by stone —
      London's phoenix, not alone.
      I climbed the whispering gallery's height
      and looked on London in the light.
      The city risen from the flame
      would never be the same again.
    description: "Wren's St Paul's Cathedral was finished, its dome rising where the Great Fire's ashes fell."
    status: "first draft"
    sha256: "77a07b1878e9a0ade2a8f5a81ba74e92916ac7152681dc391decf4b445c3fef2"
  - number: "2722"
    volume: 4
    title: "Handel Lands"
    date: "1710 CE"
    region: "England"
    poem: |
      George Frideric Handel came to town —
      London's music wore his crown.
      Anthems, oratorios, water's song —
      the city's heart would sing along.
      I heard his first notes fill the hall
      and knew the greatest of them all
      had come to make the Thames resound:
      Handel's England, newly found.
    description: "George Frideric Handel arrived in London, and would give England its anthems, oratorios, and water music."
    status: "first draft"
    sha256: "433295fe6b0f14f338752e7f1715764a7166137a82e657b847d5151560eeaf58"
  - number: "2723"
    volume: 4
    title: "The South Sea Company"
    date: "1711 CE"
    region: "England"
    poem: |
      Chartered to trade with Spanish gold,
      the South Sea Company's story told
      of gambling more than honest trade —
      a bubble in the making, made.
      I watched the shares begin to climb,
      the frenzy building over time.
      The promise shone, the prospect gleamed —
      but it was never what it seemed.
    description: "The South Sea Company was chartered to trade with Spanish America — and mostly to gamble on it."
    status: "first draft"
    sha256: "376f88acef0d2ad251ed4a7e7b2ffea11756eead18d2610cc998112ccbe9f374"
  - number: "2724"
    volume: 4
    title: "The Spectator"
    date: "1711 CE"
    region: "England"
    poem: |
      Addison and Steele took up the pen
      to teach the town's good women and men
      to be witty, polite, and refined —
      over coffee, well-designed.
      I read each issue, fresh and bright,
      the essays sparkling in the light.
      London learned to laugh and think —
      the Spectator's charm, in ink.
    description: "Addison and Steele launched The Spectator, teaching London how to be witty and polite over coffee."
    status: "first draft"
    sha256: "feda22c6e2c8647c186393fbb890c1fdad894ffa1120fd974a1935b6cd3aae0e"
  - number: "2725"
    volume: 4
    title: "The Atmospheric Engine"
    date: "1712 CE"
    region: "England"
    poem: |
      Newcomen's engine pumped that year
      in Staffordshire — the miners' cheer.
      Steam and iron, fire and air:
      the Industrial Revolution's first breath there.
      I stood beside the clanking frame
      and felt the world would not be same.
      The engine breathed, the piston drove —
      the age of steam began to move.
    description: "Thomas Newcomen's steam engine started pumping at a Staffordshire mine — the Industrial Revolution's first breath."
    status: "first draft"
    sha256: "93d2c4c56b97e04c3c2b743d6f55cc3136bd57084c299923665e3df755c43f06"
  - number: "2726"
    volume: 4
    title: "Utrecht"
    date: "1713 CE"
    region: "Europe"
    poem: |
      The Treaty signed, the great war done —
      Britain had won, and France had none
      of its old glory. Gibraltar's rock,
      Nova Scotia, and the slave-trade stock.
      I watched the diplomats agree —
      the map of empires, plain to see.
      Peace at last, but at what cost?
      The human ledger, tempest-tossed.
    description: "The Treaty of Utrecht ended the great war; Britain took Gibraltar, Nova Scotia, and the slave-trade contract."
    status: "first draft"
    sha256: "66d91e0411a5d588fe241686a5d6d1229844c57c4bb6a32264faf2d443cf4386"
  - number: "2727"
    volume: 4
    title: "Corelli's Silence"
    date: "1713 CE"
    region: "Italy"
    poem: |
      Corelli died in Rome that year —
      the violinist, ever dear,
      whose concertos taught the strings to sing
      with an almost sacred, holy ring.
      I heard his Christmas Concerto play
      one final time on that sad day.
      The master of the violin's art
      had played his way into the heart.
    description: "Arcangelo Corelli died in Rome — the violinist whose concertos taught Europe how strings should sing."
    status: "first draft"
    sha256: "519c84836a061ab899e1ded6fd8274a219fad4a0a2c79eae3913604f33ec8833"
  - number: "2728"
    volume: 4
    title: "The Longitude Prize"
    date: "1714 CE"
    region: "England"
    poem: |
      Twenty thousand pounds the prize —
      for him who'd chart the sailor's skies
      and find the longitude at sea.
      The richest puzzle there could be.
      I watched the dreamers take their aim,
      each hoping for the lasting fame.
      The sea would keep its secret well
      till Harrison broke the ocean's spell.
    description: "Parliament offered £20,000 to whoever could find longitude at sea — the richest puzzle in navigation."
    status: "first draft"
    sha256: "155f667fd9baca8e811bfdff33b39c53ebb985f1a20df43f316fc7a14ca1acb0"
  - number: "2729"
    volume: 4
    title: "The First German King"
    date: "1714 CE"
    region: "England"
    poem: |
      George of Hanover took the throne,
      speaking little English, all alone
      among his ministers' English ways.
      Parliament gained in those quiet days.
      I watched him at the court's first ball,
      the German king, so strange to all.
      The crown grew distant, power near —
      the ministers' ascendancy was here.
    description: "George I of Hanover took the throne, speaking little English and trusting his ministers — Parliament's quiet gain."
    status: "first draft"
    sha256: "cc15afad46b7a0ca0d6b94c112a320c242d542dc215a574cf1576013959319fa"
  - number: "2730"
    volume: 4
    title: "The Sun Sets"
    date: "1715 CE"
    region: "France"
    poem: |
      Seventy-two years upon the throne —
      Louis the Great, now left alone.
      France was glorious, spent, and broke;
      the Sun King's final, fading smoke.
      I watched them carry him away,
      the grandest monarch of the day.
      The palace shone, the coffers bare —
      an empire's end hung in the air.
    description: "Louis XIV died after seventy-two years on the throne; France was glorious, exhausted, and bankrupt."
    status: "first draft"
    sha256: "9c233b43df8d43f510ab02acb363b638e9dabd7bc2e71bd9c636245c0af0fdde"
  - number: "2731"
    volume: 4
    title: "The Treasure Fleet Wreck"
    date: "1715 CE"
    region: "Caribbean"
    poem: |
      A hurricane scattered Spain's fleet wide
      off Florida's stormy, sandy tide.
      Divers and pirates raced the wave
      for silver in its watery grave.
      I watched them dive in the churning sea,
      each hoping rich as kings to be.
      The ocean keeps what storms have tossed —
      the treasure fleet forever lost.
    description: "A hurricane scattered Spain's treasure fleet off Florida; divers and pirates raced each other for the silver."
    status: "first draft"
    sha256: "83a320c9b055e47d7e1c2509cdf60d7c4e9bc92717ff95c83ad54696134020ff"
  - number: "2732"
    volume: 4
    title: "The Fifteen"
    date: "1715 CE"
    region: "Scotland"
    poem: |
      The Jacobites rose for the exiled line —
      the Fifteen's cause, the Stuart sign.
      The rebellion fizzled, cold and brief,
      but left the songs of love and grief.
      I heard the pipes on the Highland air
      and felt the doomed and brave despair.
      The songs would last when swords were still:
      the Stuart dream on every hill.
    description: "Jacobites rose for the exiled Stuarts; the rebellion fizzled, but the songs last forever."
    status: "first draft"
    sha256: "7e2ced6a030fc16d37f0a022f75ac630930acc0ef258048c452acea19340ad73"
  - number: "2733"
    volume: 4
    title: "Law's Bank"
    date: "1716 CE"
    region: "France"
    poem: |
      John Law founded his bank that year —
      paper money's grand frontier.
      The grandest experiment of all:
      would paper rise, or would it fall?
      I watched the notes fly hand to hand,
      the Mississippi's promised land.
      The dream was bright, the scheme was vast —
      but paper bubbles never last.
    description: "John Law founded his bank in Paris, and paper money's grandest experiment began."
    status: "first draft"
    sha256: "d9b11aeb5b14ddf4496bafcb0da517cd177eb1fbc9244c222c8f9cfe60d4a7a6"
  - number: "2734"
    volume: 4
    title: "Water Music"
    date: "1717 CE"
    region: "England"
    poem: |
      Handel's music drifted down the Thames,
      behind the king's bright royal gems.
      The river became a concert hall —
      the barges answered music's call.
      I floated in a boat nearby
      and heard the horns go sailing by.
      The Water Music, light and free —
      London's night of jubilee.
    description: "Handel's Water Music drifted down the Thames behind the king's barge — the river became a concert hall."
    status: "first draft"
    sha256: "28d5147d9efed38ca0d195f6824b5fa598c2e2c13635860a8adb0794b96eef83"
  - number: "2735"
    volume: 4
    title: "The Grand Lodge"
    date: "1717 CE"
    region: "England"
    poem: |
      Four London lodges joined as one —
      the Grand Lodge's work begun.
      Freemasonry stepped in the light,
      with aprons, secrets, and rite.
      I watched them in their quiet hall,
      the brethren answering the call.
      A brotherhood of stone and square —
      the craft's new age was in the air.
    description: "Four London lodges united as the first Grand Lodge — Freemasonry stepped into the open."
    status: "first draft"
    sha256: "22571c013171ffcd466d8cc240d290cd6116db5660e84131d0012295b63edb8f"
  - number: "2736"
    volume: 4
    title: "Blackbeard Falls"
    date: "1718 CE"
    region: "North America"
    poem: |
      Maynard cornered him at Ocracoke's shore —
      Blackbeard fought with twenty cuts or more,
      five shots within his mighty frame,
      before he fell to the lieutenant's aim.
      I watched the pirate's final stand,
      the cutlass falling from his hand.
      The terror of the Atlantic main
      would never sail the seas again.
    description: "Lieutenant Maynard cornered Blackbeard at Ocracoke; the pirate died with five shots and twenty sword-cuts in him."
    status: "first draft"
    sha256: "b5e5268988cd020098d84a748709b304b122d55266b4f5e41d811cbb871a7a25"
  - number: "2737"
    volume: 4
    title: "New Orleans Founded"
    date: "1718 CE"
    region: "North America"
    poem: |
      Bienville planted on the crescent's bend
      a French port where the rivers wend.
      New Orleans rose from swamp and mire,
      a city built on bold desire.
      I walked the muddy, nascent street
      where French and Spanish fates would meet.
      The Crescent City's humble start —
      a swamp with music in its heart.
    description: "Bienville founded New Orleans on a Mississippi crescent — a French port in a swamp of mosquitoes."
    status: "first draft"
    sha256: "dcbdfbf511bdf50aec8f60dc6e7006606277893f90821ea4efcc043c4c3f4cdf"
  - number: "2738"
    volume: 4
    title: "Robinson Crusoe"
    date: "1719 CE"
    region: "England"
    poem: |
      Defoe published the castaway's tale —
      Crusoe's shipwreck, Friday's hail.
      The novel England never'd cease
      to read: of solitude and peace.
      I read it in a single night,
      the island's lonely, long delight.
      The first true novel, some would say —
      a castaway who found his way.
    description: "Daniel Defoe published the castaway's tale — the novel England will never stop reading."
    status: "first draft"
    sha256: "0d706668f5c17eb1f67c2f20f2a2ab2b966d0e261d3e4564d4465113373d7877"
  - number: "2739"
    volume: 4
    title: "The Bubble Bursts"
    date: "1720 CE"
    region: "England"
    poem: |
      The South Sea Bubble popped that fall;
      fortunes vanished, one and all.
      In a single week, the mad game done —
      the whole wild gamble overrun.
      I watched the brokers tear their hair,
      the ruined lords in blank despair.
      The lesson writ in ink and pain:
      what rises fast will fall again.
    description: "The South Sea Bubble popped; fortunes vanished in a week, and the whole mad game was outlawed."
    status: "first draft"
    sha256: "70059bba049f73ba8b4b566af2e8619a2b3fb84453fa29b4d40ec59c377e4f22"
  - number: "2740"
    volume: 4
    title: "The Women Pirates"
    date: "1720 CE"
    region: "Caribbean"
    poem: |
      Anne Bonny and Mary Read stood trial —
      pirates both, with fearless style.
      They fought as fiercely as any man,
      and said so boldly, as they can.
      I watched them in the courtroom's glare,
      defiant, proud, beyond compare.
      The women pirates' tale was told —
      braver than the brave and bold.
    description: "Anne Bonny and Mary Read stood trial in Jamaica — pirates who fought as fiercely as any man, and said so in court."
    status: "first draft"
    sha256: "808106279ee078a343d4aede1034fe7dcf239d8788d592356a8d94445cea6256"
  - number: "2741"
    volume: 4
    title: "Nystad"
    date: "1721 CE"
    region: "Baltic"
    poem: |
      The Treaty signed at Nystad's shore —
      the Great Northern War no more.
      Russia an empire, proud and free;
      Sweden a memory of what'd be.
      I watched the borders redrawn anew,
      the Baltic's power shifting true.
      An age had ended, one begun —
      the northern star had found its sun.
    description: "The Treaty of Nystad ended the Great Northern War; Russia was an empire now, and Sweden a memory of one."
    status: "first draft"
    sha256: "f00ddf307d9fdaea32b5f8f8b0ddcd7fc2448271f4ac0bd7caa85ba7f67516c0"
  - number: "2742"
    volume: 4
    title: "The Last Pirate King"
    date: "1722 CE"
    region: "West Africa"
    poem: |
      Bartholomew Roberts met his end
      off Africa — no more to fend
      the navy's guns. The golden age
      of piracy closed its final page.
      I watched him fall in battle's heat,
      the most successful, most complete
      of pirate kings. His flag came down —
      the Jolly Roger lost its crown.
    description: "Bartholomew Roberts, the most successful pirate of the age, died in battle off Africa — the golden age of piracy died with him."
    status: "first draft"
