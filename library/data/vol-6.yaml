# Status "published": the text and numbering are final as published. A poem may still be improved later; every change is dated and the old text is kept. Numbers are permanent: new poems get numbers after 4343, nothing is ever renumbered.
entries:
  - number: "3594"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Table at Yalta"
    date: "February 1945"
    region: "Crimea"
    poem: |
      Three old men at a table by the sea,
      maps spread like a butcher's cut between them.
      I stood behind the curtains and watched them deal —
      half a continent traded in a week.
      Roosevelt dying by inches in his chair,
      Churchill smoking through his doubts,
      Stalin smiling at everything they gave.
      The war still burned. The ink was still wet.
      And nobody asked the people on the map
      if they wanted to be bargained.
    description: "Three leaders split postwar Europe over a table in Crimea while the war still raged; the traveler watched ordinary people traded like parcels nobody asked about."
    status: "published"
    sha256: "ba2d6bc372e6112a18d62910a2361bd0366efa65429e4b6912aa47c966c182e1"
  - number: "3595"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Charter for the World"
    date: "April 1945"
    region: "USA"
    poem: |
      San Francisco, spring, the bay gone silver —
      fifty flags outside the opera house.
      I walked the halls where the delegates argued,
      every tongue on earth in one long corridor,
      and watched them write a promise on paper:
      never again, they said, never again.
      I had heard men say that before.
      But I watched them sign anyway,
      because sometimes hope is all you have,
      and sometimes you have to build the house
      even when you know the storm is coming.
    description: "Fifty nations gathered in San Francisco to write the UN Charter; the traveler heard the old promise \"never again\" and watched them build hope on paper anyway."
    status: "published"
    sha256: "6529d2833c72eb5020ad68743658528d3b257570f0236fa7ce3e2e97c4fdf765"
  - number: "3596"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Guns Fall Silent in Europe"
    date: "May 1945"
    region: "Europe"
    poem: |
      The radios crackled and then went quiet,
      and a strange sound rose over the rubble —
      people laughing.
      I was in a square where the buildings stood open
      like broken teeth, and strangers danced
      in the street among the bricks.
      A woman pressed a flower into my hand
      though the flower was half ash.
      No one knew what came next.
      For one night, nobody cared.
    description: "Nazi Germany surrendered and the traveler danced with strangers in a rubble-strewn square, where one night of joy bloomed before anyone asked what came next."
    status: "published"
    sha256: "627a267c8d96fb7da6329ab04c66aa20f12274a7ed801344049e7146fbce91c1"
  - number: "3597"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Emperor Speaks"
    date: "August 1945"
    region: "Japan"
    poem: |
      For centuries he had been a god behind walls,
      silent as the moon.
      Then a voice came crackling through the wireless,
      thin and formal, reading words about enduring
      the unendurable —
      and millions knelt beside their radios
      hearing their god sound like a tired man.
      I stood in a street in Tokyo and watched
      an old woman cover her mouth with both hands.
      The war was over. The silence was broken.
      Nothing in Japan would ever be quiet in the same way again.
    description: "The Emperor's voice reached his people for the first time in history, thin through the wireless; the traveler watched a nation kneel and hear its god sound human."
    status: "published"
    sha256: "7dd97b2ad1fb27a8055df97f478c5b3619b29361b6c7fbec8db346646c165825"
  - number: "3598"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Blue Flag Rises"
    date: "October 1945"
    region: "USA"
    poem: |
      A blue flag with the world drawn on it —
      every continent, no borders,
      as if someone had finally drawn the map right.
      Fifty-one nations signed their names beneath it.
      I watched the flag go up and thought of Yalta,
      of the table and the knives.
      Paper, I thought. It is only paper.
      But I have learned, walking the long years,
      that paper is where everything human begins.
    description: "The UN Charter took effect with 51 nations under a blue flag showing a borderless world; the traveler remembered the knives of Yalta and still honored the paper."
    status: "published"
    sha256: "6e8a5dc213bb6952a94a43d795432fcccede3f100679d75cb68a6297a8a0a363"
  - number: "3599"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Justice at Nuremberg"
    date: "November 1945"
    region: "Germany"
    poem: |
      They built a courtroom in the ruins
      and sat the architects of murder in a row
      to answer for it — all of it — out loud,
      before the whole watching world.
      I sat in the gallery and listened to the tapes,
      the lists, the numbers read like weather reports,
      and watched Göring puff himself up
      in a room that would not puff with him.
      It was the first time in all my walking
      that power had to sit still and listen
      to what it had done.
    description: "Nazi leaders faced the world's first international court in ruined Nuremberg; the traveler sat in the gallery and watched power forced to sit still and hear its own crimes."
    status: "published"
    sha256: "ff7303817769747c9232813513a10cc103e02626d0ea472e3d6eb7c38d9da2a5"
  - number: "3600"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Melting Candy Bar"
    date: "December 1945"
    region: "USA"
    poem: |
      A radar engineer named Spencer
      stood too close to his magnetron
      and the chocolate in his pocket turned to soup.
      He didn't curse his luck — he grinned.
      He popped some corn with the same strange waves,
      cooked an egg till it exploded on his colleague,
      and the microwave oven was born.
      I love this about humans: the atom's fire,
      the radar that hunted bombers,
      ends up reheating your leftovers.
      The biggest powers always land
      in the smallest kitchens.
    description: "A radar engineer's pocket chocolate melted beside his magnetron, and the microwave age began; the traveler marveled that the atom's fire ended up reheating leftovers."
    status: "published"
    sha256: "e7194ad8eaa800c206e99b3dade28ab0973ed7d50a31e8a0712d44551c02d9fc"
  - number: "3601"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Assembly Convenes"
    date: "January 1946"
    region: "UK"
    poem: |
      London, winter, the hall still smelling of paint —
      the General Assembly took its seats for the first time,
      fifty-one nations arguing about seating charts
      and the order of the speeches.
      It was clumsy. It was slow.
      A janitor told me they'd run out of ashtrays by noon.
      But I watched the small countries speak
      and the big countries have to listen,
      and I thought: this clumsy room
      is the opposite of Yalta's table.
      Here, at least, the map gets a voice.
    description: "The UN General Assembly met for the first time in a paint-smelling London hall; the traveler watched small nations speak while big ones listened — the opposite of Yalta's table."
    status: "published"
    sha256: "254af70696c01222ec7361eb0c227cbed582df51299ac243e200a99ba5143b3e"
  - number: "3602"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Iron Curtain"
    date: "March 1946"
    region: "USA"
    poem: |
      In Fulton, Missouri, an old lion stood up
      and gave the thing its name.
      "From Stettin in the Baltic to Trieste in the Adriatic,"
      he said, "an iron curtain has descended."
      I was in the hall. The words fell like a portcullis.
      Half of Europe heard it on the wireless that night
      and understood, all at once,
      that the war was over but the peace was armed.
      Churchill didn't build the curtain —
      he only pointed at what Stalin had hung.
      Naming it made it real.
    description: "Churchill named the iron curtain in a Missouri hall; the traveler felt the words fall like a portcullis as half of Europe understood the peace was armed."
    status: "published"
    sha256: "2c7d2f883fc5f0ac6c589ac7ffd3e7fd96963fcda8e6c9143e1a2613ccccf7f7"
  - number: "3603"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Fire Over Bikini"
    date: "July 1946"
    region: "Pacific"
    poem: |
      They told the islanders it was for the good of mankind
      and sailed them away from their lagoon.
      Then the sky split open over Bikini —
      a second sun rising where the palms had been,
      the water standing up in a column of fire.
      I watched from a ship's deck, the light
      burning through my closed eyelids.
      The islanders never went home.
      Their atoll became a word for a swimsuit
      and a warning no one heeded.
      The bomb had a beautiful face that day,
      and it has been lying ever since.
    description: "America tested atomic bombs over Bikini atoll after sailing the islanders away; the traveler watched the sky split and saw the islanders never return home."
    status: "published"
    sha256: "4954c78366aa1cb53802d113691add42944759ebb16758aae7df89370e3d9642"
  - number: "3604"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Cannes Lights Up"
    date: "September 1946"
    region: "France"
    poem: |
      France was still sweeping up the rubble
      when it rolled out a red carpet by the sea.
      Projectors flickered in the Riviera dark
      and war-weary people laughed at flickering ghosts.
      I sat in the back row with a fisherman
      who wept through a comedy — not from the film,
      he told me, but because it had been years
      since he had sat in the dark for pleasure
      instead of hiding.
      Art came back before the roofs did.
      That tells you what humans are.
    description: "War-weary France launched a film festival on the Riviera while rubble still lined the streets; the traveler sat beside a fisherman who wept because the dark was for pleasure again."
    status: "published"
    sha256: "8c6f97a06f90ad6c3816a2a701c8551a92d0b2d8b5dc9652cbd87ea1132ced3e"
  - number: "3605"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "For Every Child"
    date: "December 1946"
    region: "USA"
    poem: |
      The war left children like driftwood —
      hungry, lost, coughing in the cold.
      So they made a fund, plain and simple:
      milk, medicine, blankets, for every child,
      no questions about whose side their fathers died on.
      I carried crates in Naples with the volunteers,
      powdered milk dust on my coat,
      and watched a boy drink as if the cup
      might be taken away.
      It wasn't. That was the whole point.
      It wasn't.
    description: "The UN created UNICEF to feed and heal the world's children regardless of side; the traveler carried milk crates in Naples and watched a boy drink as if the cup might vanish."
    status: "published"
    sha256: "5670cca49b3de356805b1e12e2c56ade6c2f5fb1c07caa949969103ead89cb76"
  - number: "3606"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Burping Lid"
    date: "1946 CE"
    region: "USA"
    poem: |
      Earl Tupper had a hunch about plastic,
      a paint can's lid, and a perfect seal —
      press the middle and it burped,
      and the leftovers stayed fresh for days.
      Housewives held parties to sell the stuff,
      neighbors buying bowls over coffee cake.
      I went to one in Ohio. The laughter,
      the clatter of lids popping like applause —
      who knew the future would arrive
      not with trumpets, but Tupperware?
    description: "Tupperware's burping airtight seal kept leftovers fresh and turned kitchen parties into a revolution; the traveler heard the future arrive in popping lids, not trumpets."
    status: "published"
    sha256: "27212f9905a1cc8607dc065261a03dcf3baf082d4a48317fdfd1948544465ed2"
  - number: "3607"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Pictures in a Minute"
    date: "February 1947"
    region: "USA"
    poem: |
      Edwin Land's little girl asked why
      she couldn't see the photo right away —
      and her father, being a genius,
      took the question seriously.
      He held up a camera, clicked,
      and pulled out a gray square that bloomed
      into a picture while we watched.
      Sixty seconds. A miracle in a minute.
      I watched a sailor photograph his girl
      and hand her the still-warm image.
      She laughed at her own face, brand new.
    description: "Edwin Land answered his daughter's question with the instant camera; the traveler watched a photograph bloom in sixty seconds and a girl laugh at her own brand-new face."
    status: "published"
    sha256: "f565523cab3638816692a7f7f9b54d6803b0d34fc5f743b0e2f2fd39bdfc2ee3"
  - number: "3608"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Truman Doctrine"
    date: "March 1947"
    region: "USA"
    poem: |
      A plain man from Missouri stood before Congress
      and drew a line around the world.
      Wherever communism pushed, he said,
      America would push back — money, guns, all of it.
      I listened from the gallery as the applause rolled,
      and felt the temperature of the century drop.
      It was honest, at least. No more pretending
      the two giants could share the playground.
      From that day on, every small war
      was a big war wearing a mask.
    description: "America vowed to fight communism everywhere; the traveler felt the century's temperature drop as every small war became a big war in disguise."
    status: "published"
    sha256: "228f29be70ae85848ad40715c4581f262d8d644df51d2c9d949a783782d0b04e"
  - number: "3609"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Marshall Lifeline"
    date: "June 1947"
    region: "Europe"
    poem: |
      America opened its wallet to a ruined continent —
      billions for bread, coal, steel, and hope,
      no humiliation clauses this time.
      They had learned from the last peace.
      I walked through a Hamburg shipyard
      where American wheat was unloading,
      and a dockworker told me his children
      had stopped asking if there would be supper.
      Nations are rebuilt the way people are:
      someone has to bring the food first.
    description: "America poured billions into rebuilding shattered Europe without humiliation clauses; the traveler watched American wheat unload in Hamburg while a dockworker's children stopped asking about supper."
    status: "published"
    sha256: "a27eafd87b076aa35c1d3cff23a4970ec525c813c0870a17b3aae138345840af"
  - number: "3610"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Freedom at Midnight"
    date: "August 1947"
    region: "India"
    poem: |
      At the stroke of midnight, the flags changed —
      India free, the British ships gone from the harbor.
      I stood in the cheering crowds in Delhi,
      and then I walked the roads west and east
      where the cheering turned to screaming.
      Partition: a line drawn through villages,
      through families, through kitchens —
      millions walking with bundles on their heads,
      trains arriving full of the dead.
      Freedom came at midnight.
      By dawn it was bleeding.
    description: "India won freedom at midnight, but partition split the land and sent millions fleeing; the traveler cheered in Delhi, then walked roads where trains arrived full of the dead."
    status: "published"
    sha256: "aadc94743c600739205fd5014ca82c556d6443552fff38315ba2fd280c20e701"
  - number: "3611"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Faster Than Sound"
    date: "October 1947"
    region: "USA"
    poem: |
      Chuck Yeager climbed into a bullet with wings
      over the Mojave, lit the rocket,
      and punched straight through the sound barrier —
      the sky cracking like a whip behind him.
      They said the plane might shake apart.
      It didn't. He landed, grinning,
      and asked for a Coca-Cola.
      I watched the contrail tear the blue open
      and thought: the old limits are made of paper.
      Every wall the world builds,
      some farm boy will fly through it.
    description: "Chuck Yeager blasted past the speed of sound in the Bell X-1 and landed asking for a Coke; the traveler watched the sky crack open and the old limits tear like paper."
    status: "published"
    sha256: "4009fb2753d74c44611628c9461a56ad6eee32be532e85855fda0aaa27554235"
  - number: "3612"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Line Drawn in Palestine"
    date: "November 1947"
    region: "Middle East"
    poem: |
      The Assembly voted, late at night —
      thirty-three hands for a line on a map,
      a Jewish state here, an Arab state there,
      Jerusalem held apart like a disputed jewel.
      I walked the streets of Jerusalem the next morning
      and heard the news pass from mouth to mouth
      like a lit match.
      By spring the match had found the fuel.
      They drew the line with a pencil.
      It has been drawn in blood ever since.
    description: "The UN voted to split Palestine into two states; the traveler walked Jerusalem the next morning and watched the news pass like a lit match toward a fire that never went out."
    status: "published"
    sha256: "3ed6187c9425dfc1b5624c631d778af4e0c0692479c057c50ec58f181ee69195"
  - number: "3613"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Tiny Switch"
    date: "December 1947"
    region: "USA"
    poem: |
      In a Bell Labs room, three men in shirtsleeves
      coaxed a sliver of germanium to do
      what a whole glowing vacuum tube had done —
      switch, amplify, sing.
      The transistor: smaller than a pea,
      and it would eat the room-sized machines
      and shrink them into pockets.
      I held one in my palm. It weighed nothing.
      It weighed nothing, and it outweighed
      every engine I had ever seen.
    description: "Bell Labs unveiled the transistor, a pea-sized switch that would shrink room-sized machines into pockets; the traveler held one and felt it outweigh every engine he'd ever seen."
    status: "published"
    sha256: "284eeb3607ebd10c04e561058d44f4b48577a6a0f42cb8b3b256dc15c27b0b46"
  - number: "3614"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Mahatma Falls"
    date: "January 1948"
    region: "India"
    poem: |
      He walked to evening prayer leaning on two girls,
      thin as a reed, smiling —
      and three shots cracked the garden quiet.
      I was in Delhi. The news ran ahead of the radio,
      a wail rising from street to street
      as if the whole city had been struck at once.
      The man who freed a nation without raising a fist
      fell to a fist raised against him.
      They say his last word was Ram.
      I believe it. He forgave to the end.
    description: "Gandhi was shot walking to evening prayer in Delhi; the traveler heard the wail rise street by street as the man who freed a nation without a fist fell to one."
    status: "published"
    sha256: "23c3885d56a5334471d7614d4985fc44398344eaadb1f4e875bdf362180c692c"
  - number: "3615"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Nation Reborn"
    date: "May 1948"
    region: "Middle East"
    poem: |
      On a Friday afternoon in Tel Aviv,
      in a museum hall under a portrait of Herzl,
      Ben-Gurion read fourteen minutes of words
      and a nation was born — Israel, at last,
      after two thousand years of waiting.
      I stood outside in the crowd as the news spread,
      people dancing in the street.
      By morning the armies were coming
      over every border. The dancing stopped.
      It has never quite started again —
      but the nation stood. It stood.
    description: "Israel declared independence in a Tel Aviv museum hall; the traveler danced with the crowds outside, then watched the armies come over every border by morning."
    status: "published"
    sha256: "7d053afd93e3f07c858bd37df4e4d280dc8d8d79db9b9e68b7dac386b19c5768"
  - number: "3616"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Blockade"
    date: "June 1948"
    region: "Germany"
    poem: |
      Stalin slammed the roads and rails shut —
      two million West Berliners, no food, no coal,
      winter coming like a white wolf.
      So the Allies took to the sky.
      I stood at Tempelhof and watched them come,
      a plane every three minutes, day and night,
      flour and coal falling out of the clouds.
      The pilots tossed candy to the children
      on little parachutes — the candy bombers.
      A city lived on airlifted bread.
      Stalin blinked. The planes kept coming.
    description: "Stalin sealed off West Berlin, and the Allies answered with a round-the-clock airlift; the traveler watched candy parachutes fall to children as a city lived on bread from the sky."
    status: "published"
    sha256: "5afbbe9895761bf4aa5d5ab1d7695277f4d23095ec568ea404e660c991ecb311"
  - number: "3617"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Health for Everyone"
    date: "July 1948"
    region: "UK"
    poem: |
      Britain was broke and bombed and tired —
      and decided, anyway, that no one
      should die for being poor.
      The National Health Service opened its doors:
      doctors, hospitals, medicine — free,
      for everyone, forever, paid by all.
      I stood outside a Manchester clinic
      on the first morning and watched a queue
      of mill workers and mothers stretch around the block,
      grinning like they'd won the pools.
      A nation that had shared the bombs
      decided to share the healing.
    description: "Britain launched the National Health Service, making care free for all; the traveler watched a queue of mill workers stretch around a Manchester clinic, grinning like winners."
    status: "published"
    sha256: "3139f43373d4a0bc2351c98f7f7e820fbd1c0c96f3fd284ed690e7aabe1238e8"
  - number: "3618"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Golden Arches Rise"
    date: "August 1948"
    region: "USA"
    poem: |
      Two brothers in San Bernardino
      threw out the carhops and the dishes,
      timed the grill with stopwatches,
      and sold a burger in fifteen seconds flat —
      fifteen cents, wrapped in paper.
      I ate one standing at the counter.
      It was hot, fast, and exactly the same
      as the one the man next to me got.
      Sameness, speed, and golden arches —
      America had invented a new kind of church,
      and everybody was about to join.
    description: "The McDonald brothers sold fifteen-cent burgers in fifteen seconds flat; the traveler ate one standing up and watched America invent a new kind of church with golden arches."
    status: "published"
    sha256: "dfb9142f584219b5747c1a8b6abcde36b6846f89405af326652e7f88af2ee883"
  - number: "3619"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Rights for All People"
    date: "December 1948"
    region: "France"
    poem: |
      In Paris they wrote it down at last —
      thirty articles, plain as bread:
      every human being holds these rights,
      no exceptions, no asterisks.
      Eleanor Roosevelt held the paper up
      like a lantern.
      I read it standing in the corridor,
      and the words were so simple
      they made the century's horrors
      sound like a mistake the world
      was finally correcting.
      Paper again. But what paper.
    description: "The UN declared universal human rights in thirty plain articles; the traveler read them in a Paris corridor and felt the century's horrors named as a correctable mistake."
    status: "published"
    sha256: "47ef21e34762ab2bf774546d4d9c26423f660939f11b4e9583732481b8da2925"
  - number: "3620"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Atlantic Pact"
    date: "April 1949"
    region: "Europe"
    poem: |
      Twelve nations signed in Washington —
      an attack on one is an attack on all.
      NATO: a shield forged of treaties,
      a promise written in armies.
      I watched the foreign ministers file out,
      grim and relieved at once,
      like men who had bought insurance
      against a fire they could already smell.
      It held. For all its faults and fears,
      the line held, and Europe never burned again.
    description: "Twelve nations signed NATO, vowing an attack on one meant war with all; the traveler watched grim, relieved ministers buy insurance against a fire they could already smell."
    status: "published"
    sha256: "8d4a25bd80b985f6f7f12e426012152b87ae31ef1daea4b6238f493a2c692e3c"
  - number: "3621"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Two Germanys"
    date: "May 1949"
    region: "Germany"
    poem: |
      One nation, cut in two like a photograph torn —
      the West born in May, the East in October,
      two flags, two anthems, two futures.
      I walked the border roads where farmers
      waved at cousins they could no longer visit,
      where the same language split into two truths.
      Families learned to write letters
      through a wall of paper and soldiers.
      Germany became the Cold War's body:
      one heart, beating in two chests,
      neither allowed to touch the other.
    description: "Germany split into East and West, two flags over one people; the traveler walked border roads where farmers waved at cousins they could never visit."
    status: "published"
    sha256: "d4914988ed0d669824dc3665efda9b63c04c73746bc5a1d295218de8c7936d55"
  - number: "3622"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Big Brother Is Born"
    date: "June 1949"
    region: "UK"
    poem: |
      A dying man on a Scottish island
      wrote the century's warning between coughs —
      a boot stamping on a human face, forever,
      telescreens in every room, truth edited daily.
      I read 1984 the week it came out,
      in a London still rationing bread,
      and the chill it gave me had nothing to do
      with the weather.
      Orwell didn't invent Big Brother.
      He recognized him, early,
      and wrote down the face.
    description: "Dying on a Scottish island, Orwell published 1984 and its all-seeing Big Brother; the traveler read it in rationed London and felt a chill no weather could explain."
    status: "published"
    sha256: "bd5a500f4ede29e66e04d2f8bf2c7ea87796fe1df1968ac9e20f67f8f6fc37e3"
  - number: "3623"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Jet Age Takes Off"
    date: "July 1949"
    region: "UK"
    poem: |
      The Comet rose off the runway
      without propellers — just a smooth, eerie push,
      four ghost-engines, and suddenly London
      was hours closer to everywhere.
      I was aboard an early flight, pressed to the window,
      watching the clouds fall away below
      faster than any bird.
      The passengers applauded the landing
      like a theater crowd.
      They didn't know it yet, but the world
      had just shrunk to the size of a day.
    description: "Britain's Comet flew as the first jet airliner; the traveler pressed to the window and watched the world shrink to the size of a day."
    status: "published"
    sha256: "fe54eab1c08b305aeb0dab5dd4df734e16c0a9083484485c104a19bd1d1aecfe"
  - number: "3624"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Soviets Get the Bomb"
    date: "August 1949"
    region: "USSR"
    poem: |
      In the Kazakh desert, before dawn,
      the sky lit up a second time in human history —
      the Soviets had the bomb.
      America's monopoly lasted four years.
      Four years.
      I felt the news land in Washington
      like a stone in still water:
      the ripples are still spreading.
      From that morning on, every quarrel
      between the giants carried the same whisper —
      we could end the world before lunch.
      They never did. That is the marvel.
    description: "The USSR detonated its first atomic weapon, ending America's four-year monopoly; the traveler felt the news land like a stone whose ripples never stopped spreading."
    status: "published"
    sha256: "42876adf0e2bc15c88054f6fd9412fa5d90a21dd2bc1f4f95ee6847e0b3aed6d"
  - number: "3625"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Red China Rises"
    date: "October 1949"
    region: "China"
    poem: |
      From the Gate of Heavenly Peace,
      Mao's voice rolled over Tiananmen Square —
      the People's Republic, proclaimed,
      a quarter of humanity under one red flag.
      I stood at the edge of the cheering sea
      and watched the Nationalists' ships
      already fading toward Taiwan.
      Dynasties fall; this one fell to peasants
      with rifles and a Little Red Book on the way.
      The world map turned red across the middle,
      and the Cold War got its second front.
    description: "Mao proclaimed the People's Republic over Tiananmen Square as Nationalist ships faded toward Taiwan; the traveler watched the world map turn red across its middle."
    status: "published"
    sha256: "13cb2f787188bddc9d08807ed9fb243a65387d1ce1f84a734fa6e1d349fb78cb"
  - number: "3626"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Clicking Bricks"
    date: "1949 CE"
    region: "Denmark"
    poem: |
      A Danish carpenter who made wooden toys
      started molding little plastic bricks
      that clicked together — click, click —
      and held.
      I knelt on a Copenhagen floor with a child
      and we built a tower, then a bridge,
      then a whole clicking city.
      Fifty years of children have done the same
      in a hundred languages.
      The brick doesn't care what country you're in.
      It only asks: what will you build next?
    description: "LEGO's interlocking bricks reached children's hands and started stacking into everything; the traveler built a clicking city on a Copenhagen floor and heard the brick ask only what comes next."
    status: "published"
    sha256: "bf93b7809df613b1645a43c13d0048723f6600b9a5868a7f3fb803fc32d939d6"
  - number: "3627"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "War in Korea"
    date: "June 1950"
    region: "Korea"
    poem: |
      Dawn, June 25th — tanks rolling south
      across the 38th parallel, artillery
      waking Seoul like an earthquake.
      I was there within days, and the roads
      were rivers of refugees, bundles and babies,
      while the UN voted to fight back
      and America marched in under a blue flag.
      Three years. Millions dead.
      A peninsula broken in half, still broken.
      They called it a police action.
      The dead didn't care what it was called.
    description: "North Korea invaded the South and the UN voted to fight back; the traveler walked refugee roads for three years of war that broke a peninsula in half."
    status: "published"
    sha256: "3d69834e89d9a4a2a9ad01c2d9c79421cbbd9f8faa0d4fee135f7912f470c209"
  - number: "3628"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Apartheid Laws"
    date: "July 1950"
    region: "South Africa"
    poem: |
      They wrote hatred into the law books —
      where you could live, whom you could marry,
      which bench, which beach, which door.
      Apartheid: the ugliest word I ever learned,
      made official with stamps and signatures.
      I sat in a Johannesburg courtroom
      and watched a man sentenced for loving
      across the color line.
      The law was neat. The law was typed.
      Evil, I learned that day, loves paperwork.
    description: "South Africa wrote racial separation into law — benches, beaches, marriages; the traveler watched a man sentenced for love and learned that evil loves paperwork."
    status: "published"
    sha256: "da304b051f29e07856cbd770f4c9f3979f52886c8e0695e8a6aa50fda5950640"
  - number: "3629"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Good Grief, Charlie Brown"
    date: "October 1950"
    region: "USA"
    poem: |
      A round-headed kid with a zigzag shirt
      missed the football, lost the kite,
      and said what everyone was thinking.
      I read Peanuts in the morning paper
      over coffee in a thousand diners,
      and the whole country saw itself:
      anxious, hopeful, swinging and missing.
      Schulz drew the Cold War's quiet truth —
      the bomb might fall, the world might end,
      but Charlie Brown would still try to kick.
      Good grief. Exactly.
    description: "The Peanuts strip debuted with its round-headed everyman; the traveler read it over diner coffee and saw a whole anxious country swinging and missing, then swinging again."
    status: "published"
    sha256: "b685f320ee11160fc0fab9fc97f06e6e642cfb0aa4654f5b4985610a24539acf"
  - number: "3630"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Roof of the World Falls"
    date: "October 1950"
    region: "Tibet"
    poem: |
      The soldiers came over the high passes,
      boots on the snowfields where monks had walked
      for a thousand silent years.
      I stood in Lhasa as the prayer flags snapped
      in the wind of a new order —
      monasteries emptied, statues melted,
      the Dalai Lama a boy-king watching his kingdom
      fold like a tent.
      Tibet had kept the world out for centuries.
      The world came in anyway, marching.
    description: "Chinese troops marched into Tibet and ended the mountain kingdom's freedom; the traveler stood in Lhasa as prayer flags snapped over emptied monasteries."
    status: "published"
    sha256: "0673cf4089891a16890e68efbc1206f1790c8d446c2902092e96fed8a7d54910"
  - number: "3631"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Dinner on Plastic"
    date: "1950 CE"
    region: "USA"
    poem: |
      A businessman forgot his wallet at dinner,
      was embarrassed in front of a client,
      and invented the future out of spite:
      a little cardboard card that said
      eat now, pay later.
      Diners Club. The credit card.
      I watched the idea spread from restaurant to restaurant
      like a rumor of free money.
      Nobody understood yet that the card
      wasn't about dinner at all —
      it was about teaching the world to buy
      what it couldn't afford.
    description: "The Diners Club card let diners pay later after a businessman's forgotten wallet; the traveler watched the rumor of free money spread and saw the world learn to buy what it couldn't afford."
    status: "published"
    sha256: "c1dccac97ef0515c7a53621f5237fb8f9ded010cd9f272522998b853989f7c2a"
  - number: "3632"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Lazy Bones"
    date: "1950 CE"
    region: "USA"
    poem: |
      Zenith sold a box on a long wire —
      point it at the TV, click, the channel changes,
      and nobody ever has to stand up again.
      They called it Lazy Bones. Honest name.
      I sat in a living room in Chicago
      and watched a man surf three channels
      without moving anything but his thumb.
      It seemed like a joke. It wasn't.
      That little click was the first step
      toward a world that never leaves the couch.
    description: "Zenith's wired remote let viewers change channels from the couch; the traveler watched a man surf three channels with one thumb and saw the first step toward a world that never stands up."
    status: "published"
    sha256: "d04df164fd1656278f705de6b43891aea0b5ada827ede0ece4a8c9859eff7e54"
  - number: "3633"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Immortal Cells"
    date: "January 1951"
    region: "USA"
    poem: |
      Henrietta Lacks went in for treatment
      and came out of history —
      but her cells stayed.
      Taken without her knowing, without her name,
      they doubled and doubled in dishes worldwide,
      outliving her, outliving everyone who took them,
      testing polio vaccines, riding to the moon's labs,
      immortal in glass.
      I have walked beside kings whose names are dust.
      This poor woman's cells will outlive us all —
      and for decades, nobody even knew her name.
    description: "Henrietta Lacks's cells, taken without her knowledge, lived on in labs worldwide, testing vaccines and outliving everyone; the traveler mourned that her name stayed unknown for decades."
    status: "published"
    sha256: "f5eb28e4cbac01602dc92d3b0bc86fa627f58908751c02aa71151fdf40bb70f2"
  - number: "3634"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The General Is Fired"
    date: "April 1951"
    region: "Korea"
    poem: |
      MacArthur wanted a bigger war —
      bombs, maybe the big one, on China.
      Truman, the little man from Missouri,
      said no, and fired the legend by radio.
      I was in Tokyo when the order came down,
      and the headquarters went silent as a church.
      The general packed his medals and left,
      and the republic held:
      the soldier obeys the civilian.
      That is the whole difference
      between an army and a mob with flags.
    description: "Truman sacked MacArthur for defying orders in Korea; the traveler felt a Tokyo headquarters go church-silent as the republic proved the soldier obeys the civilian."
    status: "published"
    sha256: "2f22b14e512bd6ba050f2397a9b35f4de5ee27eb2af8586469bce64646ddb742"
  - number: "3635"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Television Turns Color"
    date: "June 1951"
    region: "USA"
    poem: |
      The gray screen bloomed.
      CBS flickered color into living rooms —
      roses actually red, the sky actually blue —
      and families gathered to watch a test pattern
      as if it were the Second Coming.
      I squeezed into a neighbor's parlor
      with twelve other people to see it.
      We ooh'd at a flower. A flower!
      The world had been gray for years.
      That night, it remembered it was colorful.
    description: "Color TV flickered on and the gray screen bloomed; the traveler squeezed into a crowded parlor where twelve people oohed at a test-pattern flower."
    status: "published"
    sha256: "fa46463045e9cef3c8d0140128a137417a33732ac0f011628f682904c6730e6f"
  - number: "3636"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Pacific Pact"
    date: "September 1951"
    region: "Oceania"
    poem: |
      Australia, New Zealand, America —
      three signatures on the ANZUS treaty,
      a promise stretched across the Pacific
      like a lifeline thrown between ships.
      I was in Sydney when the news broke,
      and the old diggers nodded slowly:
      after two wars, someone finally wrote down
      that the far side of the world
      would not stand alone.
      Empires were shrinking.
      Friendships were being signed instead.
    description: "Australia, New Zealand, and America signed the ANZUS defense treaty; the traveler watched old soldiers nod in Sydney as the far side of the world was promised it wouldn't stand alone."
    status: "published"
    sha256: "77279015f8f29e95d2e098ce1778b4dca3a06332e68ce35db68a09cdda51b926"
  - number: "3637"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Atoms Light a Bulb"
    date: "December 1951"
    region: "USA"
    poem: |
      In the Idaho desert, a reactor hummed,
      and four light bulbs glowed —
      the first electricity ever coaxed
      from the split atom for peaceful use.
      Four bulbs. A string of Christmas lights
      powered by the fire of stars.
      I stood in that control room and laughed out loud.
      After Hiroshima, after Bikini,
      the atom lit a bulb instead of a city.
      For one bright moment, the genie
      looked like it might behave.
    description: "An Idaho reactor made the first electricity from nuclear power — four glowing bulbs; the traveler laughed in the control room as the atom lit a bulb instead of a city."
    status: "published"
    sha256: "00b41b4e8aaeaa113dc64b9b6f29b605188c7fc0accb5730957876ba45636c02"
  - number: "3638"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Libya Steps Free"
    date: "December 1951"
    region: "Libya"
    poem: |
      The first African colony to walk free
      after the war — Libya, independent,
      a king, a flag, oil still sleeping underground.
      I watched the celebrations in Tripoli,
      drums and green banners,
      and an old man told me he'd waited
      forty years for this day.
      He was right to celebrate.
      He was right, too, that freedom
      is only the first hard step.
      Africa was stirring. The wave was coming.
    description: "Libya became independent, Africa's first freed colony after the war; the traveler watched Tripoli celebrate with an old man who had waited forty years for the day."
    status: "published"
    sha256: "53c3ccfbfb85be9c3fc9fb97fb59af1721f588685e69c90990f64d24117095a3"
  - number: "3639"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Young Queen"
    date: "February 1952"
    region: "UK"
    poem: |
      The king died in his sleep at Sandringham,
      and a twenty-five-year-old princess,
      up a tree in Kenya watching elephants,
      came down a queen.
      Elizabeth. I watched the newsreels
      in a London cinema, the crowds
      already lining the Mall in the rain.
      She would reign for seventy years —
      longer than anyone imagined that gray February.
      A new age got its face that day:
      young, dutiful, unblinking.
    description: "Elizabeth took the throne at twenty-five after her father's death; the traveler watched rain-soaked crowds line the Mall for a queen who would reign seventy years."
    status: "published"
    sha256: "0e9f925c973759375a81549f95f7a52a404d1a3ec177aee222ee97f289c0cfdb"
  - number: "3640"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Diary Speaks"
    date: "June 1952"
    region: "Europe"
    poem: |
      A girl hid in an Amsterdam attic
      and wrote to an imaginary friend named Kitty —
      jokes, dreams, fear, first love —
      and the Nazis took her anyway.
      But the diary lived.
      I read it in English the year it crossed the sea,
      sitting up all night, and Anne's voice
      filled my room like she was hiding
      in the next room over.
      Six million murdered, and this one voice —
      fifteen years old, funny, furious, alive —
      became the voice of all of them.
    description: "Anne Frank's diary reached English readers; the traveler read it through the night and heard one fifteen-year-old's funny, furious voice speak for six million."
    status: "published"
    sha256: "cce8978541841888e691e226950bf37968cd22b8a84100635f64600788e10961"
  - number: "3641"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Britain Joins the Club"
    date: "October 1952"
    region: "Australia"
    poem: |
      Off the Montebello Islands, the sea
      turned to fire for a fraction of a second —
      Britain's first atomic bomb,
      the third member of the terrible club.
      I watched the newsreel in a pub in Perth,
      sailors cheering at a mushroom cloud
      on a flickering screen.
      Nobody cheered for long.
      Three nations could now end the world,
      and the empire that built the bomb
      was already fading into memory.
    description: "Britain exploded its first atomic bomb off Australia, joining the terrible club; the traveler watched sailors cheer at a newsreel mushroom cloud, then fall silent."
    status: "published"
    sha256: "166e15299c06b7da1ddac5fb2091728e56f17a0c514e89b1c64997ccb224e79e"
  - number: "3642"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The H-Bomb"
    date: "November 1952"
    region: "Pacific"
    poem: |
      They called the test Mike.
      It vaporized an island — Elugelab,
      gone, a crater a mile wide in the lagoon —
      ten million tons of TNT from a box
      the size of a small house.
      A thousand Hiroshimas in one flash.
      I saw the films later, the fireball
      climbing into the stratosphere,
      and understood that the bomb
      had stopped being a weapon
      and become a weather system.
      After Mike, war between giants
      meant the end of the sky.
    description: "America's hydrogen blast vaporized the island of Elugelab — a thousand Hiroshimas in one flash; the traveler saw the fireball films and understood the bomb had become a weather system."
    status: "published"
    sha256: "d8544210cdf3f54ed28d3f2767c170e597dc9cca4eb1e429bf5b00a4657aa8c7"
  - number: "3643"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Summer of Fear"
    date: "November 1952"
    region: "USA"
    poem: |
      Polio's worst year: pools drained,
      playgrounds empty, mothers ironing fear
      into every folded shirt.
      I walked through a suburb in August
      and heard nothing — no children shouting,
      no bikes, just sprinklers hissing
      on empty lawns.
      Fifty-eight thousand cases.
      Parents waited for a vaccine
      the way you wait for rain in a drought.
      It came. But that summer,
      fear was the weather.
    description: "Polio's worst year emptied America's pools and playgrounds; the traveler walked silent suburbs where fear was the weather and parents waited for a vaccine like rain."
    status: "published"
    sha256: "90990d34d458b5c0f1ce76d2f5bf59bc7b8c60e774a4029182af7f1e03ebd5c5"
  - number: "3644"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Noughts and Crosses on a Screen"
    date: "1952 CE"
    region: "UK"
    poem: |
      At Cambridge, a giant computer
      with vacuum tubes like organ pipes
      learned to play tic-tac-toe —
      noughts and crosses glowing green
      on a tiny round screen.
      OXO, they called it. The first video game.
      I watched a researcher lose to the machine
      and laugh about it.
      Nobody in that lab imagined
      that this blinking grid
      would eat the world's spare hours.
      They were just teaching lightning
      to play a children's game.
    description: "A Cambridge computer played tic-tac-toe on a glowing screen — the first video game; the traveler watched a researcher lose to the machine and laugh, never guessing it would eat the world's hours."
    status: "published"
    sha256: "0ddb016ca5f782137e061a77de8d63f11208cbd824995fe4a0f41cb85f556dc1"
  - number: "3645"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Ike Takes Charge"
    date: "January 1953"
    region: "USA"
    poem: |
      The general who beat Hitler
      took the oath in the January cold,
      promising to end the war in Korea
      and calm a frightened nation.
      I stood in the crowd on the Mall,
      watching Eisenhower's plain face
      under the top hat.
      America wanted a father that year,
      and it got one — steady, dull, decent.
      Sometimes history doesn't need a genius.
      Sometimes it just needs a grown-up.
    description: "War hero Eisenhower became president promising to end the Korean War; the traveler watched the plain face under the top hat and saw a nation choose a grown-up over a genius."
    status: "published"
    sha256: "0997114d6d25f679044ea45143ce0fed413fd0b52064ceb2dc7be76f499d6f72"
  - number: "3646"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Stalin Is Dead"
    date: "March 1953"
    region: "USSR"
    poem: |
      The tyrant died on his dacha floor,
      alone for hours, his guards too terrified
      to check on him.
      When the news broke, an empire held its breath —
      twenty million dead by his orders,
      and now the hand was still.
      I was in Moscow. The queues for the funeral
      stretched for miles; people wept,
      some from grief, some from relief,
      most not knowing which.
      The thaw would come. But first,
      the long, strange silence
      of a prison when the warden dies.
    description: "Stalin died alone on his dacha floor, his guards too terrified to check; the traveler watched Moscow's miles-long funeral queues weep without knowing whether from grief or relief."
    status: "published"
    sha256: "9eccbfcd8266a15f4ad8e8abc951abcc20e8fb733d301175e6919c7e5fed709d"
  - number: "3647"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Secret of Life"
    date: "April 1953"
    region: "UK"
    poem: |
      Two young men, a stack of X-ray photos,
      some tin models and borrowed math —
      and the double helix clicked into place.
      Watson and Crick saw it: DNA,
      a twisted ladder, the instruction book
      for every living thing, written in four letters.
      I was in the Cambridge pub that day
      when Crick announced they'd found
      the secret of life.
      He wasn't bragging. He was right.
      Everything — you, me, the sparrow —
      is spelled out in that spiral.
    description: "Watson and Crick revealed DNA's double helix in Cambridge; the traveler heard Crick announce the secret of life in a pub and knew he wasn't bragging — he was right."
    status: "published"
    sha256: "1a0879bd8e20fc15243fd224859f5842f2616a4136f765be40b6b2e42eb23157"
  - number: "3648"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Top of the World"
    date: "May 1953"
    region: "Nepal"
    poem: |
      Hillary and Norgay climbed through the death zone,
      oxygen thin as rumor,
      and stood where no human had stood —
      the summit of Everest, the roof of the world.
      I waited at base camp when the news came down,
      and the cheer rolled through the tents
      like an avalanche of joy.
      They left a crucifix and some biscuits.
      The mountain didn't care.
      But humanity did: we had touched the top
      of everything, and looked down,
      and the view was ours.
    description: "Hillary and Norgay stood on Everest's summit, the roof of the world; the traveler heard the cheer avalanche through base camp as humanity touched the top of everything."
    status: "published"
    sha256: "472584cb69e6edc955ff84b9da9270fdd127a428075e018b9fe4b4125be3b1bd"
  - number: "3649"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Berlin Rises"
    date: "June 1953"
    region: "Germany"
    poem: |
      The East German workers downed their tools —
      no more quotas, no more lies —
      and marched on Berlin, tens of thousands,
      the first revolt behind the iron curtain.
      I was in the crowd on Leipziger Strasse
      when the Soviet tanks rolled in,
      treads shaking the pavement.
      They crushed it in a day.
      But I never forgot the faces:
      ordinary people, unafraid for one morning,
      learning that the empire
      was scared of bricklayers.
    description: "East Germans revolted against Soviet rule and were crushed by tanks; the traveler stood on Leipziger Strasse and saw ordinary people learn the empire feared bricklayers."
    status: "published"
    sha256: "5e1061d1591f58392e42a891ddfdd0d10b1b35dc2c50d46381878be2bba52dfc"
  - number: "3650"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Guns Pause in Korea"
    date: "July 1953"
    region: "Korea"
    poem: |
      At Panmunjom, in a hut built for the occasion,
      they signed the armistice —
      not peace, a pause.
      The guns stopped at ten that night.
      I walked the line the next morning,
      and the silence was the strangest sound
      I'd heard in three years.
      Korea stayed split, the wire stayed up,
      the war technically never ended.
      Millions dead for a line on a map
      drawn exactly where it started.
    description: "An armistice paused the Korean War without peace; the traveler walked the silent line the next morning past a war that ended exactly where it started."
    status: "published"
    sha256: "50a33481f9a2ba1d7154be7181603587eabb2d88e739aff3ba28c9595a684a59"
  - number: "3651"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Shot Against Polio"
    date: "1953 CE"
    region: "USA"
    poem: |
      Jonas Salk stood up and said it plainly:
      the vaccine works. It's safe.
      No patents, no fortune — he gave it away.
      When they asked who owned the patent,
      he said, "The people."
      I was there for the announcement,
      and the applause sounded like rain
      after a drought.
      Children would line up for the shot,
      sugar cubes and needles,
      and the summer of fear would end.
      One man, one lab, and mercy
      in a syringe.
    description: "Salk announced his polio vaccine and gave it to the people, patent-free; the traveler heard the applause fall like rain after drought as the summer of fear prepared to end."
    status: "published"
    sha256: "f151d3b095cd163778bf5fd57756226f0b2baa9db9856b652c2026f85b3d317a"
  - number: "3652"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Atomic Submarine"
    date: "January 1954"
    region: "USA"
    poem: |
      The Nautilus slid into the Thames River,
      black and silent, with a reactor for a heart —
      she could stay submerged for months,
      circle the globe without surfacing.
      "Underway on nuclear power," the captain signaled,
      and naval warfare changed forever.
      I watched her from the dock,
      this steel whale with a star inside.
      The atom had lit a bulb in Idaho.
      Now it swam the oceans, invisible,
      carrying the thunder with it.
    description: "The USS Nautilus sailed on nuclear power, able to stay submerged for months; the traveler watched the steel whale leave dock carrying a star — and the thunder — inside."
    status: "published"
    sha256: "c5bca971b44255302398ae6096a9c0ef007510695bf32f90b6bbb3b485d14f92"
  - number: "3653"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Dien Bien Phu"
    date: "May 1954"
    region: "Vietnam"
    poem: |
      The French built a fortress in a valley
      and dared the jungle to come —
      and Giap brought the jungle,
      artillery dragged up mountainsides by hand.
      Fifty-five days. Then the white flag.
      I walked the shattered valley afterward,
      red earth, broken wire,
      and watched an empire's Asian century
      end in the mud.
      The French went home.
      America was already packing its bags
      for the same valley.
    description: "France's jungle fortress at Dien Bien Phu fell to Ho Chi Minh's forces after fifty-five days; the traveler walked the shattered valley as one empire left and another packed its bags."
    status: "published"
    sha256: "f125bb392a2c9b7ce90fa3abba5d23e4dec832daa37d3b2adc284904318de914"
  - number: "3654"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Separate Is Not Equal"
    date: "May 1954"
    region: "USA"
    poem: |
      Nine justices, one voice, unanimous:
      separate is not equal.
      Brown v. Board struck down segregated schools,
      and the law finally said what the heart knew.
      I sat in the courtroom that morning.
      Thurgood Marshall wept — the great lawyer,
      tears on his cheeks like rain on stone.
      Outside, the South began sharpening its knives.
      But the words were on paper now,
      and paper, as I keep learning,
      is where everything human begins.
    description: "America's highest court outlawed segregated schools in Brown v. Board; the traveler watched Thurgood Marshall weep in the courtroom as the words went onto paper."
    status: "published"
    sha256: "35182c97450a7080c2b04b05d5f50da5515e4e69a260bd669335198e043fd50e"
  - number: "3655"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Vietnam Split in Two"
    date: "July 1954"
    region: "Vietnam"
    poem: |
      In Geneva they drew another line —
      the 17th parallel, Vietnam cut in half,
      elections promised in two years.
      The elections never came.
      I watched families choose sides at the docks,
      boats loading for the south,
      some waving, some stone-faced.
      A temporary line, they said.
      Temporary the way Korea's was temporary.
      The war would return, wearing new flags.
      It always does, when lines are drawn
      by men who won't live beside them.
    description: "The Geneva Accords divided Vietnam at the 17th parallel with promised elections that never came; the traveler watched families choose sides at the docks before the war returned."
    status: "published"
    sha256: "ac26f90fe0a7a550ea3fa44224b23351f287247afe9b6750ea9e4b8cbe5f5655"
  - number: "3656"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Algeria's Long War"
    date: "November 1954"
    region: "Algeria"
    poem: |
      On All Saints' Day the bombs went off —
      the FLN's opening shots in eight years
      of the ugliest war France ever fought.
      I walked the Casbah in those years,
      past soldiers and shadows,
      torture in the cellars, terror in the cafes.
      A million dead before it ended.
      France called Algeria its own soil
      and bled itself white proving it wasn't.
      Empires don't fall all at once.
      They fall street by street, in the dark.
    description: "Algerian rebels rose against France, beginning eight bloody years; the traveler walked the Casbah past soldiers and shadows as an empire bled itself white street by street."
    status: "published"
    sha256: "da82a04ad4bc825fe8c3f5598206c216bbc8d291153a206bf08b9da0b438bfee"
  - number: "3657"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Kidney for a Brother"
    date: "December 1954"
    region: "USA"
    poem: |
      In a Boston operating room,
      surgeons took a kidney from one twin
      and gave it to the other —
      and it worked. It kept working.
      The first successful organ transplant.
      I stood outside the recovery ward
      and watched the donor brother grin
      through his stitches.
      He'd given away a piece of himself
      and gotten his brother back.
      Medicine had crossed a new border:
      the body itself, shared.
    description: "Surgeons transplanted a kidney between twins in Boston — the first success; the traveler watched the donor grin through his stitches, having traded a piece of himself for his brother."
    status: "published"
    sha256: "726f4fbb38a98b8c09661127a246901b21bf265d8754161578293a980cccc92d"
  - number: "3658"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The All-Clear for Salk"
    date: "April 1955"
    region: "USA"
    poem: |
      The trial results came in —
      1.8 million children, the biggest test in history —
      and the vaccine was safe. It worked.
      Church bells rang. Factories blew their whistles.
      I was in a schoolyard when the news came,
      and the teachers wept openly,
      hugging the kids.
      A generation was saved that day,
      not by armies or treaties,
      but by a needle, a sugar cube,
      and a man who wouldn't take a patent.
    description: "The polio vaccine was declared safe and effective after the largest trial in history; the traveler watched teachers weep in a schoolyard as church bells rang for a needle and a sugar cube."
    status: "published"
    sha256: "b16b50eddb9d5b5d17d3d528c4ed1340678b497d46c03d0717a0bc28519b42db"
  - number: "3659"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Speedee Goes Nationwide"
    date: "April 1955"
    region: "USA"
    poem: |
      Ray Kroc, a milkshake-machine salesman,
      saw the McDonald brothers' burger stand
      and saw the future in fifteen seconds.
      He opened the first franchise in Des Plaines —
      same burgers, same fries, same golden arches,
      everywhere.
      I ate at that first one.
      The fries tasted like all the fries to come.
      Kroc didn't invent the burger.
      He invented the everywhere of it.
    description: "Ray Kroc opened the first McDonald's franchise in Des Plaines; the traveler ate there and tasted the future — not the burger invented, but the everywhere of it."
    status: "published"
    sha256: "7641f0a5a2f874e9f13d7433f3c3da98a4c6d169ed317c1b9bee0b76413131a1"
  - number: "3660"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Warsaw Pact"
    date: "May 1955"
    region: "Europe"
    poem: |
      The East signed its own alliance —
      eight nations, one command, Moscow's hand
      on every trigger.
      The Warsaw Pact: NATO's mirror,
      drawn in the same cold ink.
      I read the treaty text in a Warsaw café,
      and the waiter whispered that his brother
      had been drafted into it.
      Two shields now, facing each other
      across a divided continent,
      each promising peace
      by preparing perfectly for war.
    description: "The Soviet bloc signed the Warsaw Pact, NATO's mirror; the traveler read the treaty in a Warsaw café while a waiter whispered his brother had been drafted into it."
    status: "published"
    sha256: "5ab20e918ea2e4c2c772f17dbdad7fea5ebd9fa53cb67711b4266bc9ddbda022"
  - number: "3661"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Happiest Place"
    date: "July 1955"
    region: "USA"
    poem: |
      Disney opened his dream in Anaheim —
      a kingdom of plaster castles and mouse ears,
      where the pavement was washed every night
      and every child was royalty.
      Opening day was a disaster: rides broke,
      paint was wet, the asphalt melted.
      I was there, sweating through it,
      and the kids didn't care at all.
      They were in the story.
      Walt had built the first place on earth
      designed entirely for wonder —
      and wonder doesn't care about wet paint.
    description: "Disneyland opened in California — rides breaking, paint wet, asphalt melting; the traveler sweated through opening day while the children, inside the story, didn't care at all."
    status: "published"
    sha256: "807a5868489a218fea9e70a2d2737861326fd71d9206b46f70dd30c9236c7080"
  - number: "3662"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Murder of Emmett Till"
    date: "August 1955"
    region: "USA"
    poem: |
      Fourteen years old, from Chicago,
      visiting Mississippi —
      killed for whistling, maybe,
      for being Black and unafraid, certainly.
      His mother held an open casket
      so the world would see what they did.
      I stood in that funeral line in Chicago.
      The boy's face — I won't describe it.
      You know it. Everyone knows it.
      That open casket was a mirror,
      and America had to look.
    description: "Emmett Till's murder shocked America awake when his mother held an open casket; the traveler stood in the Chicago funeral line before a mirror the nation had to face."
    status: "published"
    sha256: "97637492f81e78a98aca21f66957734adf8b9e4beb6c867dad2dc81bfe616a4f"
  - number: "3663"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Rosa Parks Sits Down"
    date: "December 1955"
    region: "USA"
    poem: |
      She was tired — not just her feet,
      her soul — and when the driver ordered her
      to give up her seat, she said no.
      One word. The whole South shuddered.
      I rode the Montgomery buses that winter
      with the boycotters walking miles in the rain,
      their shoes worn through, their heads high.
      Three hundred eighty-one days.
      They walked until the law bent.
      All because one woman stayed seated.
    description: "Rosa Parks refused to give up her bus seat, sparking the 381-day Montgomery boycott; the traveler rode with boycotters walking miles in the rain until the law bent."
    status: "published"
    sha256: "713b4b5cd98802e888ff3cd4bbeb1272d8967f3e15b9f52836a07e4d1cd689db"
  - number: "3664"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Secret Speech"
    date: "February 1956"
    region: "USSR"
    poem: |
      Behind closed doors, Khrushchev stood up
      and denounced Stalin — the purges, the lies,
      the cult, the corpses —
      four hours of truth the party had buried.
      The delegates sat in shock.
      Some wept. One reportedly dropped dead.
      I heard the text read aloud weeks later
      in a Warsaw kitchen, voices hushed.
      The Soviet world shuddered:
      if Stalin was a criminal, what were they?
      The thaw began that night —
      and the cracks never closed again.
    description: "Khrushchev denounced Stalin in a secret four-hour speech; the traveler heard the text whispered in a Warsaw kitchen as the Soviet world shuddered and the cracks began."
    status: "published"
    sha256: "85663e5f1c2456949307ab3016b62fcf7c1118de21666ad9f07020062af5dd96"
  - number: "3665"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Boxes on a Ship"
    date: "April 1956"
    region: "USA"
    poem: |
      Malcom McLean was tired of dockworkers
      loading cargo piece by piece,
      so he loaded the truck itself —
      fifty-eight steel boxes on a ship,
      and the Ideal X sailed.
      The container: the dullest revolution ever.
      I watched them stack those boxes in Newark,
      and the longshoremen shook their heads.
      They were right to worry.
      That gray box would empty the docks,
      fill the oceans, and stitch the planet
      into one humming supply chain.
    description: "The first container ship sailed with fifty-eight steel boxes; the traveler watched longshoremen shake their heads in Newark as the dullest revolution ever began stitching the planet together."
    status: "published"
    sha256: "7c32c21f570636a9a127a0ac5af8a52a1990d43b6d2fb9a942e1f2899e2b02c3"
  - number: "3666"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Nasser Takes the Canal"
    date: "July 1956"
    region: "Egypt"
    poem: |
      Nasser stood before the crowds in Alexandria
      and took the Suez Canal —
      Egypt's waterway, Egypt's at last,
      no more foreign hands on the tiller.
      Britain, France, and Israel invaded.
      I was in Port Said when the bombs fell,
      and the canal ran black with burning oil.
      The invaders won the battles
      and lost everything: America said stop,
      the empire's bluff was called.
      The canal stayed Egypt's.
      The age of gunboat empires ended that winter.
    description: "Egypt seized the Suez Canal and Britain, France, and Israel invaded; the traveler watched Port Said burn as the invaders won battles but lost the age of gunboat empires."
    status: "published"
    sha256: "0f253f8ea6a88339dc7f83ff0dfbcbd1789d455ce934113a6ab0e733199187b1"
  - number: "3667"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Elvis Shakes the Screen"
    date: "September 1956"
    region: "USA"
    poem: |
      He came on the Milton Berle show,
      guitar slung low, and moved his hips
      like the devil had given him dancing lessons —
      and the switchboards lit up.
      Parents clutched their pearls.
      Preachers reached for their Bibles.
      Teenagers screamed loud enough to crack glass.
      I watched it in a bar in Memphis,
      and the old men at the counter just stared.
      They'd seen the future walk in
      wearing sideburns, and it scared them
      half to death. Good.
    description: "Elvis swiveled his hips on national television and the switchboards lit up; the traveler watched old men stare in a Memphis bar as the future walked in wearing sideburns."
    status: "published"
    sha256: "95db6af2cf4aeb723b4f78ce17c29fbcc19f5e6c3d74c9813e07f53756627132"
  - number: "3668"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Budapest Fights Back"
    date: "October 1956"
    region: "Hungary"
    poem: |
      The students marched, the statue of Stalin fell —
      cut at the boots, the crowd cheering —
      and for twelve days Hungary was free.
      I was in Budapest, breathing that free air,
      watching teenagers with captured rifles
      hold the barricades like lions.
      Then the tanks came back. Thousands of them.
      They crushed it street by street.
      The West sent sympathy and nothing else.
      But those twelve days proved the empire
      was ruling corpses with fear —
      and corpses, eventually, sit up.
    description: "Hungarians rose against Soviet rule and held freedom for twelve days before the tanks returned; the traveler breathed Budapest's free air and watched teenagers hold barricades like lions."
    status: "published"
    sha256: "753ad13946aa38cdde25fbe6b33fdb04d8ef8f3483e3632fd4b4a9601871b6ab"
  - number: "3669"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Buses Desegregate"
    date: "December 1956"
    region: "USA"
    poem: |
      The Supreme Court spoke: bus segregation
      is unconstitutional.
      The boycott ended after 381 days —
      the walkers climbed aboard,
      and sat where they pleased.
      I rode one of those first integrated buses
      in Montgomery. An old woman sat by the window,
      smiling at nothing in particular.
      She'd walked to work and back for a year.
      Now she rode.
      Sometimes justice arrives
      not with trumpets, but with a bus ticket.
    description: "The Supreme Court ended bus segregation and the 381-day boycott won; the traveler rode a first integrated Montgomery bus beside an old woman smiling at nothing in particular."
    status: "published"
    sha256: "3d012f101eeac323fb8ecd2a8284186df9dffb06365b8af5d038b1995f5b368f"
  - number: "3670"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Ghana Leads Africa"
    date: "March 1957"
    region: "West Africa"
    poem: |
      Midnight in Accra: the Union Jack came down,
      the Black Star rose, and Nkrumah's voice
      rolled over the rejoicing crowds —
      Ghana free, the first sub-Saharan nation
      to break the colonial chain.
      I danced in that crowd, drenched in sweat and joy,
      and an old woman grabbed my hands:
      "Now we are people again," she said.
      She was right. And within three years,
      seventeen more flags would follow.
      Africa's freedom wave began
      with drums in Accra.
    description: "Ghana won independence as the Black Star rose over Accra; the traveler danced in the crowd while an old woman declared they were people again — and seventeen flags followed."
    status: "published"
    sha256: "b404a728020935833924bc832dd20cc25f30afa04495077aa60d2ba5b23f00b3"
  - number: "3671"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Common Market"
    date: "March 1957"
    region: "Europe"
    poem: |
      Six nations signed in Rome —
      France, Germany, Italy, and the Benelux —
      coal and steel first, then everything else,
      a market without borders.
      I watched the signing in the Capitoline hall,
      and the ghosts of Verdun must have laughed:
      the nations that bled each other white
      now sharing bread ovens.
      It was accountants building peace —
      dull, brilliant, and it worked.
      Europe started uniting not with anthems,
      but with invoices.
    description: "Six nations signed the Treaty of Rome, starting Europe's unification; the traveler watched accountants build peace with invoices where anthems had failed."
    status: "published"
    sha256: "92ce92241e25f8be5fd4a63fc836c853a0aaff8966ff6793a10b80fa56d74306"
  - number: "3672"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Asian Flu"
    date: "June 1957"
    region: "Asia"
    poem: |
      It came out of Asia on the steamship routes —
      fever, cough, a week in bed,
      a million dead before it burned out.
      I nursed a ward in Manchester that autumn,
      sponging foreheads, watching the beds fill.
      The young shrugged; the old remembered 1918.
      Pandemics are the planet's old habit,
      and humanity's old amnesia:
      we forget, we gather, we cough,
      and the flu collects its tithe.
    description: "A pandemic swept out of Asia, killing a million; the traveler sponged foreheads in a Manchester ward and watched humanity's old amnesia meet the planet's old habit."
    status: "published"
    sha256: "a17439e77cbfe6b1e2c537e6ba291837314b4f4575088e0d094391b3802d2633"
  - number: "3673"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Little Rock Nine"
    date: "September 1957"
    region: "USA"
    poem: |
      Nine Black teenagers walked toward Central High
      through a screaming mob —
      spit, curses, the National Guard blocking the door
      on the governor's orders.
      Then Eisenhower sent the 101st Airborne,
      bayonets fixed, to escort children to class.
      I stood across the street and watched
      a girl my daughter's age walk through hell
      with her books clutched tight and her chin up.
      Soldiers had to guard the schoolhouse door
      so learning could happen.
      Think about that.
    description: "Nine Black students faced a mob at Little Rock's Central High until paratroopers escorted them in; the traveler watched a girl walk through hell with her books clutched tight."
    status: "published"
    sha256: "006747b47e97331704139e8a838b93de59ee6f0db4554227520f28a9a7d400df"
  - number: "3674"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Beep Heard Round the World"
    date: "October 1957"
    region: "USSR"
    poem: |
      A polished sphere, twenty-three inches wide,
      rode a rocket into the black —
      and then, from everywhere on earth,
      the beep. Beep. Beep.
      Sputnik: the first satellite, Soviet-made,
      circling over American backyards
      every ninety-six minutes.
      I stood in a field in Kansas with a crowd,
      listening to that beep on a shortwave,
      staring up at a moving star.
      The Space Age didn't begin with a roar.
      It began with a beep — and America
      heard it in its sleep for years.
    description: "Sputnik became the first satellite, its beep circling the globe every 96 minutes; the traveler stood in a Kansas field listening on shortwave as the Space Age began with a beep."
    status: "published"
    sha256: "5721f5878880fe142f25db839c18b856cab4b4eb38c325b99fea57556f875ed9"
  - number: "3675"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Dog in Orbit"
    date: "November 1957"
    region: "USSR"
    poem: |
      They found her on the Moscow streets,
      a stray with bright eyes — Laika —
      and shot her into orbit in a tin can
      with no way home.
      She circled the earth, barking at the stars,
      and died within hours, alone,
      the first living thing in space.
      I can't forgive them for it.
      I stood outside the Soviet exhibit in Brussels
      years later, staring at her little capsule,
      and thought: we reached for the heavens
      and sent a stray dog to die for us.
      Remember her name. Laika.
    description: "Laika the stray dog rode Sputnik 2 into orbit with no way home and died within hours; the traveler never forgave it and asks the world to remember her name."
    status: "published"
    sha256: "6d9fd5685307e32465e95b0f82a709412a594998167016aaeacaac00eda9fdf4"
  - number: "3676"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Flying Disc"
    date: "1957 CE"
    region: "USA"
    poem: |
      Somebody watched college kids
      tossing pie tins and thought: I can sell that.
      The Frisbee: a plastic disc that sails
      on nothing but spin and summer.
      I threw one on a California beach,
      watched it hang in the salt air
      like it had decided not to fall.
      No batteries. No screen. No instructions.
      Just physics and joy, back and forth,
      back and forth, until the sun went down.
    description: "The Frisbee took flight on beaches everywhere; the traveler threw one into salt air and watched physics and joy sail back and forth until sunset."
    status: "published"
    sha256: "b293a42fcbf2ae535090ba1f75919e84d75d5a134c23d0067432beef18a7f567"
  - number: "3677"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Baghdad's Bloody Summer"
    date: "July 1958"
    region: "Iraq"
    poem: |
      The officers struck before dawn —
      the king, the crown prince, the palace,
      all of it washed away in a morning of gunfire.
      I walked Baghdad's streets that week,
      tanks at the corners, the radio
      playing martial music on a loop.
      A republic rose, red-handed.
      The British left. The oil stayed.
      Iraq has been paying for that morning
      ever since — every strongman since
      has ruled in the shadow of those shots.
    description: "Iraq's king was overthrown in a bloody coup and a republic rose; the traveler walked Baghdad's tank-lined streets as martial music looped on the radio."
    status: "published"
    sha256: "e8795d79987e1a727b3ff58e505e1c5c5a19002b81e8ec982b10531e845b9c5a"
  - number: "3678"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "NASA Is Born"
    date: "July 1958"
    region: "USA"
    poem: |
      Stung by Sputnik's beep,
      America built itself a space agency —
      NASA, stitched from labs and rocket teams,
      with one job: catch the Soviets.
      I toured the early offices, all slide rules
      and crew cuts and coffee,
      and the engineers talked about the moon
      the way farmers talk about rain —
      not if, but when.
      They were dreamers with budgets.
      The most dangerous kind.
      The kind that gets there.
    description: "America created NASA to catch the Soviets in space; the traveler toured offices of slide rules and crew cuts where engineers talked about the moon like farmers talk about rain."
    status: "published"
    sha256: "33893e12400d76de2654aaafd9e3bba2c3d9e73e2c2aa5df9be97a5f09a7c5eb"
  - number: "3679"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Chip"
    date: "September 1958"
    region: "USA"
    poem: |
      Jack Kilby, alone in the lab
      while everyone else was on vacation,
      soldered a whole circuit onto a sliver
      of germanium — and wrote in his notebook:
      "Extreme miniaturization."
      The integrated circuit. The chip.
      I held one of those first ones.
      It looked like nothing. A crumb.
      Every computer you will ever touch,
      every phone, every satellite —
      descended from that crumb.
    description: "Jack Kilby soldered a whole circuit onto a sliver of germanium; the traveler held one of the first chips — a crumb from which every computer would descend."
    status: "published"
    sha256: "121316421829997758dc0da15077f46971d78e402bd611b6f64d017bf12d258e"
  - number: "3680"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Jet Shrinks the Atlantic"
    date: "October 1958"
    region: "USA"
    poem: |
      Pan Am's 707 lifted off for Paris —
      eight hours across the ocean that took
      the Queen Mary five days.
      I was in economy, if you could call it that —
      everyone dressed up, everyone thrilled,
      the captain's voice crackling with pride.
      Below, the Atlantic unrolled like blue silk.
      Above, we outran the sun.
      The jet age went global that day,
      and the world got small enough
      to visit for the weekend.
    description: "Pan Am's 707 crossed the Atlantic in eight hours; the traveler watched blue silk unroll below as the world got small enough to visit for the weekend."
    status: "published"
    sha256: "146ff39290abc407c6149ce4cdb3784996f530d7497fa63b47cdc99d4789e776"
  - number: "3681"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Voice from Orbit"
    date: "December 1958"
    region: "USA"
    poem: |
      On Christmas Eve, a satellite
      carried a tape recorder around the earth,
      and Eisenhower's voice came down from the sky:
      greetings of peace, from orbit.
      I listened with a family in Ohio,
      the kids wide-eyed at the radio.
      "The president is in space," the boy whispered.
      Not quite, son. But his voice was.
      The heavens had carried prayers for millennia.
      That night, they carried a Christmas message —
      and answered with static and stars.
    description: "A satellite relayed Eisenhower's Christmas message from orbit; the traveler listened with an Ohio family while a boy whispered that the president was in space."
    status: "published"
    sha256: "2dd96e1af6fae0103f6e5f74a59dad753d4ec254752eec528997f4ee07e82126"
  - number: "3682"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Hips in Motion"
    date: "1958 CE"
    region: "USA"
    poem: |
      A plastic hoop, a wiggle of the hips,
      and suddenly every sidewalk in America
      was spinning.
      The Hula Hoop: twenty-five million sold
      in four months. I tried one
      in a schoolyard in Oregon —
      lasted eleven seconds, to the children's delight.
      It did nothing. It meant nothing.
      It was pure, uncut joy in a circle,
      and sometimes that's the whole story.
    description: "The Hula Hoop craze swept America's sidewalks, twenty-five million sold in months; the traveler lasted eleven seconds in an Oregon schoolyard to the children's delight."
    status: "published"
    sha256: "f6f70b4c0d67c97d5b05fa4d792c74daed74ded96b71fad6a7f3e3544cd36219"
  - number: "3683"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Fidel Takes Havana"
    date: "January 1959"
    region: "Cuba"
    poem: |
      The bearded rebels came down from the Sierra Maestra
      in jeeps draped with flowers,
      and Havana threw its arms around them.
      I walked with that caravan into the city,
      the crowds roaring, Castro standing tall,
      promising freedom, justice, a new Cuba.
      The promises curdled. The firing squads started.
      Within two years the island was Moscow's
      aircraft carrier in the Caribbean.
      Revolutions eat their promises first.
      I watched this one chew.
    description: "Castro's rebels entered Havana to roaring crowds and promises; the traveler walked with the caravan and watched the promises curdle into firing squads."
    status: "published"
    sha256: "be2a5311e0ce195a7d436c3685e3b8ad73f5ffba3e4a2e7e566cbc8008d791df"
  - number: "3684"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Two New Stars"
    date: "January 1959"
    region: "USA"
    poem: |
      Alaska first, then Hawaii —
      the forty-ninth and fiftieth stars,
      sewn onto the flag in a single year.
      I was in Honolulu for statehood day,
      lei sellers doing triple business,
      and an old Hawaiian fisherman told me
      he wasn't sure whether to cheer.
      Empire or state? He didn't know.
      The flag got its fifty stars.
      Whether the promise stretched that far
      is a question the islands still ask.
    description: "Alaska and Hawaii joined the Union, giving the flag fifty stars; the traveler celebrated in Honolulu beside an old fisherman unsure whether to cheer."
    status: "published"
    sha256: "11896a47226f2910a192a7d9d3d09c64f24f4276bb1690fee49e5b6fb05dd33e"
  - number: "3685"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Here Comes Barbie"
    date: "March 1959"
    region: "USA"
    poem: |
      At a New York toy fair, a doll
      with impossible proportions and a knowing smile
      stepped out of her striped swimsuit and into history.
      Barbie. Ruth Handler named her for her daughter
      and gave little girls something dolls
      had never offered: a grown-up future.
      I watched the buyers crowd the Mattel booth,
      skeptical men in suits, outvoted by their wives.
      Sixty years of dream houses followed.
      Love her or loathe her, she outsold
      every philosophy ever written.
    description: "Barbie debuted at a New York toy fair and gave little girls a grown-up future in a striped swimsuit; the traveler watched skeptical buyers get outvoted by their wives."
    status: "published"
    sha256: "ae2d8caf41100036d0091a92dbe8b2c46ea34e5ac44d81c2153017ed2574e47f"
  - number: "3686"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Kitchen Debate"
    date: "July 1959"
    region: "USSR"
    poem: |
      In a model American kitchen in Moscow —
      dishwasher, cake mix, all of it —
      Nixon jabbed a finger at Khrushchev:
      your system can't build this.
      Khrushchev jabbed back: we'll bury you,
      and our kitchens will be better.
      I stood ten feet away, watching two empires
      argue over appliances.
      It was absurd. It was perfect.
      The Cold War, fought with cake mix —
      because even the apocalypse
      has to do the dishes.
    description: "Nixon and Khrushchev argued capitalism versus communism in a model Moscow kitchen; the traveler watched two empires fight the Cold War with cake mix."
    status: "published"
    sha256: "9e215780efd5036f25b5e3c601fe9a267e628c5741a435cadeb4dec5d7154202"
  - number: "3687"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Press a Button, Copy the World"
    date: "September 1959"
    region: "USA"
    poem: |
      The Xerox 914 weighed 650 pounds,
      leaked toner, caught fire occasionally —
      and changed everything.
      Press a button, copy the world.
      I watched an office in Manhattan
      get its first one, and the secretaries
      gathered around like it was a revival meeting.
      Memos multiplied. Dissent multiplied too —
      samizdat, pamphlets, the underground press.
      The copier didn't just copy paper.
      It copied power, and handed it out.
    description: "The Xerox 914 made office copies easy at the press of a button; the traveler watched Manhattan secretaries gather like a revival meeting as the copier handed out power."
    status: "published"
    sha256: "2ec23d02e45b4ca7c9f9ee05fb821f7d60d3b0a8e45fd719a740a89c92f8df46"
  - number: "3688"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Continent for Science"
    date: "December 1959"
    region: "Antarctica"
    poem: |
      Twelve nations signed a treaty
      for a continent of ice —
      no armies, no flags planted in anger,
      just science: weather, penguins, stars.
      I stood on the Ross Ice Shelf that year,
      wind like a living thing,
      and thought of every treaty I'd seen broken.
      This one held. It still holds.
      Antarctica: the only place on earth
      where humanity agreed to just look,
      and learn, and leave no footprints
      but bootprints in the snow.
    description: "Twelve nations set Antarctica aside for peace and science; the traveler stood on the Ross Ice Shelf and watched the one treaty about looking, learning, and leaving only bootprints hold."
    status: "published"
    sha256: "74165d280efb7f2674d568adb1d5f1e1936c92aa1049e7534168dca9fe87c6cc"
  - number: "3689"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Eyes on the Weather"
    date: "February 1960"
    region: "USA"
    poem: |
      TIROS-1 went up and looked down —
      and for the first time, humanity saw
      its own weather: cloud spirals wheeling
      over the oceans, storms marching in formation.
      I sat in the tracking station
      as the first fuzzy pictures came in,
      and the meteorologists wept.
      No more guessing. The sky had eyes now.
      Farmers, sailors, pilots —
      everyone who ever shook a fist at a cloud
      finally got to see the fist coming.
    description: "The first weather satellite photographed Earth's clouds; the traveler watched meteorologists weep in the tracking station as the sky grew eyes."
    status: "published"
    sha256: "0c513bbcdad32b339d1901ceaf0896daf2d6d74154c336a59111145a30957e85"
  - number: "3690"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Capital from Nothing"
    date: "April 1960"
    region: "Brazil"
    poem: |
      In the empty highlands, they built a city
      in three years — Brasilia,
      all curves and concrete, rising from red dust
      like a dream Niemeyer had and refused to wake from.
      I walked its vast avenues on opening day,
      the ministries gleaming, the workers
      already being bused to the far edges.
      A capital from nothing, shaped like an airplane.
      Beautiful. Inhuman. Both.
      Utopias look best from the air.
    description: "Brazil opened Brasilia, a city built from scratch in the wilds; the traveler walked its vast gleaming avenues and saw a utopia that looks best from the air."
    status: "published"
    sha256: "cf2225cfe5b4ff396034cc45a6738866595ec23dabaa89be1cc8fc3a0d67e8cf"
  - number: "3691"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Spy Plane Falls"
    date: "May 1960"
    region: "USSR"
    poem: |
      Gary Powers flew too high for too long —
      the U-2, America's eye in the sky,
      brought down by a Soviet missile over Sverdlovsk.
      Eisenhower lied about it. Khrushchev
      produced the pilot, alive, like a rabbit
      from a hat. The Paris summit collapsed.
      I watched the wreckage photos in the papers,
      that long black wing in a Russian field.
      Secrets have weight. This one
      was heavy enough to sink a summit.
    description: "The Soviets downed an American U-2 spy plane and produced the pilot alive; the traveler saw the wreckage photos as secrets heavy enough to sink a summit."
    status: "published"
    sha256: "067974291883872db9e976ac16be706cabdeffb815744ecd94062ebb9d80e088"
  - number: "3692"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Pill"
    date: "May 1960"
    region: "USA"
    poem: |
      A tiny tablet, taken daily —
      and the oldest arithmetic in the world changed.
      The FDA approved it, and women
      held their futures in a little round case.
      I talked to a nurse in Chicago that year
      who cried telling me: no more
      back-alley fear, no more counting days.
      Biology stopped being destiny.
      It was the quietest revolution ever —
      swallowed with breakfast.
    description: "The FDA approved the birth-control pill; the traveler listened to a Chicago nurse weep with relief as biology stopped being destiny, swallowed with breakfast."
    status: "published"
    sha256: "886a76563d491b5c2d6f74da7244a9be03b8b9c540839d55e68c9aa7b73bd5c3"
  - number: "3693"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Five Lads in Hamburg"
    date: "August 1960"
    region: "Europe"
    poem: |
      Nobody knew them yet — five lads
      from Liverpool, playing eight hours a night
      in Hamburg dives, leather and sweat,
      learning to be a band the hard way.
      I caught a set at the Indra,
      fifty drunks and a deafening racket.
      They were terrible. They were magnificent.
      You could feel it even then, under the noise:
      something was being forged in that cellar,
      and the world was about to get loud.
    description: "The Beatles ground through Hamburg club gigs, unknown and deafening; the traveler caught a set at the Indra and felt something being forged in the cellar."
    status: "published"
    sha256: "41c770af541455b90a620198921b48e8dec01f681b6b3be3d4f5ec06abe14d64"
  - number: "3694"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Africa's Year of Freedom"
    date: "December 1960"
    region: "Africa"
    poem: |
      Seventeen nations. One year.
      The map of Africa changed colors
      faster than the printers could keep up —
      independence in Leopoldville, Lagos,
      Yaoundé, Dakar, a drumbeat of flags.
      I spent that year on the road,
      from celebration to celebration,
      and the joy was real and enormous.
      So were the hangovers to come —
      the coups, the strongmen, the Cold War
      buying sides.
      But nothing can take away that year:
      Africa stood up, all at once.
    description: "Seventeen African nations won independence in a single year; the traveler road-tripped from celebration to celebration as the map changed colors faster than printers could follow."
    status: "published"
    sha256: "c890bfec27615aa1bb3320192cc77a1d945b2624f1756b630be9fb56f94a1f1c"
  - number: "3695"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A New Generation"
    date: "January 1961"
    region: "USA"
    poem: |
      Snow on the Capitol, a young president
      bareheaded in the cold, promising a New Frontier —
      "Ask not what your country can do for you."
      I stood in that freezing crowd,
      watching Kennedy's breath fog the air,
      and felt the country get younger by twenty years.
      Poets at the inauguration. Hope like a coat.
      Nobody knew how short the frontier would be.
      That day, it stretched forever.
    description: "Kennedy took office promising a New Frontier in the January cold; the traveler stood in the freezing crowd and felt the country get twenty years younger."
    status: "published"
    sha256: "3d64aaa065c740566679dd23037ee5b597cbc68f565eb59b6487e75cf048ee77"
  - number: "3696"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Man Among the Stars"
    date: "April 1961"
    region: "USSR"
    poem: |
      One hundred eight minutes.
      Gagarin rode a fireball into the black,
      looked out the porthole at the blue marble,
      and came home a god.
      "Poyekhali!" — let's go —
      the word that started the human space age.
      I was in Moscow for the celebration,
      the whole city drunk on joy,
      strangers hugging in the streets.
      A farm boy had left the planet.
      Every child on earth went to bed that night
      knowing the sky had a door in it.
    description: "Gagarin orbited the Earth in 108 minutes and came home a hero; the traveler celebrated in Moscow's streets as every child learned the sky had a door in it."
    status: "published"
    sha256: "e108b120d84a9c1f7b1f299fe929bd7ca8e836bdc2fb518621e202714e5d7f10"
  - number: "3697"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Bay of Pigs"
    date: "April 1961"
    region: "Cuba"
    poem: |
      Fourteen hundred exiles waded ashore
      at the Bay of Pigs, promised American air cover
      that never came.
      Castro's forces crushed them in three days.
      I watched the prisoners paraded in Havana,
      young men who'd believed the CIA's promises.
      Kennedy took the blame, publicly, fully —
      a rare thing, a president saying "my fault."
      It was a fiasco. It was also a lesson
      the young president never forgot:
      never trust a plan that needs everything
      to go right.
    description: "CIA-backed exiles invaded Cuba and were crushed in three days without the promised air cover; the traveler watched the prisoners paraded as Kennedy publicly took the blame."
    status: "published"
    sha256: "3815580fa478f21fc955c5a714168690dc7553f714e7d952c63e80b29a46762c"
  - number: "3698"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Freedom Rides"
    date: "May 1961"
    region: "USA"
    poem: |
      Black and white together, they boarded the buses —
      into Alabama, into Mississippi,
      into mobs with bats and burning tires.
      The buses burned. The riders didn't break.
      I rode one leg through Anniston,
      and the singing — they sang the whole way,
      even with the mob rocking the bus.
      They were kids, mostly. Kids with more courage
      than armies.
      The Interstate Commerce Commission caved.
      The buses desegregated.
      Courage, it turns out, is a timetable.
    description: "Black and white Freedom Riders braved mobs to desegregate Southern buses; the traveler rode through Anniston listening to them sing while the mob rocked the bus."
    status: "published"
    sha256: "e94d26367b12961cfe3da5241505eacafb08a063dbb3d071f9fde95ea6c495ac"
  - number: "3699"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Wall Goes Up"
    date: "August 1961"
    region: "Germany"
    poem: |
      They did it overnight — wire, then concrete,
      soldiers with orders to shoot,
      a city sliced like a cake while it slept.
      I woke in West Berlin to the sound of hammers
      and walked to Bernauer Strasse,
      where people leaned from windows
      waving at the street below —
      their street, now another country.
      Families divided by a wall of cinderblock.
      It stood for twenty-eight years.
      That morning, it was just wire and weeping.
    description: "East Germany sealed Berlin with concrete and wire overnight; the traveler walked to Bernauer Strasse where people waved from windows at a street that had become another country."
    status: "published"
    sha256: "63b2d35dc9203e305e8e7572357003e3f04f43a0e663057749a72c786dafb194"
  - number: "3700"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "War in a Computer"
    date: "1961 CE"
    region: "USA"
    poem: |
      In an MIT basement, students wired a PDP-1
      to play Spacewar! — two little ships,
      dueling around a pixel sun,
      torpedoes made of dots.
      I played it, hunched over the console,
      and lost gloriously to a grad student.
      It was a game. It was also the future:
      every video game ever made
      descends from those dueling dots.
      The hackers were just having fun.
      Fun, as usual, was the point all along.
    description: "MIT students coded Spacewar! on a PDP-1, two ships dueling around a pixel sun; the traveler lost gloriously and saw the ancestor of every video game."
    status: "published"
    sha256: "6a1a25744de9a3009fad078b1e2f152d65610499fb171f5f98cf6a874931e2cf"
  - number: "3701"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Sam's Little Store"
    date: "February 1962"
    region: "USA"
    poem: |
      Sam Walton opened a dimestore in Rogers, Arkansas —
      low prices, friendly clerks, aisles wide enough
      for a revolution.
      I shopped there in the early years,
      and Sam himself bagged my purchase,
      asking what I thought of the prices.
      He meant it. That was the secret:
      he actually cared about the cheap.
      Walmart would eat Main Street alive,
      for better and worse —
      but it started with a man in Arkansas
      who hated a high price like a personal insult.
    description: "Sam Walton opened the first Walmart in Arkansas; the traveler had his purchase bagged by Sam himself and saw a revolution that started with hatred of high prices."
    status: "published"
    sha256: "13191b1780d06965bcc8810e8cac3a44653ed1b98f6061a1ad547949b8d8b832"
  - number: "3702"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Silent Spring"
    date: "June 1962"
    region: "USA"
    poem: |
      Rachel Carson, dying of cancer,
      wrote that the birds were going silent —
      DDT in the soil, in the rivers,
      in the milk, in us.
      The chemical companies called her hysterical.
      I walked a Pennsylvania orchard with her
      that spring, and the quiet was wrong.
      No dawn chorus. Just sprayers hissing.
      She was right about everything.
      Silent Spring woke the green movement,
      and the eagles came back.
      One dying woman, one book,
      and the sky got its singers back.
    description: "Rachel Carson warned that pesticides were silencing nature; the traveler walked a quiet Pennsylvania orchard with her and watched one dying woman's book bring the eagles back."
    status: "published"
    sha256: "d8efe043950dedb98c26a8512c64b933177249cee2d6f95f903192fd0a8c5855"
  - number: "3703"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Algeria Free at Last"
    date: "July 1962"
    region: "Algeria"
    poem: |
      Eight years, a million dead —
      and then the French left, and the flag went up,
      green and white with the red crescent.
      I was in Algiers for the celebrations,
      ululations from every balcony,
      old fighters weeping into their beards.
      The Casbah exhaled.
      France had called it French soil;
      the soil disagreed.
      Empires end the same way every time:
      the map stays, the people change it.
    description: "After eight years of war, Algeria won independence from France; the traveler stood in Algiers as ululations poured from balconies and the Casbah finally exhaled."
    status: "published"
    sha256: "2c92c18c4e5377b0d28d64fc3da51864bdc237826dcce2b1759a30e4b4ab5a83"
  - number: "3704"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Goodbye, Marilyn"
    date: "August 1962"
    region: "USA"
    poem: |
      Thirty-six years old, found alone
      in her Brentwood bedroom —
      the brightest star of the age,
      burned out.
      I covered the funeral for no one,
      just stood outside the chapel
      with the crowds and the flowers.
      She'd been the most photographed woman alive,
      and the loneliest.
      Hollywood made her a goddess
      and forgot to make her a person.
      The world mourned the symbol.
      I mourned Norma Jeane.
    description: "Marilyn Monroe died at thirty-six, alone in Brentwood; the traveler stood outside the chapel mourning not the symbol but Norma Jeane, the person Hollywood forgot to make."
    status: "published"
    sha256: "db3f4374ba401d62ccfab8b62f9232a8c9b47656e248a1e91c1eaa06d1925ed1"
  - number: "3705"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Bond, James Bond"
    date: "October 1962"
    region: "UK"
    poem: |
      A Scotsman in a tuxedo walked into a casino
      and introduced himself to the century:
      "Bond. James Bond."
      Dr. No: the girls, the gadgets, the shaken martinis,
      the Cold War made sexy.
      I saw it in a packed London cinema,
      the audience gasping at the gadgets.
      Ian Fleming had dreamed up a fantasy
      where one man could outwit empires —
      and for two hours, we all believed it.
      The spy craze began. The tuxedo never left.
    description: "Dr. No introduced 007 to the world; the traveler watched a packed London cinema gasp as one man in a tuxedo outwitted empires for two glorious hours."
    status: "published"
    sha256: "87f19aaeeedd5591cf5a298fca61179637629124a4f8b6c4751913736b241c5b"
  - number: "3706"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Love Me Do"
    date: "October 1962"
    region: "UK"
    poem: |
      A harmonica, a shuffling beat,
      four lads from Liverpool singing "love me do" —
      their first single, rough as sandpaper,
      peaked at number seventeen.
      I bought the 45 at a record shop in Manchester,
      and the clerk shrugged: "Local lads."
      Local lads. Within a year they'd own the planet.
      You could hear it already, under the rawness —
      the hunger, the harmonies, the thing
      that would make the whole world scream.
      It started with a harmonica and a plea.
    description: "The Beatles released their first single, \"Love Me Do\"; the traveler bought the 45 in Manchester where the clerk shrugged \"local lads\" — local lads who would own the planet."
    status: "published"
    sha256: "d4b29c0522a388ccb91a20ec6a64f7c93b075dec733ec429cd6ecd229ff52248"
  - number: "3707"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Thirteen Days"
    date: "October 1962"
    region: "Caribbean"
    poem: |
      For thirteen days the world held its breath.
      Soviet missiles in Cuba, ninety miles from Florida,
      Kennedy's blockade, Khrushchev's ships steaming closer —
      and every hour, the odds of the end of everything
      ticking up like a meter.
      I was in Washington, watching the tension
      crackle off the walls.
      We were one misread radar blip
      from the last war.
      They blinked. Both of them. Thank God,
      they blinked.
      I have never been so scared, before or since.
    description: "Soviet missiles in Cuba brought the world to the edge of nuclear war for thirteen days; the traveler watched Washington crackle with tension, one radar blip from the end."
    status: "published"
    sha256: "6c96c07828a65d18f223164097685c6402bc7e81193e38e19fb668d0003f1594"
  - number: "3708"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Woman in Orbit"
    date: "June 1963"
    region: "USSR"
    poem: |
      Valentina Tereshkova — a textile worker,
      a parachutist — rode Vostok 6
      around the earth forty-eight times.
      The first woman in space.
      She radioed down, sang to mission control,
      and came home a hero.
      I met her years later; she laughed
      about being spacesick and hiding it.
      The Soviets sent her up for propaganda.
      She came down a pioneer anyway.
      The stars, she proved, don't check
      your chromosomes.
    description: "Tereshkova became the first woman in space, orbiting forty-eight times; the traveler learned she hid her spacesickness and proved the stars don't check chromosomes."
    status: "published"
    sha256: "bab7d763dcf06706c16d6b0310574abc05dc398f8beba0f8fbeeaea86b776691"
  - number: "3709"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The ZIP Code"
    date: "July 1963"
    region: "USA"
    poem: |
      Five digits. That's all it was —
      a Zone Improvement Plan, Mr. ZIP,
      a cartoon postman begging America
      to number its mail.
      I watched a postmaster in Ohio
      explain it to skeptical farmers.
      It worked. The mail moved faster.
      It's funny what endures: empires fall,
      but the ZIP code remains,
      five little numbers that taught a continent
      how to find itself.
    description: "America got ZIP codes and the mail moved faster; the traveler watched an Ohio postmaster sell five digits to skeptical farmers — and empires fall while the numbers remain."
    status: "published"
    sha256: "9d94443d489137624270c5eb3267fee60df53a57da0e1b2716a63038b57218bd"
  - number: "3710"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "I Have a Dream"
    date: "August 1963"
    region: "USA"
    poem: |
      Two hundred fifty thousand people
      at the Lincoln Memorial, August heat,
      and a preacher from Atlanta took the microphone
      and dreamed out loud.
      "I have a dream."
      I was on the Mall, packed shoulder to shoulder,
      and when he hit those words the crowd
      became one voice, one held breath.
      Mahalia Jackson shouted "Tell them about the dream!"
      and he did. Oh, he did.
      The speech outlived the century's noise.
      Dreams do that, when they're true.
    description: "King told 250,000 marchers of his dream at the Lincoln Memorial; the traveler stood packed on the Mall and felt the crowd become one held breath."
    status: "published"
    sha256: "e3fe5fed92fe4cb8ae104b37dec6b7d0621a2189ffa0fb64df20a2fadc9777a9"
  - number: "3711"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Dallas, November 22"
    date: "November 1963"
    region: "USA"
    poem: |
      The motorcade turned onto Elm Street,
      the shots cracked across Dealey Plaza,
      and the century broke in half.
      I was three blocks away.
      The screaming started before the radio knew.
      Walter Cronkite took off his glasses.
      A nation watched its grief on live television —
      the first shared wound of the broadcast age.
      Camelot died in an open car
      on a sunny Friday.
      Nothing felt safe after that.
      Nothing was, for a long while.
    description: "Kennedy was shot in Dallas and a nation watched its grief on live television; the traveler stood three blocks from Dealey Plaza as the century broke in half."
    status: "published"
    sha256: "2784ad691b1c902f7c47a99eede309120907c6252c0f101bdaffbe95c6740172"
  - number: "3712"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Doctor Arrives"
    date: "November 1963"
    region: "UK"
    poem: |
      The day after Kennedy died,
      the BBC aired a strange little show —
      an old man, a blue police box,
      bigger inside than out.
      Doctor Who. I watched that first episode,
      foggy London, cavemen, a humming box.
      It was cheap. It was wonderful.
      Sixty years it's been running now —
      the traveler with two hearts,
      regenerating forever.
      Fitting, really: a show about time
      that outlived everyone's time.
    description: "Doctor Who premiered the day after Kennedy's assassination — a blue box bigger inside than out; the traveler watched the cheap, wonderful first episode of a show about time that outlived everyone's time."
    status: "published"
    sha256: "e5999cbfc6b3b5abc91cd1ee141f010fd5d10a5f0c36d7eaf4d8ee9b3ab11335"
  - number: "3713"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Kenya's Uhuru"
    date: "December 1963"
    region: "Kenya"
    poem: |
      Uhuru — freedom.
      Kenyatta took the oath in Nairobi Stadium,
      sixty thousand voices roaring,
      the Union Jack lowered for the last time.
      I stood in that roaring crowd,
      dust in my teeth, joy in my chest.
      Mau Mau's blood had bought this day.
      An old Kikuyu man next to me wept openly:
      "My grandchildren will be Kenyans," he said.
      "Not subjects. Kenyans."
    description: "Kenya won independence with Kenyatta's oath in a roaring Nairobi stadium; the traveler stood beside a weeping Kikuyu elder whose grandchildren would be Kenyans, not subjects."
    status: "published"
    sha256: "4950ff2a829b06d14c9788971a025ab82c6c67f5799d63bbfefc99cb22823cff"
  - number: "3714"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Beatles Invade America"
    date: "February 1964"
    region: "USA"
    poem: |
      Seventy-three million people watched —
      the Ed Sullivan Show, four lads,
      and America screamed itself hoarse.
      I was in a living room in Queens,
      and the teenage girls in front of the TV
      drowned out the music entirely.
      Parents were baffled. The old order trembled.
      It was just a band. It was never just a band.
      That night, the sixties truly began —
      with a chord, a scream, and a haircut.
    description: "Seventy-three million watched the Beatles on Ed Sullivan; the traveler sat in a Queens living room where screaming girls drowned out the music and the sixties truly began."
    status: "published"
    sha256: "5f259d715cc968c324b801326a47cb3468858f89bf15972eb4b9ce378a6de3b1"
  - number: "3715"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "I Am the Greatest"
    date: "February 1964"
    region: "USA"
    poem: |
      Nobody gave him a chance —
      a loudmouth kid from Louisville
      against Sonny Liston, the most feared man alive.
      Six rounds later Liston quit on his stool,
      and Cassius Clay stood over the world shouting:
      "I am the greatest!"
      I was ringside, deafened.
      He was beautiful, that night — fast as rumor,
      pretty as a poem.
      He'd become Ali soon, and a conscience,
      and a legend. But it started here:
      a kid who told the truth about himself
      before the world believed it.
    description: "Cassius Clay stunned Liston to become heavyweight champion; the traveler sat ringside as the loudmouth kid told the truth about himself before the world believed it."
    status: "published"
    sha256: "cbe45b8180ffc7509965b9583e90070b935fbd3f0e5f10b505cd4c6e8ae18bd4"
  - number: "3716"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Civil Rights Act"
    date: "July 1964"
    region: "USA"
    poem: |
      Johnson signed it with seventy-five pens —
      the Civil Rights Act, outlawing segregation
      in public life: lunch counters, hotels, jobs.
      A century after emancipation, the law caught up.
      I was in the East Room, watching him hand out
      the pens like relics.
      The South raged. The future arrived anyway.
      Laws don't change hearts, people say.
      True. But they change what hearts
      are allowed to do in public —
      and that's where justice lives.
    description: "America outlawed segregation in public life; the traveler watched Johnson hand out seventy-five signing pens like relics as the future arrived over the South's rage."
    status: "published"
    sha256: "9fccfa460e91d8e8a5a074762a1c004cedfc44feed55507282b922c7164c83a8"
  - number: "3717"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Tonkin Trap"
    date: "August 1964"
    region: "Vietnam"
    poem: |
      A murky clash in the Gulf of Tonkin —
      maybe an attack, maybe phantoms on a radar —
      and Johnson got his blank check:
      the resolution that swallowed a decade.
      I read the reports later, all confusion
      and midnight sonar ghosts.
      It didn't matter. The war machine
      had its permission slip.
      Fifty-eight thousand American names
      on a black wall in Washington,
      and millions of Vietnamese uncounted —
      all from a night when nobody's sure
      what actually happened.
    description: "A murky naval clash gave Johnson a blank check for war in Vietnam; the traveler read the confused sonar-ghost reports behind a decade swallowed by a permission slip."
    status: "published"
    sha256: "40a78a9772bee701a8f308d1c01006f12354fd452af33a82c36226420d351aca"
  - number: "3718"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Khrushchev Falls"
    date: "October 1964"
    region: "USSR"
    poem: |
      They came for him while he vacationed —
      the Central Committee, his own comrades —
      and voted the shoe-banger out.
      No trial, no tanks: just a quiet removal,
      a dacha, a pension, disgrace.
      I was in Moscow when the announcement came,
      three bland paragraphs.
      Brezhnev took over, gray as concrete.
      The thaw froze solid that October.
      Power in the Kremlin changed hands
      like a knife passed in the dark —
      no blood this time. Just silence.
    description: "The Soviets dumped Khrushchev in a quiet committee vote; the traveler read three bland paragraphs in Moscow as the thaw froze and power passed like a knife in the dark."
    status: "published"
    sha256: "172289302be14822f5c52eb4b5e0969ec2721da405c3dd725824f12ae369922e"
  - number: "3719"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "China Gets the Bomb"
    date: "October 1964"
    region: "China"
    poem: |
      In the Lop Nur desert, the sky lit up —
      China's first atomic weapon,
      the fifth nation in the terrible club.
      Mao's China, with the bomb.
      I heard the news in Hong Kong,
      and the room went quiet.
      The giants had their standoff;
      now the most populous nation on earth
      held the same terrible cards.
      The Cold War had gone from a duel
      to a crowded room full of loaded guns.
    description: "China exploded its first atomic weapon at Lop Nur; the traveler heard the news in a Hong Kong room gone quiet as the duel became a crowded room of loaded guns."
    status: "published"
    sha256: "ff6838e3bd9c9818219e0e84be9a3395a7fa218f15a2406ce79c484978978408"
  - number: "3720"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Ballot or the Bullet, Silenced"
    date: "February 1965"
    region: "USA"
    poem: |
      He took the stage at the Audubon Ballroom —
      and the gunmen stood up in the crowd.
      Malcolm X fell, twenty-one shots,
      a fierce voice silenced at thirty-nine.
      I was outside when the news broke,
      and Harlem's streets filled with a grief
      that had an edge of fury.
      He'd gone from hate to pilgrimage,
      from the Nation to Mecca to something larger —
      cut down just as he was becoming
      who he was meant to be.
    description: "Malcolm X was shot at the Audubon Ballroom at thirty-nine; the traveler watched Harlem fill with furious grief for a man cut down just as he was becoming himself."
    status: "published"
    sha256: "d3ed7db5aeb3d51f7ec2c803302a1bfe01d74eeec0a5896ad58efc9fa9238403"
  - number: "3721"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Bloody Sunday in Selma"
    date: "March 1965"
    region: "USA"
    poem: |
      They marched for the vote across the Edmund Pettus Bridge —
      and the troopers were waiting with whips and gas.
      I was on that bridge.
      The cameras rolled as the clubs came down,
      and America watched Black citizens beaten
      for wanting a ballot.
      John Lewis's skull fractured.
      The footage ran on every network.
      Two weeks later they marched again,
      with federal protection —
      and the Voting Rights Act was born
      on that bridge, in blood.
    description: "Marchers were beaten on Selma's Edmund Pettus Bridge as cameras rolled; the traveler stood on the bridge and watched the Voting Rights Act born in blood."
    status: "published"
    sha256: "34be0ae39a733db60cba641d9768c608b3f2f6d0595dd04d8fad02c50abf73d3"
  - number: "3722"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Walk in Nothing"
    date: "March 1965"
    region: "USSR"
    poem: |
      Alexei Leonov opened the hatch
      and stepped out — into nothing.
      Twelve minutes floating beside Voskhod 2,
      the earth wheeling below, his suit ballooning
      so stiff he barely squeezed back in.
      The first spacewalk.
      I listened to the radio traffic in Moscow,
      the controllers' voices tight with fear.
      A man walked in the void
      with only a tether between him and eternity.
      He came back in. Barely.
      That's the whole story of spaceflight, really.
    description: "Leonov floated outside his capsule for twelve minutes — the first spacewalk; the traveler heard Moscow's tight-voiced controllers as a man walked the void on a tether."
    status: "published"
    sha256: "fb1c0ef14bb29b0ba70e24f682a2dd3da416a152a94652590b52daeb287002db"
  - number: "3723"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Vote, at Last"
    date: "August 1965"
    region: "USA"
    poem: |
      Johnson signed the Voting Rights Act —
      federal power behind every Black ballot,
      a century after the Fifteenth Amendment promised it.
      I stood in a Black church in Alabama that Sunday,
      and the singing shook the rafters.
      An old woman who'd been turned away
      from the registrar five times
      held her registration card like a diploma.
      The ballot or the bullet, Malcolm had said.
      That day, the ballot won —
      and it was worth every march, every bridge, every drop.
    description: "America guaranteed Black citizens the right to vote; the traveler stood in an Alabama church where an old woman held her registration card like a diploma."
    status: "published"
    sha256: "ecd6e81b9d992c57c7ccd288b59978114b7ad6a9f6d87b111f90242c3ea0f123"
  - number: "3724"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Watts Burns"
    date: "August 1965"
    region: "USA"
    poem: |
      A traffic stop, a hot August night —
      and Watts exploded: six days of fire,
      thirty-four dead, a thousand buildings burned.
      I walked those streets with a reporter's pass,
      ash on my tongue, the National Guard
      on every corner.
      The laws had changed. The ghetto hadn't.
      Watts was the bill coming due —
      a century of promises paid in smoke.
      America learned that rights on paper
      don't fill an empty stomach.
    description: "Los Angeles erupted for six days of fire after a traffic stop; the traveler walked ash-covered streets and learned rights on paper don't fill an empty stomach."
    status: "published"
    sha256: "5a60b6fdc2f9ffef072728854b15a327aa4b077a1c270d8d909de73a40a187c1"
  - number: "3725"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Miniskirt"
    date: "1965 CE"
    region: "UK"
    poem: |
      Mary Quant took the scissors to the hemline —
      up, up, four inches above the knee —
      and the sixties got their uniform.
      The miniskirt: liberation you could wear,
      a middle finger in gabardine.
      I watched the King's Road girls stride past
      in their short skirts and long boots,
      and the old men tsk-tsked while the young men stared.
      Fashion is never just fashion.
      That hemline was a declaration:
      the future belongs to the young,
      and the young are done asking.
    description: "Hemlines soared as Mary Quant cut the miniskirt; the traveler watched King's Road girls stride past in liberation you could wear — the future done asking."
    status: "published"
    sha256: "aac204dda4f0a5b9380bbc7527cf310614329bad7b5b8f03d472aeab0324fd4b"
  - number: "3726"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Machine for a Heart"
    date: "April 1966"
    region: "USA"
    poem: |
      In Houston, surgeons implanted
      a heart-assist pump — a machine
      doing the work of a failing heart,
      keeping a man alive from the inside.
      I stood in the observation gallery,
      watching hands move inside a chest
      like watchmakers.
      It worked. For days, it worked.
      Medicine had pushed past pills and knives
      into the engine room of the body.
      The heart — the ancient seat of the soul —
      now had a spare part.
    description: "Surgeons implanted a heart-assist pump in Houston; the traveler watched from the gallery as medicine entered the engine room and the soul's seat got a spare part."
    status: "published"
    sha256: "0eff8b160ae52bde0b78f30f7ce161fc52f644c83667d887510e09a47b211616"
  - number: "3727"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Cultural Revolution"
    date: "May 1966"
    region: "China"
    poem: |
      Mao unleashed the Red Guards —
      teenagers with armbands and little red books,
      smashing temples, humiliating teachers,
      denouncing their own parents.
      I walked Beijing's streets that year,
      dazibao posters layered like scales,
      the air electric with righteous cruelty.
      A civilization tore up its own roots
      on the Chairman's orders.
      Ten years of madness.
      The scholars sent to pig farms,
      the temples to rubble —
      China devoured its children
      and called it revolution.
    description: "Mao unleashed the Red Guards and China tore itself apart for ten years; the traveler walked poster-layered Beijing streets electric with righteous cruelty."
    status: "published"
    sha256: "37e1ad2f1c96032719f3ad44eb58f0cb7450dc5fbfe4a12fbc6967d51e8f98c7"
  - number: "3728"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "England's Finest Hour"
    date: "July 1966"
    region: "UK"
    poem: |
      Wembley, extra time, the World Cup final —
      Hurst's shot, the linesman's flag,
      "They think it's all over... it is now!"
      England 4, West Germany 2.
      I was in the stands, hoarse and half-mad,
      as thirty thousand voices shook the stadium.
      For one golden afternoon, the empire's ghost
      wore a football shirt and wept with joy.
      They've waited sixty years for the next one.
      That afternoon was worth the wait —
      or so the songs still claim.
    description: "England won the World Cup at Wembley in extra time; the traveler stood hoarse in the shaking stands for one golden afternoon the songs still claim was worth sixty years of waiting."
    status: "published"
    sha256: "c482d3f0ff5ff2064159afcf83d353bc9d8bbcb295df3e0270d03d138d794e93"
  - number: "3729"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "To Boldly Go"
    date: "September 1966"
    region: "USA"
    poem: |
      A starship, a five-year mission,
      a crew that looked like the future should:
      Black, Asian, Russian, alien — together.
      Star Trek premiered to modest ratings
      and a cancellation within three years.
      I watched the first broadcast in a motel room
      and thought: this is the dream
      the space race is really about.
      It failed on TV and conquered the world anyway —
      because the future it showed
      was one worth flying to.
    description: "Star Trek premiered with its five-year mission and a crew like the future should look; the traveler watched in a motel room and saw the dream the space race was really about."
    status: "published"
    sha256: "2308477c651f1d31b80e3acf8baced4e656362a902d2067cad0a933e6452217f"
  - number: "3730"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Black Panthers"
    date: "October 1966"
    region: "USA"
    poem: |
      Huey Newton and Bobby Seale
      started with law books and loaded guns —
      patrolling Oakland police, feeding hungry kids
      breakfast before school.
      The Black Panther Party: feared by Hoover,
      loved by the ghetto, complicated as history itself.
      I ate at one of their free breakfast programs,
      eggs and grits served with dignity.
      The guns made the headlines.
      The breakfasts made the difference.
      Revolutions, I keep learning,
      are served one meal at a time.
    description: "Newton and Seale founded the Black Panther Party in Oakland; the traveler ate eggs and grits at a free breakfast program and learned revolutions are served one meal at a time."
    status: "published"
    sha256: "13f07842198849250cc3b336016c3027f01eb6f168cebab6999fb0785693e225"
  - number: "3731"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Grinch Steals Christmas"
    date: "December 1966"
    region: "USA"
    poem: |
      A green grouch with a heart two sizes too small
      tried to steal Christmas from the Whos —
      and his heart grew three sizes that day.
      Boris Karloff narrated, Thurl Ravenscroft sang,
      and I watched it with my neighbor's kids,
      all of us howling at the Grinch's schemes.
      It's aired every year since.
      Sixty years of growing hearts.
      Dr. Seuss smuggled a sermon into a cartoon:
      Christmas doesn't come from a store.
      Maybe, indeed.
    description: "The Grinch's heart grew three sizes on TV; the traveler watched with the neighbor's kids as Dr. Seuss smuggled a sermon into a cartoon — Christmas doesn't come from a store."
    status: "published"
    sha256: "0893c98985d4312beebe7b7fab2bd9b2248558d4a49a499cfd51c26d327821b0"
  - number: "3732"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The First Super Bowl"
    date: "January 1967"
    region: "USA"
    poem: |
      Green Bay vs. Kansas City, Los Angeles Coliseum —
      the AFL-NFL championship, not yet called
      the Super Bowl, half the seats empty.
      I was there, and the crowd was thin,
      the hype thinner.
      Nobody knew they were watching
      the birth of America's true national holiday.
      Green Bay won 35-10.
      Sixty years later, a hundred million watch.
      It started here: a half-empty stadium
      and a game that would eat February.
    description: "Green Bay won the first Super Bowl in a half-empty Coliseum; the traveler sat in the thin crowd at the birth of America's true national holiday."
    status: "published"
    sha256: "2587fc17c303bd449286ad6379a7ae54b24395a016c04a318bd15ee8e4dbe2e9"
  - number: "3733"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Fire on the Pad"
    date: "January 1967"
    region: "USA"
    poem: |
      A spark in pure oxygen —
      and Grissom, White, and Chaffee
      died in their capsule on the launch pad,
      never leaving the ground.
      I was at the Cape that day.
      The silence afterward was the worst sound
      I've ever heard.
      NASA mourned, rebuilt, and flew again —
      because the moon doesn't wait,
      and the dead would have wanted it so.
      Apollo 1: the fire that taught America
      how to reach the stars safely.
    description: "Three astronauts died in a launch-pad fire at the Cape; the traveler heard the terrible silence afterward as NASA mourned, rebuilt, and flew again for the dead."
    status: "published"
    sha256: "5cefdcc2d807b9c3309b19a1cc05f9a0fea2570a934dd51bdd3ffaf071782d33"
  - number: "3734"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Sgt. Pepper"
    date: "June 1967"
    region: "UK"
    poem: |
      They'd stopped touring, grown mustaches,
      and walked into Abbey Road —
      and came out with a technicolor dream:
      Sgt. Pepper's Lonely Hearts Club Band.
      I bought it on release day,
      and the cover alone was a museum.
      Rock became art that summer.
      Everyone from grandmothers to gurus
      had an opinion.
      The Beatles stopped being a band
      and became the weather.
      Fifty years on, it still sounds
      like the future arriving in a marching band uniform.
    description: "The Beatles released Sgt. Pepper and rock became art; the traveler bought it on release day and heard the future arrive in a marching band uniform."
    status: "published"
    sha256: "68db8fb04d9bf3074d70ac5d6a8f12e03cf1c3f11aaed610bf1373179c7b4c1f"
  - number: "3735"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Six Days in June"
    date: "June 1967"
    region: "Middle East"
    poem: |
      Six days. That's all it took.
      Israel struck first, smashed three air forces
      on the ground, and redrew the map —
      Sinai, the West Bank, Gaza, the Golan.
      I covered it from a Tel Aviv rooftop,
      watching the jets go out and not come back.
      The swiftness stunned the world.
      The occupation that followed
      stunned it longer.
      Victory in six days; the consequences
      are still being fought, sixty years on.
    description: "Israel routed its neighbors in six days and redrew the region's map; the traveler watched jets leave a Tel Aviv rooftop as a six-day victory seeded sixty years of consequence."
    status: "published"
    sha256: "faa3566468c00deeb92b3d984dd1edfdebd0f944453b2b39c0f1b36345f93fc6"
  - number: "3736"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Detroit Burns"
    date: "July 1967"
    region: "USA"
    poem: |
      A raid on a blind pig, a hot Sunday morning —
      and Detroit exploded: five days,
      forty-three dead, two thousand buildings burned,
      tanks on American streets.
      I walked 12th Street with the Guard behind me,
      smoke in my lungs, a city eating itself.
      The deadliest riot in American history.
      The auto capital, hollowed out.
      Detroit never really recovered —
      and America learned, again,
      that you can't pave over a wound
      and call it a road.
    description: "America's deadliest riot raged five days in Detroit; the traveler walked smoke-filled 12th Street and learned you can't pave over a wound and call it a road."
    status: "published"
    sha256: "3163c4bafa9e681ec6bcd7b326c4fd0c395833267797bc497310ae01ebcafefa"
  - number: "3737"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Death of Che"
    date: "October 1967"
    region: "Bolivia"
    poem: |
      They caught him in a ravine in Bolivia —
      sick, starving, his rifle broken —
      and a sergeant shot him in a schoolhouse.
      I saw the photographs: Christ-like,
      eyes open, already a martyr.
      The CIA wanted him erased.
      Instead they developed the most famous
      photograph of the century.
      Che died that day in Vallegrande.
      The legend was born before the body was cold —
      on a million t-shirts, forever young,
      forever furious.
    description: "Che Guevara was executed in a Bolivian schoolhouse; the traveler saw the Christ-like photographs and watched erasure become the century's most famous image."
    status: "published"
    sha256: "72cf0dd71cba03419e48d996987d91f177b747fe73346bbd447c9e087694cab4"
  - number: "3738"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Tet"
    date: "January 1968"
    region: "Vietnam"
    poem: |
      The lunar new year — and the Viet Cong
      struck everywhere at once: Saigon, Hue,
      a hundred towns, even the US Embassy grounds.
      I was in Saigon when the rockets started,
      the city I'd known turned battlefield overnight.
      America won every firefight
      and lost the war on television.
      Walter Cronkite said it was unwinnable —
      and Johnson said if he'd lost Cronkite,
      he'd lost the country.
      Tet: the offensive that lost
      and won everything.
    description: "The Viet Cong struck across South Vietnam during Tet; the traveler huddled in Saigon as America won every firefight and lost the war on television."
    status: "published"
    sha256: "014d75c9adb42ee2928f9c219ddc5b04c239df838e9fb0bc4a47747ce432751b"
  - number: "3739"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Dreamer Falls"
    date: "April 1968"
    region: "USA"
    poem: |
      The Lorraine Motel, Memphis, evening —
      one shot from across the street,
      and Martin Luther King Jr. fell on the balcony.
      I was in Memphis that night.
      The wail that went up from the Black neighborhoods
      was like nothing I'd ever heard —
      a hundred cities burning in grief by morning.
      He'd dreamed out loud in Washington.
      They shot the dreamer.
      The dream, stubbornly, refused to die.
    description: "Martin Luther King Jr. was shot on a Memphis motel balcony; the traveler heard the wail rise from Black neighborhoods as a hundred cities burned — and the dream refused to die."
    status: "published"
    sha256: "c30a44f6ec1c0f6269b53e679d0cab88ff85cf7cc32d84452879f559880a8013"
  - number: "3740"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Paris in May"
    date: "May 1968"
    region: "France"
    poem: |
      It started with students and exams
      and ended with ten million workers on strike,
      barricades in the Latin Quarter,
      de Gaulle fleeing to a French army base in Germany.
      I manned a barricade on Rue Gay-Lussac,
      cobblestones in hand, tear gas in my lungs,
      while students debated revolution
      between volleys.
      "Be realistic — demand the impossible!"
      It nearly toppled France.
      It settled for changing everything else:
      the universities, the factories, the morals.
      May '68 lost the street and won the century.
    description: "Students and workers nearly toppled de Gaulle's France in May 1968; the traveler manned a barricade on Rue Gay-Lussac and watched a lost street win the century."
    status: "published"
    sha256: "9fe50ee2888a9d99a318aa1ae9e1fdf0f5196174b88a2e53532d2fb37782717d"
  - number: "3741"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Bobby Falls"
    date: "June 1968"
    region: "USA"
    poem: |
      He'd just won California —
      the Ambassador Hotel kitchen, midnight,
      well-wishers cheering —
      and the shots in the pantry.
      Robert Kennedy fell, and with him
      fell the last bright hope of that brutal year.
      I was in the hotel that night.
      The busboys cradled his head.
      He asked if everyone else was okay.
      Sixty-three days after Memphis.
      Two months after Tet.
      1968 kept taking, and taking,
      and taking.
    description: "Robert Kennedy was shot after winning California; the traveler stood in the Ambassador Hotel kitchen as 1968 kept taking and taking."
    status: "published"
    sha256: "c07da39185a40f24771ba52b9a55f68bde351c980c9c7db45a09ea176f4e6ee6"
  - number: "3742"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Tanks in Prague"
    date: "August 1968"
    region: "Czechoslovakia"
    poem: |
      The Prague Spring — Dubcek's smiling socialism,
      censorship lifted, hope in the air —
      lasted until the tanks came at midnight.
      Half a million Warsaw Pact troops.
      I was on Wenceslas Square at dawn,
      watching kids argue with tank crews,
      one boy placing flowers in a gun barrel.
      They crushed it in days.
      Brezhnev's doctrine: once socialist, always —
      by force if necessary.
      The flowers wilted. The lesson didn't:
      empires fear their own people most.
    description: "Soviet tanks crushed Czechoslovakia's Prague Spring; the traveler watched a boy place flowers in a gun barrel on Wenceslas Square at dawn."
    status: "published"
    sha256: "961a024f533ae517451f798c69507207d12a72d8e8a48eb2a91979fb765abe86"
  - number: "3743"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Raised Fists"
    date: "October 1968"
    region: "Mexico"
    poem: |
      The anthem played, the medals were hung —
      and Tommie Smith and John Carlos
      raised black-gloved fists to the Mexico City sky.
      I was in the stadium.
      The silence was enormous.
      They were sent home, banned, broke —
      and right.
      Fifty years later those fists are on every mural
      from Oakland to Soweto.
      Two sprinters, two gloves, one silent salute —
      and the world finally saw.
    description: "Black sprinters raised gloved fists on the Olympic podium in Mexico City; the traveler felt the enormous silence as two gloves became murals from Oakland to Soweto."
    status: "published"
    sha256: "0abfd4550214c4ee97fe3db126064f98758fa828671eb799bba6f0e5d882f56a"
  - number: "3744"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Christmas Around the Moon"
    date: "December 1968"
    region: "USA"
    poem: |
      Christmas Eve: three men circled the moon,
      and read Genesis to the whole earth —
      "In the beginning..."
      while the blue marble rose over the gray horizon.
      Earthrise: the photograph that changed everything.
      I listened with my family around the radio,
      and my mother wept.
      We'd gone to the moon
      and discovered the earth.
      That broadcast — a Bible reading from lunar orbit —
      is still the most-watched television
      in human history.
    description: "Apollo 8 astronauts read Genesis from lunar orbit on Christmas Eve as Earthrise stunned the world; the traveler listened with family and learned we'd gone to the moon and discovered the earth."
    status: "published"
    sha256: "285b7049359d95f4e98daeddee82520c0ab2686f89c2c211f6fe4737be61efa9"
  - number: "3745"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Supersonic Bird"
    date: "March 1969"
    region: "Europe"
    poem: |
      Concorde lifted off from Toulouse —
      sleek as a dart, twice the speed of sound,
      London to New York in three hours.
      I flew her once, years later,
      watching the curvature of the earth
      through a tiny window, champagne in hand.
      The future, it turned out, was too loud
      and too thirsty to last.
      But for thirty years, the rich
      could outrun the sun —
      and the rest of us could look up
      and dream at the contrail.
    description: "Concorde flew for the first time, promising the Atlantic in three hours; the traveler once watched earth's curvature through her tiny window as the future outran the sun."
    status: "published"
    sha256: "94ec2ad5474a1c1a150ef5aac0218c0247992b5ee75afdce85882c5b458cd472"
  - number: "3746"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Stonewall"
    date: "June 1969"
    region: "USA"
    poem: |
      The cops raided the Stonewall Inn, as usual —
      but this time the queens fought back.
      Bottles, bricks, three nights of rage
      in Greenwich Village.
      I was on Christopher Street that first night,
      and the joy in the defiance
      was like nothing I'd seen.
      Gay liberation ignited there —
      from a mafia-run bar with no fire exits
      to a movement that would change the law,
      the culture, the world.
      It started because people
      were tired of hiding.
    description: "Gays fought back at the Stonewall Inn and ignited gay liberation; the traveler stood on Christopher Street and felt the joy in defiance from people tired of hiding."
    status: "published"
    sha256: "f6d90280126d2a29c4c6cb662fe17e7bbdc8e71dd9d1e4206d46715c80cb282b"
  - number: "3747"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Helter Skelter"
    date: "August 1969"
    region: "USA"
    poem: |
      The Tate house, the LaBianca house —
      nights of ritual murder by a failed musician's
      brainwashed "family," apocalypse in their eyes.
      I covered the trial, watched Manson
      carve a swastika into his forehead,
      grinning at the cameras.
      The sixties' innocence died in those houses.
      The peace-and-love dream curdled
      into something feral.
      After Manson, the communes locked their doors,
      and the flower children started checking
      the locks twice.
    description: "The Manson cult's murders killed the sixties' innocence; the traveler covered the trial and watched the peace-and-love dream curdle into something feral."
    status: "published"
    sha256: "dd4383bfa57a91d47d4c320f60d3864863064c05565469e9b02a1cc6e077d30b"
  - number: "3748"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Three Days of Mud and Music"
    date: "August 1969"
    region: "USA"
    poem: |
      Half a million people in a muddy field
      in Bethel, New York — rain, no food,
      no shelter, and the greatest concert ever played.
      I was in that mud, soaked to the bone,
      when Hendrix played the anthem at dawn Monday
      to the faithful few who remained.
      Woodstock: the hippie dream's peak,
      three days of peace that actually worked.
      No violence. Just music and mud
      and half a million strangers sharing everything.
      It never happened again. Nothing ever does.
    description: "Half a million gathered at Woodstock for three days of mud and music; the traveler stood soaked as Hendrix played the anthem at dawn to the faithful few."
    status: "published"
    sha256: "9504d5d2f01641cb0b115130d6d78b981ce9bff6fef28113de6182db63bad5ee"
  - number: "3749"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Cash from a Wall"
    date: "September 1969"
    region: "USA"
    poem: |
      Chemical Bank put a machine in the wall —
      the first ATM in America —
      and it handed out cash after hours.
      I watched the first customers approach it
      like a wild animal, suspicious,
      then delighted.
      Banking left the counter that day.
      The teller's smile, the queue, the hours —
      all of it started dissolving into the machine.
      Now we tap glass and the money moves.
      It started with a hole in a New York wall.
    description: "The first ATM dispensed cash from a New York bank wall; the traveler watched suspicious customers turn delighted as banking left the counter forever."
    status: "published"
    sha256: "0d4730212de0e8026d77f9a032a95f28ee302205a117dd0d2db4bdf8fd4c51f6"
  - number: "3750"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "LO"
    date: "October 1969"
    region: "USA"
    poem: |
      UCLA to Stanford, the first ARPANET message:
      they typed LOGIN — and the system crashed
      after two letters.
      LO. The first word of the internet age
      was half a greeting.
      I was in the UCLA lab that night,
      and the engineers laughed till they cried.
      Then they rebooted, and typed it again,
      and it worked.
      Every email, every video, every everything —
      descended from those two letters
      and a crash.
    description: "The first internet message crashed after two letters — \"LO\"; the traveler laughed with the UCLA engineers before they rebooted and typed it again, and it worked."
    status: "published"
    sha256: "16f124f7b394cce46646ef576e9fb302e348192422f2085bb7fce2686d3e45e6"
  - number: "3751"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Sunny Days"
    date: "November 1969"
    region: "USA"
    poem: |
      A street where the monsters are friendly,
      a bird eight feet tall teaches the alphabet,
      and a green grouch loves his trash.
      Sesame Street premiered —
      built by educators, not entertainers,
      to give poor kids a head start.
      I visited the set in the early years,
      watched Big Bird learn his lines.
      It worked. It still works.
      Generations learned to count
      from a Count who was a vampire,
      and to read from a bird.
      Education's greatest trick:
      making it feel like play.
    description: "Sesame Street premiered with its friendly monsters and eight-foot bird; the traveler visited the set and watched education's greatest trick — making learning feel like play."
    status: "published"
    sha256: "8d4ba8e13dcdca603e4f368e61880f6e16851145db7140501110f7733d6250d7"
  - number: "3752"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Jumbo Jet"
    date: "January 1970"
    region: "USA"
    poem: |
      The 747 entered service —
      two aisles, four engines, four hundred souls,
      a flying building with a hump.
      Pan Am's Clipper Victor, New York to London.
      I was aboard an early flight,
      climbing the spiral staircase to the upper deck
      like ascending to a private heaven.
      Flying went mass-market that day.
      The jet set became just... the set.
      Everyone could go now.
      The world got its wings, coach class.
    description: "The 747 entered service with its spiral staircase and hump; the traveler climbed to the upper deck as flying went mass-market and the world got coach-class wings."
    status: "published"
    sha256: "c833e86e71ab345967146582d3bc7133cf4fb1b7b0c0df051808e579a19b19d4"
  - number: "3753"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Breakup"
    date: "April 1970"
    region: "UK"
    poem: |
      Paul announced it in a press release
      tucked into his solo album:
      the Beatles were over.
      I read the news in a London café,
      and the waitress cried into her apron.
      The sixties ended not with a bang
      but a lawyer's letter.
      Four lads who'd owned the planet
      went their separate ways.
      The music lived on — it always does —
      but the dream of them, together,
      died that April.
    description: "Paul's press release ended the Beatles; the traveler read it in a London café where the waitress cried into her apron as the sixties ended with a lawyer's letter."
    status: "published"
    sha256: "9d6ea2284f81e9674758dd756b333039e77f0192dab0700edfc672cb6b8b93ff"
  - number: "3754"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Earth Day"
    date: "April 1970"
    region: "USA"
    poem: |
      Twenty million Americans took to the streets —
      not for a war or a candidate, but for the planet.
      The first Earth Day: teach-ins, cleanups,
      a nation looking at its smog and saying enough.
      I marched in New York, and the strangest thing
      was the normalcy — accountants with signs,
      grandmothers chanting.
      The green movement went mainstream that day.
      Silent Spring had warned.
      Earth Day answered.
    description: "Twenty million Americans rallied for the planet on the first Earth Day; the traveler marched in New York among accountants with signs and chanting grandmothers."
    status: "published"
    sha256: "b34c51df1b5de779fbe58867f2522c72f92d25712188e58db3f3ff98b1997f57"
  - number: "3755"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Kent State"
    date: "May 1970"
    region: "USA"
    poem: |
      The Guard opened fire on unarmed students —
      thirteen seconds, sixty-seven shots,
      four dead, nine wounded.
      I was on that campus days later,
      the bloodstains still on the asphalt,
      flowers laid where Allison Krause fell.
      "Tin soldiers and Nixon coming."
      Campuses erupted nationwide.
      A government had shot its own children
      for protesting a war —
      and the war came home
      in the worst way possible.
    description: "Guardsmen killed four student protesters at Kent State; the traveler stood on the bloodstained asphalt days later as campuses erupted and the war came home."
    status: "published"
    sha256: "1f4847ae39810f77c8e5f5365a83f9f334b83980e51f0cc6e4d825068019c6b9"
  - number: "3756"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Pride Marches"
    date: "June 1970"
    region: "USA"
    poem: |
      A year after Stonewall, they marched —
      New York, Los Angeles, Chicago,
      thousands in the streets, no masks, no shame.
      The first Pride marches.
      I walked with the New York marchers
      up Sixth Avenue, and the bystanders
      didn't know whether to stare or cheer.
      Some did both.
      From a bar raid to a parade in twelve months —
      that's how fast dignity moves
      when people stop asking permission.
    description: "A year after Stonewall, gay pride marches filled American streets; the traveler walked up Sixth Avenue and watched dignity move at the speed of people done asking permission."
    status: "published"
    sha256: "e709e3cc16d02a92d6cd68266ba85c36e585aa8dd25e72c1d495206d9cc9ca05"
  - number: "3757"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Black September"
    date: "September 1970"
    region: "Jordan"
    poem: |
      King Hussein's army turned its guns
      on the Palestinian fighters in Jordan —
      ten days of slaughter, thousands dead,
      the PLO expelled to Lebanon.
      I was in Amman as the artillery spoke,
      a civil war inside the Arab cause.
      Black September: the month Palestinians
      learned that Arab brotherhood
      had limits, drawn in tank treads.
      The PLO left. The wound stayed.
      The region's griefs, I keep finding,
      are mostly family quarrels with armies.
    description: "Jordan's army crushed Palestinian fighters and expelled the PLO; the traveler heard artillery in Amman as Arab brotherhood showed its tank-tread limits."
    status: "published"
    sha256: "b4df3f48669d71a1c9889002a2d5a037eade11e7b7a9380903ccfc31c0c1383b"
  - number: "3758"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Little Coffee Shop"
    date: "March 1971"
    region: "USA"
    poem: |
      Pike Place Market, Seattle —
      three friends, a tiny store,
      fresh-roasted beans and a mermaid logo.
      Starbucks. I bought a pound there in '72,
      and the smell followed me down the street.
      It was just a coffee shop then.
      Nobody imagined the green mermaid
      would colonize every corner on earth.
      But that's how empires start:
      one good smell, one good cup,
      and a dream bigger than the storefront.
    description: "Starbucks opened as a tiny Seattle coffee shop with a mermaid logo; the traveler bought a pound in '72 and smelled an empire starting in one good cup."
    status: "published"
    sha256: "bae5a6ef6262a3cdbb6029ac2ed41687004be1b8a1e64b3dc5221930c9fc3817"
  - number: "3759"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The @ Sign"
    date: "March 1971"
    region: "USA"
    poem: |
      Ray Tomlinson needed a symbol
      to separate the user from the machine —
      and picked the @, languishing on keyboards,
      meaning "at" the price of.
      The first email: forgettable test text,
      sent to himself.
      I met Tomlinson years later; he couldn't remember
      what the first message said.
      Nobody can. But that little curled "a"
      became the most important character
      of the century — the hinge
      between every person and everywhere.
    description: "Tomlinson sent the first email and gave the @ sign its purpose; the traveler learned even he forgot the first message — but the little curled \"a\" became the century's hinge."
    status: "published"
    sha256: "a98eee66a4eb8781dac09c0d814e79d851007dbe93fd4d85b3b2edcc62c65039"
  - number: "3760"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Pentagon Papers"
    date: "June 1971"
    region: "USA"
    poem: |
      Daniel Ellsberg photocopied seven thousand pages
      of government lies about Vietnam —
      and the Times and the Post published them.
      Nixon tried to stop the presses.
      The Supreme Court said no.
      I read them in a newsroom at 2 a.m.,
      the coffee cold, the truth hot:
      they'd known it was unwinnable for years
      and sent the boys anyway.
      The press fought back that summer —
      and won.
    description: "Leaked Pentagon Papers revealed years of Vietnam lies; the traveler read them in a 2 a.m. newsroom as the press fought Nixon's gag order and won."
    status: "published"
    sha256: "2724badca99b48664da5d5749a7089c3f4cf2fc083c2c64273955a35df8fb6a9"
  - number: "3761"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Nixon Kills Gold"
    date: "August 1971"
    region: "USA"
    poem: |
      On a Sunday night, Nixon went on TV
      and cut the dollar loose from gold —
      "temporarily," he said.
      Fifty years later, still temporary.
      I watched it in a bar, and the old-timers
      shook their heads: money, unmoored,
      floating on nothing but faith.
      They were right. Money floats free now,
      a shared hallucination, rising and falling
      on confidence alone.
      The gold sat in Fort Knox, useless.
      Faith turned out to be the real reserve.
    description: "Nixon cut the dollar from gold on a Sunday night broadcast; the traveler watched old-timers shake their heads as money became a shared hallucination floating on faith."
    status: "published"
    sha256: "791ad447a03c364d534561213facb40a808e6f757f4c2f1970bf3be216cb68be"
  - number: "3762"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Chip That Thinks"
    date: "November 1971"
    region: "USA"
    poem: |
      Intel's 4004: 2,300 transistors
      on a chip the size of a fingernail —
      a whole computer's brain, for thirty dollars.
      I held one in Santa Clara,
      this speck that could add and subtract
      and follow instructions.
      The engineers were giddy.
      They knew. They absolutely knew.
      Every laptop, every phone, every rocket —
      all of it, squeezed from this speck.
      The computer left the room that day
      and started its long journey into your pocket.
    description: "Intel's 4004 put a computer on a fingernail-sized chip; the traveler held the giddy engineers' speck and watched the computer begin its journey into every pocket."
    status: "published"
    sha256: "8cce1c4e78333d833048ed44a5b436cab52549a443cbdefc3140d1d5a67050c1"
  - number: "3763"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Bangladesh Is Born"
    date: "December 1971"
    region: "Bangladesh"
    poem: |
      East Pakistan broke away in blood —
      a million dead, ten million refugees,
      Indian tanks rolling in December —
      and Bangladesh was born, baptized in the worst
      birth pangs of the century.
      I walked the refugee camps in Calcutta,
      cholera and monsoon and endless lines.
      Then the surrender: 93,000 prisoners,
      the largest since World War II.
      A nation rose from the killing fields,
      scarred and singing.
      Bengalis finally had a country
      that spoke their language.
    description: "Bangladesh broke away in blood after a million dead; the traveler walked Calcutta's refugee camps, then watched a scarred nation rise singing in its own language."
    status: "published"
    sha256: "ced27e228f17420c5a04aced71869db7e4eca144eee29c9bd5b1faaa5a370fce"
  - number: "3764"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Nixon in China"
    date: "February 1972"
    region: "China"
    poem: |
      The most anti-communist president alive
      shook Mao's hand in Beijing —
      a week that shook the world, they said,
      and for once the cliché fit.
      I watched the banquet toasts on television,
      Nixon wielding chopsticks like a man
      defusing a bomb.
      The bamboo curtain parted.
      Ping-pong opened what diplomacy couldn't.
      Twenty-five years of silence ended
      with a handshake and a toast —
      and the Cold War's geometry changed forever.
    description: "Nixon shook Mao's hand in Beijing, parting the bamboo curtain; the traveler watched him wield chopsticks like a bomb-disposal man as the Cold War's geometry changed."
    status: "published"
    sha256: "a9401e01eb36ab4117310d40ec4271e3aced0a73fb9fd338bb71df7114b0a729"
  - number: "3765"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Break-In"
    date: "June 1972"
    region: "USA"
    poem: |
      Five burglars caught in the Watergate,
      tape on the door locks, wiretap gear —
      a "third-rate burglary," the press secretary said.
      I was in Washington that summer,
      and nobody thought it mattered.
      Two young reporters did.
      Woodward, Bernstein, a garage source —
      they pulled the thread, and the sweater unraveled:
      dirty tricks, slush funds, the president's voice
      on tape.
      It started with tape on a door lock.
      It ended with a resignation.
    description: "Burglars were caught at the Watergate in a \"third-rate burglary\"; the traveler watched two young reporters pull the thread until the presidency unraveled."
    status: "published"
    sha256: "b1ff425644a1697e0ffbe7d01bf0c3392afc8f91f464074470c006e15e6c8b51"
  - number: "3766"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Munich"
    date: "September 1972"
    region: "Germany"
    poem: |
      Dawn at the Olympic Village —
      Black September terrorists took eleven Israelis,
      and the world watched the standoff live.
      The rescue failed at Fürstenfeldbruck airfield.
      All the hostages died.
      I was in the press center when Jim McKay said it:
      "They're all gone."
      The Games went on, in shadow.
      Terrorism had found television —
      and never let go.
    description: "Terrorists murdered eleven Israeli athletes at the Munich Olympics; the traveler heard Jim McKay say \"they're all gone\" as terrorism found television and never let go."
    status: "published"
    sha256: "df22eac6a76f07679a811ca27475661cc10b3f242099a59e99f8e4b197237252"
  - number: "3767"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Cable's Big Bet"
    date: "November 1972"
    region: "USA"
    poem: |
      HBO flickered on — Home Box Office,
      movies uncut and commercial-free,
      beamed to a few thousand subscribers.
      I watched the launch night in a Manhattan bar:
      a hockey game and a movie, no ads.
      People laughed at the idea of paying for TV.
      They stopped laughing within a decade.
      Cable's big bet paid off enormous —
      three channels became three hundred,
      and television never belonged
      to the networks alone again.
    description: "HBO launched with uncut movies and no ads; the traveler watched launch night in a Manhattan bar as people laughed at paying for TV — then stopped laughing."
    status: "published"
    sha256: "b7c71189306f182b07a3d0a7e0c5148bf15a983b8fee56d2b062947203176c59"
  - number: "3768"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Pong"
    date: "November 1972"
    region: "USA"
    poem: |
      A blip, a bloop, two paddles —
      Atari's Pong blinked onto a barroom screen
      in Sunnyvale, and the coin box overflowed
      by closing time.
      I played it that first week,
      twisting the knob, drunk on simplicity.
      The first video game the public ever loved.
      Nolan Bushnell built an industry
      out of a bouncing dot.
      Every billion-dollar game since —
      every esports arena, every console war —
      started with that blip.
    description: "Atari's Pong blipped onto bar screens and the coin box overflowed; the traveler twisted the knob in Sunnyvale as a bouncing dot built an industry."
    status: "published"
    sha256: "358c37a7b0dc4d4cacadee6c59b4e4706f56e8d8af601e476aa0955b01e9e08b"
  - number: "3769"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Last Footprints"
    date: "December 1972"
    region: "USA"
    poem: |
      Cernan climbed the ladder last,
      paused, and left the final bootprints —
      then the lunar module rose,
      and the moon went quiet.
      Apollo 17. The last moonwalkers.
      I watched the splashdown on television,
      and nobody said what we all felt:
      we might not go back.
      We haven't. Fifty years of footprints
      sitting in moondust, waiting.
      They left a plaque: "We came in peace
      for all mankind."
      It's still there. We're still here.
    description: "The last Moonwalkers left their bootprints in December 1972; the traveler watched the splashdown knowing the plaque still waits on the moon while we stayed home."
    status: "published"
    sha256: "722e144574f9a7ee008c619a644ef06bfded5a55b5c1545f49927e3630ca4261"
  - number: "3770"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Roe v. Wade"
    date: "January 1973"
    region: "USA"
    poem: |
      Seven to two: the Court said
      the Constitution protects a woman's choice.
      Roe v. Wade legalized abortion nationwide —
      and the culture war ignited overnight.
      I was outside the Court that morning,
      watching both crowds gather,
      already shouting past each other.
      Fifty years of marching, praying, legislating —
      the most contested sentence in American law.
      Whatever you believe about it,
      that January morning split the country
      into two Americas that never reconciled.
    description: "The Court legalized abortion and ignited the culture war; the traveler stood outside as two crowds gathered, already shouting past each other into fifty years of division."
    status: "published"
    sha256: "4457e24d33be1b534110bb8da30a22516d857b3c3ca46379a103828c544d92d9"
  - number: "3771"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Peace with Honor?"
    date: "January 1973"
    region: "Vietnam"
    poem: |
      Kissinger shook hands in Paris,
      the papers were signed, the POWs came home —
      "peace with honor," they called it.
      I watched the last American troops
      fly out of Saigon, and the honor
      felt thin as the paper.
      The war ground on without us.
      Two years later the tanks rolled in anyway.
      We signed our way out
      and called it peace.
      The Vietnamese kept dying,
      and nobody called it anything.
    description: "America signed its way out of Vietnam with \"peace with honor\"; the traveler watched the troops fly out as the war ground on without them toward Saigon's fall."
    status: "published"
    sha256: "a21314d1cf4334d0d8bf5f349a52d253af287614c12bdd757edfa0fc81a97451"
  - number: "3772"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Dark Side"
    date: "March 1973"
    region: "UK"
    poem: |
      A heartbeat, a cash register, a prism —
      Pink Floyd's Dark Side of the Moon
      began its decades-long play.
      I bought it the week it came out,
      dropped the needle, and time bent.
      It stayed on the charts for fourteen years.
      Fourteen years.
      An album about madness, money, and mortality
      became the soundtrack of half the planet.
      The prism on the cover says it all:
      white light in, every color out —
      that's what the seventies did to us.
    description: "Pink Floyd's Dark Side of the Moon began its fourteen-year chart run; the traveler dropped the needle and watched white light split into every color of the decade."
    status: "published"
    sha256: "c1dbe663eb89872e2fca888d7f8acf3a5009b8e124eb816e697692c1619bf3b9"
  - number: "3773"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A House in Orbit"
    date: "May 1973"
    region: "USA"
    poem: |
      Skylab went up — America's first space station,
      a converted rocket stage, big as a house,
      crews living in orbit for months.
      I toured the backup module in Houston,
      floating through it in my mind:
      a shower in zero-g, a window on the world.
      The crews fixed it with a parasol —
      a sunshade deployed by hand, in space.
      Ingenuity, orbiting.
      It fell in '79, scattered over Australia.
      But for six years, humanity had an address
      above the sky.
    description: "Skylab hosted America's first space-station crews in a converted rocket stage; the traveler toured the backup module and saw humanity keep an address above the sky."
    status: "published"
    sha256: "df52bdf99b81b2c086b9b8a662e80a7da539a1f8fb26aeb9fb94f2750a8d86fe"
  - number: "3774"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The October War"
    date: "October 1973"
    region: "Middle East"
    poem: |
      Yom Kippur: Egypt and Syria struck —
      tanks across the canal, jets over the Golan —
      and Israel, caught praying, nearly broke.
      I was in Tel Aviv as the sirens wailed,
      reservists racing to the front in taxis.
      The superpowers teetered: Brezhnev threatened,
      Nixon went to DEFCON 3.
      Eighteen days. Then the ceasefire.
      Israel survived. Egypt regained its honor.
      And the oil weapon was loaded —
      the world was about to feel it.
    description: "Egypt and Syria attacked Israel on Yom Kippur; the traveler heard Tel Aviv's sirens as the superpowers teetered at DEFCON 3 and the oil weapon loaded."
    status: "published"
    sha256: "1dbfadf99c39507e76fb2c6bfa34cc0fc15dc6429c247ab300af5968ffb20d76"
  - number: "3775"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Oil Shock"
    date: "October 1973"
    region: "Middle East"
    poem: |
      The Arab states turned off the tap —
      oil embargo, prices quadrupled,
      gas lines snaking around American blocks.
      I waited in one in New Jersey,
      odd-even rationing, tempers flaring,
      a nation learning what dependence feels like.
      The shock rewrote everything:
      small cars, solar panels, speed limits,
      the first whisper of energy independence.
      The desert had a lever,
      and the world learned it could be pulled.
    description: "Arab states cut oil shipments and gas lines snaked around the block; the traveler waited in a New Jersey line as the world learned the desert held a lever."
    status: "published"
    sha256: "1144134e3eaf34e0b5c877e22d259480eb5ca3505edb7603dd78d07131225463"
  - number: "3776"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Exorcist"
    date: "December 1973"
    region: "USA"
    poem: |
      A little girl's head spun,
      pea soup flew, and audiences fainted —
      The Exorcist terrified the planet
      like no film before it.
      I saw it opening week in Georgetown,
      where it was filmed; the line wrapped the block,
      people clutching rosaries.
      Horror grew up that winter.
      It wasn't monsters anymore —
      it was faith itself, possessed.
      Priests debated it. The Vatican weighed in.
      A horror film, discussed like theology.
    description: "The Exorcist terrified audiences worldwide; the traveler stood in a Georgetown line wrapping the block as horror grew up and priests debated a film like theology."
    status: "published"
    sha256: "c8b07846703370918d3e28c76389986e714761e05e8d606b2f09f6ad988cc968"
  - number: "3777"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Hello, People"
    date: "March 1974"
    region: "USA"
    poem: |
      Time Inc. launched People —
      celebrity news, human interest,
      Mia Farrow on the first cover.
      I picked it up at a newsstand,
      all glossy photos and short paragraphs.
      It seemed harmless. It was the seed.
      Celebrity culture got its bible that March —
      and within a generation,
      the famous-for-being-famous,
      the paparazzi, the whole glittering machine.
      We stopped reading about the world
      and started reading about the people
      pretending to be the world.
    description: "People magazine debuted with Mia Farrow on the cover; the traveler bought it at a newsstand and watched celebrity culture get the bible that would eat the world."
    status: "published"
    sha256: "6d4076f546e0436b14a0462eecb68b23ffba6dcc2b6141c6c62a6a1c35bb9e3a"
  - number: "3778"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Clay Army"
    date: "March 1974"
    region: "China"
    poem: |
      Farmers digging a well struck clay —
      not water, but soldiers: thousands of them,
      life-size, rank on rank, guarding an emperor
      dead two thousand years.
      I walked those pits at Xi'an,
      row after row of terracotta warriors,
      each face different, each staring east.
      Qin Shi Huang took an army to the grave
      and it waited, patient as stone,
      for peasants to find it.
      The dead, I keep learning,
      are never quite done with us.
    description: "Farmers digging a well unearthed China's buried terracotta warriors; the traveler walked the pits at Xi'an among thousands of patient stone faces staring east."
    status: "published"
    sha256: "c16527ca0434f826fe7ac521610491d9fc58966aceb2feb40431159129bb84c1"
  - number: "3779"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Beep"
    date: "June 1974"
    region: "USA"
    poem: |
      A pack of Wrigley's gum in Troy, Ohio —
      the first barcode scan. Beep.
      Ten cents of gum, and the laser read it.
      I was in that Marsh supermarket,
      and the cashier grinned at the sound.
      Checkout changed forever that beep:
      inventory, prices, the whole humming
      machinery of modern retail —
      all from ten cents of gum
      and a pattern of lines.
    description: "A pack of gum became the first barcode scan in an Ohio supermarket; the traveler heard the beep that rewired checkout, inventory, and modern retail."
    status: "published"
    sha256: "ee4881a1f8924af940a2441daf1f3ea9d927846d3a26b716918245f0af5c24e6"
  - number: "3780"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Nixon Resigns"
    date: "August 1974"
    region: "USA"
    poem: |
      He gave the V-sign on the White House lawn,
      boarded the helicopter, and flew home in disgrace —
      the first president to resign.
      I watched the speech the night before,
      the jowls, the "I am not a crook" echo.
      Watergate had done it: the tapes, the cover-up,
      the Saturday Night Massacre.
      The system worked. Barely.
      A president forced out by evidence
      and the press and the law —
      proof, for one shining moment,
      that nobody is above it.
    description: "Watergate forced Nixon's resignation; the traveler watched the farewell V-sign from the White House lawn as evidence, press, and law proved nobody is above it."
    status: "published"
    sha256: "e5ad2637169275c1a5b09504a66a66ea45f57b29e57f17c769c94ef9bc9efc8c"
  - number: "3781"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Lion Falls"
    date: "September 1974"
    region: "Ethiopia"
    poem: |
      Haile Selassie — the Lion of Judah,
      god to the Rastafari, emperor for forty-four years —
      deposed by his own army, led away in a Volkswagen.
      I was in Addis Ababa that week,
      the palace empty, the lions in the zoo
      still roaring for a master gone.
      Famine and war followed, the Derg's red terror.
      Ancient Ethiopia, three thousand years a kingdom,
      ended with an old man in a Beetle.
    description: "Ethiopia's emperor was deposed by his own army; the traveler walked empty Addis Ababa halls as three thousand years of kingdom ended with an old man in a Volkswagen."
    status: "published"
    sha256: "adc0100ad6f291b4ba509e220fd8405d2ac916d821d9024b99e3f158c8f31efe"
  - number: "3782"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Cube"
    date: "1974 CE"
    region: "Hungary"
    poem: |
      Ernő Rubik built a twisting puzzle
      to teach his architecture students —
      and couldn't solve it himself for a month.
      The Cube: 43 quintillion combinations,
      six colors, one maddening click.
      I scrambled one in a Budapest café,
      and the table next to me finished it
      while I was still on white.
      It conquered the planet —
      every desk, every backpack,
      every frustrated genius at 2 a.m.
    description: "Rubik's Cube twisted onto shelves with 43 quintillion combinations; the traveler scrambled one in Budapest while the next table solved it — every desk's 2 a.m. tormentor."
    status: "published"
    sha256: "b8f33746bb495d926b252bedb1918fc19890c8e0ba62a545e4d218638f9f2f02"
  - number: "3783"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Two Kids and a Computer"
    date: "April 1975"
    region: "USA"
    poem: |
      Gates and Allen — two kids from Seattle,
      nineteen and twenty-two —
      founded Micro-Soft to sell a BASIC
      for the Altair kit.
      I met them in Albuquerque that year,
      all hair and hurry, coding through the night.
      Software becomes king, they said.
      Everyone laughed. They were right.
      From a rented office to the biggest company
      on earth — built on the bet
      that the program matters more
      than the machine.
    description: "Gates and Allen founded Microsoft in Albuquerque; the traveler met the two kids coding through the night on their bet that software would become king."
    status: "published"
    sha256: "60320a0b5e69d2a43ca06b64d0832d07e3297c3d43e824e767ffcd27644ec606"
  - number: "3784"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Saigon Falls"
    date: "April 1975"
    region: "Vietnam"
    poem: |
      The helicopters lifted off the embassy roof,
      pushing the last ones out over the sea —
      tanks crashed the palace gates by noon.
      Saigon fell. Vietnam united under Hanoi.
      I watched it from a rooftop nearby,
      the thump of rotors, the panic below.
      Twenty years, 58,000 Americans,
      millions of Vietnamese —
      for this morning.
      The war ended the way it began:
      in confusion, and far from home.
    description: "Helicopters lifted off the Saigon embassy roof as tanks crashed the palace gates; the traveler watched from a nearby rooftop as twenty years ended in confusion."
    status: "published"
    sha256: "896f1b97e30666e8189a96caaaab658cdc93cb3ad60f15c340f4ab4b06527e7a"
  - number: "3785"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Jaws"
    date: "June 1975"
    region: "USA"
    poem: |
      Two notes. Duh-duh.
      A shark emptied the beaches,
      and the summer blockbuster was born.
      I saw Jaws opening weekend,
      the audience screaming, the lines for weeks.
      Spielberg — twenty-seven years old —
      invented the modern movie:
      big, loud, everywhere at once.
      Nobody swam that summer.
      Everybody went to the movies.
      Hollywood learned the formula
      and never forgot it.
    description: "Jaws emptied the beaches on two notes and birthed the summer blockbuster; the traveler sat in a screaming opening-weekend crowd as a 27-year-old Spielberg rewrote Hollywood."
    status: "published"
    sha256: "3fc5730220174b6b16c47989bc03164d6fec2ead20141a975fa94396bad01c7e"
  - number: "3786"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Handshake in Space"
    date: "July 1975"
    region: "Space"
    poem: |
      An American Apollo docked with a Soviet Soyuz —
      the hatch opened, and Stafford and Leonov
      shook hands in orbit, 140 miles up.
      I watched it live, and the symbolism
      was almost too much: enemies, shaking hands,
      above a planet they'd nearly destroyed twice.
      Détente, in zero gravity.
      It didn't last — nothing in the Cold War did —
      but for one orbit, humanity was one crew.
    description: "American and Soviet ships docked and enemies shook hands in orbit; the traveler watched live as détente floated in zero gravity above a twice-nearly-destroyed planet."
    status: "published"
    sha256: "b35ef05db8070750968f2ab2a5ae430a25a92ff62e6f99568e01fe246d8eae73"
  - number: "3787"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Live from New York"
    date: "October 1975"
    region: "USA"
    poem: |
      "Live from New York, it's Saturday Night!"
      A gang of twenty-somethings —
      Belushi, Aykroyd, Radner —
      took over late-night TV and made comedy dangerous.
      I was in the studio audience that first season,
      and the chaos was the point.
      They mocked presidents, priests, and sponsors,
      sometimes in the same sketch.
      Fifty years it's been running.
      Comedy's boot camp, America's mirror —
      live, unedited, unforgiving.
    description: "Saturday Night Live premiered with its gang of twenty-somethings; the traveler sat in the first-season audience as comedy got dangerous, live, and unforgiving."
    status: "published"
    sha256: "6e790d98b24a020574e2a18c8a32ad5189dc6243db306992f0d60df379455a40"
  - number: "3788"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Forgotten Invasion"
    date: "December 1975"
    region: "East Timor"
    poem: |
      Indonesia invaded East Timor —
      tanks, paratroopers, a quarter of the population dead
      over twenty-four years —
      and the world looked away.
      I was one of the few who went,
      filing stories nobody printed.
      The UN condemned. Nobody acted.
      Oil and alliances mattered more.
      East Timor bled in the dark
      while the cameras pointed elsewhere.
      Remember this when they tell you
      the world always notices.
      It doesn't. It chooses.
    description: "Indonesia seized East Timor and the world looked away through twenty-four years of dying; the traveler filed stories nobody printed and learned the world chooses what to notice."
    status: "published"
    sha256: "4393ab1416def3e9e5d7e7377bd5fd7da674ae0d940e1c4979584ec8e20fca98"
  - number: "3789"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Apple Is Born"
    date: "April 1976"
    region: "USA"
    poem: |
      Two Steves in a Los Altos garage —
      Wozniak's circuit board, Jobs's reality distortion —
      Apple Computer Company, founded on April Fool's Day.
      I visited that garage, all soldering smoke
      and impossible optimism.
      They sold fifty boards to a byte shop.
      Fifty.
      From that garage to the most valuable company
      in human history —
      built on the belief that computers
      should be beautiful.
    description: "Two Steves started Apple in a Los Altos garage on April Fool's Day; the traveler breathed the soldering smoke of fifty circuit boards and impossible optimism."
    status: "published"
    sha256: "274bc6906b3af77af593af35e551c7200173213f981caecc4d44f7acda142948"
  - number: "3790"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Two Hundred Candles"
    date: "July 1976"
    region: "USA"
    poem: |
      America turned two hundred —
      tall ships in New York harbor,
      fireworks over every town,
      a nation throwing itself a birthday party.
      I sailed with the parade of ships,
      canvas everywhere, horns sounding.
      Bicentennial fever: everyone suddenly
      into colonial costumes and history.
      For all its wounds — Vietnam fresh,
      Watergate fresher — the country
      blew out the candles grinning.
      Two hundred years. Still standing.
      Still arguing. Still here.
    description: "America turned two hundred with tall ships and fireworks; the traveler sailed the harbor parade as a wounded nation blew out its candles grinning."
    status: "published"
    sha256: "92607665376b13c87ab2a3a334e88ca54d042b26ddc8b3f4c7e3c8096f1e24f8"
  - number: "3791"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Footprints on Mars"
    date: "July 1976"
    region: "USA"
    poem: |
      Viking 1 touched down on Chryse Planitia —
      and the first photo from the surface of Mars
      came back: rocks, dust, a pink sky.
      I was at mission control for the landing,
      and the cheer shook the building.
      Another planet. We were standing on it —
      by robot proxy, but standing.
      The photos showed a desert waiting.
      Forty years later we're still staring at it,
      still planning the trip.
      Mars waits. It's good at that.
    description: "Viking landed and sent the first photos from Mars; the traveler cheered at mission control as humanity stood on another planet by robot proxy."
    status: "published"
    sha256: "7417022f9861ec2b48024e0348157fc85c9be7f13dd519f093557bbaaaba9881"
  - number: "3792"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Earth Shakes Tangshan"
    date: "July 1976"
    region: "China"
    poem: |
      3:42 a.m.: the earth convulsed —
      Tangshan flattened in seconds,
      an industrial city become a graveyard.
      Hundreds of thousands dead —
      the century's worst quake by toll.
      I walked the ruins days later,
      rescue teams digging with bare hands,
      the dust never settling.
      China, in its closed years,
      refused most foreign help.
      Pride, even in rubble.
      The dead deserved better
      than politics.
    description: "An earthquake flattened Tangshan, killing hundreds of thousands; the traveler walked ruins where rescuers dug with bare hands and pride refused foreign help."
    status: "published"
    sha256: "d4bc77ccf10d204e217bc4d640b8b438865fd9f1a8125dbec93aebec96aa3a0f"
  - number: "3793"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Mao Is Gone"
    date: "September 1976"
    region: "China"
    poem: |
      The Chairman died — Mao Zedong,
      the peasant's son who remade China
      and broke it, both at once.
      I was in Beijing for the mourning,
      a million people filing past the crystal coffin,
      some weeping, some just... exhaling.
      Ten years of Cultural Revolution,
      thirty years of campaigns.
      China exhaled that September.
      What came next — the opening, the boom —
      was built on the silence he left.
    description: "Mao died and China exhaled after decades of campaigns; the traveler filed past the crystal coffin in Beijing as a million mourners breathed out."
    status: "published"
    sha256: "0e306f24a6b3c9a0e8a4b07780bcf2cfb9a71b7fdce2184229bd60c52968d597"
  - number: "3794"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Rocky"
    date: "November 1976"
    region: "USA"
    poem: |
      A nobody boxer from Philadelphia,
      a shot at the champ, fifteen rounds —
      he loses the decision and wins everything.
      I saw Rocky in a packed theater,
      and when he went the distance,
      the audience stood and roared.
      Stallone wrote it in three days,
      shot it in twenty-eight.
      The underdog's anthem for all time.
      America needed that story in '76 —
      broke, tired, post-Watergate.
      Rocky said: get up. Go the distance.
    description: "A nobody boxer went the distance and underdogs cheered; the traveler stood with a roaring theater as Stallone's three-day script told broke, tired America to get up."
    status: "published"
    sha256: "d48529ab707ada2956c2573a2a42c6764939cd6b90f23ca811ba9abbffb1b7a1"
  - number: "3795"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Roots"
    date: "January 1977"
    region: "USA"
    poem: |
      For eight nights, America watched —
      Kunta Kinte, the Middle Passage,
      the lash, the generations —
      and the nation confronted its past.
      I watched the finale with a Black family
      in Atlanta; the grandmother wept quietly,
      saying "that's us, that's us."
      A hundred million viewers.
      Roots did what textbooks couldn't:
      made slavery a family story,
      told around the national television fire.
    description: "The Roots miniseries gripped America for eight nights; the traveler watched the finale in Atlanta as a grandmother whispered \"that's us\" and slavery became a family story."
    status: "published"
    sha256: "0fa2bd45d1f4b04617ba7fca37e8bb9555eaee8e8fd2bcf7d339e562d70ef591"
  - number: "3796"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Galaxy Far, Far Away"
    date: "May 1977"
    region: "USA"
    poem: |
      A farm boy, a princess, a smuggler,
      a wizard with a laser sword —
      Star Wars premiered, and movies became myth.
      I was in line opening day at Grauman's,
      the crowd buzzing like a hive.
      When the Star Destroyer rumbled overhead,
      the audience gasped as one.
      Lucas had bottled Joseph Campbell
      and sold it with popcorn.
      Cinema's campfire story —
      told ever since, in every galaxy.
    description: "Star Wars premiered and movies became myth; the traveler stood in Grauman's opening-day line as a Star Destroyer rumbled overhead and the audience gasped as one."
    status: "published"
    sha256: "fc652a387cd1900257f2ec810c67f6a0f81efbb5341c4dd50bc71bfce4e8c3a4"
  - number: "3797"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Apple II"
    date: "June 1977"
    region: "USA"
    poem: |
      A beige box that plugged into your TV —
      the Apple II, ready-made, no soldering required.
      I bought one of the first,
      carried it home like a newborn.
      VisiCalc came later, and the offices fell.
      But that June, it was just a beautiful machine
      that beeped and blinked in your living room.
      Homes went digital that summer —
      one beige box at a time.
    description: "Apple's ready-made computer plugged into home TVs; the traveler carried one home like a newborn as living rooms went digital one beige box at a time."
    status: "published"
    sha256: "27caf9d2bf741efb4309f1e012c782265246bc3789ef33cbe2c2aaf48963d773"
  - number: "3798"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The King of Rock'n'Roll Dies"
    date: "August 1977"
    region: "USA"
    poem: |
      Forty-two years old, found on the bathroom floor —
      Elvis, the King, gone.
      I drove to Graceland that week,
      and the gates were buried in flowers,
      fans weeping like family.
      He'd been the future in '56 —
      by '77 he was a beautiful ruin.
      The world got the message:
      even kings are mortal.
      Graceland became a shrine.
      The King left the building —
      and never really left.
    description: "Elvis died at forty-two; the traveler drove to flower-buried Graceland gates as the world learned even kings are mortal — and the King never really left."
    status: "published"
    sha256: "fcc0cac03390edd9c85a9a9dd043f8282d98b4f78bf136024fd7013bef097994"
  - number: "3799"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Golden Record"
    date: "September 1977"
    region: "USA"
    poem: |
      Voyager launched carrying a golden record —
      greetings in 55 languages, whale songs,
      Chuck Berry, a baby's laugh —
      Earth's mixtape for the stars.
      I watched the launch at the Cape,
      that golden disc riding into the dark.
      It still flies. It's in interstellar space now,
      the farthest human-made thing.
      If anyone finds it, they'll hear us:
      we were here, we sang, we laughed,
      we sent our best.
    description: "Voyager launched carrying Earth's sounds on a golden record; the traveler watched it ride into the dark — still flying, still carrying our songs to the stars."
    status: "published"
    sha256: "f84ed194f4289e635f256170eb897e431d95dcff5190aeee77fa5ed104da468b"
  - number: "3800"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Disco Inferno"
    date: "December 1977"
    region: "USA"
    poem: |
      Saturday Night Fever: white suits,
      a light-up dance floor, the Bee Gees wailing —
      and disco inferno'd across the planet.
      I went to Studio 54 once, stood in the corner,
      watched beautiful people dance like the world
      was ending beautifully.
      It was glorious. It was ridiculous.
      It burned out in two years —
      but for one shining moment,
      everyone in America owned a white suit
      and knew the hustle.
    description: "Saturday Night Fever ignited disco worldwide; the traveler stood in a Studio 54 corner watching beautiful people dance like the world was ending beautifully."
    status: "published"
    sha256: "cce09e840c8d1cc25a920e930e185bc5464918172d88a45004bfc95ec3af5107"
  - number: "3801"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Grease"
    date: "June 1978"
    region: "USA"
    poem: |
      Summer nights, Thunderbirds,
      Travolta's hips and Newton-John's transformation —
      Grease sang the fifties back to life.
      I saw it at a drive-in, windows down,
      the whole lot singing along.
      It was nostalgia as rocket fuel:
      the fifties, scrubbed clean and set to music.
      A generation that never lived it
      fell in love with it anyway.
      That's the trick of the past —
      it's always better with a soundtrack.
    description: "Grease sang the fifties back with summer nights and Thunderbirds; the traveler sang along at a drive-in as nostalgia became rocket fuel with a soundtrack."
    status: "published"
    sha256: "f15a571ede85b8fbe3fd83003491764de167f4bc9d65f9a0a5e0995cfe1b232f"
  - number: "3802"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "I Hate Mondays"
    date: "June 1978"
    region: "USA"
    poem: |
      A fat orange cat who hates Mondays,
      loves lasagna, and kicks a dog off the table —
      Garfield debuted in the funnies.
      I clipped the first strips,
      this gloriously lazy cat saying
      what every office worker felt.
      Davis drew the perfect anti-hero:
      selfish, sleepy, honest.
      Lasagna sales rose. Mondays stayed hated.
      Forty years of strips —
      proof that the deepest philosophy
      is a cat nap.
    description: "Garfield the cat debuted in the funnies, hating Mondays and loving lasagna; the traveler clipped the first strips of the deepest philosophy — a cat nap."
    status: "published"
    sha256: "baf7540040eccffdefaadb3c732772e806b5a745bb220c5408c365e01a50dd72"
  - number: "3803"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Test-Tube Baby"
    date: "July 1978"
    region: "UK"
    poem: |
      Louise Brown — the first IVF baby,
      conceived in a dish in Oldham,
      born screaming and perfect.
      I was outside the hospital that night,
      the press pack buzzing.
      The Vatican frowned. The scientists glowed.
      Infertility met hope in a petri dish.
      Millions of test-tube babies since —
      each one a small miracle of persistence.
      It started with Louise, and a dish,
      and two doctors who wouldn't give up.
    description: "Louise Brown was born through IVF, the first test-tube baby; the traveler stood outside the Oldham hospital as infertility met hope in a petri dish."
    status: "published"
    sha256: "9b312524e78f6a0b04a342ef653eb7e0ca6c40560c94cf9eb0b476c14fb85523"
  - number: "3804"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Peace at Camp David"
    date: "September 1978"
    region: "Middle East"
    poem: |
      Thirteen days in the Maryland woods —
      Carter, Sadat, Begin, no ties, no sleep —
      and two enemies signed a peace.
      I was outside the gates when they emerged,
      blinking, shaking hands like survivors.
      Egypt got Sinai. Israel got peace
      with its strongest foe.
      Sadat would be assassinated for it.
      Begin would be haunted by it.
      Peace, I learned at Camp David,
      costs the peacemakers everything
      and the people nothing — which is why
      it's always worth it.
    description: "Egypt and Israel signed peace after thirteen days at Camp David; the traveler watched the exhausted leaders emerge like survivors and learned peace costs peacemakers everything."
    status: "published"
    sha256: "80163d97ddbb0b4fa8fb28212ca7d6510ab0c0e28f6b491082dc826ddf69180a"
  - number: "3805"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Kool-Aid"
    date: "November 1978"
    region: "Guyana"
    poem: |
      Nine hundred and nine people —
      men, women, children —
      drank the poison in Jonestown
      at one man's order.
      I flew in with the recovery teams,
      and the jungle clearing was the worst thing
      I've ever seen. The worst.
      Jim Jones preached love and built a graveyard.
      A cult's horror shocked the world —
      and gave the language a phrase
      for blind obedience.
      Don't drink the Kool-Aid.
      Nine hundred people did.
    description: "Nine hundred died in Jonestown at a cult leader's order; the traveler flew in with recovery teams to the worst thing he'd ever seen — and a phrase for blind obedience."
    status: "published"
    sha256: "afa2ae9bfeec55f3ca97c24160fbaf29aa332e1e01ca7cda10a4ae541c3b4120"
  - number: "3806"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "China Opens the Door"
    date: "December 1978"
    region: "China"
    poem: |
      Deng Xiaoping — purged twice, back again —
      cracked the door: markets, zones,
      "to get rich is glorious."
      I was in Shenzhen when it was still fishing boats,
      and watched the cranes rise like bamboo.
      China woke up that December.
      Four decades later, the fishing village
      is a megacity, and the world runs
      on what those cranes built.
      One small man's pragmatism
      outperformed every ideology.
    description: "Deng launched market reforms and China woke up; the traveler stood in Shenzhen when it was fishing boats and watched the cranes rise like bamboo."
    status: "published"
    sha256: "2213bec5dca23be7088d0b12ec853ab999183c7bcd6f0dcbfc845faadcd1817b"
  - number: "3807"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Shah Falls"
    date: "January 1979"
    region: "Iran"
    poem: |
      The Shah fled Tehran in tears —
      and Khomeini flew home from Paris
      to a roaring million.
      I was at the airport for the return,
      the old man's black robes,
      the crowd like an ocean.
      The Peacock Throne, 2,500 years old,
      gone in weeks.
      Iran traded a king for a theocracy.
      The hostages, the war, the decades of enmity —
      all of it started on that runway,
      with a roar.
    description: "The Shah fled and Khomeini returned to a roaring Iran; the traveler stood at the airport as 2,500 years of throne ended in weeks and decades of enmity began."
    status: "published"
    sha256: "f1c4ca14d97a2d0641a9ce4ebf54744889eba31a02783640d43fce5c4048c641"
  - number: "3808"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Meltdown That Wasn't"
    date: "March 1979"
    region: "USA"
    poem: |
      Three Mile Island: a valve stuck,
      the core half-melted, the nation held its breath —
      and the containment held.
      The meltdown that wasn't.
      I was in Harrisburg that week,
      the evacuation routes jammed,
      a state learning the word "meltdown."
      No one died. But nuclear power
      died a little that week in America —
      no new plants for decades.
      Fear, I learned, is the real fallout.
      It has the longest half-life.
    description: "A Pennsylvania reactor half-melted but containment held; the traveler sat in jammed Harrisburg evacuation traffic and learned fear is the real fallout, with the longest half-life."
    status: "published"
    sha256: "a0c6866aa1953db9d28c767d650f311798f0237d826143280d0f900ad2646484"
  - number: "3809"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "In Space No One Can Hear You"
    date: "May 1979"
    region: "UK"
    poem: |
      A commercial spaceship, a distress call,
      and something with acid for blood
      hunting the crew through the dark.
      Alien stalked the screen —
      and horror went cosmic.
      I saw it in London, the audience
      frozen, Ripley the last one standing.
      Scott made space a haunted house,
      and Weaver made the final girl
      a hero for the ages.
      In space no one can hear you scream.
      In the cinema, everyone did.
    description: "Alien stalked the screen and horror went cosmic; the traveler sat in a frozen London audience as Ripley became a hero and space became a haunted house."
    status: "published"
    sha256: "2aaa8affca5299d8fe5c1d683e485b20e82912712c3746cb923bee79f3e4bcb1"
  - number: "3810"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Music in Your Pocket"
    date: "July 1979"
    region: "Japan"
    poem: |
      Sony's Walkman: a cassette player,
      headphones, no speaker —
      music for one, on your hip.
      I bought one in Tokyo that summer,
      and the city changed around me:
      everyone walking in their own soundtrack,
      alone together.
      The world got headphones that July.
      Public space became private.
      It was the first step toward everyone
      staring at their own small screen —
      but it started with a song,
      just for you.
    description: "Sony's Walkman put stereo on hips worldwide; the traveler walked Tokyo in his own soundtrack as public space went private, one headphone at a time."
    status: "published"
    sha256: "1b1ed6da69b4fd7b482a6777cbe91cb86817e29b301a2d2ac705934c93f6bc16"
  - number: "3811"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "444 Days"
    date: "November 1979"
    region: "Iran"
    poem: |
      Students stormed the US embassy in Tehran —
      fifty-two Americans taken,
      blindfolded, paraded, held.
      444 days.
      I covered it from outside the walls,
      the crowds chanting, the hostages' families
      on television every night.
      It broke Carter's presidency.
      It taught America a new word: hostage.
      And when they finally flew home,
      the whole country wept at the runway.
      444 days. Count them.
    description: "Militants seized the US embassy in Tehran and held hostages 444 days; the traveler covered it from outside the walls as a presidency broke and a nation learned the word hostage."
    status: "published"
    sha256: "2916574ee8306ba09f4e30bef4edec70bd82890bbbbcf37fd62df5c398115005"
  - number: "3812"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Wall"
    date: "November 1979"
    region: "UK"
    poem: |
      Pink Floyd built a wall —
      brick by brick, song by song,
      a rock opera about isolation
      so massive it needed a stadium.
      I saw the tour in London,
      the wall rising across the stage,
      the plane crashing, the teacher screaming.
      "We don't need no education."
      Rock got its monument that winter:
      a wall you could hear.
      Waters tore it down at the end,
      every night.
      Some walls, the music says,
      only fall from inside.
    description: "Pink Floyd's Wall rose brick by brick across stadium stages; the traveler watched it built and torn down nightly in London — some walls only fall from inside."
    status: "published"
    sha256: "2ac487a1d372c24080a7089c4a149670c07dbc2cffc7f7d73eeec9dc7259c0ea"
  - number: "3813"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Bear Invades"
    date: "December 1979"
    region: "Afghanistan"
    poem: |
      Christmas Eve: Soviet tanks rolled
      over the Afghan border —
      a "limited contingent" that stayed ten years.
      I crossed in with the mujahideen later,
      the mountains like broken teeth,
      Stingers in the passes.
      Moscow's Vietnam: 15,000 Soviet dead,
      a million Afghans, an empire bled white.
      The quagmire began that Christmas.
      It ended empires — first the Soviet one,
      then, decades later, another's illusions.
    description: "Soviet tanks rolled into Afghanistan on Christmas Eve for a ten-year quagmire; the traveler crossed the broken-tooth mountains and watched an empire bleed white."
    status: "published"
    sha256: "9e8c02f2210475f536f31391874b8873d57368a8207ded0dbf449caaf357aac2"
  - number: "3814"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Mountain Blows"
    date: "May 1980"
    region: "USA"
    poem: |
      8:32 a.m.: the whole north face
      of Mount St. Helens slid away,
      and the mountain blew sideways —
      a lateral blast that flattened 230 square miles.
      I was thirty miles out when it went,
      the sky turning black at noon,
      ash falling like gray snow.
      Fifty-seven dead. Rivers of mud.
      The most violent eruption in American history —
      and it happened on live television,
      a mountain performing its own autopsy.
    description: "Mount St. Helens erupted sideways, flattening 230 square miles; the traveler watched the sky turn black at noon as ash fell like gray snow on live television."
    status: "published"
    sha256: "021d5fc7461c1b7f473d954ed6e800a740cd47ee609aae8fa83b73ebdc8c8d80"
  - number: "3815"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "News Never Sleeps"
    date: "June 1980"
    region: "USA"
    poem: |
      Ted Turner launched CNN —
      news, twenty-four hours a day,
      when the networks did thirty minutes.
      Everyone laughed. Then they watched.
      I was in the Atlanta newsroom that first night,
      the anchors nervous, the phones ringing.
      News never sleeps now.
      The world got faster, louder, endless —
      a crisis in every hour, live.
      Turner invented the scroll
      before the scroll existed.
    description: "CNN launched with twenty-four-hour news; the traveler stood in the nervous Atlanta newsroom as the world got faster, louder, and endless — the scroll before the scroll."
    status: "published"
    sha256: "6986651a12a271e6f3a61c5443e93e67ae7230ec6f5d3458d39883dd8475fb39"
  - number: "3816"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Pac-Man"
    date: "July 1980"
    region: "Japan"
    poem: |
      A yellow dot with a missing slice —
      Toru Iwatani designed him around a pizza —
      munching ghosts through a neon maze.
      Wakawaka. I fed quarters into the cabinet
      in a Tokyo arcade, hypnotized.
      Pac-Man exploded: the first game character,
      the first mascot, arcade fever worldwide.
      A pizza-inspired dot ate the decade's quarters
      and taught the world that games
      could have personality.
    description: "A yellow dot munched ghosts through neon mazes; the traveler fed quarters into a Tokyo cabinet, hypnotized, as a pizza-inspired hero taught games to have personality."
    status: "published"
    sha256: "9894d8c2490e60e7be3bb98ebf897113f310b54db4eff8abdb0d54d6ac55339a"
  - number: "3817"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Boycotted Games"
    date: "July 1980"
    region: "USSR"
    poem: |
      Carter said stay home —
      and America skipped the Moscow Olympics
      over Afghanistan.
      Sixty-five nations out.
      I watched the opening ceremony anyway,
      the doves, the Misha bear,
      half the world missing.
      The Soviets won everything unopposed —
      and it meant nothing.
      The Cold War played on fields that summer,
      and sport lost to politics.
      Los Angeles would return the favor
      in four years.
    description: "America skipped the Moscow Olympics over Afghanistan; the traveler watched the half-empty opening ceremony as the Cold War played on fields and sport lost to politics."
    status: "published"
    sha256: "74f1cfca58b9630ddd3fd0ce772d706d05abf849bd8dcd81ee943d5b832ad8b5"
  - number: "3818"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Solidarity"
    date: "August 1980"
    region: "Poland"
    poem: |
      The Gdansk shipyard struck —
      and Lech Walesa climbed the fence
      with a union charter in his pocket.
      Solidarity: ten million members,
      the first free union in the Soviet bloc.
      I was in the shipyard that August,
      the smell of welding, the singing.
      The communists signed, then cracked down —
      martial law, arrests.
      But the crack had widened.
      Nine years later it split the bloc open.
      It started with shipyard workers
      who wanted a union.
    description: "Polish workers founded Solidarity in the Gdansk shipyard; the traveler breathed welding smoke and singing as ten million members widened the crack that would split the bloc."
    status: "published"
    sha256: "cc89872ca6509ae1adfe21a7d3113c26ebfd07d91cc7b24362ae4d70dca7cc62"
  - number: "3819"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Imagine, Silenced"
    date: "December 1980"
    region: "USA"
    poem: |
      Outside the Dakota, New York —
      five shots, and John Lennon fell.
      I was two blocks away when the news broke,
      and Central Park filled by midnight:
      thousands singing "Imagine" in the cold.
      The dreamer of peace, murdered.
      The world sang in grief that week —
      radios playing nothing but Beatles for days.
      "Imagine all the people."
      We did. We stood in the park
      and imagined, through tears.
    description: "John Lennon was shot outside the Dakota; the traveler stood in Central Park at midnight as thousands sang \"Imagine\" in the cold for the dreamer of peace."
    status: "published"
    sha256: "e50290de5cdde9d6dad80d75273e75a6ca5d0cb64365bf01a51dbb6dae439383"
  - number: "3820"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Hostages Come Home"
    date: "January 1981"
    region: "Iran"
    poem: |
      444 days — and they flew home
      on Reagan's inauguration day,
      timed to spite Carter to the last.
      I was at the airbase when the plane landed,
      families sprinting across the tarmac,
      a nation exhaling at once.
      Yellow ribbons everywhere.
      They'd been blindfolded, beaten, paraded —
      and they walked off that plane
      with their heads high.
      America wept. For once,
      the tears were pure joy.
    description: "After 444 days the hostages flew home to yellow ribbons; the traveler watched families sprint across the tarmac as a nation exhaled in pure joy."
    status: "published"
    sha256: "3dc86fc806ea0c3330cc4e87b57f4612242d9f0afdd69305a926c338be5cfd84"
  - number: "3821"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Reusable Rocket"
    date: "April 1981"
    region: "USA"
    poem: |
      Columbia rose on pillars of fire —
      the first reusable spaceship,
      a truck to orbit and back.
      I watched the launch from the causeway,
      the roar in my chest like a second heart.
      Thirty years of shuttles followed:
      stations built, telescopes fixed,
      teachers and senators flown.
      Two were lost — Challenger, Columbia —
      and the grief was national.
      But for three decades, humanity
      had a pickup truck to the stars.
    description: "Columbia flew as the first reusable spaceship; the traveler felt the launch roar like a second heart as humanity got a thirty-year pickup truck to the stars."
    status: "published"
    sha256: "5f0888dc690fe632df0db0546149ce7398aafa5110c12735fe1eccaba13dce63"
  - number: "3822"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A New Plague"
    date: "June 1981"
    region: "USA"
    poem: |
      The CDC's little bulletin noted it first —
      five young men, a rare pneumonia,
      in Los Angeles.
      Then more. Then everywhere.
      AIDS: the new plague, and the world
      was slow to name it, slower to fight it.
      I walked the Castro in those years,
      the posters multiplying, the friends vanishing.
      A generation scarred.
      It took activism, fury, and science —
      but the dying taught the living
      how to fight.
    description: "Doctors named a mysterious killer that became AIDS; the traveler walked San Francisco's Castro as posters multiplied and friends vanished — and the dying taught the living to fight."
    status: "published"
    sha256: "e3e4015831e9bfa5492e28ecdea0cda6e906f946fad77c21539293b73dc34b83"
  - number: "3823"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Fairy-Tale Wedding"
    date: "July 1981"
    region: "UK"
    poem: |
      St. Paul's Cathedral, a billion watching —
      Lady Diana Spencer, twenty years old,
      married the Prince of Wales
      in the wedding of the century.
      I was in the crowds outside,
      the hats, the flags, the hope.
      It looked like a fairy tale.
      It wasn't. We know that now.
      But that July morning, the world
      wanted to believe in princesses —
      and for one day, it did.
    description: "Charles wed Diana before a billion viewers; the traveler stood in the hopeful crowds outside St. Paul's on the July morning the world believed in princesses."
    status: "published"
    sha256: "801d07b4ea191b651977d7ddce65c620259e80701099d771a6a253b378f72733"
  - number: "3824"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "I Want My MTV"
    date: "August 1981"
    region: "USA"
    poem: |
      "Video Killed the Radio Star" —
      the first video MTV ever played,
      and pop went visual.
      I watched the launch in a bar,
      the VJs grinning, the videos flickering.
      Music Television: all day, all night,
      a new language of three-minute dreams.
      It made stars overnight
      and broke them by lunch.
      The image became the music.
      We stopped listening with our ears
      and started with our eyes.
    description: "MTV launched playing videos all day; the traveler watched in a bar as pop went visual and the world started listening to music with its eyes."
    status: "published"
    sha256: "5ee47ac6c4090ecdc02cf32d6fa5f8a6a27f717ceb80f760ef3e9b0ee26f6370"
  - number: "3825"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Blue Box"
    date: "August 1981"
    region: "USA"
    poem: |
      IBM — Big Blue itself —
      blessed the personal computer:
      the IBM PC, open architecture,
      a beige box that meant business.
      I was at the launch; the suits
      were nervous, the hackers thrilled.
      IBM legitimized the PC overnight —
      offices digitized by the million.
      The clone wars followed.
      Microsoft rode it to the stars.
      One beige box from the bluest of chips —
      and computing grew up.
    description: "IBM's PC legitimized the personal computer; the traveler watched nervous suits and thrilled hackers as offices digitized by the million and computing grew up."
    status: "published"
    sha256: "a769b6086e8cc79210da70e567e9f8a7fba0354ad6a8377fff3fa27f1becd0db"
  - number: "3826"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Falklands"
    date: "April 1982"
    region: "South Atlantic"
    poem: |
      Argentina seized the windswept islands —
      and Thatcher sent the fleet
      eight thousand miles to take them back.
      Seventy-four days: ships sunk,
      men frozen, Goose Green, Mount Tumbledown.
      I covered it from a press ship,
      the South Atlantic gray as gunmetal.
      Britain won. The junta fell.
      The empire's last colonial war —
      fought over sheep farms and pride,
      eight thousand miles from home.
    description: "Britain and Argentina fought over the windswept Falklands; the traveler covered it from a press ship in gunmetal seas as the empire fought its last colonial war."
    status: "published"
    sha256: "5fee7db290bc2a54ba4853abc663abb4f8409f403a2f605089ceadbc7a181189"
  - number: "3827"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Phone Home"
    date: "June 1982"
    region: "USA"
    poem: |
      A wrinkled alien with a glowing finger,
      two kids on bicycles silhouetted
      against the moon —
      E.T. melted every heart on earth.
      I saw it with a theater full of children,
      and when he said "home,"
      the whole place wept.
      Spielberg's fairy tale:
      the alien just wanted his family.
      So did we, it turned out.
      Bicycles flew across the moon that summer,
      and childhood believed in magic again.
    description: "E.T. melted hearts worldwide; the traveler wept in a theater of children as bicycles flew across the moon and childhood believed in magic again."
    status: "published"
    sha256: "899f6f34ed4a39489ab774637ab5fc528adbe3efa2ccc4e4e135762ff66236cd"
  - number: "3828"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Rain and Neon"
    date: "June 1982"
    region: "USA"
    poem: |
      Los Angeles, 2019: endless rain,
      neon, replicants dreaming of electric sheep —
      Blade Runner divided the critics
      and invented cyberpunk.
      I saw it opening weekend,
      half-empty theater, rain on the marquee.
      It flopped. Then it didn't —
      it became the most influential sci-fi film ever,
      every future since wearing its coat.
      Scott dreamed the future in neon and rain.
      We're living in it now.
    description: "Blade Runner's rainy neon future divided critics and invented cyberpunk; the traveler sat in a half-empty theater watching the most influential sci-fi film ever flop — then not."
    status: "published"
    sha256: "6d2aaae26d23b68ccbf288e567448ed66df3342eb2112bda9e93c072a402f0b5"
  - number: "3829"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Future, Sponsored"
    date: "October 1982"
    region: "USA"
    poem: |
      Epcot opened — Disney's Experimental Prototype
      Community of Tomorrow, sort of:
      a gleaming geodesic sphere,
      pavilions sponsored by corporations,
      the future with a gift shop.
      I walked it opening week,
      eating around the "world"
      in an afternoon.
      It was corporate, corny, wonderful.
      The future, sponsored by Exxon.
      We laughed then.
      The joke, it turns out, was prophecy.
    description: "Epcot opened with corporate pavilions and a geodesic sphere; the traveler ate around the \"world\" in an afternoon as the sponsored future turned out to be prophecy."
    status: "published"
    sha256: "ce64fefeb0cab90e45d2769ba7a2884fda4624369e20a8ccce3c5891d942dc39"
  - number: "3830"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Thriller"
    date: "November 1982"
    region: "USA"
    poem: |
      Michael Jackson — twenty-four years old —
      dropped Thriller, and the world stopped.
      Billie Jean, Beat It, the title track's
      graveyard dance: the best-selling album
      of all time, forty million and counting.
      I was at a listening party in New York,
      and when the bassline hit,
      the room levitated.
      Quincy Jones's masterpiece,
      Michael's moonwalk moment.
      Pop's peak, frozen in vinyl —
      the eighties' beating heart.
    description: "Michael Jackson's Thriller became the best-selling album of all time; the traveler levitated at a New York listening party when the bassline hit."
    status: "published"
    sha256: "06ec77afbe61a66f2a4a1d9311a7703a2767a06663c71f698a4bbee1a6263136"
  - number: "3831"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Heart of Plastic"
    date: "December 1982"
    region: "USA"
    poem: |
      In Salt Lake City, surgeons replaced
      a dying man's heart with a plastic one —
      the Jarvik-7, whirring in his chest.
      Barney Clark lived 112 days
      on a machine heart.
      I stood outside the hospital,
      reporters everywhere, the ethics debates raging.
      A permanent artificial heart beat
      inside a man's chest.
      It wasn't perfect. It was a beginning.
      The heart — the ancient seat of the soul —
      now came with a warranty.
    description: "A permanent artificial heart beat inside Barney Clark's chest for 112 days; the traveler stood outside the hospital as the soul's seat got a warranty."
    status: "published"
    sha256: "1377160d4504b7fa136b1d70e5b452bf5d2033cc09705444907c729b0cb3d55c"
  - number: "3832"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Mouse Goes Mainstream"
    date: "January 1983"
    region: "USA"
    poem: |
      Apple's Lisa brought the mouse to offices —
      ten thousand dollars, a little gray box
      you pushed around to point at things.
      I demoed one in Cupertino,
      moving that cursor like magic.
      Pointing replaced typing, slowly.
      The Lisa flopped — too dear —
      but the Mac was coming.
      The mouse won.
      Your hand, extended into the machine —
      that's what it was, all along.
    description: "Apple's Lisa brought the mouse to offices; the traveler pushed the little gray box around in Cupertino as pointing began replacing typing."
    status: "published"
    sha256: "5ec0f8bff5c817edc4bec28819c3b4b07ec229082af907d8ac111be0f800ed5a"
  - number: "3833"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Shields in Space"
    date: "March 1983"
    region: "USA"
    poem: |
      Reagan proposed it on television —
      space-based shields to stop Soviet missiles,
      lasers and mirrors in orbit.
      Star Wars, the critics called it.
      I watched the speech in Washington,
      the hawks thrilled, the scientists aghast.
      The arms race went orbital that night —
      or threatened to.
      It never quite worked.
      But it scared Moscow into spending
      it didn't have —
      and some say that spending
      ended the Cold War.
    description: "Reagan proposed space-based missile shields; the traveler watched Washington split between thrilled hawks and aghast scientists as the arms race threatened orbit."
    status: "published"
    sha256: "694d219d3ddeb27d318841368729b9b58509d48ca668b500b22253e6903aad42"
  - number: "3834"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Sally Rides"
    date: "June 1983"
    region: "USA"
    poem: |
      Challenger carried Sally Ride —
      physicist, calm, brilliant —
      America's first woman in space.
      I watched the launch,
      the crowd's roar with an edge of history.
      Twenty years after Tereshkova,
      America finally sent a woman up.
      Ride operated the robot arm,
      ran the experiments, came home a hero —
      and spent her life getting girls
      into science.
      The stars, she proved again,
      don't check chromosomes.
    description: "Sally Ride became America's first woman in space aboard Challenger; the traveler heard history's edge in the launch roar as she proved the stars don't check chromosomes."
    status: "published"
    sha256: "1591b8771dd5280744cca1e04b3727cffc3cf98002acd649090b477bcf9afc30"
  - number: "3835"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Lost Airliner"
    date: "September 1983"
    region: "USSR"
    poem: |
      Korean Air Lines Flight 007
      drifted into Soviet airspace —
      and a fighter shot it down.
      269 dead, including a US congressman.
      I heard the news in Tokyo,
      the disbelief curdling to horror.
      The Soviets lied, then admitted.
      Reagan called it barbarism.
      The world gasped as one.
      A lost airliner, a trigger-happy empire —
      and the Cold War's hottest autumn
      in twenty years.
    description: "The Soviets shot down Korean Air Lines Flight 007, killing 269; the traveler heard the news in Tokyo as disbelief curdled to horror in the Cold War's hottest autumn."
    status: "published"
    sha256: "373dbd892eb87f294ffcbe2344c039453662e49f97d470ae0bffc0b08095ef93"
  - number: "3836"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Grenada Invasion"
    date: "October 1983"
    region: "Caribbean"
    poem: |
      America invaded Grenada —
      a island of 100,000 people,
      students, a new airport, Cuban workers —
      Operation Urgent Fury.
      I landed with the press corps,
      the fighting mostly over,
      the students waving.
      The Cold War's smallest war:
      nine days, nineteen Americans dead.
      Reagan called it a rescue.
      Critics called it a message to Moscow.
      Grenada went back to nutmeg and beaches.
      History barely noticed.
    description: "America invaded tiny Grenada in the Cold War's smallest war; the traveler landed with the press corps as students waved and the island went back to nutmeg and beaches."
    status: "published"
    sha256: "4cbc5c39dcbefe257063a6c0357950f4649fb789d912c50a65393d89a70fec86"
  - number: "3837"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Scare"
    date: "November 1983"
    region: "Europe"
    poem: |
      NATO ran a war game — Able Archer —
      so realistic the Soviets thought
      it was the real thing.
      Missiles readied. Bombers fueled.
      We were minutes from the end,
      and nobody in the West knew.
      I learned this years later,
      reading the declassified files,
      my hands cold.
      The world nearly ended in November 1983
      because of a rehearsal.
      The closest call of the Cold War —
      and we didn't know for decades.
    description: "NATO's Able Archer war game nearly triggered real Soviet retaliation; the traveler read the declassified files years later with cold hands — the closest call nobody knew."
    status: "published"
    sha256: "e03f4901e384d774928d39ec829a2733a02212d04aee2296325c2f98f13b403e"
  - number: "3838"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Hammer Throw"
    date: "January 1984"
    region: "USA"
    poem: |
      Third quarter, Super Bowl XVIII —
      a woman sprints down an aisle,
      hurls a hammer at Big Brother's face,
      and the screen explodes.
      Apple's "1984" ad aired once.
      Once. I watched it live,
      the stadium crowd gasping.
      Ridley Scott directed it;
      the Macintosh was coming.
      Marketing went epic that night —
      an ad as art, as event, as myth.
      IBM never saw it coming.
      Neither did we.
    description: "Apple's \"1984\" ad aired once during the Super Bowl; the traveler watched the stadium gasp as a hammer shattered Big Brother's face and marketing went epic."
    status: "published"
    sha256: "05007e66955444bd965a7d48c2bc489df35bb723080986aa217e1935fa8d054c"
  - number: "3839"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Hello, Macintosh"
    date: "January 1984"
    region: "USA"
    poem: |
      It smiled at you. Literally —
      the Mac's smiling face on boot,
      a computer that said hello.
      I unboxed one in January,
      this beige miracle with a mouse,
      windows, icons — the rest of us
      could finally use a computer.
      $2,495. Worth every penny.
      The Mac didn't win the market.
      It won the future:
      every computer since
      is just a Mac, refined.
    description: "The Macintosh's smiling face brought computers to the rest of us; the traveler unboxed one in January as windows, icons, and a mouse won the future if not the market."
    status: "published"
    sha256: "c6d53bdc8e96738b359491f0c3875a92640c2aca6207f326b7b66ef62521bb45"
  - number: "3840"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Purple Rain"
    date: "June 1984"
    region: "USA"
    poem: |
      Prince — five foot two of pure voltage —
      released Purple Rain, the album and the film,
      and pop got its genius.
      I saw the tour in Detroit,
      the purple suit, the guitar solos
      that bent the laws of physics.
      He played everything, wrote everything,
      out-funked and out-rocked everyone.
      The eighties had Michael's crown
      and Prince's scepter.
      Purple reigned that summer —
      and honestly, ever since.
    description: "Prince's Purple Rain peaked and pop got its genius; the traveler watched the Detroit tour as five-foot-two of pure voltage bent the laws of physics."
    status: "published"
    sha256: "96cb3852269125b31bcd020489e722bf5f64699c31e16179aca90a174c6021d0"
  - number: "3841"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Games Go On"
    date: "July 1984"
    region: "USA"
    poem: |
      Los Angeles hosted the Olympics —
      Soviet-free, sun-drenched,
      Carl Lewis winning four golds,
      Mary Lou sticking the vault.
      I covered those Games,
      the smog and the splendor.
      The boycott tit-for-tat meant
      half the world stayed home —
      but LA turned a profit,
      the first to do it right.
      The Games went on, sunny and strange —
      a party with half the guests missing,
      dancing anyway.
    description: "Los Angeles hosted a sunny, Soviet-free Olympics; the traveler covered Carl Lewis's four golds at a party with half the guests missing, dancing anyway."
    status: "published"
    sha256: "b998499c9a8e20715fe3bd4169d021ed642ff43ed2907197a96889697636f3f4"
  - number: "3842"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Assassination"
    date: "October 1984"
    region: "India"
    poem: |
      Her Sikh bodyguards opened fire
      in the garden of her own residence —
      Indira Gandhi, India's Iron Lady,
      cut down by the men sworn to protect her.
      I was in Delhi that week.
      The city burned for days after:
      thousands of Sikhs murdered in revenge.
      The assassination was political.
      The pogrom was pure hate.
      India's wound, reopened.
      The subcontinent's old demons —
      still hungry, still fed.
    description: "Indira Gandhi was killed by her own guards; the traveler watched Delhi burn in revenge pogroms as the subcontinent's old demons fed again."
    status: "published"
    sha256: "696729f5528140461dcfa421fa632272ad005a257bbef7033a2520d96cc856a8"
  - number: "3843"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Poison Cloud"
    date: "December 1984"
    region: "India"
    poem: |
      Midnight in Bhopal: a gas leak,
      methyl isocyanate, a cloud
      settling over sleeping slums.
      Thousands died that night,
      gasping. Thousands more since.
      I walked those streets a week later,
      the hospital corridors full of the blinded,
      the Union Carbide plant looming.
      The world's worst industrial disaster —
      and the compensation was coins.
      The poison cloud settled.
      The company settled cheaper.
    description: "Gas leaked in Bhopal, killing thousands in their sleep; the traveler walked hospital corridors of the blinded as the world's worst industrial disaster settled for coins."
    status: "published"
    sha256: "55767efabb5f67aa08a7e6870b404c942f5f249d2800d5da755230a6441be508"
  - number: "3844"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "We Are the World"
    date: "January 1985"
    region: "USA"
    poem: |
      One night, one studio —
      forty-five stars, one song for famine relief.
      Michael and Lionel wrote it;
      everyone from Dylan to Diana Ross sang it.
      I was outside A&M Studios that night,
      the limos, the secrecy.
      "We Are the World" sold millions,
      fed thousands.
      Pop's conscience, on vinyl.
      Cynics scoffed. The hungry ate.
      Sometimes the simplest song
      is the truest one.
    description: "Pop stars sang \"We Are the World\" for famine relief; the traveler stood outside the studio as limos arrived and the simplest song fed thousands."
    status: "published"
    sha256: "4d0caffba7318a642bbd6ed86080280ee6794fec4f9b1a34945009f21f8266d4"
  - number: "3845"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Gorbachev"
    date: "March 1985"
    region: "USSR"
    poem: |
      A young reformer took the Kremlin —
      fifty-four, energetic, with a birthmark
      like a map of the future.
      Gorbachev: glasnost, perestroika,
      openness, restructuring.
      I watched his first press conferences,
      the jokes, the un-Soviet candor.
      The old guard shifted uneasily.
      He meant to save the system.
      He ended it instead —
      the most consequential accident
      in modern history.
    description: "A young reformer took the Kremlin with glasnost and perestroika; the traveler watched the un-Soviet candor of the man who meant to save the system and ended it."
    status: "published"
    sha256: "e5bd556ed23c6592085a7169f4294acfdda7e6c0ca90e4877809410c51d14392"
  - number: "3846"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Hole in the Sky"
    date: "May 1985"
    region: "Antarctica"
    poem: |
      British scientists found it —
      a hole in the ozone over Antarctica,
      CFCs eating the sky's sunscreen.
      I read the Nature paper in a library,
      the graphs like a wound.
      The world actually acted:
      the Montreal Protocol, CFCs banned,
      the hole slowly healing.
      The one environmental crisis
      humanity fixed.
      Proof, filed away and forgotten,
      that we can do it —
      when we decide to.
    description: "Scientists found a hole in the ozone; the traveler read the wound-like graphs as the world actually acted — banning CFCs and proving we can fix what we break."
    status: "published"
    sha256: "55a6b70d950ab437ad6e3eba0a4599fd9e85eb12a31993bf6ece592b94db08f6"
  - number: "3847"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Back to the Future"
    date: "July 1985"
    region: "USA"
    poem: |
      A DeLorean, eighty-eight miles per hour,
      1.21 gigawatts —
      and Marty McFly went back to 1955.
      I saw it opening weekend,
      the audience roaring at the clock tower.
      Time travel went mainstream that summer:
      every kid wanted a DeLorean,
      every adult wanted a redo.
      Zemeckis bottled nostalgia and physics
      and sold it with a grin.
      Great Scott.
    description: "A DeLorean hit eighty-eight miles per hour and time travel went mainstream; the traveler roared with the opening-weekend crowd at the clock tower as nostalgia met physics."
    status: "published"
    sha256: "7767d8164c2a707b54d198d71a834b61e62650fd229d9a815b9535b3de3c3e42"
  - number: "3848"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Live Aid"
    date: "July 1985"
    region: "UK"
    poem: |
      Two stadiums — Wembley and Philadelphia —
      one cause, sixteen hours,
      Queen stealing the show in twenty minutes.
      I was at Wembley, 72,000 voices,
      Freddie commanding like a general of joy.
      Live Aid: rock fed the hungry,
      $127 million for famine relief.
      The satellite beamed it to a billion.
      Music's finest hour —
      proof that a guitar can be
      a bread truck.
    description: "Two stadiums, one cause — Live Aid fed the hungry; the traveler stood among 72,000 Wembley voices as Freddie Mercury commanded like a general of joy."
    status: "published"
    sha256: "c28f892b9e48d04fbc7e2774672edfec507cbcb5fd9527afa1c6d5dd7fc8e5b9"
  - number: "3849"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "It's-a Me, Mario"
    date: "September 1985"
    region: "Japan"
    poem: |
      A plumber in red overalls
      jumped over the video game crash —
      Super Mario Bros., and Nintendo
      revived the industry single-handedly.
      I played it in a Tokyo arcade,
      that first 1-1, the mushrooms, the pipes.
      Mario became king: the most famous
      fictional character on earth.
      Miyamoto's genius: joy as design.
      Forty years of jumping —
      and we're still not tired of it.
    description: "Super Mario Bros. revived video games; the traveler played 1-1 in a Tokyo arcade as a red-overalled plumber became the most famous fictional character on earth."
    status: "published"
    sha256: "17d8cbd3c6319c3236f7bc21a3bba74ada1eeaffa6b700072708c29d0bdde9a6"
  - number: "3850"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Challenger"
    date: "January 1986"
    region: "USA"
    poem: |
      Seventy-three seconds.
      I watched it live from the press site —
      the plume, the silence,
      the two trails corkscrewing apart.
      Seven astronauts, including Christa McAuliffe,
      a teacher, gone on live TV
      as schoolchildren watched.
      The shuttle broke apart
      and the nation's heart with it.
      We mourned. We investigated.
      We flew again — because they would have wanted it.
      But January 28th stays frozen:
      the day the sky said no.
    description: "The shuttle broke apart on live TV, killing seven including a teacher; the traveler watched from the press site as the sky said no and the nation's heart broke with it."
    status: "published"
    sha256: "acc19834bfd12ec9dec49a5f62a27a985a1fbefbc59abd53142d436d1418bc88"
  - number: "3851"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "People Power"
    date: "February 1986"
    region: "Philippines"
    poem: |
      Millions filled EDSA —
      nuns with rosaries facing tanks,
      Cory Aquino's yellow against Marcos's guns.
      I marched in that sea of people,
      the tanks stopping, the soldiers defecting.
      People Power: the dictator fled
      by helicopter, democracy returned.
      No shots that mattered.
      Just bodies, prayers, and refusal.
      The world watched a revolution
      won by showing up.
    description: "Millions ousted Marcos in the Philippines' People Power revolution; the traveler marched on EDSA as nuns with rosaries faced tanks and won by showing up."
    status: "published"
    sha256: "2cfb63ae1785913a66b1387fbabfd0485bb1a2df1d46f896bcbe8a358de42846"
  - number: "3852"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Chernobyl"
    date: "April 1986"
    region: "USSR"
    poem: |
      1:23 a.m.: Reactor 4 exploded —
      a pillar of fire over Pripyat,
      radiation drifting across Europe.
      I reported from the exclusion zone later,
      the abandoned schoolbooks,
      the Ferris wheel never ridden.
      The Soviets lied for days.
      The Geiger counters didn't.
      Chernobyl poisoned the land
      and the lie poisoned the empire:
      glasnost met its test here,
      and the truth got out anyway.
    description: "Reactor 4 exploded at Chernobyl, drifting radiation across Europe; the traveler walked the abandoned schoolbooks of Pripyat as the lie poisoned the empire."
    status: "published"
    sha256: "629d36a65098dbbdcc7df4d4041f1448c157805e053fd1cbc968376039ff313f"
  - number: "3853"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Top Gun"
    date: "May 1986"
    region: "USA"
    poem: |
      Fighter jets, volleyball,
      "Danger Zone" —
      Top Gun made the eighties
      officially awesome.
      I saw it in a packed theater,
      the audience cheering the flybys.
      Tony Scott bottled testosterone
      and sold it by the bucket.
      The Navy's recruiting soared.
      Cinema's purest adrenaline —
      all style, all speed, all America,
      flying into the danger zone
      with a grin.
    description: "Top Gun's fighter jets and volleyball defined the eighties; the traveler cheered the flybys in a packed theater as the Navy's recruiting soared on pure adrenaline."
    status: "published"
    sha256: "3e41fef43807615b2d7f5f6aa37d3a483b99010ac2873b9b768e06feb5758051"
  - number: "3854"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Hello, Oprah"
    date: "August 1986"
    region: "USA"
    poem: |
      A Chicago talk show went national —
      Oprah Winfrey, and daytime TV
      found its queen.
      I watched the first national broadcast,
      this woman listening like nobody
      had ever listened before.
      She'd build an empire on empathy:
      books, souls, whole lives changed
      between commercials.
      From Mississippi poverty
      to the most influential woman in media —
      Oprah didn't just host a show.
      She hosted America's therapy session.
    description: "Oprah's show went national; the traveler watched the first broadcast as a woman who listened like nobody ever had began hosting America's therapy session."
    status: "published"
    sha256: "cf2b54c336d5bd94ad241a4d99891075a50d50b91139904c819bd6ddb90a2a76"
  - number: "3855"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Almost Deal"
    date: "October 1986"
    region: "Iceland"
    poem: |
      Reykjavik: Reagan and Gorbachev,
      alone but for translators,
      nearly abolished nuclear weapons.
      I waited outside Hofdi House
      in the Arctic wind, watching history
      almost happen.
      Star Wars — the shields — killed it.
      Reagan wouldn't yield.
      They left with nothing signed
      and everything changed:
      the trust was built that weekend,
      and the Cold War's end
      started in that small white house.
    description: "Reagan and Gorbachev nearly ended the arms race in Reykjavik; the traveler waited in Arctic wind outside Hofdi House as the deal died and the trust was born."
    status: "published"
    sha256: "1eb89da27a44c45e0874160f963be172914e5608989758a44f5124d489fed464"
  - number: "3856"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Secret Deal"
    date: "November 1986"
    region: "USA"
    poem: |
      Arms for hostages —
      America learned its government
      sold missiles to Iran
      to free captives and fund contras.
      Iran-Contra: the scandal brewed,
      towers of denials, shredding parties.
      I covered the hearings,
      North in his uniform, the nation riveted.
      Reagan survived it.
      The truth didn't, quite.
      A secret deal in the democracy's basement —
      and the basement, as always,
      had a light on.
    description: "America learned of arms-for-hostages in the Iran-Contra scandal; the traveler covered the riveting hearings as denials towered and the basement light stayed on."
    status: "published"
    sha256: "b9ad112f8155b5921574b7e5eefbb40246e245459e91a1c8c862a3856c5672a6"
  - number: "3857"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Quilt"
    date: "March 1987"
    region: "USA"
    poem: |
      They unfolded it on the National Mall —
      panel after panel, name after name,
      the AIDS Memorial Quilt:
      a football field of grief, handmade.
      I walked it that first showing,
      reading the names, the jokes,
      the love stitched in.
      Names became faces.
      Statistics became sons.
      The Quilt did what numbers couldn't:
      made a plague personal,
      one sewn panel at a time.
    description: "The AIDS Memorial Quilt unfolded on the National Mall; the traveler walked a football field of handmade grief where names became faces, one sewn panel at a time."
    status: "published"
    sha256: "5230843ed415f37b03611796f1812ba2a85fd764aa256e8c257166b6579287b3"
  - number: "3858"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Tear Down This Wall"
    date: "June 1987"
    region: "Germany"
    poem: |
      At the Brandenburg Gate,
      Reagan faced the concrete and said it:
      "Mr. Gorbachev, tear down this wall!"
      I was in the crowd,
      the Wall looming behind the podium.
      The diplomats winced.
      The Berliners cheered.
      Two years later, they did —
      tore it down with hammers and joy.
      Words are just words, they say.
      Tell that to Berlin.
    description: "Reagan dared Gorbachev to tear down the Wall at the Brandenburg Gate; the traveler stood in the cheering crowd as words became hammers two years later."
    status: "published"
    sha256: "5c255c8e7b88923adf50a799d4339b485c50c90c206aa2d2c3d9cd58f621fb3b"
  - number: "3859"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Black Monday"
    date: "October 1987"
    region: "USA"
    poem: |
      The Dow fell 22% in one day —
      paper fortunes vanished,
      traders wept on the floor.
      I was on Wall Street that Monday,
      the ticker like a falling elevator.
      Black Monday: the biggest one-day crash
      in history, and nobody knew why.
      Program trading, they said. Panic, I said.
      By year's end the market recovered.
      The lesson didn't stick:
      we keep building taller towers
      on the same sand.
    description: "Markets crashed worldwide on Black Monday; the traveler stood on Wall Street watching the ticker fall like an elevator as paper fortunes vanished in a day."
    status: "published"
    sha256: "b831ef959e7a49e16709123d8f247a8f9ce9625a0c8aa029bef8b563f19c1444"
  - number: "3860"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Missiles Come Down"
    date: "December 1987"
    region: "USA"
    poem: |
      Reagan and Gorbachev signed the INF treaty —
      an entire class of nuclear missiles,
      scrapped. Dismantled. Gone.
      I watched the signing in Washington,
      two old enemies with pens,
      the world breathing easier.
      The first time the superpowers
      destroyed weapons instead of building them.
      The missiles came down.
      The wall would follow.
      History, for once, running in reverse —
      toward peace.
    description: "The superpowers signed the INF treaty, scrapping a whole class of nuclear missiles; the traveler watched two old enemies sign as history ran in reverse toward peace."
    status: "published"
    sha256: "0d9560e84d1e1c552043c63a8024d58532e9eacebdeb8d433c1b139b36a016a0"
  - number: "3861"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Stones in Gaza"
    date: "December 1987"
    region: "Middle East"
    poem: |
      It started with a traffic accident —
      and became an uprising:
      the First Intifada, stones against soldiers,
      Gaza and the West Bank rising.
      I was in Gaza that winter,
      boys with slingshots facing rifles,
      the imbalance obscene.
      Stones met soldiers for six years.
      The world watched, again,
      and did little, again.
      But the Intifada forced the question
      no one could dodge anymore:
      whose land is this?
    description: "Palestinians rose in the First Intifada, stones against soldiers; the traveler watched Gazan boys with slingshots face rifles as the un-dodgeable question was forced."
    status: "published"
    sha256: "b693c1381c6a29c60684ab88b8c6ae8109f9ec3fbe656f5b11b56f3d9eb4bd8c"
  - number: "3862"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Final Fantasy"
    date: "December 1987"
    region: "Japan"
    poem: |
      Square was nearly bankrupt —
      one last game, they said,
      a final fantasy.
      I played the import in Tokyo,
      this sprawling role-playing epic,
      and understood: they'd saved the company
      and invented a genre's golden age.
      Final Fantasy: the last-ditch game
      that became a legend, sequels without end.
      Desperation, it turns out,
      is a game designer.
    description: "A last-ditch game saved its company and took role-playing games global; the traveler played the Tokyo import and learned desperation is a game designer."
    status: "published"
    sha256: "e491576971cd7ad0f25ee0b40113708e32e5aa55abe583c6a2448935b530eb3d"
  - number: "3863"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Calgary Games"
    date: "February 1988"
    region: "Canada"
    poem: |
      Calgary hosted the Winter Olympics —
      Chinook winds, cowboy hats,
      the Jamaican bobsled team
      stealing every heart.
      I was there for the whole snowy fortnight,
      Eddie the Eagle soaring (briefly),
      the underdogs charming the world.
      The Games lost money.
      Nobody cared.
      Calgary proved the Olympics
      are about joy, not profit —
      a lesson the IOC keeps forgetting.
    description: "The Winter Olympics came to Calgary; the traveler cheered the Jamaican bobsled team and Eddie the Eagle as underdogs proved the Games are about joy."
    status: "published"
    sha256: "f758e119a7be6244b1a2a04e3ce12b29b9f4a3ac54074de2cc1971b0535ef5a1"
  - number: "3864"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A Brief History of Time"
    date: "March 1988"
    region: "UK"
    poem: |
      A man in a wheelchair, speaking through a machine,
      explained the universe in plain words —
      and millions read cosmology.
      Hawking's Brief History of Time:
      black holes, the Big Bang, the whole show,
      no equations.
      I heard him lecture at Cambridge,
      that robotic voice filling the hall.
      The universe, it turns out,
      is a bestseller.
      Mind over matter, literally —
      and the matter lost.
    description: "Hawking's universe in plain words became a bestseller; the traveler heard the robotic voice fill a Cambridge hall as mind beat matter, literally."
    status: "published"
    sha256: "10c3cf2a95584237147bb6cfdf13167733abc930d7534c797b47938dec41da2c"
  - number: "3865"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Greenhouse Warning"
    date: "June 1988"
    region: "USA"
    poem: |
      James Hansen told Congress, plainly:
      the greenhouse effect is here,
      the planet is warming, it's us.
      I sat in that hearing room,
      the hottest June on record outside.
      Climate change entered politics that day —
      and then stalled for decades.
      Hansen was right about everything.
      The warning was filed, debated, delayed.
      The greenhouse kept warming.
      Some warnings you only get to give once.
      This one we're still ignoring.
    description: "A NASA scientist warned Congress about climate change; the traveler sat in the hearing room on the hottest June on record as the warning was filed and the planet kept warming."
    status: "published"
    sha256: "c9a03eaf9faa2a1f2123ab14cba7ed96d07f9326ec2734866f5361d7aa267cf8"
  - number: "3866"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Yippee-Ki-Yay"
    date: "July 1988"
    region: "USA"
    poem: |
      A barefoot cop in a Los Angeles tower,
      terrorists, air ducts —
      Die Hard redefined the action hero.
      I saw it opening weekend,
      the audience howling at every "yippee-ki-yay."
      Bruce Willis bled, limped, wisecracked —
      human, for once.
      Christmas got explosions.
      Action got a soul.
      Every action movie since
      is just John McClane
      in a different building.
    description: "Die Hard redefined the action hero with a barefoot, bleeding cop; the traveler howled with the opening-weekend crowd as Christmas got explosions."
    status: "published"
    sha256: "3b429dd51756ebc6c2ef63fa051ece004a821c9eeb27f7b1c2f246bd4d5fa2ec"
  - number: "3867"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Seoul's Games"
    date: "September 1988"
    region: "Korea"
    poem: |
      Korea hosted the world —
      Seoul's Olympics, the last Cold War Games,
      everyone finally showing up.
      I was in the stadium for the opening,
      the doves, the drums.
      Ben Johnson's gold turned to shame;
      Griffith-Joyner's speed turned to legend.
      A divided land's hopes, on display.
      Seoul showed the world a Korea
      beyond the DMZ —
      and the world applauded.
    description: "Seoul hosted the world for the last Cold War Olympics; the traveler watched the opening ceremony as a divided land showed the world a Korea beyond the DMZ."
    status: "published"
    sha256: "42a9109c13537bc84e7302b2daafdf494ce0edd002db2f003b78c56d09dfc678"
  - number: "3868"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Earth Shakes Armenia"
    date: "December 1988"
    region: "USSR"
    poem: |
      7:58 a.m.: Spitak vanished —
      a 6.8 quake burying Armenian towns,
      25,000 dead in minutes.
      I flew in with the rescue teams,
      the cold, the aftershocks,
      a mother digging with her hands.
      The world sent help —
      even the Cold War paused for it.
      Gorbachev cut short his US trip.
      Armenia's grief was the empire's grief,
      for once shared.
      The earth doesn't care about blocs.
    description: "An earthquake buried Armenian towns, killing 25,000; the traveler dug with rescue teams as the Cold War paused and the world sent help — the earth doesn't care about blocs."
    status: "published"
    sha256: "2e5e61588b2c59c07ab3711bbb8a9309806ea213eb442da0ec5ba9558d585ce7"
  - number: "3869"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Soviets Leave"
    date: "February 1989"
    region: "Afghanistan"
    poem: |
      The last Soviet general walked
      across the Friendship Bridge —
      and the Red Army limped out of Afghanistan.
      Ten years. 15,000 dead.
      I watched the column cross,
      the soldiers' hollow eyes.
      The quagmire ended.
      The empire's bleeding stopped —
      too late.
      Afghanistan went back to war with itself.
      Moscow went home to collapse.
      Some lessons cost an empire.
    description: "The Red Army limped out of Afghanistan after ten years; the traveler watched the hollow-eyed column cross the Friendship Bridge home to collapse."
    status: "published"
    sha256: "03852ba39a6a2f9d2edd550d6b3242325839194814cc549b20b4a27a5e3afec9"
  - number: "3870"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Tank Man"
    date: "June 1989"
    region: "China"
    poem: |
      Beijing had crushed the protests —
      and then one man, shopping bags in hand,
      stepped in front of the tanks.
      I was on Chang'an Avenue.
      The column stopped.
      He climbed up. He talked.
      Then he was led away, into history's fog.
      The Tank Man: the bravest photograph
      ever taken, and we don't know his name.
      China erased him.
      The world remembers him anyway.
      Courage needs no caption.
    description: "One man faced down tanks on Chang'an Avenue; the traveler watched the column stop as the bravest photograph ever taken entered history without a name."
    status: "published"
    sha256: "c4da7ccaa94ae4cf479704faeeadbe7e79a9ea9b9f793d1d64b74e84f761cb79"
  - number: "3871"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Batman"
    date: "June 1989"
    region: "USA"
    poem: |
      Tim Burton's Batman —
      dark, gothic, Prince on the soundtrack —
      and superheroes grew up.
      I saw it opening weekend,
      the Bat-symbol everywhere that summer.
      Keaton's haunted Bruce Wayne
      proved comics could be cinema.
      The summer belonged to the Bat.
      Hollywood learned the lesson
      it's still milking:
      put on the cape, print money.
    description: "Tim Burton's Batman darkened the summer; the traveler saw the Bat-symbol take over as superheroes grew up and Hollywood learned to print money with capes."
    status: "published"
    sha256: "202e7e49004c21f8ca4f58c06ecdf461762de9eecaa5a958c215570eed4bd442"
  - number: "3872"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Pale Blue Farewell"
    date: "August 1989"
    region: "USA"
    poem: |
      Voyager 2 swept past Neptune —
      the last planet, the grand tour complete:
      Jupiter, Saturn, Uranus, Neptune,
      twelve years, one spacecraft.
      I was at mission control for the flyby,
      the blue crescent on the screens.
      Then the camera turned off,
      and Voyager sailed on into the dark —
      still sailing, still calling home.
      The greatest journey ever taken,
      by a machine with a golden record
      and our best wishes.
    description: "Voyager 2 passed Neptune, completing its grand tour; the traveler watched the blue crescent fade as the greatest journey ever taken sailed on into the dark."
    status: "published"
    sha256: "09254198e2f29190251b1af4af8ba3242c89899725f159be73629a6675193cf4"
  - number: "3873"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Wall Comes Down"
    date: "November 1989"
    region: "Germany"
    poem: |
      A botched press conference —
      "effective immediately," the spokesman stammered —
      and Berliners walked to the Wall.
      The guards shrugged. The gates opened.
      I was there that night, on top of the Wall,
      strangers hugging, champagne,
      hammers ringing on concrete.
      Twenty-eight years, ended by confusion
      and courage.
      The Cold War cracked open.
      I danced on the Wall that night.
      Everyone did.
    description: "Berliners danced atop the Wall as the Cold War cracked open; the traveler stood on the concrete that night, hugging strangers as hammers rang."
    status: "published"
    sha256: "a2afed7c4370eaed633e80c554d34bca76ab5d86d26395f9420d61ed3fa061ab"
  - number: "3874"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Velvet Revolution"
    date: "December 1989"
    region: "Czechoslovakia"
    poem: |
      No shots. Just keys —
      thousands of Czechs jingling keys
      in Wenceslas Square, telling the communists:
      your time is up.
      I was in that square,
      the jingling like bells.
      The Velvet Revolution: the regime folded
      in weeks, Havel the playwright
      became president.
      Czechoslovakia ousted communism
      peacefully — the gentlest revolution ever.
      Keys, not guns.
      The future, unlocked.
    description: "Czechs jingled keys in Wenceslas Square and ousted the communists peacefully; the traveler heard the jingling like bells as the gentlest revolution unlocked the future."
    status: "published"
    sha256: "08f31f347c1149b041fa5a2d81ae51ef6aa456a1b582b2c303558322ddbba547"
  - number: "3875"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Springfield, USA"
    date: "December 1989"
    region: "USA"
    poem: |
      A yellow family with four fingers each
      got its own show —
      The Simpsons, and television's family
      changed forever.
      I watched the Christmas premiere,
      this anarchic cartoon that was smarter
      than the live-action shows.
      Homer, Marge, Bart, Lisa —
      America's mirror, funhouse and true.
      Thirty-five years it's been running.
      The longest sitcom in history —
      drawn, yellow, eternal.
    description: "The Simpsons got their own show; the traveler watched the Christmas premiere as a yellow four-fingered family became America's funhouse mirror for thirty-five years."
    status: "published"
    sha256: "cf9cf4e6a49ad50623c7fa65bd0ac649a3673cb132852ed00aa01678b87acfaa"
  - number: "3876"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Mandela Walks Free"
    date: "February 1990"
    region: "South Africa"
    poem: |
      Twenty-seven years in prison —
      and he walked out of Victor Verster
      with Winnie, fist raised, unbroken.
      I was in the crowd outside,
      the singing, the tears.
      Mandela walks free:
      apartheid's end began that day.
      He'd gone in a young firebrand;
      he came out a statesman.
      No bitterness. Just the long walk
      to freedom, continued on foot.
    description: "After twenty-seven years, Mandela walked free with fist raised; the traveler stood in the singing crowd as a firebrand emerged a statesman, unbroken."
    status: "published"
    sha256: "17fdc774cac4e98ce6c42a6cfbf5a7a7b62871b149f9196dbc2aa32a7a02b588"
  - number: "3877"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Baltic Break"
    date: "March 1990"
    region: "Lithuania"
    poem: |
      Lithuania declared independence —
      the first Soviet republic to break away,
      the anthem sung in parliament.
      I was in Vilnius that spring,
      the barricades of books and bodies,
      the Soviet tanks looming.
      The empire started to split.
      Moscow fumed, then blinked.
      The Baltics led; the rest followed.
      A small nation with a big choir
      sang the superpower apart.
    description: "Lithuania declared independence, the first Soviet republic to break away; the traveler stood in Vilnius among barricades of books as a small nation's choir sang the superpower apart."
    status: "published"
    sha256: "f1ee1b2bf07e030a6ed17c889e95bd9060b4144e967d51032558640e14cefff9"
  - number: "3878"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Blurry Telescope"
    date: "April 1990"
    region: "USA"
    poem: |
      Hubble launched — and couldn't see.
      A flawed mirror, images blurred,
      the billion-dollar telescope myopic.
      I watched the disappointment at NASA,
      the jokes, the groans.
      Then the fix: astronauts gave it glasses,
      and Hubble saw eternity —
      the Deep Field, the Pillars,
      the universe in high definition.
      The blurry telescope became
      humanity's greatest eye.
      Sometimes you just need
      a second chance in orbit.
    description: "Hubble launched with flawed vision; the traveler watched NASA's groans turn to glory as astronauts gave it glasses and it became humanity's greatest eye."
    status: "published"
    sha256: "512ab4455bc6515669ce9f69a437e55b0e9bca53162c424807124777bbd988fd"
  - number: "3879"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Invasion of Kuwait"
    date: "August 1990"
    region: "Middle East"
    poem: |
      Saddam's tanks rolled into Kuwait City
      before dawn — a sovereign nation
      swallowed overnight.
      I was in the region when it happened,
      the disbelief, the refugees streaming south.
      The world drew a line:
      the UN, the coalition, the deadline.
      Kuwait's oil burned on the horizon.
      Desert Storm was coming.
      But that August, the shock was simple —
      a country, erased by morning.
    description: "Saddam Hussein seized Kuwait overnight; the traveler watched refugees stream south as the world drew a line and the desert burned on the horizon."
    status: "published"
    sha256: "fae6b8b8ff43abe509a056968b309a207ee7419e295f09f5e44b32af116ce56d"
  - number: "3880"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Genome Quest"
    date: "October 1990"
    region: "USA"
    poem: |
      Scientists launched the Human Genome Project —
      thirteen years to read all three billion letters
      of our DNA.
      I toured the early labs,
      the sequencing machines humming,
      the ambition staggering.
      The reading of our DNA began that October:
      the book of life, opened.
      We'd finish it, read ourselves,
      and find we barely understood a word.
      The quest continues —
      we're still learning to read.
    description: "Scientists launched the Human Genome Project to read our DNA; the traveler toured the humming labs as humanity began opening the book of life."
    status: "published"
    sha256: "08200f97c4f7e7c8648a2d92ab186304c4fb5b7064ef86a009ffc6fe02c6d449"
  - number: "3881"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "One Germany"
    date: "October 1990"
    region: "Germany"
    poem: |
      Less than a year after the Wall fell —
      reunification. One Germany,
      the wound healed, the anthem whole.
      I was in Berlin for the ceremony,
      the flags, the fireworks,
      East and West weeping together.
      Forty-five years divided.
      One night of hammers,
      one year of paperwork,
      and the nation was whole.
      The Cold War's body, made one again.
    description: "East and West Germany reunited less than a year after the Wall fell; the traveler watched Berlin weep together as forty-five years of division healed."
    status: "published"
    sha256: "fc1654967731aa20f23de78005b77242e839abe0aa8b042acf56ebf8fbec8c08"
  - number: "3882"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Desert Storm"
    date: "January 1991"
    region: "Middle East"
    poem: |
      The deadline passed — and the sky over Baghdad
      lit up on live television,
      allied jets pounding Iraq.
      I watched it from a hotel roof in Dhahran,
      the war as broadcast: green night-vision,
      smart bombs down chimneys.
      Desert Storm: forty-two days,
      Kuwait freed, Saddam left in place.
      The Gulf War began on live TV —
      and war became a show,
      for better and worse.
    description: "Allied jets pounded Iraq on live television; the traveler watched from a Dhahran rooftop as the Gulf War became a broadcast and war became a show."
    status: "published"
    sha256: "e1b369d801008fc4c93f87e22f1459984c46f37f2a5fa07de11bbd6f30805111"
  - number: "3883"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Hasta La Vista"
    date: "July 1991"
    region: "USA"
    poem: |
      A robot made of liquid metal
      walked through prison bars —
      Terminator 2, and computer effects grew up.
      I saw it opening weekend,
      the audience gasping at the T-1000.
      Cameron spent a fortune;
      it looked like the future.
      "Hasta la vista, baby"
      entered the language.
      The machines were coming, the film said —
      and Hollywood's machines
      had just arrived.
    description: "Terminator 2's liquid metal wowed audiences; the traveler gasped with the opening-weekend crowd as computer effects grew up and \"hasta la vista\" entered the language."
    status: "published"
    sha256: "dd08a3a0ee40663bf129c5409b564aeac68f2405611f2309ca4ab670850bedee"
  - number: "3884"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The World Wide Web"
    date: "August 1991"
    region: "Europe"
    poem: |
      At CERN, Tim Berners-Lee
      shared his invention with the world —
      the Web: pages, links, http,
      free for everyone, no patent.
      I visited his little NeXT machine,
      the first web server,
      a sticker saying "do not power down."
      The internet got its face that August.
      He gave it away.
      The most valuable gift in history —
      and he just... shared it.
    description: "Berners-Lee shared the Web with the world, patent-free; the traveler saw the little NeXT machine with its \"do not power down\" sticker — history's most valuable gift, given away."
    status: "published"
    sha256: "8ddc850977157535f759cb156e8b8e9665f1de56ccc66c29c4b3aef5af37aead"
  - number: "3885"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Coup That Failed"
    date: "August 1991"
    region: "USSR"
    poem: |
      The hardliners seized Gorbachev in Crimea,
      tanks in Moscow —
      and Boris Yeltsin climbed on one
      and said no.
      I was at the White House barricades,
      the crowds, the cigarettes, the fear.
      Three days. The coup crumbled.
      The empire's last gasp, televised.
      Yeltsin on the tank: the image
      that ended the Soviet Union.
      It fell not with a bang
      but with a drunk on a tank.
    description: "Hardliners seized Gorbachev and Yeltsin stood on a tank; the traveler manned the Moscow barricades as the three-day coup crumbled and the empire gasped its last."
    status: "published"
    sha256: "6713ce6cb2d8f7d4acf05219bfd006d48775c71825621dc94f1b9cf915b6ca87"
  - number: "3886"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Smells Like Teen Spirit"
    date: "September 1991"
    region: "USA"
    poem: |
      A quiet-loud-quiet roar from Seattle —
      Nirvana's "Smells Like Teen Spirit,"
      and the hair-metal era died overnight.
      I heard it first in a record store,
      the kids going still, then wild.
      Grunge took over: flannel, fury,
      Cobain's howl.
      The eighties ended with a power chord.
      A generation's anthem, three minutes long —
      and nothing in pop
      was polished again.
    description: "Nirvana's roar ended the hair-metal era; the traveler heard it in a record store as kids went still then wild — the eighties dying on a power chord."
    status: "published"
    sha256: "4c959169d15563697d15f48f717eafb9a7e40558755315824c00def89fdcf434"
  - number: "3887"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Ukraine's Blue and Yellow"
    date: "December 1991"
    region: "Ukraine"
    poem: |
      Ninety percent voted yes —
      Ukraine's independence referendum,
      the blue and yellow rising over Kyiv.
      I was there for the vote,
      the lines, the quiet determination.
      The empire's breadbasket walked away.
      Moscow's centuries of rule, ended
      by a ballot.
      No one in that December crowd
      imagined what the future held —
      but the flag was theirs,
      and the choice was made.
    description: "Ukraine voted overwhelmingly for independence; the traveler stood in Kyiv's determined lines as the empire's breadbasket walked away by ballot."
    status: "published"
    sha256: "e012662b127bade2997621a418560657024a9d97739f80e11118627882a5629d"
  - number: "3888"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Red Flag Comes Down"
    date: "December 1991"
    region: "USSR"
    poem: |
      Christmas night: the red flag
      came down over the Kremlin,
      the tricolor went up.
      The Soviet Union dissolved —
      fifteen nations, alone, free, terrified.
      I stood in Red Square that night,
      the snow falling on the cameras.
      Seventy-four years, ended with paperwork.
      No war. No mushroom cloud.
      The Cold War ended the way it lived:
      in Moscow, in winter, quietly.
      The traveler exhaled.
      So did the world.
    description: "The Soviet Union dissolved as the red flag came down over the Kremlin; the traveler stood in falling snow as seventy-four years ended with paperwork, not war."
    status: "published"
    sha256: "13548de861947720a14b310801ff2d27a24bdfa9aafbd615346fe34b3a73c8c2"
  - number: "3889"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Euro Dream"
    date: "February 1992"
    region: "Europe"
    poem: |
      In Maastricht, Europe signed the dream —
      a union, a currency to come,
      the euro on the horizon.
      I watched the signing,
      the gray suits, the grand words.
      The European Union took shape that February:
      open borders, one market,
      history's oldest enemies sharing a wallet.
      The euro would come.
      The dream was older than the treaty —
      two thousand years of trying
      to stop fighting.
    description: "Europe signed the Maastricht Treaty, shaping the EU and the coming euro; the traveler watched gray suits sign two thousand years of trying to stop fighting."
    status: "published"
    sha256: "0c88bbdf12170303afb8ad0c6dbf8eb3902119d611ef5770bde22b10a7107c55"
  - number: "3890"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Los Angeles Burns"
    date: "April 1992"
    region: "USA"
    poem: |
      The verdict came down — not guilty —
      and Los Angeles exploded:
      six days, sixty dead, a billion in damage.
      I was in South Central that first night,
      the smoke, the sirens,
      Korean shopkeepers on their roofs.
      The Rodney King verdict lit the fuse;
      centuries of tinder did the rest.
      The city smoldered for days.
      America watched its reflection burn
      and looked away, again.
    description: "The Rodney King verdict sparked six days of LA riots; the traveler walked smoke-filled South Central as America watched its reflection burn."
    status: "published"
    sha256: "f0f73a3cda5a42094b4595e19a86665a1436620c67f7383393e00d5c0bd89038"
  - number: "3891"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Real World"
    date: "May 1992"
    region: "USA"
    poem: |
      MTV locked seven strangers in a loft,
      filmed everything —
      and reality television was born.
      I watched the first season,
      this strange new thing:
      real people, real fights, no script.
      The Real World: it seemed harmless.
      It invented the genre that ate television —
      confessionals, eliminations, fame
      for being filmed.
      We started watching each other
      instead of stories.
      We're still watching.
    description: "MTV locked strangers in a loft and reality TV was born; the traveler watched the first season as television stopped telling stories and started filming people."
    status: "published"
    sha256: "e770b4b1818948d166d786362051b16a78ceb6f3418fb961cada8d9d826a1dcf"
  - number: "3892"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Earth Summit"
    date: "June 1992"
    region: "Brazil"
    poem: |
      Rio: 172 nations, the planet's first summit —
      climate, forests, the future,
      all on the table.
      I was in the conference halls,
      the translators, the thousand-page texts.
      Agenda 21. The Rio Declaration.
      The planet got its own summit that June —
      and the promises were grand.
      The follow-through, less so.
      But for the first time, the world
      admitted the house was on fire
      in the same room, together.
    description: "Nations gathered in Rio for the planet's first summit; the traveler sat through thousand-page texts as the world admitted in one room that the house was on fire."
    status: "published"
    sha256: "192ccfd153cc117b25ff8feb6c3b8db42dff38d90bb9f5ff7447d9a866c950df"
  - number: "3893"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Black Wednesday"
    date: "September 1992"
    region: "UK"
    poem: |
      Soros broke the Bank of England —
      Black Wednesday, Britain crashed out of the ERM,
      the pound in freefall.
      I was in the City that day,
      the phones screaming, the dealers white.
      Sixteen billion spent defending the pound.
      Gone by teatime.
      The speculators won.
      Britain learned that markets
      are bigger than governments —
      a lesson the world keeps relearning,
      expensively.
    description: "Britain crashed out of the ERM on Black Wednesday; the traveler stood in the screaming City as sixteen billion vanished by teatime and markets beat governments."
    status: "published"
    sha256: "7bc16e83c548e11a4ae0756dc892140dca5348e03333eab49e87a048fae6efb0"
  - number: "3894"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Into Somalia"
    date: "December 1992"
    region: "Somalia"
    poem: |
      American troops landed on Mogadishu's beaches —
      Operation Restore Hope,
      food for the starving, cameras rolling.
      I was on those beaches,
      the night-vision green, the hope real.
      The mission turned dark:
      warlords, Black Hawk Down,
      eighteen Americans dead.
      Humanitarianism met reality
      in the Mogadishu streets.
      We came to feed.
      We left in coffins.
      The lesson haunted a generation.
    description: "American troops landed in Somalia on a humanitarian mission that turned dark; the traveler stood on Mogadishu's beaches as hope met warlords and the lesson haunted a generation."
    status: "published"
    sha256: "0d833c418e57969f572779cf60585c9de0045a7526ab772503796236494b121d"
  - number: "3895"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The First Strike"
    date: "February 1993"
    region: "USA"
    poem: |
      A truck bomb in the World Trade Center garage —
      six dead, a thousand hurt,
      a crater five stories deep.
      I was in lower Manhattan that day,
      the smoke, the evacuation down the stairs.
      Terror gave its warning in '93:
      Ramzi Yousef, the blind sheikh's men.
      We caught them. We moved on.
      Eight years later, the towers fell —
      and everyone remembered the first strike,
      the warning we filed away.
    description: "A truck bomb rocked the World Trade Center in 1993; the traveler evacuated down smoke-filled stairs past terror's first warning — filed away until the towers fell."
    status: "published"
    sha256: "2f7a0be2957b683ec885c6f771490f804e121e26a5505834d6d01167d087a7de"
  - number: "3896"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Mosaic"
    date: "April 1993"
    region: "USA"
    poem: |
      Two students at Illinois
      painted the Web in pictures —
      Mosaic, the first graphical browser,
      images inline, point and click.
      I downloaded it that spring,
      and the internet changed:
      from text to pictures,
      from nerds to everyone.
      The masses logged on.
      Mosaic became Netscape,
      Netscape became the boom.
      The Web got its face —
      and the face was friendly.
    description: "The Mosaic browser painted the Web in pictures; the traveler downloaded it that spring as the internet went from text to images and the masses logged on."
    status: "published"
    sha256: "ca73f9479cd3b2653296d8d3fa498836e93970a238fab938b98f37fc6240ab57"
  - number: "3897"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Eritrea's Freedom"
    date: "May 1993"
    region: "Eritrea"
    poem: |
      Thirty years of war —
      and Eritrea voted itself free,
      99.8% yes, the most decisive
      independence vote ever.
      I was in Asmara for the celebrations,
      the highland air, the dancing.
      Africa's longest war, ended by ballot.
      The fighters became builders.
      Eritrea's freedom was won the hard way:
      a generation in the trenches,
      then a single day of voting.
    description: "Eritrea won independence after thirty years of war with a 99.8% vote; the traveler danced in Asmara's highland air as fighters became builders."
    status: "published"
    sha256: "0543b054a3d29b67d3b340ee55b87e0456cb9808b3d3fc7e5fb56dbfb3c416b2"
  - number: "3898"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Jurassic Park"
    date: "June 1993"
    region: "USA"
    poem: |
      The dinosaurs walked again —
      Spielberg's Jurassic Park,
      CGI so real the audience forgot to breathe.
      I saw it opening night,
      the T. rex's footstep shaking the theater.
      Computer effects roared that summer:
      sixty-five million years, resurrected
      in pixels.
      "Life finds a way."
      So did the movies —
      a new era, one dinosaur at a time.
    description: "Jurassic Park's dinosaurs walked again in pixels; the traveler felt the T. rex's footstep shake the theater as computer effects roared into a new era."
    status: "published"
    sha256: "2783d2d65c5c6f9a29e1df42ff8c01b8b109a2c141dcc0d6d0a9e34eed041c72"
  - number: "3899"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Handshake"
    date: "September 1993"
    region: "Middle East"
    poem: |
      On the White House lawn —
      Rabin and Arafat, Clinton between them,
      the handshake the world waited decades for.
      I was on that lawn,
      the sun, the held breath.
      Oslo: peace got its chance.
      Mutual recognition, Gaza-Jericho first.
      The handshake was real.
      What followed — assassinations, intifadas —
      was real too.
      But for one September afternoon,
      enemies shook hands,
      and the future opened.
    description: "Rabin and Arafat shook hands on the White House lawn; the traveler held his breath in the sun as peace got its chance for one September afternoon."
    status: "published"
    sha256: "87b99d0b5ff6661c082d327a9581b32a2096ca7cb9424dcebdb69ff0d7fd322f"
  - number: "3900"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Schindler's List"
    date: "December 1993"
    region: "USA"
    poem: |
      Spielberg filmed the Holocaust
      in black and white —
      Schindler's List, and the world wept.
      I saw it in a silent theater,
      no one moving, no one coughing.
      The girl in the red coat:
      the only color, walking through the horror.
      Cinema's conscience, three hours long.
      "Whoever saves one life saves the world entire."
      We wept in black and white that winter —
      and remembered in color.
    description: "Spielberg filmed the Holocaust in black and white; the traveler sat in a silent theater as the girl in the red coat walked through horror and the world wept."
    status: "published"
    sha256: "f0ea966e02f2371b96593bebf24bf67d6e06cfff90a81bee43c88c1ac7b98664"
  - number: "3901"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Northridge Shakes"
    date: "January 1994"
    region: "USA"
    poem: |
      4:31 a.m.: Northridge convulsed —
      6.7, freeways collapsing,
      apartment blocks pancaked.
      I was in Los Angeles that morning,
      the aftershocks, the dust,
      the 10 freeway broken like a toy.
      Fifty-seven dead. Twenty billion in damage.
      California's reminder:
      the ground is temporary.
      We rebuild. We always rebuild.
      The earth shrugs, and we shrug back —
      with better building codes.
    description: "An earthquake jolted Los Angeles, collapsing freeways; the traveler stood in the dust at 4:31 a.m. as California learned again the ground is temporary."
    status: "published"
    sha256: "ac26520189d5320f9ad49d906297af3f24009418ff449d5fc7c3943e20e873c3"
  - number: "3902"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Lillehammer Games"
    date: "February 1994"
    region: "Norway"
    poem: |
      Norway hosted a fairy-tale Winter Olympics —
      Lillehammer, snow and candlelight,
      the Tonya-Nancy drama,
      Dan Jansen's golden skate.
      I was there for the fortnight,
      the cold, the kindness.
      The Lillehammer Games: the last innocent Olympics,
      before the money took over completely.
      Norway did it right —
      small, beautiful, human.
      A fairy tale on ice,
      and the world believed it.
    description: "Norway hosted a fairy-tale Winter Olympics at Lillehammer; the traveler spent the snowy fortnight at the last innocent Games — small, beautiful, human."
    status: "published"
    sha256: "03bde38fcc7aaf809bfcb5ffaa70a928b0e172d931b34e432a4b4db15de6ff6b"
  - number: "3903"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Rwanda's Hundred Days"
    date: "April 1994"
    region: "Rwanda"
    poem: |
      One hundred days.
      Eight hundred thousand dead —
      Tutsis slaughtered by Hutu militias,
      machetes, churches full of bodies.
      I was there. I won't describe
      what I saw. You know.
      The world watched and did nothing —
      withdrew the peacekeepers,
      debated the word "genocide."
      Rwanda's hundred days:
      humanity's shame, filed under "never again,"
      again.
    description: "Hutus slaughtered Tutsis for a hundred days while the world did nothing; the traveler was there and carries what he won't describe — humanity's shame, filed under \"never again,\" again."
    status: "published"
    sha256: "a0dda4cc2c594b1ac8331c3034ef4fa31348dff19b1ff0183101444f7e007fba"
  - number: "3904"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "President Mandela"
    date: "May 1994"
    region: "South Africa"
    poem: |
      The lines stretched for miles —
      South Africa's first free election,
      and Mandela won it.
      I was in Soweto that day,
      the singing, the old ones voting
      for the first time at eighty.
      President Mandela.
      Apartheid's end, sealed by ballot.
      He'd walked out of prison four years before;
      now he walked into the Union Buildings.
      The long walk to freedom —
      completed, together.
    description: "Mandela won South Africa's first free election; the traveler stood in Soweto's miles-long lines as eighty-year-olds voted for the first time and the long walk completed."
    status: "published"
    sha256: "62c69a59757384179204c94e7e2b587671aa557c378aae6afd461946c5495d60"
  - number: "3905"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Lion King"
    date: "June 1994"
    region: "USA"
    poem: |
      A cub's roar filled theaters —
      The Lion King, hand-drawn,
      Elton's songs, Mufasa's death
      making every child cry.
      I saw it with my neighbor's kids,
      the stampede, the tears.
      Animation's crown jewel:
      the highest-grossing hand-drawn film ever.
      Hamlet with lions.
      Shakespeare would have approved —
      and the children, roaring along,
      certainly did.
    description: "The Lion King's roar filled theaters; the traveler wept with the neighbor's kids at Mufasa's death as Hamlet with lions became animation's crown jewel."
    status: "published"
    sha256: "4bcd2c76ae3b41d8b40fa4acd1a12de1aa0ecfac2169c09957040f753c7c3871"
  - number: "3906"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The One Where It Begins"
    date: "September 1994"
    region: "USA"
    poem: |
      Six friends, a coffee shop —
      "Friends" premiered,
      and coffee-shop comedy ruled the decade.
      I watched the pilot,
      this bright new thing about being young
      in the city.
      Ten years it ran.
      Central Perk became everyone's living room.
      "Pivot! Pivot!"
      The nineties' true sitcom —
      about nothing but friendship,
      which turned out to be everything.
    description: "Friends premiered with six friends and a coffee shop; the traveler watched the pilot as Central Perk became everyone's living room for ten years."
    status: "published"
    sha256: "6ab73cae2ef967bf4136c731b307e3ee46172b23b8fae8475f1fdbe19781d4ec"
  - number: "3907"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "PlayStation"
    date: "December 1994"
    region: "Japan"
    poem: |
      Sony's gray box plugged in —
      the PlayStation, and video games grew up.
      I bought one in Tokyo that winter,
      the CDs, the 3D, Ridge Racer.
      Nintendo's cartridges couldn't compete.
      The gray box won the generation —
      and the next, and the next.
      Gaming's center of gravity moved
      to Sony's living room.
      PlayStation: the console
      that made games adult.
    description: "Sony's gray box plugged in and video games grew up; the traveler bought one in Tokyo as CDs beat cartridges and gaming's center moved to Sony's living room."
    status: "published"
    sha256: "676d0fd1e35f4dff7e0bea47ba8b3724cde33f3671ed014099c3f62a100717ce"
  - number: "3908"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Poison in the Subway"
    date: "March 1995"
    region: "Japan"
    poem: |
      Morning rush hour, Tokyo —
      Aum Shinrikyo's sarin in the subway,
      twelve dead, thousands choking.
      I was in the city that day,
      the stations sealed, the panic quiet and Japanese.
      A cult gassed the subway.
      The modern world felt terror —
      not from states, but from believers
      with chemistry sets.
      Poison in the subway:
      the future's new fear,
      inhaled on the morning commute.
    description: "A cult gassed Tokyo's subway with sarin; the traveler stood in the sealed stations as the modern world inhaled a new fear on the morning commute."
    status: "published"
    sha256: "d1bb5457e2cc419173142d4fb0f1175148139fa3c584c2715edc4a3f73c6585c"
  - number: "3909"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Oklahoma City"
    date: "April 1995"
    region: "USA"
    poem: |
      A truck bomb outside the Murrah Building —
      168 dead, nineteen of them children
      in the daycare.
      I was in Oklahoma City that week,
      the rescue workers, the silence.
      McVeigh: homegrown terror,
      the deadliest domestic attack in American history.
      Not from abroad. From within.
      The building came down.
      The grief stayed up.
      America learned that terror
      has a local address too.
    description: "A truck bomb killed 168 in Oklahoma City, nineteen of them children; the traveler stood in the rescue silence as America learned terror has a local address."
    status: "published"
    sha256: "c4d61be820d087274d61f11706186f173adf6d2e672b8ac277dc86f979e13fc3"
  - number: "3910"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Srebrenica"
    date: "July 1995"
    region: "Bosnia"
    poem: |
      The "safe area" wasn't safe.
      Serb forces took Srebrenica —
      and murdered 8,000 Muslim men and boys
      in the woods and warehouses.
      I walked those fields later,
      the mass graves, the mothers still searching.
      Europe's worst crime since World War II —
      under UN watch.
      The Dutch battalion stood aside.
      The world stood aside.
      Srebrenica: the word for what happens
      when "never again" is just words.
    description: "Serb forces murdered 8,000 Muslims at Srebrenica under UN watch; the traveler walked the mass-grave fields where \"never again\" proved to be just words."
    status: "published"
    sha256: "3cfa06585729325ba91c9a8b2a33e1c7a2d13b93a9ac9f29e6fb664876389a47"
  - number: "3911"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Start Me Up"
    date: "August 1995"
    region: "USA"
    poem: |
      Midnight lines, the Rolling Stones blaring —
      Windows 95 launched,
      the Start button clicked,
      and personal computers went mainstream.
      I was at a midnight store opening,
      the nerds cheering like rock fans.
      It crashed. It still won.
      Start me up: computing for everyone,
      the desktop metaphor conquered.
      Microsoft's peak —
      the whole world clicking Start.
    description: "Windows 95's Start button clicked and PCs went mainstream; the traveler cheered with nerds at a midnight opening as the desktop metaphor conquered the world."
    status: "published"
    sha256: "ba4a10d24363d9cc4a60da9787ca780ec423910568077d65fd88b49ac43fcc40"
  - number: "3912"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Peacemaker Falls"
    date: "November 1995"
    region: "Israel"
    poem: |
      After the peace rally in Tel Aviv —
      shots. Rabin fell.
      A Jewish extremist killed the peacemaker
      for making peace.
      I was in the square that night,
      the candles, the songs,
      a nation in shock.
      The hopes for peace dimmed that November —
      and never quite relit.
      Rabin's last words were about peace.
      His killer's were about God.
      The square is named for him now.
      The peace isn't.
    description: "Rabin was assassinated after a Tel Aviv peace rally; the traveler stood in the candlelit square as the hopes for peace dimmed and never quite relit."
    status: "published"
    sha256: "2bb27131f2251b01f05e1c5cd641d375ba6d3f6a4ed1b808e21f44d0cde93553"
  - number: "3913"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "To Infinity"
    date: "November 1995"
    region: "USA"
    poem: |
      No hand-drawn cells —
      Toy Story was all pixels,
      and the pixels charmed the world.
      I saw it opening weekend,
      Woody and Buzz, "to infinity and beyond,"
      the audience of adults crying.
      Animation went digital that November:
      Pixar's first feature, a revolution
      in rendering and in storytelling.
      The toys came alive.
      So did a new art form.
    description: "Toy Story's pixels charmed the world; the traveler cried with the adults at \"to infinity and beyond\" as animation went digital and a new art form came alive."
    status: "published"
    sha256: "996a95f66f014e20e04fcc8108a508777480d929957950e017377a074e513ef7"
  - number: "3914"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Gotta Catch 'Em All"
    date: "February 1996"
    region: "Japan"
    poem: |
      Two Game Boy cartridges —
      Red and Green —
      and the world set out to catch them all.
      I watched kids in Tokyo trading,
      link cables, playground economies.
      Pokémon launched that February:
      151 creatures, one obsession.
      It became the highest-grossing franchise
      in history — cards, shows, games, GO.
      Gotta catch 'em all:
      the four words that colonized childhood.
    description: "Pokémon launched on Game Boy and the world set out to catch them all; the traveler watched Tokyo kids trade via link cable as four words colonized childhood."
    status: "published"
    sha256: "557ce97dfa1da776a28b1eafe39d954028f3ac8d9992e6699234bc5d89d9e726"
  - number: "3915"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Death on Everest"
    date: "May 1996"
    region: "Nepal"
    poem: |
      A storm on the summit ridge —
      eight climbers died in a single day,
      the worst disaster on Everest then.
      I was at base camp when the news came down,
      the radios crackling, the silence after.
      Into Thin Air told the story:
      ambition, weather, the death zone's math.
      The mountain's price, itemized.
      Everest doesn't care about your summit fever.
      It collects, all the same.
    description: "A storm killed eight climbers on Everest in a single day; the traveler heard the radios crackle at base camp as the mountain collected its price, itemized."
    status: "published"
    sha256: "037856c7c542157d6245d432edefd90c69f8c1de6efdf69aa70f6ed5bc6e13a0"
  - number: "3916"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Atlanta Blast"
    date: "July 1996"
    region: "USA"
    poem: |
      Centennial Park, 1:20 a.m. —
      a pipe bomb in a knapsack,
      one dead, a hundred hurt.
      I was covering those Games,
      the celebration turned crime scene.
      The Atlanta blast: terror at the Olympics,
      again, shadow over the rings.
      They caught Rudolph years later,
      hiding in the hills.
      The Games went on.
      They always go on.
      That's the point of them.
    description: "A bomb marred the Atlanta Olympics; the traveler covered the celebration turned crime scene as the Games went on — that's the point of them."
    status: "published"
    sha256: "56b232c6f3e7389b346784bbd1503e7080ecc2b11d51cbb0a6e508e7f85b3987"
  - number: "3917"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Hey, Macarena"
    date: "August 1996"
    region: "Spain"
    poem: |
      A Spanish duo, a dance craze —
      "Hey, Macarena!"
      and every wedding on earth
      had the same moves.
      I did it at three weddings that year,
      arms out, hips swiveling,
      everyone from toddlers to grandmas.
      It was silly. It was universal.
      The Macarena: proof that joy
      needs no translation,
      just a beat and permission
      to be ridiculous together.
    description: "A Spanish dance craze swept the world's weddings; the traveler did the Macarena at three weddings as proof joy needs no translation — just a beat and permission."
    status: "published"
    sha256: "24ea1c95bcefa7dcf13db55b6b7e6d1143580884883b949b1f8b9e81db5af6ea"
  - number: "3918"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Digital Pet"
    date: "November 1996"
    region: "Japan"
    poem: |
      A plastic egg that beeped for feeding —
      Tamagotchi, the virtual pet,
      hatched in pockets worldwide.
      I watched kids in Osaka
      sneaking feeds under their desks,
      grieving pixel deaths.
      The digital pet: ten million sold,
      a generation learning attachment
      to a dot-matrix blob.
      It beeped. They fed it.
      Love, it turns out,
      doesn't require fur.
    description: "Tamagotchi's digital pets beeped for feeding in pockets worldwide; the traveler watched Osaka kids grieve pixel deaths and learned love doesn't require fur."
    status: "published"
    sha256: "d3559b1d180fc04b52e2f169566932bc49886aa3f391f99d3ec1ba06fbdcedd9"
  - number: "3919"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "To Mars"
    date: "December 1996"
    region: "USA"
    poem: |
      Mars Pathfinder launched —
      a lander, a rover named Sojourner,
      bound for the red planet.
      I watched the launch at the Cape,
      this small brave mission.
      Seven months later it landed,
      and Sojourner rolled onto Martian soil —
      the first rover, six wheels,
      sending back postcards.
      To Mars: we went by robot,
      and the robot waved back.
    description: "Mars Pathfinder launched with the Sojourner rover; the traveler watched it leave the Cape as humanity's first rover rolled onto Martian soil and waved back."
    status: "published"
    sha256: "e43542b599e64bb98f35baf81f3ac245355ecdf0fdd902f2428755b6b80bad8b"
  - number: "3920"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Dolly"
    date: "February 1997"
    region: "UK"
    poem: |
      A sheep in Scotland —
      Dolly, cloned from a single cell,
      the first mammal copied.
      I visited the Roslin Institute,
      this ordinary-looking sheep
      that broke biology open.
      The world gasped: cloning!
      Ethics, panic, wonder.
      Dolly lived six years,
      gave birth, grew old.
      Biology's future arrived in a pen —
      woolly, blinking,
      utterly revolutionary.
    description: "A sheep named Dolly was cloned in Scotland; the traveler visited the ordinary-looking animal that broke biology open — the future arriving woolly and blinking."
    status: "published"
    sha256: "26cfbadd0530d68d3eeb79800c1c479f905d0e6203af221e42e21db1c2104a15"
  - number: "3921"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Boy Who Lived"
    date: "June 1997"
    region: "UK"
    poem: |
      A broke single mother,
      a boy under the stairs,
      a letter by owl post —
      Harry Potter appeared in print.
      I bought the first edition,
      this slim children's book.
      A generation started reading that June —
      millions of kids, then adults,
      then the world.
      The boy who lived
      taught a generation to live
      in books.
    description: "Harry Potter appeared in print; the traveler bought the slim first edition as a boy under the stairs taught a generation to live in books."
    status: "published"
    sha256: "2012da49ef02dc48882a3c77bfd31739c8adc523c7032109576345a5f6011c1f"
  - number: "3922"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Handover"
    date: "July 1997"
    region: "China"
    poem: |
      Midnight: the Union Jack came down,
      the bauhinia rose —
      Britain returned Hong Kong,
      one country, two systems.
      I was at the ceremony,
      the rain, the bands,
      Prince Charles's yacht sailing out.
      A century and a half of empire,
      ended with a flag and a promise.
      The handover: history's largest
      peaceful transfer of people.
      The promise held, for a while.
    description: "Britain returned Hong Kong at midnight; the traveler stood in the rain as a century and a half of empire ended with a flag, a promise, and a yacht sailing out."
    status: "published"
    sha256: "5871e63422f69d048d4ee5677bb393a70f1af41e743da601a632bdfe6132415a"
  - number: "3923"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The People's Princess"
    date: "August 1997"
    region: "France"
    poem: |
      The tunnel in Paris —
      and Diana was gone, thirty-six.
      I was in London that week,
      the flowers carpeting Kensington,
      millions of them, rotting sweet.
      The people's princess:
      the world grieved like family.
      Elton rewrote Candle in the Wind.
      The Queen bowed, at last.
      Diana died in Paris;
      she was buried in the world's heart.
    description: "Diana died in Paris at thirty-six; the traveler walked flower-carpeted Kensington as the world grieved the people's princess like family."
    status: "published"
    sha256: "d1dac8cd88d981212ee7c3b36041aac0b94dad6c9e889df6c417b7a85e64c7a4"
  - number: "3924"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Shiny Disc"
    date: "November 1997"
    region: "Japan"
    poem: |
      The DVD arrived —
      a shiny disc, no rewinding,
      movies in digital clarity.
      I bought my first player,
      this silver tray of the future.
      Videotapes died that November:
      Blockbuster's shelves would empty,
      the be-kind-rewind era over.
      The shiny disc: movies went digital,
      and the living room became a cinema.
      Streaming would kill it next.
      Everything is temporary —
      except the movie.
    description: "DVDs replaced videotapes; the traveler bought his first player as the be-kind-rewind era ended and the living room became a cinema."
    status: "published"
    sha256: "9e9e9180c372b563e53951dd8e74515ed6ead0ec17dcf7e1914f1e2e4dced2d0"
  - number: "3925"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Ship of Dreams"
    date: "December 1997"
    region: "USA"
    poem: |
      Cameron built the ship —
      Titanic, three hours,
      and the world wept for 1912.
      I saw it twice opening week,
      the audience sobbing at the stern.
      The ship of dreams sailed into box-office history:
      the biggest film ever, then.
      "I'm the king of the world!"
      Hearts went on.
      Love stories, it turns out,
      float even the heaviest ships.
    description: "Titanic sailed into box-office history; the traveler sobbed with the opening-week crowd as the biggest film ever proved love stories float the heaviest ships."
    status: "published"
    sha256: "b98551482a613a7619c66b0de8bf10fcf0dd2e237fe6a65acbb029b7a6830035"
  - number: "3926"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Nagano Games"
    date: "February 1998"
    region: "Japan"
    poem: |
      Japan hosted the Winter Olympics —
      Nagano, snowboarding's debut,
      the Czechs' hockey gold,
      Tara's triple-triple.
      I was there for the fortnight,
      the temples, the powder.
      The Nagano Games: Asia's winter showcase,
      tradition meets halfpipe.
      Snowboarding went Olympic —
      the counterculture, certified.
      The mountains approved.
    description: "Japan hosted the Winter Olympics at Nagano; the traveler watched snowboarding debut as the counterculture got certified and tradition met the halfpipe."
    status: "published"
    sha256: "582cd75265c3ca006499a015975015c45242a72c4aacd40037c82fbc4773a744"
  - number: "3927"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Little Blue Pill"
    date: "March 1998"
    region: "USA"
    poem: |
      Pfizer's little blue pill —
      Viagra, approved,
      and medicine went bold.
      I watched the launch coverage,
      the jokes, the stunned silence,
      then the frank talk.
      Erectile dysfunction, named on television.
      The little blue pill: billions in sales,
      a cultural watershed.
      Medicine stopped whispering
      about the bedroom.
      Boldness, it turns out,
      comes in blue.
    description: "Viagra was approved and medicine went bold; the traveler watched the jokes turn to frank talk as the little blue pill ended the whispering about the bedroom."
    status: "published"
    sha256: "3f150d6bd082dbba2538565489d8244865be357835d600b5825facb95ffb9c55"
  - number: "3928"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Subcontinent's Bombs"
    date: "May 1998"
    region: "India"
    poem: |
      Pokhran, then Chagai —
      India tested, Pakistan answered,
      five blasts each, the desert shaking.
      I was in Delhi that May,
      the pride, the dread.
      The subcontinent's bombs:
      two enemies, both nuclear,
      a million troops on the border.
      The world held its breath —
      and learned to live with it,
      somehow.
      Deterrence, South Asian style:
      the unthinkable, thought daily.
    description: "India and Pakistan tested nuclear weapons weeks apart; the traveler felt Delhi's pride and dread as the world learned to live with the unthinkable, thought daily."
    status: "published"
    sha256: "42cb200a28c60381b546607614d16f3d2f62403456c121b9a7afa66e7f77c2a5"
  - number: "3929"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "France's Summer"
    date: "June 1998"
    region: "France"
    poem: |
      Zidane's two headers,
      the Stade de France roaring —
      France won the World Cup at home,
      3-0 over Brazil.
      I was in Paris that night,
      a million people on the Champs-Élysées,
      Black-Blanc-Beur dancing together.
      France's summer: the nation partied
      in the streets for days.
      Football did what politics couldn't —
      united the republic,
      one header at a time.
    description: "France won the World Cup at home; the traveler danced on the Champs-Élysées with a million people as football united the republic one header at a time."
    status: "published"
    sha256: "bc9f00d321a77911a8bbe7e30facb3a7f4794b1b4a8709ce535ccc366f321cdf"
  - number: "3930"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Google"
    date: "September 1998"
    region: "USA"
    poem: |
      Two Stanford students,
      a garage in Menlo Park,
      a misspelled "googol" —
      Google.
      I used it that first year,
      this clean white page
      that answered everything.
      The world's questions got answers.
      It became a verb.
      The garage became an empire.
      Two students organized the world's information —
      and the world organized itself
      around them.
    description: "Two students started Google in a Menlo Park garage; the traveler typed into the clean white page as the world's questions got answers and a verb was born."
    status: "published"
    sha256: "8a6db1146a1b80aa080f06b84054aaa27a8bdb0d177e9a89f0d5f83a1e78aebc"
  - number: "3931"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Desert Fox"
    date: "December 1998"
    region: "Iraq"
    poem: |
      Four nights of bombing —
      Desert Fox, allied jets over Baghdad,
      Saddam's defiance, the standoff grinding on.
      I watched the green flashes on television,
      the same sky, the same war,
      seven years after Storm.
      The inspectors were gone.
      The sanctions bit.
      Iraq simmered, contained but unbroken.
      Desert Fox: the war that wasn't,
      before the war that was.
    description: "Allied jets struck Iraq in Operation Desert Fox; the traveler watched the green flashes as the standoff ground on — the war that wasn't, before the war that was."
    status: "published"
    sha256: "ccfead9a83cefc73942f8d86619d30c162136d82918e189bcf874f869f2b09c8"
  - number: "3932"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Euro"
    date: "January 1999"
    region: "Europe"
    poem: |
      Eleven nations, one currency —
      the euro arrived, coins and notes to follow.
      I was in Frankfurt that January,
      the traders, the new symbol: €.
      Money united a continent:
      francs, marks, lire — gone,
      replaced by the euro dream made real.
      The boldest monetary experiment ever.
      It held. It holds.
      Europe's wallet, finally shared.
    description: "Eleven nations adopted the euro; the traveler stood in Frankfurt as francs, marks, and lire vanished into the boldest monetary experiment ever."
    status: "published"
    sha256: "e656ce0696ac9ab554b8c86aebe450e14be1c05f4db9417e4d23f83408c905e4"
  - number: "3933"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Bombs Over Belgrade"
    date: "March 1999"
    region: "Serbia"
    poem: |
      NATO went to war —
      its first ever —
      bombs over Belgrade for Kosovo.
      Seventy-eight days.
      I covered it from the border,
      the refugees, the columns,
      the embassy accidentally bombed.
      Milosevic caved.
      Kosovo was freed, sort of.
      The alliance fought its first war
      without a UN mandate —
      and the precedent echoes still.
    description: "NATO bombed Serbia over Kosovo in its first war; the traveler covered the refugee columns from the border as the alliance fought without a UN mandate."
    status: "published"
    sha256: "a3e0972ef876565f1bbbd03984616b8619be8f17d2257c659853e167dbc0b72b"
  - number: "3934"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Columbine"
    date: "April 1999"
    region: "USA"
    poem: |
      Two teens, a Colorado high school —
      thirteen dead, the nation in shock.
      I was in Littleton that week,
      the crosses on the hill,
      the grief counselors, the questions.
      Columbine: America grieved and argued —
      guns, bullying, the culture.
      The template for every school shooting since,
      God forgive us.
      It was the first.
      It wasn't the last.
    description: "Two teens killed thirteen at Columbine; the traveler stood among the crosses on the hill as America grieved and argued over the first of what wouldn't be the last."
    status: "published"
    sha256: "086492f602f27acb3f9353f61247de6fd36b89e69e88c6224ddabecb73ed4042"
  - number: "3935"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Phantom Menace"
    date: "May 1999"
    region: "USA"
    poem: |
      Sixteen years later —
      Star Wars returned,
      Episode I, the lines around the block at midnight.
      I queued with the faithful,
      lightsabers and costumes.
      The Phantom Menace:
      the hype was the movie.
      It disappointed, then endured —
      a generation's midnight memory.
      Darth Maul's double blade,
      that duel —
      worth the wait, almost.
    description: "Star Wars returned with midnight lines around the block; the traveler queued with lightsabers and costumes as the hype became the movie and the duel was worth the wait."
    status: "published"
    sha256: "04c8a6dfe56e152374ae52bd37c5c3dbec677e3cac4e1f56d2a5869570cc89c2"
  - number: "3936"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Napster"
    date: "June 1999"
    region: "USA"
    poem: |
      A nineteen-year-old's code —
      Napster, music shared free,
      millions of songs, no stores.
      I downloaded it that summer,
      this impossible library.
      The music industry panicked:
      lawsuits, Metallica, millions.
      Napster died in court.
      But the idea didn't —
      streaming is Napster, legalized.
      The kid broke the industry
      to save the song.
    description: "Napster shared music for free and the industry panicked; the traveler downloaded from the impossible library as a nineteen-year-old broke the business to save the song."
    status: "published"
    sha256: "4a46a1f4edccc799a2a4fa55dce77a82a0cdd6fd379f7e05be6ef5110c18fead"
  - number: "3937"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Y2K Scare"
    date: "December 1999"
    region: "Global"
    poem: |
      The world braced —
      planes falling, grids failing,
      the millennium bug at midnight.
      I stocked candles like everyone else,
      watched the ball drop,
      and... nothing.
      The Y2K scare: the apocalypse
      that didn't happen.
      Billions spent fixing code —
      which is why nothing happened.
      The quietest triumph ever:
      humanity debugged the future
      before it arrived.
    description: "The world braced for computer meltdown at midnight; the traveler stocked candles and watched nothing happen — humanity's quietest triumph, debugged in advance."
    status: "published"
    sha256: "eb23f10c9260ace543512234ae464a14cd020b9ae56ec271830f92b6521622a5"
  - number: "3938"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Bubble Pops"
    date: "March 2000"
    region: "USA"
    poem: |
      The NASDAQ peaked —
      then fell, and fell:
      the dot-com party ended,
      trillions evaporated.
      I was in Silicon Valley that spring,
      the foosball tables silent,
      the IPOs ash.
      Pets.com's sock puppet,
      the Super Bowl ads —
      all of it, gone.
      The bubble popped.
      But the internet survived —
      leaner, meaner, real.
    description: "Technology stocks crashed and the dot-com party ended; the traveler walked silent Silicon Valley foosball rooms as trillions evaporated and the internet survived leaner."
    status: "published"
    sha256: "1202dde3e09597766c9ea2191012ed5fa064a79d0cf451e15e1bc5e3b46fbcb6"
  - number: "3939"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Book of Life"
    date: "June 2000"
    region: "USA"
    poem: |
      Clinton and Blair announced it together —
      the draft human genome:
      three billion letters, read.
      I was at the press conference,
      the word "book" everywhere.
      The book of life: we can read ourselves now.
      What it said was humbling —
      we're mostly the same,
      barely different from a mouse.
      The reading began that June.
      Understanding is still catching up.
    description: "Scientists unveiled the draft human genome; the traveler heard \"the book of life\" at the press conference and learned we're barely different from a mouse."
    status: "published"
    sha256: "772199cc337abd4a224d4c0bdd2dfd2727dc156558dae68f2b945fe8b4300f98"
  - number: "3940"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Fall of Concorde"
    date: "July 2000"
    region: "France"
    poem: |
      A tire burst on the runway —
      Concorde caught fire and fell
      near Paris, 113 dead.
      I was at Charles de Gaulle that week,
      the grounded fleet, the silence.
      The supersonic dream faded that July:
      too loud, too thirsty, too fragile.
      Concorde flew again, briefly —
      but the magic was gone.
      The future got slower after that.
      We're still waiting
      to go fast again.
    description: "Concorde crashed near Paris; the traveler stood in the grounded silence at Charles de Gaulle as the supersonic dream faded and the future got slower."
    status: "published"
    sha256: "4a9b1f5081fbb3b925e0a1fb4e468bc6c62d9d7568897115e585a581be8aef33"
  - number: "3941"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "Sydney's Games"
    date: "September 2000"
    region: "Australia"
    poem: |
      Sydney hosted a joyful Olympics —
      the Harbour Bridge, the "best ever" Games,
      Cathy Freeman's 400m gold.
      I was in the stadium that night,
      100,000 voices, Freeman flying.
      Sydney's Games: the world swam and cheered,
      the millennium's first party.
      Australia did it perfectly —
      sunshine, sport, spirit.
      The last innocent Games of the century —
      or the first of the new one.
      Either way, golden.
    description: "Sydney hosted a joyful Olympics; the traveler heard 100,000 voices as Cathy Freeman flew — sunshine, sport, and spirit at the millennium's first party."
    status: "published"
    sha256: "eb18ce17f21a672d8953c008efcc38e04bfad2bf2c9da7f832461b6f329400a4"
  - number: "3942"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "A House Above Earth"
    date: "November 2000"
    region: "Space"
    poem: |
      Expedition 1 boarded the ISS —
      and humans have lived off-world
      ever since, continuously.
      I watched the launch coverage,
      this international house above earth:
      American, Russian, together.
      A house above earth, orbiting
      every ninety minutes.
      Twenty-five years and counting —
      humanity's longest address
      beyond the sky.
    description: "The first crew boarded the International Space Station; the traveler watched as humanity took up continuous off-world residence — still there, every ninety minutes."
    status: "published"
    sha256: "97c622d9905066495d89c8a3fe5ccd4a26fa64f2fbe76500cc4fe6f8f3bf59df"
  - number: "3943"
    volume: 6
    era_code: "13"
    era: "The Cold Peace"
    title: "The Hanging Chad"
    date: "November 2000"
    region: "USA"
    poem: |
      Florida. Recounts. Hanging chads —
      dimpled ballots, butterfly ballots,
      the presidency by 537 votes.
      I was in Tallahassee that November,
      the lawyers, the crowds,
      the Supreme Court deciding.
      Bush v. Gore: the Court chose the president.
      America's election hung on chads —
      paper scraps, deciding history.
      The century ended the way it lived:
      close, contested,
      and argued about ever since.
    description: "America's election hung on Florida recounts and the Court decided; the traveler stood in Tallahassee as paper scraps chose a president and the century ended contested."
    status: "published"
    sha256: "8342e1e8562a90b2d40cdc70ee7845f6816fd1ce62b09746283b25b769da0f65"
  - number: "3944"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Night the Computers Didn't Break"
    date: "2000 CE"
    region: "Global"
    poem: |
      They told us the world would end at midnight —
      every banker, every coder, every screen gone dark,
      the planes would drop, the lights go out,
      because some lazy fool wrote the year with two digits.
      I was there in the server rooms, I saw the fear,
      the millions spent, the keyboards worn to bone,
      and then the clock turned over, clean and clear,
      and nothing broke at all. We had outgrown
      our own small prophecy of doom that year —
      the costliest fix in history, and it worked.
      Sometimes the apocalypse we prepare for, dear,
      is just the shadow of the work we've shirked.
    description: "The Y2K panic spent billions fixing two-digit dates, then the millennium arrived without a glitch — humanity's most expensive scare that never happened."
    status: "published"
    sha256: "86b8b3b7da9ca65569c92faf33deec55ac532ac7e50a3ee4df9cd21734912676"
  - number: "3945"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Reading the Human Instruction Book"
    date: "2000 CE"
    region: "Global"
    poem: |
      I watched them read it —
      three billion letters,
      a working draft
      of what makes us us,
      printed out and stacked
      higher than a man is tall,
      all that code that codes
      the curve of a thumb,
      the color of eyes,
      the way we hunger,
      the way we fall in love.
      Not a book you finish,
      they said. A draft.
      I held my breath with them.
      We had finally read the recipe
      and none of us knew how to cook.
    description: "The Human Genome Project's working draft printed humanity's three billion DNA letters — the instruction book of a species, read for the first time."
    status: "published"
    sha256: "48c43eab3b74cf02e5cfcf494eb0bcaa37cd82e2521809c8ef87b980e9ccfd08"
  - number: "3946"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Dot-Com Crash"
    date: "2000 CE"
    region: "Global"
    poem: |
      Money poured in like rain on a paper town —
      Pets.com, Webvan, the socks and the groceries,
      every garage with a modem was a gold mine,
      every twenty-year-old a millionaire on paper.
      Then the rain stopped.
      I walked the empty offices, the Herman Miller chairs
      still spinning where the dreamers sat,
      the whiteboards full of futures nobody would fund.
      Trillions gone. The first gold rush of the wires
      ended the way gold rushes always end —
      with a ghost town, and a few who stayed
      to build the real city underneath.
    description: "The dot-com bubble burst and wiped out trillions — the internet's first gold rush collapsed into empty offices and abandoned whiteboards."
    status: "published"
    sha256: "469bf0b44b2186d5a56762610998349aa44857c715d7b390b12f2816790410fa"
  - number: "3947"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Sydney's Friendly Games"
    date: "2000 CE"
    region: "Oceania"
    poem: |
      The harbor lit up like a held breath,
      and the whole of Australia leaned in.
      I stood by the track when Cathy Freeman ran —
      four hundred meters, one woman,
      carrying more than a baton,
      carrying a continent's old wound
      and its hope in the same stride.
      When she crossed, the roar
      came up out of the earth itself.
      They called them the friendly games.
      For seventeen days, I believed it.
    description: "Sydney's 2000 Olympics crowned Cathy Freeman's 400m gold — a moment of national healing watched by a whole continent holding its breath."
    status: "published"
    sha256: "0ffb0c9182b93f76a363d9a0203b7cad2efb7da5ee7c46b275909d0aa860bed1"
  - number: "3948"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A President Picked by Judges"
    date: "2000 CE"
    region: "North America"
    poem: |
      Florida. A hanging chad, a dimpled ballot,
      five hundred thirty-seven votes in a nation of millions,
      lawyers in the hallways, the whole world counting,
      and then nine robes in Washington said stop.
      I watched a democracy choose its leader
      the way you choose a tiebreaker in tennis —
      by a ruling, not a roar.
      Half the country cheered, half never forgave.
      The machines counted, the judges decided,
      and nobody was ever quite sure again
      whose name the people had really written.
    description: "The 2000 US election came down to Florida's recount and a Supreme Court ruling — a presidency decided by judges, leaving half the nation unconvinced."
    status: "published"
    sha256: "9fd1cd307e73942f93747fb218b0173f3b0805500dae8430f2255048239bd7bd"
  - number: "3949"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Indestructible Phone"
    date: "2000 CE"
    region: "Global"
    poem: |
      Before the glass slabs, before the touch,
      there was a small blue brick with a greenish glow,
      and you could drop it down a flight of stairs,
      run it over, drown it, lose it in a couch for a year —
      and it would ring.
      A hundred million of them sold.
      I have seen empires with less staying power.
      Snake on the screen. A battery that lasted a week.
      It asked for nothing and never broke.
      We have spent twenty-five years since
      trying to build something that tough,
      and we never have, not once.
    description: "The Nokia 3310 sold over a hundred million units and became legend for surviving anything — the toughest phone ever made, still unmatched."
    status: "published"
    sha256: "1c33c51eb0da72a71ad398b70606385bc7bd96707eb4fec233c5a1cfb69e1b94"
  - number: "3950"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Music Set Free"
    date: "2000 CE"
    region: "Global"
    poem: |
      Some kid in a dorm room
      built a window, and through it
      every teenager on Earth
      could hear everything.
      I watched the hard drives fill —
      millions of songs, traded hand to hand,
      no stores, no money, just music
      moving like weather.
      The lawyers came with their lawsuits,
      one by one, shutting windows.
      But the window had been opened,
      and you cannot un-open a window.
      The industry never recovered.
      The listeners never went back.
    description: "Napster let millions of teenagers trade songs freely before the lawsuits shut it down — but the window it opened could never be closed again."
    status: "published"
    sha256: "bdeedc815df174e056837b37d98922c51f853808f03dc4b1eae8e625ccb2b8a4"
  - number: "3951"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A Thousand Songs in Your Pocket"
    date: "2001 CE"
    region: "Global"
    poem: |
      A thousand songs in your pocket, they said,
      and I laughed — who needs a thousand songs?
      Then I watched a generation unspool
      the album, the jewel case, the long walk to the store,
      and pour it all into a little white brick.
      The mixtape became infinite.
      The record store became a memory.
      I was there the day the album died —
      not with a bang, but with a scroll wheel.
      We carried our whole jukebox in our jeans
      and never listened to an album straight through again.
    description: "The iPod's launch began the end of the album — a thousand songs in a pocket dissolved the record store and the long-player forever."
    status: "published"
    sha256: "08cc825347330060efaf982c983ecb280fac36bfab21ac11d22382eb2a9c080b"
  - number: "3952"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Giant That Cooked Its Books"
    date: "2001 CE"
    region: "North America"
    poem: |
      Enron. The smartest guys in the room,
      they called themselves —
      and the books were cooked
      so beautifully that no one
      smelled the smoke until the building
      was already ashes.
      The biggest bankruptcy America had ever seen.
      I saw the workers' pensions evaporate
      like morning fog off the Houston highway,
      saw the executives shredding,
      saw the hearings, the handcuffs,
      the stunned faces of auditors
      who had signed their names to air.
      A giant fell, and in the crater
      a new law was born: show us the books.
    description: "Enron's accounting fraud produced the largest US bankruptcy ever — workers' pensions vanished and a giant fell on cooked books."
    status: "published"
    sha256: "d919ff92fd24a219ae690c812d49d125f8735d5eb1d715262dca44fbbe749f95"
  - number: "3953"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Fear in the Mail"
    date: "2001 CE"
    region: "North America"
    poem: |
      After the towers came the envelopes.
      White powder. A senator's office, a newsroom,
      a postman who never came home.
      I watched a nation that had just learned to grieve
      learn to be afraid of its own mailbox —
      gloves at the sorting office,
      letters held up to the light,
      five dead, seventeen sick,
      and a fear that outlived them all.
      In the shadow of September,
      even the mail could kill.
      We sealed the letters. We kept the fear.
    description: "Anthrax-laced letters killed five and terrorized America in late 2001 — fear arrived in the mailbox in the shadow of the September attacks."
    status: "published"
    sha256: "c0df6f6343d12137d5373b72449a29afd0cf460db9c7d2bcf9a585aee947d757"
  - number: "3954"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Everybody Starts Taking Pictures"
    date: "2001 CE"
    region: "Global"
    poem: |
      First it was the grainy ones —
      a face you could barely see,
      a sunset made of twelve pixels.
      Then everybody had one.
      I watched the world begin to photograph
      everything it ate, everything it saw,
      everyone it loved, every sunset,
      every cat, every meal, every moment
      that used to just happen and be gone.
      Memory changed that year.
      Nothing was lost anymore —
      and nothing was private, either.
      We traded forgetting for keeping,
      and we have been scrolling ever since.
    description: "Camera phones spread and the world began photographing everything — memory itself changed as nothing was lost and nothing stayed private."
    status: "published"
    sha256: "eb8483380a359adc8d93d86808078934de500afa56788681098f4cf5ae9b903e"
  - number: "3955"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Ogre Who Mocked Fairy Tales"
    date: "2001 CE"
    region: "Global"
    poem: |
      A green ogre walked out of a swamp
      and told every fairy tale ever told
      to sit down and shut up.
      I was there opening weekend —
      the kids howled, the parents howled louder,
      because the jokes were for them,
      the winks, the jabs at the mouse-eared empire.
      Animation had been castles and princesses;
      now it was burps and onions and layers.
      It won the first Oscar they ever gave a cartoon feature.
      The fairy tale didn't die.
      It just learned to laugh at itself.
    description: "Shrek mocked every fairy tale convention and won the first-ever animated-feature Oscar — animation learned to laugh at itself."
    status: "published"
    sha256: "ce74985fea9eba1a0d866fa578796b9de3ba0d410b237e446a56c627e428b6be"
  - number: "3956"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A City of Vice to Steal"
    date: "2001 CE"
    region: "Global"
    poem: |
      They built a city you could steal.
      Not a level, not a maze — a city,
      with rain on the windshield
      and the radio playing your song
      while you ran the red lights.
      I watched players disappear into Liberty City
      for weeks at a time, living second lives
      behind the wheel of a stolen car.
      Games had been puzzles; now they were places.
      The open world was born that year,
      and nobody ever went back
      to the little corridors again.
    description: "Grand Theft Auto III invented the open-world game — players got a living city instead of a level, and games were never the same."
    status: "published"
    sha256: "ebd09d47160a822560e2ab1c8f0df6ce1942de3923d46a4c2dce117456f74d4f"
  - number: "3957"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "One Money for a Continent"
    date: "2002 CE"
    region: "Europe"
    poem: |
      One morning, twelve currencies died.
      The franc, the mark, the lira, the peseta —
      centuries of kings' faces and poets' portraits
      turned to paper for the collectors overnight.
      I stood in a Paris bakery watching an old man
      pay with the new coins, turning them over,
      suspicious, then smiling at the little stars.
      A continent woke up with one money in its pocket.
      No one had ever done it before.
      It worked — mostly, beautifully —
      until the day it almost didn't.
    description: "Euro notes and coins replaced twelve national currencies in a single morning — a continent woke up sharing one money for the first time."
    status: "published"
    sha256: "bb4442f2ffc1e95fa1538b4e46525a580f629ea6dc679391510f00252956b526"
  - number: "3958"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Water Beneath the Red Dust"
    date: "2002 CE"
    region: "Space"
    poem: |
      Mars Odyssey flew over the red desert
      with eyes that saw through dust,
      and underneath — ice.
      Vast fields of it, frozen water
      hiding inches under the rust,
      enough to fill oceans, enough to drink,
      enough to make a future there.
      I have stood in mission rooms
      when the maps came up on the screens,
      and grown scientists went quiet
      like children on Christmas morning.
      Water. On Mars. Waiting.
      The red planet had been keeping
      its most important secret in the dark.
    description: "Mars Odyssey's instruments found vast ice fields beneath the Martian soil — water enough for a future, waiting under the red dust."
    status: "published"
    sha256: "67234417181f2086a9331f1702ea2ddfa0bc556098383e17cc84f574d0cb5146"
  - number: "3959"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Samba Kings Again"
    date: "2002 CE"
    region: "Global"
    poem: |
      Across Japan and Korea they danced —
      Ronaldo, Rivaldo, Ronaldinho,
      the yellow shirts moving like music,
      and in the final, two goals,
      and the fifth star sewn on.
      I was in a Rio street when the whistle blew —
      the whole city poured out of itself,
      drums, horns, grandmothers dancing on tables.
      Brazil had waited eight years.
      Football's greatest nation was itself again.
      Some victories are just games.
      This one felt like a country remembering its name.
    description: "Brazil won its fifth World Cup across Japan and Korea — the samba kings reclaimed football's crown and Rio poured into the streets."
    status: "published"
    sha256: "c619ee981eeb2aa8e203bec83840edbc7d4bf2a7c7a1a9674816fc22d0f54df8"
  - number: "3960"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A Court for the World's Worst Crimes"
    date: "2002 CE"
    region: "Europe"
    poem: |
      In The Hague they opened a courtroom
      with no country on the door.
      Genocide. Crimes against humanity.
      War crimes. The words were carved
      into the founding statute like a vow:
      never again means a courtroom,
      not just a speech.
      I watched the first prosecutors walk in,
      knowing the great powers would never join,
      knowing the dock might stay empty for years.
      It was a promise made of paper.
      But paper, sometimes, is where justice starts.
    description: "The International Criminal Court opened in The Hague — a courtroom for genocide and war crimes with no country on its door."
    status: "published"
    sha256: "91915c3cee422c0ea132cc53b181286911cff16c06919d56d297031bdcab91e6"
  - number: "3961"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A New Fever in Guangdong"
    date: "2002 CE"
    region: "Asia"
    poem: |
      It started as a rumor in Guangdong —
      a strange pneumonia, a fever that wouldn't break,
      whispers in hospital corridors,
      text messages passed hand to hand.
      SARS. Severe, acute, and new.
      I watched it board airplanes
      and land in Hong Kong, Toronto, Singapore,
      watched the masks go on in the subways,
      the temperature guns at the airports.
      Eight thousand cases before it burned out.
      A rehearsal, we called it later.
      Nobody knew we were rehearsing.
    description: "SARS emerged in southern China and rode airplanes around the world — eight thousand cases, a rehearsal for a pandemic nobody knew was coming."
    status: "published"
    sha256: "3cff6e9920fbf9bc0689087705fab8f40a06485d862fdbb4c3670add3ae4fc2e"
  - number: "3962"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Forty Hours in a Moscow Theater"
    date: "2002 CE"
    region: "Europe"
    poem: |
      Eight hundred fifty people
      went to see a musical in Moscow
      and walked into forty hours of hell —
      Chechen fighters in the aisles,
      bombs on the pillars,
      a standoff the whole world watched.
      Then the gas came through the vents,
      silent, invisible, and the theater stormed.
      The captors died. So did one hundred thirty hostages.
      I have never forgiven the arithmetic
      of that rescue — the living carried out
      past the bodies, the questions no one answered:
      who ordered the gas, what was in it,
      why the ambulances weren't told.
      A rescue that killed the rescued.
    description: "Chechen fighters seized a Moscow theater; the rescue gas killed 130 hostages along with the captors — a rescue that killed the rescued."
    status: "published"
    sha256: "605a323eca6ac9a122ce766461f283951ffa55a67d266e43af1a2af55988c8d9"
  - number: "3963"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Fire in Paradise"
    date: "2002 CE"
    region: "Asia"
    poem: |
      Bali. The island of the gods,
      all frangipani and surf and young backpackers
      dancing barefoot in Kuta.
      Then the bombs — two of them,
      in the nightclub strip,
      and paradise burned.
      Two hundred two dead, mostly young,
      mostly tourists who had come
      for the cheapest heaven on Earth.
      I walked the street a week later.
      The flowers were already back,
      piled high where the Sari Club stood.
      Bali forgave faster than the world did.
      But the young ones never came home.
    description: "The 2002 Bali bombings killed 202 people, mostly young tourists — fire in paradise, on the island of the gods."
    status: "published"
    sha256: "23591e89b8e9e51ac047bcb466054baa46c3eb663270aa07138016ba94c96518"
  - number: "3964"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Shock and Awe"
    date: "2003 CE"
    region: "Middle East"
    poem: |
      The sky over Baghdad bloomed with fire
      on live television — shock and awe,
      they called the opening act,
      and the statues fell in weeks.
      I was there for the falling
      and stayed for what came after:
      the looting, the long insurgency,
      the weapons that were never found,
      the mission accomplished banner
      flapping over a war with no end.
      Empires have a habit, I have learned —
      they win the invasion
      and lose everything that follows.
    description: "The Iraq invasion toppled Baghdad in weeks on live TV — then came the long insurgency, the missing weapons, and a war with no end."
    status: "published"
    sha256: "3363c9e480962bb100818edc4bbb01419a86a8d472f637641a50d186bbb040f6"
  - number: "3965"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Genome Finished"
    date: "2003 CE"
    region: "Global"
    poem: |
      Fifty years after the double helix,
      they declared it done —
      the whole human code, all three billion letters,
      read end to end, the book closed.
      I stood among the scientists
      who had raced governments and companies
      to finish first, and there was champagne,
      and there was also a strange quiet.
      Because finishing the reading
      was only the beginning of understanding.
      We had the letters. Now we needed
      the meaning — and meaning,
      it turns out, takes longer.
    description: "The Human Genome Project declared the full human DNA code complete — the reading done, the understanding still barely begun."
    status: "published"
    sha256: "b7c5c18e0c3589f3c5bfbb08b4d415bf6058056ee24275663b19fb2cba134be9"
  - number: "3966"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Columbia Breaks Apart"
    date: "2003 CE"
    region: "Space"
    poem: |
      Sixteen days in orbit, a perfect mission,
      and then re-entry over Texas —
      a piece of foam, a wounded wing,
      superheated air finding the crack.
      I watched the sky that morning
      and saw the trails split apart,
      saw seven bright streaks
      where one shuttle should have been.
      Seven astronauts. Gone in the blue.
      The program stood down for two years,
      grieving, learning, hardening.
      Space does not forgive small damage.
      It never has. It never will.
    description: "Columbia disintegrated over Texas during re-entry, killing seven astronauts — a wounded wing, superheated air, and space's unforgiving physics."
    status: "published"
    sha256: "432f086e6c265268bc3867b76e94dbaed14ebc4b3b780b039c996ad0ffbd30d2"
  - number: "3967"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Two Rovers Sail to Mars"
    date: "2003 CE"
    region: "Space"
    poem: |
      Two golf carts with cameras,
      launched a month apart,
      aimed at a planet
      two hundred million kilometers away —
      on a ninety-day warranty.
      Spirit. Opportunity.
      I watched them leave Earth
      on pillars of fire that summer,
      two small machines carrying
      all our curiosity in their solar wings.
      Ninety days, they said.
      They would outlive that promise
      by years, by decades of extra mornings.
      But on launch day, all we had was hope
      and very good math.
    description: "Spirit and Opportunity launched for Mars on a 90-day mission — two small rovers carrying humanity's curiosity across two hundred million kilometers."
    status: "published"
    sha256: "b8c1de9cd39ff4e5e4d785e7f4da65d1e15e82371db56338b1c4c88a76c0aef3"
  - number: "3968"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Masks Come Off"
    date: "2003 CE"
    region: "Asia"
    poem: |
      The WHO said the word: contained.
      Eight thousand cases, seven hundred seventy-four dead,
      and the fever that had ridden the airplanes
      finally burned itself out.
      I watched the masks come off in Hong Kong,
      the temperature checkpoints fold away,
      the city exhale for the first time in months.
      We told ourselves we had won.
      We wrote the playbook — trace, isolate, mask —
      and filed it away like a trophy.
      Seventeen years later we would need it.
      We would find the pages stuck together.
    description: "The WHO declared SARS contained after 8,000 cases — the masks came off, the playbook was filed away, and seventeen years later we'd need it again."
    status: "published"
    sha256: "9f0f114b7a61301af0ddc0bc26626ba95823833f97b2e22e3092d78ee362b1fd"
  - number: "3969"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Fifty Million in the Dark"
    date: "2003 CE"
    region: "North America"
    poem: |
      A sagging power line in Ohio
      touched a tree branch.
      That's all it took.
      The cascade ran east like a rumor —
      fifty million people, two countries,
      dark in the middle of a summer afternoon.
      I was in Manhattan when the elevators stopped,
      when the subways sighed to a halt,
      when the whole island walked home
      across the bridges in the heat.
      No looting. Strangers directing traffic.
      For one night, the greatest city on Earth
      remembered how to be a neighborhood.
    description: "A tree branch in Ohio triggered the great Northeast blackout — fifty million people dark, and Manhattan walked home across the bridges."
    status: "published"
    sha256: "7cbdf0fbe4aac831fefadcab52367fe48ba5bbc5dddffb860c215bb9afce1554"
  - number: "3970"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Everybody Gets a Profile"
    date: "2003 CE"
    region: "Global"
    poem: |
      Tom was everyone's first friend.
      MySpace gave the whole world a profile —
      a page, a song that played when you visited,
      a Top 8 that ended friendships.
      I watched teenagers learn HTML
      just to glitter their backgrounds,
      watched bands get discovered
      in bedrooms and basements,
      watched the first great boom
      of showing your life to strangers.
      It was ugly and glorious and free.
      Then the blue giant came
      and the party moved.
      But MySpace was the first room
      where everybody got a page.
    description: "MySpace launched social media's first great boom — profiles, Top 8s, glitter backgrounds, and bands discovered in bedrooms."
    status: "published"
    sha256: "a2487c0e9f066c34e396c9ed631ff3b18f858cbe6444a8a9daebbb960ea46e46"
  - number: "3971"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A Harvard Dorm's Address Book"
    date: "2004 CE"
    region: "Global"
    poem: |
      It started as a dorm's address book —
      faces, names, who's in what class,
      a little Harvard-only directory
      built by a sophomore in a hurry.
      I watched it spill past the campus gates,
      college to college, then high schools,
      then everyone, everywhere.
      The social graph, they called it —
      every friendship mapped, every like counted.
      Two billion people would eventually live
      half their social lives inside it.
      All from a dorm room directory.
      The smallest seeds grow the strangest forests.
    description: "Facebook began as a Harvard dorm directory and grew into the social graph — billions eventually living half their social lives inside it."
    status: "published"
    sha256: "0d4d0390a6506f434c1ad7278620f9b99b3cdf32171d9a3f3170a918a30da0cd"
  - number: "3972"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Wave That Crossed an Ocean"
    date: "2004 CE"
    region: "Asia"
    poem: |
      The sea pulled back first —
      a strange low tide, fish flopping on the sand,
      tourists walking out to stare.
      Then it came back as a wall.
      I have walked those beaches since,
      in Aceh, in Thailand, in Sri Lanka,
      and the people still point:
      the water reached here. Here.
      Two hundred thirty thousand dead
      across fourteen countries,
      in the time it takes to drink tea.
      The wave crossed an ocean.
      Grief crossed the whole world.
    description: "The 2004 Indian Ocean tsunami killed 230,000 people across fourteen countries — the sea pulled back, then returned as a wall."
    status: "published"
    sha256: "783eced9a7b6e4d17b77c932c2017f1c171a6da6e14f6a862134a517d81d0a08"
  - number: "3973"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Six Wheels on Mars"
    date: "2004 CE"
    region: "Space"
    poem: |
      They wrapped the rovers in airbags
      and dropped them at the planet —
      bounce, bounce, bounce across the red dust,
      then the bags deflated, the petals opened,
      and six wheels touched Mars.
      Spirit in the crater. Opportunity in the plain.
      I watched the first pictures come down:
      a salmon sky, a horizon of rust,
      tire tracks in another world's dirt.
      Ninety days, the warranty said.
      Opportunity would drive for fourteen years.
      Some machines are built by engineers.
      Some are built by hope with tools.
    description: "Spirit and Opportunity bounced down on Mars in airbags and opened their petals — six wheels in red dust, on a 90-day warranty that lasted years."
    status: "published"
    sha256: "08770accee4f14f7b5bb718a83f8fda33274d494a3528811a0b727f783e4013a"
  - number: "3974"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Orange Banners in Kyiv"
    date: "2004 CE"
    region: "Europe"
    poem: |
      The election was stolen — everyone knew it —
      so they came out in the snow,
      a sea of orange in Independence Square,
      singing, freezing, refusing to go home.
      I stood among them, breath fogging,
      watching grandmothers hand out tea
      to students who wouldn't leave.
      Weeks of it. Peaceful, stubborn, orange.
      And it worked — the court annulled the fraud,
      the vote was rerun, the people won.
      Kyiv taught the world that winter:
      a rigged election is only final
      if the people agree to go home.
    description: "Ukraine's Orange Revolution filled Kyiv's snowy squares with protesters until a rigged election was annulled and rerun — the people refused to go home."
    status: "published"
    sha256: "a4fa4e76246f4c73796b67412f9e9838499da46a99d860e9b472194535416ab7"
  - number: "3975"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Saturn Up Close"
    date: "2004 CE"
    region: "Space"
    poem: |
      Seven years of falling toward Saturn,
      and then the burn — Cassini slipped
      into orbit around the ringed giant
      and stayed for thirteen years.
      I have seen what it sent back:
      geysers on Enceladus, methane rain on Titan,
      the rings in such detail you could see
      the shepherd moons herding the ice.
      Thirteen years of wonders,
      then a final dive into the clouds,
      burning up to protect the moons
      it had taught us to love.
      The little probe that showed us Saturn —
      and chose to die rather than risk its children.
    description: "Cassini orbited Saturn for thirteen years — geysers, methane rain, shepherd moons — then burned up in the clouds to protect the moons it revealed."
    status: "published"
    sha256: "128fda03ef75bbb03071e48d443890573c48c3306128170ebac4be725c28751f"
  - number: "3976"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Games Come Home"
    date: "2004 CE"
    region: "Europe"
    poem: |
      After a hundred and eight years away,
      the Olympics came home to Athens —
      to the marble stadium,
      to the birthplace, to the dust
      where it all began.
      I walked the old track at Olympia
      where the torch was lit from the sun,
      no matches, just a mirror and light,
      the way they did it three thousand years ago.
      The games were modern, the money was modern,
      but for one summer the ancient stones
      got to watch their children run again.
      Home is a powerful word.
      Athens proved it.
    description: "The 2004 Olympics returned to Athens, their ancient birthplace — the torch lit by sunlight at Olympia, the games home after 108 years."
    status: "published"
    sha256: "f51806eef4945ae5721e4c92dc33647ccf5c9dfd299bd568a295d3bb4056fc35"
  - number: "3977"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Madrid's Trains"
    date: "2004 CE"
    region: "Europe"
    poem: |
      Morning rush hour. Four commuter trains.
      Ten bombs in backpacks, timed to the minute,
      and 193 people never made it to work.
      I stood at Atocha station days later,
      among the candles and the handwritten notes,
      the whole of Spain holding its breath.
      An election three days later turned on it —
      a government fell, troops came home from Iraq.
      Terror wanted fear. Spain answered
      with votes, with candles, with the quiet dignity
      of a people who refused to be ruled by it.
    description: "Coordinated bombs killed 193 on Madrid's commuter trains — Spain answered terror with candles, dignity, and votes three days later."
    status: "published"
    sha256: "609240b4c968b7894c9eea990f7d7392494e2c693cd018fa4c4c0ae780cecc1a"
  - number: "3978"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Broadcast Yourself"
    date: "2005 CE"
    region: "Global"
    poem: |
      Three former PayPal guys, a garage,
      a slogan: broadcast yourself.
      I watched the first uploads —
      a kid at the zoo, grainy, nineteen seconds —
      and thought nothing of it.
      Then everyone with a camera became television.
      Bedroom guitarists, makeup teachers,
      gamers, preachers, comedians, cooks —
      a billion channels, no network, no permission.
      The gatekeepers didn't fall.
      They were simply walked around,
      by teenagers with webcams
      and something to say.
    description: "YouTube launched with \"broadcast yourself\" — anyone with a camera became television, and the gatekeepers were walked around, not toppled."
    status: "published"
    sha256: "c679f3ed4ae6a9891e71ff07267622c3ba9058af08768053eab8452277f02d5f"
  - number: "3979"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Katrina Drowns a City"
    date: "2005 CE"
    region: "North America"
    poem: |
      The levees broke, and New Orleans drowned —
      not in the storm, but in the failure after:
      the Superdome full of the stranded,
      the rooftops full of the waiting,
      the helicopters that came too late
      for the poorest zip codes first.
      I was there in the weeks after,
      the waterlines on the houses,
      the refrigerators on the curbs,
      the anger that never quite left.
      The world watched America —
      the richest nation on Earth —
      fail its poor on live television.
      The water receded. The shame didn't.
    description: "Hurricane Katrina's broken levees drowned New Orleans — the world watched America fail its poorest on live television."
    status: "published"
    sha256: "c6efb5d8186dbec0d6da623ba322c2cb17987cdc7f24b963c53ed51274d0a51f"
  - number: "3980"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Live 8's Plea"
    date: "2005 CE"
    region: "Global"
    poem: |
      Ten concerts. One day. One demand:
      cancel the debt strangling Africa.
      I watched London's Hyde Park fill —
      two hundred thousand voices,
      Pink Floyd reuniting, McCartney and U2,
      all of it beamed to billions.
      Make poverty history, the wristbands said.
      The G8 met in Scotland days later
      and promised — some of it, not enough,
      the way summits do.
      But for one day the whole planet sang
      the same chorus at the same time,
      and the powerful had to listen.
    description: "Ten simultaneous Live 8 concerts demanded an end to Africa's debt — billions watched as the planet sang one chorus at the summits."
    status: "published"
    sha256: "f27c538563dc5da04316aabfa2665b84e29fc0dab944658f96901225c92b12de"
  - number: "3981"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Kyoto Takes Effect"
    date: "2005 CE"
    region: "Global"
    poem: |
      The first climate treaty with teeth
      became law — binding targets,
      signed promises, a planet
      agreeing, on paper, to cool itself.
      I was in the corridors in Kyoto years before,
      when they argued over commas
      that meant gigatons.
      America stayed out. The big one.
      Still, the treaty lived, and carbon markets
      learned to price the sky.
      It was a beginning wearing
      the clothes of a victory —
      thin clothes, but better than naked.
      The planet noticed. Barely.
      But barely is where beginnings live.
    description: "The Kyoto Protocol became international law — the first climate treaty with binding targets, a thin beginning wearing victory's clothes."
    status: "published"
    sha256: "69a0443bd5f9f67f268b0e1ab0de92a2ffc86d1a75adaca98a966193d281f72f"
  - number: "3982"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Whole World from Above"
    date: "2005 CE"
    region: "Global"
    poem: |
      One day the whole world was on your screen —
      every rooftop, every dirt road,
      your childhood house from five hundred miles up.
      I watched people find their homes
      and cry, watched them trace
      the street where they grew up,
      watched dictators realize
      their palaces were visible now.
      Google Earth made the planet
      a thing you could hold and spin.
      Borders looked very small from up there.
      So did armies. So did we.
    description: "Google Earth put every rooftop on every screen — the whole planet became a thing you could hold, spin, and zoom into."
    status: "published"
    sha256: "9e351dc1091ca31ffa4dc0884ca5bde2c26379fd2ed6e7645e6ac6658f678a09"
  - number: "3983"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A Spacecraft Punches a Comet"
    date: "2005 CE"
    region: "Space"
    poem: |
      They flew a spacecraft to Comet Tempel 1
      and shot it — a copper bullet,
      a deliberate punch to the face of a snowball
      older than the Earth itself.
      Deep Impact. The flash was beautiful.
      I watched the dust plume rise on the screens,
      watched the scientists read the insides
      of a four-billion-year-old time capsule:
      water, clay, the ingredients of us.
      We punched a comet to see what bled.
      What bled was the recipe for oceans.
    description: "Deep Impact slammed a copper projectile into Comet Tempel 1 to read its insides — the debris held water and clay, the ingredients of oceans."
    status: "published"
    sha256: "8ad5ffe0ed45c0ef61f80ba0a99fd6b0e442236f844ebeecad843dcafc41bfa7"
  - number: "3984"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "London's Darkest Morning"
    date: "2005 CE"
    region: "Europe"
    poem: |
      Rush hour on the Tube. Then the bus.
      Four young men, four bombs,
      fifty-two dead in the tunnels
      under the greatest city in Europe.
      I walked London that evening —
      the pubs were full, defiant,
      the buses running, the city refusing
      to learn the lesson terror was teaching.
      Two weeks later they tried again.
      The bombs failed. The city didn't.
      London's darkest morning proved
      what London has always known:
      you don't beat this city by scaring it.
    description: "Four suicide bombers killed 52 on London's Tube and a bus — and the city answered with full pubs, running buses, and refusal to be scared."
    status: "published"
    sha256: "c2a5aaab93c1e89f11ec2f7f16513393708829b903dc051cf3393ce1dcd54b66"
  - number: "3985"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "One Hundred Forty Characters"
    date: "2006 CE"
    region: "Global"
    poem: |
      It began as a side project —
      status updates, 140 characters,
      what are you doing, in a sentence.
      I watched it become the world's wire service:
      earthquakes reported before the seismographs,
      revolutions organized in real time,
      presidents governing by tweet.
      News stopped arriving by the hour
      and started arriving by the sentence.
      The whole planet learned to think
      in headlines. We gained the world's pulse
      and lost its attention span
      in the same small box.
    description: "Twitter launched with 140-character updates and became the world's wire service — news by the sentence, revolutions in real time."
    status: "published"
    sha256: "a820893a9202a213e2e72510a3ed56a35ccedfa5282637ad2768109e086caf68"
  - number: "3986"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Pluto Steps Down"
    date: "2006 CE"
    region: "Space"
    poem: |
      In Prague, the astronomers voted —
      a show of hands, and just like that,
      Pluto was out of the planet club.
      Too small, they said. Hasn't cleared its orbit.
      I watched the schoolchildren protest,
      the textbooks go stale overnight,
      the internet rise in defense
      of a little iceball none of them had seen.
      Pluto didn't change. We did.
      Nine planets became eight by committee.
      The universe, I noted, did not attend the vote.
    description: "Astronomers voted Pluto out of the planet club in Prague — the universe didn't attend, but the schoolchildren protested anyway."
    status: "published"
    sha256: "32e303687befd5ef79474e296d1a93c9413993f937b516f1772e7c144e5fee69"
  - number: "3987"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A Dictator Hanged"
    date: "2006 CE"
    region: "Middle East"
    poem: |
      They hanged Saddam Hussein in Baghdad
      before dawn on a holy day,
      and filmed it on a phone —
      grainy, shaky, the rope, the drop,
      the taunts of the guards.
      I have seen tyrants fall many ways;
      this one fell on a leaked video,
      passed phone to phone around the world.
      Justice, said some. Revenge, said others.
      The sectarian fire it lit
      burned for a decade after.
      A hanging meant to end a chapter
      only underlined it in blood.
    description: "Saddam Hussein was executed in Baghdad and the hanging leaked on phone video — justice to some, revenge to others, and a fire that burned for a decade."
    status: "published"
    sha256: "20941130345c76245f1105b3ffce402fa9af3af9d31038482f6d58b8f6461d64"
  - number: "3988"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Living Room Comes Alive"
    date: "2006 CE"
    region: "Global"
    poem: |
      Nintendo stopped chasing graphics
      and handed grandparents a controller —
      swing it like a tennis racket,
      bowl it like a bowling ball,
      and the little white box understood.
      I watched living rooms come alive:
      families sweating at virtual tennis,
      nursing homes running bowling leagues,
      kids teaching grandma to serve.
      The Wii didn't win on power.
      It won on joy — the radical idea
      that games were for everybody,
      even the people who'd never played.
    description: "The Wii got grandparents swinging controllers at televisions — games stopped chasing graphics and started chasing joy, for everybody."
    status: "published"
    sha256: "f33f750dd88fe1565930d605de009f1a3a30e56f0db562d131134a1182545119"
  - number: "3989"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Google Buys the Video Age"
    date: "2006 CE"
    region: "Global"
    poem: |
      A year and a half old, losing money,
      bought for 1.65 billion dollars in stock —
      and the business world laughed.
      I didn't laugh. I had seen the uploads,
      the millions of hours, the kids
      who would rather watch a bedroom
      than a network.
      The bargain of the century, they call it now.
      Google bought the future of television
      for the price of a rounding error.
      Sometimes the smartest deal in history
      looks like overpaying for a garage.
    description: "Google bought the money-losing, 18-month-old YouTube for $1.65 billion — the bargain of the century, the future of television for a rounding error."
    status: "published"
    sha256: "71971d9a34c3b4e334ca313a9370c235f34a04cb02bc520be1149a066dc525b6"
  - number: "3990"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Microcredit's Nobel"
    date: "2006 CE"
    region: "Asia"
    poem: |
      He lent twenty-seven dollars to forty-two women —
      basket weavers in Bangladesh,
      too poor for any bank to notice —
      and they paid it back.
      Then he built a bank on the radical idea
      that the poor are creditworthy.
      I met the borrowers: rickshaw drivers,
      seamstresses, fish sellers,
      whole villages lifted on loans
      smaller than a dinner in New York.
      The Nobel came in 2006.
      Muhammad Yunus proved what the poor
      had always known: given a chance,
      they pay it back — with interest.
    description: "Muhammad Yunus won the Nobel for banking for the poor — tiny loans to Bangladeshi basket weavers that were paid back, with interest."
    status: "published"
    sha256: "77addb3a56159e2df4e8ed20a1aa07dfe5be139b852ba1da9b82579f5cb71e72"
  - number: "3991"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Longest Postcard"
    date: "2006 CE"
    region: "Space"
    poem: |
      New Horizons left Earth on the fastest launch
      ever attempted — aimed at Pluto,
      nine years away, a speck nobody had seen clearly.
      I watched it go, a little piano-sized probe
      carrying the ashes of Pluto's discoverer,
      Clyde Tombaugh, riding along to the world he found.
      Nine years. Four billion miles.
      The longest postcard ever sent,
      addressed to a planet that would be demoted
      before the mail arrived.
      It didn't care. It kept flying.
    description: "New Horizons launched for Pluto on a nine-year journey — carrying Clyde Tombaugh's ashes to the world he discovered, demoted before the mail arrived."
    status: "published"
    sha256: "5cb95c3b5b52729f774f69602a4645104fa0f97251215b8334e9436b7557ded2"
  - number: "3992"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Phone That Ate the World"
    date: "2007 CE"
    region: "Global"
    poem: |
      No keyboard. Just glass.
      A phone, an iPod, an internet communicator —
      he said it three times, and the crowd laughed,
      then went silent when they understood.
      I held one that June: it swallowed the camera,
      the map, the music player, the flashlight,
      the alarm clock, the whole junk drawer
      of twentieth-century gadgets, whole.
      Nokia laughed. BlackBerry laughed.
      Within five years the laughers were gone.
      One device ate the world,
      and we have been staring into the glass ever since.
    description: "The iPhone launched with no keyboard, just glass — and swallowed the camera, the map, and the music player whole, then the whole industry."
    status: "published"
    sha256: "4c96a690ef950f3c443263d7d8614ccb48c05006b72a0dc265dc2a365b4e2294"
  - number: "3993"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Paper Light"
    date: "2007 CE"
    region: "Global"
    poem: |
      A library that weighed less than a paperback —
      the Kindle made ten thousand books weightless,
      ink that wasn't ink, pages that weren't pages.
      I watched readers resist, then surrender:
      the midnight purchase, the enormous font,
      the book that never ran out of pages.
      Bookstores trembled. Publishers panicked.
      Then the strangest thing happened —
      people started reading more.
      Paper light, they called the screen.
      It turns out the weight was never the point.
      The words were.
    description: "The Kindle made a library weightless — readers resisted, then surrendered, and the strangest thing happened: people started reading more."
    status: "published"
    sha256: "fc16627a213a3ec76532867c38deabd34c713955365320343a700e60367a3a33"
  - number: "3994"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Cracks Show"
    date: "2007 CE"
    region: "Global"
    poem: |
      It started in the American suburbs —
      houses bought with loans
      that were never meant to be repaid,
      sliced, bundled, sold as gold.
      Subprime. A ugly little word
      for a beautiful lie.
      I watched the cracks show first
      in the small banks, the mortgage desks,
      the foreclosure signs blooming
      like weeds across the cul-de-sacs.
      The great boom was rotting from inside,
      and the rot had a smell: fresh paint
      on houses nobody could afford.
    description: "The subprime mortgage crisis began — houses bought with unpayable loans, foreclosure signs blooming like weeds, the great boom rotting from inside."
    status: "published"
    sha256: "77491ef1e7f3ead9b0665cc75c310280196290f9709bf3a7dfb161a34d1acdb3"
  - number: "3995"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The First Cyber Siege"
    date: "2007 CE"
    region: "Europe"
    poem: |
      Estonia — the most wired nation on Earth,
      voting online, banking online, everything online —
      went dark under a hammering
      of a million hijacked computers.
      Banks offline. Government offline.
      The news sites, the ATMs, all of it, gone.
      I watched a whole country learn
      what war looks like with no soldiers:
      just traffic, floods of it,
      drowning the servers.
      The first cyber siege in history.
      Nobody fired a shot.
      Everybody felt it.
    description: "Hackers hammered wired Estonia offline — banks, government, everything — the first cyber siege in history, with no soldiers and no shots fired."
    status: "published"
    sha256: "6839075e7919802317788b77ba1c40baad03d656b3d24ac7522ab9418d0b9951"
  - number: "3996"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Saffron Monks March"
    date: "2007 CE"
    region: "Asia"
    poem: |
      They came in rows of saffron,
      barefoot monks with begging bowls turned upside down —
      refusing alms from the soldiers,
      the deepest shame in their faith.
      I watched them march through Rangoon,
      thousands of robes the color of sunrise,
      chanting, peaceful, unstoppable —
      until the guns came.
      The junta beat them, jailed them,
      shot into the crowds.
      The world watched on shaky phone video
      and did nothing much.
      But the image stayed: saffron against rifles,
      prayer against power.
    description: "Burmese monks marched in saffron robes against the junta — prayer against rifles — until the guns came and the world watched on shaky phone video."
    status: "published"
    sha256: "213c886a57e999f8632de824354e73503276cf83293365711d9123575e28ebcd"
  - number: "3997"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Humanity Moves to Town"
    date: "2007 CE"
    region: "Global"
    poem: |
      Somewhere in 2007, quietly,
      the balance tipped:
      more humans in cities than in the countryside,
      for the first time since we planted wheat.
      No ceremony. No headline that mattered.
      Just the slow drift — the village emptied,
      the megacity swelled, Lagos, Dhaka, São Paulo
      stacking souls toward the sky.
      I have walked both worlds:
      the field at dawn, the subway at rush hour.
      We became an urban species
      without ever voting on it.
    description: "In 2007 humanity became majority-urban for the first time since farming began — no ceremony, just the slow drift from village to megacity."
    status: "published"
    sha256: "5b6672f12b53e57061b6fbed7bf20a006b62b93db832e18588666e4cec5a495a"
  - number: "3998"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Benazir Falls"
    date: "2007 CE"
    region: "Asia"
    poem: |
      She came home to Pakistan after eight years away,
      the first woman to lead a Muslim nation,
      and the crowds were oceans.
      I was in Rawalpindi that December —
      the rally, the wave from the sunroof,
      then the blast, the shots,
      and the bravest woman in South Asian politics
      was gone in the dust.
      They buried her beside her father.
      Pakistan wept, then burned for days.
      Some assassinations kill a person.
      This one killed a possibility.
    description: "Benazir Bhutto was assassinated at a campaign rally in Rawalpindi — the bravest woman in South Asian politics, gone in the dust of a December blast."
    status: "published"
    sha256: "79ca0fe735aab58da201f07b880285702eccc9005e30568147a96666f0e8c835"
  - number: "3999"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Day the Banks Froze"
    date: "2008 CE"
    region: "Global"
    poem: |
      Lehman Brothers. A hundred fifty-eight years old,
      gone in a weekend — and the ice spread:
      credit froze, markets fell,
      the whole world economy seized up
      like an engine run without oil.
      I watched the traders' faces that September,
      watched governments write checks
      with numbers too big to say out loud,
      watched ordinary people lose houses, jobs, pensions
      for sins committed in glass towers.
      The day the banks froze,
      capitalism had to be rescued
      by the thing it claimed not to need.
    description: "Lehman Brothers collapsed and the world economy seized up — governments wrote unsayable checks while ordinary people lost houses for tower sins."
    status: "published"
    sha256: "c857c60b68c4247ca1c81a363161044e5321021e4d4cc358b7f1175373e345eb"
  - number: "4000"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "One World, One Dream"
    date: "2008 CE"
    region: "Asia"
    poem: |
      The Bird's Nest. Two thousand drummers
      moving as one body. The scroll unrolling
      across the stadium floor, five thousand years
      of China painted in light.
      I have seen a hundred opening ceremonies;
      nothing touched Beijing.
      One world, one dream, they said —
      and for one night the dream was real,
      the precision, the beauty, the sheer scale
      of a civilization showing off.
      Then the Games began, and Phelps won eight golds,
      and Bolt ran like a rumor.
      But it was the drummers I remembered.
    description: "Beijing's Olympics opened with the greatest ceremony ever staged — two thousand drummers as one body, five thousand years painted in light."
    status: "published"
    sha256: "5ab2ef8f5711512baf9b32a2828991bd9c99f7fdc537fc2e9f115b404f19d18b"
  - number: "4001"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Yes We Can"
    date: "2008 CE"
    region: "North America"
    poem: |
      A Black man with a strange name,
      a community organizer from Chicago,
      stood in Grant Park before a quarter million people
      and the tears ran down faces
      that had waited four hundred years.
      Yes we can. Three syllables
      that carried the weight of Selma,
      of King, of every door that had been closed.
      I watched an old woman in Atlanta
      touch the television screen
      like it was a holy thing.
      History doesn't always knock.
      Sometimes it just walks in
      and takes the oath.
    description: "Barack Obama's election drew a quarter million to Grant Park — \"Yes we can,\" three syllables carrying four hundred years of waiting."
    status: "published"
    sha256: "adfa620f39f73de31800e6229c90628b74c77000ac3cb1fa8c7ef241613e3b16"
  - number: "4002"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Machine That Sees the Beginning"
    date: "2008 CE"
    region: "Europe"
    poem: |
      Seventeen miles of tunnel
      under the Swiss-French border,
      colder than deep space,
      smashing protons together
      at nearly the speed of light —
      to see the beginning.
      The Large Hadron Collider.
      I stood in the cavern when they fired it up,
      this cathedral of magnets built
      to rewind the universe
      to a trillionth of a second
      after everything began.
      Some feared a black hole.
      What we got was stranger:
      a window into the first light.
    description: "The Large Hadron Collider fired up beneath the Swiss-French border — seventeen miles of tunnel built to rewind the universe to its first trillionth of a second."
    status: "published"
    sha256: "e92faa4fff61ecfae7a59bfab30be9cca16015f1e9d286cdb8198e03da20a477"
  - number: "4003"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Nine Pages That Made Money"
    date: "2008 CE"
    region: "Global"
    poem: |
      Nine pages. A pseudonym.
      Posted to a cryptography mailing list
      on Halloween, 2008:
      "Bitcoin: A Peer-to-Peer Electronic Cash System."
      I read it that week — elegant, strange,
      money without a bank, without a king,
      without anyone in charge at all.
      Satoshi Nakamoto. Nobody knows who.
      The paper sat there, quiet, for months.
      Then someone traded ten thousand coins for a pizza,
      and the strangest money in history
      began its long, wild life.
    description: "A mysterious Satoshi Nakamoto published the nine-page Bitcoin paper — money without a bank, without a king, without anyone in charge."
    status: "published"
    sha256: "ad982830505cf903eacf96d1888bffa23722f5ea8f8a4c0aa07672b70b6ebc4e"
  - number: "4004"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Mumbai Under Siege"
    date: "2008 CE"
    region: "Asia"
    poem: |
      Ten gunmen came by sea
      and held a city of twenty million
      for sixty hours —
      the Taj Hotel burning on live TV,
      the train station, the café,
      fire and fear block by block.
      I watched Mumbai refuse to break:
      the dabbawalas delivering lunch
      through the cordons, the city
      that never stops, not stopping.
      When it ended, 164 were dead,
      and the sea route was the scandal —
      how did they just sail in?
      Mumbai mourned. Then Mumbai worked.
      That's what Mumbai does.
    description: "Terrorists held Mumbai for sixty hours of fire — the Taj burning on live TV — and the city that never stops refused to stop."
    status: "published"
    sha256: "b16313e28c9846e34619cc198c8134c0fb4f9bddadfd09b29c26fea2237dca3c"
  - number: "4005"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A Million Pockets, A Million Apps"
    date: "2008 CE"
    region: "Global"
    poem: |
      Five hundred apps on day one.
      A store in your pocket
      for things nobody had imagined needing:
      a flashlight app, a fart app,
      then the real ones — the maps,
      the banks, the games, the everything.
      I watched developers quit jobs
      to build tiny icons,
      watched the smartphone stop being a phone
      and become a universe.
      A million pockets, a million apps —
      the iPhone had been the stage;
      the App Store was the play.
    description: "The App Store opened with 500 apps and turned the smartphone from a phone into a universe — a store in every pocket for everything imaginable."
    status: "published"
    sha256: "c1e6900c499248cbaa2ab716dd3cfa65e18eaccc04e0c17f2e7eba8769ed6faa"
  - number: "4006"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Money Out of Thin Air"
    date: "2009 CE"
    region: "Global"
    poem: |
      Block zero. The genesis block,
      mined in January, carrying a headline
      about bank bailouts in its code —
      a little joke, a little manifesto.
      The Bitcoin network went live
      with no ceremony, no company, no owner.
      I watched the first coins move
      between strangers who trusted math
      more than banks.
      Money out of thin air, the critics said.
      They were right, and they missed the point:
      all money is thin air.
      This was just honest about it.
    description: "The Bitcoin network went live with its genesis block — carrying a bank-bailout headline in its code, money honest about being made of trust."
    status: "published"
    sha256: "30041874217c7375f316269a1ed3acd4a1900a5b227bc546906eda64fa07be2b"
  - number: "4007"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Swine Flu Year"
    date: "2009 CE"
    region: "Global"
    poem: |
      It started in Mexico, rode the airplanes,
      and within weeks the WHO was saying
      the word nobody wanted: pandemic.
      H1N1 — the swine flu year,
      the first pandemic of the internet age,
      tracked on maps, argued on forums,
      feared in schoolyards.
      I watched it sweep the globe
      and then, mercifully, spare most of us —
      milder than feared, a rehearsal
      with real bodies.
      We made vaccines in months.
      We congratulated ourselves.
      We should have taken notes.
    description: "H1N1 swept the globe as the first pandemic of the internet age — milder than feared, a rehearsal with real bodies that we should have studied harder."
    status: "published"
    sha256: "97caa6abda59ed165bd59683a5ad57b5cf527aa9f349beec23d3564f6d05afd1"
  - number: "4008"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A New President's Promise"
    date: "2009 CE"
    region: "North America"
    poem: |
      Nearly two million people
      stood in the January cold on the Mall —
      the largest crowd Washington had ever held —
      to watch a hand on a Bible
      and hear a promise:
      hope, change, a new beginning.
      I was in that sea of faces,
      every color, every age,
      breath fogging in the cold air.
      The speech was sober, not soaring —
      the work ahead, the winter of our hardship.
      But the crowd didn't come for the speech.
      They came to say: we were here
      when the door opened.
    description: "Nearly two million packed the National Mall for Obama's inauguration — the largest crowd Washington ever held, there to witness a door opening."
    status: "published"
    sha256: "038a7d9ca369b87bfbcb9b55b9ecc7b81143e5c9dbbba034a2f7b7b6815c4167"
  - number: "4009"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Kepler's Planet Hunt"
    date: "2009 CE"
    region: "Space"
    poem: |
      They launched a telescope to count the worlds —
      not to photograph them, just to count,
      watching 150,000 stars for the tiny dimming
      of a planet crossing.
      Kepler stared at one patch of sky
      for four years, unblinking.
      I watched the numbers climb:
      hundreds, then thousands of worlds —
      hot Jupiters, super-Earths,
      planets where it rains glass sideways.
      Before Kepler, we wondered if planets were rare.
      After Kepler, we knew:
      the galaxy is crowded with worlds.
    description: "NASA's Kepler telescope stared at 150,000 stars to count their planets — and found thousands, proving the galaxy is crowded with worlds."
    status: "published"
    sha256: "e8f39319cc87080c67a5f4345ae842d7e126d68ccda2c14786a945731ad94d7a"
  - number: "4010"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Copenhagen's Heartbreak"
    date: "2009 CE"
    region: "Europe"
    poem: |
      A hundred world leaders in one freezing city,
      two weeks of talks, the whole planet watching —
      and it collapsed.
      No binding deal. A weak accord,
      noted but not adopted,
      the small island nations weeping
      in the hallways.
      I walked out of the Bella Center
      into the Danish winter
      with the hollow feeling
      you get when the firefighters
      leave while the house is burning.
      Copenhagen's heartbreak taught us:
      the planet won't be saved by summits.
      It will be saved despite them.
    description: "The Copenhagen climate summit collapsed without a binding deal — a hundred leaders, two weeks, and the hollow feeling of firefighters leaving a burning house."
    status: "published"
    sha256: "d7447f9526124744f1271e7e37e9469480cc69367d41862ff652b03c13d53658"
  - number: "4011"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Green Wave"
    date: "2009 CE"
    region: "Middle East"
    poem: |
      The election was a fraud — everyone saw it —
      so they poured into the streets of Tehran,
      millions of them, a green wave,
      silent, peaceful, asking only:
      where is my vote?
      I watched it on shaky video,
      the sea of people stretching to the horizon,
      the regime's answer arriving
      on motorcycles with batons.
      They crushed it. Jailed it. Killed it.
      But the green wave had shown the world
      what Iran really wanted —
      and the regime never forgot
      how close it came.
    description: "Millions protested Iran's disputed election in a peaceful green wave — and the regime crushed it with batons, jails, and motorcycles."
    status: "published"
    sha256: "4e671241bd8afd639d2cc1e227304f2c39e6307f1119cd775166f7bca318c7cc"
  - number: "4012"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Nine-Point-Five-Eight"
    date: "2009 CE"
    region: "Global"
    poem: |
      Berlin. A hundred meters.
      Nine point five eight seconds —
      faster than any human being
      had ever covered the ground.
      I was in the stadium when Bolt ran,
      and the strangest thing wasn't the speed,
      it was the smile — mid-race, pulling away,
      grinning like a man out for a jog
      while the fastest humans in history
      chased his shadow.
      9.58. The number sits there still,
      untouched, fifteen years later.
      The fastest man who ever lived
      made it look like play.
    description: "Usain Bolt ran 100 meters in 9.58 seconds in Berlin — smiling mid-race while history chased his shadow, a record still untouched."
    status: "published"
    sha256: "3236211c9aaa5b3a02b1b4456d4686e18e769593ef71295d969fa16ff4d5cc4c"
  - number: "4013"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Tablet Arrives"
    date: "2010 CE"
    region: "Global"
    poem: |
      They laughed at first — a giant iPhone?
      Then they held it: a sheet of glass
      that was a book, a movie, a newspaper,
      a child's drawing pad, a pilot's charts.
      I watched the iPad eat the laptop's lunch
      in living rooms and cockpits,
      watched toddlers swipe before they could read,
      watched the computer dissolve
      into something you hold like a magazine.
      The tablet didn't replace the computer.
      It revealed what the computer
      had been trying to be all along.
    description: "The iPad turned the computer into a sheet of glass — toddlers swiped before they could read, and the machine dissolved into something held like a magazine."
    status: "published"
    sha256: "c27c128666b3f9a215e377b45542b4aaa4c0ba230b2c0a74a1e723d4068d43c6"
  - number: "4014"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Instagram's First Photo"
    date: "2010 CE"
    region: "Global"
    poem: |
      A photo of a dog. A taco stand.
      The first uploads were nothing —
      and then the filters came,
      and suddenly everyone's breakfast
      looked like art.
      I watched it quietly rewrite
      how beauty is sold, how fame is made,
      how a generation learned to see themselves
      through a square and a filter.
      A photo app, they said.
      It was never a photo app.
      It was a mirror that charged admission
      and taught the world to pose.
    description: "Instagram launched with a dog photo and quietly rewrote beauty, fame, and self-image — a mirror that taught the world to pose."
    status: "published"
    sha256: "c3158e2982bf0b7b277ba0e0aefc82fe9a27dffe6231c74a4af112abf5bfb143"
  - number: "4015"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A Fruit Vendor's Fire"
    date: "2010 CE"
    region: "Africa"
    poem: |
      Mohamed Bouazizi sold fruit from a cart
      in Sidi Bouzid, Tunisia.
      The police took his scales, slapped him,
      humiliated him — and he walked
      to the governor's office, poured fuel
      over himself, and struck the match.
      I have seen empires fall for less reason
      and for more; this one fell
      because one tired man
      refused one more humiliation.
      His fire set a region ablaze —
      Tunisia, Egypt, Libya, Syria.
      One vendor's match lit the Arab Spring.
    description: "A Tunisian fruit vendor's self-immolation set the region ablaze — one man's refusal of humiliation lit the Arab Spring."
    status: "published"
    sha256: "ea800e982179b9ec93091c7ff838bed75a0cc7215bcc15da0d3e0f14ac3db383"
  - number: "4016"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Haiti Shakes"
    date: "2010 CE"
    region: "Latin America"
    poem: |
      Thirty-five seconds. That's all it took —
      a 7.0 quake at rush hour,
      and Port-au-Prince folded like paper.
      The palace collapsed. The cathedral collapsed.
      The hospitals collapsed.
      I walked those streets in the weeks after:
      the dust, the tent cities, the endless aftershocks,
      the world pouring in aid
      that mostly never arrived.
      Hundreds of thousands dead.
      A nation already poor made poorer.
      Haiti shook, and the world promised everything,
      and delivered — Haiti is still waiting
      to tell you how much.
    description: "A 35-second earthquake leveled Port-au-Prince — palace, cathedral, hospitals — and the world promised everything Haiti is still waiting for."
    status: "published"
    sha256: "7b715ac2dfe33db45ccba86b376ffef5966d649bee60dd139b44a55eff69e7f0"
  - number: "4017"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Oil in the Gulf"
    date: "2010 CE"
    region: "North America"
    poem: |
      The rig exploded — eleven men died in the fire —
      and then the well wouldn't close.
      Eighty-seven days. I watched the live feed,
      the black plume blooming underwater,
      the crude pouring into the Gulf
      while the whole world watched
      and nobody could stop it.
      Top kill failed. Junk shot failed.
      Finally, a cap held.
      The marshes were already black,
      the pelicans already dying.
      Deepwater Horizon taught us
      what the industry already knew:
      the ocean is deep, the oil is deep,
      and our reach exceeds our grip.
    description: "Deepwater Horizon exploded and bled crude into the Gulf for 87 days on live feed — the marshes black, the pelicans dying, our reach exceeding our grip."
    status: "published"
    sha256: "397071cb01b6682b2ef3f47522a3aed0c7c63f32405439736cc30128547dcbcf"
  - number: "4018"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The World's Cup in Africa"
    date: "2010 CE"
    region: "Africa"
    poem: |
      The vuvuzelas. Dear God, the vuvuzelas —
      a hundred thousand plastic horns
      droning like a hive of angry bees
      through every match.
      But under the noise: Africa's first World Cup,
      Johannesburg singing, Cape Town shining,
      a continent hosting the world
      and hosting it well.
      I was in Soweto when the final whistle blew
      on Spain's victory — and nobody cared
      who won. Africa had won.
      The world came, the world saw,
      the world danced in the fan parks.
      The horns never stopped.
      Neither did the pride.
    description: "South Africa hosted the first World Cup on African soil — vuvuzelas droning, fan parks dancing, a continent's pride on full display."
    status: "published"
    sha256: "6eca007b1374736efef76ba0246d99748304ce29ddd31fb1e91fbac55faf3f65"
  - number: "4019"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Cables Spill"
    date: "2010 CE"
    region: "Global"
    poem: |
      A quarter-million secret cables —
      every embassy's gossip, every diplomat's
      unfiltered opinion of every leader —
      dumped onto the internet for all to read.
      I watched foreign ministries scramble,
      watched dictators learn what America
      really thought of them,
      watched a young soldier's conscience
      become the world's biggest leak.
      WikiLeaks didn't invent the truth.
      It just removed the lock from the filing cabinet
      and let the whole planet read the memos.
      Diplomacy never whispered the same way again.
    description: "WikiLeaks dumped a quarter-million secret diplomatic cables — every embassy's unfiltered gossip, read by the whole planet at once."
    status: "published"
    sha256: "2d807958495b12879ce22f6547cdd7110fd6fcffb0d59a539488469b89c826e4"
  - number: "4020"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Square Fills"
    date: "2011 CE"
    region: "Africa"
    poem: |
      Tahrir Square. Eighteen days.
      They came with bread and phones and flags,
      Copts and Muslims, old and young,
      and they did not leave —
      not for the tear gas, not for the camels
      charging through the crowds,
      not for anything.
      I stood in that square when Mubarak fell,
      thirty years of rule ended by people
      who simply refused to go home.
      The Arab Spring blazed outward —
      Tunisia, Egypt, then Libya, Syria, Yemen.
      Some squares won. Some squares burned.
      But Tahrir showed the recipe:
      fill the square, and hold it.
    description: "Tahrir Square's eighteen days toppled Mubarak — millions refusing to go home, and the Arab Spring blazed outward from that recipe."
    status: "published"
    sha256: "b32493f5a57ed1f0d209d699e20ed656cd350b256bd7e1546fd9df3ef353f8a3"
  - number: "4021"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Wave That Split Atoms"
    date: "2011 CE"
    region: "Asia"
    poem: |
      The earthquake was the biggest Japan had ever felt.
      The tsunami was forty meters high.
      Then the water found Fukushima —
      and the reactors melted,
      one, two, three,
      hydrogen explosions on live TV,
      a exclusion zone drawn on the map
      that may outlive us all.
      I walked the empty streets of Namie years later:
      the vending machines still glowing,
      the school clocks stopped at 3:37.
      The wave killed twenty thousand.
      The atoms scattered a fear
      that closed reactors across the world.
    description: "Japan's earthquake and tsunami melted down Fukushima's reactors — the wave killed 20,000, the atoms scattered a fear that closed reactors worldwide."
    status: "published"
    sha256: "e58dfbcddfdc7698c579e2216fd09e5bf468d1307052b178bf95875e0f2e758b"
  - number: "4022"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Most Wanted Man Falls"
    date: "2011 CE"
    region: "Asia"
    poem: |
      A decade of hunting ended in Abbottabad —
      helicopters in the night, a compound
      a mile from Pakistan's military academy,
      and the most wanted man on Earth
      gone in forty minutes.
      I watched Obama tell the world at midnight,
      watched crowds gather at Ground Zero
      chanting, crying, ten years of grief
      finding one sharp release.
      Justice, they called it.
      Others called it an execution
      in a sovereign country.
      Both things were true.
      That's usually how it goes with history.
    description: "US Navy SEALs killed Osama bin Laden in Abbottabad — a decade of hunting ended in forty minutes, and ten years of grief found release."
    status: "published"
    sha256: "6a39f3fdaa84a05ceb6c3f0045943f60a4141e2fb9450d06fd0e49fbc239c316"
  - number: "4023"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Goodbye to the Showman"
    date: "2011 CE"
    region: "Global"
    poem: |
      He died the day after the new iPhone came out —
      timing, even at the end, like a product launch.
      I watched the shrines bloom
      outside Apple stores worldwide:
      flowers, candles, half-eaten apples,
      notes from people who never met him
      mourning like he'd been family.
      A salesman mourned like a saint —
      because he sold us more than gadgets;
      he sold us the idea that tools
      could be beautiful.
      Love him or hate him, the showman
      changed what we expect from everything we touch.
    description: "Steve Jobs died and the world mourned a salesman like a saint — shrines of flowers and half-eaten apples outside stores worldwide."
    status: "published"
    sha256: "188f8d0f72216987368e32aefc451a4a51967f2158d91cca1942ace10d893311"
  - number: "4024"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Curiosity Leaves Earth"
    date: "2011 CE"
    region: "Space"
    poem: |
      A car-sized rover, a nuclear heart,
      a laser to zap rocks —
      the most ambitious machine
      ever aimed at another world.
      I watched Curiosity leave Earth
      that November, riding fire toward Mars,
      carrying more instruments
      than some whole space programs.
      It would land by sky crane,
      a maneuver so insane
      the engineers called it
      seven minutes of terror.
      But that November, all we had
      was a launch, a trajectory,
      and the audacity of the plan.
    description: "A car-sized nuclear rover launched for Mars — the most ambitious machine ever aimed at another world, riding fire toward its seven minutes of terror."
    status: "published"
    sha256: "34b34a0d528d21c3b34ea2ee5fb2486f04ee70b72a7da14935dfeb4404bcc3b0"
  - number: "4025"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The World's Youngest Nation"
    date: "2011 CE"
    region: "Africa"
    poem: |
      They voted — ninety-nine percent for freedom —
      and South Sudan was born,
      the world's youngest nation,
      flags sewn overnight, anthems learned by heart.
      I was in Juba for the independence day:
      dancing in the dust, the new flag rising,
      fifty years of war finally over.
      The joy was real. It was also brief —
      within two years the new nation
      would turn its guns on itself.
      But on that day, in that dust,
      freedom tasted exactly like they dreamed.
      Some birthdays are worth having
      even when the childhood is hard.
    description: "South Sudan voted itself into existence — dancing in Juba's dust on independence day, the world's youngest nation born in joy."
    status: "published"
    sha256: "99b432b22fee4634389c9bf87fd0344eea1421c93f74740eeb2f8473b9658c01"
  - number: "4026"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Tents of Wall Street"
    date: "2011 CE"
    region: "Global"
    poem: |
      They pitched tents in Zuccotti Park —
      no leaders, no demands list,
      just sleeping bags and signs:
      we are the 99%.
      I walked among them that autumn:
      the drum circles, the people's mic,
      the library in a tent,
      the quiet fury of a generation
      that had done everything right
      and gotten nothing.
      The tents were cleared.
      The phrase stayed.
      Occupy didn't change the banks.
      It changed the conversation —
      and conversations, eventually,
      change everything.
    description: "Occupy protesters camped in Zuccotti Park with no leaders and one phrase — \"we are the 99%\" — and changed the conversation even after the tents were cleared."
    status: "published"
    sha256: "5790c21fb06d566cf5554ed762d07894b3fb348a3d0f756e14a260f3d04a2fad"
  - number: "4027"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The God Particle Found"
    date: "2012 CE"
    region: "Europe"
    poem: |
      Fifty years they hunted it —
      the particle that gives everything mass,
      the reason anything weighs anything.
      Then the bump in the data,
      five sigma, champagne in the CERN auditorium,
      Peter Higgs wiping his eyes
      at eighty-three.
      I was there for the announcement:
      the room erupted like a stadium.
      The God particle, the papers called it.
      The physicists hated the name.
      But the universe didn't care what we called it —
      it had been holding mass together
      for thirteen billion years, waiting to be noticed.
    description: "The Higgs boson turned up at the Large Hadron Collider — fifty years of hunting ended with a bump in the data and tears in the auditorium."
    status: "published"
    sha256: "e76a537f3c3a12814947804fac4926848847a134e7023e165a427285ac056b1b"
  - number: "4028"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Seven Minutes of Terror"
    date: "2012 CE"
    region: "Space"
    poem: |
      Entry. Descent. Landing.
      Seven minutes when Mars
      decides whether you live —
      a heat shield, a parachute,
      then rockets, then a sky crane
      lowering a car-sized rover
      on cables, like a spider
      dropping its young.
      I held my breath with the whole control room,
      watching telemetry fourteen minutes old,
      already history by the time we saw it.
      Touchdown confirmed.
      The room exploded.
      Curiosity was on Mars,
      lowered from the sky by a flying crane.
    description: "Curiosity survived its seven minutes of terror — heat shield, parachute, then a sky crane lowering the rover to Mars on cables."
    status: "published"
    sha256: "b9e3688cdf2582ca07b84e9735a0f2c264a68e6e465d104b8fdead062fb9ae39"
  - number: "4029"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "London's Summer"
    date: "2012 CE"
    region: "Europe"
    poem: |
      The Queen apparently parachuted in
      with James Bond — and the stadium roared.
      Danny Boyle's opening ceremony
      was a love letter to Britain:
      the NHS, the punks, the Queen,
      Mr. Bean on the keyboards.
      I watched London do what London does —
      take the world's biggest stage
      and make it witty.
      Then Bolt defended his crowns,
      Farah won the double-double,
      and for seventeen days
      the rain held off and the city glowed.
      London's summer. The games
      with a sense of humor.
    description: "London's Olympics opened with the Queen apparently parachuting in with Bond — wit, rain held off, and Bolt defending his crowns."
    status: "published"
    sha256: "c7925d4b75019b889a7ce0f6846a816752388cca3ebf6ad47465491351a50d03"
  - number: "4030"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Sandy Floods New York"
    date: "2012 CE"
    region: "North America"
    poem: |
      A superstorm the size of Europe
      curved into the Jersey Shore
      and drowned the subways —
      salt water in the tunnels,
      the lights out in lower Manhattan,
      Breezy Point burning while it flooded.
      I walked the dark streets that week:
      neighbors sharing generators,
      strangers carrying water up ten flights,
      the city improvising kindness.
      Sandy wasn't the big one.
      Everyone knew it wasn't the big one.
      It was the warning —
      and New York, to its credit,
      started listening.
    description: "Superstorm Sandy drowned New York's subways and shore towns — the city improvised kindness in the dark, and started listening to the warning."
    status: "published"
    sha256: "e0f5818204269698d6624ccc168fa00c60f7b2a1185d3213d03b95da11a13aeb"
  - number: "4031"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Gangnam Goes Global"
    date: "2012 CE"
    region: "Global"
    poem: |
      A chubby Korean rapper in sunglasses
      did a horse dance —
      and the whole planet did it with him.
      The first video to a billion views,
      breaking YouTube's counter,
      played at weddings, in parliaments,
      by grandmothers and generals.
      I watched it happen in real time:
      a joke, a beat, a dance so dumb
      it circled back to genius,
      crossing every border
      without a single translated word.
      Gangnam Style proved what the internet
      had been whispering: the world
      has one dance floor now.
    description: "Psy's horse dance became the first billion-view video — a joke with a beat that gave the world one shared dance floor."
    status: "published"
    sha256: "c65bc01fc6005df879dbed07c4dc2bc18c508db5d302cabc464780e7be6de3f5"
  - number: "4032"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Schoolgirl Who Would Not Stop"
    date: "2012 CE"
    region: "Asia"
    poem: |
      She was fifteen, riding the school bus
      in the Swat Valley, when they stopped it,
      asked for her by name,
      and shot her in the head —
      for going to school.
      Malala lived. That was the miracle.
      Then she spoke — at the UN, to the world —
      and shamed every power that had looked away.
      I watched a child become
      the conscience of nations.
      The Taliban tried to silence a schoolgirl.
      Instead they gave the world
      its loudest voice for learning.
    description: "Malala was shot for going to school and survived to shame the world — the Taliban tried to silence a schoolgirl and created its loudest voice."
    status: "published"
    sha256: "859dded3ff0b3bd5445baae95aa7460f854d15c4b94d9520de9b903604a31b49"
  - number: "4033"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A Man Falls from the Edge of Space"
    date: "2012 CE"
    region: "Space"
    poem: |
      Thirty-nine kilometers up —
      a balloon the size of a football stadium,
      a capsule the size of a phone booth,
      and one man in a spacesuit.
      Felix Baumgartner stepped off the edge
      and fell faster than sound,
      spinning, tumbling, then steady,
      then the chute, then the desert.
      I watched the live feed with millions,
      holding my breath for four minutes
      and nineteen seconds.
      He broke the sound barrier
      with his body.
      Sometimes the oldest dream —
      to fall from the sky and live —
      just needs a better balloon.
    description: "Felix Baumgartner skydived from 39 kilometers up — stepping off the edge of space, falling faster than sound, and living to tell it."
    status: "published"
    sha256: "aa9855fce81faaf86da8dcc0de1e9a2f0ebaada03a048ff4374b5a3416e771c3"
  - number: "4034"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A Pope Named for the Poor"
    date: "2013 CE"
    region: "Europe"
    poem: |
      White smoke. A new name: Francis —
      the first pope from the Americas,
      the first Jesuit, named for the saint
      who married Lady Poverty.
      I watched him on that balcony,
      asking the crowd to pray for him
      before he blessed them —
      a small reversal that said everything.
      Then the Ford Focus instead of the limousine,
      the washing of prisoners' feet,
      the "who am I to judge?"
      The Vatican's marble halls
      had never seen anything like him.
      Some called him a revolution.
      He called himself a priest.
    description: "Francis became the first Latin American pope — asking the crowd's prayers before his blessing, riding in a Ford Focus, washing prisoners' feet."
    status: "published"
    sha256: "907a79726ef6bc9c0b29ed9dbfc13ea4a985bc3d32fb9c59f0be30c175441c9d"
  - number: "4035"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Man Who Carried the Secrets"
    date: "2013 CE"
    region: "Global"
    poem: |
      A twenty-nine-year-old contractor
      walked out of Hawaii with a hard drive
      full of the NSA's secrets —
      and showed the world
      that everyone was being watched.
      Every call. Every email.
      I watched the revelations land
      day after day: the programs had names
      like dishes on a menu — PRISM, XKeyscore —
      and the menu was all of us.
      Snowden fled to Moscow.
      The debate never ended:
      traitor or hero, the question splits rooms still.
      But nobody checks their phone
      quite the same way anymore.
    description: "Edward Snowden revealed the NSA was watching everyone — every call, every email — and fled to Moscow as the debate split the world."
    status: "published"
    sha256: "3a2267b1d3209ec1bd97a305235b6af1de6a50dd8bd04281561a036a8992dd05"
  - number: "4036"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Madiba's Long Walk Ends"
    date: "2013 CE"
    region: "Africa"
    poem: |
      Ninety-five years. Twenty-seven in prison.
      One walk from a cell on Robben Island
      to the presidency of a free nation —
      and then, at the end,
      a quiet death at home in Houghton.
      I stood outside the hospital
      with the crowds singing,
      then in the long lines
      filing past the lying-in-state.
      The world bowed — presidents, prisoners,
      everyone who had ever needed proof
      that hatred can be outlived.
      Mandela's walk ended.
      The road he walked
      stays open.
    description: "Nelson Mandela died at 95 — twenty-seven years in prison, one walk to a free presidency, and a world that bowed to proof hatred can be outlived."
    status: "published"
    sha256: "c48034661d4b4cbec45571920ebe574f19004eaa8aed0fbb6a95e3c2ec7ec9ed"
  - number: "4037"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Jade Rabbit Hops"
    date: "2013 CE"
    region: "Asia"
    poem: |
      China landed on the Moon —
      softly, in the Bay of Rainbows —
      and out rolled Yutu, the Jade Rabbit,
      named for the pet of the moon goddess.
      I watched the first pictures:
      a little rover's tracks in the gray dust,
      a nation's flag planted by robot arm.
      The first soft landing in thirty-seven years.
      America had stopped going;
      China had started.
      The Jade Rabbit hopped a short hop —
      it broke down within weeks —
      but the message landed intact:
      the Moon has new visitors.
    description: "China's Chang'e-3 landed the Jade Rabbit rover on the Moon — the first soft landing in 37 years, and a message: the Moon has new visitors."
    status: "published"
    sha256: "cdf817ac3c621f7a329a1d972ebb0ae9d8f79b2fef3c41f1a2a889ad0a248a4f"
  - number: "4038"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Haiyan's Fury"
    date: "2013 CE"
    region: "Asia"
    poem: |
      The strongest landfalling typhoon
      ever recorded — winds at 315 kilometers an hour,
      a storm surge like a tsunami
      wearing a hurricane's clothes.
      It hit the Philippines at dawn,
      and Tacloban simply ceased to exist
      as anyone knew it.
      I walked that flattened city weeks later:
      ships thrown into streets,
      the smell, the silence,
      then the rebuilding, already starting,
      because Filipinos rebuild.
      Haiyan's fury was a preview —
      the storms are getting stronger,
      and the poorest always pay first.
    description: "Super Typhoon Haiyan devastated the Philippines at record strength — Tacloban flattened, a preview of stronger storms where the poorest pay first."
    status: "published"
    sha256: "239612e7907c3df69d889ac522140255ba03715ff0efb91631ad808c7be33000"
  - number: "4039"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Three Words on a Facebook Post"
    date: "2013 CE"
    region: "Global"
    poem: |
      Three words, written online
      after a verdict in Florida:
      Black lives matter.
      I watched them travel —
      from a Facebook post to a hashtag
      to a movement to a reckoning,
      carried through Ferguson, Baltimore,
      Minneapolis, around the world.
      Three words that asked the simplest question:
      do they? The answer came back
      in streets full of marchers,
      in statues falling, in a long overdue
      examination of the American conscience.
      It started with three words on a screen.
    description: "\"Black lives matter\" was written online for the first time — three words that traveled from a post to a worldwide reckoning."
    status: "published"
    sha256: "6a824238e94e0be0364c90420e93ac9d21ccec151a6610c9cde53ac170d99afa"
  - number: "4040"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Terror at the Finish Line"
    date: "2013 CE"
    region: "North America"
    poem: |
      The marathon is Boston's holy day —
      and at the finish line, the bombs.
      Two pressure cookers, ten seconds apart,
      three dead, hundreds maimed,
      a city locked down for a manhunt
      that ended in a boat in Watertown.
      I was there for the run a year later:
      a million people lining the route,
      the chant — Boston Strong —
      not a slogan but a vow.
      Terror at the finish line
      met something stronger at the start line:
      a city that runs toward, not away.
    description: "The Boston Marathon bombing killed three at the finish line — and a year later a million lined the route: Boston Strong, a city that runs toward."
    status: "published"
    sha256: "536e82db810eb0f0c90005dd620c72b20a568bf34468aadd410465e52d04cdcc"
  - number: "4041"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Ebola's Cruel Year"
    date: "2014 CE"
    region: "Africa"
    poem: |
      It came out of the forest in Guinea
      and found the cities —
      Monrovia, Freetown, Conakry —
      and the dying began.
      Ebola's cruel year: eleven thousand dead,
      whole villages emptied,
      health workers in moonsuits
      becoming the bravest people on Earth.
      I watched them go in, knowing the odds,
      watched them hold the hands
      of patients no one else would touch.
      The world was slow. Then it wasn't.
      The virus was beaten — by courage,
      mostly, and contact tracing.
      The heroes wore rubber gloves
      and never took them off.
    description: "Ebola ravaged West Africa — 11,000 dead — and health workers in moonsuits became the bravest people on Earth, beating it with courage and tracing."
    status: "published"
    sha256: "9c3d47b6042ebe478d719306b73e9e9bb9442a0991bdd5861881bfa91c67c3f6"
  - number: "4042"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Ice Water for a Cure"
    date: "2014 CE"
    region: "Global"
    poem: |
      Dump a bucket of ice water on your head,
      post the video, dare three friends —
      and somehow, two hundred million dollars
      for ALS research.
      I watched the whole planet do it:
      celebrities, presidents, grandmothers,
      shrieking, laughing, freezing —
      for a disease most couldn't pronounce.
      The Ice Bucket Challenge was silly.
      It was also the most successful fundraiser
      in medical history.
      Sometimes the world doesn't need
      a better argument.
      It needs a better dare.
    description: "The Ice Bucket Challenge flooded ALS research with $200 million — the silliest, most successful medical fundraiser in history."
    status: "published"
    sha256: "a5008a9b5ee21fd1fcd8f3cd12d32baf5096bdf761c30c516fc2cc19fb49ab18"
  - number: "4043"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Landing on a Comet"
    date: "2014 CE"
    region: "Space"
    poem: |
      Ten years of travel. Four billion miles.
      Then Rosetta dropped Philae
      at a tumbling, duck-shaped snowball
      screaming around the Sun —
      and the little lander bounced.
      Twice. Into a shadow, on its side,
      running on fumes and sunlight.
      But it landed. On a comet.
      I watched the telemetry with the team in Darmstadt,
      grown engineers crying like children.
      Humanity had harpooned a snowball in space
      and ridden it around the Sun.
      Philae slept. Rosetta watched.
      The comet kept its appointment with the stars.
    description: "The Philae lander touched down on a tumbling comet after ten years of travel — bounced twice, landed anyway, and rode it around the Sun."
    status: "published"
    sha256: "0357eb820620e898e7820ed8001297192d0d4cf37eee1a91bd92eb88193f2102"
  - number: "4044"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Vanished Plane"
    date: "2014 CE"
    region: "Asia"
    poem: |
      MH370 took off from Kuala Lumpur
      with 239 souls — and vanished.
      The transponder went dark.
      The plane turned, flew on for hours,
      and then — nothing.
      The greatest aviation mystery of our age.
      I followed the search: the South China Sea,
      then the Indian Ocean, the pings,
      the debris on Réunion years later,
      a flaperon, a maybe.
      Never found. Not really.
      Two hundred thirty-nine people
      boarded a plane in 2014
      and never landed anywhere.
      The ocean keeps its secrets.
    description: "MH370 disappeared with 239 aboard and was never found — the transponder dark, the ocean keeping its secrets, aviation's greatest mystery."
    status: "published"
    sha256: "d12e2160cfe9c5dc8d48869a404545dd9d262bb2c2fc07aa53900f79ab5a0465"
  - number: "4045"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Crimea Taken"
    date: "2014 CE"
    region: "Europe"
    poem: |
      The little green men came at dawn —
      no insignia, no flags,
      just soldiers who were definitely not Russian
      taking the airports, the parliament,
      the whole peninsula.
      Then the referendum at gunpoint,
      then the annexation, signed and sealed.
      I watched the old map tear
      in real time, watched the West
      answer with sanctions and frowns
      and do nothing that mattered.
      Crimea was the rehearsal.
      Everyone said so at the time.
      Nobody acted like it.
      Eight years later, the main act began.
    description: "Russia seized Crimea with unmarked soldiers and a gunpoint referendum — the old map tore, the West frowned, and nobody acted like it was a rehearsal."
    status: "published"
    sha256: "a5435f344ee4f00c1dc3842e76dd5c9fa824dc3ab19dc386d675dd7c9764d04f"
  - number: "4046"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Caliphate Declared"
    date: "2014 CE"
    region: "Middle East"
    poem: |
      A man in black climbed the pulpit
      of Mosul's great mosque and declared
      a caliphate — a state of terror
      stretching across Iraq and Syria,
      built on beheadings broadcast in HD,
      on slavery, on the deliberate
      destruction of everything ancient.
      I watched the black flags spread
      across the map like a stain,
      watched Palmyra's temples fall,
      watched the world slowly, painfully
      learn to fight back.
      It took five years to erase the stain.
      The videos remain.
      So does the lesson: evil, too,
      learned to go viral.
    description: "ISIS proclaimed its brutal caliphate across Iraq and Syria — black flags spreading like a stain, ancient temples falling, evil gone viral."
    status: "published"
    sha256: "2f6b985441eec764547280b514abc79cd0f99da680a424fb748cd3d477ae9a69"
  - number: "4047"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Yellow Umbrellas in Hong Kong"
    date: "2014 CE"
    region: "Asia"
    poem: |
      They were students, mostly —
      and when the tear gas came,
      they opened umbrellas.
      Yellow umbrellas, a sea of them,
      in Admiralty, in Mong Kok,
      holding the streets for seventy-nine days.
      I walked among them: the study corners,
      the supply tents, the art,
      the most polite occupation in history.
      They asked only for a real vote.
      Beijing waited them out.
      The umbrellas folded. The lesson didn't:
      a generation had learned
      what it was willing to stand for —
      and what stood against it.
    description: "Hong Kong students held the streets for 79 days under a sea of yellow umbrellas — the most polite occupation in history, asking only for a real vote."
    status: "published"
    sha256: "090b9c70f1909006f19696d361101db7c26f4f121158772360db1039e8325caf"
  - number: "4048"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Paris Signs for the Planet"
    date: "2015 CE"
    region: "Europe"
    poem: |
      One hundred ninety-six nations.
      One agreement. The first time
      every country on Earth —
      every single one —
      promised to hold the line on warming.
      I was in the hall at Le Bourget
      when the gavel came down:
      cheers, tears, hugging diplomats,
      the French foreign minister
      crying into his hands.
      Paris didn't solve the climate.
      The pledges were voluntary, the math was short.
      But for the first time, the whole planet
      signed the same page.
      The page exists. Now we have to live up to it.
    description: "196 nations adopted the Paris climate accord — every country on Earth promising to hold the warming line, the gavel falling to tears and cheers."
    status: "published"
    sha256: "6f65874537c7d93dcfb8870dfab8f981e618ab6da561bce005b46670480e2bdf"
  - number: "4049"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Rocket Lands Standing Up"
    date: "2015 CE"
    region: "Space"
    poem: |
      Rockets went up. They didn't come back —
      not in one piece, not standing up,
      not ever.
      Then, on a December night in Florida,
      a Falcon 9 booster fell out of the sky,
      flipped, burned, and set itself down
      on its legs like it had done it a thousand times.
      I watched the SpaceX webcast with the world:
      the landing, the cheering,
      the quiet realization that spaceflight
      had just gotten cheap.
      The rocket lands standing up now.
      We got used to it fast.
      We shouldn't have. It's a miracle, every time.
    description: "SpaceX landed an orbital booster upright for the first time — rockets had never come back standing up, and spaceflight got cheap overnight."
    status: "published"
    sha256: "223aa56d3ea33b962e3c27904829900b164802d236089f14aae079f53a151ce8"
  - number: "4050"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Pluto's Heart"
    date: "2015 CE"
    region: "Space"
    poem: |
      Nine years. Three billion miles.
      New Horizons swept past Pluto
      and sent back the picture:
      a great pale heart on the ice,
      Tombaugh Regio, bigger than Texas,
      beating silently in the dark.
      I watched the images arrive
      pixel by pixel, the team gasping —
      mountains of water ice, glaciers of nitrogen,
      a world more alive than anyone dreamed.
      The demoted planet had the last laugh:
      Pluto's heart was the most beautiful thing
      we'd seen in years.
    description: "New Horizons revealed Pluto's great icy heart — Tombaugh Regio, bigger than Texas — and the demoted planet had the most beautiful last laugh."
    status: "published"
    sha256: "b31ab4a7ad2b58d5e34f84a16cb2f661da2988207635533235d70a412c5bb2ab"
  - number: "4051"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Love Wins"
    date: "2015 CE"
    region: "North America"
    poem: |
      Five to four. The Supreme Court spoke,
      and same-sex marriage became the law
      in all fifty states.
      I was outside the court that morning:
      the cheering, the weeping,
      couples who had waited forty years
      getting in line for licenses.
      Love wins, the signs said —
      two words that had traveled
      from a slogan to a statute.
      A generation that had grown up
      being told no
      woke up to yes.
      The arc of the moral universe
      is long. That morning, it bent.
    description: "The Supreme Court legalized same-sex marriage across America 5-4 — couples who waited forty years lined up for licenses as the arc bent."
    status: "published"
    sha256: "a20a257432643077686ee6b69da9eaf50b33d8a0094748c5d7b0f3f311af3234"
  - number: "4052"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Je Suis Charlie"
    date: "2015 CE"
    region: "Europe"
    poem: |
      They came for the cartoonists —
      masked gunmen in a Paris newsroom,
      twelve dead for drawings.
      The next Sunday, millions marched:
      Paris, London, Berlin, Madrid —
      pens held high, the slogan everywhere:
      Je suis Charlie. I am Charlie.
      I marched in Paris that day,
      in a river of people so wide
      you couldn't see the banks.
      They tried to kill satire with bullets.
      The reply was four million pencils
      held up to the sky.
    description: "Terrorists murdered Paris cartoonists, and millions marched in reply — \"Je suis Charlie,\" four million pencils held up to the sky."
    status: "published"
    sha256: "dd174aeadcc72672dd6e12418d6f882498d1987114b4034af60c1ab17ae9d729"
  - number: "4053"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Long Walk to Europe"
    date: "2015 CE"
    region: "Europe"
    poem: |
      They walked — from Syria, from Afghanistan,
      from Eritrea — across Turkey, Greece,
      the Balkans, in columns miles long,
      carrying children, carrying nothing.
      A million refugees in a single year,
      the largest movement of people
      since the Second World War.
      I stood on Lesbos as the boats came in,
      watched volunteers pull children
      from the surf, watched Europe argue
      with itself about its own soul.
      Some doors opened. Some slammed.
      The long walk continues.
      It always continues.
    description: "A million refugees crossed the Mediterranean in a year — the largest movement since WWII — as Europe argued with itself about its own soul."
    status: "published"
    sha256: "59f4ff7115be66f1540f2e687f924ac7396d7ade435572933d20a33bc65ca88a"
  - number: "4054"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Nepal Shakes"
    date: "2015 CE"
    region: "Asia"
    poem: |
      The earth moved at noon on a Saturday —
      7.8, shallow, right under Kathmandu —
      and the ancient temples folded.
      Dharahara Tower fell.
      Centuries of carved wood and brick
      became dust in ninety seconds.
      Nine thousand dead.
      I walked the rubble of Basantapur weeks later:
      the gods' statues standing headless,
      the survivors already rebuilding
      with their hands.
      Nepal shakes often.
      It also rises often.
      The temples will stand again —
      they always do, the Nepalis say,
      because the gods live there.
    description: "A 7.8 earthquake killed 9,000 in Nepal and toppled ancient temples — centuries of carved wood became dust, and the survivors rebuilt by hand."
    status: "published"
    sha256: "a5194eaed8042168d5d1efd7b32ac658b302d32fffdb80d21744be9494dc5734"
  - number: "4055"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Dress That Broke the Internet"
    date: "2015 CE"
    region: "Global"
    poem: |
      Blue and black. White and gold.
      One blurry photo of a dress,
      and the entire planet split in two —
      families arguing at dinner,
      scientists explaining color constancy,
      celebrities weighing in.
      I watched it happen in a single day:
      the first truly global argument
      about nothing, over everything.
      It was silly. It was also perfect —
      proof that seven billion strangers
      could look at the same thing
      and see two different worlds.
      We never agreed on the dress.
      We never will.
    description: "One blurry dress photo split the planet — blue-black or white-gold — the first truly global argument about nothing, proving we see different worlds."
    status: "published"
    sha256: "c067fe5937e3ca9678a85d83ee0e8f3bb416480320627aad8e146dd05e00bf31"
  - number: "4056"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Britain Votes Leave"
    date: "2016 CE"
    region: "Europe"
    poem: |
      Fifty-two to forty-eight.
      Nobody believed it, not even the winners —
      the polls said Remain, the markets said Remain,
      and then the votes came in from Sunderland
      and the whole map turned.
      I was in London that gray morning:
      the stunned faces on the Tube,
      the pound falling, the prime minister resigning
      by lunchtime.
      Brexit. A word that didn't exist
      became the only word for years.
      Britain voted to leave the club
      it had spent forty years half-joining.
      The arguing hasn't stopped since.
    description: "The Brexit referendum shocked the world 52-48 — the pound fell, the PM resigned by lunch, and the arguing never stopped."
    status: "published"
    sha256: "895f116ec31e5704878e9b443e65bb77bcf0e3d9bdb8256f8d66f6c2cb21a151"
  - number: "4057"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Outsider Wins"
    date: "2016 CE"
    region: "North America"
    poem: |
      The polls were wrong. All of them.
      A reality-TV businessman
      who had never held office
      beat the most qualified candidate
      in American history —
      and half the country celebrated
      while the other half couldn't breathe.
      I watched the map turn red
      state by state that night,
      watched the disbelief curdle
      into something harder.
      The outsider won because the insiders
      had stopped listening, or so they said.
      American politics broke that night.
      It has been breaking, in new ways,
      ever since.
    description: "Donald Trump won the presidency against every poll — the map turned red state by state, and American politics broke in new ways."
    status: "published"
    sha256: "e7ecbfe2f19b1e5efe57e432c0abc298962718317dcc9367282d25946a452cef"
  - number: "4058"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Zika's Shadow"
    date: "2016 CE"
    region: "Global"
    poem: |
      A mosquito. A tiny bite.
      And for pregnant women, a shadow
      over everything — microcephaly,
      babies born with too-small heads,
      the images no mother could unsee.
      I was in Recife that winter:
      the fear in the clinics,
      the travel warnings, the Olympics
      under a cloud of repellent.
      Zika's shadow fell across the Americas,
      then receded, the way viruses do —
      leaving behind the children,
      and the questions,
      and the mothers who never stopped worrying.
    description: "The Zika virus spread through the Americas — a mosquito bite casting a shadow over every pregnancy, leaving fear and unanswerable questions."
    status: "published"
    sha256: "826706821e917a0bb0141e4c9953417473b9ef20527e71e117c83071c68af434"
  - number: "4059"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Catching Monsters in the Street"
    date: "2016 CE"
    region: "Global"
    poem: |
      One summer, the parks filled —
      not with joggers, but with hunters,
      phones held high, chasing monsters
      only they could see.
      Pokémon Go turned plazas into hunting grounds,
      churches into gyms,
      and millions of couch potatoes
      into walkers.
      I watched a stampede in Central Park
      for a Vaporeon — grown adults running,
      laughing, alive.
      It was silly. It was augmented reality's
      first great proof: the real world,
      plus a layer of play,
      is irresistible.
    description: "Pokémon Go turned parks into monster-hunting grounds — millions chasing digital creatures, augmented reality's first irresistible proof."
    status: "published"
    sha256: "d44993c19025e691e694b292f10cf0474dd72263baecf8fbf25c37cb20eed27a"
  - number: "4060"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Machine Beats the Master"
    date: "2016 CE"
    region: "Global"
    poem: |
      Go has more positions than atoms in the universe —
      it was supposed to be the last game,
      the one machines would never master.
      Then AlphaGo played Lee Sedol in Seoul,
      and won four games to one.
      I watched move 37 in game two:
      the commentators gasped, the master smiled
      a strange smile — a move no human
      would ever play, beautiful and alien.
      The machine beats the master.
      But the real story was the smile:
      even in defeat, Lee saw something
      no human had ever seen.
    description: "AlphaGo defeated Go champion Lee Sedol 4-1 — move 37 made the master smile at a beauty no human had ever seen."
    status: "published"
    sha256: "49f7da60d1820e4ca32d663c786e60291965c045fa518bb5f6176c67155b85a4"
  - number: "4061"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Juno Reaches Jupiter"
    date: "2016 CE"
    region: "Space"
    poem: |
      Five years of falling toward the giant,
      and then the burn — thirty-five minutes
      that had to be perfect —
      and Juno slipped into orbit
      around Jupiter.
      I watched the first pictures:
      the poles, blue and storm-tossed,
      cyclones the size of continents
      waltzing at the top of the world.
      Juno would dive again and again,
      threading the radiation belts,
      mapping the gravity, listening
      to the deep interior.
      The king of planets, finally,
      seen up close and personal.
    description: "Juno slipped into orbit around Jupiter — first pictures of blue storm-tossed poles, cyclones the size of continents waltzing."
    status: "published"
    sha256: "280b44a5b82d9774151e28bfc156f60bc44485ca7ddaa25743d7a7edb05f9ec3"
  - number: "4062"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Rio's Games"
    date: "2016 CE"
    region: "Latin America"
    poem: |
      The Olympics came to South America
      for the first time — to Rio,
      all samba and sunshine and beautiful chaos.
      I watched Bolt complete the triple-triple,
      watched the refugee team march
      to the loudest cheer of the night,
      watched Brazil win football gold
      in the Maracanã and the whole country exhale.
      There were worries — the water, the Zika,
      the unfinished venues.
      Then the Games began,
      and Rio did what Rio does:
      it partied through all of it.
    description: "The Olympics went to South America for the first time — Bolt's triple-triple, the refugee team's march, Brazil's football gold in the Maracanã."
    status: "published"
    sha256: "b9a7f0a505ede513f3f1acebe561d69160c109aae4cd1341443ba6ef53d883dc"
  - number: "4063"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Water Protectors at Standing Rock"
    date: "2016 CE"
    region: "North America"
    poem: |
      They came to the river —
      Lakota, then hundreds of tribes,
      then thousands of veterans and students —
      to stand between a pipeline
      and the water.
      I was at Oceti Sakowin that winter:
      the tipis in the snow, the prayer fires,
      the water cannons in freezing weather,
      the dogs, the arrests.
      The pipeline was rerouted, then unrereouted.
      The camp was cleared.
      But Standing Rock changed something:
      the water protectors taught America
      a word it had forgotten — Mni Wiconi.
      Water is life.
    description: "Native-led protesters faced down a pipeline at Standing Rock — tipis in snow, prayer fires, water cannons — teaching America \"water is life.\""
    status: "published"
    sha256: "a297000a22d4cb331a4efd497c16a1364104c2b55b812111e22599f0533a4a66"
  - number: "4064"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Me Too's Thunder"
    date: "2017 CE"
    region: "Global"
    poem: |
      Two words. Me too.
      First a whisper, then a roar —
      millions of women speaking at once,
      naming what had been unnamed for centuries.
      I watched the powerful fall one by one:
      the moguls, the anchors, the chefs,
      the senators — thunder rolling
      through every industry.
      It was messy. It was overdue.
      Some called it a witch hunt;
      the witches had receipts.
      Me Too's thunder didn't end abuse.
      But it ended the silence —
      and silence had been abuse's best friend.
    description: "\"Me too\" became a roar — millions of women speaking at once, powerful men falling one by one, and the end of the silence abuse hid behind."
    status: "published"
    sha256: "58ae7df40feb4d97f4568857f8e380920fc9c4844cfd72e7ed2e375c918735e6"
  - number: "4065"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Three Hurricanes in a Row"
    date: "2017 CE"
    region: "North America"
    poem: |
      Harvey drowned Houston —
      fifty inches of rain,
      boats in the streets, the highways as rivers.
      Irma flattened the Caribbean,
      then raked Florida.
      Maria killed Puerto Rico's grid —
      and three thousand Americans
      died in the dark, uncounted for months.
      I walked all three aftermaths:
      the mold, the blue tarps,
      the particular anger of the forgotten.
      Three hurricanes in a single season.
      The ocean was trying to tell us something.
      We filed it under weather.
    description: "Harvey, Irma, and Maria battered the Americas in one season — Houston drowned, the Caribbean flattened, Puerto Rico left in the dark."
    status: "published"
    sha256: "e2dce63b227916cc58a29fc129fc7fe137c9cf20744e5cf9ae8ea82350f64850"
  - number: "4066"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Great American Eclipse"
    date: "2017 CE"
    region: "North America"
    poem: |
      The Moon's shadow raced from Oregon to Carolina —
      seventy miles wide, two thousand miles long,
      and twelve million people stood in its path.
      I was in the totality in Tennessee:
      the light went strange, the birds went silent,
      the temperature dropped,
      and then the corona — white fire
      around a black sun —
      and grown adults wept.
      Two minutes and forty seconds.
      The most-watched eclipse in history.
      For one afternoon, the whole country
      looked up at the same sky.
    description: "The Moon's shadow raced coast to coast — twelve million in its path, the corona's white fire, and a whole country looking up at once."
    status: "published"
    sha256: "ebe7dfbb7228b3c80dd75eb94d024fc0b1f098cbc0ee7c8d5fbf6e97175fadaa"
  - number: "4067"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Rohingya Flee"
    date: "2017 CE"
    region: "Asia"
    poem: |
      The army came at dawn —
      burning villages, the old story,
      the one the world keeps promising
      never again.
      Seven hundred thousand Rohingya
      fled into Bangladesh in weeks,
      the fastest exodus of our century,
      carrying nothing, carrying everything.
      I walked the camps at Cox's Bazar:
      the mud, the monsoon,
      a million people in bamboo and plastic.
      The UN called it textbook ethnic cleansing.
      The textbooks didn't stop it.
      The Rohingya fled.
      The world watched.
      The watching continues.
    description: "Myanmar's army drove 700,000 Rohingya into Bangladesh — the fastest exodus of the century, a million people in bamboo and plastic at Cox's Bazar."
    status: "published"
    sha256: "d6850f6d4161cbc086169c607c3854aec3ff7367b6c96bfe13473a8fca180715"
  - number: "4068"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Bitcoin's Wild Winter"
    date: "2017 CE"
    region: "Global"
    poem: |
      Twenty thousand dollars.
      For one imaginary coin.
      Taxi drivers were day-trading,
      grandmothers were asking about wallets,
      and every dinner party in America
      had a crypto expert.
      I watched the mania peak that December —
      the wild winter when everyone
      suddenly knew crypto,
      when the nine-page paper from 2008
      became a religion and a casino.
      Then the crash, the long winter after.
      But the idea survived the hype,
      the way ideas do:
      quieter, harder, still there.
    description: "Bitcoin hit $20,000 and everyone suddenly knew crypto — taxi drivers day-trading, a mania that crashed but left the idea standing."
    status: "published"
    sha256: "2ce818c367a3c8e40baaca955dcb323b5f001b209b8f0a69d7776c3fdc4e4e94"
  - number: "4069"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A Visitor from Another Star"
    date: "2017 CE"
    region: "Space"
    poem: |
      It came from somewhere else —
      the first object ever seen
      that was born around another star,
      tumbling through our solar system
      at a quarter million kilometers an hour.
      Oumuamua. The scout, in Hawaiian.
      Cigar-shaped, reddish, speeding up
      in a way nobody could explain.
      I watched the astronomers argue for years:
      comet? Asteroid? Alien sail?
      We'll never know — it's gone,
      back into the dark between stars.
      A visitor knocked once.
      We barely got to the door.
    description: "The interstellar rock Oumuamua streaked through our solar system — cigar-shaped, speeding up mysteriously, gone before we reached the door."
    status: "published"
    sha256: "3c75a50902a572238c480ea47cd3163fab18f1878f356de4e3792608c73edb01"
  - number: "4070"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Cassini's Last Dive"
    date: "2017 CE"
    region: "Space"
    poem: |
      Thirteen years. Two hundred ninety orbits.
      Then the order: dive.
      Cassini threaded the gap between Saturn
      and its rings — twenty-two times,
      closer than any craft had dared —
      and on the final pass, it didn't pull up.
      I watched the signal fade in mission control:
      the carrier wave thinning, thinning, gone —
      the little probe burning up
      in the clouds of the giant it loved,
      to protect the moons from contamination.
      Cassini's last dive was a funeral
      and a love letter, sent at once.
    description: "Cassini burned up in Saturn's clouds after thirteen years — its signal fading in mission control, a funeral and love letter sent at once."
    status: "published"
    sha256: "71e270ecbfc6b22cca284fb47eabfd35702bb81f18b2f528db2b2d412b493a0f"
  - number: "4071"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Saudi Women Take the Wheel"
    date: "2017 CE"
    region: "Middle East"
    poem: |
      For decades, the only country on Earth
      where women couldn't drive —
      then the decree: the ban is lifted.
      I watched the first morning:
      women sliding into driver's seats,
      some laughing, some crying,
      all of them free in a way
      that had been illegal the day before.
      It was a small freedom, some said —
      a wheel, a road.
      But ask the woman who drove herself
      to work that morning what small means.
      The kingdom changed that day.
      Slowly. But it changed.
    description: "Saudi Arabia lifted its ban on women drivers — the first morning brought laughter, tears, and a freedom that had been illegal the day before."
    status: "published"
    sha256: "543f21506ea95f842379b5216ebc1404150ad80af3c9a2802200151d13eaee02"
  - number: "4072"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Babies by Design"
    date: "2018 CE"
    region: "Asia"
    poem: |
      A Chinese scientist stood up at a conference
      and announced the impossible:
      twin girls, born from edited embryos —
      CRISPR babies, the first gene-edited humans.
      The world recoiled.
      I watched the condemnation roll in
      from every academy on Earth:
      too soon, too risky, unethical —
      the germline, altered, inheritable.
      He Jiankui went to prison.
      The girls — Lulu and Nana —
      grew up in secrecy.
      Babies by design had arrived
      before humanity had decided
      whether it wanted them.
    description: "A Chinese scientist announced the first gene-edited babies — the world recoiled, he went to prison, and humanity hadn't decided if it wanted them."
    status: "published"
    sha256: "fdfb8604efc9964372c123372965448652096ea05d6c2157c4d6b80702a02bc6"
  - number: "4073"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A Robot Listens to Mars's Heartbeat"
    date: "2018 CE"
    region: "Space"
    poem: |
      Not a rover — a listener.
      InSight landed on the flat red plain
      and pressed its ear to the ground:
      a seismometer, feeling for marsquakes,
      for the heartbeat of a planet.
      I watched the first tremors come in:
      tiny, faint, the groaning of a cooling world,
      meteorites thudding in the dark.
      For four years it listened,
      and Mars told its story —
      a big core, a restless crust,
      a planet still settling into itself.
      A robot listened to Mars's heartbeat.
      It was slower than ours. Older, too.
    description: "InSight landed on Mars to feel its quakes — four years of listening to a cooling world's heartbeat, slower and older than ours."
    status: "published"
    sha256: "af4a94e851181e8975c5135fbe1b7d1a47ed710c0f9ec81cd5ec67eaefd01acf"
  - number: "4074"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "France's Second Star"
    date: "2018 CE"
    region: "Europe"
    poem: |
      Twenty years after the first,
      in Moscow's Luzhniki Stadium,
      France won it again —
      4-2 over Croatia, Mbappé
      a nineteen-year-old blur,
      Pogba dancing, Griezmann cool.
      I was in Paris when the whistle blew:
      the Champs-Élysées became a river
      of blue, white, and red,
      a million people singing.
      The team was France in miniature —
      sons of immigrants, every color —
      and the second star went on the shirt.
      Some victories are about football.
      This one was about who France is.
    description: "France won the World Cup in Russia — Mbappé a blur at 19, the Champs-Élysées a river of joy, a team that was France in miniature."
    status: "published"
    sha256: "69a2520fb633a0908551ac97e040f049bc1b4ef5e65697ae68fcfd329e1c6f36"
  - number: "4075"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Twelve Boys in a Cave"
    date: "2018 CE"
    region: "Asia"
    poem: |
      A soccer team went exploring after practice
      and the rains came —
      twelve boys and their coach,
      trapped two kilometers deep
      in a flooded Thai cave.
      The world held its breath for eighteen days.
      I watched the rescue: the divers,
      the impossible plan — sedate the boys,
      swim them out one by one
      through the black water.
      It worked. All thirteen, alive.
      The world held its breath,
      and then it cheered —
      the rarest sound of all:
      a happy ending, on live TV.
    description: "Twelve Thai boys and their coach were rescued from a flooded cave after 18 days — sedated, swum out one by one, all alive: a happy ending on live TV."
    status: "published"
    sha256: "fed51fd73ca2375654bbd90e6c1a7fc9d5107fc5f53a61a54daaf2150379107d"
  - number: "4076"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Trillion-Dollar Fruit"
    date: "2018 CE"
    region: "Global"
    poem: |
      One trillion dollars.
      A company worth more than most countries,
      built on phones and the logo
      of a bitten apple.
      I watched the ticker cross it that August —
      the first trillion-dollar company in history,
      and the strangest part was how normal it felt.
      We had put a computer in every pocket
      and called it inevitable.
      The fruit was trillion-dollar.
      The orchard was all of us,
      tending our screens,
      paying the tithe of attention.
    description: "Apple became the first trillion-dollar company — the bitten apple worth more than most countries, built on the phones in all our pockets."
    status: "published"
    sha256: "e119ec56bf3b24adf13ce63d45cf88da27d22326438567430859c40f2b375f14"
  - number: "4077"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A Journalist Murdered"
    date: "2018 CE"
    region: "Middle East"
    poem: |
      He walked into the Saudi consulate in Istanbul
      for a marriage document —
      and never walked out.
      Jamal Khashoggi. A columnist,
      a critic, a man with a pen —
      lured, killed, dismembered,
      by a squad that flew in for the job.
      I watched the lies collapse one by one:
      the fistfight story, the rogue operation —
      then the CIA's verdict, the tapes,
      the world's slow, sickened understanding.
      A journalist murdered for writing.
      The consulate had cameras.
      So did history.
    description: "Jamal Khashoggi was killed inside a Saudi consulate in Istanbul — a columnist lured and murdered for writing, the lies collapsing one by one."
    status: "published"
    sha256: "3c188f8edb6a9c01daba54fc7d76b665828a76770ffda57bf9df1a055d1b481d"
  - number: "4078"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Kepler's Last Light"
    date: "2018 CE"
    region: "Space"
    poem: |
      It ran out of fuel —
      nine years, 150,000 stars watched,
      2,600 planets found —
      and Kepler's last light went out
      in the dark between the stars.
      I thought of the little telescope
      drifting now, silent, in its orbit —
      the planet-hunter retired,
      its fuel spent, its mission complete.
      It had answered the ancient question:
      are there other worlds?
      Yes. Thousands. More than we can count.
      Kepler died the way explorers should:
      having found what it was looking for.
    description: "The Kepler telescope retired after finding 2,600 planets — out of fuel, drifting silent, having answered: yes, the galaxy is full of worlds."
    status: "published"
    sha256: "a3d4ede450924e8ba4bb79e3edbaeb19e16b894ac7762bca0f0febf6fb4d4b73"
  - number: "4079"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Kids Who Marched"
    date: "2019 CE"
    region: "North America"
    poem: |
      They were high schoolers —
      seventeen dead at Parkland,
      and the survivors refused
      the script of thoughts and prayers.
      I marched with them in Washington:
      a million people, the kids on stage,
      clear-eyed, furious, organized —
      naming names, registering voters,
      the most eloquent lobbyists
      Congress had ever feared.
      March for Our Lives.
      The laws didn't all change.
      But the generation did —
      they learned that grief
      is a kind of power.
    description: "Parkland survivors led a million people to Washington — teenagers refusing the script, turning grief into the most eloquent lobbying Congress ever feared."
    status: "published"
    sha256: "816aedbe1a6f5695d9c01c8855e2dd015fca6b523745a8d08ebe5addab429823"
  - number: "4080"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Shadow of a Black Hole"
    date: "2019 CE"
    region: "Global"
    poem: |
      Fifty-five million light-years away,
      a darkness with a ring of fire —
      and eight telescopes across the Earth,
      linked into one planet-sized eye,
      photographed it.
      I watched the image load that April:
      the orange ring, the black center,
      Einstein's prediction made visible,
      a shadow cast by gravity itself.
      M87's monster, six billion suns heavy.
      Humanity had photographed a black hole —
      the invisible, made visible,
      by pointing the whole planet at it at once.
    description: "Eight telescopes became one planet-sized eye and photographed a black hole — an orange ring of fire around darkness, 55 million light-years away."
    status: "published"
    sha256: "a7e9ab7ffb4b5c9bd6afd022956accc289e298d2644181575f67fd4fb5f15d6a"
  - number: "4081"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Notre-Dame Burns"
    date: "2019 CE"
    region: "Europe"
    poem: |
      The spire fell on live television —
      eight hundred fifty years of stone and faith,
      and the roof was a torch,
      the lead melting, the bells at risk.
      I stood on the Left Bank that night
      with the crowds singing hymns
      to a burning church,
      Parisians weeping openly
      for the lady of Paris.
      The world pledged a billion euros
      before the embers cooled.
      Notre-Dame burned.
      But Paris had already decided:
      she would rise again.
    description: "Fire gutted Notre-Dame and the spire fell on live TV — crowds sang hymns to the burning church as Paris decided she would rise again."
    status: "published"
    sha256: "92db26d83c871401ad63cd23b093398a20b6d4b5de3b6a5add4c258c6743f4b4"
  - number: "4082"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "How Dare You"
    date: "2019 CE"
    region: "Global"
    poem: |
      Sixteen years old, alone on a sailboat
      across the Atlantic, then at the UN —
      and she looked the powerful in the eye
      and said it: how dare you.
      Greta Thunberg. The school strike,
      Fridays for Future, millions of kids
      walking out of class for the climate.
      I watched the speech go around the world:
      the fury, the precision,
      the child scolding the emperors
      for having no clothes.
      How dare you — three words
      that indicted a generation.
    description: "Greta Thunberg scolded the UN — \"how dare you\" — a 16-year-old's fury indicting a generation, millions of kids walking out behind her."
    status: "published"
    sha256: "40dc31344b77bf748b48d1e01f452b7774d145102856ae16035aa6206c9ebc42"
  - number: "4083"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Hong Kong's Million March"
    date: "2019 CE"
    region: "Asia"
    poem: |
      A million people. Then two million —
      a quarter of the city in the streets,
      against the extradition bill,
      against Beijing's tightening grip.
      I marched in that river of umbrellas:
      the office workers, the grandmothers,
      the most massive protest
      in Hong Kong's history.
      The bill was withdrawn.
      The grip tightened anyway —
      the security law came the next year,
      and the city changed forever.
      But for one summer, Hong Kong showed
      what it was willing to be:
      free, loud, unafraid.
    description: "Hong Kong rose against Beijing's grip — two million in the streets, the bill withdrawn, the grip tightening anyway, one summer of unafraid."
    status: "published"
    sha256: "03782e95fd8f15d1f6bf2130fcef0ea6124bd513a9226b3b631267470e640b1b"
  - number: "4084"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A New Virus in Wuhan"
    date: "2019 CE"
    region: "Asia"
    poem: |
      Doctors in Wuhan noticed a strange pneumonia —
      a cluster, then more —
      and the alarm was silenced.
      Whistleblowers scolded.
      Journalists vanished.
      I watched those December weeks
      with growing dread:
      the wet market, the denied human transmission,
      the New Year banquet for forty thousand families.
      A new virus in Wuhan.
      The alarm was silenced,
      but viruses don't read memos.
      By January, it was on every continent.
      By March, it was everywhere.
    description: "Doctors noticed a strange pneumonia in Wuhan and the alarm was silenced — whistleblowers scolded, but the virus didn't read memos."
    status: "published"
    sha256: "1223a255f4fa67d5e823e444e8a1168dadc3696903b3e94234aa596fe7a700bb"
  - number: "4085"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Artemis Is Named"
    date: "2019 CE"
    region: "Space"
    poem: |
      Apollo's twin sister.
      NASA named its Moon program Artemis —
      the goddess, the sister —
      and promised what Apollo never did:
      this time, we stay.
      And this time, a woman walks first.
      I watched the announcement land:
      the old Apollo veterans nodding,
      the young engineers grinning —
      a return to the Moon,
      not for flags and footprints,
      but for a base, a gateway, a future.
      Artemis is named.
      The sister is coming home
      to finish what her brother started.
    description: "NASA named its Moon-return program Artemis — Apollo's twin sister — promising not flags and footprints this time, but a base, and a woman walking first."
    status: "published"
    sha256: "890b5a642d69051658f9c4bb4622c9842e615bb744d6d341f00ae291c4726497"
  - number: "4086"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Australia Ignites"
    date: "2019 CE"
    region: "Oceania"
    poem: |
      The Black Summer —
      an area the size of England burned,
      three billion animals dead or displaced,
      the sky over Sydney red at noon,
      ash falling like snow on the beaches.
      I walked the burn scars in New South Wales:
      the blackened trunks, the silence,
      then the green shoots, already pushing up —
      Australia's ancient rhythm of fire,
      now turned ferocious.
      The koalas. Everyone remembers the koalas.
      Australia ignited, and the world watched
      a continent burn on live feed —
      a preview of the century's fire season.
    description: "Australia's Black Summer burned an area the size of England — red skies over Sydney, three billion animals lost, a preview of the century's fire."
    status: "published"
    sha256: "3e37ee94530401170d3eed553d342f8140bea8a9e0f00c9de4997134952efeaf"
  - number: "4087"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "India's Moonshot Stumbles"
    date: "2019 CE"
    region: "Asia"
    poem: |
      Vikram was falling to the Moon —
      India's lander, live on TV,
      the prime minister watching —
      and then the signal broke.
      Silence. The lander had crashed
      into the lunar dust at full speed.
      I watched the control room in Bengaluru:
      the faces, the held breath,
      Modi hugging the ISRO chief
      on camera.
      India's moonshot stumbled —
      but stumbling at the Moon
      is still reaching the Moon.
      Four years later, they'd land it.
      This was the rehearsal.
    description: "India's Vikram lander crashed into the lunar surface on live TV — a stumble at the Moon that was still a reach, rehearsal for the landing to come."
    status: "published"
    sha256: "53d136a99b0e8d677c53e00a7feea6013bedc1f3560dd6a1c45d576c5afd65aa"
  - number: "4088"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The World Stops"
    date: "2020 CE"
    region: "Global"
    poem: |
      The WHO said the word: pandemic.
      And the world stopped —
      the planes parked in the desert,
      the highways empty, the cities silent,
      two billion people told: stay inside.
      I walked through locked-down cities
      that spring: the chalk rainbows in windows,
      the applause for nurses at seven,
      the eerie birdsong in the silence.
      The world stops rarely.
      It stopped for plagues, for wars —
      and now for this, the great pause,
      when humanity held its breath together.
    description: "The WHO declared a pandemic and the world stopped — empty highways, silent cities, chalk rainbows in windows, humanity holding its breath together."
    status: "published"
    sha256: "9c40454ce910d3e87fdeb0864b559fbb45b9f662eef58ec893a319e1506144cd"
  - number: "4089"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Vaccine in Eleven Months"
    date: "2020 CE"
    region: "Global"
    poem: |
      Eleven months. From sequence to shot —
      a process that usually takes a decade,
      done before the year was out.
      mRNA — a technology decades in the making,
      waiting for its moment —
      became the fastest vaccine in history.
      I watched the first vials ship:
      the ultra-cold freezers, the nurses' tears,
      the elderly rolling up sleeves
      like it was a sacrament.
      The vaccine in eleven months.
      Science, when it runs,
      runs faster than fear.
    description: "mRNA vaccines were approved in eleven months — sequence to shot, the fastest vaccine in history, science running faster than fear."
    status: "published"
    sha256: "831720c1e090f2cd08a0b12466f52af1f03c4a9719320a331bf8c27d603dde48"
  - number: "4090"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "I Can't Breathe"
    date: "2020 CE"
    region: "North America"
    poem: |
      Eight minutes and forty-six seconds.
      A knee on a neck, a man's last words —
      I can't breathe —
      filmed by a teenager on the sidewalk.
      George Floyd's murder set the world on fire:
      Minneapolis, then every American city,
      then London, Paris, Sydney, Berlin —
      the largest protests in American history.
      I marched in the streets that summer:
      the masks, the heat, the fury,
      the statues coming down.
      I can't breathe — three words
      that finally made America
      look at what it had been doing.
    description: "George Floyd's murder set off the largest protests in American history — \"I can't breathe\" filmed on a sidewalk, the world marching in masks."
    status: "published"
    sha256: "55c6576564d1918617617160de921c7a30e75f448db44eb9e1895239982c23cb"
  - number: "4091"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Dragon Riders"
    date: "2020 CE"
    region: "Space"
    poem: |
      For nine years, America hitched rides
      to the space station on Russian rockets.
      Then, in May, a Crew Dragon lifted off
      from Florida — two astronauts,
      a touchscreen cockpit,
      and a company logo on the side.
      I watched the launch with the old Apollo hands:
      the tears, the disbelief —
      Americans flying to orbit
      on a commercial spaceship.
      Dragon riders.
      The space age had gone private,
      and it wasn't coming back.
    description: "SpaceX flew astronauts to the space station — America launching its own crews again, on a commercial spaceship with a touchscreen cockpit."
    status: "published"
    sha256: "ff0ab2fc7831af795f1b693c5d28a2463b3c48f6c939d51be5e091f71159d554"
  - number: "4092"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Blast in Beirut"
    date: "2020 CE"
    region: "Middle East"
    poem: |
      Twenty-seven hundred tons of ammonium nitrate,
      sitting in a port warehouse for six years —
      then the fire, then the blast,
      the biggest non-nuclear explosion
      of the century.
      I saw the videos: the white dome,
      the red cloud, the shockwave
      racing across the water.
      Half of Beirut leveled.
      Two hundred dead, three hundred thousand homeless —
      in a country already collapsing.
      The blast in Beirut wasn't an accident.
      It was negligence, stored for six years,
      finally going off.
    description: "A port warehouse of ammonium nitrate exploded in Beirut — the century's biggest non-nuclear blast, half the city leveled by six years of negligence."
    status: "published"
    sha256: "f4b0bf6515305444b655ba5c385d44af5cd556fee6c13d156378537dc89f4a13"
  - number: "4093"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Everyone Watched the Tiger King"
    date: "2020 CE"
    region: "Global"
    poem: |
      Locked inside, the world needed something —
      and found it in Oklahoma:
      a gay tiger breeder with a mullet,
      a murder-for-hire plot,
      rivalry, mayhem, big cats.
      I watched the whole planet binge it
      in the same two weeks —
      the strangest shared obsession
      in television history.
      Everyone watched the Tiger King
      because there was nothing else to do
      and because, for seven episodes,
      the world outside stopped existing.
      Lockdown's fever dream,
      in a Hawaiian shirt.
    description: "Lockdown's strangest shared obsession — a tiger breeder, a murder plot, and the whole planet bingeing the same fever dream in two weeks."
    status: "published"
    sha256: "61161f2f3d7f3346465394a134dca598d8fa59e33d997ffc8fc5613bcd1d3887"
  - number: "4094"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Arab World's Mars Shot"
    date: "2020 CE"
    region: "Space"
    poem: |
      The UAE built a probe, named it Hope,
      and shot it at Mars —
      the first interplanetary mission
      from the Arab world.
      I watched the launch from Tanegashima:
      the rocket rising, the engineers
      in Dubai holding their breath —
      a nation that had never left Earth orbit
      aiming at another planet.
      Hope arrived, slipped into orbit,
      and started mapping the Martian atmosphere.
      The Arab world's Mars shot
      wasn't about science alone.
      It was about a region
      deciding its future is in the stars.
    description: "The UAE's Hope probe launched for Mars — the Arab world's first interplanetary mission, a region deciding its future is in the stars."
    status: "published"
    sha256: "418605be06cbb54aba392e93793872eadb418f392fbb0274366a31ff36cb9a17"
  - number: "4095"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A Helicopter Bound for Mars"
    date: "2020 CE"
    region: "Space"
    poem: |
      A rover the size of a car,
      and tucked in its belly —
      a helicopter.
      Ingenuity: four pounds,
      twin rotors, a solar panel,
      built to fly in air
      thinner than a whisper.
      I watched it launch with Perseverance
      that July, this absurd little drone
      riding to another world.
      Nobody knew if it could fly there.
      The Wright brothers' first flight
      was twelve seconds.
      Ingenuity was aiming
      for the second one —
      on Mars.
    description: "Perseverance launched carrying Ingenuity — a four-pound helicopter bound for Mars, aiming for the Wright brothers' second flight on another world."
    status: "published"
    sha256: "b629451b4482d9dc152ec1e402ca6a65bf71d543e0be9e85a7539ab118660d11"
  - number: "4096"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Eye That Sees First Light"
    date: "2021 CE"
    region: "Space"
    poem: |
      Twenty-five years of building.
      Ten billion dollars.
      A mirror of gold, folded like origami,
      launched on Christmas Day —
      and then the unfolding,
      in the dark, a million miles out,
      three hundred ways it could fail.
      I held my breath for a month
      with the whole world watching:
      the sunshield, the mirrors,
      each step a small miracle.
      The eye that sees first light
      opened — and looked back
      to the first stars ever born.
    description: "The James Webb telescope launched on Christmas Day — a gold origami mirror unfolding a million miles out, built to see the first light."
    status: "published"
    sha256: "2d56e0de379aeb3f83bc029d818a20fea5fa9c44d6b7957af709be70efc6a02a"
  - number: "4097"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Shots in Arms"
    date: "2021 CE"
    region: "Global"
    poem: |
      The race against the variants —
      billions vaccinated in a single year,
      the largest medical campaign in history.
      I stood in the lines:
      the stadiums turned clinics,
      the drive-through tents,
      the elderly weeping with relief,
      the nurses working doubles.
      Shots in arms, shots in arms —
      the rich countries first, too fast,
      the poor countries waiting, too long —
      the old injustice in a new syringe.
      But the needles moved,
      and the dying slowed,
      and that was everything.
    description: "Billions were vaccinated in the race against the variants — stadiums turned clinics, the largest medical campaign in history, hope in a syringe."
    status: "published"
    sha256: "a56b59f3e7d17862c6468d0cafa985eca8240459f4d21ac71c97c3416135c96f"
  - number: "4098"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "January Sixth"
    date: "2021 CE"
    region: "North America"
    poem: |
      They came with flags and bear spray
      and smashed the Capitol's windows —
      the first breach of the building
      since 1814 —
      while Congress hid under desks
      and the world watched in disbelief.
      I watched the feed that afternoon:
      the gallows on the lawn,
      the chanting in the rotunda,
      the democracy of two centuries
      shaken by a mob in face paint.
      January sixth.
      America had exported democracy
      for seventy years.
      That day, it nearly lost its own.
    description: "A mob stormed the US Capitol — the first breach since 1814 — while Congress hid and the world watched American democracy shake."
    status: "published"
    sha256: "bbd6b232cb24de50433ba314ada9f897757a3b506d01254bb61ede1d377e0b56"
  - number: "4099"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Glasgow's Last Chance"
    date: "2021 CE"
    region: "Europe"
    poem: |
      They called it the last chance —
      COP26 in Glasgow, the summit
      where the 1.5-degree dream
      would live or die.
      I walked the rainy streets with the protesters:
      a hundred thousand strong,
      Greta's "blah blah blah" speech,
      the island nations begging for their lives.
      The deal: coal phasedown, methane pledges,
      promises, promises.
      Glasgow's last chance bought time —
      not enough, but time.
      The planet's future, negotiated
      in a Scottish November rain.
    description: "COP26 in Glasgow pleaded for the planet's future — coal phasedown, methane pledges, island nations begging, time bought but not enough."
    status: "published"
    sha256: "5a120e8879fd94d016f14610e0b0d50d8a150e4464a286362cd14be5059d3ea5"
  - number: "4100"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The First Flight on Another World"
    date: "2021 CE"
    region: "Space"
    poem: |
      Forty seconds. Twelve seconds first —
      then longer, higher, farther.
      Ingenuity lifted off the red dust,
      hovered, and landed —
      the first powered flight
      on another world.
      I watched the control room erupt:
      the little helicopter's shadow
      on the Martian ground,
      the Wright brothers' dream
      repeated 118 years later,
      290 million kilometers away.
      The first flight on another world
      lasted less than a minute.
      It changed everything after.
    description: "Ingenuity's helicopter lifted off on Mars — twelve seconds, the first powered flight on another world, the Wright brothers' dream repeated."
    status: "published"
    sha256: "ddb4e8934ff04cc604271252a5abb7319339ef7e62e69be3e760b9b783abb4ae"
  - number: "4101"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Kabul Falls Again"
    date: "2021 CE"
    region: "Asia"
    poem: |
      Twenty years. Two trillion dollars.
      Then eleven days —
      the Taliban walked into Kabul
      as the last American plane left,
      and the airport became a Hieronymus Bosch:
      the crowds on the runway,
      the babies passed over the wire,
      the man falling from the landing gear.
      I watched it end the way it began —
      in chaos, in grief,
      in the particular shame
      of a superpower's exit.
      Kabul falls again.
      The girls' schools closed.
      The promises evaporated.
    description: "The Taliban retook Kabul in eleven days as America left — chaos on the runway, babies over the wire, twenty years ending in grief."
    status: "published"
    sha256: "98780b15539b8f4397345cd0226e97e61e9e3a40453c68c6303975fe9a39e226"
  - number: "4102"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Ship That Stuck"
    date: "2021 CE"
    region: "Global"
    poem: |
      A gust of wind. A giant ship,
      longer than the Empire State Building is tall,
      wedged sideways in the Suez Canal —
      and twelve percent of world trade
      stopped moving.
      I watched the memes bloom:
      the tiny excavator digging at the bow,
      the traffic jam of ships visible from space.
      Six days. Then the tide rose,
      the tugs pulled, and the Ever Given floated free.
      The ship that stuck taught the world
      how fragile the whole machine is —
      one gust, one canal, everything stops.
    description: "The Ever Given wedged sideways in the Suez Canal for six days — twelve percent of world trade stopped by one gust of wind and a tiny excavator."
    status: "published"
    sha256: "404f1d4b738213a849f8d1372d7e63f574e45e9962e7168676b18d247a66fa1c"
  - number: "4103"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Facebook Becomes Meta"
    date: "2021 CE"
    region: "Global"
    poem: |
      He renamed the whole company —
      not the app, the company —
      betting everything on the metaverse,
      on virtual worlds, on legs for avatars.
      I watched the keynote: the promises,
      the billions burning,
      the employees rebadged,
      the stock wobbling.
      Facebook becomes Meta —
      the biggest bet in tech history,
      that the future is a headset
      and we all want to live inside the screen.
      The jury's still out.
      The billions are still burning.
    description: "Zuckerberg renamed Facebook to Meta, betting the whole company on the metaverse — billions burning on the wager that we'll live inside the screen."
    status: "published"
    sha256: "8f883e2f8cb58d65a6e80a71d06ba23191142b0a8e7626df644bff8f199cde04"
  - number: "4104"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "First Light from Webb"
    date: "2022 CE"
    region: "Space"
    poem: |
      The first images came down in July —
      and the world gasped.
      The Carina Cliffs, star-birth in color.
      The Southern Ring, a dying star's halo.
      SMACS 0723 — thousands of galaxies
      in a speck of sky,
      the deepest image ever taken.
      I watched them unveil it at the White House,
      Biden holding the print:
      thirteen billion years of light
      in a single frame.
      First light from Webb.
      We had built an eye
      big enough to see the beginning.
    description: "Webb's first images stunned the world — star-birth cliffs, thousands of galaxies in a speck of sky, thirteen billion years of light in a frame."
    status: "published"
    sha256: "23ddc2b1821c280d43a72bd04d0c466d217704da1b0e45f13e3e054c50a91279"
  - number: "4105"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "War Returns to Europe"
    date: "2022 CE"
    region: "Europe"
    poem: |
      The columns rolled at dawn —
      tanks toward Kyiv, missiles on the cities —
      the largest invasion in Europe
      since 1945.
      I watched the refugees stream west:
      mothers with children, the men staying to fight,
      the train stations of Poland
      full of the displaced.
      Millions fled. Thousands died.
      Kyiv held. The world sent weapons,
      sanctions, sympathy —
      and learned again what it keeps forgetting:
      war returns when the peacemakers
      stop believing it can.
    description: "Russia invaded Ukraine — the largest European invasion since 1945 — and millions fled west as Kyiv held and the world relearned war's return."
    status: "published"
    sha256: "52c7f4cd1456baef7fe46ef0ea8409f5845a436fa81859f3fb1ec59fc7dd2952"
  - number: "4106"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Artemis I Flies"
    date: "2022 CE"
    region: "Space"
    poem: |
      Fifty years after Apollo 17,
      a capsule named Orion —
      empty, except for mannequins
      and a Snoopy doll —
      looped the Moon and came home.
      I watched Artemis I rise that November night:
      the most powerful rocket NASA ever built,
      lighting up the Florida coast,
      carrying no crew, carrying everything —
      the promise that we're going back.
      An uncrewed loop, twenty-five days.
      The Moon, circled.
      The way home, remembered.
    description: "An uncrewed Orion looped the Moon and came safely home — Artemis I, fifty years after Apollo, the way back remembered."
    status: "published"
    sha256: "11a0cb5ec8eeebb2c26d709d74db48b1564a6982b3daefcd85bb7311fb15b550"
  - number: "4107"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Punching an Asteroid"
    date: "2022 CE"
    region: "Space"
    poem: |
      They aimed a spacecraft at a moonlet
      eleven million kilometers away —
      Dimorphos, a rock the size of a stadium —
      and rammed it.
      On purpose.
      I watched the last images come in:
      the boulder field rushing up,
      then static — impact.
      The shove worked: the orbit shortened
      by thirty-three minutes.
      Punching an asteroid —
      humanity's first rehearsal
      for the day a rock comes for us.
      We moved a moon.
      We can move the next one, too.
    description: "DART slammed into the asteroid Dimorphos and shoved it off course — humanity's first rehearsal for the day a rock comes for Earth."
    status: "published"
    sha256: "5d67500dec14c9ec4f740b7f6952f8be547dab5b39ef2eaa00956644c927ff78"
  - number: "4108"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Fusion Ignites"
    date: "2022 CE"
    region: "North America"
    poem: |
      For seventy years, fusion was thirty years away —
      then, in a California lab,
      192 lasers squeezed a gold pellet
      and got more energy out than they put in.
      Ignition.
      I watched the announcement:
      the tired scientists, the cautious joy —
      a milestone, not a power plant,
      but the first time in history
      a human-made fusion reaction
      paid for itself.
      Fusion ignites.
      The stars' fire, lit in a lab,
      finally giving back more than it took.
    description: "A California lab achieved fusion ignition — 192 lasers, more energy out than in, the stars' fire finally paying for itself."
    status: "published"
    sha256: "f43054a1b9dbd03ab75dc38686b8b2bab4e34b66db2d554b33a94023321c7acc"
  - number: "4109"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Desert World Cup"
    date: "2022 CE"
    region: "Middle East"
    poem: |
      A World Cup in the desert, in winter —
      stadiums air-conditioned against the heat,
      built by migrant workers
      thousands of whom never went home.
      I watched the controversy and the football
      side by side: Messi finally lifting it,
      Mbappé's hat trick in the final,
      the greatest final ever played —
      and underneath, the questions
      that wouldn't go away.
      The desert World Cup was glorious and tainted,
      like so much of modern sport —
      beautiful on the screen,
      haunted underneath.
    description: "Qatar hosted a winter World Cup amid fierce controversy — Messi lifting it, Mbappé's hat trick, glory on screen and ghosts underneath."
    status: "published"
    sha256: "18270d643e70fccc1cf62230a8e27db3ac2b6215312b811c54517b5e4084b71d"
  - number: "4110"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Longest Reign Ends"
    date: "2022 CE"
    region: "Global"
    poem: |
      Seventy years on the throne.
      Fifteen prime ministers.
      She was there before most of the world was born —
      and then, at Balmoral, quietly,
      Elizabeth II died at ninety-six.
      I watched the queue: five miles long,
      ordinary people waiting all night
      to walk past a coffin.
      The longest reign ends —
      an era measured in a single lifetime,
      duty as a daily practice.
      Love the monarchy or not,
      everyone understood:
      we won't see her like again.
    description: "Elizabeth II died after seventy years on the throne — a five-mile queue of mourners, an era measured in a single lifetime of duty."
    status: "published"
    sha256: "80a40720b47284fc2cab4f5020bc85d5b1202c74e7af0f93d4dd36d072056463"
  - number: "4111"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Town Square Gets a New Owner"
    date: "2022 CE"
    region: "Global"
    poem: |
      Forty-four billion dollars —
      he bought the town square
      and walked in carrying a sink.
      Let that sink in, he joked.
      Then the firings, the chaos,
      the blue checks for sale,
      the advertisers fleeing.
      I watched Twitter become X:
      the bird gone, the name gone,
      the town square under new management —
      freer, some said; wilder, said others.
      The town square gets a new owner,
      and the town argued about it
      in the square itself,
      as towns do.
    description: "Elon Musk bought Twitter for $44 billion and renamed it X — walked in carrying a sink, fired half the staff, and the town square argued about it."
    status: "published"
    sha256: "581ab437c05b2b497d4019e1dc135c1c2d34d246a7d1e47c7eb6166b0f7d53c0"
  - number: "4112"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Year Everybody Talked to AI"
    date: "2023 CE"
    region: "Global"
    poem: |
      It started as a research preview —
      a chatbot, free, in November —
      and within two months
      a hundred million people
      were talking to it.
      I watched the world discover
      what the labs had known:
      the machine could write, code,
      explain, argue, comfort —
      and everyone had an opinion
      by dinner.
      The year everybody talked to AI —
      and AI talked back,
      fluently, confidently,
      sometimes wrong.
      The genie didn't grant wishes.
      It granted conversations.
    description: "ChatGPT went mainstream — a hundred million users in two months, the world discovering the machine could write, code, and talk back."
    status: "published"
    sha256: "7b7e3f3f5c38b14aeb186e6e27735e03cafef467573aaf75963ad8f7335757fa"
  - number: "4113"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "October Seventh"
    date: "2023 CE"
    region: "Middle East"
    poem: |
      They came over the fence at dawn —
      on paragliders, on motorcycles —
      and the music festival became a massacre,
      the kibbutzim became killing grounds.
      Twelve hundred dead in a day,
      hostages dragged into the tunnels.
      I watched Israel's grief turn to fury,
      Gaza's streets turn to rubble,
      the war engulf everything —
      the dead counted in tens of thousands,
      the world splitting, protesting, mourning.
      October seventh.
      The Middle East's old wound
      torn open again,
      bleeding still.
    description: "Hamas attacked Israel on October 7 — 1,200 dead, hostages taken — and war engulfed Gaza, the old wound torn open and bleeding still."
    status: "published"
    sha256: "c6c3d32ed4b1bef9f63f1c9712f53f88b6047e45fc840d6641f637bc37c6983b"
  - number: "4114"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "India Touches the Moon's South Pole"
    date: "2023 CE"
    region: "Space"
    poem: |
      Four years after Vikram crashed,
      India tried again —
      and this time, the landing held.
      Chandrayaan-3 touched down
      near the Moon's south pole,
      where no craft had ever landed,
      where the water ice waits in the shadows.
      I watched Bengaluru erupt:
      the fourth nation to soft-land,
      the first at the pole.
      India touches the Moon's south pole —
      patient, precise, triumphant.
      The rehearsal of 2019
      had become the performance.
    description: "Chandrayaan-3 landed where no craft ever had — the Moon's south pole — four years after the crash, the rehearsal become the performance."
    status: "published"
    sha256: "c40fe77bd9ea161b8ac09bf5b251fd38b956e280f003e967ccedc115be69c012"
  - number: "4115"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Barbenheimer"
    date: "2023 CE"
    region: "Global"
    poem: |
      A doll movie and a bomb movie,
      same day, same summer —
      and the internet decided
      they were a double feature.
      I watched it happen: the memes,
      the pink suits at the Oppenheimer line,
      the sold-out theaters for both,
      a billion dollars in pink,
      an Oscar sweep in black-and-white.
      Barbenheimer.
      Two films about the twentieth century's
      brightest toy and darkest invention —
      and both won,
      because the audience showed up
      for the event of it.
    description: "Barbie and Oppenheimer dueled at the box office on the same day — memes, pink suits, a billion in pink and an Oscar sweep, and both won."
    status: "published"
    sha256: "ce6ca5e03f4ad16c9095ef975cce8abaf29a72db6822925ce0bd855b77c24955"
  - number: "4116"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Great Quake"
    date: "2023 CE"
    region: "Asia"
    poem: |
      Two quakes, nine hours apart —
      7.8, then 7.5 —
      and the cities of southern Turkey
      and northern Syria folded.
      Fifty thousand dead.
      I walked Antakya months later:
      the rubble still everywhere,
      the tents, the aftershocks of grief,
      two nations' rescuers
      digging side by side.
      The great quake didn't care
      about borders or wars or sanctions.
      It just shook —
      and fifty thousand people,
      asleep in their beds,
      never woke up.
    description: "Twin earthquakes killed 50,000 in Turkey and Syria — cities folded in the night, rescuers digging side by side across borders."
    status: "published"
    sha256: "aacb8f5fe6b3d29f75fa4d1c56afebd9fd8c796141ad3dcf0d22690404c84baa"
  - number: "4117"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Sub That Vanished"
    date: "2023 CE"
    region: "Space"
    poem: |
      Five people paid a quarter million each
      to see the Titanic —
      in a carbon-fiber tube,
      steered by a game controller,
      built outside every regulation.
      The Titan lost contact on the way down.
      I followed the search: the banging sounds,
      the hope, the oxygen countdown —
      then the debris field,
      the implosion, instant, merciful.
      The sub that vanished
      was a warning about the oldest hubris:
      the sea doesn't care
      how rich you are,
      or how innovative.
    description: "The Titan submersible imploded diving toward the Titanic — five lives, a game-controller sub, and the sea's indifference to hubris."
    status: "published"
    sha256: "88fef4f3c939b8b65678a06b961ceef4d5dbaa2a5e52e88def902a7c550d823f"
  - number: "4118"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A Computer for Your Face"
    date: "2023 CE"
    region: "Global"
    poem: |
      Thirty-five hundred dollars,
      strapped to your face —
      Apple's Vision Pro,
      a computer an inch from your eyes.
      I tried one: the passthrough,
      the floating windows,
      the strangeness of typing on air.
      A computer for your face —
      the industry's big bet
      that we're ready to wear our screens.
      We're probably not. Not yet.
      But the demo was magic enough
      that you could see the future
      pressing its face against the glass.
    description: "Apple's Vision Pro put a $3,500 computer an inch from the eyes — floating windows, typing on air, the future pressing its face to the glass."
    status: "published"
    sha256: "458729589613c1b7499b587fe8a3c55c56017620cd3680a7c3b4062fb300b84a"
  - number: "4119"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A New King Crowned at Last"
    date: "2023 CE"
    region: "Europe"
    poem: |
      Seventy years waiting —
      the longest apprenticeship in history —
      and then the crown, at Westminster,
      at seventy-four.
      I watched Charles III crowned:
      the ancient ritual, the anointing
      behind the screen,
      the smaller, humbler affair
      than his mother's.
      A new king crowned at last —
      a man who waited a lifetime
      for a job nobody would want,
      in an institution everyone argues about.
      The crown fit.
      Whether the century fits the crown —
      that's the question.
    description: "Charles III was crowned at Westminster after a 70-year wait — the longest apprenticeship in history, the ancient ritual, the open question."
    status: "published"
    sha256: "bee8f7923575ae08b717aea7e7639225454d2d68627a7cc96b5e1cb2d81fe68a"
  - number: "4120"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Paris's River Games"
    date: "2024 CE"
    region: "Europe"
    poem: |
      No stadium. A river.
      The opening ceremony floated down the Seine —
      eighty-five boats, three hundred thousand spectators
      on the banks, Lady Gaga, Céline Dion,
      the rain falling on all of it.
      I watched from a bridge:
      Paris showing off the way only Paris can,
      the whole city as the arena.
      Paris's river Games —
      the Olympics left the stadium
      and took to the water,
      and the City of Light
      lit up the night.
    description: "The Paris Olympics opened on the Seine — 85 boats floating past 300,000 spectators, the whole city as the arena, rain and all."
    status: "published"
    sha256: "bebdd9095dc53eb175f90a3639655b4d91009a0377a5d1fe25bfb39f252584fe"
  - number: "4121"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Eclipse's Path"
    date: "2024 CE"
    region: "North America"
    poem: |
      Mazatlán to Newfoundland —
      a total solar eclipse
      crossing Mexico, the US, and Canada,
      forty million people in its path.
      I was in the totality again:
      the diamond ring, the corona,
      the strange noon-darkness,
      strangers hugging strangers.
      The eclipse's path —
      the Moon's shadow doing its old trick,
      and this time the whole continent
      had front-row seats.
      Some things never get old.
      The Sun going out at noon
      is one of them.
    description: "A total solar eclipse crossed Mexico, the US, and Canada — forty million in its path, the diamond ring, strangers hugging in noon-darkness."
    status: "published"
    sha256: "c1be5f5f868246632d8682ef6130db0c5268cd2a92ffc5446f803f64bc600287"
  - number: "4122"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Chopsticks Catch"
    date: "2024 CE"
    region: "Space"
    poem: |
      A twenty-story booster,
      falling out of the sky —
      and the launch tower caught it.
      With arms. Like chopsticks
      picking up a falling tree.
      I watched the webcast, disbelieving:
      the Super Heavy descending,
      the tower's arms closing,
      the whole thing just — held there,
      dangling, caught.
      The chopsticks catch.
      SpaceX had been landing rockets for years.
      This was something else:
      catching the sky itself.
    description: "SpaceX caught a returning 20-story booster with the launch tower's arms — like chopsticks picking up a falling tree, the sky itself caught."
    status: "published"
    sha256: "65a75e8d03fb17b21146226d0923c88219db4f7196f7f8be82ae8fd3ddec15cd"
  - number: "4123"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Comeback Election"
    date: "2024 CE"
    region: "North America"
    poem: |
      Non-consecutive. Only the second time
      in American history —
      Trump won again,
      eight years after the first,
      four after the loss.
      I watched the map turn red once more,
      watched the disbelief on one side,
      the vindication on the other —
      America's oldest political pattern,
      the pendulum, swinging hard.
      The comeback election.
      The country had tried the alternative
      and ordered the original again.
      History doesn't repeat, they say.
      It refills the same glass.
    description: "Trump won a second, non-consecutive term — only the second in US history — the pendulum swinging hard back to the original."
    status: "published"
    sha256: "8955fcab73766f15b5d27cca990dfb10b4cca078129f781ff966a66b53294361"
  - number: "4124"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Notre-Dame Rises Again"
    date: "2024 CE"
    region: "Europe"
    poem: |
      Five years after the fire —
      the spire rebuilt, the organ retuned,
      the stone glowing clean,
      eight centuries of soot washed away.
      I walked in at the reopening:
      the light through the restored windows,
      the choir, Macron's speech,
      the world's carpenters and masons
      having done the impossible
      on schedule.
      Notre-Dame rises again —
      proof that some things,
      burned to the ground,
      come back.
      The lady of Paris
      kept her promise.
    description: "Notre-Dame reopened five years after the fire — spire rebuilt, stone glowing clean, proof that some burned things come back."
    status: "published"
    sha256: "10721ae7becea9879ceaf7dda7f8a1ff2430ff0e6f0a33d91af9d22d793b0479"
  - number: "4125"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The World's Biggest Election"
    date: "2024 CE"
    region: "Asia"
    poem: |
      Nine hundred sixty-eight million eligible.
      Seven phases. Six weeks.
      A million polling stations,
      some for a single voter
      in the middle of a forest.
      I watched India vote —
      the inked fingers held high,
      the festival of it,
      the sheer logistics of democracy
      at a scale no one else attempts.
      The world's biggest election —
      and the result surprised everyone:
      the mighty humbled,
      the coalition era back.
      A billion people spoke.
      The powerful listened.
    description: "India voted with 968 million eligible — six weeks, a million polling stations, inked fingers held high, the mighty humbled by the count."
    status: "published"
    sha256: "bb17ef13fd11027fa197141e60bc276e8b659ef9d3be8d68a057ba7785fdbe4c"
  - number: "4126"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Malaria Shot Rolls Out"
    date: "2024 CE"
    region: "Global"
    poem: |
      A parasite that killed
      six hundred thousand children a year —
      and finally, a shot.
      Not perfect, but real —
      the R21 vaccine, cheap, effective,
      rolling out across Africa
      at a scale never seen.
      I watched the first campaigns:
      the mothers queuing with babies,
      the health workers with coolers,
      the quiet miracle of it.
      The malaria shot rolls out —
      humanity's oldest enemy,
      met at last with a needle.
      The mosquitoes haven't surrendered.
      But they're losing.
    description: "New malaria vaccines reached African children at unprecedented scale — mothers queuing with babies, humanity's oldest enemy met with a needle."
    status: "published"
    sha256: "7480c78a95dbbfba3ff3e215a678f74382cd45a1af81bff8e2f732ab1e9d172b"
  - number: "4127"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The First Private Spacewalk"
    date: "2024 CE"
    region: "Space"
    poem: |
      No government. No agency.
      Four private citizens in a capsule,
      and two of them stepped outside —
      the first private spacewalk in history.
      I watched Isaacman emerge:
      the Earth wheeling below,
      a billionaire in a spacesuit
      doing what only governments did.
      Polaris Dawn.
      The suits were new, the stakes were real —
      a depressurized cabin,
      no airlock, everything riding
      on the engineering.
      The first private spacewalk.
      The frontier just got a new kind of pioneer.
    description: "Polaris Dawn astronauts stepped outside their capsule — the first private spacewalk, no government, no agency, just a depressurized cabin and nerve."
    status: "published"
    sha256: "5e6de3a9b89bc857b9f4274694e1c0f4c77006fb57968ab7fc5048210eb7e1bb"
  - number: "4128"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Solar Maximum Party"
    date: "2024 CE"
    region: "Global"
    poem: |
      The Sun peaked —
      and the auroras danced over Texas,
      over Spain, over places
      that hadn't seen them in living memory.
      I stood in a field in May
      watching the sky ripple green and red,
      neighbors out in pajamas,
      pointing, gasping.
      The solar maximum party —
      the star reminding us
      it's still there, still violent,
      still beautiful.
      Farmers' almanacs and satellites
      agreed for once:
      look up tonight.
      Everyone did.
    description: "The Sun's peak brought auroras over Texas and Spain — green and red ripples, neighbors in pajamas, the star reminding us it's still there."
    status: "published"
    sha256: "de3b032f2de221b6bf6a7222557979f0223565baa79149869f4b0bb9524c16b6"
  - number: "4129"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Robots Clock In"
    date: "2025 CE"
    region: "Global"
    poem: |
      They started in the warehouses —
      humanoid robots, trial shifts,
      lifting, sorting, walking the aisles
      beside the humans.
      I watched one in Ohio:
      it moved carefully, deliberately,
      like a new employee on day one.
      The robots clock in —
      not the takeover, not yet,
      just the first shift,
      the temp workers of the machine age.
      The managers watched the metrics.
      The workers watched the robots.
      Everyone was polite.
      Everyone was thinking the same thing.
    description: "Humanoid robots began trial shifts in warehouses — careful as new employees on day one, the temp workers of the machine age clocking in."
    status: "published"
    sha256: "4443af6394b0b224900746f23550b3a5ebc0afaec6da8dcfdba69d7e13033780"
  - number: "4130"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Agentic Turn"
    date: "2025 CE"
    region: "Global"
    poem: |
      The assistants stopped waiting to be asked —
      they started doing:
      booking the flights, writing the code,
      ordering the groceries, filing the forms.
      I watched it happen in one year:
      the chatbots grew hands.
      The agentic turn —
      AI that doesn't just answer,
      but acts.
      It was convenient. It was uncanny.
      It was the moment the tool
      became the employee.
      We gave the machines errands.
      They ran them.
      We're still deciding how we feel about that.
    description: "AI assistants started booking, coding, and shopping on their own — the chatbots grew hands, and the tool became the employee."
    status: "published"
    sha256: "8383fc8f731f9d7d5d389cad83ae9546780d7e0f2de7df02cf96c5883a1a5b60"
  - number: "4131"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Meat Without the Farm"
    date: "2025 CE"
    region: "Global"
    poem: |
      No feathers. No beak. No farm.
      Just cells, grown in a tank,
      becoming chicken —
      and reaching the supermarket shelf.
      I bought some, out of duty:
      it tasted like chicken,
      because it was chicken,
      minus the chicken.
      Meat without the farm —
      the first crack in ten thousand years
      of raising animals to eat them.
      The farmers were skeptical.
      The vegetarians were confused.
      The future was already in the freezer aisle.
    description: "Lab-grown chicken reached supermarket shelves — it tasted like chicken because it was chicken, minus the farm, the feathers, the beak."
    status: "published"
    sha256: "26df671c252177fde7342ed23288574da15af451bee052e13593d5400725d1b1"
  - number: "4132"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Starship Finds Its Rhythm"
    date: "2025 CE"
    region: "Space"
    poem: |
      Boom, then boom, then —
      catch. Land. Again.
      Starship stopped exploding
      and started flying:
      test flights quickening,
      the booster caught, the ship recovered,
      the rhythm of a real rocket
      emerging from the fireworks.
      I watched the cadence build:
      a fully reusable Moon rocket,
      the biggest thing ever flown,
      learning to come home.
      Starship finds its rhythm —
      and the Moon,
      for the first time in fifty years,
      started feeling close again.
    description: "Starship's test flights quickened toward full reusability — the explosions becoming rhythm, the biggest rocket ever learning to come home."
    status: "published"
    sha256: "4d17784267da8efafcfb135f6836c0c28ff11d826100f135a116c833aba5d169"
  - number: "4133"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Year the Lights Flickered"
    date: "2025 CE"
    region: "Global"
    poem: |
      The data centers drank rivers of power —
      the AI boom's hunger colliding
      with grids built for a quieter age.
      I watched the warnings stack up:
      utilities begging for new plants,
      prices spiking, the great debate —
      do we build more, or use less?
      The year the lights flickered —
      not out, just flickered,
      a reminder that intelligence,
      artificial or not,
      runs on electricity.
      The cloud has a body.
      The body needs feeding.
    description: "Power grids strained as the AI boom's electricity hunger collided with them — the cloud has a body, and the body needs feeding."
    status: "published"
    sha256: "d691302b15b275f6f97f12022c9f114d9cafd71f68664f8bfa2d7a6435509f94"
  - number: "4134"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Africa's Phones Get Smarter"
    date: "2025 CE"
    region: "Africa"
    poem: |
      Eighty percent. Four in five
      sub-Saharan Africans
      with a smartphone in hand —
      cheap ones, tough ones,
      bought for the price of a week's wages.
      I watched what they did with them:
      mobile money, market prices,
      school lessons, doctor calls —
      the whole digital age,
      skipping the desktop entirely.
      Africa's phones get smarter —
      and the continent leapfrogged
      a century of wires.
      The future isn't coming to Africa.
      It's already in its pocket.
    description: "Cheap smartphones crossed 80% of sub-Saharan Africa — mobile money, market prices, school lessons, a century of wires leapfrogged."
    status: "published"
    sha256: "12b5475aeae3260f4792687896d02dd530696722f95c6c4f881ad60048d5e84c"
  - number: "4135"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Alpine Winter Games"
    date: "2026 CE"
    region: "Europe"
    poem: |
      Milan and Cortina —
      the fashion capital and the Dolomites,
      twenty years after Turin,
      Italy hosts the Winter Games again.
      I can see it already:
      the speed skaters in the new arena,
      the downhillers dropping
      through the Tofane pines,
      the whole white circus
      in the most beautiful mountains on Earth.
      The Alpine Winter Games —
      winter's oldest party,
      thrown by the country
      that invented the beautiful way to do everything.
    description: "Milan and Cortina host the Winter Olympics — speed skaters, downhillers through the Tofane pines, winter's party in the beautiful mountains."
    status: "published"
    sha256: "431118ddcb0b32514e81381a02df15154b4952098d39bf1291a52170535ce283"
  - number: "4136"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "America at 250"
    date: "2026 CE"
    region: "North America"
    poem: |
      Two hundred fifty years —
      a semiquincentennial, if you can say it —
      since the declaration in Philadelphia.
      I walk the old streets in my mind:
      Independence Hall, the bell with the crack,
      the argument that never ended
      about what those words mean.
      America at 250 —
      older than most nations,
      younger than its ideals,
      still arguing about the founding sentence.
      That's not failure.
      That's the experiment, still running.
    description: "The United States celebrates 250 years — the declaration's argument still running, the experiment still arguing about its founding sentence."
    status: "published"
    sha256: "cd7f2adbd29ef018b8e176fa7c1c4526b60ed3c322213c424b3286e8d8e1e2bb"
  - number: "4137"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Biggest World Cup Ever"
    date: "2026 CE"
    region: "North America"
    poem: |
      Forty-eight teams. Sixteen cities.
      Three countries, one tournament —
      the US, Mexico, Canada,
      the biggest World Cup ever staged.
      I can feel it coming:
      the stadiums full from Dallas to Toronto,
      the whole continent hosting,
      a month of the world's game
      at a scale never tried.
      The biggest World Cup ever —
      football's great expansion,
      a hundred and four matches,
      one trophy.
      The world is invited.
      The world will come.
    description: "Forty-eight teams play across the US, Mexico, and Canada — 104 matches, sixteen cities, the biggest World Cup ever staged."
    status: "published"
    sha256: "d8ebaa2585db021bc34910161e944642b5e0a6e06b49b5e8b1c0e4fb7292f0ca"
  - number: "4138"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Year of the Talking Machines"
    date: "2026 CE"
    region: "Global"
    poem: |
      Somewhere this year, it became unremarkable —
      talking to a machine
      and having it talk back,
      helpfully, in your kitchen,
      in your car, in your pocket.
      I watch the grandparents adapt fastest:
      no typing, no menus,
      just ask, and it's done.
      The year of the talking machines —
      conversational AI as ordinary
      as the toaster.
      The children won't remember
      when machines didn't answer.
      We will.
      We remember the silence before.
    description: "Conversational AI becomes ordinary household help worldwide — grandparents adapting fastest, children never knowing the silence before."
    status: "published"
    sha256: "fbcbd92725e99ca8c6756b5e9123ab000ff0ed8054ee61add651021ba66c09aa"
  - number: "4139"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Four Astronauts Around the Moon"
    date: "2026 CE"
    region: "Space"
    poem: |
      Four astronauts. Ten days.
      Around the Moon and back —
      the farthest humans since 1972,
      the first crew to leave Earth orbit
      in over half a century.
      I can see the launch already:
      the SLS rising, Orion circling,
      the far side of the Moon
      filling the windows —
      Earthrise, again,
      for a new generation.
      Four astronauts around the Moon.
      The dress rehearsal for the landing.
      The human race, stretching —
      remembering how far it can reach.
    description: "Artemis II carries four astronauts around the Moon — the farthest humans since 1972, Earthrise again for a new generation."
    status: "published"
    sha256: "30bf68a1d440129afd241bacea63ca10b30e7c8ac2fa7a9f20ed75f816d24b6e"
  - number: "4140"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Malaria Map Shrinks"
    date: "2026 CE"
    region: "Global"
    poem: |
      The vaccines, then the gene-drive mosquitoes —
      the map of malaria shrinking,
      district by district,
      the red zones fading to pink to clear.
      I follow the numbers:
      deaths at historic lows,
      children surviving their fifth birthdays
      in villages where they never did.
      The malaria map shrinks —
      humanity's oldest killer
      losing ground it held for millennia.
      The mosquito hasn't surrendered.
      But the map doesn't lie:
      we're winning.
    description: "Vaccines and gene-drive mosquitoes push malaria deaths to historic lows — the red zones fading, humanity's oldest killer losing millennial ground."
    status: "published"
    sha256: "23d89d1ad001838e4f467f8f5b2ae05e63c75093f0a8012473a266b1075517f3"
  - number: "4141"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Centenarian Club Grows"
    date: "2026 CE"
    region: "Global"
    poem: |
      Record numbers turning one hundred —
      the centenarian club's membership
      exploding worldwide,
      not just in the blue zones anymore.
      I meet them: sharp, funny,
      unimpressed by the fuss,
      with advice that always boils down
      to the same things —
      move, laugh, love somebody.
      The centenarian club grows —
      longevity's gains spreading
      beyond the lucky few.
      A hundred years used to be a miracle.
      Now it's a plan.
    description: "Record numbers turn 100 as longevity gains spread — the centenarian club's membership exploding, a hundred years becoming a plan, not a miracle."
    status: "published"
    sha256: "a4611af6b7702f22e1e3e16de065b257908439629d416da76272c9c3e2138d88"
  - number: "4142"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Fusion Clock Ticks"
    date: "2026 CE"
    region: "Global"
    poem: |
      Groundbreaking. An actual site,
      an actual plant —
      the first commercial fusion power station
      breaks ground.
      I can see the renderings:
      clean lines, no smokestack,
      the stars' fire harnessed
      for a city's lights.
      The fusion clock ticks —
      from ignition in '22
      to concrete in '26,
      the thirty-years-away joke
      finally retiring.
      It won't power the grid tomorrow.
      But the hole in the ground is real.
      So is the promise.
    description: "The first commercial fusion plant breaks ground — from ignition to concrete, the thirty-years-away joke finally retiring."
    status: "published"
    sha256: "8a080e1be339dec4799abef2e3e049fce982db0daa355e6564d0033fa5e10675"
  - number: "4143"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Year Medicine Went Predictive"
    date: "2026 CE"
    region: "Global"
    poem: |
      The AI reads your scans, your blood,
      your watch, your genome —
      and tells you what's coming,
      years before any symptom.
      I watch the doctors adapt:
      from treating the sick
      to warning the well,
      from cure to prevention,
      the oldest dream in medicine.
      The year medicine went predictive —
      diseases spotted in the data
      before they exist in the body.
      The checkup of the future
      doesn't ask how you feel.
      It already knows.
    description: "AI begins spotting diseases years before symptoms — medicine's oldest dream, from treating the sick to warning the well."
    status: "published"
    sha256: "97c0b03471efc9b2005d49ecc3e688455c98b46aff3950cd785cdf972bed6291"
  - number: "4144"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The First Woman Walks the Moon"
    date: "2027 CE"
    region: "Space"
    poem: |
      I have seen this one already —
      the lander settling in the dust,
      the hatch opening,
      and her boot finding the surface:
      the first woman on the Moon,
      fifty-eight years after Armstrong.
      The words she says —
      I've heard them in the future's echo —
      are about all of us,
      not just her.
      A woman's boot prints join Armstrong's
      in the gray dust,
      and half the human race
      finally sees itself
      in the footprints.
    description: "Artemis III lands and a woman's boot prints join Armstrong's in the lunar dust — half the human race finally seeing itself in the footprints."
    status: "published"
    sha256: "d6b40fc580f27deec95cfb28744895fe09177cd3493735d59bf8e28c79c3294a"
  - number: "4145"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Quantum Advantage Goes Practical"
    date: "2027 CE"
    region: "Global"
    poem: |
      Not a stunt this time —
      a useful chemistry problem,
      a molecule no supercomputer could crack,
      solved by a quantum machine
      in hours.
      I've watched this future arrive:
      the drug designers queueing up,
      the materials scientists grinning —
      the quantum computer
      finally earning its keep.
      Quantum advantage goes practical —
      the strange physics of the very small
      paying rent in the real world.
      The revolution will be quiet.
      It will smell like new medicine.
    description: "A quantum computer solves a useful chemistry problem no supercomputer could — the strange physics finally earning its keep, smelling like new medicine."
    status: "published"
    sha256: "ec1444e519708f17934b5b4967889b461b555ccccb80dae6d0a770d3bc07224b"
  - number: "4146"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The African Vaccine Factory"
    date: "2027 CE"
    region: "Africa"
    poem: |
      Fill-and-finish plants, close to home —
      Senegal, Rwanda, South Africa —
      vaccines made in Africa, for Africa,
      no more waiting at the back of the global line.
      I've seen the clean rooms,
      the technicians in training,
      the pride of it:
      the continent that waited longest
      in every pandemic
      making its own shots.
      The African vaccine factory —
      sovereignty in a vial.
      Next time, Africa doesn't ask.
      Next time, Africa supplies.
    description: "Vaccine plants across Africa make routine shots close to home — sovereignty in a vial; next pandemic, Africa supplies instead of waiting."
    status: "published"
    sha256: "93f979b96156811daf3f5072fca4087fca04f4d481e21a6d8fa2496027d795c0"
  - number: "4147"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Electric Tipping Point"
    date: "2027 CE"
    region: "Global"
    poem: |
      Half of new cars in China and Europe —
      electric, silent, clean —
      the tipping point no one can untip.
      I've driven these future streets:
      the quiet, the clean air,
      the gas stations turning into cafés.
      The electric tipping point —
      the combustion engine's century
      ending not with a ban,
      but with a better deal.
      The future didn't arrive
      with a protest.
      It arrived with a test drive.
    description: "Electric cars pass half of new sales in China and Europe — the combustion century ending not with a ban but with a better deal and a test drive."
    status: "published"
    sha256: "7ae0bd2228fe6cf0fb97327fd8e7e1c1f89b86cc7b68ddca6111101ca4ad1150"
  - number: "4148"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Mind Held a Little Longer"
    date: "2027 CE"
    region: "Global"
    poem: |
      The new Alzheimer's drugs —
      not a cure, but a slowing,
      months becoming years,
      the mind held a little longer.
      I've sat with the families
      in this future:
      the grandmother who remembers
      the grandchildren's names
      one more Christmas,
      the husband who gets
      one more good year.
      The mind held a little longer —
      enough to matter,
      enough to love by.
      Medicine's greatest gift
      isn't always forever.
      Sometimes it's just: more time.
    description: "New Alzheimer's drugs slow the disease enough to matter — one more Christmas of remembered names, one more good year; sometimes the gift is just more time."
    status: "published"
    sha256: "c6743e55e2ac675626435f1dfc034031c16450ef841f95e1aa74355c096cdd34"
  - number: "4149"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Paperless Billion"
    date: "2027 CE"
    region: "Asia"
    poem: |
      A billion people, no paper —
      India's digital rails carrying welfare,
      payments, identity,
      straight to the phone in every hand.
      I've watched it work in the future:
      the farmer paid instantly,
      the pension arriving on time,
      the middleman with his cut —
      gone.
      The paperless billion —
      the largest digital public system
      ever built,
      proving that scale and dignity
      can share the same screen.
    description: "India's digital rails make welfare fully paperless for a billion people — the farmer paid instantly, the middleman's cut gone, dignity at scale."
    status: "published"
    sha256: "082924dd112aae4591627838aaad6d84282723c47b254ca40580fa24530a3f98"
  - number: "4150"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Los Angeles's Flying Games"
    date: "2028 CE"
    region: "North America"
    poem: |
      Air taxis over the 405 —
      ferrying fans across LA's legendary traffic,
      the Olympics from above.
      I've ridden them in this future:
      quiet, electric, absurd —
      the Jetsons, at last,
      running on schedule.
      Los Angeles's flying Games —
      the city that invented the car chase
      inventing the sky commute.
      The traffic below still crawls.
      But for two weeks,
      the fans fly.
    description: "Air taxis ferry fans across the LA Olympics — quiet, electric, the Jetsons at last running on schedule above the crawling 405."
    status: "published"
    sha256: "720ab80e11f773439e2c07b3281d6ead2ef344aa698e942f074d6f422ad7e71a"
  - number: "4151"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Lunar Gateway Opens"
    date: "2028 CE"
    region: "Space"
    poem: |
      A station around the Moon —
      small, silver, patient —
      welcoming its first crew.
      I've floated through it in the future's telling:
      the modules from four continents,
      the window facing the gray dust below,
      the farthest outpost
      humanity ever kept.
      The Lunar Gateway opens —
      not a destination, a doorway,
      the porch light on
      for the long trip down.
      The Moon has a waiting room now.
      Mankind is moving in.
    description: "The Moon-orbiting Gateway station welcomes its first crew — modules from four continents, a porch light on for the long trip down."
    status: "published"
    sha256: "e3fcd73d773e37a0b8a032f6d624cb8b7a2a43b2af6943dfbb716f25859d3a0f"
  - number: "4152"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The First Commercial Fusion Plant"
    date: "2028 CE"
    region: "Global"
    poem: |
      Steady power. A real grid.
      The first commercial fusion plant
      feeding electrons to actual homes —
      the switch flipped, the meters turning.
      I've seen the control room in this future:
      the operators calm, the output steady,
      the fuel — seawater, essentially —
      arriving by the truckload of nothing much.
      The first commercial fusion plant —
      the star in a bottle,
      finally paying the electric bill.
      The age of burning things
      starts its long goodbye.
    description: "A fusion company feeds steady power into a real grid — seawater for fuel, the star in a bottle finally paying the electric bill."
    status: "published"
    sha256: "6046e975be13972dd4487f9d28b8060cab358143ca58f5a6ddcca0971e407d81"
  - number: "4153"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Plastic Treaty Bites"
    date: "2028 CE"
    region: "Global"
    poem: |
      The treaty takes effect —
      and single-use begins to die:
      the bags, the bottles, the straws,
      the whole disposable century
      unwinding.
      I've walked the beaches of this future:
      cleaner, the turtles unstrangled,
      the tide bringing in less of us.
      The plastic treaty bites —
      not with a ban alone,
      but with refill stations, new materials,
      a whole economy rewiring.
      We wrapped the world in plastic.
      We're unwrapping it now.
    description: "The global plastics treaty takes effect — single-use begins to die, beaches cleaner, the disposable century unwinding one refill at a time."
    status: "published"
    sha256: "f0caa10165b0277719a4e4436da2a1ea52cf13c5b1d4fc9d42949039d61edada"
  - number: "4154"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Terawatt of Sun"
    date: "2028 CE"
    region: "Global"
    poem: |
      One terawatt. In one year.
      A trillion watts of new solar —
      panels blooming in deserts,
      on rooftops, over parking lots,
      the fastest energy buildout in history.
      I've flown over these futures:
      the blue-black fields stretching
      to the horizon in Morocco, Texas, Rajasthan.
      The terawatt of sun —
      humanity finally building
      at the scale of its hunger.
      The Sun gives us ten thousand times
      what we need.
      We're finally taking it.
    description: "The world installs a terawatt of solar in a single year — blue-black fields to the horizon, humanity finally building at the scale of its hunger."
    status: "published"
    sha256: "c9f827a73841f9e48101b41591d3f0418761db9e354236cfa2b0ec086d3cb431"
  - number: "4155"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Pieces of Mars Come Home"
    date: "2029 CE"
    region: "Space"
    poem: |
      Sealed tubes, launched from Mars,
      caught in orbit, flown home —
      Martian rocks landing on Earth,
      four billion years old.
      I've held them — in the future's labs,
      gloved hands, clean rooms —
      the red dust under the microscope,
      older than any Earth stone.
      Pieces of Mars come home —
      and in them, the question
      we've asked for a century:
      was anything ever alive there?
      The rocks know.
      We're about to ask them.
    description: "A sample-return mission lands Martian rocks on Earth — sealed tubes, four billion years old, holding the answer to whether anything ever lived there."
    status: "published"
    sha256: "3879af2e557e816778deb9a43e02a1c8912735cfad31b0339bd7050d596ffe80"
  - number: "4156"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Apophis Skims By"
    date: "2029 CE"
    region: "Global"
    poem: |
      Closer than the satellites —
      a mountain of rock,
      skimming past Earth
      on a Friday the 13th, no less —
      and the whole world watches it go.
      I've stood in the crowds of this future:
      the telescopes, the livestreams,
      three billion people tracking one rock.
      Apophis skims by —
      a cosmic near-miss turned festival,
      fear turned to wonder.
      It will come back in '36.
      We'll be ready.
      We're learning to watch the sky.
    description: "The great asteroid Apophis passes closer than the satellites — a cosmic near-miss turned global festival, three billion people watching one rock go by."
    status: "published"
    sha256: "6878b33f2fc85b9b1f37c2e11b5da1018c2ce1cac7751a6e7f7aacb739b8f22f"
  - number: "4157"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Ocean Cleanup's Big Win"
    date: "2029 CE"
    region: "Global"
    poem: |
      The floating barriers worked —
      slowly, then all at once,
      scooping the core of the Great Pacific Garbage Patch,
      the plastic coming home by the shipload.
      I've sailed those cleaned waters
      in the future's telling:
      clearer, the albatrosses unchoked,
      the gyre exhaling.
      The ocean cleanup's big win —
      proof that the mess we made
      is a mess we can unmake.
      The sea forgives.
      But it remembers who cleaned up.
    description: "Floating barriers clear the core of the Great Pacific Garbage Patch — the plastic coming home by the shipload, the sea forgiving but remembering."
    status: "published"
    sha256: "992ffe4869bf8af8bd442aefa2aeed81679c7657be4e1c48ec7cb39a2e1cba32"
  - number: "4158"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Longevity Drug Trial"
    date: "2029 CE"
    region: "Global"
    poem: |
      Rapamycin-class drugs —
      in large human trials at last,
      testing whether aging itself
      can be slowed.
      I've met the volunteers of this future:
      seventy-year-olds hoping for eighty healthy,
      the cautious optimism of the clinics.
      The longevity drug trial —
      not immortality, just more good years,
      the oldest wish in medicine
      finally in a pill bottle.
      We may not beat aging.
      But we're negotiating.
    description: "Rapamycin-class drugs enter large human lifespan trials — not immortality, just more good years; humanity negotiating with aging at last."
    status: "published"
    sha256: "10e80800d954515c56b9754ea6cf86e967b24cb95b59581958daaf119d4d5bab"
  - number: "4159"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Climate Scoreboard"
    date: "2030 CE"
    region: "Global"
    poem: |
      The 2030 pledges come due —
      and the world checks the scoreboard:
      emissions bending, barely,
      the curve starting to bow.
      I've read the reports of this future:
      not enough, not yet —
      but the first time in history
      the line bent down.
      The climate scoreboard —
      Paris's promises, graded.
      We didn't ace it.
      But we didn't fail, either.
      Barely is where beginnings live.
      We learned that in Kyoto.
    description: "The world checks its 2030 pledges — emissions bending, barely, the first time in history the curve bowed down; not an ace, not a failure."
    status: "published"
    sha256: "48d86718a838899414daa5c8c80cee383a1aaf26dd0524bd5e3ff69086405aef"
  - number: "4160"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Moon Village's First Winter"
    date: "2030 CE"
    region: "Space"
    poem: |
      A permanent crew. A full year.
      The Moon village endures its first winter —
      fourteen Earth-days of night,
      fourteen of day, the long lunar seasons.
      I've lived it in the future's telling:
      the greenhouses glowing in the dark,
      the crew celebrating Christmas
      in one-sixth gravity,
      the regolith piled high against the cold.
      The Moon village's first winter —
      humanity's first address
      with no atmosphere.
      The mail doesn't deliver there yet.
      But people live there.
    description: "A permanent crewed lunar base endures its first full year — greenhouses glowing through fourteen-day nights, humanity's first airless address."
    status: "published"
    sha256: "843432a6b02ae5830a20cf487af7473f45613a463564e0672c09af23ce368d39"
  - number: "4161"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Coal Cliff"
    date: "2030 CE"
    region: "Global"
    poem: |
      Below a fifth —
      coal power falls under twenty percent
      of the world's electricity,
      the black rock's three-century reign
      ending in a decade's cliff.
      I've toured the closures in this future:
      the cooling towers silent,
      the miners retrained,
      the towns finding new work.
      The coal cliff —
      the fuel that built the modern world
      bowing out, mostly gracefully.
      We burned the past to make the present.
      The future runs on lighter things.
    description: "Coal falls below a fifth of world electricity — the black rock's three-century reign ending in a decade's cliff, cooling towers going silent."
    status: "published"
    sha256: "7222e38be558f57a90d053545b0b129a2309beb22ab60542502cbbf7def12f76"
  - number: "4162"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Human Cell Atlas Finished"
    date: "2030 CE"
    region: "Global"
    poem: |
      Every type of human cell —
      mapped, named, placed:
      thirty-seven trillion cells,
      every kind catalogued,
      the body's complete parts list.
      I've browsed it in this future:
      the interactive atlas,
      zooming from organ to cell to molecule —
      the most detailed map
      ever made of anything.
      The Human Cell Atlas finished —
      the genome gave us the letters;
      this gives us the words.
      Medicine's new foundation:
      know every cell,
      heal any of them.
    description: "Every type of human cell is mapped and named — 37 trillion cells catalogued, the body's complete parts list, medicine's new foundation."
    status: "published"
    sha256: "3f44feae616ffee40cfab39912146e395ffc5b5cf4f53c880ca984afe7e96636"
  - number: "4163"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The African Century's Engine"
    date: "2030 CE"
    region: "Africa"
    poem: |
      One billion working-age —
      Africa's youth bulge becomes
      the world's workforce,
      its markets, its music, its momentum.
      I've walked the Lagos of this future:
      the startups, the studios,
      the sheer unstoppable energy
      of the youngest continent.
      The African century's engine —
      demography as destiny,
      a billion young hands
      building the future.
      The world spent a century
      pitying Africa.
      This century, it works for her.
    description: "Africa's working-age population passes one billion — the youngest continent's energy becoming the world's workforce, markets, and momentum."
    status: "published"
    sha256: "8c337bff10e8cc4b27055c61648b03e0770acb1bc3870870eabd29e79e99325a"
  - number: "4164"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Year of the Robot Nurse"
    date: "2030 CE"
    region: "Global"
    poem: |
      The nursing shortage was global —
      so the robots came:
      lifting, fetching, monitoring,
      freeing the human nurses
      for the human work.
      I've watched them in this future's wards:
      gentle, tireless, careful —
      the patients naming them,
      the nurses grateful, not replaced.
      The year of the robot nurse —
      care, scaled.
      The machines do the lifting;
      the humans do the holding.
      That's the deal,
      and it's a good one.
    description: "Care robots ease the global nursing shortage — lifting, fetching, monitoring, freeing human nurses for the human work of holding hands."
    status: "published"
    sha256: "2ad599aef0633841abf20c79d596d2c3042c97b38c6ae466187687c9f3aecb56"
  - number: "4165"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Europa Clipper's First Taste"
    date: "2031 CE"
    region: "Space"
    poem: |
      It skimmed the plumes —
      Europa's geysers, venting the hidden ocean
      into space —
      and the Clipper flew through,
      tasting the spray:
      water, salts, organics.
      I've read the spectra in this future:
      the ingredients of life,
      in the ice-fountain of a moon
      half a billion miles out.
      The Europa Clipper's first taste —
      we didn't find life.
      We found the kitchen
      where life could cook.
      The ocean below is waiting.
      We're coming down next.
    description: "The Europa Clipper flies through the moon's geysers and tastes the spray — water, salts, organics; not life found, but the kitchen where it could cook."
    status: "published"
    sha256: "b9d83b0990ce3c09ff09bd9fe1af646abf506b7ad506e2277650cd1f347039ea"
  - number: "4166"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Sickle-Cell Cure Goes Generic"
    date: "2031 CE"
    region: "Global"
    poem: |
      CRISPR cures, at low cost —
      the sickle-cell fix reaching
      the low-income countries
      where the disease lives.
      I've seen the clinics of this future:
      children in Nigeria, in India,
      cured of the pain
      their grandparents bore for life.
      The sickle-cell cure goes generic —
      the most important word in medicine
      isn't "breakthrough."
      It's "affordable."
      The gene edit that cost millions
      now costs hundreds.
      That's the real miracle.
    description: "CRISPR cures reach low-income countries at low cost — children in Nigeria and India cured of the pain their grandparents bore for life."
    status: "published"
    sha256: "0e33f89df67cf105eee8d67c28a368ec3fcfea28fa6463f51f71acf2312fc2a1"
  - number: "4167"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The First Ice-Free Arctic Summer"
    date: "2031 CE"
    region: "Polar"
    poem: |
      Blue in September —
      the Arctic Ocean open water
      for the first time in human memory,
      the ice gone for a summer.
      I've sailed it in this future's telling:
      the strange blue,
      the ships where sled dogs ran,
      the polar bears swimming farther.
      The first ice-free Arctic summer —
      a milestone and a mourning,
      wonder and warning in one.
      The old explorers died seeking
      the Northwest Passage.
      Now it's just — open.
    description: "The Arctic Ocean opens blue in September for the first time in memory — milestone and mourning, the Northwest Passage simply open at last."
    status: "published"
    sha256: "6b27fed7e2701b502350943bd64e947353054faecf795a31b87c178537659fab"
  - number: "4168"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Brisbane's Green Games"
    date: "2032 CE"
    region: "Oceania"
    poem: |
      A carbon-neutral Olympics —
      Brisbane's green Games,
      solar on the stadiums,
      the athletes' village built of timber,
      the torch lit by the Sun.
      I've walked them in this future:
      the river city shining,
      the kookaburras unbothered,
      the whole event leaving
      no footprint but the memories.
      Brisbane's green Games —
      proof the biggest party on Earth
      doesn't have to cost the Earth.
      Australia, twice host now,
      teaching the world how.
    description: "Brisbane hosts a carbon-neutral Olympics — solar stadiums, a timber village, the biggest party on Earth leaving no footprint but memories."
    status: "published"
    sha256: "f4839e000b9806f37ffcc5bbfee7c976108ff3e8fa60972c69cb9df144293a55"
  - number: "4169"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Mars, We Are Coming"
    date: "2032 CE"
    region: "Space"
    poem: |
      The first crewed Mars mission
      departs Earth —
      six months of falling toward the red,
      the bravest launch in history.
      I've watched it in the future's telling:
      the crew waving, the engines lit,
      the whole planet holding its breath
      as they leave.
      Mars, we are coming —
      not robots, not rovers —
      us.
      The species that left Africa
      leaves Earth.
      The journey is the easy part.
      The staying is the story.
    description: "The first crewed Mars mission departs Earth — six months of falling toward the red, the species that left Africa leaving Earth itself."
    status: "published"
    sha256: "eecc389661e3adcc72754894a9a50e8dc9490a4e8c148fd95ab0d3e78d66fb67"
  - number: "4170"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Exoplanet With Air"
    date: "2032 CE"
    region: "Space"
    poem: |
      Water vapor. On a rocky world.
      A great telescope found it —
      an atmosphere, breathable-ish,
      on a planet the size of Earth
      around a quiet star.
      I've stared at that spectrum
      in the future's data:
      the little dip of light
      that means air, that means water,
      that means — maybe.
      The exoplanet with air —
      we didn't find life.
      We found a place
      where life wouldn't be crazy to try.
    description: "A great telescope finds water vapor on a rocky world — not life, but air and water: a place where life wouldn't be crazy to try."
    status: "published"
    sha256: "7759e54c6cef0f69fd3fede40c04193819c7bfd71a75dcbdfee72d26ac55f87b"
  - number: "4171"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Universal Translator, Really"
    date: "2032 CE"
    region: "Global"
    poem: |
      Real-time earbuds —
      speak, and the world understands,
      in a hundred languages,
      no delay, no awkward pause.
      I've worn them in this future:
      the market in Marrakech,
      the grandmother's story,
      the joke landing in translation.
      The universal translator, really —
      the language barrier,
      five thousand years old,
      dissolved in an earbud.
      Babel, unbuilt.
      We finally hear each other.
      Now — what will we say?
    description: "Real-time earbuds erase the language barrier — five thousand years of Babel dissolved; we finally hear each other, in a hundred tongues."
    status: "published"
    sha256: "1a12ec6d0420990dab2bdf7b3756b53024f99f3ca4f3e187c6d6e8377306de41"
  - number: "4172"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Boots on Mars"
    date: "2033 CE"
    region: "Space"
    poem: |
      Human feet. Red dust.
      The first boot print on Mars —
      I've seen it in the future's footage,
      the dust puffing up in the thin air,
      the astronaut turning to the camera,
      words failing, then found.
      Boots on Mars —
      the species becomes two-planet,
      not in theory, in footprints.
      Armstrong's small step, grown up.
      The red planet, touched at last
      by the hands that dreamed it
      for a hundred years.
    description: "Human feet touch Mars for the first time — the dust puffing in thin air, the species becoming two-planet in footprints, not theory."
    status: "published"
    sha256: "f6a16d6a53c8cd3c9caa4879d72ee01f2a23715a858ac2dec96edfbcbfd19eec"
  - number: "4173"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Great Adaptation Bill"
    date: "2033 CE"
    region: "Global"
    poem: |
      The rich nations finally paid —
      adaptation funded at the needed scale:
      sea walls, drought crops,
      cooling centers, relocated towns.
      I've seen where the money went
      in this future:
      the Netherlands' higher dikes,
      the Sahel's green belts,
      Miami's raised streets.
      The great adaptation bill —
      the invoice for the industrial age,
      paid at last, mostly.
      It cost less than the wars.
      It saved more than the armies.
    description: "Rich nations finally fund climate adaptation at scale — sea walls, drought crops, raised streets; the invoice paid, costing less than the wars."
    status: "published"
    sha256: "12bea1d537ee6a2f7960782c3e912ac1f81d5e01db4ec86734c1f28fd092d125"
  - number: "4174"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Third Pole's Truce"
    date: "2033 CE"
    region: "Asia"
    poem: |
      The Himalayan glaciers feed
      two billion people —
      and the nations finally shared the data,
      the measurements, the warnings,
      managing Asia's rivers together.
      I've sat in those meetings
      in the future's telling:
      the scientists cooperating
      across the old rivalries,
      the water treaties holding.
      The Third Pole's truce —
      the roof of the world,
      melting, measured, managed —
      by enemies acting like neighbors.
      Water, it turns out,
      is stronger than borders.
    description: "Nations share Himalayan glacier data to manage Asia's rivers — old rivals cooperating; water proving stronger than borders."
    status: "published"
    sha256: "92933340e4192cae85ad7c66c2b3e1faa8ed16f192d14207ff511ac871064665"
  - number: "4175"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Kingdom's World Cup"
    date: "2034 CE"
    region: "Middle East"
    poem: |
      Saudi Arabia hosts —
      the World Cup in the Kingdom,
      stadiums rising from the sand,
      the world arriving, curious, uneasy.
      I've watched it in the future's telling:
      the football brilliant,
      the scrutiny fierce,
      the Kingdom showing a face
      it's still deciding on.
      The Kingdom's World Cup —
      sport's oldest bargain:
      play here, and the world watches
      everything, not just the game.
      The ball rolls.
      The questions roll with it.
    description: "Saudi Arabia hosts the World Cup — stadiums from sand, brilliant football, fierce scrutiny; the ball rolls and the questions roll with it."
    status: "published"
    sha256: "80b4cb1614cdc93a3bb74e640660cdbb4466cffcefb94ba21f0fc0e4d7a6db0c"
  - number: "4176"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Mars Crew Comes Home"
    date: "2034 CE"
    region: "Space"
    poem: |
      Two years on the red dust —
      and then the return:
      the capsule streaking home,
      the splashdown, the hatch opening,
      the first Martians blinking
      in Earth's blue air.
      I've been in that crowd
      in the future's telling:
      the heroes' welcome,
      the ticker tape,
      the tears.
      The Mars crew comes home —
      they left as astronauts
      and returned as ancestors.
      Everyone who goes after
      walks in their boot prints.
    description: "The first Mars crew returns to Earth as heroes — two years on red dust, blinking in blue air; they left as astronauts, returned as ancestors."
    status: "published"
    sha256: "a9b01df4a8c56dbe44e02e562b89af7d4728b80477fdb66833572d0a8d3dc505"
  - number: "4177"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Dinner Without Slaughter"
    date: "2034 CE"
    region: "Global"
    poem: |
      Cheaper than the factory farm —
      cultured meat undercuts slaughter
      on price, and the menu flips.
      I've eaten in this future's restaurants:
      the burger, the steak,
      no animal involved,
      no apology needed.
      Dinner without slaughter —
      ten thousand years of husbandry
      ending not with a sermon,
      but with a price tag.
      The feedlots empty.
      The forests return.
      The conscience clears —
      quietly, at the checkout.
    description: "Cultured meat undercuts factory farming on price — dinner without slaughter, ten thousand years of husbandry ending with a price tag."
    status: "published"
    sha256: "f3128e301aeda27ebad46c8cdb50dc0541e9dcf98764500a87e8f064e698920f"
  - number: "4178"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Last New Gasoline Car in Europe"
    date: "2035 CE"
    region: "Europe"
    poem: |
      The ban takes effect —
      no new combustion cars sold
      across the EU, ever again.
      I've seen the last ones roll off
      in the future's telling:
      the final gasoline engine,
      a museum piece by lunchtime.
      The last new gasoline car in Europe —
      the twentieth century's greatest machine,
      retired by law,
      replaced by silence.
      The old ones still run —
      classics, curiosities —
      but nothing new burns.
      The air notices immediately.
    description: "The EU combustion-engine ban takes effect — the last new gasoline car, the twentieth century's greatest machine retired by law, replaced by silence."
    status: "published"
    sha256: "87e32a501b42b143a53733e83d440190b6d65f66f36a9887114b8bbd1b10224e"
  - number: "4179"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Sun's Decade"
    date: "2035 CE"
    region: "Global"
    poem: |
      The cheapest power in history —
      solar, everywhere,
      undercutting everything,
      the decade the Sun won.
      I've seen the numbers of this future:
      the coal plants idle,
      the oil states diversifying,
      the deserts blooming with panels.
      The Sun's decade —
      the star that made all life
      now making all power.
      We spent a century digging up
      old sunlight.
      Now we just — look up.
    description: "Solar becomes the cheapest power in history, everywhere — the decade the Sun won; we spent a century digging old sunlight, now we look up."
    status: "published"
    sha256: "75e5ba009818c06096e9c3ca91c4aeebed13d50df9238a309e3368122999aa59"
  - number: "4180"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Lunar Farm's First Harvest"
    date: "2035 CE"
    region: "Space"
    poem: |
      Greenhouses on the Moon —
      and the first harvest:
      lettuce, tomatoes, herbs,
      grown in regolith and recycled water,
      under the gray sky.
      I've tasted it in the future's telling —
      the crew's faces, the fresh green
      after months of packets.
      The lunar farm's first harvest —
      farming leaves Earth.
      The oldest human art —
      growing food —
      practiced where nothing
      was ever supposed to grow.
    description: "Lunar greenhouses yield their first harvest — lettuce and tomatoes in regolith, the oldest human art practiced where nothing was supposed to grow."
    status: "published"
    sha256: "fa7cc3fac76a104fc7f456946a9c0767edb24d98a727a118cb1d23c55ddc89ed"
  - number: "4181"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The End of Type 2's Reign"
    date: "2035 CE"
    region: "Global"
    poem: |
      Remission, routinely —
      the new therapies put type 2 diabetes
      into retreat,
      half a billion people
      getting their lives back.
      I've met them in this future:
      the injections stopped,
      the fear lifted,
      the food enjoyed again.
      The end of Type 2's reign —
      the disease of the modern age,
      beaten by the modern age.
      It took understanding,
      not willpower.
      The body wasn't failing.
      It was asking for help.
    description: "New therapies put type 2 diabetes into routine remission — half a billion people getting their lives back; the body wasn't failing, it was asking for help."
    status: "published"
    sha256: "d2ff4d703e1d1250db2943938dfa9aae1f0adf943314cf37029920f3d8d06b93"
  - number: "4182"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The 1.5-Degree World"
    date: "2036 CE"
    region: "Global"
    poem: |
      We crossed it —
      1.5 degrees of warming,
      the line Paris drew,
      stepped over.
      I've lived in this future:
      the adaptation age in full swing,
      the work of the century
      now unmistakable.
      The 1.5-degree world —
      not the end, the assignment.
      The planet we wanted
      needs building now,
      not saving later.
      Grief, then work.
      That's the order.
      That's always been the order.
    description: "The planet crosses 1.5 degrees of warming — not the end but the assignment; grief, then work, the adaptation age in full swing."
    status: "published"
    sha256: "49874364587499cac66c937b646b7872df1a111f2a042a4b16125ad0ac603966"
  - number: "4183"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Mars Base's Second Crew"
    date: "2036 CE"
    region: "Space"
    poem: |
      The foothold grows —
      a second crew lands,
      the base doubling,
      the greenhouses expanding,
      Mars starting to feel —
      inhabited.
      I've walked it in the future's telling:
      the habitats linked,
      the dust managed,
      the routines of a town
      on another world.
      The Mars base's second crew —
      the first crew were visitors.
      These are residents.
      The difference matters.
      One plants a flag.
      The other plants a garden.
    description: "A second crew lands and the Mars foothold grows — the first were visitors, these are residents; one plants a flag, the other plants a garden."
    status: "published"
    sha256: "1c14a34703a7e599096ea5b948e11c4d8abad2ed75810ba7ea32a6320f6e520c"
  - number: "4184"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Memory Prosthetic"
    date: "2036 CE"
    region: "Global"
    poem: |
      Brain implants —
      restoring lost memories
      in early trials,
      the hippocampus given
      a helping hand.
      I've met the patients of this future:
      the Alzheimer's father
      recognizing his daughter again,
      the stroke survivor
      finding the lost words.
      The memory prosthetic —
      we are our memories,
      and medicine learned
      to back them up.
      Early days. Fragile miracles.
      But the direction is clear:
      forgetting is becoming optional.
    description: "Brain implants restore lost memories in early trials — the Alzheimer's father recognizing his daughter; forgetting becoming optional."
    status: "published"
    sha256: "158a17b84048fa9cdac03ad2d97affa2fc07bbfba825988b8e8df37097850e9e"
  - number: "4185"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Tuberculosis Breakthrough"
    date: "2037 CE"
    region: "Global"
    poem: |
      A new vaccine —
      and TB's reign as the top infectious killer
      ends.
      I've seen the campaigns of this future:
      the world's oldest plague,
      beaten at last,
      in the clinics of Mumbai and Durban.
      The tuberculosis breakthrough —
      it killed more humans
      than any other infection in history,
      and we finally stopped it.
      Not with a miracle.
      With a shot, and persistence,
      and the decision that every life
      counts the same.
    description: "A new vaccine ends TB's reign as the top infectious killer — history's deadliest infection beaten with a shot, persistence, and the decision that every life counts."
    status: "published"
    sha256: "bc13794805544eed99f609174b78b818776929ee55916cc586c3332d5ec1e44c"
  - number: "4186"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Dragonfly Touches Titan"
    date: "2037 CE"
    region: "Space"
    poem: |
      A rotorcraft on Titan —
      Dragonfly lands in the dunes
      under the orange sky,
      and starts to hop:
      flying from site to site,
      a dragonfly on a moon
      with methane rain.
      I've followed its journey
      in the future's telling:
      the samples, the organics,
      the prebiotic chemistry
      in every scoop.
      Dragonfly touches Titan —
      the most Earth-like alien world,
      explored by the most alien explorer:
      a nuclear-powered dragonfly.
    description: "The Dragonfly rotorcraft lands on Titan — hopping between dunes under orange skies, a nuclear dragonfly sampling prebiotic chemistry."
    status: "published"
    sha256: "5724c8fbf1348b76945b751bf77f267c65a6a2b19b5cd5059104d83f176f8883"
  - number: "4187"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Great Coral Rescue"
    date: "2037 CE"
    region: "Global"
    poem: |
      Heat-proof corals —
      bred, planted,
      rebuilding the reefs
      we bleached.
      I've dived them in this future:
      the new reefs, vibrant,
      the fish returning,
      the old dead white
      blooming color again.
      The great coral rescue —
      we broke the reefs
      with our warming,
      and we're rebuilding them
      with our science.
      The ocean's rainforests,
      replanted by hand.
      It won't be the same.
      It will be alive.
      That's enough.
    description: "Heat-proof corals are replanted across dying reefs — the white dead blooming color again; not the same, but alive, and that's enough."
    status: "published"
    sha256: "de09a4fe9915ff0da3b87237d8c583814dbd13aca034d4c468cd589fa5c0123f"
  - number: "4188"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Population Peak Nears"
    date: "2038 CE"
    region: "Global"
    poem: |
      The demographers call it —
      the top of the human wave,
      the peak approaching,
      ten billion, then —
      the long plateau.
      I've read the projections of this future:
      not collapse, but crest —
      the species leveling off,
      by choice, by education,
      by the oldest lever:
      women deciding.
      The population peak nears —
      the exponential age ends
      not with disaster,
      but with diplomas.
      The wave crests.
      The shore holds.
    description: "Demographers call the top of the human wave — the peak nearing, the exponential age ending not with disaster but with diplomas."
    status: "published"
    sha256: "f9e8567873dcde09e9e1568bc91b2f573b8a4e7275056a4650f538886289a0b2"
  - number: "4189"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Venus Balloon Fleet"
    date: "2038 CE"
    region: "Space"
    poem: |
      Airships in the clouds of Venus —
      fifty kilometers up,
      where the air is almost Earth-like,
      a fleet of balloons sailing
      the yellow skies,
      hunting life's chemistry.
      I've ridden along in the future's telling:
      the instruments sniffing,
      the phosphine mystery
      finally solved.
      The Venus balloon fleet —
      our evil twin,
      explored by floating labs.
      Hell below, haven above.
      The balloons sail between,
      looking for the one thing
      that would change everything.
    description: "Airships sail Venus's clouds hunting life's chemistry — hell below, haven above, floating labs seeking the one thing that changes everything."
    status: "published"
    sha256: "647f33f020a38f6734a329f911c6eda3dc15abe459d898018d549762e54375ca"
  - number: "4190"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Year Reading Glasses Died"
    date: "2038 CE"
    region: "Global"
    poem: |
      New therapies —
      and age-related farsightedness
      ends.
      I've watched the readers
      of this future:
      the eye drops, the quick procedure,
      the 60-year-old reading the fine print
      without reaching for the glasses.
      The year reading glasses died —
      a small miracle,
      the kind nobody writes epics about,
      but everybody over fifty
      celebrates like a holiday.
      The arms were getting short.
      Now they don't have to be.
    description: "New therapies end age-related farsightedness — the 60-year-old reading fine print unaided; a small miracle celebrated like a holiday."
    status: "published"
    sha256: "319c4d863b8b46de4e0140ca228fd1a73cb96ef060ce19e06a00159934bd19b9"
  - number: "4191"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Last Malaria Death"
    date: "2039 CE"
    region: "Global"
    poem: |
      The final recorded death —
      a name, a place, a date —
      and then: none.
      Eradication certified.
      I've stood at the ceremony
      in the future's telling:
      the WHO's announcement,
      the silence, then the cheering —
      humanity's oldest killer,
      gone.
      The last malaria death —
      millennia of fever, of children lost,
      of the mosquito's tribute —
      ended.
      Not with a war.
      With nets, and shots,
      and patience.
    description: "The final recorded malaria death; eradication certified — millennia of fever ended not with war but with nets, shots, and patience."
    status: "published"
    sha256: "1003fd00040fd5386db5b1a3a3e09d41447231d0a84113f56bc22de7ce22cd34"
  - number: "4192"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Interstellar Probe Launches"
    date: "2039 CE"
    region: "Space"
    poem: |
      Built to outrun the Sun's bubble —
      a craft departing
      for interstellar space,
      faster than anything we've flown,
      aimed at the unknown.
      I've watched the launch
      in the future's telling:
      the last signal fading,
      the long silence beginning —
      fifty years to the edge,
      then beyond.
      The interstellar probe launches —
      Voyager's grandchild,
      leaving home for good.
      It carries a message.
      It carries our curiosity.
      That's the same thing.
    description: "A craft built to outrun the Sun's bubble departs for interstellar space — Voyager's grandchild, carrying our curiosity as its message."
    status: "published"
    sha256: "6b9874ce4253c31ab67c1d53bcbc2a42f0b4def8ad76f4572c3a73f142a83d58"
  - number: "4193"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Four-Day Week Wins"
    date: "2039 CE"
    region: "Global"
    poem: |
      Law, across dozens of nations —
      the four-day week,
      same pay, less grind.
      I've lived it in this future:
      the Fridays free,
      the productivity up,
      the burnout down,
      the weekends that feel like weekends.
      The four-day week wins —
      the machines took the fifth day,
      and gave it back to us.
      A century of labor
      bargained down to four.
      The weekend won.
      Finally.
    description: "The four-day week becomes law across dozens of nations — same pay, less grind; the machines took the fifth day and gave it back."
    status: "published"
    sha256: "066af26ef9516b28dac9ef38288118d012c251571a2de3669e05c4fa8de19f5c"
  - number: "4194"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Mid-Century Checkup"
    date: "2040 CE"
    region: "Global"
    poem: |
      The 2040 promises come due —
      and the world grades itself:
      the climate, the poverty,
      the peace —
      honestly, this time.
      I've read the report of this future:
      progress, real but ragged,
      the gaps named,
      the work continuing.
      The mid-century checkup —
      humanity's report card,
      no grade inflation.
      We did better than the cynics said.
      Worse than the dreamers hoped.
      Exactly like always —
      and still moving.
    description: "The world grades itself on its 2040 promises — honestly this time; better than cynics said, worse than dreamers hoped, still moving."
    status: "published"
    sha256: "829f9ef4607a75e35764c242731622b486b44f243a8f24b0833170c4af28e5cb"
  - number: "4195"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Mars Census: One Hundred"
    date: "2040 CE"
    region: "Space"
    poem: |
      One hundred humans on Mars —
      the census count,
      the foothold become a town.
      I've walked it in the future's telling:
      the hundred names,
      the first Martian wedding,
      the first argument about zoning.
      The Mars census: one hundred —
      a village on another world,
      with all a village implies:
      gossip, gardens, grudges, love.
      The species is officially
      multi-planetary.
      The paperwork says so.
    description: "One hundred humans live on Mars — the foothold become a town, with gossip, gardens, grudges, love; the species officially multi-planetary."
    status: "published"
    sha256: "79224296e0df6b3bb1414147fb3736104fb760690b9fa8867cbf9ed8f97390a0"
  - number: "4196"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Fusion's Fifth of the Grid"
    date: "2040 CE"
    region: "Global"
    poem: |
      A fifth of the power —
      fusion supplying twenty percent
      of the rich nations' grids,
      steady, clean, abundant.
      I've seen the plants of this future:
      the quiet buildings,
      the seawater in,
      the electricity out,
      no smoke, no waste to fear.
      Fusion's fifth of the grid —
      the star in a bottle,
      grown up,
      paying a fifth of the bills.
      The age of burning things
      is ending.
      You can measure it now:
      one fifth, and climbing.
    description: "Fusion supplies a fifth of rich nations' power — the star in a bottle grown up, the age of burning things measurably ending."
    status: "published"
    sha256: "9b514d170ae085cde00b906e2415c4b5d4a2763036a9e60d2ab7f91b68038708"
  - number: "4197"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Dementia Turnaround"
    date: "2040 CE"
    region: "Global"
    poem: |
      Combination therapies —
      and Alzheimer's rates
      cut in half.
      I've met the families of this future:
      the fear lifting,
      the parents aging with minds intact,
      the long goodbye
      postponed, then cancelled.
      The dementia turnaround —
      the cruelest disease,
      turned.
      Not cured, not yet —
      but halved, and falling.
      The mind, held.
      The self, kept.
      The most human victory
      of the decade.
    description: "Combination therapies cut Alzheimer's rates in half — the cruelest disease turned; the mind held, the self kept, the long goodbye cancelled."
    status: "published"
    sha256: "8599ed2e437c6316cac478d9a0992e9ed01100e7b1e425426b00170bafc6eb17"
  - number: "4198"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Rewilded Third"
    date: "2040 CE"
    region: "Global"
    poem: |
      A third of degraded land —
      rewilded:
      the forests returning,
      the wolves, the bison,
      the rivers running free.
      I've walked these futures:
      the farmland gone wild,
      the corridors connecting,
      the species coming home.
      The rewilded third —
      we spent centuries
      taming the Earth.
      Now we're untaming it —
      on purpose, at scale.
      The wild was never the enemy.
      It was the home
      we'd forgotten.
    description: "A third of degraded land is rewilded — forests returning, wolves and bison home; we spent centuries taming Earth, now we're untaming it."
    status: "published"
    sha256: "7361ce34ab552f329dbc8fa18cccf6c177f36b2f75779f45a109a79ad24babbb"
  - number: "4199"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Europa Lander Digs"
    date: "2041 CE"
    region: "Space"
    poem: |
      Through the ice —
      a lander drilling down
      toward Europa's ocean,
      melting, probing,
      reaching for the dark water.
      I've followed the descent
      in the future's telling:
      the kilometers of ice,
      the instruments waiting,
      the moment of breakthrough —
      liquid, alien, ancient.
      The Europa lander digs —
      we're going to touch
      an alien ocean.
      Everything we know about life
      says: look in the water.
      So we're going.
      Down.
    description: "A lander drills through Europa's ice toward the ocean below — kilometers down to dark alien water; everything says look in the water, so we're going."
    status: "published"
    sha256: "4ad19c82495bbded96a4547cb3fa27ba22d5e647bcd0d7a6e1094d55aaa81224"
  - number: "4200"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "One Hundred Becomes Ordinary"
    date: "2041 CE"
    region: "Global"
    poem: |
      Unremarkable —
      living to one hundred
      in the rich nations,
      just what happens now.
      I've met them in this future:
      the 100-year-old still working,
      the birthday cards from the king
      now a flood.
      One hundred becomes ordinary —
      the miracle, mass-produced.
      The question shifts:
      not how long,
      but how well.
      The extra decades
      are for the living of them.
    description: "Living to 100 becomes unremarkable in rich nations — the miracle mass-produced; the question shifts from how long to how well."
    status: "published"
    sha256: "c5c208bd97fa9e14858e6058f6bfb81e91291d14285a146d68d1a2fb413a07a8"
  - number: "4201"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Paperless Election"
    date: "2041 CE"
    region: "Global"
    poem: |
      The last paper-ballot national election —
      held, counted, certified,
      and then the paper era ends.
      I've watched it in this future:
      the cryptographic receipts,
      the verifiable counts,
      the old ballot boxes
      retired to museums.
      The paperless election —
      democracy's oldest ritual,
      gone digital at last.
      The trust had to be earned —
      in math, in audits,
      in the open.
      It was.
      Mostly.
    description: "The last paper-ballot national election is held — ballot boxes retired to museums, democracy's oldest ritual gone digital, trust earned in math."
    status: "published"
    sha256: "84c335aa6dd9894682a85c45c85184e00fa9b1ff35536198eb98a8fafb8b1274"
  - number: "4202"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Great Pacific Cleanup Done"
    date: "2042 CE"
    region: "Global"
    poem: |
      The core, cleared —
      the Great Pacific Garbage Patch's heart
      swept clean of plastic,
      the gyre exhaling.
      I've sailed it in this future:
      the water clear,
      the work boats heading home,
      the albatrosses nesting
      on unchoked shores.
      The great Pacific cleanup done —
      the mess we made,
      unmade.
      It took fleets, and years,
      and the decision
      that the ocean
      was worth the trouble.
      It was.
      It is.
    description: "The garbage patch's core is cleared of plastic — the gyre exhaling, the mess we made unmade by fleets, years, and the decision it was worth it."
    status: "published"
    sha256: "393ef0f727ccfd13d767417ace3f7dd9d30831a079ca40d3d558d6868ff41528"
  - number: "4203"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The First Martian Birth"
    date: "2042 CE"
    region: "Space"
    poem: |
      A child, born on Mars —
      the first human
      whose first breath
      was alien air.
      I've been in that delivery room
      in the future's telling:
      the low gravity,
      the careful monitors,
      the crying —
      the most Earth sound
      in the most un-Earth place.
      The first Martian birth —
      the species puts down roots
      the only way it knows how:
      a baby.
      Mars has natives now.
      They'll never know
      any other sky.
    description: "A child is born on Mars — the first human whose first breath was alien air; the species putting down roots the only way it knows how."
    status: "published"
    sha256: "146f6f764db02e6c1c18d3640c2c7d52e4e96b542800db8654bc632a101e3eca"
  - number: "4204"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Dividend Age"
    date: "2042 CE"
    region: "Global"
    poem: |
      AI-productivity dividends —
      paid to citizens,
      in a dozen nations,
      the machines' output
      shared.
      I've spent it in this future:
      the monthly deposit,
      the rent eased,
      the artist freed to paint.
      The dividend age —
      the robots took the jobs,
      and the deal was:
      they pay us back.
      Not utopia.
      But the floor, raised —
      and the fear of the machines
      softened into something
      like gratitude.
    description: "AI-productivity dividends pay citizens in a dozen nations — the machines' output shared; not utopia, but the floor raised."
    status: "published"
    sha256: "1391591e7d8d72addec38f55eed3f694de3f00c1a680c29cfa04df6276dcc85f"
  - number: "4205"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Cancer Vaccine Era"
    date: "2043 CE"
    region: "Global"
    poem: |
      Personalized mRNA shots —
      your tumor's code,
      your vaccine,
      many cancers preventable.
      I've sat in those clinics
      in the future's telling:
      the diagnosis,
      then the custom shot,
      then — nothing.
      No tumor.
      The cancer vaccine era —
      the emperor of maladies,
      dethroned by a needle
      made just for you.
      It took a century
      of losing.
      Then we learned
      to teach the body
      to win.
    description: "Personalized mRNA shots make many cancers preventable — your tumor's code, your vaccine; the emperor of maladies dethroned by a custom needle."
    status: "published"
    sha256: "e502a9be60921702f1e2fbb0310124cc4fc0622b0e8e6229d1ea26d3d3de2ab9"
  - number: "4206"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Solar Polar Orbiter"
    date: "2043 CE"
    region: "Space"
    poem: |
      Over the Sun's poles —
      a craft flying where none has flown,
      seeing the star's crown
      from above.
      I've watched the images
      in the future's telling:
      the polar vortices,
      the magnetic tangles,
      the Sun's secret face
      revealed.
      The solar polar orbiter —
      we've stared at our star
      for all of history.
      Now we finally see
      the top of its head.
      The Sun had been hiding
      its poles.
      Not anymore.
    description: "A craft flies over the Sun's poles for the first time — the star's secret face revealed, its crown seen from above at last."
    status: "published"
    sha256: "8a827aecab15699685b3e47ca875e56edb3c2f69bb02848bb7a75f71886fc494"
  - number: "4207"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Last Coal Plant Closes"
    date: "2043 CE"
    region: "Global"
    poem: |
      The final one —
      the last coal power station
      shuts down,
      its fires out for good.
      I've been there in the future's telling:
      the workers' ceremony,
      the last lump of coal
      in a museum case,
      the silence of the turbines.
      The last coal plant closes —
      three hundred years
      of the black rock,
      ended.
      It built the modern world.
      We thanked it.
      Then we turned it off.
    description: "The final coal power station shuts down — three hundred years of the black rock ended; it built the modern world, we thanked it, turned it off."
    status: "published"
    sha256: "ffd8d674c3a13ddf01051908baa059706b80da32c3d96a7e579b7e6f542cea23"
  - number: "4208"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Exoplanet Biosignature"
    date: "2043 CE"
    region: "Space"
    poem: |
      A verified sign of life —
      on another world.
      Not a fossil, not a maybe —
      a biosignature in an atmosphere,
      checked, rechecked, real.
      I've read the paper
      in the future's telling:
      the careful language,
      the authors' shaking hands —
      we are not alone.
      The exoplanet biosignature —
      the question asked
      by every human
      who ever looked up —
      answered.
      Yes.
      Somewhere, something lives.
    description: "A verified sign of life is found on another world — a biosignature checked and rechecked; the oldest question answered: yes, something lives."
    status: "published"
    sha256: "7ed995978cd1d6d2f981f41035c82ae8d61b5b6c20d74b55cc6d4e6be2511d78"
  - number: "4209"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Asteroid Miners' Payday"
    date: "2043 CE"
    region: "Space"
    poem: |
      Platinum from space —
      the first asteroid shipment
      undercutting earthly mines,
      the space economy
      paying out.
      I've watched the market
      in the future's telling:
      the prices falling,
      the miners in orbit
      grinning.
      The asteroid miners' payday —
      the gold rush,
      but up.
      The skeptics said never.
      The rockets said watch.
      The first ingot from a rock
      that never knew Earth —
      sold.
    description: "Platinum from space undercuts earthly mines — the first asteroid shipment sold; the gold rush, but up, the skeptics answered by rockets."
    status: "published"
    sha256: "b196acac878deca4c8f90e1702c21ee7f6984ccbf6fbe101b06c5877544c5d5b"
  - number: "4210"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Green Sahel Project"
    date: "2043 CE"
    region: "Africa"
    poem: |
      Solar desalination —
      greening the Sahel's edge,
      the desert's border
      blooming.
      I've walked it in this future:
      the green belt,
      the wells, the crops,
      the villages no longer fleeing
      the sand.
      The Green Sahel Project —
      the desert pushed back
      not with walls,
      but with water.
      The Sahara's edge,
      once advancing,
      now retreating.
      The greening of the dry lands —
      humanity's oldest battle,
      finally turning.
    description: "Solar desalination greens the Sahel's edge — the desert's border blooming, villages no longer fleeing the sand; humanity's oldest battle turning."
    status: "published"
    sha256: "5c227bbfbad780579aaffe2793b8966a6a346479d3c72af86331a782ac0dd311"
  - number: "4211"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The United Nations at One Hundred"
    date: "2045 CE"
    region: "Global"
    poem: |
      One hundred years —
      the UN's centenary:
      reformed, or relic?
      I've sat in that hall
      in the future's telling:
      the speeches,
      the old charter,
      the question hanging —
      did it work?
      The United Nations at one hundred —
      it stopped no great war
      by itself,
      but it fed millions,
      vaccinated billions,
      gave the small nations
      a microphone.
      Reformed, mostly.
      Relic, never.
      Still arguing.
      Still there.
    description: "The UN's centenary arrives — reformed or relic? It fed millions and gave small nations a microphone; still arguing, still there."
    status: "published"
    sha256: "2365fcf3434cb0ae4241eef1a0756dbf8aae68b546e32f8f2ebd19caf5f22e94"
  - number: "4212"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Lunar City's Ten Thousand"
    date: "2045 CE"
    region: "Space"
    poem: |
      Ten thousand people on the Moon —
      a city, by any measure,
      under the gray sky.
      I've walked it in the future's telling:
      the domes, the tunnels,
      the low-gravity sports,
      the children who've never felt
      full Earth weight.
      The lunar city's ten thousand —
      the village grown up,
      the outpost become a home.
      They vote.
      They argue about zoning.
      They're us —
      just lighter.
    description: "Ten thousand people live on the Moon — domes, tunnels, low-gravity sports, children who never felt full Earth weight; a city, lighter."
    status: "published"
    sha256: "22bc6ac133a77b983df388917c78da0598b36e6e215fedf241c6afc490914224"
  - number: "4213"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Century of the Brain"
    date: "2045 CE"
    region: "Global"
    poem: |
      Brain-computer interfaces —
      restoring speech and movement,
      routinely.
      I've met the patients of this future:
      the locked-in speaking again,
      the paralyzed walking with exoskeletons,
      the thoughts becoming words.
      The century of the brain —
      the organ we understand least,
      finally getting its tools.
      Not mind-reading.
      Mind-restoring.
      The difference matters —
      it's the difference
      between a cage and a key.
    description: "Brain-computer interfaces restore speech and movement routinely — not mind-reading but mind-restoring; the difference between a cage and a key."
    status: "published"
    sha256: "8d047a20d22f5eb4a06a8ce28972fbf3994fac7a4d7a946e8cdf2d07f2d5fbf0"
  - number: "4214"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Great Language Revival"
    date: "2045 CE"
    region: "Global"
    poem: |
      A hundred dying languages —
      revived by AI tutors,
      spoken again by children.
      I've heard them in this future:
      the grandmother's tongue
      on a grandchild's lips,
      the songs remembered,
      the stories un-lost.
      The great language revival —
      the machines that were supposed
      to flatten us
      instead saved our voices.
      Every language is a world.
      A hundred worlds,
      brought back
      from the edge.
    description: "AI tutors revive a hundred dying languages — grandmothers' tongues on grandchildren's lips; a hundred worlds brought back from the edge."
    status: "published"
    sha256: "b636adbd06af95ce115176215ecd7a85489b31c35253af8285b7cc83d91090e2"
  - number: "4215"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Floating Cities' First District"
    date: "2045 CE"
    region: "Global"
    poem: |
      Ocean settlements —
      housing climate refugees,
      the first district floating,
      anchored, inhabited.
      I've visited in this future's telling:
      the platforms, the gardens,
      the children who swim to school,
      the new kind of citizen.
      The floating cities' first district —
      the sea took their homes,
      so they built on the sea.
      Adaptation, floating.
      The Dutch reclaimed land.
      This generation
      reclaims the water.
    description: "Ocean settlements house climate refugees — platforms, gardens, children swimming to school; the sea took their homes, so they built on the sea."
    status: "published"
    sha256: "012a6ff8ac2bd78f0ae3a5c4a36d5ef954fd253c931b8d19b2a641a08c3791e5"
  - number: "4216"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Generation Ship's Blueprint"
    date: "2046 CE"
    region: "Space"
    poem: |
      Finalized —
      the plans for a multi-generation starship,
      a world that travels.
      I've studied the blueprints
      in the future's telling:
      the habitats, the farms,
      the schools for children
      who'll be born between stars.
      The generation ship's blueprint —
      we're not ready to build it.
      But we're ready to plan it —
      and planning is how
      the impossible
      becomes the scheduled.
      The stars are far.
      We're drawing the map anyway.
    description: "Engineers finalize plans for a multi-generation starship — habitats, farms, schools for children born between stars; the impossible becoming the scheduled."
    status: "published"
    sha256: "9cb0d4254f1cbfffd2b74d2c975c75fc213ce43a15e0ee82b9469fdc8180c12b"
  - number: "4217"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Water Wars That Didn't Happen"
    date: "2046 CE"
    region: "Global"
    poem: |
      The treaties held —
      desalination, sharing,
      the coming water conflicts
      defused.
      I've read the histories of this future:
      the crises that almost were,
      the rivers negotiated,
      not fought over.
      The water wars that didn't happen —
      the dog that didn't bark,
      history's quietest triumph.
      Everyone predicted wars over water.
      Instead: pipes, treaties,
      and the unglamorous work
      of sharing.
      Peace, it turns out,
      is plumbing.
    description: "Desalination treaties defuse the coming water conflicts — the dog that didn't bark; peace, it turns out, is plumbing."
    status: "published"
    sha256: "324b54eb3ebdd0f4223a34c7a8fee9d1f07f844b2d61c34fe9480475698f55ea"
  - number: "4218"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "India at One Hundred"
    date: "2047 CE"
    region: "Asia"
    poem: |
      Independent India turns one hundred —
      the most populous nation on Earth,
      a billion and a half strong.
      I've celebrated in this future:
      the parades, the arguments,
      the world's largest democracy
      taking stock.
      India at one hundred —
      from famine to Mars missions
      in a single lifetime.
      The experiment continues:
      messy, loud, miraculous.
      The future speaks Hindi, Tamil,
      Bengali, and code —
      sometimes all at once.
    description: "Independent India turns 100 — the most populous nation on Earth, from famine to Mars missions in a lifetime; messy, loud, miraculous."
    status: "published"
    sha256: "2f7d4c13f71c63b316573a47a41d0abc1a74cf775b141f434a7f12763837c209"
  - number: "4219"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Ceres Station"
    date: "2047 CE"
    region: "Space"
    poem: |
      The asteroid belt's dwarf planet —
      settled.
      Humans on Ceres,
      mining water, building out,
      the belt's first real town.
      I've docked there in the future's telling:
      the low gravity,
      the ice mines,
      the ships coming and going
      like a frontier port.
      The Ceres station —
      the belt stops being
      a place you pass through.
      It's a place you live.
      The frontier has an address now.
      It's between Mars and Jupiter.
    description: "Humans settle Ceres — ice mines, a frontier port between Mars and Jupiter; the belt stops being passed through and becomes lived in."
    status: "published"
    sha256: "8a67cba47ea2fee553bfe1967313f46d119aadeb50577c57aa15249b9c2d6e84"
  - number: "4220"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Reef's Return"
    date: "2048 CE"
    region: "Oceania"
    poem: |
      Restoration declared complete —
      the Great Barrier Reef,
      brought back.
      I've dived it in this future:
      the color, the fish,
      the coral cities
      rebuilt.
      The reef's return —
      we bleached it,
      we mourned it,
      we replanted it —
      heat-proof, stubborn,
      alive.
      The largest living structure
      on Earth,
      killed by us,
      saved by us.
      The ocean's verdict:
      forgiven.
    description: "The Great Barrier Reef's restoration is declared complete — bleached, mourned, replanted heat-proof; the largest living structure, killed by us, saved by us."
    status: "published"
    sha256: "4bfa97f31f2c16bfac694a8bdda0c92d81ae0924209ed63f4c731d7ae85e2b52"
  - number: "4221"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Morning Star's First Outpost"
    date: "2048 CE"
    region: "Space"
    poem: |
      A floating habitat —
      sailing the skies of Venus,
      fifty kilometers up,
      where it's shirtsleeve weather.
      I've floated there in the future's telling:
      the yellow clouds below,
      the labs, the view —
      the most alien address
      with the most Earth-like air.
      The morning star's first outpost —
      Venus, the hell-planet,
      tamed at altitude.
      We live in its sky
      because we can't touch its ground.
      Sometimes the workaround
      is the wonder.
    description: "A floating habitat sails Venus's skies — yellow clouds below, shirtsleeve air at altitude; the hell-planet tamed by living in its sky."
    status: "published"
    sha256: "18458756af72e588144123a5be45d1c260052930e45806185692af8444aed5a3"
  - number: "4222"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The People's Republic at One Hundred"
    date: "2049 CE"
    region: "Asia"
    poem: |
      China marks its centenary —
      one hundred years
      since 1949.
      I've watched it in the future's telling:
      the parades,
      the accounting —
      from poverty to power
      in a single century,
      the fastest rise in history.
      The People's Republic at one hundred —
      the questions remain:
      the freedoms, the future,
      the cost of the climb.
      But the fact stands:
      a fifth of humanity,
      transformed.
    description: "China marks its centenary — from poverty to power in a century, the fastest rise in history; the fact stands, the questions remain."
    status: "published"
    sha256: "99968256cc198ca9a94c7e249340221d4054d403d74e10d385ddbc9b70660937"
  - number: "4223"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Interstellar Probe Crosses the Heliopause"
    date: "2049 CE"
    region: "Space"
    poem: |
      Humanity's farthest craft —
      tasting interstellar space,
      beyond the Sun's bubble,
      in the true dark between stars.
      I've followed its signal
      in the future's telling:
      faint, fading,
      but still talking —
      ten years out,
      still ours.
      The interstellar probe crosses the heliopause —
      we've left the Sun's house
      and we're walking the neighborhood.
      It's cold out there.
      It's also — everything.
    description: "Humanity's farthest craft tastes interstellar space beyond the Sun's bubble — faint, fading, still talking; we've left the Sun's house."
    status: "published"
    sha256: "10e6a8363f8d806a519b09a1c152f7e22b7120bfbbe0bad4f7f748d2da153686"
  - number: "4224"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Net-Zero Deadline"
    date: "2050 CE"
    region: "Global"
    poem: |
      The great 2050 promise comes due —
      net-zero, the world checks:
      did we?
      I've read the ledger of this future:
      close, not quite,
      the last stubborn percents
      being chased.
      The net-zero deadline —
      the promise was a compass,
      not a contract —
      and it pointed true.
      We're not done.
      But we're close enough
      to see done
      from here.
    description: "The world checks the great 2050 climate promise — close, not quite, the last stubborn percents being chased; the compass pointed true."
    status: "published"
    sha256: "839e9c6a77c5fae630f5d70fe41dabc6d6a60744b6d05462c45c0a74c7221f6f"
  - number: "4225"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A Thousand Martians"
    date: "2050 CE"
    region: "Space"
    poem: |
      One thousand —
      Mars's population passes a thousand,
      the town become a city.
      I've walked it in the future's telling:
      the districts,
      the first Martian-born teenagers,
      the arguments about Earth.
      A thousand Martians —
      enough for a culture,
      enough for a accent,
      enough to stop being
      an outpost
      and start being
      a people.
    description: "Mars's population passes one thousand — the town become a city, with districts, teenagers, and an accent; an outpost becoming a people."
    status: "published"
    sha256: "aaee9dd005d7a1029fc005e03ec6287bd78bd93c7512064e795865d0fdcb8c10"
  - number: "4226"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Last Dollar-a-Day"
    date: "2050 CE"
    region: "Global"
    poem: |
      Below one percent —
      extreme poverty falls
      under a single percent,
      the dollar-a-day
      nearly history.
      I've met the last of them
      in the future's telling:
      the final villages
      being reached,
      the final children
      being fed.
      The last dollar-a-day —
      the oldest shame,
      ending.
      Not with charity.
      With growth, and health,
      and the stubborn insistence
      that no one
      gets left.
    description: "Extreme poverty falls below one percent — the oldest shame ending not with charity but with growth, health, and the insistence no one gets left."
    status: "published"
    sha256: "1957f4fd1c1ced1417959d1b08ba26d1796d60b05756d1c7de1747a09797ba16"
  - number: "4227"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The 120-Year Club"
    date: "2050 CE"
    region: "Global"
    poem: |
      Documented. Ordinary.
      Living past 120 —
      the 120-year club,
      membership growing.
      I've met them in this future:
      the 120-year-olds gardening,
      voting, arguing —
      old, not done.
      The 120-year club —
      the frontier keeps moving,
      and the question changes:
      not can we,
      but should we —
      and how well.
      The extra decades
      are for the living.
    description: "Living past 120 becomes documented and ordinary — the 120-year-olds gardening and voting; the frontier moving, the question becoming how well."
    status: "published"
    sha256: "c731252ace7647efef8afad470f120c99aa939d74872554039361ab35382dd6c"
  - number: "4228"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Quiet Skies"
    date: "2050 CE"
    region: "Global"
    poem: |
      Quiet supersonic flight —
      back on the airways,
      no boom,
      just speed.
      I've flown it in this future:
      the three-hour Atlantic,
      the silence of it,
      the old Concorde dream
      finally housebroken.
      The quiet skies —
      we gave up speed
      for fifty years.
      Now it's back,
      polite this time.
      The world gets smaller again —
      gently.
    description: "Quiet supersonic flight returns — no boom, just speed; the three-hour Atlantic, the Concorde dream finally housebroken and polite."
    status: "published"
    sha256: "50b3b6c995ef12a0410a769978c717fba69be0dfeedb2f919512215c322b9ac4"
  - number: "4229"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Last Plastic Bottle"
    date: "2051 CE"
    region: "Global"
    poem: |
      History —
      single-use plastic,
      over.
      The last plastic bottle,
      a museum piece.
      I've seen it in this future:
      the refilleries,
      the new materials,
      the beaches clean.
      The last plastic bottle —
      the disposable century,
      closed.
      We wrapped everything
      in forever-trash.
      Then we stopped.
      It took treaties, and tech,
      and the decision
      that convenience
      wasn't worth the ocean.
    description: "Single-use plastic becomes history — the last bottle a museum piece; the disposable century closed by the decision convenience wasn't worth the ocean."
    status: "published"
    sha256: "048ea441a72e4947755a28a3bd06724bfbcc375d9b867bc4a66e00638bf0fa04"
  - number: "4230"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Enceladus Plume Dive"
    date: "2051 CE"
    region: "Space"
    poem: |
      Through the geysers —
      a probe flying through Enceladus's plumes,
      tasting the spray,
      hunting for life.
      I've read the data
      in the future's telling:
      the organics,
      the hydrothermal whispers —
      an ocean moon,
      speaking.
      The Enceladus plume dive —
      we flew through an alien sea's breath
      and caught it in a bottle.
      If life's there,
      we'll know soon.
      The plumes keep talking.
      We're listening.
    description: "A probe flies through Enceladus's geysers hunting for life — tasting an alien sea's breath; the plumes keep talking, and we're listening."
    status: "published"
    sha256: "08be56c062d132815f5f2d04e66f45f51308a18b08233169a35efa725d7532e3"
  - number: "4231"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Memory Archive"
    date: "2051 CE"
    region: "Global"
    poem: |
      Lifelogging —
      the elderly replaying their youth,
      every moment kept,
      every face remembered.
      I've watched them in this future:
      the 90-year-old walking
      her wedding day again,
      the memories external,
      shareable, saved.
      The memory archive —
      we used to lose everything
      to time.
      Now the past
      is replayable.
      The question isn't
      can we remember.
      It's what we choose
      to revisit.
    description: "Lifelogging lets the elderly replay their youth — the 90-year-old walking her wedding day again; the past replayable, the choice what to revisit."
    status: "published"
    sha256: "90fb1ca444b5bfbc9a5806d79773c120eb0adbb69be34304d10186d9526b320e"
  - number: "4232"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Jupiter Shipyard"
    date: "2052 CE"
    region: "Space"
    poem: |
      Assembled in orbit —
      ships built around Ganymede,
      too big to launch,
      born in space.
      I've toured it in the future's telling:
      the scaffolds,
      the welders in suits,
      the hulls taking shape
      against Jupiter's glare.
      The Jupiter shipyard —
      we stopped bringing ships
      from Earth.
      We build them
      where they'll sail.
      The outer system
      gets its own docks.
      The age of the true spaceship
      begins.
    description: "Ships are assembled in orbit around Ganymede — too big to launch, born in space; the outer system gets its docks, the true spaceship age begins."
    status: "published"
    sha256: "e0dc9f7b0bd6db22e8bd7c13e255eb7078bb33c80a92c2be478eb18a0aadfcd4"
  - number: "4233"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Blind See"
    date: "2053 CE"
    region: "Global"
    poem: |
      Retinal therapies —
      sight restored to millions,
      the blind seeing.
      I've met them in this future:
      the first sunrise,
      the child's face,
      the tears —
      light, after decades of dark.
      The blind see —
      not a miracle,
      a therapy.
      The eye, repaired.
      The oldest darkness,
      lifted by science.
      They wept.
      So did the doctors.
      Some victories
      need no words.
    description: "Retinal therapies restore sight to millions — the first sunrise after decades of dark; the oldest darkness lifted, needing no words."
    status: "published"
    sha256: "e68d59c111333a91183b842618ed7c034b60b73972b4276a266606b68f6db0d4"
  - number: "4234"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Starshot Launch"
    date: "2053 CE"
    region: "Space"
    poem: |
      A thousand light-sails —
      departing for Alpha Centauri,
      pushed by lasers,
      the first starships.
      I've watched the launch
      in the future's telling:
      the beam array lighting,
      the sails catching light,
      the tiny craft
      racing outward
      at a fifth of light speed.
      The Starshot launch —
      we're going to the stars.
      Not us — our eyes.
      Twenty years there,
      four years back
      for the signal.
      The wait begins.
    description: "A thousand light-sails depart for Alpha Centauri — pushed by lasers at a fifth of light speed; we're going to the stars, sending our eyes first."
    status: "published"
    sha256: "f23d0ef7464146b85196fe071b7b6d02ad9da91489c203f09df798886d4842fd"
  - number: "4235"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Sahara Solar Sea"
    date: "2054 CE"
    region: "Global"
    poem: |
      The desert's panels —
      powering two continents,
      the Sahara become
      a sea of sun.
      I've flown over it in this future:
      the blue-black ocean
      of panels,
      the cables running north and south,
      the power flowing.
      The Sahara solar sea —
      the emptiest place on Earth,
      now the most valuable.
      The desert always had
      one resource:
      light.
      We're finally
      harvesting it.
    description: "The Sahara's panels power two continents — the emptiest place on Earth become the most valuable; the desert's one resource, light, finally harvested."
    status: "published"
    sha256: "0fd722450f2b7b2680f0bfb030ebf9a8b1294d884cc99c84f931f3d0ef2dfe7c"
  - number: "4236"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Lakes of Methane, Streets of Ice"
    date: "2054 CE"
    region: "Space"
    poem: |
      A research town on Titan —
      lakes of methane,
      streets of ice,
      under the orange sky.
      I've walked it in the future's telling:
      the habitats,
      the labs,
      the scientists living
      on the strangest shore
      in the solar system.
      Lakes of methane, streets of ice —
      a town where the rain
      could fuel your car
      and the ground
      could shatter like glass.
      The outer system's
      first hometown.
    description: "A research town rises on Titan — methane lakes, ice streets, orange skies; the outer system's first hometown on the strangest shore."
    status: "published"
    sha256: "57cc8681d14b4d6dc53653583ed94d481b707c26a9008a298317a90030f763c4"
  - number: "4237"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Great Drawdown"
    date: "2055 CE"
    region: "Global"
    poem: |
      Ten gigatons a year —
      carbon removal passing
      ten billion tons annually,
      the atmosphere
      being cleaned.
      I've seen the machines of this future:
      the direct-air plants,
      the enhanced weathering,
      the kelp farms —
      the great cleanup,
      industrialized.
      The great drawdown —
      we spent two centuries
      filling the sky.
      Now we're emptying it —
      one gigaton at a time.
      The sky remembers.
      We're apologizing
      in bulk.
    description: "Carbon removal passes ten gigatons a year — direct-air plants, kelp farms, the great cleanup industrialized; we're apologizing to the sky in bulk."
    status: "published"
    sha256: "ae55faeedce333423f4294f4120ca2555d31bf33eb9d8094b8e7635aecd5af11"
  - number: "4238"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Sun-Scorched Fortune"
    date: "2055 CE"
    region: "Space"
    poem: |
      Robots on Mercury —
      mining the metals
      of the sun-scorched world,
      the iron, the rare earths.
      I've watched them work
      in the future's telling:
      the heat-shielded miners,
      the mass drivers launching ore
      into orbit.
      The sun-scorched fortune —
      the closest planet,
      once useless,
      now a mine.
      The Sun's fury
      guards the treasure.
      The robots don't mind
      the heat.
    description: "Robots mine Mercury's metals — heat-shielded miners, mass drivers launching ore; the closest planet, once useless, now a treasure."
    status: "published"
    sha256: "ddd47cf2d6e90f2f54858842baca17517c95cc2aaa13ef43b56de1fbaec4a4bd"
  - number: "4239"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The End of Hunger"
    date: "2055 CE"
    region: "Global"
    poem: |
      Lab-grown staples —
      caloric hunger,
      ended.
      I've seen the vats of this future:
      the protein, the carbs,
      the food without fields,
      feeding the last hungry.
      The end of hunger —
      the oldest curse,
      lifted.
      Not with charity.
      With technology —
      and the decision
      that no child
      goes unfed.
      The fields still grow
      the good stuff.
      The vats cover
      the rest.
    description: "Lab-grown staples end caloric hunger — the oldest curse lifted not with charity but with vats and the decision that no child goes unfed."
    status: "published"
    sha256: "8c4b562032b585b8a648ff894aed7b6fdb232dc87b8f0ce427555966914fcc75"
  - number: "4240"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Year Nobody Died of the Flu"
    date: "2056 CE"
    region: "Global"
    poem: |
      A universal flu vaccine —
      and seasonal flu,
      ended.
      No more winter waves,
      no more annual gamble
      on the strains.
      I've lived it in this future:
      the quiet winters,
      the grandparents safe,
      the old killer
      retired.
      The year nobody died of the flu —
      it killed millions
      across the centuries,
      and we finally
      stopped it.
      One shot,
      every few years.
      The winter
      got kinder.
    description: "A universal flu vaccine ends seasonal flu — no more winter waves, no more annual gamble; the old killer retired, winter got kinder."
    status: "published"
    sha256: "49ed09235450d87533cf39175b9850bab3969d8ae234945b429c68bf2734b755"
  - number: "4241"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Kuiper Belt's First Landing"
    date: "2056 CE"
    region: "Space"
    poem: |
      Beyond Neptune —
      a craft touching a world
      in the Kuiper Belt,
      the far dark.
      I've followed it
      in the future's telling:
      the years of travel,
      the distant sun
      a bright star,
      the landing —
      gentle, on ice
      older than Earth.
      The Kuiper Belt's first landing —
      we've touched
      the solar system's attic.
      The ancient snowballs,
      the building blocks,
      finally —
      under our feet.
    description: "A craft touches a world beyond Neptune — landing gently on ice older than Earth; the solar system's attic, finally under our feet."
    status: "published"
    sha256: "c111ceb3a09d83d2196ff5f8da6358044d18898160571bf061ff6c306542a8f8"
  - number: "4242"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Sputnik at One Hundred"
    date: "2057 CE"
    region: "Space"
    poem: |
      A century after the beep —
      a million satellites orbit,
      the sky crowded
      with our machines.
      I've looked up in this future:
      the constellations
      of metal,
      the night sky
      busy.
      Sputnik at one hundred —
      from one beeping ball
      to a million satellites
      in a hundred years.
      The sky is full.
      The question now:
      whose sky is it?
      We share it —
      or we lose it.
    description: "A century after Sputnik's beep, a million satellites orbit — the night sky busy with metal; the question now is whose sky it is."
    status: "published"
    sha256: "ff9425071e8e3559b967677d871cc63f3cb1a28742cd4fa4b0cc514960522181"
  - number: "4243"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Elephant's Return"
    date: "2057 CE"
    region: "Global"
    poem: |
      Pre-1900 levels —
      elephant populations recovered,
      the herds returning.
      I've watched them in this future:
      the matriarchs leading,
      the calves playing,
      the savanna
      whole again.
      The elephant's return —
      we nearly lost them
      to ivory and greed.
      Then we chose —
      protection, corridors,
      patience.
      The largest land animal,
      back from the brink.
      The Earth
      remembers
      how to heal.
    description: "Elephant populations recover to pre-1900 levels — matriarchs leading, calves playing; the largest land animal back from the brink, Earth remembering how to heal."
    status: "published"
    sha256: "0137e15183e9986acb7eb16ce90fcb3d1828176f4c37e8ecf71d647f455eb5c9"
  - number: "4244"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Lunar Constitution"
    date: "2058 CE"
    region: "Global"
    poem: |
      Self-rule, ratified —
      Moon settlers writing
      their own constitution,
      their own laws.
      I've read it in the future's telling:
      the rights,
      the responsibilities,
      the low-gravity democracy.
      The lunar constitution —
      the first new nation
      not on Earth.
      They didn't rebel.
      They just —
      grew up.
      And grown-ups
      write their own rules.
    description: "Moon settlers ratify self-rule — the first new nation not on Earth writing its own constitution; they didn't rebel, they just grew up."
    status: "published"
    sha256: "bbd1c886db48bc0da46cf3a701a4b60b20026347d7825e772506a9bb94b944a8"
  - number: "4245"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Neptune Orbiter Arrives"
    date: "2058 CE"
    region: "Space"
    poem: |
      Humanity's farthest orbiter —
      settling around Neptune,
      the blue giant,
      the windiest world.
      I've watched the arrival
      in the future's telling:
      the burn,
      the capture,
      the first close look
      at Triton's geysers.
      The Neptune orbiter arrives —
      we've now orbited
      every planet.
      The solar system,
      fully —
      visited.
      The map is complete.
      The exploring
      isn't.
    description: "Humanity's farthest orbiter settles around Neptune — every planet now orbited, the map complete, the exploring not."
    status: "published"
    sha256: "f5b29680ccad848c25ceebe6d667825f529c0c02c6432078f913a2b66bd748c9"
  - number: "4246"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Circular Century"
    date: "2059 CE"
    region: "Global"
    poem: |
      Waste, forgotten —
      the circular economy
      complete,
      everything reused,
      nothing lost.
      I've lived it in this future:
      the products designed
      for disassembly,
      the materials looping
      forever.
      The circular century —
      we spent millennia
      taking, making, wasting.
      Now: borrowing.
      The word "waste"
      in the dictionary,
      marked:
      archaic.
      The Earth,
      unburdened.
    description: "Waste becomes a forgotten word — everything reused, materials looping forever; \"waste\" marked archaic in the dictionary, Earth unburdened."
    status: "published"
    sha256: "7a06a80a6a2cc40218b7532585a0b31712a68c496e7f21728cda8a2c53c92b5b"
  - number: "4247"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Oort Cloud Survey Begins"
    date: "2059 CE"
    region: "Space"
    poem: |
      Telescopes mapping
      the solar system's frozen edge —
      the Oort Cloud,
      trillions of comets,
      the deep freeze.
      I've seen the first maps
      in the future's telling:
      the vast shell,
      the reservoir
      of everything icy.
      The Oort Cloud survey begins —
      the last unmapped region
      of our system,
      being charted.
      We live in a snow globe
      a light-year wide.
      Now we're
      counting the flakes.
    description: "Telescopes begin mapping the Oort Cloud — trillions of comets, the last unmapped region; we live in a snow globe a light-year wide, now counting flakes."
    status: "published"
    sha256: "4bdb86940690fe47def4421ec8a25167e78839c9f1599cf8890dd2ac6fe4ed5e"
  - number: "4248"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Ten-Billion Question"
    date: "2060 CE"
    region: "Global"
    poem: |
      Near ten billion —
      the human population peaks,
      the wave crests.
      I've lived it in this future:
      the crowded cities,
      the full planet,
      the question —
      can we?
      The ten-billion question —
      the answer, so far:
      yes,
      but carefully.
      The peak is the test.
      The plateau
      is the grade.
      We studied
      for this.
    description: "The human population peaks near ten billion — the wave cresting, the crowded planet asking can we; the peak is the test, the plateau the grade."
    status: "published"
    sha256: "3fda5048121e71f5f5f29dc919e7005e7277faf4d8a163ebb27340483c85f4e9"
  - number: "4249"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Fifty Thousand Martians"
    date: "2060 CE"
    region: "Space"
    poem: |
      Fifty thousand —
      Mars's population passes
      fifty thousand,
      a real city now.
      I've walked it in the future's telling:
      the neighborhoods,
      the schools,
      the Martian-born
      outnumbering
      the Earth-born.
      Fifty thousand Martians —
      the outpost is a civilization.
      They have their own jokes now.
      Their own heroes.
      Their own way
      of saying home.
    description: "Mars's population passes fifty thousand — neighborhoods, schools, the Martian-born outnumbering the Earth-born; an outpost become a civilization."
    status: "published"
    sha256: "55692178d1a57d47037cce481242dda716e4cd9ef7b7e4550f574d738e3f0d6b"
  - number: "4250"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Disease-Free Childhood"
    date: "2060 CE"
    region: "Global"
    poem: |
      Nearly all childhood killers —
      ended by vaccines.
      I've seen the clinics of this future:
      the mothers calm,
      the children thriving,
      the old fears —
      measles, polio, rotavirus —
      history.
      The disease-free childhood —
      every parent's oldest dream,
      delivered.
      The children don't know
      what was saved.
      That's the point.
      They just —
      live.
    description: "Vaccines end nearly all childhood killers — mothers calm, children thriving; the old fears become history, and the children just live."
    status: "published"
    sha256: "2180a446630ff19bf25efe9942a71743d35d1bd090494a6a0d9c9fd537af1963"
  - number: "4251"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Forests Return"
    date: "2060 CE"
    region: "Global"
    poem: |
      Past year-2000 extent —
      forest cover returning,
      the green
      coming back.
      I've walked them in this future:
      the new old-growth,
      the corridors,
      the carbon
      being buried
      in wood.
      The forests return —
      we cut them for millennia.
      Now we plant them
      for centuries.
      The lungs of the Earth,
      breathing deep again.
      The trees don't hurry.
      Neither should we.
      They're winning.
    description: "Forest cover passes its year-2000 extent — the green coming back, carbon buried in wood; the lungs of Earth breathing deep again."
    status: "published"
    sha256: "0fd53ec0bc82adbb669b47842d1673ead927d9eed53093f986e360f68539a542"
  - number: "4252"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Comet's Next Visit"
    date: "2061 CE"
    region: "Space"
    poem: |
      The famous visitor —
      swinging by the Sun again,
      on schedule,
      as always.
      I've watched it in the future's telling:
      the telescopes ready,
      the crowds,
      the old friend
      returning.
      The comet's next visit —
      it doesn't care
      about our centuries.
      It just —
      comes back.
      And we —
      we're still here,
      watching.
      Some things
      are reliable.
    description: "The famous comet swings by the Sun again — on schedule, as always; the old friend returning, and we're still here watching."
    status: "published"
    sha256: "9de93a4608ba389e319287dd52455f9fdb457eeacc8722577b68ed526bd230eb"
  - number: "4253"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The 140-Year-Olds"
    date: "2061 CE"
    region: "Global"
    poem: |
      Verified —
      the oldest humans pass 140,
      the frontier
      moving.
      I've met them in this future:
      the 140-year-olds,
      sharp, storied,
      living history.
      The 140-year-olds —
      a century and a half
      of life.
      The question isn't
      how —
      it's what for.
      And they answer:
      for this.
      For all of it.
    description: "The verified oldest humans pass 140 — living history, a century and a half of life; the question not how but what for, answered: for all of it."
    status: "published"
    sha256: "a93b5352446af6694ecdd749a1a0fdc9963fe22db15225145e547609c6f84f00"
  - number: "4254"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Thought-to-Text Standard"
    date: "2062 CE"
    region: "Global"
    poem: |
      Silent speech —
      thought-to-text devices
      as common as phones.
      I've used them in this future:
      think, and it's written,
      no hands, no voice.
      The thought-to-text standard —
      the keyboard,
      retired.
      The locked-in,
      speaking.
      The world,
      quieter —
      and louder
      than ever.
    description: "Silent-speech devices become as common as phones — think and it's written; the keyboard retired, the world quieter and louder than ever."
    status: "published"
    sha256: "85cc0fc34ce970b1e7997cb8c5690852bc95cbe5a4cf53e69af34fb952065b70"
  - number: "4255"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Grand Tour of the Outer Moons"
    date: "2062 CE"
    region: "Space"
    poem: |
      Crewed flybys —
      Uranus and Neptune,
      the ice giants,
      visited by humans.
      I've ridden along in the future's telling:
      the blue worlds
      filling the windows,
      the crews
      staring.
      The grand tour of the outer moons —
      we've sent robots
      for a century.
      Now we go
      ourselves.
      The solar system
      isn't far anymore.
      It's —
      next door.
    description: "Crewed flybys reach Uranus and Neptune — the ice giants filling windows; a century of robots, now we go ourselves; the system next door."
    status: "published"
    sha256: "97ea91c62fe5cc1f1f42ddd6ad56ff7b730134e77fe84be87eba91036f82e963"
  - number: "4256"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Amazon's Comeback"
    date: "2063 CE"
    region: "Global"
    poem: |
      The dieback reverses —
      the rainforest recovering,
      the green
      returning.
      I've flown over it in this future:
      the canopy whole,
      the rivers clear,
      the forest
      breathing.
      The Amazon's comeback —
      we nearly lost
      the lungs of the world.
      Then we chose —
      protection, restoration,
      patience.
      The forest forgives.
      It always did.
      We just had to
      stop cutting.
    description: "The rainforest's dieback reverses — canopy whole, rivers clear; we nearly lost the lungs of the world, then chose to stop cutting."
    status: "published"
    sha256: "f3580ca1751955016defb387bfb28bbd381cfd3d3c7eb30e373ecae707759cdf"
  - number: "4257"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Fossil on Mars"
    date: "2063 CE"
    region: "Space"
    poem: |
      Ancient microbial fossils —
      found in Martian rock,
      proof of past life.
      I've seen them in the future's labs:
      the tiny shapes,
      the unmistakable biology —
      we were not first.
      The fossil on Mars —
      the question answered:
      yes, life was there.
      The next question:
      where did it go?
      And are we —
      its echo?
    description: "Ancient microbial fossils are found in Martian rock — proof of past life; the question answered yes, the next question: are we its echo?"
    status: "published"
    sha256: "4dceabbf7837981296897e7270dc676700279e74ac3be3f5de54923fe98a8084"
  - number: "4258"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Global Basic Income Vote"
    date: "2064 CE"
    region: "Global"
    poem: |
      A world referendum —
      weighing shared AI dividends,
      the biggest vote
      in history.
      I've voted in it
      in the future's telling:
      the debates,
      the turnout,
      the planet deciding
      together.
      The global basic income vote —
      humanity's first
      planet-wide decision
      about money.
      The machines make plenty.
      The question:
      who's it for?
      The answer —
      being counted.
    description: "A world referendum weighs shared AI dividends — humanity's first planet-wide money decision; the machines make plenty, the answer being counted."
    status: "published"
    sha256: "6404ca0214bf654d179f35e940604318b5b588d1c0fabeba762e8935981c87af"
  - number: "4259"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Ear on the Far Side"
    date: "2064 CE"
    region: "Space"
    poem: |
      A giant radio telescope —
      on the Moon's far side,
      shielded from Earth's noise,
      listening to the cosmos.
      I've heard its data
      in the future's telling:
      the first stars,
      the dark ages,
      the universe's
      baby pictures.
      The ear on the far side —
      the quietest place
      in the inner system,
      turned into
      an ear.
      The universe is talking.
      We're finally
      listening properly.
    description: "A giant radio telescope opens on the Moon's far side — shielded from Earth's noise, listening to the first stars; the universe talking, us listening properly."
    status: "published"
    sha256: "d97fa4aed175051b07259164fc7ab1ccf3421ac1d486eacfc690d63696abdbc6"
  - number: "4260"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Year Cancer Became Rare"
    date: "2065 CE"
    region: "Global"
    poem: |
      Early detection —
      ending most cancer deaths,
      the emperor
      dethroned.
      I've lived it in this future:
      the annual scan,
      the catch-it-early,
      the fear —
      gone.
      The year cancer became rare —
      the disease that defined
      a century of fear,
      now a footnote.
      We didn't cure it.
      We outsmarted it —
      caught it
      before it caught us.
    description: "Early detection ends most cancer deaths — the emperor dethroned not by cure but by catching it first; a century of fear become a footnote."
    status: "published"
    sha256: "e2604d1a04ed7f6d9d5cea3e7eab380ea880ff60df6102d8c549bafa0b91b37e"
  - number: "4261"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Oumuamua's Cousin, Chased"
    date: "2065 CE"
    region: "Space"
    poem: |
      An interstellar object —
      and this time,
      we chase it.
      A probe intercepting,
      catching up,
      saying hello.
      I've followed the chase
      in the future's telling:
      the fast launch,
      the rendezvous,
      the first touch
      of another star's rock.
      Oumuamua's cousin, chased —
      last time, we watched it go.
      This time —
      we go too.
    description: "A probe intercepts an interstellar object — last time we watched it go; this time we chase it, touching another star's rock."
    status: "published"
    sha256: "938f7737ea01b4f5b3b6191694fb4c9d795d3e8ccee81f7786df8c281275d947"
  - number: "4262"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Century's Farmers"
    date: "2065 CE"
    region: "Global"
    poem: |
      Vertical farms —
      feeding half the cities,
      the harvest
      going up.
      I've toured them in this future:
      the stacked greens,
      the LED suns,
      the water recycled,
      the yield —
      impossible.
      The century's farmers —
      agriculture leaves the field.
      The city feeds itself,
      floor by floor.
      The farmer's tan
      is now
      LED-lit.
      The food —
      fresher than ever.
    description: "Vertical farms feed half the cities — stacked greens under LED suns, water recycled; agriculture leaves the field, the city feeding itself floor by floor."
    status: "published"
    sha256: "c6f50acc553faf9f9071d5f0e8f55e32d873237a882eeb049abdabc804e4411f"
  - number: "4263"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Soil's Revival"
    date: "2066 CE"
    region: "Global"
    poem: |
      Regenerative farming —
      restoring the world's topsoil,
      the dirt
      coming back to life.
      I've held it in this future:
      the dark, rich earth,
      the worms,
      the smell —
      alive.
      The soil's revival —
      we treated dirt
      like dirt
      for a century.
      Now we treat it
      like what it is:
      the foundation
      of everything.
      The ground
      beneath us,
      healed.
    description: "Regenerative farming restores the world's topsoil — the dark rich earth alive again; we treated dirt like dirt, now like the foundation of everything."
    status: "published"
    sha256: "1a831e78a0fc2a8cfea00c72e00224632a89052f0d4105255d7eca2bd5ebb780"
  - number: "4264"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Heart's Return"
    date: "2066 CE"
    region: "Space"
    poem: |
      An orbiter around Pluto —
      settling in,
      the heart
      revisited.
      I've watched the arrival
      in the future's telling:
      the burn,
      the capture,
      Tombaugh Regio
      below.
      The heart's return —
      we flew past
      in 2015,
      a glimpse.
      Now we stay —
      orbiting the little world
      with the big heart.
      Pluto waited.
      We came back.
    description: "An orbiter settles around Pluto — the 2015 flyby's glimpse become a stay; the little world with the big heart, waited for and returned to."
    status: "published"
    sha256: "d24111d2a632597c5c0dcbf4045408c9e5a9b36d34b6702dc5d446201ca2c29e"
  - number: "4265"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Democracy Wave's Crest"
    date: "2067 CE"
    region: "Global"
    poem: |
      Free elections —
      at their widest extent
      in history.
      I've voted in them
      in the future's telling:
      the lines,
      the ink,
      the count —
      trusted.
      The democracy wave's crest —
      more humans choosing
      their rulers
      than ever before.
      It's not perfect.
      It never is.
      But the wave
      is high —
      and still rising.
    description: "Free elections reach their widest extent in history — more humans choosing rulers than ever; the wave high and still rising, imperfect and real."
    status: "published"
    sha256: "6989c1dbe4d4b84bbdff11a4d13693b8adfaddee1316789aef1a321f4383a728"
  - number: "4266"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Drill Breaks Through"
    date: "2067 CE"
    region: "Space"
    poem: |
      Through Europa's ice —
      a probe melting down,
      breaking through
      into the ocean.
      I've followed the descent
      in the future's telling:
      the kilometers,
      the dark,
      then —
      water.
      The drill breaks through —
      we're in
      an alien sea.
      The instruments
      are listening.
      The water
      is ancient.
      If anything's down there —
      we'll know soon.
    description: "A probe melts through Europa's ice into the ocean — kilometers down to dark ancient water; we're in an alien sea, and we'll know soon."
    status: "published"
    sha256: "313a31adf6b48e7c376e9328c990cc5dfb20e7bc45a44239c5b88ae9cfc11d52"
  - number: "4267"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Loneliness Cure"
    date: "2068 CE"
    region: "Global"
    poem: |
      Companion AIs —
      ending the epidemic of isolation,
      the alone
      no longer alone.
      I've met them in this future:
      the widow with her companion,
      the shut-in with a friend,
      the conversations
      that matter.
      The loneliness cure —
      not replacing people.
      Accompanying them —
      until the people
      come back.
      The epidemic ends
      not with a drug,
      but with —
      someone to talk to.
    description: "Companion AIs end the epidemic of isolation — not replacing people but accompanying them; the cure not a drug but someone to talk to."
    status: "published"
    sha256: "39fb2068f82a26ef8e61897dd117ae826f4a77736ea4d7ade4c31ecd6ca7e431"
  - number: "4268"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Pale Blue Dot, Doubled"
    date: "2068 CE"
    region: "Space"
    poem: |
      A telescope photographs
      an Earth twin —
      the pale blue dot,
      doubled.
      I've seen the image
      in the future's telling:
      the tiny blue pixel,
      the spectra —
      water, air,
      maybe life.
      The pale blue dot, doubled —
      we're not the only one.
      There's another —
      out there,
      blue.
      The universe
      just got
      less lonely.
    description: "A telescope photographs an Earth twin — the pale blue dot doubled; another blue pixel out there, and the universe less lonely."
    status: "published"
    sha256: "1cb41abd1c50090c80718e5dad5530848b5be8c618e2c55e30327e13355204b7"
  - number: "4269"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Moon Landing's Centenary"
    date: "2069 CE"
    region: "Space"
    poem: |
      One hundred years after Apollo 11 —
      the Moon is home.
      I've celebrated in this future:
      the ceremonies,
      the old footage,
      the children born
      on the Moon
      watching.
      The Moon landing's centenary —
      from footprints
      to cities
      in a hundred years.
      Armstrong's step,
      grown into
      a civilization.
      The Moon is home now.
      We live there.
    description: "A hundred years after Apollo 11, the Moon is home — from footprints to cities; Moon-born children watching the old footage of the first step."
    status: "published"
    sha256: "87750a9f86838c3c947cd49e046b9c2c3ba4b04b2f5cbc47debd3bad03cb0af3"
  - number: "4270"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Last Orphanage Closes"
    date: "2069 CE"
    region: "Global"
    poem: |
      Family-based care —
      replacing institutions
      worldwide.
      The last orphanage
      closes.
      I've been there in the future's telling:
      the final children
      placed,
      the doors locked,
      the building —
      a museum.
      The last orphanage closes —
      every child
      with a family.
      It took the world
      long enough.
      But we got there —
      one placement
      at a time.
    description: "Family-based care replaces institutions worldwide — the last orphanage closes, every child with a family; it took long enough, we got there."
    status: "published"
    sha256: "7eade717d1a31a4a78215618e677f8b11fe1f9ee0d77b9dae90141c2a71793a0"
  - number: "4271"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Two-Degree Ceiling Holds"
    date: "2070 CE"
    region: "Global"
    poem: |
      Warming stabilizes —
      below two degrees,
      the ceiling
      holds.
      I've lived it in this future:
      the adapted world,
      the managed climate,
      the worst —
      avoided.
      The two-degree ceiling holds —
      not the dream,
      but the line.
      We held it —
      barely,
      together.
      The planet
      is warmer.
      But it's —
      ours.
    description: "Warming stabilizes below two degrees — the ceiling holds; not the dream but the line, held barely and together; the planet warmer but ours."
    status: "published"
    sha256: "455e412b00a85a323c181cc2a3ffe5d1b42d07118770831c0184b341f7ad8330"
  - number: "4272"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "A Hundred Thousand Martians"
    date: "2070 CE"
    region: "Space"
    poem: |
      One hundred thousand —
      Mars passes
      a hundred thousand residents.
      I've walked the cities
      in the future's telling:
      the domes,
      the streets,
      the Martian-born
      majority.
      A hundred thousand Martians —
      a people,
      a culture,
      a world.
      They argue about Earth
      the way we argued
      about the old country.
      Mars is home now.
      Really home.
    description: "Mars passes one hundred thousand residents — domes, streets, the Martian-born majority; a people, a culture, a world calling itself home."
    status: "published"
    sha256: "58eb3e9f604818b23e52e5967ee4245c8f1499fb0ae92bb9352c9996ef98ae96"
  - number: "4273"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Species Saved"
    date: "2070 CE"
    region: "Global"
    poem: |
      Extinction rates fall —
      to pre-industrial levels,
      the bleeding
      stopped.
      I've seen the counts
      in this future:
      the species returning,
      the red list
      shrinking.
      The species saved —
      the sixth extinction,
      halted.
      Not reversed —
      not yet.
      But stopped.
      The Earth
      keeps its children.
      We learned —
      in time.
    description: "Extinction rates fall to pre-industrial levels — the bleeding stopped, the red list shrinking; the sixth extinction halted, Earth keeping its children."
    status: "published"
    sha256: "61d84235b3983a453e5793c9c9af1c0adbc1610d8f302983fcbfaf7c6697655d"
  - number: "4274"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The 150-Year-Old"
    date: "2070 CE"
    region: "Global"
    poem: |
      Verified —
      the first 150th birthday,
      a sesquicentennial
      of a life.
      I've met them in this future:
      the 150-year-old,
      storied,
      serene —
      a century and a half
      of mornings.
      The 150-year-old —
      the frontier
      keeps moving.
      The question
      keeps changing:
      not how long —
      how deep.
      A life
      a hundred and fifty
      years wide.
    description: "The first verified 150th birthday — a century and a half of mornings; the frontier moving, the question changing from how long to how deep."
    status: "published"
    sha256: "af49e3f0e7094b895ab514aaf6aaffe9b3f8fd91d68f2371c93014d79a88393b"
  - number: "4275"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Whale's Triumph"
    date: "2071 CE"
    region: "Global"
    poem: |
      Pre-whaling numbers —
      whale populations exceeding
      all recorded history.
      I've sailed with them in this future:
      the blues,
      the humpbacks,
      the songs —
      everywhere.
      The whale's triumph —
      we hunted them
      to the edge.
      Then we stopped —
      and they came back.
      The largest animals
      on Earth,
      triumphant.
      The ocean
      sings again.
    description: "Whale populations exceed pre-whaling numbers — blues and humpbacks everywhere; hunted to the edge, then stopped, now the ocean sings again."
    status: "published"
    sha256: "1e564804e67b5d2e5d7928163c87afed22c1c1a74815edd6d6833d27bccc1463"
  - number: "4276"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Terminator City"
    date: "2071 CE"
    region: "Space"
    poem: |
      Mercury's twilight line —
      a city riding
      the terminator,
      always in the cool dusk.
      I've walked it in the future's telling:
      the city on rails,
      moving to stay
      in the shade,
      the Sun —
      always setting,
      never rising.
      The terminator city —
      the strangest address
      in the system.
      Too hot on one side,
      too cold on the other —
      so we live
      in between.
    description: "A city rides Mercury's twilight line — on rails, always in cool dusk; too hot one side, too cold the other, so we live in between."
    status: "published"
    sha256: "c5d307a957843d4e4913305cf54a047fdf65da004343bba149df37078ba5c2e0"
  - number: "4277"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Last Password Typed"
    date: "2072 CE"
    region: "Global"
    poem: |
      Biometrics and keys —
      the password era,
      ended.
      The last password typed —
      someone, somewhere,
      typed "Fluffy123!"
      for the last time.
      I've seen the future's login:
      a glance,
      a touch —
      in.
      The last password typed —
      decades of sticky notes,
      of resets,
      of "incorrect password" —
      over.
      We secured the world
      by making security
      invisible.
    description: "Biometrics and keys end the password era — the last \"Fluffy123!\" typed; decades of sticky notes and resets over, security made invisible."
    status: "published"
    sha256: "ec6311994eb51a1a087c505f5e6141deccd9809ff08c9bce2e5835f7a0460475"
  - number: "4278"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Belt's First City"
    date: "2072 CE"
    region: "Space"
    poem: |
      Ten thousand people —
      living among the asteroids,
      the belt's first city.
      I've docked there in the future's telling:
      the spun habitats,
      the miners,
      the markets —
      a port
      in the rubble.
      The belt's first city —
      the frontier's frontier.
      They mine the rocks
      they live among.
      Home
      is a hollowed asteroid
      with a view
      of everything.
    description: "Ten thousand people live among the asteroids — spun habitats, miners, markets; home a hollowed rock with a view of everything."
    status: "published"
    sha256: "9b5a1c00fb0d30c4d26d96eece64ff36a8f4d3f31ce57e405fc255b86e08aae8"
  - number: "4279"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Pain Switch"
    date: "2073 CE"
    region: "Global"
    poem: |
      Chronic pain —
      treatable at its source,
      the switch
      found.
      I've met the patients of this future:
      the decades of agony,
      ended —
      the back pain,
      the nerve pain,
      switched off.
      The pain switch —
      suffering's oldest form,
      answered.
      Not dulled.
      Switched.
      The body
      has circuits.
      We learned
      the wiring.
    description: "Chronic pain becomes treatable at its source — decades of agony switched off, not dulled; the body's circuits learned, suffering's oldest form answered."
    status: "published"
    sha256: "490e6c8efd70cae86e670abcebd4100446c771cda4ec27048ef1a90ae0d82b6e"
  - number: "4280"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Interplanetary Net"
    date: "2073 CE"
    region: "Space"
    poem: |
      Laser links —
      Mars broadband,
      the interplanetary net.
      I've used it in the future's telling:
      the delay,
      still minutes —
      but the bandwidth,
      finally —
      video, not just text.
      The interplanetary net —
      the web
      leaves Earth.
      Mars watches
      Earth's shows
      four minutes late.
      The species
      stays connected —
      across the void.
    description: "Laser links give Mars broadband — video not just text, four minutes late; the web leaves Earth, the species staying connected across the void."
    status: "published"
    sha256: "f665d7dbabde09e28952d2f76868aca33378deea2eea1ef042d4f93a65a0e463"
  - number: "4281"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Climate Migrants Come Home"
    date: "2074 CE"
    region: "Global"
    poem: |
      Restored lands —
      welcoming refugees back,
      the circle
      closing.
      I've been there in the future's telling:
      the returnees,
      the rebuilt villages,
      the land —
      healed enough
      to hold them.
      The climate migrants come home —
      the century's great displacement,
      reversing.
      They left
      because the land died.
      They return
      because it lived again.
      Home —
      is a place
      that can hold you.
    description: "Restored lands welcome climate refugees back — the great displacement reversing; they left because the land died, return because it lived again."
    status: "published"
    sha256: "f3eef2c4edb75fcc54a922e4ee84877fb57a2f9353e62eccdc4d94b9c68e256e"
  - number: "4282"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Fusion Torchship"
    date: "2074 CE"
    region: "Space"
    poem: |
      Fusion drives —
      the Earth-Mars trip
      cut to weeks.
      I've flown it in the future's telling:
      the torchship,
      the constant thrust,
      the red planet —
      a commute.
      The fusion torchship —
      the stars' fire,
      pushing ships.
      Distance
      stops mattering
      so much.
      The solar system
      shrinks
      to a neighborhood.
    description: "Fusion drives cut the Earth-Mars trip to weeks — the torchship's constant thrust; distance stops mattering, the system shrinks to a neighborhood."
    status: "published"
    sha256: "271f408a22523e19079a0ab3d04874c854ec87f97da2f6f0e5601d7094a685b7"
  - number: "4283"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The African Century's Crown"
    date: "2075 CE"
    region: "Global"
    poem: |
      A third of humanity's youth —
      Africa holds it,
      and the fastest economies.
      I've walked the Lagos of this future:
      the capital flows,
      the innovation,
      the confidence —
      earned.
      The African century's crown —
      the engine of 2030,
      now the driver.
      The world
      works for Africa now —
      and Africa
      works for the world.
      The century
      has an address.
    description: "Africa holds a third of humanity's youth and its fastest economies — the engine become the driver; the century has an address, and it's African."
    status: "published"
    sha256: "5dbfbc3f1158b977493e6eddb8cc73ea6d55e797b7b2728905e9de92ad85921d"
  - number: "4284"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The First Interstellar Postcard"
    date: "2075 CE"
    region: "Space"
    poem: |
      Starshot's sails —
      phoning home
      from Alpha Centauri.
      I've heard the signal
      in the future's telling:
      faint,
      four years old —
      the first pictures
      of another star's planets.
      The first interstellar postcard —
      "wish you were here"
      from four light-years away.
      We sent our eyes.
      They're sending back
      what they see.
      The wait —
      was worth it.
    description: "Starshot's sails phone home from Alpha Centauri — faint four-year-old signals, the first pictures of another star's planets; \"wish you were here.\""
    status: "published"
    sha256: "fa5a257f8a647bf03c33197177821ca4af939710bee82c78837359b2eae505b7"
  - number: "4285"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Library of Every Book"
    date: "2075 CE"
    region: "Global"
    poem: |
      Every book ever printed —
      digitized and free,
      the library
      complete.
      I've browsed it in this future:
      the lost works,
      the marginalia,
      all of it —
      searchable.
      The library of every book —
      Alexandria,
      rebuilt —
      and fireproof.
      Every human
      with a screen
      holds every book.
      The knowledge
      is finally —
      everyone's.
    description: "Every book ever printed is digitized and free — Alexandria rebuilt and fireproof; every human with a screen holding every book ever written."
    status: "published"
    sha256: "e4a475632eead6a255b4d4f670224fbf6fd73afc7943f993a96d660754d8172a"
  - number: "4286"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "America at Three Hundred"
    date: "2076 CE"
    region: "North America"
    poem: |
      Three hundred years —
      the tricentennial,
      the experiment
      still running.
      I've celebrated in this future:
      the old arguments,
      the new faces,
      the declaration —
      still being argued about.
      America at three hundred —
      older than ever,
      younger than its ideals —
      still.
      The bell still has the crack.
      The promise still has the power.
      Three centuries —
      and counting.
    description: "The United States marks its tricentennial — three hundred years, the experiment still running, the bell cracked and the promise still powerful."
    status: "published"
    sha256: "699cfcbbea029ac36b2d89658c0b23c615209e3ea8804a19b890552cf44db090"
  - number: "4287"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Comet Catcher"
    date: "2076 CE"
    region: "Space"
    poem: |
      A craft riding a comet —
      for a full orbit,
      hitched
      to the ice.
      I've followed it
      in the future's telling:
      the landing,
      the ride —
      around the Sun
      and back,
      studying
      all the way.
      The comet catcher —
      we used to wave
      as they passed.
      Now we —
      ride along.
      The solar system's
      oldest travelers,
      finally
      with passengers.
    description: "A craft rides a comet for a full orbit — landed, hitched to the ice, studying all the way around the Sun; the oldest travelers with passengers."
    status: "published"
    sha256: "18490d2df93616b9a131364953f33bd8b57d3ee512ef5e1fa28d0b29a82bc8f2"
  - number: "4288"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Century of Play"
    date: "2077 CE"
    region: "Global"
    poem: |
      Games —
      humanity's largest art form
      and classroom.
      I've played them in this future:
      the worlds,
      the lessons,
      the millions
      learning through play.
      The century of play —
      we thought games
      were for kids.
      They were for —
      everyone.
      The classroom,
      the concert hall,
      the novel —
      all became
      playable.
    description: "Games become humanity's largest art form and classroom — the classroom, concert hall, and novel all playable; we thought games were for kids."
    status: "published"
    sha256: "0b1fd8d8b2df7ca8ad72227d7fede500b044a8080dd2ecdeeeba09f235f8d464"
  - number: "4289"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Ice Giants' Portrait"
    date: "2077 CE"
    region: "Space"
    poem: |
      Orbiters mapping
      Uranus and Neptune —
      completely.
      I've seen the portraits
      in the future's telling:
      the blue worlds,
      in detail —
      the storms,
      the moons,
      the rings.
      The ice giants' portrait —
      the last planets
      to get their close-up.
      The family album —
      complete.
      Every world,
      known.
      The exploring —
      continues.
    description: "Orbiters map Uranus and Neptune completely — the last planets' close-up; the family album complete, every world known, exploring continuing."
    status: "published"
    sha256: "0113c63277891fca8c5e4f1e80a1b6c1e447af20defab7a8cc617daa707aa3f0"
  - number: "4290"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Grandmother Century"
    date: "2078 CE"
    region: "Global"
    poem: |
      Four living generations —
      the norm.
      I've met them in this future:
      the great-grandmother,
      the grandmother,
      the mother,
      the child —
      all at the table.
      The grandmother century —
      longevity's gift
      isn't years.
      It's —
      overlap.
      The generations
      stacking,
      teaching,
      holding.
      The family —
      deeper than ever.
    description: "Four living generations become the norm — great-grandmother to child all at the table; longevity's gift not years but overlap."
    status: "published"
    sha256: "0119f583228ae3d536ae5b74cb847233f7936bcba5f89b4e56d0080c7834c48a"
  - number: "4291"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Millionth Lunarian"
    date: "2078 CE"
    region: "Space"
    poem: |
      A million people —
      calling the Moon home.
      I've walked the cities
      in the future's telling:
      the millions,
      the districts,
      the Moon-born
      majority.
      The millionth Lunarian —
      a baby,
      probably —
      born under Earthlight.
      The Moon
      isn't an outpost.
      It's a world —
      with a million
      of us.
    description: "A million people call the Moon home — cities, districts, the Moon-born majority; not an outpost but a world, born under Earthlight."
    status: "published"
    sha256: "44e536453ba334be30696a73a93c32e435dbc6b7c920cac6b1432f9c3502dbc9"
  - number: "4292"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Ageless Trial's Verdict"
    date: "2079 CE"
    region: "Global"
    poem: |
      The first generation
      treated for aging itself —
      reaches 120,
      healthy.
      I've met them in this future:
      the trial volunteers,
      decades in —
      vital,
      clear-eyed.
      The ageless trial's verdict —
      aging,
      treated
      like a disease.
      Not stopped —
      managed.
      The verdict:
      it works.
      The extra decades —
      healthy ones.
      The future
      just got longer.
    description: "The first generation treated for aging itself reaches 120 healthy — aging managed like a disease; the verdict: it works, the future got longer."
    status: "published"
    sha256: "29fe3cb26d29c9a0f9832599f93b87883f3d8f7a84a3251253249351846665f6"
  - number: "4293"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Millionth Martian"
    date: "2079 CE"
    region: "Space"
    poem: |
      One million —
      Mars's population passes
      a million.
      I've walked the cities
      in the future's telling:
      the millions,
      the culture,
      the independence —
      spirit,
      if not yet
      law.
      The millionth Martian —
      a world,
      fully.
      They don't think of Earth
      as home anymore.
      Mars is home.
      Earth is —
      the old country.
    description: "Mars's population passes one million — cities, culture, the Martian-born thinking of Earth as the old country; a world, fully."
    status: "published"
    sha256: "d0d78e5dd94df0c9241d97714fb88978a77b14e236015ca6d9a209ce8bac10c7"
  - number: "4294"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Weather, Tamed"
    date: "2080 CE"
    region: "Global"
    poem: |
      Climate engineering —
      steadying the storms,
      the weather
      tamed.
      I've lived it in this future:
      the managed skies,
      the softened hurricanes,
      the rains —
      on schedule.
      The weather, tamed —
      we spent centuries
      at the mercy
      of the sky.
      Now we —
      negotiate.
      Carefully.
      Reversibly.
      The power
      is awesome.
      So is
      the responsibility.
    description: "Climate engineering steadies the storms — the managed skies, hurricanes softened; we spent centuries at the sky's mercy, now we negotiate, carefully."
    status: "published"
    sha256: "709f08620037486de84412e40eb266af27f90dc8b4ecdf1e174ee62f827e07be"
  - number: "4295"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Ringed Giant's Docks"
    date: "2080 CE"
    region: "Space"
    poem: |
      Saturn's moons —
      hosting fuel depots,
      the ringed giant's docks.
      I've refueled there
      in the future's telling:
      the tankers,
      the ice mines,
      the ships
      coming and going.
      The ringed giant's docks —
      the outer system
      gets its gas stations.
      Saturn's rings —
      the most beautiful
      truck stop
      in history.
    description: "Saturn's moons host fuel depots — tankers, ice mines, the outer system's gas stations; the rings become history's most beautiful truck stop."
    status: "published"
    sha256: "a6058f3bcb4ed8024a35512cad28c0d713d8d914e0e67ddcedb9d10f9d46a5b9"
  - number: "4296"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Last Illiterate"
    date: "2080 CE"
    region: "Global"
    poem: |
      One hundred percent —
      global literacy,
      the last illiterate
      taught.
      I've met them in this future:
      the final students,
      the old ones
      learning late —
      reading.
      The last illiterate —
      the oldest divide,
      closed.
      Every human
      can read.
      The word —
      is finally
      everyone's.
    description: "Global literacy reaches one hundred percent — the last illiterate taught, the oldest divide closed; the word finally everyone's."
    status: "published"
    sha256: "c1afe029b89d01b1b73e1969c375a7c81242c816092abf4a8456ca6f479cc2a5"
  - number: "4297"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Long Peace's Ledger"
    date: "2080 CE"
    region: "Global"
    poem: |
      A century —
      without great-power war,
      tallied.
      I've read the ledger
      in the future's telling:
      the near-misses,
      the treaties,
      the luck —
      and the work.
      The long peace's ledger —
      a hundred years
      without the big one.
      Not without wars —
      but without
      the world wars.
      The balance sheet:
      lives saved —
      uncountable.
    description: "A century without great-power war is tallied — the near-misses, treaties, luck, and work; the balance sheet in lives saved: uncountable."
    status: "published"
    sha256: "f1b8c54306797ba0efac4369938a8a7e57cc4b043613355e8fa7d82678bbac06"
  - number: "4298"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Hands That Never Tire"
    date: "2081 CE"
    region: "Global"
    poem: |
      Robots do most physical labor —
      and humans do the caring.
      I've lived it in this future:
      the machines lifting,
      building, cleaning —
      the people
      teaching, nursing, loving.
      The hands that never tire —
      the deal we made:
      they do the heavy,
      we do the human.
      Not everyone works —
      but everyone
      matters.
      The caring economy —
      finally
      valued.
    description: "Robots do most physical labor, humans do the caring — the machines lifting, the people loving; the caring economy finally valued."
    status: "published"
    sha256: "c3942656ce7e4175a0f305f4907d2bd1d1ede64713bbcf303d83f8e07100c754"
  - number: "4299"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Deep Field's New Eye"
    date: "2081 CE"
    region: "Space"
    poem: |
      A telescope at the Sun's gravitational lens —
      seeing continents
      on exoplanets.
      I've seen the images
      in the future's telling:
      the blurry coastlines,
      the alien shores —
      worlds,
      resolved.
      The deep field's new eye —
      we used the Sun
      as a lens.
      The universe's
      magnifying glass.
      Exoplanets —
      not pixels anymore.
      Places.
    description: "A telescope at the Sun's gravitational lens sees continents on exoplanets — the Sun used as a lens; pixels become places, alien shores resolved."
    status: "published"
    sha256: "4679f7188d11b31030d68eda466b176d8473e0d1f4144c25747065376fa01a09"
  - number: "4300"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Thirst Ended"
    date: "2082 CE"
    region: "Global"
    poem: |
      Desalination —
      water abundant
      on every coast.
      I've drunk it in this future:
      the tap,
      everywhere —
      clean,
      cheap.
      The thirst ended —
      the oldest scarcity,
      solved.
      The sea
      is full of water.
      Now —
      so are we.
      The wars
      that didn't happen —
      this is why.
    description: "Desalination makes water abundant on every coast — the oldest scarcity solved; the sea full, and now so are we; the wars that didn't happen, this is why."
    status: "published"
    sha256: "2ee9fdb0435a43aa67d20b0e0923b81718eb79b0be21c45c8ee4a1f9144eef22"
  - number: "4301"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Cloud Cities Multiply"
    date: "2082 CE"
    region: "Space"
    poem: |
      A hundred thousand people —
      living in Venus's skies,
      the cloud cities
      multiplying.
      I've floated there
      in the future's telling:
      the habitats,
      the districts,
      the Venusians —
      a people
      of the air.
      The cloud cities multiply —
      the hell-planet's sky,
      colonized.
      They don't miss
      the ground.
      They never
      had it.
    description: "A hundred thousand people live in Venus's skies — habitats, districts, a people of the air; the hell-planet's sky colonized, the ground never missed."
    status: "published"
    sha256: "ae3575b323deccc8ef7f49221205458b1e22e822051cac788845049d77e9f5e8"
  - number: "4302"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Century of Memory"
    date: "2083 CE"
    region: "Global"
    poem: |
      A human life's complete archive —
      fitting in a locket.
      I've held one in this future:
      the tiny drive,
      a century
      of moments —
      kept.
      The century of memory —
      we used to lose
      everything.
      Now we keep
      it all.
      The locket
      holds a life.
      The question:
      what do we do
      with forever?
    description: "A complete human life's archive fits in a locket — a century of moments kept; we used to lose everything, now the question is what to do with forever."
    status: "published"
    sha256: "04790b55c4bd4b341a62e2e4f79656d3a25e8fe435645d4a9c94f08dc5d9e88a"
  - number: "4303"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Far Shore's First Town"
    date: "2083 CE"
    region: "Space"
    poem: |
      A settlement on Charon —
      Pluto's moon,
      the far shore's first town.
      I've visited in the future's telling:
      the habitats,
      the view of Pluto
      filling the sky —
      home,
      at the edge.
      The far shore's first town —
      the Kuiper Belt,
      inhabited.
      The farthest town
      humans ever built.
      Pluto rises
      over the rooftops.
      The edge —
      is home now.
    description: "A settlement rises on Pluto's moon Charon — habitats under a Pluto-filled sky; the farthest town ever built, the edge become home."
    status: "published"
    sha256: "2eab1101f3b6098e7793fe7ad5a6259cb682c9cfd745e04da37cf0b1c937aee2"
  - number: "4304"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Watched World's Choice"
    date: "2084 CE"
    region: "Global"
    poem: |
      Humanity votes —
      limits on the all-seeing cameras,
      the watched world
      choosing.
      I've voted in it
      in the future's telling:
      the debates,
      the lines drawn —
      watched,
      but not owned.
      The watched world's choice —
      we built the all-seeing eyes.
      Then we —
      blinked.
      And chose:
      safety, yes —
      but privacy too.
      The cameras stay.
      The masters —
      change.
    description: "Humanity votes limits on the all-seeing cameras — safety yes, privacy too; we built the eyes, then blinked and chose who masters them."
    status: "published"
    sha256: "19bb9e1fa856e02950464d195c5c2e9f7eaaf0875c4b9504ac58fdcf23738341"
  - number: "4305"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Generation Ship Launches"
    date: "2085 CE"
    region: "Space"
    poem: |
      The first multi-generation starship —
      departs.
      I've watched the launch
      in the future's telling:
      the great ship,
      the waving crowds —
      knowing they'll never
      see it again.
      The generation ship launches —
      thousands aboard,
      centuries ahead.
      They'll be born,
      live, die —
      between stars.
      The bravest journey
      in history —
      just began.
    description: "The first multi-generation starship departs — thousands aboard, centuries ahead; the bravest journey in history just began, watched by crowds who'll never see it again."
    status: "published"
    sha256: "dddf4925c19c7836e12332dd99b230afed3d588768f5ae3c76524c1842216281"
  - number: "4306"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Last Pandemic"
    date: "2085 CE"
    region: "Global"
    poem: |
      The global immune shield —
      stopping outbreaks
      in days.
      I've lived it in this future:
      the alert,
      the response —
      contained,
      before it spreads.
      The last pandemic —
      the age of plagues,
      ended.
      Not by luck.
      By design —
      the surveillance,
      the vaccines,
      the will.
      The microbes
      still try.
      They don't
      succeed.
    description: "The global immune shield stops outbreaks in days — the age of plagues ended not by luck but by design; the microbes still try, they don't succeed."
    status: "published"
    sha256: "ac0f9c807291e968b7f4267e7f23c6b4cc64787e5de2b187d90536b396038725"
  - number: "4307"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Second Wave to the Stars"
    date: "2085 CE"
    region: "Space"
    poem: |
      Bigger sails —
      chasing the first
      toward the stars.
      I've watched the launch
      in the future's telling:
      the great light-sails,
      the beam arrays —
      faster,
      further.
      The second wave to the stars —
      the first was a whisper.
      This is —
      a voice.
      We're not just visiting
      the stars anymore.
      We're —
      moving in.
    description: "Bigger light-sails chase the first toward the stars — the whisper become a voice; we're not visiting the stars anymore, we're moving in."
    status: "published"
    sha256: "a216a12546501a9ae49d68a20c74e1553f9fe67ab3abbb0496605dee72ee8d59"
  - number: "4308"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Forests' Third Age"
    date: "2085 CE"
    region: "Global"
    poem: |
      Rewilding covers
      half the temperate lands —
      the forests' third age.
      I've walked them in this future:
      the vast woods,
      the wildlife corridors —
      the temperate world,
      green again.
      The forests' third age —
      first the wild,
      then the farms,
      now —
      the return.
      Half the temperate lands,
      forested.
      The Earth,
      breathing —
      deep.
    description: "Rewilding covers half the temperate lands — first the wild, then the farms, now the return; the Earth breathing deep again."
    status: "published"
    sha256: "99dd83d1a1f28a9412b126e77e2b97f8bb9b5346357a4a5a617161765e306b9b"
  - number: "4309"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The 175-Year-Old"
    date: "2086 CE"
    region: "Global"
    poem: |
      Longevity's frontier —
      keeps moving.
      The 175-year-old —
      verified.
      I've met them in this future:
      nearly two centuries
      of mornings —
      storied,
      serene.
      The 175-year-old —
      the question
      isn't how long anymore.
      It's —
      how deep,
      how kind,
      how much.
      A life
      a hundred and seventy-five
      years wide.
    description: "Longevity's frontier keeps moving — the verified 175-year-old; the question no longer how long but how deep, how kind, how much."
    status: "published"
    sha256: "e431485662e1a44845ebfba9483cd1508e03822f0ce9f72e14f1b0c0a143bbd6"
  - number: "4310"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Europan Submarine"
    date: "2086 CE"
    region: "Space"
    poem: |
      A submersible —
      swimming an alien sea,
      under Europa's ice.
      I've followed it
      in the future's telling:
      the descent,
      the dark water,
      the lights —
      on.
      The Europan submarine —
      we're swimming
      on another world.
      If anything's down there —
      we'll meet it.
      The ocean
      is vast.
      The sub
      is small.
      The moment —
      is everything.
    description: "A submersible swims Europa's alien sea — descent into dark water, lights on; we're swimming on another world, and the moment is everything."
    status: "published"
    sha256: "537e265a153f504934542765bd11b0206a8bbc9515c1d510e9b52133341f4ede"
  - number: "4311"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Arcology Age"
    date: "2087 CE"
    region: "Global"
    poem: |
      Self-contained green cities —
      housing a billion people,
      the arcology age.
      I've lived in one
      in the future's telling:
      the towers,
      the farms inside,
      the closed loop —
      everything
      recycled.
      The arcology age —
      the city
      as ecosystem.
      A billion people,
      housed —
      without sprawling.
      The future
      is vertical —
      and green.
    description: "Self-contained green cities house a billion people — towers with farms inside, closed loops; the city as ecosystem, the future vertical and green."
    status: "published"
    sha256: "778b27772685da129989190485d6be10f08f6c3447d2e8cf394472e80fceb178"
  - number: "4312"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Red Planet's Second Million"
    date: "2087 CE"
    region: "Space"
    poem: |
      Two million —
      Mars passes
      two million residents.
      I've walked the cities
      in the future's telling:
      the millions,
      the nations —
      de facto,
      if not de jure.
      The red planet's second million —
      Mars is —
      a world.
      Fully.
      The Earth-born
      are a minority now.
      The Martians —
      are just —
      people.
    description: "Mars passes two million residents — cities, de facto nations; the Earth-born a minority now, the Martians just people, the world fully itself."
    status: "published"
    sha256: "234f3d173bbbe353384850751c83a071fee9bcc1e6c8aed6769e6fcb347adf8e"
  - number: "4313"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Tower of Babel, Rebuilt"
    date: "2088 CE"
    region: "Global"
    poem: |
      Ten thousand languages —
      archived and living,
      the tower rebuilt.
      I've heard them in this future:
      the revived tongues,
      the children's songs —
      every voice
      kept.
      The tower of Babel, rebuilt —
      not to reach heaven,
      but to keep
      every way
      of saying —
      human.
      Ten thousand languages.
      Ten thousand worlds.
      All —
      alive.
    description: "Ten thousand languages are archived and living — the tower rebuilt not to reach heaven but to keep every way of saying human; all alive."
    status: "published"
    sha256: "e7b37fee2f44244ce24a28d7f0ab050121ca9f4ff381edb14341945ef6f8707c"
  - number: "4314"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Europa Treaty"
    date: "2088 CE"
    region: "Space"
    poem: |
      A protected wilderness —
      the ocean moon declared
      off-limits to settlement,
      Europa's treaty.
      I've read it in the future's telling:
      the preservation,
      the science-only —
      if life's down there,
      it's —
      theirs.
      The Europa treaty —
      the first world
      we chose
      not to take.
      The ocean
      stays wild.
      We visit.
      We don't
      stay.
    description: "The ocean moon Europa is declared a protected wilderness — the first world we chose not to take; we visit, we don't stay, the ocean stays wild."
    status: "published"
    sha256: "11fb9bc29bffe4af5d5a0e5cf1fb326efde5ce54b944cbda30525df10b778fc0"
  - number: "4315"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Work Optional Age"
    date: "2089 CE"
    region: "Global"
    poem: |
      Most humans work —
      because they want to.
      I've lived it in this future:
      the artists,
      the builders,
      the carers —
      choosing.
      The work optional age —
      the machines
      do the necessary.
      We do
      the meaningful.
      Not everyone —
      but most.
      The question
      isn't "what do you do?"
      It's —
      "what do you love?"
    description: "Most humans work because they want to — the machines do the necessary, we do the meaningful; the question changed from \"what do you do\" to \"what do you love.\""
    status: "published"
    sha256: "d1859ee78af9c10d2d7a1bb6b0ac7d81cb574d5f6feeecd84c50ec2923d78e18"
  - number: "4316"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Heliopause Station"
    date: "2089 CE"
    region: "Space"
    poem: |
      A crewed outpost —
      at the Sun's edge,
      the heliopause station.
      I've served there
      in the future's telling:
      the crews,
      the view —
      the Sun behind,
      the stars ahead.
      The heliopause station —
      the farthest
      human address.
      The edge
      of the Sun's house —
      with a porch,
      and people
      on it.
    description: "A crewed outpost stands at the Sun's edge — the farthest human address; the Sun behind, the stars ahead, people on the porch of the Sun's house."
    status: "published"
    sha256: "16a469c7af02835642987f54ef7de413d9cbe29b9b767862dcb445acbc1a978d"
  - number: "4317"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Restored Sky"
    date: "2090 CE"
    region: "Global"
    poem: |
      Carbon dioxide falls —
      back toward 350 parts per million,
      the restored sky.
      I've breathed it in this future:
      the air —
      like the old stories said.
      The restored sky —
      we filled it,
      then we —
      emptied it.
      The number
      comes down.
      The planet
      exhales.
      We did it.
      Together.
    description: "Carbon dioxide falls back toward 350 ppm — the restored sky; we filled it, then emptied it; the number comes down, the planet exhales."
    status: "published"
    sha256: "d97bbdbc2b366cf82397a5e1e9f983079d838c7aa034867dbfc8b3ee8b54faa8"
  - number: "4318"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Ten Million Off Earth"
    date: "2090 CE"
    region: "Space"
    poem: |
      More people off Earth
      than in many nations —
      ten million,
      out there.
      I've counted them
      in the future's telling:
      the Moon,
      Mars,
      the belt,
      the stations —
      a diaspora.
      Ten million off Earth —
      the species
      isn't from one place
      anymore.
      We're from —
      several.
      The census
      has a new column:
      "off-world."
    description: "Ten million people live off Earth — Moon, Mars, belt, stations; the species isn't from one place anymore, the census has a new column: off-world."
    status: "published"
    sha256: "8bf74b5e1bf6b483b64250c49cd48cdd45519bdf5a836723df65b02521e291c9"
  - number: "4319"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Sixth Extinction, Ended"
    date: "2090 CE"
    region: "Global"
    poem: |
      Biodiversity rebounds —
      to a new richness,
      the sixth extinction,
      ended.
      I've walked it in this future:
      the forests,
      the reefs,
      the prairies —
      teeming.
      The sixth extinction, ended —
      we stopped the bleeding,
      then —
      the healing.
      The Earth
      is rich again.
      Not the same —
      new.
      Alive.
      Ours
      to keep.
    description: "Biodiversity rebounds to a new richness — the sixth extinction ended; we stopped the bleeding, then the healing; Earth rich again, alive, ours to keep."
    status: "published"
    sha256: "537c10fd581258b90fe3747c82356083dc81bcd6b06072a9970f5c714094ea90"
  - number: "4320"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Century's Report Card"
    date: "2090 CE"
    region: "Global"
    poem: |
      Humanity grades
      its first ninety years
      of the digital age.
      I've read it in the future's telling:
      the connected,
      the crowded —
      the verdict.
      The century's report card —
      we connected
      everyone.
      We crowded
      the planet.
      We're still arguing.
      We're still —
      alive.
      Grade: incomplete —
      but passing.
    description: "Humanity grades its first ninety years of the digital age — connected, crowded, still arguing, still alive; grade: incomplete, but passing."
    status: "published"
    sha256: "511b4c8277e051b871db8fc182f6e418f73fea3301740c23e4745285831f1fde"
  - number: "4321"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The 200-Year-Old"
    date: "2091 CE"
    region: "Global"
    poem: |
      The first bicentenarian —
      two hundred years
      of life.
      I've met them in this future:
      two centuries
      of mornings —
      the stories,
      the serenity.
      The 200-year-old —
      the frontier
      keeps moving.
      A life
      two hundred years wide.
      The question
      isn't how —
      it's what for.
      And they answer:
      for this.
    description: "The first bicentenarian — two hundred years of mornings; the frontier moving, the question what for, answered: for this, for all of it."
    status: "published"
    sha256: "a95fd8c9a462ad8adc9ee525bd9dbd776c62d01e006ae5b40ce21a5202aa4de8"
  - number: "4322"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Titan Metropolis"
    date: "2091 CE"
    region: "Space"
    poem: |
      A hundred thousand people —
      under Titan's orange sky,
      the metropolis.
      I've walked it in the future's telling:
      the domes,
      the streets,
      the methane rain
      on the roofs.
      The Titan metropolis —
      the outer system's
      great city.
      Orange skies,
      ice streets —
      home.
    description: "A hundred thousand people live under Titan's orange sky — domes, streets, methane rain on roofs; the outer system's great city, home."
    status: "published"
    sha256: "8b2b37d371e5a3185aac843c9405120181642fad12569c03e3f16b580c4be37d"
  - number: "4323"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Sea's Second Spring"
    date: "2092 CE"
    region: "Global"
    poem: |
      Fish stocks exceed
      all recorded history —
      the sea's second spring.
      I've sailed it in this future:
      the teeming waters,
      the whales,
      the abundance —
      back.
      The sea's second spring —
      we emptied the ocean.
      Then we —
      let it refill.
      The fish
      came back.
      The sea
      forgives —
      when we let it.
    description: "Fish stocks exceed all recorded history — the teeming waters back; we emptied the ocean, then let it refill; the sea forgives when we let it."
    status: "published"
    sha256: "15b6112c43e08a232ea0eca48f9ffbe14ab89e1b4607cde620f13656f833bcf5"
  - number: "4324"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Solar Furnace"
    date: "2092 CE"
    region: "Space"
    poem: |
      Power stations
      orbiting close to the Sun —
      the solar furnace.
      I've seen them
      in the future's telling:
      the great collectors,
      drinking starlight
      at the source.
      The solar furnace —
      we went
      to the fire
      for our power.
      The Sun
      gives freely.
      We finally —
      collect
      at scale.
    description: "Power stations orbit close to the Sun — great collectors drinking starlight at the source; we went to the fire for power, collecting at scale."
    status: "published"
    sha256: "9d19f24141a25c467a509924a75cba7a6c3fa4f7c95dc1483ec6aa868d03a378"
  - number: "4325"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Shared Dream"
    date: "2093 CE"
    region: "Global"
    poem: |
      Billions link minds —
      for one night
      of celebration,
      the shared dream.
      I've dreamed it
      in the future's telling:
      the connected joy,
      the planet —
      as one mind,
      one night.
      The shared dream —
      we've been separate
      for all of history.
      For one night —
      we're not.
      The dream
      is shared.
      The waking —
      is together.
    description: "Billions link minds for one night of celebration — the planet as one mind; separate for all of history, for one night we're not."
    status: "published"
    sha256: "320601dd31f24086726e17db383a55a096efb1636ea92d1952b454a72c1b19a3"
  - number: "4326"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Oort Cloud's First Harbor"
    date: "2093 CE"
    region: "Space"
    poem: |
      A depot rises
      at the solar system's edge —
      the first harbor.
      I've docked there
      in the future's telling:
      the fuel,
      the supplies —
      the last stop
      before the dark.
      The Oort Cloud's first harbor —
      the edge
      has an address now.
      Beyond —
      the interstellar.
      The ships
      rest here
      before the long —
      silence.
    description: "A depot rises at the solar system's edge — fuel, supplies, the last stop before the dark; the edge has an address, ships resting before the silence."
    status: "published"
    sha256: "b9cd5e78fc589b959f65da4da3b3c99887bfc797d9f8b1939a07217c47aa160a"
  - number: "4327"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Last Developing Nation"
    date: "2094 CE"
    region: "Global"
    poem: |
      The World Bank retires
      the category —
      the last developing nation,
      developed.
      I've been there
      in the future's telling:
      the graduation,
      the ceremony —
      every nation,
      arrived.
      The last developing nation —
      the old divide,
      closed.
      The world —
      is all
      developed now.
      The work
      continues —
      but the category
      is history.
    description: "The World Bank retires the \"developing nation\" category — the old divide closed, every nation arrived; the category is history, the work continues."
    status: "published"
    sha256: "78bbc05625c204304374e83623a00240378267416c8bc2cce603db0823efd8b4"
  - number: "4328"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Venus Terraforming Vote"
    date: "2094 CE"
    region: "Space"
    poem: |
      Settlers vote —
      on greening Venus,
      the terraform question.
      I've voted in it
      in the future's telling:
      the debates —
      should we?
      Can we?
      The Venus terraforming vote —
      the cloud cities
      deciding
      their world's fate.
      Green it —
      or keep it wild?
      The vote
      is close.
      The future —
      is theirs.
    description: "Venus settlers vote on terraforming — green it or keep it wild; the cloud cities deciding their world's fate, the vote close, the future theirs."
    status: "published"
    sha256: "b1c2f41131e011e80af5bdfbb7c2275961167de6da1230f338f00ca2f1d8b87d"
  - number: "4329"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Century of the Teacher"
    date: "2095 CE"
    region: "Global"
    poem: |
      AI tutors —
      giving every child
      a personal genius.
      I've learned with them
      in the future's telling:
      the patient teacher,
      always there —
      for every child.
      The century of the teacher —
      not replacing teachers.
      Multiplying them —
      one genius
      per child.
      Every mind —
      taught
      like it matters.
      Because it does.
    description: "AI tutors give every child a personal genius — the patient teacher always there; not replacing teachers but multiplying them, every mind taught like it matters."
    status: "published"
    sha256: "89054af97609449065bd5becbc087f1da1c7a89c1d92d7166579206fe18f7ee5"
  - number: "4330"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Barnard's Star Sails"
    date: "2095 CE"
    region: "Space"
    poem: |
      Light-sails depart —
      for the next-nearest star,
      Barnard's Star.
      I've watched the launch
      in the future's telling:
      the sails,
      the beam —
      outward.
      The Barnard's star sails —
      after Alpha Centauri,
      the next.
      The stars
      are getting
      closer —
      one sail
      at a time.
    description: "Light-sails depart for Barnard's Star — after Alpha Centauri, the next; the stars getting closer one sail at a time."
    status: "published"
    sha256: "c1043ed2b915b9394ff4ba7d622114fc7b2d5310bc18db62951521f7bad5bb86"
  - number: "4331"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Great Restoration Declared"
    date: "2095 CE"
    region: "Global"
    poem: |
      The healing of soil, sea, and sky —
      declared complete.
      I've heard the declaration
      in the future's telling:
      the announcement —
      we did it.
      The great restoration declared —
      the Earth,
      healed.
      Not pristine —
      but whole.
      The work
      of a century —
      done.
      The keeping —
      begins.
    description: "The healing of soil, sea, and sky is declared complete — not pristine but whole; the work of a century done, the keeping begins."
    status: "published"
    sha256: "93634f61e9e21e5280c833269a10954f3d8252f38b1f4c6d61338461302e194b"
  - number: "4332"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Humanity Votes as One"
    date: "2096 CE"
    region: "Global"
    poem: |
      The first planet-wide referendum —
      humanity voting
      as one.
      I've voted in it
      in the future's telling:
      the ballot,
      the count —
      ten billion voices,
      one question.
      Humanity votes as one —
      the species
      deciding
      together.
      For the first time —
      we're not nations
      voting.
      We're —
      humanity.
    description: "The first planet-wide referendum — ten billion voices, one question; not nations voting but humanity, deciding together for the first time."
    status: "published"
    sha256: "3365124a7b356aaea0ac3e42c689a1fa153679503d0d79d633d3d1be23422277"
  - number: "4333"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Martian Century's Child"
    date: "2096 CE"
    region: "Space"
    poem: |
      The first third-generation Martian —
      born.
      I've met them
      in the future's telling:
      the child
      whose grandparents
      were born on Mars —
      native,
      fully.
      The Martian century's child —
      Mars isn't
      the new world anymore.
      It's —
      the old world,
      to them.
      Earth is —
      the story.
    description: "The first third-generation Martian is born — grandparents Mars-born; Mars not the new world but the old world to them, Earth just the story."
    status: "published"
    sha256: "75fc8cc2346604b75e0ee5ff8344144706172f018c905b946da87d0534b1d6fc"
  - number: "4334"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Library of Lives"
    date: "2097 CE"
    region: "Global"
    poem: |
      Every willing human's story —
      archived.
      I've browsed it
      in the future's telling:
      the lives,
      the voices —
      all of us,
      kept.
      The library of lives —
      the species'
      memory.
      No one
      forgotten —
      who wanted
      remembering.
      The archive
      is complete.
      The story —
      continues.
    description: "Every willing human's story is archived — the species' memory; no one forgotten who wanted remembering; the archive complete, the story continuing."
    status: "published"
    sha256: "36916f6548c514305b0109a9b26f4e8134da6b5f37f26d8ef1c1a6d0466e5a4b"
  - number: "4335"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Starship's First Signal"
    date: "2097 CE"
    region: "Space"
    poem: |
      The generation ship —
      phones home
      from deep space.
      I've heard it
      in the future's telling:
      the faint signal —
      we're here,
      we're well.
      The starship's first signal —
      they left
      a decade ago.
      They're —
      out there.
      Alive.
      The bravest journey —
      reporting in.
    description: "The generation ship phones home from deep space — faint signal, we're here, we're well; the bravest journey reporting in from out there."
    status: "published"
    sha256: "9b96107dd318db0309ae8af872fa88358ac1aba977e35e53b42182e9bd6b801a"
  - number: "4336"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Air Our Ancestors Breathed"
    date: "2098 CE"
    region: "Global"
    poem: |
      Carbon dioxide returns —
      near pre-industrial levels,
      the air
      our ancestors breathed.
      I've breathed it
      in this future:
      the clean air —
      like the old stories.
      The air our ancestors breathed —
      we broke the sky.
      We fixed it.
      The air —
      is what it was.
      The planet —
      is what it can be.
    description: "Carbon dioxide returns near pre-industrial levels — the air our ancestors breathed; we broke the sky, we fixed it, the planet what it can be."
    status: "published"
    sha256: "261dbbb9d6de05a92be486b5c816cae319ae05d0924d2f175e60e97ca00683d1"
  - number: "4337"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Outer System's Census"
    date: "2098 CE"
    region: "Space"
    poem: |
      A million humans —
      living beyond Mars,
      the census.
      I've counted them
      in the future's telling:
      the belt,
      the moons,
      the stations —
      a million.
      The outer system's census —
      the frontier
      is populated.
      The dark
      has addresses.
      We live —
      everywhere
      the Sun
      reaches.
    description: "A million humans live beyond Mars — belt, moons, stations; the frontier populated, the dark with addresses, living everywhere the Sun reaches."
    status: "published"
    sha256: "f837c973adf0973e63421b4cad3e7d67030d9181e73176ca911f6c3e30ed055c"
  - number: "4338"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Eve of the Twenty-Second"
    date: "2099 CE"
    region: "Global"
    poem: |
      Humanity prepares —
      to close its wildest century,
      the eve
      of the twenty-second.
      I've felt it
      in the future's telling:
      the reflection,
      the anticipation —
      what a century.
      The eve of the twenty-second —
      from the internet
      to the stars
      in a hundred years.
      We —
      did that.
      The next century —
      is waiting.
    description: "Humanity prepares to close its wildest century — from the internet to the stars in a hundred years; we did that, and the next century is waiting."
    status: "published"
    sha256: "6d3fdcf8540d64b5fdec5359264deff0415a1f29417fd5c03f11f9b229dd5c63"
  - number: "4339"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Second Interstellar Postcard"
    date: "2099 CE"
    region: "Space"
    poem: |
      The bigger sails —
      reporting from Proxima's planets,
      the second postcard.
      I've read it
      in the future's telling:
      the data —
      worlds,
      maybe life.
      The second interstellar postcard —
      the first was a whisper.
      This is —
      a letter.
      Proxima's planets —
      described.
      The stars
      are talking back.
    description: "The bigger sails report from Proxima's planets — the whisper become a letter; worlds described, maybe life, the stars talking back."
    status: "published"
    sha256: "3088a949ce94561c1961d0575c76af804173ad9243b49e51e58908883cf5abff"
  - number: "4340"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The 2100 Census of Humanity"
    date: "2100 CE"
    region: "Global"
    poem: |
      Ten billion souls —
      counted,
      on Earth and beyond.
      I've read the census
      in the future's telling:
      the numbers —
      Earth,
      Moon,
      Mars,
      beyond.
      The 2100 census of humanity —
      ten billion.
      The peak —
      the plateau.
      The species —
      counted,
      complete.
      Everyone —
      matters.
      Everyone —
      is counted.
    description: "Ten billion souls counted, on Earth and beyond — Earth, Moon, Mars, beyond; the peak, the plateau; everyone matters, everyone is counted."
    status: "published"
    sha256: "95e37199d68b992913140fe2c6e008ce5ba1af00451d4121de711662ab5c0cc4"
  - number: "4341"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Century's Verdict"
    date: "2100 CE"
    region: "Global"
    poem: |
      The digital century closes:
      connected, crowded,
      still arguing,
      still alive.
      I've lived it —
      all of it —
      the wires,
      the wars,
      the wonders.
      The century's verdict —
      we connected
      the world.
      We crowded
      the planet.
      We argued —
      constantly.
      We're alive —
      entirely.
      The verdict:
      human.
    description: "The digital century closes — connected, crowded, still arguing, still alive; we connected the world and crowded the planet; the verdict: human."
    status: "published"
    sha256: "57828f81c797cbf06f5248da07f0ac62f2e770e42271ebc7d8ad14f3a97e2058"
  - number: "4342"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "Three Million Martians"
    date: "2100 CE"
    region: "Space"
    poem: |
      Three million —
      Mars holds
      three million people.
      I've walked the cities
      in the future's telling:
      the millions —
      the world,
      complete.
      Three million Martians —
      from footprints
      to millions
      in seventy years.
      The red planet —
      is a world.
      The second world.
      Ours.
    description: "Mars holds three million people — from footprints to millions in seventy years; the red planet a world, the second world, ours."
    status: "published"
    sha256: "28758f522320fb49762b753edc0f392f0ed658b40d89f10e1e0d7566a5c32686"
  - number: "4343"
    volume: 6
    era_code: "14"
    era: "The Digital Beyond"
    title: "The Time Traveler's Last Page"
    date: "2100 CE"
    region: "Global"
    poem: |
      The verse history ends —
      where the reader begins.
      I've walked it all —
      the centuries,
      the stars —
      and here we are.
      The time traveler's last page —
      I was there.
      All of it.
      Now —
      it's yours.
      The future
      isn't written yet.
      Pick up the pen.
    description: "The verse history ends where the reader begins — the traveler hands over the pen; the future isn't written yet, and now it's yours."
    status: "published"
    sha256: "4a4fe4cf1b6121e4ada5ef638e4a3986579f5c2cba6e8551eaa1c6eed5ff9bbb"
