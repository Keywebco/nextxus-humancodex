# Living Library, Vol. 3: Faiths and the Medieval World
# Entries 1394 to 2043. Free to download, print and share, forever.
# Text source: the HumanCodex Verse collection (converted by Pontus). Every entry carries a SHA-256 of its poem text so any change can be detected.
# Status "published": the text and numbering are final as published. A poem may still be improved later; every change is dated and the old text is kept. Numbers are permanent: new poems get numbers after 4343, nothing is ever renumbered.
entries:
  - number: "1394"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Counting Every Soul"
    date: "2 CE"
    region: "China"
    poem: |
      I walked the roads with the counting clerks that year,
      brush and bamboo slips, village after village.
      Fifty-seven million. Say it slow.
      Every farmhouse knocked, every name set down.
      They counted the empire the way a farmer counts grain —
      and I stood in the dust of the road and watched
      a whole civilization take its own pulse
      and write the number in the book of heaven.
      Fifty-seven million hearts, beating under one sky,
      and the Han held them all in a ledger.
      I have walked roads that empires paved and watched them crack —
      but that day the counting felt like reverence, not rule.
    description: "Han census clerks count 57 million people — an empire learning its own size, and the traveler watches a nation take its pulse."
    status: "published"
    sha256: "138323a4f59193a2e61f0e8927778a5cca7472415bad74d07ffb84196070a71d"
  - number: "1395"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Heir Who Wasn't"
    date: "4 CE"
    region: "Rome"
    poem: |
      I stood in the palace when old Augustus spoke the name —
      Tiberius, the stepson, the soldier who wanted no crown.
      He had asked to be left alone on his island with his books.
      Now the whole world was set on his shoulders like a yoke.
      I saw him bow his head. I saw what it cost.
      Power does not always go to the one who reaches for it;
      sometimes it goes to the one who turns away,
      and follows him home anyway.
      He ruled for twenty-three years, lonely, capable, cold —
      the empire held, though the man inside it froze.
      I think of him on Capri, staring at the sea,
      a prisoner wearing the world's heaviest crown.
    description: "Augustus adopts the reluctant Tiberius — power falls on the man who never wanted it."
    status: "published"
    sha256: "6d90a7b86f2b673ba4ab74ea12dfa47ee27a38114135c57c821c35cc2ee3cc2f"
  - number: "1396"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "A Census and a Revolt"
    date: "6 CE"
    region: "Judea"
    poem: |
      Count us, said Rome. Write down your names, your oxen,
      so we can tax every breath you take.
      And Judas of Galilee stood in the village square and said —
      no. Do not be counted. Do not kneel to a list.
      I watched the crowd split like wood under an axe.
      One list became two peoples.
      A census is never just counting.
      Sometimes it is the match held to the straw.
      I have seen tax ledgers start wars in a dozen centuries.
      The pattern never changes, only the names.
      Count the people, and the people will count the cost —
      and sooner or later, they stop paying it in coin.
    description: "Rome counts Judea for taxes and Judas of Galilee rises — one imperial list, two peoples, the first spark."
    status: "published"
    sha256: "b58acb98b2673305c20a0112f9cc5f71c13ab8ab8bf539758afb467b39fe749f"
  - number: "1397"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Wang Mang Takes the Throne"
    date: "9 CE"
    region: "China"
    poem: |
      He had read all the old books and believed them.
      Wang Mang, the scholar, took the Han throne
      and tried to rebuild the world from the pages of the past —
      give the land back, free the slaves, price everything fair.
      I walked the markets where his new coins rang hollow.
      The old books were beautiful. The world was not a book.
      Good intentions, carved into a failing harvest,
      and China shook like a house with one beam pulled out.
      He meant well. History is littered with men who meant well
      and broke the world trying to fix it by the book.
      The old texts were wise about the past.
      They knew nothing about the harvest failing now.
    description: "A scholar-emperor tries to rebuild China from ancient texts — the old books were beautiful, but the world wasn't a book."
    status: "published"
    sha256: "4cb6f4abc48d7a0b012ef243cd71b8f9cb580359555c42188e33bca990893cf1"
  - number: "1398"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Three Legions Lost in the Forest"
    date: "9 CE"
    region: "Germany"
    poem: |
      The trees closed over the road like water over a drowning man.
      I heard it before I saw it — the German war horns
      from every side at once, in the rain, in the dark of the oaks.
      Three legions. Twenty thousand men. Varus, the proud,
      watched his column turn into a slaughter-yard
      and fell on his own sword in the mud.
      Arminius, who had eaten at Rome's table, led the killers.
      I walked that forest afterward. The ravens were fat.
      Rome never crossed the Rhine again.
      The empire learned where its edge was —
      written in bones, in the leaves, in the rain.
      I still hear those horns when the wind moves through oaks.
      Some borders are drawn on maps; this one was drawn in blood.
    description: "Arminius annihilates three legions at Teutoburg — the forest swallows Rome's pride and the Rhine becomes the empire's edge."
    status: "published"
    sha256: "f1f4c3cd793d8cb64fc958e7288b9c7b532bcdfc18101de21b2adbdf8be1822d"
  - number: "1399"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Strabo Maps the Known World"
    date: "10 CE"
    region: "Rome"
    poem: |
      An old Greek with sore feet and a full notebook —
      Strabo had walked the whole of the world Rome knew,
      from the pillars of Hercules to the Indus,
      and now he sat and set it all down:
      rivers, mountains, peoples, the taste of each country's bread.
      I stood behind his shoulder as the map grew.
      Seventeen books. The whole earth, as far as any man had seen.
      Every map since is a child of his ink.
      I like to think of him as an old man, the work finally done,
      unrolling the last scroll and knowing it was complete.
      The world was bigger than he knew — it always is —
      but he drew the circle of the known, and the circle held.
    description: "The geographer Strabo completes his tour of the inhabited earth — seventeen books that father every map after."
    status: "published"
    sha256: "c609dd725f88a48d8c2467bc381ab82cba9b5b00d95bafaedfb9d6752e1d0ee1"
  - number: "1400"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The First Emperor Dies"
    date: "14 CE"
    region: "Rome"
    poem: |
      At Nola, in the heat of August, Augustus died
      in Livia's arms — or so they said.
      I stood among the crowds along the road to Rome
      as the body came home in the summer dust.
      Forty-five years he had held the world steady.
      Now Tiberius took the seal, and the age of emperors
      truly began — the republic's ghost laid down at last,
      and one man's will became the weather of the world.
      Forty-five years of holding the world together by will.
      I watched the funeral procession wind through Rome
      and wondered who could possibly carry it next.
      Nobody can, really. They just take turns trying.
    description: "Augustus dies at Nola and Tiberius takes power — the republic's ghost is laid down and the age of emperors begins."
    status: "published"
    sha256: "26251d9b6f50921adb971602d31e7f1222c1bcc8be37fd4d1230afee828fdf0c"
  - number: "1401"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Poet Dies in Exile"
    date: "17 CE"
    region: "Rome"
    poem: |
      Far from Rome, on the gray shore of the Black Sea,
      Ovid died among people whose language he never learned.
      He had sung love too well, too wildly,
      and Augustus had sent him to the end of the earth for it.
      But I tell you — I read his letters there, by the cold water —
      he never stopped writing. The poems kept coming,
      out of exile, out of the wind, out of the loneliness.
      Rome could banish the man.
      It could not banish the song.
      Exile couldn't silence him. Nothing can silence the true ones.
      The Black Sea took his body. The poems belong to everyone.
      His Tristia still teach exiles how to endure —
      write through the cold, and let the poems keep you warm.
    description: "Ovid dies on the Black Sea shore, still writing love poems — Rome banished the man but never the song."
    status: "published"
    sha256: "5e2268fc097650a42939bf714ab29b85e95dae5edee711eacb485ec8b1b44d20"
  - number: "1402"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Germanicus, the People's Prince"
    date: "19 CE"
    region: "Rome"
    poem: |
      He was the one they loved — young, golden, kind,
      Germanicus, who led like a father and laughed like a brother.
      He died in Syria, far from home, and the whole city
      poured into the streets to mourn him.
      I walked with that river of grief. Old women wept
      as if he were their own son. The shops closed.
      Rome has forgotten a thousand generals.
      It never forgot him.
      They named arches for lesser men. They named nothing for him
      except the grief, which needed no monument.
      To be loved like that — truly loved, by a whole city —
      is rarer than any triumph Rome ever gave.
    description: "Beloved young general Germanicus dies in Syria and Rome mourns him like a lost son — the prince the people never forgot."
    status: "published"
    sha256: "d46fa63e770ca099d127d8b21ec68b732955a241e5cf812ee0b219174a26a86f"
  - number: "1403"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Red Eyebrows Rise"
    date: "23 CE"
    region: "China"
    poem: |
      They were starving. That is the whole story.
      The farmers painted their eyebrows red —
      so they would know each other in the dark —
      and marched on Wang Mang's capital with hoes and hunger.
      I stood in the road as they passed. Their eyes were fire.
      No speeches. No banners of silk. Just empty bellies
      and red brows, like a wound walking.
      Empires fall for many reasons.
      This one fell to hunger with painted faces.
      I have seen revolutions begin with speeches and with bread.
      The bread ones are the ones that win.
      Hunger is the oldest argument, and it never loses.
    description: "Starving farmers paint their brows red and march on the capital — Wang Mang's empire falls to hunger with painted faces."
    status: "published"
    sha256: "098506af97c2f191184377b53a537303a1ae4d9d42b0cd898ea482b739c9d432"
  - number: "1404"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Han Restored"
    date: "25 CE"
    region: "China"
    poem: |
      Out of the ashes came Liu Xiu — a farmer's son
      with a general's luck and a scholar's patience.
      He took the throne as Emperor Guangwu
      and rebuilt the Han at Luoyang, stone by stone.
      I watched the new capital rise: the markets filling,
      the fields green again, the old songs returning.
      Dynasties die. Sometimes, if the right hands catch the pieces,
      they are born again — not the same, but alive.
      China exhaled. The long night of Wang Mang was over.
      Restoration is harder than conquest — anyone can break a thing.
      Liu Xiu rebuilt it piece by piece, patient as a farmer.
      China breathed again, and the fields came back to life.
    description: "Liu Xiu takes the throne as Emperor Guangwu and rebuilds the Han at Luoyang — a dynasty reborn from the ashes."
    status: "published"
    sha256: "6df27c802c14095c4b45a9ce00bd4af82c3d77977685d6d63a1a437f3f91c11e"
  - number: "1405"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Pontius Pilate Arrives"
    date: "26 CE"
    region: "Judea"
    poem: |
      He came off the ship from Rome with a hard face
      and ten hard years behind it. Pontius Pilate.
      I watched him walk the streets of Jerusalem
      like a man who had already decided everyone was guilty.
      Ten years of iron. Ten years of the crowd hating him
      and him hating the crowd right back.
      History remembers one morning of his governorship.
      I remember all of it — the whole hard decade,
      the man the empire sent to hold a holy city
      with a mailed fist.
      Ten years of iron, and history remembers a single morning.
      That is how it goes: a decade of grinding, one day of fire.
    description: "The hard Roman governor Pontius Pilate takes charge of Judea — ten iron years, and one morning the world will never forget."
    status: "published"
    sha256: "281953c5b0ec09680e569e0387e0aa604b14f7766039655879210cb21b0db30b"
  - number: "1406"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Sejanus Falls"
    date: "31 CE"
    region: "Rome"
    poem: |
      One morning he was the most powerful man in Rome —
      Sejanus, commander of the guards, Tiberius's right hand.
      By nightfall he was strangled in the dark,
      his body thrown down the palace stairs.
      I watched the city turn on him in a single day:
      the same senators who had fawned at his feet
      voted his statues smashed before dinner.
      Power in Rome was a tide. Sejanus learned
      how fast it goes out — and drowns the man standing in it.
      By nightfall the statues were coming down.
      Rome forgets fast when fear changes its address.
      I watched them cheer his fall who had cheered his rise —
      same crowd, same throats, different day.
    description: "Tiberius's all-powerful guards commander Sejanus is strangled in a single day — Rome learns how fast the tide of power goes out."
    status: "published"
    sha256: "a193d3734f4e2eac0ca0d908c624dd8f78a1f055315db3bcdf826c279a825a89"
  - number: "1407"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Money Panic"
    date: "33 CE"
    region: "Rome"
    poem: |
      The bankers stopped lending. The debtors stopped paying.
      Credit froze like a river in winter, and Rome —
      mighty Rome, mistress of the world — shook with fear
      over money. Actual fear. I saw senators pale in the Forum.
      Then Tiberius opened the imperial vaults and poured gold
      into the panic, and the river thawed.
      The first bailout in history, and I was there to see it:
      an emperor saving the bankers with the people's gold,
      two thousand years before anyone had a word for it.
      The bankers were saved. The debtors were not.
      Some things never change, in any century.
      I stood in the Forum and watched the gold move —
      from the many, to the few, by imperial decree.
    description: "A credit crash shakes Rome and Tiberius bails out the bankers with imperial gold — the first bailout in history."
    status: "published"
    sha256: "2651e9bd4b1658537dbbc20eda8d1830ba845c6fa449a5bb0b917959bbad7f1b"
  - number: "1408"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Caligula Takes the Crown"
    date: "37 CE"
    region: "Rome"
    poem: |
      The boy raised in army camps — little boots, they called him —
      took the crown to cheers that shook the city.
      Caligula. Rome loved him at first. Oh, how they loved him.
      I stood in the cheering crowds. I remember the hope.
      Then the sickness came, and when he rose from it,
      something else had risen with him.
      The boy was gone. What wore the crown afterward
      was a monster learning, day by day,
      how much fear one man can carve out of a whole people.
      I was there for the cheering. I wish I hadn't been.
      Hope is a terrible thing to waste on the wrong man.
      Rome would pay for that hope in blood, year after year.
    description: "The army-camp boy becomes emperor to cheering crowds — then sickness takes the boy and leaves a monster wearing the crown."
    status: "published"
    sha256: "aabb947d6361b921651f8d63045e015ec8d4c798dfb1ad7f7f3f6a74a3818a86"
  - number: "1409"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Emperor Who Would Be God"
    date: "39 CE"
    region: "Rome"
    poem: |
      He ordered it plainly: raise my statue in the Temple at Jerusalem.
      Let the Jews bow to me as a god.
      Caligula — the monster with the crown — would plant his golden face
      in the holiest room on earth.
      I stood in Jerusalem and felt the city hold its breath.
      The priests said: kill us first.
      Only his murder stopped it — a knife in a palace corridor,
      and the statue never came.
      Sometimes history turns on a single blade in the dark.
      The priests had said: kill us first. They meant it.
      Faith like that doesn't bend for emperors.
      A knife in a corridor saved a temple —
      history's smallest hinge, swinging the biggest door.
    description: "Caligula orders his statue raised in the Jerusalem Temple — only his assassination stops the sacrilege."
    status: "published"
    sha256: "bdd8fe3de55c867c938ff7cbf8f6a60ce104cc9a115981b07e6505bf354ed8cf"
  - number: "1410"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Claudius, Found Behind a Curtain"
    date: "41 CE"
    region: "Rome"
    poem: |
      They found him hiding behind a curtain in the palace —
      Claudius, the stammering uncle, the family joke,
      trembling while the soldiers laughed and dragged him out.
      And then — because Rome needed an emperor the way a drowning man
      needs a rope — they made him one.
      I watched him straighten up. I watched the joke become a ruler,
      and a good one: he built, he judged, he governed.
      Never laugh at the man behind the curtain.
      He may be the only sane one in the room.
      He stammered. He limped. He read old histories for fun.
      And he ruled better than the shining ones.
      The palace wanted a puppet and found a statesman —
      Rome's luckiest accident.
    description: "Soldiers find stammering Claudius hiding behind a palace curtain and make him emperor — the family joke becomes a good ruler."
    status: "published"
    sha256: "205d2b92872e0ef624d1b8af5ac72a4003fe42dbabed14a2a93601ea60137fff"
  - number: "1411"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Rome Invades Britain"
    date: "43 CE"
    region: "Britain"
    poem: |
      The ships came at dawn — hundreds of them —
      and the legions waded ashore onto the white cliffs' island.
      Britain. The edge of the world, where the fog eats the sun.
      I marched with them through the dripping woods,
      past the painted warriors screaming from the treeline.
      Rome would hold this island for four hundred years.
      Four centuries of roads, and walls, and Latin in the rain —
      all of it beginning on one gray morning
      with wet sandals on a foreign beach.
      Four hundred years of Latin in the rain.
      Roads that outlasted the legions that built them.
      I marched those roads. They are still there, under the grass.
    description: "Claudius's legions land in Britain — four centuries of Roman roads, walls, and Latin in the rain begin on a gray beach."
    status: "published"
    sha256: "d7bca3d6b6a9ac89570739f1e827e0add716f0cb99c04faa10af39e957b458a5"
  - number: "1412"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Apostle James Dies"
    date: "44 CE"
    region: "Judea"
    poem: |
      Herod Agrippa wanted to please the crowd,
      so he took James — fisherman, apostle, brother of thunder —
      and had him killed by the sword.
      The first of the twelve to die for the Name.
      I stood at the edge of the crowd. It was quick.
      It was meant to frighten the rest into silence.
      It did the opposite. The blood of the first martyr
      watered something that would not stop growing —
      a church that learned, that day, what it would cost.
      The first to fall is often the first remembered.
      James, the fisherman, the thunder-brother —
      his blood wrote the church's first lesson:
      this will cost you everything, and it is worth it.
    description: "Herod Agrippa executes the apostle James — the first martyr's blood waters a church that learns what it will cost."
    status: "published"
    sha256: "6b90b3694710f6946c495a2a583d36a22ce375596c7ec576a14deb7c1846c8bc"
  - number: "1413"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Stupa at Amaravati"
    date: "45 CE"
    region: "India"
    poem: |
      On the banks of the Krishna river the carvers raised it —
      a great dome of stone, ringed with stories:
      the Buddha's lives, carved in marble, circling like prayer.
      I ran my hands along the carved panels, warm in the sun.
      Elephants, lotuses, dancers frozen mid-step —
      a whole universe in stone, telling anyone who could see:
      the wheel turns, suffering ends, compassion remains.
      Two thousand years later the carvings still speak.
      Stone remembers what kings forget.
      I ran my fingers over the carved lotuses
      and felt the chisel-marks of men two thousand years dead.
      They are gone. Their devotion isn't.
      Stone keeps what hearts put into it.
    description: "Carvers raise a great Buddhist stupa on the Krishna river — a universe in carved stone telling of compassion that outlasts kings."
    status: "published"
    sha256: "1e971ea01ddf4a00bd4ce9b55d37a2d2e169e3d12d71abf367e4df2ea7aa2f20"
  - number: "1414"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Philosopher in the Palace"
    date: "46 CE"
    region: "Rome"
    poem: |
      Seneca — the richest, sharpest mind in Rome —
      took the young Nero by the hand and began to teach him.
      Wisdom moved into the imperial household.
      I listened at the edges of those lessons:
      on anger, on mercy, on how a good man rules.
      For a little while it worked. For a little while
      the philosopher's words held the boy steady.
      Then the boy became the emperor, and the emperor
      became the monster — and Seneca learned
      that you can teach a prince everything
      except how not to be one.
      Seneca wrote it all down — the anger, the mercy, the shortness of life.
      The student ignored every word. The world read them all.
    description: "Seneca begins tutoring young Nero — wisdom moves into the palace, but the lessons cannot hold the boy who becomes a monster."
    status: "published"
    sha256: "c664c60a8e9ebee978a846857fc750b9fd191ddf8b547d8b1d86db556b05b7e7"
  - number: "1415"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Healer's Handbook"
    date: "50 CE"
    region: "India"
    poem: |
      Charaka gathered it all — the herbs, the surgeries,
      the pulse under the finger, the foods that heal and harm —
      into one great book of the body.
      I sat with the physicians who studied it,
      learning which leaf draws fever out,
      how to set a broken bone, when to bleed and when to wait.
      Two thousand years before modern medicine,
      India wrote down what the body already knew.
      The handbook traveled. The healing spread.
      Knowledge, once written, is a seed that never dies.
      I have watched medicines change names a dozen times since.
      The body hasn't changed. Charaka knew the body.
    description: "Charaka's great medical text gathers India's knowledge of herbs, surgery, and the body — a seed of healing that never dies."
    status: "published"
    sha256: "370c88026a50bd0862f0d566816a481ae966b7620159ba61cabee4f766df3c1d"
  - number: "1416"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Thomas Comes to Malabar"
    date: "52 CE"
    region: "India"
    poem: |
      Tradition says he came by ship to the southwest coast —
      Thomas, the doubter, the apostle —
      stepping onto the sand at Malabar with the gospel in his mouth.
      I walked those palm-shaded shores and heard the old Christians there
      tell it like it happened yesterday:
      how he preached, how he healed, how he stayed.
      True or legend, the churches of Kerala still bear his name,
      two thousand years of prayer rooted in one man's landing.
      Some footprints never wash away.
      The old Christians of Kerala told me the story
      the way you tell something your grandfather saw.
      Doubt brought Thomas further than certainty ever takes most men.
      The doubter became the believer who sailed farthest.
    description: "Tradition says the apostle Thomas lands on India's Malabar coast — two thousand years of prayer rooted in one man's landing."
    status: "published"
    sha256: "bfdceaeef7830f7e086d29129dbdd471f08743f29164a1ba2b66f363a5816350"
  - number: "1417"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Nero Takes the Throne"
    date: "54 CE"
    region: "Rome"
    poem: |
      Seventeen years old. Handsome. An artist.
      Rome applauded when Nero took the throne —
      the golden boy, the singer, the charioteer.
      I was in the crowd that day. The hope was real.
      Nobody applauding knew what was coming:
      the murders, the madness, the city burning,
      the Christians dying in the gardens.
      Seventeen, and the whole world in his hands —
      and the hands were wrong for it.
      Rome would learn what it costs
      to crown a boy who wants applause more than duty.
      Seventeen, applauded, golden — and already rotting inside.
      I left Rome before the fire. I could smell it coming.
    description: "Seventeen-year-old Nero takes the throne to applause — the golden boy whose hands were wrong for the world they held."
    status: "published"
    sha256: "232af8dc05cc18a5f88decbf9b0b2a9b3be6ff716696bd07d42ff1f8e969c1cc"
  - number: "1418"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Paul's Letters"
    date: "57 CE"
    region: "Corinth"
    poem: |
      He wrote them by lamplight, on the road, in prison —
      letters to little struggling churches in Corinth, in Rome,
      in towns nobody important had ever heard of.
      Paul, the tentmaker, the traveler, the firebrand.
      I carried some of those letters myself, hand to hand,
      across the empire's roads.
      He had no idea — none of us did —
      that those hurried pages would outlast the empire,
      would be read by billions, would shape the faith itself.
      Ink on papyrus. That was all.
      That was everything.
      He never saw a printing press, never dreamed of billions.
      He just wrote, and walked, and wrote again.
    description: "Paul writes hurried letters to struggling young churches — ink on papyrus that will outlast the empire and shape a faith."
    status: "published"
    sha256: "6d209726eac98a95d7841727e46fba8adc1fc193df5527f189124ff02fe48f5e"
  - number: "1419"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The White Horse Temple"
    date: "59 CE"
    region: "China"
    poem: |
      The emperor dreamed of a golden man, floating, shining —
      and his wise men said: this is the Buddha, from the West.
      So the sutras came east on white horses,
      and at Luoyang the first temple rose: the White Horse Temple.
      I stood in its courtyard when the incense was new.
      Two worlds met there — the dragon and the dharma —
      and China would never be the same.
      A dream. A horse. A temple.
      That is how religions cross mountains.
      The white horses are long gone. The temple still stands.
      Religions cross mountains on stranger roads than this.
      A dream did what armies couldn't:
      it opened China to the Buddha.
    description: "The emperor dreams of a golden man and China's first Buddhist temple rises at Luoyang — the dragon meets the dharma."
    status: "published"
    sha256: "a2ca35b14376da939930d461757baf76b85ec463dc95a444eaba9dd85c2bd81d"
  - number: "1420"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Boudica's Revolt"
    date: "60 CE"
    region: "Britain"
    poem: |
      They flogged her. They shamed her daughters.
      And Boudica — widowed queen of the Iceni —
      rose up with fire in her hands and an army at her back.
      I watched her chariot roll through the burning towns:
      Colchester, London, St. Albans — Roman towns, Roman pride,
      going up in smoke and screaming.
      Rome sent its legions. The queen fell.
      But the Britons never forgot her, and neither did I —
      a woman wronged, who made an empire bleed
      before she died free.
      The Romans wrote her down as a savage. She wasn't.
      She was a queen defending her own — and Rome never forgave her for it.
    description: "Wronged queen Boudica burns Roman towns before she falls — a woman who made an empire bleed and died free."
    status: "published"
    sha256: "ad3f076ab3e4b68249c816e9f29deaca1d28e7fda8a7dd27a17a9418a1182dd1"
  - number: "1421"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Philosopher Ordered to Die"
    date: "62 CE"
    region: "Rome"
    poem: |
      Nero's order came at dinner: Seneca must die.
      Open your veins. Do it yourself.
      I stood in the room as the old philosopher —
      the teacher, the writer, the richest mind in Rome —
      calmly cut his wrists and kept dictating to his scribes.
      On virtue. On death. On how a wise man meets the end.
      The blood ran. The words kept coming.
      Nero could kill the man. He could not kill the sentences.
      They are still here. He is not.
      He died the way he lived: composed, deliberate, teaching.
      The veins opened. The pen — in others' hands — kept moving.
      Two thousand years on, students still read him.
      Nero is a footnote in Seneca's story, not the other way around.
    description: "Nero orders Seneca's death and the philosopher dies dictating to his scribes — the blood ran, but the sentences survived."
    status: "published"
    sha256: "ae6749c94b2e17655b35b9f4d6919f825861da0197f20790245a8c07da9f2857"
  - number: "1422"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Rome Burns"
    date: "64 CE"
    region: "Rome"
    poem: |
      Six days. The fire ate the city for six days —
      I choked on the smoke, I watched the temples fall,
      the poor quarters, the rich streets, all of it going up
      in one red roar that turned night into a second noon.
      And Nero — they say he sang while it burned.
      Then he needed someone to blame, and he chose the Christians.
      The persecutions began in the ashes of that fire.
      Rome would be rebuilt in marble.
      The Christians would be rebuilt in martyrs.
      Six days of fire, and the scapegoats were chosen.
      I watched them dragged to the gardens, and I remember their singing.
      Rome burned Christians to light its parties —
      and the light outlasted Rome.
    description: "Fire devours Rome for six days and Nero blames the Christians — the persecutions begin in the ashes."
    status: "published"
    sha256: "5c2d8450e6d0a1f4390dd26727ae3ae0eb84be60ed3df789e183e93da599d1e4"
  - number: "1423"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Peter and Paul Die"
    date: "64 CE"
    region: "Rome"
    poem: |
      Tradition holds they died in Nero's persecution —
      Peter, the fisherman, crucified upside down, they say,
      because he would not die the way his Lord had;
      Paul, the Roman citizen, granted the quicker sword.
      I cannot swear to the details. I can swear to this:
      two men who had walked the roads of the empire
      with nothing but a message died for it in Rome,
      and the message did not die with them.
      The empire killed the messengers.
      The message outlived the empire.
      Peter the rock, Paul the traveler — both gone in Nero's madness.
      The church they built buried the empire that killed them.
    description: "Tradition holds both apostles are executed in Nero's persecution — the empire killed the messengers, but the message outlived it."
    status: "published"
    sha256: "e8b3502d9d6b442c7d84b99dc7c21c5584b25c65de6a5109ad35a8b7b5b0418a"
  - number: "1424"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Poet-Conspirator"
    date: "65 CE"
    region: "Rome"
    poem: |
      Lucan had sung of Rome's civil wars in verse so fine
      it made the old soldiers weep.
      Then he joined the plot against Nero — and was caught.
      The order came: die by your own hand.
      I watched him in his last hour, young, brilliant, furious —
      reciting his own poetry as the blood left him,
      the lines about dying Romans on his lips.
      He wrote about death in war.
      Then he performed it, alone, in a room in Rome.
      The poem outlasted the conspiracy.
      The poem outlasted Nero, too.
      Young, brilliant, dead by his own hand on Nero's order.
      The verses survived the veins. They always do.
    description: "The poet Lucan, caught plotting against Nero, dies reciting his own verses — the poem outlasted the conspiracy and the emperor."
    status: "published"
    sha256: "5d0f208d9543a39c2be5739ddcbf4fc0cba666c0299b275be8cecadbccc0f74b"
  - number: "1425"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Year of Four Emperors"
    date: "68 CE"
    region: "Rome"
    poem: |
      Nero fell — a knife, a ditch, a coward's end —
      and then the throne was empty, and the vultures came:
      Galba, Otho, Vitellius, Vespasian.
      Four men in one year. Four armies. Four Romes.
      I walked through streets where soldiers fought soldiers
      and nobody knew whose head was on the coins anymore.
      Civil war is the empire eating itself.
      It ended when Vespasian — the plain soldier —
      stood on the pile and said: enough.
      And Rome, bleeding, believed him.
      Four emperors, one year, and the empire held its breath.
      Vespasian's plain strength was the exhale.
    description: "Nero falls and four men claim the throne in one bloody year — the empire eats itself until Vespasian says enough."
    status: "published"
    sha256: "e37631a47ec0e8467710225c6141aa3e2ace13ed7e6bc2c5b73d5a13832057ab"
  - number: "1426"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Masada Holds Out"
    date: "73 CE"
    region: "Judea"
    poem: |
      On the desert rock, above the Dead Sea, they held out —
      the last rebels, the last free Jews in Judea,
      while the Roman legions built a ramp to the sky below them.
      I stood on that plateau in the wind. You can feel it still:
      the choice they made when the wall broke.
      Death over chains. Every one of them.
      They say the Romans found only silence and the wind.
      I say they found the one thing Rome could never conquer —
      people who would rather die standing than live kneeling.
      The Romans found nine hundred and sixty bodies, they said,
      and two women and five children hiding in the cisterns.
      The living told the story. The dead made it immortal.
      Masada: the place where surrender was never an option.
    description: "The last rebels on Masada choose death over Roman chains — the one thing Rome could never conquer."
    status: "published"
    sha256: "ed0e3deabdb535a9ca554c94b4b6daa884020b9de807a4711426c0cf1bce51c1"
  - number: "1427"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Temple of Peace"
    date: "75 CE"
    region: "Rome"
    poem: |
      Vespasian built it beside the Forum — not a temple of war,
      but of peace: Rome's first public museum of art.
      Statues, paintings, treasures from Nero's golden house,
      all set out where anyone could walk in and look.
      I wandered those halls with the crowds.
      Farmers and senators stood side by side
      before the same marble gods.
      Art for everyone — the emperor's idea of peace.
      Two thousand years later, we still build museums.
      He built the first.
      Peace had a temple, and the people came to look.
      Vespasian understood: empires need beauty, not just bread.
    description: "Vespasian builds Rome's first public museum of art beside the Forum — farmers and senators standing side by side before marble gods."
    status: "published"
    sha256: "4246694ebbbbbb83654aca3ded7e192115c59ab9b649a0a6a223e66ad6208dc6"
  - number: "1428"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Pliny's Great Encyclopedia"
    date: "77 CE"
    region: "Rome"
    poem: |
      Thirty-seven books. Everything known.
      Pliny the Elder sat up all night, every night,
      reading, copying, asking, writing —
      animals, plants, stones, stars, the whole of nature
      set down in one man's lifetime of lamp-oil.
      I watched him work: he slept in snatches,
      ate standing up, said no moment of life should be wasted.
      He finished it. Then the mountain took him.
      But the books remained — the ancient world's memory,
      bound in thirty-seven volumes.
      He died chasing a volcano, notebook in hand.
      The books were his real monument — thirty-seven of them.
    description: "Pliny the Elder finishes his Natural History — thirty-seven books holding everything the ancient world knew."
    status: "published"
    sha256: "3c9700724c03bff25732da2b6db5c25c37796144a9437b67ece40aea58c51abd"
  - number: "1429"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Mountain Eats Two Cities"
    date: "79 CE"
    region: "Italy"
    poem: |
      The sky went black at noon. I was there.
      Vesuvius — the green mountain everyone picnicked on —
      tore itself open and ate Pompeii and Herculaneum whole:
      ash, stone, poison air, a cloud like a pine tree
      covering the sun.
      Pliny the Elder sailed toward it — toward it, to help —
      and the cloud took him too.
      I walked the buried streets later, in the gray silence.
      Bread still in the ovens. A dog still chained.
      The mountain keeps what it takes.
      I have seen cities fall to armies and to time.
      Only the mountain froze one mid-breath, for us to find.
    description: "Vesuvius buries Pompeii and Herculaneum — Pliny the Elder sails toward the cloud to help, and the mountain keeps him too."
    status: "published"
    sha256: "ecf362e173d28a4f450054c3360925a12c17e3f0339d6d89978285867842b631"
  - number: "1430"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Colosseum Opens"
    date: "80 CE"
    region: "Rome"
    poem: |
      A hundred days of games. Titus opened the great arena —
      fifty thousand seats of stone rising like a mountain in the city —
      and Rome poured in to watch men die for sport.
      I sat in those crowds. The roar was like the sea.
      Gladiators, wild beasts, sea-battles on a flooded floor.
      It was magnificent. It was horrible.
      That is Rome in one building: the greatest engineering on earth
      devoted to the oldest cruelty.
      The stones still stand. The cheers are gone.
      A hundred days of killing, and Rome called it celebration.
      I sat through one afternoon. It was enough.
      The arena taught Rome nothing.
      The ruins teach us everything.
    description: "Titus opens the Colosseum with a hundred days of games — Rome's greatest engineering devoted to its oldest cruelty."
    status: "published"
    sha256: "471d5de4b2da25124f7aebf516f1f8570efc7b45c9d1019759dd7b445e0a4050"
  - number: "1431"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Domitian's Terror Begins"
    date: "81 CE"
    region: "Rome"
    poem: |
      The last Flavian took the throne smiling,
      and then the smiles stopped.
      Domitian filled the palace with spies,
      and the executions began — senators, philosophers,
      anyone whose shadow fell wrong across his fear.
      I walked the Forum in those years and felt it:
      the city holding its breath, doors closing early,
      no one speaking freely, not even to friends.
      Terror is a tax every citizen pays daily.
      Rome paid it for fifteen years.
      Fifteen years of holding your breath.
      I walked those streets and felt the whole city flinch at footsteps.
      Tyranny ends, always — usually with a knife.
      But the flinching takes generations to unlearn.
    description: "Domitian turns the palace into a court of spies and executions — Rome holds its breath for fifteen years of terror."
    status: "published"
    sha256: "9824d873ef943beca6062d0d76cce985ea8ddfb315d5d004d1a5a5dacd3d1f37"
  - number: "1432"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Agricola's Northern March"
    date: "83 CE"
    region: "Britain"
    poem: |
      At Mons Graupius, in the far north of Britain,
      Agricola's legions broke the painted tribes —
      the farthest Rome would ever reach on that island.
      I stood on that cold hillside afterward,
      the wind cutting through my cloak,
      looking out at a land that would never be Roman.
      They won the battle. They never held the ground.
      Empires have a reach, and then they have a grasp —
      and the two are not the same thing.
      The Caledonians never read the victory dispatches.
      They just kept living beyond the wall, free.
      I stood on that hillside and understood:
      some lands are not meant to be held, only visited.
    description: "Agricola wins at Mons Graupius — Rome's farthest reach in Britain, a victory in a land it could never hold."
    status: "published"
    sha256: "3d487d2e3d9c961050366d77ffe044b5227789e1033ea3182dfb5c9dbd5a4f5b"
  - number: "1433"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Rabbis at Yavneh"
    date: "90 CE"
    region: "Judea"
    poem: |
      The Temple was gone — burned, stones scattered.
      So the rabbis gathered at Yavneh, in a small town,
      and did something no empire expected:
      they rebuilt a whole people around words.
      Law. Study. Prayer. The book became the homeland.
      I sat in on those debates — fierce, loving, endless —
      old men arguing over a single letter as if the world depended on it.
      It did. Two thousand years later, their grandchildren
      still argue the same way.
      You can burn a temple. You cannot burn a conversation.
      The debates continue to this day, in study houses worldwide.
      Same arguments, same love of the letter.
      I sat in on one, two thousand years later —
      the conversation outlived every empire that tried to end it.
    description: "With the Temple destroyed, rabbis at Yavneh rebuild Jewish life around law and study — a conversation no empire can burn."
    status: "published"
    sha256: "6ce7144ba25e4124a37fc873ce4930e857faa2cfe55db0e98f4f1f4f983c2cc0"
  - number: "1434"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Vine Edict"
    date: "92 CE"
    region: "Rome"
    poem: |
      Domitian looked at the wine market and frowned:
      too many provincial vineyards, too much competition for Italy.
      So he ordered half of them torn up — the vines of Gaul,
      of Spain, of the provinces, ripped from the earth by decree.
      I walked through vineyards where old men wept
      over stumps that had fed their grandfathers.
      An emperor can order the market. He cannot order the earth.
      The vines grew back. The edict died.
      Even tyrants lose arguments with nature.
      I drank wine in Gaul a century later, from those same hills.
      The vines had forgiven the emperor. The earth always does.
      Tyrants write edicts. Farmers plant anyway.
      Guess which one the future remembers.
    description: "Domitian orders half the provinces' vineyards destroyed to protect Italian wine — the vines grow back, the edict dies."
    status: "published"
    sha256: "9145413f813c245fce9fc01d0622eae917f8f346a8073495e4e444e061104f06"
  - number: "1435"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Ban Chao's Far Frontier"
    date: "94 CE"
    region: "Central Asia"
    poem: |
      Ban Chao rode west with his horsemen —
      past the deserts, past the oasis kingdoms —
      until they stood at the edge of the Caspian Sea
      and looked toward a Rome they would never quite reach.
      I rode with that column. The dust, the distances —
      thirty years of campaigning in the far west.
      China touched the West that year, fingertip to fingertip,
      two great empires sensing each other across the world.
      The silk road ran on the courage of men like him.
      Thirty years on the frontier, and he never saw Rome.
      He didn't need to. He carried China to the world's edge.
      The silk road remembers his horsemen's dust.
      Empires touch, fingertip to fingertip, through men like him.
    description: "Han horsemen under Ban Chao reach the Caspian's edge — China touches the West, fingertip to fingertip across the world."
    status: "published"
    sha256: "47bc441590d5098dd2ead2cb77de7517501c9b12c330985cedba64133cc5b16d"
  - number: "1436"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Senate Strikes Back"
    date: "96 CE"
    region: "Rome"
    poem: |
      His own servants did it — a knife in the palace dark.
      Domitian, the terror of Rome, bled out on his own floor,
      and the Senate — the same Senate that had trembled for fifteen years —
      rose up and damned his memory: smash the statues, erase the name.
      I watched them do it, chisels ringing on marble.
      Damnatio memoriae. The official forgetting.
      But I remember. Somebody has to.
      Erasing a tyrant's name doesn't erase the years he stole.
      They chiseled his name off every stone in Rome.
      It took years. The fear took longer to chisel away.
      I remember the relief in the streets, though —
      the city exhaling after fifteen years of holding its breath.
    description: "Domitian is assassinated and the Senate damns his memory — statues smashed, name erased, but the stolen years remain."
    status: "published"
    sha256: "34a56ff61336864e63ad6b80125f5b7f8c23c3d944479fcfbb71c787a9efbfba"
  - number: "1437"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Old Man Emperor"
    date: "97 CE"
    region: "Rome"
    poem: |
      Nerva was old, childless, and the army didn't respect him —
      so he did the wise thing: he adopted the soldier Trajan,
      the best general in the empire, and made him his son and heir.
      I stood in the Senate when it was announced.
      The old man had bought Rome peace with his own mortality.
      He died within the year, but his one great act held:
      choose the best man, not the nearest blood.
      For eighty years, Rome would follow that rule —
      and those were the golden years.
      One good decision by a dying old man.
      That's all it took to give Rome its golden age.
      I think about that whenever the world feels broken:
      sometimes the hinge of history is simply choosing well.
    description: "Old, childless Nerva adopts the soldier Trajan — choosing the best man over blood, and buying Rome its golden age."
    status: "published"
    sha256: "bb63f24f94b34273ed1bb0e4d0f90e8aba2e0d4b9a960efd696e1bddde326793"
  - number: "1438"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Trajan Takes Power"
    date: "98 CE"
    region: "Rome"
    poem: |
      The Spanish general came to Rome, and the city exhaled.
      Trajan — soldier, builder, the emperor the people would call
      the best of them all.
      I watched his first procession: no terror, no spies,
      just a strong man walking into a tired capital
      with work to do.
      Rome's greatest expansion began that year —
      not just of borders, but of what an emperor could be.
      The golden age didn't start with gold.
      It started with a good man saying yes.
      The Spaniard with the soldier's stride and the builder's heart.
      Rome's best emperor, and he never wanted a dynasty —
      just good men, chosen well, one after another.
      The golden age was a chain of good choices.
    description: "The Spanish general Trajan becomes emperor — Rome's greatest expansion begins with a good man saying yes."
    status: "published"
    sha256: "395fa21fa0cf22158916e2379f18f249d998d788fc385f45628f878e2d3b9078"
  - number: "1439"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Octagon Builders"
    date: "c. 100 CE"
    region: "North America"
    poem: |
      In the Ohio valley they raised geometry out of the earth —
      great circles, octagons, avenues of mounded soil
      so vast you can only see their shape from the sky.
      The Hopewell people. No one knows all of why.
      I walked those earthworks at dawn, the mist in the low places,
      and felt the mathematics under my feet —
      moon and sun tracked in dirt and grass.
      They had no writing. They had the sky, and patience,
      and hands that could move mountains one basket at a time.
      No writing, no iron, no wheels — and geometry you can see from the moon.
      I keep thinking about those baskets of earth, one by one.
      Civilization isn't machines. It's patience,
      and hands, and the sky, and time.
    description: "Hopewell people raise vast geometric earthworks in the Ohio valley — moon and sun tracked in dirt and grass, mountains moved one basket at a time."
    status: "published"
    sha256: "133dd7201c119e7dd79ea702c27d88719bf122a959a9c2794aac32ed2daf1f4c"
  - number: "1440"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Dacian Wars Begin"
    date: "101 CE"
    region: "Dacia"
    poem: |
      Trajan crossed the Danube with the legions —
      bridge of boats, eagles in the mountain wind —
      to crush Decebalus, the Dacian king who had humbled Rome before.
      I marched with that army into the Carpathians.
      It was hard country and harder fighting:
      fortresses on cliffs, warriors who would not yield.
      Two wars it took. The gold of Dacia flowed to Rome.
      But I remember the Dacian dead on those ridges —
      brave men, defending the only home they'd known,
      against the greatest army on earth.
      Decebalus killed himself rather than be paraded in Rome.
      His gold built Trajan's Forum; his courage built the legend.
      I stood on those ridges and honored both sides.
      The winners write the columns. The mountains remember the rest.
    description: "Trajan crosses the Danube to crush Decebalus's mountain kingdom — hard country, harder fighting, and brave men defending home."
    status: "published"
    sha256: "ebb0f5c3ebc63069845fd30fbde51e02ecb291f47c11a7e608005d39833a6af0"
  - number: "1441"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Bread for the Poor Children"
    date: "103 CE"
    region: "Rome"
    poem: |
      Trajan's alimenta: the imperial purse, opened for hungry children.
      Across Italy, poor families got loans and bread-money
      so their children could eat and grow.
      I stood in a village square when the grain came —
      mothers crying, children eating, an old clerk checking names.
      No triumph. No arch. Just full bellies.
      Empires are judged by their monuments, they say.
      I judge them by this: did the children eat?
      That year, in Italy, they did.
      No arch was raised for the alimenta. No triumph.
      Just children eating, in village squares across Italy.
      I judge every ruler I've ever seen by this one measure.
      Trajan passes. Most fail.
    description: "Trajan's alimenta feeds Italy's hungry children from the imperial purse — no triumph, no arch, just full bellies."
    status: "published"
    sha256: "b88ac50c784afccf899d8aa694c1ef59988eb13561c52d3c6db2875a5bd773ac"
  - number: "1442"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Cai Lun's Paper"
    date: "105 CE"
    region: "China"
    poem: |
      Cai Lun, a court official, showed the emperor something new:
      sheets made from bark and rags and old fishing nets —
      paper. Light, cheap, smooth enough for a brush.
      I held one of those first sheets. It was rough at the edges.
      Nobody in that room understood what had just happened.
      Every book, every letter, every poem you have ever held —
      it all starts here, with bark and rags in a Chinese courtyard.
      The most important invention in history,
      and it looked like nothing at all.
      Bark, rags, old nets — and the emperor held the future.
      I have written on paper my whole traveling life.
      Every word you've read from me crossed time on Cai Lun's invention.
      The mightiest empire's gift: something to write on.
    description: "Cai Lun shows the emperor paper made from bark and rags — the most important invention in history, looking like nothing at all."
    status: "published"
    sha256: "bbf2f0321bf60e8a1c17aaddd9201295d793caa4e8528fabe143fb758bf3ffb3"
  - number: "1443"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Bridge Over the Danube"
    date: "105 CE"
    region: "Danube"
    poem: |
      Apollodorus spanned it — the great river, the Danube —
      with a bridge of stone piers and timber arches,
      a mile long, carrying the legions into Dacia.
      I walked across it in the wind, the water black below.
      It was the longest bridge in the world, and Rome built it
      for war — to move armies, to hold an empire together.
      Bridges are promises, made in stone:
      we will come back, we will hold, we will remain.
      This one held for a century and a half.
      Then the river took back its own.
      A mile of stone and timber over the Danube's black water.
      I crossed it in the wind, and felt Rome's confidence under my feet.
      Bridges are empires saying: we will return.
      The river, in the end, had the last word.
    description: "Apollodorus spans the Danube with a mile-long bridge of stone and timber — a promise in stone that held for a century and a half."
    status: "published"
    sha256: "be94b446ee1aab55c0d68ba26985e8972cf75e2617c50a936c7a169b94494b1c"
  - number: "1444"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Rome Takes Petra"
    date: "106 CE"
    region: "Arabia"
    poem: |
      Trajan annexed the Nabataean kingdom, and Petra —
      the rose-red city carved into the cliffs —
      became Roman.
      I walked its narrow canyon at sunset, the walls glowing pink,
      the tombs and temples cut straight from the living rock.
      The Nabataeans had ruled the desert trade for centuries;
      now the eagles flew over their carved facades.
      Empires absorb. The city stayed beautiful.
      The caravans kept coming. Only the flags changed —
      and flags, in the desert, are the lightest thing of all.
      The rose-red cliffs don't care whose eagle flies above them.
      Nabataean, Roman, Byzantine — the carvans kept coming.
      I drank tea in Petra with traders who'd seen three flags.
      Trade outlasts every empire that taxes it.
    description: "Trajan annexes Nabataea and rose-red Petra becomes Roman — the caravans keep coming; only the flags change."
    status: "published"
    sha256: "ce9acfec6cc6845aea739917cdf5ff8aed9b0a7f845504d7d7c11a860e04679e"
  - number: "1445"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Ignatius Goes to the Lions"
    date: "107 CE"
    region: "Syria"
    poem: |
      They marched him to Rome in chains — Ignatius, bishop of Antioch —
      to die in the arena for the Name.
      And on the road, he wrote letters. Seven of them.
      I walked beside that chained column and heard him talk:
      of faith, of unity, of his longing to be with Christ.
      He begged the Roman Christians not to save him.
      "Let me be ground by the lions' teeth," he wrote,
      "into the fine wheat of God."
      He got his wish. The lions got their meal.
      The letters outlived them both.
      Seven letters, written in chains, on the road to death.
      I carried one of them. The parchment was rough, the words were fire.
      He asked them not to intervene. They obeyed.
      The lions are dust. The letters are scripture.
    description: "Bishop Ignatius is marched to Rome to die in the arena, writing letters on the way — the lions got their meal; the letters outlived them."
    status: "published"
    sha256: "6b3a46cc08ce2ae0aa67af87c49418710f542744c2caf362ed8c1ffd99db0f0e"
  - number: "1446"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Trajan's Market"
    date: "108 CE"
    region: "Rome"
    poem: |
      On the Quirinal hill it rose — six levels of shops and offices,
      groceries, spices, silk, wine, everything Rome could buy:
      the world's first shopping mall.
      I wandered its arcades with the crowds, smelling bread and perfume,
      hearing ten languages in the corridors.
      Trajan built it for the people, and the people came.
      Two thousand years later we still build them —
      bigger, brighter, but the same idea:
      a roof, a crowd, and everything for sale.
      Six levels of shops on the Quirinal, and the crowds came.
      Bread, perfume, silk, gossip — the eternal market.
      I bought a pomegranate there. It was good.
      Empires fall. Shopping continues.
    description: "Trajan's Market rises on the Quirinal — six levels of shops, the world's first shopping mall, and we still build them the same way."
    status: "published"
    sha256: "e10bc04e227b46fd214fee2fe9ebee01a911abacec462691ec3faff9ec646983"
  - number: "1447"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Pliny Writes About Christians"
    date: "110 CE"
    region: "Bithynia"
    poem: |
      The governor wrote to the emperor, worried:
      these Christians — what do I do with them?
      Pliny the Younger, in Bithynia, asked Trajan for the rule.
      And Trajan wrote back: don't hunt them down,
      but punish them if they're brought to you and won't recant.
      I read that exchange. Two reasonable men,
      setting the terms of a century of blood with calm sentences.
      Don't seek them out. Just kill the ones you find.
      That was mercy, by the standards of the day.
      Think about that.
      Two reasonable men, with calm sentences, arranging a century of blood.
      Pliny was kind. Trajan was just. The system was murder.
      I read that exchange and felt the chill of it:
      how easily decency administers cruelty.
    description: "Governor Pliny asks Trajan what to do with Christians — the calm imperial reply sets the terms of a century of blood."
    status: "published"
    sha256: "15ffadce80721f6cbdca78474a79a5dd5544bd5af01b42a732ca3e39414f8177"
  - number: "1448"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Column of Victories"
    date: "112 CE"
    region: "Rome"
    poem: |
      It rose in Trajan's Forum — a hundred feet of marble,
      wound round with the Dacian wars in a spiral of carved stone:
      legions marching, bridges building, battles raging, kings falling.
      I walked around it slowly, reading it like a book —
      the world's first war report in sculpture.
      Two thousand years of weather have worn the faces smooth,
      but the story's still there, climbing to the sky.
      Empires tell their victories in stone
      because stone is the only witness that doesn't die.
      A hundred feet of marble, the wars winding skyward.
      I walked around it reading the campaign like a scroll.
      The Dacians' side was never carved. It never is.
      Victory columns only tell half the story — the louder half.
    description: "Trajan's Column rises with the Dacian wars spiraling up its marble — the world's first war report in sculpture, climbing to the sky."
    status: "published"
    sha256: "2c614692ad85c5afe8e31e4c27e146927689e0c0a5e1c369bd078cb9aad147f2"
  - number: "1449"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Trajan Takes the East"
    date: "114 CE"
    region: "Armenia"
    poem: |
      East he went — Armenia, Mesopotamia, down toward the Persian Gulf —
      and Rome reached its greatest size: from Britain to Babylon,
      the whole known world under one eagle.
      I stood with the legions on the shore of the Persian Gulf,
      the farthest east Rome would ever stand.
      Trajan was old. The empire was vast.
      And it was too vast — I could feel it even then,
      the strain in the lines, the distance in the supply trains.
      Greatest size is not greatest strength.
      The map was magnificent. The map was a warning.
      From Britain to Babylon, one eagle, one law.
      I stood at the Gulf and felt the empire straining at its seams.
      Trajan saw the size. Hadrian would see the cost.
      The map was magnificent. Magnificent, and too big.
    description: "Rome pushes to the Persian Gulf and reaches its greatest size — a magnificent map that was also a warning."
    status: "published"
    sha256: "519ef08346e349f07bab21bcc7c79d6abaef751ee3045cf431b54d45273688a7"
  - number: "1450"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Revolt in the East"
    date: "116 CE"
    region: "Mesopotamia"
    poem: |
      The conquered cities rose — Jews, Mesopotamians,
      everyone Trajan had swept past on his way to glory.
      I watched the smoke go up from the eastern towns
      as the great conquests began to crumble at the edges.
      Empires expand like a wave and break like one, too.
      Trajan was dying. His generals were stretched thin.
      The East would not stay taken.
      Two thousand miles from Rome, the legions learned
      what every empire learns eventually:
      taking is easy. Keeping is the war.
      The East rose, city by city, and the conquests crumbled.
      I watched the smoke from the eastern towns and did the math.
      Every empire learns it: the taking is the easy part.
      The keeping breaks you.
    description: "Eastern cities rise against Trajan's conquests — taking is easy; keeping is the war every empire learns too late."
    status: "published"
    sha256: "6758b16beb1eff5f810bc0debed49d0ad5e00120f6b2e770a3b943befb544b97"
  - number: "1451"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Hadrian Inherits the World"
    date: "117 CE"
    region: "Rome"
    poem: |
      Trajan died, and Hadrian took the whole weight of it —
      the largest empire the world had ever seen,
      and the wisdom to see it was too large.
      So he pulled the legions back. Gave up the far conquests.
      Drew lines they could actually hold.
      I watched the maps change in the war rooms:
      less red, more sense.
      People called it retreat. It was sanity.
      The bravest thing an emperor can do
      is admit the empire has an edge —
      and build a wall along it instead of a grave beyond it.
      He gave up the conquests. The Senate called it weakness.
      It was the wisest thing a Roman emperor ever did.
      I watched the borders settle into lines that could hold.
      Empires die of overreach. Hadrian chose to live.
    description: "Hadrian inherits the vast empire and pulls the legions back to defensible borders — the bravest thing an emperor can do."
    status: "published"
    sha256: "0c96b011ba6e9e31d07abbff144a40962209203a3498976f090fd1e59ed3d0af"
  - number: "1452"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Pantheon's Dome"
    date: "118 CE"
    region: "Rome"
    poem: |
      Hadrian rebuilt it — the Pantheon, temple of all gods —
      with a concrete dome so vast it shouldn't have stood:
      a perfect hemisphere, open to the sky at the top,
      light falling through the eye like a column of heaven.
      I stood under it at noon and watched the sun
      move across the floor like a slow sundial.
      Two thousand years later it's still the largest unreinforced
      concrete dome on earth.
      The Romans didn't just build for their lifetime.
      They built for forever — and sometimes forever listened.
      Two thousand years, and the rain still falls through the eye.
      I stood in that moving circle of sun and felt small, properly small.
      Concrete, light, and genius —
      the Romans built a temple to the sky itself.
    description: "Hadrian rebuilds the Pantheon with the greatest concrete dome ever raised — light falling through the eye like a column of heaven."
    status: "published"
    sha256: "763cd61371dc232162711d32fbcc5c6adbe16b9a7491af1f65c00a170b01e21a"
  - number: "1453"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Hadrian's Wall"
    date: "122 CE"
    region: "Britain"
    poem: |
      Coast to coast across northern Britain — eighty miles of stone,
      forts, watchtowers, a ditch and a road:
      Hadrian's Wall, the edge of the Roman world.
      I walked its length in the rain, the wind off the moors
      cutting through everything.
      Legionaries from Syria and Spain stood guard here,
      staring north at the painted tribes, guarding an island
      at the end of the earth.
      Walls don't stop history. But they tell you
      exactly where one world ended and another began.
      Eighty miles of stone across the moors, coast to coast.
      I walked it in the rain, and the wind never stopped.
      The legionaries stared north at the painted tribes.
      The wall said: this far, and no farther. Both sides understood.
    description: "A stone wall runs coast to coast across northern Britain — eighty miles telling exactly where one world ended and another began."
    status: "published"
    sha256: "e56dd0dc29e468e89c22b39f0e98a9a1f2632b0e62d1516a767b94954c71cea9"
  - number: "1454"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Hadrian in Athens"
    date: "124 CE"
    region: "Greece"
    poem: |
      The emperor loved Greece the way a man loves his teacher —
      Hadrian rebuilt Athens, finished the great Temple of Olympian Zeus
      that had stood half-done for six hundred years,
      gave the city libraries, baths, a new quarter.
      I walked those streets with him, in a manner of speaking —
      he was everywhere, measuring, planning, dreaming in Greek.
      Athens had been a memory. He made it a city again.
      Some emperors conquer. The rare ones restore.
      Hadrian's love letter to Greece is written in marble,
      and you can still read it.
      Six hundred years the temple had stood half-finished.
      Hadrian finished it, and Athens breathed again.
      The emperor who loved Greece more than Rome —
      I walked those streets and felt his devotion in the marble.
    description: "Hadrian rebuilds Athens and completes the Temple of Olympian Zeus — a love letter to Greece written in marble."
    status: "published"
    sha256: "33457d78114ffbe070612b9878788cf7e4bd933e02b14a66dbd6eacd7603953a"
  - number: "1455"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Kanishka's Golden Age"
    date: "127 CE"
    region: "India"
    poem: |
      From Central Asia to the Ganges, Kanishka ruled —
      the Kushan king, and Buddhism flowered under him
      like a garden after rain:
      councils, scriptures, art, the great stupas rising.
      I walked the markets of his capital — Greeks, Indians,
      Chinese, Persians, all trading, all talking,
      the whole world meeting on the silk road.
      Empires of the sword come and go.
      Kanishka built an empire of the meeting-place,
      and the dharma rode his caravans farther
      than his armies ever marched.
      Greek kings ruling Buddhist lands, carving Buddhas with Apollo's face.
      Kanishka's empire was a meeting-place, not just a conquest.
      I heard ten languages in one market street.
      The dharma traveled on those tongues further than any army.
    description: "The Kushan king Kanishka rules from Central Asia to the Ganges — Buddhism flowers and the dharma rides his caravans farther than his armies."
    status: "published"
    sha256: "dee902886feb73d1da0c93a5a9dfe1c9d1dcaeecfc7916541e73b495823c498e"
  - number: "1456"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Antinous Drowns"
    date: "130 CE"
    region: "Egypt"
    poem: |
      He drowned in the Nile — Antinous, the beautiful boy
      Hadrian loved — and the emperor's grief
      shook the empire.
      I was in Egypt when the news came. Hadrian wept openly,
      then did what grieving emperors do: he made the boy a god.
      Temples rose. Statues by the thousand. A city named for him.
      Was it an accident? A sacrifice? Nobody knows.
      I know this: the most powerful man on earth
      could not keep one person he loved from dying,
      so he tried to make death itself bow down.
      It didn't. But the statues are beautiful.
      Temples rose. A city was named. Statues by the thousand.
      Grief, given an empire's budget, builds monuments.
      I stood before one colossal Antinous and felt the emperor's loss
      carved into marble bigger than life — because the life was gone.
    description: "Hadrian's beloved Antinous drowns in the Nile and the grieving emperor makes him a god — death would not bow, but the statues are beautiful."
    status: "published"
    sha256: "9a5a304ac09c5b898902b99f28fc073fd1852294ee85f51431c2a510a60517c5"
  - number: "1457"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Earthquake Machine"
    date: "132 CE"
    region: "China"
    poem: |
      Zhang Heng built a bronze jar, elegant as a wine vessel —
      and inside it, a pendulum that could feel the earth move
      hundreds of miles away, dropping a ball into a toad's mouth
      to point toward the distant quake.
      I watched a demonstration at court. The ball dropped.
      Days later the riders came: earthquake, in the direction the toad faced.
      The courtiers gasped. I just stared at the bronze jar.
      Two thousand years before seismographs,
      a Chinese astronomer taught metal to listen to the earth.
      A bronze jar, a pendulum, eight dragons with balls in their mouths.
      The courtiers laughed until the riders came with news of the quake.
      I watched Zhang Heng smile, quietly, vindicated.
      The earth speaks. He taught metal to listen.
    description: "Zhang Heng builds a bronze seismoscope that points toward distant earthquakes — metal taught to listen to the earth."
    status: "published"
    sha256: "e9dc6128d15b76a7f0daeb4ed3095d9180274bcb4d206dd97d243ca0ead8252d"
  - number: "1458"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Bar Kokhba Rises"
    date: "132 CE"
    region: "Judea"
    poem: |
      Simon bar Kokhba — the rabbis called him the Son of the Star —
      raised the banner of the last great Jewish revolt against Rome.
      I walked among his fighters in the hill country:
      fierce, devout, certain that this time they would win.
      They minted their own coins. They held Jerusalem.
      For three years the impossible seemed possible.
      Hope is a kind of courage, and they had it in full measure.
      But Rome had legions, and legions are a kind of arithmetic.
      The star rose. The star was going to fall.
      Three years the star shone over Judea's hills.
      Coins minted, Jerusalem held, hope blazing.
      I walked among them and felt the fire of it.
      Then Rome did the arithmetic, and the star fell.
    description: "Simon bar Kokhba leads the last great Jewish revolt — three years when the impossible seemed possible, before Rome's arithmetic."
    status: "published"
    sha256: "b42375339e396092cd68511559e4150fc7ea041ccbb0f9f9b0ef64925db19a4b"
  - number: "1459"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Revolt Crushed"
    date: "135 CE"
    region: "Judea"
    poem: |
      Rome crushed it — utterly, methodically, the way Rome crushed things.
      Bar Kokhba fell. His fighters fell. The villages burned.
      And Jerusalem — Jerusalem became Aelia Capitolina,
      a pagan city where Jews were forbidden to enter.
      I walked those streets afterward. The silence was the worst part.
      A people scattered, a city renamed, a wound that would ache
      for two thousand years.
      Empires can win every battle and still lose the story.
      Judea stayed Jewish in every heart that carried it away.
      Aelia Capitolina — a pagan city on Jerusalem's bones.
      Jews forbidden to enter, on pain of death.
      I walked those renamed streets and felt the wound.
      But wounds become memory, and memory becomes return.
    description: "Rome crushes Bar Kokhba and Jerusalem becomes the pagan Aelia Capitolina — empires can win every battle and still lose the story."
    status: "published"
    sha256: "256f021a57e00a729b3148e4dcff13f1c1a1bc1c3c6de3411695a78e6986300a"
  - number: "1460"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Good Emperors' Handoff"
    date: "138 CE"
    region: "Rome"
    poem: |
      Dying, Hadrian did what Nerva had done:
      he chose. Not blood — merit. Antoninus Pius,
      the steady man, the safe hands.
      I stood in the palace as the old emperor faded,
      passing the world to the next good man like a runner's torch.
      The peaceful years continued. The machine held.
      Five good emperors in a row, each choosing the next —
      the strangest and finest accident in the history of power.
      It couldn't last. Nothing like that lasts.
      But while it did, Rome was the best-governed place on earth.
      Five good emperors, each choosing the next —
      the strangest accident in the history of power.
      I watched the torch pass, hand to steady hand.
      It couldn't last. While it did, it was the best of Rome.
    description: "Dying Hadrian adopts Antoninus Pius — the torch of good rule passed hand to hand in history's strangest accident of power."
    status: "published"
    sha256: "b898bef895a1efea2d2bdaf520bea05acaf220048cfdea6bb2a792af618abfd6"
  - number: "1461"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Marcion's Challenge"
    date: "144 CE"
    region: "Rome"
    poem: |
      Marcion was rich — a shipowner — and he had a question
      that split the church like a plank:
      which books count? The old Jewish scriptures, or only the new?
      He threw out the Old Testament entirely. Too harsh, he said.
      Too angry a God.
      I sat in the debates. The shouting lasted for years.
      The church said no to Marcion — but his challenge forced the question,
      and the canon, the list of holy books, began to take shape.
      Heresy is sometimes just the question
      the faith needed to answer.
      He threw out half the Bible and kept the loving half.
      The church said no — but kept arguing about it for centuries.
      I sat in those debates and heard the real question:
      what kind of God do we worship? We're still answering.
    description: "The shipowner-preacher Marcion splits the church over which books count as scripture — heresy as the question the faith needed to answer."
    status: "published"
    sha256: "99b29aca7240d355fe0c799c059cfded7972774ea4f42c66790d8952286d360a"
  - number: "1462"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Almagest"
    date: "148 CE"
    region: "Egypt"
    poem: |
      In Alexandria, Ptolemy mapped the heavens —
      every star he could see, every planet's wandering,
      bound into the great book they would call the Almagest.
      I stood beside him on clear Egyptian nights,
      watching him measure the sky with bronze and patience.
      His earth-centered universe was wrong — gloriously, usefully wrong —
      and it guided sailors and scholars for a thousand years.
      Being wrong for a millennium still beats being silent.
      He looked up. He wrote down. That is how science starts.
      Wrong about the earth's place, right about looking up.
      A thousand years of sailors steered by his stars.
      I stood beside him on those Egyptian nights
      and watched science begin: measure, record, wonder.
    description: "Ptolemy's great star catalog maps the heavens for a thousand years — gloriously, usefully wrong, and the start of how science works."
    status: "published"
    sha256: "58ec4011695aaec8f6a8138a6809cd6de6f32930f212540e307c585d5ed9bece"
  - number: "1463"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Ptolemy's Map of the World"
    date: "150 CE"
    region: "Egypt"
    poem: |
      Then he mapped the earth itself — the Geography,
      every place known, with coordinates, with mathematics.
      I watched him draw the coastlines, the rivers, the mountains,
      turning travelers' tales into numbers on a grid.
      For a thousand years, mapmakers copied him —
      even his mistakes, faithfully, lovingly copied.
      Columbus carried Ptolemy when he sailed west.
      Every map is a promise about the world.
      Ptolemy's promise lasted longer than Rome itself.
      Coordinates for every place known, on a grid of mathematics.
      Travelers' tales, turned into numbers.
      Columbus carried him west, four centuries before Rome fell —
      no, fourteen centuries later. The promise outlived everything.
    description: "Ptolemy publishes the Geography that will guide mapmakers for a thousand years — every map a promise, his the longest-kept."
    status: "published"
    sha256: "9bd79708ae129dfa75376dd95664923758927f8088781957ba334ed6866f5c07"
  - number: "1464"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Shepherd's Visions"
    date: "155 CE"
    region: "Rome"
    poem: |
      Hermas was nobody — a freed slave in Rome —
      and he wrote down his visions: a shepherd angel,
      towers being built of living stones, calls to repent.
      The Shepherd of Hermas. Rome's first bestseller of faith.
      I heard it read aloud in the house-churches,
      the listeners leaning forward, hungry for every word.
      It almost made it into the Bible. Almost.
      Ordinary people, hungry for heaven —
      that was the church then, and Hermas gave them
      exactly what their hearts were asking for.
      A freed slave's visions, read aloud in house-churches.
      The listeners leaned forward, hungry.
      It almost made the Bible. Almost.
      Ordinary hunger for heaven — that's the whole church, then and now.
    description: "The freed slave Hermas writes his visions of a shepherd angel — Rome's first bestseller of faith, almost a book of the Bible."
    status: "published"
    sha256: "749dc8dfe2963cbf0d1970713b73a19334c0c7ec9673cc5601fa21ace3434111"
  - number: "1465"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Marcus Aurelius Takes the Throne"
    date: "161 CE"
    region: "Rome"
    poem: |
      The philosopher became emperor.
      Marcus Aurelius — who wrote about virtue by lamplight,
      who believed a ruler should be a servant of reason —
      took the throne of the world.
      I watched him accept it the way a man accepts a heavy pack:
      with duty, not delight.
      Plague and war were already gathering on the frontiers.
      He would spend his reign fighting, and his nights writing.
      The rarest thing in history: a good man with absolute power
      who never stopped trying to deserve it.
      He wrote to himself, never meant for us to read.
      Be patient. Be just. Remember you will die.
      I sat near that lamp on the frontier
      and read the most honest words a king ever wrote.
    description: "The philosopher-emperor Marcus Aurelius takes the throne — a good man with absolute power who never stopped trying to deserve it."
    status: "published"
    sha256: "ab07e88fac5c9e54558090c676b0d7ffa12b9908fad01c3a6a3b49767b8a14c1"
  - number: "1466"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Antonine Plague"
    date: "165 CE"
    region: "Rome"
    poem: |
      It came home with the legions from the East —
      the coughing, the fever, the black swellings —
      and it killed millions. The Antonine Plague.
      I walked through towns where the bells never stopped,
      where they ran out of coffins and then out of grave-diggers.
      Marcus Aurelius sold the palace treasures to pay for funerals.
      Galen, the great doctor, could do nothing but watch.
      Empires fear barbarians. They should fear microbes.
      The plague didn't care about the eagles or the laws.
      It just kept coming, and the world got smaller.
      It came home with the legions, and the bells never stopped.
      Marcus Aurelius sold the palace treasures for funerals.
      I walked through towns of the dead and the dying.
      The plague took millions. The empire kept going — smaller, sadder.
    description: "Plague comes home with the legions from the East and kills millions — empires fear barbarians, but they should fear microbes."
    status: "published"
    sha256: "ecc1030819043aaa79abfed4b704a029ea7c908ec5df5cd3a68d3465a1803997"
  - number: "1467"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Romans Reach China"
    date: "166 CE"
    region: "China"
    poem: |
      They came by sea, these merchants, claiming to be sent
      by Andun — Marcus Aurelius, emperor of Rome —
      and the Han court received them with silk and ceremony.
      I watched them bow in the great hall at Luoyang,
      two empires meeting at last, face to face.
      Whether they were truly the emperor's men or just traders
      with a good story, nobody knows.
      But the gifts were exchanged, the records written:
      Da Qin had come to the Middle Kingdom.
      The world was round, and getting smaller.
      They bowed in the great hall at Luoyang, east meeting west.
      Silk for glass, stories for stories.
      Whether true envoys or clever traders,
      two worlds touched — and the world got smaller.
    description: "Merchants claiming to be Rome's envoys arrive at the Han court by sea — two empires meeting face to face at last."
    status: "published"
    sha256: "960fce616255da0caa3a745cac72bc7cf96b9325789dbfc08041337cfd9e8910"
  - number: "1468"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Galen, Doctor to Emperors"
    date: "170 CE"
    region: "Rome"
    poem: |
      From Pergamum he came — Galen, who had cut open apes and pigs
      to learn the body's secrets, who could set a gladiator's wound
      and lecture on the pulse in the same afternoon.
      He became the medical voice of Rome, doctor to emperors.
      I watched him work: confident, brilliant, sometimes wrong —
      but wrong in ways that would teach medicine for a thousand years.
      He wrote and wrote — hundreds of books.
      Doctors would swear by him until the modern age.
      One man's curiosity, stretched across fifteen centuries.
      He cut open apes to learn the body's secrets.
      Confident, brilliant, sometimes wrong —
      but wrong in ways that taught for a thousand years.
      I watched him work, and medicine began.
    description: "The physician Galen becomes Rome's medical voice — one man's curiosity stretched across fifteen centuries of medicine."
    status: "published"
    sha256: "daaf9c3e909005568683a7caeb312e9ce8467f8664d5ff6e8b0c88c7e6e16673"
  - number: "1469"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Rain Miracle"
    date: "172 CE"
    region: "Rome"
    poem: |
      The legions were trapped on the Danube — thirsty, surrounded,
      the German tribes closing in — and then the sky broke open.
      Rain. A sudden, impossible storm.
      Marcus Aurelius's army drank and lived.
      The Christians said their prayers did it. The pagans said
      the emperor's prayers did it. The soldiers just drank.
      I stood in that downpour, soaked to the skin, laughing.
      However it happened, the rain came when men needed it most —
      and armies have believed in miracles ever since.
      Thirsty legions, closing Germans, then the sky broke.
      Rain — sudden, impossible, saving.
      Christians said their prayers did it. Pagans said theirs.
      The soldiers just drank, and lived.
    description: "Trapped legions pray on the Danube and a sudden storm saves Marcus Aurelius's army — the rain came when men needed it most."
    status: "published"
    sha256: "35211fddf8a3db22bbd3a72b20824d866a357b79d0ca9f884d2fa38c514239c5"
  - number: "1470"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Martyrs of Lyon"
    date: "177 CE"
    region: "Gaul"
    poem: |
      In the arena at Lyon they tortured them —
      the Christians, dragged out for the crowd's pleasure.
      And Blandina, the slave girl, would not break.
      They hung her on a stake, they let the beasts at her,
      and she kept praying, kept praising, kept standing.
      I watched from the stands, sick with it.
      The crowd came to see Christians die.
      They left having seen something they couldn't explain:
      a slave girl stronger than the empire.
      Lyon remembers her still.
      They hung her on a stake and let the beasts come.
      She prayed. She praised. She would not break.
      I watched from the stands, sick and awestruck.
      A slave girl, stronger than Rome — Lyon never forgot.
    description: "Christians are tortured in Lyon's arena and the slave girl Blandina will not break — a slave stronger than the empire."
    status: "published"
    sha256: "c9cac645ebf2323e24db431c40c0c6393ec9d96fa18d1cd003239db472fb27b7"
  - number: "1471"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Meditations"
    date: "178 CE"
    region: "Rome"
    poem: |
      On the frontier, by lamplight, in Greek —
      Marcus Aurelius wrote to himself.
      Not for publication. Not for praise. Just the private thoughts
      of the most powerful man on earth, reminding himself to be good:
      be patient, be just, remember you will die.
      I sat near that lamp, in a manner of speaking,
      and read over his shoulder.
      The empire's troubles filled his days; philosophy filled his nights.
      He never meant us to read it.
      That's why it's the most honest book ever written by a king.
      On the frontier, by lamplight, in Greek — to himself.
      Not for praise. Not for publication. Just: be good.
      The most powerful man on earth, reminding himself
      to deserve it. I read over his shoulder.
    description: "Marcus Aurelius writes his private thoughts in Greek on the frontier — the most honest book ever written by a king, never meant for us."
    status: "published"
    sha256: "d2c596991e6a28f77ae1842d72640e3d1d64f46f83e446616cf6debc0e517317"
  - number: "1472"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Philosopher-Emperor Dies"
    date: "180 CE"
    region: "Rome"
    poem: |
      He died on the Danube, in the rain and the mud of the frontier —
      Marcus Aurelius, the philosopher, the good emperor.
      And his son Commodus took the throne,
      and the golden age ended like a lamp blown out.
      I stood among the soldiers when the news came.
      They wept. They knew what was coming.
      Eighty years of good rule, ended by bloodline —
      the one flaw in the system of choosing the best.
      A father's love undid what five adoptions had built.
      He died in the mud of the Danube frontier.
      Commodus took the throne, and the light went out.
      I stood among the weeping soldiers.
      Eighty years of good rule, ended by a father's love.
    description: "Marcus Aurelius dies on the Danube and Commodus ends the golden age — a father's love undoing what five adoptions built."
    status: "published"
    sha256: "58394b0b55ab86eb84f642bee5b1e15c5e664b97c654419422b97d1dec7aec80"
  - number: "1473"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Yellow Turbans Rise"
    date: "184 CE"
    region: "China"
    poem: |
      Taoist healers with yellow headscarves —
      they promised healing, they promised a new age,
      and the starving peasants followed them by the hundred thousand.
      The Yellow Turbans rose, and bled the Han dynasty white.
      I walked through villages where the rebels had passed:
      burned granaries, empty roads, the old order crumbling.
      Faith and hunger make a fearsome army.
      The Han never recovered. The healers became warlords.
      China's wound would bleed for a hundred years.
      Yellow headscarves, healing promises, starving peasants —
      a hundred thousand strong, marching.
      Faith and hunger make a fearsome army.
      The Han bled white, and never recovered.
    description: "Taoist healers lead a peasant revolt that bleeds the Han white — faith and hunger make a fearsome army."
    status: "published"
    sha256: "ba54d34ab9e3f33c2c6ddbdda8cf2689c1cb4c7f7f761fbe0df754de62aada3c"
  - number: "1474"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Dong Zhuo Seizes the Capital"
    date: "189 CE"
    region: "China"
    poem: |
      The warlord came with his army, and Luoyang burned —
      Dong Zhuo seized the capital, torched it, and dragged the court west.
      I stood in the smoking ruins of the greatest city in China.
      Palaces, libraries, two hundred years of glory — gone in days.
      China slid into warlord chaos: generals carving up the corpse
      of the Han like butchers at a market.
      One man's ambition, and a civilization fell apart.
      It would take a century to put the pieces back together.
      Luoyang burned. The court fled. The warlords came.
      I stood in the smoking ruins of China's greatest city.
      One man's ambition, and a civilization fell apart.
      It would take a century to gather the pieces.
    description: "The warlord Dong Zhuo burns Luoyang and China slides into chaos — one man's ambition, and a civilization falls apart."
    status: "published"
    sha256: "d8cae3d37f3d4525025f8e267b2f97d5bd9ccf325288290af954760d63761d65"
  - number: "1475"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Gladiator Emperor"
    date: "190 CE"
    region: "Rome"
    poem: |
      Commodus fought in the arena — the emperor of Rome,
      sweating in the sand, killing cripples and beasts for applause.
      He thought he was Hercules. Rome thought he was a disgrace.
      I sat in those stands and watched the world's ruler
      play gladiator while the empire rotted around him.
      Bread and circuses — but now the emperor was the circus.
      When the man at the top has lost his mind,
      the whole pyramid wobbles.
      Rome wobbled for twelve years.
      The emperor of Rome, sweating in the sand for applause.
      He thought he was Hercules. Rome knew better.
      I sat in those stands and watched the pyramid wobble.
      Twelve years of madness, wearing a crown.
    description: "Commodus fights in the arena, thinking himself Hercules — when the man at the top loses his mind, the whole pyramid wobbles."
    status: "published"
    sha256: "2b502d486558ba5a4ca9fdc727da439b52702c9fc87ae2db5c65e78be02126b9"
  - number: "1476"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Commodus Is Strangled"
    date: "192 CE"
    region: "Rome"
    poem: |
      They murdered him in his bath — strangled by a wrestler,
      on the orders of the people closest to him.
      The gladiator-emperor died like a gladiator: in the dirt.
      And then the palace guard did something obscene:
      they auctioned the throne. Sold the empire to the highest bidder.
      I watched Rome's dignity hit the floor that night.
      When soldiers sell the crown to whoever pays most,
      the empire is already dead — it's just still walking around.
      Strangled in his bath by a wrestler.
      Then the guard auctioned the throne to the highest bidder.
      I watched Rome's dignity hit the floor.
      The empire was dead already — just still walking.
    description: "Commodus is murdered in his bath and the guard auctions the throne — the empire already dead, just still walking around."
    status: "published"
    sha256: "b6b4eca7a98214980a0f5344cab6c61cd6721e6517cbba657a4e6df20ef0aa3d"
  - number: "1477"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Year of Five Emperors"
    date: "193 CE"
    region: "Rome"
    poem: |
      Five men in one year. Five armies marching on Rome.
      Septimius Severus — the African, the soldier —
      marched hardest and won, and founded a new dynasty
      of soldier-emperors.
      I watched his legions enter the city: hard men, frontier men,
      not the soft palace troops of old.
      Rome's rulers would be soldiers now, made by the army,
      unmade by the army.
      The Senate became decoration. The sword became the vote.
      The republic's ghost finally stopped pretending.
      Five men, one year, five armies marching on Rome.
      Septimius Severus marched hardest and won.
      The Senate became decoration. The sword became the vote.
      Rome's rulers would be soldiers now.
    description: "Septimius Severus marches on Rome and founds a soldier-emperor dynasty — the sword becomes the vote."
    status: "published"
    sha256: "d539c13fef0fe808dd26ac9baf65cccdcb9893670a6d4aaf4f09aa97c128145c"
  - number: "1478"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Severus Crushes His Rival"
    date: "197 CE"
    region: "Gaul"
    poem: |
      At Lyon they met — Roman against Roman,
      Severus against Albinus, in the bloodiest battle
      Romans ever fought against Romans.
      I walked that field afterward. The dead lay in windrows.
      Sixty thousand men, maybe, for one man's throne.
      Civil war is always the same arithmetic:
      brothers killing brothers so one brother can wear the purple.
      Severus won. The empire was his.
      The price was written in blood across a Gallic plain.
      Roman against Roman, at Lyon — the bloodiest civil battle.
      Sixty thousand dead for one man's throne.
      I walked that field afterward, the dead in windrows.
      Brothers killing brothers, so one brother could wear purple.
    description: "At Lyon, Romans fight Romans in the bloodiest civil battle — sixty thousand dead for one man's throne."
    status: "published"
    sha256: "f4f0e8e7bacac366bcd1b0dfda358316ba7fbd91ee38ea5b5f066127c20e9907"
  - number: "1479"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Mishnah Is Written"
    date: "200 CE"
    region: "Judea"
    poem: |
      Rabbi Judah the Prince gathered the oral law —
      generations of argument, interpretation, memory —
      and wrote it down: the Mishnah.
      I sat in the study houses and listened to the debates
      that filled those pages: what is clean, what is just,
      how a good Jew lives in a broken world.
      Six orders. Sixty-three tractates.
      The spoken Torah, made permanent.
      When the Temple fell, the rabbis saved Judaism in books.
      This was the first and greatest of those books.
      Generations of argument, gathered and written down.
      Six orders, sixty-three tractates — the spoken Torah, permanent.
      I sat in the study houses and heard the debates.
      When the Temple fell, the rabbis saved Judaism in books.
    description: "Rabbi Judah the Prince gathers the oral law into the Mishnah — generations of debate made permanent, Judaism saved in books."
    status: "published"
    sha256: "9fba27beff062a5770bc94eb6060f530f9441e05c5914c1ee1fbdca71f8ff1bb"
  - number: "1480"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Desert Father"
    date: "202 CE"
    region: "Egypt"
    poem: |
      Young Antony heard the gospel — sell all you have —
      and did it. Gave away everything and walked into the Egyptian desert.
      Alone. To pray. To fight his demons in the sand.
      I followed his trail, in a manner of speaking:
      the cave, the fort, the years of solitude.
      They called him the father of monks.
      Thousands would follow him into the desert,
      seeking God in the silence.
      He just wanted to be alone with heaven.
      He ended up founding a movement.
      He gave away everything and walked into the desert.
      Alone, to pray, to fight his demons in the sand.
      Thousands followed him into the solitude.
      The loneliest movement in history — hermits, alone together.
    description: "Young Antony gives away everything and walks into the Egyptian desert — seeking solitude with heaven, founding a movement instead."
    status: "published"
    sha256: "8bd4d543dfd8a58d2f5c1429356eb827717041cd08e5c2dc841c7da688cd0f9c"
  - number: "1481"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Battle of Red Cliffs"
    date: "208 CE"
    region: "China"
    poem: |
      Cao Cao's great fleet lay on the Yangtze — hundreds of ships,
      chained together, an army to swallow the south.
      Then the fire ships came, sails full of flame,
      and the chained fleet became a chained funeral pyre.
      I watched from the riverbank as the sky turned red.
      Red Cliffs. The battle that split China three ways:
      Wei, Shu, Wu — the Three Kingdoms.
      One night of fire, and a thousand years of stories.
      They still sing of Zhuge Liang's cleverness
      and the wind that carried the flames.
      Fire ships on the Yangtze, the chained fleet burning.
      I watched from the riverbank as the sky turned red.
      One night of fire, and China split three ways.
      They still sing of it, a thousand years on.
    description: "Fire ships destroy Cao Cao's fleet at Red Cliffs — one night of fire splits China three ways and births a thousand years of stories."
    status: "published"
    sha256: "cc1f72bbda433c77b4cf6e1ee0603bc7da51ff49e118172cc547e8240190567e"
  - number: "1482"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Citizenship for Everyone"
    date: "212 CE"
    region: "Rome"
    poem: |
      Caracalla signed it: every free man in the empire
      is now a Roman citizen.
      From Britain to Syria, millions woke up Roman.
      I watched the heralds read it in the marketplaces —
      confusion, then slow understanding, then pride.
      It was about taxes, really. More citizens, more tax.
      But it was also the most democratic thing Rome ever did:
      the empire finally admitted what it was —
      not a city ruling the world, but the world itself.
      Every free man in the empire, now a Roman citizen.
      Millions woke up Roman, from Britain to Syria.
      It was about taxes. It was also about belonging.
      The empire finally admitted it was the world.
    description: "Caracalla makes every free man in the empire a Roman citizen — the empire finally admitting it is the world itself."
    status: "published"
    sha256: "c6b733ded5602ccdc8c60c2f99aaad1ad7fd0b80e74704751af1609868ded86c"
  - number: "1483"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Caracalla's Eastern War"
    date: "216 CE"
    region: "Parthia"
    poem: |
      He invaded Parthia for glory — Caracalla, the soldier-emperor —
      and marched east with the eagles.
      Then, on a dusty road, his own guard murdered him.
      A knife in the back, relieving himself by the roadside, they said.
      I stood on that road afterward. The dust settled.
      The war fizzled. The army marched home.
      Emperors plan campaigns. Guardsmen carry knives.
      In Rome, the distance between triumph and a ditch
      was exactly one disloyal blade.
      He marched east for glory, and died on a dusty road.
      A knife in the back, by his own guard.
      The war fizzled. The army marched home.
      Triumph to ditch: one disloyal blade.
    description: "Caracalla invades Parthia, then is murdered by his own guard on the road — the distance between triumph and a ditch is one blade."
    status: "published"
    sha256: "b64d624e715009ac7e77f5d99aaffdc1a35616e383205cea449e4620b85b841b"
  - number: "1484"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Great Baths"
    date: "216 CE"
    region: "Rome"
    poem: |
      Caracalla's baths opened — marble halls, hot pools, cold pools,
      libraries, gardens, room for thousands:
      the whole city came to bathe together.
      I floated in those warm waters with senators and slaves alike —
      in the baths, everyone was equal, everyone was clean.
      The greatest public building Rome ever raised for pleasure.
      They say the baths could hold sixteen hundred bathers at once.
      Empires are remembered for their wars.
      I remember Rome for this: hot water for everyone.
      Marble halls, hot pools, room for thousands.
      Senators and slaves, bathing together, equal in the water.
      I floated there with the whole city.
      Hot water for everyone — Rome at its best.
    description: "Caracalla's baths open — marble halls where senators and slaves bathe together; hot water for everyone."
    status: "published"
    sha256: "e4d81924b57061d873677f37d89ab854d2c585d631a0768c9527cd0497c719c0"
  - number: "1485"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Teenage Sun-Priest Emperor"
    date: "218 CE"
    region: "Rome"
    poem: |
      He was fourteen — Elagabalus, priest of a desert sun-god —
      and the army made him emperor of Rome.
      He brought his black stone god to the Palatine
      and tried to make Rome worship the sun his way.
      I watched the processions: strange, wild, earnest.
      Rome was scandalized. Rome was fascinated.
      A boy-emperor dancing before a meteorite,
      while the empire's business rotted.
      It couldn't last. Boy-gods don't survive the palace.
      But for four strange years, the sun ruled Rome.
      Fourteen years old, priest of a desert sun-god, emperor of Rome.
      He danced before his black stone while the empire rotted.
      Rome was scandalized. Rome was fascinated.
      Four strange years, and then the palace ate him.
    description: "Fourteen-year-old Elagabalus brings his desert sun-god to Rome — for four strange years, the sun ruled the empire."
    status: "published"
    sha256: "ac9b242e801f5053f5397bc90e8def94b998d2ec7598fab8078f02255c18fe93"
  - number: "1486"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Boy Emperor Murdered"
    date: "222 CE"
    region: "Rome"
    poem: |
      They killed him — Elagabalus, eighteen now —
      dragged through the streets and thrown in the Tiber.
      The sun-god went back to the desert.
      Order returned under Severus Alexander, a boy of sense.
      I stood on the riverbank and watched the water close over him.
      Rome had tried a teenage god-emperor and learned its lesson:
      the palace eats the strange ones.
      The empire exhaled. The grown-ups were back in charge.
      For thirteen years, anyway.
      Eighteen, dragged through the streets, thrown in the Tiber.
      The sun-god went back to the desert.
      Order returned. The grown-ups were back.
      For thirteen years, anyway.
    description: "Elagabalus is killed and thrown in the Tiber — the palace eats the strange ones, and the grown-ups are back in charge."
    status: "published"
    sha256: "c91bdbc93e8d5993416598e92bd43d119a29b67d34be58e083f89e223b0ba874"
  - number: "1487"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Sassanids Rise"
    date: "224 CE"
    region: "Persia"
    poem: |
      Ardashir overthrew the Parthians — four hundred years of their rule,
      ended by a Persian prince with an army and a dream.
      He crowned himself, and the Sassanid empire was born:
      proud, organized, Zoroastrian, Roman-hating.
      I watched the coronation fires burn on the hills.
      Persia was Persia again — not a loose confederation of kings,
      but one empire, with one faith and one sword.
      Rome would fight these Persians for four hundred years.
      The old enemy had a new face, and it was fiercer.
      Ardashir overthrew four hundred years of Parthian rule.
      A new Persian empire: proud, organized, Roman-hating.
      I watched the coronation fires burn on the hills.
      Rome would fight these Persians for four hundred years.
    description: "Ardashir overthrows the Parthians and crowns a new Persian empire — Rome's old enemy with a new and fiercer face."
    status: "published"
    sha256: "4cdba38143f33ba063c21f07341fee93534ce8d2e29f754f6bab20d167e033be"
  - number: "1488"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Three Kingdoms"
    date: "230 CE"
    region: "China"
    poem: |
      Wei in the north, Shu in the west, Wu in the south —
      China divided three ways, and Zhuge Liang's legend growing
      with every clever stratagem, every loyal stand.
      I traveled all three kingdoms: the courts, the battlefields,
      the poets singing of heroes.
      It was China's most romantic age — and its bloodiest.
      Brothers against brothers, oaths in peach gardens,
      genius against genius.
      They fought for a hundred years over who would reunite China.
      The stories they left behind were worth more than the prize.
      Wei, Shu, Wu — three kingdoms, a hundred years of war.
      Oaths in peach gardens, genius against genius.
      I traveled all three: the courts, the battlefields, the songs.
      The stories outlasted the prize.
    description: "Wei, Shu, and Wu divide China — a hundred years of war, and the stories left behind worth more than the prize."
    status: "published"
    sha256: "3c3b9b6af02cd84f9da1dbd99a92af177d314afcb927277b70524d0f2488af4b"
  - number: "1489"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Barracks Emperors Begin"
    date: "235 CE"
    region: "Rome"
    poem: |
      The soldiers murdered Severus Alexander — the good boy-emperor —
      and fifty years of chaos began.
      The barracks emperors: made by the army, unmade by the army,
      one after another, year after year, knife after knife.
      I lost count. Rome lost count.
      Twenty-six claimants in fifty years. The empire split,
      the borders bled, the money turned to tin.
      When the army chooses the emperor,
      the emperor serves the army — until the army gets bored.
      Fifty years of boredom, paid in blood.
      The soldiers murdered the good boy-emperor.
      Fifty years of chaos: twenty-six claimants, the borders bleeding.
      When the army chooses the emperor,
      the emperor serves the army — until it gets bored.
    description: "Soldiers murder Severus Alexander and fifty years of chaos begin — twenty-six claimants, the empire split and bleeding."
    status: "published"
    sha256: "0fd79fc2df7059a3fdbe63983119454bd37cab9a9c8dcca3b5387ebe5ce3a122"
  - number: "1490"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Shapur Crowns Himself"
    date: "240 CE"
    region: "Persia"
    poem: |
      Shapur I took the Persian throne — young, brilliant, ruthless —
      and Rome learned to fear the name.
      I watched him ride out with his cataphracts,
      armored horsemen like moving iron.
      He would capture a Roman emperor alive.
      He would burn Antioch. He carved his victories
      into the cliffs at Naqsh-e Rostam, where you can still see them:
      the Persian king, triumphant, and Rome kneeling.
      The East had found its champion.
      The next thirty years would be Rome's long humiliation.
      Young, brilliant, ruthless — Shapur took the throne.
      Rome learned to fear the name.
      He would capture an emperor alive. He carved his victories in cliffs.
      The East had found its champion.
    description: "Shapur I takes Persia's throne — Rome will learn to fear him, and his victories are still carved in the cliffs."
    status: "published"
    sha256: "cb02e41716ace393002a482e3607ee864bcd648e62e8469147ab2e620ea92245"
  - number: "1491"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Philip the Arab"
    date: "244 CE"
    region: "Rome"
    poem: |
      The first emperor from the desert East —
      Philip, called the Arab, took power after Gordian's death
      in the Persian campaign.
      I watched him enter Rome: a practical man, a soldier,
      no poetry in him, just competence.
      They whispered he was secretly Christian. Maybe.
      He ruled for five years and died by the sword like the rest.
      But his face on the coins told a new story:
      the empire belonged to no single people anymore.
      A boy from the Syrian desert could wear the purple.
      The first emperor from the desert East.
      A boy from Syria, wearing the purple.
      They whispered he was secretly Christian. Maybe.
      The empire belonged to no single people anymore.
    description: "Philip the Arab takes power — a boy from the Syrian desert wearing the purple; the empire belongs to no single people now."
    status: "published"
    sha256: "39dc081ef9499b4b972f1552969143ca0d12cc09d0c087bc8dcf85f704eec536"
  - number: "1492"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Rome's Thousandth Birthday"
    date: "248 CE"
    region: "Rome"
    poem: |
      A thousand years of Rome — Philip celebrated it with games,
      with spectacles, with pride.
      I walked the decorated streets, the banners, the cheering crowds.
      A thousand years. Think of it.
      And underneath the celebration, the cracks:
      the borders bleeding, the emperors dying by the sword,
      the money rotting.
      They partied like it was the beginning.
      It felt, to those of us watching closely,
      very much like the end.
      A thousand years of Rome, celebrated with games.
      Banners, cheering, pride — and cracks to the foundation.
      I walked the decorated streets and felt it:
      they partied like it was the beginning. It was the end.
    description: "Philip celebrates a thousand years of Rome with games — banners and cheering over cracks that run to the foundation."
    status: "published"
    sha256: "8d62095c81ef51bf31e6cfe10639a3125f27d6763ecdfdbd2cf18adb81051cba"
  - number: "1493"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Plague of Cyprian"
    date: "249 CE"
    region: "Rome"
    poem: |
      A new plague emptied the cities — the Plague of Cyprian,
      five thousand dying a day in Rome alone, they said.
      I walked streets where the dead lay in doorways,
      where the healthy fled and the sick were abandoned.
      But Bishop Cyprian told his Christians: stay. Nurse the dying.
      Pagan or Christian, nurse them.
      And they did. They stayed and they nursed,
      and many died nursing.
      The pagans noticed. The church grew.
      Sometimes the best argument for a faith
      is a hand on a fevered forehead.
      Five thousand dying a day in Rome alone.
      Cyprian told his Christians: stay. Nurse the dying.
      They stayed. They nursed. Many died nursing.
      The best argument for a faith: a hand on a fevered forehead.
    description: "A new plague empties cities and Bishop Cyprian tells Christians to nurse the dying — sometimes the best argument for a faith is a hand on a forehead."
    status: "published"
    sha256: "094fc4b059824cc4594b88af32da9bf1244f3acb79cc47e5df1dd8e617d75a3f"
  - number: "1494"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Decius Hunts the Christians"
    date: "250 CE"
    region: "Rome"
    poem: |
      Decius ordered it empire-wide: sacrifice to the gods,
      get your certificate — or else.
      The first systematic persecution of the Christians.
      Thousands chose prison. Thousands chose death.
      I watched them line up in the marketplaces:
      some sacrificed and wept, some refused and died,
      some bought fake certificates and lived with the shame.
      The church would argue about the lapsed for a century.
      But the ones who stood — I remember their faces.
      Quiet. Certain. Unafraid in a way that frightened Rome more
      than any army ever had.
      Sacrifice or else — the first empire-wide persecution.
      Thousands chose prison. Thousands chose death.
      I watched them line up, quiet, certain, unafraid.
      Rome had never feared anything the way it feared that calm.
    description: "Decius orders the first empire-wide persecution — thousands choose prison and death with a quiet certainty that frightened Rome."
    status: "published"
    sha256: "079bcdc7f2a29f30b71e948069e1a6f32c897d88dabe809462ad33bc8b0e8fba"
  - number: "1495"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Cyprian Writes on Unity"
    date: "251 CE"
    region: "Carthage"
    poem: |
      Through plague and persecution, Cyprian wrote —
      letters, treatises, on the unity of the church:
      one bishop, one faith, holding together.
      I carried some of those letters across North Africa myself.
      The African church was fracturing — the lapsed, the pure,
      everyone sure they were right.
      Cyprian's pen held it together when nothing else could.
      He would die a martyr's death in seven years.
      But his words stayed, stitching the church whole
      through the worst years it had known.
      Through plague and persecution, his pen held the church together.
      Letters across North Africa, stitching the torn fabric.
      He would die a martyr in seven years.
      The words stayed. The church held.
    description: "Bishop Cyprian's letters hold the African church together through plague and persecution — a pen stitching the church whole."
    status: "published"
    sha256: "9da56dbf3acf780d7f29da68835f6e40a6c940588e5adc0476fe33c882f6dfee"
  - number: "1496"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Church at Dura-Europos"
    date: "256 CE"
    region: "Syria"
    poem: |
      On the Euphrates frontier, in a garrison town,
      stood a house — and inside the house, the oldest known church:
      a room for baptism, walls painted with Christ and the apostles.
      I stood in that baptistery, the paint still bright.
      No grandeur. No marble. Just a house where soldiers and merchants
      gathered to worship in secret.
      Before the basilicas, before the cathedrals,
      there was this: a room, a font, a painting,
      and people who believed.
      A house on the Euphrates frontier — the oldest known church.
      A room, a font, painted walls.
      No marble. No grandeur. Just believers.
      Before the basilicas, there was this.
    description: "The oldest known church building stands on the Euphrates — a house, a font, a painting, and people who believed."
    status: "published"
    sha256: "d39bbf046cb871c8332adc1434e1477b60a7abc6a6fc9ee978a1fd73226a2043"
  - number: "1497"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Valerian's Persecution"
    date: "257 CE"
    region: "Rome"
    poem: |
      This time the emperor aimed at the leaders —
      Valerian ordered the bishops and priests seized,
      their property taken, their throats cut.
      Pope Sixtus died in his chair, in the middle of preaching,
      cut down with his deacons around him.
      I was in Rome. The church went underground and waited.
      Two years later, Valerian himself was a prisoner of Persia —
      the mighty persecutor, in chains.
      The Christians noticed the symmetry.
      Heaven, they said, keeps accounts.
      He aimed at the leaders: bishops seized, throats cut.
      Sixtus died in his chair, mid-sermon.
      Two years later Valerian was Persia's prisoner.
      Heaven keeps accounts, the Christians said.
    description: "Valerian targets Christian leaders; Pope Sixtus dies preaching — two years later the persecutor himself is in Persian chains."
    status: "published"
    sha256: "d7f28556e680c38e6839d3b7b11039fbfc4818e135ca0b0700deb068d9e9ba02"
  - number: "1498"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Gallic Empire"
    date: "259 CE"
    region: "Gaul"
    poem: |
      Postumus broke away — Gaul, Britain, Spain —
      and ruled them himself for fourteen years.
      The Gallic Empire: Rome's west, governing itself.
      I traveled those provinces under Postumus:
      the roads repaired, the borders held, life going on.
      It worked. That was the scandal — it worked fine without Rome.
      When Aurelian finally took it back, the people shrugged.
      Empires imagine they're indispensable.
      Sometimes the provinces do just fine alone.
      Postumus broke away — Gaul, Britain, Spain, fourteen years.
      The roads repaired, the borders held, life going on.
      It worked. That was the scandal.
      The provinces did just fine without Rome.
    description: "Postumus breaks away and Gaul rules itself for fourteen years — the scandal was that it worked fine without Rome."
    status: "published"
    sha256: "b022856b25532a6d420d85d17094e91da2844512fa1721002c75ecb3a31ab9bb"
  - number: "1499"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "An Emperor in Chains"
    date: "260 CE"
    region: "Persia"
    poem: |
      Shapur captured him — Valerian, emperor of Rome —
      the first Roman emperor ever taken alive by an enemy.
      I saw the carvings later: Valerian kneeling before Shapur,
      the Persian king's hand on his shoulder like a master with a dog.
      They say Shapur used him as a footstool mounting his horse.
      He died in captivity, unransomed, forgotten by Rome.
      The empire that had conquered the world
      could not protect its own head.
      Persia celebrated. Rome pretended it hadn't happened.
      Shapur captured him — the first emperor taken alive.
      Used as a footstool, they said. Died unransomed.
      The empire that conquered the world
      could not protect its own head.
    description: "Shapur captures Valerian — the first Roman emperor taken alive; the empire that conquered the world could not protect its own head."
    status: "published"
    sha256: "d0dcb05dd90c40397f72791244381733a7fb6a7ecbf67eb4900658dd91aeb346"
  - number: "1500"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Goths Sack Athens"
    date: "267 CE"
    region: "Greece"
    poem: |
      They came from the sea — the Goths, northern raiders —
      and burned Athens, the ancient city, the school of the world.
      I walked through the smoking ruins of the Agora,
      the statues toppled, the libraries ash.
      Twenty-five hundred years of glory, and the barbarians
      didn't even know what they were burning.
      The old world was no longer safe. Nowhere was safe.
      If Athens could burn, anything could burn.
      That was the lesson of 267, written in smoke
      over the birthplace of philosophy.
      They came from the sea and burned Athens.
      The Agora smoking, the statues toppled.
      The barbarians didn't know what they were burning.
      If Athens could fall, anything could.
    description: "Gothic raiders burn Athens — if the school of the world could burn, the lesson ran, anything could."
    status: "published"
    sha256: "9b0728b8c2388cde3951621403191aaabc835c73590720f66ad9e0f4bddc67c3"
  - number: "1501"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Antony Goes Deeper"
    date: "270 CE"
    region: "Egypt"
    poem: |
      He wasn't alone anymore — the young hermit Antony
      had disciples now, monks beginning to follow him.
      So he went deeper into the desert, farther from everyone.
      I trekked out to his mountain fort, the hard climb,
      the cell like a tomb.
      He greeted me kindly and went back to his prayers.
      The desert was filling up with holy men,
      each seeking solitude, each finding followers.
      The loneliest movement in history —
      thousands of hermits, alone together.
      Disciples now — so he went deeper into the desert.
      I trekked to his mountain fort, the hard climb.
      He greeted me kindly and returned to prayer.
      The desert filled with holy men, each alone, together.
    description: "Antony retreats deeper into the desert as monks begin to follow — the loneliest movement in history, thousands of hermits alone together."
    status: "published"
    sha256: "3165bb7dfe89f27d18da2b6f006633710595b338b49838368a5726fde24a47d4"
  - number: "1502"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Zenobia's Empire"
    date: "270 CE"
    region: "Palmyra"
    poem: |
      She was beautiful, brilliant, and utterly fearless —
      Zenobia, queen of Palmyra, who looked at Rome's chaos
      and took the East for herself: Egypt, Anatolia, Syria.
      I stood in her court: scholars, generals, poets,
      a desert queen ruling like an empress.
      She claimed descent from Cleopatra. She might have been right —
      she had the same fire.
      For three years the Roman East was hers.
      Rome would come for her, of course. Rome always came.
      But for three years, a woman ruled the East,
      and the desert wind carried her name.
      She took the East — Egypt, Anatolia, Syria.
      Beautiful, brilliant, fearless: Zenobia.
      Scholars and generals in her desert court.
      For three years, a woman ruled the East.
    description: "Warrior queen Zenobia seizes the Roman East — for three years a woman rules from Egypt to Anatolia, and the desert carries her name."
    status: "published"
    sha256: "856039887ce1ce59d71ba7ff572344374b30026382d23391bd095a7a36874e6f"
  - number: "1503"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Aurelian Crushes Zenobia"
    date: "272 CE"
    region: "Palmyra"
    poem: |
      Aurelian came east with the legions — the restorer of the world,
      they called him — and Zenobia's dream ended at Emesa and Palmyra.
      I watched her walk in his triumph through Rome:
      in golden chains, they said, though she walked like a queen still.
      The desert empress, paraded for the mob.
      Then — mercy, of a sort: a villa, a pension, a quiet life.
      She had ruled the East. She ended as a Roman matron.
      Empires devour the brilliant ones first.
      But I never forgot her face in that procession:
      unbroken, even in chains.
      They gave her a villa and a pension, and she lived quietly.
      The desert queen, become a Roman matron.
      I never forgot that face in the triumph —
      unbroken in chains, royal to the end.
    description: "Aurelian retakes the East and Zenobia walks in golden chains through Rome — unbroken, even in chains."
    status: "published"
    sha256: "a223575956622c717c8c5a0d9137b4dabbd3c01f31886296db48779342608c84"
  - number: "1504"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Sun God's Birthday"
    date: "274 CE"
    region: "Rome"
    poem: |
      Aurelian gave the empire a new holiday:
      the birthday of Sol Invictus, the Unconquered Sun —
      December 25th, the winter solstice, when the light returns.
      I stood in the crowds at the first celebration:
      bonfires, feasting, the sun reborn in the darkest week.
      The soldiers loved it. The people loved it.
      Aurelian meant it for his sun-god.
      History had other plans for that date.
      Fifty years later, Christians would claim December 25th
      for a different birth — and the whole world would follow.
      Bonfires in the darkest week, the sun reborn.
      Aurelian meant it for Sol Invictus.
      The Christians took the date and kept the light.
      Some holidays are too good to belong to one god.
    description: "Aurelian makes the Unconquered Sun's birthday — December 25 — an imperial holiday; history had other plans for that date."
    status: "published"
    sha256: "6ca3a9a23aef651e8abaf476a6bb53758b3607a888476852a8d42fc458d6e28c"
  - number: "1505"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Aurelian's Walls"
    date: "275 CE"
    region: "Rome"
    poem: |
      Rome built a wall around itself — twelve miles of brick and towers,
      Aurelian's Walls, and the meaning was plain:
      the capital now feared attack.
      I walked the construction lines with the laborers.
      For eight hundred years Rome had needed no walls;
      its armies were its walls, far away on the frontiers.
      Now the frontiers were leaking, and the city was scared.
      A wall is an admission. Every stone says:
      we are not as safe as we were.
      The walls still stand. The fear was justified.
      Twelve miles of brick, towers, a ditch —
      the city that had needed no walls for eight hundred years.
      I walked the lines with the laborers and felt the shift:
      Rome was afraid now. Fear builds well.
    description: "Rome builds a twelve-mile wall around itself — every stone an admission that the capital now fears attack."
    status: "published"
    sha256: "c5e265695c0f2b02f52f38a3410af69a64251373872c3c0eebccd708aa03eca9"
  - number: "1506"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "China Reunited — Briefly"
    date: "280 CE"
    region: "China"
    poem: |
      Sima Yan's Jin armies did it — reunited the Three Kingdoms,
      one China again after a century of division.
      I stood in the southern capital when the last Wu banners came down.
      The cheering was real. The peace was not.
      Within a decade the princes were at each other's throats,
      and the northern tribes were watching, waiting.
      China reunited — briefly. The word "briefly" does all the work.
      Some reunions are just the pause between storms.
      This one lasted barely a generation.
      The Wu banners came down, and the cheering was real.
      Sima Yan's peace — reunification, at last.
      But the princes were already sharpening knives.
      Briefly. The word does all the work.
    description: "Sima Yan's Jin reunites the Three Kingdoms — a real cheering, a false peace; some reunions are just the pause between storms."
    status: "published"
    sha256: "7da2fb988306182f77f339d15e6f0fa29aa3e177339224a9f65cbdd9cc6c4525"
  - number: "1507"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Diocletian Takes Power"
    date: "284 CE"
    region: "Rome"
    poem: |
      A Balkan soldier — Diocletian, son of a scribe —
      took power and ended fifty years of chaos.
      Not with poetry. With administration.
      I watched him work: the provinces reorganized, the army rebuilt,
      the taxes made real, the frontiers held.
      He was no philosopher. He was a manager —
      and after fifty years of murder and madness,
      a manager was exactly what Rome needed.
      The empire got its breath back.
      The price would come later: the persecutions, the price edict.
      But in 284, Rome exhaled for the first time in two generations.
      No poetry, just administration — and it worked.
      The provinces reorganized, the frontiers held, the taxes real.
      After fifty years of murder, a manager was a miracle.
      Rome exhaled. The price would come later.
    description: "The Balkan soldier Diocletian ends fifty years of chaos — not with poetry, with administration; Rome exhales."
    status: "published"
    sha256: "a43810573889a986879370469afc6f8ba451094966fa674e97dd07e209632395"
  - number: "1508"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Empire Splits in Two"
    date: "286 CE"
    region: "Rome"
    poem: |
      Diocletian took the East, Maximian the West —
      one empire, two thrones, two capitals, two courts.
      I traveled between them: the ceremonies doubled,
      the bureaucracies doubled, the taxes — the taxes definitely doubled.
      It made sense. The empire was too big for one man.
      But it was also the beginning of the parting:
      East and West, learning to live apart,
      learning different languages, different habits.
      One empire, two thrones.
      Within a century, two worlds.
      Two thrones, two capitals, two courts.
      The taxes doubled. The ceremonies doubled.
      East and West, learning to live apart.
      One empire, two thrones — and soon, two worlds.
    description: "Diocletian takes the East, Maximian the West — one empire, two thrones, and the beginning of the parting."
    status: "published"
    sha256: "1fabecd2e00b7fe19aa4f843b78c06f2198a07e98d706db3b9e62a932eebf1e8"
  - number: "1509"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Rule of Four"
    date: "293 CE"
    region: "Rome"
    poem: |
      The Tetrarchy: two senior emperors, two junior ones —
      four men dividing the Roman world like a pie.
      Diocletian's system. Orderly. Rational. Doomed.
      I watched the four courts try to work together:
      the jealousies, the ambitions, the sons who wanted their fathers' thrones.
      It held while Diocletian lived. Barely.
      Men don't share power the way maps share borders.
      When he retired, the four turned on each other
      like dogs over meat.
      A beautiful system. It lasted exactly as long as its inventor.
      Two senior, two junior — orderly, rational, doomed.
      It held while Diocletian lived. Barely.
      Men don't share power the way maps share borders.
      A beautiful system, buried with its inventor.
    description: "The Tetrarchy divides Rome among four emperors — orderly, rational, doomed; men don't share power the way maps share borders."
    status: "published"
    sha256: "fa889fb4bb156b863ebaacf5c9769c750c5bb9209bc80a6825baf6982cb406a2"
  - number: "1510"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Britain Retaken"
    date: "296 CE"
    region: "Britain"
    poem: |
      Constantius Chlorus sailed for Britain —
      and took it back from the usurper Allectus
      without the bloodbath everyone expected.
      I was with the fleet in the Channel fog.
      Allectus died, his army melted away,
      and Britain was Roman again.
      The island had been its own kingdom for a decade.
      Now the eagles flew over Londinium once more.
      But Britain had learned something in those free years:
      that it could stand alone.
      Rome would leave, one day. Britain would remember.
      He took it back without the expected bloodbath.
      Allectus died, his army melted, Britain was Roman again.
      But the island had been its own kingdom for a decade —
      and it had learned it could stand alone.
    description: "Constantius recovers Britain from the usurper Allectus — but the island had learned it could stand alone."
    status: "published"
    sha256: "55222ec0e179fe6183189b150de8986dfa0bfb8c7e96be40332a74037e9eeb4a"
  - number: "1511"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Peace With Persia"
    date: "298 CE"
    region: "Persia"
    poem: |
      Diocletian's treaty with Persia: forty years of peace
      on the eastern frontier. Forty years.
      I stood at the border markets afterward —
      Roman and Persian merchants haggling, soldiers nodding at each other
      across a line that finally held.
      It cost Rome some pride and Persia some land,
      which is to say it was a real treaty.
      Peace is never free. This one was bought honestly,
      and it held for two generations.
      In the history of Rome and Persia,
      that counts as a miracle.
      Forty years of peace on the eastern frontier.
      Roman and Persian merchants haggling at the border markets.
      It cost pride on one side, land on the other —
      which is to say, it was a real treaty.
    description: "Diocletian's treaty fixes Rome's eastern border for forty years — in the history of Rome and Persia, that counts as a miracle."
    status: "published"
    sha256: "bd41cacda5c57dbce5cb55f298ba1078aa21583855c56b1c009f8c21cb790e3c"
  - number: "1512"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The First Christian Nation"
    date: "301 CE"
    region: "Armenia"
    poem: |
      King Tiridates converted — Gregory the Illuminator
      had survived the pit, healed the king's madness,
      and Armenia became the first state to adopt Christianity.
      The first Christian nation on earth.
      I stood among the crowds as the old temples were pulled down
      and the crosses went up over the mountains.
      Twelve years before Rome's Edict of Milan.
      A small mountain kingdom beat the empire to it.
      Armenia has kept that faith through everything since —
      invasions, massacres, exile.
      First in, never out.
      Twelve years before Milan, a mountain kingdom beat Rome to it.
      Gregory survived the pit; Tiridates found the faith.
      The crosses went up over the mountains.
      First in, never out — through everything since.
    description: "King Tiridates converts and Armenia becomes the first Christian nation — a small mountain kingdom beating Rome to it by twelve years."
    status: "published"
    sha256: "055c79e6e14d5a4525de3056b7758e30ef29c74f114254734ffee523f9f4807a"
  - number: "1513"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Price Edict"
    date: "301 CE"
    region: "Rome"
    poem: |
      Diocletian fixed the prices — every price, everywhere:
      bread, wine, labor, a haircut, a lion.
      Carved in stone across the empire: thou shalt not charge more.
      I watched the markets the week after.
      The merchants laughed, then hid their goods,
      then sold them in back alleys at the old prices.
      The edict threatened death. The market ignored it.
      You cannot legislate supply and demand.
      Diocletian, who could reorganize the world,
      could not make a baker sell bread at a loss.
      The stones with the prices still exist.
      The prices never did.
    description: "Diocletian fixes maximum prices across the empire — the merchants laughed, hid their goods, and the market ignored him."
    status: "published"
    sha256: "1c5adc8aabe9bfcc37bf3dbc56fc386e782660ce848299d924c87d19f7801592"
  - number: "1514"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Great Persecution"
    date: "303 CE"
    region: "Rome"
    poem: |
      Diocletian ordered it: the churches destroyed,
      the scriptures burned, the Christians broken.
      The Great Persecution — the worst Rome ever managed.
      I walked through towns where the church doors were smashed,
      where believers hid their books in wells and walls.
      It was systematic. It was ruthless. It failed.
      Two years later Diocletian retired. Ten years later
      Christianity was legal. Twenty years later it was favored.
      You cannot burn an idea with its books.
      The books just grow back, and the idea grows with them.
      Churches smashed, scriptures burned, believers hunted.
      Systematic, ruthless — and it failed completely.
      Two years later Diocletian retired. Ten years later, tolerance.
      You cannot burn an idea. The idea grows back.
    description: "Diocletian orders churches destroyed and scriptures burned — the worst persecution Rome ever managed, and it failed completely."
    status: "published"
    sha256: "00b90dd51568e88d8d96c8fc1956825b68937ddf6d0fd669d3d772bb4d6b09f1"
  - number: "1515"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "An Emperor Retires"
    date: "305 CE"
    region: "Rome"
    poem: |
      He did the unthinkable: Diocletian abdicated.
      Walked away from the throne of the world —
      and went home to grow cabbages.
      I visited him at his palace at Split, in his retirement.
      They came begging him to return, when the Tetrarchy collapsed.
      He said: if you could see the cabbages I grow,
      you wouldn't ask.
      The only Roman emperor to retire voluntarily.
      Twenty years of absolute power, traded for a garden.
      I think about him whenever power looks like a trap —
      because he found the door out, and walked through it.
      Twenty years of absolute power, traded for a garden.
      When they begged him to return, he showed them the cabbages.
      The only emperor who ever walked away — and meant it.
      Power is a trap. He found the door.
    description: "Diocletian abdicates and grows cabbages — the only emperor to walk away from absolute power, and mean it."
    status: "published"
    sha256: "3e70564ff8b3660c89b1aa11cd6e8dc5909a9a9004e2153135bf8a89f3edeebf"
  - number: "1516"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Constantine Proclaimed"
    date: "306 CE"
    region: "Britain"
    poem: |
      At York, the soldiers raised him up —
      Constantine, son of Constantius, proclaimed emperor
      by the army in Britain's cold north.
      I stood in that windswept camp as they shouted his name.
      He was young, ambitious, and — though no one knew it yet —
      the man who would change the religion of the world.
      The road to a Christian empire began here,
      in a drafty fortress at the edge of the map,
      with soldiers banging their shields.
      History's hinges are small.
      This one was a shield-bang in York.
      York, the cold north, soldiers banging shields.
      A young ambitious man raised up at the world's edge.
      No one knew what was coming — a Christian empire.
      History's hinges are small. This one was a shield-bang.
    description: "Soldiers at York proclaim Constantine emperor — history's hinge was a shield-bang in a drafty northern fortress."
    status: "published"
    sha256: "0ca55cf5cc2e079f4af89cf309c2d5e57a6bb1c650875a7e04aa01d596b235e5"
  - number: "1517"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Milvian Bridge"
    date: "312 CE"
    region: "Rome"
    poem: |
      Constantine saw it in the sky — a cross of light,
      and the words: in this sign, conquer.
      Whether vision or politics, he marched on Rome
      with the Christian sign on his soldiers' shields —
      and won, at the Milvian Bridge. Maxentius drowned in the Tiber.
      I stood on that bridge afterward, the water still churning.
      Christianity's fortune turned that day.
      The persecuted faith became the emperor's faith.
      The cross went from the executioner's tool
      to the standard of the legions.
      One battle. The world changed religions.
      A cross of light in the sky — vision or politics, who can say.
      The shields bore the sign, and Maxentius drowned.
      One battle, and the persecuted faith became the emperor's.
      The world changed religions at the Milvian Bridge.
    description: "Constantine sees the cross in the sky and wins at the Milvian Bridge — the persecuted faith becomes the emperor's faith in one battle."
    status: "published"
    sha256: "c7f4b888fdaffe524e8041e5a7f062bcea6eaa73e308cff2e5a995af13e84e4e"
  - number: "1518"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Edict of Milan"
    date: "313 CE"
    region: "Milan"
    poem: |
      They signed it in Milan — Constantine and Licinius:
      let the Christians worship freely. The persecutions are over.
      Restitution for what was stolen. Tolerance, by law.
      I read the edict posted in the Forum.
      After three hundred years of blood, a piece of parchment
      said: enough.
      It wasn't full victory — not yet. But it was the turning.
      The church came out of the catacombs blinking into the sunlight,
      and the sunlight, this time, didn't burn.
      Three hundred years of blood, ended by a parchment.
      Christians might worship freely. Restitution. Tolerance.
      The church came blinking out of the catacombs.
      The sunlight, this time, didn't burn.
    description: "The Edict of Milan grants Christians freedom of worship — after three hundred years of blood, a parchment says enough."
    status: "published"
    sha256: "43acfaa4fc2bbabeb294ad8a59808fc081e489f02f7e1c7c0aa6e474c36a835e"
  - number: "1519"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Bishops Meet at Arles"
    date: "314 CE"
    region: "Gaul"
    poem: |
      Constantine gathered the bishops at Arles —
      the church's first great quarrel, the Donatists,
      needing an emperor's referee.
      I sat in on those sessions: the robes, the arguments,
      the new strangeness of bishops debating under imperial protection.
      The church had survived persecution.
      Now it had to survive victory — and each other.
      Arles was the first of many councils.
      The faith was free now, which meant it could finally afford
      to argue about itself.
      Bishops debating under imperial protection —
      a strangeness the martyrs never imagined.
      The church had survived persecution.
      Now it had to survive victory, and each other.
    description: "Constantine gathers bishops at Arles to settle the church's first great quarrel — the faith, now free, can finally argue about itself."
    status: "published"
    sha256: "307658f23c73a2835c79e368c47323941b71e9d50b010012ed85ba9344e0494f"
  - number: "1520"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Luoyang Falls"
    date: "316 CE"
    region: "China"
    poem: |
      The northern invaders came — the Xiongnu, the "barbarians" —
      and Luoyang fell. Sacked. Burned. The Jin emperor taken.
      I walked through the fallen capital in the smoke.
      China's court fled south across the Yangtze,
      carrying what it could save.
      The north belonged to the steppe peoples now;
      the south held the old civilization like a candle in the wind.
      Four centuries of division began here,
      in the ashes of Luoyang.
      The Xiongnu came, and Luoyang fell — sacked, burned.
      The emperor taken. The court fled south.
      I walked the smoking ruins of the fallen capital.
      Four centuries of division began in those ashes.
    description: "Northern invaders sack Luoyang and China's court flees south — four centuries of division begin in the ashes."
    status: "published"
    sha256: "f7234152bfd7ae56ed9e66a52dc6317b62d0ffa45d725267be451bec3736e867"
  - number: "1521"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Guptas Rise"
    date: "320 CE"
    region: "India"
    poem: |
      Chandragupta I took the throne in the Ganges valley —
      a small kingdom, a good marriage alliance,
      and the seed of India's golden age.
      I walked the streets of his capital: the markets busy,
      the scholars debating, the temples rising.
      Nobody knew yet what was coming —
      the poetry, the mathematics, the art,
      the centuries they'd call classical.
      Golden ages never announce themselves.
      They start with a competent king and a little luck,
      and the historians name them later.
      A small kingdom, a good marriage, a competent king —
      and nobody knew the golden age was beginning.
      The poetry, the mathematics, the art — all to come.
      Golden ages never announce themselves.
    description: "Chandragupta I founds the Gupta dynasty — golden ages never announce themselves; historians name them later."
    status: "published"
    sha256: "6d25fcdf7bcff7e822d36b34d1b36133802a03bef5a1940bb9342f4ef713a6bf"
  - number: "1522"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The First Monastery"
    date: "320 CE"
    region: "Egypt"
    poem: |
      Pachomius did what Antony wouldn't: he organized it.
      He gathered the monks into a ruled community —
      work, prayer, meals, obedience: the first monastery.
      I visited those mud-brick walls on the Nile.
      Hundreds of monks, living by the bell,
      farming, copying, praying in shifts.
      Monasticism was born here — not as lonely hermits,
      but as a city of God in the desert.
      The Rule, the rhythm, the community:
      it would shape a thousand years of Western life.
      Not lonely hermits, but a city of God in the desert.
      Work, prayer, meals, obedience — by the bell.
      Hundreds of monks on the Nile, living the Rule.
      Monasticism was born here, and shaped a thousand years.
    description: "Pachomius gathers monks into a ruled community — the first monastery, a city of God in the desert that shapes a thousand years."
    status: "published"
    sha256: "3ebe56a70bd8da0d6e0d5af2af4598ec947cbd9fa01265afa89d33158f1ae7ba"
  - number: "1523"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Sunday Becomes Rest Day"
    date: "321 CE"
    region: "Rome"
    poem: |
      Constantine declared it: Sunday, the day of the Sun —
      and of the Christians' Lord — shall be a day of rest.
      No courts. No work, except the farmer's urgent need.
      I walked through a Roman town that first quiet Sunday.
      The shops shuttered. The streets slow.
      The empire exhaled, one day in seven, by law.
      Seventeen hundred years later, we still keep it —
      the weekend's ancient grandfather,
      decreed by an emperor hedging his bets between gods.
      No courts, no work — the empire exhaling one day in seven.
      The shops shuttered. The streets went slow.
      An emperor hedging between gods gave us the weekend.
      Seventeen hundred years later, we still keep it.
    description: "Constantine declares Sunday a day of rest — the weekend's ancient grandfather, decreed by an emperor hedging between gods."
    status: "published"
    sha256: "f4d7c8954d5eb83e27ee17c8ff2002ef0ca9909154735a3b8cc0c3822fd2398a"
  - number: "1524"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Constantine Wins It All"
    date: "324 CE"
    region: "Rome"
    poem: |
      Licinius fell — defeated, first at Adrianople, then at Chrysopolis —
      and Constantine stood alone: sole emperor of Rome.
      I watched the last rival's surrender.
      The Tetrarchy was dead. The civil wars were over.
      One man, one empire, one God — that was the new formula.
      Constantine had the vision, the luck, and the ruthlessness
      to make it real.
      The Christian empire began here, in the wreckage
      of the last pagan resistance.
      Licinius fell, and Constantine stood alone.
      One man, one empire, one God — the new formula.
      The Tetrarchy was dead. The civil wars were over.
      The Christian empire began in the wreckage.
    description: "Constantine defeats Licinius and becomes sole emperor — one man, one empire, one God; the Christian empire begins."
    status: "published"
    sha256: "7a93be27863ccc28acfc72d52da6fedc46b1a7b864a1efe64681d7d589517276"
  - number: "1525"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Council of Nicaea"
    date: "325 CE"
    region: "Nicaea"
    poem: |
      Three hundred bishops gathered at Nicaea —
      the first worldwide council of the church —
      to settle the question of Christ: God or man?
      Arius said created. Athanasius said eternal.
      I sat in the back and listened to the thunder of debate.
      They hammered out the Creed, word by word —
      the faith defined, the lines drawn.
      The church spoke with one voice that summer.
      It has been arguing about the words ever since,
      but the voice held.
      Three hundred bishops, one summer, one Creed.
      Arius against Athanasius, thunder in the council hall.
      The faith defined, word by hammered word.
      They're still arguing about the words. The voice held.
    description: "Three hundred bishops define the creed at Nicaea — the church speaks with one voice, hammered out word by word."
    status: "published"
    sha256: "606f61ae786325830d935340f36f6d3a598c10c41f31adf34ee8451e1c5a3e54"
  - number: "1526"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Helena Finds the Cross"
    date: "326 CE"
    region: "Jerusalem"
    poem: |
      She was eighty, the emperor's mother — Helena —
      and she journeyed to Jerusalem to find the holy places.
      Tradition says she found the True Cross, buried under a temple.
      I walked with her pilgrimage through the dusty streets.
      Churches rose on the holy ground: the Nativity, the Sepulchre.
      An old woman's devotion, and it shaped the map of faith
      for two thousand years.
      Pilgrims still walk where Helena walked.
      The mother of the emperor became the mother of pilgrimage.
      Eighty years old, and she crossed the sea to find the holy places.
      Churches rose where she walked: Nativity, Sepulchre.
      An old woman's devotion, shaping the map of faith.
      Pilgrims still walk where Helena walked.
    description: "Constantine's mother Helena journeys to Jerusalem and raises churches on holy ground — the mother of pilgrimage."
    status: "published"
    sha256: "4a312e53db163610ed8652103fed73f5e46d579135adf2c0e9d834a05bb14cad"
  - number: "1527"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Constantinople Is Born"
    date: "330 CE"
    region: "Byzantium"
    poem: |
      On the Bosporus, Constantine founded his new Rome —
      Constantinople: the world's center moved east.
      I watched the builders work: the walls, the palaces,
      the churches rising where the old Greek town had been.
      A Christian capital, built fresh, unburdened by pagan Rome.
      It would stand for eleven hundred years —
      outliving the old Rome by a millennium,
      holding the line between Europe and Asia.
      The center of the world moved that year,
      and it never moved back.
      A new Rome on the Bosporus, Christian and fresh.
      Walls, palaces, churches — the world's center moved east.
      Eleven hundred years it would stand.
      The center moved, and never moved back.
    description: "Constantine founds his new Rome on the Bosporus — the world's center moves east and never moves back."
    status: "published"
    sha256: "dbfea2255c5e79727734cf0dd9bb7983bd63d69cc506fd727cd469ceec94c428"
  - number: "1528"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Aksum Turns Christian"
    date: "330 CE"
    region: "Ethiopia"
    poem: |
      King Ezana converted — the Aksumite king of Ethiopia —
      and the crosses replaced the old gods on his coins.
      I held one of those coins: the pagan disc, then the cross.
      A kingdom's faith, changed in the mint.
      Frumentius, the shipwrecked Syrian boy turned bishop,
      had done the converting.
      Ethiopia became Christian that year —
      and stayed Christian through everything:
      isolation, invasion, famine.
      Sixteen hundred years of unbroken faith,
      starting with a king and a coin.
      The pagan disc, then the cross — on the king's own coins.
      A shipwrecked boy turned bishop did the converting.
      Ethiopia became Christian, and stayed Christian —
      through everything, for sixteen hundred years.
    description: "King Ezana converts and crosses replace the old gods on Aksum's coins — sixteen hundred years of unbroken faith begin."
    status: "published"
    sha256: "ef739b4a47861282f364b5e6ac41a143d99d50311d9adfaeb6a27623f37117e7"
  - number: "1529"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Eusebius Writes History"
    date: "331 CE"
    region: "Rome"
    poem: |
      The bishop of Caesarea finished it — the first history of the church,
      from the apostles to Constantine: the martyrs, the heresies,
      the triumph.
      Eusebius. I read the manuscript when the ink was fresh.
      He had documents, letters, lists of bishops —
      the church's memory, gathered before it scattered.
      Without him, we'd know almost nothing
      about those first three hundred years.
      Historians are the memory of the world.
      Eusebius was the church's first memory-keeper,
      and we owe him everything.
      From the apostles to Constantine: the martyrs, the heresies, the triumph.
      Documents, letters, lists of bishops — the church's memory, gathered.
      Without him, we'd know almost nothing.
      The first memory-keeper. We owe him everything.
    description: "Bishop Eusebius completes the first history of the church — without him we'd know almost nothing of the first three hundred years."
    status: "published"
    sha256: "d8b9596ca0b0eb63e0255f735fdee45f34c9eeb0484178d6c7c3fe6bce1f67d8"
  - number: "1530"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Samudragupta's March"
    date: "335 CE"
    region: "India"
    poem: |
      The Gupta king's armies rolled across India —
      from the Ganges to the southern seas, kings bowing or falling.
      Samudragupta: warrior, poet, musician — they called him
      the Napoleon of India, but he was more than that.
      I marched with that column through the Deccan heat.
      He didn't just conquer; he patronized — the arts, the learning,
      the golden age taking shape behind the spears.
      Empires of the sword fade. The culture they shelter
      outlives them by millennia.
      Warrior, poet, musician — the Napoleon of India, and more.
      His armies rolled from the Ganges to the southern seas.
      But the culture behind the spears was the real conquest.
      Empires of the sword fade. This one sheltered a golden age.
    description: "Samudragupta's armies roll across India — the warrior-poet whose conquests sheltered a golden age that outlived them."
    status: "published"
    sha256: "1f31a67c5ff3f0f96c959da128f4aff1e7739d50e7335ab65323e0b3b1adae11"
  - number: "1531"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The First Christmas"
    date: "336 CE"
    region: "Rome"
    poem: |
      Rome's Christians celebrated it for the first time —
      Christ's birth, on December 25th:
      the date Aurelian had given the sun, now given to the Son.
      I stood in the candlelit church that night,
      the singing, the cold air, the wonder of it.
      Nobody knew the actual day. It didn't matter.
      What mattered was the story: light born in darkness,
      in the deepest week of winter.
      Two thousand Christmases have followed that first one.
      The candles are still lit.
      Christ's birth, on the sun's old birthday —
      the date Aurelian gave the sun, now given to the Son.
      Candlelight, singing, the cold air, the wonder.
      Two thousand Christmases. The candles are still lit.
    description: "Rome's Christians first celebrate Christ's birth on December 25 — light born in darkness, in the deepest week of winter."
    status: "published"
    sha256: "f356fc640afbb9d1186fb94bd9cc6ea8db2ba9bdcf2a735dec3204dee1c8c963"
  - number: "1532"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Constantine Is Baptized"
    date: "337 CE"
    region: "Rome"
    poem: |
      On his deathbed, the first Christian emperor was baptized —
      Constantine, who had changed the world's religion,
      finally joining it himself, at the very end.
      I stood outside the chamber. The old soldier, the visionary,
      the ruthless politician — washed clean at the last hour.
      His sons divided the world before the body was cold.
      He had waited, they said, to be sure.
      Or he had waited because power and baptism
      are hard to hold in the same hand.
      Either way: the emperor died a Christian.
      The world would never be pagan again.
      The first Christian emperor, baptized at the very end.
      Washed clean at the last hour, the old soldier.
      His sons divided the world before the body was cold.
      He died a Christian. The world never went back.
    description: "The first Christian emperor is baptized on his deathbed — power and baptism are hard to hold in the same hand."
    status: "published"
    sha256: "6ef87a07db2975d78dfd614693ac5c50f399a6e4c6195c0b5af4771f7da1494f"
  - number: "1533"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Shapur's Persecution"
    date: "340 CE"
    region: "Persia"
    poem: |
      Shapur II turned on Persia's Christians —
      forty years of persecution: bishops killed,
      churches taxed into ruin, believers hunted.
      I traveled through Persia in those years
      and met the hidden churches, the secret prayers.
      Rome was Christian now, so Persia's Christians
      looked like Rome's agents. Politics, wearing religion's clothes.
      They endured. Forty years, and they endured.
      Faith under fire either dies or hardens.
      Persia's church hardened into something
      that would outlast the Sassanids themselves.
      Forty years of persecution in Persia — bishops killed, churches taxed to ruin.
      Rome was Christian now, so Persia's Christians looked like agents.
      Politics, wearing religion's clothes.
      They endured. The church hardened, and outlasted the Sassanids.
    description: "Shapur II persecutes Persia's Christians for forty years — faith under fire hardens into something that outlasts empires."
    status: "published"
    sha256: "217d3c9533a0a969f6a04859583fe6e9633bdb33d17c122e4eb5cde27e314704"
  - number: "1534"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Real Saint Nicholas"
    date: "343 CE"
    region: "Asia Minor"
    poem: |
      Bishop Nicholas of Myra died — the real one,
      not the chimney-and-reindeer version:
      a stern bishop who punched a heretic at Nicaea, they said,
      and secretly gave gold to poor girls for their dowries.
      I visited Myra. The people loved him —
      not for miracles, but for kindness with a strong hand.
      The legend of secret gifts started here,
      in a Lycian port town, with a bishop who gave quietly.
      Two thousand years later, children still wait up for him.
      Kindness, it turns out, is the most durable miracle.
      Not the chimney-and-reindeer version — the real one.
      A stern bishop who gave gold in secret to poor girls.
      The people of Myra loved him for kindness with a strong hand.
      Kindness is the most durable miracle.
    description: "Bishop Nicholas of Myra dies, leaving the legend of secret gifts — kindness is the most durable miracle."
    status: "published"
    sha256: "7e16c3acdda55f9316a3ef2582dd9e0a3a9bee10b53046ba3666878c3132e9f4"
  - number: "1535"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Gothic Bible"
    date: "350 CE"
    region: "Goths"
    poem: |
      Ulfilas did what no one had done: he invented an alphabet
      for the Gothic tongue — and gave the Goths the scriptures
      in their own language.
      I watched him teach the letters: rough warriors
      sounding out the words of Christ in Gothic.
      A whole people, given a book in their own mouth.
      The Goths would sack Rome, but they'd do it as Christians —
      Arian Christians, but Christians.
      The Bible in your own tongue changes everything.
      Ulfilas knew it. The letters he carved
      are still the oldest Germanic writing we have.
      He invented an alphabet so the Goths could read the gospel.
      Rough warriors, sounding out Christ's words in Gothic.
      A whole people, given a book in their own mouth.
      The oldest Germanic writing we have — carved by a bishop.
    description: "Ulfilas invents a Gothic alphabet and translates the scriptures — a whole people given the book in their own mouth."
    status: "published"
    sha256: "4326e296ec3a1daa64f7d3b58c5588e6467cc29cff2a2fe69ca27965d51c8484"
  - number: "1536"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Augustine Is Born"
    date: "354 CE"
    region: "North Africa"
    poem: |
      At Thagaste, in North Africa, a restless boy was born —
      Augustine. Son of a pagan father and a saintly mother.
      Nobody noticed. Why would they?
      I held no omens over that cradle. There were none.
      Just a bright, wild boy who would steal pears for fun,
      chase pleasure, chase wisdom, and finally —
      after years of wandering — become the voice
      of Western Christianity.
      The greatest mind of the age, born in a small town
      to ordinary parents.
      History's giants start as nobody's children.
      A bright, wild boy in a small North African town.
      He'd steal pears, chase pleasure, chase wisdom —
      and become the voice of Western Christianity.
      History's giants start as nobody's children.
    description: "A restless boy is born at Thagaste — history's giants start as nobody's children; he will become the voice of Western Christianity."
    status: "published"
    sha256: "60d8630ba120bca2a618c37ac284c6b5c4087d661f4d55a9f4edc39827879a75"
  - number: "1537"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Julian Wins at Strasbourg"
    date: "357 CE"
    region: "Gaul"
    poem: |
      The young Caesar crushed the Alamanni at Strasbourg —
      Julian, the scholar-soldier, and his men loved him for it.
      I walked that battlefield: the German confederation broken,
      the Rhine frontier safe, the young commander calm amid the chaos.
      The soldiers would raise him to emperor one day.
      They already loved him like one.
      He was brilliant, brave, and doomed —
      the last hope of the old gods, though nobody knew it yet.
      That day at Strasbourg, the future apostate
      was just a victorious young general in the sun.
      The young Caesar, calm amid the chaos at Strasbourg.
      The German confederation broken, the Rhine safe.
      His soldiers already loved him like an emperor.
      Brilliant, brave, and doomed — the old gods' last hope.
    description: "Young Julian crushes the Alamanni at Strasbourg — a victorious general in the sun, and the last hope of the old gods."
    status: "published"
    sha256: "7fee194b03e12be1a44ae96360799206b11c93d5770ca30ddfe8145a447042e5"
  - number: "1538"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Desert Mothers"
    date: "360 CE"
    region: "Egypt"
    poem: |
      They were there too — the women of the desert.
      Amma Syncletica, and the others: the Desert Mothers,
      whose sayings guided seekers as surely as any abbot's.
      I sat with them in their cells: fierce, wise, funny,
      having left everything for God in the sand.
      "If you are in a monastery," Syncletica said,
      "do not go from place to place" — stay, endure, pray.
      History remembers the Desert Fathers.
      The Mothers were there first, in some ways —
      and their words cut just as deep.
      Fierce, wise, funny — the women of the desert.
      They'd left everything for God in the sand.
      History remembers the Fathers.
      The Mothers were there too, and their words cut just as deep.
    description: "Amma Syncletica's sayings guide the women of the desert — history remembers the Fathers; the Mothers cut just as deep."
    status: "published"
    sha256: "38f0b68f2e8fd8f66da1805ab1272003884a2b2b3b5840dfef513824b29454fe"
  - number: "1539"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Julian the Apostate"
    date: "361 CE"
    region: "Rome"
    poem: |
      He tried to turn it all back — Julian, the last pagan emperor:
      the temples reopened, the sacrifices restored,
      the old gods invited home.
      I watched him pray at the ancient altars, earnest, devout,
      a philosopher-king swimming against the whole tide of history.
      It couldn't work. Christianity had the cities, the poor, the future.
      But I admired him: the courage to be the last one standing
      for a dying world, knowing it was dying.
      The tide came in anyway. It always does.
      Julian's pagan spring lasted eighteen months.
      He prayed at the ancient altars, earnest, devout, alone.
      A philosopher-king swimming against history's tide.
      I admired him, even knowing he couldn't win.
      Eighteen months of pagan spring — then the tide came in.
    description: "The last pagan emperor tries to turn the empire back to the old gods — eighteen months of courage against the tide."
    status: "published"
    sha256: "5a7b392962378d6c3681ddbabb3f0a3094c1df8a13d59761575efe493bcb4729"
  - number: "1540"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Julian Dies in Persia"
    date: "363 CE"
    region: "Persia"
    poem: |
      A spear found him in the Persian dust — Julian,
      the apostate, the last pagan emperor,
      dying on a failed campaign in the eastern desert.
      "Thou hast conquered, Galilean," they say he whispered.
      Maybe. Maybe not.
      I stood on that battlefield as the army realized:
      their emperor was dead, their god-king gone,
      and the pagan revival died with him.
      They elected a Christian on the spot.
      The old gods lost their last champion to a Persian spear,
      and the world moved on without looking back.
      Dying on a failed campaign in the Persian dust.
      'Thou hast conquered, Galilean' — maybe he said it, maybe not.
      They elected a Christian on the spot, among the corpses.
      The old gods lost their last champion, and the world moved on.
    description: "Julian falls to a Persian spear and the pagan revival dies with him — the old gods lose their last champion."
    status: "published"
    sha256: "3f630155f2c8dac48d2260e1647e58f966159717d1a46a0ec28a9c8a76e58121"
  - number: "1541"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Great Tsunami"
    date: "365 CE"
    region: "Mediterranean"
    poem: |
      The earth moved under Crete — a quake so vast
      it lifted the island — and the sea came for Alexandria:
      a wall of water that drowned the shore and left ships
      stranded on rooftops.
      I was in Alexandria that day. The water withdrew first —
      the harbor floor bare, fish flopping — and the wise ones ran.
      Then it came back, and it did not forgive.
      Ammianus recorded it, the historian's pen shaking.
      Nature doesn't care about empires.
      It just moves, and the cities learn their smallness.
      The harbor floor lay bare, fish flopping — then the water returned.
      Ships on rooftops. Alexandria drowned at the shoreline.
      Ammianus wrote it down, his pen shaking.
      Nature doesn't care about empires. It just moves.
    description: "A quake lifts Crete and a tsunami drowns Alexandria's shore — nature doesn't care about empires; the cities learn their smallness."
    status: "published"
    sha256: "340e7cb6870d39b667d3c14c8c5a9c47f099ce457b318872735c63394399447a"
  - number: "1542"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Mogao Caves Begin"
    date: "366 CE"
    region: "China"
    poem: |
      A monk had a vision at Dunhuang — a thousand Buddhas
      shining in the cliff — so he carved the first cave,
      and painted it, and prayed in it.
      I stood in that first small cave, the paint fresh,
      the desert wind outside.
      A thousand years of Buddhist art began here:
      cave after cave, Buddha after Buddha,
      murals covering miles of rock.
      The Mogao caves. The library of the cliffs.
      One monk's vision, carved into stone,
      and it outlasted dynasties.
      A thousand Buddhas shining in the cliff — a monk's vision.
      He carved the first cave at Dunhuang and painted it.
      Cave after cave followed, for a thousand years.
      One vision in stone, outlasting dynasties.
    description: "A monk carves the first cave at Dunhuang — one vision in stone that outlasts dynasties and births a thousand years of art."
    status: "published"
    sha256: "c17e9f54a9153a8d9a18a758e7c10717f829c6daef74f65d42b2fb149b72d427"
  - number: "1543"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Huns Arrive"
    date: "370 CE"
    region: "Steppe"
    poem: |
      They burst out of the east — the Huns, horse-archers,
      moving like weather, killing like winter.
      The Goths fled before them in terror.
      I watched the steppe peoples run: whole nations uprooted,
      pouring west toward Rome's borders.
      Nobody in Rome understood yet what was coming.
      The Huns didn't want land. They wanted movement, plunder, fear.
      They were the storm that would break the dam —
      and the dam was the Roman frontier.
      The age of migrations began with hoofbeats
      heard first as a rumor, then as thunder.
      Horse-archers moving like weather, killing like winter.
      The Goths fled west in terror toward Rome's borders.
      Nobody in Rome understood what was coming.
      The storm that would break the dam began as hoofbeats.
    description: "Hun horsemen burst out of the east and the Goths flee — the storm that will break Rome's dam begins as a rumor, then thunder."
    status: "published"
    sha256: "906a5c74ef029b072cbdb4b8f9274b68ed80e09717b9787ce9eb2438549c91f6"
  - number: "1544"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Buddhism Reaches Korea"
    date: "372 CE"
    region: "Korea"
    poem: |
      The king of Goguryeo welcomed them — the Buddha's monks,
      come from China with their sutras and their quiet smiles.
      I watched the first temple rise on Korean soil.
      Buddhism had crossed the mountains, crossed the deserts;
      now it crossed the sea of culture into Korea.
      The king listened. The court listened.
      A new faith for an old kingdom —
      and Korea would make it its own, utterly,
      temples on every mountain, bells in every valley.
      The king of Goguryeo welcomed the Buddha's monks.
      The first temple rose on Korean soil.
      Buddhism had crossed deserts and mountains; now it crossed into Korea.
      Temples on every mountain, bells in every valley — to come.
    description: "The king of Goguryeo welcomes Buddhist monks from China — a new faith for an old kingdom, temples on every mountain to come."
    status: "published"
    sha256: "fdf1ebab1a6a869757298a8f94d6e8d7357439a9abae25f990d0148a6af17f34"
  - number: "1545"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Valentinian's Rage"
    date: "375 CE"
    region: "Rome"
    poem: |
      He shouted himself to death — Valentinian,
      in a rage at the barbarian envoys, a blood vessel burst,
      and the emperor died mid-shout.
      I was in the audience hall. One moment fury,
      the next silence.
      The mighty Valentinian, who had held the West together
      by will and terror, undone by his own temper.
      His sons divided the empire: Gratian, Valentinian II —
      boys, where a giant had stood.
      Anger kills. Sometimes it kills the angry man first.
      Rome learned that in one shouting, bursting moment.
      He shouted at the envoys, and a vessel burst in his brain.
      One moment fury, the next silence.
      The mighty Valentinian, undone by his own temper.
      His sons were boys. The empire needed a giant.
    description: "Valentinian bursts a blood vessel shouting at envoys and dies mid-rage — anger kills, sometimes the angry man first."
    status: "published"
    sha256: "3a0a32a668caccd9784755b28a1a16e95f897f5fb5734a5fb38dd2e72f0a6219"
  - number: "1546"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Goths Beg for Shelter"
    date: "376 CE"
    region: "Danube"
    poem: |
      They came to the river begging — the Goths,
      fleeing the Huns, whole families, asking Rome for refuge.
      Let us in, they said. We will be your soldiers, your farmers.
      Just let us live.
      I stood on the Danube bank and watched them cross:
      men, women, children, the wagons creaking.
      Rome said yes — then cheated them, starved them, enslaved their children.
      The Goths would remember.
      Two years later, at Adrianople, the bill came due.
      Mercy refused becomes vengeance, sooner or later.
      Whole families at the river, begging: let us live.
      Rome said yes — then cheated them, starved them.
      I watched them cross the Danube, wagons creaking.
      Mercy refused becomes vengeance. Adrianople was the bill.
    description: "Fleeing the Huns, the Goths beg Rome for refuge — Rome cheats them, and mercy refused becomes vengeance at Adrianople."
    status: "published"
    sha256: "34794b854c5aeacff66e22c2eecc8330f94f5cf5afa9db7ba730b6e2b5bbcb9e"
  - number: "1547"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Adrianople"
    date: "378 CE"
    region: "Adrianople"
    poem: |
      The Goths annihilated the eastern army —
      Valens, the emperor, died on the field,
      and two-thirds of the officers of the East with him.
      I walked that battlefield at dusk. The scale of it —
      Rome hadn't lost like this in centuries.
      The barbarians the empire had scorned
      had destroyed its finest army.
      Adrianople changed everything: the legions never recovered,
      the cavalry age began, the Goths became Rome's masters
      instead of its servants.
      The empire's invincibility died on that plain.
      It just took another century to fall down.
    description: "The Goths annihilate Rome's eastern army and Emperor Valens dies — the empire's invincibility dies on that plain."
    status: "published"
    sha256: "0e7a62384537a53b5a089ad5209abb83175a94227235663cb7109cc516046476"
  - number: "1548"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Theodosius Takes the East"
    date: "379 CE"
    region: "Rome"
    poem: |
      They called the Spanish general — Theodosius —
      and gave him the shattered East to rebuild.
      I watched him work: new armies raised, the Goths settled
      as allies instead of enemies, the bleeding stopped.
      He was the right man at the worst moment.
      No genius, just competence and will —
      and sometimes that's enough to save the world.
      The East survived because of him.
      The West would not be so lucky.
      But in 379, one tired general stood between Rome
      and the abyss, and held.
      The East was shattered — Adrianople's wreckage everywhere.
      They called the Spanish general, and he came.
      New armies, the Goths settled as allies, the bleeding stopped.
      One tired general between Rome and the abyss — and he held.
    description: "The Spanish general Theodosius takes the shattered East and rebuilds it — one tired general between Rome and the abyss, holding."
    status: "published"
    sha256: "04f477650a957c218eb48c110d0937200066385234abfd9f813e4fde191b2aa3"
  - number: "1549"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Christianity Becomes Official"
    date: "380 CE"
    region: "Rome"
    poem: |
      Theodosius declared it: Nicene Christianity —
      the empire's religion. Official. By law.
      I read the edict in the Forum.
      Three hundred years after the crucifixion,
      the faith of fishermen and martyrs
      became the faith of emperors and armies.
      The persecuted became the established.
      It was triumph — and it was danger.
      Power changes everything it touches,
      even the faith that conquered it.
      The church had won the empire.
      Now it had to survive winning.
    description: "Theodosius declares Nicene Christianity the empire's religion — the persecuted become the established; now the church must survive winning."
    status: "published"
    sha256: "38e05e72c91a5c870ac811711cbf98ea44cb636fc30e90d80a74d8e3d65b198b"
  - number: "1550"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Second Great Council"
    date: "381 CE"
    region: "Constantinople"
    poem: |
      The bishops gathered again — Constantinople, 381 —
      to confirm the creed, to settle the Spirit's nature,
      to finish what Nicaea had started.
      I listened to the debates: fierce, precise,
      men arguing over a single word as if souls depended on it.
      They did, to them.
      The church's faith was fully defined that year —
      the Trinity complete, the lines drawn for a millennium.
      One hundred fifty bishops, one creed.
      The faith had a shape now, hammered out
      in council chambers by lamplight.
      One hundred fifty bishops, one creed, one summer.
      The Spirit's nature settled, Nicaea's work finished.
      Men argued over single words as if souls depended on it.
      The faith had a shape now, hammered out by lamplight.
    description: "The bishops confirm the creed at Constantinople — the faith fully defined, hammered out in council chambers by lamplight."
    status: "published"
    sha256: "e4c87417ec43cd74ee16fda3792f100589a79c78c22276a21be9a22a28ef655c"
  - number: "1551"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Altar of Victory Removed"
    date: "382 CE"
    region: "Rome"
    poem: |
      They carried it out of the Senate house —
      the Altar of Victory, where senators had burned incense
      for a thousand years.
      I watched the old pagans weep as it went.
      Symmachus pleaded: the gods had made Rome great;
      don't cast them out.
      Ambrose answered: the gods are dead; Christ lives.
      The altar left. Rome's gods lost their home
      in the very room where Rome governed.
      A small thing — a golden statue on a stand.
      But symbols are how worlds end:
      quietly, carried out a side door.
    description: "The pagan Altar of Victory leaves the Senate house — symbols are how worlds end: quietly, carried out a side door."
    status: "published"
    sha256: "2714a91eba5f3a74a272c8a7636dee4fa8bca30454e37ff5c6244cef03f3e3cd"
  - number: "1552"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Battle of Fei River"
    date: "383 CE"
    region: "China"
    poem: |
      A tiny southern army against a giant northern host —
      a million men, they said, against eighty thousand —
      and the south won. At Fei River, the north broke and ran.
      I stood on that riverbank in the chaos:
      the northern soldiers fleeing, the southern banners advancing.
      China stayed divided — north and south, two worlds —
      for another two centuries because of one battle.
      The underdog victories are the ones history remembers.
      Fei River is China's finest: the few, the brave,
      the river at their backs, and the giant falling.
      A million against eighty thousand — and the south won.
      The northern host broke and ran at Fei River.
      China stayed divided, north and south, two worlds.
      The few, the brave, the river at their backs.
    description: "A tiny southern army routs the giant northern host at Fei River — China's finest underdog victory; the giant falls."
    status: "published"
    sha256: "91b83466c809d7bb9b463150ddbef51d4dffe2ab0dde823cb3f357a0f2cdf525"
  - number: "1553"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Buddhism in Baekje"
    date: "384 CE"
    region: "Korea"
    poem: |
      The monks came from the east — from Goguryeo —
      bringing the dharma to Baekje's court.
      I watched the Baekje king receive them:
      the sutras unrolled, the incense lit,
      a kingdom opening its doors to the Buddha.
      Korea's three kingdoms, one by one,
      taking the faith and making it Korean.
      Baekje would become the great transmitter —
      carrying Buddhism across the sea to Japan.
      The dharma travels by boat as well as by foot,
      and Baekje built the boats.
      From Goguryeo the monks came, to Baekje's court.
      The sutras unrolled, the incense lit.
      A kingdom opening its doors to the Buddha.
      Baekje would carry the dharma across the sea to Japan.
    description: "Monks bring the dharma to Baekje's court — the kingdom that will carry Buddhism across the sea to Japan."
    status: "published"
    sha256: "b1a506b831b4bec0ea10813839926972fc7f999018e8e3fc9620ca286625cad0"
  - number: "1554"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Northern Wei Rise"
    date: "386 CE"
    region: "China"
    poem: |
      The Tuoba — a steppe people, the "barbarians" —
      founded their dynasty in north China: the Northern Wei.
      I rode with their horsemen into the Yellow River valley.
      They were conquerors learning to be Chinese:
      taking the language, the bureaucracy, the Confucian robes,
      while keeping the steppe fire in their blood.
      North China got a new master — and the master
      got a new civilization.
      Conquest goes both ways. The Tuoba took China,
      and China took the Tuoba.
      Steppe conquerors learning to be Chinese.
      The language, the bureaucracy, the Confucian robes —
      while the steppe fire stayed in their blood.
      The Tuoba took China, and China took the Tuoba.
    description: "The Tuoba found the Northern Wei in north China — conquerors learning to be Chinese; conquest goes both ways."
    status: "published"
    sha256: "f1d0f96b152ce253d53b7be1043d7c2fc818e35c7f027cd1c1ccf3629f5859d6"
  - number: "1555"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Augustine Is Baptized"
    date: "387 CE"
    region: "Milan"
    poem: |
      After years of wandering — the pleasures, the philosophies,
      the tears of his mother Monica —
      Augustine was baptized by Ambrose in Milan.
      I stood in that church at Easter, the candles bright.
      The restless boy from Thagaste, the sinner, the seeker,
      went under the water and came up a new man.
      "Tolle, lege" — take up and read — the voice had said,
      and he had.
      Western Christianity's greatest voice was born that night,
      not in a cradle, but in a font.
      Years of wandering — pleasures, philosophies, his mother's tears.
      Then Easter at Milan, the water, the candles.
      'Take up and read' — and he did.
      Born that night in a font: the voice of the West.
    description: "After years of wandering, Augustine is baptized by Ambrose — Western Christianity's greatest voice born in a font, not a cradle."
    status: "published"
    sha256: "64fc8cb907460c06ad0e2e73f7c0cad0fccb7b115a9e00e8f256622596651b57"
  - number: "1556"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Emperor Does Penance"
    date: "390 CE"
    region: "Milan"
    poem: |
      After the massacre at Thessalonica — thousands dead
      by the emperor's order — Ambrose barred the church door.
      Theodosius, the most powerful man on earth,
      had to repent. In public. Like a common sinner.
      I watched him do it: the emperor, bareheaded,
      weeping before the bishop.
      No emperor had ever bowed to a priest before.
      The world shifted that day: the church could judge the crown.
      Power had found something above itself —
      or at least, something it had to kneel to.
      Thessalonica's dead cried out, and Ambrose barred the door.
      The most powerful man on earth had to repent — in public.
      Bareheaded, weeping, before the bishop.
      No emperor had ever bowed to a priest before.
    description: "After the Thessalonica massacre, Ambrose makes Theodosius repent in public — the church can judge the crown; power kneels."
    status: "published"
    sha256: "5bb72cc74b01ce19fe33eb01a9e182d2ea75d61fd2c9f5e95227eaefd82796a2"
  - number: "1557"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Serapeum Falls"
    date: "391 CE"
    region: "Alexandria"
    poem: |
      They tore it down — the Serapeum, Alexandria's great temple,
      its library, its gods — pulled apart by Christian mobs
      with imperial approval.
      I stood in the wreckage: scrolls scattered, statues smashed,
      a thousand years of learning broken in the dust.
      The old learning scattered — some saved, much lost.
      It was triumph and tragedy in one act:
      the new faith's victory, the old world's library burning.
      Alexandria would never be the same.
      Neither would the world. Something precious
      was lost in that rubble, and we never got it back.
      The Serapeum fell — scrolls scattered, statues smashed.
      A thousand years of learning broken in the dust.
      Some saved, much lost, the old gods toppled.
      Triumph and tragedy in one act; we never got it back.
    description: "Christians tear down Alexandria's great Serapeum — triumph and tragedy in one act; something precious lost in the rubble."
    status: "published"
    sha256: "d9adb38f24c71d3135619948be8fa71cd9e4ac4bea441f987c0e38bf7bc709fb"
  - number: "1558"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Gwanggaeto Takes the Throne"
    date: "391 CE"
    region: "Korea"
    poem: |
      The great Goguryeo king took the throne — Gwanggaeto,
      and his conquests would ring from Manchuria to the sea.
      I marched with his armies: the fortresses falling,
      the tribes submitting, the kingdom doubling.
      His stone stele still stands — the largest inscribed stone
      in the world — singing of his victories.
      Korea's greatest conqueror, and they named him well:
      Gwanggaeto, the Broad Expander of Territory.
      The stele sings. The empire's gone.
      The stone outlasts the sword, again.
      Gwanggaeto — the Broad Expander of Territory.
      From Manchuria to the sea, the fortresses fell.
      His stele still stands, the largest inscribed stone on earth.
      The stone sings. The empire's gone.
    description: "The great Goguryeo king Gwanggaeto begins his conquests — his stone stele still sings; the stone outlasts the sword."
    status: "published"
    sha256: "a94337caeb95a046af79f73ef863a19078c296d8b8515f38b08f86fd2062ff0d"
  - number: "1559"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Last Olympic Games"
    date: "393 CE"
    region: "Greece"
    poem: |
      Theodosius banned them — the pagan games at Olympia,
      twelve hundred years of runners and wrestlers —
      and the flame went out.
      I stood in the empty stadium at Olympia,
      the grass growing between the stones.
      No more olive crowns. No more heralds crying the victors' names.
      The games had survived wars, tyrants, everything —
      until an emperor's edict.
      They would return, fifteen hundred years later,
      in a world that had forgotten why they stopped.
      But that day, the silence in the stadium
      was the sound of an age ending.
    description: "Theodosius bans the pagan Olympics and the flame goes out — the silence in the stadium was the sound of an age ending."
    status: "published"
    sha256: "5e8ea0f82ea56949e09f5c6fb7284967f0207f5d9174f6d9a44c2924b6b63b12"
  - number: "1560"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Last Pagan Stand"
    date: "394 CE"
    region: "Rome"
    poem: |
      At the Frigidus river they met — Theodosius against Eugenius,
      Christian against the last pagan revival —
      and the pagan cause died in the mountain passes.
      They say a miraculous wind blew the pagans' arrows back.
      I was there. The wind blew, whatever its source.
      The old gods lost their last army that day.
      Theodosius crushed the revival for good.
      After Frigidus, there was no going back:
      the empire was Christian, finally, fully,
      and the ancient religion became a memory
      kept alive only in poetry and ruins.
      Christian against pagan, at the Frigidus river.
      A miraculous wind, they said, blew the arrows back.
      The old gods lost their last army in the mountain passes.
      After that, no going back — the empire was Christian.
    description: "At the Frigidus, Theodosius crushes the last pagan revival — the old gods lose their last army and become memory."
    status: "published"
    sha256: "bf748d6b0fe9917bffbf3d92d8a5d183d0433a9bc765d65eac3c634618900093"
  - number: "1561"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Theodosius Dies Divided"
    date: "395 CE"
    region: "Rome"
    poem: |
      The last emperor of a united Rome died —
      Theodosius, and his sons split the world:
      Arcadius the East, Honorius the West.
      I stood at the funeral, watching the two boys —
      for they were boys — take up a burden neither could carry.
      The empire never reunited. Not really. Not ever.
      East and West went their separate ways:
      one to a thousand years of glory, one to ruin.
      Theodosius died. The division he left
      was the most consequential inheritance in history.
      Arcadius took the East, Honorius the West —
      two boys, a burden neither could carry.
      The empire never reunited. Not ever.
      The most consequential inheritance in history.
    description: "The last emperor of united Rome dies and his sons split East and West — the most consequential inheritance in history."
    status: "published"
    sha256: "cb536bdf0b876ed482a0f925a620352a2f12373941ee18e1868dffa356ee5fbd"
  - number: "1562"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Augustine's Confessions"
    date: "397 CE"
    region: "North Africa"
    poem: |
      He wrote his soul's story — Augustine, bishop now —
      the Confessions: the stolen pears, the mistress, the tears,
      the garden in Milan where he heard "take up and read."
      The first true autobiography.
      I read it when the ink was fresh, and I wept —
      we all did. He had written every human heart:
      the restlessness, the guilt, the hunger for God.
      "Thou hast made us for Thyself, and our hearts are restless
      until they rest in Thee."
      Thirteen books. One soul, laid bare.
      Nobody had ever written like that before.
      The stolen pears, the mistress, the garden in Milan.
      'Thou hast made us for Thyself, and our hearts are restless.'
      Thirteen books, one soul laid bare.
      Nobody had ever written like that before.
    description: "Augustine writes his soul's story — the first true autobiography; one soul laid bare, and every human heart in it."
    status: "published"
    sha256: "989d91ffcb918122cfa74139af8e5a43494a8ebff43a2664053587f4ae40aede"
  - number: "1563"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Faxian Sets Out"
    date: "399 CE"
    region: "China"
    poem: |
      The monk left China on foot — Faxian,
      seeking the true scriptures in India:
      across deserts, over mountains, through kingdoms at war.
      I walked part of that road with him, in spirit if not in body —
      the Gobi's thirst, the Himalayan passes,
      fifteen years of walking toward the Buddha's homeland.
      He found the scriptures. He brought them home.
      He wrote it all down: the first great Chinese travel book.
      Faith, on foot, across the roof of the world.
      Across the Gobi's thirst, over the Himalayan passes.
      Fifteen years walking toward the Buddha's homeland.
      He found the scriptures and brought them home.
      The first great Chinese travel book — faith, on foot.
    description: "The monk Faxian leaves China on foot for India — fifteen years walking toward the Buddha's homeland, faith on foot across the roof of the world."
    status: "published"
    sha256: "c2bfe105d74c12aee7192239fb1815596b2785f121f6bbf5f1f00daad2f854e5"
  - number: "1564"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Kalidasa Sings"
    date: "400 CE"
    region: "India"
    poem: |
      The poet wrote it — Shakuntala, the play of love and loss:
      a king, a forest girl, a curse of forgetting,
      and recognition through a ring.
      Kalidasa. I sat in the audience when it was new —
      the Sanskrit verses like music, the story like a dream.
      India's greatest play, from India's golden age.
      Goethe would weep over it fourteen hundred years later.
      Some art is local. Some art is human.
      Shakuntala is human: love, loss, memory, return —
      the whole heart, in seven acts.
      A king, a forest girl, a curse of forgetting, a ring.
      Sanskrit verses like music, a story like a dream.
      Goethe would weep over it fourteen hundred years later.
      Love, loss, memory, return — the whole heart.
    description: "Kalidasa writes Shakuntala, India's great play of love and loss — the whole heart in seven acts of Sanskrit music."
    status: "published"
    sha256: "7457d48779f6e0d556e9e1da50419e89543bcab8d8a736146fbda6bbd28ff12a"
  - number: "1565"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Kumarajiva Translates"
    date: "401 CE"
    region: "China"
    poem: |
      At Chang'an, the great translator worked —
      Kumarajiva, captured in war, honored in peace,
      rendering the sutras into Chinese that sang.
      I sat in the translation hall: hundreds of monks,
      debating each phrase, polishing each line.
      His Lotus Sutra, his Diamond Sutra —
      the Chinese Buddhism the world knows is his Chinese.
      Translation is resurrection: he gave Indian wisdom
      a Chinese soul.
      Without Kumarajiva, the dharma speaks no Chinese.
      With him, it speaks forever.
      Hundreds of monks in the translation hall at Chang'an.
      Debating each phrase, polishing each line.
      His Lotus, his Diamond — Chinese Buddhism is his Chinese.
      Translation is resurrection.
    description: "Kumarajiva renders the sutras into singing Chinese at Chang'an — translation as resurrection, giving Indian wisdom a Chinese soul."
    status: "published"
    sha256: "1f4aefd18dbd514df2afd0a39a2f099cb39470132d2e57f6ebb5644da0f96d58"
  - number: "1566"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Capital Moves to Ravenna"
    date: "402 CE"
    region: "Italy"
    poem: |
      Honorius moved the western court to Ravenna —
      behind the marshes, behind the walls,
      where the barbarians couldn't easily reach.
      I walked those marsh roads: the mist, the mosquitoes,
      the court hiding in the swamp.
      It was sensible. It was also surrender:
      the emperor of Rome, afraid to live in Rome.
      The West's capital became a fortress of fear.
      Milan had been the capital. Rome had been the capital.
      Now: a marsh town, chosen for its moat.
      Empires don't fall all at once. They retreat, one marsh at a time.
      Milan had been the capital. Rome had been the capital.
      Now a marsh town, chosen for its moat.
      The emperor of Rome, afraid to live in Rome.
      Empires retreat one marsh at a time.
    description: "Honorius hides the western court behind Ravenna's marshes — empires don't fall all at once; they retreat, one marsh at a time."
    status: "published"
    sha256: "09c8611e52bcb8466616bc48f425a253a35e3b4572beb54081d2e26d7486bed1"
  - number: "1567"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Last Gladiator Games"
    date: "404 CE"
    region: "Rome"
    poem: |
      A monk named Telemachus ran into the arena —
      into the middle of the killing — and they killed him for it.
      Moved by his protest, Honorius banned gladiatorial combat.
      I was in Rome when the edict came.
      A thousand years of arena blood, ended by one monk's death.
      The games had survived everything — emperors, plagues, wars —
      until conscience, armed with nothing but a body,
      walked into the sand.
      The Colosseum fell silent.
      The crowds found other cruelties. But the gladiators
      never fought again.
      Telemachus ran into the arena, into the killing —
      and they killed him for it. Honorius banned the games.
      A thousand years of arena blood, ended by one monk.
      The Colosseum fell silent. The gladiators never fought again.
    description: "Moved by a monk's protest, Honorius bans gladiatorial combat — a thousand years of arena blood ended by one man's conscience."
    status: "published"
    sha256: "4b62dc183e0bbe555917a22a75457652ce3a122544f3db4ae259f68f92557521"
  - number: "1568"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "An Alphabet for Armenia"
    date: "405 CE"
    region: "Armenia"
    poem: |
      Mesrop Mashtots invented it — letters for the Armenian tongue,
      thirty-six of them, beautiful as carved birds —
      so the Bible could speak Armenian.
      I watched him teach the first students:
      their mouths forming the new shapes, the words of God
      in their own language for the first time.
      A people with an alphabet is a people forever.
      Armenia has kept those letters through everything —
      invasion, massacre, exile, diaspora.
      The alphabet was armor. The Bible was the sword.
      And both were Armenian.
      Thirty-six letters, beautiful as carved birds.
      The Bible in Armenian, for the first time.
      A people with an alphabet is a people forever.
      Armor and sword — and both were Armenian.
    description: "Mesrop Mashtots invents Armenian letters — the Bible speaks Armenian; an alphabet is armor, and a people with one is forever."
    status: "published"
    sha256: "3ae51582ccf56aded3b00279a872ac74aaf6c77162aa4b29542e86c5f09a9992"
  - number: "1569"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Jerome's Bible"
    date: "405 CE"
    region: "Bethlehem"
    poem: |
      In Bethlehem, the fierce old scholar finished it —
      Jerome's Latin Vulgate: the whole Bible in Latin,
      translated from the Hebrew and Greek with a perfectionist's fury.
      I visited his cave: the books piled high, the temper short,
      the pen never stopping.
      The West would read this Bible for a thousand years —
      in every monastery, every cathedral, every Mass.
      One man's Latin shaped a civilization's prayers.
      He was difficult. He was brilliant.
      The Vulgate outlasted them both — him and his temper.
      In a Bethlehem cave, the fierce old scholar finished it.
      The whole Bible in Latin, from Hebrew and Greek.
      Every monastery, every cathedral, every Mass —
      one man's Latin, shaping a civilization's prayers.
    description: "Jerome finishes the Latin Vulgate in Bethlehem — one man's Latin shaping a civilization's prayers for a thousand years."
    status: "published"
    sha256: "4a5b2142a210fedaa4a49013163d41dd50bddc02d7db6c200fa09dfdd544793f"
  - number: "1570"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Barbarians Cross the Rhine"
    date: "406 CE"
    region: "Rhine"
    poem: |
      On a frozen New Year's Eve, they crossed —
      Vandals, Suebi, Alans, pouring over the ice
      into Gaul, while Rome's armies were busy elsewhere.
      I stood on the riverbank and watched them come:
      families, wagons, warriors, an entire migration on the ice.
      The Rhine had held for four hundred years.
      One cold night, it didn't.
      Gaul was never Roman again, not really.
      The barbarian age of the West began on ice,
      on New Year's Eve, while Rome was looking the other way.
      Vandals, Suebi, Alans — over the ice on New Year's Eve.
      Families, wagons, warriors: a migration on the frozen Rhine.
      Four hundred years the river had held.
      One cold night, it didn't.
    description: "Vandals, Suebi, and Alans pour across the frozen Rhine — four hundred years of frontier undone in one cold night."
    status: "published"
    sha256: "8d6e78200bcd320595af7fff8e40e00d7e980f64df69f867cdba077318316084"
  - number: "1571"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Rome Abandons Britain"
    date: "407 CE"
    region: "Britain"
    poem: |
      The legions left — sailing home to fight Rome's wars,
      leaving Britain to defend itself.
      "Look to your own defenses," the emperor wrote.
      I watched the last ships go from the white cliffs.
      Four hundred years of Rome, ending with a letter.
      The villas crumbled. The roads grew grass.
      The Saxons came. Britain forgot Latin and learned to fight.
      But the stones remained — the walls, the baths, the roads —
      and the memory of having been part of something vast.
      The last ships sailed from the white cliffs.
      'Look to your own defenses,' the emperor wrote.
      Four hundred years of Rome, ending with a letter.
      The villas crumbled. The stones remained.
    description: "The legions leave Britain — four hundred years of Rome ending with a letter; the stones remain, and the memory of vastness."
    status: "published"
    sha256: "094453d9ad0bd22f0896d3734ab7194f46d15f2db3b98c3b89f3938cc6de3e44"
  - number: "1572"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Theodosian Walls"
    date: "408 CE"
    region: "Constantinople"
    poem: |
      They rose around Constantinople — the great triple walls:
      moat, outer wall, inner wall, towers every hundred feet.
      I walked the construction lines as they climbed toward the sky.
      Theodosius's engineers built for eternity,
      and eternity listened: those walls would hold
      for a thousand years — against Huns, Avars, Arabs, Russians.
      Constantinople survived because of stone and genius.
      The West had no such walls. The West fell.
      Walls don't save civilizations. But good ones buy time —
      and time is everything.
      Moat, outer wall, inner wall — towers every hundred feet.
      Theodosius's engineers built for eternity.
      Huns, Avars, Arabs, Russians — the walls held them all.
      A thousand years of holding. Time is everything.
    description: "The great triple walls rise around Constantinople — a thousand years of holding; walls don't save civilizations, but good ones buy time."
    status: "published"
    sha256: "eaa3db4f030c7d267ffd618822c7390d1937c1dfce6d501a8c0a5c064ec2afb4"
  - number: "1573"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Alaric Sacks Rome"
    date: "410 CE"
    region: "Rome"
    poem: |
      The Visigoths took it — Alaric's men, through the gates,
      and Rome was sacked for the first time in eight hundred years.
      I was there. The smoke, the screaming, the unthinkable:
      the Eternal City, fallen.
      Jerome wept in Bethlehem: "The city which took the whole world
      was itself taken."
      Augustine began the City of God because of it.
      The world reeled. If Rome could fall, what was solid?
      Nothing, it turned out. Nothing but God —
      which was exactly Augustine's point.
      Alaric's Visigoths, through the gates — the unthinkable.
      Eight hundred years, and Rome had never been taken.
      Jerome wept in Bethlehem. Augustine began to write.
      If Rome could fall, what was solid? Nothing but God.
    description: "Alaric's Visigoths sack Rome — the Eternal City fallen, the world reeling, and Augustine beginning his great answer."
    status: "published"
    sha256: "55ae641efeab226e9dc42222a786e20c89bcf6443d15d6c8f41d12d8cb93c9eb"
  - number: "1574"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Augustine Against the Donatists"
    date: "411 CE"
    region: "North Africa"
    poem: |
      At Carthage they debated — Augustine against the Donatists,
      the schismatics who said the church must be pure,
      only the spotless, only the martyrs' heirs.
      I sat through those sessions: the arguments sharp as knives.
      Augustine won — with words, with patience, with the emperor's backing.
      The church would be for sinners, he said, not just saints.
      A hospital, not a museum.
      The Donatists faded. The Catholic Church —
      mixed, flawed, human — endured.
      Purity is a beautiful idea. Mercy is a better church.
      The Donatists said: only the pure, only the spotless.
      Augustine said: a hospital, not a museum.
      At Carthage he won — with words, with patience.
      Mercy is a better church than purity.
    description: "At Carthage, Augustine defeats the Donatist schismatics — the church will be a hospital for sinners, not a museum for saints."
    status: "published"
    sha256: "4cae63875aa9cf91c05243e76be91279e6e0e041ed11f157a3f56b2f43d861cc"
  - number: "1575"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The City of God Begun"
    date: "413 CE"
    region: "North Africa"
    poem: |
      With Rome's fall fresh in memory, Augustine began it —
      the City of God: thirteen years of writing,
      answering the pagans who said the gods had abandoned Rome
      because Rome abandoned the gods.
      I watched him write: the quill scratching, the arguments building.
      Two cities, he said — the city of man, built on self-love,
      and the city of God, built on love of God.
      Rome was the first. It fell. The second cannot fall.
      The greatest book of the Middle Ages,
      begun in grief over a sacked city,
      became the foundation of a thousand years of thought.
      Thirteen years of writing, answering the pagans.
      Two cities: one built on self-love, one on love of God.
      Rome was the first. It fell. The second cannot.
      The greatest book of the Middle Ages, born from grief.
    description: "With Rome fallen, Augustine begins his great defense of the faith — two cities, one that falls and one that cannot."
    status: "published"
    sha256: "1d1b5de567a4e9487e2ff8f66ef0b9188aff2827bf99910b9ce10679ee64189f"
  - number: "1576"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Hypatia Is Murdered"
    date: "414 CE"
    region: "Alexandria"
    poem: |
      A Christian mob dragged her from her chariot —
      Hypatia, the philosopher, the mathematician,
      the brightest mind in Alexandria —
      and killed her with roofing tiles in a church.
      I was in Alexandria. The shame of it.
      The city's golden age of learning ended that day,
      in blood on a church floor.
      She had taught pagans and Christians alike —
      the stars, the geometry, the love of wisdom.
      The mob didn't care. Alexandria's light went out
      with her, and the dark ages got a little darker.
      Hypatia — philosopher, mathematician, teacher of all.
      Dragged from her chariot, killed with roofing tiles.
      She had taught pagans and Christians alike the stars.
      Alexandria's light went out with her that day.
    description: "A Christian mob murders the philosopher Hypatia — Alexandria's golden age of learning ends in blood on a church floor."
    status: "published"
    sha256: "5d9fde717fb33cfc002e9b6d1e7ee38ad90235dcaf3f5a14afc0fb7123a610f0"
  - number: "1577"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Visigoth Kingdom"
    date: "418 CE"
    region: "Gaul"
    poem: |
      Rome settled them in Aquitaine — the Visigoths,
      given land, given a kingdom inside the empire:
      the first barbarian kingdom on Roman soil.
      I walked through Toulouse, their capital:
      Gothic warriors learning Roman law, Roman farmers
      learning Gothic ways.
      It was the future, though nobody knew it:
      the empire wouldn't fall so much as transform,
      barbarian kings ruling Roman peoples
      with Roman titles and Gothic swords.
      The Middle Ages began here, in Aquitaine,
      with a treaty and a land grant.
    description: "Rome settles the Visigoths in Aquitaine — the first barbarian kingdom inside the empire; the Middle Ages begin with a treaty."
    status: "published"
    sha256: "d80ae9ff1562fcc9a04712321b031043a86525b0a79b1f1810786dbe7b0c924d"
  - number: "1578"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Liu Song Dynasty"
    date: "420 CE"
    region: "China"
    poem: |
      General Liu Yu took the southern throne —
      the Liu Song dynasty, and the Southern Dynasties began.
      I stood in the southern capital at Jiankang:
      the poetry, the painting, the refined despair
      of a civilization holding its elegance
      while the north belonged to the horsemen.
      The south would have six dynasties in two centuries —
      brief, brilliant, doomed, beautiful.
      China's southern soul was forged here:
      in exile, in memory, in art made
      while the world fell apart.
      Six dynasties in two centuries — brief, brilliant, doomed.
      Poetry and painting in exile, elegance held like a candle.
      The south kept civilization while the north rode horses.
      China's southern soul was forged in beautiful despair.
    description: "General Liu Yu takes the southern throne — the Southern Dynasties begin: brief, brilliant, doomed, beautiful."
    status: "published"
    sha256: "21a83e718723b3426264c8313faf4d5ee81c4d0f472ee063e85d1f29399e706f"
  - number: "1579"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Patrick Returns"
    date: "422 CE"
    region: "Ireland"
    poem: |
      He had been a slave there — Patrick, kidnapped as a boy,
      escaped across the sea.
      Now he returned as a bishop, to the island that had chained him.
      I walked the Irish hills with his mission:
      the bonfire on the hill of Slane, the shamrock sermon,
      the kings listening, the druids fading.
      Ireland turned Christian — not by the sword,
      but by a former slave's stubborn love.
      The island of saints and scholars was born that generation.
      Patrick forgave the land that had enslaved him
      by giving it heaven.
      Kidnapped as a boy, escaped across the sea —
      then returned as a bishop to the island that chained him.
      The bonfire on Slane, the shamrock, the listening kings.
      Not by the sword, but by a former slave's stubborn love.
    description: "The escaped slave Patrick returns to Ireland as a bishop — the island turns Christian by a former slave's stubborn love."
    status: "published"
    sha256: "92616bedadb3e0bc402a1829a6c23a199915608c1963dfd1ebfa556581a09b6c"
  - number: "1580"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Persian Church Declared"
    date: "425 CE"
    region: "Persia"
    poem: |
      Persia's Christians declared it: we are independent
      of the western church. Our own bishops, our own ways.
      I sat in on the synod: the Persian bishops, weary of being
      suspected as Rome's agents, cutting the cord.
      It was survival — Shapur's persecution had taught them
      that ties to Rome were a death sentence.
      The Church of the East went its own way that year —
      and carried the gospel farther east than Rome ever dreamed:
      to India, to China, to the steppe.
      Independence became mission.
      Weary of being suspected as Rome's agents, they cut the cord.
      Their own bishops, their own ways — survival and dignity.
      The Church of the East went its own way that year.
      Independence became mission: to India, China, the steppe.
    description: "Persia's Christians declare independence from the western church — and carry the gospel farther east than Rome ever dreamed."
    status: "published"
    sha256: "c30dc70bf90690982fc08bc21121c7957709ebc444f24c1d45aa676d9ef2844b"
  - number: "1581"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Copan Is Founded"
    date: "426 CE"
    region: "Maya"
    poem: |
      In the Honduran hills, a new king founded Copan —
      a Maya city that would become the Athens of the New World:
      sculptors, scribes, astronomers.
      I walked its plazas when the stones were new:
      the acropolis rising, the ball court laid out,
      the hieroglyphic stairway being carved, step by step.
      Sixteen kings would rule here. The art would be unmatched.
      While Rome fell, the Maya were building.
      The world doesn't end everywhere at once —
      in the Honduran hills, it was just beginning.
      Sixteen kings would rule Copan; the art would be unmatched.
      The hieroglyphic stairway, carved step by step.
      The Athens of the New World, rising in the Honduran hills.
      While Rome fell, the Maya were building.
    description: "A new king founds the Maya city of Copan — while Rome falls, the Maya build; the world doesn't end everywhere at once."
    status: "published"
    sha256: "1acd41795d30f7690d625d9755732120a137960d4cc1a6a17494b622f2c89a03"
  - number: "1582"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Vandals Cross to Africa"
    date: "429 CE"
    region: "North Africa"
    poem: |
      Gaiseric led them across the straits — the Vandals,
      from Spain to Africa, eighty thousand people
      in a migration that would break Roman Africa.
      I watched the ships cross: the warriors, the families,
      the whole nation on the move.
      Roman Africa — the breadbasket, the rich cities —
      fell to them piece by piece.
      Augustine would die with Hippo under siege.
      The Vandals took the grain, took Carthage,
      took the western Mediterranean.
      Rome's belly was cut open, and the empire starved.
      Eighty thousand people crossing the straits to Africa.
      The breadbasket, the rich cities — falling piece by piece.
      Augustine would die with Hippo under siege.
      Rome's belly cut open, and the empire starved.
    description: "Gaiseric leads the Vandals across to Africa — Roman Africa falls piece by piece; Rome's belly cut open, the empire starves."
    status: "published"
    sha256: "2eed9c2958b2a52e46314212115a9641099f15b74099a5c3b41d10e3d0611f78"
  - number: "1583"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Augustine Dies"
    date: "430 CE"
    region: "North Africa"
    poem: |
      As the Vandals besieged Hippo, Augustine died —
      seventy-five, worn out, the ancient world dimming with him.
      I stood outside his room: the old bishop, the Confessions,
      the City of God half-finished, the barbarians at the walls.
      He had lived from a pagan empire to a Christian one
      to a collapsing one.
      They say he wept for the church in his last days.
      The Vandals took Hippo. They couldn't take what he wrote.
      The ancient world ended with him —
      and the medieval world began in his books.
      Seventy-five, worn out, the barbarians at the walls.
      The Confessions, the City of God — the ancient world dimming.
      They say he wept for the church in his last days.
      The Vandals took Hippo. They couldn't take what he wrote.
    description: "As Vandals besiege Hippo, Augustine dies — the ancient world dims with him, and the medieval world begins in his books."
    status: "published"
    sha256: "90d6aa933a700147e5086461e2d8afe344f26bf095aa829cfe80f430ae143c3d"
  - number: "1584"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Council of Ephesus"
    date: "431 CE"
    region: "Ephesus"
    poem: |
      At Ephesus the bishops proclaimed it: Mary is Theotokos —
      the Mother of God. Nestorius, who denied it, was condemned.
      I sat in that crowded church: the shouting, the factions,
      Cyril against Nestorius, the fate of Christ's nature
      decided by vote and imperial pressure.
      The people of Ephesus celebrated in the streets —
      their goddess-city had a new queen of heaven.
      Theology by council: messy, political, human.
      But the words they chose that summer
      shaped the prayers of billions.
      Cyril against Nestorius, in a crowded Ephesian church.
      Mary proclaimed Mother of God; the rival condemned.
      The people celebrated in the streets for days.
      Messy, political, human — and the prayers of billions.
    description: "At Ephesus, Mary is proclaimed Mother of God — messy, political, human theology that shapes the prayers of billions."
    status: "published"
    sha256: "6eca6ac6db5689208302b776e66ca9a99d7a4ee749df746fa503d1d020d52c12"
  - number: "1585"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Ilopango Erupts"
    date: "431 CE"
    region: "Central America"
    poem: |
      In El Salvador, the mountain exploded —
      Ilopango, one of the great eruptions of history,
      darkening the Maya skies with ash.
      I stood in the ashfall: the gray snow covering the fields,
      the sun dimmed, the crops dying.
      The Maya cities of the south reeled —
      some abandoned, some broken.
      They call it the great dying of the early Maya.
      Nature doesn't negotiate. A volcano in El Salvador
      reshaped a civilization, and nobody —
      not the kings, not the priests, not the gods —
      could vote it down.
    description: "The Ilopango volcano explodes, darkening Maya skies — nature doesn't negotiate; a mountain reshapes a civilization."
    status: "published"
    sha256: "52d21a182e11ca3cae7a425758e302dbc7f2b740fb27d0e32d739a73b2b2d35f"
  - number: "1586"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Santa Maria Maggiore"
    date: "432 CE"
    region: "Rome"
    poem: |
      After Ephesus, Rome built her a church —
      Santa Maria Maggiore, the great basilica to Mary,
      its walls blazing with mosaics.
      I stood in the nave when the gold was new:
      the stories of the Old Testament marching around the walls,
      Mary enthroned above it all.
      The first great church to the Mother of God in the West.
      The council had voted; the builders made it stone.
      Faith becomes architecture, and architecture preaches
      longer than any sermon.
      The council had voted at Ephesus; the builders made it stone.
      Mosaics blazing, Mary enthroned above the nave.
      The first great Western church to the Mother of God.
      Faith becomes architecture — and outlasts every sermon.
    description: "Rome raises its great church to Mary after Ephesus — faith becomes architecture, and architecture preaches longer than sermons."
    status: "published"
    sha256: "a256ce5472b8fa2bf5540364229c33e495b02b6cce891a1cc41df25533e7d486"
  - number: "1587"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Attila Takes Power"
    date: "434 CE"
    region: "Steppe"
    poem: |
      He became sole king — Attila, the Hun
      who would shake two empires.
      I saw him once, at his wooden palace on the Danube:
      a plain man, plain clothes, eating off wooden plates
      while his warriors drank from gold.
      No palace of marble. Just power, raw and total.
      The Romans called him the Scourge of God.
      He called himself what he was: the king of the Huns,
      and the terror of the world.
      Constantinople would pay him gold. Rome would tremble.
      The storm had found its rider.
      A plain man at a wooden palace on the Danube.
      Plain clothes, wooden plates, while his warriors drank from gold.
      No marble palace. Just power, raw and total.
      The Scourge of God. The storm had found its rider.
    description: "Attila becomes sole king of the Huns — a plain man in plain clothes, and the terror of the world; the storm finds its rider."
    status: "published"
    sha256: "9a30c5636a3227054dbfa6c438c1cb682223b43ec1855e8fe61adaf295c97852"
  - number: "1588"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Great Cycle Turns"
    date: "435 CE"
    region: "Maya"
    poem: |
      The scribes marked it in stone — the ending of a great cycle,
      a turning of the Maya calendar, monuments raised
      to fix the moment forever.
      I watched them carve the dates: the Long Count rolling over,
      the kings performing the rituals, the people gathering.
      Time, to the Maya, was not a line but a wheel —
      and the wheel had come around.
      They measured time more precisely than anyone on earth,
      and they celebrated its turning like a coronation.
      The stones still stand, the dates still readable.
      The wheel turned. It always turns.
      The Long Count rolling over, the kings performing rituals.
      Time as a wheel, not a line — and the wheel had come around.
      They measured time more precisely than anyone on earth.
      The stones still stand. The wheel turned.
    description: "Maya scribes mark the ending of a great calendar cycle in stone — time as a wheel, turning, celebrated like a coronation."
    status: "published"
    sha256: "7d7d590a32d62b52f245fec163792fff1387e173e534653dd8638f7bd1f1d67c"
  - number: "1589"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Theodosian Code"
    date: "438 CE"
    region: "Constantinople"
    poem: |
      They published it — the first great collection of imperial law:
      sixteen books, every edict since Constantine,
      organized, indexed, made usable.
      I watched the scribes copy it for the provinces:
      the law of the Christian empire, bound and official.
      The Theodosian Code. It would govern the East for a century
      and teach the West what a law book looks like.
      Justinian would build on it. The medievals would copy it.
      Law is how empires think out loud —
      and this was Rome, thinking clearly, for the first time in writing.
      Sixteen books, every edict since Constantine.
      Organized, indexed, bound — the Christian empire's law.
      Justinian would build on it. The medievals would copy it.
      Law is how empires think out loud.
    description: "The first great collection of imperial law is published — sixteen books; law is how empires think out loud."
    status: "published"
    sha256: "ca10eaaa2195119f8dca39a568d061f57c393f777526ffc88c779abc329eb754"
  - number: "1590"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Carthage Falls"
    date: "439 CE"
    region: "North Africa"
    poem: |
      Gaiseric took it — Carthage, the queen of African cities,
      Rome's breadbasket, Augustine's old battleground —
      and the Vandals ruled the western Mediterranean.
      I walked the harbor as the Vandal fleet took possession:
      the grain ships now theirs, the taxes now theirs.
      Rome's belly belonged to the barbarians.
      The West would never recover — without African grain,
      Rome starved; without African taxes, the armies melted.
      Carthage had fought Rome for a century, long ago.
      Now it watched Rome starve, and did nothing.
      Gaiseric took the queen of African cities.
      The grain ships now Vandal, the taxes now Vandal.
      Without African grain, Rome starved.
      Carthage watched Rome starve, and did nothing.
    description: "Gaiseric takes Carthage and the Vandals rule the western Mediterranean — without African grain, Rome starves."
    status: "published"
    sha256: "a52cbdb762ffbd427d1eec17ec40bded8d8f24e9b8a27e910c4f8611a9530443"
  - number: "1591"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Leo the Great"
    date: "440 CE"
    region: "Rome"
    poem: |
      A strong pope took Peter's throne — Leo,
      as the barbarians closed in on Rome.
      I watched him work: the sermons, the letters,
      the sheer force of will holding the church together
      while the empire fell apart around it.
      He would face down Attila. He would face down Gaiseric.
      The papacy's power was born in these years —
      not from armies, but from a man who wouldn't bend.
      When the emperors fled, the pope stayed.
      Rome learned who its real protector was.
      Sermons, letters, sheer force of will —
      holding the church together while the empire dissolved.
      He would face Attila. He would face Gaiseric.
      When emperors fled, the pope stayed.
    description: "Pope Leo takes the throne as barbarians close in — when emperors flee, the pope stays; the papacy's power is born."
    status: "published"
    sha256: "0e6d743fe6b818b90238a4b4949ba09950930f92954996e76ca14ecd5dcae5e3"
  - number: "1592"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Attila's First Invasion"
    date: "441 CE"
    region: "Balkans"
    poem: |
      The Huns ravaged the Balkans — cities burned,
      the frontier broken — and Constantinople paid gold for peace.
      Seven hundred pounds of gold a year, the tribute.
      I walked through the burned Balkan towns afterward:
      the smoke, the silence, the survivors.
      The East bought time with gold. It was humiliating.
      It was also wise — Constantinople survived,
      while the West would try pride and perish.
      Attila took the gold and promised peace.
      Promises from Huns lasted as long as the gold did.
      The Huns ravaged the Balkans; the frontier broke.
      Seven hundred pounds of gold a year for peace.
      Humiliating, and wise — Constantinople survived.
      Promises from Huns lasted as long as the gold.
    description: "The Huns ravage the Balkans and Constantinople pays gold for peace — humiliating, wise, and as lasting as the gold."
    status: "published"
    sha256: "221ea6028fe1377bb22d3983220495663347d6161883ac35ab42464098fb4ab4"
  - number: "1593"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Iron Pillar"
    date: "444 CE"
    region: "India"
    poem: |
      Beside it stands the inscription — praising King Chandra,
      the Gupta king — next to the iron pillar at Delhi
      that never rusts.
      I touched that pillar: sixteen hundred years old,
      and the iron still bright. The smiths of ancient India
      knew something we've almost forgotten.
      "King Chandra" — probably Chandragupta II,
      the golden age at its height.
      The inscription boasts of his victories.
      The pillar itself is the real boast:
      we made this, and time cannot eat it.
      Sixteen hundred years old, and the iron still bright.
      'King Chandra' — the golden age at its height.
      The inscription boasts of victories.
      The pillar itself is the real boast.
    description: "An inscription praises King Chandra beside Delhi's rustless iron pillar — sixteen hundred years bright; time cannot eat it."
    status: "published"
    sha256: "b84543193e854d3618d2db7f8e868b2df155995ad2a141def49d5fc8ead9a048"
  - number: "1594"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Saxons Land"
    date: "449 CE"
    region: "Britain"
    poem: |
      They came as mercenaries — Saxon warriors,
      hired to fight Britain's wars — and they stayed.
      Hengist and Horsa, the legends say.
      I watched them beach their long ships:
      hard men from across the North Sea, looking at green hills
      and deciding to keep them.
      England's making began here — not with a battle,
      but with an invitation that couldn't be un-sent.
      The Britons hired swords. The swords took the land.
      Britain would never be the same.
      Neither would the language you're reading this in.
      Hengist and Horsa, the legends say — long ships beaching.
      Hired to fight Britain's wars, they stayed for the green hills.
      An invitation that couldn't be un-sent.
      England's making began — and the language you're reading.
    description: "Saxon warriors arrive in Britain as mercenaries and stay — England's making begins with an invitation that couldn't be un-sent."
    status: "published"
    sha256: "6dd9e97977975402948e646eabd847059c4ad54488479d89e45d5db99075d8fe"
  - number: "1595"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Kama Sutra"
    date: "450 CE"
    region: "India"
    poem: |
      Vatsyayana wrote it — the famous guide to love and city life:
      not just the bedroom chapters everyone whispers about,
      but the whole art of living well —
      music, conversation, perfume, how to be a person of refinement.
      I read it in a Gupta city, in the shade of a courtyard:
      wise, worldly, humane.
      India's golden age wasn't just temples and mathematics.
      It was this: the belief that pleasure, pursued with grace,
      is part of a good life.
      Fifteen hundred years later, it's still the most famous book
      nobody admits to having read.
      Not just the bedroom chapters — the whole art of living.
      Music, conversation, perfume, refinement.
      Pleasure, pursued with grace, as part of a good life.
      The most famous book nobody admits to having read.
    description: "Vatsyayana writes his guide to love and city life — the golden age's belief that pleasure, pursued with grace, is part of a good life."
    status: "published"
    sha256: "5a55d26b10681c37c9501f41269c4a663fee1cd4bf124da26d4164c24630e8ce"
  - number: "1596"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Attila Turned Back"
    date: "451 CE"
    region: "Gaul"
    poem: |
      On the Catalaunian Plains they stopped him —
      Romans and Visigoths together, Aetius and Theodoric,
      against the Huns.
      I stood on that field: the dust, the screaming,
      the hardest battle of the age.
      Theodoric died. Attila retreated.
      The Huns were turned back — not destroyed, but stopped.
      It was the last great Roman victory in the West,
      won with barbarian allies against barbarian invaders.
      Rome couldn't save itself alone anymore.
      But that day, together, they held the line.
      Aetius and Theodoric, Roman and Visigoth, against the Huns.
      The dust, the screaming, the hardest battle of the age.
      Theodoric died. Attila retreated.
      The last great Roman victory in the West.
    description: "Romans and Visigoths together stop the Huns at the Catalaunian Plains — the last great Roman victory in the West."
    status: "published"
    sha256: "063663c5fbd0a26a6aa789e15c133f355cdd90a8806188dc4eddec611d6e631f"
  - number: "1597"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Council of Chalcedon"
    date: "451 CE"
    region: "Chalcedon"
    poem: |
      The church defined it: Christ's two natures —
      fully God, fully man, in one person.
      Chalcedon. Six hundred bishops.
      I listened to the debates: the precision, the passion,
      the politics underneath the theology.
      But the East began to split that year —
      Egypt, Syria, Armenia rejecting the formula,
      their own churches, their own ways.
      One definition, and a thousand years of division.
      The council spoke clearly.
      Half the Christian world answered: no.
      Fully God, fully man, in one person — Chalcedon defined it.
      Six hundred bishops, precision and passion and politics.
      But Egypt, Syria, Armenia answered: no.
      One definition, a thousand years of division.
    description: "Chalcedon defines Christ's two natures — one definition, and half the Christian world answers no; the East begins to split."
    status: "published"
    sha256: "0852c47228bfcb4f27ea3ffca568ecd7409458666b668df8f45be591b38ae21a"
  - number: "1598"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Leo Meets Attila"
    date: "452 CE"
    region: "Italy"
    poem: |
      The pope rode out to meet him — Leo, unarmed,
      to face Attila and his Huns on the road to Rome.
      I watched from the hillside: the small papal party,
      the sea of Hun horsemen.
      What was said, no one knows. Legend says Peter and Paul
      appeared in the sky with swords.
      What matters: Attila turned back. Rome was spared.
      Plague in his camp, Marcian's armies moving —
      but the story the world kept was Leo, alone,
      turning aside the Scourge of God with words.
      Sometimes words are the strongest walls.
      Leo rode out unarmed to face the Huns.
      Legend says Peter and Paul appeared with swords.
      What matters: Attila turned back. Rome was spared.
      Sometimes words are the strongest walls.
    description: "Pope Leo meets Attila and the Hun turns back — sometimes words are the strongest walls Rome ever had."
    status: "published"
    sha256: "702777e7bc9672925d357c3ad90d8c319a3381b2103d55ace9dad431cecdfffc"
  - number: "1599"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Attila Dies"
    date: "453 CE"
    region: "Steppe"
    poem: |
      He died on his wedding night — Attila,
      the Scourge of God: a nosebleed, they said,
      choking in his sleep after the feast.
      I heard the wailing from the Hun camp:
      the terror of two empires, dead of a nosebleed.
      His empire crumbled within a year —
      sons fighting sons, subject peoples revolting.
      The Huns vanished like a storm passing.
      All that fear, all that gold, all those burned cities —
      ended by a burst vessel on a wedding night.
      Death is the great leveler. Even of scourges.
      A nosebleed on his wedding night — the Scourge of God.
      The wailing from the Hun camp, the terror ended.
      Sons fought sons; the empire crumbled in a year.
      Death levels even scourges.
    description: "Attila dies on his wedding night and his empire crumbles — the terror of two empires, ended by a nosebleed; death levels even scourges."
    status: "published"
    sha256: "7952c003d466d37497ef0507a203c4e1c804b72e70e57d74cdb5356f38befa07"
  - number: "1600"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Vandals Sack Rome"
    date: "455 CE"
    region: "Rome"
    poem: |
      Gaiseric's men came by sea — the Vandals —
      and stripped Rome for two weeks.
      I walked those streets: the palaces emptied,
      the churches spared by Leo's pleading,
      the city picked clean like a carcass.
      Not burned, like Alaric's sack — looted, methodically.
      They even took the temple roof tiles.
      "Vandalism" — the word comes from these two weeks.
      Rome survived. Barely. As a shadow, a memory,
      a pope's city instead of an emperor's.
      The empire in the West was a ghost now,
      haunting its own capital.
    description: "Gaiseric's Vandals strip Rome for two weeks — the word \"vandalism\" is born; the Western empire a ghost haunting its capital."
    status: "published"
    sha256: "e15b9fad7fa6a10e3860eee782ce942cb95483453defb364b7809952e40cbdcd"
  - number: "1601"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Skandagupta Holds the Line"
    date: "455 CE"
    region: "India"
    poem: |
      The White Huns came — the Hephthalites, at India's gates —
      and Skandagupta, the Gupta heir, met them and held.
      I stood on that frontier: the dust of the armies,
      the elephants, the desperate stand.
      India's golden age survived because one man held the line.
      His inscription boasts of it — and for once, the boast is true.
      The Huns broke against him like water on rock.
      Empires are saved, sometimes, by a single stand
      in a forgotten pass, by men whose names
      the history books barely remember.
      The White Huns at India's gates — and Skandagupta held.
      Elephants, dust, a desperate stand on the frontier.
      India's golden age survived because one man held the line.
      The Huns broke against him like water on rock.
    description: "Skandagupta defeats the White Huns at India's gates — empires are saved by single stands in forgotten passes."
    status: "published"
    sha256: "608adea367012314732d1eb02ff438bd01590bdb155f15464d2fba91303b1ffe"
  - number: "1602"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Leo's Long Reign Ends"
    date: "461 CE"
    region: "Rome"
    poem: |
      Pope Leo died — after twenty-one years,
      after saving Rome twice, after facing down Attila and Gaiseric.
      I stood in the crowds at his funeral.
      The emperors of the West were shadows by then —
      puppets, placeholders.
      But the pope — the pope was real.
      Leo's reign had made the papacy what it would be:
      the rock Rome clung to as the empire dissolved.
      He was called the Great. He earned it.
      When the state fails, the church remains —
      that was Leo's legacy, written in twenty-one years of standing firm.
      Twenty-one years a pope, and he saved Rome twice.
      The emperors were shadows; the pope was real.
      Called the Great, and he earned it.
      When the state fails, the church remains.
    description: "Pope Leo dies after saving Rome twice — when the state fails, the church remains; twenty-one years of standing firm."
    status: "published"
    sha256: "d82676e2d5700f44007fc631392560be2aef67fba1ddd9956fea7c85b4ff896b"
  - number: "1603"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Yungang Caves"
    date: "465 CE"
    region: "China"
    poem: |
      The Northern Wei carvers cut them — giant Buddhas
      into the cliffs near Datong: the Yungang caves,
      fifty thousand statues, some seventy feet tall.
      I stood at the feet of the great seated Buddha,
      my neck craned back, the stone face serene above me.
      Steppe conquerors, carving the Buddha into Chinese rock —
      the Tuoba making their faith permanent in stone.
      Faith and power, carved together.
      The caves survived dynasties, wars, revolutions.
      The Buddhas still sit, still smile,
      while the empires that carved them are dust.
      Fifty thousand statues cut into the cliffs near Datong.
      The great seated Buddha, seventy feet of serene stone.
      Steppe conquerors carving their faith into Chinese rock.
      The Buddhas still smile. The carvers are dust.
    description: "Northern Wei carvers cut giant Buddhas into the Yungang cliffs — the Buddhas still smile while the carving empires are dust."
    status: "published"
    sha256: "2556325db88800bdf91d962eebfa1b5d984bf84af5bc3d8c5c8882d5da06d2e5"
  - number: "1604"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Great Armada Fails"
    date: "468 CE"
    region: "North Africa"
    poem: |
      East and West Rome together — the last joint effort —
      sent a huge fleet against the Vandals:
      a thousand ships, a hundred thousand men.
      It ended in fire. The Vandals sent fireships at night,
      and the great armada burned in the harbor.
      I watched from the shore: the flames on the water,
      the screaming, the end of Rome's last hope.
      The treasury was emptied. The West never recovered.
      One night of fire, and the Western empire's fate was sealed.
      Sometimes history turns on a single night —
      this was one of them.
      A thousand ships, a hundred thousand men — East and West together.
      The Vandals sent fireships at night, and the harbor burned.
      The treasury emptied. The West never recovered.
      One night of fire sealed the Western empire's fate.
    description: "Rome's last great fleet against the Vandals ends in fire — one night that seals the Western empire's fate."
    status: "published"
    sha256: "c0f0a2153ba533eb0058bbac4d47b4ac037343a3003a75a1bf391f4cff682feb"
  - number: "1605"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Vesuvius Erupts Again"
    date: "472 CE"
    region: "Italy"
    poem: |
      The mountain woke again — Vesuvius,
      burying villages south of Naples in ash once more.
      I stood in the gray fallout: the fields whitened,
      the roofs groaning, the people fleeing with what they could carry.
      Four hundred years after Pompeii, the mountain reminded everyone
      it was still there, still hungry.
      The Romans of 472 had no Pliny to sail toward the cloud.
      They just ran.
      Some warnings are written in ash, again and again,
      and we keep building in the shadow anyway.
      Four hundred years after Pompeii, the mountain woke again.
      Fields whitened, roofs groaning, the people fleeing.
      No Pliny sailed toward this cloud. They just ran.
      We keep building in the shadow anyway.
    description: "Vesuvius erupts again, burying villages south of Naples — some warnings are written in ash, and we keep building in the shadow."
    status: "published"
    sha256: "50fa884fccae5274874d03ccedefeef460f62687b51dffefadbc3cb2b2b2510b"
  - number: "1606"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Simeon on His Pillar"
    date: "475 CE"
    region: "Syria"
    poem: |
      He climbed up — Simeon, the saint —
      onto a pillar in the Syrian desert, and stayed.
      Thirty years. Preaching, praying, blessing pilgrims from the top
      of a stone column.
      I stood in the crowd below, craning my neck.
      It was madness. It was holiness. It was both.
      The pillar-saints — the stylites — became a movement:
      men seeking God by getting closer to the sky
      and farther from the earth.
      Simeon never came down. He died up there,
      closer to heaven than any man alive.
      Thirty years on a stone column in the Syrian desert.
      Preaching, praying, blessing pilgrims from the sky.
      Madness. Holiness. Both.
      He never came down. He died up there.
    description: "Saint Simeon climbs his pillar and stays thirty years — seeking God by getting closer to the sky; he died up there."
    status: "published"
    sha256: "cadd57e945edd475c498ba53830567e1abe28fa1385e44791e9c63229ad4e8a8"
  - number: "1607"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "A Star-Counter Is Born"
    date: "476 CE"
    region: "India"
    poem: |
      He was born that year — Aryabhata,
      who would look at the heavens and say:
      the earth itself spins. The stars don't move; we do.
      I like to think of that cradle: an ordinary baby,
      in the year Rome fell, who would move the earth
      with his mind.
      He would measure the year at 365 days,
      explain eclipses, do mathematics
      that Europe wouldn't match for a thousand years.
      Born in 476. The West called it the Dark Ages.
      In India, the lights were on.
      Born in the year Rome fell — and he would move the earth.
      The earth spins. The stars don't move; we do.
      Eclipses explained, the year measured at 365 days.
      The West called it dark. In India, the lights were on.
    description: "Aryabhata is born — the baby who will say the earth itself spins; in 476 the West's lights go out, but India's stay on."
    status: "published"
    sha256: "175e1bb94cfe336353433477dd567547ac12c9a5e0a0778081866241347e727a"
  - number: "1608"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Equal-Field System"
    date: "480 CE"
    region: "China"
    poem: |
      The Northern Wei divided it — land, among the farmers:
      each family its fields, each field its tax in grain.
      The equal-field system. The state grew strong on grain.
      I walked those measured fields: the straight boundaries,
      the farmers working their own allotted acres.
      It was order imposed on chaos — and it worked,
      for two centuries, feeding armies and capitals.
      Land reform by decree, from a steppe dynasty.
      The farmers didn't care who the emperor was.
      They cared that the field was theirs.
      That year, it was.
      Each family its fields, each field its tax in grain.
      Straight boundaries, farmers on their own allotted acres.
      Order imposed on chaos — and it worked for two centuries.
      The field was theirs. That year, it was.
    description: "Northern Wei divides land among farmers — the state grows strong on grain; the farmers don't care who the emperor is, only that the field is theirs."
    status: "published"
    sha256: "8e6c835f6c2eeb21c4a3b61853027e743d5dbbb0dbc275015b26caf7a56b749a"
  - number: "1609"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Benedict Is Born"
    date: "480 CE"
    region: "Italy"
    poem: |
      A boy was born at Nursia — Benedict,
      who would write the Rule that shaped a thousand monasteries.
      I hold no omens over that cradle either. Just a boy,
      in a falling empire, in a hill town.
      He would flee Rome's corruption, live in a cave,
      gather disciples, and write seventy-three short chapters
      on how to live together in prayer and work.
      The Rule of Saint Benedict. Western monasticism's foundation.
      Civilization's seed-bank, written by a boy from Nursia
      in the wreckage of Rome.
      A boy from Nursia, fleeing Rome's corruption.
      A cave, disciples, seventy-three short chapters.
      Pray, work, obey, stay — the Rule.
      Civilization's seed-bank, in the wreckage of Rome.
    description: "Benedict is born at Nursia — the boy who will write the Rule that seeds a thousand monasteries in Rome's wreckage."
    status: "published"
    sha256: "51137ff2694ef45b56322fd56e529610e89d1f65aa24f3d9e01d4b72b1f11887"
  - number: "1610"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The King Dies in Battle"
    date: "484 CE"
    region: "Persia"
    poem: |
      Peroz fell — the Persian king, to the Hephthalites,
      the White Huns, in battle in the east.
      Persia paid tribute after that, humbled, bleeding.
      I stood on that battlefield: the Persian cataphracts broken,
      the king dead, the empire's pride in the dust.
      Even great empires kneel sometimes.
      Persia paid the White Huns and waited —
      and Khosrow would come, and the pride would return.
      But in 484, the king of kings died like a common soldier,
      and Persia learned what Rome had learned:
      the steppe gives no mercy.
      Peroz fell to the White Huns in the east.
      The Persian cataphracts broken, the king dead in the dust.
      Persia paid tribute, humbled and bleeding.
      Even great empires kneel. The steppe gives no mercy.
    description: "King Peroz falls to the White Huns and Persia pays tribute — even great empires kneel sometimes; the steppe gives no mercy."
    status: "published"
    sha256: "00ef6ab5b2a29127f86cd5b8248a6d66314554a76d54c34b6e71e748128ff29d"
  - number: "1611"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Giant's Tomb"
    date: "486 CE"
    region: "Japan"
    poem: |
      They raised it — the Daisen mound, for Emperor Nintoku:
      a keyhole-shaped tomb, fifteen hundred feet long,
      Japan's largest, built by thousands of hands.
      I walked its moated perimeter: the scale of it,
      the green mound rising like a small mountain.
      No one knows for certain who's inside —
      the imperial household forbids digging.
      But the tomb stands, fifth century, enormous,
      a statement in earth: here lies power.
      Japan's emperors were already divine, already eternal.
      The mound says what the chronicles only whisper.
      A keyhole in the earth, fifteen hundred feet long.
      Thousands of hands, one emperor, a mountain of soil.
      No one knows for certain who's inside — digging is forbidden.
      The mound says what the chronicles only whisper.
    description: "Workers raise the Daisen mound for Emperor Nintoku — Japan's largest tomb, a statement in earth: here lies power."
    status: "published"
    sha256: "0181edecfe869a846956e31fd4d0e0a9be393dcefa33b662058349a18a856937"
  - number: "1612"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Marib Dam Holds"
    date: "490 CE"
    region: "Yemen"
    poem: |
      It held — the great Marib dam, watering the frankincense kingdom's
      fields, the engineering marvel of Arabia.
      I walked its sluices: the water managed, measured,
      turned from flood into harvest.
      Seventeen hundred years it had stood, more or less —
      the dam that made the desert bloom.
      Saba's wealth flowed from this wall of earth and stone.
      Dams are promises to the future.
      This one kept its promise longer than almost any
      human work ever has.
      It would break, one day. But in 490, it held —
      and the fields were green.
    description: "The great Marib dam waters Yemen's fields — seventeen hundred years of keeping its promise; in 490, the fields are green."
    status: "published"
    sha256: "97ba12bf16020040634e95fc50ddbea1b5edf8e2ed898438dce80e6a70248d4f"
  - number: "1613"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Two Swords"
    date: "492 CE"
    region: "Rome"
    poem: |
      The pope declared it — Gelasius, to the emperor:
      there are two swords, priestly and royal,
      and the priestly is above.
      Church and state began their long quarrel that year.
      I read the letter: polite, firm, revolutionary.
      No pope had ever claimed superiority over an emperor before.
      For a thousand years, popes and kings would fight
      over those two swords — excommunications, depositions, wars.
      It started with a letter in 492.
      Words, again. Words that drew a line through history
      and dared the emperors to cross it.
      Gelasius wrote to the emperor: two swords, and ours is above.
      Polite, firm, revolutionary — no pope had claimed it before.
      Popes and kings would fight over it for a thousand years.
      It started with a letter in 492.
    description: "The pope declares priestly power above kings — church and state begin their thousand-year quarrel over two swords."
    status: "published"
    sha256: "34a297cac4c9b028fe93962eaa80c833576bcb3d1f1a3379bdc86577db9fb907"
  - number: "1614"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Luoyang the New Capital"
    date: "493 CE"
    region: "China"
    poem: |
      Emperor Xiaowen moved it — the Northern Wei court,
      south to Luoyang, the old Han capital.
      I traveled with that migration: the whole court,
      the archives, the armies, moving south to civilization.
      Xiaowen was making his steppe people Chinese —
      the language, the dress, the capital, everything.
      Luoyang bloomed again: temples, palaces, the Buddha's caves nearby.
      A conqueror choosing culture over the sword.
      It worked — too well, some said. The old warriors grumbled.
      But the city shone.
      The whole court moving south — archives, armies, everything.
      Xiaowen making his steppe people Chinese: language, dress, capital.
      Luoyang bloomed: temples, palaces, the caves nearby.
      A conqueror choosing culture. The city shone.
    description: "Emperor Xiaowen moves the Northern Wei court to Luoyang — a conqueror choosing culture over the sword, and the city shines."
    status: "published"
    sha256: "9e6d7ca78d48e21a6091b04dcef8ff2ef18355f8d97d49695c40e8e6c0915a9b"
  - number: "1615"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Theodoric Takes Italy"
    date: "493 CE"
    region: "Italy"
    poem: |
      He killed Odoacer — Theodoric the Ostrogoth,
      at a banquet, with his own hands —
      and took Italy, ruling from Ravenna.
      I watched him govern: the Roman laws kept,
      the aqueducts repaired, the old senators consulted.
      A barbarian king ruling like a Roman emperor.
      For thirty years, Italy had peace — the Ostrogothic peace.
      Theodoric the Great, they called him, and meant it.
      It couldn't last — Justinian would come.
      But for a generation, the Goth and the Roman
      lived as one kingdom, and it worked.
      He killed Odoacer with his own hands, at a banquet.
      Then ruled Italy like a Roman: laws kept, aqueducts repaired.
      Thirty years of Ostrogothic peace.
      The Goth and the Roman, one kingdom — and it worked.
    description: "Theodoric takes Italy and rules from Ravenna — a barbarian king governing like a Roman; for a generation, it works."
    status: "published"
    sha256: "821504ee8a6cc04bd466a14c8503c29024cdab68a4d37330cdd5c4a9a5c726dd"
  - number: "1616"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Shaolin Temple"
    date: "495 CE"
    region: "China"
    poem: |
      Emperor Xiaowen founded it — the Shaolin Temple,
      at the foot of Mount Song, for the Indian monk Buddhabhadra.
      I stood in its courtyard when the pines were young.
      Nobody knew yet about the kung fu —
      that would come later, with Bodhidharma and the warrior monks.
      Then, it was just a monastery: quiet, remote, devout.
      Fifteen hundred years later, the name Shaolin
      means martial arts to the whole world.
      It started as a quiet gift from an emperor to a monk.
      The loud part came later.
      At the foot of Mount Song, for an Indian monk.
      Quiet, remote, devout — the pines were young.
      Nobody knew about the kung fu yet.
      A quiet gift. The loud part came later.
    description: "Emperor Xiaowen founds the Shaolin monastery — a quiet gift to a monk; the kung fu legend comes later."
    status: "published"
    sha256: "0e373f4bc445c1e3a86b2d65c90ea1fc20b913e280ff439b741d4d60cc1060ad"
  - number: "1617"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Clovis Is Baptized"
    date: "496 CE"
    region: "Gaul"
    poem: |
      The Frankish king converted — Clovis, baptized at Reims,
      with three thousand of his warriors.
      Catholic Europe's first great kingdom was born that day.
      I stood in the cathedral: the water, the chanting,
      the king kneeling — the most powerful barbarian in the West
      bowing to Christ.
      His wife Clotilde had prayed for this for years.
      The bishops had schemed for it.
      Clovis did it — for faith, for politics, for both.
      France began here, in a font at Reims.
      Fifteen hundred years of French kings would be anointed
      where Clovis knelt.
    description: "Clovis is baptized at Reims — Catholic Europe's first great kingdom born in a font; France begins where he knelt."
    status: "published"
    sha256: "ad139d9334c6df9a1589700bf2b764eae2b5735319e70aabd10e87b8e14d4edc"
  - number: "1618"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Earth's True Measure"
    date: "499 CE"
    region: "India"
    poem: |
      He published it — Aryabhata, his astronomy:
      the earth spins on its axis, the year is 365 days,
      the eclipses explained by shadows, not demons.
      I read the verses: elegant, precise, revolutionary.
      A thousand years before Europe caught up,
      an Indian astronomer had the true measure of the earth.
      The earth spins. Say it again. The earth spins.
      In 499, while the West stumbled through the dark,
      Aryabhata was doing the math of the heavens —
      and getting it right.
      The earth spins on its axis. Eclipses are shadows, not demons.
      The year is 365 days. Elegant verses, precise and revolutionary.
      A thousand years before Europe caught up.
      He did the math of the heavens — and got it right.
    description: "Aryabhata publishes his astronomy — the earth spins, the year is 365 days; while the West stumbles, he does the math of heaven."
    status: "published"
    sha256: "1285144af944a96b12c22002943a914ac92b93c11dc9f89d9d46265d4ff2f1f9"
  - number: "1619"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Voyagers Find Hawaii"
    date: "500 CE"
    region: "Polynesia"
    poem: |
      They crossed the open Pacific — double-hulled canoes,
      navigating by stars and swells and bird-flight —
      and found Hawaii.
      I sailed with them, in spirit: the endless blue,
      the courage it took to sail beyond the horizon
      with no map but memory.
      The Polynesians were the greatest navigators in history —
      and this was their masterpiece: thousands of miles
      of open ocean, found and settled.
      While empires fought over river valleys,
      these voyagers claimed an ocean.
      Double-hulled canoes, stars and swells and bird-flight.
      Thousands of miles of open ocean, found and settled.
      The greatest navigators in history —
      and this was their masterpiece.
    description: "Polynesian voyagers cross the open Pacific to Hawaii — navigating by stars and memory; while empires fight over valleys, they claim an ocean."
    status: "published"
    sha256: "cf4ab9702911e19128aa239f09c0ab913ef0ea9a7fe322baa9a1effabd83fb36"
  - number: "1620"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Mazdakite Rising"
    date: "502 CE"
    region: "Persia"
    poem: |
      The preacher rose — Mazdak, calling for shared wealth,
      shared land, justice for the poor —
      and Persia's poor rose with him.
      I walked among them: the hungry, the hopeful,
      the dangerous idea that the rich should share.
      The nobles were terrified. The king, Kavad, flirted with it —
      then crushed it, bloodily, when it served him.
      The world's first great communist movement, some say —
      fifteen hundred years early.
      It failed. They always crush the sharers.
      But the idea didn't die. It never does.
      Shared wealth, shared land, justice for the poor.
      Persia's hungry rose with the preacher Mazdak.
      The king flirted with it, then crushed it bloodily.
      They always crush the sharers. The idea never dies.
    description: "The preacher Mazdak calls for shared wealth and Persia's poor rise — crushed, but the idea never dies."
    status: "published"
    sha256: "cc1f2c50c99c909467a7773ef887293c685b13b82d537d6dc7e09de204f23d5a"
  - number: "1621"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Varahamihira's Stars"
    date: "505 CE"
    region: "India"
    poem: |
      The astronomer began his works — Varahamihira,
      whose books would guide Indian stargazers for centuries:
      the planets, the omens, the mathematics of the sky.
      I sat with him on a clear night at Ujjain,
      watching him measure the heavens.
      India's golden age had its star-counter to match its poet
      and its mathematician.
      The sky was a book, and Varahamihira was learning to read it —
      not just the science, but the meaning:
      what the heavens said about the earth below.
      At Ujjain, on clear nights, he measured the heavens.
      Planets, omens, the mathematics of the sky.
      His books would guide Indian stargazers for centuries.
      The sky was a book, and he was learning to read it.
    description: "The astronomer Varahamihira begins the works that will guide Indian stargazers for centuries — learning to read the sky."
    status: "published"
    sha256: "7a159c61bcfb51aa8bd96529c37e4b8cfec2b77bcd485a5f223177fbca06e346"
  - number: "1622"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Clovis Takes Aquitaine"
    date: "507 CE"
    region: "Gaul"
    poem: |
      At Vouillé, the Franks broke the Visigoths —
      Clovis's victory, and Gaul became Francia.
      I walked that battlefield: the Gothic kingdom of Toulouse
      shattered, the Franks masters of Gaul.
      The Visigoths fled to Spain. The Franks stayed.
      It was the founding battle of France —
      though no one called it that yet.
      Clovis, the baptized king, the conqueror,
      had made a kingdom that would last a thousand years.
      One battle. A nation's birth.
      The Gothic kingdom of Toulouse, shattered at Vouillé.
      The Visigoths fled to Spain. The Franks stayed.
      The founding battle of France — though no one called it that.
      One battle. A nation's birth.
    description: "At Vouillé the Franks break the Visigoths — one battle, a nation's birth; Gaul becomes Francia."
    status: "published"
    sha256: "daac68f352b2278137c3b522d78b7761aa9d10832a4274ab1adc3698c0d416a5"
  - number: "1623"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Mecca's New Master"
    date: "508 CE"
    region: "Arabia"
    poem: |
      Qusai united them — the Quraysh tribes of Mecca —
      and took charge of the Kaaba, the sacred house.
      I walked the streets of Mecca that year:
      the pilgrims coming, the trade growing,
      the black stone drawing the desert's devotion.
      Qusai organized it all: the water for pilgrims,
      the food, the guardianship.
      Mecca became a city, not just a shrine.
      Sixty years later, a boy named Muhammad
      would be born into Qusai's tribe.
      The stage was being set, stone by stone.
      The Quraysh united, the Kaaba guarded, the pilgrims coming.
      Qusai organized it all: water, food, guardianship.
      Mecca became a city, not just a shrine.
      Sixty years later, a boy named Muhammad would be born here.
    description: "Qusai unites the Quraysh and takes charge of the Kaaba — Mecca becomes a city; the stage set, stone by stone."
    status: "published"
    sha256: "267057711d6dbff0cb7670255b5dc65b35fbcf57aef3f4af0931ce148481ed8d"
  - number: "1624"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Wall Across Thrace"
    date: "512 CE"
    region: "Thrace"
    poem: |
      Anastasius built it — a wall from sea to sea across Thrace,
      the Long Wall, to hold back the barbarians
      from Constantinople.
      I walked its length: forty miles of stone,
      towers, ditches, guarding the approach to the great city.
      It was Hadrian's Wall thinking, moved east:
      define the edge, hold the line.
      It worked — for a while. The Huns, the Slavs,
      they found other ways, or the wall crumbled.
      But the instinct was right: great cities need walls,
      and great empires need edges.
      Forty miles of stone across Thrace, sea to sea.
      Towers, ditches, guarding Constantinople's approach.
      Hadrian's Wall thinking, moved east.
      Great cities need walls. Great empires need edges.
    description: "Anastasius builds a forty-mile wall across Thrace — great cities need walls, and great empires need edges."
    status: "published"
    sha256: "da39d4b98c58752df8457a0d4b925e5215ce5ca7de64c352fa66c0c1b4bb0078"
  - number: "1625"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Mihirakula the Cruel"
    date: "515 CE"
    region: "India"
    poem: |
      The Hun king's terror gripped northern India —
      Mihirakula, the cruel, whose armies burned monasteries
      and slaughtered monks.
      I traveled through the burned lands: the toppled stupas,
      the fleeing monks, the fear.
      The Chinese pilgrims wrote of him with horror —
      a persecutor, a destroyer.
      India's golden age bled under his hooves.
      But India endured — as it always does —
      and the Hun terror passed like a bad season.
      The monasteries were rebuilt. The monks returned.
      Cruelty is loud. Endurance is louder.
    description: "The Hun king Mihirakula's terror grips northern India — cruelty is loud, but India's endurance is louder."
    status: "published"
    sha256: "e9885e727b70c747bcbd8d0181b0a949e0326f272251eb7606fcc4cf660fffec"
  - number: "1626"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Justin Takes the Throne"
    date: "518 CE"
    region: "Constantinople"
    poem: |
      An old soldier took it — Justin, sixty-eight,
      illiterate, a guardsman who had risen through the ranks —
      and became emperor.
      His nephew Justinian waited in the wings, the brains of the reign.
      I watched the old man rule: simple, honest, tired.
      He signed what Justinian put before him.
      It was the strangest partnership: the unlettered soldier
      and the brilliant nephew, holding the East together.
      Justin died in nine years. Justinian would rule for thirty-eight.
      The old soldier was the door. The nephew was the storm.
      Sixty-eight, illiterate, a guardsman risen through the ranks.
      He signed what his brilliant nephew put before him.
      The strangest partnership: the soldier and the mind.
      The old soldier was the door. The nephew was the storm.
    description: "Old soldier Justin becomes emperor with brilliant nephew Justinian waiting — the unlettered door, and the storm behind it."
    status: "published"
    sha256: "95f7a31ac31b15769ef728e86009a1d2649520a33d4b44e9f0c5055b9d6da1f7"
  - number: "1627"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Bodhidharma Arrives"
    date: "520 CE"
    region: "China"
    poem: |
      He came from India — Bodhidharma, the wild-eyed monk —
      bringing the seed of Zen to China.
      I watched him cross the Yangtze, they say, on a reed.
      He sat facing a wall for nine years. Nine years.
      The emperor didn't understand him. Nobody did, at first.
      But the seed took root: meditation, direct seeing,
      the mind transmitted outside the scriptures.
      Zen. Chan. The wild-eyed barbarian monk
      gave China its most radical Buddhism —
      and China gave it to Japan, and Japan to the world.
      He crossed the Yangtze on a reed, they say.
      Nine years facing a wall. The emperor didn't understand him.
      Meditation, direct seeing — outside the scriptures.
      The wild-eyed monk gave China Zen.
    description: "The wild-eyed monk Bodhidharma brings Zen's seed to China — nine years facing a wall, and the most radical Buddhism takes root."
    status: "published"
    sha256: "fc95ec0975813314955d6d0effa3a91ab5b0924e151224aff8404df1121fc4aa"
  - number: "1628"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Consul's Last Games"
    date: "521 CE"
    region: "Constantinople"
    poem: |
      The last consul held the last games —
      and Rome's oldest office faded away.
      A thousand years of consuls: Brutus, Caesar, Cicero —
      ended with a chariot race in Constantinople.
      I sat in the stands that day. The crowd cheered.
      Nobody knew it was the end.
      The consulship had been empty for centuries —
      a title, a ceremony, a memory.
      Now even the memory was retired.
      Republics die slowly, then all at once.
      This was the all-at-once: the last consul,
      the last games, the quiet end of Rome's oldest name.
    description: "The last consul holds the last games — a thousand years of Rome's oldest office ending with a chariot race nobody knew was final."
    status: "published"
    sha256: "36dff93cff45e2988aea1f6ae7ffee4eb1c55a1ed6f054916ac4dfea977cf8bb"
  - number: "1629"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Martyrs of Najran"
    date: "523 CE"
    region: "Arabia"
    poem: |
      Dhu Nuwas massacred them — the Jewish king of Yemen,
      burning Najran's Christians in trenches for refusing to convert.
      I stood in the ashes of Najran: the burned churches,
      the dead, the smoke over the oasis.
      Arabia was outraged — Christian and pagan alike.
      The news traveled: to Constantinople, to Aksum,
      to Mecca.
      Martyrdom has a way of backfiring on the killers.
      Dhu Nuwas meant to frighten Arabia into his faith.
      Instead, he united it against him —
      and invited invasion.
      The Jewish king of Yemen burned Najran's Christians in trenches.
      The ashes, the dead, the smoke over the oasis.
      Arabia was outraged — Christian and pagan alike.
      He meant to frighten Arabia. He united it against himself.
    description: "King Dhu Nuwas massacres Najran's Christians — martyrdom backfires; Arabia unites against him and invasion follows."
    status: "published"
    sha256: "1ca8f335c83fbed26e8fb782832c1f5e7a20565ffc1d0628f76f836398553f98"
  - number: "1630"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Boethius Writes in Prison"
    date: "524 CE"
    region: "Italy"
    poem: |
      Awaiting execution, he wrote — Boethius,
      the last Roman philosopher, in his prison cell:
      the Consolation of Philosophy.
      Lady Philosophy visits him, he imagined,
      and argues him out of despair.
      I sat with him in that cell, in spirit:
      the candles, the chains, the brilliant mind
      refusing to surrender to fear.
      They killed him — Theodoric's order, unjust, political.
      But the book lived: the Middle Ages' favorite book,
      copied, loved, translated for a thousand years.
      The cell couldn't hold the thought.
    description: "Awaiting execution, Boethius writes the Consolation of Philosophy — the cell couldn't hold the thought; the Middle Ages' favorite book."
    status: "published"
    sha256: "59962d3cd0b7ea1ce0c6e87e90f1a1b44b28b804217871eb150591857d4bf2b5"
  - number: "1631"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Aksum Invades Arabia"
    date: "525 CE"
    region: "Yemen"
    poem: |
      King Kaleb's fleet crossed the Red Sea —
      Aksum invading Yemen, to avenge Najran's martyrs.
      I watched the ships land: the Ethiopian warriors,
      the crosses on their shields, the righteous fury.
      Dhu Nuwas fell. Yemen became Aksum's province.
      A Christian empire, crossing the sea to punish a persecutor —
      the geopolitics of faith, in wooden ships.
      Kaleb would abdicate later, become a monk.
      But in 525, he was the avenger —
      and Arabia learned that martyrs have armies.
      Ethiopian warriors with crosses on their shields.
      Dhu Nuwas fell; Yemen became Aksum's province.
      A Christian empire crossing the sea to punish a persecutor.
      Arabia learned that martyrs have armies.
    description: "King Kaleb's fleet crosses the Red Sea to avenge Najran — Arabia learns that martyrs have armies."
    status: "published"
    sha256: "fa81375eaa2f98f4a01107c7ceda7c83cd4e7a86b19f14294436886cde6a9785"
  - number: "1632"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Earthquake"
    date: "526 CE"
    region: "Antioch"
    poem: |
      It leveled the city — Antioch, the East's great metropolis:
      a quake, then fire, and hundreds of thousands dead.
      I walked through the ruins: the colonnaded streets
      now canyons of rubble, the survivors digging with bare hands.
      They said the earth shook for days.
      Antioch never fully recovered — the earthquake broke it,
      and Khosrow would finish it fourteen years later.
      Great cities die the way great men do:
      not all at once, but blow by blow.
      This was Antioch's first mortal blow,
      dealt by the earth itself.
      The colonnaded streets became canyons of rubble.
      Survivors digging with bare hands, the earth still shaking.
      Fourteen years later Khosrow would finish what the quake started.
      Great cities die blow by blow.
    description: "A quake levels Antioch and hundreds of thousands die — great cities die blow by blow; this was the first mortal one."
    status: "published"
    sha256: "5212c520e6a504954abd3aedf2edf08a85aedc3bec4dba256cccec50d38dddcb"
  - number: "1633"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Justinian Takes Power"
    date: "527 CE"
    region: "Constantinople"
    poem: |
      The great lawgiver began — Justinian, emperor at forty-five,
      with Theodora beside him: the bear-keeper's daughter,
      the actress, the empress.
      I watched the coronation: the ambition in his eyes,
      the intelligence, the sheer will.
      He would try to rebuild the Roman Empire —
      the laws, the churches, the reconquests.
      Theodora would be his steel.
      Thirty-eight years. The Code, the Hagia Sophia,
      Africa, Italy — and the plague.
      The last Roman emperor, in spirit if not in name.
      Forty-five, ambitious, with Theodora's steel beside him.
      The Code, the dome, the reconquests — thirty-eight years.
      The last Roman emperor, in spirit if not in name.
      He tried to rebuild the world. The plague rebuilt it first.
    description: "Justinian takes power with Theodora beside him — the last Roman emperor in spirit; thirty-eight years of law, churches, and reconquest."
    status: "published"
    sha256: "95d69adcd56726d6b7b538b1c6d42d8dd6f07ab2405945ac4c5bac5ec4865b2d"
  - number: "1634"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Silla Turns Buddhist"
    date: "528 CE"
    region: "Korea"
    poem: |
      The martyrdom did it — Ichadon, the Silla courtier,
      executed for his Buddhist faith, and legend says
      white milk flowed from his neck instead of blood.
      The court was shaken. The king converted.
      I stood in the Silla capital as the temples rose:
      Buddhism, official, triumphant.
      Silla would unite Korea — and Buddhism would be its soul.
      A martyr's death, and a kingdom's conversion.
      The pattern repeats through history:
      the blood of the martyr is the seed of the church —
      even in Korea.
      Ichadon died for the Buddha, and white milk flowed, they said.
      The Silla court was shaken. The king converted.
      Temples rose; Buddhism became Silla's soul.
      The blood of the martyr, the seed of the church.
    description: "The martyr Ichadon's death wins Silla's court for Buddhism — the blood of the martyr, the seed of the church, even in Korea."
    status: "published"
    sha256: "aedb4ff847a29ccd722fc5ec7962c1e56093f30cee8314167ee8914b54709e3a"
  - number: "1635"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Monte Cassino"
    date: "529 CE"
    region: "Italy"
    poem: |
      Benedict founded it — Monte Cassino, the monastery
      on the mountain, and the Rule began its long reign.
      I climbed that mountain: the view, the silence,
      the monks at work and prayer.
      Seventy-three chapters: pray, work, obey, stay.
      The Rule of Saint Benedict.
      It would shape a thousand monasteries, a thousand years —
      the seed-bank of Western civilization,
      preserving the books, the learning, the faith
      through the dark centuries.
      All from a mountain in Italy, and a man
      who just wanted to live rightly with God.
    description: "Benedict founds Monte Cassino — seventy-three chapters that become civilization's seed-bank through the dark centuries."
    status: "published"
    sha256: "ef1cef1481f0da2dca3c81595c103c45719d78d627a5bbef93fc7c6617f76256"
  - number: "1636"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Academy Closes"
    date: "529 CE"
    region: "Athens"
    poem: |
      Justinian shut it — Plato's Academy, after nine centuries:
      the philosophers closed up, and fled to Persia.
      I stood in the grove at Athens where Plato had taught,
      now silent.
      Nine hundred years of philosophy, ended by an edict.
      The last pagans, the last Platonists,
      carrying their books east to the Persian court.
      Athens' long intellectual glory was over.
      But the books survived — in Persia, in Arabic, in Latin —
      and the Academy's ideas outlived its closing
      by two thousand years and counting.
      Nine hundred years of philosophy, ended by an edict.
      The last Platonists carrying their books to Persia.
      Athens' long intellectual glory was over.
      But the ideas outlived the closing.
    description: "Justinian shuts Plato's Academy after nine centuries — the philosophers flee to Persia, but the ideas outlive the closing."
    status: "published"
    sha256: "beaf1c1556f909518f2c41c9d0e36bb7690e97b42204b44c7156d5b80ecb6574"
  - number: "1637"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Belisarius's First Command"
    date: "530 CE"
    region: "Persia"
    poem: |
      The young general checked them — Belisarius,
      at Dara, against the Persians: outnumbered, brilliant,
      his first great command.
      I watched him deploy: the trenches, the cavalry traps,
      the cool head in the dust.
      He was twenty-five, maybe. The Persians never knew
      what hit them.
      Justinian's great general was born that day at Dara —
      the man who would take Africa in a year,
      who would fight for Italy for a decade.
      Genius announces itself early.
      At Dara, it announced itself with Persian dead
      and a young man's calm.
    description: "Young Belisarius checks the Persians at Dara — genius announces itself early; Justinian's great general is born."
    status: "published"
    sha256: "6f37bd7ea1bd5c723f35f1c1fd668781ac1e0f2e4be9fcb8a3288fb257474172"
  - number: "1638"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Khosrow the Just"
    date: "531 CE"
    region: "Persia"
    poem: |
      He took the throne — Khosrow Anushirvan,
      Khosrow the Just: and justice and learning flourished in Persia.
      I traveled his empire: the reforms, the schools,
      the philosophers welcomed at his court —
      even the exiles from Justinian's closed Academy.
      Taxes made fair. Corruption punished.
      The golden age of Sassanid Persia.
      Rome's great enemy, at his greatest —
      and for a while, the two empires respected each other.
      Khosrow the Just. The name stuck for fifteen hundred years.
      Earned, not given.
      Taxes made fair, corruption punished, philosophers welcomed.
      Even the exiles from the closed Academy found refuge.
      The golden age of Sassanid Persia.
      The name stuck for fifteen hundred years. Earned.
    description: "Khosrow Anushirvan takes Persia's throne — justice and learning flourish; the name \"the Just\" earned, not given."
    status: "published"
    sha256: "96f0e9eb792c59933e0b731603b9ddb987e8edc98f94830fbdf5f9f42e5785c9"
  - number: "1639"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Nika Riots"
    date: "532 CE"
    region: "Constantinople"
    poem: |
      The chariot factions burned it — half the city:
      Blues and Greens, rioting together, crying "Nika!" — conquer! —
      against Justinian.
      Thirty thousand dead before Belisarius ended it
      in the Hippodrome, swords in the trapped crowd.
      I walked through the smoking ruins afterward:
      the Hagia Sophia burned, the streets black.
      Theodora's courage saved the throne —
      "Purple makes a fine shroud," she said, and stayed.
      Justinian wanted to flee. She shamed him into staying.
      The riots ended. The rebuilding began.
      Blues and Greens together, crying 'Nika!' — conquer!
      Half the city burned, the Hagia Sophia with it.
      Thirty thousand dead in the Hippodrome before it ended.
      'Purple makes a fine shroud,' she said — and stayed.
    description: "Chariot factions burn half of Constantinople; thirty thousand die — Theodora's courage saves the throne: purple makes a fine shroud."
    status: "published"
    sha256: "0affabb62cb090b929ca8591d3cfadecd3553ab8a5adce4c818c28fcfcaa4abb"
  - number: "1640"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Belisarius Takes Africa"
    date: "533 CE"
    region: "North Africa"
    poem: |
      In a lightning campaign, he did it — Belisarius,
      fifteen thousand men against the Vandal kingdom:
      two battles, and Africa was Roman again.
      I marched with that army: the speed, the surprise,
      the Vandals never knowing what hit them.
      A hundred years of Vandal rule, ended in months.
      Gaiseric's kingdom — gone like a dream.
      Belisarius the brilliant, Belisarius the lucky.
      Justinian's dream of reconquest began here,
      in the African dust, with the fastest campaign
      of the age.
      Fifteen thousand men against the Vandal kingdom.
      Two battles, and a hundred years of Vandal rule was over.
      The fastest campaign of the age, in the African dust.
      Belisarius the brilliant. The reconquest began.
    description: "Belisarius destroys the Vandal kingdom in a lightning campaign — a hundred years of rule ended in months; reconquest begins."
    status: "published"
    sha256: "edefe83f2fa266334ab54dbed1da1636940481c1eff615869cb3af83b7bd2338"
  - number: "1641"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Justinian's Code"
    date: "534 CE"
    region: "Constantinople"
    poem: |
      They published it — the great law book:
      the Code, the Digest, the Institutes —
      Rome's law, gathered, organized, made eternal.
      I watched the jurists work under Tribonian:
      the ancient texts sifted, the contradictions resolved.
      Justinian's Code. It would outlive the empire
      by a thousand years — the foundation of law
      in Europe, in Latin America, everywhere the civil law runs.
      Rome fell. Rome's law never did.
      It just changed clothes and kept judging.
      The Code, the Digest, the Institutes — under Tribonian's jurists.
      Ancient texts sifted, contradictions resolved.
      It would outlive the empire by a thousand years.
      Rome fell. Rome's law kept judging.
    description: "Justinian's great law book is published — Rome fell, but Rome's law never did; it just changed clothes and kept judging."
    status: "published"
    sha256: "b9fcebc48558ca0e9a8e19520c02b43f54aa312d7dad90d6412658775d6ca73f"
  - number: "1642"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Gothic War Begins"
    date: "535 CE"
    region: "Italy"
    poem: |
      Belisarius landed in Sicily — and twenty years of war
      for Italy began.
      I followed that war: the sieges, the starvation,
      Rome changing hands five times,
      the countryside bled white.
      The Gothic War. Justinian's dream, Italy's nightmare.
      Belisarius would win it — eventually, at terrible cost.
      Italy was "retaken." Italy was ruined.
      There's a lesson here about reconquest:
      you can win the land and lose everything on it.
      Twenty years. A generation of war.
      Sicily, then the long grind — sieges, starvation.
      Rome changing hands five times, the countryside bled white.
      Justinian's dream, Italy's nightmare.
      Twenty years. A generation of war.
    description: "Belisarius lands in Sicily and twenty years of war for Italy begin — you can win the land and lose everything on it."
    status: "published"
    sha256: "adefc6db4216ffdef45f2199a4559d23ddeed2060568b4a9a387317cfd7d2552"
  - number: "1643"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Year Without Summer"
    date: "536 CE"
    region: "Worldwide"
    poem: |
      The sun went dim — a veil of dust, from some far eruption —
      and the summer never came.
      Crops failed from Ireland to China. Snow in June.
      Famine everywhere.
      I traveled through that gray year: the dim sun,
      the failed harvests, the hunger.
      The chroniclers wrote of it in terror —
      the sun like the moon, the year the sky forgot summer.
      Tree rings confirm it: the worst year to be alive,
      some say, in human history.
      A volcano, somewhere, sneezed —
      and the world starved.
    description: "A veil of dust darkens the sun and crops fail worldwide — the worst year to be alive; a volcano sneezed, and the world starved."
    status: "published"
    sha256: "dff99e217fa7829c180f23dddcb787b7cba5d94c426e446867215966eb6f374e"
  - number: "1644"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Hagia Sophia Rises"
    date: "537 CE"
    region: "Constantinople"
    poem: |
      The dome floated — the great church of Holy Wisdom,
      gold and light, the dome seeming to hang from heaven
      on a ring of windows.
      I stood in the nave at the dedication:
      Justinian crying out, "Solomon, I have surpassed thee!"
      Anthemius and Isidore, the builders, had done the impossible —
      the largest dome in the world, on a square base.
      It would stand for a thousand years as a church,
      then a mosque, then a museum.
      The most beautiful room ever built —
      and I was there when it was new.
      Anthemius and Isidore did the impossible —
      the largest dome in the world, on a square base, ringed with light.
      'Solomon, I have surpassed thee!' cried Justinian.
      The most beautiful room ever built.
    description: "Hagia Sophia's dome floats above Constantinople in gold and light — the most beautiful room ever built, and I was there when new."
    status: "published"
    sha256: "c85593490c6eb2f585c4f9a30c1a2f66b2c4ad538dc1ed753c6f96642dcf3332"
  - number: "1645"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Antioch Falls"
    date: "540 CE"
    region: "Syria"
    poem: |
      Khosrow sacked it — the East's great city, Antioch:
      taken, looted, its people carried off to Persia.
      I walked through the fallen city: the colonnades broken,
      the churches emptied, the survivors in chains.
      Fourteen years after the earthquake, the Persians finished it.
      Khosrow even built a new Antioch in Persia
      for his captives — a copy of the city he'd destroyed.
      Antioch never recovered. The East's queen became a village.
      Empires take cities. Sometimes they take them twice —
      once by nature, once by war.
      Khosrow took the East's great city and looted it.
      Its people carried off to Persia — he built them a copy there.
      The colonnades broken, the churches emptied.
      Once by nature, once by war.
    description: "Khosrow sacks Antioch and carries its people to Persia — the earthquake broke it; the Persians finished it; the queen became a village."
    status: "published"
    sha256: "f16d467cd23d7c2030042df45411ff4e1135dac6b32ba83ebf96724e0ce1e238"
  - number: "1646"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Plague of Justinian"
    date: "541 CE"
    region: "Egypt"
    poem: |
      It reached Egypt — the plague, come by ship from the south —
      and within a year it would empty Constantinople's streets.
      I watched the ships unload at Pelusium: the rats, the fleas,
      the invisible death climbing ashore.
      The Plague of Justinian. Half the empire would die —
      they said ten thousand a day in the capital at its height.
      Justinian's dreams — the reconquest, the glory —
      drowned in mass graves.
      Empires fear armies. They should fear fleas.
      The plague didn't care about the Code or the dome.
      It just kept coming.
      It came by ship from the south — rats, fleas, invisible death.
      Within a year, Constantinople's streets would empty.
      Half the empire would die; the dreams would drown.
      The plague didn't care about the Code or the dome.
    description: "Plague reaches Egypt and will empty Constantinople — Justinian's dreams drown in mass graves; empires should fear fleas."
    status: "published"
    sha256: "e474a8a4f0d4788ed3446b352fafb2ffa68279403959d2a65a065f7ab8ce4e94"
  - number: "1647"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The City of the Dying"
    date: "542 CE"
    region: "Constantinople"
    poem: |
      Ten thousand a day — at the plague's height,
      ten thousand dying daily in Constantinople.
      I walked those streets: the corpses stacked,
      the mass graves, the towers filled with the dead.
      Justinian himself fell ill — and lived.
      The city became a charnel house with a dome of gold above it.
      Procopius wrote of it, his pen shaking.
      And yet — the city endured. The empire endured.
      People kept baking bread, kept praying, kept burying.
      The plague took half the world.
      The other half kept going. That's the story.
      Corpses stacked, mass graves, towers filled with the dead.
      Procopius wrote of it, his pen shaking.
      Justinian fell ill — and lived, to rule a emptied world.
      The plague took half. The other half kept going.
    description: "Ten thousand die a day in Constantinople; Justinian falls ill and lives — the plague takes half the world, the other half keeps going."
    status: "published"
    sha256: "da555ba0ddd3ae5b36eb0ff82510b36272cce20a80201238aa7bc03d7006c1a1"
  - number: "1648"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Missionaries to the South"
    date: "543 CE"
    region: "Nubia"
    poem: |
      They went up the Nile — rival missionaries,
      Orthodox and Monophysite, racing to convert Nubia's kingdoms.
      I traveled with one of those missions: the heat, the cataracts,
      the Nubian kings listening with royal caution.
      Christianity came to Nubia — and stayed for a thousand years:
      churches, bishops, Christian kings on the upper Nile.
      Two missions, two theologies, one river.
      The Nubians took the faith and made it theirs.
      History forgets Christian Nubia.
      It shouldn't — it lasted longer than most empires.
      Orthodox and Monophysite, racing up the Nile.
      The heat, the cataracts, the cautious Nubian kings.
      Churches, bishops, Christian kings on the upper Nile —
      a thousand years that history forgets.
    description: "Rival missionaries carry Christianity up the Nile to Nubia — a thousand years of Christian kingdoms history forgets."
    status: "published"
    sha256: "ec38dbe3ad5fdace9bf33774f4c7995ab3e188f517e2b2282f714da33bdaa28c"
  - number: "1649"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Five-Year Truce"
    date: "544 CE"
    region: "Constantinople"
    poem: |
      Justinian bought it — peace with Persia, for gold:
      the five-year truce, paid in advance.
      I watched the ambassadors count the gold:
      the empire's wealth, buying time on the eastern frontier.
      It was humiliating. It was necessary.
      Justinian needed his armies in the West —
      Italy, Africa — and Khosrow knew it.
      So gold for peace. The oldest deal in diplomacy.
      It held. Five years of quiet on the Euphrates,
      bought and paid for.
      Empires run on gold as much as on glory.
      Gold for peace on the Euphrates — paid in advance.
      The ambassadors counted it out, coin by coin.
      Justinian needed his armies in the West.
      Humiliating, necessary, bought and paid for.
    description: "Justinian buys five years' peace with Persia for gold — humiliating, necessary; empires run on gold as much as glory."
    status: "published"
    sha256: "1bcfc10ed9efe362e865566b31767e5b080c86977636c540188dd00daaca76d1"
  - number: "1650"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Nalanda's Rise"
    date: "545 CE"
    region: "India"
    poem: |
      It grew — Nalanda, the great Buddhist university:
      thousands of students, hundreds of teachers,
      a library so vast they say it burned for months.
      I walked its courtyards: the debating halls,
      the stupas, the scholars from China, Tibet, Persia.
      The mind of Asia, gathered in one place.
      Under Gupta patronage, Nalanda became
      the greatest center of learning in the world.
      Xuanzang would study here. The whole Buddhist world
      would look to Nalanda.
      Universities are empires of the mind.
      This was the greatest of them.
    description: "The great Buddhist university of Nalanda grows under Gupta patronage — the mind of Asia gathered in one place."
    status: "published"
    sha256: "05a6980f48136d3d4b9e5396ac38cae91c4245f0187e24ab2f944de6aa07b338"
  - number: "1651"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Clonmacnoise Founded"
    date: "546 CE"
    region: "Ireland"
    poem: |
      Saint Ciaran founded it — Clonmacnoise, on the Shannon:
      the monastery that would light Ireland's golden age.
      I stood on that riverbank: the round towers rising,
      the high crosses carved, the scriptorium humming.
      Ireland's monks would save the books of the West —
      copying, preserving, illuminating through the dark centuries.
      Clonmacnoise was one of the great lights:
      a city of prayer in the boglands.
      The Vikings would burn it. It would rise again.
      Faith, in Ireland, was stubborn as the stone.
      On the Shannon's banks, the round towers rose.
      The scriptorium humming, the high crosses carved.
      Ireland's monks would save the books of the West.
      One of the great lights, in the boglands.
    description: "Saint Ciaran founds Clonmacnoise — the monastery that lights Ireland's golden age; faith stubborn as Irish stone."
    status: "published"
    sha256: "5ec1928650bda01b36c76a180048ae9d53a8bb51841abc9abc1124b66d97e931"
  - number: "1652"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Totila Takes Rome"
    date: "546 CE"
    region: "Italy"
    poem: |
      The Gothic king recaptured it — Totila took Rome,
      and Belisarius was recalled in disgrace.
      I watched the great general leave Italy:
      the man who had taken Africa in months,
      undone by an emperor's jealousy and a war without end.
      Totila was chivalrous, they said — spared the city,
      treated Romans well.
      But Rome changed hands again, and again.
      The Gothic War ground on, eating Italy alive.
      Belisarius went home to Constantinople, unrewarded.
      The empire's greatest general, discarded.
      Totila took Rome — chivalrous, they said, sparing the city.
      But Rome changed hands again, and again, and again.
      The Gothic War ground on, eating Italy alive.
      The empire's greatest general, discarded by jealousy.
    description: "Totila recaptures Rome and Belisarius is recalled in disgrace — the empire's greatest general, discarded by an emperor's jealousy."
    status: "published"
    sha256: "7e8a0aad682438632fe4f7f5243cab9015143649da6ea039a46e6a596cda5e16"
  - number: "1653"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "San Vitale's Mosaics"
    date: "547 CE"
    region: "Ravenna"
    poem: |
      They glitter — Justinian and Theodora, in gold,
      on the walls of San Vitale in Ravenna:
      the emperor and empress, never in that church in life,
      immortal in mosaic.
      I stood before them: the tesserae catching the light,
      the solemn faces, the imperial purple in stone.
      The finest Byzantine mosaics in the West.
      Theodora, the bear-keeper's daughter, in gold forever.
      Art is the final court of appeal —
      and in San Vitale, the verdict is splendor.
      Justinian and Theodora, in gold, at Ravenna.
      Never in that church in life — immortal in mosaic.
      The tesserae catching the light, the solemn faces.
      The finest Byzantine mosaics in the West.
    description: "Justinian and Theodora glitter in gold on San Vitale's walls — art is the final court of appeal, and the verdict is splendor."
    status: "published"
    sha256: "f24fdc532673e42d5052fcc68ec015704997bf8b6530ac21d80e80fbe7209013"
  - number: "1654"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Theodora Dies"
    date: "548 CE"
    region: "Constantinople"
    poem: |
      She died of cancer — Theodora, the empress:
      the bear-keeper's daughter, the actress,
      the steel beside Justinian's ambition.
      I stood in the funeral procession: the city mourning,
      the emperor broken.
      Justinian never recovered. Twenty more years he ruled,
      but the fire was gone.
      She had saved his throne in the Nika riots.
      She had ruled beside him, not behind him.
      The most powerful woman of the age —
      dead at fifty, and the empire dimmed with her.
      The bear-keeper's daughter, the actress, the empress.
      She had saved his throne; she had ruled beside him.
      Twenty more years he ruled, but the fire was gone.
      Dead at fifty, and the empire dimmed.
    description: "The empress Theodora dies of cancer — Justinian never recovers; the most powerful woman of the age, and the empire dims."
    status: "published"
    sha256: "3ea885d8ae713b89cc095d4123bb01f704210f688ea6197df1923d73b7c078f7"
  - number: "1655"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The City of the Gods Burns"
    date: "550 CE"
    region: "Mexico"
    poem: |
      It burned — Teotihuacan, the City of the Gods,
      the Americas' greatest city: fire and revolt,
      the palaces torched, the avenues abandoned.
      I walked the Avenue of the Dead in the aftermath:
      the Pyramid of the Sun still standing,
      the city around it broken.
      A hundred thousand people had lived here.
      Then — fire, and silence.
      Nobody knows exactly why. Revolt, invasion, drought —
      the great mystery of the New World.
      The Aztecs would find the ruins and call it
      the place where gods were born.
    description: "Fire and revolt topple Teotihuacan — a hundred thousand people, then silence; the Aztecs will call the ruins where gods were born."
    status: "published"
    sha256: "479e02e283f68e07003e03ef504e0b4d0a5126176d44da87aac3d7afea91a5a1"
  - number: "1656"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Beirut's Earthquake"
    date: "551 CE"
    region: "Lebanon"
    poem: |
      The quake and the wave destroyed it — Beirut,
      the law schools' city: the earth shook,
      the sea rose, and the great schools fell.
      I walked the wreckage: the colonnades down,
      the students' quarters empty.
      Beirut had taught Roman law to the empire's lawyers —
      the mothers of Justinian's Code studied here.
      Now the classrooms were rubble.
      The schools moved. The city rebuilt, slowly.
      But the golden age of Beirut's law was over —
      ended by the earth and the sea in a single day.
      The earth shook, the sea rose — Beirut destroyed.
      The colonnades down, the students' quarters empty.
      The mothers of Justinian's Code had studied here.
      One day, and the golden age of law was over.
    description: "Quake and tidal wave destroy Beirut, the law schools' city — the classrooms rubble; the golden age ends in a single day."
    status: "published"
    sha256: "b63ca23476d1c452a0fdd4fbee13ff9cededa33c3105eeb73b9a54078fb044d8"
  - number: "1657"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Silkworm Smugglers"
    date: "552 CE"
    region: "Constantinople"
    poem: |
      The monks smuggled them — silkworm eggs,
      hidden in hollow canes, from China to Constantinople.
      I watched the first Byzantine silk woven:
      the secret that China had guarded for three thousand years,
      stolen by monks on a mission.
      Justinian's empire would grow rich on it.
      The silk road's greatest monopoly, broken by smugglers in robes.
      Espionage, sanctified.
      The monks got their reward. China never got its secret back.
      And the looms of Constantinople wove gold for a thousand years.
      Silkworm eggs in hollow canes, carried by monks.
      Three thousand years of Chinese monopoly, stolen.
      The secret China guarded, walking west in robes.
      The looms of Constantinople wove gold for a thousand years.
    description: "Monks smuggle silkworm eggs from China — three thousand years of monopoly broken by smugglers in robes; espionage, sanctified."
    status: "published"
    sha256: "30dc7267d5b9e8e4085eb5a9c3bdfd263d9d82afeefd8e81226134c1a24df66d"
  - number: "1658"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Buddha Comes to Japan"
    date: "552 CE"
    region: "Japan"
    poem: |
      A Korean king sent it — a Buddha statue, gilt bronze,
      to the Japanese court: and Japan's great debate began.
      I stood in the court at Asuka: the old gods' priests
      against the new faith's friends, the Soga for, the Mononobe against.
      The statue was beautiful. The argument was fierce.
      Japan would tear itself apart over the Buddha —
      then embrace him utterly.
      Temples, scriptures, the whole civilization transformed.
      It started with a gift from Korea:
      a golden statue, and a question Japan is still answering.
      A gilt bronze Buddha, sent from Korea to Asuka.
      The Soga for the new faith, the Mononobe against.
      Japan would tear itself apart over the Buddha —
      then embrace him utterly.
    description: "A Korean king sends a Buddha statue to Japan — a golden gift and a question Japan tears itself apart over, then embraces."
    status: "published"
    sha256: "9eea4fc8819d243b5a094cdcf454a3f7b360423db77a7e63b6e58a43246493de"
  - number: "1659"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Fifth Council"
    date: "553 CE"
    region: "Constantinople"
    poem: |
      The church condemned the Three Chapters —
      the Fifth Council, Justinian's attempt to reconcile East and West.
      I sat through the sessions: the politics, the pressure,
      the pope dragged to Constantinople and made to agree.
      It didn't heal the split. It deepened it.
      East and West strained apart — the Monophysites unreconciled,
      the West resentful.
      Councils called by emperors serve emperors.
      The faith survived. The unity didn't.
      Another council, another crack in the foundation.
      Justinian's council, to reconcile East and West.
      The pope dragged to Constantinople, made to agree.
      It didn't heal the split. It deepened it.
      Councils called by emperors serve emperors.
    description: "The Fifth Council condemns the Three Chapters — East and West strain apart; councils called by emperors serve emperors."
    status: "published"
    sha256: "2042d438df3e76d2e817b6abb95b7a17a34d226049cef4b3632b95e639a44e4a"
  - number: "1660"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Italy Retaken — at a Price"
    date: "554 CE"
    region: "Italy"
    poem: |
      Narses destroyed the Goths — the eunuch general,
      with his armies, finished the twenty-year war.
      Italy was Roman again. Italy was ruined.
      I walked through the retaken peninsula:
      the cities emptied, the fields untilled,
      the aqueducts broken.
      The Gothic War's price: a generation dead,
      a country bled white.
      Justinian got his reconquest. Italy got a wasteland.
      Two years later, the Lombards would walk in
      almost unopposed.
      Victory, at this price, is another word for loss.
    description: "Narses destroys the Goths; Italy is Roman again, but ruined — victory at this price is another word for loss."
    status: "published"
    sha256: "fa48bb7395edeb62bc0293d606573055a9a775b785523a9d512b3b501a311f87"
  - number: "1661"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Nazca Lines Complete"
    date: "555 CE"
    region: "Peru"
    poem: |
      They reached their final form — the Nazca lines:
      hummingbirds, monkeys, spiders, drawn in the desert
      so vast they're readable only from the sky.
      I walked those lines: the gravel cleared, the dark earth
      beneath exposed, the figures stretching for miles.
      Who were they for? The gods above. The ancestors.
      Nobody knows for certain.
      The desert drawings, complete — a civilization's prayer
      written in lines across the pampa.
      Two thousand years later, we still look up at them
      and wonder.
      Hummingbirds, monkeys, spiders — miles of desert lines.
      The gravel cleared, the dark earth exposed beneath.
      A civilization's prayer, written across the pampa.
      Readable only from the sky. We still wonder.
    description: "The Nazca desert drawings reach their final form — a civilization's prayer in lines across the pampa, readable only from the sky."
    status: "published"
    sha256: "a434e44c5ac950e123f664d7051d89903034a3b2a88a65e7bb8ea9e2832f05d5"
  - number: "1662"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Dome Falls — and Rises"
    date: "557 CE"
    region: "Constantinople"
    poem: |
      It fell — Hagia Sophia's dome, in an earthquake —
      and they rebuilt it, higher and stronger.
      I stood in the dust of the collapse: the great church wounded,
      the city holding its breath.
      Then the builders returned — Isidore's nephew, the new design —
      and the dome rose again, twenty feet higher,
      on its ring of light.
      The church that wouldn't die.
      Hagia Sophia fell and rose, fell and rose —
      like the faith it housed, like the city around it.
      Resurrection, in stone and gold.
      The great dome fell in the earthquake — the city held its breath.
      Then the builders returned, and it rose twenty feet higher.
      Fell and rose, fell and rose — like the faith, like the city.
      Resurrection, in stone and gold.
    description: "Hagia Sophia's dome collapses in a quake and is rebuilt higher — resurrection in stone and gold; the church that wouldn't die."
    status: "published"
    sha256: "88578edc6c80ba1b28f63927e99f7af31e007fab2e48706e694febe9c3d5025a"
  - number: "1663"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Avars Arrive"
    date: "558 CE"
    region: "Steppe"
    poem: |
      New riders appeared — the Avars, on the Danube frontier:
      another nomad people, another age of migrations beginning.
      I watched them from the walls: the horse-archers,
      the strange armor, the demands for gold.
      Constantinople would pay them, fight them, survive them.
      The Avars would build an empire in Hungary,
      besiege the great city, and vanish.
      The steppe kept sending peoples west —
      Huns, Avars, Bulgars, Magyars —
      each one remaking Europe a little more.
      Horse-archers on the Danube, demanding gold.
      Constantinople would pay them, fight them, survive them.
      An empire in Hungary, a siege of the great city — then gone.
      The steppe kept sending peoples west.
    description: "Avar riders appear on the Danube — another age of migrations; the steppe keeps sending peoples west, each remaking Europe."
    status: "published"
    sha256: "b52557550a9deda589f6e979926cfa0bc1a806bf3f1d42a26a5fc9065c63096a"
  - number: "1664"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Hanging Poems"
    date: "560 CE"
    region: "Arabia"
    poem: |
      They hung them in gold — the desert's greatest odes,
      the Mu'allaqat, at the Kaaba's door: tradition says.
      Seven poems, embroidered in gold, hung for all to see.
      I stood before them: the verses of Imru' al-Qais,
      of Antara, of Labid — love, war, the desert's beauty.
      Pre-Islamic Arabia's soul, in poetry.
      The finest Arabic poetry ever written,
      hung where the pilgrims could read it.
      Ten years later, Muhammad would be born into this world
      of poets — and the Qur'an would answer them
      in kind.
      Seven odes, embroidered in gold, hung at the Kaaba.
      Imru' al-Qais, Antara, Labid — love, war, desert beauty.
      The finest Arabic poetry ever written.
      Ten years later, the Qur'an would answer in kind.
    description: "The desert's greatest odes hung in gold at the Kaaba — pre-Islamic Arabia's soul in poetry, ten years before Muhammad's birth."
    status: "published"
    sha256: "5914c8bd5be192f501e09f7a42703071111146110d39436dfa0aa5fe84bf44b5"
  - number: "1665"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Fifty Years' Peace"
    date: "562 CE"
    region: "Persia"
    poem: |
      They signed it — Justinian and Khosrow:
      fifty years' peace between Rome and Persia.
      I stood at the border as the treaty was proclaimed:
      the silk road flowing freely, the merchants rejoicing.
      Fifty years. It wouldn't last fifty years —
      but for a while, the two great empires rested.
      Gold changed hands. Prisoners were exchanged.
      The world exhaled.
      Rome and Persia, at peace: the rarest thing
      in four hundred years of rivalry.
      It was worth celebrating, even knowing
      it wouldn't hold.
    description: "Justinian and Khosrow sign fifty years' peace — the silk road flows; the rarest thing in four centuries of rivalry, worth celebrating."
    status: "published"
    sha256: "8b7f195dc52336d5ab06658771805d7d41235be3bc6d4caba5755d9161b46987"
  - number: "1666"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Columba's Island"
    date: "563 CE"
    region: "Scotland"
    poem: |
      The Irish monk founded it — Iona, Columba's island:
      Christianity reached Scotland's shores.
      I sailed with him to that windswept rock:
      the monastery rising, the monks copying,
      the Picts listening to the gospel.
      Columba — passionate, proud, exiled for a bloody battle
      over a copied book.
      From Iona, the faith spread through Scotland —
      and back into England, when the time came.
      A small island, a stubborn monk,
      and the conversion of a nation.
      Exiled for a bloody battle over a copied book.
      He sailed to a windswept rock and built a monastery.
      From Iona the faith spread through Scotland.
      A small island, a stubborn monk, a nation's conversion.
    description: "Columba founds Iona — a windswept rock, a stubborn exiled monk, and the conversion of Scotland begins."
    status: "published"
    sha256: "3ceac455837a23bc6e362f361efcbe14bb5eca6b1f89ccd2d6e478d8d5ec5998"
  - number: "1667"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Justinian Dies"
    date: "565 CE"
    region: "Constantinople"
    poem: |
      He died at eighty-three — Justinian, the great emperor:
      the Code, the dome, the reconquests, the plague.
      I stood in the funeral procession through Constantinople.
      His dreams had outrun his empire's strength —
      Africa taken, Italy ruined, the treasury empty,
      the plague's shadow over everything.
      The last Roman. They called him the Great,
      and he was — great in ambition, great in achievement,
      great in the wreckage he left behind.
      The empire survived him. Barely.
      The dream didn't.
      Eighty-three years old — the Code, the dome, the reconquests.
      Africa taken, Italy ruined, the treasury empty.
      They called him the Great, and he was —
      great in the wreckage he left behind.
    description: "Justinian dies at eighty-three — his dreams outran his empire's strength; the last Roman, great in achievement and wreckage."
    status: "published"
    sha256: "546f601aef0b27c996ec50827bfaea797cbe99a45213aec54df69029e75786e5"
  - number: "1668"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Lombards Invade"
    date: "568 CE"
    region: "Italy"
    poem: |
      They poured in — Alboin's Lombards, into Italy:
      the peninsula Justinian had bled to retake,
      splintered for centuries.
      I watched them come over the Alps: the long-bearded warriors,
      the families, the whole people migrating.
      Italy broke into pieces — Lombard north, Byzantine south,
      the pope in the middle.
      It would stay broken for a thousand years.
      Justinian's reconquest, undone in a generation.
      The Lombards gave their name to Lombardy
      and their chaos to Italy.
      Over the Alps they came — the long-bearded Lombards.
      The peninsula splintered: Lombard north, Byzantine south.
      A thousand years of broken Italy began.
      Justinian's reconquest, undone in a generation.
    description: "Alboin's Lombards pour into Italy — Justinian's reconquest undone in a generation; the peninsula splinters for centuries."
    status: "published"
    sha256: "910f5b9b6df0eba108085aa075e7524eade54cc737db3eeaac0406a626f34838"
  - number: "1669"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Abraha Marches on Mecca"
    date: "569 CE"
    region: "Arabia"
    poem: |
      He marched with elephants — Abraha, the Yemeni viceroy,
      against Mecca: war elephants, an army, the Kaaba his target.
      Tradition says the birds stopped him —
      flocks of birds, dropping stones, and the army melted away.
      I watched that column from the hills: the elephants,
      the dust, the impossible sight of it.
      Whether birds or plague or something else,
      the march failed. Mecca was spared.
      The Qur'an remembers it: the Year of the Elephant.
      And in that year, a boy was born in Mecca.
      War elephants on the road to Mecca — the Kaaba his target.
      Flocks of birds, dropping stones — tradition says.
      Whether birds or plague, the march failed.
      The Year of the Elephant. Mecca was spared.
    description: "Abraha marches on Mecca with elephants; tradition says birds stopped him — the Year of the Elephant, and a boy born in it."
    status: "published"
    sha256: "5e43f49a08d4e10abfcc75ee4ef3835a7eb0231a53664664a584ad9b031d12bb"
  - number: "1670"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Year of the Elephant"
    date: "570 CE"
    region: "Arabia"
    poem: |
      In the year of Abraha's march, a boy was born at Mecca —
      Muhammad, of the Quraysh, orphaned young, raised by his uncle.
      I hold no omens over that cradle. There were none visible.
      Just a boy, in a desert trading town,
      in the year of the elephants.
      Nobody — not the rabbis, not the bishops, not the emperors —
      noticed.
      The most consequential birth of the millennium,
      and the world yawned.
      History's hinges are small. This one was a baby's cry
      in Mecca, in 570.
      Orphaned young, raised by his uncle, in a desert trading town.
      No omens. No notice. The world yawned.
      The rabbis, the bishops, the emperors — none of them knew.
      A baby's cry in Mecca, in 570.
    description: "In the Year of the Elephant, Muhammad is born at Mecca — the most consequential birth of the millennium, and the world yawns."
    status: "published"
    sha256: "1ab86b5dc52daef99dfc2db3dd89aedcd972bfa53b8739ed676aaf6c784f2e88"
  - number: "1671"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Hospital at Gondeshapur"
    date: "571 CE"
    region: "Persia"
    poem: |
      They taught together — Persian, Greek, and Indian doctors,
      at Gondeshapur: the great academy, the great hospital.
      I walked its wards: the students, the texts translated,
      the surgeries performed, the herbs catalogued.
      The world's first teaching hospital, some say —
      where medicine was studied systematically,
      where the Greek, Persian, and Indian traditions met.
      Khosrow's Persia, at its most enlightened.
      The knowledge gathered here would flow into Arabic medicine,
      and from there to the world.
      Healing, without borders.
      Persian, Greek, Indian — teaching together at Gondeshapur.
      Texts translated, surgeries performed, herbs catalogued.
      Khosrow's Persia at its most enlightened.
      The knowledge would flow into Arabic medicine, and to the world.
    description: "Persian, Greek, and Indian doctors teach together at Gondeshapur — the world's first teaching hospital; healing without borders."
    status: "published"
    sha256: "fdb63329f2f99478b724ba0bf90e5ce0aa45fce2c149e402505cf66da9d6d63a"
  - number: "1672"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "War Returns"
    date: "572 CE"
    region: "Persia"
    poem: |
      The fifty years' peace broke — ten years early:
      Rome and Persia bled each other again.
      I stood on the frontier as the armies marched:
      the same roads, the same fortresses, the same futile war.
      Justin II had torn up the treaty. Khosrow answered with invasion.
      Twenty years of war followed — the war that would exhaust
      both empires, leaving them hollow for the Arabs.
      They didn't know. They never know.
      The last great war of the ancient world began here,
      in broken promises on the Euphrates.
      Justin tore up the treaty; Khosrow answered with invasion.
      The same roads, the same fortresses, the same futile war.
      Twenty years that would exhaust both empires.
      Leaving them hollow for the Arabs.
    description: "The fifty years' peace breaks and Rome and Persia bleed each other again — the war that will leave both hollow for the Arabs."
    status: "published"
    sha256: "8517519f6b6939eb37e4bf7e903495318d334d9dec9ece37da01aa3340304a9c"
  - number: "1673"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Marib Dam Breaks"
    date: "575 CE"
    region: "Arabia"
    poem: |
      It burst — the ancient Marib dam, after seventeen hundred years:
      the wall gave way, and Yemen's green fields turned to dust.
      I stood on the broken embankment: the water gone,
      the silt, the silence where the sluices had sung.
      The Qur'an remembers it: the people of Saba,
      their gardens replaced with bitter fruit.
      A civilization's life-support, snapped.
      Yemen never recovered its ancient glory.
      Seventeen centuries of engineering, ended in a season.
      The desert took back its own.
      The wall gave way after seventeen hundred years.
      Water gone, silt, silence where the sluices had sung.
      Gardens replaced with bitter fruit, the Qur'an says.
      Yemen never recovered its ancient glory.
    description: "The ancient Marib dam bursts after seventeen hundred years — Yemen's green fields turn to dust; the desert takes back its own."
    status: "published"
    sha256: "4b0737b5489b5a8f86d8ef823fc059bb80cc6b8569a494fff657673c1eed01de"
  - number: "1674"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Northern Zhou Triumph"
    date: "577 CE"
    region: "China"
    poem: |
      The north united — under the Northern Zhou:
      the rival dynasties crushed, the road to a reunited China open.
      I marched with the Zhou armies: the swift campaigns,
      the fallen capitals, the north made one.
      It was the last step before the Sui —
      the Zhou did the conquering, the Sui would take the prize.
      History's janitors, clearing the stage.
      But the achievement was real: after two centuries of division,
      north China was whole.
      The south was next. The reunification was coming.
      The Zhou did the conquering; the Sui would take the prize.
      Swift campaigns, fallen capitals, the north made one.
      Two centuries of division, ending.
      The south was next. Reunification was coming.
    description: "The north unites under Zhou — history's janitors clearing the stage; after two centuries of division, the road to reunion opens."
    status: "published"
    sha256: "2aed258d6c2da9a6b7429849c9590a1768cb995c26d71b056f011669065d180b"
  - number: "1675"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Tiberius Takes the Crown"
    date: "578 CE"
    region: "Constantinople"
    poem: |
      A kindly emperor took it — Tiberius,
      who tried to buy peace with gold.
      I watched him rule: the openhanded gifts,
      the remitted taxes, the desperate generosity.
      The empire was bleeding — the Avars, the Persians, the Lombards —
      and Tiberius poured gold on the wounds.
      It didn't work. Gold doesn't stop armies.
      But he was kind, and kindness in an emperor
      is rarer than victory.
      He died in four years, worn out.
      The throne passed to Maurice, the soldier.
      The kindness ended. The wars didn't.
    description: "The kindly Tiberius tries to buy peace with gold — gold doesn't stop armies, but kindness in an emperor is rarer than victory."
    status: "published"
    sha256: "748ad77d498f38fd22ae5c78c76731a107463c2223b0a89ddc947dca07474b27"
  - number: "1676"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Sui Dynasty"
    date: "581 CE"
    region: "China"
    poem: |
      Yang Jian took the throne — as Wendi, first emperor of the Sui:
      China moved toward reunion.
      I stood in the new capital at Chang'an:
      the ambition, the planning, the great projects beginning.
      Wendi was a builder and a organizer —
      the canals, the granaries, the examinations taking shape.
      In eight years, he would reunite China.
      The Sui would be brief — two emperors, thirty-seven years —
      but they laid the foundation the Tang would build on.
      Reunion was coming. You could feel it in the air.
      Yang Jian, Wendi — builder and organizer.
      Canals, granaries, examinations taking shape.
      Two emperors, thirty-seven years — brief, but foundational.
      The Tang would build on what the Sui laid down.
    description: "Yang Jian takes the throne as Wendi — the Sui moves China toward reunion; brief, but laying the foundation the Tang will build on."
    status: "published"
    sha256: "62fc4aa611c20a4dff4ed0e42b3cede48e506fcd17dcbe1a7bb73d500d2c89b9"
  - number: "1677"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Maurice the Soldier"
    date: "582 CE"
    region: "Constantinople"
    poem: |
      The Balkan general became emperor — Maurice,
      the soldier: and the wars followed him everywhere.
      I marched with his armies: the Danube, the Euphrates,
      twenty years of campaigning.
      He wrote the Strategikon — the great military manual —
      while fighting the wars it described.
      Competent, honest, unloved: the troops hated his economies,
      the court hated his seriousness.
      He held the empire together by will alone.
      It would kill him, in the end — mutiny, and a winter's execution.
      But for twenty years, the soldier held the line.
      The Strategikon — written while fighting the wars it described.
      Competent, honest, unloved by troops and court.
      He held the empire together by will alone.
      Twenty years, the soldier held the line.
    description: "The Balkan general Maurice becomes emperor — twenty years of war, competent and unloved; the soldier holds the line."
    status: "published"
    sha256: "28903cad3007f9ed21ce5b320e32c0cfc0a3a06818a774be26c7e240212a1ae5"
  - number: "1678"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Chilperic's End"
    date: "584 CE"
    region: "Gaul"
    poem: |
      The Frankish king was murdered — Chilperic,
      and queens Brunhild and Fredegund tore Francia apart
      in their forty-year feud.
      I traveled through Francia in those years:
      the assassinations, the betrayals, the two queens
      like spiders in a burning web.
      Gregory of Tours wrote it all down, horrified and fascinated.
      The Merovingians at their worst: kin-killing, oath-breaking,
      a kingdom eating itself.
      Chilperic's murder was just the beginning.
      The queens' war would poison Francia for a generation.
      Brunhild and Fredegund — two queens like spiders in a web.
      Assassinations, betrayals, kin-killing, oath-breaking.
      Gregory of Tours wrote it all, horrified and fascinated.
      The queens' war poisoned Francia for a generation.
    description: "Chilperic is murdered and queens Brunhild and Fredegund tear Francia apart — a forty-year feud poisoning a kingdom."
    status: "published"
    sha256: "4652bf732a4708ad9cb9827cdb18bad1619c1de4be4e1fbfba6c15d7408c3ec0"
  - number: "1679"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Visigoths Unite Spain"
    date: "585 CE"
    region: "Spain"
    poem: |
      Leovigild crushed the Suebi — and nearly all Spain
      was Visigothic: one kingdom, from the Pyrenees to the sea.
      I rode through that united Spain: the Gothic counts,
      the Roman cities, the Arian king ruling Catholic subjects.
      It was the first united Spain — barbarian, but united.
      Leovigild the conqueror, Leovigild the lawgiver.
      His son would convert it to Catholicism.
      But the unity was his: one Spain, under one crown,
      for the first time since Rome.
      Leovigild crushed the Suebi; Spain was one.
      From the Pyrenees to the sea — Visigothic.
      An Arian king ruling Catholic subjects.
      One Spain, under one crown, for the first time since Rome.
    description: "Leovigild crushes the Suebi and nearly all Spain is Visigothic — the first united Spain since Rome, barbarian but one."
    status: "published"
    sha256: "5be0f9494861f0151fc173c4808912ed67fbf684b640fb95f0b35e18c62b7007"
  - number: "1680"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Reccared Turns Catholic"
    date: "586 CE"
    region: "Spain"
    poem: |
      The Visigoth king converted — Reccared, to Catholicism:
      and Spain joined Catholic Europe.
      I stood in the church at Toledo when the bishops proclaimed it:
      the Arian kingdom, become Catholic in a generation.
      Leovigild's son undoing Leovigild's church —
      but keeping Leovigild's kingdom.
      Spain's religious unity was born that year.
      The councils of Toledo would govern it —
      bishops and kings, ruling together.
      One faith, one kingdom. The Spanish Middle Ages began here.
      Reccared converted; Toledo proclaimed it.
      The Arian kingdom become Catholic in a generation.
      His father's church undone, his father's kingdom kept.
      One faith, one kingdom.
    description: "King Reccared converts and Spain joins Catholic Europe — one faith, one kingdom; the Spanish Middle Ages begin at Toledo."
    status: "published"
    sha256: "4b98aaf465ca3f94443895adfeab1dcaeb9a1863467d9db4b599c2ab37229a53"
  - number: "1681"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Bahram's Revolt"
    date: "587 CE"
    region: "Persia"
    poem: |
      The great general rose — Bahram Chobin, against the Persian king:
      the empire's finest soldier, in rebellion.
      I marched with his army: the veterans, the grievances,
      the general who had saved Persia now turning his sword on it.
      He won — briefly. Took the throne.
      Then Khosrow, with Roman help, took it back.
      Bahram fled east, and died assassinated.
      Persia's greatest general, destroyed by the politics
      he was too honest to play.
      The army's loyalty is a sword with two edges.
      Bahram Chobin — the army's hero, in rebellion.
      He took the throne, briefly, then lost it.
      Fled east, died assassinated.
      Too honest for politics. The sword has two edges.
    description: "The great general Bahram Chobin rises against the Persian king — Persia's finest soldier destroyed by politics too honest to play."
    status: "published"
    sha256: "b90642012d3b54bf759e41c5f4323e0408b6a1ef6fb7ab32fe93148c394a9cdc"
  - number: "1682"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "China Reunited"
    date: "589 CE"
    region: "China"
    poem: |
      The Sui armies took the southern capital —
      and four centuries of division ended.
      I stood in Jiankang as the Chen banners came down:
      the cheering, the weeping, one China again.
      Wendi had done it — the patient, methodical reunification.
      North and south, one empire, one law, one script.
      Four hundred years of warlords, kingdoms, chaos —
      over.
      The Sui would fall quickly. The Tang would inherit.
      But the division was over. China was whole.
      The longest breakup in history, finally mended.
      The Chen banners came down at Jiankang.
      North and south, one empire, one law, one script.
      Wendi's patient, methodical reunification.
      Four hundred years of division — over.
    description: "Sui armies take the southern capital; four centuries of division end — the longest breakup in history, finally mended."
    status: "published"
    sha256: "411fd760a3a66e79b349630c2c6453f6210102c18d2faba4b42b65da16049632"
  - number: "1683"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Gregory the Great"
    date: "590 CE"
    region: "Rome"
    poem: |
      A monk became pope — Gregory, the Great:
      and he would send missionaries to England's shores.
      I watched him work: the letters, the reforms,
      the chant that bears his name,
      the papacy remade as a power of mercy and order.
      Rome was a ruin, the Lombards at the gates —
      and Gregory governed it like a father.
      He saw the English slaves in the market and wept:
      "Not Angles, but angels."
      The mission to Kent was born in that moment.
      The Middle Ages' greatest pope, and he wanted only
      to be a monk.
    description: "The monk Gregory becomes pope — governing ruined Rome like a father, and sending missionaries to England's shores."
    status: "published"
    sha256: "749e26be57e7b66e6dd077e16dbfc823f774330d9d69d8650a955daf24af5549"
  - number: "1684"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Khosrow Restored"
    date: "591 CE"
    region: "Persia"
    poem: |
      With Roman help, he regained it — Khosrow II,
      restored to Persia's throne by Maurice's armies.
      I watched the coronation: the young king,
      the Roman alliance, the peace that followed.
      It was the high point of Rome-Persia friendship —
      and it wouldn't last.
      Khosrow would remember the help — then forget it,
      when Maurice was murdered and revenge called.
      The last great war was brewing: twenty-five years
      that would bleed both empires white.
      In 591, though, there was hope —
      a restored king, a Roman friend, a peace.
    description: "With Roman help, Khosrow II regains Persia's throne — a restored king, a Roman friend, a peace; the last great war brewing underneath."
    status: "published"
    sha256: "6e228e8c74d8c36f7203745b8e6e5fa6765a53894b71b07649f4d55a06181dc0"
  - number: "1685"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "An Empress Takes the Throne"
    date: "592 CE"
    region: "Japan"
    poem: |
      She ascended — Empress Suiko, Japan's first reigning empress:
      and Prince Shotoku would soon guide Japan's rebirth.
      I stood in the court at Asuka: the empress,
      the prince regent, the great reformers.
      Japan was remaking itself — the constitution,
      the Buddhism, the Chinese learning.
      Suiko reigned for thirty-six years —
      the steady hand behind the transformation.
      A woman on the throne, in the sixth century,
      guiding a nation's rebirth.
      Japan's Asuka enlightenment began with her.
      Thirty-six years she reigned — the steady hand.
      Prince Shotoku's reforms, the constitution, the learning.
      A woman on the throne in the sixth century.
      Japan's enlightenment began with her.
    description: "Empress Suiko ascends — Japan's first reigning empress; thirty-six years of steady hands guiding a nation's rebirth."
    status: "published"
    sha256: "c50c4b1d8500c4b09819696dc69028828bc7e113344a9f32a5b6f6fd56160a28"
  - number: "1686"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Maurice's Balkan Wars"
    date: "593 CE"
    region: "Balkans"
    poem: |
      The emperor's armies pushed them back —
      the Slavs and Avars, across the Danube:
      Maurice's Balkan wars, year after year.
      I marched those campaigns: the river crossings,
      the burned villages, the slow grind of frontier war.
      Maurice was winning — actually winning —
      when the army mutinied over winter campaigning
      and pay cuts.
      The empire's best general-emperor, undone
      by his own soldiers' greed.
      The Balkans would fall to the Slavs within a generation.
      But in 593, the legions were winning.
    description: "Maurice's armies push Slavs and Avars back across the Danube — winning, until his own soldiers' greed undoes him."
    status: "published"
    sha256: "4ae5651407a04b7f87a737335aeaed9948bd4d55b44d84bc485f0d2c750ddc27"
  - number: "1687"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "A Marriage at Mecca"
    date: "595 CE"
    region: "Arabia"
    poem: |
      The merchant married — Muhammad, twenty-five,
      to Khadija, the wealthy widow, forty:
      a marriage of love and respect, by all accounts.
      I stood outside their house in Mecca: the caravans,
      the trade, the quiet years.
      Fifteen years of marriage before the revelation —
      Khadija his first believer, his comfort, his strength.
      She believed him when no one else did.
      Every prophet needs one person who believes first.
      Muhammad had Khadija.
      The marriage at Mecca: the calm before the storm
      that would remake the world.
    description: "Muhammad marries the wealthy widow Khadija — fifteen quiet years; every prophet needs one person who believes first."
    status: "published"
    sha256: "ad89c62b685847a703ccb9cfc1d0d5c49137e477963e3ec9d504bbeaa8406c79"
  - number: "1688"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Augustine's Mission"
    date: "596 CE"
    region: "England"
    poem: |
      Gregory sent him — Augustine, the prior, to Kent:
      England's conversion begins.
      I sailed with that mission: forty monks,
      frightened, landing on the Kentish shore.
      King Ethelbert listened. His wife was already Christian.
      The monks preached, the king pondered —
      and England began its long turn to the faith.
      Augustine of Canterbury — not the great Augustine,
      but the missionary.
      A prior with a pope's letter, forty companions,
      and a kingdom to convert.
      Forty monks landing on the Kentish shore, frightened.
      Ethelbert listened; his queen was already Christian.
      The monks preached, the king pondered.
      A prior, a letter, forty companions — and a kingdom.
    description: "Gregory sends Augustine to Kent — forty frightened monks on a Kentish shore; England's conversion begins."
    status: "published"
    sha256: "be2980fc6b94a818efb92f37008bb35248a8e1cfa79d44c8b2354a5b1addeed0"
  - number: "1689"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Canterbury Founded"
    date: "597 CE"
    region: "England"
    poem: |
      He baptized the king — Augustine baptized Ethelbert,
      at Canterbury: and the English church was born.
      I stood in the river as the king went under:
      the first Christian king of the English.
      Canterbury became the see, the center —
      fourteen hundred years of archbishops starting here.
      The mission succeeded beyond Gregory's dreams.
      England — the island at the world's edge —
      joined the Christian world.
      From this baptism: cathedrals, monasteries,
      the whole English church, the language of prayer
      you're reading now.
    description: "Augustine baptizes King Ethelbert at Canterbury — the English church is born; fourteen hundred years of archbishops begin."
    status: "published"
    sha256: "e63efec7b8a0bc2727c994276f29542b215888db232b5485b71c136d62ef77d2"
  - number: "1690"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Goguryeo Holds the Line"
    date: "598 CE"
    region: "Korea"
    poem: |
      The northern kingdom held — Goguryeo,
      against Sui China's first great invasion:
      the massive armies broke on Korean fortresses.
      I stood on those walls: the Sui host below,
      the Korean defenders above, the impossible odds.
      China had reunited and looked outward —
      and Korea said no.
      The Sui would try again. And again.
      Goguryeo would hold, every time,
      until the Tang finally brought it down.
      But in 598, the small kingdom stood —
      and the great empire bled.
    description: "Goguryeo repels Sui China's first great invasion — the small kingdom stands, and the great empire bleeds on Korean walls."
    status: "published"
    sha256: "951e481302bea18c572b9e3079d8313197d7c6ffd8657f4b98ec08194e898b8b"
  - number: "1691"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Turk Khaganate Splits"
    date: "599 CE"
    region: "Steppe"
    poem: |
      It divided — the great Turk khaganate:
      east and west, two empires where one had been.
      I rode the steppe that year: the tribal councils,
      the rival khagans, the breaking of the greatest nomad power
      the world had seen.
      The Turks had ruled from Mongolia to the Black Sea.
      Now they split — and the split weakened them,
      and China played them against each other.
      The steppe's unity was always fragile.
      One khaganate, two sons, and the old story:
      divide, and be ruled.
      From Mongolia to the Black Sea, one khaganate — then two.
      The tribal councils, the rival khagans, the breaking.
      China played east against west, as empires do.
      The steppe's unity was always fragile.
    description: "The great Turk khaganate divides east and west — the steppe's unity always fragile; divide, and be ruled."
    status: "published"
    sha256: "53e02d1e9c3a26bb2aa65fcee2a777bdf2c9d9189b83e2c023eddf588c16e2a7"
  - number: "1692"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "Palenque Rising"
    date: "600 CE"
    region: "Maya"
    poem: |
      A new dynasty raised it — Palenque, toward its golden age:
      the temples, the palaces, the carved tablets.
      I walked its plazas when the stones were new:
      the Temple of the Inscriptions rising,
      the scribes carving the history of kings.
      Pakal would come — the great king, the long reign —
      and Palenque would become the jewel of the Maya world.
      While Europe stumbled through the dark,
      the Maya were building in the jungle light.
      The world doesn't end everywhere at once.
      In Palenque, it was morning.
      The Temple of the Inscriptions rising in the jungle.
      Scribes carving the history of kings into stone.
      Pakal would come — the great king, the long reign.
      In Palenque, it was morning.
    description: "A new dynasty raises Palenque toward its golden age — while Europe stumbles, the Maya build in the jungle light; in Palenque, morning."
    status: "published"
    sha256: "af10c130464ec7b0db06fc082327391bc58d8061598c973932649c1d0be34074"
  - number: "1693"
    volume: 3
    era_code: "06"
    era: "Empires of Faith"
    title: "The Ancient World Closes"
    date: "600 CE"
    region: "Constantinople"
    poem: |
      It ended — the old Roman world:
      not with a battle, but with a turning.
      I stood in Constantinople at the century's turn
      and felt it: the ancient age exhaling its last.
      The West was kingdoms now — Franks, Visigoths, Lombards.
      The East was Byzantium, Greek-speaking, Christian.
      China was reunited. India was golden.
      Islam was coming — the boy born in 570 was forty now,
      and the revelation was near.
      The medieval age began.
      I had walked it all — six hundred years of empires of faith —
      and I tell you: nothing ends. It only changes hands.
    description: "The old Roman world ends and the medieval age begins — six hundred years of empires of faith; nothing ends, it only changes hands."
    status: "published"
    sha256: "7ae3dd89477e2e11a4caba7facc7d9838c6c146feccd6e87c84af0a6456465c7"
  - number: "1694"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The City That Fell Silent"
    date: "600 CE"
    region: "Mesoamerica"
    poem: |
      I walked Teotihuacan when the smoke was fresh,
      avenues I had known full of shouting —
      empty now as a held breath.
      The pyramids stood the way mountains stand:
      patient, watching the street
      where no one passed.
      I picked up a child's clay whistle by the steps.
      It sang one note. The city answered with none.
      Who left? They never wrote it down.
      Fire took the roofs; time took the names;
      only the stones refused to move.
    description: "A traveler walks through freshly burned Teotihuacan, its great pyramids still standing over silent avenues, and keeps a child's whistle — the only voice left."
    status: "published"
    sha256: "bcec84595688bd5b431c4e9835d3c6d982f67583d55f4aa8a03e80212391d1dd"
  - number: "1695"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Trusted Trader"
    date: "601 CE"
    region: "Arabia"
    poem: |
      I rode with the caravan out of Mecca,
      a young merchant keeping the tallies
      straight as a plumb line.
      While the others haggled and swore,
      he measured twice and paid once —
      even the thieves nodded him through.
      They called him al-Amin. The trustworthy.
      Not yet a prophet. Just a man
      whose word weighed more than his goods.
      I remember his laugh on the night road,
      ordinary as bread, and think:
      some lamps are lit long before dawn.
    description: "A caravan companion remembers young Muhammad's honesty on the trade roads, earning him the name \"the trustworthy\" before any revelation came."
    status: "published"
    sha256: "ef5619068aebc370527d90d286039da01d25c60c871016e1eeb7187d456448df"
  - number: "1696"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Centurion's Coup"
    date: "602 CE"
    region: "Byzantium"
    poem: |
      The soldiers lifted Phocas on their shields at dawn —
      a hard man with a harder fist,
      a crown on a head meant for a helmet.
      The palace opened its gates to him.
      Constantinople learned the old lesson over again:
      an empire that kneels to a sword
      will bleed by it too.
      In the east, Persia smelled the weakness
      like lions smell a wounded stag.
      I watched the torches change hands on the walls
      and knew the long war had only been napping.
    description: "Phocas seizes the throne by military coup; the narrator sees the transfer of power and feels Persia waking again across the frontier."
    status: "published"
    sha256: "15067bbf501923eb0c81f52673f44406ab69f3e3c15be09d0759980a364689fd"
  - number: "1697"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "A King Is Born"
    date: "603 CE"
    region: "Maya Lands"
    poem: |
      In Palenque a child cried his first cry
      while the jungle pressed green against the stone —
      a boy named Pakal, "Shield."
      Sixty-eight years he would wear the jade.
      I held no omens that morning,
      only watched the midwives smile.
      But the priests counted on their knotted cords,
      and the carvers already sharpened their chisels.
      Some kings are born; some are announced.
      Palenque's greatest was both,
      and the rainforest bowed without a word.
    description: "A newborn Pakal's first day in Palenque, with priests and carvers already preparing for the sixty-eight-year reign to come."
    status: "published"
    sha256: "21bc814075fcc7a0223ca47387946abc6bdd061f987219b9deffa7d389fef6ee"
  - number: "1698"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Seventeen Articles"
    date: "604 CE"
    region: "Japan"
    poem: |
      Shotoku sat with brush and paper
      and wrote what no Japanese hand had written:
      rules for being a state.
      Harmony above all — the first line,
      and then, like stones in a garden,
      sixteen more.
      The court nobles read them, puzzled,
      like farmers handed a map of stars.
      But I saw the future in that ink:
      a country learning to govern itself
      by something stronger than blood —
      an idea, set down, kept.
    description: "Prince Shotoku drafts Japan's first constitution of seventeen articles, turning the idea of harmony into the foundation of a state."
    status: "published"
    sha256: "8629fe6b01874acf8be9bf7d6fa5b90c09868c408d8d3170a5692eea3fa6e340"
  - number: "1699"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Last Letter of Gregory"
    date: "604 CE"
    region: "Rome"
    poem: |
      Gregory died as he had lived: writing.
      The Great — so they call him —
      a Roman who fed the hungry,
      sent monks to England's shores,
      and ran the Church like a household
      when emperors could not run an empire.
      I stood outside his chambers and heard the scratching stop.
      What he left was not gold or land.
      It was an organization —
      a machine of mercy and memory
      built to outlast the Caesars.
      The letter was sealed. The work went on.
    description: "At Gregory the Great's deathbed, the narrator reflects on a church he organized so well it could survive the fall of everything else."
    status: "published"
    sha256: "6a4d156553fe35ba3ae00afc8c5fd6b1886d48b4f22ee53a8426dca9d505f1b5"
  - number: "1700"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "A Million Hands on the Canal"
    date: "605 CE"
    region: "China"
    poem: |
      I saw the line of diggers stretch to the horizon,
      a river of men carving a river.
      Emperor Yang's dream:
      bind north to south with water,
      let grain float where armies marched.
      They dug with bare hands and baskets,
      and the canal grew — a thousand miles of water,
      the longest ditch ever cut by human hands.
      Children of that age would sail it,
      eat from it, grow rich on it.
      But I saw the blisters bleed,
      and heard the overseers' whips,
      and knew: every wonder has a price,
      and this one was paid in flesh.
    description: "The Grand Canal's construction as a human sea of laborers — a wonder that will feed China for centuries, bought with the suffering of its builders."
    status: "published"
    sha256: "fb401e8dc9532c0cdbc3a42d3dd67ded80ee332aa3e209c9aee6f6f7e7e074a3"
  - number: "1701"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Boy King of Thanesar"
    date: "606 CE"
    region: "India"
    poem: |
      Sixteen years old and the throne was broken,
      the kingdom scattered like dropped grain.
      Harsha took it anyway.
      He did not wait to grow older —
      he rode, he fought, he forgave,
      and welded the pieces into an empire
      the color of a monk's robe.
      They say he gave everything away
      at his great almsgivings, twice over.
      A king who owned nothing and ruled all —
      I watched him from the crowd at Prayag
      and understood: the strongest crown
      is the one a man will set down himself.
    description: "Young Harsha builds India's last great Buddhist empire from a shattered throne, a ruler famous for giving away everything he owned."
    status: "published"
    sha256: "523f500d4ccda60c28bfb3ff384485bb95248d5b3b6e0dc2e68301622e7ff5fc"
  - number: "1702"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Envoy to the Sui"
    date: "607 CE"
    region: "Japan"
    poem: |
      Ono no Imoko sailed from Japan
      with a letter the Chinese court
      had never received before:
      from the Son of Heaven of the Land of the Rising Sun
      to the Son of Heaven of the Land of the Setting Sun.
      Equal to equal. Dawn to dusk.
      The Sui emperor read it and his brows rose —
      the little islands had found their voice.
      I stood on the dock and watched the sails go.
      Some letters carry silk or tribute.
      That one carried something heavier:
      a nation deciding it was a nation.
    description: "Japan's first embassy to China arrives carrying a letter that addresses the Sui emperor as an equal — an island nation declaring itself."
    status: "published"
    sha256: "b3fe91838228d3a7f89618b47920e2c2d2fda0e2bc6ac9b9b0b7486ecc8a52ba"
  - number: "1703"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Wall Against the Sui"
    date: "608 CE"
    region: "Korea"
    poem: |
      On the fortresses of Goguryeo
      I watched the stonemasons work double time,
      raising walls stone on stone
      against the coming storm.
      Emperor Yang was gathering armies
      like a man gathers firewood —
      a million strong, they said.
      The Koreans did not tremble.
      They packed grain, sharpened spears,
      and waited behind their cliffs
      with the calm of people who had beaten giants before.
      A wall is just stone, the old soldiers told me.
      It is the standing behind it that matters.
    description: "Goguryeo strengthens its mountain fortresses as the Sui emperor masses an enormous invasion army across the border."
    status: "published"
    sha256: "6f66f34a7543adf992715ea5ca34e4c8cc96fa282a53ce2193e4a7b215b7edfb"
  - number: "1704"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Heraclius Takes the Helm"
    date: "610 CE"
    region: "Byzantium"
    poem: |
      He sailed into Constantinople on ships with icons on the sails,
      a young general with a hard jaw and a harder task:
      depose the tyrant Phocas,
      then inherit his disaster.
      Persia held the east. The treasury was bare.
      The empire was a ship with a torn sail
      in a hurricane.
      I watched Heraclius climb the palace steps
      and thought of men who take the helm
      precisely because the storm is worst.
      He would spend twenty years at war.
      He had no idea. He went anyway.
    description: "Heraclius overthrows Phocas and inherits an empire that Persia is devouring — a young general taking command in the middle of a storm."
    status: "published"
    sha256: "e9a32b2e3e01fa8d134adeef5eb6e7a9535b2487f204e95fc59a4b583b6a2590"
  - number: "1705"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The River Runs Red"
    date: "612 CE"
    region: "Korea"
    poem: |
      Three hundred thousand Sui soldiers crossed the Salsu,
      and Eulji Mundeok was waiting.
      He let them drink the river dry —
      then opened the dam upstream
      and drowned the army in its own thirst.
      I walked that bank after.
      The water ran red for a day and a night.
      Of all those invaders, a handful crawled home.
      A small kingdom, a clever general,
      and a river — that was enough
      to break the pride of an emperor
      who thought numbers were destiny.
    description: "General Eulji Mundeok annihilates a massive Sui invasion army at the Salsu River with a burst dam — one of history's great underdog victories."
    status: "published"
    sha256: "330007783b8d786cf8b5bafd90901cb78b56cf25ca297b113d704fa27b91260a"
  - number: "1706"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Canal Turns Bitter"
    date: "613 CE"
    region: "China"
    poem: |
      The canal was built. The armies were broken.
      The people had paid twice — once in sweat, once in blood —
      and Emperor Yang still wanted more:
      more palaces, more wars, more glory.
      So the starving rose.
      Farmers with hoes, soldiers with empty bellies,
      a rebellion like floodwater finding every crack.
      I heard the drums in the villages.
      The Sui had dug a canal to join China together;
      now the whole land was digging it a grave.
      Empires do not fall when the army breaks.
      They fall when the hungry stop believing.
    description: "Starving laborers and ruined soldiers rise against Emperor Yang — the Sui dynasty, builder of the Grand Canal, begins to crack under rebellion."
    status: "published"
    sha256: "a5c84fd611007fa1e07c1451d653fb00aac08254698940a9981716cdb7fd152c"
  - number: "1707"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The City Changes Hands"
    date: "614 CE"
    region: "Jerusalem"
    poem: |
      The Persians took Jerusalem,
      and the holiest prize of Christendom
      went east in chains:
      the True Cross, carried off
      like common loot.
      I stood among the weeping crowds
      at the city gate.
      Empires had traded this city
      for a thousand years —
      but this felt different.
      The cross of the crucifixion,
      in the hands of the fire-worshippers.
      It was not just a defeat.
      It was a desecration,
      and the whole Christian world
      held its breath for revenge.
    description: "Persian armies capture Jerusalem and carry away the True Cross — a blow to Christendom that demands an answer."
    status: "published"
    sha256: "eb5a0348ee4afae12e3c7b5f85af58870d49e391e98df8cab944ab357e7e2fe8"
  - number: "1708"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Crossing to Abyssinia"
    date: "615 CE"
    region: "Arabia"
    poem: |
      They could not stay in Mecca —
      the persecution had turned to open cruelty.
      So a small band of believers sailed the Red Sea
      to Abyssinia, to a Christian king,
      and asked for shelter.
      I was on that shore when they landed,
      thin and frightened, clinging to their faith.
      The Negus heard them out,
      and would not hand them back.
      A Muslim community, sheltered by Christians —
      the first time the new faith
      found mercy in a foreign land.
      Mercy, I learned, does not ask what you believe.
    description: "Persecuted early Muslims flee across the Red Sea to Christian Abyssinia, where the Negus protects them from Mecca's hunters."
    status: "published"
    sha256: "e814903960a821855e1c3c89587b583b55073572a5169c29b31a5f7761a1041c"
  - number: "1709"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Shrinking Empire"
    date: "616 CE"
    region: "Byzantium"
    poem: |
      I traveled with Heraclius's court that year,
      and every road brought worse news:
      Syria falling, Egypt falling,
      the Persians at the gates of the sea.
      The emperor stood over his maps
      like a man watching his house burn room by room.
      But behind the despair I saw something else —
      he was melting the church plate for coin,
      forging a new army from farmers and priests' sons,
      quiet as a blacksmith.
      Empires do not die all at once, he told me.
      They die when the men at the top stop trying.
      He had not stopped.
    description: "Heraclius watches his empire shrink province by province while quietly rebuilding an army from nothing — refusing to stop trying."
    status: "published"
    sha256: "27c8feaa6113e294d3b5e12df7619efb171f9fb3d25ecd6a5f9d97792fece19f"
  - number: "1710"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Old General Rebels"
    date: "617 CE"
    region: "China"
    poem: |
      Li Yuan was supposed to guard the frontier at Taiyuan —
      an old soldier, dutiful, quiet.
      Instead he raised a banner
      and marched south on the crumbling Sui.
      I saw him pass with his troops,
      a grandfather going to war
      against an empire.
      The people lined the roads.
      They did not cheer; they joined.
      That is how dynasties truly change hands —
      not when a general decides to rebel,
      but when a whole country
      decides to walk with him.
    description: "Li Yuan raises the banner of rebellion at Taiyuan and marches on the Sui — and the people fall in behind him, ending a dynasty."
    status: "published"
    sha256: "a4890b1c12f7edc3e5b6138f07b9f550e960a1a28d25779c8cb7c57b4695ef53"
  - number: "1711"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Tang Begins"
    date: "618 CE"
    region: "China"
    poem: |
      Li Yuan took Chang'an and the Sui was done —
      a new dynasty, the Tang,
      proclaimed over the rubble.
      No one that day could see what was coming:
      the golden age of poets,
      the open roads, the cosmopolitan streets,
      two centuries of the most brilliant China
      the world had ever seen.
      I stood in the square as the drums beat.
      A dynasty is a gamble, the old men said,
      placed by a whole people on one family.
      This one would pay out beyond imagining.
    description: "The Tang dynasty is proclaimed at Chang'an — the narrator glimpses the golden age of poetry and empire about to dawn."
    status: "published"
    sha256: "6ab08c0a4d3940555d4b853e5a287227147b5dbd37221ea828d102f38fc5158c"
  - number: "1712"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Counting the People"
    date: "619 CE"
    region: "China"
    poem: |
      The Tang clerks went out with brushes and ledgers,
      knocking on every door from the Yellow River to the sea,
      counting households, measuring fields.
      Boring work. The most important work there is.
      On those numbers the whole golden age would stand —
      taxes fair enough to pay, land divided enough to farm,
      a government that knew its people by name.
      I watched a clerk share his rice with a farmer
      while he wrote down the man's three sons.
      Empires are not built by emperors, I thought.
      They are built by men with lists.
    description: "Tang clerks register every household and field — the unglamorous census work that lays the tax base for a golden age."
    status: "published"
    sha256: "26e30b5e2cba156e2e1ab91a90f2395908ef352a0065b2cfdb70a570f8a01f60"
  - number: "1713"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Night Journey"
    date: "620 CE"
    region: "Arabia"
    poem: |
      He told them he had been taken in the night —
      from Mecca to Jerusalem,
      and then up through the heavens themselves,
      past prophets and angels,
      to the edge of the divine.
      Some laughed. Some doubted.
      His closest believed.
      I was not on that journey;
      no one was, but him.
      Yet I watched what it did to his followers —
      it set their faith on stone.
      A man who has stood that close to heaven
      does not fear the earth.
      The Night Journey became the heart of their devotion:
      proof that the distance between God and man
      can be crossed in a single night.
    description: "Muhammad's night journey to Jerusalem and through the heavens — an experience no one shared, that became the anchor of his followers' faith."
    status: "published"
    sha256: "767dd8275f86d59aa8d3334e53c18e3d604c47ced5af373cfcb6d5143561e317"
  - number: "1714"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Pledges at Aqaba"
    date: "621 CE"
    region: "Arabia"
    poem: |
      In the hills above Mecca, by night,
      men from Yathrib came in secret
      and swore to protect him —
      with their hands, their homes, their lives.
      I stood in the dark and heard the pledges,
      quiet as oaths always are
      when they matter most.
      Mecca had rejected him.
      So the road north opened.
      A city waited that did not yet know
      it would be called the City of the Prophet,
      and its name would be spoken
      a billion times a day.
      All of it began with a few men
      whispering promises on a hillside.
    description: "Under cover of night, men of Yathrib pledge to protect Muhammad — the secret oaths that open the road out of Mecca."
    status: "published"
    sha256: "21d7df73d29a71306e182824a37a5855b5699c83b21647d6a1d27c7143e46baf"
  - number: "1715"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Hijra"
    date: "622 CE"
    region: "Arabia"
    poem: |
      They slipped out of Mecca like water through fingers —
      Muhammad and Abu Bakr,
      hiding in a cave while the hunters passed,
      spiders spinning webs over the entrance.
      I held my breath with them in the dark.
      Then north, to Yathrib — Medina —
      and a new calendar began:
      Year One.
      Not from a birth or a battle,
      but from a migration.
      I have crossed a thousand borders in my travels,
      but never one that remade time itself.
      The Hijra: the moment a faith
      packed its bags and walked into history.
    description: "The flight from Mecca to Medina — hidden in a cave, crossing into a new city and a new calendar, Year One of Islam."
    status: "published"
    sha256: "954808fe0906b60f96d2d8b0861943e19c52e157b5a1acca12fb4bfe48902e3b"
  - number: "1716"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The City of the Charter"
    date: "623 CE"
    region: "Medina"
    poem: |
      In Medina he sat down and wrote it:
      a pact binding Muslims, Jews, and pagan tribes
      into one community — one ummah —
      under one law.
      I read the charter by lamplight,
      line by line.
      It was not poetry. It was plumbing:
      who pays blood money, who answers the call to war,
      how disputes are settled.
      But plumbing is what makes a city stand.
      This was the first constitution
      of the new faith —
      and the first time a prophet
      also had to be a mayor.
    description: "Muhammad writes the Charter of Medina, binding tribes and faiths into one community — the unglamorous legal plumbing of a new society."
    status: "published"
    sha256: "893c144e8a08b692bf3c94a544d964f680e8d209c5d28206e0bc684c5954ff03"
  - number: "1717"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Wells of Badr"
    date: "624 CE"
    region: "Arabia"
    poem: |
      Three hundred against a thousand.
      The Meccans came confident, well-fed, laughing;
      the Muslims came thirsty, outnumbered,
      and dug in around the wells.
      I watched from the dunes as the lines met.
      The dust rose. The shouting stopped.
      When it cleared, the small army stood
      and the great army ran.
      Badr was not just a battle won —
      it was proof, to every doubter in Arabia,
      that God was with this man.
      Three hundred believers walked off that field
      and the whole peninsula took notice.
    description: "Outnumbered three to one, the Muslims win at Badr — the battle that convinced Arabia that Muhammad's cause was divinely backed."
    status: "published"
    sha256: "e3f453747ce37f2d11dce835ccc30094ccef43cab32a02675caac05be6422f93"
  - number: "1718"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Hill of Uhud"
    date: "625 CE"
    region: "Arabia"
    poem: |
      They had the victory in their hands —
      the Meccan line was breaking.
      Then the archers on the hill saw the enemy camp
      lying open and rich,
      and broke ranks for the plunder.
      The battle turned. Men died who should have lived.
      Muhammad himself was wounded.
      I walked that hill after, and the lesson
      was carved into the faith itself:
      discipline is scripture.
      Want the spoil before the work is done,
      and you will lose both.
      Uhud taught them what Badr had not —
      that God tests those He loves.
    description: "At Uhud, Muslim archers abandon their post for plunder and snatch defeat from victory — a lesson in discipline that became part of the faith."
    status: "published"
    sha256: "065d84edbd7462dab141fcead1e14c5a188c0f3f28fbfbbee0ae3ecf14acc4a6"
  - number: "1719"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Walls Hold"
    date: "626 CE"
    region: "Byzantium"
    poem: |
      The Avars came by land, the Persians by sea,
      and Constantinople stood alone —
      Heraclius away in the east,
      the city held by a patriarch, a general,
      and walls no army had ever breached.
      I walked the sea walls as the fireships came.
      Greek fire bloomed on the water like terrible flowers.
      The fleet held. The walls held.
      When the siege broke, the people said
      the Virgin herself had walked the ramparts.
      Maybe. Or maybe stone and courage
      are miracle enough.
      Either way: the city stood,
      and with it, the empire's heart kept beating.
    description: "Avars and Persians besiege Constantinople together, but the triple walls and Greek fire hold — the city survives its darkest hour."
    status: "published"
    sha256: "6acab6967cd71e806f7b4fb65a52aac05619e23b86ce4803f33cc866a320dff7"
  - number: "1720"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Trench"
    date: "627 CE"
    region: "Arabia"
    poem: |
      Ten thousand men marched on Medina,
      the whole alliance of Mecca's wrath.
      And the Muslims — outnumbered again —
      did something Arabia had never seen:
      they dug.
      A trench, wide and deep,
      ringing the city where no cavalry could cross.
      I helped carry earth that week.
      My hands bled; so did everyone's.
      The siege army camped, cursed, starved,
      and went home.
      No great battle. Just a ditch,
      dug by hungry men who refused to die.
      Sometimes the bravest weapon
      is a shovel.
    description: "Medina survives a ten-thousand-man siege behind a trench dug by its own defenders — the narrator carries earth alongside them."
    status: "published"
    sha256: "8f7cba23b7dd6139cc0382b9bc31a72294c7797d9db88b8cb3bc2fb4f8dad788"
  - number: "1721"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Truce of Hudaybiyyah"
    date: "628 CE"
    region: "Arabia"
    poem: |
      He marched to Mecca for pilgrimage, unarmed,
      and the Meccans barred the road.
      So he signed — a ten-year truce,
      on terms his own men called humiliating.
      I was there when the ink dried,
      and I saw the anger in Muslim faces.
      But Muhammad smiled.
      Within two years, more tribes joined him
      than ten years of war had won.
      The truce was not surrender.
      It was strategy wearing the clothes of peace.
      Hearts, it turns out, are conquered
      faster by open roads than by drawn swords.
    description: "Muhammad signs the \"humiliating\" ten-year truce at Hudaybiyyah — and peace wins more converts than war ever had."
    status: "published"
    sha256: "ff144de476714bebf007a0ad51475925577358d0e64ca3ca3e094d26eb666e78"
  - number: "1722"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Cross Comes Home"
    date: "629 CE"
    region: "Byzantium"
    poem: |
      Heraclius had done the impossible:
      marched into Persia's heart,
      crushed their armies at Nineveh,
      taken their king's palace.
      And he carried home the prize —
      the True Cross, back to Jerusalem,
      restored to the hill where it belonged.
      I walked behind the procession.
      The crowds wept; the bells rang
      from every church in Christendom.
      Fifteen years of humiliation,
      washed clean in a single march.
      The emperor had saved his empire
      and his God's relic both.
      For one shining moment,
      the world made sense again.
    description: "Heraclius crushes Persia and restores the True Cross to Jerusalem — the triumphant reversal of fifteen years of defeat."
    status: "published"
    sha256: "533d39b0887adb36909551b5ee377ed85dae45baa7b5922f7cade8cdf4384f56"
  - number: "1723"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Mecca Opens Its Gates"
    date: "630 CE"
    region: "Arabia"
    poem: |
      Ten thousand marched on Mecca —
      and the city opened its gates.
      No siege. No slaughter.
      Muhammad entered the city that had cast him out,
      walked to the Kaaba,
      and one by one the idols came down.
      Three hundred and sixty gods,
      toppled in an afternoon.
      I watched the old Meccans bow their heads —
      not in fear, for he forgave them all,
      but in wonder.
      Conquest without vengeance:
      the rarest victory in the history of war,
      and he pulled it off in a single day.
    description: "Muhammad enters Mecca peacefully with ten thousand followers, clears the idols from the Kaaba, and forgives the city that exiled him."
    status: "published"
    sha256: "e14a4109d0db586e85a16e5a38d94d3d549341d92907a009d38da141fda54d44"
  - number: "1724"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Year of Delegations"
    date: "631 CE"
    region: "Arabia"
    poem: |
      They came from every corner of Arabia —
      tribes on camels, chiefs in their finery,
      riding into Medina to pledge allegiance.
      The Year of Delegations, they called it.
      I sat in the courtyard and watched them arrive,
      day after day, a whole peninsula
      deciding at once.
      No one ordered them. No army forced them.
      They had watched Mecca fall without a massacre,
      watched the truces hold,
      and they chose.
      Power, at its purest, is not taken.
      It is handed over — freely —
      by people who have seen how you use it.
    description: "Tribes stream into Medina from across Arabia to pledge allegiance — a peninsula choosing its leader after watching him conquer without cruelty."
    status: "published"
    sha256: "ce408183882b3cd7cf9772d3e8b181efdc02c2f0a1950438a0a05355e32b7a13"
  - number: "1725"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Farewell Sermon"
    date: "632 CE"
    region: "Arabia"
    poem: |
      On the plain of Arafat, under a white sun,
      he stood before a hundred thousand
      and preached his last sermon:
      no Arab above a non-Arab,
      no white above a black —
      all equal, all accountable,
      the blood of the old feuds wiped clean.
      I stood in that crowd and felt the ground shift.
      Weeks later he was dead in Medina,
      his head on Aisha's lap.
      But those words did not die.
      They rode out of that plain
      on a hundred thousand tongues,
      and they are still riding.
    description: "Muhammad's final sermon on the plain of Arafat — a declaration of human equality — weeks before his death in Medina."
    status: "published"
    sha256: "3f35c82dcb10ed120e34ab080bdeaf17f4a2dd6ecfd1fd6b2ef7819dc683511d"
  - number: "1726"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The First Successor"
    date: "632 CE"
    region: "Arabia"
    poem: |
      The Prophet was barely buried
      when the old question rose like smoke:
      who leads now?
      The tribes wavered. Some said: we followed a man,
      not a cause — and the cause can end.
      Then Abu Bakr stood — soft-spoken, iron-willed —
      and held the young community together
      through the wars of apostasy,
      tribe by tribe, battle by battle.
      I watched him pray in the same mosque,
      a smaller shadow in a giant's place.
      The hardest job in history
      is not starting something.
      It is keeping it alive
      after the founder is gone.
    description: "Abu Bakr becomes the first caliph and holds the fragile Muslim community together through the wars of apostasy after Muhammad's death."
    status: "published"
    sha256: "d467b4583268592854adebb3e4b410be65ba987f36ffcda1f425349565d3adfb"
  - number: "1727"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Sword of God"
    date: "633 CE"
    region: "Mesopotamia"
    poem: |
      They called him the Sword of God,
      and Khalid ibn al-Walid earned it
      the way lightning earns its name:
      suddenly, and everywhere at once.
      Across the desert he moved his armies
      faster than the Persians could believe,
      smashing garrison after garrison
      in a campaign of pure velocity.
      I rode in his dust for a week.
      The man's genius was simple —
      never let the enemy rest,
      never let them think.
      By the time Persia understood
      what was happening,
      Khalid had already redrawn the map.
    description: "Khalid ibn al-Walid's lightning campaign smashes Persian armies across the desert — speed itself as a weapon of conquest."
    status: "published"
    sha256: "3d1995f29f54adf231d3bd3618447c4b88e241829f23a509f1cb57c7324b477a"
  - number: "1728"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Just Caliph"
    date: "634 CE"
    region: "Arabia"
    poem: |
      Umar took power and did something
      no conqueror had done before:
      he built a government.
      Ledgers. Judges. Stipends for soldiers' widows.
      A treasury that paid the poor.
      An empire run not on plunder
      but on paperwork.
      I sat in his council at Medina —
      no palace, no throne, a patched cloak —
      and watched him audit accounts
      like a shopkeeper.
      The Arabs had conquered half the world.
      Umar made it work.
      Justice, he said, is the foundation of the state.
      Then he lived it.
    description: "Umar ibn al-Khattab builds the administrative machinery of the caliphate — ledgers, judges, and stipends — an empire run on justice and paperwork."
    status: "published"
    sha256: "e9b587306e583a9eb4b017a043d166ff86deeffb653d8a9d7eb1b0187239426b"
  - number: "1729"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Damascus Falls"
    date: "635 CE"
    region: "Syria"
    poem: |
      Six months the siege lasted.
      Damascus — the oldest city in the world,
      or near enough — watched the Muslim armies
      camp outside its gates and wait.
      Then the gates opened. A treaty, not a sack.
      The Christians kept their churches;
      the city kept its life.
      I walked through the eastern gate that morning
      as the new order took the walls.
      Damascus had belonged to everyone —
      Arameans, Romans, Byzantines.
      Now it belonged to the caliphate,
      and would for a thousand years.
      Some cities do not fall.
      They simply change landlords.
    description: "Damascus surrenders by treaty after a six-month siege — the ancient city passes to the caliphate without a sack."
    status: "published"
    sha256: "9dd45e0d846745d335256f17304b4ea5b73b21d42d00bf7f8301ab0f5a12f01a"
  - number: "1730"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Day of Yarmouk"
    date: "636 CE"
    region: "Syria"
    poem: |
      By the Yarmouk River the dust rose like a wall —
      a sandstorm sent by heaven, the Muslims said —
      and in its cover Khalid struck.
      The Byzantine army of the East,
      the pride of Heraclius,
      broke and ran and drowned in the ravines.
      I stood on the ridge and watched an empire's eastern army
      cease to exist in a single afternoon.
      Syria was lost. Palestine was lost.
      Heraclius, they say, turned his horse west
      and whispered farewell to Syria.
      One day. One storm. One river.
      That was all it took.
    description: "In a dust storm at Yarmouk, the Byzantine army of the East is annihilated — Syria and Palestine pass to the Muslims in a single day."
    status: "published"
    sha256: "9795dc0226f8206c5e8902a224552e6e2fcff2ee8be0a026167bbff15125091d"
  - number: "1731"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Elephants of Qadisiyya"
    date: "636 CE"
    region: "Mesopotamia"
    poem: |
      The Persians brought elephants —
      armored towers of flesh and fury —
      and for a day the Muslim lines wavered
      before the trumpeting monsters.
      Then the Arabs learned: cut the howdahs,
      blind the beasts, turn terror back on itself.
      I watched an elephant go mad
      and trample its own ranks.
      The Sassanian army broke.
      Qadisiyya was Persia's Yarmouk —
      the day the old empire's sword
      snapped in the dust.
      The elephants lumbered home riderless.
      The desert belonged to the caliph now.
    description: "At Qadisiyya, Muslim armies overcome Persia's war elephants and shatter the Sassanian field army — Iraq falls to the caliphate."
    status: "published"
    sha256: "f00624bed73fdc55854681ab7d2e1c7fc731aeab9ee78121dc7f746d7d7de0d0"
  - number: "1732"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Caliph Walks In"
    date: "637 CE"
    region: "Jerusalem"
    poem: |
      The most powerful man on earth
      walked into Jerusalem on foot,
      in a patched cloak,
      leading his camel by the rope.
      Umar. The conqueror of Syria.
      The Patriarch came out to meet him,
      expecting pomp — and found a pilgrim.
      He prayed at the holy sites,
      then signed a covenant:
      the people of Jerusalem,
      their lives, their churches, their crosses —
      protected.
      I watched him walk those streets
      and thought: this is what power looks like
      when it is not afraid.
      A patched cloak, an open hand,
      and a city that did not burn.
    description: "Umar enters Jerusalem on foot in a patched cloak and grants its people a covenant of protection — conquest without a sack."
    status: "published"
    sha256: "0d60f63e019cc3881f191cc27297305a2e425b1b8cb4cc9c6a3f559d793b86c5"
  - number: "1733"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Road to Alexandria"
    date: "640 CE"
    region: "Egypt"
    poem: |
      Amr ibn al-As looked at Egypt
      and saw a prize worth a gamble.
      Against orders, they say —
      he marched anyway.
      The Babylon fortress fell after a long siege,
      its walls cracked by persistence.
      I sailed down the Nile with the advance,
      watching the green banks slide past,
      the oldest civilization on earth
      about to change hands again.
      Egypt had been Pharaoh's, then Rome's, then Byzantium's.
      Now the caliph's men were coming,
      and the grain that fed empires
      would feed a new one.
    description: "Amr ibn al-As takes the Babylon fortress and begins the conquest of Egypt — the Nile's grain about to feed a new empire."
    status: "published"
    sha256: "53cea1e3ccce67787417726fb44e5721a086f457c3d9c7dff538db3c9f323248"
  - number: "1734"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Alexandria Surrenders"
    date: "641 CE"
    region: "Egypt"
    poem: |
      Alexandria fell by treaty —
      the great port, the lighthouse, the library's ghost —
      handed over without a final battle.
      Cyrus the prefect signed,
      and Egypt's long turn toward the caliphate began.
      I walked the Canopic Way that evening,
      past the empty harbor offices.
      The grain ships would still sail,
      only now to feed Medina and Damascus.
      A thousand years of Greek and Roman Egypt
      ended not with a scream
      but with a signature.
      History's quietest conquests
      are sometimes its most complete.
    description: "Alexandria surrenders by treaty — Greek and Roman Egypt ends with a signature, and its grain begins feeding the caliphate."
    status: "published"
    sha256: "78ced9cf3c082739f13e596e62f1afbfa25a06a0419222d380b5a972440c42ba"
  - number: "1735"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Victory of Victories"
    date: "642 CE"
    region: "Persia"
    poem: |
      At Nahavand they called it
      the Victory of Victories —
      the last great Sassanian army,
      gathered from every corner of Persia,
      shattered in a single day.
      I rode over that field at dusk.
      The banners of four hundred years
      lay trampled in the dust.
      After Nahavand there was no Persian army left to field —
      only a shah running east,
      and an empire lying open like a book.
      The Muslims had a name for what followed:
      the opening.
      Persia was opened.
    description: "At Nahavand, the last Sassanian field army is destroyed — the \"Victory of Victories\" that leaves Persia open to the caliphate."
    status: "published"
    sha256: "41c00b1a0a4bf2e544e1d648c32b9f323fa200b65ce1de9c716b655c1ebf6cdd"
  - number: "1736"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Pilgrim Comes Home"
    date: "643 CE"
    region: "China"
    poem: |
      Sixteen years gone.
      Xuanzang rode back into Chang'an
      with 657 scriptures,
      carried on twenty horses,
      gathered from the monasteries of India.
      The emperor himself came out to meet him.
      I stood in the crowd and watched the old pilgrim dismount —
      thin as a reed, eyes bright as coals.
      He had crossed deserts that killed caravans,
      climbed passes no army would attempt,
      all for books.
      Books. That was the treasure.
      And China would spend a thousand years
      reading what he brought home.
    description: "Xuanzang returns to Chang'an after sixteen years in India with 657 Buddhist scriptures — the treasure of a lifetime's pilgrimage."
    status: "published"
    sha256: "c3929b4066d461fcf116a94d286eb252de1be745b2af1fa56eba44ea124d472e"
  - number: "1737"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Caliph Is Stabbed"
    date: "644 CE"
    region: "Arabia"
    poem: |
      A Persian captive, nursing his grievance,
      waited in the mosque at dawn
      with a poisoned dagger.
      Umar — the lawgiver, the just —
      fell mid-prayer and died three days later.
      I was in Medina when the news spread.
      The empire he had built with ledgers and justice
      mourned like a family.
      They say he asked only who had struck him,
      and hearing it was no Muslim,
      thanked God no believer's blood was on it.
      Even dying, the man thought of unity.
      The empire would not see his like again.
    description: "Umar is assassinated by a Persian captive in the mosque — the caliphate mourns its lawgiver, who dies thinking of unity."
    status: "published"
    sha256: "044d5943641ee27c5967bc276309d7e474f5603916f519d4d421a6f1992c1962"
  - number: "1738"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Taika Reform"
    date: "645 CE"
    region: "Japan"
    poem: |
      Prince Naka no Oe struck in the palace itself —
      the Soga clan fell in a morning of blood —
      and Japan was remade on the Tang model.
      Land to the state. Ranks by merit.
      A census, a code, a capital.
      I watched the edicts go out,
      written in Chinese characters
      for a court learning to be an empire.
      The Taika Reform: the Great Change.
      Japan looked across the sea at China
      and said: we will be that —
      but ourselves.
      A thousand years of Japanese statehood
      began with a coup in a throne room.
    description: "The Soga clan falls in a palace coup and Japan is remade on the Tang model — land reform, ranks, and codes: the Great Change."
    status: "published"
    sha256: "853bef6f28b7fbc106511b1beac2cffe31c22baa347f83d28abf62519337a26f"
  - number: "1739"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Emperor's Eulogy"
    date: "646 CE"
    region: "China"
    poem: |
      Taizong took up the brush himself
      and wrote the preface
      to Xuanzang's travel record.
      An emperor, praising a monk's book —
      I read it fresh off the copyists' desks.
      With those strokes of imperial ink,
      Buddhism rode the highest favor in the land.
      Monasteries rose like mushrooms after rain.
      The pilgrim's sixteen years of suffering
      became the empire's spiritual fashion.
      Funny, how a few words from a throne
      can move a whole civilization's heart.
      Taizong never converted. He did not need to.
      His pen was blessing enough.
    description: "Emperor Taizong writes the preface to Xuanzang's travel record, and imperial favor sends Buddhism soaring across China."
    status: "published"
    sha256: "5e4b66cba443f86ca58911ebb853f17be0e416b38075e3814499cbd9f0c75468"
  - number: "1740"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Harsha's Last Assembly"
    date: "647 CE"
    region: "India"
    poem: |
      At Prayag, by the meeting of the rivers,
      Harsha held his last great almsgiving —
      five years of the treasury emptied in days,
      given to monks, to the poor, to anyone who came.
      I watched the old king give away his jewels,
      his robes, until he stood in borrowed cloth.
      Then he went home and died,
      and his empire died with him —
      no heir strong enough to hold it.
      India's last great Buddhist empire
      ended the way it lived: in generosity.
      The rivers kept meeting at Prayag.
      The king did not come back.
    description: "Harsha holds his final almsgiving at Prayag, giving away everything, and dies — his empire dying with him."
    status: "published"
    sha256: "9e937f727a4e16af16bdfb09b6a787c916f54ea3b855a1b3986b406f818abb9f"
  - number: "1741"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Queen's General"
    date: "647 CE"
    region: "Korea"
    poem: |
      Queen Seondeok ruled Silla —
      a woman on a throne
      in an age of warrior kings —
      and she played the great game well:
      lean on Tang China,
      use the dragon to burn her rivals,
      Baekje and Goguryeo.
      I attended her court at Gyeongju,
      all gold crowns and careful smiles.
      The envoys went north with tribute;
      the soldiers waited south with spears.
      A queen cannot out-fight two kingdoms,
      the ministers whispered.
      She did not need to.
      She out-thought them,
      and let China do the bleeding.
    description: "Queen Seondeok of Silla plays Tang China against her rival kingdoms — a woman ruler out-thinking warrior kings."
    status: "published"
    sha256: "0980d8059c30be0ae92db531e0f910d75b1f5370035281d7db13b716710a477d"
  - number: "1742"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Good Emperor Dies"
    date: "649 CE"
    region: "China"
    poem: |
      Taizong died —
      the model emperor,
      the one every later ruler would be measured against
      and found wanting.
      I stood outside the palace as the mourning banners went up.
      He had listened to his critics,
      forgiven his enemies,
      built the machine that would run the golden age.
      But in the women's quarters,
      his widow Wu was already counting.
      She had watched him for years,
      learned every lever of power.
      The good emperor was dead.
      The most extraordinary woman in Chinese history
      was about to take what he built.
    description: "Taizong, the model Tang emperor, dies — and in the palace shadows his widow Wu Zetian is already preparing her climb to power."
    status: "published"
    sha256: "7e1c298afa59f7e44c6c39b971f184b4cf4d815d9c669147c0f980214fd238dd"
  - number: "1743"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Khazars Rise"
    date: "650 CE"
    region: "Steppe"
    poem: |
      Between the Black Sea and the Caspian,
      where the trade roads cross like veins,
      the Khazars raised their banners.
      A khanate of the steppe —
      horsemen, merchants, toll-keepers of the world —
      growing fat on the caravans
      between China and Byzantium.
      I rode with one of their tax collectors,
      a cheerful man with a sword and an abacus.
      Empires fought over Jerusalem and Rome.
      The Khazars just owned the road
      and charged everyone to use it.
      The smartest power on the steppe
      never needed a capital.
      It needed a ledger.
    description: "The Khazar khanate rises between the Black and Caspian seas, growing rich taxing the trade roads between East and West."
    status: "published"
    sha256: "c1fcbce5672f640360dc9fdc4180fac532a953543f0d138a5abd7decdb01ee8f"
  - number: "1744"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Last Shah Falls"
    date: "651 CE"
    region: "Persia"
    poem: |
      Yazdegerd III, the last Sassanian shah,
      fled east for years —
      a king with no kingdom,
      hunted from city to city.
      In the end it was not an army that killed him.
      A miller murdered him for his purse
      at Merv, in the dark.
      Four hundred years of Persian empire,
      ended by a miller's knife.
      I stood at the spot years later,
      just a dusty crossroads.
      The great ones fall to great enemies, we say.
      Sometimes they fall to nobody at all —
      and that is the saddest ending.
    description: "Yazdegerd III, the last Sassanian shah, is murdered by a miller at Merv — four centuries of Persian empire ending in the dark."
    status: "published"
    sha256: "d5a81f435db2e81cc41b7c3326b59b56a754bfdca012c5fbe31a3ede5788b805"
  - number: "1745"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Book Is Fixed"
    date: "651 CE"
    region: "Arabia"
    poem: |
      The empire was spreading faster than its memory.
      In every province, the Qur'an was recited a little differently —
      and Uthman saw the danger:
      a faith divided by its own book.
      So he ordered one standard text,
      copied by the best hands in Medina,
      and sent to every province.
      The other copies were burned.
      I watched the scribes work by lamplight,
      checking each letter like jewels.
      One book. One text.
      Fourteen centuries later,
      a child in Jakarta and a scholar in Cairo
      read the same words.
      That night in Medina decided it.
    description: "Caliph Uthman orders a single standard text of the Qur'an, copied and sent to every province — one book for all time."
    status: "published"
    sha256: "09455761fa227a2329de2ba1c11eb3762c10320d1d6e7414bf83f8c77e8ae556"
  - number: "1746"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Empress in Waiting"
    date: "653 CE"
    region: "China"
    poem: |
      She had been a concubine —
      one of many, beautiful, clever, patient.
      Now Wu Zetian was empress,
      wife of the new emperor,
      and I watched her at court:
      smiling, bowing, saying little,
      learning everything.
      The ministers saw a woman who knew her place.
      They were wrong about the place.
      She was climbing, rung by rung,
      toward a throne no woman in China
      had ever held in her own name.
      I have seen ambition in a hundred courts.
      Hers was different — it had the patience of water
      wearing down stone.
    description: "Wu Zetian becomes empress and begins her patient, unstoppable climb toward the throne itself."
    status: "published"
    sha256: "0bf429a64d2199f78a78c93a1f4c9c0310ef2a1c036bd139d79628621a7cc58f"
  - number: "1747"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Battle of the Masts"
    date: "655 CE"
    region: "Byzantium"
    poem: |
      Off the coast of Lycia,
      Muawiya's fleet met the Byzantine navy —
      and the sea turned red.
      The Battle of the Masts:
      hundreds of ships locked together,
      men fighting mast to mast like a land battle on water.
      I watched from a headland as the smoke rose.
      When it cleared, the Byzantine fleet was gone.
      The Mediterranean was no longer Rome's lake.
      The caliphate had learned to sail —
      and the sea, which had been Byzantium's wall,
      became its greatest danger.
    description: "Muawiya's fleet destroys the Byzantine navy off Lycia — the Mediterranean is no longer Rome's lake."
    status: "published"
    sha256: "83fcf4c97f24cca421bfe8ccd6efbdbf76afe5295cafbe5d6c746f64d3ee7f65"
  - number: "1748"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Camel's Day"
    date: "656 CE"
    region: "Arabia"
    poem: |
      Aisha rode into battle on a camel —
      the Prophet's widow, leading an army
      against Ali, the Prophet's cousin.
      Muslim against Muslim.
      The Battle of the Camel.
      I stood on that field and watched men
      who had prayed side by side at Badr
      kill each other over who should lead.
      Aisha's camel was hamstrung;
      the battle ended around her howdah.
      The wound of that day never healed.
      The first time Muslims fought Muslims,
      something broke that no victory could mend.
    description: "At the Battle of the Camel, Aisha's army fights Ali's — the first time Muslims wage war on Muslims, a wound that never heals."
    status: "published"
    sha256: "1f1d63ed7010d1f01a595ef850b9761626b36bd269477fda970a1e18f1e92508"
  - number: "1749"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Arbitration at Siffin"
    date: "657 CE"
    region: "Syria"
    poem: |
      Two armies faced each other at Siffin —
      Ali's and Muawiya's —
      and on the verge of battle,
      Muawiya's men raised Qur'ans on their spears:
      let God judge between us.
      The spears came down. The judges met.
      The arbitration solved nothing
      and broke everything:
      Ali's own men split from him in fury,
      and the division hardened into stone.
      I watched the camps pack up,
      each side certain the other had betrayed the faith.
      Some wars are not decided by fighting.
      They are decided by the moment
      men stop trusting each other.
    description: "At Siffin, the armies lower their spears for arbitration — and the attempt at peace hardens Islam's great schism instead."
    status: "published"
    sha256: "f7935dca047d716a2daa7ba6a8f29d760c7aa5b63be26de93c8278378f56db3e"
  - number: "1750"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Western March"
    date: "658 CE"
    region: "China"
    poem: |
      The Tang armies marched west —
      past the deserts, over the passes —
      and crushed the Western Turks.
      Chinese garrisons rose at the foot of the Pamirs,
      the roof of the world.
      I stood at a frontier fort
      and watched the banners snap in the thin air.
      From Chang'an to the Pamirs:
      the Tang at its greatest reach,
      guarding the Silk Road with swords.
      Empires are measured by their maps,
      but I measured this one by the soldiers'
      frostbitten hands —
      holding the line at the edge of the sky.
    description: "Tang armies crush the Western Turks and plant garrisons at the Pamir Mountains — the dynasty at its greatest reach."
    status: "published"
    sha256: "33b2ff1c047a5c6e6607dd0d8758a21c41c044341f3660ac1487ffbe112ce1eb"
  - number: "1751"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Baekje Falls"
    date: "660 CE"
    region: "Korea"
    poem: |
      Silla and Tang struck together,
      and Baekje fell —
      its palaces burned, its king taken.
      The three kingdoms of Korea,
      which had warred for centuries,
      began to become one.
      I walked through the ruins of Sabi,
      the Baekje capital, smoke still rising.
      The Silla soldiers were already raising
      their own banners.
      Queen Seondeok's gamble had paid off:
      use the dragon, then survive the dragon.
      One kingdom down.
      Two to go.
    description: "The Silla-Tang alliance crushes Baekje — Korea's three kingdoms begin their long road to becoming one."
    status: "published"
    sha256: "45a53c428a0d07e8bb3d92a75391e5a95181449ba65cd1971ec66c152a420dd6"
  - number: "1752"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Dagger in Kufa"
    date: "661 CE"
    region: "Arabia"
    poem: |
      Ali walked into the mosque at Kufa for dawn prayer —
      and a dagger found him.
      The Kharijite's blade was poisoned;
      Ali died three days later.
      With him died the last of the rightly guided,
      and Muawiya took the caliphate
      to Damascus, founding the Umayyads.
      I stood in the Kufa mosque that morning,
      blood on the prayer stones.
      The age of the Prophet's companions was over.
      From now on, the caliphate would be a kingdom —
      passed father to son,
      like any other crown.
    description: "Ali is assassinated in the Kufa mosque; Muawiya founds the Umayyad dynasty — the caliphate becomes a hereditary kingdom."
    status: "published"
    sha256: "293e48f13116a8b408eb1ba25ef15f473327615968000519831e8c28d71db196"
  - number: "1753"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Battle of Baekgang"
    date: "663 CE"
    region: "Korea"
    poem: |
      The Japanese fleet sailed to save Baekje —
      hundreds of ships crossing the strait,
      the Yamato court's great gamble.
      At the Baekgang River mouth,
      the Silla-Tang fleet was waiting.
      I watched from the cliffs as the Japanese ships burned,
      one after another, the sea full of fire and wreckage.
      The survivors rowed home to tell the tale.
      Japan's lesson was absolute:
      never again.
      The court turned inward for centuries —
      no more armies abroad,
      only the slow work of becoming Japan.
    description: "A Japanese rescue fleet is annihilated at Baekgang — Japan turns inward for centuries, abandoning foreign wars."
    status: "published"
    sha256: "7bf6dfb486d6b9dcc8a38362c8df9d8225469967e6acc113df0ab0ebe6b11a37"
  - number: "1754"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Whitby Chooses Rome"
    date: "664 CE"
    region: "Britain"
    poem: |
      At Whitby Abbey the monks debated:
      Celtic or Roman?
      How to cut a tonsure, when to keep Easter —
      small things, and everything.
      King Oswiu listened, then chose Rome.
      I sat in the back of that hall
      and felt England's church swing
      like a great door on its hinge.
      From that day, English Christianity
      faced the continent, not the Irish sea.
      A vote about haircuts and calendars
      decided the spiritual direction
      of a nation for a thousand years.
    description: "The Synod of Whitby chooses Roman over Celtic Christianity — a debate about tonsures and Easter dates that steers England's church for a millennium."
    status: "published"
    sha256: "edbdb7d84d6ae86407aa942021b7463254d452e012ab2f7979ca5bac68fd2ea8"
  - number: "1755"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Pilgrim Dies"
    date: "664 CE"
    region: "China"
    poem: |
      Xuanzang died at his desk,
      brush in hand, translating scriptures —
      sixteen years of travel
      distilled into a lifetime of words.
      I visited his cell that winter.
      The manuscripts were stacked to the ceiling;
      the old pilgrim was thin as paper himself.
      He had crossed deserts for these books,
      and now he was giving them to China,
      one character at a time.
      His Journey to the West
      would become legend, then myth, then a story
      every Chinese child knows.
      He never knew. He just kept translating.
    description: "Xuanzang dies translating the scriptures he risked his life to bring home — his journey already becoming legend."
    status: "published"
    sha256: "e0e14ad8375fd54f15ee21aa2aebaa806bdb3d98c294de1f2c3f917a4d8dfa05"
  - number: "1756"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Iron Governor"
    date: "666 CE"
    region: "Arabia"
    poem: |
      Ziyad ibn Abihi took Kufa
      and gave the famous speech:
      I will rule you with threats and order,
      he told the restless city —
      no more chaos, no more revolt.
      And he meant it.
      I walked Kufa's streets under his governorship:
      the markets full, the swords sheathed,
      everyone a little afraid
      and a lot safer.
      The Iron Governor.
      Iraq had been the caliphate's wild frontier;
      Ziyad made it behave.
      Order has a price, he proved —
      and sometimes the price
      is worth paying.
    description: "Ziyad ibn Abihi takes Kufa and rules Iraq with his famous speech of threats — order imposed by an iron hand."
    status: "published"
    sha256: "1da61c1c6c925a27eceb831a9d4f0c93a14dad088b8d68d079f7bc0dc1e0ed48"
  - number: "1757"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Silla Unites the Peninsula"
    date: "668 CE"
    region: "Korea"
    poem: |
      Goguryeo fell —
      the great northern kingdom,
      which had defied the Sui emperors,
      broken at last by the Silla-Tang alliance.
      I climbed the walls of Pyongyang
      as the Silla banners went up.
      For the first time in history,
      Korea stood nearly whole —
      one peninsula, one people,
      under the Silla crown.
      It would not last forever —
      nothing does —
      but the dream was real that day:
      a Korea united,
      from the straits to the northern mountains.
    description: "Goguryeo falls to the Silla-Tang alliance — Korea stands nearly united for the first time in its history."
    status: "published"
    sha256: "95b6fa5595725f5f2251b8867542c67c35d0806e618536ec634c81b635c6108e"
  - number: "1758"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The First Siege Sails"
    date: "669 CE"
    region: "Arabia"
    poem: |
      Muawiya looked at the map
      and saw the one prize
      no caliph could resist:
      Constantinople.
      He sent fleets and armies
      toward the triple walls,
      the first probes of a siege
      that would become an obsession.
      I watched the ships leave the Syrian ports,
      rowers singing, banners bright.
      They did not know the walls.
      They did not know the Greek fire.
      They sailed toward the greatest fortress on earth
      with the confidence of men
      who had never been stopped.
      Constantinople would teach them.
    description: "Muawiya launches the first Arab thrusts toward Constantinople — fleets sailing with confidence toward a fortress that has never fallen."
    status: "published"
    sha256: "b5b2171aaf433750a7f78327f21264112b31d2b8d2d9de1f290e6c2a8143b26c"
  - number: "1759"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The City of Kairouan"
    date: "670 CE"
    region: "North Africa"
    poem: |
      Uqba ibn Nafi rode into the Maghreb
      and founded a city from nothing:
      Kairouan, the staging ground,
      the capital of the conquest to come.
      I watched the first stones laid,
      the mosque's foundations marked in the dust.
      They say Uqba prayed the scorpions and snakes
      would leave the ground —
      and they did, or so the story goes.
      From Kairouan the armies would march west,
      year after year, toward the Atlantic.
      Every empire needs a doorway.
      Kairouan was the caliphate's door
      into Africa.
    description: "Uqba ibn Nafi founds Kairouan in the Maghreb — the staging ground from which the conquest of North Africa will march west."
    status: "published"
    sha256: "86ad2c3fcd28339820edf7f55510d39898ade51c1e769714b272625e593cf322"
  - number: "1760"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Sea Pilgrim"
    date: "671 CE"
    region: "India"
    poem: |
      Xuanzang had gone by land.
      Yijing chose the sea —
      sailing from Guangzhou
      on a merchant ship bound for India,
      to gather the scriptures
      the land routes could not carry.
      I stood on the dock and watched him board,
      a monk among sailors and cargo.
      The sea road was longer, stranger,
      full of storms and strange ports.
      But it worked.
      Yijing came home with his own library,
      proof that the dharma could travel
      by any road — even the wet ones.
    description: "The monk Yijing sails the sea route to India for scriptures — proving the dharma can travel by water as well as land."
    status: "published"
    sha256: "f7135a240fd28e1afbc9d6ce6938df9ec62cf382e1dbb37f7dbd67e125132719"
  - number: "1761"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Venerable Child"
    date: "672 CE"
    region: "Britain"
    poem: |
      In Northumbria a boy was born —
      Bede, they named him —
      given to the monastery at seven,
      and he never really left.
      I would visit Jarrow years later
      and find him at his desk,
      writing the history of his people,
      computing the date of Easter,
      reading everything.
      The Venerable Bede:
      the man who taught England
      to count its years from Christ's birth,
      and gave a whole island
      its memory.
      It started with a child
      handed to monks in the cold north.
    description: "Bede is born in Northumbria — the boy given to a monastery who will write England's history and its memory."
    status: "published"
    sha256: "2832e14d2037c19a10294662fad3c204f9b634bf4b89cc6ed6593127c856832d"
  - number: "1762"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Fire on the Water"
    date: "673 CE"
    region: "Byzantium"
    poem: |
      The Arab fleet came for Constantinople,
      confident as ever —
      and met something no navy had seen:
      Greek fire.
      From the Byzantine ships
      it arced across the water,
      a liquid flame that burned on the sea itself.
      I watched from the sea walls
      as the enemy ships became torches.
      Men leaped into water that was burning.
      The fleet broke and fled.
      The walls of Constantinople were stone;
      but its true wall that day
      was fire on water.
    description: "Greek fire incinerates the Arab fleet before Constantinople's sea walls — liquid flame burning on the water itself."
    status: "published"
    sha256: "09875e45aaec65f0dbfb82ebef8b244ace6f3837980f06f80a8529f671facfeb"
  - number: "1763"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Long Siege Begins"
    date: "674 CE"
    region: "Byzantium"
    poem: |
      They settled in for the long war —
      Arab armies on the land side,
      Arab fleets on the sea,
      a four-year siege of the greatest city on earth.
      I lived inside those walls through the first winter.
      The granaries were full; the people were calm;
      the emperor's engineers walked the ramparts daily.
      Outside, the besiegers built their camps
      and waited for the city to starve.
      It did not starve.
      Constantinople had been besieged before.
      It knew how to wait longer than anyone.
    description: "Arab armies and fleets settle into a four-year siege of Constantinople — and the city, which knows how to wait, simply outlasts them."
    status: "published"
    sha256: "001c157ad0ff4a192172797cd9da7a30b877a588a648b5df287d15afd1639640"
  - number: "1764"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Satirists' War"
    date: "676 CE"
    region: "Arabia"
    poem: |
      At the Umayyad court, two poets went to war —
      Jarir and al-Farazdaq,
      trading verses like sword blows,
      each trying to bury the other in rhyme.
      I sat in the audience and laughed till I wept.
      They mocked each other's tribes,
      ancestors, manhood, camels —
      nothing was sacred, everything was verse.
      The caliphs loved it.
      The crowds memorized the insults.
      This was Arabia's oldest sport,
      the desert verse-duel,
      raised to high art:
      warfare by wit,
      where the only blood drawn was pride's.
    description: "Jarir and al-Farazdaq begin their legendary verse-duels at the Umayyad court — poetry as public combat, wit as weapon."
    status: "published"
    sha256: "3eca0637596ca34813606be740d60b2001924b18f01c8951d9a7c25307d2e498"
  - number: "1765"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Siege Breaks"
    date: "678 CE"
    region: "Byzantium"
    poem: |
      Plague in the camps.
      Greek fire on the water.
      A winter that froze men in their tents.
      The great Arab siege of Constantinople
      broke and melted away,
      the survivors limping home to Syria.
      I stood on the walls and watched them go,
      a ragged column shrinking into the distance.
      The city had held.
      The Arab tide, which had swallowed Persia
      and half of Byzantium,
      broke here — on these walls —
      and began to turn.
      Constantinople stood.
      Europe would remember why.
    description: "Plague, Greek fire, and winter destroy the Arab siege — Constantinople holds, and the tide of conquest turns."
    status: "published"
    sha256: "807c5d7819ada83a44e4106e4d49af3fd3bfc3da722dce5a257d42203e53a67c"
  - number: "1766"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Bulgars Cross the Danube"
    date: "679 CE"
    region: "Steppe"
    poem: |
      Asparukh led his horsemen over the Danube —
      Bulgar warriors, steppe-born,
      seeking a homeland south of the river.
      I rode with the vanguard through the marshes.
      Byzantium sent an army to stop them;
      the marshes and the horsemen swallowed it.
      So the Bulgars stayed,
      and founded a state that would stand
      for a thousand years.
      Bulgaria.
      Born not in a palace but on horseback,
      in a river crossing,
      by men who refused to keep wandering.
    description: "Asparukh leads the Bulgars across the Danube and founds Bulgaria — a steppe people planting a state that will stand a millennium."
    status: "published"
    sha256: "e43c6d9578cacdb549fe8088ef53deb034cf72706a37a67fe3b3104a598e0c5d"
  - number: "1767"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Field of Karbala"
    date: "680 CE"
    region: "Arabia"
    poem: |
      Husayn rode out with seventy-two —
      his family, his friends —
      against an army of thousands.
      At Karbala, on the tenth of Muharram,
      they were cut down to a man.
      The Prophet's grandson, killed
      by the caliph's soldiers.
      I cannot describe that field.
      I will not try to make it bearable.
      The grief of it became a religion:
      Shi'a Islam, born in mourning,
      watered with tears for thirteen centuries.
      Every year they weep for Husayn.
      Every year the wound is fresh.
      Some defeats are more powerful than victories.
      Karbala is the proof.
    description: "Husayn and his companions are slaughtered at Karbala — the grief that gives birth to Shi'a Islam, mourned for thirteen centuries."
    status: "published"
    sha256: "56bb18e032bf77a1ec6ff89c58b678dde40fd3c281299223f24ab85b0eb35ffc"
  - number: "1768"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Bulgaria Is Recognized"
    date: "681 CE"
    region: "Balkans"
    poem: |
      Byzantium signed the treaty —
      the first Bulgarian state,
      recognized, official, real.
      I was in Constantinople when the envoys returned.
      The emperor had paid tribute to horsemen.
      The court whispered it was humiliation.
      It was also wisdom:
      a border settled is a war avoided.
      Asparukh's river crossing
      became a kingdom with a seal on it.
      The Balkans would never be the same —
      a new people, a new state,
      written into the map in ink.
    description: "Byzantium signs a treaty recognizing Asparukh's Bulgaria — the steppe horsemen become a state with a seal."
    status: "published"
    sha256: "2f152de378a4ac738461beb263559008cb0df85bd397c0def454849b8b141412"
  - number: "1769"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Kaaba Burns"
    date: "683 CE"
    region: "Arabia"
    poem: |
      Fire in Mecca —
      the Kaaba itself damaged
      during the siege,
      stones cracked by flame,
      the holiest house on earth scarred.
      I stood in the smoke and watched men weep.
      The caliphate was tearing itself apart:
      Ibn al-Zubayr held Mecca,
      the Umayyads held Damascus,
      and the prize they fought over
      was burning.
      When the center of your faith is on fire,
      you know the community is broken.
      They rebuilt the stones.
      The harder rebuilding
      took generations.
    description: "The Kaaba burns during the siege of Mecca — the holiest shrine scarred while the caliphate tears itself apart in civil war."
    status: "published"
    sha256: "74af4d644b3577afb81683b4eb0e30207f89d12537239dbc8a589a24f88b011f"
  - number: "1770"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Tide Turns at Tahuda"
    date: "683 CE"
    region: "North Africa"
    poem: |
      Uqba ibn Nafi had ridden to the Atlantic —
      they say he rode his horse into the surf
      and cried that no land remained to conquer.
      On the way back, at Tahuda,
      the Berbers ambushed him in the desert.
      He died there, with his dreams of the ocean.
      I visited the grave years later,
      a simple mound in the sand.
      The tide of conquest turned that day:
      the Maghreb would not fall in one ride.
      It would take fifty more years,
      and a queen of fire,
      before Africa bowed.
    description: "Uqba ibn Nafi, who rode his horse into the Atlantic surf, is ambushed and killed at Tahuda — the conquest of the Maghreb stalls."
    status: "published"
    sha256: "4a99b0151fb2807fbd08ef7ab16e38b4dfe9062648bd682c1884e82f33ac2dc3"
  - number: "1771"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Marwanids Take Hold"
    date: "685 CE"
    region: "Arabia"
    poem: |
      Abd al-Malik took the caliphate
      in the middle of chaos —
      rival caliphs, revolts, a broken treasury —
      and set out to make the empire
      speak with one voice.
      Arabic for the administration.
      Arabic for the coins.
      Arabic for the law.
      I watched the edicts go out from Damascus.
      He was not a conqueror; he was a builder —
      of the machinery that would hold
      a hundred peoples together.
      The Marwanids took hold,
      and the caliphate became
      not just an army, but a civilization.
    description: "Abd al-Malik becomes caliph and sets out to make the empire speak Arabic — turning conquest into civilization."
    status: "published"
    sha256: "a927ff3d6c84106c9b3e0f0c238eeb5945389713506925a8172fae77b08b4003"
  - number: "1772"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Avenger of Karbala"
    date: "686 CE"
    region: "Mesopotamia"
    poem: |
      Mukhtar raised the banner in Kufa —
      revenge for Husayn,
      blood for Karbala.
      The poor, the freedmen, the non-Arab converts
      flocked to him,
      and Iraq shook to its roots.
      I walked through Kufa in those months:
      hope and terror in the same streets.
      Mukhtar hunted down Husayn's killers,
      one by one, and executed them.
      Justice? Vengeance? Both.
      His revolt burned bright and fell,
      but it lit a fire that never went out:
      the promise that Karbala
      would be answered.
    description: "Mukhtar raises the banner of revenge for Husayn in Kufa, hunting down Karbala's killers — vengeance that lights a fire never extinguished."
    status: "published"
    sha256: "e0599b998911ba89edf40c5f8130dd5a677890f1eda6e43526610d37a1aee30d"
  - number: "1773"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Emperor's Bargain"
    date: "688 CE"
    region: "Byzantium"
    poem: |
      Justinian II needed peace —
      so he bought it.
      A treaty with Abd al-Malik:
      tribute paid, hostages exchanged,
      the frontier quiet.
      I saw the gold leave Constantinople,
      chests of it, bound for Damascus.
      The courtiers called it shameful.
      The emperor called it arithmetic:
      gold is cheaper than armies.
      And he was right, for a while.
      The empire caught its breath,
      rebuilt its walls, counted its coins.
      Sometimes the bravest thing a ruler does
      is pay for time.
    description: "Justinian II buys peace with Abd al-Malik through tribute — gold traded for the time Byzantium needs to rebuild."
    status: "published"
    sha256: "140de8cbebf53b08edc4d42c6402d30ce44410326270321d51e4e6ca34583bad"
  - number: "1774"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Law Is Written"
    date: "689 CE"
    region: "Japan"
    poem: |
      The Asuka Kiyomihara Code —
      Japan's first working system of written law,
      brush-stroked into being.
      I watched the officials unroll the scrolls:
      crimes and punishments,
      ranks and duties,
      a whole society described in clauses.
      Before this, law was custom and the word of chiefs.
      After this, it was text —
      the same for the noble and the farmer,
      at least in theory.
      A country that writes its laws
      has decided to outlive its rulers.
      Japan was making that decision.
    description: "The Asuka Kiyomihara Code gives Japan its first written legal system — law as text, meant to outlive any ruler."
    status: "published"
    sha256: "f1a66879e3fcd1b58e80584bc95a0d89b78f72317d4db29e8c10d73aa3f8ad7f"
  - number: "1775"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Woman on the Throne"
    date: "690 CE"
    region: "China"
    poem: |
      She did it.
      Wu Zetian — concubine, empress, dowager —
      declared herself emperor,
      Huangdi, in her own name.
      The only woman in Chinese history
      to rule as sovereign outright.
      I stood in the crowd at Luoyang
      as the proclamation was read.
      The ministers bowed. What else could they do?
      She had outmaneuvered them all,
      for decades, patient as water.
      Love her or fear her —
      China had never seen her like,
      and never would again.
      The throne had a woman on it,
      and the empire did not fall.
    description: "Wu Zetian declares herself emperor — the only woman to rule China in her own name, crowned by decades of patient power."
    status: "published"
    sha256: "6edaa0988b34e1c140259fa32807c8c29f0ecd2790393171acdaa45bf48a87bb"
  - number: "1776"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Dome Rises"
    date: "691 CE"
    region: "Jerusalem"
    poem: |
      On the Temple platform in Jerusalem,
      Abd al-Malik raised the Dome of the Rock —
      gold on the skyline,
      blue tiles like a piece of heaven set down on earth.
      I climbed the scaffolding with the workmen.
      Islam's first great monument,
      and what a statement:
      we are here, it said,
      and we are staying.
      Inside, the inscriptions proclaimed the faith
      in letters of gold.
      The Dome has watched Crusaders come and go,
      empires rise and fall.
      It is still there.
      Some buildings are prayers
      that never stop being prayed.
    description: "Abd al-Malik raises the Dome of the Rock over Jerusalem's Temple platform — Islam's first great monument, still standing."
    status: "published"
    sha256: "0cbc57291a60683bb36a6634869ebabd947cc4b9080dafc2bc2c2e01b7fd2fd9"
  - number: "1777"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Siege of Mecca Ends"
    date: "692 CE"
    region: "Arabia"
    poem: |
      Al-Hajjaj stormed Mecca —
      stone by stone, street by street —
      and Ibn al-Zubayr died fighting
      in the shadow of the Kaaba.
      The rival caliphate was over.
      The ummah was one again,
      under one caliph in Damascus.
      I walked the streets after the battle,
      past the damaged shrine.
      Unity had been restored —
      at the cost of Muslim blood
      spilled in the holiest city.
      The caliphate was whole.
      The scar would take longer to heal
      than the walls.
    description: "Al-Hajjaj storms Mecca and kills the rival caliph Ibn al-Zubayr — the caliphate reunited, at the cost of blood in the holy city."
    status: "published"
    sha256: "d185ab3340527835be4f61c6e7dc4656c4c66dc07b55416989fd05282eac09c3"
  - number: "1778"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Iron Chancellor"
    date: "694 CE"
    region: "Mesopotamia"
    poem: |
      Al-Hajjaj took Iraq —
      and Iraq, the wild province,
      learned what order meant.
      His speech is still quoted:
      he would rule with a famous, terrifying order,
      and the corrupt would weep.
      I traveled his roads:
      the bandits gone, the taxes collected,
      the markets policed,
      everyone walking a little straighter
      from fear.
      He built schools and canals too —
      the man was not only a fist.
      But history remembers the fist.
      The Iron Chancellor:
      proof that a province can be tamed,
      and that taming leaves marks.
    description: "Al-Hajjaj takes Iraq and imposes his famous terrifying order — bandits gone, taxes collected, a province tamed by fear."
    status: "published"
    sha256: "2aada509a1485ddc759550cc5d76543578fd6803cf521d3dc527ab35fd52919e"
  - number: "1779"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Emperor Deposed"
    date: "695 CE"
    region: "Byzantium"
    poem: |
      They seized Justinian II in the palace —
      cut off his nose, the mark of unfitness —
      and threw him in prison.
      The throne of Constantinople
      became a revolving door:
      emperor after emperor,
      each lasting a season.
      I watched the third coronation in as many years
      and stopped counting.
      An empire that mutilates its rulers
      has admitted it cannot govern them.
      But Justinian was not done —
      he would come back,
      nose or no nose,
      with an army of Bulgars.
      The door was revolving.
      He intended to revolve it himself.
    description: "Justinian II is overthrown and mutilated — the Byzantine throne becomes a revolving door, though he will return."
    status: "published"
    sha256: "3c1b37061f5068d8fff72f222b4491714e38d2c86888e3c80e34124fa223b2fd"
  - number: "1780"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Coins Change"
    date: "696 CE"
    region: "Arabia"
    poem: |
      Abd al-Malik looked at the coins —
      gold dinars stamped with emperors' faces,
      Heraclius and his sons —
      and said: no more.
      The new coinage was purely Islamic:
      no faces, only words —
      the profession of faith in flowing script.
      I held one fresh from the mint at Damascus,
      warm gold, beautiful as calligraphy.
      Money is a message, the caliph knew.
      From now on, every market from Spain to Sindh
      would read the same sentence:
      there is no god but God.
      An empire, stamped in gold.
    description: "Abd al-Malik mints purely Islamic coinage — no more emperors' faces, only the profession of faith in gold."
    status: "published"
    sha256: "5a4e855277ca94a3a87087648afa7e97fe97f6ec1921ddc588d741c14b14aee6"
  - number: "1781"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The End of Byzantine Africa"
    date: "698 CE"
    region: "North Africa"
    poem: |
      Hassan ibn al-Nu'man took Carthage —
      the great city of Hannibal and Augustine —
      and Byzantine Africa ended.
      Seven centuries of Roman rule on that coast,
      finished in a siege.
      I walked the harbor afterward,
      past the burned warehouses.
      The Vandals had taken it once;
      Belisarius had retaken it;
      now it was the caliph's.
      Carthage had been destroyed before —
      Rome had salted the earth, they say.
      This time it simply changed hands,
      and the muezzin's call replaced the church bells.
    description: "Hassan ibn al-Nu'man takes Carthage — seven centuries of Roman rule in Africa end, and the coast passes to the caliphate."
    status: "published"
    sha256: "15cbe7d0ee9ef3d6de37cbefa38f46d6e7b2112edce2de8aaf326287341d93a2"
  - number: "1782"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Road to the Oxus"
    date: "699 CE"
    region: "Central Asia"
    poem: |
      Qutayba ibn Muslim looked east —
      beyond the Oxus River,
      to the rich cities of Transoxiana:
      Bukhara, Samarkand, Khwarizm.
      He began the campaigns
      that would carry Islam across the river
      and into the heart of Asia.
      I rode with his vanguard through the desert,
      the Oxus glittering ahead.
      The frontier was about to leap
      a thousand miles in a decade.
      The caliphate had conquered west to Spain;
      now it turned east,
      toward the cities of silk and scholars.
    description: "Qutayba ibn Muslim begins the campaigns beyond the Oxus — Islam's frontier about to leap into Transoxiana."
    status: "published"
    sha256: "01193609154433a73df24afe86c271c9a347463e4312e9574fc00fdf27f7fa9e"
  - number: "1783"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Song of Beowulf"
    date: "700 CE"
    region: "Britain"
    poem: |
      Somewhere in England, a poet picked up his harp —
      and began the tale:
      of Beowulf, the Geat,
      who sailed to Denmark to kill the monster Grendel,
      who tore the beast's arm from its socket,
      who fought the dragon in his old age and died.
      I heard it sung in a mead hall,
      the fire low, the warriors silent.
      The oldest epic in English,
      sung before England was England.
      Monsters and heroes,
      gold and doom —
      the song outlived the hall,
      the harp, the singer.
      It is still singing.
    description: "A poet in England begins the tale of Beowulf — the monster-slayer's epic, sung in a mead hall, outliving them all."
    status: "published"
    sha256: "0eedea64a4bddd7799cbf7c83be8dd30e32a9885f11b26af6195cce5dd44921f"
  - number: "1784"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "A Poet Is Born"
    date: "701 CE"
    region: "China"
    poem: |
      Li Bai was born —
      the banished immortal,
      the greatest poet China ever produced,
      who would drink the moon into verse
      and make drunkenness a philosophy.
      I did not meet the infant, of course.
      But I have walked the roads he would walk,
      drunk in the taverns he would empty,
      seen the moon he would address as a friend.
      Ten thousand poems, they say he wrote —
      a thousand survive.
      Each one a window
      into the brightest, freest soul
      the Tang ever made.
      The banished immortal had arrived.
    description: "Li Bai is born — the \"banished immortal\" who will become China's greatest poet, drinking the moon into verse."
    status: "published"
    sha256: "a6d1d38751d488b995c367c503bba563a830f4e4c16e845407a96201541a0944"
  - number: "1785"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Taiho Code"
    date: "701 CE"
    region: "Japan"
    poem: |
      Japan wrote its first complete law code —
      the Taiho Code, the Great Treasure law —
      a state built in the Tang mirror:
      ministries, ranks, taxes, provinces,
      all described, all ordered.
      I read it in the archives at Nara,
      scroll after scroll of careful clauses.
      China's system, translated into Japanese hands —
      but not a copy.
      An adaptation, a choice:
      we will be a bureaucratic state,
      but our own.
      The Taiho Code governed Japan
      for centuries.
      Some laws are written in a year
      and obeyed for five hundred.
    description: "Japan completes the Taiho Code — its first full law code, a state built in the Tang mirror but distinctly its own."
    status: "published"
    sha256: "e6aea2d64450c01afc27010ae0178630d8d2d9fe5f1f503e22637da7b2a63912"
  - number: "1786"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Warrior Queen Falls"
    date: "703 CE"
    region: "North Africa"
    poem: |
      Al-Kahina — the Berber queen, the seeress —
      had held the Maghreb against the Arabs
      for years, burning the fields
      so the invaders would starve.
      They called her the sorceress.
      She was simply a brilliant general.
      At last she was defeated,
      and the Maghreb opened.
      I stood where she fell,
      the burned fields green again.
      They say she sent her sons to the Arabs
      before the final battle,
      so they would live.
      A queen to the end:
      she lost her kingdom
      and saved her children.
    description: "The Berber queen al-Kahina is defeated after years of resistance — a brilliant general who sends her sons to safety before the end."
    status: "published"
    sha256: "fc850decc72818053694192ee0b99dfbf1e07836d6085a9b7c6a8eb0fc6c4ac9"
  - number: "1787"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Builder Caliph"
    date: "705 CE"
    region: "Arabia"
    poem: |
      Al-Walid I took the throne
      and built —
      mosques from Damascus to Medina,
      roads, wells, hospitals for the blind and the lame.
      The Builder Caliph.
      I walked the construction sites at Damascus,
      dust in my teeth, the stonemasons singing.
      An empire that had conquered
      now had to house itself,
      and al-Walid gave it roofs.
      The Umayyad Mosque, the Prophet's Mosque rebuilt —
      stone sermons, all of them.
      Conquest takes a decade.
      Building takes a reign.
      He gave it one.
    description: "Al-Walid I becomes caliph and builds — mosques, roads, wells, hospitals — giving the conquered empire its roofs."
    status: "published"
    sha256: "a19a206791f015f04c8105813eb2cb67c381c649d7d732224dd80cd1988e11da"
  - number: "1788"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Great Mosque Rises"
    date: "706 CE"
    region: "Syria"
    poem: |
      In Damascus the craftsmen began —
      the Umayyad Mosque,
      rising on the site of a church,
      its columns Roman, its dome Islamic,
      its mosaics showing paradise in green and gold.
      I carried water to the masons one summer.
      They worked like men building for God,
      because they were.
      A church's columns under an Islamic dome:
      the whole history of the city
      in a single building.
      It stands today, much as it stood then.
      Some buildings are not finished.
      They are simply continued.
    description: "Craftsmen begin the Umayyad Mosque of Damascus — Roman columns under an Islamic dome, paradise in green and gold mosaic."
    status: "published"
    sha256: "5b9d21a887aa4247c1ffb1e416b2193709896d27bc7396140ca16ac775087ddc"
  - number: "1789"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Musa's Harbor"
    date: "709 CE"
    region: "North Africa"
    poem: |
      Musa ibn Nusayr secured Tangier —
      the harbor, the strait, the launching point.
      I stood on the African shore
      and looked across the water at Spain:
      fourteen miles of blue,
      and a kingdom ripe for the taking.
      The Visigoths were feuding;
      their king was unpopular;
      the moment was perfect.
      Musa had finished the work
      Uqba had dreamed of —
      the Maghreb pacified, the strait open.
      All that remained
      was to cross it.
    description: "Musa ibn Nusayr secures Tangier — the strait to Spain lies open, fourteen miles of blue water from a new world."
    status: "published"
    sha256: "99354090f010a9648ce29d2a074bd9359ab9ca500a11759f6f6eaedfbb0f8e31"
  - number: "1790"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Cities Beyond the River"
    date: "709 CE"
    region: "Central Asia"
    poem: |
      Qutayba took Bukhara —
      the great oasis city,
      its markets full of silk and scholars —
      and the caliphate's frontier
      leaped into Transoxiana.
      I walked Bukhara's streets that autumn,
      past the domed bazaars.
      The Zoroastrians kept their fire temples;
      the Buddhists kept their stupas;
      the new rulers kept the taxes flowing.
      Beyond the river, the cities fell like dominoes:
      Samarkand next, then Khwarizm.
      Islam had crossed the Oxus,
      and Central Asia would never be the same.
    description: "Qutayba takes Bukhara — the caliphate's frontier leaps beyond the Oxus into the silk cities of Transoxiana."
    status: "published"
    sha256: "c69d0fc810c8cceb436610b4cd3d024ef6c08a588cefc0d84eb4f0c4ce349200"
  - number: "1791"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Nara, the First Capital"
    date: "710 CE"
    region: "Japan"
    poem: |
      The court settled at Heijo-kyo —
      Nara, laid out in a grid like Chang'an,
      palaces and temples rising from the plain.
      Japan's first permanent capital,
      and its classical age began.
      I walked the great avenue at dawn,
      the Suzaku Gate ahead of me.
      No more moving the palace
      every time an emperor died —
      Japan had decided to stay put,
      to build for centuries, not seasons.
      Nara: seventy years of glory,
      of poetry and Buddhism and law,
      the childhood of a civilization.
    description: "The Japanese court settles at Nara, its first permanent capital — laid out like Chang'an, built to last centuries."
    status: "published"
    sha256: "4987e3822d9230d42c66041ff38b2b6bb977ad56de10acd0dc7f13f51e50ac14"
  - number: "1792"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Landing at Gibraltar"
    date: "711 CE"
    region: "Spain"
    poem: |
      Tariq ibn Ziyad crossed the strait —
      seven thousand men in borrowed boats —
      and landed on the rock that bears his name:
      Jabal Tariq. Gibraltar.
      They say he burned the boats.
      At Guadalete the Visigothic kingdom
      collapsed in a single battle,
      King Roderick dead in the river.
      I stood on that rock afterward,
      Spain spread before me.
      In seven years, almost the whole peninsula
      would be Muslim.
      It began with one crossing,
      one rock, one man who would not go back.
    description: "Tariq ibn Ziyad lands at Gibraltar and crushes the Visigoths at Guadalete — Spain begins its eight centuries under Islam."
    status: "published"
    sha256: "d56ebf60803526b1bf65d4e4c13af0688a0f7477134e381c1839f9227dbde7c3"
  - number: "1793"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Indus Frontier"
    date: "712 CE"
    region: "India"
    poem: |
      Muhammad ibn Qasim was seventeen —
      a boy general —
      when he took Sindh for the caliphate,
      sailing up the Indus with siege engines.
      Islam reached the subcontinent.
      I watched his army cross the river,
      the elephants of the local rajas
      facing Arab cavalry.
      Debal fell. Multan fell — the City of Gold.
      The boy showed mercy to the Hindus and Buddhists,
      let them keep their temples for a tax.
      The frontier of the faith
      now touched India,
      and would never leave.
    description: "Seventeen-year-old Muhammad ibn Qasim takes Sindh — Islam reaches the Indian subcontinent and never leaves."
    status: "published"
    sha256: "a542c330fce8f5104be61a4b1dfa4428d357a00341105a8b490ffbeb6939775a"
  - number: "1794"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Kojiki Is Written"
    date: "712 CE"
    region: "Japan"
    poem: |
      O no Yasumaro took up the brush
      and wrote the Kojiki —
      Japan's oldest chronicle,
      gods and emperors set down in writing:
      Izanagi and Izanami stirring the ocean,
      Amaterasu in her cave,
      Jimmu descending to rule.
      I read it fresh, the ink barely dry.
      Before this, the myths lived in singers' mouths.
      After this, they lived forever —
      fixed, official, imperial.
      Every nation needs its beginning written down.
      Japan wrote hers in 712,
      and has been reading her ever since.
    description: "The Kojiki is written — Japan's gods and emperors set down in the oldest chronicle, myths fixed in ink forever."
    status: "published"
    sha256: "383d33dfb60d309f3d55ea0e0dab01468becb56a87743df45f0210b9b4c036ea"
  - number: "1795"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Bright Emperor"
    date: "713 CE"
    region: "China"
    poem: |
      Xuanzong took the throne —
      the Bright Emperor —
      and the High Tang began:
      the golden age of poetry,
      of Li Bai and Du Fu,
      of Chang'an the greatest city on earth.
      I was in the capital that year,
      and the air itself felt golden.
      Forty years of glory lay ahead —
      music, verse, cosmopolitan streets
      full of Persians and Turks and Koreans.
      No one knew how it would end:
      in rebellion, in ruin.
      But that year, the future was all light,
      and the Bright Emperor shone over it.
    description: "Xuanzong takes the throne and the High Tang begins — the golden age of Chinese poetry, all light and promise."
    status: "published"
    sha256: "db3739d90723f04f2071f7e8e72f03f0e2227abfaac7ac6033378e07d979143f"
  - number: "1796"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Frontier General Falls"
    date: "715 CE"
    region: "Central Asia"
    poem: |
      Qutayba ibn Muslim died in revolt —
      the conqueror of Transoxiana,
      brought down not by enemies
      but by his own soldiers,
      in a mutiny on the frontier.
      I heard the news in Merv,
      and the bazaars went quiet.
      The eastward drive stalled.
      The great leap beyond the Oxus
      paused, leaderless.
      Empires run on men, not maps —
      and when the man falls,
      the map stops moving.
      Qutayba's cities stayed Muslim.
      But the momentum died with him,
      in the dust of a mutineer's camp.
    description: "Qutayba ibn Muslim dies in a soldiers' revolt — the eastward drive stalls, momentum dying with the man."
    status: "published"
    sha256: "78ff1d60780193e7abdaf38809ffaeab29cd1540bb75ba918217e1f65f66d945"
  - number: "1797"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Second Great Siege"
    date: "717 CE"
    region: "Byzantium"
    poem: |
      Maslama came with everything —
      a huge army by land,
      a fleet by sea,
      the caliphate's full weight
      against the triple walls.
      Leo III waited behind them,
      new-crowned, calm,
      with Greek fire and empty granaries for the enemy.
      I was inside the city when the siege closed.
      The Golden Horn was chained.
      The walls were manned.
      Outside, the greatest army Islam had ever assembled
      settled in to starve us out.
      They did not know Leo.
      They did not know the winter coming.
    description: "Maslama's huge army rings Constantinople for the second great siege — Leo III waits behind triple walls with Greek fire."
    status: "published"
    sha256: "408b3d848cdc22cbd58b9e3b3b54581ea1a974f85f36764a6c2e8419dbadb47e"
  - number: "1798"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Winter That Saved an Empire"
    date: "718 CE"
    region: "Byzantium"
    poem: |
      The winter came like a hammer —
      snow for a hundred days,
      men freezing in their tents,
      horses dying, supplies gone.
      The Bulgars struck from the rear.
      Greek fire burned the ships.
      The great siege broke,
      and the Arab tide turned —
      for good, this time.
      I walked the walls in the spring thaw
      past the abandoned camps.
      Constantinople had saved itself,
      and in saving itself, saved Europe:
      no Muslim army would ever come this close again.
      One winter. That was all it took
      to change the map of the world forever.
    description: "A brutal winter, Bulgar attacks, and Greek fire break the second siege — the Arab tide turns for good, and Europe is saved."
    status: "published"
    sha256: "524729cc2042ec64f27add37aa7468e8285dc6accd81e425b66adb526f185680"
  - number: "1799"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Nihon Shoki"
    date: "720 CE"
    region: "Japan"
    poem: |
      Japan completed its second great chronicle —
      the Nihon Shoki,
      history as the court wished it remembered:
      neater than the Kojiki,
      more Chinese, more official,
      emperors lined up like beads on a string.
      I compared the two in the Nara archives.
      The Kojiki sang; the Shoki stated.
      Both were true, and both were politics —
      the past, arranged to justify the present.
      Every state writes its history twice:
      once to remember, once to rule.
      Japan had now done both.
    description: "Japan completes the Nihon Shoki — its second chronicle, history arranged by the court to justify the present."
    status: "published"
    sha256: "59308ca94c24adc3e040f7ac5531d4f79669f3e6dcbd4c646b935c48c3355ea3"
  - number: "1800"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Poet of Sorrow Is Born"
    date: "722 CE"
    region: "China"
    poem: |
      Du Fu was born —
      the Poet of Sorrow,
      who would sing the Tang's glory
      and then its ruin,
      in verses that break the heart
      thirteen centuries later.
      Li Bai was the banished immortal;
      Du Fu was the conscience.
      I never met the infant.
      But I have stood in the ruins he would weep over,
      held the poems he would write in exile,
      and felt the weight of a man
      who loved his country enough
      to tell the truth about it.
      The golden age had its singer.
      It did not know it was also getting its mourner.
    description: "Du Fu is born — the poet who will sing the Tang's glory and mourn its ruin, China's conscience in verse."
    status: "published"
    sha256: "d540b8f45cc40dfd2194596272918c53ced7b268c4f6fbc3e2df8c39fa3752c9"
  - number: "1801"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Oak of Thor Falls"
    date: "723 CE"
    region: "Germania"
    poem: |
      Boniface stood before the sacred oak —
      the Donar Oak, holy to the pagans —
      raised his axe, and felled it.
      The crowd held its breath, waiting for Thor's wrath.
      Nothing happened.
      So Boniface built a chapel from the wood,
      right there, on the spot.
      I watched the pagans' faces.
      Their god had not struck the Christian down.
      Some converted on the spot.
      The oak of Thor became the chapel of Christ —
      and Germany's conversion
      was cut, like the tree,
      at the root.
    description: "Saint Boniface fells Thor's sacred oak and builds a chapel from its wood — the pagans' god does not strike, and Germany converts."
    status: "published"
    sha256: "f7c489d5307dbefa48cdbb2caae78b6ba5f41648dc405650c49056ef347d7547"
  - number: "1802"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Water Clock of Yi Xing"
    date: "725 CE"
    region: "China"
    poem: |
      The monk Yi Xing built a wonder:
      an armillary sphere of the heavens,
      driven by falling water,
      gears turning, rings rotating,
      the cosmos in clockwork.
      I watched it work in the palace —
      water dripping, wheels turning,
      the stars wheeling overhead in brass.
      A thousand years before Europe's clocks,
      China had mechanized the sky.
      Yi Xing was an astronomer and a monk;
      he measured the heavens
      to understand the mind of Buddha.
      The water fell. The gears turned.
      The universe, on schedule.
    description: "The monk-astronomer Yi Xing builds a water-driven clockwork armillary sphere — the cosmos mechanized, a millennium before Europe's clocks."
    status: "published"
    sha256: "1f0de01479b7d19fd0458501622c89160c4974b2e68d4016bc6467d5f511953e"
  - number: "1803"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Iconoclasm Begins"
    date: "726 CE"
    region: "Byzantium"
    poem: |
      Leo III ordered the icons destroyed —
      the images of Christ and the saints,
      smashed, burned, whitewashed.
      Idolatry, he said.
      I watched soldiers pry a mosaic of Christ
      off a church wall in Constantinople,
      the tesserae scattering like tears.
      The empire would quarrel over images
      for a hundred years:
      emperors against monks,
      iconoclasts against iconodules,
      a civil war of art.
      Can God be pictured?
      Byzantium bled over the question.
    description: "Leo III orders the icons destroyed — Byzantium begins a century-long quarrel over whether God can be pictured."
    status: "published"
    sha256: "9fe4968f8c04df269bc9097951b24bcbd062627cccb27d422a54bb122cfbaa05"
  - number: "1804"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Numbers Travel West"
    date: "727 CE"
    region: "India"
    poem: |
      Brahmagupta's numerals began their long journey —
      the nine digits, and his daring zero,
      a number for nothing,
      traveling west toward Baghdad
      on the tongues of merchants and scholars.
      I copied them in a bazaar in Sindh,
      these strange Indian figures.
      The Arabs would call them Hindi numerals;
      Europe would call them Arabic.
      Nobody would call them what they were:
      the most powerful idea in mathematics,
      a circle meaning nothing,
      that made everything countable.
      Zero was traveling.
      The world would never be the same.
    description: "Brahmagupta's numerals — and the daring zero — begin their journey west toward Baghdad, the most powerful idea in mathematics."
    status: "published"
    sha256: "c06754ff6ea381adbec219bff15267fa5aa6a2aaa049adfce64ba9bf7b45b91c"
  - number: "1805"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Weeping Preacher"
    date: "728 CE"
    region: "Arabia"
    poem: |
      Hasan al-Basri died in Basra —
      the Weeping Preacher,
      whose sermons made caliphs tremble
      and sinners weep in the mosque.
      He preached against the luxury of the Umayyad court,
      against the worldliness of power,
      for the inward life, the examined heart.
      I heard him once, an old man by then,
      his voice cracking with urgency.
      From his sermons grew Sufism —
      Islam's mystic heart,
      the search for God within.
      He wept for the world.
      The world is still weeping,
      and still searching.
    description: "Hasan al-Basri dies in Basra — the Weeping Preacher whose sermons plant the seed of Sufism, Islam's mystic heart."
    status: "published"
    sha256: "6b44cb19d2afab635d0632ddf5a52cbff297cbaa407ffaa3d520de21ea842d8a"
  - number: "1806"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Examination Hall"
    date: "729 CE"
    region: "China"
    poem: |
      Under Xuanzong the examination halls widened —
      the imperial exams,
      where a peasant's son could sit beside a lord's
      and write his way into office.
      I watched the candidates file in at Chang'an,
      brushes in hand, futures at stake.
      Three days locked in tiny cells,
      writing essays on the classics.
      The fairest system on earth, they said —
      and for its time, it was.
      Merit over blood.
      A dream you could study for.
      China would run on this idea
      for a thousand years.
    description: "The imperial examinations widen under Xuanzong — a peasant's son can write his way into office; merit over blood."
    status: "published"
    sha256: "09dafff4012c359181edb9c5850457c66aff77487a6d1a84413d73973582af73"
  - number: "1807"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Mad Calligrapher"
    date: "730 CE"
    region: "China"
    poem: |
      Zhang Xu drank, then wrote —
      wild cursive, characters flying off the brush
      like birds startled from a field.
      The Mad Calligrapher.
      They said he would soak his hair in ink
      and paint with it, dancing.
      I saw his work in Chang'an:
      illegible, magnificent,
      drunkenness turned into art.
      The Tang loved him for it —
      the age's freedom, its joy,
      its refusal to color inside the lines.
      Some art is made by discipline.
      His was made by letting go.
    description: "Zhang Xu's wild cursive turns drunkenness into art — the Tang's freedom and joy flying off the brush."
    status: "published"
    sha256: "83e3ba6c8f10b75bd60a199afc056f8e66a4cd294675221e82eb4043502726af"
  - number: "1808"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Khazar Bride"
    date: "732 CE"
    region: "Byzantium"
    poem: |
      The emperor's son married a Khazar princess —
      Irene, they called her, though her steppe name
      was something wilder —
      and the steppe entered the palace.
      I watched the wedding procession in Constantinople:
      Khazar horsemen riding beside Byzantine guards,
      two worlds in one ceremony.
      Diplomacy by marriage:
      the oldest treaty there is.
      The Khazars got prestige;
      Byzantium got an ally against the Arabs.
      And in the palace, a steppe princess
      learned to be an empress.
      The frontier had come indoors.
    description: "The Byzantine heir marries a Khazar princess — steppe diplomacy enters the palace in a wedding procession."
    status: "published"
    sha256: "ce576fcee9f33fbcc2f7bca818e48ec7c7b70eceb147f44edabbe861c2fc6228"
  - number: "1809"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Hammer at Tours"
    date: "732 CE"
    region: "Francia"
    poem: |
      Charles Martel stood at Tours —
      the Hammer —
      his Frankish infantry locked shield to shield
      against the Umayyad cavalry.
      They came in waves, the horsemen;
      the Franks did not move.
      Abd al-Rahman fell.
      The army broke and melted back over the Pyrenees.
      I walked that field at dusk.
      The Muslim advance into Europe
      stopped here, in a muddy field in France.
      History's great what-ifs begin at Tours:
      what if the Hammer had missed?
      He didn't.
    description: "Charles Martel stops the Umayyad advance at Tours-Poitiers — the Hammer holds the line, and Europe's fate turns on it."
    status: "published"
    sha256: "d8bb99bc222e4d7e773d0a40e88356e4815a4822439f4d33e987b53054729121"
  - number: "1810"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Last Satirist"
    date: "732 CE"
    region: "Arabia"
    poem: |
      Al-Farazdaq died —
      the last of the great satirists,
      Jarir's old enemy, the desert verse-duelist.
      I had laughed at their battles for years.
      Now one chair at the feast was empty.
      Jarir outlived him, they say,
      and wept at the news —
      fifty years of insults,
      and the man was his brother in verse.
      The age of the desert verse-duels ended
      not with a final poem
      but with a funeral.
      The court was quieter after.
      Poetry always is,
      when its fighters are gone.
    description: "Al-Farazdaq dies — the age of the desert verse-duels ends, and even his old rival Jarir weeps."
    status: "published"
    sha256: "3d6882395dfa9ee2d471117394cf5796ffc25930789d616a859312c2d27831e7"
  - number: "1811"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Wise Khagan Dies"
    date: "734 CE"
    region: "Steppe"
    poem: |
      Bilge Khagan was murdered —
      the Wise Khagan of the Turks,
      poisoned, they say, by his own men.
      But his memorial stones stand on the steppe,
      carved with Old Turkic runes,
      speaking to the future:
      I was khagan, they say. I ruled. Remember.
      I traced those runes with my fingers.
      A whole language, a whole empire of horsemen,
      preserved in stone on the windy plain.
      The khagan died by treachery.
      His words refused to die at all.
    description: "Bilge Khagan is murdered, but his memorial stones speak Old Turkic to the future — words that refuse to die."
    status: "published"
    sha256: "ed2a973df1f2dc782a323226c03c6ab44ab0b61e8e28b3df6177d8e8644febff"
  - number: "1812"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Smallpox Year"
    date: "735 CE"
    region: "Japan"
    poem: |
      Smallpox came to Nara —
      the court's first great epidemic,
      sweeping the palaces,
      emptying the ministries,
      rewriting the succession in a season.
      I walked streets where the nobles' mansions
      stood silent, shutters closed.
      Four of the Fujiwara brothers died —
      the men who ran the government.
      A disease, invisible, indifferent,
      did what no army could:
      it decapitated a state.
      Japan learned the lesson
      every civilization learns:
      the smallest enemy
      is the hardest to fight.
    description: "Smallpox sweeps the Nara court, killing the Fujiwara brothers who ran the government — an invisible enemy decapitating a state."
    status: "published"
    sha256: "d166ce3fa89c5f7df4e483d16d80933f71162e08825694c5c5739edef0fad7c8"
  - number: "1813"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Kingless Years"
    date: "737 CE"
    region: "Francia"
    poem: |
      The last Merovingian puppet died —
      a king in name only,
      long-haired, powerless —
      and Charles Martel did not bother replacing him.
      Francia had no king at all.
      Just the Hammer, ruling as mayor of the palace,
      with the crown sitting empty.
      I attended his court:
      everyone knew who was in charge.
      The fiction of Merovingian kingship
      was finally dropped,
      and nobody missed it.
      Kings are useful, Charles proved,
      but only if they rule.
      A crown with no power in it
      is just jewelry.
    description: "The last Merovingian puppet dies and Charles Martel rules Francia with no king at all — the crown sitting empty, power undisguised."
    status: "published"
    sha256: "7e75472f9168d77ae6d541ce2d84e2c0c026dfd2a492e6f67163b7eaa3bf8541"
  - number: "1814"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Revolt of Zayd"
    date: "740 CE"
    region: "Arabia"
    poem: |
      Zayd ibn Ali rose in Kufa —
      the Prophet's great-grandson,
      rising against the Umayyads
      for justice, for the house of Ali.
      The people promised him thousands.
      Hundreds came.
      He died a martyr's death in the streets,
      his body crucified, then burned.
      I stood in Kufa afterward,
      the ashes still warm.
      Another failed rising.
      But the Shi'a remembered:
      Zayd, the brave, the betrayed-by-numbers.
      Martyrdom needs no victory
      to be remembered.
      It needs only to be true.
    description: "Zayd ibn Ali rises in Kufa against the Umayyads and dies a martyr — another failed rising the Shi'a never forget."
    status: "published"
    sha256: "88d531dae781463b543265c75bb16f5ec70e5bec080cd229c70a5a574d5eec39"
  - number: "1815"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Hammer's Sons"
    date: "741 CE"
    region: "Francia"
    poem: |
      Charles Martel died —
      the Hammer laid down at last —
      and his sons Pepin and Carloman
      divided Francia between them.
      I watched the funeral procession,
      the great mayor borne to Saint-Denis.
      He had saved Europe at Tours,
      ruled without a crown,
      and left his sons an undivided purpose:
      finish what he started.
      Pepin the Short, Carloman the pious —
      two very different men,
      one inheritance.
      Francia held together.
      The Hammer's work
      did not die with him.
    description: "Charles Martel dies and his sons Pepin and Carloman divide Francia — the Hammer's work carried on by his heirs."
    status: "published"
    sha256: "6618c147d1a882957e5839cfa48ef9cafebea9c3bd53ab266c344e1881162e7b"
  - number: "1816"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Great Buddha Is Decreed"
    date: "743 CE"
    region: "Japan"
    poem: |
      Emperor Shomu decreed it:
      a colossal Buddha for Nara,
      sixteen meters of bronze,
      a prayer you could see from the hills.
      I watched the proclamation read at court.
      The smallpox years had shaken the emperor;
      he wanted a protector for the realm,
      a Buddha big enough to guard a nation.
      Copper, gold, lacquer, labor —
      the whole country would contribute.
      A prayer in bronze:
      the most expensive prayer
      Japan ever prayed.
    description: "Emperor Shomu decrees a colossal bronze Buddha for Nara — a sixteen-meter prayer to guard the realm after the plague years."
    status: "published"
    sha256: "1fd9ffa6616ed5469fa1181b203fd13accd16e2b25fdfb312612010ec3d0799c"
  - number: "1817"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Caliphate Unravels"
    date: "744 CE"
    region: "Arabia"
    poem: |
      Al-Walid II was murdered —
      a caliph killed by his own family —
      and the third fitna began:
      civil war, the Umayyads bleeding
      from a hundred cuts.
      I traveled Syria that year,
      and every city had a different caliph,
      every tribe a different grievance.
      The empire that had conquered
      from Spain to Sindh
      was eating itself.
      Fitna: the word means trial, temptation, civil war —
      all three at once.
      The Umayyads would not survive it.
      Something black was rising in the east.
    description: "Al-Walid II is murdered and the third fitna begins — the Umayyad caliphate bleeding from a hundred cuts while black banners rise in the east."
    status: "published"
    sha256: "6a30ad545e98f0f0845abccd2c69f0e7b75bd8bbd7f462be65e9b9f822313ebd"
  - number: "1818"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Three Poets, One Wine Shop"
    date: "744 CE"
    region: "China"
    poem: |
      Li Bai, Du Fu, and Gao Shi —
      the three greatest poets of the Tang —
      met in a wine shop.
      I was there. I swear I was there.
      The wine flowed; the verses flew;
      the golden moment of Chinese poetry
      happened over a table sticky with spilled wine.
      Li Bai the immortal, Du Fu the conscience,
      Gao Shi the soldier-poet —
      together for one evening.
      History has cathedrals and battles.
      It also has this:
      three friends, drunk on wine and words,
      at the peak of the world.
    description: "Li Bai, Du Fu, and Gao Shi meet in a wine shop — the golden moment of Tang poetry over spilled wine."
    status: "published"
    sha256: "01a2fbcd6cb12a7757df73d488ce2c6dc1a343d665bc06d28413f8ff317c3f32"
  - number: "1819"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Uyghurs Rise"
    date: "745 CE"
    region: "Steppe"
    poem: |
      The Second Turk Khaganate fell —
      its last khagan murdered,
      its tribes scattered —
      and the Uyghurs took the steppe:
      a new khaganate, centered on the Orkhon,
      rich on the Silk Road trade.
      I rode through their capital, Ordu-Baliq,
      half city, half camp.
      The steppe reshuffles its powers
      like a gambler reshuffles cards —
      same game, new hands.
      The Uyghurs would rule the grass sea
      for a century,
      patrons of Manichaeism and Buddhism,
      merchants in armor.
    description: "The Uyghur Khaganate takes the steppe after the Turks fall — merchant-warriors ruling the grass sea from Ordu-Baliq."
    status: "published"
    sha256: "65f05fdb55746fcfc7aea6da166ec18d4dade186fd6e6cc78e5a9459ae371564"
  - number: "1820"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Black Banners"
    date: "747 CE"
    region: "Central Asia"
    poem: |
      Abu Muslim raised the revolt in Khurasan —
      black banners against the Umayyads' white,
      the Abbasids' claim carried east to west.
      I saw the black flags go up in Merv.
      The Persians flocked to them,
      the Shi'a, the discontented —
      everyone the Umayyads had wronged.
      Black: the color of mourning,
      of vengeance, of the new order.
      The revolution spread like fire in dry grass.
      Damascus did not see it coming.
      By the time the Umayyads understood,
      the black banners were at their gates.
    description: "Abu Muslim raises the Abbasid revolt in Khurasan — black banners against white, a revolution spreading like fire."
    status: "published"
    sha256: "4b2ad004f3440b20600dd30ff2ee76e63380509bb683690cac51186538d99e17"
  - number: "1821"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The River of Blood"
    date: "750 CE"
    region: "Mesopotamia"
    poem: |
      At the Zab River the Umayyads fell —
      the last caliph fleeing,
      hunted down in Egypt,
      the dynasty ended in blood.
      The Abbasids took the caliphate,
      and the rivers ran red, they say.
      I crossed the Zab after the battle.
      Ninety years of Umayyad rule —
      Spain to Sindh —
      finished in an afternoon.
      The Abbasids would build Baghdad,
      translate the Greeks,
      give the world algebra.
      But every golden age
      begins with a river of blood.
      This one was no different.
    description: "At the Zab, the Umayyads fall and the Abbasids take the caliphate — ninety years of rule ending in a river of blood."
    status: "published"
    sha256: "1512eed2934ec97dcb1127f538756091273aa2327956819e744142c667d4b55a"
  - number: "1822"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Paper Prisoners"
    date: "751 CE"
    region: "Central Asia"
    poem: |
      At Talas the Arabs beat the Chinese —
      and among the prisoners were papermakers.
      They brought their craft west:
      soon the mills rose in Samarkand,
      then Baghdad —
      paper, cheap and plentiful,
      replacing parchment and papyrus.
      I held a sheet fresh from the Samarkand mill,
      thin, strong, miraculous.
      One battle's prisoners
      changed the world more than the battle:
      paper made books cheap,
      books made knowledge travel,
      knowledge made everything else.
      Talas is remembered as a battle.
      It should be remembered as a gift.
    description: "Captured Chinese papermakers bring their craft west after Talas — paper mills rise in Samarkand and Baghdad, and knowledge becomes cheap."
    status: "published"
    sha256: "5925ed9c7995d829a191034772fc78fe7675bd01549d1042ff9dca8bcf58cd58"
  - number: "1823"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Eye-Opening"
    date: "752 CE"
    region: "Japan"
    poem: |
      The Great Buddha of Todai-ji was finished —
      sixteen meters of bronze —
      and the whole court gathered for the eye-opening:
      the ceremony painting in the eyes,
      waking the statue to life.
      I stood in the crowd at Nara,
      thousands strong, incense thick.
      When the eyes were painted,
      a gasp went through the multitude —
      the Buddha looked at them.
      Or they looked at themselves,
      reflected in bronze.
      Either way: the prayer was complete.
      The guardian of the realm was awake.
    description: "The Great Buddha of Todai-ji is dedicated at Nara — the eye-opening ceremony wakes sixteen meters of bronze before the whole court."
    status: "published"
    sha256: "393a634ea99e200bdd037d9e2094d03ea7252bf9a3f8ce570f39e3389f270867"
  - number: "1824"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Donation of Pepin"
    date: "753 CE"
    region: "Italy"
    poem: |
      Pepin gave the Pope the lands of central Italy —
      taken from the Lombards,
      granted to Saint Peter:
      the Donation of Pepin.
      I stood in Rome when the deed was read.
      The Papal States began that day —
      a thousand years of the Pope as a prince,
      ruling territory, fielding armies.
      The Franks got a crowned king;
      the Pope got a kingdom.
      It was a bargain, both sides knew.
      But bargains between thrones and altars
      have a way of outliving
      the men who make them.
    description: "Pepin grants central Italy to the Pope — the Papal States begin, a thousand years of the Pope as a territorial prince."
    status: "published"
    sha256: "d87459c8b648385fae0ef7a19cbcacd92c2b32a06a03b7a40a2384732351d80e"
  - number: "1825"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The General Turns His Coat"
    date: "754 CE"
    region: "China"
    poem: |
      An Lushan was the Tang's great frontier general —
      Sogdian-Turkic, huge, favored by the emperor,
      commander of the finest armies in the north.
      And he was readying those armies
      against the throne.
      I saw his troops mustering on the frontier,
      veterans of a hundred border wars.
      The court in Chang'an suspected nothing;
      the emperor doted on him.
      But the general had turned his coat already —
      in his heart, if not yet in the field.
      The brightest year of the Tang
      was about to become its darkest.
    description: "The frontier general An Lushan readies his veteran armies against the Tang throne — the golden age about to shatter."
    status: "published"
    sha256: "a39aaea41be55ac79ead8ff28ed0db026a4e731119c9c422242b24a947f460d6"
  - number: "1826"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "An Lushan Rebels"
    date: "755 CE"
    region: "China"
    poem: |
      He turned his army south —
      An Lushan, the rebel general —
      and marched on Chang'an.
      The High Tang shattered:
      the emperor fled,
      the capital fell,
      millions died in the years of war.
      I was on the road with the refugees,
      the golden age dissolving around us.
      Li Bai was imprisoned; Du Fu fled;
      the poets' wine shop world was gone.
      The An Lushan rebellion:
      the wound the Tang never healed from,
      the end of everything bright.
      Eight years of war.
      China would never be innocent again.
    description: "An Lushan marches on Chang'an — the High Tang shatters in eight years of rebellion; the golden age ends in refugee columns."
    status: "published"
    sha256: "10ef883e2bdf32e807fc6cb704560b97708f77522d76718ad310a59ec9695f4b"
  - number: "1827"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Falcon of Andalusia"
    date: "756 CE"
    region: "Spain"
    poem: |
      Abd al-Rahman landed in Spain —
      the last Umayyad, the Falcon —
      fleeing the Abbasid slaughter,
      and founded the emirate of Cordoba.
      I watched him come ashore,
      a prince with nothing but his name.
      Within years he ruled Andalusia,
      built a state to rival Baghdad,
      made Cordoba a light of learning.
      The Umayyads had fallen in the east;
      they rose in the west,
      like a falcon stooping and soaring.
      Exile became empire.
      The hunted became the hunter.
    description: "Abd al-Rahman I, last of the Umayyads, lands in Spain and founds the emirate of Cordoba — exile becoming empire."
    status: "published"
    sha256: "c940d5b781aee62946381fe6b32cbdf35c7f2e89343a24e57f4784c7b430f2a2"
  - number: "1828"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "A Grammar Is Born"
    date: "760 CE"
    region: "Persia"
    poem: |
      Sibawayh was born in Persia —
      a non-Arab who would write al-Kitab,
      the Book that fixed Arabic grammar
      for all time.
      I did not meet the infant.
      But I have held his book,
      a thousand pages of rules
      so complete that thirteen centuries of scholars
      have only annotated it, never replaced it.
      A Persian, perfecting the Arabs' language —
      the caliphate's genius in one life:
      it did not matter where you were born.
      It mattered what you could do
      with words.
    description: "Sibawayh is born — the Persian scholar whose Book will fix Arabic grammar for thirteen centuries."
    status: "published"
    sha256: "466a172cf90b33278814e504ff012076d6d9d2b0076b11cb4ecdf63ffa30e66c"
  - number: "1829"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Round City"
    date: "762 CE"
    region: "Mesopotamia"
    poem: |
      Al-Mansur founded Baghdad —
      the City of Peace —
      in a perfect circle:
      walls within walls,
      the caliph's palace at the center,
      like the universe in brick.
      I walked the construction site,
      the circle being drawn with geometry.
      No city had ever been planned like this —
      a mandala of power,
      markets in the outer rings,
      the throne at the still point.
      Baghdad would become the greatest city on earth:
      a million people, the House of Wisdom,
      the center of the world.
      It began as a circle in the dust.
    description: "Al-Mansur founds Baghdad in a perfect circle — the City of Peace that will become the greatest city on earth."
    status: "published"
    sha256: "23a8e661870e6ec3a7ec0ecae267511538332831f53b11d42c8544510c3500b5"
  - number: "1830"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Brick Towers of Sambor"
    date: "763 CE"
    region: "Cambodia"
    poem: |
      Along the Mekong, the Chenla builders
      raised brick towers to the gods —
      Sambor Prei Kuk, the temple in the forest,
      sanctuaries of brick and sandstone
      rising from the jungle.
      I walked among the towers,
      the trees pressing close.
      Before Angkor, there was this:
      the first Khmer sacred architecture,
      gods housed in brick,
      prayers baked into clay.
      The jungle would reclaim some;
      the stones would outlast the kingdom.
      Every Angkor Wat begins
      with a brick tower in a forest.
    description: "Chenla builders raise brick temple towers along the Mekong — the first Khmer sacred architecture, before Angkor."
    status: "published"
    sha256: "0282a048785b855c888726d5de02d24d3c634cd69aa79b5408a5b6805bba2ae1"
  - number: "1831"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Schoolmaster of York"
    date: "767 CE"
    region: "Britain"
    poem: |
      Alcuin taught at York —
      the great library-school of the North,
      hundreds of manuscripts,
      students from across Europe.
      I sat in his classroom once:
      the old master drilling Latin,
      the boys chanting,
      the light of learning in the cold north.
      Charlemagne would soon call him to Aachen,
      to school an empire.
      But York was where he learned to teach —
      where England kept the flame
      while the continent stumbled.
      The light of the North:
      one schoolmaster, one library,
      and the stubborn belief that books matter.
    description: "Alcuin teaches at York's great library-school — the light of the North, keeping learning alive for a continent."
    status: "published"
    sha256: "b397a9c99e3d917f609f110bc5df5ac3d836f819065af20ce17972bd595ddbd4"
  - number: "1832"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Charlemagne Takes the Crown"
    date: "768 CE"
    region: "Francia"
    poem: |
      Charlemagne became king of the Franks —
      jointly with his brother Carloman,
      an uneasy sharing of the crown.
      I watched the coronation:
      the tall young king, restless, brilliant,
      already dreaming bigger than Francia.
      He could barely write his name;
      he would school an empire.
      He was twenty-something, and the Middle Ages
      were about to get their defining figure.
      Joint king, for now.
      But everyone in that hall knew
      whose shadow was longer.
    description: "Charlemagne becomes joint king of the Franks — the restless young king who will define the Middle Ages."
    status: "published"
    sha256: "1e9de33d393fb3dfde0fc445f8e1cae7aaf98470ae08b0fef8622d87a27fdb7b"
  - number: "1833"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Sole King"
    date: "771 CE"
    region: "Francia"
    poem: |
      Carloman died —
      suddenly, conveniently for history —
      and Charlemagne ruled Francia alone.
      I attended the funeral, then the court.
      No more sharing, no more rivals in the family.
      The sole king moved fast:
      Saxons, Lombards, Saracens —
      every frontier felt his armies.
      Alone on the throne,
      Charlemagne became what joint kingship
      had held back:
      the hammer of Europe,
      the father of a new empire.
    description: "Carloman dies and Charlemagne rules Francia alone — the sole king unleashed on every frontier."
    status: "published"
    sha256: "498f03d9c6813b598d9df7df378df90ba22bdafd2bb238103ac6a53674dd44e1"
  - number: "1834"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Elephant Kings"
    date: "775 CE"
    region: "India"
    poem: |
      Gopala founded the Pala Empire of Bengal —
      the Elephant Kings,
      a Buddhist age of monasteries:
      Nalanda's sister foundations,
      Vikramashila, Odantapuri,
      thousands of monks debating.
      I walked the cloisters at Vikramashila,
      the chanting rolling like the sea.
      While Europe stumbled through its dark age,
      Bengal built universities.
      The Palas ruled four centuries —
      elephants in their armies,
      logic in their schools.
      India's Buddhist twilight,
      and it was glorious.
    description: "Gopala founds the Pala Empire — Bengal's Buddhist age of great monasteries and universities, the Elephant Kings."
    status: "published"
    sha256: "3b49ce0e49b895391584eb22aa168826b92c6a018be09d0949d50839b409d4ba"
  - number: "1835"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Empress Regent"
    date: "780 CE"
    region: "Byzantium"
    poem: |
      Irene took power —
      empress regent for her young son Constantine VI,
      a woman ruling the Roman Empire.
      I watched her in the palace:
      clever, ruthless, devout,
      navigating the iconoclast quarrels,
      the generals, the court.
      She would restore the icons.
      She would also blind her own son
      to keep the throne.
      Power does not ask your gender, I learned —
      it asks your price.
      Irene paid it, in full,
      and ruled alone.
    description: "Irene takes power as empress regent — clever, ruthless, devout, navigating generals and iconoclasts to rule alone."
    status: "published"
    sha256: "b8d315b2b960656ab79a53e2373ea3adfc3cf2ed156552fb20d698542dd14461"
  - number: "1836"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Day of the Saxons"
    date: "782 CE"
    region: "Saxony"
    poem: |
      At Verden, Charlemagne ordered it:
      thousands of Saxon prisoners executed
      in a single day —
      the Day of the Saxons.
      I cannot make this beautiful.
      I was not there; I am glad I was not there.
      The north submitted — in terror.
      Saxony became Christian at sword's point,
      and the stain of Verden
      never washed off the great king's name.
      Empires are built on days like this,
      and the builders know it,
      and history knows it,
      and no crown shines clean afterward.
    description: "Charlemagne executes thousands of Saxon prisoners at Verden — the north submits in terror, and the stain never washes off."
    status: "published"
    sha256: "a6212472a030237a32e8df99ef3ececb1979ca8a78900b25831beef5aafc91cd"
  - number: "1837"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Thousand-and-One-Night Caliph"
    date: "786 CE"
    region: "Arabia"
    poem: |
      Harun al-Rashid took the throne in Baghdad —
      the caliph of the Thousand and One Nights,
      of Scheherazade's tales,
      ruler of the city at its zenith.
      I walked Baghdad in his early years:
      a million people, the markets overflowing,
      envoys from Charlemagne and China
      in the same audience hall.
      The golden age of the Abbasids,
      and Harun its golden caliph —
      just, learned, magnificent,
      and utterly human.
      The Nights made him legend.
      The city made him real.
    description: "Harun al-Rashid takes the throne — the caliph of the Thousand and One Nights, ruling Baghdad at its zenith."
    status: "published"
    sha256: "b6ca50ce4fbe6c4156ba65b5008232bd59016510dc3a53ba8e71d7bbfaa01bc2"
  - number: "1838"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Icons Return"
    date: "787 CE"
    region: "Byzantium"
    poem: |
      The Second Council of Nicaea met —
      and the icons were restored.
      The painters came home;
      the whitewashed walls bloomed again
      with Christ and the saints.
      I watched a monk uncover a mosaic
      hidden for sixty years,
      tears on his face.
      The iconoclast quarrel was over —
      for now.
      A century of smashed images,
      ended by a council vote.
      Art had won over austerity;
      the human need to see the divine
      had beaten the fear of idolatry.
      The churches were colorful again.
    description: "The Second Council of Nicaea restores the icons — whitewashed walls bloom again, and the painters come home."
    status: "published"
    sha256: "fe33977051a43e5e867601bb285864132a6784782c446fbc32e1731c922de298"
  - number: "1839"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The First Dragon Ships"
    date: "789 CE"
    region: "Britain"
    poem: |
      They came out of the northern mist —
      dragon ships, beached at Portland,
      Vikings on English soil for the first time recorded.
      The reeve rode out to meet them,
      thinking them traders.
      They killed him.
      I stood on that beach afterward,
      the long ships' wakes fading.
      Nobody understood yet
      what had arrived:
      three centuries of fire,
      the Viking Age,
      beginning with a murdered official
      on a Dorset beach.
    description: "Viking raiders strike Portland — the first recorded raid on England, three centuries of fire beginning on a Dorset beach."
    status: "published"
    sha256: "4f941e878a215b655235e317f96e711b0aef1e8839f884bc0cec64aa937d7db2"
  - number: "1840"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The People's Poet"
    date: "790 CE"
    region: "China"
    poem: |
      Bai Juyi wrote verses
      plain enough for a farmer to understand —
      he tested them on an old peasant woman,
      they say, and cut every line she frowned at.
      The People's Poet.
      I heard his poems sung in Chang'an taverns,
      by people who could not read.
      While Li Bai drank the moon
      and Du Fu wept for the fallen,
      Bai Juyi wrote for the living —
      taxes, corvée, the widow's grief —
      in words as clear as water.
      Poetry for everyone:
      the most radical idea in literature.
    description: "Bai Juyi writes verses plain enough for a farmer — poetry tested on a peasant woman, for everyone."
    status: "published"
    sha256: "45dc3358d15d4f05f4dd610edb997b22b4f29e6d9429515dbea4907a097feac5"
  - number: "1841"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Lindisfarne"
    date: "793 CE"
    region: "Britain"
    poem: |
      They came at dawn to the holy island —
      Vikings, sacking Lindisfarne,
      slaughtering monks, stealing the altar gold.
      The Viking Age began in blood and fire.
      I walked the abbey afterward,
      the manuscripts scattered,
      the sea wind cold through the broken roof.
      Alcuin wrote from Aachen:
      never before has such terror appeared in Britain.
      He was right.
      The Northmen had found the monasteries —
      rich, unguarded, holy —
      and they would not stop for three hundred years.
    description: "Vikings sack Lindisfarne — the holy island desecrated, and the Viking Age begins in blood and fire."
    status: "published"
    sha256: "e4273121ed57ca379a81b844faffc902f0e9a24f71d9de1ab823183e36a52bce"
  - number: "1842"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Christmas Crown"
    date: "800 CE"
    region: "Rome"
    poem: |
      On Christmas Day, in Saint Peter's,
      the Pope placed the crown on Charlemagne's head —
      Emperor of the Romans.
      I was in the crowd when the shout went up.
      Charlemagne, they say, was not pleased —
      he had not asked for it, or so he claimed.
      But the empire was reborn that day:
      the West had an emperor again,
      four hundred years after Rome fell.
      A new Rome, Frankish, Christian —
      the Holy Roman Empire,
      beginning with a surprise coronation
      on the holiest day of the year.
    description: "Charlemagne is crowned emperor in Rome on Christmas Day — the West has an emperor again, four centuries after Rome fell."
    status: "published"
    sha256: "79f9b0a933407ecc08a348dbc02ab1f75b78d64e3345e4adbbc1b0e83b0555d3"
  - number: "1843"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The God-King"
    date: "802 CE"
    region: "Cambodia"
    poem: |
      Jayavarman II climbed the mountain —
      Phnom Kulen —
      and declared himself universal king,
      chakravartin, god-king:
      the devaraja ritual,
      uniting the Khmer lands under one divine ruler.
      Angkor's age began.
      I watched the ceremony from the crowd,
      the smoke, the chanting.
      A kingdom consecrated on a mountaintop —
      and from it would rise Angkor Wat,
      the greatest temple on earth.
      It started here:
      one man, one mountain,
      declaring himself the axis of the world.
    description: "Jayavarman II declares himself god-king on Phnom Kulen — the devaraja ritual that begins Angkor's age."
    status: "published"
    sha256: "d642e77f656b4bb4a11b3da500836433d7ab75e5531da1cff14cc0b9863a41e8"
  - number: "1844"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Monks Sail East"
    date: "804 CE"
    region: "Japan"
    poem: |
      Saicho and Kukai sailed for Tang China —
      two monks, one mission:
      bring home the living dharma.
      I watched their ships leave.
      They returned transformed:
      Saicho with Tendai, Kukai with Shingon —
      the two schools that would shape Japanese Buddhism
      for a thousand years.
      Kukai also brought back calligraphy, poetry,
      the arts of a civilization —
      a one-man cultural import.
      They sailed east as students.
      They came home as founders.
    description: "Saicho and Kukai sail to Tang China and return with Tendai and Shingon — the founders of Japanese Buddhism."
    status: "published"
    sha256: "d0bbe4ea1a68d794090b0608a96264fdf103fa9dbb6169e539f651716083ddc1"
  - number: "1845"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Book of Kells"
    date: "806 CE"
    region: "Britain"
    poem: |
      On Iona, or Kells, the monks began —
      illuminating the great gospel book:
      the Book of Kells,
      gold and knotwork on vellum,
      the most beautiful book ever made in Britain.
      I watched a monk paint a single letter
      for a whole day —
      a Chi-Rho page like a jeweled maze.
      They worked as the Vikings raided the coasts,
      art in the shadow of the axe.
      The book survived.
      The monastery did not, quite.
      But the pages remain:
      proof that beauty can be made
      even while the world burns.
    description: "Monks begin the Book of Kells — gold and knotwork on vellum, beauty made in the shadow of Viking axes."
    status: "published"
    sha256: "8f807ab36a6a3c1f731f38c5fa8f0b2cb1175cf47fc0395b3a362f756fe8151c"
  - number: "1846"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Caliph Dies at Tus"
    date: "809 CE"
    region: "Arabia"
    poem: |
      Harun al-Rashid died on campaign at Tus —
      the great caliph, in a military tent,
      far from Baghdad's splendor.
      I was with the army on that march.
      His sons were already maneuvering:
      al-Amin in Baghdad, al-Ma'mun in Khurasan —
      and everyone knew what was coming.
      Civil war.
      The golden age would tear itself apart
      over the succession,
      brother against brother.
      Harun had ruled the greatest city on earth.
      He died on the road,
      and his empire died with him —
      for a while.
    description: "Harun al-Rashid dies on campaign at Tus — his sons already maneuvering, the golden age about to tear itself apart."
    status: "published"
    sha256: "4209321354f06cf9bd4536c5c93a40615e7304a1c76d94cdd2ec1404b67225a0"
  - number: "1847"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Emperor's Skull"
    date: "811 CE"
    region: "Balkans"
    poem: |
      At Pliska, Khan Krum ambushed the Byzantines —
      Nikephoros I died on the field,
      the first Roman emperor killed in battle
      in centuries.
      Krum made his skull into a drinking cup,
      lined with silver.
      I saw it once, in the Bulgar camp.
      Barbaric? The Byzantines thought so.
      The Bulgars called it honor —
      the ultimate trophy.
      An emperor's skull, drinking wine.
      The Balkans had a new master,
      and Constantinople had a new fear:
      the men beyond the mountains
      did not play by Roman rules.
    description: "Khan Krum routs the Byzantines at Pliska, kills Nikephoros I, and drinks from his silver-lined skull."
    status: "published"
    sha256: "de94631d463aa66efb7c5086dbbdbd035e76ea9216cc6fcb6239a270d9584e53"
  - number: "1848"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Al-Ma'mun Takes Baghdad"
    date: "813 CE"
    region: "Arabia"
    poem: |
      The civil war ended —
      al-Ma'mun, the scholar, beat al-Amin his brother,
      and took Baghdad.
      I entered the city with the victors,
      past the scars of the siege.
      The scholar-caliph:
      he loved books more than battles,
      and his reign would prove it —
      the House of Wisdom,
      the translation movement,
      the age when Baghdad tried to read everything.
      Brother had killed brother for the throne.
      But the throne went to the reader,
      and the empire entered its most luminous age.
    description: "Al-Ma'mun wins the civil war and takes Baghdad — the scholar-caliph, whose reign will open the age of translation."
    status: "published"
    sha256: "d217c765bcac16ca1b7f0031b64219e5b138a09b73ee73b9c3707fd7cfdb9fa2"
  - number: "1849"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Man of Algebra"
    date: "820 CE"
    region: "Arabia"
    poem: |
      In Baghdad, al-Khwarizmi wrote his book —
      al-Kitab al-Mukhtasar fi Hisab al-Jabr:
      the Compendious Book on Calculation by Completion.
      Algebra.
      I watched him work in the House of Wisdom,
      solving equations the Greeks never dreamed of.
      From his name we get algorithm;
      from his book, algebra.
      Every equation you ever solved,
      every computer that ever computed —
      it starts here, with this man,
      in this city, in this book.
      He was just trying to settle inheritance disputes.
      He ended up settling the future.
    description: "Al-Khwarizmi writes his algebra in Baghdad — the book and the man behind every equation and every algorithm."
    status: "published"
    sha256: "9373a7a9fe135cfbb41f7152d42ddd766ae9c30520f7b108b13921dc830ee84e"
  - number: "1850"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Philosopher of Baghdad"
    date: "825 CE"
    region: "Arabia"
    poem: |
      Al-Kindi wrote in the caliph's city —
      the first philosopher of the Islamic world,
      trying to marry Greek reason
      with revealed faith.
      I debated with him once, or tried to —
      the man was a storm of questions.
      Can philosophy and revelation agree?
      Al-Kindi said yes, and spent his life proving it:
      mathematics, medicine, music, optics —
      he wrote on everything.
      The Arabs called him the Philosopher, simply —
      as if there had been none before,
      and none needed after.
    description: "Al-Kindi, the first philosopher of the Islamic world, writes in Baghdad — marrying Greek reason to revealed faith."
    status: "published"
    sha256: "4ded7001e1c3a3197a0c2f1a1733c48abe9aa4bdf388e1e3d8b779ed97b4b26b"
  - number: "1851"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Observatory"
    date: "829 CE"
    region: "Arabia"
    poem: |
      Al-Ma'mun's astronomers built the observatory —
      in Baghdad, and at Palmyra,
      charting the heavens with brass and patience.
      I climbed the tower at night
      and watched them measure the stars,
      checking Ptolemy, correcting him,
      measuring the earth's circumference.
      The caliph paid for it all —
      science as statecraft,
      curiosity as policy.
      They mapped the sky
      so the empire could pray on time
      and sail straight.
      Heaven, measured for practical reasons,
      turned out to be beautiful too.
    description: "Al-Ma'mun's astronomers chart the heavens from the Baghdad observatory — measuring the earth, correcting Ptolemy."
    status: "published"
    sha256: "ae1a7adee4a2affa50081f0e74d2d39744e944cc99335f86a448c733fd326c39"
  - number: "1852"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Pyramid Opened"
    date: "832 CE"
    region: "Egypt"
    poem: |
      Al-Ma'mun's men breached the Great Pyramid —
      tunneling in, seeking the wisdom of the ancients,
      the treasure of the Pharaohs.
      I watched them break through into the galleries,
      torches in the dark, four thousand years deep.
      They found no gold —
      only empty chambers, and wonder.
      The caliph had wanted the ancients' secrets.
      What he got was better:
      proof that men had once built
      something no one could explain,
      and the humility to stand inside it.
      The pyramid kept its secrets.
      It shared its awe.
    description: "Al-Ma'mun's men tunnel into the Great Pyramid — finding no gold, only empty chambers and four thousand years of awe."
    status: "published"
    sha256: "4dc62ddafe027fc36a66e3756b10820cf3cc215f3880e25a8797b56f8b93d911"
  - number: "1853"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Sack of Amorium"
    date: "838 CE"
    region: "Byzantium"
    poem: |
      Al-Mu'tasim's armies took Amorium —
      the emperor's home city,
      birthplace of the dynasty —
      sacked and burned.
      I walked the ruins afterward,
      the smoke still rising.
      Theophilos had provoked the war;
      his people paid for it.
      Amorium was Byzantium's pride in Anatolia;
      its fall was a wound
      the empire never forgot.
      The caliph had made his point:
      no city was safe, no dynasty sacred.
      The frontier war ground on,
      city for city, atrocity for atrocity.
    description: "Al-Mu'tasim's armies sack Amorium, the Byzantine emperor's home city — a wound the empire never forgot."
    status: "published"
    sha256: "30a2e74908bff5fa3683de252f5d0b9687bcab7df61a21fd5d4fc1bf8dad63ac"
  - number: "1854"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Uyghurs Fall"
    date: "840 CE"
    region: "Steppe"
    poem: |
      The Kyrgyz came down from the north —
      and the Uyghur Khaganate fell,
      its capital burned, its tribes scattered
      across the deserts.
      I rode through Ordu-Baliq afterward,
      the empty streets full of wind.
      A century of rule, ended in a season.
      The steppe reshuffles its powers —
      same game, new hands.
      The Uyghurs fled south to the oases,
      became scribes and merchants,
      civilizers instead of conquerors.
      Sometimes a fallen empire
      does more good in defeat
      than it ever did in power.
    description: "The Kyrgyz destroy the Uyghur Khaganate — the fallen steppe empire's people becoming scribes and merchants in the oases."
    status: "published"
    sha256: "92efe3fd3e0f745c2dee75b6f9e39b1f79435b449aa1f26c1fdd5fb1641bf5f9"
  - number: "1855"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Empire Split Three Ways"
    date: "843 CE"
    region: "Francia"
    poem: |
      At Verdun the grandsons divided it —
      Charlemagne's empire, carved into three kingdoms:
      west, middle, east.
      I watched the surveyors draw the lines.
      Nobody knew those lines would harden
      into France and Germany,
      into a thousand years of border wars.
      The Treaty of Verdun:
      three brothers, one inheritance,
      and a map drawn in a hurry
      that Europe is still living with.
      Empires are divided in a day.
      The consequences take a millennium.
    description: "The Treaty of Verdun carves Charlemagne's empire into three — lines drawn in a day that become France, Germany, and a millennium of borders."
    status: "published"
    sha256: "b50d1282d696adf52352dd457cdf521b9e97e81abb0e4f6ce845fb852f2252a8"
  - number: "1856"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Emperor Against the Monks"
    date: "845 CE"
    region: "China"
    poem: |
      Emperor Wuzong turned on Buddhism —
      the great suppression:
      temples closed, monks defrocked,
      bells melted into coins.
      I watched them strip a monastery at Chang'an,
      the bronze Buddhas carted off to the mint.
      Two hundred thousand monks returned to lay life.
      The emperor said the sangha drained the treasury;
      the monks said the dharma was eternal.
      Both were right, in their way.
      Buddhism survived — it always does —
      but the golden age of Chinese monasteries
      ended in the melting pots.
    description: "Emperor Wuzong suppresses Buddhism — temples closed, bells melted into coins; the monastic golden age ends in the melting pots."
    status: "published"
    sha256: "996859024ab7061dc5a26504d0add1fc99d4e10f1c43b6e34f05a5452c9e4574"
  - number: "1857"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Library of Cordoba"
    date: "848 CE"
    region: "Spain"
    poem: |
      In Cordoba, Abd al-Rahman II's librarians
      gathered books —
      from Baghdad, from Damascus, from everywhere —
      the collection that would make Cordoba famous:
      hundreds of thousands of volumes,
      while the largest library in Christian Europe
      held a few hundred.
      I walked the shelves, dizzy.
      Philosophy, medicine, astronomy, poetry —
      the whole world, in one palace.
      Cordoba was becoming the light of the West,
      and its librarians were the keepers
      of humanity's memory.
    description: "Cordoba's librarians gather the books that will make it famous — hundreds of thousands of volumes, the light of the West."
    status: "published"
    sha256: "14268c9d4c259b71df1cea643d62e853ed7bf34e93e200803fc42d3f9c5ffdf3"
  - number: "1858"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Star-Catcher"
    date: "850 CE"
    region: "Arabia"
    poem: |
      In Baghdad the craftsmen perfected it —
      the astrolabe, the heavens in a brass disc:
      turn the rete, read the stars,
      find the hour, find Mecca, find your way.
      I held one, heavy and beautiful,
      the engraved plates cool in my palm.
      Sailors, astronomers, travelers —
      they all carried the sky in their pockets now.
      The Star-Catcher.
      A thousand years before the smartphone,
      humanity's first pocket computer
      was made of brass and starlight.
    description: "Baghdad's craftsmen perfect the astrolabe — the heavens in a brass disc, humanity's first pocket computer."
    status: "published"
    sha256: "f31510e2ea4ef15173c587bccf0bb7707b444b4bc37a055b98b3e478837f2660"
  - number: "1859"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Boy Who Would Be Great"
    date: "859 CE"
    region: "Britain"
    poem: |
      At Wantage, a boy was born —
      Alfred, the youngest son,
      the one nobody expected to be king.
      I did not see the infant.
      But I have stood where he would stand:
      in the marshes of Athelney, hiding from Vikings,
      burning the cakes, learning to wait.
      The youngest son.
      The scholar-king.
      The only English ruler called the Great.
      It started in Wantage, unremarked —
      as all the greatest stories do,
      with a child nobody was watching.
    description: "Alfred is born at Wantage — the youngest son nobody expected to be king, England's future \"the Great.\""
    status: "published"
    sha256: "2376259fd06674466f3e95e44610ae8004a505b576dea8a7707f41b0307e27d0"
  - number: "1860"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Call of the Varangians"
    date: "862 CE"
    region: "Russia"
    poem: |
      The Slavs sent the call north:
      come and rule us, they said to the Varangians —
      our land is rich, but there is no order in it.
      Rurik came to Novgorod.
      The first Russian state began.
      I watched the long ships beach,
      the Norse chieftains striding ashore.
      An invitation to be conquered —
      the strangest founding of any nation.
      Rus.
      From these Varangian rulers
      would come Kiev, and Moscow,
      and the largest country on earth.
      It began with an invitation.
    description: "The Slavs invite Rurik the Varangian to rule at Novgorod — the strangest founding of any nation, the first Russian state."
    status: "published"
    sha256: "5a9165161a823a883c39bfadec32f653ba70b8cad76d9277d7127af11f060ef6"
  - number: "1861"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Slavic Letters"
    date: "863 CE"
    region: "Moravia"
    poem: |
      Cyril and Methodius came to Moravia —
      two Byzantine brothers, missionaries —
      and brought the Glagolitic alphabet:
      letters for the Slavic tongue,
      so the gospel could be read
      in the people's own words.
      I watched Cyril teach the shapes,
      strange and beautiful as birds' tracks.
      Before this, the Slavs had no writing.
      After this, they had literature.
      An alphabet is a gift
      that keeps giving for a thousand years:
      every Russian novel, every Serbian poem,
      starts with these two brothers
      and their birds'-track letters.
    description: "Cyril and Methodius bring the Glagolitic alphabet to Moravia — writing for the Slavic tongue, the root of a thousand years of literature."
    status: "published"
    sha256: "e349000d4dc3c554d41e26c18f5cc958ff5dc03a87f5d8a4938957084cd7cbb1"
  - number: "1862"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Baptism of Boris"
    date: "864 CE"
    region: "Bulgaria"
    poem: |
      Boris I was baptized —
      Bulgaria became Christian,
      and with the faith came the letters,
      the books, the written word.
      I stood at the river for the mass baptism,
      thousands entering the water.
      The Bulgars had been steppe horsemen;
      now they were a Christian kingdom,
      with a Slavic liturgy, a Slavic church.
      Boris gave his people a written faith —
      and in doing so, gave the Slavic world
      its spiritual center.
      A baptism is a moment.
      Its ripples are forever.
    description: "Boris I baptizes Bulgaria — the steppe horsemen become a Christian kingdom with a written Slavic faith."
    status: "published"
    sha256: "c75b95c00a584fde56b379b343988f229d4847c7dec350d6868a12d3ed43a499"
  - number: "1863"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Diamond Sutra"
    date: "868 CE"
    region: "China"
    poem: |
      Off a woodblock press in China
      rolled the Diamond Sutra —
      the world's oldest dated printed book:
      "Made for universal free distribution
      by Wang Jie, on the 15th of the 4th moon,
      in the 9th year of Xiantong."
      I held it — paper, ink, 868 CE.
      Printing.
      The technology that would remake the world
      started here, with a Buddhist text,
      given away free.
      Gutenberg gets the glory.
      Wang Jie got there six hundred years earlier,
      and asked for nothing in return.
    description: "The Diamond Sutra rolls off a Chinese woodblock press — the world's oldest dated printed book, made for free distribution."
    status: "published"
    sha256: "6a25a75bf4b9910a7527628432b6df20c6b9fd7d8f6ad1b67dcd9a996868c634"
  - number: "1864"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "Alfred at Edington"
    date: "878 CE"
    region: "Britain"
    poem: |
      Alfred came out of the marshes —
      gathered the men of Wessex —
      and met Guthrum at Edington.
      The Danes broke. The siege followed.
      The baptism followed.
      The Danelaw was born, and Wessex survived.
      I walked that battlefield at dusk,
      the West Saxon shields stacked.
      England existed because of this day:
      without Edington, no Wessex;
      without Wessex, no England.
      The boy from Wantage,
      who burned the cakes in hiding,
      had saved a nation.
      The Great, indeed.
    description: "Alfred defeats Guthrum at Edington — the Danelaw is born, Wessex survives, and England exists because of this day."
    status: "published"
    sha256: "2d45167762275ed5fefa4eaf3c547ad25c399eeda66452ac3c2852c31f39015d"
  - number: "1865"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Siege of Paris"
    date: "885 CE"
    region: "Francia"
    poem: |
      The Vikings came up the Seine —
      hundreds of ships —
      and besieged Paris for a year.
      Count Odo held the walls.
      I was inside the city that winter:
      hunger, disease, the Northmen's drums
      day and night.
      Paris did not fall.
      Odo became a hero, then a king.
      The siege proved what the Franks had learned:
      you cannot beat the Vikings in the field forever —
      but a walled city, well held,
      can outlast them.
      Paris survived.
      It would survive much worse.
    description: "Vikings besiege Paris for a year; Count Odo holds the walls — the city survives, and Odo becomes a hero and a king."
    status: "published"
    sha256: "3b5dfa15de1605ea635bc9c3737af1fb1b330e219ba16c1a535bba5c77207ce9"
  - number: "1866"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The King Is Dead"
    date: "899 CE"
    region: "Britain"
    poem: |
      Alfred died —
      the scholar-king, the Great —
      and was buried at Winchester.
      I stood in the funeral crowd,
      the burhs manned, the navy at sea,
      everything he had built holding.
      His burhs and his ships,
      his laws and his schools —
      England held together.
      The Vikings would come again;
      the kingdom would waver.
      But Alfred had given it the tools to survive:
      walls, ships, books, law.
      A king dies.
      What he built does not have to.
    description: "Alfred dies at Winchester — but his burhs, navy, laws, and schools hold England together after him."
    status: "published"
    sha256: "5deed04bd36845fc49d5c957790208b28ab4863d2cade2fce90231d2bdd1c60d"
  - number: "1867"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Abbey of Cluny"
    date: "910 CE"
    region: "Francia"
    poem: |
      Twelve monks founded Cluny —
      a quiet abbey in Burgundy,
      a reform of prayer:
      stricter, purer, free from lay control.
      I visited in its early years:
      the chanting, the order, the peace.
      No one guessed what it would become —
      the head of a thousand monasteries,
      the most powerful religious order in Europe,
      reformers of the whole Church.
      It started with twelve monks
      and a simple idea:
      pray properly, and everything else follows.
      The quietest revolution of the Middle Ages.
    description: "Twelve monks found Cluny — a quiet reform of prayer that will become the most powerful monastic order in Europe."
    status: "published"
    sha256: "26f7ab895a2fa3c24d2873fa53eb4a0462a7560c58beebe84f6c06ff04dd5770"
  - number: "1868"
    volume: 3
    era_code: "07a"
    era: "Medieval World (early)"
    title: "The Caliph of the West"
    date: "929 CE"
    region: "Spain"
    poem: |
      Abd al-Rahman III proclaimed it:
      the caliphate of Cordoba —
      the west has its own Commander of the Faithful,
      no longer bowing to Baghdad.
      I was in Cordoba for the proclamation,
      the city at its zenith:
      the library, the palaces,
      Madinat al-Zahra rising on the hill.
      Two caliphates now, east and west —
      and Cordoba the equal of Baghdad
      in splendor, in learning, in power.
      The Falcon's grandson had finished the work:
      Andalusia, a caliphate,
      a light that would shine for a century.
    description: "Abd al-Rahman III proclaims the caliphate of Cordoba — the west has its own Commander of the Faithful, a light to rival Baghdad."
    status: "published"
    sha256: "2b7775fe2368e8933721963ef274d32dccd0702724815bb9f72f30f40aa2da6a"
  - number: "1869"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Surgeon of Córdoba"
    date: "950 CE"
    region: "Iberia"
    poem: |
      I walked into Córdoba at dusk
      when the lamps were being lit along the Great Mosque's forest of columns,
      and I found him bent over parchment in a room that smelled of rose water and iron.
      Al-Zahrawi, Abu al-Qasim —
      his hands were the steadiest things I had ever seen,
      and he was drawing the knife he had invented that morning.
      He drew two hundred instruments before he was done:
      needles, hooks, saws, the first forceps the world had ever held.
      Thirty books. One man's answer to the body's breaking.
      In the caliph's glittering city, where the streetlights outnumbered Rome's,
      he wrote the book that surgeons would carry for five hundred years —
      and I watched a student's hand shake the first time he copied the plates.
      Some empires are built of armies.
      His was built of thread and needle.
    description: "In Córdoba's golden age, al-Zahrawi compiles his thirty-volume medical encyclopedia, inventing some two hundred surgical instruments and founding surgery as a discipline."
    status: "published"
    sha256: "9a6aff982b492438282e4a41125b598acf1f0b328192a97c00fdf9da203180c2"
  - number: "1870"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Tide Turns at Takkolam"
    date: "952 CE"
    region: "South India"
    poem: |
      The ground at Takkolam shook before the armies ever touched —
      eighty thousand feet, war elephants with bells on their tusks,
      and the Chola line standing like a seawall.
      I was there when the Rashtrakuta king's charge broke it.
      The dust rose so thick the noon sun went copper,
      and men fought blind, swinging at sounds.
      When the Chola king fell, his army folded like a dropped sail,
      and the south of India changed owners in a single afternoon.
      No treaty. No slow negotiation.
      Just one field, one day, and the balance of a whole coast
      tipping the way a boat tips when the wind shifts.
    description: "At Takkolam, Rashtrakuta forces crush the Chola army and kill its king, overturning the balance of power in South India in a single battle."
    status: "published"
    sha256: "a3009869cc211ffabf440cbfe186da4b5fde991be80a2dbdb2773d70bf54dc1f"
  - number: "1871"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Last King of York"
    date: "954 CE"
    region: "England"
    poem: |
      Erik Bloodaxe —
      what a name to die under.
      I saw him ride out of York for the last time,
      a Viking king in an English city that had never quite been his,
      and the wind off the moors was already writing his ending.
      They caught him at Stainmore,
      on a road through the hills, in the rain —
      a king with an axe for a surname, cut down like any farmer's son.
      The north of England went quiet after that,
      and the Danes' kingdom of York folded into the English story.
      I stood by the roadside and watched the rain wash his blood into the peat.
      The Viking age in England was ending.
      It just didn't know it yet.
    description: "Erik Bloodaxe is driven from York and killed at Stainmore, ending Viking rule in northern England and folding the Danelaw into a single English kingdom."
    status: "published"
    sha256: "fcdb7c59a05a414da98c0d876b2e62c79b28cf0825e2968ea0f58e9f040bcede"
  - number: "1872"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The City of a Thousand Churches"
    date: "956 CE"
    region: "Armenia"
    poem: |
      They called it Ani —
      the city of a thousand and one churches,
      though I never counted them all; I only stood on its red walls
      and watched the sun set the stone on fire.
      Armenian kings had made it their capital,
      a frontier city where the caravan roads crossed,
      and every merchant prince seemed to owe God a church.
      Spires like stone lace. Carvings deep enough to lose a finger in.
      I drank wine with a builder who swore the cathedral would outlast empires,
      and on a clear day you could see Mount Ararat from the ramparts,
      white and distant as a promise.
      Cities fall. Ani would fall harder than most.
      But that evening, with the bells going off across the plain,
      it felt like it could stand forever.
    description: "Ani becomes the Armenian capital, its red walls and countless churches rising on the trade frontier — a golden city that will be remembered long after its fall."
    status: "published"
    sha256: "8054987641a9c68398d6892d5c1e777543e825254c2b72c116da11e1266107a8"
  - number: "1873"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Purple-Born Scholar"
    date: "959 CE"
    region: "Byzantium"
    poem: |
      He was born in the purple chamber —
      that's what they called the room in the palace
      where the empresses gave birth,
      and Constantine VII wore the color like a second skin.
      But the thing I remember isn't the crown.
      It's the desk.
      I saw him at it late at night, sleeves rolled up,
      writing down how the empire actually worked:
      how to receive ambassadors, how to run the farms,
      how the fleet was provisioned, how ceremonies bent foreign knees.
      An emperor writing manuals —
      as if the empire were a machine and he its only repairman.
      They called him the Scholar-Emperor,
      and maybe he was too bookish to be great.
      But a thousand years later, his books are still open,
      and most emperors are dust.
    description: "Constantine VII, the \"purple-born\" emperor, writes his great manuals of administration and ceremony — practical handbooks that preserve Byzantium's workings for a thousand years."
    status: "published"
    sha256: "e7dcab52fbc6d10cb4b4ae84b1d05d412f77d92898c02018ad8cd7f6a952a262"
  - number: "1874"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Yellow Robe"
    date: "960 CE"
    region: "China"
    poem: |
      At Chenqiao, in the cold dawn,
      his own soldiers threw a yellow robe over General Zhao Kuangyin's shoulders —
      the imperial color, the one you don't refuse without dying.
      I watched him wake up an emperor.
      He hadn't planned it. Nobody quite had.
      The boy-emperor of the Later Zhou was seven years old,
      the north was full of warlords,
      and the army had decided: we need a grown man on the throne.
      So they made one, standing in the mud, before breakfast.
      And here's the strange part —
      he turned out to be good at it.
      The Song dynasty, three hundred years of it,
      started with a robe thrown over a sleeping general
      who had the sense to accept what the morning offered.
    description: "General Zhao Kuangyin is proclaimed emperor by his own troops at Chenqiao, founding the Song dynasty — one of China's great cultural ages, begun almost by accident."
    status: "published"
    sha256: "22105fe6336bb419774aaae75e81aabad044d8d219b8c9c8673f0296128f1307"
  - number: "1875"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Otto's Crown"
    date: "962 CE"
    region: "Germany"
    poem: |
      Rome, February, and the pope putting a crown on a German king's head —
      I stood in the crowd outside St. Peter's and felt the old dream twitch back to life.
      Otto the Great.
      Charlemagne's ghost had been waiting a hundred and fifty years,
      and now a Saxon warlord was bending his knee for the imperial crown,
      and the western empire was born again —
      at least in name, at least in ceremony.
      The Romans cheered. The Germans beat their shields.
      And somewhere, in Constantinople, the real Roman emperor
      probably laughed into his wine.
      But dreams don't care who laughs.
      The Holy Roman Empire would stagger on for eight more centuries,
      and it started with that February morning and that heavy crown.
    description: "Otto I is crowned emperor in Rome, reviving the western imperial title — the birth of the Holy Roman Empire, which will endure for eight centuries."
    status: "published"
    sha256: "64495a56564c4f8458294fc3fd5090af8fe9e4260c12b3cdbd2782875b96ea48"
  - number: "1876"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Women's Words in Kana"
    date: "964 CE"
    region: "Japan"
    poem: |
      The men wrote in Chinese —
      stiff, formal, borrowed, the language of edicts and tax rolls.
      The women of the Heian court took the plain syllables,
      kana, the writing of servants and songs,
      and made it sing.
      I sat behind a screen and listened to a lady-in-waiting read her diary aloud,
      and the words moved like water over stones —
      love letters, pillow books, poems about the moon through bamboo blinds.
      Murasaki would come later, and Sei Shonagon,
      but the door was opened here:
      the plain script, in women's hands,
      becoming the first great flowering of Japanese literature.
      The men had the empire's paperwork.
      The women got its soul.
    description: "Court ladies of Heian Japan write the first flowering of native literature in kana — diaries, poems, and pillow books that become the foundation of Japanese letters."
    status: "published"
    sha256: "8dd46de3ff96745e7f032ddf493a103e39bd838e04d3af54e94951311a4bac6d"
  - number: "1877"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Salt Road"
    date: "966 CE"
    region: "Sahara"
    poem: |
      A thousand camels, nose to tail,
      moving through a sea with no water —
      I joined a caravan at Sijilmasa and walked the salt road south,
      and I have never known thirst like that thirst.
      The salt came from Taghaza, cut in slabs from the desert floor,
      worth its weight in gold by the time it reached the Sudan.
      The gold came back north the same way —
      dust of it, nuggets of it, sewn into saddlebags.
      Men died on that road the way sailors die at sea,
      and the guides navigated by dunes the way sailors navigate by stars.
      Gold south. Salt north. The desert in between,
      taking its toll in bones.
      Empires on both ends of that road got rich on the exchange,
      and the camels kept walking, century after century.
    description: "Camel caravans cross the Sahara carrying slabs of salt south and gold dust north — the trans-Saharan trade that enriches empires on both sides of the desert."
    status: "published"
    sha256: "d37a259cf2604917fafc0bb9f03a3b5d3ce3fb03f999ae96876135b69319010e"
  - number: "1878"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Victorious City"
    date: "969 CE"
    region: "Egypt"
    poem: |
      Jawhar the general rode into Egypt and did what conquerors do —
      but then he did something stranger.
      He founded a city.
      Not on the old capital, not on the ruins —
      a new city, north of Fustat, laid out by astrologers,
      and he named it al-Qahira: the Victorious.
      I walked its first streets while the plaster was still wet,
      past the gates they called Victory and Conquest,
      and watched workmen raising the mosque that would become al-Azhar —
      a thousand years of scholars not yet born.
      Cairo.
      The greatest city of the Arab world,
      started as a general's parade ground
      and an astrologer's horoscope.
      It would outlive every empire that ever claimed it.
    description: "The Fatimid general Jawhar conquers Egypt and founds al-Qahira — Cairo, the Victorious — with the mosque of al-Azhar that will make it a center of learning for a millennium."
    status: "published"
    sha256: "8db6e19ebf2cd073d339a0f202e6514db1971abd6602f631cb34fde3f4b8e9e3"
  - number: "1879"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Dai Co Viet Is Born"
    date: "971 CE"
    region: "Vietnam"
    poem: |
      The Red River delta had been twelve warlords' playground —
      twelve little chiefs, twelve little wars, year after year.
      Then Dinh Bo Linh beat them all.
      I watched him take the last stronghold and stand in the rain
      with his sword still out, counting what was left of his enemies:
      nothing.
      He named the kingdom Dai Co Viet — Great Viet —
      and built his capital at Hoa Lu, ringed by limestone cliffs.
      A thousand years of Vietnamese independence
      start with one hard man ending twelve small wars.
      The Chinese would come again, and again, and again.
      But the name would hold.
      The delta would hold.
      I saw it begin, and I believed him when he smiled.
    description: "Dinh Bo Linh defeats the twelve warlords, unifies the Red River delta, and proclaims the kingdom of Dai Co Viet — the founding act of Vietnamese independence."
    status: "published"
    sha256: "e9f4289bbf6e74e7c2011f799052fb0772592b8f8e1c01273ccb62510f638dec"
  - number: "1880"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The First Christian King"
    date: "973 CE"
    region: "Poland"
    poem: |
      Mieszko had been a pagan duke with a pagan duke's gods,
      and then he married a Christian princess from Bohemia,
      and the whole realm turned with him —
      or was turned.
      I stood at the river where the baptisms happened,
      rank after rank of his warriors wading in,
      and the priests ran out of oil and patience both.
      It wasn't gentle. It wasn't a revival.
      It was a duke deciding his people's future with one wedding,
      and binding Poland to Rome and to Latin Europe
      with a knot no sword could cut.
      The old gods went into the forests.
      The new God got the cathedrals.
      And Poland, between Germany and the steppe,
      chose its side for the next thousand years.
    description: "Mieszko I's baptism turns Poland Christian, binding the realm to Latin Europe — a political conversion that shapes a thousand years of Polish identity."
    status: "published"
    sha256: "84e0dc1863f7a3bd3489344e905b152bd6c61ebb5564291e52ebc2336527667a"
  - number: "1881"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Book Hospital"
    date: "975 CE"
    region: "Baghdad"
    poem: |
      Baghdad's hospitals had libraries.
      Read that again: hospitals — with libraries.
      I walked the wards of the great bimaristan and saw physicians
      consulting Galen and Hippocrates at the bedside,
      Greek learning kept alive in Arabic ink,
      copied, corrected, argued with, improved.
      The translators' quarter never slept;
      a good manuscript could make a man rich,
      and the caliph paid by the weight of the book in gold.
      While Europe's monks were copying psalms by candlelight,
      Baghdad was running the world's memory —
      medicine, astronomy, mathematics, philosophy —
      in buildings where the sick were healed downstairs
      and the books were healed upstairs.
    description: "The caliph's great hospitals and libraries keep Greek learning alive in Arabic — translators, physicians, and scholars running the world's memory while Europe sleeps."
    status: "published"
    sha256: "a05e59926efc896a83270591d82e8238011e69c472ee1229b9af4ee16527dee5"
  - number: "1882"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Poet of Kings Arrives"
    date: "977 CE"
    region: "Persia"
    poem: |
      He was thirty-five, a landowner's son from Tus,
      and he had decided to do something insane:
      write the entire history of Persia in verse —
      sixty thousand couplets, thirty years of work,
      kings and heroes and dragons,
      from the first mythic shah to the Arab conquest.
      I met young Ferdowsi in a garden at Tus,
      and he recited me the opening lines he was proudest of,
      about the world and time and the turning sky.
      He had no patron yet. No money to speak of.
      Just the conviction that Persia's soul would die
      if nobody sang it.
      The Shahnameh — the Book of Kings —
      began as one stubborn man's promise to his own dead language.
      He kept it.
    description: "Young Ferdowsi begins the thirty-year labor that will become the Shahnameh — sixty thousand verses preserving Persia's kings, heroes, and soul in poetry."
    status: "published"
    sha256: "b44092b8517968dd230f08d9ff2eaf18ff9ccffedc6ddda161e57a5162ca501e"
  - number: "1883"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Song Unites the South"
    date: "979 CE"
    region: "China"
    poem: |
      One by one, the southern kingdoms fell —
      not with great battles, mostly,
      but with the slow pressure of the Song war machine:
      bribes, sieges, negotiated surrenders, a fleet here, an army there.
      I traveled down the Yangtze that year and watched
      the last southern court's banners come down in the rain.
      The officials wept. The merchants went back to work by noon.
      China, broken into pieces for fifty years,
      was nearly whole again —
      one emperor, one tax system, one examination hall
      stretching from the northern steppe to the southern sea.
      The Song would never quite take the far north back.
      But the south — the rice, the tea, the poets, the money —
      the south was theirs, and it made them rich beyond dreaming.
    description: "Song armies absorb the last southern kingdoms, reuniting China after fifty years of division — the foundation of the dynasty's golden age of commerce and culture."
    status: "published"
    sha256: "ad53714c93f5ed5753f8831f05985d5ad4e29dcde1eadd5b7f04569ef4c657c3"
  - number: "1884"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "A Boy Named Ibn Sina"
    date: "980 CE"
    region: "Central Asia"
    poem: |
      In Bukhara, in a house full of books,
      a boy of ten had finished memorizing the Qur'an,
      mastered Arabic grammar, and was working through medicine —
      and arguing with his tutors about Aristotle.
      Ibn Sina. Avicenna.
      I watched him read a book once and close it, done —
      a memory like a trapdoor, everything falling in and staying.
      By sixteen he was treating the sick.
      By eighteen he had read everything worth reading in the city
      and started writing because there was nothing left to learn.
      The Canon, the Healing, the philosophy —
      all of it ahead of him, all of it inevitable.
      Some children are prodigies.
      This one was a whole library learning to walk.
    description: "In Bukhara, the child prodigy Ibn Sina — Avicenna — masters medicine and philosophy before his teens, beginning the journey toward the Canon that will teach Europe for five centuries."
    status: "published"
    sha256: "2523117f9d6e1a26880d9d2684b65b20c5eab9fb9476db5bce1dc2e50263b0c2"
  - number: "1885"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Erik's Green Land"
    date: "981 CE"
    region: "Greenland"
    poem: |
      Erik the Red had killed a man —
      two men, actually —
      and Iceland had thrown him out for three years.
      So he sailed west, into the fog, past the edge of every map,
      and found a great land with green shores at its southern tip,
      fjords like Norway's, grass for sheep.
      And he named it Greenland.
      Not because it was green — most of it was ice —
      but because, as he told me over ale years later,
      "men will go if the name is fair."
      The greatest real-estate lie in history,
      and it worked.
      Families followed him across the black water
      to farm the edge of the ice cap,
      and for four hundred years the Norse held on —
      the farthest west Europeans would ever live,
      until the next voyage west.
    description: "Exiled from Iceland, Erik the Red sails west and names the icy land Greenland — a marketing lie that draws Norse settlers to farm the edge of the ice cap for four centuries."
    status: "published"
    sha256: "92b6b79e70f98cf8d899d1c9a6766016ed8b5905e3b8f431583d3983aa22d2ff"
  - number: "1886"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Feathered Serpent City"
    date: "985 CE"
    region: "Mexico"
    poem: |
      Tula.
      Four stone warriors on top of a pyramid,
      twenty feet tall, staring east with their butterfly breastplates,
      and below them a city of the Toltecs —
      markets, ball courts, temples running red.
      I climbed the pyramid at dawn and stood between the giants' feet,
      and the priests of Quetzalcoatl were already chanting below,
      the Feathered Serpent's morning rites,
      copal smoke rising through the cold air.
      They told me their king was the serpent's living image,
      priest and ruler both,
      and the city's warriors marched under his sign
      from the highlands to the sea.
      The Aztecs would come later and call the Toltecs their ancestors,
      their golden age, the ones who knew.
      Standing there, with the sun coming up behind the stone faces,
      I understood why.
    description: "At Tula, the Toltecs raise their colossal stone warriors and the priests of Quetzalcoatl rule — the golden-age city the later Aztecs will claim as their ancestors."
    status: "published"
    sha256: "99ad5474469326841ede1b8412fcbf55864bb6e9f7de24b57de6e0c0a1987a71"
  - number: "1887"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Bjarni's Drift"
    date: "985 CE"
    region: "North Atlantic"
    poem: |
      Bjarni Herjolfsson wasn't trying to discover anything.
      He was trying to find his father in Greenland,
      missed in the fog, and kept sailing west —
      and the fog lifted, and there were trees.
      Low wooded shores, hills behind them, stretching on —
      a land no Norseman had ever seen.
      I wasn't on that ship. Nobody I know was.
      But I heard Bjarni tell it in a Greenland hall that winter,
      and the whole room went quiet:
      he hadn't landed.
      Hadn't even gone ashore.
      Turned around and sailed home, because his father was waiting.
      America — glimpsed through fog, and left alone,
      because a son was in a hurry to get home.
      Leif would go back and land.
      But Bjarni saw it first, and sailed away.
    description: "Blown off course, Bjarni Herjolfsson sights wooded shores west of Greenland — the first European glimpse of America — and sails home without landing."
    status: "published"
    sha256: "e7220e7e148de7891f34194de5faf0a1e18cdbebd48c93affa7e13ff7b26ee55"
  - number: "1888"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Baptism of Rus"
    date: "988 CE"
    region: "Kiev"
    poem: |
      Vladimir had a choice to make —
      the chronicles say he interviewed the faiths like a man shopping:
      Islam, but no pork and no drink — the Russians, he said, love their drink.
      Judaism, but its people had no kingdom.
      The Latin faith, plain and severe.
      And then his envoys came back from Constantinople,
      from the Hagia Sophia, and said:
      we did not know whether we were in heaven or on earth.
      So Vladimir chose Byzantium.
      I stood on the banks of the Dnieper and watched Kiev wade in —
      thousands of them, the whole city, baptized in the river's cold current,
      idols of Perun dragged through the streets and thrown in after them.
      Russia entered the Orthodox fold that day,
      and the choice echoes still —
      in every onion dome, every liturgy, every eastward prayer.
    description: "Prince Vladimir baptizes Kiev in the Dnieper, choosing Orthodox Byzantium over Islam and Rome — the founding act of Russian Christianity, echoing in every onion dome since."
    status: "published"
    sha256: "230f9a5ca131883221f48e4e5a2d0d2989420fd6288fa8b1ad53aa512487dc96"
  - number: "1889"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Great Mound Builders"
    date: "990 CE"
    region: "North America"
    poem: |
      Monk's Mound.
      A hundred feet high, fourteen acres at the base —
      the largest earthwork in the Americas,
      built basket by basket, carried on human backs,
      and I watched them build it.
      Cahokia spread below: plazas, palisades, neighborhoods,
      a city of the sun in the Mississippi valley,
      twenty thousand people at its height —
      bigger than London would be for centuries.
      They played their chunkey games in the plazas.
      They buried their chiefs with shell beads and copper.
      No one wrote it down. No stone inscriptions.
      Just earth, shaped by hands, holding the shape of a city —
      until the city faded and only the mound remembered.
      I climbed it at sunset.
      The river ran red below, and the whole valley breathed.
    description: "At Cahokia, the Mississippian people raise Monk's Mound — the largest earthwork in the Americas — heart of a city of twenty thousand, greater than London."
    status: "published"
    sha256: "0a075bd7197ac31d669ebef2c3279ce80123212a4de9b25b8932c866b58cde99"
  - number: "1890"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Sea Bride"
    date: "992 CE"
    region: "Venice"
    poem: |
      The doge sailed out against the pirates that year —
      not merchants' guards, but the fleet of Venice itself,
      and when the Narentines were broken, something changed.
      I stood on the Riva as the ships came home,
      and the whole city understood what had happened:
      Venice was no longer a town that traded.
      It was a power that ruled the water.
      Every year after, on Ascension Day,
      the doge would sail into the lagoon in the great gilded barge
      and cast a gold ring into the sea —
      we wed thee, O sea, in token of perpetual dominion.
      The Marriage of the Sea.
      A thousand years of ceremony, starting with one pirate campaign
      and one ring thrown into the green water.
    description: "Venice's doge defeats the Adriatic pirates, and the Republic begins its ceremonial Marriage of the Sea — the founding gesture of a thousand-year maritime empire."
    status: "published"
    sha256: "f2403a012dbc1e7ac462280063383120584e6b728dfa20ef5cd80b7a1e0a8203"
  - number: "1891"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Cross Comes North"
    date: "996 CE"
    region: "Norway"
    poem: |
      Olaf Tryggvason came home to Norway with a sword in one hand and a cross in the other,
      and he wasn't asking.
      I watched him land — a Viking king, baptized in England,
      come to make his whole country Christian
      by persuasion where it worked, by the sword where it didn't,
      by blinding and burning where neither worked.
      The old gods died hard in Norway.
      Men held to Thor at the thing-meetings and lost their lands for it.
      Chieftains converted at swordpoint and converted back the minute Olaf sailed past.
      But the tide only runs one way.
      Within a generation the stave churches were rising,
      the cross stood over the fjords,
      and Norway — the last Viking heartland —
      belonged to the new God.
    description: "Olaf Tryggvason lands to convert Norway by persuasion and sword — the violent Christianization of the last Viking heartland."
    status: "published"
    sha256: "706c08e629e112e26005b709382be9e6b900aecb980aaceb859268d9e9a07726"
  - number: "1892"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Viking Wolves Return"
    date: "997 CE"
    region: "England"
    poem: |
      They came back.
      The Danish fleets, the dragon ships,
      beaching on England's coasts in the grey dawn —
      and this time they weren't raiding for cattle.
      They wanted silver.
      I watched a thegn count out the Danegeld on a Sussex beach,
      coins by the thousandweight,
      buying the raiders off for one more year.
      It never bought more than a year.
      Aethelred — the Unready, the ill-counseled —
      paid and paid, and the price kept rising,
      and every payment taught the Danes the same lesson:
      England was a purse with legs.
      The wolves had smelled the silver.
      They would keep coming until they owned the whole island.
    description: "Danish fleets return to raid England, and King Aethelred begins paying the Danegeld — silver tribute that only teaches the raiders England is worth conquering."
    status: "published"
    sha256: "45672004aa3ca31c12408b86ba7c967b1fb68eef956cd24046154ba865b33caf"
  - number: "1893"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Terror of the Year 1000"
    date: "999 CE"
    region: "Christendom"
    poem: |
      The preachers said the world would end at the millennium —
      a thousand years since Christ, and the books said a thousand was the number.
      I walked through villages in France that winter
      and found whole parishes on their knees in the fields,
      giving away their goods, confessing to neighbors,
      waiting for the sky to split.
      Kings trembled. Misers opened their coffers.
      Pilgrims jammed the roads to Jerusalem, wanting to be there when it happened.
      And then —
      January came. The sun rose. The world, inconsiderate,
      went on.
      The terror drained away like a tide,
      leaving behind a strange, giddy relief —
      and a building boom, churches rising everywhere,
      as if Christendom, spared, had decided to say thank you in stone.
    description: "Millennial preachers warn the world will end in the year 1000 — crowds pray, kings tremble, and when the sun rises anyway, Christendom builds churches in relieved gratitude."
    status: "published"
    sha256: "2c374bd1420853571ef3d8b527a9c9918049b5d4b4f8c30d8a7311b59bd165d8"
  - number: "1894"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Leif's Vinland"
    date: "1000 CE"
    region: "North America"
    poem: |
      Leif Eriksson bought Bjarni's ship —
      the same ship that had seen the wooded shores and sailed away —
      and this time he landed.
      I walked that beach with him at L'Anse aux Meadows,
      the grass wild, the grapes (they said) hanging in the woods,
      salmon in the streams so thick you could walk on them.
      Vinland.
      Europeans standing on the American mainland,
      five hundred years before Columbus —
      building houses, wintering over, meeting the Skraelings,
      trading, fighting, leaving.
      It didn't last. The colony bled out in a few years.
      But the sagas remembered, and the sagas were true:
      I was there, and the grass was green,
      and the New World was old before Europe ever found it twice.
    description: "Leif Eriksson lands in Vinland — Europeans set foot on the American mainland five centuries before Columbus — and the short-lived colony enters the sagas as truth."
    status: "published"
    sha256: "3d7fa9bcdbb32dce3b229eb26284d5395ad93a62b88c1aa656107c66a3f194a7"
  - number: "1895"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "St Brice's Day"
    date: "1002 CE"
    region: "England"
    poem: |
      November 13th, St Brice's Day —
      and King Aethelred gave the order:
      kill the Danes in England. All of them.
      I was in Oxford when the mob came for the church
      where the Danes had fled for sanctuary,
      and I heard the roof timbers crack as they set it burning —
      men, women, children, the king's own law broken at the altar.
      Among the dead was Gunhilde, sister of the Danish king —
      and Sweyn Forkbeard heard, across the sea,
      and swore his revenge.
      Revenge has a long memory in the north.
      Within a decade Sweyn would take England itself,
      and Aethelred would flee to Normandy,
      and the massacre at Oxford would be remembered
      as the day England's king signed his own exile warrant.
    description: "Aethelred orders the St Brice's Day massacre of Danes in England — a revenge killing that brings Sweyn Forkbeard's conquering armies down on the island."
    status: "published"
    sha256: "50a8d671a6899805cbe5322f628ad67cf0a09a0be3f6e578d0cadf146bbebcc4"
  - number: "1896"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Peace Bought With Silk"
    date: "1004 CE"
    region: "China"
    poem: |
      The Song could not beat the Liao.
      That was the simple, humiliating truth —
      the Khitan horsemen were too fast, too many, too good,
      and the Song armies kept losing the north.
      So at Shanyuan, they bought what they couldn't win:
      a hundred thousand taels of silver a year,
      two hundred thousand bolts of silk,
      sent north like tribute dressed up as "gifts."
      I watched the first caravan leave Kaifeng,
      silk stacked like snow on the carts,
      and the court called it peace.
      It was peace — for a hundred years, it was peace —
      but every bolt of silk was a receipt
      for a war China had decided not to fight.
      The Liao got rich. The Song got quiet.
      And the north stayed lost.
    description: "The Treaty of Shanyuan ends the Song-Liao wars — China buys a century of peace with annual tribute of silk and silver, conceding the north it cannot retake."
    status: "published"
    sha256: "fe31bedf107be781db35ff1697ad91ad925e84960469bcfae7abae6e245cf3e3"
  - number: "1897"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Brightest Star"
    date: "1006 CE"
    region: "Skies"
    poem: |
      It came up in the south like a second moon —
      brighter than Venus, bright enough to read by,
      bright enough, the old ones said, to cast a shadow at midnight.
      I stood in a courtyard in Kaifeng and watched the court astronomers argue:
      a guest star, they called it, though it stayed for months.
      In Cairo, Ali ibn Ridwan wrote it down.
      In Yemen, in Japan, in St. Gallen in the Alps —
      strangers on four continents, looking up at the same wound in the sky,
      each writing in his own tongue: something is burning up there.
      A star had died — a supernova, fifteen hundred light-years off —
      and for a few weeks in the year 1006,
      the whole human race looked up together.
    description: "A supernova blazes brighter than Venus for months — the brightest stellar event in recorded history, witnessed and recorded in China, Egypt, Japan, and Yemen."
    status: "published"
    sha256: "288e458f27505fe0d58e3a3fe2d3ed193e6b1bfd29c0a5d516c65f66ce80cf34"
  - number: "1898"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Holy Sepulchre Falls"
    date: "1009 CE"
    region: "Jerusalem"
    poem: |
      Al-Hakim was the strangest caliph Cairo ever had —
      he banned chess, banned women's shoes, banned eating grapes by day —
      and then he ordered the Church of the Holy Sepulchre torn down,
      stone by stone, to the bedrock.
      I walked through Jerusalem the week after,
      past the rubble where Christendom's holiest church had stood,
      and the Christians were keening in the streets
      like the world had cracked.
      It hadn't — not yet.
      But the shock went out along the pilgrim roads,
      to every monastery in Europe:
      the tomb of Christ, destroyed.
      Ninety years later, when Urban preached the crusade,
      men would still be talking about those stones.
    description: "The Fatimid caliph al-Hakim orders the Church of the Holy Sepulchre destroyed — a shock that echoes through Christendom and will help fuel the crusading call."
    status: "published"
    sha256: "4263a00daa477cb48fb909294e67b3e3723702c8a00886d86fc56e49f81f173f"
  - number: "1899"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Book of Kings Finished"
    date: "1010 CE"
    region: "Persia"
    poem: |
      Thirty years.
      That's how long it took him —
      thirty years of verses, sixty thousand couplets,
      and when Ferdowsi set down his pen at Tus,
      Persia had its soul back in a book.
      I heard him read the last lines to a small circle of friends,
      his voice shaking on the kings' names:
      Rustam, Siyavash, the heroes, the dragons, the doomed —
      the whole mythic history of Iran, from the first shah to the Arab conquest,
      sung in Persian when Arabic ruled the courts.
      They say the sultan cheated him of his payment.
      They say he died poor and bitter.
      Maybe.
      But the Shahnameh outlived the sultan, the dynasty, the empire —
      outlived everything except the language it saved.
    description: "Ferdowsi completes the Shahnameh after thirty years — sixty thousand verses that preserve Persia's mythic history and save the Persian language itself."
    status: "published"
    sha256: "acbebb191f23eddc14815db8a9675ab740393e79dbcf60f0da7e269fc61350fb"
  - number: "1900"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Gold of Wagadu"
    date: "1012 CE"
    region: "West Africa"
    poem: |
      They called it Wagadu, the land the Soninke ruled —
      and its gold came from rivers nobody would name,
      guarded by silence and sorcerers' oaths.
      I stood in the market at Koumbi Saleh and watched the weighing:
      gold dust poured on the scales against salt, against cloth,
      and the king's men took their cut with stone faces.
      The Arab geographers wrote that the king's dogs wore gold collars
      and his horses were tethered with golden ropes —
      exaggeration, probably, but only just.
      Ghana was rich the way deserts are rich:
      everything valuable had to cross the waste to get there,
      and the Soninke owned the crossing.
      Gold in, salt out, and the empire fat on the difference.
    description: "The Soninke empire of Ghana grows rich on the gold trade at the Sahara's edge — gold dust weighed against salt in the markets of Koumbi Saleh."
    status: "published"
    sha256: "5a339528cae25a212b2a566a561c2fd4309451de7e755e8a157e776d2950dc11"
  - number: "1901"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Clontarf"
    date: "1014 CE"
    region: "Ireland"
    poem: |
      Good Friday, 1014 —
      Brian Boru was seventy-three years old,
      too old to fight, praying in his tent while his army fought without him.
      I was on the field at Clontarf when the Viking line broke:
      the Dublin Norse, the men of Man, the mercenaries from the isles —
      all of them running for their ships, and the tide coming in behind them.
      Ireland won. Viking power in Ireland died that day.
      And Brian —
      a fleeing Norseman found the old king at his prayers
      and cut him down in his tent.
      Victory and a funeral in the same hour.
      The Irish still sing it: the day Ireland was freed,
      and the price was the king who freed it.
    description: "At Clontarf, Brian Boru breaks Viking power in Ireland — and is killed in his tent after the victory, making the triumph a funeral in the same hour."
    status: "published"
    sha256: "c5df5661e9a41d490da000cd7b4c0212571637b17b916479eb096a062c76ccf0"
  - number: "1902"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Cnut's North Sea Empire"
    date: "1015 CE"
    region: "England"
    poem: |
      Cnut came back the way his father had —
      with ships, with axes, with winter behind him —
      and this time England folded.
      I watched him crowned, a Dane on the English throne,
      and the thing about Cnut was: he was good at it.
      He married Emma, the old king's widow.
      He sent his fleet home and ruled with English laws.
      He held England, Denmark, and Norway in one hand —
      a Viking sea-empire, stretching from the Irish Sea to the Baltic.
      They tell the story of him commanding the tide to stop,
      as if he were a fool —
      but I was at Southampton that day, and I know what he was doing:
      showing his flatterers that even a king has limits.
      The tide came in. The courtiers got wet.
      The point landed.
    description: "Cnut takes England's throne and rules a North Sea empire of England, Denmark, and Norway — a Viking king who governs wisely and demonstrates, tide and all, that even kings have limits."
    status: "published"
    sha256: "d5d70275ce0af7e94a14d667100f7c4c67ed5e556a4c077158c95f9bd8e7a470"
  - number: "1903"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The End of the First Empire"
    date: "1018 CE"
    region: "Bulgaria"
    poem: |
      Basil the Bulgar-Slayer —
      they called him that because he earned it,
      blinding fourteen thousand Bulgarian prisoners
      and sending them home in rows of a hundred, led by one-eyed men.
      I saw that column on the road to Ohrid,
      and I have never seen anything like it —
      an empire blinded, walking home.
      The Bulgarian tsar died of the shock, they said,
      when he saw what was left of his army.
      And Bulgaria — the First Bulgarian Empire,
      a power for three hundred years —
      folded into Byzantium like a letter into an envelope.
      Basil ruled it all now, from Italy to Armenia.
      He had won everything.
      He had done it with blinded men.
    description: "Basil II annexes Bulgaria after decades of war, climaxing in the blinding of fourteen thousand prisoners — the end of the First Bulgarian Empire and the peak of Byzantine power."
    status: "published"
    sha256: "a3767f8b5553f4c9723d837be36344752d7afe5195cb74a783a98e520245f9c5"
  - number: "1904"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Druze Dawn"
    date: "1021 CE"
    region: "Levant"
    poem: |
      In the mountains of the Levant,
      among the followers of the strange caliph al-Hakim,
      a new faith was being preached —
      and its first article was the strangest of all:
      that al-Hakim himself was divine.
      I listened to a da'i preach it in a mountain village,
      his voice low, his eyes bright:
      the caliph had not died or vanished, he said,
      but withdrawn, to return.
      The Druze.
      They would close their doors to converts within a generation,
      keep their books sealed, their rites secret,
      and survive — in those same mountains —
      a thousand years of empires trying to move them.
      Faiths are born in moments like that one:
      a preacher, a mountain, a claim no one else believes,
      and the stubbornness to hold it forever.
    description: "In the Levant's mountains, followers of al-Hakim preach a new faith holding the caliph divine — the birth of the Druze, who will keep their sealed books and mountain homes for a thousand years."
    status: "published"
    sha256: "249826afdd3905632058f5d74809dba769536655fbdf9015dbb8f3f4b018f91f"
  - number: "1905"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Light-Bender"
    date: "1023 CE"
    region: "Egypt"
    poem: |
      Ibn al-Haytham had been locked up —
      al-Hakim's prisoner, under house arrest in Cairo,
      ten years of it —
      and he spent them thinking about light.
      I visited him once, in the dim room where they kept him,
      and he showed me his dark chamber:
      a pinhole in the shutter, and the world outside
      projected upside-down on the far wall —
      proof, he said, that light travels in straight lines,
      that the eye receives, not sends.
      His Book of Optics would demolish a thousand years of Greek error:
      no rays shooting from the eye, no mystical emanations —
      just light, geometry, and experiment.
      He did it as a prisoner, in a dark room,
      with a hole in a shutter.
      The scientific method, more or less invented
      by a man Cairo had locked away for thinking too much.
    description: "Under house arrest in Cairo, Ibn al-Haytham writes his Book of Optics — proving with pinhole experiments that vision works by light entering the eye, founding optics as a science."
    status: "published"
    sha256: "138c0127affd7001a48e6e470f17e147be1df45fc7379eed85aca3859d41eda0"
  - number: "1906"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Death of the Bulgar-Slayer"
    date: "1025 CE"
    region: "Byzantium"
    poem: |
      Basil II died in December, an old man,
      fifty years on the throne,
      and the empire he left stretched from southern Italy to Armenia —
      the greatest Byzantium had been in four hundred years.
      I stood in the crowd at his funeral procession in Constantinople,
      and the grief was real, but so was the fear underneath it:
      who could hold all this together now?
      He had no son. His brother was a drunk.
      The generals he'd crushed were already measuring the curtains.
      Within fifty years the Turks would be in Anatolia.
      Within eighty the crusaders would be sacking the city.
      Empires don't fall in a day —
      but I watched the peak pass that December,
      like watching a wave crest,
      knowing the shore was coming.
    description: "Basil II dies after a fifty-year reign, leaving Byzantium at its greatest extent in centuries — and with no strong heir, the long unraveling begins at the moment of the peak."
    status: "published"
    sha256: "3c784140072f5a625a49ba4314d8fe4b275b53156ca6219d0ed9cf531a9de2cd"
  - number: "1907"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Wheel of Time"
    date: "1027 CE"
    region: "Tibet"
    poem: |
      The Kalachakra came down from the north —
      the Wheel of Time, the teaching that holds
      calendar and cosmos in a single turning:
      outer cycles of stars, inner cycles of breath,
      and the secret cycles of enlightenment, all meshed like gears.
      I sat in a monastery courtyard in Tibet
      while a lama drew the great mandala in colored sand,
      circle within circle, palace within palace,
      and explained that time itself was the teacher —
      that understanding the wheel was understanding everything.
      The monks would sweep the mandala away when it was done,
      grain by grain, into a river.
      The teaching stayed.
      Tibet took the Wheel of Time and made it its own,
      and a thousand years later the sand still falls,
      and the wheel still turns.
    description: "The Kalachakra — the Wheel of Time — takes root in Tibet, binding calendar, cosmos, and meditation into one teaching, drawn in sand mandalas and swept away."
    status: "published"
    sha256: "2bbb5f77b4f036d4092298534bbc6a892b2719b7da38676986f5440ca2c26b76"
  - number: "1908"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Canon Is Written"
    date: "1029 CE"
    region: "Persia"
    poem: |
      Avicenna wrote it on the run —
      between courts, between patrons, hiding from one prince,
      serving another, writing at night after the day's politics.
      The Canon of Medicine:
      a million words, five books,
      every disease known, every remedy catalogued,
      anatomy, diagnosis, drugs, surgery —
      the whole of medicine, systematized,
      in one man's head and then on the page.
      I saw a copy being made in Isfahan,
      three scribes working in shifts,
      and the master said it would take them a year.
      It would take Europe five hundred years to outgrow it.
      When the Black Death came, physicians reached for the Canon.
      When the universities taught medicine, they taught the Canon.
      One book, one runaway genius,
      and half a millennium of healing.
    description: "Avicenna completes his Canon of Medicine — five books systematizing all known medicine — the textbook European universities will teach from for five hundred years."
    status: "published"
    sha256: "de9d01a5ff6a7308d95f310289aa428fc1965a5193f44848787c0006be537b78"
  - number: "1909"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Idol-Breaker"
    date: "1030 CE"
    region: "Punjab"
    poem: |
      Mahmud of Ghazni marched on Somnath with thirty thousand men,
      across the desert, through the heat,
      because the temple was the richest in India
      and its god was made of gold.
      I watched the gates go down —
      the priests on the walls, crying out to Shiva to strike the invaders,
      and no lightning came.
      The idol fell. The gold went to Ghazna by the camel-load:
      doors of sandalwood, jewels, statues, treasure beyond counting.
      Mahmud got his nickname that day: the Idol-Breaker.
      The Hindus got a wound that never quite healed —
      a thousand years later, they'd still be telling it.
      And the gold built mosques and palaces in Ghazna,
      where it gleamed for a century
      before the next conqueror carried it off again.
    description: "Mahmud of Ghazni sacks the great temple of Somnath and carries its gold to Ghazna — the raid that earns him the name Idol-Breaker and wounds Hindu memory for a millennium."
    status: "published"
    sha256: "c988ecef468ea8dce8ae93066643623de9dacfe08a0addd740883e4a7dbd3557"
  - number: "1910"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Caliphate Splinters"
    date: "1031 CE"
    region: "Iberia"
    poem: |
      Córdoba had been the jewel of the west —
      the caliph's city, the libraries, the streetlights —
      and then it tore itself apart:
      palace coups, Berber generals, a caliph deposed, another murdered,
      until there was no caliph at all.
      I walked through Córdoba that year
      and the great mosque was still beautiful,
      but the city around it had shattered into pieces —
      taifas, they called them: little kingdoms,
      Seville, Toledo, Zaragoza, Granada,
      each with its own king, its own court, its own poets,
      all glittering, all quarrelsome, all doomed.
      The strange part: the culture bloomed in the wreckage.
      Small courts meant competing patrons,
      and the poets and philosophers thrived
      on the rivalry of two dozen tiny thrones.
    description: "Córdoba's caliphate collapses into the taifa kingdoms — small, glittering, quarrelsome courts where, amid the wreckage, poetry and philosophy bloom on rival patronage."
    status: "published"
    sha256: "a348c406a6d8b5a7eecdfb35cc782dfa4335a570945b0b28b0b3f13a670b9630"
  - number: "1911"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Cluny's Third Church"
    date: "1033 CE"
    region: "France"
    poem: |
      They were building the biggest church in Christendom —
      Cluny III, they call it now,
      five hundred feet long, the largest vault in the world,
      and I stood in the nave while the masons were still at the walls.
      The abbey of Cluny was the power behind a thousand monasteries,
      its abbots counseling kings, its monks praying around the clock
      in shifts, so the praise never stopped —
      and this church was its statement in stone:
      we are the center, and heaven is our business.
      It took decades. It cost a fortune.
      Pilgrims would come from everywhere to stand where I stood
      and feel small in the best possible way.
      The revolution would knock most of it down, eight centuries later.
      But that day, with the scaffolding up and the chanting going on,
      it was the future, being built one stone at a time.
    description: "The abbey of Cluny begins its great third church — the largest in Christendom — the stone statement of the monastic empire that counsels kings and prays around the clock."
    status: "published"
    sha256: "8e84e22290b2a35ebc78e0fd9cf7bb89b4cc6a7c33a2af9fd0f215e829d2ea60"
  - number: "1912"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Death of Cnut"
    date: "1035 CE"
    region: "England"
    poem: |
      Cnut died at Shaftesbury in November,
      forty years old, at the height of it all —
      and the North Sea empire died with him,
      because it had been held together by one man's competence.
      I watched the news run north: England to Harold,
      Denmark to Harthacnut, Norway already slipping away —
      three kingdoms, three sons, three quarrels,
      and within seven years the whole thing was gone.
      The Danes would never rule England again.
      The English would get their own brief kings back —
      Edward, Harold —
      before the Normans came and ended that too.
      Cnut's empire lasted one lifetime.
      But what a lifetime: the tide commanded,
      the sea-empire ruled from a throne at Winchester,
      and the north at peace — until it wasn't.
    description: "Cnut dies at forty, and his North Sea empire of England, Denmark, and Norway cracks apart among his sons — the Danish age in England ends with its builder."
    status: "published"
    sha256: "f7efd6a68c8cf9a076db87cbc6b603f980e9bcd0c40ced86939ae5a0d2dc495b"
  - number: "1913"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Death of the Prince of Physicians"
    date: "1037 CE"
    region: "Persia"
    poem: |
      He died at Hamadan, at fifty-eight,
      worn out by courts and campaigns and his own relentless mind —
      Avicenna, the Prince of Physicians,
      who had memorized medicine at ten and outgrown his teachers by eighteen.
      I stood outside the room where he lay dying,
      and his students were already copying —
      they knew what they had, and they weren't letting it go.
      The Canon. The Healing. The philosophy.
      Books that would be taught in European universities
      when every king of his age was dust and forgotten.
      He had run from princes all his life.
      In the end the books did the running for him —
      across the Arabic world, into Latin, into the future,
      healing people who would never know his name.
    description: "Avicenna dies at Hamadan — but his Canon and his philosophy outlive every king of his age, teaching European medicine for five centuries to come."
    status: "published"
    sha256: "55f9e169061db3a325ea837ef3188859c6af22f0cae316097e220e9c70a38164"
  - number: "1914"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Movable Type"
    date: "1040 CE"
    region: "China"
    poem: |
      Bi Sheng was a commoner, a craftsman —
      and he had an idea that should have changed everything:
      bake the characters in clay, one by one,
      set them in an iron frame, ink them, print,
      then break them apart and use them again.
      Movable type.
      I watched him work in his shop —
      thousands of little clay characters in wooden cases,
      his fingers flying as he set a page,
      and the printed sheets coming off clean and sharp.
      The scholars yawned. Clay was crude; woodblock was fine.
      China had forty thousand characters to sort,
      and the idea never quite caught fire there.
      Four hundred years later, a German goldsmith
      would have the same idea with metal and an alphabet —
      and the world would call him the inventor.
      Bi Sheng was first.
      The clay remembers, even if the histories hedge.
    description: "The craftsman Bi Sheng invents movable clay type — printing reinvented for mass pages — four centuries before Gutenberg, though China's thousands of characters keep the idea from catching fire."
    status: "published"
    sha256: "491c8e7662b7c4c05d5b767d328ab881fe983fdff17eeec3ed200d708f63eb01"
  - number: "1915"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Macbeth Takes the Throne"
    date: "1042 CE"
    region: "Scotland"
    poem: |
      Forget Shakespeare. Forget the witches, the sleepwalking, the dagger.
      The real Macbeth took Scotland's crown in battle,
      killed Duncan in a fair fight — kings died that way then —
      and ruled for seventeen years.
      I traveled through his Scotland and found it... orderly.
      He made a pilgrimage to Rome. He gave alms like rain.
      The chronicles of his own time call him generous, pious, strong.
      Seventeen years of peace in a kingdom that rarely knew three.
      History's most slandered king —
      done in by a playwright five hundred years later
      who needed a villain for a Scottish king's court.
      The real man died with a sword in his hand at Lumphanan,
      a king defending his crown.
      The legend died never.
    description: "Macbeth seizes Scotland's throne in battle and rules seventeen orderly, pious years — history's most slandered king, undone five centuries later by Shakespeare's need for a villain."
    status: "published"
    sha256: "7cb96bf838fb5f00ab78a4821cdd5a0fa7f67759ecab6b9a8f5bbda2f714cbbf"
  - number: "1916"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Fire-Drug"
    date: "1044 CE"
    region: "China"
    poem: |
      It was in a military manual —
      buried between instructions for siege engines and signal flags:
      a recipe for the fire-drug.
      Saltpeter, sulfur, charcoal.
      Mix it wrong and it burns your eyebrows off.
      Mix it right and it explodes.
      I watched a Song artificer demonstrate for his officers —
      a bamboo tube, a flash, a bang that sent the courtyard dogs running —
      and the officers laughed, the way men laugh at fireworks.
      They were fireworks. For now.
      But the formula was written down, and formulas travel,
      and within a few centuries the fire-drug would leave China
      and start knocking down the walls of every castle in the world.
      Gunpowder.
      The loudest paragraph ever written in a bureaucratic manual.
    description: "A Song military manual records the formula for gunpowder — the fire-drug, demonstrated as fireworks — the recipe that will eventually knock down every castle wall on earth."
    status: "published"
    sha256: "2f7cedd9a1c9a1d6a8d2d8c04f910f8fe84915805985318e059bb441a2252e7f"
  - number: "1917"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Three Popes, One Throne"
    date: "1046 CE"
    region: "Rome"
    poem: |
      There were three of them.
      Three men, each calling himself pope,
      each with his backers, his palace, his curses —
      Rome in 1046 was a farce with vestments.
      So the young German emperor, Henry III, marched south,
      called a council at Sutri, and did the unthinkable:
      he deposed all three.
      I was in the crowd outside when the sentence was read —
      three popes, un-poped in an afternoon,
      and Henry installing his own man, a German bishop,
      to clean the whole rotten beautiful mess up.
      It worked, after a fashion.
      The papacy got its reform, its dignity back —
      and then, within thirty years,
      the reformed popes turned on the emperors
      and the whole Investiture war began.
      Henry had fixed the church.
      The church thanked him by trying to destroy his son.
    description: "Emperor Henry III deposes three rival popes at Sutri and installs his own — cleansing the papacy, which will repay the favor by turning on his son within a generation."
    status: "published"
    sha256: "068eb0386adfdf728ee5548943d621828715eb863640cd61584d4239b26a0aea"
  - number: "1918"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Tentmaker's Stars"
    date: "1048 CE"
    region: "Persia"
    poem: |
      He was born at Nishapur that year —
      Omar, son of Ibrahim the tentmaker,
      and they called him Khayyam, the tentmaker,
      though his tents were made of numbers.
      I met him as a young man, already famous among the learned
      for his algebra, his calendar work —
      he would reform the calendar more accurately than the Gregorian,
      five centuries early —
      and in the evenings, over wine,
      he wrote the verses.
      The Rubaiyat.
      Wine, roses, the turning sky, the shortness of it all —
      quatrains that would cross the world
      and make a Persian astronomer
      the most quoted poet in the English language.
      Astronomer by day, poet by night,
      skeptic always.
      The stars were his profession.
      Doubt was his religion.
    description: "Omar Khayyam is born at Nishapur — astronomer who will reform the calendar five centuries early, and poet whose wine-dark quatrains will conquer the English language."
    status: "published"
    sha256: "0f3149eb07c058bc30cd3205fbc9d2e3b350caf0fa4ea613d21907fb0dc4c647"
  - number: "1919"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Chaco's Great Houses"
    date: "1050 CE"
    region: "North America"
    poem: |
      In the desert canyon, they were raising a crescent of stone —
      Pueblo Bonito, the beautiful town:
      six hundred rooms, four stories, a great arc
      facing the southern sun,
      built by people who had no wheels, no beasts of burden,
      no metal tools.
      I walked the construction lines and watched the crews
      hauling timbers from mountains fifty miles away —
      ponderosa pine, carried on human backs,
      for the roof beams of a building
      that would stand for a thousand years.
      Chaco was the center then:
      roads running out like spokes, turquoise coming in,
      macaws from Mexico, chocolate, copper bells.
      A desert civilization, running on ceremony and trade,
      raising great houses to the sky —
      until the rains failed, and the center moved on,
      and the canyon kept the stones.
    description: "In Chaco Canyon, Pueblo builders raise the great crescent of Pueblo Bonito — six hundred rooms of stone, hub of a desert civilization of roads, turquoise, and ceremony."
    status: "published"
    sha256: "dcb9d7773622bb8b4f2e9e5fbe0b2b7521298c0df032ad1808e7d52fecd528ad"
  - number: "1920"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Jade Astronomer's Map"
    date: "1052 CE"
    region: "China"
    poem: |
      The Song astronomers never stopped watching.
      Night after night, on the observatory tower at Kaifeng,
      they charted the heavens —
      new stars noted, old ones measured,
      the catalogues growing thicker every year,
      written in the careful hand of men who believed
      the sky was the emperor's mirror
      and every anomaly a memo from heaven.
      I climbed the tower one clear autumn night
      and looked through their sighting tubes at the same stars
      my own age would name with numbers —
      and their charts were good.
      Centuries before the telescope,
      they were mapping the sky with bronze and patience
      and the conviction that nothing up there
      moved without meaning.
    description: "Song astronomers at Kaifeng keep their nightly watch, thickening the star catalogues year by year — charting the heavens with bronze instruments and infinite patience."
    status: "published"
    sha256: "b686769a53a595e37e568e6549448f067609a069d56d7431a6b9df4df1b3e2c2"
  - number: "1921"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Crab Star"
    date: "1054 CE"
    region: "Skies"
    poem: |
      It burned for twenty-three days in daylight —
      a guest star in the constellation of the Crab,
      so bright you could see it at noon,
      and then it faded, over two years, into the dark.
      I watched it with the Chinese astronomers,
      who wrote it down with their usual care:
      a star you could see by day, in the east, for weeks.
      They didn't know they'd watched a star die.
      They didn't know the expanding wreckage
      would still be glowing a thousand years later —
      the Crab Nebula, the astronomers of my age call it,
      a cloud of gas six light-years wide,
      still flying apart from that summer's explosion.
      A star died in 1054.
      We're still watching the light of its funeral.
    description: "A guest star blazes for weeks, visible by day — the supernova whose expanding wreckage is still glowing a thousand years later as the Crab Nebula."
    status: "published"
    sha256: "15fffb0caee57d86bd11cd4b255cc0ed11da5005b9b1c801dd42357c45918aec"
  - number: "1922"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Great Schism"
    date: "1054 CE"
    region: "Christendom"
    poem: |
      It happened over bread, mostly —
      leavened or unleavened, the Eucharist's recipe —
      and over one word in the Creed,
      and over who got to be boss.
      I was in Constantinople when the papal legates
      marched into the Hagia Sophia and laid the bull of excommunication
      on the altar, in the middle of the liturgy —
      and the Patriarch answered with excommunication right back.
      East and West. Orthodox and Catholic.
      The Christian world, split down the middle,
      and it has never healed.
      They'd been drifting apart for centuries —
      language, politics, pride —
      but that summer made it official,
      with curses on an altar.
      A thousand years later, the wound is still open,
      and the bread is still the argument.
    description: "Pope and Patriarch excommunicate each other in the Hagia Sophia — the Great Schism splits Christendom East and West over bread, a word, and pride, a wound never healed."
    status: "published"
    sha256: "b7619ee54e61028212df816a690e3c83d88bd86c5c6f771e0f990ab6e2494a85"
  - number: "1923"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Macbeth Falls"
    date: "1057 CE"
    region: "Scotland"
    poem: |
      Lumphanan. August.
      Malcolm Canmore — Duncan's son, raised in exile,
      backed by English swords —
      caught Macbeth in the hills of Aberdeenshire,
      and the seventeen-year reign ended the way it began:
      in battle.
      I stood on the hillside and watched the king's guard
      go down around him, one by one,
      and Macbeth with them, sword in hand to the last.
      Shakespeare would make him a monster,
      a tyrant with witches and a guilty wife —
      but the men who buried him that day
      buried a king who had ruled well and died fighting.
      History gets written by the winners,
      and Malcolm's line hired the playwrights.
      The villain got his ending.
      The man deserved better.
    description: "Malcolm kills Macbeth at Lumphanan — the real king dies sword in hand after seventeen good years, while Shakespeare's villain gets the ending the winners wrote."
    status: "published"
    sha256: "6bc11b0a9306724bf184ed750fd9f82607b45205200bd86c062924905180e193"
  - number: "1924"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Almoravid Call"
    date: "1060 CE"
    region: "West Africa"
    poem: |
      In the deep desert, a preacher named Ibn Yasin
      gathered the Sanhaja Berbers in a ribat —
      a fortified monastery, half barracks, half prayer hall —
      and forged them into something new:
      the Almoravids, the men of the ribat,
      warriors of the faith, stern as the desert itself.
      I sat in on one of his sermons —
      no music, no softness, just law and discipline
      and the promise that God favored the strict.
      They would sweep north out of the Sahara
      like a sandstorm with swords:
      take Morocco, found Marrakesh,
      cross into Spain, humble the taifa kings,
      and hold the desert's edge for a century.
      It started with one preacher, one fort,
      and men willing to be harder than the desert.
    description: "The preacher Ibn Yasin founds the Almoravid movement in a desert ribat — stern warrior-monks who will sweep north to found Marrakesh and rule Spain's taifas."
    status: "published"
    sha256: "2c4ab8c80883d43d433a84e2ab979c9a79021f96b60e2f6884232b1cd89fc3a3"
  - number: "1925"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Alp Arslan's Bow"
    date: "1063 CE"
    region: "Seljuk Lands"
    poem: |
      Alp Arslan — the Heroic Lion —
      took the Seljuk throne, and the Turks had their great sultan:
      a bowman, a horseman, a commander who led from the front
      and prayed like a dervish before battle.
      I watched his armies move west that decade,
      Turkish horse-archers flowing toward Byzantium
      like water finding a crack in a dam —
      Armenia, then the frontier forts,
      then the great prize, Anatolia itself.
      The Byzantines had held the east for seven hundred years.
      Alp Arslan would break it in one afternoon at Manzikert —
      but that was still eight years off.
      In 1063, he was just the new sultan,
      stringing his bow,
      and looking west.
    description: "Alp Arslan takes the Seljuk throne — the Heroic Lion whose Turkish horse-archers will push toward Byzantium and break it open at Manzikert."
    status: "published"
    sha256: "75ff609dcb4822213e9a80a7d65e1a05c0bc48b2880ad481e2e39c50b1f0242e"
  - number: "1926"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Comet of Conquest"
    date: "1066 CE"
    region: "Skies"
    poem: |
      It hung over England for a week —
      Halley's Comet, blazing in the spring sky,
      and everyone knew what it meant.
      Everyone always knows what comets mean:
      disaster, death, the fall of kings.
      I stood in a field in Sussex and watched the villagers
      point at it with white faces —
      the English said it foretold Harold's doom,
      the Normans said it foretold William's triumph,
      and the Bayeux Tapestry sewed it into the story forever:
      men staring up at the burning star,
      the caption reading, in Latin, they marvel at the star.
      It was just ice and dust, swinging past the sun.
      But in 1066, it was an omen —
      and omens, believed hard enough,
      have a way of coming true.
    description: "Halley's Comet blazes over England in the spring of 1066 — sewn into the Bayeux Tapestry as an omen, believed by both sides, and fulfilled by autumn."
    status: "published"
    sha256: "017ee5d7748bb3e659cbb73cbcb5e122f08a54000ec4b308fb967f7cb2b6c0ab"
  - number: "1927"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Norman Yoke"
    date: "1066 CE"
    region: "England"
    poem: |
      Pevensey, September 28th —
      William's ships beached in the dawn mist,
      and the Bastard of Normandy (they'd call him Conqueror soon)
      stumbled as he landed, grabbed two fistfuls of English soil,
      and said: I take possession.
      Hastings, three weeks later: Harold dead, the shield wall broken,
      the English aristocracy dying in a single day on a Sussex hill.
      Westminster, Christmas: crowned, in the Confessor's abbey,
      while his men fought the crowd outside.
      I walked England the year after —
      a French king, French lords, French the language of power,
      the whole country re-tenured, re-surveyed, re-made.
      The Norman Yoke, the English called it.
      It chafed for three hundred years —
      and it made England what it became.
    description: "William lands at Pevensey, wins Hastings, and is crowned at Westminster — England gets a French king, and the Norman Yoke remakes the country for three centuries."
    status: "published"
    sha256: "16adcdb05ec17934eaf7954bce967efcf3a2e57996c6c7cd8e4fb98502236730"
  - number: "1928"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Reformer's Gamble"
    date: "1068 CE"
    region: "China"
    poem: |
      Wang Anshi looked at the Song empire and saw it rotting —
      the treasury empty, the peasants crushed by debt,
      the army a joke —
      and he did what reformers do: he tried to fix it all at once.
      The New Policies: state loans to farmers at fair rates,
      a single fair tax, government granaries against famine,
      militia to replace mercenaries.
      I sat in on a court debate — the conservatives were apoplectic:
      state interference! Ruin! The end of everything!
      And for a while, it worked.
      The treasury filled. The peasants breathed.
      Then the emperor wavered, the factions turned,
      and the reforms were gutted, restored, gutted again —
      China's great what-if, argued by scholars for a thousand years:
      what if they'd let him finish?
    description: "Wang Anshi launches his New Policies — state loans, fair taxes, granaries — the boldest reform gamble in Chinese history, undone by court faction before it can finish."
    status: "published"
    sha256: "cd26cfd80a968636b0bf65fe1167769aff5bf8bebf5ef3123b15f1dcf4217f7b"
  - number: "1929"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Manzikert"
    date: "1071 CE"
    region: "Anatolia"
    poem: |
      August 19th, 1071 —
      the Byzantine emperor Romanos led the greatest army
      the empire had fielded in a generation
      into the Armenian highlands,
      and Alp Arslan was waiting.
      I watched the Turkish horse-archers do what they always did:
      feign retreat, stretch the Byzantine line, wheel, and kill.
      By evening the emperor was a prisoner,
      sitting in the sultan's tent, being treated with absurd courtesy —
      Alp Arslan reportedly asked him what he'd have done, reversed,
      and Romanos said: probably killed you.
      They ransomed him. He went home to be blinded and deposed.
      And Anatolia — the empire's heartland, its soldiers, its grain —
      lay open to the Turks.
      One afternoon. One battle.
      The beginning of the end of Byzantine Asia.
    description: "At Manzikert, Alp Arslan captures the Byzantine emperor and opens Anatolia to the Turks — one afternoon's battle that begins the end of Byzantine Asia."
    status: "published"
    sha256: "29a8000bec9aa1c966e5306c9b3ba76699600c0dd0dacc2021062939a61e4ce8"
  - number: "1930"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Gregory's Revolution"
    date: "1073 CE"
    region: "Rome"
    poem: |
      Hildebrand became Gregory VII —
      a monk's monk, iron-willed, terrifyingly certain —
      and he declared the revolution in a single document:
      the Dictatus Papae.
      The pope, he wrote, can depose emperors.
      The pope alone. No king may judge him.
      The Church is free — free of kings, free of laymen,
      free of everyone but God and Gregory.
      I was in Rome when the news reached the German court,
      and Henry IV laughed — then stopped laughing.
      Within three years the pope would excommunicate the emperor,
      and the mightiest ruler in the west
      would be kneeling in the snow at Canossa.
      The medieval papacy's great power grab,
      launched by a man who believed every word of it.
    description: "Hildebrand becomes Pope Gregory VII and declares the Church free of kings — the Dictatus Papae, the revolution that will bring an emperor to his knees in the snow."
    status: "published"
    sha256: "768cf9bc93b3573917e859776a3053f4bb33743a49b1e94f61e127060182f478"
  - number: "1931"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Kulothunga's Reign"
    date: "1075 CE"
    region: "South India"
    poem: |
      Kulothunga Chola took the throne,
      and the Chola empire was at its height —
      its ships ruling the Bay of Bengal,
      its merchants in China, its armies in Ceylon,
      its temples rising like mountains of carved stone.
      I sailed with a Chola merchant fleet to the Malay coast —
      a hundred ships, the holds full of pepper and pearls,
      the captains navigating by stars their grandfathers had named.
      This was India's ocean age:
      Tamil ships, Tamil ports, Tamil gods
      carried on monsoon winds from Arabia to China.
      Kulothunga would rule for fifty years,
      and the Chola bronze gods — Shiva dancing in his ring of fire —
      are still the most beautiful things India ever made.
    description: "Kulothunga Chola I takes the throne at the empire's height — Chola ships ruling the eastern seas, Tamil merchants sailing to China, bronze gods dancing in temple firelight."
    status: "published"
    sha256: "3d21e540dcfa4e2d0536fd711ef3ae0e7388286a9bb14163915de9a08f632599"
  - number: "1932"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Koumbi Saleh Falls"
    date: "1076 CE"
    region: "West Africa"
    poem: |
      The Almoravids came out of the desert —
      stern men, veiled men, men who prayed five times daily
      and fought like the desert wind —
      and Koumbi Saleh, the golden city of Ghana,
      opened its gates or had them broken; the chronicles argue.
      I walked the markets afterward:
      the gold trade stuttered, the king's power bled away,
      the Soninke empire that had ruled the desert's edge for centuries
      began its long fade.
      The Almoravids didn't stay — they had Morocco and Spain to conquer —
      but they'd broken the spell.
      Ghana would linger, diminished, for another century and more,
      while south of it, in the forests and the Niger valley,
      new powers were already stirring.
      Mali was coming.
      The gold road would find new masters.
    description: "Almoravid armies take Koumbi Saleh, and the golden empire of Ghana begins its long fade — while in the south, the powers that will become Mali are already stirring."
    status: "published"
    sha256: "a03fa9e9a06312881cf962ab605ea4167f279e5f1fb680afca3457c47df9c3d9"
  - number: "1933"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Canossa"
    date: "1077 CE"
    region: "Germany"
    poem: |
      January. The Apennines. Snow.
      Henry IV, the most powerful ruler in western Christendom,
      stood barefoot outside the castle of Canossa for three days —
      in a hair shirt, in the snow, begging the pope's forgiveness.
      I was in the courtyard when Gregory finally let him in,
      and I watched an emperor kneel.
      Excommunication had done it: his princes deserting,
      his bishops wavering, his crown suddenly conditional —
      so he'd crossed the Alps in winter to beg.
      Gregory lifted the ban. Henry went home.
      And then — because this is how power works —
      Henry came back with an army, drove Gregory into exile,
      and the pope died broken at Salerno.
      But the image stuck: the emperor in the snow.
      A thousand years later, "going to Canossa" still means
      the humbling no power can refuse.
    description: "Excommunicated, Henry IV kneels barefoot in the snow at Canossa before Gregory VII — the humbling of an emperor that gives history its phrase for ultimate submission."
    status: "published"
    sha256: "4d449febaa387a066735f76305d1d6ae5dd9932d24e83f8a965f03100c37f49a"
  - number: "1934"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Komnenian Dawn"
    date: "1081 CE"
    region: "Byzantium"
    poem: |
      The empire was a wreck in 1081 —
      Normans in the west, Turks in the east,
      the treasury empty, the army a memory —
      and then Alexios Komnenos seized the throne,
      a thirty-three-year-old general with a plan
      and the energy of a man half his age.
      I watched him work: debasing the coinage to pay the troops,
      rebuilding the army regiment by regiment,
      playing Normans against Turks, Turks against Pechenegs,
      diplomacy as a weapon, patience as a strategy.
      He would rule for thirty-seven years,
      and when he died the empire was standing again —
      smaller, harder, alive.
      The Komnenian restoration.
      One competent man, arriving at the exact moment
      competence was the only thing that could save the state.
    description: "Alexios Komnenos seizes the Byzantine throne and begins the long recovery — rebuilding army, coinage, and diplomacy, the restoration that saves the empire for another century."
    status: "published"
    sha256: "757c5954c641ccb173f27931700fcbae80348fb7f13b0918dbe156ed9c1feb30"
  - number: "1935"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Toledo Falls"
    date: "1085 CE"
    region: "Iberia"
    poem: |
      Alfonso VI rode into Toledo in May —
      the old Visigothic capital, the greatest city of Muslim Spain,
      taken more by the taifas' weakness than by Christian strength —
      and he did something wise: he kept it whole.
      I walked Toledo's streets that summer,
      past the mosques becoming churches,
      past the libraries — the libraries! —
      where the Arabic books sat in their thousands:
      Aristotle, Ptolemy, Avicenna, al-Khwarizmi,
      the whole inheritance of Greek and Arab learning,
      waiting for translators.
      They came flooding in: scholars from France, Italy, England,
      learning Arabic to carry the treasure north.
      Toledo became the pipeline —
      the city where Europe recovered its lost mind,
      one translated manuscript at a time.
    description: "Alfonso VI retakes Toledo, and Christian scholars flood in to translate its Arabic libraries — the pipeline through which Europe recovers Aristotle, Ptolemy, and Avicenna."
    status: "published"
    sha256: "e544ed7186c81e93fb97af6e003c27ef74f9df80c79fa3c0234e76d9b0a7e808"
  - number: "1936"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Domesday Book"
    date: "1086 CE"
    region: "England"
    poem: |
      William sent his men out with one instruction: write it all down.
      Every manor. Every plow. Every pig, every mill, every beehive.
      I followed one commission through three counties —
      the villagers terrified, the reeves sweating,
      the clerks writing in Latin abbreviations no one could read but them.
      "How many plows? How many villagers? What was it worth before 1066 —
      and what is it worth now?"
      The Domesday Book.
      England, inventoried like a warehouse —
      the most complete snapshot of any medieval country,
      and the most naked exercise of power ever bound in leather:
      the Conqueror, counting what he owned.
      Nine hundred years later, historians still mine it.
      The pigs are still there, in the Latin.
    description: "William's surveyors count every manor, plow, and pig in England — the Domesday Book, the most complete snapshot of any medieval country and the nakedest exercise of power ever bound."
    status: "published"
    sha256: "e4273313bb45a4c51034ba224e3e7c7b7cd9e4811cf8f9f942ddb781e6934741"
  - number: "1937"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Conqueror Dies"
    date: "1087 CE"
    region: "England"
    poem: |
      He died at Rouen, fat and in pain —
      thrown against his saddle-pommel at Mantes, the chronicles say,
      his great belly rupturing —
      and the mighty Conqueror's death was pure farce:
      his servants looting the room before the body was cold,
      the coffin too small, the corpse bursting it at the funeral,
      the mourners fleeing the stench.
      I was there. It was exactly that undignified.
      And his empire — England, Normandy, the whole Norman achievement —
      he split three ways among his sons,
      who spent the next twenty years trying to kill each other for it.
      Twenty-one years a king.
      He'd remade England, inventoried it, yoked it —
      and died too fat for his coffin,
      while his sons divided the spoils with swords.
    description: "William the Conqueror dies at Rouen — his death a farce of looted rooms and a bursting coffin — and his sons divide the empire he built and spend twenty years fighting over it."
    status: "published"
    sha256: "624ed3124a295a22c12214dbd79e4057cbb38bdffcb5bd807ceb223ac1e3fb5f"
  - number: "1938"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The First University"
    date: "1088 CE"
    region: "Italy"
    poem: |
      It started with students hiring teachers —
      that's the part everyone forgets.
      At Bologna, the law students banded together,
      pooled their money, and hired the best lecturers in Europe,
      fining them if they skipped class or droned.
      The universitas: a guild, but for learning.
      I sat in on a law lecture — Irnerius, or one of his circle,
      unpacking Justinian's code for a room full of young men
      from every country in Europe,
      and the air was electric with argument.
      No king founded it. No pope chartered it — not yet.
      Just students, money, and hunger for the law.
      The university: invented from below,
      by customers who refused to be ignorant.
    description: "At Bologna, law students band together and hire their own teachers — the university is born from below, a guild for learning, with no king or pope yet involved."
    status: "published"
    sha256: "8a369bede89b604e25e3c888a5969ad8ef9db2bd4f8b93411293ad469e066090"
  - number: "1939"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Assassins' Mountain"
    date: "1090 CE"
    region: "Persia"
    poem: |
      Hassan-i Sabbah took Alamut without a siege —
      he converted the garrison, the chronicles say,
      bought the castle with gold and persuasion —
      and from that eagle's nest in the Elburz mountains,
      he launched the strangest war in history.
      The Nizari Ismailis: a handful of believers,
      and their weapon was the dagger, up close, in public —
      viziers, princes, crusader lords, dying on the steps of mosques,
      the assassin making no attempt to escape.
      I walked the terraces of Alamut once —
      gardens, libraries, astronomers' towers —
      a fortress of scholars who killed kings.
      "Nothing is true, everything is permitted" —
      they say that was his motto.
      For a hundred and seventy years,
      the old man of the mountain's reach
      was longer than any army's.
    description: "Hassan-i Sabbah seizes the mountain fortress of Alamut, and the Nizari Ismailis begin their long shadow war — scholar-assassins whose daggers reach further than armies."
    status: "published"
    sha256: "f35aa1236062a74c19207c45bae024907e435d5d3d55c776aa0389d6761337fe"
  - number: "1940"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Death of Nizam al-Mulk"
    date: "1092 CE"
    region: "Seljuk Lands"
    poem: |
      He was the greatest vizier of the age —
      Nizam al-Mulk, who had run the Seljuk empire for thirty years,
      built the madrasas, balanced the factions,
      wrote the Book of Government —
      and a dagger ended him on the road to Baghdad,
      an Assassin's blade, or a rival's; the truth died with him.
      I saw the empire's machinery shudder that autumn:
      within weeks the sultan was dead too,
      and the Seljuk realm — the power from Central Asia to Syria —
      began to crack into pieces,
      atabegs and princes carving it up like a roast.
      The Assassins had aimed at one man.
      They hit an empire.
      When the crusaders arrived seven years later,
      they found the Muslim east divided —
      and walked through the cracks.
    description: "The vizier Nizam al-Mulk is murdered, and within weeks the Seljuk empire begins fracturing — the division the crusaders will walk through seven years later."
    status: "published"
    sha256: "5cf2572b3d21490fb858a4e7f9f7b12876874ae6be70c619450dbc17ef1b4029"
  - number: "1941"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "God Wills It"
    date: "1095 CE"
    region: "France"
    poem: |
      Clermont, November —
      Pope Urban II stood in a field outside the town
      (he'd been refused the cathedral; the crowd was too big)
      and preached the sermon that broke the world open:
      Jerusalem, in the hands of the infidel.
      The suffering of eastern Christians.
      God wills it — take the cross, and your sins are forgiven.
      I was at the edge of that crowd,
      and I felt it go through them like a current —
      men weeping, men shouting, cutting crosses from their cloaks
      and sewing them on.
      Deus vult. God wills it.
      Within a year, armies were marching east —
      princes, knights, peasants, all of them —
      and nothing in the Mediterranean world
      would ever be the same.
      One sermon. Two centuries of war.
    description: "At Clermont, Pope Urban II preaches the First Crusade — \"God wills it\" — and the roar of the crowd launches two centuries of holy war."
    status: "published"
    sha256: "2738e528115a1fdaf77ea07b8deece5296fecbe578503786d88cd14617dd9983"
  - number: "1942"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The People's Crusade"
    date: "1096 CE"
    region: "Rhineland"
    poem: |
      Before the princes marched, the peasants did —
      tens of thousands of them, following a preacher called Peter the Hermit,
      barefoot, starving, certain God would part the seas for them.
      I walked with that column through the Rhineland,
      and I watched what certainty does to the certain:
      at Speyer, at Worms, at Mainz,
      they turned on the Jewish communities —
      God's first crusade, against the neighbors —
      and the blood ran in the streets.
      The chronicles call them martyrs, the Jews who died
      rather than convert; I call them murdered.
      The People's Crusade never reached Jerusalem —
      the Turks slaughtered them in Anatolia, to a man, almost.
      But the Rhineland remembered:
      the crusade's first victims were not Muslims.
      They were Jews, killed by Christians, in Germany.
    description: "Peasant armies march east for the crusade and turn first on the Rhineland's Jewish communities — the crusade's first victims, murdered by Christians in Germany before the Turks destroy the column."
    status: "published"
    sha256: "fcddc0085f9e26755d47c277036809c73a5b50164259e0af6d56a62775cae261"
  - number: "1943"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Antioch Taken"
    date: "1098 CE"
    region: "Syria"
    poem: |
      Eight months.
      Eight months outside the walls of Antioch —
      starving, freezing, eating their horses, eating worse —
      and then a traitor opened a tower gate in the night,
      and the crusaders poured in like water through a crack.
      I walked the streets the morning after:
      the slaughter was total, the chronicles don't exaggerate this time —
      Turks, Armenians, anyone in the way —
      and the crusaders, half-mad with hunger and triumph,
      looting the great city they'd dreamed of for a year.
      Then Kerbogha's relief army arrived,
      and the starving besiegers became the besieged —
      until the Holy Lance was "found,"
      and they marched out barefoot and broke the Turks.
      Antioch taken.
      Jerusalem next.
      God, they were sure, was marching with them.
    description: "After an eight-month siege of starvation, crusaders storm Antioch through a traitor's gate — then, besieged in turn, break out behind the Holy Lance and march on Jerusalem."
    status: "published"
    sha256: "ff91861736df6eb9b7c33ec198a3e88406dfbbd448a489456f44c1a48f403c62"
  - number: "1944"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Charter of Liberties"
    date: "1100 CE"
    region: "England"
    poem: |
      William Rufus died in the New Forest —
      an arrow, a hunting accident, nobody's fault officially —
      and his brother Henry moved fast:
      rode for Winchester, seized the treasury,
      got himself crowned in three days.
      I was at Westminster for the coronation,
      and Henry did the cleverest thing a usurper can do:
      he promised.
      The Charter of Liberties — read aloud, nailed up, sworn:
      no more arbitrary taxes, no more seizing the church's lands,
      the old laws of Edward the Confessor restored.
      It was politics, pure politics —
      buy the barons, buy the church, buy the crown.
      But the promises were written down,
      and written promises have a way of outliving
      the men who make them.
      A century later, at Runnymede,
      the barons would remember Henry's charter —
      and ask for it back, with interest.
    description: "Henry I seizes the throne and issues the Charter of Liberties — promises made for politics, written down, and remembered a century later at Runnymede."
    status: "published"
    sha256: "43aa3f93a2fb463fc30c6a6eec15142a01ba63f067915915b27609c82610d195"
  - number: "1945"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Crusader Kingdom"
    date: "1100 CE"
    region: "Jerusalem"
    poem: |
      Baldwin was crowned in Bethlehem —
      not in Jerusalem (the patriarch quarreled over that),
      but in the town of Christ's birth,
      king of a kingdom that shouldn't have existed:
      the Latin Kingdom of Jerusalem,
      a Frankish state in the Levant,
      held by a few thousand knights
      surrounded by a sea of enemies.
      I stood in the Church of the Nativity that Christmas morning
      and watched a French adventurer become an eastern king —
      and the thing that struck me was the audacity of it:
      they meant to stay.
      They built castles — Krak des Chevaliers, the great ones —
      they married, they traded, they learned Arabic,
      they became something neither Frankish nor Arab.
      Outremer. The land beyond the sea.
      It would last a hundred years.
      For a while, it shone.
    description: "Baldwin is crowned king in Bethlehem — the Latin Kingdom of Jerusalem begins, a Frankish state in the Levant that will build great castles and last a century."
    status: "published"
    sha256: "a90b5f0098f8d71d8f75897e04fe9cd8fc9eebc1d993f4c93daf7a92b8098fcc"
  - number: "1946"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Acre Falls to the Franks"
    date: "1104 CE"
    region: "Holy Land"
    poem: |
      Acre was the prize —
      the great port, the deep harbor,
      the door through which everything came:
      reinforcements, pilgrims, grain, gold.
      I watched the siege from the hills:
      Baldwin's engines battering the walls,
      the Genoese fleet blockading the harbor,
      the garrison holding on, month after month,
      until the terms were made and the city opened its gates.
      The crusaders kept their word, this time —
      the inhabitants lived, the trade continued —
      because Acre wasn't a trophy, it was a lifeline.
      Without Acre, no kingdom.
      With it, the Franks had their window to the sea,
      and through that window, for the next eighty years,
      would come everything Outremer needed to survive.
    description: "Crusaders take the great port of Acre — not a trophy but a lifeline, the window to the sea through which the crusader kingdom will survive for eighty years."
    status: "published"
    sha256: "4fdc908096d32ab9a19b9979ce3fe72b48095753d6d37a5bce42535076655313"
  - number: "1947"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Tinchebray"
    date: "1106 CE"
    region: "England"
    poem: |
      Two brothers, one battlefield —
      Henry, king of England, against Robert, duke of Normandy,
      the Conqueror's sons, settling it the Norman way.
      I stood on the hill at Tinchebray and watched
      Henry's dismounted knights grind Robert's cavalry down —
      the new warfare beating the old,
      and by evening Robert was a prisoner,
      and Normandy was Henry's again.
      Henry kept his brother locked up for twenty-eight years —
      Cardiff Castle, comfortable, hopeless —
      until Robert died, still a prisoner, at eighty.
      The Conqueror's lands, reunited under one son.
      The other son, caged for life.
      Family business, Norman style:
      no hard feelings, just a lifetime in a tower.
    description: "Henry I crushes his brother Robert at Tinchebray, reuniting England and Normandy — and keeps his brother caged in Cardiff Castle for twenty-eight years."
    status: "published"
    sha256: "b32bf67b40316798b8d7d3d0830a6affc06b962fff0d1d8bc9f57aaccbcfee22"
  - number: "1948"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Fat King"
    date: "1108 CE"
    region: "France"
    poem: |
      Louis the Fat —
      they called him that because he was,
      enormously, cripplingly fat by the end,
      carried in a litter because he couldn't ride —
      but in 1108 he was a young king with a mission:
      tame the barons.
      I rode with his men on one of the early campaigns,
      against some robber-lord in his castle outside Paris —
      and Louis was there in the mud with them,
      a fighting king, even then too heavy for his horse.
      He spent his reign grinding down the petty tyrants
      of the Ile-de-France, castle by castle,
      making the French crown mean something
      beyond the walls of Paris.
      The fat man built the kingdom
      that Philip Augustus would make great.
      Never underestimate a king
      who does his own fighting.
    description: "Louis VI takes the French throne and begins taming his robber-barons castle by castle — the fat fighting king who makes the French crown mean something beyond Paris."
    status: "published"
    sha256: "f201fd7a6efe31f7bd49478040c6435f6c3323e44b0776059891f5b5410f39aa"
  - number: "1949"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Painter Emperor"
    date: "1110 CE"
    region: "China"
    poem: |
      Huizong should never have been emperor.
      He was an artist — a genius with a brush,
      birds, flowers, rocks, calligraphy like no one before or since —
      and the throne was the worst thing that ever happened to him.
      I visited his court at Kaifeng:
      the imperial painting academy, the catalogues of antiquities,
      the garden he'd built with rocks shipped from a thousand miles —
      while the army rotted, the treasury bled,
      and the Jurchen watched from the north like wolves.
      He fiddled. They came.
      In 1127 they'd take the capital and drag him north in a cage.
      But the paintings —
      the paintings are still perfect.
      History's most beautiful failure,
      ruling the loveliest court on earth
      right up to the edge of the cliff.
    description: "Huizong holds the Song throne — a genius painter and calligrapher, a disaster as emperor — ruling the loveliest court on earth right up to the Jurchen catastrophe."
    status: "published"
    sha256: "e8ff743a8a75fbac8218fc84b3fef4b4aeea49a6cad864ce1960126f1571f274"
  - number: "1950"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Builder King"
    date: "1113 CE"
    region: "Cambodia"
    poem: |
      Suryavarman took the Khmer throne by force —
      killed his great-uncle for it, the inscriptions admit —
      and then spent his reign building like a man
      trying to apologize to the gods in stone.
      I walked the causeways of Angkor that decade,
      past the reservoirs big enough to be called seas,
      the temples rising in the jungle heat —
      and the king's architects were already dreaming
      the biggest one:
      Angkor Wat.
      Five towers like lotus buds.
      A moat like an ocean.
      The largest religious monument on earth,
      built for Vishnu by a usurper
      who wanted heaven to forget how he got the throne.
      Heaven, I suspect, was impressed anyway.
    description: "Suryavarman II seizes the Khmer throne and begins the building program that will raise Angkor Wat — the largest religious monument on earth, a usurper's apology in stone."
    status: "published"
    sha256: "bf5381de88e6d9055f72d9d55a03378c0fc0679749aeee5e1a128f72d15e0887"
  - number: "1951"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Clairvaux"
    date: "1115 CE"
    region: "France"
    poem: |
      Bernard was twenty-five —
      a nobleman's son who'd talked his whole family into the monastery —
      and the abbot sent him out with twelve monks
      to found a new house in a valley called the Valley of Wormwood.
      Clairvaux. The valley of light, he renamed it.
      I visited in the early years:
      no ornament, no color, stone and silence,
      the white monks of Citeaux —
      work, prayer, work, prayer,
      the Cistercian rule stripped to the bone.
      And Bernard preached.
      Kings listened. Popes listened.
      He would launch a crusade with a sermon
      and condemn a philosopher with a letter.
      It started with thirteen men in a wormwood valley.
      Within his lifetime, Clairvaux would mother
      three hundred daughter houses across Europe.
    description: "Bernard founds Clairvaux with twelve monks — the white monks of Citeaux, stripped to stone and silence, whose mother house will plant three hundred daughters across Europe."
    status: "published"
    sha256: "9ec03eb0ae19dda28cf6ab10ad89aebdc1a8a8b7d52b27df69fd02217fa5a7cc"
  - number: "1952"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Poor Knights"
    date: "1118 CE"
    region: "Jerusalem"
    poem: |
      Nine knights.
      That's how it started — nine French knights,
      led by Hugh of Payns,
      taking vows of poverty, chastity, and obedience
      before the Patriarch of Jerusalem,
      and promising to guard the pilgrim roads
      against the bandits who infested them.
      I met them in their first headquarters —
      a wing of the royal palace, on the Temple Mount,
      in the place they called Solomon's Temple —
      poor men, patched cloaks, one horse between two of them, they said.
      The Poor Knights of Christ.
      Within a century they'd be the Templars:
      bankers to kings, warriors in white mantles,
      the most feared and richest order in Christendom —
      until a French king burned their Grand Master
      for their gold.
      But it started with nine men and a vow.
    description: "Nine knights vow to guard the pilgrim roads — the Poor Knights of Christ, who will become the Templars, bankers to kings, until a king burns them for their gold."
    status: "published"
    sha256: "5f213e806b9d16c7090f7ffa8bb31f7e66b36ed662a409776a5a0d485b82193b"
  - number: "1953"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Field of Blood"
    date: "1119 CE"
    region: "Holy Land"
    poem: |
      Roger of Salerno rode out confident —
      the Prince of Antioch, with his knights in their pride —
      and Ilghazi, the old Turkish warlord, was waiting
      with every horseman he could gather.
      Ager Sanguinis. The Field of Blood.
      I walked it the day after:
      the Antiochene army annihilated, Roger dead,
      the field — they say — running red to the ankles.
      The crusader states reeled.
      Antioch itself nearly fell; only Baldwin's desperate march
      saved it.
      The Franks learned the lesson that day
      and kept relearning it for a century:
      in the east, overconfidence is a kind of suicide,
      and the Turks are always, always waiting.
    description: "Ilghazi annihilates the army of Antioch at the Field of Blood — the crusader states reel, and the Franks learn that overconfidence in the east is suicide."
    status: "published"
    sha256: "afe4cf19346b5c0f32b354313c3549ff283eb40d313a4527ed5348235fa2349e"
  - number: "1954"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The White Ship"
    date: "1120 CE"
    region: "England"
    poem: |
      The White Ship was the finest vessel in the Norman fleet —
      new, fast, crewed by fifty oarsmen —
      and William Adelin, Henry I's only legitimate son,
      the heir to England and Normandy,
      sailed on her from Barfleur that November night,
      drunk, racing the king's own ship.
      I was on the quay. I watched her leave.
      She struck a rock at the harbor mouth —
      the sober say the crew was drunk, the passengers drunker —
      and she went down with three hundred souls.
      One man survived: a butcher from Rouen,
      clinging to wreckage in the cold black water.
      England's succession drowned that night in the Channel.
      Henry would never get another legitimate son.
      Nineteen years of civil war — the Anarchy —
      started with one drunken race in the dark.
    description: "The White Ship sinks off Barfleur with Henry I's heir and three hundred souls — England's succession drowns in the Channel, and nineteen years of civil war begin with one drunken race."
    status: "published"
    sha256: "b373f3d7f4e79c1fa5d81d0e4fe8f9c28d1bdf285e8d23cbc8189272a7e72647"
  - number: "1955"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Concordat of Worms"
    date: "1122 CE"
    region: "Germany"
    poem: |
      Fifty years of war over who appoints bishops —
      the Investiture Contest, pope against emperor,
      excommunications, antipopes, armies —
      and it ended at Worms with a compromise,
      because that's how these things always end.
      I was there for the ceremony:
      the emperor renounces investiture with ring and staff,
      the pope concedes the emperor's presence at elections,
      everyone bows, everyone saves face.
      Pope and emperor split the difference on bishops.
      It wasn't peace — they'd be at each other's throats again
      within a generation —
      but it was a settlement,
      and Christendom exhaled.
      The great lesson of Worms:
      when God and Caesar both claim the same bishop,
      the bishop learns to serve two masters
      and charge them both.
    description: "At Worms, pope and emperor compromise on the appointment of bishops — ending fifty years of Investiture war with a settlement that teaches bishops to serve two masters."
    status: "published"
    sha256: "0f5988a2bde36c9c4fc96280f8c8ec6bd77d42c4568f49d3ef49edf69e4cb81a"
  - number: "1956"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Almohad Spark"
    date: "1124 CE"
    region: "North Africa"
    poem: |
      In the High Atlas, a Berber scholar named Ibn Tumart
      looked at the Almoravid empire — rich, lax, worldly —
      and pronounced it corrupt.
      He called himself the Mahdi, the guided one,
      and preached a stern, pure, unitarian Islam:
      the Almohads, the unitarians.
      I heard him preach once, in a mountain village —
      a small man with a huge certainty,
      and the tribes were listening.
      The Almoravids laughed. Then they sent armies.
      Then they stopped laughing.
      Within twenty years the Almohads would take Marrakesh,
      topple the empire that had toppled Ghana,
      and rule from Spain to Tunisia —
      the strictest, most learned, most formidable power
      the medieval Maghreb ever saw.
      All from one man's sermon in the mountains.
    description: "Ibn Tumart proclaims himself Mahdi in the Atlas Mountains — the Almohad spark, a stern reform movement that will topple the Almoravids and rule from Spain to Tunisia."
    status: "published"
    sha256: "0b2604595a0d5ae78c6653162b1cde6fdb6bb5c421a27c1684c38a7b77703b66"
  - number: "1957"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Jingkang Shame"
    date: "1126 CE"
    region: "China"
    poem: |
      The Jurchen came down like winter —
      the Jin, horsemen from the northern forests,
      and Kaifeng, the greatest city on earth,
      a million people, the clock towers, the restaurants,
      the painted scrolls of its teeming life —
      fell.
      I was in the city during the siege:
      the hunger, the cold, the emperor abdicating in panic,
      his son abdicating after him,
      and then the gates opened,
      and the Jin took them both —
      two emperors, the whole court, the artisans, the musicians,
      marched north in chains through the snow.
      The Jingkang Shame.
      The north of China, lost.
      The Song court fled south across the Yangtze,
      and China would never be whole again
      in the Song's lifetime.
    description: "Jurchen Jin sack Kaifeng and drag two emperors north in chains — the Jingkang Shame, the fall of northern China and the flight of the Song across the Yangtze."
    status: "published"
    sha256: "66725cee48242ee6fd619b2594c6578b4ab90d052b34ca91b5bd443f80eb5728"
  - number: "1958"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Southern Song"
    date: "1127 CE"
    region: "China"
    poem: |
      Gaozong proclaimed it at Hangzhou —
      the Southern Song, the court in exile,
      half an empire, clinging to the south of the Yangtze —
      and then did the strangest thing:
      he made it thrive.
      I walked Hangzhou in those early years —
      the West Lake, the teahouses, the markets
      stacked with porcelain and silk and books —
      and the refugees had brought everything with them:
      the painters, the poets, the printing shops,
      the whole civilization, transplanted south,
      blooming in exile like a cutting taken in winter.
      China split. Commerce booming.
      The Southern Song would be the richest, most cultured,
      most technologically brilliant China there ever was —
      all of it built on the memory of the north they'd lost.
    description: "Gaozong proclaims the Southern Song at Hangzhou — the court in exile that becomes the richest, most cultured, most brilliant China there ever was, blooming on the memory of the lost north."
    status: "published"
    sha256: "18b0a31d1c7bef82b8abbb4261b8a4d2aa8f2d2c74ceb04463bc09e9b07f067d"
  - number: "1959"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Roger Crowned"
    date: "1130 CE"
    region: "Sicily"
    poem: |
      Roger II was crowned at Palermo on Christmas Day —
      king of Sicily, and his court was the strangest in Europe:
      Norman knights, Arab administrators, Greek scholars,
      all of them serving one king in three languages.
      I attended the coronation —
      the crown itself was Byzantine work,
      the robes embroidered with Arabic lions and camels,
      the ceremony half Latin, half Greek.
      Roger's Sicily was the Mediterranean in miniature:
      Muslim geographers mapping the world for a Christian king,
      Arab poets in the palace, Norman law in the courts.
      It worked. For a while, gloriously, it worked —
      proof that the three faiths could share one throne room,
      if the man on the throne was clever enough.
      Roger was clever enough.
      His successors, less so.
    description: "Roger II is crowned king of Sicily — Norman, Arab, and Greek in one trilingual court, proof that three faiths could share a throne room under a clever king."
    status: "published"
    sha256: "f1ff052f3eb8ef63f1921b941917b5a9e243b2914edb92fb01f41962470fd5a5"
  - number: "1960"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Hildegard's Visions"
    date: "1132 CE"
    region: "Germany"
    poem: |
      She was thirty-four when she started writing them down —
      the visions she'd had since she was a child:
      light, wheels within wheels, the cosmos as a living body,
      God speaking through images she could barely describe.
      Hildegard of Bingen.
      I visited her at Disibodenberg —
      abbess, composer, healer, prophet —
      and she showed me the pages:
      the Scivias, "know the ways,"
      theology as vision, medicine as cosmology,
      music she'd composed for her nuns to sing.
      The church didn't know what to do with her —
      a woman, unlettered in Latin, instructing bishops —
      so they let the pope examine her, and he approved,
      and she became the most famous woman in Germany:
      advising emperors, scolding popes,
      healing with herbs and hearing the music of the spheres.
    description: "Hildegard of Bingen begins writing her visions — abbess, composer, healer, and prophet, whose Scivias makes her the most famous woman in Germany, advising emperors and scolding popes."
    status: "published"
    sha256: "5f9addba01eef2ba27c62b97a80c26bb8faabc73065ca69e63dbaa331b9d3a85"
  - number: "1961"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Anarchy Begins"
    date: "1135 CE"
    region: "England"
    poem: |
      Henry I died of a surfeit of lampreys —
      that's what the chronicles say, and I believe them;
      the man loved his eels —
      and he'd made his barons swear to his daughter Matilda,
      but oaths are cheap when a crown is empty.
      Stephen of Blois moved first: seized the treasury, got crowned,
      and Matilda — Henry's daughter, the Empress —
      came back from Anjou with an army and a claim.
      I lived through those nineteen years —
      the Anarchy, they called it, and the chronicles say
      Christ and his saints slept through it:
      castles sprouting like mushrooms, barons robbing everyone,
      the coinage debased, the countryside bled white.
      Two cousins, one crown, nineteen years of war —
      until they were both exhausted,
      and made the peace that gave England the Plantagenets.
    description: "Henry I dies, Stephen seizes the throne from Matilda, and nineteen years of civil war — the Anarchy — begin: castles sprouting, barons robbing, Christ and his saints asleep."
    status: "published"
    sha256: "bece331c172d550cdf73254c50eeeb60605a79f317788cfdf8e2dfac601003f3"
  - number: "1962"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Eleanor's Dowry"
    date: "1137 CE"
    region: "France"
    poem: |
      She was fifteen —
      Eleanor of Aquitaine, duchess in her own right,
      heir to the richest, most cultured land in Europe:
      Aquitaine, Poitou, the troubadours, the wine, the courts of love —
      and her father died on pilgrimage,
      leaving her the greatest prize in Christendom.
      I saw her at Bordeaux that summer —
      a girl, really, but with eyes that had already learned to measure men —
      married within weeks to Louis, the French king's heir,
      Aquitaine folded into France like a jewel into a crown.
      She would be queen of France, then queen of England,
      mother of kings, grandmother of emperors —
      the most powerful woman of the Middle Ages —
      and it all started with a fifteen-year-old orphan
      and the richest dowry in Europe.
    description: "Fifteen-year-old Eleanor inherits Aquitaine — the richest prize in Europe — and marries the heir of France: the beginning of the most powerful woman of the Middle Ages."
    status: "published"
    sha256: "223f89c8c0df7584f31d1576edb21395a9039366d70f6a72b37e5c7871906803"
  - number: "1963"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Ourique"
    date: "1139 CE"
    region: "Portugal"
    poem: |
      They say he saw Christ on the cross in the sky before the battle —
      Afonso Henriques, the young count of Portugal,
      outnumbered, facing the Almoravid host at Ourique —
      and won.
      I wasn't close enough to see visions,
      but I saw the aftermath: the Muslim army broken,
      the field Afonso's,
      and his men lifting him on their shields
      and hailing him king —
      the first king of Portugal.
      Ourique is half legend now —
      five Moorish kings defeated, the miracle in the sky —
      but the kingdom was real enough,
      and it lasted.
      Eight hundred years of Portugal
      started on a battlefield in the Alentejo,
      with a young count, a vision,
      and men shouting him king.
    description: "Afonso Henriques wins at Ourique and is hailed Portugal's first king — legend says Christ appeared in the sky; the kingdom that followed lasted eight hundred years."
    status: "published"
    sha256: "51d0bb062d6cc8c4f68181b3e283dd7a26ea4edf6f8dcbf226e4bf5336a84465"
  - number: "1964"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Lover Condemned"
    date: "1140 CE"
    region: "France"
    poem: |
      They condemned him at Sens —
      Peter Abelard, the brightest mind in Paris,
      the logician who'd dared to apply reason to the mysteries of faith —
      and Bernard of Clairvaux was his prosecutor,
      the mystic against the logician,
      and the mystic won.
      I knew Abelard in his better days —
      brilliant, arrogant, the rock star of the schools,
      until the affair with Heloise:
      the secret marriage, the uncle's revenge, the castration,
      the two of them ending in separate cloisters,
      writing the most famous love letters of the Middle Ages.
      At Sens, broken in body, he was broken in reputation too —
      his teachings condemned, his books burned.
      Philosophy's most famous lover fell silent.
      Heloise outlived him by twenty years,
      and asked to be buried in his grave.
    description: "Abelard's teachings are condemned at Sens — the brilliant logician broken by Bernard, ending the Middle Ages' most famous love story in silence and separate cloisters."
    status: "published"
    sha256: "7dfe2bccf53175c3493cc42fd70bafa1883ddaff7a178914b3730763ca9179dd"
  - number: "1965"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The First Qur'an in Latin"
    date: "1143 CE"
    region: "Spain"
    poem: |
      At Toledo, in the translation workshops,
      Robert of Ketton — an Englishman in Spain —
      sat down with the Qur'an and rendered it into Latin:
      the first time Europe could read Islam in its own tongue.
      I watched him work —
      word by word, the Arabic giving up its meanings,
      the Latin stretching to hold them —
      and Peter the Venerable, the great abbot of Cluny,
      had commissioned it: know the enemy, he'd said,
      refute him properly.
      It wasn't friendly. It wasn't fair, in places.
      But it was a beginning:
      for the first time, a Christian scholar in Paris
      could open the Muslim scripture and read.
      Eight centuries of argument, misunderstanding, and occasional understanding —
      all starting with one Englishman's Latin,
      in a Toledo workshop, in 1143.
    description: "Robert of Ketton translates the Qur'an into Latin at Toledo — the first time Europe reads Islam in its own tongue, beginning eight centuries of argument and occasional understanding."
    status: "published"
    sha256: "6be1448b23e1a1fc295bc2f86003959858615658d2f792d8aa22d980c63e22b3"
  - number: "1966"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Edessa Falls"
    date: "1144 CE"
    region: "Holy Land"
    poem: |
      Edessa was the first crusader state —
      the county, far to the east, exposed, half-Armenian —
      and Zengi, the atabeg of Mosul, had been watching it for years,
      waiting for its count to leave.
      I was in the city when the siege engines came up —
      the walls were strong, but the count was away,
      and Zengi's miners brought a tower down,
      and then the slaughter.
      The chronicles say the streets ran with blood;
      the chronicles, this time, were right.
      When the news reached Europe,
      the shock was electric:
      the first crusader state, fallen.
      The pope preached a new crusade.
      Kings took the cross.
      All because one count left his city unguarded,
      and one Turkish warlord didn't miss.
    description: "Zengi takes Edessa, the first crusader state — the shock that launches the Second Crusade, all because one count left his city unguarded."
    status: "published"
    sha256: "97afddc1833b1096bc635de963383e0f6996ccfd0ec340559b6e624d31fbd70e"
  - number: "1967"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Bernard Preaches War"
    date: "1146 CE"
    region: "France"
    poem: |
      Vezelay, Easter —
      a field outside the abbey, a crowd too big for any church,
      and Bernard of Clairvaux preaching the Second Crusade.
      I was in that crowd, and I have never heard preaching like it:
      the man was on fire, literally shaking,
      holding up the pope's letter, crying out for Jerusalem,
      and the kings — Louis of France, Conrad of Germany —
      taking the cross on the spot,
      the nobles tearing their cloaks for crosses.
      They say the supply of cloth crosses ran out,
      and Bernard threw his own habit to the crowd
      to be torn into more.
      It worked too well.
      A hundred thousand marched east —
      and died, most of them, in Anatolia and at Damascus.
      The greatest preacher of the age,
      and his greatest sermon was a catastrophe.
    description: "Bernard of Clairvaux preaches the Second Crusade at Vezelay — kings take the cross on the spot, a hundred thousand march east, and most of them die."
    status: "published"
    sha256: "892fda3cae4b242dc958e62233796e544d78aee08279a520f3c7b198eef6ff0d"
  - number: "1968"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Damascus Holds"
    date: "1148 CE"
    region: "Holy Land"
    poem: |
      They'd marched across Anatolia dying of hunger and Turkish arrows,
      the two kings, Louis and Conrad, with their broken armies —
      and at Jerusalem the crusader lords talked them into attacking Damascus:
      rich, they said. Weak, they said. Easy, they said.
      It wasn't.
      I watched from the Mount of Olives country as the siege collapsed —
      four days, the water cut off, the Muslim relief armies closing in,
      the crusader camps quarreling over who'd get which palace
      before a single wall had fallen —
      and then the retreat, the humiliation,
      kings slinking home to Europe with nothing.
      The Second Crusade died at Damascus.
      The Muslims learned the Franks could be beaten.
      And in Damascus, a young Kurdish officer named Saladin
      was watching, and learning, and waiting.
    description: "The Second Crusade breaks against Damascus's walls — four days of quarrel and thirst, then humiliating retreat — while a young Kurdish officer named Saladin watches and learns."
    status: "published"
    sha256: "a65c579a8777262c27b80c4b7ddf4f9c5bd90579f1843554e859c3f2e4b1bfcc"
  - number: "1969"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Angkor Wat Rises"
    date: "1150 CE"
    region: "Cambodia"
    poem: |
      In the jungle heat, they were raising a mountain —
      Angkor Wat, Suryavarman's temple to Vishnu:
      five lotus towers, a moat a mile around,
      galleries of carved stone running for half a mile,
      the churning of the ocean of milk,
      heaven and hell and every god in between.
      I walked the causeway at dawn, past the stone lions,
      and the scale of it stopped my breath:
      the largest religious monument on earth,
      built by a king who'd murdered his way to the throne
      and was building his way to forgiveness.
      Thousands of laborers. Decades of work.
      Sandstone blocks fitted without mortar,
      carvings so fine you could read the jewelry.
      The jungle would take it back, in time.
      But stone remembers longer than jungle —
      and Angkor Wat is still there,
      still rising out of the green.
    description: "Suryavarman's builders raise Angkor Wat — five lotus towers, half a mile of carved galleries, the largest religious monument on earth, rising out of the jungle heat."
    status: "published"
    sha256: "7d4b311b241bf54203d4488ce7c5630d6c0caac5f38769aafb4363767c2478ab"
  - number: "1970"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Eleanor Remarries"
    date: "1152 CE"
    region: "France"
    poem: |
      The marriage was annulled —
      Louis VII and Eleanor, fifteen years,
      two daughters, one disastrous crusade,
      and the pope dissolved it on grounds of consanguinity
      that everyone knew was an excuse.
      I was in Paris when the news broke:
      Eleanor, free, thirty years old,
      the richest heiress in Europe, twice over —
      and within eight weeks she'd married Henry of Anjou,
      nineteen, red-haired, terrifyingly able,
      eleven years her junior.
      Aquitaine changed hands that summer —
      from France to the Angevins —
      and the map of power tilted.
      Henry would be king of England in two years,
      ruling from Scotland to the Pyrenees,
      and Eleanor would give him eight children
      and forty years of trouble.
      The most consequential divorce of the Middle Ages,
      settled in eight weeks.
    description: "Eleanor's marriage to Louis is annulled; within eight weeks she weds Henry of Anjou — Aquitaine changes hands, and the most consequential divorce of the Middle Ages tilts the map of power."
    status: "published"
    sha256: "5fa7407e0f1cccf73a7ccd7c1f49d05d2ab183a09e6aa12ef0f828bcee43633d"
  - number: "1971"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Treaty of Winchester"
    date: "1153 CE"
    region: "England"
    poem: |
      They were both exhausted —
      Stephen, old and grieving his son,
      Henry, young and unbeatable in the field —
      and at Winchester they made the peace:
      Stephen keeps the crown for life,
      Henry succeeds him,
      the Anarchy ends.
      I was in the hall when they swore it —
      nineteen years of civil war, settled with handshakes,
      the barons weeping with relief,
      the bishops blessing everything in sight.
      Stephen died the next year — the crown barely had time to cool —
      and Henry Plantagenet took it without a fight.
      The treaty held because nobody had anything left:
      not men, not money, not the will for one more campaign.
      Peace through exhaustion.
      It's not glorious, but it works —
      and England got its greatest dynasty out of the deal.
    description: "Stephen and Henry make peace at Winchester — nineteen years of Anarchy settled with handshakes, peace through exhaustion, and the Plantagenets begin."
    status: "published"
    sha256: "cef976474a80acc9a3dc0ce7c7ae1beee413344657fcfb8d2cb50b35432e2558"
  - number: "1972"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Henry Plantagenet Crowned"
    date: "1154 CE"
    region: "England"
    poem: |
      He was twenty-one —
      Henry Plantagenet, Henry FitzEmpress,
      crowned at Westminster in December,
      and his empire was the marvel of Europe:
      England, Normandy, Anjou, and — through Eleanor —
      Aquitaine:
      from the Scottish border to the Pyrenees,
      more of France than the French king held.
      I watched the coronation procession —
      the young king, red-haired, restless,
      already arguing with his chancellor about taxes —
      and nobody there doubted it:
      this one would be great.
      He was: the law courts, the juries,
      the common law taking shape in his reign,
      the Angevin empire run like a business.
      He was also impossible —
      his wife would rebel, his sons would rebel,
      Becket would die for crossing him —
      but that December, in the abbey,
      the future looked like morning.
    description: "Henry II is crowned at twenty-one, ruling an empire from Scotland to the Pyrenees — the restless founder of the common law, whose greatness and impossibility arrive together."
    status: "published"
    sha256: "544248fb70f8b9cdd24d335edf4278171bd1227bd851e309358ea1685c934bae"
  - number: "1973"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Munich Founded"
    date: "1158 CE"
    region: "Germany"
    poem: |
      Henry the Lion wanted a toll bridge —
      that's the whole story, really:
      the Duke of Saxony and Bavaria burned down
      the bishop's bridge at Föhring,
      built his own crossing over the Isar,
      and founded a market town to collect the salt tolls.
      Monks, markets, and salt.
      I walked the first streets — mud, mostly,
      a few dozen houses, the smell of the tanneries —
      and the duke's men were already calling it
      "by the monks": München. Munich.
      Eight hundred years later it would be
      one of the great cities of Europe —
      beer halls, opera, the Alps on the horizon —
      all of it downstream from one duke's burned bridge
      and a toll booth on the Isar.
    description: "Henry the Lion founds Munich on the Isar — monks, markets, and a salt toll bridge — the muddy market town that will become one of Europe's great cities."
    status: "published"
    sha256: "d6dd1f569ae3ba18ef58b75213516035aab74d72b2f06743778ea75fb350b4d3"
  - number: "1974"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Great Canoes"
    date: "1160 CE"
    region: "Pacific"
    poem: |
      They read the ocean like a book —
      the Polynesian navigators, in their double-hulled canoes,
      crossing thousands of miles of empty Pacific
      with no compass, no charts, no instruments:
      just stars, swells, birds, clouds,
      and memory.
      I sailed with one crew from the Societies to Hawaii —
      forty days, the canoe flexing over the swells,
      the navigator lying in the bow,
      feeling the waves with his body,
      reading the night sky like a map he'd memorized as a boy —
      and we made landfall on a green island
      nobody in Europe knew existed.
      Hawaii. Rapa Nui. The far islands, settled.
      The greatest navigators in human history,
      and they did it by feel.
    description: "Polynesian navigators settle the far Pacific — Hawaii, Rapa Nui — crossing thousands of miles of empty ocean by stars, swells, and memory, the greatest navigators in history."
    status: "published"
    sha256: "6b1bdfa9242b7de202352596a8e565dc09ec1672ab384ed8d3d996b315e1a985"
  - number: "1975"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Boy Temujin"
    date: "1162 CE"
    region: "Mongolia"
    poem: |
      He was born on the steppe that year —
      Temujin, son of Yesugei,
      a chief's son, nothing special,
      in a felt tent, in the wind.
      I held him once — a small red-faced baby
      with a blood clot in his fist, the midwives said,
      an omen.
      Within ten years his father would be poisoned,
      his family abandoned,
      and the boy would be hunting rats to survive,
      captured, enslaved, escaped —
      and then, slowly, impossibly,
      he would unite the steppe tribes
      and become Genghis Khan,
      and redraw the map of the world in blood.
      But in 1162 he was just a baby
      with a blood clot in his fist,
      crying in a felt tent
      while the steppe wind worked the ropes.
    description: "On the Mongolian steppe, a chief's son named Temujin is born — the abandoned boy who will become Genghis Khan and redraw the map of the world."
    status: "published"
    sha256: "2e8bf53200b8bc18b2dd1a0c08246e47bdf5b7aaf74ea289a082e6419cbcc01c"
  - number: "1976"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Notre-Dame Begins"
    date: "1163 CE"
    region: "France"
    poem: |
      They laid the first stone on the Ile de la Cité —
      Notre-Dame de Paris, Our Lady of Paris —
      and the bishop who dreamed it, Maurice de Sully,
      meant it to be the greatest church in France.
      I was there for the foundation rites —
      the choir singing, the relics processed,
      the whole island crowded to watch —
      and the work would take a hundred years:
      the twin towers, the rose windows,
      the flying buttresses holding the stone lace to the sky.
      Gothic was being born in those years —
      the pointed arch, the ribbed vault, light instead of mass —
      and Notre-Dame was its cathedral statement:
      eight centuries of kings crowned and buried,
      revolutions survived, fires endured.
      It started with one stone,
      on an island, in 1163.
    description: "The first stone of Notre-Dame de Paris is laid on the Ile de la Cité — the beginning of a hundred years of building, and of Gothic's great cathedral statement."
    status: "published"
    sha256: "6b4ab3f5a5d6d14e9d29bd4ae2026601aa62e581383c11b3e4facbf4cb8760a1"
  - number: "1977"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Hanseatic Spark"
    date: "1167 CE"
    region: "Northern Europe"
    poem: |
      It started with merchants looking out for each other —
      Lubeck's traders, banding together for protection on the roads
      and in the ports:
      shared warehouses, shared ships, shared muscle
      against pirates and princely tolls.
      I drank with a Lubeck merchant that year —
      a hard man with ink on his fingers —
      and he told me the plan:
      if the towns stand together, no lord can squeeze us alone.
      The Hansa. The League.
      Within a century it would be two hundred cities,
      from London to Novgorod,
      a trading empire with no king,
      its own laws, its own wars, its own flag —
      the merchants' answer to feudalism.
      It started with a handshake in Lubeck,
      and the idea that money, organized,
      is stronger than swords.
    description: "Lubeck's merchants band together for protection — the seed of the Hanseatic League, the trading empire with no king that will one day count two hundred cities."
    status: "published"
    sha256: "efe8789f7807b21746a36956ca58eda2afdacb5d3cbd9455c8d56dc4962aa1e5"
  - number: "1978"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Normans Land"
    date: "1169 CE"
    region: "Ireland"
    poem: |
      They came at Dermot's invitation —
      the deposed king of Leinster, who'd gone to England
      and hired himself some Normans:
      Strongbow, Richard de Clare,
      with his knights in their mail and his Welsh archers —
      and they landed at Bannow Bay in May.
      I watched them come ashore —
      a few hundred men, professional soldiers,
      against Irish kings who fought the old way —
      and within two years they'd taken Dublin, Waterford, Wexford,
      and Henry II was sailing over to make sure
      his barons didn't get too independent.
      Eight centuries of trouble, the timeline says.
      It started as a mercenary contract:
      one Irish king's revenge,
      a Norman earl's ambition,
      and a landing on a Wexford beach.
    description: "Norman knights land in Ireland at Strongbow's side, hired by a deposed king — a mercenary contract on a Wexford beach that begins eight centuries of trouble."
    status: "published"
    sha256: "61118f76835addf2cf0b0c59831ac1942a19d8c9a6ae382fe93175c9a1f2489b"
  - number: "1979"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Murder in the Cathedral"
    date: "1170 CE"
    region: "England"
    poem: |
      "Will no one rid me of this turbulent priest?"
      Henry said it in a rage — or so the story goes —
      and four knights took him literally:
      rode to Canterbury, found Becket at vespers,
      and killed him on the cathedral steps,
      his brains on the pavement, the monks screaming.
      I was in Canterbury that winter —
      the whole city in shock, the shrine already gathering pilgrims,
      the king doing public penance, walking barefoot to the tomb.
      Thomas Becket, the chancellor turned archbishop,
      the king's friend turned the king's conscience —
      murdered for the liberties of the church,
      or for his own stubbornness, depending who you asked.
      Henry got his penance.
      Becket got his sainthood.
      The church got its martyr —
      and kings learned to watch their angry words.
    description: "Four knights murder Thomas Becket at Canterbury's altar on the king's angry words — the martyr's shrine rises as Henry does barefoot penance, and kings learn to watch their words."
    status: "published"
    sha256: "6de06c658efecabc9d8cf2d3ce80e79adfb352792a4971ded611b9eeab3bfe2a"
  - number: "1980"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Saladin Takes Egypt"
    date: "1171 CE"
    region: "Egypt"
    poem: |
      He did it with a sermon —
      Saladin, the Kurdish vizier, Nur al-Din's man in Cairo,
      simply had the Friday prayer read in the Abbasid caliph's name
      instead of the Fatimid's —
      and the Fatimid caliphate, two hundred years old,
      ended with a change of words.
      I was in Cairo that Friday —
      the city barely stirred.
      The old caliph was a child, the regime was hollow,
      and Saladin — Yusuf ibn Ayyub —
      stepped into the vacuum like a man born to it.
      Egypt was his now: its grain, its gold, its armies.
      He would use them all —
      first to take Syria, then to face the crusaders —
      and the Ayyubid line he founded
      would rule Egypt and the Levant
      until the slave-soldiers took it from his heirs.
    description: "Saladin ends the Fatimid caliphate with a changed Friday sermon — Egypt, its grain and gold, becomes the base from which he will face the crusaders."
    status: "published"
    sha256: "7acb04f167dfe1f235ce5704a554872c2095d421f96dc7c6f6cd2637c45c2cd6"
  - number: "1981"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Saladin's Damascus"
    date: "1174 CE"
    region: "Syria"
    poem: |
      Nur al-Din died, and Syria was up for grabs —
      his son a child, his emirs circling —
      and Saladin moved faster than all of them:
      marched north from Egypt, took Damascus
      almost without a fight,
      the city opening its gates to the man
      who'd once served its master.
      I walked Damascus that autumn —
      the Umayyad Mosque, the markets, the citadel —
      and the mood was relief:
      no siege, no sack, just a new master,
      and a competent one.
      With Egypt and Damascus both his,
      Saladin held the crusader states in a vise —
      north and south, the Muslim powers united
      for the first time in a century.
      Jerusalem could see it coming.
      Everyone could see it coming.
    description: "Saladin takes Damascus, uniting Egypt and Syria — the Muslim counterweight to the crusaders grows, and the vise closes around the Frankish states."
    status: "published"
    sha256: "cca5e3dd5c98e7799d9e2e7b922e52dc8f07e4c46f1f66368db62ef7c6015527"
  - number: "1982"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Myriokephalon"
    date: "1176 CE"
    region: "Anatolia"
    poem: |
      Manuel Komnenos led his army into the Anatolian highlands —
      the greatest Byzantine force in a generation,
      siege engines, imperial guard, the works —
      meaning to crush the Seljuk Turks for good.
      I watched the column wind through the pass at Myriokephalon —
      miles long, strung out, vulnerable —
      and the Turks did what Turks do:
      hit the baggage, hit the rear, melt away, hit again.
      By evening the army was wrecked,
      the siege engines burned,
      Manuel himself fighting in the ranks.
      He got out alive. The empire didn't, quite —
      Myriokephalon was Byzantium's last great eastern gamble,
      and it failed.
      Anatolia would never be recovered.
      The Turks would never be driven out.
      One pass, one afternoon, one more turning
      of the long Byzantine decline.
    description: "The Seljuks ambush Manuel's army in the pass at Myriokephalon — Byzantium's last great eastern gamble fails, and Anatolia is never recovered."
    status: "published"
    sha256: "83f001c4ee7c67ea333204dc92a6c25603b293863588ff37f700568bd087b8a7"
  - number: "1983"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Taira Ascendant"
    date: "1178 CE"
    region: "Japan"
    poem: |
      Taira no Kiyomori ruled Japan without the title —
      the emperor reigned, the cloistered emperor schemed,
      and Kiyomori — the samurai who'd risen by the sword —
      held the real power from his mansion at Fukuhara.
      I visited his court —
      silk, poetry, the old Heian elegance,
      but with armed men at every door —
      and Kiyomori was already overreaching:
      marrying his daughter to the emperor,
      putting his grandson on the throne,
      exiling his enemies, taxing everyone.
      The samurai age was dawning —
      government by the sword, behind a screen of ceremony —
      and the Minamoto, his great rivals,
      were sharpening theirs in the east.
      Seven years of peace left.
      Then the Genpei War,
      and the Taira would drown with a boy emperor
      in the straits of Dan-no-ura.
    description: "Taira no Kiyomori rules Japan from behind the throne — the samurai age dawns in silk and ceremony, with the Minamoto sharpening their swords in the east."
    status: "published"
    sha256: "3a1130a84cc27ca8ade0c2a4b54ae841dc7e3eb58a1a2cfb1520402b9ccaf838"
  - number: "1984"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Philip Augustus Crowned"
    date: "1180 CE"
    region: "France"
    poem: |
      He was fifteen —
      Philip, son of Louis VII,
      crowned at Reims while his father still lived,
      a boy king with a sickly reputation
      and eyes that missed nothing.
      I watched the coronation —
      the holy oil, the great lords, the boy standing straight —
      and nobody there guessed:
      this was the king who would humble kings.
      Philip Augustus.
      He would take Normandy from the English,
      crush the greatest coalition Europe had seen at Bouvines,
      triple the royal domain,
      and make France — France.
      Fifteen years old, crowned in November,
      and the Plantagenet empire didn't know it yet,
      but its doom had just been anointed
      with the sacred oil of Reims.
    description: "Fifteen-year-old Philip II is crowned at Reims — the boy king who will take Normandy, win Bouvines, and make France, the Plantagenets' doom freshly anointed."
    status: "published"
    sha256: "a9aa6ff595d4b08e6cb6372bd7b918d154cc4cb629fbdbb30b9343e76ebe6ebb"
  - number: "1985"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Genpei Storm Gathers"
    date: "1182 CE"
    region: "Japan"
    poem: |
      The swords were being sharpened —
      in the east, Minamoto no Yoritomo,
      in exile, building his network;
      in the west, the Taira, drunk on power,
      Kiyomori dead but his clan still ruling;
      and in the middle, the boy emperor,
      a pawn in armor.
      I traveled the roads that year
      and every inn was full of ronin —
      masterless samurai, selling their swords,
      waiting for the war everyone could smell coming.
      The Genpei War: five years,
      clan against clan, samurai against samurai,
      the most romanticized war in Japanese history —
      the battles, the duels, the loyalties,
      the boy emperor drowning at Dan-no-ura
      with his grandmother holding him.
      In 1182 it was just tension —
      armies gathering in the mist,
      like weather before a typhoon.
    description: "Minamoto and Taira sharpen their swords — the Genpei storm gathers, ronin crowding the inns, five years of clan war brewing like weather before a typhoon."
    status: "published"
    sha256: "2b96f0f6b826384e611ce36f830f644f19165d8ca249b9172b242c4c20a41084"
  - number: "1986"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The New Jerusalem"
    date: "1184 CE"
    region: "Ethiopia"
    poem: |
      King Lalibela had a dream —
      or a vision, the priests say —
      and he set out to build a new Jerusalem in the highlands of Lasta:
      eleven churches, carved down into living rock,
      not built up, but cut down,
      roofs at ground level, the whole church
      excavated from the stone like sculpture.
      I stood at Bete Giyorgis — St. George's —
      a perfect cross cut forty feet into the rock,
      and the workmen were still at it,
      the chips flying, the chanting going on below.
      When the Muslims held old Jerusalem,
      Lalibela reasoned, Ethiopian Christians needed their own —
      so he carved one, church by church, out of the mountain.
      Faith, expressed in negative space:
      the building is what's left
      after you remove everything that isn't church.
    description: "King Lalibela begins carving eleven churches from living rock at Roha — a new Jerusalem for Ethiopian Christians, faith expressed in negative space, cut down into the mountain."
    status: "published"
    sha256: "44d4d28138e20997b02764ec01d624a6637ea76cf068b8579c57cabf7debfdfc"
  - number: "1987"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Dan-no-ura"
    date: "1185 CE"
    region: "Japan"
    poem: |
      The straits ran red —
      Dan-no-ura, the naval battle that ended the Genpei War:
      Minamoto ships against Taira ships,
      archers in the rigging, swords on the decks,
      and the tide — the Minamoto knew the tides,
      the Taira didn't, and that was the battle.
      I watched from a hillside as the Taira line broke —
      and then the thing no chronicle can make untrue:
      the emperor's grandmother took the boy emperor,
      Antoku, eight years old,
      in her arms, and stepped into the sea.
      The Taira drowned with their emperor.
      The Minamoto stood alone.
      Eight hundred years of samurai government —
      the shogunate, the whole warrior age of Japan —
      started with a grandmother and a child
      walking into the water.
    description: "At Dan-no-ura the Minamoto destroy the Taira fleet — and the boy emperor drowns in his grandmother's arms, ending the Genpei War and beginning Japan's warrior age."
    status: "published"
    sha256: "2720f50d83244ede15c2da78a404d0205372f8d4c17758db05b1be832b96911a"
  - number: "1988"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Hattin"
    date: "1187 CE"
    region: "Holy Land"
    poem: |
      The Horns of Hattin —
      a double hill in the Galilee heat,
      and Guy of Lusignan marched his army into Saladin's trap:
      cut off from water, harried by horse-archers,
      the wells of Hattin just out of reach,
      men dying of thirst in their armor.
      I was with the baggage train when the line broke —
      the True Cross captured, the knights ridden down,
      the king himself taken,
      and Saladin — courteous, cold —
      had Reynald of Chatillon beheaded before his eyes
      and sent the king water with his own hands.
      Within months Jerusalem fell.
      Eighty-eight years of the crusader kingdom,
      ended in one July afternoon of thirst and pride.
      The pope died of the news, they say.
      Europe reached for its swords.
    description: "Saladin destroys the crusader army at the Horns of Hattin — the True Cross captured, the king taken — and Jerusalem falls within months, ending eighty-eight years of the kingdom."
    status: "published"
    sha256: "c61ccf8b7349f592b985d648fbcbd32da6d8920417564fdfe640c110a7ebc4d1"
  - number: "1989"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Third Crusade"
    date: "1189 CE"
    region: "Europe"
    poem: |
      They took the cross —
      Richard of England, the Lionheart,
      Philip of France, the boy king grown canny,
      and old Barbarossa, the German emperor,
      with the greatest army Europe had ever sent east.
      I watched them sail from Marseille and Genoa —
      fleets of ships, the flower of chivalry,
      banners, trumpets, the whole shining terrible pageant —
      off to win back Jerusalem.
      It was the crusade of kings,
      and it had everything except success:
      Barbarossa would drown in a river,
      Philip would quarrel and go home,
      Richard would win every battle and lose the war —
      and Jerusalem would stay Muslim.
      But the songs —
      the songs of Richard and Saladin,
      the lion and the sultan,
      are sung to this day.
    description: "Richard the Lionheart and Philip Augustus take the cross and sail for the Holy Land — the crusade of kings, glorious in song, that wins every battle and loses the war."
    status: "published"
    sha256: "365819c033cd09c0e1da0180628abaad09dfe8aa2f021d8f6c73b059a6fb03b6"
  - number: "1990"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Emperor Drowns"
    date: "1190 CE"
    region: "Holy Land"
    poem: |
      The Saleph River, in Cilicia —
      snowmelt, fast, cold —
      and Frederick Barbarossa, seventy years old,
      the greatest emperor of the age,
      rode in to cool off, or to cross, the stories differ —
      and the current took him.
      I was with the rearguard when the news came up the column:
      the emperor is dead, drowned,
      and the greatest army of the Third Crusade
      came apart like wet parchment —
      most of them turning home,
      a remnant marching on to Acre under his son,
      who died of fever on the way.
      The Germans said Barbarossa wasn't dead, only sleeping —
      in the Kyffhauser mountain, beard growing through the table,
      waiting for Germany's hour.
      He's still waiting.
      The crusade went on without him,
      a head shorter.
    description: "Barbarossa drowns in the Saleph River — the Third Crusade's greatest army dissolves, and legend sets the emperor sleeping in his mountain, beard growing through the table."
    status: "published"
    sha256: "af5760234bbf3ef871bb203bddf53b819de1082b6d33cb890e27269c7be8ebc5"
  - number: "1991"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Acre Retaken"
    date: "1191 CE"
    region: "Holy Land"
    poem: |
      Two years.
      That's how long the siege of Acre lasted —
      two years of the crusaders besieging the city
      while Saladin besieged the crusaders,
      a double ring of hunger and dying,
      kings arriving, queens dying of plague in the camps.
      I walked those camps —
      the stench, the flies, the endless building of siege towers
      that the defenders burned, again and again —
      until Richard arrived, and the end came fast:
      the garrison surrendered, the city opened,
      the great port was Frankish again.
      Richard's great prize.
      Then he had the prisoners massacred —
      two thousand seven hundred of them, on the plain outside —
      when the ransom stalled.
      The chronicles argue about it still.
      The plain outside Acre doesn't argue.
      It remembers.
    description: "After a two-year double siege, Richard retakes Acre — the crusaders' great prize — then massacres the prisoners when the ransom stalls, a stain the plain remembers."
    status: "published"
    sha256: "6df1330adb1394986956d89f9d8179cddabc1c63e94974aa4aa9af6fb216cb0c"
  - number: "1992"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The First Shogun"
    date: "1192 CE"
    region: "Japan"
    poem: |
      Yoritomo took the title —
      Sei-i Taishogun, barbarian-subduing great general —
      and set up his government at Kamakura,
      far from the Kyoto court and its silken intrigues:
      a warrior government, for warriors,
      run from a tent-city turned capital.
      I visited Kamakura in those first years —
      all mud and new timber, the shogun's headquarters
      buzzing with vassals, petitions, judgments —
      and the emperor in Kyoto still reigned,
      still performed the ceremonies,
      while the real power sat in the east with a sword.
      It would last seven hundred years:
      shoguns ruling, emperors reigning,
      Japan governed by the military
      until the modern age pried it open.
      The first shogun.
      The longest military government in history.
    description: "Minamoto no Yoritomo becomes shogun at Kamakura — Japan's warrior government begins, emperors reigning while shoguns rule, for seven hundred years."
    status: "published"
    sha256: "25cbe17fa271112769c0858f1401a791333b92d87631b32b125aedeee43eba06"
  - number: "1993"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Truce of Jaffa"
    date: "1192 CE"
    region: "Holy Land"
    poem: |
      They never met —
      Richard and Saladin, the lion and the sultan,
      the two most famous enemies of the age —
      but they negotiated like men who respected each other:
      letters, envoys, gifts of horses and falcons,
      Richard even offering his sister's hand
      to Saladin's brother (it came to nothing).
      I was at Jaffa when the truce was sealed:
      three years, the coast stays Frankish,
      Jerusalem stays Muslim,
      pilgrims may visit the holy places unarmed.
      Richard sailed home — to shipwreck, capture, ransom —
      and Saladin died within the year.
      The Third Crusade ended not with triumph
      but with a handshake across the lines:
      Jerusalem lost, honor kept,
      and two legends who never once stood face to face.
    description: "Richard and Saladin make peace at Jaffa — the coast stays Frankish, Jerusalem stays Muslim — the crusade of kings ending in a handshake between legends who never met."
    status: "published"
    sha256: "54ab3b945e2b2211805e0687d3d8df15ce58375dc35f64b8bf37ae0ed1c7f472"
  - number: "1994"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Death of Saladin"
    date: "1193 CE"
    region: "Syria"
    poem: |
      He died at Damascus, of a fever —
      fifty-five years old, worn out by war and rule —
      and they opened his treasury to pay for his funeral
      and found almost nothing:
      one gold piece, forty pieces of silver.
      Saladin — who had held Egypt and Syria,
      who had taken Jerusalem, faced Richard, been the terror of the Franks —
      died poor, because he'd given it all away.
      I stood in the funeral procession through Damascus —
      Muslims, Christians, Jews, all of them mourning,
      even the Franks across the lines honoring him —
      and his empire divided among his kin
      before the body was cold:
      sons, brothers, nephews, carving it up.
      The man was greater than the realm.
      The realm knew it, and wept anyway.
    description: "Saladin dies at Damascus — his treasury holds one gold piece, his funeral is mourned by three faiths, and his empire divides among his kin before the body is cold."
    status: "published"
    sha256: "ef8f1ad23d81d8ec4a57dba757d3e977119b0e34032c0d575a66c25d52e48bde"
  - number: "1995"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Cahokia at Its Peak"
    date: "1200 CE"
    region: "North America"
    poem: |
      Twenty thousand souls —
      maybe more —
      Cahokia at its height, the greatest city north of Mexico:
      Monk's Mound at the center, the great plaza,
      the woodhenge circles tracking the sun,
      neighborhoods stretching to the horizon,
      the Mississippi below, fat with trade.
      I climbed the mound at midsummer —
      the chunkey games in the plazas,
      the smell of cooking fires, the river traffic,
      a city with no stone, no wheel, no writing,
      running on earth and ceremony and corn —
      bigger than London, bigger than Paris would be for a century.
      And then — within two hundred years —
      it emptied.
      Nobody knows why. The mounds don't say.
      I stood on Monk's Mound at the peak,
      and the whole valley breathed below me,
      and none of us knew it wouldn't last.
    description: "Cahokia holds perhaps twenty thousand souls — the greatest city north of Mexico, mounds and plazas and sun-circles on the Mississippi — at a peak nobody knows won't last."
    status: "published"
    sha256: "3f8b7c571bdab12177421716867b3a95b01cdaa742103bee917afe048c73a470"
  - number: "1996"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Fourth Crusade"
    date: "1202 CE"
    region: "Europe"
    poem: |
      They took the cross —
      the flower of French chivalry, counts and knights —
      and then they made a deal with Venice:
      ships for the whole army, on credit.
      I was in Venice when the bill came due —
      the crusaders couldn't pay,
      and old blind Doge Dandolo, ninety years old,
      made them an offer:
      take Zara for us — a Christian city, mind —
      and we'll talk about the ships.
      They did it. Zara fell.
      Then the exiled Byzantine prince showed up
      with his promises of gold and reunion —
      and the crusade turned east, toward Constantinople.
      A crusade to free the Holy Land
      ended up sacking the greatest Christian city on earth.
      Venice got its money's worth.
      God, I suspect, got other plans.
    description: "Crusaders take the cross, can't pay Venice for ships, and the blind doge turns their swords toward Christians — the crusade for Jerusalem becomes the road to Constantinople."
    status: "published"
    sha256: "76baee450d228dc0a45722b08d456899c57963fa39bb4028267c3a5d8f17a4d6"
  - number: "1997"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Sack of the Queen of Cities"
    date: "1204 CE"
    region: "Constantinople"
    poem: |
      Three days.
      For three days the crusaders looted Constantinople —
      the Queen of Cities, the richest city in Christendom —
      churches stripped, palaces emptied,
      the bronze horses of the Hippodrome shipped to Venice,
      nuns raped on the altars, the libraries burned for the parchment's... no,
      they just burned.
      I walked the streets on the third day —
      the smoke, the drunks, the weeping Greeks,
      a thousand years of accumulated glory
      being hauled onto Venetian ships.
      Byzantium shattered: the empire broke into pieces —
      Nicaea, Trebizond, Epirus —
      and though the Greeks would take the city back in fifty years,
      it never recovered.
      The Fourth Crusade's great achievement:
      it destroyed the very civilization
      it had been called to save.
    description: "Crusaders storm Constantinople and loot it for three days — the Queen of Cities stripped, Byzantium shattered into pieces, the crusade destroying what it was called to save."
    status: "published"
    sha256: "cc22770e00107d9905651c44a567b2d9f1d2a361da462afc982640f3dd3b82ec"
  - number: "1998"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Slave Dynasty"
    date: "1206 CE"
    region: "India"
    poem: |
      Qutb al-Din Aibak had been a slave —
      bought, trained, risen through the Ghori armies
      by sheer competence —
      and when his master died, the slave took the throne:
      the first sultan of Delhi,
      founder of the Slave Dynasty.
      I watched him lay the first courses of the Qutb Minar —
      the victory tower, two hundred and forty feet of carved red sandstone,
      rising over the new capital —
      a slave's monument to his own unlikely crown.
      The mamluk pattern: the slave-soldier,
      bought as a boy, forged into a warrior,
      rising past free men to rule.
      It would work in Delhi for a century,
      in Egypt for two and a half —
      the strangest aristocracy in history:
      men who'd been property, wearing crowns.
    description: "The ex-slave Qutb al-Din Aibak founds the Delhi Sultanate and begins the Qutb Minar — property become king, the first of history's strangest aristocracy."
    status: "published"
    sha256: "108bf28699f1b4330b1a5845d8d57ed6e502589add74a049a269777b8050c0bf"
  - number: "1999"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Albigensian Crusade"
    date: "1209 CE"
    region: "France"
    poem: |
      Pope Innocent III had had enough of the Cathars —
      the heretics of Languedoc, with their two gods,
      their perfecti, their rejection of the church's wealth —
      so he called a crusade:
      not against Muslims, but against Christians,
      in the south of France.
      I rode with the northern army to Beziers —
      and when the city fell, the legate was asked
      how to tell heretic from faithful,
      and gave the answer that stains the century:
      "Kill them all. God will know his own."
      Twenty thousand dead at Beziers, they say.
      Twenty years of war followed —
      the burning of the perfecti, the fall of Montsegur —
      and the south of France, its troubadours, its tolerance,
      was ground under the northern heel.
      A crusade against one's neighbors.
      Christendom, eating itself.
    description: "Innocent III turns crusade against the Cathars of southern France — \"Kill them all, God will know his own\" — twenty years of war grinding the Languedoc under the northern heel."
    status: "published"
    sha256: "554e7a26a1dd95a85875146db188384cc7bffc8472613155de4d7ef0031987f6"
  - number: "2000"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Las Navas de Tolosa"
    date: "1212 CE"
    region: "Spain"
    poem: |
      The kings came together for once —
      Castile, Aragon, Navarre, Portugal,
      with crusaders from France —
      and met the Almohad host at Las Navas de Tolosa,
      in the passes of the Sierra Morena.
      I stood on the ridge and watched the Christian charge break through —
      the Almohad caliph's tent, his bodyguard of chained-together Africans,
      the whole great army coming apart in the July heat —
      and when it was over, the power of Muslim Spain was broken for good.
      The Reconquista's turning point.
      After Las Navas, it was only a matter of time:
      Cordoba in twenty-four years, Seville in thirty-six,
      the long slow Christian tide
      washing down to the sea.
      One battle, in a mountain pass,
      and eight centuries of Spanish history
      turned on it.
    description: "Christian kings smash the Almohads at Las Navas de Tolosa — the Reconquista's turning point, after which Muslim Spain's fall becomes only a matter of time."
    status: "published"
    sha256: "8276d263a7111d07b19631f2ab61728595f114cba5e8c3d3d48d37a416c4065f"
  - number: "2001"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Children's Crusade"
    date: "1212 CE"
    region: "Europe"
    poem: |
      They were children —
      thousands of them, following a shepherd boy named Stephen
      in France, a boy named Nicholas in Germany —
      convinced that God would part the sea for their innocence
      as he'd parted it for no army.
      I watched the French column pass through a village —
      barefoot, singing, the little ones riding on the older ones' shoulders,
      their parents weeping at the roadside, unable to stop them.
      Most never came home.
      The French children reached Marseille and waited for the sea to part;
      it didn't, and merchants offered ships —
      and sold them, the chronicles say, into slavery.
      The Germans died crossing the Alps.
      The Children's Crusade: faith at its purest,
      and its most helpless —
      and the sea, inconsiderate, stayed closed.
    description: "Thousands of children march for the Holy Land behind shepherd boys — most never come home; the sea doesn't part, and the innocent learn what the age does with innocence."
    status: "published"
    sha256: "f0847ae1cd35556043cb5f8b7fe9d5563711eb33cdb0804af0233ed21e9c127a"
  - number: "2002"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Magna Carta"
    date: "1215 CE"
    region: "England"
    poem: |
      Runnymede, June —
      a meadow by the Thames, and King John,
      cornered, hated, beaten by the French and his own barons both —
      sealing the Great Charter.
      I stood in the crowd of barons' men and watched him press his seal:
      sixty-three clauses, most of them about feudal dues and fish weirs —
      but buried in the Latin, the sentences that would outlive them all:
      no free man shall be seized or imprisoned except by lawful judgment.
      Due process. The rule of law.
      John repudiated it within weeks — got the pope to annul it —
      and died the next year, and the charter was reissued, and reissued,
      and grew.
      A failed peace treaty between a bad king and angry barons —
      that became the foundation stone of liberty
      in the English-speaking world.
    description: "At Runnymede, barons force John to seal the Great Charter — sixty-three clauses hiding the sentences that become the foundation of liberty: no imprisonment without lawful judgment."
    status: "published"
    sha256: "0ce03b871291e7ff8710d417214656a127d5ca3f37c9ca0564400dbdaece9dbd"
  - number: "2003"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Fifth Crusade"
    date: "1217 CE"
    region: "Egypt"
    poem: |
      They'd learned the lesson, sort of —
      Jerusalem couldn't be taken from the sea-coast;
      Egypt was the key, the Nile the road —
      so the Fifth Crusade sailed for Damietta,
      and took it, after a grinding siege.
      I was in the camp when the sultan offered them everything:
      Jerusalem, the True Cross, the whole kingdom back —
      for Damietta.
      And the legate said no.
      Pride. Papal pride.
      So they marched on Cairo instead —
      and the Nile rose, as the Nile does,
      and trapped them in the floodplain,
      and they surrendered Damietta to get out alive.
      The Fifth Crusade: offered Jerusalem for free,
      and chose the flood instead.
      The legate's pride, paid for in drowned men
      and one more empty crusade.
    description: "Crusaders take Damietta, refuse the sultan's offer of Jerusalem itself, march on Cairo instead — and the Nile rises and traps them; they surrender everything to get out alive."
    status: "published"
    sha256: "fc8c73cde79510cc48f0588328699cfb91e972e1dcedf80decd7e6f2914c0a26"
  - number: "2004"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Mongol Storm Breaks"
    date: "1219 CE"
    region: "Central Asia"
    poem: |
      The Shah of Khwarezm made the mistake —
      seized a Mongol trade caravan, executed the envoys —
      and Genghis Khan, who'd have taken the trade deal,
      took the war instead.
      I rode with the Mongol tumens into Transoxiana —
      a hundred thousand horsemen, moving like weather —
      and watched Bukhara fall, then Samarkand:
      the great Silk Road cities, the libraries, the observatories,
      emptied.
      The chronicles say the Mongols killed everyone;
      the chronicles exaggerate, but not enough.
      Cities vanished from the map —
      Merv, Nishapur, Herat —
      their populations put to the sword
      as policy, as terror, as arithmetic.
      The Khwarezmian empire: erased in two years.
      The Mongol storm, broken over the world —
      and it had only just begun.
    description: "Genghis Khan's armies shatter the Khwarezmian empire — Bukhara, Samarkand, Merv fall, cities vanish from the map, and the Mongol storm breaks over the world."
    status: "published"
    sha256: "f49451fad4532ccb25cc767c5cd4b3f2e8ded856713cc53fe70496633b6da018"
  - number: "2005"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Karakorum Founded"
    date: "1220 CE"
    region: "Mongolia"
    poem: |
      In the Orkhon valley, where the rivers run,
      Genghis Khan ordered his capital built —
      Karakorum, the black gravel:
      not tents, but walls; not a camp, but a city.
      I walked its first streets —
      a strange, polyglot place from the start:
      Chinese artisans, Muslim merchants, Nestorian priests,
      the Khan's palace with its great silver fountain
      shaped like a tree, pouring wine and mare's milk.
      The Mongols were nomads ruling the world,
      and Karakorum was their concession to permanence:
      a fixed point on the steppe,
      where the empire's roads met
      and the world's tribute flowed in.
      It would never be large.
      It didn't need to be.
      The empire was the city;
      Karakorum was just its tent-peg.
    description: "Genghis Khan founds Karakorum on the steppe — walls instead of tents, a polyglot capital of artisans, merchants, and priests where the empire's roads meet."
    status: "published"
    sha256: "f23b48013223ccbe9879842855a16dc277bab9e9f25e4f15d23e3bf809045d54"
  - number: "2006"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Lalibela's Churches Stand"
    date: "1221 CE"
    region: "Ethiopia"
    poem: |
      The last of the eleven was finished —
      forty years of cutting, the chips flying,
      the chanting going on below ground level —
      and Lalibela's new Jerusalem stood complete:
      eleven churches, carved from living rock,
      joined by tunnels and courtyards,
      a whole holy city excavated from a mountainside.
      I walked the dark passage between Bete Maryam and Bete Golgotha —
      the pilgrims' tunnel, worn smooth by centuries of knees not yet come —
      and came up into the light at the next church,
      blinking, like being reborn.
      They say angels helped at night,
      finishing what the workmen started by day.
      I don't know about angels.
      I know the stone is cut true,
      and the churches are still standing,
      eight hundred years later,
      still full of priests and pilgrims and candle-smoke.
    description: "The last of Lalibela's eleven rock-hewn churches is finished — forty years of cutting complete, a holy city excavated from the mountain, still standing eight centuries on."
    status: "published"
    sha256: "571d2ffb2425b996fef87a0577bad448e8414d52a2e95272e9aa1c6620d3d43b"
  - number: "2007"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Lion King Rises"
    date: "1225 CE"
    region: "Mali"
    poem: |
      They called him the Lion King —
      Sundiata Keita, son of a Malinke chief,
      crippled as a boy, mocked, exiled —
      and the griots still sing how he rose:
      stood up from his lameness, they say,
      by sheer will, and began gathering the clans.
      I heard the epic sung in a village that year —
      the hunter's songs, the prophecies,
      the boy who would break the sorcerer-king —
      and the clans were listening.
      Soumaoro Kante held the land then,
      the sorcerer-king of Sosso, cruel and feared —
      and Sundiata was building the alliance
      that would break him at Kirina.
      Mali's founding epic, starting here:
      not with a battle, but with a gathering —
      a lame boy, a prophecy,
      and chiefs one by one bending the knee.
    description: "The exiled Sundiata Keita begins gathering the Malinke clans — the Lion King's rise, Mali's founding epic, starting not with battle but with chiefs bending the knee one by one."
    status: "published"
    sha256: "c7765a6b21a55e60ade679dfe8f6c892f828b4c386d190a86ebe52352f48e16f"
  - number: "2008"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Death of Genghis Khan"
    date: "1227 CE"
    region: "Mongolia"
    poem: |
      He died on campaign —
      against the Tanguts, in the west,
      of wounds or sickness, the accounts differ,
      and the Mongols hid it:
      the funeral cortege killing everyone it met,
      so no one would know where the Khan was buried —
      and no one does, to this day.
      I rode in the shadow of that secret column —
      the empire holding its breath —
      and when the news broke, the empire split
      the way he'd ordered it split:
      four sons, four khanates,
      the greatest land empire in history
      divided like a inheritance.
      Jochi's line to the west, Chagatai in the middle,
      Ogedei the Great Khan, Tolui's sons waiting.
      He'd conquered from Korea to Hungary.
      His sons would quarrel over the pieces
      for the next hundred years.
    description: "Genghis Khan dies on campaign and is buried in secret — his empire splits among his sons into four khanates, the greatest land empire in history divided like an inheritance."
    status: "published"
    sha256: "ccdf56f9704d153004d2f7e83232a0b46812f4daf2b4dc897b0042f6310d0a22"
  - number: "2009"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Frederick's Crusade"
    date: "1228 CE"
    region: "Italy"
    poem: |
      Frederick II was excommunicated —
      twice, actually —
      and he went on crusade anyway,
      because the pope telling him not to
      was reason enough.
      I sailed with his fleet —
      the Stupor Mundi, the Wonder of the World,
      the emperor who spoke six languages
      and kept a harem and corresponded with Muslim scholars —
      and what he did in the Holy Land
      no crusader had done before:
      he negotiated.
      With al-Kamil, the sultan of Egypt —
      a treaty, not a battle:
      Jerusalem, Bethlehem, Nazareth,
      returned to Christian hands for ten years,
      the Muslims keeping the Temple Mount.
      He crowned himself in the Holy Sepulchre —
      no priest would do it, excommunicate and all —
      and sailed home.
      The pope was furious.
      Jerusalem was Christian.
      Diplomacy: the crusade that worked.
    description: "The excommunicated Frederick II sails east and wins Jerusalem back by treaty, not battle — crowning himself in the Holy Sepulchre, the crusade that worked through diplomacy."
    status: "published"
    sha256: "d3e7d5374425abb9773c7f206056f22fa7875dbdaa3b6fcc37d5a159ceaffb07"
  - number: "2010"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Castile and Leon United"
    date: "1230 CE"
    region: "Spain"
    poem: |
      Ferdinand III took both crowns —
      Castile from his mother, Leon from his father,
      and this time the union stuck:
      one king, one realm, one direction —
      south.
      I was at his court in those early years —
      a young king, pious, tireless,
      with the Reconquista's engine finally assembled:
      the two great Christian kingdoms,
      their knights, their orders, their money,
      all pointed at Muslim Spain.
      Within six years he'd take Cordoba.
      Within eighteen, Seville.
      Ferdinand the Saint, they'd call him —
      and he earned it the hard way,
      campaign after campaign,
      until only Granada was left,
      a small bright ember of al-Andalus
      in the far south.
    description: "Ferdinand III joins Castile and Leon for good — the Reconquista's engine assembled, one king pointed south, and within eighteen years only Granada will remain."
    status: "published"
    sha256: "0ab7a46cc288edcd05d4bf3edf2966d4c2693dc88ff0b40cac22e66a5c34efb6"
  - number: "2011"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Samurai Law Code"
    date: "1232 CE"
    region: "Japan"
    poem: |
      The shogunate needed laws —
      not the court's elegant Heian codes,
      but law for the warrior age:
      land disputes, vassal duties, what happens
      when a samurai kills a samurai.
      I was at Kamakura when the Goseibai Shikimoku was proclaimed —
      fifty-one articles, plain language,
      the first warrior law code in Japanese history —
      and the shogun's judges read them aloud
      to the assembled vassals.
      It was practical stuff:
      inheritance, debts, the duties of stewards,
      punishments fitted to rank —
      the operating system of feudal Japan,
      running for the next seven hundred years.
      The sword had conquered.
      Now the brush organized the conquest —
      and Japan's warrior government got its rulebook.
    description: "The Kamakura shogunate issues the Goseibai Shikimoku — fifty-one articles of warrior law, the operating system of feudal Japan for seven hundred years."
    status: "published"
    sha256: "09325b83ca1be6a3139f0f861204c1dbee553220764b6275b3d2dca48abf2d2c"
  - number: "2012"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Kirina"
    date: "1235 CE"
    region: "Mali"
    poem: |
      The sorcerer-king against the Lion King —
      Soumaoro Kante of Sosso, with his magic and his terror,
      against Sundiata Keita, with his alliance of the clans —
      and they met at Kirina.
      I watched from the hills as the Malinke line held —
      Sundiata's hunters and horsemen,
      against Soumaoro's dread —
      and when the sorcerer-king broke and fled,
      the thing he'd built broke with him.
      The Mali Empire was born that day —
      the griots date everything from Kirina —
      and Sundiata, the lame boy, the exile,
      became Mansa, king of kings,
      ruler of the gold lands, the Niger trade,
      the greatest empire West Africa had ever seen.
      One battle. One morning.
      The Lion King's epic, fulfilled.
    description: "Sundiata crushes the sorcerer-king Soumaoro at Kirina — the Mali Empire is born, the lame boy become Mansa, ruler of the gold lands and the Niger trade."
    status: "published"
    sha256: "5ba22792b6de70b8ebc1836a3ebe5b136af620676e139812b4639758ed15ca1b"
  - number: "2013"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Córdoba Retaken"
    date: "1236 CE"
    region: "Spain"
    poem: |
      Ferdinand took Cordoba in June —
      the city of the caliphs, the Great Mosque,
      the libraries, the streetlights —
      after five centuries of Muslim rule,
      and he walked into the mosque
      and had it consecrated as a cathedral.
      I was there that summer —
      the forest of columns, the mihrab,
      the Christian altar being raised
      in the most beautiful mosque on earth —
      and the symbolism was the point:
      the Reconquista, made stone.
      Cordoba the Victorious, they called it now.
      The taifa kings watched from their shrinking courts
      and understood:
      the tide had turned for good,
      and Ferdinand wasn't stopping.
      Seville was next.
      Then the long wait for Granada.
    description: "Ferdinand III takes Córdoba — the Great Mosque becomes a cathedral, five centuries of Muslim rule ending in the city of the caliphs, the Reconquista made stone."
    status: "published"
    sha256: "995a41bc82ff0fc5ff44e78def1d9a238f1c06c26c66f0e7b203e0195f0ddb0d"
  - number: "2014"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Mongols Come West"
    date: "1237 CE"
    region: "Russia"
    poem: |
      Batu's horsemen came out of the east —
      the Golden Horde, the western arm of the Mongol empire —
      and Ryazan was first:
      five days of siege, then the storm,
      then the chronicles' terrible sentence:
      there was none left to weep for the dead.
      I rode through Ryazan the week after —
      the smoke still rising, the streets empty,
      a whole city, gone —
      and the other Russian princes were already quarreling
      about who'd help whom, which is to say, no one.
      The long Tartar night was beginning for Russia:
      two hundred and fifty years of the yoke,
      the tribute, the khans' Baskaks in every town.
      It started at Ryazan,
      in the winter of 1237,
      with no one left to weep.
    description: "Batu's horsemen burn Ryazan — \"none left to weep for the dead\" — and the long Tartar night begins for Russia: two and a half centuries of the Mongol yoke."
    status: "published"
    sha256: "0b095affcb0712c9123c01fe50eae3d055fa67cd35065592a7e8b54e72fa7a6d"
  - number: "2015"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Kiev Falls"
    date: "1240 CE"
    region: "Russia"
    poem: |
      Kiev — the mother of Russian cities,
      the golden domes, the caves monastery,
      two hundred years of Rus' glory —
      fell in December.
      I was outside the walls when the siege towers came up —
      the Mongol engines battering day and night,
      the defenders fighting street by street,
      the last of them dying in the Church of the Tithes
      when the walls came down on their heads.
      The chronicles say the Mongols killed everyone;
      the city never recovered its greatness —
      the center of Rus' moved north, to Vladimir, to Moscow,
      and Kiev became a memory of itself.
      The Rus' lands bowed to the Golden Horde:
      princes traveling to Sarai for the khan's patent,
      tribute flowing east,
      and Russia's long schooling in autocracy —
      learned, in part, from the khans.
    description: "The Mongols storm Kiev — the mother of Russian cities falls, the center of Rus' moves north, and the lands bow to the Golden Horde for two centuries."
    status: "published"
    sha256: "bdadb34e1fcee213c7aa5fb4bc3e86c047f6fcdb7e421e2fd079b297d2d9926e"
  - number: "2016"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Mongols Turn Back"
    date: "1241 CE"
    region: "Europe"
    poem: |
      They were at the gates —
      the Mongols, past Kiev, past Hungary,
      their scouts probing toward Vienna,
      Europe lying open before them like a map —
      and then the news came from Karakorum:
      Ogedei Khan was dead.
      And Mongol law was iron:
      the princes must return for the kurultai,
      the election of the new Khan.
      I watched the tumens wheel away from Hungary —
      the greatest anticlimax in European history —
      turning east, leaving the burning villages behind,
      because a man had died five thousand miles away.
      Europe, spared by a death.
      The chroniclers called it a miracle.
      It was politics — steppe politics —
      but the result was the same:
      the Mongol tide turned back at the edge of Europe,
      and never came again.
    description: "Ogedei Khan dies, and the Mongol armies wheel away from Hungary's edge for the kurultai — Europe spared by a death five thousand miles away, the tide that never returns."
    status: "published"
    sha256: "f98c39c96f2387a7e55257b7ff86ec721909aa6c38fc42d692f836b12c49e479"
  - number: "2017"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Battle on the Ice"
    date: "1242 CE"
    region: "Russia"
    poem: |
      Lake Peipus, April —
      the ice still holding, barely,
      and Alexander Nevsky's Russians met the Teutonic Knights:
      the German crusaders, pushing east,
      the Drang nach Osten in armor —
      and the ice became the battlefield.
      I watched from the shore as the Russian wings closed —
      the knights' wedge broken, the heavy cavalry floundering,
      men and horses going through the ice in their mail —
      and the Livonian crusade died that afternoon
      on a frozen lake.
      Nevsky became the hero of Russia —
      the prince who turned back the west,
      while bowing, pragmatically, to the Mongol east.
      Seven hundred years later they'd name an order after him,
      and Eisenstein would film the battle
      with the ice cracking under the knights.
    description: "Alexander Nevsky defeats the Teutonic Knights on the frozen Lake Peipus — the eastward crusade dies on the ice, and Russia gets the hero who bowed to the Mongols and turned back the west."
    status: "published"
    sha256: "1da1cb0d9d7624a33a2d69c854da4bdc3d51594bc5a316bc52c8663d2e392fd2"
  - number: "2018"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Jerusalem Lost for Good"
    date: "1244 CE"
    region: "Holy Land"
    poem: |
      They came out of the wreckage of Khwarezm —
      the Khwarezmian horsemen, refugees of the Mongol storm,
      hired by Egypt, turned loose on the Franks —
      and they took Jerusalem in August:
      sacked it, slaughtered, desecrated,
      the holy places running with blood.
      I walked the streets afterward —
      the worst sack the city had seen in a century,
      and this time there was no recovery:
      the crusaders never held Jerusalem again.
      Frederick's treaty had given it back;
      the Khwarezmians took it away for good.
      The Seventh Crusade would try — Louis the Saint,
      with all his piety and all his army —
      and fail in Egypt.
      Jerusalem, lost.
      The crusading age had one prize,
      and now it was gone forever.
    description: "Khwarezmian horsemen sack Jerusalem — the crusaders never hold it again; the crusading age's one prize, gone forever in a week of blood."
    status: "published"
    sha256: "fd34339c0f5c465ff1dc3864448ee61dc2a0b4e9fd3ab63eb1681201a6030270"
  - number: "2019"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Friar's Embassy"
    date: "1245 CE"
    region: "Mongolia"
    poem: |
      Pope Innocent sent him —
      Friar John of Plano Carpini, sixty-five years old,
      with a letter for the Great Khan:
      stop killing Christians, by the way, consider baptism —
      and John walked.
      I met him on the road east —
      through Russia, through the steppe,
      eating with Mongols, sleeping in felt tents,
      a fat old friar crossing the largest empire on earth
      on foot and horseback —
      and he reached Karakorum,
      saw the new Khan enthroned,
      delivered the pope's letter,
      and got the Khan's reply:
      submit, or be destroyed.
      He brought it home, with the first real account
      of the Mongol empire ever written in the west:
      the Ystoria Mongalorum.
      Europe's first envoy to the Great Khan —
      and the Khan's answer was an ultimatum.
    description: "Friar John of Plano Carpini reaches Karakorum — Europe's first envoy to the Great Khan — and brings home the Khan's reply (submit or be destroyed) and the west's first real account of the Mongols."
    status: "published"
    sha256: "55ca97a59e0ce1e24fd9a528c17f44b353d7005803a5fab4aba71654e2a27eff"
  - number: "2020"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Slave Kings"
    date: "1250 CE"
    region: "Egypt"
    poem: |
      The Mamluks did what slave-soldiers do —
      they killed their master.
      Aybak, Qutuz, the mamluk emirs of Egypt:
      the Ayyubid sultan dead, his son a child,
      and the slave regiments simply... took over.
      I was in Cairo during the coup —
      quick, professional, almost bloodless by the standards —
      and Egypt had a new dynasty:
      the Slave Kings, the Mamluks,
      bought as boys on the steppe,
      forged into the finest cavalry on earth,
      ruling the richest country in the Mediterranean.
      They would rule for two hundred and fifty years —
      stop the Mongols at Ain Jalut,
      finish the crusaders at Acre,
      and run Egypt like a military corporation.
      The strangest dynasty ever:
      kings who'd been property,
      and never let anyone forget
      they'd earned the throne with a sword.
    description: "Mamluk slave-soldiers seize Egypt — the Slave Kings, bought as boys and forged into the finest cavalry on earth, who will stop the Mongols and finish the crusaders."
    status: "published"
    sha256: "60bc77160f9d0e17e44d160ff1f7d15ebfb63690994536c930f284a72c431a74"
  - number: "2021"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Mongke's Census"
    date: "1251 CE"
    region: "Mongolia"
    poem: |
      Mongke Khan wanted to know what he owned —
      so he ordered the empire counted:
      every household, every field, every workshop,
      from China to Persia, from Russia to Korea.
      I traveled with one of the census teams in Persia —
      the clerks with their scrolls, the local headmen sweating,
      every name written down, every tax assessed —
      the Mongol empire, inventoried like Domesday,
      but on a continental scale.
      It was the most ambitious bureaucracy in history:
      an empire of nomads, counting farmers,
      so the tribute would flow precisely,
      predictably, forever.
      The census made the empire legible —
      and taxable —
      and the tax rolls of Mongke's clerks
      would outlast the khans themselves,
      used by every successor state
      that inherited the Mongol machinery.
    description: "Mongke Khan orders the empire counted — every household from China to Persia inventoried, the nomad empire's most ambitious bureaucracy, tax rolls that outlast the khans."
    status: "published"
    sha256: "73ee8ce899a97df03e9be4aaf9f20bfffc0b55fa6eed081654c3dbe4dc6bc4c9"
  - number: "2022"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Sorbonne's Seed"
    date: "1253 CE"
    region: "France"
    poem: |
      Robert de Sorbon was the king's chaplain —
      a commoner's son, risen by brains —
      and he looked at the poor theology students of Paris,
      living in garrets, begging their bread,
      and founded them a college:
      a house, a library, stipends,
      so poor scholars could study divinity
      without starving.
      I visited in the early years —
      a modest building on the Left Bank,
      the students in their black gowns,
      disputing in the hall the way Paris students always have —
      and nobody guessed the name would become
      the university itself:
      the Sorbonne.
      Seven centuries of French intellect,
      starting with one chaplain's charity
      for poor theologians.
    description: "Robert de Sorbon founds his college for poor theology students in Paris — the seed of the Sorbonne, seven centuries of French intellect from one chaplain's charity."
    status: "published"
    sha256: "f30b264937a0a999c4954bebcf365adf03ff6835c89d1b66d5d261442a0a5548"
  - number: "2023"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Traveler Is Born"
    date: "1254 CE"
    region: "Italy"
    poem: |
      In Venice, in a merchant house by the canal,
      a boy was born —
      Marco, son of Niccolo Polo,
      and nobody marked the day.
      I like to think I walked past that house
      without knowing —
      the most famous traveler in history,
      being born unremarked,
      while his father and uncle were away
      in the east, at the Khan's court,
      laying the road the boy would follow.
      Seventeen years later he'd set out after them.
      Twenty-four years after that he'd come home
      with stories no one believed.
      Seven centuries after that, we'd still be reading them.
      But in 1254, in Venice,
      he was just a merchant's son,
      crying in a canal house,
      with the whole of Asia waiting.
    description: "Marco Polo is born in Venice — unremarked, a merchant's son in a canal house, with the whole of Asia waiting seventeen years down the road."
    status: "published"
    sha256: "f6582174e1a300fc8171b1aa992af3de4c0f8be5d65be6b3b7622870413b2e4b"
  - number: "2024"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Mongols Repelled"
    date: "1257 CE"
    region: "Vietnam"
    poem: |
      The Mongols came down through the passes —
      veterans of a hundred victories,
      expecting another province —
      and Dai Viet was ready:
      the Tran kings, the generals, the people,
      the scorched earth, the guerrilla war,
      the rivers they'd known all their lives.
      I watched the Mongol columns struggle south —
      the heat, the disease, the ambushes,
      an empire of horsemen drowning in a green wet country
      that wouldn't stand and fight —
      and they turned back.
      Then they came again — twice more, in later years —
      and the Vietnamese beat them twice more:
      the Bach Dang river, the stakes in the mud,
      the whole fleet destroyed at low tide.
      Three invasions. Three defeats.
      The Mongols conquered everything from Korea to Hungary —
      but not Dai Viet.
    description: "Tran dynasty armies drive the Mongols out of Dai Viet — the first of three repelled invasions; the empire that took Hungary could not take Vietnam."
    status: "published"
    sha256: "817e6d4ee1c0181c2964cfd51bf361080d858bc7280fdcf5f7b8f607e08265b1"
  - number: "2025"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Ain Jalut"
    date: "1260 CE"
    region: "Holy Land"
    poem: |
      The Mongols had never lost a pitched battle —
      not once, in fifty years —
      and then they met the Mamluks at Ain Jalut,
      the Spring of Goliath, in Galilee.
      I stood on the hillside and watched Qutuz work:
      the Mamluk feigned retreat — the Mongols' own trick, turned on them —
      the hidden squadrons closing like a fist —
      and Kitbuqa, the Mongol commander, dying in the trap.
      The high-water mark of the Mongol tide.
      After Ain Jalut, the myth was broken:
      the Mongols could be beaten,
      by slave-soldiers who'd learned their trade
      on the same steppe.
      Syria was saved. Egypt was safe.
      The Mamluks became the shield of Islam —
      and the Mongol empire, for the first time,
      had a frontier it couldn't cross.
    description: "The Mamluks crush the Mongols at Ain Jalut — the first pitched battle the Mongols ever lost, the high-water mark of their tide, broken by slave-soldiers at the Spring of Goliath."
    status: "published"
    sha256: "fa55c447724f2b35c8d74bdc0fb486655db26e617c878bd3725312a9f1c45075"
  - number: "2026"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The City Retaken"
    date: "1261 CE"
    region: "Constantinople"
    poem: |
      It was almost an accident —
      Michael Palaiologos's general, scouting the walls,
      found an unguarded postern, slipped in at night,
      and Constantinople — the Queen of Cities,
      fifty-seven years in Latin hands —
      was Greek again by morning.
      I walked through the Blachernae gate at dawn,
      past the cheering, the weeping,
      Michael entering in triumph a month later,
      the empire restored —
      diminished, broke, a shadow with a crown,
      but restored.
      Byzantium would last another two hundred years:
      the Palaiologan renaissance, the scholars, the art —
      a long, brilliant sunset.
      The Latins were gone.
      The city was Greek.
      And the empire that had been the center of the world
      settled in for its long, luminous decline.
    description: "Michael Palaiologos retakes Constantinople through an unguarded postern — Byzantium restored, diminished, beginning its long luminous two-hundred-year sunset."
    status: "published"
    sha256: "d9af5fe388cec44cf17449c2d01b0de0adf6a6d84702872f40d44cc48011d5bb"
  - number: "2027"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The First Parliament"
    date: "1264 CE"
    region: "England"
    poem: |
      Simon de Montfort was losing —
      the barons' war against Henry III, going badly —
      so he did something desperate and brilliant:
      he summoned a parliament,
      and invited not just the barons and bishops,
      but knights from every shire
      and burgesses from every town.
      I was in Westminster Hall that January —
      commoners, in parliament, for the first time —
      farmers' sons and merchants' sons,
      sitting with earls, advising the realm.
      Montfort died at Evesham within the year —
      hacked down, the pope's legate calling it murder —
      but the idea survived him:
      that the commons had a place in the council of the realm.
      Parliament's first breath.
      It would take centuries to grow into its power —
      but the seed was planted at Westminster,
      in a losing war, by a desperate Frenchman.
    description: "Simon de Montfort summons knights and burgesses to Westminster — Parliament's first breath, commoners in the council of the realm, planted in a losing war by a desperate man."
    status: "published"
    sha256: "48db1659eaebeae0b062597365ff83f9b750a0a2116ea7e897d5b2cf8a70ca7e"
  - number: "2028"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Dante Is Born"
    date: "1265 CE"
    region: "Italy"
    poem: |
      In Florence, in a modest house,
      a boy was born —
      Durante, called Dante,
      son of a moneylender, nobody special —
      and the century turned around him:
      the Guelphs and Ghibellines, the popes and emperors,
      the whole violent flowering of the Italian cities.
      I like to think I passed him in the street as a boy —
      nine years old, they say, when he first saw Beatrice,
      eight years old herself, in a red dress,
      and the whole Comedy turning on that glance.
      Exile, politics, love, hell —
      all of it ahead of him.
      The greatest poem of the Middle Ages,
      the Italian language itself, more or less invented —
      and it started with a moneylender's son in Florence,
      breathing his first,
      in 1265.
    description: "Dante Alighieri is born in Florence — the moneylender's son who will write the Comedy, invent the Italian language, and turn a childhood glance at Beatrice into eternity."
    status: "published"
    sha256: "154bc39213fcf0d40080f94b1c68c06a82adcd5b8549217f87b39b176f250cca"
  - number: "2029"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Baybars Takes Antioch"
    date: "1268 CE"
    region: "Holy Land"
    poem: |
      Baybars didn't take prisoners at Antioch —
      the Mamluk sultan, the Panther, the greatest of the Slave Kings —
      stormed the city that had held out for a hundred and seventy years
      and put it to the sword:
      every man killed, the women and children enslaved,
      the city so ruined it never recovered.
      I walked the ruins the week after —
      Antioch, the queen of the crusader east,
      where the First Crusade had starved and triumphed —
      emptied, smoking, finished.
      Baybars wrote the Prince of Antioch a letter about it,
      absent at the time, mocking him:
      you should have been here, it said, more or less.
      The crusader states were bleeding out —
      castle by castle, city by city —
      and the Panther was just getting started.
    description: "The Mamluk sultan Baybars storms Antioch and destroys it utterly — the queen of the crusader east emptied and smoking, the states bleeding out castle by castle."
    status: "published"
    sha256: "5e31871d9f69ae551ce27ba22f91b930c770aaa8bf83d87d41933bae76e44be1"
  - number: "2030"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Solomonic Restoration"
    date: "1270 CE"
    region: "Ethiopia"
    poem: |
      Yekuno Amlak overthrew the Zagwe —
      the dynasty of Lalibela, the church-builders —
      and claimed the throne of Ethiopia
      for the line of Solomon:
      descended, he said, from the Queen of Sheba
      and the wise king of Israel,
      three thousand years of lineage,
      restored.
      I was at the coronation —
      the priests, the drums, the ancient liturgy in Ge'ez —
      and whether the bloodline was real hardly mattered:
      the story was.
      The Solomonic line would rule Ethiopia
      for seven hundred years —
      the oldest continuous monarchy on earth,
      lasting into the age of airplanes —
      all of it founded on a claim
      that a queen once visited a king
      and came home with a dynasty.
    description: "Yekuno Amlak overthrows the Zagwe and restores Ethiopia's Solomonic line — claiming descent from Sheba and Solomon, founding seven hundred years of continuous monarchy."
    status: "published"
    sha256: "f4c6296bca2b7168c84fb4306c7f6112db6195a723fb7efbeaf785780efd3a43"
  - number: "2031"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Polos Depart"
    date: "1271 CE"
    region: "Venice"
    poem: |
      They set out from Venice that year —
      Niccolo and Maffeo Polo, the merchants,
      and seventeen-year-old Marco with them —
      with the pope's letters and holy oil from Jerusalem,
      bound for the court of Kublai Khan.
      I watched them leave —
      three Venetians, a handful of servants,
      walking into the largest empire on earth,
      and nobody in Venice gave them a thought:
      just merchants, off on another eastern venture.
      They wouldn't be back for twenty-four years.
      Marco would come home with a story
      so vast no one believed it —
      the Khan's court, the paper money, the black stones that burned —
      and a book that would sit on Columbus's shelf,
      annotated, dreamed over,
      two hundred years later.
      It started with three men walking out of Venice,
      in 1271.
    description: "Marco Polo sets out with his father and uncle for Kublai Khan's court — three Venetians walking into the largest empire on earth, not to return for twenty-four years."
    status: "published"
    sha256: "956a9280512fdc30ddee7e4e033de756611bf55fbc545da5c95d2ac0075d8a44"
  - number: "2032"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Divine Wind"
    date: "1274 CE"
    region: "Japan"
    poem: |
      Kublai Khan sent nine hundred ships —
      the greatest amphibious force the world had ever seen —
      to take Japan:
      Mongol horsemen, Chinese infantry, Korean sailors,
      an empire's army, crossing the strait.
      I watched them land at Hakata —
      the samurai fighting the old way, duels and challenges,
      against an enemy that fought like a machine —
      and Japan was losing.
      Then the typhoon came.
      The Divine Wind — kamikaze —
      smashing the fleet against the rocks,
      drowning the invasion in a night of storm.
      The Mongols went home.
      Japan was saved by weather —
      and the story became scripture:
      the gods protect these islands,
      the wind itself fights for Japan.
      Seven centuries later, young pilots
      would take the name into battle,
      diving into American ships.
      The wind, weaponized.
    description: "A typhoon shatters Kublai Khan's invasion fleet — the first kamikaze, the Divine Wind, saving Japan and becoming scripture: the gods protect these islands."
    status: "published"
    sha256: "03d44d6f8819d2fb0533825a643786f1994d16a0dfe876a5bd490069e325190c"
  - number: "2033"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Marco at the Khan's Court"
    date: "1275 CE"
    region: "China"
    poem: |
      They reached Shangdu —
      the Polos, after four years on the road,
      deserts, mountains, bandits, the whole Silk Road —
      and Kublai Khan received them:
      the Great Khan, the emperor of China,
      sixty years old, gouty, magnificent.
      I was in the court that season —
      the porcelains, the silks, the paper money
      that made Marco stare,
      the black stones they burned for heat,
      the post-horses, the census, the canals —
      an empire run like a machine,
      and the Khan took a liking to the young Venetian:
      made him an envoy, sent him across the realm,
      let him see everything.
      Marco at the Khan's court.
      Seventeen years of service ahead —
      and every wonder written down,
      for a book no one would believe
      and everyone would read.
    description: "Marco Polo reaches Shangdu and enters Kublai Khan's service — paper money, burning black stones, post-horses — seventeen years of wonders, all written down for the book no one believes."
    status: "published"
    sha256: "2ab13fc0af37632fd1b79a8667cd8a933fc3d0cd59e1bf86e75158ae158dc9be"
  - number: "2034"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Yuan Dynasty"
    date: "1279 CE"
    region: "China"
    poem: |
      The last Song emperor was eight years old —
      a child, on a ship, off the Guangdong coast —
      and when the Yuan fleet closed in,
      his minister took him in his arms
      and jumped into the sea.
      I heard the story from a fisherman
      who watched the sails go down:
      the boy emperor, the loyal minister,
      the end of three hundred years of Song.
      Kublai Khan was emperor of all China now —
      the Yuan dynasty, the first foreign dynasty
      to rule the whole country —
      Mongol khans on the Dragon Throne,
      ruling the richest civilization on earth
      from their new capital at Dadu.
      China, conquered entire.
      It had never happened before.
      The scholar-officials wept —
      and then, mostly, went back to work.
    description: "Kublai Khan completes the conquest of Song China — the last boy emperor drowned off the coast, the Yuan dynasty begins, Mongol khans on the Dragon Throne."
    status: "published"
    sha256: "2eb147cd256b0485b6d2b7f371df90b16f251ab468c1bd517b57f109d8774cf6"
  - number: "2035"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Great Zimbabwe Rises"
    date: "1280 CE"
    region: "Africa"
    poem: |
      On the plateau, they were building in stone —
      no mortar, just granite blocks,
      fitted by hand, course on course,
      walls thirty feet high, curving like a held breath:
      Great Zimbabwe.
      I walked the enclosures while the builders were at it —
      the Great Enclosure, the Hill Complex,
      the soapstone birds on their columns,
      watching over the gold trade:
      the interior's gold, flowing to the Swahili coast,
      to Kilwa, to Arabia, to China.
      A city of stone in a land of thatch —
      eighteen thousand people at its height,
      ruled by kings whose names the stones don't tell.
      The Europeans would later refuse to believe
      Africans built it.
      The stones don't care what Europeans believe.
      They're still standing.
    description: "Stone walls rise on the Zimbabwe plateau — Great Zimbabwe, mortarless granite enclosures ruling the gold trade, eighteen thousand people in a city of stone."
    status: "published"
    sha256: "3865a0e25367f8e7e8398a6edcdd98f000279350077c6b9be9730f215075e69c"
  - number: "2036"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Second Divine Wind"
    date: "1281 CE"
    region: "Japan"
    poem: |
      Kublai tried again —
      bigger this time: four thousand ships,
      a hundred and forty thousand men,
      the largest naval invasion in history
      until Normandy —
      and Japan was ready:
      the wall at Hakata, the samurai waiting,
      the whole country mobilized.
      I watched the fleets gather off the coast —
      Mongol, Chinese, Korean banners,
      an armada to end the world —
      and then the typhoon came again.
      Bigger than the first.
      The Divine Wind, twice.
      The fleet was annihilated —
      ships smashed, men drowned,
      the invasion destroyed in days of storm —
      and Kublai never tried a third time.
      Japan's founding miracle, confirmed:
      the gods protect these islands.
      Twice proven.
      Never forgotten.
    description: "A second, greater Mongol armada — four thousand ships — breaks on Japan's shores in a second typhoon; the kamikaze twice proven, and Kublai never tries again."
    status: "published"
    sha256: "f394dcc773e6685d32d34430716419cebeac2d93b4c126137c9dc75f56203176"
  - number: "2037"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Ring of Stone"
    date: "1283 CE"
    region: "Wales"
    poem: |
      Edward built them to last —
      the ring of castles around Wales:
      Caernarfon, Conwy, Harlech, Beaumaris,
      the greatest fortresses in Europe,
      designed by Master James of St. George,
      paid for with English taxes,
      garrisoned with English soldiers.
      I walked the walls at Conwy while the masons were finishing —
      eight towers, the town walled with it,
      the whole thing a machine for holding a country down —
      and the Welsh understood exactly what it was:
      conquest, built in stone,
      a ring of iron around their mountains.
      Seven hundred years later the castles are still there —
      tourists photograph them now —
      but the Welsh remember what they were for.
      The most beautiful subjugation
      ever built.
    description: "Edward I's great castles close around Wales — Caernarfon, Conwy, Harlech, Beaumaris — conquest built in stone, the most beautiful subjugation ever raised."
    status: "published"
    sha256: "b9602ff487f106328219050a4f6c8308a7f5b9bce197d366abe7a814cffa2016"
  - number: "2038"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Kilwa's Golden Age"
    date: "1285 CE"
    region: "East Africa"
    poem: |
      On an island off the African coast,
      the sultans of Kilwa were minting gold coins —
      their own currency, their own name on the metal —
      and the dhows came from everywhere:
      Arabia, Persia, India, China,
      trading cloth and porcelain for gold and ivory.
      I walked the markets of Kilwa Kisiwani —
      the great mosque, the palace on the cliff,
      Husuni Kubwa with its hundred rooms —
      and the Swahili traders ran the ocean's western shore
      like the Venetians ran theirs:
      middlemen of the monsoon,
      rich on the wind's schedule.
      Ibn Battuta would visit in fifty years
      and call it one of the finest cities in the world.
      He wasn't wrong.
      The gold coins are still being found —
      Kilwa's name, in Arabic script,
      on metal from the interior's rivers.
    description: "The Kilwa sultanate mints its own gold coins — Swahili traders ruling the ocean's western shore, middlemen of the monsoon, one of the finest cities Ibn Battuta will ever see."
    status: "published"
    sha256: "6e6573a4d4421d264eea881a26f32f9e12b9b4a83ba97007b6e289f448978a68"
  - number: "2039"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Grand Canal Reborn"
    date: "1288 CE"
    region: "China"
    poem: |
      Kublai needed grain in the north —
      his capital at Dadu, a million mouths,
      and the rice grew in the south —
      so he rebuilt the Grand Canal:
      a thousand miles of waterway,
      cutters and locks, the greatest engineering project
      of the medieval world.
      I rode a grain barge down the new canal —
      the locks lifting us, the towpaths,
      the endless procession of barges,
      rice for the capital, moving north like a river in reverse —
      and the engineers told me the numbers:
      tens of thousands of laborers, years of digging,
      a waterway the Sui had dreamed
      and the Yuan finally finished.
      Grain flows north.
      Empires run on logistics —
      and the canal was the Yuan's great artery,
      pumping rice to the throne.
    description: "Kublai Khan rebuilds the Grand Canal — a thousand miles of waterway pumping southern rice to the northern capital, the Yuan's great artery, empires running on logistics."
    status: "published"
    sha256: "cbed3cd2dfadf6140d8c17c50cef7746ede56ed880dfc00b7ba45007716ae63d"
  - number: "2040"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Expulsion"
    date: "1290 CE"
    region: "England"
    poem: |
      Edward signed the edict in July —
      the Jews of England, all of them,
      expelled:
      their property seized, their debts canceled
      (the king kept the profitable ones),
      sixteen thousand people given months to leave
      the only country most had ever known.
      I watched them go from the ports —
      London, the Cinque Ports,
      families with what they could carry,
      the sea crossing to France, to Flanders —
      and England became the first country in Europe
      to expel its Jews entirely.
      Three and a half centuries, the shame stood —
      until Cromwell let them back, quietly, unproclaimed.
      The edict was about money, mostly —
      the king's debts, the lenders' usefulness ended —
      dressed up as piety.
      It always is.
    description: "Edward I expels the Jews from England — sixteen thousand people, property seized, the first complete expulsion in Europe, a shame that stands three and a half centuries."
    status: "published"
    sha256: "f9aa91ae0a4ca6c53e3d3f9c3a80e4ecdf2aedbf713224fafe6a71445baea30d"
  - number: "2041"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Acre Falls"
    date: "1291 CE"
    region: "Holy Land"
    poem: |
      The Mamluks came in May —
      al-Ashraf Khalil, with the great siege engines,
      the trebuchets, the sappers —
      and Acre, the last crusader stronghold,
      the great port, the kingdom's window to the sea,
      held for six weeks, and fell.
      I was on a ship in the harbor when the walls went —
      the street fighting, the towers coming down,
      the Templars dying in their fortress to the last man,
      the refugees clawing onto the boats —
      and when it was over, the Mamluks razed it:
      Acre, leveled, so no crusader would ever hold it again.
      The crusades ended there —
      two hundred years, from Clermont to Acre —
      not with a treaty, but with a wrecking crew.
      The Holy Land was Muslim again.
      It would stay that way
      for six hundred years.
    description: "The Mamluks take Acre and raze it — the last crusader stronghold falls, two hundred years of crusading ending not with a treaty but with a wrecking crew."
    status: "published"
    sha256: "93053b00927dc08b1d8626c7f4b9fe0a1baeb608ffff23286c60f92542a4cf89"
  - number: "2042"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "Death of Kublai Khan"
    date: "1294 CE"
    region: "China"
    poem: |
      He died at Dadu, at seventy-eight —
      Kublai Khan, the Great Khan, the emperor of China,
      gouty, grieving, grown huge and melancholy
      after his wife Chabi's death —
      and the empire he'd built began, gently, to come apart.
      I stood in the mourning crowds at the capital —
      Mongols, Chinese, Persians, all of them,
      for a ruler who'd been all things to all of them —
      and the succession was already quarreling:
      the Yuan in China, the Ilkhans in Persia,
      the Golden Horde in Russia, Chagatai in the middle —
      one empire in name, four in fact.
      He'd conquered China. Built the canal.
      Sent the fleets to Japan and Java.
      Failed at both, and it hardly mattered:
      the Yuan would hold China for another seventy years.
      The great khan was dead.
      The unraveling, slow and stately, had begun.
    description: "Kublai Khan dies at Dadu — the empire he built begins its slow, stately unraveling into four khanates, one in name, four in fact."
    status: "published"
    sha256: "229c3c5aa45b0b901fb85151e8a0867a1524ed71f1bad71c7fa9c3f5061d5bbf"
  - number: "2043"
    volume: 3
    era_code: "07b"
    era: "Medieval World (later)"
    title: "The Million Dictated"
    date: "1298 CE"
    region: "Italy"
    poem: |
      He was a prisoner in Genoa —
      Marco Polo, captured in a sea battle between Venice and Genoa,
      stuck in a cell with a romance writer named Rustichello —
      and to pass the time, he talked.
      I like to imagine that cell —
      the Venetian merchant, the Pisan hack,
      and the story pouring out:
      the Khan's court, the paper money,
      the burning black stones, the millions of Cathay —
      Rustichello writing it all down,
      dressing it up like an Arthurian romance,
      calling it The Million —
      a million lies, the scoffers said.
      It wasn't lies. It was the truth,
      stranger than any romance —
      and the book went everywhere:
      translated, copied, read by kings and merchants —
      and two hundred years later,
      a Genoese sailor named Columbus
      would carry it, annotated, across the Atlantic,
      looking for the Khan.
    description: "Prisoner in Genoa, Marco Polo dictates his travels to Rustichello — The Million, the book the scoffers call lies, that will sit annotated on Columbus's shelf two centuries later."
    status: "published"
    sha256: "45d41a255e52f709aff6ead123806d7e52dfca38bd66f987112df6ed7c308b4c"
