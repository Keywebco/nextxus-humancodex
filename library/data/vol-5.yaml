# Status "published": the text and numbering are final as published. A poem may still be improved later; every change is dated and the old text is kept. Numbers are permanent: new poems get numbers after 4343, nothing is ever renumbered.
entries:
  - number: "2744"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Cantor's Thousand Songs"
    date: "1725 CE"
    region: "Leipzig, Germany"
    poem: |
      I was there in the Thomaskirche loft,
      a nobody with ink on his cuffs,
      watching a tired man with failing eyes
      hand out new music like it was nothing —
      a fresh cantata, every single week,
      as regular as bread, as wild as prayer.
      The choir boys grumbled at the hard parts,
      the congregation half-asleep in the pews,
      and none of them knew. I knew.
      He was writing for God and for nobody,
      a thousand songs poured out like rain
      on a town too small to hold them,
      and the whole of heaven leaning in to listen.
    description: "Bach in Leipzig, writing a new cantata nearly every week — music his own congregation barely noticed, though the traveler did."
    status: "published"
    sha256: "10db9c1befc66d70c26ba25ce4bfcba3a4c05573dfba99dd02a7019ed9e25179"
  - number: "2745"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Academy of the North"
    date: "1725 CE"
    region: "St. Petersburg, Russia"
    poem: |
      Peter's dead, but his school stands tall —
      stone walls raised on the frozen Neva's shore.
      He sent for scholars from every land,
      told them: teach my Russia to understand.
      No more groping blind through priest and czar —
      measure the stars, and name them where they are.
      I walked those halls the winter they began,
      and watched a sleeping giant turn, and plan.
    description: "Peter the Great's Academy of Sciences opens in St. Petersburg, and Russia starts studying the world in earnest."
    status: "published"
    sha256: "66772adcb96ef0c68823135a06df7f860a4cbcc84300b9c04fa28a05047295ea"
  - number: "2746"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "Gulliver's Wild Voyage"
    date: "1726 CE"
    region: "London, England"
    poem: |
      Swift sold them a traveler's tale,
      of little kings and giants hale —
      and London roared at every page,
      not seeing its own face in the rage.
      I sat in the coffeehouse and heard them cheer
      the Lilliput court's affairs so dear,
      each minister a strutting ape,
      each war a quarrel over which end to break an egg's shape.
      They laughed at Gulliver's mad crew,
      and never guessed the joke was you.
    description: "Jonathan Swift publishes Gulliver's Travels, and London laughs at tiny emperors and giant fools without seeing itself in the mirror."
    status: "published"
    sha256: "782f5a35fbc128567faafada9e11ee8414209325a1e038df78ea34988b0e9a8a"
  - number: "2747"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Young Printer Comes Home"
    date: "1726 CE"
    region: "Philadelphia, Pennsylvania"
    poem: |
      He stepped off the boat with empty pockets
      and a head full of London's noise —
      twenty years old, ink under his nails,
      hungry the way only the young are hungry.
      I watched him walk the Philadelphia streets,
      already measuring every shop and sign,
      already planning. The colonies didn't know
      what had just sailed home to them:
      a printer's devil with a thunderstorm inside.
    description: "Twenty-year-old Benjamin Franklin returns from London to Philadelphia, broke but burning to make his mark."
    status: "published"
    sha256: "380bf384417a9ca5601ed890ef4bc413596cb810fb2a34f1da16574a068c3eae"
  - number: "2748"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Man Who Weighed the Stars, Laid to Rest"
    date: "1727 CE"
    region: "London, England"
    poem: |
      They buried him like a king in Westminster,
      this quiet man who weighed the sun and stars
      and found the numbers wouldn't lie.
      I stood among the mourners in the Abbey
      and thought of all he'd set in motion —
      the apple, the moon, the tides obeying
      one law written across the sky.
      The age of reason lowered its father down
      into English earth, and wept,
      because we all knew: there would not be another.
    description: "Isaac Newton is buried in Westminster Abbey like a king, and the age of reason mourns the man who gave it its laws."
    status: "published"
    sha256: "f939ad8079aa604d3f9ff75c62a2af22f0040eb8422198f43f96288cb994bea5"
  - number: "2749"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Housewife's Book"
    date: "1728 CE"
    region: "London, England"
    poem: |
      While the philosophers argued God,
      Eliza Smith wrote down the dinner.
      Stew it slow. Skim the fat.
      Mend the wound with this poultice.
      I held her book in a working kitchen
      and smelled the truth of it:
      empires rise on the backs of women
      who know which herb heals the fever.
    description: "Eliza Smith publishes The Compleat Housewife, a book of recipes and remedies for every working kitchen in England."
    status: "published"
    sha256: "83463cc4bdaa154a96ec92c3a9720243433a713f2b433eb998523224f7b3c8bc"
  - number: "2750"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Sailor Who Found the Strait"
    date: "1728 CE"
    region: "Kamchatka, Russia"
    poem: |
      I sailed with Bering into the fog,
      a Dane in Russian service, stubborn as ice.
      The strait was there — nobody knew for sure —
      a cold gray seam between two worlds.
      We threaded it in the endless Arctic light,
      waves slapping, men half-frozen at the rails,
      and put it on the map: Asia here,
      America there, the water between.
      Empires would fight over that line someday.
      We just found it, and shivered, and turned home.
    description: "Vitus Bering sails the icy strait between Asia and America and puts it on the map."
    status: "published"
    sha256: "2f05dccce67ea7e7dcce3f43cdc29bc8e1803146d989c1ed70f642785527e043"
  - number: "2751"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Printer's Gazette"
    date: "1729 CE"
    region: "Philadelphia, Pennsylvania"
    poem: |
      He bought a failing paper for a song
      and sharpened it like a butcher's knife.
      Franklin's Gazette cut at governors,
      mocked the pious, praised the plain —
      the colonies' boldest voice,
      set in type by the boldest printer alive.
      I read it fresh off the press,
      ink still wet, and thought: this town
      will never be quiet again.
    description: "Franklin buys a struggling Philadelphia newspaper and turns it into the colonies' sharpest voice."
    status: "published"
    sha256: "63801180bc8442415612a243c4ae6e46d94e8762ddde642a744b0c7fbdd92145"
  - number: "2752"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Terrible Joke That Told the Truth"
    date: "1729 CE"
    region: "Dublin, Ireland"
    poem: |
      Eat your children, Swift said.
      He said it with a straight face,
      in perfect logic, in perfect prose —
      the Irish are starving, so let the rich
      dine on the poor's own sons.
      I watched Dublin read it and go pale,
      because the joke was not a joke:
      England was already devouring them,
      just slower, and with better manners.
      The cruelest sentence ever written,
      and every word of it true.
    description: "Swift's Modest Proposal suggests starving Irish families sell their children as food — a savage joke that shames England's real cruelty."
    status: "published"
    sha256: "6cac2e3469dd14f946d99304f2a54953a515b509ba1d730e23beae87f565f70a"
  - number: "2753"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Potter Who Made the World Beautiful"
    date: "1730 CE"
    region: "Staffordshire, England"
    poem: |
      In the potteries' smoke a boy was born
      who'd make the whole world set a finer table.
      Josiah Wedgwood — clay on his hands,
      experiments in his kiln, a fortune in his head.
      Queens would drink from his blue-and-white,
      and common folk would eat off beauty too.
      I held one of his plates years later
      and thought: this is what a life's for —
      taking common earth and firing it into grace.
    description: "Josiah Wedgwood is born in Staffordshire, the boy who will turn common clay into art and build a fortune on it."
    status: "published"
    sha256: "d6bf4a255717738e1219ed3d4e5e6f289b3d8a411245833ced739d048db20bb4"
  - number: "2754"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Library That Opened Its Doors"
    date: "1731 CE"
    region: "Philadelphia, Pennsylvania"
    poem: |
      They had no money for books, so they pooled them —
      fifty men, each bringing what he owned,
      shelving their private shelves together
      so anyone could read them all.
      Franklin's Junto, a library born of friendship.
      I borrowed a volume there myself,
      smelling of pipe smoke and binding glue,
      and understood: this is how a new country learns —
      not from kings, but from neighbors sharing pages.
    description: "Franklin and his friends pool their private books to found America's first lending library."
    status: "published"
    sha256: "cd99bc9c47aa258daeda7fe9204b29111a83cf938b88a10807d06edd04624378"
  - number: "2755"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Boy Born on the Farm"
    date: "1732 CE"
    region: "Virginia, British America"
    poem: |
      On a Virginia plantation, in a plain farmhouse,
      a boy was born to a middling planter —
      no gold spoon, no great name,
      just red-brown hair and a tall man's frame.
      I held no crystal to see his future;
      nobody at his christening dreamed
      that this squalling infant, George by name,
      would one day turn down a crown
      and walk away from power like it was nothing.
    description: "George Washington is born on a Virginia plantation, the first son of a modest planter — nobody dreaming what he will become."
    status: "published"
    sha256: "ec21d74091fe1d6d80d54ea500e8ef34ec7d90b7ff9364d8e504bd5f56dae998"
  - number: "2756"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "Poor Richard's Almanac"
    date: "1732 CE"
    region: "Philadelphia, Pennsylvania"
    poem: |
      Early to bed and early to rise
      makes a man healthy, wealthy, and wise.
      God helps them that help themselves.
      Fish and visitors stink in three days.
      Franklin dressed as Poor Richard sold the farmers
      weather, wit, and proverbs by the thousand —
      plain wisdom in plain words,
      the kind you pin above the hearth.
      I read those pages and laughed out loud:
      the colonies' first philosopher wore a joke for a mask.
    description: "Franklin begins publishing Poor Richard's Almanac, a yearly book of weather, jokes, and proverbs for plain country folk."
    status: "published"
    sha256: "8e7dcd10fa4b94edf9b31db1ac3ab0765dcce69c03187f6b0f02ca1432b11248"
  - number: "2757"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Shuttle That Flew"
    date: "1733 CE"
    region: "Lancashire, England"
    poem: |
      John Kay's shuttle flew across the loom,
      faster than any hand could throw it —
      and the weavers cursed his name
      because the machines had begun to quicken.
      I watched the threads fly double-time
      and felt the ground tilt under England:
      this was the first breath of the factory age,
      and no king's army could stop what a shuttle started.
    description: "John Kay's flying shuttle doubles the weaver's speed — the machines begin to quicken, and nothing will slow them down."
    status: "published"
    sha256: "9a5c8b8d19a2e6d744b71e294c854eac954ce0a6d70e24724a5512732f124770"
  - number: "2758"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Fire on St. John"
    date: "1733 CE"
    region: "St. John, Danish West Indies"
    poem: |
      They rose in the cane fields of St. John —
      enslaved Africans with machetes and torches —
      and took the island, held it for months,
      free men on stolen ground.
      I saw the smoke from a passing ship,
      black columns against the Caribbean blue.
      The planters came back with soldiers and hanged them all,
      but for one bright season the enslaved were masters,
      and the fire they lit would not go out —
      it would burn again, and again, until the chains broke.
    description: "Enslaved Africans seize the island of St. John and hold it for months before the planters crush them."
    status: "published"
    sha256: "572d0088882bbd65eaa66b016e56ee84603d8d31e9c57e46fa7dcf440d4038e4"
  - number: "2759"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Preacher in the Wilderness"
    date: "1734 CE"
    region: "Massachusetts, British America"
    poem: |
      Jonathan Edwards thundered from the pulpit
      and New England caught fire.
      Sinners in the hands of an angry God —
      his voice rolled over the frontier towns
      like a storm off the mountains.
      I sat in the back of a packed meetinghouse
      and watched farmers weep and children tremble,
      the Great Awakening shaking every pew.
      Love him or fear him, you couldn't sleep through him —
      he made heaven and hell feel one breath away.
    description: "Jonathan Edwards' thundering sermons set New England ablaze with the Great Awakening."
    status: "published"
    sha256: "e23bd688ecd9ba7bc0de9f7332e0e0b80eabf6c0342f5cae1b95a83d68c60164"
  - number: "2760"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Man Who Named Every Living Thing"
    date: "1735 CE"
    region: "Uppsala, Sweden"
    poem: |
      Linnaeus looked at the chaos of creation
      and gave it order: two names for everything.
      Homo sapiens. Rosa canina. Felis catus.
      Latin labels, neat as a ledger,
      so a botanist in Uppsala and one in Batavia
      could speak of the same flower.
      I walked his garden among the pressed specimens
      and marveled: one man, naming the living world,
      leaf by leaf, beast by beast, as if taking attendance
      for the whole of God's green earth.
    description: "Carl Linnaeus publishes Systema Naturae, giving every plant and animal its two Latin names."
    status: "published"
    sha256: "405a7e3eca64ac2a955f67b25d4e5732f83470a9436c86ac1df75274e0a33bf0"
  - number: "2761"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Young Emperor Takes the Throne"
    date: "1735 CE"
    region: "Beijing, China"
    poem: |
      A young man ascended the Dragon Throne
      and China entered its golden age —
      sixty years of wealth and power,
      granaries full, borders quiet, poets paid.
      Qianlong, they called him: the emperor
      who would out-reign them all.
      I walked the Beijing markets in those early years,
      silk and tea and porcelain piled high,
      and thought the Middle Kingdom might stand forever.
      Forever, as always, turned out to be shorter than it looked.
    description: "The Qianlong Emperor takes the throne in Beijing, beginning sixty years of China's greatest wealth and power."
    status: "published"
    sha256: "9d93ac8a0194d9a831e8e44ab5f4d9fc525c57022e1cbb878c85a23dedac0439"
  - number: "2762"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Fire Company"
    date: "1736 CE"
    region: "Philadelphia, Pennsylvania"
    poem: |
      When the fire bell rang, they came running —
      not soldiers, not the king's men,
      just neighbors with buckets and ladders.
      Franklin's Union Fire Company:
      the first to the flames gets the glory,
      and everybody's house is everybody's business.
      I stood in the bucket line one winter night,
      passing water hand to hand through the smoke,
      and learned what America would be built on —
      not crowns, but neighbors who show up.
    description: "Franklin founds the Union Fire Company — neighbors banding together with buckets against the flames."
    status: "published"
    sha256: "f27cc1610e1b05d01e97920e8ff2a60c80b6bbfda88fb81e07d18446b1af3d08"
  - number: "2763"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Clock That Found the Way"
    date: "1736 CE"
    region: "London, England"
    poem: |
      Sailors died lost at sea for want of one thing:
      knowing the time, far from land.
      John Harrison built a clock that could —
      brass and springs that kept true time
      through storm and rolling wave.
      I watched it survive its ocean trial,
      ticking steady while the ship pitched and groaned,
      and thought of all the drowned men
      who'd never needed to die.
      The sea had a clock now. The sea had mercy.
    description: "John Harrison's sea clock survives its ocean trial, promising sailors their true position at sea at last."
    status: "published"
    sha256: "5a93dd6c04e1fbcbf879783e5feae22cb51b33396852358b94e46f456bc9660e"
  - number: "2764"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Opera House Falls Silent"
    date: "1737 CE"
    region: "London, England"
    poem: |
      Bankrupt. Broken in health. The Italian opera —
      his grand, expensive dream — collapsed around him.
      Handel gave it up and turned his face
      toward the oratorio, toward scripture set to music.
      I was there the night the opera house went dark,
      the singers dismissed, the costumes sold —
      and I wanted to tell him: the best is coming.
      Messiah is coming. The Hallelujah is coming.
      Sometimes ruin is just the door to glory.
    description: "Bankrupt and broken in health, Handel abandons Italian opera and turns toward the oratorio."
    status: "published"
    sha256: "73f662166b2c5746e656ba55388be558eaf674c2f524381ca6d639388ed0addc"
  - number: "2765"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Heart Strangely Warmed"
    date: "1738 CE"
    region: "London, England"
    poem: |
      At a quarter to nine on a May evening,
      in a chapel on Aldersgate Street,
      John Wesley felt his heart strangely warmed —
      and Methodism was born.
      Not in a cathedral, not by decree,
      but in one man's chest, on an ordinary night.
      I stood outside and heard the singing start,
      plain voices raised in plain words,
      and watched a movement walk out into the streets
      that would circle the globe on horseback and prayer.
    description: "John Wesley's conversion at Aldersgate Chapel launches the Methodist movement."
    status: "published"
    sha256: "cc07c8f315a22cc6c0aba7da96690a4d5a3371c8f84237115155d1ee355ac60b"
  - number: "2766"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Salons Where Ideas Caught Fire"
    date: "1738 CE"
    region: "Paris, France"
    poem: |
      By candlelight, in drawing rooms of silk,
      the cleverest women in Paris held court —
      and philosophers came to argue at their feet.
      Voltaire sparred, Diderot dreamed aloud,
      while the hostess poured the wine and steered the wit.
      I sat in the corner, invisible, delighted:
      here was the Enlightenment at play,
      ideas catching fire between the courses,
      all Paris listening through the keyhole of a salon door.
    description: "In candlelit Paris drawing rooms, brilliant hostesses set philosophers arguing and all Paris listening."
    status: "published"
    sha256: "8eaa7ae77c74acfbfbf30bc9bc00627292315eda5d350909d12ef00a56023551"
  - number: "2767"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Drums at Stono"
    date: "1739 CE"
    region: "South Carolina, British America"
    poem: |
      They rose at Stono on a September Sunday,
      twenty men with stolen guns,
      drumming as they marched for Spanish Florida —
      for freedom, for a life of their own.
      The militia cut them down within the day,
      heads on stakes along the road.
      I heard the drums before I saw the smoke.
      It lasted hours. It cost everything.
      But every enslaved soul in Carolina heard those drums,
      and freedom had a sound now — it had a beat.
    description: "Enslaved men rise at Stono, South Carolina, marching for freedom in Spanish Florida before they are cut down."
    status: "published"
    sha256: "f70f13ad9a0993f99e6c30a52326ca48236e9eeb40555e06705fa7a6b835b7e1"
  - number: "2768"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Hospital for Lost Children"
    date: "1739 CE"
    region: "London, England"
    poem: |
      Captain Coram had seen them on the streets —
      babies left in doorways, in gutters, in the snow —
      and he would not look away.
      Seventeen years he begged and argued,
      until the king signed the charter at last.
      I stood in the courtyard on opening day
      and watched the first abandoned infants
      carried in from the cold.
      London had a thousand cruelties;
      this was the day it built one mercy.
    description: "Captain Coram wins his royal charter for a hospital to shelter London's abandoned babies."
    status: "published"
    sha256: "6fa164f4254981e0e5292648ac4467cd9dd95849fea8b20b0dd904df0c5e9188"
  - number: "2769"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Flute-Playing King"
    date: "1740 CE"
    region: "Berlin, Prussia"
    poem: |
      He took the throne with a flute in his hand
      and a philosopher's library in his head —
      then marched his armies out and never stopped.
      Frederick the Great: warrior by day,
      musician by night, writing verses between battles.
      I heard him play once, in a lamplit room at Potsdam,
      delicate as lace — and the next morning
      watched him drill his grenadiers like a machine.
      Prussia would be forged in that strange fire:
      art and iron, the flute and the cannon, one man.
    description: "Frederick the Great takes the Prussian throne — a flute-playing warrior who will forge Prussia into a great power."
    status: "published"
    sha256: "cddf12d844567d2f50abb655d166de1733ffc91e730f7e7f9aee6075541c8982"
  - number: "2770"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Young Queen Who Would Not Bow"
    date: "1740 CE"
    region: "Vienna, Austria"
    poem: |
      Twenty-three years old, a woman, alone —
      and every neighbor in Europe reached for her empire
      like wolves at a lamb.
      Maria Theresa would not bow.
      She rode out, she bargained, she fought,
      she held the Habsburg lands together by sheer will.
      I saw her in Vienna that first hard year,
      young and grieving and absolutely unbreakable,
      and understood: some thrones are held
      not by armies, but by refusing to fall.
    description: "Twenty-three-year-old Maria Theresa inherits the Austrian empire, and every neighbor reaches for a piece of it — but she will not bow."
    status: "published"
    sha256: "ba4ec5a06f5ed35e8ee5fa2be362a8976c6610cbb0a7bd2df56bc29f42bef63f"
  - number: "2771"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Voyage That Cost the Captain His Life"
    date: "1741 CE"
    region: "Alaska, Russian America"
    poem: |
      He found Alaska through the fog and mist —
      new land, new coast, the prize of his life —
      and died of scurvy on the way home,
      on a barren island that would bear his name.
      I was aboard when Bering breathed his last,
      the captain who'd mapped the strait
      buried in Russian soil at the edge of the world.
      The sea gives, and the sea takes;
      he gave his life for a coastline on a chart,
      and the island keeps his name forever.
    description: "Bering sights Alaska, then dies of scurvy on the barren island that will bear his name."
    status: "published"
    sha256: "33afd93a62ea0ce0b2062382132ccabbc9670d8645ddcd13e2037486bcee7bf0"
  - number: "2772"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Seed Drill's Quiet Revolution"
    date: "1741 CE"
    region: "Berkshire, England"
    poem: |
      No battles, no trumpets — just straight rows.
      Jethro Tull died in Berkshire, little-mourned,
      leaving behind a machine that sowed seed
      in neat, thrifty lines instead of scattered handfuls.
      I walked a drilled field at harvest time
      and saw the difference: order where waste had been,
      more wheat from the same earth.
      The quietest revolution ever made —
      a farmer's gadget that would help feed the world.
    description: "Jethro Tull dies, leaving the seed drill that taught farmers to sow in straight, thrifty rows."
    status: "published"
    sha256: "e27344cbdb9e71ddd93aa69d5ceb680831240c6fe62c3cce1860551938a16963"
  - number: "2773"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Hallelujah That Shook the Hall"
    date: "1742 CE"
    region: "Dublin, Ireland"
    poem: |
      They say the king stood for the Hallelujah —
      whether legend or truth, I was there in Dublin
      when those first great chords rolled out,
      and the whole hall rose like a wave.
      Handel, bankrupt five years before,
      had written heaven into music in three weeks.
      I wept with the strangers beside me.
      Some music entertains; this music
      reached down and lifted every soul in the room
      straight up through the roof.
    description: "Handel's Messiah premieres in Dublin, and legend says the king himself stood for the great Hallelujah chorus."
    status: "published"
    sha256: "c66aa52998f266425b292e6ef95732c368d4a890e883c7fafd89c35db9b23180"
  - number: "2774"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Thermometer's New Tongue"
    date: "1742 CE"
    region: "Uppsala, Sweden"
    poem: |
      Zero for freezing. One hundred for boiling.
      Anders Celsius gave heat a language —
      a hundred degrees from ice to steam,
      so a doctor in Uppsala and a sailor in Batavia
      could speak of fever in the same numbers.
      I watched him demonstrate it in his laboratory,
      the mercury climbing the glass like a promise:
      the world was becoming measurable,
      and mystery was learning to count.
    description: "Anders Celsius proposes his hundred-degree scale, and heat learns to speak in numbers."
    status: "published"
    sha256: "b8167f38a701e66dbc1e8673a4f9cf0aee004cbd16ef6bc7ebb36a81a3f1df42"
  - number: "2775"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Red-Haired Boy of Monticello"
    date: "1743 CE"
    region: "Virginia, British America"
    poem: |
      An awkward red-haired boy was born in Virginia,
      all elbows and questions, never quite fitting in —
      the kind of child who reads when others play
      and argues with the teacher just to see.
      Thomas Jefferson. I saw him as a boy
      taking apart a broken lock to learn its secret,
      and I thought: this one will take apart bigger things.
      Kingdoms, for instance. The whole order of the world.
      He'd write the words of a revolution
      in handwriting nobody could quite read.
    description: "Thomas Jefferson is born in Virginia — the awkward boy who will write the words of a revolution."
    status: "published"
    sha256: "109879a708f1ec933aad982ca8a35a7cfe12b00ed0d583534ddac21d141e5c89"
  - number: "2776"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Last King to Lead His Men"
    date: "1743 CE"
    region: "Bavaria, Germany"
    poem: |
      At Dettingen, old George the Second
      drew his sword and rode into the cannon smoke —
      the last British king to lead his troops in battle.
      His horse bolted; he fought on foot,
      waving his men forward like a common officer.
      I watched from the ridge as the old man charged,
      and felt the age turn: never again
      would a king risk his skin beside his soldiers.
      After that day, monarchs commanded from maps —
      and something brave went out of kingship.
    description: "George II charges at Dettingen — the last British monarch to lead his troops into battle."
    status: "published"
    sha256: "8effd7ca5a8b4a71a32e7ad779d455062e51a92eb42144db779162da8c0222dc"
  - number: "2777"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Girl Who Grew Blue Gold"
    date: "1744 CE"
    region: "South Carolina, British America"
    poem: |
      She was twenty-two, running her father's plantations
      while he stayed in England, a girl with ledgers and nerve.
      Eliza Lucas tried indigo seed after seed —
      failure, failure, then blue.
      Blue gold: the dye that colored the colony's fortune,
      flooded the markets, built the great houses.
      I walked her indigo fields at harvest,
      the air sharp with the vats, the workers' hands stained blue,
      and marveled at this young woman
      who'd grown an empire's wealth from a seed packet.
    description: "Twenty-two-year-old Eliza Lucas perfects indigo in South Carolina, dyeing her colony's fortune blue."
    status: "published"
    sha256: "679df5fd2c23b92a21e0546a593668c8b65f0940ea73edb6dbadef9ac830e2c9"
  - number: "2778"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Prince Who Came Home"
    date: "1745 CE"
    region: "Scotland, Britain"
    poem: |
      Bonnie Prince Charlie landed in the mist,
      a young Stuart with a claim and a smile,
      and the Highlands rose for him —
      tartan and claymore, the old songs sung again.
      I marched a little way with that gay army,
      all hope and bagpipes, bound for London
      they would never reach.
      It was the last rising of the clans,
      a bonfire of loyalty in the northern rain —
      beautiful, doomed, and gone within the year.
    description: "Bonnie Prince Charlie lands in Scotland, and the Highlands rise for the Stuarts one last time."
    status: "published"
    sha256: "7ca59c704866aaa70faa06d46e65f99eaf88d4cdc236b019b6a107cde6577b03"
  - number: "2779"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Seamstress Who Ruled the Court"
    date: "1745 CE"
    region: "Versailles, France"
    poem: |
      Jeanne Poisson, a banker's daughter —
      clever, charming, impossibly polished —
      caught the king's eye and never let it go.
      Madame de Pompadour: the uncrowned queen of Versailles,
      maker of French taste, patron of the arts,
      the power behind the gilded throne.
      I watched her hold court in silks and diamonds,
      every artist in France bowing for her favor,
      and thought: here is power in its strangest dress —
      a seamstress's daughter ruling the grandest court on earth.
    description: "Jeanne Poisson becomes Madame de Pompadour — the king's mistress and the maker of French taste."
    status: "published"
    sha256: "e32370a3ff83ce2935c4ad2f7de1e2fcbd733a894dee2966682310d86f96a163"
  - number: "2780"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Last Battle on British Soil"
    date: "1746 CE"
    region: "Scotland, Britain"
    poem: |
      Rain. Mud. The Highland charge broken on British cannon.
      At Culloden the Jacobite dream died in an hour,
      and the clans were broken forever —
      the tartan banned, the pipes silenced, the chiefs scattered.
      I walked the field afterward among the dead,
      young men in plaids lying in the Scottish rain,
      and felt a whole way of life go quiet.
      Bonnie Prince Charlie fled to the hills;
      Scotland would never rise again.
    description: "At Culloden the Jacobite dream dies in the rain, and the Highland clans are broken forever."
    status: "published"
    sha256: "bcdc2b425fb4ce4c79bd0c62f4700c639ca513fd9b7733ddcc86f25cf2fa3161"
  - number: "2781"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "A College Rises in the Pines"
    date: "1746 CE"
    region: "New Jersey, British America"
    poem: |
      In the New Jersey wilderness, among the pines,
      a few ministers raised a college —
      the College of New Jersey, humble as a barn,
      teaching Latin and scripture to farm boys.
      I sat in on a lesson there that first winter,
      breath fogging in the unheated room,
      and never dreamed this rough school
      would become Princeton, proud and ivied —
      but seeds don't look like trees, do they?
    description: "The College of New Jersey is founded in the wilderness — the school that will become Princeton."
    status: "published"
    sha256: "fa856dbe3fc90cc682a8de64417c6cfde7e3f4ff554f6c35d07c8d7a211dec62"
  - number: "2782"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Cook Who Wrote It Down"
    date: "1747 CE"
    region: "London, England"
    poem: |
      Hannah Glasse never ran a grand kitchen —
      she just wrote down what every good cook knew,
      plain and clear: roast it thus, bake it so.
      Her Art of Cookery taught England to feast,
      from the squire's table to the tradesman's board.
      I cooked from her book in a London kitchen,
      flour on my sleeves, following her plain directions,
      and the dinner came out perfect.
      Empires need philosophers; kitchens need Hannah Glasse.
    description: "Hannah Glasse's Art of Cookery teaches England's kitchens to roast, bake, and feast."
    status: "published"
    sha256: "a39ae4dd09f5978e34b622f5ae906d16802a0be61ed298015a2e7f0cdcf0bbf0"
  - number: "2783"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Book That Taught Kings to Fear"
    date: "1748 CE"
    region: "Paris, France"
    poem: |
      Montesquieu wrote that liberty lives only
      where power is divided — king against parliament,
      judge against minister, each watching the other.
      The Spirit of the Laws: a quiet book,
      no barricades, no blood — just an idea
      that would frighten every throne in Europe.
      I read it in a Paris bookshop,
      and watched a young lawyer copy passages by hand,
      his eyes bright. Ideas are slow gunpowder;
      this one would blow up the century.
    description: "Montesquieu's Spirit of the Laws argues that liberty lives only where power is divided."
    status: "published"
    sha256: "90772931087b7b3aaa8dfc2e0a4347eef9b5630cc83211b6525d11f63d9c61a1"
  - number: "2784"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Peace That Pleased No One"
    date: "1748 CE"
    region: "Aachen, Germany"
    poem: |
      They signed the peace at Aix-la-Chapelle
      and nobody went home happy —
      the diplomats bowed, the maps were redrawn,
      and every king began planning the next war before the ink dried.
      I walked the treaty halls afterward,
      all marble and muttering,
      and felt the whole thing for what it was:
      a pause, not a peace. A held breath.
      The seeds of the next war were planted that day,
      watered with everyone's disappointment.
    description: "The Treaty of Aix-la-Chapelle ends a war and satisfies nobody — planting the seeds of the next one."
    status: "published"
    sha256: "f7840af7e0d98e410b484ac69a721975a2b04acbaa8ff629ea12bf424f6f6a59"
  - number: "2785"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Rake's Wild Ride"
    date: "1749 CE"
    region: "London, England"
    poem: |
      Tom Jones came roaring off the press —
      bawdy, funny, bursting with life —
      and the novel became the people's art.
      Fielding wrote of rakes and rogues and good hearts
      in trouble, and all England devoured it.
      I read it in a coffeehouse, laughing out loud,
      milk-sellers and lords alike bent over their copies.
      No more heroes on pedestals;
      this was life as it was lived — messy, merry, human.
    description: "Henry Fielding's Tom Jones makes the novel the people's art — funny, bawdy, and full of life."
    status: "published"
    sha256: "8f872ccdced25876ed6b727d717a7b992bb34cab66ab771d386c9aa5357502dc"
  - number: "2786"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Thinker in the Tower"
    date: "1749 CE"
    region: "Paris, France"
    poem: |
      They locked Diderot in Vincennes
      for daring to think in print —
      and all Paris took his side.
      The prison made him famous;
      the bars made his ideas louder.
      I visited the tower town and heard the talk:
      cab drivers quoting him, ladies defending him,
      the whole city buzzing like a kicked hive.
      Lock up a thinker and you advertise him —
      France learned that lesson in a stone cell.
    description: "Diderot is locked in Vincennes for his daring writings, and all Paris takes his side."
    status: "published"
    sha256: "0b55d9ef9e502e9ae857ee0f89c2add0495d18e49ec7aa3ed25dd6385cc34a10"
  - number: "2787"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Farewell of the Cantor"
    date: "1750 CE"
    region: "Leipzig, Germany"
    poem: |
      He died blind, half-forgotten,
      the great Bach of Leipzig —
      the town buried him and moved on,
      and his music slept for eighty years.
      Eighty years of silence for the thousand songs.
      I stood at his plain grave and wanted to shout
      at the whole forgetful century:
      you buried the greatest of us in an unmarked plot!
      But time would wake the world to him —
      Mendelssohn would find the scores, and the sleeping giant would rise.
    description: "Bach dies in Leipzig, blind and half-forgotten; his music will sleep for eighty years before the world wakes to it."
    status: "published"
    sha256: "4fdb2705ec65baf32ae48fb8a298e2e5c9cfc1693c832696bf66aee865d7ab2c"
  - number: "2788"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Unknown Who Scolded Civilization"
    date: "1750 CE"
    region: "Dijon, France"
    poem: |
      An unknown entered the essay contest at Dijon
      and asked the rude question:
      has progress corrupted mankind?
      Rousseau — nobody had heard the name —
      won the prize and scolded civilization to its face.
      I read his essay in a crowded salon
      and watched the fine folk squirm:
      their silks, their sciences, their polished manners —
      all of it, he said, had made men worse, not better.
      The age of reason had just been insulted by its own son.
    description: "An unknown Rousseau wins a prize for asking whether progress has corrupted mankind."
    status: "published"
    sha256: "c8b4eb22dfc5b028d28197231a0cb51daeb80b6448001b6dcc01d2736d632cc4"
  - number: "2789"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Book That Held All Knowledge"
    date: "1751 CE"
    region: "Paris, France"
    poem: |
      Volume by volume, it began to appear —
      Diderot's Encyclopédie, all human knowledge
      between covers, blessed by some, burned in effigy by others.
      Priests denounced it; philosophers wept with joy.
      I held the first volume, heavy as a brick,
      and turned its pages: arts, sciences, trades —
      the whole world explained, in alphabetical order.
      France would try to stop it and fail;
      you can't unprint an idea whose time has come.
    description: "Diderot's Encyclopédie begins to appear volume by volume, blessing and scandalizing France."
    status: "published"
    sha256: "ae487e9d232c8cc988b77861f05b2e55d761bc94552840ff8b15b42daa69d1cb"
  - number: "2790"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Bell That Would Ring for Freedom"
    date: "1751 CE"
    region: "Philadelphia, Pennsylvania"
    poem: |
      They hung a great bell in the State House tower —
      bronze and hopeful, ordered from London —
      not yet knowing the name it would one day earn.
      I stood beneath it the day it was raised,
      its first dull testing note rolling over Philadelphia,
      and felt nothing special. Just a bell.
      But bells outlive the hands that hang them,
      and this one was waiting for its moment —
      twenty-five years off, in a hot July,
      when it would ring a new nation into being.
    description: "A great bell is hung in Philadelphia's State House tower, not yet knowing the name it will one day earn."
    status: "published"
    sha256: "7bd4779cbb71b0539f2273f318e8b9ae265b8cc86beeaca4a1e62e54f781dfc5"
  - number: "2791"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Kite in the Thunderstorm"
    date: "1752 CE"
    region: "Philadelphia, Pennsylvania"
    poem: |
      He flew a kite into a thunderstorm —
      silk, string, and a brass key —
      and when the lightning came down the line
      and the key sparked in his hand,
      Franklin laughed: the sky's fire was electricity,
      tameable, knowable, his.
      I watched from a safe distance, soaked to the skin,
      as the most famous kite in history
      proved the heavens ran on the same stuff
      as a rubbed amber rod.
      After that day, men would bottle lightning.
    description: "Franklin flies his kite in a thunderstorm and proves lightning is electricity — taming the sky's fire."
    status: "published"
    sha256: "56683d8a56ba74e56a2aaf851e53e202a1ba8cea2403afb63003f255a1bc572f"
  - number: "2792"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Year That Lost Eleven Days"
    date: "1752 CE"
    region: "London, England"
    poem: |
      Britain adopted the new calendar that year,
      and sleepers woke to find eleven days simply gone —
      September the 2nd followed by September the 14th,
      as if time itself had skipped.
      Riots, they say — give us back our eleven days!
      I walked the London streets in the confusion,
      landlords and tenants arguing over rent,
      saints' days vanished, birthdays displaced.
      The strangest theft in history:
      the government stole eleven days, and nobody could get them back.
    description: "Britain adopts the new calendar, and sleepers wake to find eleven days simply gone."
    status: "published"
    sha256: "c64999ba0f1765397633776dc2e403f20eeda0da04e76a46fb99e805dbf77b7e"
  - number: "2793"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Museum for Everyone"
    date: "1752 CE"
    region: "London, England"
    poem: |
      The British Museum opened its doors —
      not to lords, not to scholars only,
      but to any curious visitor, free of charge.
      Mummies, manuscripts, marble gods:
      the world's treasures for the price of showing up.
      I wandered those first galleries
      among clerks and seamstresses staring wide-eyed
      at things they'd only dreamed of.
      Knowledge had left the private library;
      it belonged to everyone now.
    description: "The British Museum is founded, opening its treasures to any curious visitor, free of charge."
    status: "published"
    sha256: "b11f18cd8d6d177be72da21184b21937ff272582714a29529cb47ff2c52e88e2"
  - number: "2794"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Young Officer in the Wilderness"
    date: "1753 CE"
    region: "Ohio Country, British America"
    poem: |
      Twenty-one years old, in the dead of winter,
      Washington carried a warning through the snows
      to the French forts on the Ohio —
      a boy officer on a man's errand, half-frozen, undaunted.
      I tracked with him through that white wilderness,
      rivers half-ice, forests endless,
      and watched him deliver his message like a veteran.
      The French read it and smiled politely.
      Nobody smiled for long: that winter errand
      was the first step toward a world war.
    description: "Twenty-one-year-old Washington carries a warning through the winter snows to the French forts."
    status: "published"
    sha256: "be0037f4b006bce41e72fce17a07064bf4df480154af8470894fc615da6eb8d3"
  - number: "2795"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The First Shot of a World War"
    date: "1754 CE"
    region: "Ohio Country, British America"
    poem: |
      At Jumonville Glen, in the morning mist,
      Washington's men fired on French soldiers —
      a skirmish in a Pennsylvania forest,
      and the empires took notice.
      I heard that first ragged volley
      and felt the earth tilt: this was no border quarrel.
      Within two years the whole world would be at war —
      Europe, America, India, the seas between —
      all from one shot fired by a young Virginian
      who couldn't have been more surprised than the French.
    description: "Washington's men fire on French soldiers at Jumonville Glen — the first shot of a world war."
    status: "published"
    sha256: "0aa1c6282e044b3c6fe3f2dc4cdb3d914385c3c07e1a473cf5ddc810b1e46612"
  - number: "2796"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "A King's College in New York"
    date: "1754 CE"
    region: "New York, British America"
    poem: |
      A college chartered by the king opened its doors
      in New York — King's College, loyal and Anglican,
      teaching the sons of merchants their Latin.
      I attended a lecture in its first term,
      eight students in a borrowed room,
      and thought it a small enough beginning.
      Small beginnings: this little loyal school
      would become Columbia, and outlive the king
      whose name it bore by two centuries and counting.
    description: "A college chartered by the king opens in New York — the seed of what will become Columbia."
    status: "published"
    sha256: "947c0f474590dcb626e53d77d0c5e9f6fa38fb84aa2335e858c863aa4222ec77"
  - number: "2797"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Day the Earth Shook the Faith"
    date: "1755 CE"
    region: "Lisbon, Portugal"
    poem: |
      On All Saints' Day the earth rose up and swallowed Lisbon —
      churches full of worshippers crushed in their prayers,
      the sea rushing in to finish what the quake began.
      Tens of thousands dead in a morning.
      I walked the ruins as the fires burned,
      and heard the question on every lip:
      how does a good God allow this?
      Voltaire would ask it in print;
      the priests had no good answer.
      Faith itself cracked that day, along with the cathedral walls.
    description: "An earthquake swallows Lisbon on All Saints' Day, and philosophers ask how a good God allows it."
    status: "published"
    sha256: "0c8c8aa9aa573a2053257e3f7a27d8a426c1fa3944e2e59a549aa5658d72059a"
  - number: "2798"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Book of Words"
    date: "1755 CE"
    region: "London, England"
    poem: |
      Nine years, alone, in a garret —
      Samuel Johnson fixed the English language
      between two covers: the Dictionary.
      Forty thousand words, defined with wit and growling common sense.
      Oats: a grain, which in England is generally given to horses,
      but in Scotland supports the people.
      I watched him finish the last page,
      this shambling giant of a man,
      and hand the language its mirror.
      Every word we speak still walks through his book.
    description: "Samuel Johnson's Dictionary fixes the English language between two covers — nine years in the making."
    status: "published"
    sha256: "2db570453016c36b750dae6c9d3310c774eda211437b26ef13b98875ff105743"
  - number: "2799"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Child Who Heard Music in Everything"
    date: "1756 CE"
    region: "Salzburg, Austria"
    poem: |
      In Salzburg a child was born
      who heard music in everything —
      Wolfgang Amadeus Mozart, and the world
      would never sound the same again.
      At five he was composing; at six, performing for emperors.
      I heard him play as a boy, tiny hands flying,
      and the room went silent the way rooms do
      before a miracle.
      He had thirty-five years. He filled them
      with more beauty than ten lifetimes.
    description: "Wolfgang Amadeus Mozart is born in Salzburg, and music will never be the same again."
    status: "published"
    sha256: "eb22a98025b319209d3e651e677c7933d184dd9756f793670055ef52a10c2661"
  - number: "2800"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The War That Swallowed the World"
    date: "1756 CE"
    region: "Europe"
    poem: |
      It started in Europe and swallowed the world —
      the Seven Years' War, fought on nearly every continent,
      on every ocean: America, India, Africa, the seas.
      Prussia against Austria, Britain against France,
      and a million dead before it ended.
      I walked battlefields from Quebec to Bengal,
      the same war wearing different uniforms,
      and understood: this was the first world war,
      a rehearsal for the century of slaughter to come.
    description: "The Seven Years' War erupts — the first war fought on nearly every continent and ocean."
    status: "published"
    sha256: "b7c8fad60a22a3e790aac42b8cba04355511a2d6baeb1a788a843ba8a9d6b441"
  - number: "2801"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Battle That Bought an Empire"
    date: "1757 CE"
    region: "Bengal, India"
    poem: |
      At Plassey, Robert Clive's small army
      broke the Nawab's great host —
      by bribery as much as battle —
      and a mere trading company began to swallow a subcontinent.
      I stood on that field in the Bengal heat
      and watched the East India Company
      become something no company had ever been:
      a ruler of millions, with ledgers for laws.
      An empire bought at a battle,
      paid for in other men's blood.
    description: "Clive wins at Plassey, and a mere trading company begins to swallow a subcontinent."
    status: "published"
    sha256: "07523ea930ed51f0799c79ea47ed4d688250ebc34a3140ef95cdaf3d6e1cbcf1"
  - number: "2802"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Knife That Missed the King"
    date: "1757 CE"
    region: "Paris, France"
    poem: |
      Damiens scratched Louis XV with a penknife —
      a scratch, no more — and for that
      they tore him apart in the public square,
      horses and hot irons, to Voltaire's horror.
      I turned away from the scaffold;
      some things a traveler should not watch.
      But Paris watched, and remembered,
      and thirty years later the crowd
      would take its revenge on kings
      with a neater machine.
    description: "Damiens scratches Louis XV with a penknife and is torn apart for it, to Voltaire's horror."
    status: "published"
    sha256: "ab1fe2d85cd45c555a597057df6433d432f0da7c2bba9c94827b1e50d0f4239b"
  - number: "2803"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Comet That Kept Its Appointment"
    date: "1758 CE"
    region: "The Heavens"
    poem: |
      Halley was dead, but his comet kept the appointment —
      it came blazing back on schedule,
      right when the dead man said it would.
      Proof, written across the sky in fire,
      that the heavens run like clockwork.
      I stood in a field with the astronomers that winter night,
      watching it climb, and felt the ground shift under reason:
      if a man could predict a comet's return,
      what else in the universe might be knowable?
    description: "Halley's comet returns on schedule — proof that the heavens run like clockwork."
    status: "published"
    sha256: "59901a17cbaa4176301c1c54c580d4b42fd76456fdb4cf1b584012d9e8959f8d"
  - number: "2804"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Fortress That Fell"
    date: "1758 CE"
    region: "Nova Scotia, British America"
    poem: |
      Louisbourg: France's great Atlantic fortress,
      stone walls and cannon against the sea —
      and the British took it, siege by grinding siege.
      I watched the walls crumble under the bombardment,
      the French flag come down in the smoke.
      With Louisbourg fell French sea power in the Atlantic;
      the road to Quebec lay open,
      and an empire's fate turned on a fortress
      at the edge of a cold northern sea.
    description: "The British take Louisbourg, breaking French sea power in the Atlantic."
    status: "published"
    sha256: "6a28a273a443758c79faba53b583e20be809cbb82f4b938386508fb08e908758"
  - number: "2805"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Battle on the Plains"
    date: "1759 CE"
    region: "Quebec, New France"
    poem: |
      On the Plains of Abraham, in fifteen minutes,
      two generals died and an empire changed hands.
      Wolfe, shot through, lived just long enough
      to hear the French were running;
      Montcalm, dying in Quebec, whispered his relief
      that he would not live to see the surrender.
      I walked that field at dusk, the dead of two nations
      lying in the same grass,
      and Canada passed to Britain while the sun went down.
    description: "Wolfe and Montcalm both die before Quebec, and Canada passes to Britain."
    status: "published"
    sha256: "3384189e9de9522a4bcc5606e9d846f1ed724f140456046c93881033d184f11d"
  - number: "2806"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Laugh That Mocked the World"
    date: "1759 CE"
    region: "Geneva, Switzerland"
    poem: |
      Voltaire wrote Candide in three days —
      a merry tale that skewered priests, philosophers,
      and optimists in one laughing stroke.
      This is the best of all possible worlds, said Pangloss,
      as the disasters piled up around him.
      I read it in Geneva and laughed until I wept,
      then wept a little at the truth of it:
      the world is not the best of anything,
      but a garden we must tend ourselves.
    description: "Voltaire's Candide skewers priests, philosophers, and optimists in one merry tale."
    status: "published"
    sha256: "5df90e42457abaab3e47b2321c5d517a0e464d49a2e653c3b6d680034cc97e63"
  - number: "2807"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Fire of Tacky"
    date: "1760 CE"
    region: "Jamaica, British West Indies"
    poem: |
      Tacky led them up from the plantations —
      hundreds of enslaved Africans, torches in hand —
      and Jamaica burned in its greatest uprising.
      For weeks they fought through the cane fields,
      free men taking back their lives with fire.
      The planters drowned it in blood in the end,
      as planters always did.
      I saw the smoke from Kingston harbor,
      black against the green hills,
      and knew: every chain forged
      is a rebellion waiting for its day.
    description: "Tacky leads enslaved rebels in Jamaica's great uprising; the planters drown it in blood."
    status: "published"
    sha256: "1596ce81f21893c7cfb334e4f25c03587768bcd6adfa17311dafa8f6d7c557c9"
  - number: "2808"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Young King Takes the Crown"
    date: "1760 CE"
    region: "London, England"
    poem: |
      George III ascended at twenty-two,
      a serious young man, determined to rule as well as reign —
      no more letting ministers run the kingdom
      while the king looked the other way.
      I watched the coronation crowds in London,
      all hope and bunting, and thought:
      here is a decent man with a heavy crown,
      and ahead of him the loss of America
      and a long slow slide into madness.
      The crown is a weight no head was built to bear.
    description: "George III ascends at twenty-two, determined to rule as well as reign."
    status: "published"
    sha256: "504e8ec048a4b886fdf559d721e454a244410814c3b5c4a3aa52726ab1dcdd43"
  - number: "2809"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Slaughter at Panipat"
    date: "1761 CE"
    region: "India"
    poem: |
      At Panipat the armies met like oceans —
      Ahmad Shah Durrani against the Marathas —
      and the field drank blood all day,
      one of the bloodiest days in history.
      A hundred thousand dead, the Maratha power broken,
      the road to British India left wide open.
      I walked that field when the vultures had finished,
      and the silence was the loudest thing I'd ever heard.
      Empires are built on days like this,
      and nobody who sees one ever forgets the smell.
    description: "Ahmad Shah Durrani crushes the Marathas at Panipat in one of history's bloodiest days."
    status: "published"
    sha256: "b1f47884e4360b4ddefca213b83e64679372cba915751639685e632c85ea4e00"
  - number: "2810"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Day the World Watched the Sun"
    date: "1761 CE"
    region: "The Heavens"
    poem: |
      Astronomers scattered across the globe —
      from Siberia to the Cape of Good Hope —
      all timed Venus crossing the face of the sun,
      to measure the size of the heavens themselves.
      I stood with one expedition in the cold dawn,
      watching the little black dot crawl across the fire,
      and felt the whole human race
      doing science together for the first time:
      one question, one sky, a hundred telescopes.
    description: "Astronomers across the globe time Venus crossing the sun to measure the size of the heavens."
    status: "published"
    sha256: "5d056f9382178f8b2f7727e2952af61638d42051983a1560219b0c5d300df66e"
  - number: "2811"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The German Princess Who Became Russia"
    date: "1762 CE"
    region: "St. Petersburg, Russia"
    poem: |
      A German princess seized the throne from her feeble husband —
      no blood on her own hands, just a coup in the night —
      and became Catherine the Great of Russia.
      She would reign for thirty-four years,
      write laws, build schools, collect art,
      and make Russia a power Europe had to reckon with.
      I saw her in the Winter Palace that first year,
      brilliant and utterly in command,
      and thought: the feeble husband never had a chance.
    description: "Catherine seizes the throne from her feeble husband and begins her long, brilliant reign."
    status: "published"
    sha256: "f8720c38a3cda60a49e394d65058a70d3ce9c0d38d1e428c8353abf423176275"
  - number: "2812"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Book That Said Man Is Born Free"
    date: "1762 CE"
    region: "Paris, France"
    poem: |
      Man is born free, and everywhere he is in chains —
      Rousseau wrote it, and the Social Contract
      declared that rightful rule rests on nothing
      but the people's will.
      No divine right. No ancient custom.
      Just the agreement of the governed.
      I read it in Paris and watched young men
      copy the dangerous sentences by hand.
      Within thirty years those words
      would be painted on banners and barricades,
      and kings would learn to fear a book.
    description: "Rousseau's Social Contract declares that rightful rule rests on nothing but the people's will."
    status: "published"
    sha256: "e76ec0a6a84c9db2b64f75452d9f33aa4e0342d3409c104a65f8c70afa00f2d1"
  - number: "2813"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Peace That Redrew the Map"
    date: "1763 CE"
    region: "Paris, France"
    poem: |
      The Treaty of Paris ended the world war:
      France lost an empire, Britain gained one —
      Canada, India, the seas, all changing hands
      in a gilded Paris room.
      I watched the diplomats sign away continents
      like merchants settling accounts,
      and thought of the soldiers dead in a dozen lands
      for lines drawn with a quill.
      The map was new. The resentments were old.
      France would not forget; America would not stay grateful.
    description: "The Treaty of Paris ends the world war; France loses an empire and Britain gains one."
    status: "published"
    sha256: "0605b1b3ec1dd72b0fa0daf6f845bb37251e218862013dda75b372c0744cea6d"
  - number: "2814"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Chief Who Said No"
    date: "1763 CE"
    region: "Great Lakes, British America"
    poem: |
      Pontiac said no.
      When the British took the French forts and treated
      the tribes like conquered subjects,
      the Ottawa chief raised the nations —
      and the frontier burned from Detroit to the Ohio.
      I traveled that burning country in the summer of the rising,
      forts besieged, supply lines cut,
      and saw what the British would learn slowly:
      this land had owners, and they were not done fighting.
      The rising failed. The warning stood.
    description: "Pontiac's warriors rise against the British forts, and the frontier burns from Detroit to the Ohio."
    status: "published"
    sha256: "2f9f8fff102321339b0e1ce2b520b00f6f04172ff9a66f7edf99717bcf45d969"
  - number: "2815"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Jenny That Spun Eight Threads"
    date: "1764 CE"
    region: "Lancashire, England"
    poem: |
      One worker, eight threads at once —
      Hargreaves' spinning jenny multiplied hands like magic.
      The spinners smashed the machines, of course;
      they always do, at first.
      I watched a jenny work in a Lancashire cottage,
      wheels turning, thread flying,
      and did the arithmetic of the future:
      eight threads, then sixteen, then eighty —
      the factory age arriving one multiplied hand at a time.
    description: "Hargreaves' spinning jenny lets one worker spin eight threads at once."
    status: "published"
    sha256: "e4941cb202b478e2f76423a1f6331e9fafc2b8139900bbffacd957cb5162a134"
  - number: "2816"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Book Against the Torturer"
    date: "1764 CE"
    region: "Milan, Austria"
    poem: |
      A young Milanese wrote against the rack and the noose —
      Beccaria's On Crimes and Punishments,
      denouncing torture and the death penalty
      in calm, reasonable, devastating prose.
      Punishment should fit the crime, he said,
      and never be cruel.
      I read it in a Milan bookshop and watched
      the judges' faces as the idea spread:
      within a generation, nations would rewrite their laws,
      and the torturer's trade would begin its long decline.
    description: "Beccaria's On Crimes and Punishments denounces torture and the death penalty."
    status: "published"
    sha256: "7378456610c5af84be176e040c8cb897ea1567451046db5617c3c57ccc964602"
  - number: "2817"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Tax on Paper"
    date: "1765 CE"
    region: "London, England"
    poem: |
      Parliament taxed every piece of paper —
      newspapers, contracts, playing cards, diplomas —
      the Stamp Act, reaching into every colonial pocket.
      And America learned to say no together:
      boycotts, riots, effigies hanging from liberty trees.
      I was in Boston when the news arrived,
      and watched thirteen quarreling colonies
      find one voice for the first time.
      A tax on paper taught them
      they were one people. The irony was perfect.
    description: "The Stamp Act taxes every colonial paper and document, and America learns to say no together."
    status: "published"
    sha256: "d3ccb2e7963f6ae2662c001cbf1d1ab96f4a6608bbd89d068e4ce1f993db95ee"
  - number: "2818"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The First Restaurant Opens Its Doors"
    date: "1765 CE"
    region: "Paris, France"
    poem: |
      Boulanger hung his sign in Paris —
      restoratives, soups to restore the weary traveler —
      and the pleasure of dining out was born.
      Before him: taverns and inns, eat what you're given.
      After him: a menu, a choice, a table of your own.
      I ate there in the first year, a simple broth,
      and never guessed this modest shop
      would become the restaurant, the bistro, the café —
      half of civilization conducted over a paid-for meal.
    description: "Boulanger hangs his sign in Paris, and the pleasure of dining out is born."
    status: "published"
    sha256: "ebd2d9691364720b341db5eb1d6c409d031b1f796dd52a136dc68f1da6397a4a"
  - number: "2819"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Invisible Fire"
    date: "1766 CE"
    region: "London, England"
    poem: |
      Henry Cavendish bottled the lightest stuff in the world —
      hydrogen, which he called inflammable air —
      a gas so light it rose through everything,
      invisible, and it burned.
      I watched him fill a bladder with it in his laboratory
      and hold a flame to the mouth: whoomph.
      The age was learning that air was not one thing
      but many, each with its secrets.
      Within twenty years men would fly in it;
      within two hundred, they'd split it for the sun's own fire.
    description: "Henry Cavendish bottles hydrogen, the lightest stuff in the world, and names it inflammable air."
    status: "published"
    sha256: "864febe7c6133663edb4913e58bc46511919d46d655c9746f17b06f86aab8ed7"
  - number: "2820"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Tax Repealed, the Claim Kept"
    date: "1766 CE"
    region: "London, England"
    poem: |
      Parliament repealed the Stamp Act —
      the colonists cheered, the bells rang —
      but in the same breath declared it could bind America
      in all cases whatsoever.
      Repeal with one hand, a claim of absolute power with the other.
      I read the Declaratory Act in a London coffeehouse
      and shook my head: they had learned nothing.
      You cannot tell free men you own them
      and expect gratitude for lifting one tax.
      The next fight was already loading.
    description: "Parliament repeals the Stamp Act but declares it may bind America in all cases whatsoever."
    status: "published"
    sha256: "546ec29934e1933d17159a6d1344a10672429fc1dad80f37c77500935900e4a2"
  - number: "2821"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Empress Who Wrote the Law"
    date: "1767 CE"
    region: "St. Petersburg, Russia"
    poem: |
      Catherine wrote the Nakaz — her Instruction —
      to guide her lawmakers in enlightenment:
      equality before the law, proportionate punishment,
      torture abolished, serfs treated as human.
      All Europe read it and applauded.
      I held a copy in St. Petersburg, beautifully printed,
      and admired the words — while outside the palace
      the serfs remained serfs, and the knout remained the knout.
      The age of enlightened despots in one document:
      magnificent principles, and the power to ignore them.
    description: "Catherine's Nakaz instructs her lawmakers in enlightenment, and all Europe reads it."
    status: "published"
    sha256: "30df566bc0c9bc33194b2228f82d5969b1e01f57ae162d6013512810939f8948"
  - number: "2822"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Taxes on Tea and Glass"
    date: "1767 CE"
    region: "London, England"
    poem: |
      Tea, glass, paper, paint —
      the Townshend Acts taxed colonial imports one by one,
      and the boycotts spread from Boston to Charleston.
      Homespun instead of British cloth;
      no tea in the pot but the smuggled kind.
      I walked through Boston's empty warehouses that winter
      and saw the merchants' ledgers bleeding red.
      Britain was taxing a people
      who had already decided they were not subjects.
      The harbor would answer soon enough.
    description: "The Townshend Acts tax colonial imports, and boycotts spread from Boston to Charleston."
    status: "published"
    sha256: "8e38e26671d4c51ee4179ad9f9f5783e4b5670e67fbdef2514c0d5ff1c0fc817"
  - number: "2823"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Ship That Sailed for the Stars"
    date: "1768 CE"
    region: "Plymouth, England"
    poem: |
      The Endeavour sailed from Plymouth
      to watch Venus cross the sun —
      a scientific errand, officially —
      then to hunt the great southern continent,
      unofficially, and claim what it found.
      Cook: the finest navigator of the age,
      with Banks the botanist beside him.
      I stood on the Plymouth Hoe as the sails shrank,
      and felt the old thrill: a ship bound past the edge of the map,
      carrying science, empire, and doom in one hull.
    description: "Cook's Endeavour departs to watch Venus cross the sun, then to hunt the great southern continent."
    status: "published"
    sha256: "80007e35f91673ca2fbe4e8fcb761045c6fced02bc8b69a5109a2b6cc760ddb1"
  - number: "2824"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The First Circus"
    date: "1768 CE"
    region: "London, England"
    poem: |
      Philip Astley opened his riding ring in London —
      horses, riders, tumblers, clowns —
      and the modern circus was born.
      No kings, no priests, no philosophy:
      just wonder, for the price of a ticket.
      I sat in the sawdust seats that first season,
      cheering with the crowd as the riders stood
      on galloping horses' backs,
      and thought: humanity needs this —
      a place where the impossible is the whole point.
    description: "Philip Astley opens his riding ring in London, and the modern circus is born."
    status: "published"
    sha256: "9602ed4b7f803aa601b35b4e2e407b1a593e7292f16c7de87ff059873959be28"
  - number: "2825"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Separate Condenser"
    date: "1769 CE"
    region: "Glasgow, Scotland"
    poem: |
      James Watt stared at a wheezing steam engine
      and saw the waste in it — the cylinder
      heated and cooled, heated and cooled —
      and invented the separate condenser.
      A small change. A world change.
      I watched him test it in a Glasgow workshop,
      the engine breathing easy at last,
      and understood: the world was about to run on steam,
      and this quiet Scotsman had just handed it the key.
    description: "James Watt patents his improved steam engine, and the world begins to run on steam."
    status: "published"
    sha256: "f94bbd2c3647d224201d609ee82d4cf8376d1fbf8dc3b43726e402dec2a56181"
  - number: "2826"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Mill That Never Slept"
    date: "1769 CE"
    region: "Lancashire, England"
    poem: |
      Arkwright's water frame spun thread by waterpower —
      day and night, never tiring, never sleeping —
      and the factory age dawned on a Lancashire riverbank.
      I stood in the roar of that first mill,
      the frames clattering, the water thundering,
      children tending machines taller than themselves.
      The cottage was finished; the factory had begun.
      No one there that day could imagine
      what those mills would make — and unmake.
    description: "Arkwright's water frame spins thread by waterpower, and the factory age dawns."
    status: "published"
    sha256: "292d5068e2b6157797e7bcd146243da7f53dff0069999556d4c127fc537fbbc8"
  - number: "2827"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Snow, the Shots, the Five Dead"
    date: "1770 CE"
    region: "Boston, Massachusetts"
    poem: |
      Snow on King Street. A jeering crowd.
      British soldiers, nervous, outnumbered —
      then the shots, and five men down in the snow.
      Crispus Attucks first: a free Black man,
      the first to die for American liberty.
      I was there in the cold, and heard the volley,
      and saw Boston turn those five dead
      into martyrs overnight.
      The colonies had their blood now;
      there is no going back after blood.
    description: "British soldiers fire on a Boston mob; five lie dead, and the colonies have their martyrs."
    status: "published"
    sha256: "440bb1bce14b78bcf1657453e53be0c62895db6f6841afcc71696f28ac10b6b3"
  - number: "2828"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Storm-Child of Bonn"
    date: "1770 CE"
    region: "Bonn, Germany"
    poem: |
      In Bonn a boy was born to a drunkard father
      and a hard childhood — Ludwig van Beethoven,
      who would make music roar like thunder.
      Deaf by middle age, he heard it all inside:
      symphonies no ear but his would ever truly hear.
      I watched him as a boy, pounding the keys
      through his father's beatings,
      and thought: suffering is forging something here —
      a storm with a human face, and music as its lightning.
    description: "Ludwig van Beethoven is born in Bonn — the boy who will make music roar like thunder."
    status: "published"
    sha256: "790e6aeff41e547af6ca850ab2a76777510eb83549bd8539aa70fdccd752434b"
  - number: "2829"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Scottish Book of Everything"
    date: "1771 CE"
    region: "Edinburgh, Scotland"
    poem: |
      Three stout volumes, printed in Edinburgh —
      the first Encyclopaedia Britannica,
      all useful knowledge, A to somewhere past B.
      (It would take a century to finish the alphabet.)
      I bought a set from a bookseller on the High Street,
      heavy as bricks, smelling of fresh ink,
      and lugged them home like treasure.
      The Scots had decided knowledge should be orderly,
      portable, and sold by subscription.
    description: "The first Encyclopaedia Britannica is completed — three stout volumes of useful knowledge."
    status: "published"
    sha256: "6e9b00295cd2d1fc8a3fa00ae687a25d03f419a3c5b88d230bdfbbc66ef706b8"
  - number: "2830"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Slave Who Sued for Freedom"
    date: "1772 CE"
    region: "London, England"
    poem: |
      James Somerset was enslaved in Virginia,
      brought to England, and ran —
      and when his master seized him for Jamaica,
      he sued for his freedom in an English court.
      Lord Mansfield ruled: slavery had no basis in English law.
      One man walked out of that courtroom free,
      and the whole slave trade shuddered.
      I was in the gallery when the judgment came down,
      and watched the planters' faces go white:
      their empire of chains had just met the law.
    description: "Lord Mansfield's Somerset ruling frees an enslaved man and shakes the whole slave trade."
    status: "published"
    sha256: "2c243f9735fa15137f4a1ec09cef9a9f15697fcc965fe3aa2f7a9e11d19075b5"
  - number: "2831"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Country Carved Like a Cake"
    date: "1772 CE"
    region: "Poland"
    poem: |
      Russia, Prussia, and Austria sat down together
      and carved up Poland like a cake —
      a slice for each, no permission asked,
      the first partition of a living nation.
      I was in Warsaw when the news came,
      and watched a country learn it had been divided
      by its neighbors' dinner conversation.
      Poland would be carved twice more,
      then vanish from the map entirely —
      the century's lesson in what happens
      when your neighbors are hungry and you are not strong.
    description: "Russia, Prussia, and Austria carve up Poland among themselves in the first partition."
    status: "published"
    sha256: "e1685507beb57352d3d0540d6dc6a5bb32c7b06de9e9d58ca35db051b2aacd57"
  - number: "2832"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Tea in the Harbor"
    date: "1773 CE"
    region: "Boston, Massachusetts"
    poem: |
      Disguised as Mohawks, with hatchets and nerve,
      the Bostonians boarded the tea ships at night
      and heaved three hundred chests into the harbor.
      The tea steeped; the harbor turned brown;
      Britain turned purple with rage.
      I watched from the wharf as the chests splashed,
      the crowd cheering each one,
      and knew: this was no protest anymore.
      This was a people daring an empire to do its worst.
    description: "Disguised as Mohawks, Bostonians heave British tea into the harbor."
    status: "published"
    sha256: "4ee9a4a4185b344952cb1c6c5fcb5f5e13099c033870b316422576b5fd875342"
  - number: "2833"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Enslaved Poet of Boston"
    date: "1773 CE"
    region: "London, England"
    poem: |
      Her poems were published in London —
      Phillis Wheatley, enslaved in Boston,
      writing verses in the style of the ancients
      that shamed her masters with their brilliance.
      Genius in chains. I read her book
      and thought of the lie it killed:
      that the enslaved had no minds worth freeing.
      Every line she wrote was an argument
      no auction block could answer.
    description: "Phillis Wheatley's poems are published in London — genius in chains that shames her masters."
    status: "published"
    sha256: "6e846b9576e89a45675f959296a38836730379b1a93ccc4315d726a5d606d635"
  - number: "2834"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Library of Ten Thousand Books"
    date: "1773 CE"
    region: "Beijing, China"
    poem: |
      Qianlong commanded it: gather all Chinese learning
      into one vast library — the Siku Quanshu,
      tens of thousands of volumes, copied by hand,
      the greatest book project on earth.
      But the emperor's scholars also burned
      what the emperor disliked: thousands of books
      declared dangerous, gone forever.
      I walked the copying halls in Beijing,
      brushes scratching in unison,
      and saw the double edge of it:
      the greatest library ever built,
      and the greatest book-burning beside it.
    description: "Qianlong commands the Siku Quanshu, gathering all Chinese learning into one vast library."
    status: "published"
    sha256: "95b155f0e46bf9f89480f7001a99a49a252a52230f7916addf9dd6dbb5af02e6"
  - number: "2835"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Congress That Dared to Meet"
    date: "1774 CE"
    region: "Philadelphia, Pennsylvania"
    poem: |
      Twelve colonies sent their delegates to Philadelphia —
      farmers, lawyers, merchants, firebrands —
      to answer Britain with a single voice.
      They had quarreled for a century; now they agreed on one thing:
      no.
      I sat in the gallery of Carpenters' Hall
      and watched America invent itself in a room,
      one speech at a time.
      The Congress dared to meet; the meeting
      dared to become a nation.
    description: "Delegates from twelve colonies gather in Philadelphia to answer Britain with a single voice."
    status: "published"
    sha256: "36fa23fd3d39be8737d85438f76709c247d947ea3dbdb5a93e2d3daa97fbf2d4"
  - number: "2836"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Sorrows of the Young Romantic"
    date: "1774 CE"
    region: "Weimar, Germany"
    poem: |
      Goethe wrote of young Werther's hopeless love,
      and Europe wept itself sick over him —
      young men dressed like Werther, talked like Werther,
      and some, God help them, died like Werther.
      I read it in Weimar and watched the fever spread:
      heartbreak had become fashionable,
      feeling had become the highest truth.
      The Romantics were coming, and reason
      was about to get a run for its money
      from a generation that preferred to swoon.
    description: "Goethe's Werther makes heartbreak fashionable, and young men weep across Europe."
    status: "published"
    sha256: "fe09609e9af0c43402aeb0b412a5a0bbcef8a6f691243d76cb508757850b3a1f"
  - number: "2837"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Shot Heard Round the World"
    date: "1775 CE"
    region: "Massachusetts, British America"
    poem: |
      At Lexington, at dawn, the redcoats faced the farmers —
      someone fired; nobody knows who —
      and at Concord the farmers fired back,
      and the war for independence began.
      I heard that shot on the village green,
      a crack in the cold morning air,
      and felt it travel: across the ocean,
      across the century, around the world.
      Emerson would call it the shot heard round the world,
      and he was right — we're still hearing it.
    description: "At Lexington and Concord, farmers fire on redcoats, and the war for independence begins."
    status: "published"
    sha256: "48763b1e7db231201e9c1295e6d00a0f1b7deaf356f73884c5891ef1583c011e"
  - number: "2838"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Cossack Who Crowned Himself"
    date: "1775 CE"
    region: "Russia"
    poem: |
      Pugachev the Cossack crowned himself emperor —
      a pretender with a peasant army —
      and half of Russia rose: serfs, miners, tribesmen,
      burning manor houses from the Volga to the Urals.
      Catherine crushed him in the end, of course;
      they brought him to Moscow in a cage.
      I watched the rebellion burn itself out
      and saw the empress's age of mercy end with it:
      after Pugachev, there would be no more gentle reforms,
      only the knout, held tighter.
    description: "Pugachev's great peasant rebellion is crushed, and Catherine's age of mercy comes to an end."
    status: "published"
    sha256: "624538eab5e2aad4493a7ae9ee5a409e0f22c7cbfb6088bfdcf1735397bd6e3b"
  - number: "2839"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "Fifty-Six Names on Parchment"
    date: "1776 CE"
    region: "Philadelphia, Pennsylvania"
    poem: |
      In a sweltering Philadelphia hall,
      fifty-six men signed their names to treason —
      a declaration that all men are created equal,
      written by the red-haired Virginian,
      signed at the risk of every neck in the room.
      I watched them step up one by one,
      quills scratching, sweat on their brows.
      They were signing their death warrants
      if the war went wrong — and they knew it.
      The boldest signatures in history,
      written in the hottest summer of the century.
    description: "In a sweltering hall, fifty-six men sign a declaration that all men are created equal."
    status: "published"
    sha256: "38091fa7d67ac8b9ed86434e5ed6659cfaace079f4bf30ccb57c33c120b1fc28"
  - number: "2840"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Book That Set the Market Free"
    date: "1776 CE"
    region: "London, England"
    poem: |
      Adam Smith argued that free hands
      bake more bread than commanded ones —
      the Wealth of Nations, the market's bible:
      let men trade, let prices speak,
      and the invisible hand will do the rest.
      I read it in London the year it appeared
      and watched merchants nod along,
      already living what Smith described.
      Empires had tried to command prosperity
      for a thousand years; Smith said: stop commanding.
      The world has been arguing with him ever since.
    description: "Adam Smith's Wealth of Nations argues that free hands bake more bread than commanded ones."
    status: "published"
    sha256: "c7d438aacd11ac2568cdf6c35334bc29be705658c3b555bcd0eba8776f8152c7"
  - number: "2841"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Captain's Last Voyage"
    date: "1776 CE"
    region: "Plymouth, England"
    poem: |
      Cook sailed on his third voyage,
      seeking the Northwest Passage through the Arctic ice —
      the great navigator, at the height of his powers,
      sailing toward the voyage that would kill him.
      I watched the Resolution leave Plymouth Sound,
      flags flying, and felt the old foreboding:
      the Pacific had given him glory twice;
      the third time, it would take payment.
      He never came home. The sea keeps
      its greatest sailors in the end.
    description: "Cook sails on his third voyage, seeking the Northwest Passage, never to return."
    status: "published"
    sha256: "aeec6ba4a46db5625292374be52e0b9eb85ee974d4a44567bf00030e859a4364"
  - number: "2842"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Turning of the Tide"
    date: "1777 CE"
    region: "New York, British America"
    poem: |
      Burgoyne surrendered at Saratoga —
      an entire British army, laying down its arms
      in the New York wilderness —
      and France decided America might win after all.
      I walked that surrender field in October,
      redcoats stacking their muskets,
      Americans trying not to grin too wide.
      The war's tide turned that day:
      with French ships and French gold coming,
      the rebellion became a revolution
      the world had to take seriously.
    description: "Burgoyne surrenders at Saratoga, and France decides America might win after all."
    status: "published"
    sha256: "bdd7f58b6f846b8519764e9124a36262658acd5ea937c3e6661aafcccf27a77d"
  - number: "2843"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Winter That Forged an Army"
    date: "1777 CE"
    region: "Pennsylvania, USA"
    poem: |
      At Valley Forge they starved and froze —
      no shoes, no coats, no pay, no food —
      and learned to be soldiers anyway.
      Washington held them together by will alone;
      von Steuben drilled them into an army
      in the snow.
      I walked that frozen camp in February,
      men's feet wrapped in rags, breath white in the air,
      and watched a rabble become a force.
      Nations are not born in declarations;
      they are born in winters like this.
    description: "At Valley Forge the Continental Army starves, freezes, and learns to be soldiers."
    status: "published"
    sha256: "d0f0db721832df845031eaa24602eebdf6e6fd88ea1105135a07f5f900eb791f"
  - number: "2844"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Two Old Lions Fall"
    date: "1778 CE"
    region: "Paris, France"
    poem: |
      Within weeks of each other they died —
      Voltaire, the laughing philosopher, and Rousseau,
      the scold of civilization, both old lions of the Enlightenment.
      Paris buried its prophets in the same season
      it was learning to live without them.
      I attended both funerals, and felt the age turn:
      the men who'd taught France to think
      were gone, and their students were restless.
      Eleven years later the students
      would put the lessons into practice — with a guillotine.
    description: "Voltaire and Rousseau die within weeks of each other; the Enlightenment buries its prophets."
    status: "published"
    sha256: "78b81199a858dd2127d80b6d547ca70f8ce875263d2192d9ce1ed3f08764087a"
  - number: "2845"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Islands in the Middle of the Sea"
    date: "1778 CE"
    region: "Hawaii, Pacific"
    poem: |
      Cook found them at the very heart of the ocean —
      green volcanic islands, a paradise
      no European had ever seen —
      and named them for an English earl: the Sandwich Islands.
      I went ashore with the landing party,
      breadfruit and waterfalls, surfers riding the waves,
      a people living in abundance.
      Hawaii. The middle of the sea.
      The sailors thought they'd found Eden;
      Eden, as always, would not survive being found.
    description: "Cook names them the Sandwich Islands — paradise found at the very heart of the ocean."
    status: "published"
    sha256: "66795d81c110dd59e472313e1df3dd583e9a8a126eb5177e8edb039bbdbe3f7e"
  - number: "2846"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Captain Who Did Not Come Home"
    date: "1779 CE"
    region: "Hawaii, Pacific"
    poem: |
      It started over a stolen boat —
      a quarrel on the beach at Kealakekua,
      and ended with Captain Cook dead in the surf,
      the greatest navigator of the age
      killed by the people of his paradise.
      I was offshore when the news reached the ships,
      and watched the crew's disbelief turn to grief.
      He had mapped half the Pacific;
      the Pacific kept him.
      They buried what the Hawaiians returned
      at sea, with full honors, in the bay he'd named.
    description: "In a quarrel over a stolen boat, Hawaiians kill Cook on the beach at Kealakekua."
    status: "published"
    sha256: "64404013604285a1236b84249a5379906b34430e4a7f692b1192f027e9ac8d3b"
  - number: "2847"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Bridge Made of Iron"
    date: "1779 CE"
    region: "Shropshire, England"
    poem: |
      Over the Severn in Shropshire they raised it —
      the world's first iron bridge,
      an arch of fire-forged metal spanning the river,
      built like a giant's Meccano, no bolts, just fit.
      I walked across it the week it opened,
      my boots ringing on iron,
      and felt the future under my feet:
      stone had ruled for five thousand years;
      now iron would carry the world.
    description: "The world's first iron bridge rises over the Severn — an arch of fire-forged metal."
    status: "published"
    sha256: "0cb9bd897ddd534017f387969e70d29c3dbc6c2f66be2947f95c7980642e3104"
  - number: "2848"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The General Who Sold His Name"
    date: "1780 CE"
    region: "New York, USA"
    poem: |
      Benedict Arnold: the bravest officer in the American army,
      the hero of Saratoga — and he sold it all
      for British gold and a general's commission.
      The plot failed; his name didn't survive it.
      I was in the American camp when the treason broke,
      and watched men's faces as they understood:
      their hero had been bargaining with the enemy.
      Arnold escaped. His name became the word for traitor,
      in every language that has one.
    description: "Benedict Arnold's treason is unmasked, and his name becomes the word for traitor."
    status: "published"
    sha256: "47cef2a3551d8af6a4cc48017c2cf57d2cd366ebfe51af6434cc3531318fc7b2"
  - number: "2849"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Siege That Ended the War"
    date: "1781 CE"
    region: "Virginia, USA"
    poem: |
      Washington and the French trapped Cornwallis at Yorktown —
      land and sea both closed, the noose tightening
      week by week, trench by trench —
      until the British marched out and laid down their arms.
      I watched the surrender from the American lines,
      the band playing (they say) The World Turned Upside Down.
      Six years of war ended in a Virginia field,
      and Britain's American war was lost.
      A new nation had been sieged into existence.
    description: "Washington and the French trap Cornwallis at Yorktown, and Britain's American war is lost."
    status: "published"
    sha256: "b0d6d234e9398baaf2ff7b4f713276be6aeb741058d0b2f01f4edaa518cc2671"
  - number: "2850"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Ship That Threw Men Overboard"
    date: "1781 CE"
    region: "The Atlantic"
    poem: |
      The Zong was running low on water,
      so the crew threw 142 enslaved Africans overboard —
      drowned them, one by one, for the insurance money.
      Murder, filed as a cargo claim.
      I read the court records in London afterward,
      the owners suing the insurers for their lost "goods,"
      and felt sick: this was the slave trade
      with its mask off, doing arithmetic with lives.
      England was sickened too — and the abolitionists
      finally had the horror story they needed.
    description: "The Zong's crew drowns 142 enslaved Africans for the insurance money, and England is sickened."
    status: "published"
    sha256: "e5fb3cb58aade206bfa4940297c6cfb5b087624c7f7a843947eb088f9a2e5a25"
  - number: "2851"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Musician Who Found a New World"
    date: "1781 CE"
    region: "Bath, England"
    poem: |
      William Herschel was an organist in Bath
      who built telescopes in his spare time —
      and one March night he spotted Uranus,
      the first new planet in recorded history.
      A musician found a world.
      I looked through his great telescope afterward,
      at the pale green disk swimming in the eyepiece,
      and thought: the sky just got bigger.
      For all of human history there were six planets;
      now there were seven, because a church musician looked up.
    description: "Organist William Herschel spots Uranus — the first new planet in recorded history."
    status: "published"
    sha256: "890154385f65433f8e1a51c044cdb5e2d3e9d413a3d43323f4b9027b6888ece8"
  - number: "2852"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Engine That Learned to Turn"
    date: "1782 CE"
    region: "Birmingham, England"
    poem: |
      Watt did it again: the rotary steam engine —
      not just pumping up and down anymore,
      but turning a wheel, round and round,
      a wheel that never tired.
      I watched it drive a mill in Birmingham,
      belts and shafts spinning off that one iron heart,
      and saw the whole industrial future in it:
      factories, locomotives, ships —
      everything that turns, turning because
      a Scotsman taught steam to go in circles.
    description: "Watt patents the rotary steam engine, giving factories a wheel that never tires."
    status: "published"
    sha256: "c4aab4c985e3d15d813e803d8636927be090277c29707a51cab7911bc37fddb4"
  - number: "2853"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Battle That Saved Jamaica"
    date: "1782 CE"
    region: "The Caribbean"
    poem: |
      Rodney smashed the French fleet at the Saintes —
      broke their line, took their flagship —
      and Britain kept its sugar islands.
      I watched the battle from a frigate's deck,
      cannon smoke hiding the sea,
      and understood the arithmetic of empire:
      Jamaica's sugar was worth more than armies,
      and this victory kept the sweet trade British.
      France's American revenge ended in Caribbean water;
      the planters slept safe, and the enslaved did not.
    description: "Rodney smashes the French fleet at the Saintes, and Britain keeps its sugar islands."
    status: "published"
    sha256: "7f7b5c618f75a858318cfaae6eeb71f33c0d8303ae6697cd0d852b9c0a3a5a66"
  - number: "2854"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Marathas Rise Again"
    date: "1782 CE"
    region: "India"
    poem: |
      Mahadji Scindia forced the British to the peace table at Salbai —
      the Marathas, broken at Panipat twenty years before,
      rising again to humble the East India Company.
      I was in the Maratha camp during the negotiations,
      and watched British envoys learn respect:
      India was not yet theirs, not by a long road.
      The treaty held for twenty years of peace —
      a pause in the long swallowing,
      a reminder that the subcontinent had teeth.
    description: "Mahadji Scindia forces the British to the peace table at Salbai, and Maratha power rises again."
    status: "published"
    sha256: "78155061396a16e5ad2fe2dcb9957146ff2ad6a9107284aceacd7e55bde5041e"
  - number: "2855"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Peace That Made a Nation"
    date: "1783 CE"
    region: "Paris, France"
    poem: |
      In Paris they signed it: American independence,
      recognized by the king of England himself —
      a new nation stepping onto the world's stage,
      all thirteen colonies of it, raw and hopeful.
      I walked the Paris streets that autumn
      among celebrating Americans,
      and thought of the farmers at Lexington,
      the frozen men at Valley Forge:
      their gamble had paid. The parchment said so.
      The experiment was about to begin for real.
    description: "The Treaty of Paris recognizes American independence; a new nation steps onto the stage."
    status: "published"
    sha256: "a47947b5484f07cee4a8167704994f1ff10888c831af899f8c6bba3951e3c588"
  - number: "2856"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The General Who Laid Down His Sword"
    date: "1783 CE"
    region: "Annapolis, Maryland"
    poem: |
      He could have been king. Everyone knew it —
      the army would have followed him anywhere.
      Instead Washington walked into Congress at Annapolis
      and resigned his commission,
      a victorious general surrendering power of his own will.
      I was in the chamber when he laid down his sword,
      and heard the silence: kings in Europe
      were calling it the greatest act of the age.
      Cincinnatus, come again —
      the man who won everything and took nothing.
    description: "Washington resigns his commission — a victorious general surrendering power of his own will."
    status: "published"
    sha256: "8d8435361d2026453a66ac3ecbb2f5d5b888111fafff019f34966160ec38669a"
  - number: "2857"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Brothers Who Taught Fire to Fly"
    date: "1783 CE"
    region: "Annonay, France"
    poem: |
      Two paper-makers' sons in Annonay
      filled a great silk bag with hot air —
      and it rose. The Montgolfiers' balloon
      climbed over France, and mankind left the ground.
      I watched that first ascent, the crowd gasping
      as the impossible floated upward,
      and felt the oldest dream come true:
      since Icarus, we'd wanted the sky.
      Now we had it — in a bag, with fire,
      for as long as the hot air lasted.
    description: "The Montgolfiers' hot-air balloon rises over France, and mankind leaves the ground."
    status: "published"
    sha256: "cc42f6e36ff388a2307fbc334cbcc564b0fea14b3c78bba4ebe1b549629f9d79"
  - number: "2858"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Barber Who Mocked the Count"
    date: "1784 CE"
    region: "Paris, France"
    poem: |
      Beaumarchais wrote a comedy about a barber
      who outwits his aristocratic master —
      Figaro, laughing at counts and privilege —
      and all Paris laughed with the revolution in its throat.
      The king tried to ban it; Paris demanded it.
      I sat in the theater on opening night,
      the audience roaring at every insult to rank,
      and thought: this is how it starts —
      not with cannon, but with laughter,
      the sound of authority losing its dignity.
    description: "Beaumarchais' Marriage of Figaro laughs at aristocrats, and revolution laughs with it."
    status: "published"
    sha256: "fdbc85a6f6cef185143f28a30f1dd76db9117d26212049f56a3b31122055606d"
  - number: "2859"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Oath Before the Battle"
    date: "1784 CE"
    region: "Paris, France"
    poem: |
      David painted three brothers, arms outstretched,
      swearing to die for Rome —
      the Oath of the Horatii, all straight lines and sacrifice —
      and the coming revolution found its favorite picture.
      I stood before it in the Paris salon,
      the crowd thick around the canvas,
      and watched young radicals drink it in:
      this was how they wanted to see themselves —
      stern, united, ready to die for the republic.
      Art had handed the revolution its mirror.
    description: "David paints three brothers swearing to die for Rome, and the coming revolution finds its favorite picture."
    status: "published"
    sha256: "7c86cf6a551ceaf5150025f660801b9ed669de3bb58beb585b74a46bc17f3cb7"
  - number: "2860"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Loom That Wove Itself"
    date: "1785 CE"
    region: "England"
    poem: |
      Cartwright's power loom wove by steam —
      no hands on the shuttle, no feet on the treadle —
      cloth pouring out like water from a tap.
      The handloom weavers' doom was sealed that year,
      though it would take them decades to understand it.
      I watched the loom work in a mill at dawn,
      the pattern emerging with no weaver in sight,
      and felt the old world of the craftsman
      give way to the new world of the machine.
    description: "Cartwright's power loom weaves by steam, and the handloom weavers' doom is sealed."
    status: "published"
    sha256: "df8d8323a07a0e7c64090908e7125d61bfc0700caa5db4716c2e2ce5b9b02c26"
  - number: "2861"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Necklace That Ruined a Queen"
    date: "1785 CE"
    region: "Paris, France"
    poem: |
      A diamond necklace, worth a fortune —
      a cardinal fooled, a queen impersonated,
      a scandal that blackened Marie Antoinette's name
      beyond repair, though she was innocent of it.
      I followed the trial in Paris, the pamphlets flying,
      and watched the people's love turn to venom:
      the Austrian woman, the spendthrift, the cheat.
      A necklace did what no enemy could —
      it made the queen hateful before the revolution
      ever laid a hand on her.
    description: "The diamond necklace scandal blackens Marie Antoinette's name beyond repair."
    status: "published"
    sha256: "afa454957f54155b444582b86b8e4a34e95e48e5b6d05585271d83668b7f8bd6"
  - number: "2862"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Farmers Who Shut the Courts"
    date: "1786 CE"
    region: "Massachusetts, USA"
    poem: |
      Debt-crushed farmers followed Daniel Shays
      against the Massachusetts courts —
      shut them down, seized the arsenals,
      demanded the foreclosures stop.
      The rebellion failed, but it frightened the nation
      into building a stronger union:
      the Articles were too weak, everyone saw it now.
      I walked with the Shays men one cold march,
      honest farmers turned rebels by debt,
      and understood: America would need a real government,
      or it would tear itself apart farm by farm.
    description: "Debt-crushed farmers follow Daniel Shays against the courts, frightening the nation into a stronger union."
    status: "published"
    sha256: "94284bfdfe7a3a002567a472d8c72c90812d346c29dd5c83eaa0c6978cdbb5be"
  - number: "2863"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Summer That Wrote the Rules"
    date: "1787 CE"
    region: "Philadelphia, Pennsylvania"
    poem: |
      Behind closed doors, through a sweltering summer,
      they wrote the rules: the Constitutional Convention,
      Washington presiding, Franklin dozing and waking
      to say the wise thing at the wise moment.
      I slipped into the gallery once, unnoticed,
      and watched them argue the republic into being —
      compromise by compromise, clause by clause.
      No trumpets, no crowds: just men in a hot room,
      writing the frame the whole experiment would hang on.
    description: "Behind closed doors, the Constitutional Convention writes America's frame of government."
    status: "published"
    sha256: "245a868a954d0ac382eeacc8bcd400b6bb8f120a7b71cb9c666b24ee4ec44e8b"
  - number: "2864"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Committee That Said No More"
    date: "1787 CE"
    region: "London, England"
    poem: |
      Twelve men in a London printing shop —
      Quakers and Anglicans together —
      founded the society to abolish the slave trade.
      Twelve. Against the richest trade on earth.
      I sat in on their meetings, all minutes and resolve,
      and watched them plan the long campaign:
      pamphlets, petitions, the diagram of a slave ship
      that would sicken a nation.
      They said: no more. And twenty years later,
      the trade was dead by law.
    description: "Twelve men, Quakers and Anglicans together, found the society to abolish the slave trade."
    status: "published"
    sha256: "3974d428ad6a11bf51a386d3a6cbd9bff325839f866aadb063f96352c564ad4f"
  - number: "2865"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Prison Ships Land"
    date: "1788 CE"
    region: "Sydney Cove, Australia"
    poem: |
      The First Fleet landed its convicts at Botany Bay —
      thieves and poachers, Irish rebels and pickpockets —
      and European Australia began in chains.
      I watched them stumble ashore at Sydney Cove,
      gaunt from the eight-month voyage,
      a prison camp that would become a nation.
      The Aboriginal people watched from the treeline,
      and their long sorrow began that day —
      two histories colliding on one beach,
      one of them written in leg-irons.
    description: "The First Fleet lands its convicts at Botany Bay, and European Australia begins."
    status: "published"
    sha256: "2c94bde832693b037453c632f05170cc2314d38b841496b2f3374210697bec11"
  - number: "2866"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Captain Who Never Came Home"
    date: "1788 CE"
    region: "The Pacific"
    poem: |
      La Pérouse sailed into the Pacific
      with two fine ships and France's hopes —
      and vanished. No word, no wreckage,
      nothing for decades.
      I was in Paris when the years of waiting began,
      the maps with his route drawn hopefully,
      the rumors from every South Sea trader.
      France's Cook, swallowed by the same ocean
      that had taken the English one.
      Some voyages end in harbors; his ended in mystery.
    description: "La Pérouse's expedition vanishes in the Pacific, and France waits decades for word."
    status: "published"
    sha256: "64fa8276d096b14d2325fe0ab3771a18840ad6a265aed2f2f8dd7ffe4f05f875"
  - number: "2867"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Fortress That Fell in a Day"
    date: "1789 CE"
    region: "Paris, France"
    poem: |
      On July 14th the Paris mob stormed the Bastille —
      the old fortress, the king's prison —
      and tore it down stone by stone.
      Seven prisoners inside; a revolution outside.
      I was in the streets that day, the air electric,
      the crowd roaring as the gates gave way,
      and felt the old order tremble to its foundations.
      Kings across Europe heard the news
      and went pale: if Paris could do this,
      what was safe?
    description: "The Bastille falls to the Paris mob on July 14th, and the old order trembles."
    status: "published"
    sha256: "71cf9e818d7f06687b9f3a706b8e75b438075bd5e9f40c90dee3f66a06e6ef18"
  - number: "2868"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Rights of Man, Written Down"
    date: "1789 CE"
    region: "Paris, France"
    poem: |
      Liberty. Equality. Fraternity.
      The Declaration of the Rights of Man
      put it in writing: men are born free and equal,
      sovereignty lives in the nation, not the king.
      I read the broadsheet in a Paris café,
      the words still wet from the press,
      and watched ordinary people read them aloud to each other,
      slowly, like a prayer.
      It was the most photocopied idea in history —
      every revolution since has cribbed from it.
    description: "The Declaration of the Rights of Man proclaims liberty, equality, and fraternity."
    status: "published"
    sha256: "8418f11afeb62acc09c3045937a65ec72ad45f5c1e6087306318a5c224b3a3a7"
  - number: "2869"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The First President Takes the Oath"
    date: "1789 CE"
    region: "New York, USA"
    poem: |
      On a balcony in New York, before a cheering crowd,
      Washington took the oath — the first president,
      the great republican experiment beginning for real.
      I stood in Wall Street that April morning,
      and watched the general become something new:
      not a king, not a dictator, a president —
      a word the world would have to learn.
      He was nervous. The crowd was joyful.
      Nobody knew if it would work. It worked.
    description: "Washington is sworn in on a balcony, and the great republican experiment begins."
    status: "published"
    sha256: "fd9761d103d07e76c8c56721ef2fe2dcfa8ec5f4bd619cc1a820a4ced261e53f"
  - number: "2870"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Money That Built a Nation"
    date: "1790 CE"
    region: "United States"
    poem: |
      Hamilton's plan: a national bank, a mint,
      the government's debts honored, America's credit founded —
      money as the mortar of the new nation.
      Jefferson hated it; Washington signed it.
      I watched the bank's charter debated in Congress,
      the future of the republic argued in dollars and cents,
      and understood: revolutions are won with muskets,
      but nations are built with ledgers.
      Hamilton gave America its money,
      and its money gave it a future.
    description: "Hamilton's financial plan founds the bank, the mint, and America's credit."
    status: "published"
    sha256: "8e058882c2fdf2b8bdc9d7ef56643ed227efb14b07d54afe05c8f53be9c5ea2e"
  - number: "2871"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Book That Defended the Old Order"
    date: "1790 CE"
    region: "London, England"
    poem: |
      Edmund Burke looked at the French Revolution
      and warned: this will devour its children.
      His Reflections defended the old order —
      tradition, church, crown — against the wreckers,
      in prose like organ music.
      I read it in London as the Paris news grew darker,
      and watched conservatives find their bible.
      He was right about the Terror, wrong about everything else —
      but what a voice. The revolution's enemies
      would quote Burke for two hundred years.
    description: "Edmund Burke's Reflections warns that revolution devours its children."
    status: "published"
    sha256: "734363dbc3528335ba2576a1551b8b0f7be75939b424bd44b8cc3c569cbb2f13"
  - number: "2872"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Ten Promises"
    date: "1791 CE"
    region: "United States"
    poem: |
      Ten amendments, ratified one by one —
      the Bill of Rights: promises the new government
      made to its citizens, in writing, forever.
      Speech. Religion. Arms. Trial by jury.
      No quartering soldiers, no seizing papers.
      I read them posted in a Philadelphia tavern,
      and watched farmers nod over their ale:
      these were the things they'd fought for,
      spelled out plain, so no future Congress could forget.
    description: "The Bill of Rights is ratified — ten amendments guarding the citizen from the state."
    status: "published"
    sha256: "15a783d13aad73e0273ac67ee03699e9676b3b9d28e3da1b449be0a0682f7dec"
  - number: "2873"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Night the Cane Fields Burned"
    date: "1791 CE"
    region: "Saint-Domingue, Caribbean"
    poem: |
      In the August night the cane fields burned —
      enslaved Africans rising across Saint-Domingue,
      the greatest slave revolt in history,
      led by men who would become legends: Toussaint, Dessalines.
      I saw the fires from a ship offshore,
      the whole northern plain alight,
      and knew the plantation world was finished.
      It would take twelve years of war,
      but Haiti would be born from those flames —
      the first free Black republic on earth.
    description: "Enslaved Africans rise in Haiti, and the greatest slave revolt in history begins."
    status: "published"
    sha256: "420beb6ca1ddef12d8813882a691d7eefc0289de4e51c65bb5821188321184e2"
  - number: "2874"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Requiem Left Unfinished"
    date: "1791 CE"
    region: "Vienna, Austria"
    poem: |
      He died at thirty-five, in a pauper's winter —
      Mozart, the child who heard music in everything —
      his Requiem half-written on the desk,
      the last notes dictated from his deathbed.
      Vienna wept. I stood in the rain
      outside St. Stephen's as the small coffin passed,
      and thought of all the music still inside him,
      unwritten, unheard, gone.
      Thirty-five years, and he filled them
      with more beauty than ten lifetimes.
    description: "Mozart dies at thirty-five, his last mass half-written, and Vienna weeps."
    status: "published"
    sha256: "1cab5d5717af276f822ba0ee474d855d8be27f261bb610a4cc0325e4f1b5dabc"
  - number: "2875"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Woman Who Demanded Everything"
    date: "1792 CE"
    region: "London, England"
    poem: |
      Mary Wollstonecraft wrote it plain:
      if reason and rights belong to men,
      they belong to women too —
      a Vindication of the Rights of Woman,
      demanding everything, apologizing for nothing.
      I read it in London and watched men scoff
      and women read it in secret, by candlelight.
      The revolution had declared all men equal;
      Wollstonecraft asked the rude question:
      what about the other half of humanity?
      Two centuries of feminism start here.
    description: "Mary Wollstonecraft's Vindication claims reason and rights for women as well as men."
    status: "published"
    sha256: "d6aa09dc55180c6b20b399d307adb48f22792a10833763711038ef147a2f244e"
  - number: "2876"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "One and Indivisible"
    date: "1792 CE"
    region: "Paris, France"
    poem: |
      The monarchy fell, and France declared itself
      a republic — one and indivisible —
      no more king, no more divine right,
      just the nation, sovereign and alone.
      I was in Paris for the proclamation,
      the crowds singing in the rain,
      and felt the ground shift under Europe:
      a great power had beheaded monarchy itself.
      The kings of Europe heard it as a threat —
      and it was. The wars would come soon enough.
    description: "The monarchy falls and France declares itself a republic, one and indivisible."
    status: "published"
    sha256: "ba822a42f9e94cd32b4c34314add471d2f028cdb1102c3be4f82f4e6e470afe3"
  - number: "2877"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Guillotine Falls on a King"
    date: "1793 CE"
    region: "Paris, France"
    poem: |
      On a January morning in the Place de la Révolution,
      Louis XVI climbed the scaffold —
      the drums rolled, the blade fell,
      and a king's head dropped into the basket
      as the crowd watched in silence.
      I was there, in the cold, among the thousands,
      and felt history snap like a bone:
      no one had done this to a king in a thousand years.
      The age of divine right ended
      with one falling blade.
    description: "Louis XVI is guillotined in the Place de la Révolution as the crowd watches in silence."
    status: "published"
    sha256: "b12df03433113faa47304dae6f3fcf212d0963e475891db6c8efe4ede51ec84f"
  - number: "2878"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Emperor Who Said No"
    date: "1793 CE"
    region: "Beijing, China"
    poem: |
      Britain sent Lord Macartney to Beijing
      with gifts and trade proposals —
      and Qianlong dismissed him:
      China needs nothing from the West.
      Our celestial empire has everything; your trinkets amuse us.
      I watched the embassy sail home empty-handed,
      and thought of the pride in that refusal —
      and the price. Within fifty years
      British guns would teach China
      what saying no had cost.
    description: "Qianlong dismisses Britain's Macartney embassy; China needs nothing from the West."
    status: "published"
    sha256: "ee42c651e93c4d1635a0e395926d8c85ae0ab764cd737dbab0d96b03e4a081de"
  - number: "2879"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Woman Who Wrote Women's Rights"
    date: "1793 CE"
    region: "Paris, France"
    poem: |
      She wrote the Declaration of the Rights of Woman —
      Olympe de Gouges, playwright and firebrand —
      demanding the revolution keep its promises to women.
      The revolution answered with the guillotine.
      I watched her climb the scaffold in November,
      unbroken to the end,
      and felt the revolution's shame:
      it had killed the woman who believed in it most.
      Her rights of woman would wait two centuries;
      her courage needed no waiting.
    description: "Olympe de Gouges, author of the Rights of Woman, is guillotined by the revolution she served."
    status: "published"
    sha256: "c211485c798b0573007e6e88ec08cd50c8b8a084939590034a9a117dca1dc3ac"
  - number: "2880"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Young Gunner of Toulon"
    date: "1793 CE"
    region: "Toulon, France"
    poem: |
      He was twenty-four, an artillery officer from Corsica,
      and at Toulon he did what the older generals couldn't:
      placed his guns right, pounded the British out,
      retook the port for the republic.
      Napoleon Bonaparte. France noticed him that winter.
      I watched him sighting cannon in the mud,
      all intensity and mathematics,
      and thought: this one is different.
      The revolution had found its sword —
      and the sword would soon hold the revolution.
    description: "Twenty-four-year-old Napoleon retakes Toulon with his artillery, and France notices him."
    status: "published"
    sha256: "235708e2dbd4f4ec991d2644088778337ce1b3127b29349a8eda202473728a48"
  - number: "2881"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Terror Eats Its Own"
    date: "1794 CE"
    region: "Paris, France"
    poem: |
      Robespierre sent them all to the blade —
      Danton, Desmoulins, thousands of nobodies —
      until the Terror turned and ate its architect too.
      They guillotined him in July, the Incorruptible,
      and the Terror ended with his head in the basket.
      I watched from the crowd as the cart rolled past,
      and felt Paris exhale: it was over.
      The revolution had devoured its children,
      exactly as Burke warned —
      and France was sick of blood at last.
    description: "Robespierre is guillotined, and the Terror ends with its architect's head in the basket."
    status: "published"
    sha256: "6d96baec200153f2450995fbf155cf4eeddbc2ef95ca6d30de0899c99042841b"
  - number: "2882"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Chemist on the Scaffold"
    date: "1794 CE"
    region: "Paris, France"
    poem: |
      Lavoisier — the father of modern chemistry,
      the man who named oxygen and weighed the air —
      climbed the scaffold because he'd been a tax farmer,
      and the revolution needed heads more than it needed science.
      The judge's famous words: the republic has no need of savants.
      I stood in the crowd that May morning
      and watched France execute its finest mind.
      It took a moment, the blade;
      it took a century to replace him.
    description: "Lavoisier, father of modern chemistry, is executed; France loses its finest mind."
    status: "published"
    sha256: "d7df91c14765691d6102f15d9998bfe42816e0fce95fda991eddce7f9086b71d"
  - number: "2883"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Machine That Multiplied Slavery"
    date: "1794 CE"
    region: "Georgia, USA"
    poem: |
      Eli Whitney built a simple machine —
      the cotton gin, teeth and wire —
      that cleaned cotton fifty times faster than fingers.
      It was supposed to make slavery uneconomical.
      It did the opposite: cotton became king,
      and millions more were chained to the fields
      to feed the hungry gins.
      I watched one work in Georgia, the lint flying,
      and felt the cruelest irony of the age:
      a labor-saving machine that multiplied slavery.
    description: "Eli Whitney's cotton gin makes cotton king and chains millions more to the fields."
    status: "published"
    sha256: "458ad28ecf3a1d86c7bd4c9e674343401fe60ad3e189932cf14e8a72809f6146"
  - number: "2884"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Five Men Who Ruled"
    date: "1795 CE"
    region: "Paris, France"
    poem: |
      After the Terror, five directors took power —
      the Directory, steering a tired, bloody republic
      through bankruptcy and war and conspiracy.
      Five men, quarreling in the Luxembourg Palace,
      while France waited for someone stronger.
      I watched them parade in their ridiculous uniforms,
      all velvet and feathers, no authority,
      and thought: this cannot last.
      It didn't. A young general was waiting in the wings,
      and his name was Bonaparte.
    description: "The Directory takes power — five directors steering a tired, bloody republic."
    status: "published"
    sha256: "9cf20eea8596c88619d63f31f94d9a9dddb9c6bca555057f3c094c8094c6c10e"
  - number: "2885"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Milkmaid's Gift"
    date: "1796 CE"
    region: "Berkeley, England"
    poem: |
      A country doctor noticed the milkmaids —
      the ones who'd had cowpox never caught smallpox —
      and scratched cowpox into a boy's arm:
      the first vaccination, and smallpox began its long defeat.
      Edward Jenner. I was in Berkeley that May,
      and watched him test the boy against the real disease.
      It worked. The boy lived.
      From a milkmaid's clear skin to the saving of billions —
      the greatest medical gift ever given,
      wrapped in a country doctor's hunch.
    description: "A country doctor scratches cowpox into a boy's arm, and smallpox begins its long defeat."
    status: "published"
    sha256: "786342192f4e326f7a2afa7352974996ed530abd0e404ee8d7b5a34a3b990346"
  - number: "2886"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Boy General's Lightning March"
    date: "1796 CE"
    region: "Italy"
    poem: |
      Twenty-six years old, commanding in Italy,
      Napoleon outran and outfought Austria's armies —
      lightning marches, impossible victories,
      soldiers who'd follow him into hell.
      I rode with that army through the Italian spring,
      dust and glory, town after town falling,
      and watched a legend being born in real time.
      The boy general moved faster than news could travel;
      Europe woke up to find a new master of war
      had arrived, and he was barely shaving.
    description: "Twenty-six-year-old Napoleon outruns and outfights Austria's armies across Italy."
    status: "published"
    sha256: "19c30f3c7ad347610a74e4986ebb712c343af70e90f3e70f3e1ac0b29dbbd0a1"
  - number: "2887"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Mutiny of the Fleets"
    date: "1797 CE"
    region: "The English Channel"
    poem: |
      Britain's sailors mutinied — the whole Channel fleet,
      then the North Sea fleet — for better pay and bread,
      rotten food and brutal officers no more.
      The mighty navy, anchor of the empire,
      had to listen to its own men.
      I was at Spithead when the red flags flew,
      delegates rowing between the ships,
      discipline holding even in revolt.
      They won their demands. The Admiralty learned:
      even wooden walls are built of men,
      and men must eat.
    description: "Britain's sailors mutiny for better pay and bread, and the mighty navy must listen."
    status: "published"
    sha256: "18421c4501100c8a8caa163e5e3f9d46d9bc1eda4df1c985b59c52ef8d6583dd"
  - number: "2888"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The General Who Sailed for the Pyramids"
    date: "1798 CE"
    region: "Egypt"
    poem: |
      Napoleon sailed for Egypt with soldiers and scholars —
      an army and a university in one fleet —
      won at the Pyramids, then watched Nelson
      burn his ships at the Nile and strand him there.
      I marched with that army through the desert heat,
      past the Sphinx, into Cairo,
      and watched the scholars sketch temples
      while the soldiers looted them.
      Glory and folly, side by side:
      the expedition failed as conquest
      and triumphed as the birth of Egyptology.
    description: "Napoleon lands in Egypt with soldiers and scholars, wins at the Pyramids, and strands his army."
    status: "published"
    sha256: "2a56ad2f3a65460d6e2935cba157b5c9610ff2c5691c38e132a3ae222bbbaf66"
  - number: "2889"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Rising of '98"
    date: "1798 CE"
    region: "Ireland"
    poem: |
      Wolfe Tone's United Irishmen rose —
      Catholic and Protestant together, for an Irish republic —
      and were crushed: Vinegar Hill, the pitchcappings,
      the hangings afterward.
      Ireland's hope went underground that year.
      I walked the roads of Wexford after the battles,
      the dead still unburied in the ditches,
      and felt a nation's heart break —
      then harden. The rising failed;
      the cause went into the soil like seed,
      to rise again, and again, and again.
    description: "Wolfe Tone's United Irishmen rise against British rule and are crushed; Ireland's hope goes underground."
    status: "published"
    sha256: "06f4460a2ade43791f4609f4d02707e95a0a8758ad9c976f2751274f83888527"
  - number: "2890"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Coup of the Eighteenth Brumaire"
    date: "1799 CE"
    region: "Paris, France"
    poem: |
      On the 18th of Brumaire, Napoleon walked into the Directory's palace
      with soldiers at his back and overthrew it —
      the revolution ending, at bayonet point,
      in one man's hands.
      I was in Paris that November day,
      the confusion, the shouting, the troops in the streets,
      and watched ten years of republic
      dissolve into a general's ambition.
      Liberty, equality, fraternity —
      and now, one consul, soon one emperor.
      The revolution was over. The legend was beginning.
    description: "Napoleon overthrows the Directory at bayonet point, and the revolution ends in one man's hands."
    status: "published"
    sha256: "7187316ed1cc484a5ecc617e77fc8ed52f9cb04982828feb18e5bcd93f1f9273"
  - number: "2891"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Death of the General"
    date: "1799 CE"
    region: "Virginia, USA"
    poem: |
      He died at Mount Vernon in December —
      Washington, the father of the country,
      gone in two days from a throat infection,
      bled by his doctors, as was the custom.
      A young nation mourned the father it could not replace.
      I stood among the mourners in the cold Virginia air,
      and felt the loss like a missing foundation stone:
      who would hold it together now?
      Nobody, quite. America would have to hold itself.
    description: "Washington dies at Mount Vernon, and a young nation mourns the father it cannot replace."
    status: "published"
    sha256: "c945526fc769f02bafe25e27f5a9465472ff45d6c1e9a7e9ccb9e45253edd944"
  - number: "2892"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The City in the Swamp"
    date: "1800 CE"
    region: "Washington, USA"
    poem: |
      The government moved into a half-built capital
      on the Potomac — all mud and marble dreams,
      a few grand buildings rising from a swamp,
      streets that were still forest paths.
      I walked Pennsylvania Avenue that first winter,
      sinking to my ankles, the Capitol dome unfinished,
      and laughed: this was to be the seat of empire?
      But cities grow into their ambitions.
      The swamp would drain, the marble would multiply,
      and the muddy dream would become Washington.
    description: "The government moves into a half-built capital on the Potomac — all mud and marble dreams."
    status: "published"
    sha256: "e0cd0dce29323fa833fecc6b5a8c226cb9defac241c94f1beb427d24f7b0c208"
  - number: "2893"
    volume: 5
    era_code: "10b"
    era: "Reason and Revolution (later)"
    title: "The Pile That Made Lightning Obey"
    date: "1800 CE"
    region: "Como, Italy"
    poem: |
      Alessandro Volta stacked metal discs —
      silver, zinc, brine-soaked cloth, silver, zinc —
      and made the first battery: steady, bottled electricity,
      lightning made to obey.
      I watched him demonstrate it in Como,
      the wire sparking, the frog legs twitching,
      and felt the age of electricity begin:
      no more waiting for storms like Franklin's kite.
      Power on demand, in a pile of discs.
      The world would run on this idea —
      every battery since is Volta's pile, refined.
    description: "Alessandro Volta stacks metal discs and makes the first battery, bottling electricity at last."
    status: "published"
    sha256: "dde2962b9ddfc7ea4b9a110e37884d8ac6248d38966acb1e52eac261a8a2f8f8"
  - number: "2894"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The President's House"
    date: "1800 CE"
    region: "Washington, USA"
    poem: |
      I stood on mud where Pennsylvania Avenue
      was more of a promise than a street —
      a half-built house of pale Virginia stone,
      with stairways going nowhere, plaster wet.

      Adams came in by coach that November,
      the first man to sleep beneath that roof,
      and wrote a blessing in a letter home
      that every president has read since — proof
      that even half a house can hold a nation,
      if someone's willing to move in and stay.
    description: "John Adams becomes the first president to live in the unfinished White House in 1800, blessing a half-built house that would grow into a nation's home."
    status: "published"
    sha256: "f5bbb0538398f0cddb92c002ee4672033005cf5241808a0e9e902078fea7d89a"
  - number: "2895"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Gabriel's Doomed Rising"
    date: "1800 CE"
    region: "Virginia"
    poem: |
      I watched him plan it by the blacksmith's fire,
      a freeman's mind inside a slave's skin —
      Gabriel, hammering freedom into iron,
      gathering ten thousand with a whispered grin.

      A traitor sold him for a few spare coins,
      then heaven itself turned traitor too —
      a storm drowned roads the night they meant to march,
      and Richmond's gallows did what storms don't do.
    description: "In 1800, enslaved blacksmith Gabriel Prosser's planned march on Richmond collapses after betrayal and a storm; he is hanged, but the dream of freedom doesn't die with him."
    status: "published"
    sha256: "8f1bb529609a79288edae2285e4238da4f6a498ebdab8188d47c82380534fc19"
  - number: "2896"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Marengo's Narrow Escape"
    date: "1800 CE"
    region: "Italy"
    poem: |
      At two o'clock the French were beaten —
      the Austrians were writing their dispatches home,
      Napoleon staring at disaster,
      when Desaix rode in through the dust alone.

      One charge, one cannonade at evening,
      and a lost battle turned completely round —
      Desaix died in the moment of it,
      his name carved in the turning of the ground.
    description: "At Marengo in 1800, General Desaix's last-minute evening charge snatches Napoleon victory from certain defeat, costing Desaix his life."
    status: "published"
    sha256: "cee8f68292898dec2e45b79f1eb10f04e7d152e5e0027d258afa535b0a6613aa"
  - number: "2897"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Two Kingdoms Become One"
    date: "1800 CE"
    region: "Britain"
    poem: |
      I walked through London as they rang the bells
      for a union signed with bribed and bought votes —
      Ireland folded into Great Britain,
      one parliament, one flag, two heavy coats.

      It was sold as peace. It wore like chains.
      The Irish never signed it in their hearts,
      and every rising for a century after
      was this day's paper coming back in parts.
    description: "The Act of Union of 1800 joins Ireland to Great Britain under one parliament, a paper unity that Ireland never accepted and that fueled a century of resistance."
    status: "published"
    sha256: "00373fa33fe3f435c586b2a93c60938b624b8b80ba41f21611b653b903a67fea"
  - number: "2898"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Counting the Kingdom"
    date: "1801 CE"
    region: "Britain"
    poem: |
      Ten million, two hundred eighty-three thousand, souls —
      I watched the counters go from door to door,
      chalk in hand, a new century's new habit:
      a kingdom wanting, finally, to know its score.

      Not how many spears. Not how many ships.
      How many mouths, how many hands, how many beds —
      the first time a state counted its people
      instead of counting only its war dead.
    description: "Britain's first census in 1801 counts over ten million people, the first time a nation counted its living population rather than its armies."
    status: "published"
    sha256: "208e7ec5b0eb8cccef6c59f51afb4caea147e232ff994479d61fd685e8048d58"
  - number: "2899"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Nelson Turns His Blind Eye"
    date: "1801 CE"
    region: "Denmark"
    poem: |
      I was on the Elephant when the signal ran
      for Nelson to pull back and end the fight —
      he lifted his glass to his blind eye,
      smiled, and said, "I really do not see the sight."

      So on we sailed into the harbor's guns,
      and the Danish line came all undone.
      Sometimes the bravest order ever given
      is the one the captain doesn't run.
    description: "At Copenhagen in 1801, Admiral Nelson raises his telescope to his blind eye to ignore the recall signal, then destroys the Danish fleet."
    status: "published"
    sha256: "d0c359aaae353e8945c6ec9d5496c3aa3460491b6d4b173613fad464cace8457"
  - number: "2900"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Black General's Constitution"
    date: "1801 CE"
    region: "Haiti"
    poem: |
      He wrote it in his own hand, the man born a slave,
      a constitution for a free black land —
      Toussaint, who beat the British and the Spanish,
      daring Napoleon to raise a hand.

      Governor for life, he signed himself,
      and sent the paper sailing to Paris town:
      Here is a colony that calls itself a people —
      come and try to sit it down.
    description: "Toussaint Louverture, the formerly enslaved Black general who freed Saint-Domingue, writes Haiti's 1801 constitution and names himself governor for life, openly defying Napoleon."
    status: "published"
    sha256: "308b077f50e202f341541c429f98ed7c4e0c8666bd41c1b8bfaddb1469a80730"
  - number: "2901"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Truce of Amiens"
    date: "1802 CE"
    region: "France"
    poem: |
      For one whole year the guns went quiet —
      Amiens, and Europe drew a breath,
      shook hands across the Channel water,
      and almost remembered life from death.

      I sat in cafés where French and English
      drank each other's health like it would last —
      then the year ran out, the drums came back,
      and the quiet folded into the past.
    description: "The Treaty of Amiens in 1802 gives war-weary Europe one brief year of peace between Britain and Napoleonic France before the fighting resumes."
    status: "published"
    sha256: "7e899eb69fcb3812cfed19a9fa294afec83026173585e7226cd36651fc9a86f5"
  - number: "2902"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "One Emperor, One Vietnam"
    date: "1802 CE"
    region: "Vietnam"
    poem: |
      Thirty years of war, and then one man —
      Nguyen Anh, patient as the tide,
      outlasted every rival house and army,
      and took the dragon throne with none beside.

      He called himself Gia Long, the first emperor
      of a Vietnam whole from north to south —
      I watched the banners change in Hue that summer,
      and heard one name in every mouth.
    description: "Nguyen Anh defeats his last rivals in 1802, takes the name Gia Long, and unites Vietnam under a single imperial throne."
    status: "published"
    sha256: "9b10cf24c6ad716c8ae6c3ada755edbe4dc2f2a419c2b14885048dda087caea8"
  - number: "2903"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Trap at Cap-Français"
    date: "1802 CE"
    region: "Haiti"
    poem: |
      They called it talks. It was a cage.
      They asked him to parley, shook his hand,
      then chained him in the night and sailed him
      to a stone cell in a freezing land.

      Toussaint died in Joux, in the Jura cold,
      April air too thin for a Caribbean man —
      but the army he'd built kept fighting on,
      and finished what the prisoner began.
    description: "Napoleon betrays Toussaint Louverture with false peace talks in 1802, ships him to die in a French mountain prison — but Haiti's revolution fights on without him."
    status: "published"
    sha256: "6a7c3d61d0e0dcfc6ae2322606eefad778bf554c4292af5d34b28aaf0f4bba76"
  - number: "2904"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "America Doubles Overnight"
    date: "1803 CE"
    region: "North America"
    poem: |
      Three cents an acre. Eight hundred twenty-eight thousand
      square miles for fifteen million in gold —
      Napoleon needed money for his wars,
      and Jefferson couldn't refuse it, I'm told.

      I watched the map get redrawn in a morning:
      a nation doubled by a signature's scratch —
      the biggest land deal in the human story,
      and nobody alive could match it.
    description: "Napoleon's 1803 sale of the Louisiana Territory doubles the size of the United States overnight for fifteen million dollars — the greatest land bargain in history."
    status: "published"
    sha256: "234f20e3657ec48aeae83b437d5dd6d74282f34e6b61de86e4bd67c47b135cba"
  - number: "2905"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Into the Unknown West"
    date: "1803 CE"
    region: "North America"
    poem: |
      I poled beside them up the Missouri,
      Lewis with his compass, Clark with his map,
      into a country no white man had charted —
      bear and buffalo, river and gap.

      Sacagawea carried her baby the whole way,
      and the mountains didn't kill them after all —
      two years out, two years back again,
      and a continent's curtain starts to fall.
    description: "Lewis and Clark's Corps of Discovery sets out in 1803 to map the Louisiana Purchase from the Missouri to the Pacific, opening the American West."
    status: "published"
    sha256: "8fa552319373783a75cc80f38dba09c5735c5d3a52cbab3032a26550cef34b33"
  - number: "2906"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Emmet's Last Speech"
    date: "1803 CE"
    region: "Ireland"
    poem: |
      The rising failed before the sun went down —
      a riot, not a revolution, lost by noon.
      But then they gave him the dock to speak from,
      and Ireland has been listening since that afternoon.

      "Let my epitaph be written when my country
      takes her place among the nations of the earth" —
      twenty-five years old, and he outlived them all,
      because words can outlive any birth.
    description: "Robert Emmet's 1803 Dublin rising collapses in a day, but his speech from the dock before his execution makes him Ireland's immortal rebel."
    status: "published"
    sha256: "a4c1a3fa88f53ff258ea98c5b50d58dde8f8146914bb97736669ef2d4775df15"
  - number: "2907"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Assaye Breaks the Marathas"
    date: "1803 CE"
    region: "India"
    poem: |
      Seven thousand against forty thousand —
      Wellesley looked at the odds and grinned,
      led his line straight at the Maratha guns
      and broke the finest army India could send.

      I walked the field when the smoke had cleared;
      he'd call it the bloodiest day he knew,
      the battle that made his name in India —
      Assaye, where the few ran down the true.
    description: "Arthur Wellesley's vastly outnumbered British army crushes the Marathas at Assaye in 1803, tightening Britain's grip on India and making his reputation."
    status: "published"
    sha256: "fa29b79d0e4704f997d252a63c65c93ad4b8c9034ece4c62f98b9caa7601fbce"
  - number: "2908"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The World's First Black Republic"
    date: "1804 CE"
    region: "Haiti"
    poem: |
      On New Year's Day, in Gonaïves,
      Dessalines stood up and read it plain:
      Haiti — free, forever, independent,
      never a colony of France again.

      The first nation ever born of a slave revolt,
      built by hands that broke their own chains —
      I heard the drums that afternoon,
      and they never sounded like drums again.
    description: "On January 1, 1804, Jean-Jacques Dessalines declares Haiti independent — the first nation in history founded by a successful slave revolt."
    status: "published"
    sha256: "3d66bf18e876a62b3133335a4778041af06ed5c72ef034654b460ac434e15556"
  - number: "2909"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Scholar's Holy War"
    date: "1804 CE"
    region: "West Africa"
    poem: |
      He was a teacher, not a warlord —
      Usman dan Fodio, with books for swords,
      calling the Hausa kings corrupt,
      calling the people back to the Lord.

      The scholars rose, the students marched,
      kingdom after kingdom bent the knee —
      and out of sermons came an empire,
      the Sokoto Caliphate, ruling millions, free.
    description: "In 1804 the Islamic scholar Usman dan Fodio launches his jihad in Hausaland, founding the Sokoto Caliphate that will rule millions across West Africa."
    status: "published"
    sha256: "1e5de39f8345daade72a4f1a01c0f3724bdfbb066a21a9406dbcedb88540eb88"
  - number: "2910"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Black George Rises"
    date: "1804 CE"
    region: "Serbia"
    poem: |
      They called him Karađorđe — Black George —
      a pig-dealer with a warrior's heart,
      and when the Serbs had taken all they could take,
      he was the spark that set the fire to start.

      Against the Ottomans, against the odds,
      the first Balkan rising of the modern age —
      I saw the standard raised at Orašac,
      and heard the first page of a turning page.
    description: "In 1804 Karađorđe leads the Serbs in revolt against Ottoman rule, the first spark of the Balkan national independence movements."
    status: "published"
    sha256: "20d70505b28612f53d244104717c07daed09d71fce79547f7af602fc4d38bf93"
  - number: "2911"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Law for an Empire"
    date: "1804 CE"
    region: "France"
    poem: |
      Every battle he ever fought is dust —
      Waterloo's a field trip now, they say.
      But the book he signed in 1804,
      the Code Civil, is still law today.

      One law for rich man, poor man, city, farm —
      no more feudal maze, no lordly whim.
      I watched the clerks copy it out by hand,
      and empires fade, but laws outlast him.
    description: "Napoleon's Civil Code of 1804 unifies French law under one book — and outlives every battle he ever fought, still shaping legal systems worldwide."
    status: "published"
    sha256: "94a0d018f47f32e9832ddec2bacc55fabc2d9afa7a38b595e8f4d7e888c60455"
  - number: "2912"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Albanian Who Made Modern Egypt"
    date: "1805 CE"
    region: "Egypt"
    poem: |
      He came as an Ottoman soldier, Albanian-born,
      and stayed to take the whole machine apart —
      Muhammad Ali, who looked at crumbling Egypt
      and decided to rebuild it with a modern heart.

      Schools, factories, an army trained like Europe's,
      the Nile made to serve a new design —
      I walked Cairo's streets and felt the shift:
      an old land learning a new kind of time.
    description: "Muhammad Ali seizes power in Egypt in 1805 and begins forging a modern state — schools, factories, and a European-style army."
    status: "published"
    sha256: "5232abc8b56fc2cdd77573b3c9408bc5fc6bb801d5eb602a1a140a24f0deb155"
  - number: "2913"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Trafalgar's Thunder"
    date: "1805 CE"
    region: "Atlantic"
    poem: |
      Twenty-seven ships against thirty-three,
      and Nelson split them like a wedge through pine —
      "England expects that every man will do his duty,"
      and every man did, down the line.

      A French sharpshooter found him on the deck
      at the very hour the victory was won —
      he died hearing that the day was his,
      and Britain ruled the waves from that day on.
    description: "At Trafalgar in 1805 Nelson destroys the combined French and Spanish fleets, securing British naval supremacy — and dies of a sniper's wound in the hour of victory."
    status: "published"
    sha256: "74218ac4293f6f21494932ff8a732cf1af620b032ffb36f75ec63668b1384821"
  - number: "2914"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Sun of Austerlitz"
    date: "1805 CE"
    region: "Moravia"
    poem: |
      December second, and the sun came up
      through the mist exactly as he planned —
      Napoleon, who had drawn the Russians and Austrians
      onto the ground he'd chosen, like a hand.

      Seventy-three thousand against ninety thousand,
      and by evening it was done —
      the most perfect battle he ever fought,
      his masterpiece beneath the winter sun.
    description: "Napoleon crushes the Austrian and Russian armies at Austerlitz in December 1805 — his most tactically perfect victory, fought in a single winter day."
    status: "published"
    sha256: "2672de1491bda250a7d6c0ce0818bcad83dbbb9650c976ccbe68c7fa8e7b400b"
  - number: "2915"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Mungo Park's Last River"
    date: "1806 CE"
    region: "West Africa"
    poem: |
      He'd come back to the Niger a second time,
      the Scotsman with the mapmaker's dream,
      determined to follow the great river
      down to wherever rivers meet the sea.

      The rapids took him at Bussa Falls —
      his boat went over, and the river kept the rest.
      I stood on that bank and watched the water run,
      and Africa kept its secret best.
    description: "Explorer Mungo Park drowns in the Niger rapids in 1806 on his second expedition, and Africa's interior keeps its secrets a while longer."
    status: "published"
    sha256: "d82afea0a662466a18b020e428ab62d4acc7a598eb6a19df8b5bf3ab76a52f0b"
  - number: "2916"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "An Empire a Thousand Years Old Ends"
    date: "1806 CE"
    region: "Germany"
    poem: |
      A thousand years. Let that sit a moment —
      an empire older than most nations' names,
      and Napoleon ended it with a signature,
      the Holy Roman Empire, gone in flames.

      Francis II laid down the ancient crown
      and called himself plain Emperor of Austria —
      I watched a millennium fold up quietly,
      and Germany begin to be itself, at last.
    description: "In 1806 Napoleon dissolves the thousand-year-old Holy Roman Empire, and Francis II becomes simply Emperor of Austria — Germany's map is redrawn forever."
    status: "published"
    sha256: "1dbfa47e9ecfa6335ed48189c38b69794179600d9c94f7bd25d0beb5e13f87a2"
  - number: "2917"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Jena Shatters an Army"
    date: "1806 CE"
    region: "Prussia"
    poem: |
      The Prussians marched in Frederick's glory,
      powdered wigs and eighteen-century pride —
      and Napoleon's corps hit them at Jena
      like a hammer, and the whole machine died.

      One day. One battle, and an army
      that Europe feared for fifty years was gone —
      French eagles flying over Berlin
      before the month was out. Move on. Move on.
    description: "At Jena-Auerstedt in 1806 Napoleon's army destroys the famed Prussian military machine in a single day, and French troops march into Berlin."
    status: "published"
    sha256: "17eb3c599bb0d5ec24161e5aba1ac1e35e8f334aeea92f8b0db020ab8f60d04c"
  - number: "2918"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Trade in Humans Outlawed"
    date: "1807 CE"
    region: "Britain"
    poem: |
      Twenty years Wilberforce stood up
      in a Parliament that laughed and looked away —
      twenty years of "not yet" and "next time,"
      until the year the "ayes" outshouted "nay."

      The ships were outlawed, not the chains —
      slavery itself would take another fight.
      But I watched the vote that night in London,
      and for the first time, the dark cracked light.
    description: "After twenty years of William Wilberforce's campaigning, Parliament abolishes the slave trade across the British Empire in 1807."
    status: "published"
    sha256: "dc354700e75891ab777faf330465061b13af91d7b766c0f453dd8ea30069b1af"
  - number: "2919"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Two Emperors on a Raft"
    date: "1807 CE"
    region: "Russia"
    poem: |
      A raft on the Niemen River, midstream,
      where neither bank could claim the ground —
      Napoleon and the Tsar met on the water
      and carved up Europe while the oars made sound.

      Alexander, young and charmed and cornered,
      agreed to everything the Frenchman drew —
      I watched from the bank as two men on a raft
      decided what the continent would do.
    description: "Napoleon and Tsar Alexander I meet on a raft at Tilsit in 1807 and divide Europe's future between them."
    status: "published"
    sha256: "da95fbccf6232577e228390a31f1dc9022786b79366bf4a1aff8b25b00df22d1"
  - number: "2920"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Steamboat That Beat the River"
    date: "1807 CE"
    region: "New York"
    poem: |
      They called it "Fulton's Folly" on the dock —
      a boat with wheels, a chimney, and a dream.
      Then the Clermont churned up the Hudson,
      thirty-two hours against wind and stream.

      I rode her deck and felt it in my bones:
      the river hadn't changed, but we had —
      sail and oar were done, steam was king,
      and the world would never travel sad.
    description: "Robert Fulton's steamboat Clermont powers up the Hudson in 1807, proving steam can beat wind and current — the age of steam travel begins."
    status: "published"
    sha256: "2b4db09430b34842f6d6868f83f425df7ea335cc4899dcc12e15ceb4e47a2747"
  - number: "2921"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Davy's Electric Fire"
    date: "1807 CE"
    region: "England"
    poem: |
      He wired a battery to a lump of potash
      and watched it melt and bubble, strange and bright —
      then out of the froth came shining metal,
      potassium, born of electric light.

      Humphry Davy, showman of the Royal Institution,
      pulling new elements out of the air —
      I stood in that lecture hall and understood:
      chemistry would never be the same out there.
    description: "In 1807 Humphry Davy uses electric current to isolate potassium from potash, opening the age of electrochemistry and a flood of new elements."
    status: "published"
    sha256: "bdaf9cb3bd435168a58ebea8f535a927167c6f52d7e72243ae3b3fb49a915d32"
  - number: "2922"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Slave Ships Stop — Legally"
    date: "1808 CE"
    region: "America"
    poem: |
      The law said: no more ships, no more cargo,
      no more Middle Passage, by decree —
      America banned the import of the enslaved
      in 1808, and called the ocean free.

      But the auctions went on in every Southern town,
      and the cotton kept the coffles on the road —
      I watched a law close the sea door
      while slavery built a bigger house to hold.
    description: "The United States bans the importation of enslaved Africans in 1808 — but slavery itself continues and grows within the country."
    status: "published"
    sha256: "253493795ced61751d7f6d5dbd63fd7fb071229d6eeb34dc64b28916d7e79b60"
  - number: "2923"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Rum Rebellion"
    date: "1808 CE"
    region: "Australia"
    poem: |
      Australia's only coup, and it was over rum —
      Governor Bligh, of Bounty fame, tried to break
      the officers' monopoly on spirits,
      and the New South Wales Corps wouldn't take.

      They marched him out at bayonet point,
      arrested their own governor in his home —
      I watched Sydney's strangest morning:
      a rebellion fought for rum, in a colony built of stone.
    description: "In 1808 Sydney's military officers arrest Governor Bligh in Australia's only military coup — the Rum Rebellion, fought over the rum trade."
    status: "published"
    sha256: "1578812d1a053da950be6584e6afc554751fbbb17ea8abbb1fd241f3ef639b98"
  - number: "2924"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Madrid Rises With Knives"
    date: "1808 CE"
    region: "Spain"
    poem: |
      I was in Madrid on the Second of May
      when the people came out with kitchen knives and stones
      against Murat's cavalry and cannon —
      a city deciding it would rather break its bones

      than kneel. The French shot them in the streets,
      and Goya would paint it later, dark and red —
      but that morning belonged to butchers and tailors,
      and the long Peninsular War was born of the dead.
    description: "On May 2, 1808, the people of Madrid rise against French occupation with knives and stones, igniting the brutal Peninsular War."
    status: "published"
    sha256: "0e5dfce3adde27dd949a521485142ff2049ca98412fae70d6bde06d3972320d0"
  - number: "2925"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Fate Knocks at the Door"
    date: "1808 CE"
    region: "Vienna"
    poem: |
      Four hours, one freezing December night,
      a concert so long the audience nearly froze —
      Beethoven, already going deaf,
      premiered two symphonies at once, heaven knows.

      The Fifth: fate knocking at the door,
      four notes that everyone on earth would learn —
      and the Sixth: a walk through summer fields,
      the Pastoral, green as anything could turn.
    description: "In December 1808 Beethoven premieres his Fifth and Sixth Symphonies in a single freezing four-hour concert in Vienna."
    status: "published"
    sha256: "d9ac3970203a23bb43f2423067a11831ecd9051894ecab45c4b63a134a289f4e"
  - number: "2926"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Two Giants Born on One Day"
    date: "1809 CE"
    region: "England"
    poem: |
      February twelfth, eighteen-oh-nine:
      a dirt-floor cabin in Kentucky, cold and bare —
      a baby named Abraham Lincoln.
      A manor house in Shrewsbury, warm with care —
      a baby named Charles Darwin.

      Two boys who'd each, in his own way,
      free the world from an old idea's chain —
      one would free the slaves, the other
      would free the mind from how life came.
    description: "On February 12, 1809, Abraham Lincoln is born in a Kentucky log cabin and Charles Darwin in an English manor — two lives that would each change the world."
    status: "published"
    sha256: "335f0708df299d20711d24130cfa059fe3605fb2ead6cee67c7e9fce90a460fb"
  - number: "2927"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Wagram's Bloody Field"
    date: "1809 CE"
    region: "Austria"
    poem: |
      I walked Wagram's field when the guns went quiet —
      one hundred fifty thousand men a side,
      the Danube running red between them,
      and Napoleon, who would not be denied.

      He beat the Austrians at a butcher's price,
      then married a Habsburg princess for his pains —
      a wedding to seal a victory,
      and blood enough to water the plains.
    description: "Napoleon defeats Austria at Wagram in 1809 in one of the bloodiest battles yet fought, then seals the peace by marrying into the Habsburg family."
    status: "published"
    sha256: "b81318908fcaae6d7f19c5c590d002b11b562c72c1e27bca6ef1fbd7088f75c5"
  - number: "2928"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The First Theory of Evolution"
    date: "1809 CE"
    region: "France"
    poem: |
      Lamarck said it first, and got it wrong —
      that giraffes stretched their necks by reaching high,
      that what you use grows strong, what you don't
      withers away, and passes to your child thereby.

      The mechanism failed. The idea didn't.
      Living things change over generations — true —
      and I sat in his lecture hall in Paris
      watching the first man dare to say it through.
    description: "In 1809 Jean-Baptiste Lamarck publishes the first theory of evolution — wrong in its mechanism, but daring in its central idea that life changes over generations."
    status: "published"
    sha256: "d254df233e34654a6a23fedc09645fffd57d772edb34b5e7c5ab32a642913e19"
  - number: "2929"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The May Revolution"
    date: "1810 CE"
    region: "Argentina"
    poem: |
      May twenty-fifth, and Buenos Aires
      filled the square before the cabildo hall —
      no more Spanish viceroy, the people said,
      we'll govern ourselves, one and all.

      It started with a council, not a battle,
      a polite revolution, papers signed —
      but I watched that crowd and knew the truth:
      South America's liberation had begun in kind.
    description: "In May 1810 Buenos Aires throws off Spanish rule in the May Revolution, launching South America's wars of liberation."
    status: "published"
    sha256: "6d8e065be2d637271ff0147489ae3722010eb92aa89c03102d64877df39d0a8c"
  - number: "2930"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The French Marshal Who Became a King"
    date: "1810 CE"
    region: "Sweden"
    poem: |
      Sweden needed an heir, and chose —
      of all the men on earth — a Frenchman,
      Bernadotte, one of Napoleon's marshals,
      a soldier of the Revolution's span.

      He took the name Charles John, learned Swedish,
      ruled wisely, and founded a royal line —
      his descendants sit on Sweden's throne today.
      I watched a marshal become a king by design.
    description: "In 1810 Sweden elects Napoleon's marshal Bernadotte as crown prince; he founds the Bernadotte dynasty that still reigns in Sweden today."
    status: "published"
    sha256: "e410c733255da3cb4bd97df1421cccf0ba592e9c4b428c8878df37d7b5cf9657"
  - number: "2931"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Cry of Dolores"
    date: "1810 CE"
    region: "Mexico"
    poem: |
      Before the dawn, in little Dolores town,
      Father Miguel Hidalgo climbed the tower
      and rang the church bell hard and long,
      crying freedom in the dark hour.

      "Death to bad government! Long live the Virgin!"
      The Indians and mestizos took up the call —
      I stood among them in the square that morning
      when Mexico's war of independence lit them all.
    description: "On September 16, 1810, Father Miguel Hidalgo rings his church bell at Dolores and cries out for Mexican independence, igniting the war against Spain."
    status: "published"
    sha256: "200046459cb5e3892b1ec7dd9312d948da2749acf62a84728c4b9ff0cbbcfec5"
  - number: "2932"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Machine-Breakers"
    date: "1811 CE"
    region: "England"
    poem: |
      They came at night with hammers and with hunger,
      the weavers of the Midlands, gaunt and grim —
      the frames were eating their children's bread,
      so they smashed the frames, limb from limb.

      They signed their letters "Ned Ludd," a ghost,
      and the name stuck to them ever since —
      Luddites, the first to ask the question
      we're still asking: who does the machine convince?
    description: "In 1811 starving English weavers begin smashing the factory machines they blame for their misery, giving the world the word \"Luddite.\""
    status: "published"
    sha256: "008ce047f63164d448c0429a94565c6c565f7a64d2a4ff1e4be35fbd2257659a"
  - number: "2933"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Quiet Republic"
    date: "1811 CE"
    region: "Paraguay"
    poem: |
      No great battle, no famous cry —
      Paraguay just slipped the Spanish leash,
      quietly, in the night, and woke up free,
      South America's first lasting republic of peace.

      While the continent burned with war around it,
      this small land chose the steady hand —
      I crossed its border in that year
      and found the calmest newborn in the land.
    description: "In 1811 Paraguay quietly breaks from Spain and becomes South America's first lasting independent republic."
    status: "published"
    sha256: "167566ccfc528150cc6299bf1888fb0ed5fedb9df0aeca3e503ad8148523f7cc"
  - number: "2934"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Tippecanoe's Dawn Battle"
    date: "1811 CE"
    region: "Indiana"
    poem: |
      They hit at dawn, Tecumseh's warriors,
      while Harrison's camp was still half-asleep —
      but the soldiers held, and by the sunrise
      the Prophet's town was ash in a heap.

      It broke the confederacy Tecumseh built,
      the dream of one great Native stand —
      I walked that field at Tippecanoe
      where the Old Northwest changed hands.
    description: "William Henry Harrison's troops defeat Tecumseh's confederacy at Tippecanoe in 1811, breaking organized Native resistance in the Old Northwest."
    status: "published"
    sha256: "c97b7218b1cb9476633fe4d6f51e43fe0c8b450b19e74641419ea814b08b3c85"
  - number: "2935"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Second War With Britain"
    date: "1812 CE"
    region: "America"
    poem: |
      They called it the Second War of Independence —
      impressment, trade, the frontier's flame —
      and Congress voted, close and bitter,
      to fight the British once again.

      I watched them burn and bleed for three years,
      from Detroit's shame to New Orleans' pride —
      a war nobody won and everybody claimed,
      and a young nation that proved it could survive.
    description: "The United States declares war on Britain in 1812 over impressment and trade, beginning three years of fighting on land and sea."
    status: "published"
    sha256: "2953da182aaa147a34fce2a691e0285937e255b7c1f0c957d6ca73d55544c116"
  - number: "2936"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Road to Moscow"
    date: "1812 CE"
    region: "Russia"
    poem: |
      Six hundred thousand men — the largest army
      Europe had ever seen in one array —
      Poles, Frenchmen, Germans, Italians,
      marching east in the summer's sway.

      Napoleon at their head, invincible,
      certain the Tsar would sue for peace —
      I watched that river of men cross the Niemen,
      and felt the old world start to crease.
    description: "In June 1812 Napoleon invades Russia with a Grand Army of six hundred thousand men — the greatest invasion Europe had ever seen."
    status: "published"
    sha256: "58cd04a963a832fd574dd362ae3dbb759bdb9b289693c2f98d42fe54581d3a0b"
  - number: "2937"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Moscow Burns, the Army Freezes"
    date: "1812 CE"
    region: "Russia"
    poem: |
      He took Moscow and found it empty —
      then the fires started, street by street,
      and the Tsar would not come to the table,
      so the Grand Army turned in retreat.

      Then came the Russian winter, the general
      no army has ever beaten yet —
      snow, hunger, Cossacks at the flanks,
      and half a million men the snows forget.
    description: "Napoleon captures a burning, empty Moscow in 1812, then retreats through the Russian winter that destroys his Grand Army."
    status: "published"
    sha256: "4fffbf983e65466019d33004d29d7365c0acd97b7d8cc5101b2db66cc73667b2"
  - number: "2938"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Fairy Tales for a Dark Time"
    date: "1812 CE"
    region: "Germany"
    poem: |
      While armies marched and empires fell,
      two brothers in Kassel bent to write —
      Jacob and Wilhelm Grimm, collecting stories
      old women told by firelight.

      Cinderella, Snow White, Hansel and Gretel —
      they saved them all from being lost —
      I sat in that cold year of war
      and watched them pay the storyteller's cost.
    description: "In 1812 the Brothers Grimm publish their first collection of folk tales, preserving Cinderella, Snow White, and the world's great fairy tales."
    status: "published"
    sha256: "4c2210c3dd370b1973431a6526a43d4ca6939d9f1d2444b3fe6f37656e827be9"
  - number: "2939"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Mr. Darcy Walks In"
    date: "1813 CE"
    region: "England"
    poem: |
      She wrote it at a little wooden desk,
      anonymous — "By a Lady," nothing more —
      and Elizabeth Bennet walked off the page
      and into every English heart's front door.

      I read it in the year it came,
      Pride and Prejudice, sharp and bright and true —
      Jane Austen, who never left her village,
      saw the whole world clearer than most ever do.
    description: "Jane Austen publishes Pride and Prejudice in 1813, and Elizabeth Bennet becomes one of literature's most beloved heroines."
    status: "published"
    sha256: "21adebb1ae7117bcd39e16538bf1683fc94283c43a03b0b47e2c305c67db19f0"
  - number: "2940"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Perry's Flagship Victory"
    date: "1813 CE"
    region: "Great Lakes"
    poem: |
      "We have met the enemy and they are ours" —
      Perry wrote it after Lake Erie's fray,
      having rowed through cannon fire to a new flagship
      when his own was shot away.

      I watched the British colors come down
      on every ship of Barclay's line that day —
      the first time an entire British squadron
      ever struck to an American array.
    description: "Oliver Hazard Perry destroys the British fleet on Lake Erie in 1813, the first time a full British squadron ever surrendered to Americans."
    status: "published"
    sha256: "7e3a73a7a598156435a66799fbfa390f4a61fe6de87c8b4942b918c1a11ee8ca"
  - number: "2941"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Battle of the Nations"
    date: "1813 CE"
    region: "Germany"
    poem: |
      Half a million men on one field —
      Leipzig, four days of smoke and roar,
      Russians, Prussians, Austrians, Swedes
      against the French, and then no more.

      Napoleon's empire in Germany broke there,
      his allies melting in the fray —
      I stood on the heights and watched the tide
      of twenty years of conquest drain away.
    description: "At Leipzig in 1813 half a million men fight the Battle of the Nations, and Napoleon's empire in Germany collapses."
    status: "published"
    sha256: "73b052888feb8d9e57f1b81f5ec008ede4980a6f7325722f8695bdfa3723ee91"
  - number: "2942"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Napoleon Gives Up the Throne"
    date: "1814 CE"
    region: "France"
    poem: |
      They came for him from every side,
      and Paris opened up its gates —
      so at Fontainebleau he signed the paper,
      and gave up what the world calls great.

      I watched him try to take his own life first —
      the poison failed, as if even death said no —
      then he sailed for Elba, a tiny island kingdom,
      an emperor with nowhere left to go.
    description: "Defeated on all sides in 1814, Napoleon abdicates at Fontainebleau and sails into exile on the island of Elba."
    status: "published"
    sha256: "bae3f0a90ae21cff6aa8d68d8110359105a42576811d3b12c03fea5c0a6bd88c"
  - number: "2943"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "A Constitution in the Snow"
    date: "1814 CE"
    region: "Norway"
    poem: |
      At Eidsvoll, in a manor house in spring,
      one hundred twelve Norwegians wrote it down —
      one of the freest constitutions on the earth,
      a people's law, no king to wear the crown.

      Then the great powers gave them to Sweden,
      and the freedom tasted half like loss —
      but the paper held, and holds to this day,
      a constitution written at freedom's cost.
    description: "Norway writes one of the world's freest constitutions at Eidsvoll in 1814, though the great powers then force it into union with Sweden."
    status: "published"
    sha256: "5b29aba0671162d18fb4af319dd7724ff3e4e66707e3aa76a5fad9b88f02b34f"
  - number: "2944"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Capital in Flames"
    date: "1814 CE"
    region: "Washington"
    poem: |
      I watched them come up Bladensburg road,
      the British redcoats, steady as a drum —
      the Americans ran, the city emptied,
      and the torchmen did what torchmen come to do.

      The White House burned. The Capitol burned.
      Dolly Madison saved the portrait of George —
      and in the smoke of Washington that night,
      a young republic learned what war will forge.
    description: "In August 1814 British troops march into Washington and burn the White House and the Capitol — the only foreign capture of America's capital."
    status: "published"
    sha256: "3028ce118ab2018f22223420b65281109b692359e245ccecead0177c136baa29"
  - number: "2945"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Dance of the Peacemakers"
    date: "1814 CE"
    region: "Vienna"
    poem: |
      They waltzed while they redrew the map —
      kings and ministers, a glittering crowd,
      dancing till dawn in Vienna's ballrooms,
      then carving up the continent, calm and proud.

      "The Congress dances, but it does not move" —
      I watched them trade whole peoples like wine —
      and the peace they built would hold for decades,
      bought with borders drawn in ballroom time.
    description: "Europe's rulers gather at the Congress of Vienna in 1814 to redraw the map after Napoleon, waltzing while they trade nations."
    status: "published"
    sha256: "a32a705c970e8de0b338a3eeca3445e361fbb6f877125cde084e145261ac8106"
  - number: "2946"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Battle After the Peace"
    date: "1815 CE"
    region: "Louisiana"
    poem: |
      The treaty was signed on Christmas Eve
      in Ghent — the war was done, they'd say.
      But nobody told the ships at sea,
      and Jackson didn't get the news till January.

      So the British came at New Orleans,
      and his riflemen cut them down in rows —
      two thousand casualties to thirteen,
      a battle fought after the peace nobody knows.
    description: "Two weeks after the War of 1812's peace treaty is signed, Andrew Jackson's riflemen crush the British at New Orleans — a battle fought after the war was over."
    status: "published"
    sha256: "96d4af452c8158bfa665bdd22e2f1174e1732124c2d1a3154f40e187bf14787d"
  - number: "2947"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Mountain That Darkened the World"
    date: "1815 CE"
    region: "Indonesia"
    poem: |
      April tenth — the sky tore open
      over Sumbawa, and Tambora blew —
      the loudest explosion in recorded history,
      heard a thousand miles, the whole sky askew.

      Three plumes of ash, a column miles high,
      villages buried where the mountain stood —
      I watched the sea boil and the sun go strange,
      and the world would pay for it in cold and flood.
    description: "Mount Tambora erupts in April 1815 in the largest volcanic explosion in recorded history, and its ash will chill the entire planet."
    status: "published"
    sha256: "49a8527460d207e7175cfa289f788c3b38aaa9dbae40ac2979575b2eec4257b8"
  - number: "2948"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Waterloo Ends It"
    date: "1815 CE"
    region: "Belgium"
    poem: |
      One rainy Sunday in June, the mud held —
      Napoleon's guns bogged down till noon,
      Wellington held the ridge at Mont-Saint-Jean,
      and Blücher's Prussians came that afternoon.

      The Old Guard broke. The Guard that never broke.
      I watched the emperor's carriage roll away —
      twenty years of war ended in a field in Belgium,
      and Europe exhaled at the end of day.
    description: "On June 18, 1815, Wellington and Blücher crush Napoleon at Waterloo, ending twenty years of Napoleonic war."
    status: "published"
    sha256: "6d37abb41e789392b4d097b6bd00878fe1d39b3664284044a7de437972e3095a"
  - number: "2949"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Eighteen Hundred and Froze to Death"
    date: "1816 CE"
    region: "The World"
    poem: |
      They called it eighteen-hundred-and-froze-to-death —
      snow in July in New England's fields,
      frost in August, crops black in the ground,
      and famine walking where the harvest yields.

      Tambora's ash had veiled the sun,
      and the whole earth shivered through the year —
      I traveled through that starving summer
      and felt the planet's cold draw near.
    description: "Tambora's ash veils the sun in 1816, the Year Without a Summer — crops fail worldwide and famine stalks the globe."
    status: "published"
    sha256: "0c98c4ecd8169ade0a5144ff65173fad99e910d913d3942190410e9b0e23c55e"
  - number: "2950"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "A Monster Dreamed by a Lake"
    date: "1816 CE"
    region: "Switzerland"
    poem: |
      The summer never came that year —
      rain and cold kept them indoors by the lake,
      Lord Byron, Percy Shelley, and eighteen-year-old Mary,
      telling ghost stories for storytelling's sake.

      "Each of us will write a ghost story," Byron said —
      and Mary dreamed a monster into life that night,
      a creature stitched from dead men's parts,
      and woke to write it by the candlelight.
    description: "Trapped indoors by the cold summer of 1816, eighteen-year-old Mary Shelley dreams up Frankenstein during a ghost-story contest at Lake Geneva."
    status: "published"
    sha256: "8d19b3616a612be1066ce7398d35343e4fc32e8e3e3eee030b73a513d21d9134"
  - number: "2951"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The South Declares Itself Free"
    date: "1816 CE"
    region: "Argentina"
    poem: |
      In Tucumán, in a congress hall,
      the delegates of the south stood one by one
      and signed their names to independence —
      the United Provinces, free of Spain, begun.

      No king across the ocean anymore,
      no viceroy's seal on what they do —
      I watched them sign it in July,
      and South America signed it too.
    description: "In July 1816 the congress at Tucumán declares the United Provinces of South America independent of Spain."
    status: "published"
    sha256: "ded266b1a39b2aa3d991125b13c1a90370a0234a47f6207c55ced312eb5c6e09"
  - number: "2952"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Digging the Ditch to the West"
    date: "1817 CE"
    region: "New York"
    poem: |
      They called it Clinton's Ditch, a fool's canal —
      three hundred sixty-three miles through the wild,
      dug by hand, by Irishmen and mules,
      a water road for a young and hungry child.

      I walked the towpath as they dug,
      through forest, swamp, and limestone deep —
      and when it opened, the West poured east,
      and the East poured west, in one long sweep.
    description: "Ground breaks on the Erie Canal in 1817 — a 363-mile hand-dug waterway that will tie the American frontier to the sea."
    status: "published"
    sha256: "92b0a1335dd408fcdf41e17c2e162fba816550b068b437c4e7509052dd75c201"
  - number: "2953"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Bolívar's River Fortress"
    date: "1817 CE"
    region: "South America"
    poem: |
      He'd lost Venezuela twice and come back —
      Bolívar, who would not stay beat,
      made Angostura his capital on the Orinoco,
      a river fortress none could cheat.

      From there he planned the march across the Andes,
      the wildest campaign of them all —
      I sat with him by the river's edge
      and watched the Liberator stand tall.
    description: "In 1817 Simón Bolívar establishes Angostura on the Orinoco as his revolutionary capital and rallies the South American liberation."
    status: "published"
    sha256: "d954bb43ec2b4d983999a8f0df636dfd2b8ae0d0796025b7f87679f6c28a54b4"
  - number: "2954"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The First Seminole War"
    date: "1817 CE"
    region: "Florida"
    poem: |
      Jackson crossed the line with an army,
      chasing Seminoles into Spanish ground —
      Florida belonged to Spain on paper,
      but Spain's grip was nowhere to be found.

      He took the forts, he hanged the traders,
      and Madrid could only watch and frown —
      I rode that border in the heat
      and watched an empire's claim burn down.
    description: "In 1817 Andrew Jackson invades Spanish Florida pursuing Seminoles, seizing forts and breaking Spain's hold on the peninsula."
    status: "published"
    sha256: "036a480c62c9b4c5aea55fb9d2210bfd0d45fd9934bd9f41057d9852efc51f93"
  - number: "2955"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Frankenstein Walks"
    date: "1818 CE"
    region: "England"
    poem: |
      Anonymous — no name upon the title —
      a novel by an eighteen-year-old girl,
      about a student and his creature,
      and the world it set in a whirl.

      Victor Frankenstein, the modern Prometheus,
      who made a man and ran from what he'd done —
      I read it in that first edition year
      and knew a new kind of story had begun.
    description: "Mary Shelley's Frankenstein is published in 1818, giving the world the modern monster — and inventing science fiction."
    status: "published"
    sha256: "e0ff971db3704cc8a38dcb6c5350535be786d62da0c1ec1c634508f96dacd2b0"
  - number: "2956"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Maipú Wins a Nation"
    date: "1818 CE"
    region: "Chile"
    poem: |
      San Martín had crossed the Andes in the snow,
      an army where no army ought to go —
      and at Maipú, on the fifth of April,
      he broke the Spanish power's final flow.

      Six thousand royalists, dead or captured,
      Chile free forever from that day —
      I stood upon that plain at evening
      and watched an empire walk away.
    description: "José de San Martín's crushing victory at Maipú in April 1818 ends Spanish rule in Chile for good."
    status: "published"
    sha256: "54f2a5e0f53b5594d11a7f62bdd416430738c2c634085f040c1b5294429abdf2"
  - number: "2957"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Shaka Forges the Zulu"
    date: "1818 CE"
    region: "Southern Africa"
    poem: |
      At Gqokli Hill his regiments stood,
      disciplined as any in the world —
      the short stabbing spear, the buffalo horns,
      and a kingdom like a storm unfurled.

      Shaka took scattered clans and made an army,
      made an army and made a nation —
      I watched his warriors drill in the dust
      and felt the earth change its vibration.
    description: "Shaka's disciplined regiments triumph at Gqokli Hill in 1818, and the Zulu kingdom rises over southern Africa."
    status: "published"
    sha256: "95fd941bead4141dc20da6687752119e126a50a303fc164c416f212684fdd06f"
  - number: "2958"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Prairie State Joins"
    date: "1818 CE"
    region: "Illinois"
    poem: |
      The twenty-first star on the flag —
      Illinois, the tall-grass prairie sea,
      joined the Union in December's cold,
      and the settlers came, and came, and came to be.

      I walked that grass when it was taller
      than a man on horseback, waving gold —
      and watched the plows turn under heaven
      to make the breadbasket of the world.
    description: "Illinois becomes the twenty-first American state in 1818, and settlers pour onto the tall-grass prairie."
    status: "published"
    sha256: "61595f0aa9d8189f8c725fd66bf43c403418e496d3e391a4696bcb9d7db74e53"
  - number: "2959"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Raffles Plants a Flag"
    date: "1819 CE"
    region: "Singapore"
    poem: |
      A swampy island at the tip of Malaya,
      tigers in the jungle, pirates in the strait —
      Stamford Raffles saw a free-trade port
      where others saw a worthless piece of fate.

      He raised the Union Jack in January,
      signed a treaty with the local lord —
      I stood on that muddy shore and watched
      the founding of what trade would make adored.
    description: "Stamford Raffles founds Singapore as a free-trade British port in 1819 — the seed of a future great city."
    status: "published"
    sha256: "fbe302e501041928f6c0d3e844e47699e8f689a46192e7733df9792643625bb0"
  - number: "2960"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Peterloo's Bloody Field"
    date: "1819 CE"
    region: "Manchester"
    poem: |
      Sixty thousand came in peace that day,
      with banners, children, Sunday-best attire,
      to hear a man speak about the vote —
      and the magistrates sent in the cavalry's fire.

      Eleven dead. Six hundred hurt.
      Sabres against unarmed men in a field —
      I was at St. Peter's when they charged,
      and "Peterloo" is what that day would yield.
    description: "In August 1819 cavalry charges a peaceful crowd demanding voting reform at St. Peter's Field, Manchester — eleven die in the Peterloo Massacre."
    status: "published"
    sha256: "8d2c659f882cac616f16c77f29209e28bf2e58b6f7a27632b8c9c0f327d7acdc"
  - number: "2961"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Old Gods Fall"
    date: "1819 CE"
    region: "Hawaii"
    poem: |
      The young king broke the kapu —
      ate with women, which no man may do,
      and the priests waited for the gods to strike —
      but no lightning came, no thunder through.

      In one season, centuries of taboo
      crumbled like a temple in the rain —
      I watched Hawaii's ancient religion
      fall without a battle, without pain.
    description: "In 1819 young King Kamehameha II breaks the sacred kapu taboos, and Hawaii's ancient religion collapses within a season."
    status: "published"
    sha256: "a3b41819ad89aeb8240fd3fe1e50ee25e8d33972e2eb7e91bbca71a7d0614879"
  - number: "2962"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The White Continent Sighted"
    date: "1820 CE"
    region: "Antarctica"
    poem: |
      Sealers chasing fur, explorers chasing fame,
      pushed south through the screaming fifties' foam —
      and there it rose: a wall of white,
      the last continent, the last unknown home.

      No flag had ever flown above that ice,
      no human foot had touched that shore —
      I stood on a pitching deck and saw it:
      the earth's final locked door.
    description: "In 1820 sealers and explorers glimpse Antarctica's icy coast — the last continent discovered by humanity."
    status: "published"
    sha256: "9ec397432fe5049b9497ea4d0b73e27afee9f15fc2786077dcf878c57903cb46"
  - number: "2963"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Missouri Bargain"
    date: "1820 CE"
    region: "America"
    poem: |
      They drew a line across the West —
      thirty-six thirty, latitude's cold line:
      slavery below it, freedom above,
      a bargain signed in Congress, by design.

      It held the Union together for a while,
      a compromise of maps and human fate —
      I watched them draw it, and I knew:
      you can't split freedom with a line and call it straight.
    description: "The Missouri Compromise of 1820 draws a line across the West — slavery permitted below it, banned above — postponing America's reckoning."
    status: "published"
    sha256: "2fa053f9553d57d313691b7826cf7cd0bec3f034d6ac6d6494ab20918f53de0a"
  - number: "2964"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Venus of Milo Unearthed"
    date: "1820 CE"
    region: "Greece"
    poem: |
      A farmer digging on the isle of Melos
      struck marble with his spade that spring —
      a goddess, armless, two thousand years old,
      and the world stopped to look at the thing.

      They carried her to Paris, to the Louvre,
      where she stands to this very day —
      I was there when they brushed the dirt away,
      and beauty came back from so far away.
    description: "In 1820 a farmer on the Greek island of Melos digs up the armless marble Venus, now one of the Louvre's great treasures."
    status: "published"
    sha256: "ea78263b1d259c8cae762968774531ab1d54a7633151e2fb9f15909860f33295"
  - number: "2965"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "A Nurse Is Born"
    date: "1820 CE"
    region: "Florence"
    poem: |
      She was born in Florence, hence the name —
      Florence Nightingale, a rich man's girl,
      who heard a different calling in the night
      and answered it, and changed the world.

      No lamp yet. No war yet. Just a baby.
      But I held the thread of what would come —
      the girl who'd carry light through dying wards
      and make nursing what it would become.
    description: "Florence Nightingale is born in Florence in 1820 — the girl who will one day carry a lamp through the wards of war and found modern nursing."
    status: "published"
    sha256: "e92417c918bf2350855d7704e78cd8001253d1f784a38c4a0fe647e7e42cc445"
  - number: "2966"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Greeks Rise"
    date: "1821 CE"
    region: "Greece"
    poem: |
      Four hundred years beneath the Turk —
      and then, in the Peloponnese that spring,
      the priests blessed banners, the klephts came down,
      and the Greeks rose up to be Greeks again.

      It was brutal, both sides, no quarter —
      but Byron would die for it, and Europe's heart
      beat with the land of Marathon and Homer.
      I watched a nation tear itself apart — to start.
    description: "In 1821 the Greeks revolt against four centuries of Ottoman rule, beginning a war of independence that captures Europe's imagination."
    status: "published"
    sha256: "df267283f03984a14a84702fde0c66f9551b0d77dd051561411eb3d3659163bd"
  - number: "2967"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Emperor Dies Alone"
    date: "1821 CE"
    region: "St. Helena"
    poem: |
      A rock in the Atlantic, a damp house,
      a man who'd ruled from Madrid to Moscow's gate —
      Napoleon, fifty-one, dying of the stomach,
      dictating his legend, spinning his fate.

      "Tête d'armée" — head of the army, he whispered,
      and was gone by the evening of May the fifth —
      I stood outside Longwood that night,
      and the century's loudest voice went quiet.
    description: "Napoleon dies on St. Helena in May 1821, alone on his Atlantic rock, dictating the legend of himself to the very end."
    status: "published"
    sha256: "a6084418ea0e2afb9801b716653a8303c1a84eccca8a927e748d5020886d6cbe"
  - number: "2968"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Cry Becomes a Country"
    date: "1821 CE"
    region: "Mexico"
    poem: |
      Eleven years since Hidalgo rang the bell —
      eleven years of war, of loss, of flame —
      and then Iturbide rode into Mexico City,
      and a nation had a flag and a name.

      The viceroy's palace changed its master,
      the cry of Dolores found its end —
      I watched the trumpets in the plaza
      and a colony become a country, my friend.
    description: "After eleven years of war, Mexico wins independence in 1821 and Iturbide enters Mexico City in triumph."
    status: "published"
    sha256: "af59aad5310c2a3d46556a7c5dc7eba34f2364a2593954c0672c88fddeadca59"
  - number: "2969"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Liberia's First Shore"
    date: "1822 CE"
    region: "West Africa"
    poem: |
      They came home to a land they'd never seen —
      freed American slaves, crossing the sea,
      landing on the African coast to build
      a colony of the free, for the free.

      It was hard. The fever took its toll.
      But they raised a flag on that foreign shore —
      I watched the first boats land that year,
      and a new nation's story found its door.
    description: "In 1822 freed American slaves land on the West African coast to found the colony that will become Liberia."
    status: "published"
    sha256: "d07b460d4d350bf32883a09114521e54c757b43b92a998c30ede315818041e98"
  - number: "2970"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Vesey's Secret Plot"
    date: "1822 CE"
    region: "Charleston"
    poem: |
      He'd bought his own freedom with lottery luck —
      Denmark Vesey, carpenter, literate, free —
      and planned a rising for the enslaved of Charleston,
      a city turned to liberty.

      Betrayed. Tried in secret. Hanged with thirty-four.
      The South, terrified, tightened every chain —
      I walked Charleston's streets that summer
      and felt the fear curdle into law's hard rain.
    description: "Denmark Vesey's planned 1822 slave uprising in Charleston is betrayed; he is hanged, and the South tightens its slave codes in fear."
    status: "published"
    sha256: "180b27dc2333ce5c50e59142fb9b321bc137a0863b9a3eb8fbe18a53a03af0cf"
  - number: "2971"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Cry of Ipiranga"
    date: "1822 CE"
    region: "Brazil"
    poem: |
      By a little river, on September seventh,
      Prince Dom Pedro lifted up his sword
      and shouted what Brazil had waited to hear:
      "Independence or death!" — his word.

      No war like the Spanish colonies' —
      a prince's cry, a bloodless break —
      I stood on the Ipiranga's bank that day
      and watched a continent's giant wake.
    description: "On September 7, 1822, Prince Dom Pedro shouts \"Independence or death!\" by the Ipiranga River, and Brazil breaks from Portugal."
    status: "published"
    sha256: "ed376f2b1662a40e11be01a00e12b63e008743655ff3f7d1e9677e0313a4df59"
  - number: "2972"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Stone Speaks Again"
    date: "1822 CE"
    region: "Egypt"
    poem: |
      For fourteen centuries the hieroglyphs were silent —
      pretty pictures, nobody could read.
      Then Champollion, young and brilliant,
      found the key in a cartouche's royal seed.

      Ptolemy. Cleopatra. The names rang out,
      and three thousand years began to talk —
      I watched him crack the Rosetta Stone,
      and ancient Egypt learned to walk.
    description: "In 1822 Jean-François Champollion deciphers the Rosetta Stone's hieroglyphs, and ancient Egypt begins to speak again after fourteen silent centuries."
    status: "published"
    sha256: "40449822342679213fc5536b226246e2c7b63885444785f425ff008f1cac4071"
  - number: "2973"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Emperor Falls"
    date: "1823 CE"
    region: "Mexico"
    poem: |
      Iturbide crowned himself in 1822,
      emperor of Mexico, with pomp and plume —
      but emperors need more than a crown,
      and his fell in less than a year's room.

      The army turned, the congress fled,
      and Mexico became a republic instead —
      I watched the crown come off that fast,
      and learned how quickly glory's fled.
    description: "Agustín de Iturbide's short-lived Mexican empire collapses in 1823, and Mexico becomes a republic."
    status: "published"
    sha256: "dfd9498d1a2dd56161883edb3be51599e7aaedcf17ca5a55cb595eba308a5197"
  - number: "2974"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Hands Off the Americas"
    date: "1823 CE"
    region: "America"
    poem: |
      President Monroe stood up in December
      and told the crowned heads of Europe plain:
      the Western Hemisphere is closed to colonizing —
      don't come back here again.

      He had no army to enforce it,
      no navy worth the name at sea —
      but Britain's fleet stood behind the words,
      and the doctrine held for a century.
    description: "In 1823 President Monroe warns Europe to stay out of the Americas — the Monroe Doctrine, backed by British sea power."
    status: "published"
    sha256: "5e3e301c95dfa384c620a2c1584d8f3e19992b77963eba5346b3e0cdb654cbca"
  - number: "2975"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Britain's First Burmese War"
    date: "1824 CE"
    region: "Burma"
    poem: |
      The Company's troops sailed up the Irrawaddy,
      British and Indian, red coat and brown —
      Burma's golden kingdom, proud and ancient,
      watched the foreigners take town by town.

      It was the first cut of a long carving,
      Southeast Asia divided by the pen —
      I marched with that column in the jungle heat
      and saw an old world yielding to new men.
    description: "In 1824 Britain invades Burma, beginning the long carving-up of Southeast Asia by colonial powers."
    status: "published"
    sha256: "d2c5986734296c89ff80566c396b5afb7f36707cae19d5914f6ba2b774905a02"
  - number: "2976"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Ode to Joy"
    date: "1824 CE"
    region: "Vienna"
    poem: |
      Stone deaf. He couldn't hear a note.
      But Beethoven stood before the choir that night
      and conducted his Ninth into the world —
      the Ode to Joy, humanity's delight.

      "Alle Menschen werden Brüder" — all men brothers —
      sung by voices he could only see —
      I stood in that hall in Vienna,
      and watched a deaf man set joy free.
    description: "Totally deaf, Beethoven conducts the 1824 premiere of his Ninth Symphony and its Ode to Joy — music's great hymn to brotherhood."
    status: "published"
    sha256: "4119fad231df17ff3dac4a2cab8a07bdef325d3a5c5cb0b7c99deeeb7da0a32a"
  - number: "2977"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Ayacucho Ends an Empire"
    date: "1824 CE"
    region: "Peru"
    poem: |
      High in the Andes, on December ninth,
      Sucre's rebels met the last Spanish host —
      and when the smoke cleared from Ayacucho,
      three hundred years of empire was a ghost.

      The viceroy himself was taken prisoner,
      the last royal army in the Americas done —
      I watched the sun set on that battlefield
      and on Spain's American empire, gone.
    description: "At Ayacucho in December 1824 Sucre destroys the last Spanish army in South America — three centuries of rule, finished."
    status: "published"
    sha256: "c503f5d70637647bd3fe39cb8826cfd3d383a61a286f9309102f9ebb67b35121"
  - number: "2978"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Prince Who Defied an Empire"
    date: "1825 CE"
    region: "Java"
    poem: |
      Prince Diponegoro, Javanese royalty,
      watched the Dutch carve up his father's land —
      and raised the banner of holy war,
      a kris in every loyal hand.

      Five years of guerrilla fire in the jungle,
      the costliest colonial war they'd known —
      I rode those mountain trails beside them
      and watched a prince fight for his own.
    description: "In 1825 Prince Diponegoro launches the Java War against Dutch rule — five years of guerrilla warfare, the costliest colonial war of its age."
    status: "published"
    sha256: "606a1df569f6d6379e34f63fcd953638dcbef0f49461d7d7e50f47a18be12400"
  - number: "2979"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "A Continent Names a Country"
    date: "1825 CE"
    region: "Bolivia"
    poem: |
      Upper Peru was free at last,
      and needed a name for what it'd become —
      so they named it for the Liberator,
      Bolívar — Bolivia — and the deed was done.

      A country named for a living man,
      the only one on earth, they say —
      I was in Chuquisaca when they voted,
      and a continent tipped its hat that day.
    description: "In 1825 Upper Peru declares independence and names itself Bolivia after Simón Bolívar — a nation named for a living liberator."
    status: "published"
    sha256: "7fdff88c0b06d2861fef8bddd458a7321e9791a399521637431c465b08c3cf57"
  - number: "2980"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Iron Horse Goes Public"
    date: "1825 CE"
    region: "England"
    poem: |
      September twenty-seventh, County Durham —
      Stephenson's Locomotion No. 1 took the strain,
      hauling wagons and six hundred passengers
      down the Stockton and Darlington line.

      Twelve miles an hour, and the crowd went wild —
      I rode that first public railway train,
      and felt the future shake the ground:
      the iron horse had left the lane.
    description: "In September 1825 Stephenson's Locomotion No. 1 hauls the first public railway train on the Stockton and Darlington line — the railway age begins."
    status: "published"
    sha256: "30d69b5f5731b8f73eb71eb7017b016dd436b63cf517acafc9aeeeb87823a429"
  - number: "2981"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Decembrists' Doomed Dawn"
    date: "1825 CE"
    region: "Russia"
    poem: |
      They were young officers, back from Paris,
      with constitutions in their heads and hope —
      and on a freezing December morning
      they stood in Senate Square and couldn't cope.

      The Tsar's guns spoke. Five were hanged,
      a hundred more marched off to Siberia's snow —
      I watched that dawn in Petersburg
      and saw Russia's first revolution go.
    description: "In December 1825 young Russian officers rise for a constitution in St. Petersburg; the Decembrist revolt is crushed and its leaders hanged or exiled."
    status: "published"
    sha256: "a55c8c79d6a147555d3e7e4f615b52bd9093db6db10332bfbe2ceb358af65ac8"
  - number: "2982"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Missolonghi's Last Stand"
    date: "1826 CE"
    region: "Greece"
    poem: |
      Starving, out of powder, out of hope,
      the people of Missolonghi made their run —
      a midnight breakout through the Turkish lines,
      and most of them died before the sun.

      Byron had died there two years before,
      and now the town became his song —
      I walked those walls where they fell,
      and Greece's legend grew that long.
    description: "Starving Missolonghi falls to the Turks in 1826, and its doomed midnight breakout becomes Greece's sacred national legend."
    status: "published"
    sha256: "cd19bea59fa97b9e1e5b4a120ee9c4fc4aadcd2d2992fc892f1965a8e1e0a88b"
  - number: "2983"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Two Founders Die on the Fourth"
    date: "1826 CE"
    region: "America"
    poem: |
      Fifty years to the day — July the Fourth —
      and within hours of each other, both were gone:
      Adams in Massachusetts, Jefferson in Virginia,
      the second and third presidents, at dawn.

      Adams's last words: "Thomas Jefferson survives" —
      but Jefferson had died hours before —
      I stood between two houses that morning
      and watched a founding generation close its door.
    description: "On July 4, 1826 — fifty years to the day after independence — John Adams and Thomas Jefferson die within hours of each other."
    status: "published"
    sha256: "4af3f2b071be5b4d1ffcb51760780e0da45ea08f807625ce8f2fe5cdca16ccdb"
  - number: "2984"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The First Photograph"
    date: "1826 CE"
    region: "France"
    poem: |
      All day the light fell on the rooftops,
      all day the pewter plate drank it in —
      Niépce, in his workshop at Le Gras,
      let the sun do what no hand had been.

      Eight hours for one blurry image,
      a rooftop view, all shadows and haze —
      I watched the first permanent photograph
      develop out of the morning's rays.
    description: "In 1826 Niépce fixes the first permanent photograph — a blurry rooftop view exposed for eight hours — and the age of captured light begins."
    status: "published"
    sha256: "69abbb7c088faa9b8d19ae78cde8604ec84b7ae1e19cf13ddaeecfff8549fea4"
  - number: "2985"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Ohm's Quiet Law"
    date: "1827 CE"
    region: "Germany"
    poem: |
      No thunder. No spectacle. Just a teacher
      in Cologne with a wire and a galvanic cell,
      measuring current, patient as prayer,
      until the numbers began to tell.

      Voltage equals current times resistance —
      the law that runs the wired world —
      I watched Georg Ohm write it down,
      and the electric age quietly unfurled.
    description: "In 1827 Georg Ohm publishes his law of electric current — V=IR — the quiet foundation of the entire electrical age."
    status: "published"
    sha256: "0ff9b54a88e47601c7013bf0ddd970bbd7f996226e31ee658a84f50819eab320"
  - number: "2986"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Musket Wars Rage"
    date: "1827 CE"
    region: "New Zealand"
    poem: |
      Hongi Hika sailed to England, met the King,
      came home with muskets by the score —
      and turned them on his Maori rivals
      in the bloodiest tribal wars ever saw.

      Pa fell to volleys where mere spears had ruled,
      the North Island bled for a decade's span —
      I watched the old warfare die that year,
      and a new and terrible arithmetic began.
    description: "In the 1820s Hongi Hika's musket-armed warriors sweep New Zealand's North Island in the bloodiest of the Musket Wars."
    status: "published"
    sha256: "5499e3338f3865a3fe647f429506fb3fe9ed0ca32c1bd772aeab5caf33183345"
  - number: "2987"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Navarino's Guns Free Greece"
    date: "1827 CE"
    region: "Greece"
    poem: |
      October twentieth, in Navarino Bay —
      the British, French, and Russians came as one,
      and in four hours of point-blank cannonade
      the Ottoman fleet was burned and done.

      It was meant to be a show of force,
      a "demonstration" that got out of hand —
      but I watched those ships go down in flames,
      and Greece's freedom washed up on the sand.
    description: "In October 1827 the allied British, French, and Russian fleets annihilate the Ottoman navy at Navarino, sealing Greek independence."
    status: "published"
    sha256: "eba6ddce7257110fc1b5c2b9171e0464d8caf4626c84e6bf73a373aafb833cf3"
  - number: "2988"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Webster's American Words"
    date: "1828 CE"
    region: "America"
    poem: |
      Seventy thousand words, and every one
      spelled the American way, not the King's —
      Noah Webster, twenty years at his desk,
      giving a young nation its own wings.

      Color, not colour. Center, not centre.
      A dictionary as a declaration —
      I held that first edition in my hands:
      American English, a sovereign nation.
    description: "Noah Webster publishes his American Dictionary in 1828, giving American English its own spelling and swagger."
    status: "published"
    sha256: "fe32751962e2da1148bf05c4dc4e419cbc9c9de756dc112b56013a53be960d60"
  - number: "2989"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Lion Is Slain"
    date: "1828 CE"
    region: "Southern Africa"
    poem: |
      His half-brothers came in the night —
      Dingane and Mhlangana, with an assassin's art —
      and Shaka, the lion of the Zulu,
      fell with an assegai in his heart.

      But the kingdom didn't fall with him;
      the regiments stood, the nation held —
      I watched the funeral fires that week
      and the empire its founder's hands had spelled.
    description: "Shaka is murdered by his half-brothers in 1828, but the Zulu kingdom he built marches on."
    status: "published"
    sha256: "92bca776414ef055ab2b35dd09c44d464f9f0a5766bf14a7ed8961c3ef22cf2e"
  - number: "2990"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Old Hickory Takes the White House"
    date: "1828 CE"
    region: "America"
    poem: |
      The frontiersman beat the aristocrat —
      Jackson, the duelist, the general, the man
      of the people, stormed the White House,
      and the common folk came with the clan.

      They trashed the place on inauguration day,
      drank the punch and stood on the chairs —
      I watched democracy get rowdy that March,
      and the frontier take the nation's affairs.
    description: "Andrew Jackson wins the presidency in 1828, bringing the frontier and the common man to power in America."
    status: "published"
    sha256: "306827ebf76fd975f3a767c5168486694495c5347ec00df23af8343d4c6c6dc6"
  - number: "2991"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Catholics Get the Vote"
    date: "1829 CE"
    region: "Britain"
    poem: |
      Three hundred years of penal laws,
      of Catholics barred from Parliament's door —
      and Daniel O'Connell, the Liberator,
      forced the issue to the floor.

      Catholic Emancipation, 1829 —
      they could sit in Parliament at last —
      I watched the vote that cracked the wall
      of three centuries of exclusion past.
    description: "The Catholic Emancipation Act of 1829 lets Catholics sit in Parliament, ending three centuries of political exclusion in Britain."
    status: "published"
    sha256: "9313020bcaef4d635b1fe69cc56a092c83edfb0312fafd8a7a201caef56fa402"
  - number: "2992"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Rocket Wins the Race"
    date: "1829 CE"
    region: "England"
    poem: |
      Five locomotives lined up at Rainhill
      to prove which iron horse was best —
      and Stephenson's Rocket left them all behind,
      thirty miles an hour, the ultimate test.

      I stood beside the track that October
      and felt the wind of it go by —
      the locomotive had arrived for good,
      and the world would never travel by and by.
    description: "Stephenson's Rocket wins the 1829 Rainhill Trials at thirty miles an hour — the locomotive has definitively arrived."
    status: "published"
    sha256: "fd43c11d78e86aeec96ff6d9a0e20499c6acea5442c5851e97598f242e3f1634"
  - number: "2993"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Dots That Let the Blind Read"
    date: "1829 CE"
    region: "France"
    poem: |
      He was fifteen, blind since he was three,
      Louis Braille, a student in Paris town —
      and he took a soldier's night-writing code
      and turned its dots upside down.

      Six dots. Sixty-three combinations.
      Every letter, every word, every song —
      I ran my fingers where his went,
      and the sightless world read, lifelong.
    description: "In 1829 blind fifteen-year-old Louis Braille publishes his raised-dot alphabet, opening books to blind readers forever."
    status: "published"
    sha256: "b4e5ea658a26cc29d757b11976fc0e1d0ff4d9d2ef9aa264921a7bc7d5fe2c36"
  - number: "2994"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Three Glorious Days"
    date: "1830 CE"
    region: "France"
    poem: |
      Three days in July, and Paris rose —
      barricades in every street and square,
      Charles X fled with his ordinances,
      and the tricolor flew in the air.

      They crowned Louis-Philippe, the "citizen king,"
      with an umbrella instead of a crown —
      I walked those barricades at dawn
      and watched another Bourbon tumble down.
    description: "Paris rises in the July Revolution of 1830 — three glorious days that topple Charles X and crown the \"citizen king\" Louis-Philippe."
    status: "published"
    sha256: "4f7507f24b768cd50f8d83114899c4931dca6ec0d02c06c05da559eb66521398"
  - number: "2995"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Iron Road Between Cities"
    date: "1830 CE"
    region: "England"
    poem: |
      Not a coal line this time — a passenger road,
      Liverpool to Manchester, thirty-one miles —
      the first true intercity railway,
      and the crowds came out in smiles.

      Huskisson died beneath the wheels that day,
      the first railway casualty of fame —
      but I rode in those first carriages,
      and travel was never again the same.
    description: "The Liverpool and Manchester Railway opens in 1830 — the world's first true intercity passenger railway."
    status: "published"
    sha256: "43daeafcf9280f05aa625d8ef4885fccb1581358e7013af1b09ad4f8a63f7089"
  - number: "2996"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "A New Nation Is Born"
    date: "1830 CE"
    region: "Belgium"
    poem: |
      It started at the opera, they say —
      Auber's "La Muette," a patriotic song,
      and Brussels rose against the Dutch
      and the revolt ran swift and long.

      By year's end Belgium was a kingdom,
      independent, neutral, free —
      I watched them raise the new flag
      over a nation born from an opera's plea.
    description: "Brussels revolts against Dutch rule in 1830, and Belgium declares itself an independent kingdom."
    status: "published"
    sha256: "01c7d7a581d5bd0a1e272a466e64d5b1aea56194255d97605b6dffaf8af69306"
  - number: "2997"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Hunchback of Paris"
    date: "1831 CE"
    region: "France"
    poem: |
      Victor Hugo looked at Notre-Dame,
      crumbling, slated for the wrecking crew —
      and wrote a novel to save a cathedral,
      with a bell-ringer the world fell for too.

      Quasimodo. Esmeralda. Frollo.
      Paris in 1482, alive and loud —
      I read it in the year it came,
      and the cathedral was saved by the crowd.
    description: "Victor Hugo publishes Notre-Dame de Paris in 1831, and his hunchbacked bell-ringer saves both a novel and a cathedral."
    status: "published"
    sha256: "a394a7f598a74990972a8a9ebf30f76f5f83fd950291dc89abd2b6f74420167f"
  - number: "2998"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Nat Turner's Rebellion"
    date: "1831 CE"
    region: "Virginia"
    poem: |
      He saw signs in the sun and the sky —
      Nat Turner, preacher, led them out at night,
      through Southampton County, farm to farm,
      a rebellion of the wronged, by lantern light.

      Fifty-seven whites dead. Then the militia came.
      Turner hid for weeks, then swung —
      and the South's fear hardened into law:
      tighter chains for every slave, old and young.
    description: "Nat Turner leads enslaved rebels through Southampton County, Virginia, in 1831; the revolt is crushed and the South's slave codes harden."
    status: "published"
    sha256: "071c3c0463a95101f3746fe4f33fd46b31c26cdf549dd13c556055784a93215e"
  - number: "2999"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Faraday's Spinning Miracle"
    date: "1831 CE"
    region: "England"
    poem: |
      A bookbinder's boy with no university,
      Michael Faraday, in the Royal Institution's gloom,
      moved a magnet through a coil of wire
      and made a needle jump across the room.

      Electromagnetic induction — the spark
      that would light the whole electric age:
      motors, generators, power stations,
      all born in that quiet man's cage.
    description: "In 1831 Michael Faraday discovers electromagnetic induction — the principle behind every generator and motor of the electric age."
    status: "published"
    sha256: "6600202885989435253c5cd966dafdec36e48c96bc1b132c1ec814a8272c7132"
  - number: "3000"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Beagle Sails"
    date: "1831 CE"
    region: "England"
    poem: |
      December twenty-seventh, Plymouth Sound —
      a little brig, a seasick young man,
      Charles Darwin, twenty-two, the ship's naturalist,
      off on a voyage with no certain plan.

      Five years around the world he'd go,
      collecting finches, fossils, coral, bone —
      I watched the Beagle clear the harbor,
      carrying the seed of the Origin, unknown.
    description: "On December 27, 1831, young Charles Darwin boards HMS Beagle for the five-year voyage that will seed On the Origin of Species."
    status: "published"
    sha256: "d2e76f11aeff7e478f350ca81da1d966e7d4c36eb40a034515b7d46688fc58ae"
  - number: "3001"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Vote Gets Wider"
    date: "1832 CE"
    region: "Britain"
    poem: |
      The rotten boroughs fell at last —
      Old Sarum, with its seven voters, gone —
      and the middle class got the franchise,
      the Great Reform Act's new dawn.

      Not the workers. Not the women. Not yet.
      But the door had cracked, and through it shone
      the first real widening of the vote —
      I watched the old corruption come undone.
    description: "The Great Reform Act of 1832 sweeps away rotten boroughs and extends the vote to the middle class — the first great widening of British democracy."
    status: "published"
    sha256: "18ca740381638ad0dd31f59c0a00ea7505d5b91ce577196c03d91774626c22ba"
  - number: "3002"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Black Hawk's Last War"
    date: "1832 CE"
    region: "Illinois"
    poem: |
      He came back across the Mississippi
      with a thousand hungry, hopeful souls —
      Black Hawk, to plant corn in his old village,
      and found the settlers had taken the shoals.

      They chased him north, they cut him down
      at Bad Axe, where the river ran red —
      I watched the last resistance of the prairie
      end with the Sauk's bravest dead.
    description: "Sauk chief Black Hawk's doomed 1832 resistance ends in slaughter on the Mississippi, opening the prairie to white settlement."
    status: "published"
    sha256: "16e2ff5baeeeedefa158a68c8c204a58c79ac1c1461742a351f05d076c8c3612"
  - number: "3003"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Lion of the Desert Rises"
    date: "1832 CE"
    region: "Algeria"
    poem: |
      The French had taken Algiers in a summer —
      but the interior was another land,
      and Abd al-Qadir, scholar and horseman,
      raised the tribes with a holy hand.

      Fifteen years he'd fight them, raid and vanish,
      a desert ghost they couldn't catch —
      I rode those Atlas trails beside him
      and watched an empire meet its match.
    description: "In 1832 Abd al-Qadir begins his fifteen-year holy war against the French conquest of Algeria."
    status: "published"
    sha256: "ba2124c080d4dcb21c3a12de3ede29d83df2f28cce22d6e6847c7b3b490b27d3"
  - number: "3004"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Chains Fall Across an Empire"
    date: "1833 CE"
    region: "Britain"
    poem: |
      Eight hundred thousand people —
      imagine it: a nation set free in a day —
      Parliament abolished slavery itself,
      and the chains fell where the Union Jack held sway.

      The planters got their compensation;
      the freed got their freedom, nothing more —
      but I walked the Caribbean that August
      and heard the singing from shore to shore.
    description: "In 1833 Parliament abolishes slavery throughout the British Empire — eight hundred thousand enslaved people walk free."
    status: "published"
    sha256: "e73252c74bc74985516eb5f9b4137a9afc60e34ff4de1492a7521615733a3dc9"
  - number: "3005"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Children Leave the Mills — A Little"
    date: "1833 CE"
    region: "Britain"
    poem: |
      Nine years old to work the night shift?
      Not anymore — not quite, not yet —
      the Factory Act said: no child under nine,
      and the older ones got hours, and sunset.

      Inspectors — four of them, for all England —
      to walk the mills and check the law —
      I stood outside a Manchester mill that year
      and watched the smallest workers walk out the door.
    description: "Britain's 1833 Factory Act limits child labor in textile mills — the first crack in the dark satanic system."
    status: "published"
    sha256: "aff4676a25c40499b3ed11d97a34c553c1d336039ad6db997c829fb8fc468d9c"
  - number: "3006"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Penny Press Is Born"
    date: "1833 CE"
    region: "America"
    poem: |
      Six cents was the price of knowing —
      until Benjamin Day had a cheaper plan:
      the New York Sun, for just a penny,
      news for the ordinary working man.

      He sold it on the street, he hawked the headlines,
      police courts, gossip, wonders, crime —
      I bought one off a newsboy's arm
      and watched the news become the people's time.
    description: "The New York Sun sells for a penny in 1833, and news becomes something ordinary working people can afford."
    status: "published"
    sha256: "c0f384c8465ef2d8ee5e567a674ae3631e0e6d44e573fcf099b80b71fe7502d5"
  - number: "3007"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Pushkin's Wasted Dandy"
    date: "1833 CE"
    region: "Russia"
    poem: |
      He wrote it in stanzas, a novel in verse —
      Eugene Onegin, bored and bright and vain,
      Tatiana's letter, Lensky's duel,
      Russian life in joy and pain.

      Pushkin, the father of it all,
      gave Russia her own tongue to sing —
      I read it in the year it came,
      and felt a literature take wing.
    description: "Alexander Pushkin publishes Eugene Onegin in 1833, the novel in verse that made Russian literature."
    status: "published"
    sha256: "e1e656c7e5d60ff1e63484fca9f81ab2c389fb367b45502d104d6a334f918376"
  - number: "3008"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "One Market, Many Princes"
    date: "1834 CE"
    region: "Germany"
    poem: |
      Thirty-nine states, thirty-nine tariffs,
      every border a tollbooth's hand —
      until Prussia's Zollverein swept them away
      and made one market of the German land.

      The princes kept their crowns and courts,
      but trade flowed free from Rhine to Oder —
      I crossed those borders as they fell,
      and felt Germany gathering toward order.
    description: "Prussia's Zollverein customs union of 1834 binds most German states into a single market — the economic foundation of a united Germany."
    status: "published"
    sha256: "ff32cfdeca523073209109a5c8b57a374a4187a1fcef176efd0267d40eec4aa8"
  - number: "3009"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Workhouse Age"
    date: "1834 CE"
    region: "Britain"
    poem: |
      The new Poor Law had a simple creed:
      relief must be worse than the lowest wage —
      so they built the workhouses, grim and gray,
      and herded the destitute inside the cage.

      Families split. Oakum picked. Gruel served.
      Help with a hard and shaming edge —
      I stood outside St. Pancras workhouse
      and watched the poor cross over the ledge.
    description: "Britain's 1834 Poor Law herds the destitute into workhouses — relief deliberately made harsher than the lowest wage."
    status: "published"
    sha256: "58ed9f31cc67ba70f41b3bbafbc605696f4356cf693583fea2a7cdba389799d4"
  - number: "3010"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Parliament Burns Down"
    date: "1834 CE"
    region: "London"
    poem: |
      It started with the tally sticks —
      old wooden tax records, burned in a furnace,
      and the furnace overheated, and the flames
      took the whole medieval palace in a trance.

      London watched its legislature burn,
      Westminster Hall alone survived the night —
      I stood across the Thames and watched
      democracy's old house go up in light.
    description: "Fire guts the Houses of Parliament in October 1834, and London watches its medieval legislature burn — only Westminster Hall survives."
    status: "published"
    sha256: "8e760f61a367057863432552e78d8cfb95a070230c5d9290b4cce4ef4950d19e"
  - number: "3011"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Great Trek Begins"
    date: "1835 CE"
    region: "South Africa"
    poem: |
      They loaded the wagons and rolled north —
      Boer families, out from under British rule,
      seeking their own promised land
      beyond the Orange River's pool.

      Ten thousand souls in ox-drawn laagers,
      into the unknown, with Bible and gun —
      I rode beside those creaking wheels
      and watched a wandering nation run.
    description: "In 1835 Boer families begin the Great Trek north out of British-ruled Cape Colony, seeking their own promised land."
    status: "published"
    sha256: "1b7d4e4dcca410b5ce9f0eaf53215bbc15b792b5678cf117f0e89c13b4025e09"
  - number: "3012"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Tocqueville Reads a Nation"
    date: "1835 CE"
    region: "America"
    poem: |
      A young French aristocrat came to look —
      Alexis de Tocqueville, twenty-six years old —
      and saw America clearer than Americans,
      in a book both admiring and cold.

      The tyranny of the majority, he warned,
      and the restless hunger to be free —
      I traveled with him down the Mississippi
      and watched him read a nation like the sea.
    description: "Alexis de Tocqueville publishes Democracy in America in 1835 — the Frenchman's clear-eyed portrait of the young republic."
    status: "published"
    sha256: "977e81616519a5725206b188b119541d7f74dbc54656649165507faa27152529"
  - number: "3013"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Come and Take It"
    date: "1835 CE"
    region: "Texas"
    poem: |
      The Mexicans came for the little cannon
      at Gonzales — come and take it, the Texans said,
      flying a flag with a cannon and a star,
      and the first shot of the revolution sped.

      Santa Anna answered with an army,
      and Texas answered with a war —
      I stood on that field in October
      where a republic was keeping score.
    description: "Texans refuse to surrender a cannon at Gonzales in October 1835, and the Texas Revolution begins."
    status: "published"
    sha256: "4f3de0c5977e9d7b26e51e8b1e49c907d5d2067a38b2019d0ec82f821941ef14"
  - number: "3014"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Halley's Comet Returns"
    date: "1835 CE"
    region: "The Sky"
    poem: |
      It came on schedule, as Halley said it would —
      a blazing sword across the autumn sky,
      and in Florida, Missouri, a baby cried:
      Samuel Clemens, born beneath it, high.

      "I came in with Halley's Comet," he'd joke,
      "and I expect to go out with it too" —
      and he did, seventy-five years later.
      I watched it blaze, and watched him too.
    description: "Halley's Comet blazes across the sky in 1835, and Mark Twain is born beneath it — he would die with its return in 1910."
    status: "published"
    sha256: "4e929e69c78b9c72454ce6d2d3f29abf675b91ca3e537066c2bc5ea596eb18d8"
  - number: "3015"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Remember the Alamo"
    date: "1836 CE"
    region: "Texas"
    poem: |
      Thirteen days they held the mission —
      a hundred eighty-odd against four thousand men —
      Travis drew his line in the sand,
      and nobody stepped back over it again.

      Santa Anna's troops came over the walls
      at dawn on March the sixth, and every defender died —
      but "Remember the Alamo" became the cry
      that carried Texas through the countryside.
    description: "Santa Anna's army storms the Alamo in March 1836; every defender dies, and Texas gains its immortal battle cry."
    status: "published"
    sha256: "e441662f1eea399ba0e200e943e095a86c8f055a75921e7bfa4fd1f0a6bb8e21"
  - number: "3016"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "San Jacinto's Eighteen Minutes"
    date: "1836 CE"
    region: "Texas"
    poem: |
      Eighteen minutes. That's all it took.
      Houston's men came screaming from the trees —
      "Remember the Alamo! Remember Goliad!" —
      and Santa Anna's army fell to its knees.

      The dictator himself was captured napping,
      Texas free before the sun went low —
      I ran with that charge that afternoon,
      the shortest battle history knows.
    description: "Sam Houston routs Santa Anna at San Jacinto in April 1836 in eighteen minutes — and Texas is free."
    status: "published"
    sha256: "4a7fd4b3220538609ae7b27ffac6f8e1f615ba8dc3d82e6a64f0a68e3fbffe0c"
  - number: "3017"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Pickwick Makes Them Laugh"
    date: "1836 CE"
    region: "England"
    poem: |
      A young nobody, twenty-four years old,
      writing monthly numbers for a laugh —
      Charles Dickens, and Mr. Pickwick,
      Sam Weller, and the whole mad staff.

      All England waited for the next installment,
      laughed till they cried at Pickwick's crew —
      I stood in the crowd at the print shop door,
      and watched a genius break through.
    description: "Dickens publishes The Pickwick Papers in 1836, and all England laughs with Mr. Pickwick — a literary star is born."
    status: "published"
    sha256: "5897d64f7442aa5357dcae5ae89cea09362016bd9f670576cea73acd6167a8be"
  - number: "3018"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Girl Who Became Queen"
    date: "1837 CE"
    region: "Britain"
    poem: |
      Eighteen years old, and woken in the night —
      "The King is dead," they told the girl —
      and Victoria, small and sheltered,
      inherited the greatest crown in the world.

      She'd reign for sixty-three years,
      give her name to an age, an empire, a time —
      I watched her first council that morning,
      a girl becoming a queen in her prime.
    description: "Eighteen-year-old Victoria takes the British throne in 1837, beginning the sixty-three-year Victorian age."
    status: "published"
    sha256: "db844f9b09d31b9cc5f83a40e16eecac3f5aa16442bc861b5db90d1b49fb201b"
  - number: "3019"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Panic That Broke the Banks"
    date: "1837 CE"
    region: "America"
    poem: |
      The banks just stopped — doors locked, windows dark —
      and the breadlines formed in every town —
      the Panic of 1837, America's first
      great depression, dragging the nation down.

      Five years of hunger, of worthless paper,
      of men who'd been rich begging for bread —
      I walked Wall Street in that hard year
      and watched a young republic learn to dread.
    description: "The Panic of 1837 collapses America's banks and brings breadlines — the young nation's first great depression."
    status: "published"
    sha256: "ddf9265f08b460bc643807c101f2755e52eea3e9b1e5d319d95619966167d9ae"
  - number: "3020"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Dots and Dashes"
    date: "1837 CE"
    region: "America"
    poem: |
      A painter with an obsession —
      Samuel Morse, who'd lost his wife to time and tide,
      built a machine that talked in dots and dashes,
      messages racing where no horse could ride.

      What hath God wrought — he'd ask it later —
      but first he had to make it go:
      a wire, a key, a code of clicks,
      and distance dying, row by row.
    description: "Samuel Morse builds a working electric telegraph in 1837 — messages racing along a wire in dots and dashes."
    status: "published"
    sha256: "525834edffad16cc5ffb7efbbc8a9f1ceffb1d0a677e73c8c3ca769c36b43dd7"
  - number: "3021"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Rebellion in the Snow"
    date: "1837 CE"
    region: "Canada"
    poem: |
      They rose in the cold of December —
      Papineau's patriotes in Lower Canada's snow,
      Mackenzie's farmers in Upper Canada's fields,
      for responsible government, they'd go.

      Both were crushed. The leaders fled or hanged.
      But London listened, in the end —
      I walked those snowy battlefields
      where a nation's freedom found a friend.
    description: "Patriots rise in Upper and Lower Canada in 1837 for responsible government; both rebellions are crushed, but reform follows."
    status: "published"
    sha256: "fccc412fca98ce0492b07cf500718589caad127cda3f7ba4aff4538ebc8a4c81"
  - number: "3022"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The People's Charter"
    date: "1838 CE"
    region: "Britain"
    poem: |
      Six points on a single page —
      a vote for every man, the ballot secret, pay for MPs —
      the People's Charter, published in May,
      and the working men took to the streets.

      Chartism — the first mass workers' movement,
      a million signatures, and then some more —
      I marched with them to Parliament's door
      and watched the people's charter roar.
    description: "Working men publish the People's Charter in 1838 demanding the vote — Chartism, the first mass workers' movement, is born."
    status: "published"
    sha256: "46aa7f8d3549fb6d1f75dd1be1bc2816c0533dd6679ce614058af3c8c10969a8"
  - number: "3023"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Oliver Asks for More"
    date: "1838 CE"
    region: "England"
    poem: |
      "Please, sir, I want some more" —
      a workhouse boy, holding out his bowl,
      and all England felt the shame of it,
      Dickens's Oliver, body and soul.

      The parish beadles, Fagin's den,
      the Artful Dodger picking pockets in the street —
      I read it as the numbers came,
      and a nation couldn't look away from the beat.
    description: "Dickens publishes Oliver Twist in 1838, and little Oliver's \"Please, sir, I want some more\" shames a nation into seeing its poor."
    status: "published"
    sha256: "599df107dc9f090b68dca42f7ba3a519b0a0d0e18cbda0f0417b04c35c0f8f9a"
  - number: "3024"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Trail Where They Cried"
    date: "1838 CE"
    region: "America"
    poem: |
      They marched them at bayonet point —
      the Cherokee, sixteen thousand strong,
      a thousand miles to Oklahoma,
      through winter's cold and summer's long.

      Four thousand died along the way —
      of hunger, cold, and broken heart —
      I walked that trail of tears with them,
      and watched a nation's cruelest art.
    description: "In 1838 federal troops force the Cherokee west at bayonet point; thousands die on the Trail of Tears."
    status: "published"
    sha256: "1c33b3bfe2a04489a1db4e9b8fabd317b9ed1c037245e0f9c26007ed517bfae2"
  - number: "3025"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Blood River"
    date: "1838 CE"
    region: "South Africa"
    poem: |
      Four hundred sixty-four Voortrekkers
      in a laager of wagons, guns in hand —
      against ten thousand Zulu warriors
      on the banks where the river ran red with the land.

      They called it Blood River after,
      and made a covenant that day —
      I stood upon that bloody bank
      and watched a nation-shaping myth hold sway.
    description: "Outnumbered Voortrekkers defeat the Zulu at Blood River in December 1838, and a nation-shaping Afrikaner myth is born."
    status: "published"
    sha256: "67b98b47091587884916574972e8cb9baad526fd46a89dd4997c1bedf86f5144"
  - number: "3026"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The World Learns to Pose"
    date: "1839 CE"
    region: "France"
    poem: |
      Daguerre stood before the Academy
      with a silvered plate, sharp as sight —
      hold still for thirty minutes, please,
      and the camera will steal your light.

      No more blurry eight-hour rooftops —
      portraits, clear as morning air —
      I sat for one that very year,
      and watched the world learn how to stare.
    description: "Daguerre announces the daguerreotype in 1839 — sharp, silvery photographs that anyone could sit for."
    status: "published"
    sha256: "385fa548f4fd8b2212d1707104fbca4e19250f2b28473c9aca7ca9259deb6400"
  - number: "3027"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Opium Goes Up in Smoke"
    date: "1839 CE"
    region: "China"
    poem: |
      Commissioner Lin Zexu meant business —
      twenty thousand chests of British opium,
      seized at Canton and burned and drowned,
      to save his people from the poison's gloom.

      Britain answered with warships, not words —
      the First Opium War had begun —
      I watched the smoke rise off the Pearl River
      and an old empire come undone.
    description: "In 1839 Commissioner Lin Zexu seizes and destroys foreign opium at Canton, and Britain answers with warships — the Opium War begins."
    status: "published"
    sha256: "03993b166d8d9310c8dba9fcaec0e9527f6bbe921de0b9362cba34e8b02e1ad3"
  - number: "3028"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Reform From the Throne"
    date: "1839 CE"
    region: "Ottoman Empire"
    poem: |
      A sixteen-year-old sultan on the throne,
      Abdulmejid, with reformers at his side —
      proclaimed the Tanzimat: equality,
      modern law, for all, both far and wide.

      Muslim, Christian, Jew — one law, he promised,
      an empire remade from the top —
      I heard it read in the Rose Garden
      and watched an old world try to stop.
    description: "In 1839 the young Ottoman sultan proclaims the Tanzimat reforms, promising equality and modern law to all his subjects."
    status: "published"
    sha256: "9a78895d11fbe90f02846d0a7cc11bfaea53f7e655537ce7933ee4444beee321"
  - number: "3029"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Treaty of Waitangi"
    date: "1840 CE"
    region: "New Zealand"
    poem: |
      On a lawn at Waitangi, in February,
      Maori chiefs made their marks one by one —
      a treaty with the British Crown,
      and New Zealand's founding day begun.

      Two versions, two languages, two meanings —
      and the argument's been running ever since —
      I stood on that lawn that morning
      and watched a nation born, and tense.
    description: "Maori chiefs and the British Crown sign the Treaty of Waitangi in February 1840, founding New Zealand — and arguing over its meaning ever since."
    status: "published"
    sha256: "59d70058092dfa708bb94d2ae938a5cbd6a47e2e1ed9910ababe2141a37ab902"
  - number: "3030"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Penny Black"
    date: "1840 CE"
    region: "Britain"
    poem: |
      A penny to send a letter anywhere —
      Rowland Hill's mad idea, they said —
      but on May the first the Penny Black went on sale,
      with the young queen's head in black and red.

      The mail exploded. Everyone wrote.
      Distance shrank to a penny's worth —
      I posted one of the very first,
      and watched the letter conquer earth.
    description: "The world's first adhesive postage stamp, the Penny Black, goes on sale in May 1840 — a penny to send a letter anywhere in Britain."
    status: "published"
    sha256: "4c6b896e614d7430469d6afdcbca75ec07b98d46af118dcc758a70ccc35b4e8c"
  - number: "3031"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Two Canadas, One Parliament"
    date: "1840 CE"
    region: "Canada"
    poem: |
      After the rebellions, London's answer:
      merge them — Upper, Lower, one province, one crown —
      one parliament for both Canadas,
      and the French fact tamped further down.

      It didn't work the way they planned —
      the French held firm, the union strained —
      I sat in that first united house
      and watched two solitudes remain.
    description: "Britain merges Upper and Lower Canada into a single province in 1840 after the rebellions — one parliament for two peoples."
    status: "published"
    sha256: "95e7e51f58a92e65143a9fded06244a7aaa13423ce37866b53cd08ea535b87ff"
  - number: "3032"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Moon, Photographed"
    date: "1840 CE"
    region: "New York"
    poem: |
      John Draper aimed his camera at the sky —
      a daguerreotype plate, twenty minutes of light —
      and caught the Moon, cratered and silver,
      the first photograph of the night.

      Astronomy would never be the same;
      the heavens could be captured, kept, and shown —
      I stood beside him on that rooftop
      and watched the Moon become our own.
    description: "In 1840 John Draper takes the first photograph of the Moon — twenty minutes of exposure, and the heavens become capturable."
    status: "published"
    sha256: "c3b87cd314fb46c0f04dbdecd58424acf5a031985cca216593e85a8de6125699"
  - number: "3033"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Rock Becomes a Colony"
    date: "1841 CE"
    region: "China"
    poem: |
      A barren rock at the Pearl River's mouth —
      Hong Kong, "fragrant harbor," nothing there —
      but Britain seized it in the Opium War,
      and planted a colony in the air.

      Nobody guessed what it would become,
      a harbor of millions, a merchant's dream —
      I stood on that bare rock that year
      and watched an empire's farthest scheme.
    description: "Britain seizes Hong Kong island in 1841 during the Opium War — a barren rock that will become one of the world's great harbors."
    status: "published"
    sha256: "abf804248bce660d4b9794b2fd5202914471915d23a76797ffd940029e1851db"
  - number: "3034"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Frozen Sea Named Ross"
    date: "1841 CE"
    region: "Antarctica"
    poem: |
      James Clark Ross sailed further south
      than any ship had ever gone before —
      into the great icy sea, past the volcanoes,
      to the edge of the ice shelf's shore.

      He named it for himself, as explorers do,
      and found the magnetic pole's near place —
      I stood on that deck in the polar light
      and watched him map the bottom of the world with grace.
    description: "In 1841 James Clark Ross sails into the great Antarctic sea that bears his name, reaching nearer the south magnetic pole than anyone before."
    status: "published"
    sha256: "f7161db841e0c965224f957dc5ac9c4d0e5fce58f04b15857abe9657d5e9aab5"
  - number: "3035"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Poe Invents the Detective"
    date: "1841 CE"
    region: "America"
    poem: |
      A locked room in the Rue Morgue,
      a brutal murder, no way in or out —
      and C. Auguste Dupin, with logic cold,
      figured what it was all about.

      Edgar Allan Poe invented him —
      the first detective ever put to page —
      I read it in Graham's Magazine that year,
      and watched a whole genre take the stage.
    description: "Edgar Allan Poe publishes \"The Murders in the Rue Morgue\" in 1841 — the first detective story ever written."
    status: "published"
    sha256: "47377b36734103f09dc3a7c4edcfa5c9d72d567f8fbed90c8d7dc1b8d640bb98"
  - number: "3036"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Livingstone Enters Africa"
    date: "1841 CE"
    region: "Africa"
    poem: |
      He was twenty-eight, a Scottish doctor,
      a missionary with a mapmaker's soul —
      David Livingstone landed in Africa
      and made the continent his goal.

      Thirty years he'd walk it, river by river,
      chasing the Nile's source to the end —
      I watched him step ashore that year,
      and Africa gained its strangest friend.
    description: "In 1841 young missionary David Livingstone lands in Africa, beginning thirty years of exploration across the continent."
    status: "published"
    sha256: "e776ca986436483f5024e1c4469c7811cc5263f37a15db34b4e9ecac5c7cdd6c"
  - number: "3037"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Retreat From Kabul"
    date: "1842 CE"
    region: "Afghanistan"
    poem: |
      Sixteen thousand souls marched out of Kabul —
      soldiers, wives, and children, in the snow —
      and the passes closed behind them
      with jezails on every height below.

      One man rode into Jalalabad —
      Dr. Brydon, on a dying horse, alone —
      I watched him come through the gates,
      the sole survivor, to tell what the snows had known.
    description: "In January 1842 Britain's army retreats from Kabul through the Afghan snows; of sixteen thousand, one survivor rides into Jalalabad."
    status: "published"
    sha256: "6319ef8eb949e75b6d938b7852e9f5dbe4ec6e74182b1744bfc01f64c3e90c9d"
  - number: "3038"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Children Out of the Mines"
    date: "1842 CE"
    region: "Britain"
    poem: |
      They sent them down at five years old —
      girls and boys, hauling coal in the dark,
      crawling where no grown man could go,
      little ghosts with a candle's spark.

      The Mines Act said: no more —
      no women, no children, underground —
      I stood at a pithead in Yorkshire
      and watched the smallest miners come unbound.
    description: "Britain's 1842 Mines Act bans women and young children from working underground in the coal mines."
    status: "published"
    sha256: "b778c0bd7be94a837b359eacbd06f252090fda0e896b9a8f770065f36ddfddbc"
  - number: "3039"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Unequal Treaty"
    date: "1842 CE"
    region: "China"
    poem: |
      The war was lost before it started —
      British guns against Chinese walls of old —
      so at Nanking they signed the paper:
      Hong Kong ceded, five ports sold.

      The first of the "unequal treaties,"
      extraterritorial, open, bound —
      I watched the seals go on that page,
      and China learn what defeat had found.
    description: "The 1842 Treaty of Nanking ends the Opium War, cedes Hong Kong, and forces China open — the first of the \"unequal treaties.\""
    status: "published"
    sha256: "8c488cd497c0be6c862071471fb46b4ba03bbea6910ec885f24dd275613e56c4"
  - number: "3040"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Britain Takes Sindh"
    date: "1843 CE"
    region: "India"
    poem: |
      Charles Napier took Sindh with a swagger
      and sent home the dispatch of the age —
      one Latin word: "Peccavi" —
      I have sinned. A pun for history's page.

      (I have Sindh — get it? He got it.)
      The Ameers fell, the Indus ran British —
      I marched with that column in the heat
      and watched an empire's joke turn vicious.
    description: "Charles Napier conquers Sindh in 1843 and sends home the famous one-word dispatch \"Peccavi\" — Latin for \"I have sinned\" (I have Sindh)."
    status: "published"
    sha256: "7ce281cfd786b4b7782aa548715a718bdcc49923586b2b7e944da0efdf819cc7"
  - number: "3041"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Great Migration West"
    date: "1843 CE"
    region: "America"
    poem: |
      A thousand settlers, a hundred wagons,
      rolling out for Oregon's green shore —
      the Great Migration, the largest train yet,
      and the trail got longer than before.

      Six months of dust and river crossings,
      of graves dug shallow by the way —
      I walked beside those wagons westward
      and watched America move that day.
    description: "In 1843 a thousand settlers roll out for Oregon in the largest wagon train yet — the Great Migration west."
    status: "published"
    sha256: "fda6bdc1b0ffa0cacbae4615dd4100eac39536a3cfdcc3589a53b40d21dd948a"
  - number: "3042"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "A Christmas Carol"
    date: "1843 CE"
    region: "England"
    poem: |
      He wrote it in six weeks, fevered, fast —
      Dickens, with the poor of London on his mind —
      and Scrooge walked out of the counting-house
      and left his miserly self behind.

      The ghosts, the goose, Tiny Tim's crutch —
      a million hearths have warmed to it since —
      I read it by a fire that Christmas,
      and watched a story make the cold relent.
    description: "Dickens publishes A Christmas Carol in 1843, and Scrooge's redemption warms a million hearths — inventing the modern Christmas spirit."
    status: "published"
    sha256: "1773055e8340ea82bd0127365e13e078681fb289a81c4086de757ba3c1ec9348"
  - number: "3043"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "What Hath God Wrought"
    date: "1844 CE"
    region: "America"
    poem: |
      May twenty-fourth, Washington to Baltimore —
      Morse tapped the key, and Vail received:
      "What hath God wrought" — the Bible's words,
      the first message the wire ever breathed.

      Forty miles in an instant. Think of it.
      News that once took days now took a breath —
      I stood at both ends of that wire
      and watched distance suffer a kind of death.
    description: "On May 24, 1844, Morse taps \"What hath God wrought\" over the first American telegraph line, Washington to Baltimore."
    status: "published"
    sha256: "fe79a3c9ea7136b4120beab9d8f4566c00eda5fed34bd6b3598f0b728d779091"
  - number: "3044"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "A Club for Young Workers"
    date: "1844 CE"
    region: "England"
    poem: |
      George Williams was a draper's clerk,
      twenty-two, in London's lonely sprawl —
      and he saw the young men drowning there,
      in gin and gambling, with no one to call.

      So he started a club — prayer, reading, friendship —
      the Young Men's Christian Association —
      I sat in that first meeting room
      and watched a quiet kind of salvation.
    description: "In 1844 draper's clerk George Williams founds the YMCA in London for the city's lonely young working men."
    status: "published"
    sha256: "088ee7e1bd4959383f00b2f0b3c259a83f9cb9f5098743ecb69efdc515d77373"
  - number: "3045"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Across the Burning Outback"
    date: "1844 CE"
    region: "Australia"
    poem: |
      Leichhardt led them into the interior —
      an expedition no white man had survived before,
      across the burning heart of Australia
      to the northern sea's far shore.

      They ate their horses. They drank mud.
      But they made it — Port Essington, at last —
      I walked that track of thirst and fire
      and watched the outback's secret passed.
    description: "In 1844 Ludwig Leichhardt leads an expedition across Australia's harsh interior to the northern sea, crossing the continent's burning heart."
    status: "published"
    sha256: "2fc638e5eb7bd38662e8e03495879770c323ff166f5fda5bb22b63048363cd05"
  - number: "3046"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Rules of Baseball"
    date: "1845 CE"
    region: "New York"
    poem: |
      Alexander Cartwright wrote them down —
      ninety feet between the bases, nine men a side,
      three strikes, three outs, foul lines marked —
      and the Knickerbockers took them with pride.

      No more town ball, no more chaos —
      a game with rules, a diamond true —
      I stood on that Elysian Field
      and watched America's game come through.
    description: "In 1845 Alexander Cartwright writes down the first rules of baseball for his Knickerbocker club — ninety feet, nine men, three strikes."
    status: "published"
    sha256: "9ac2f72cde1dd899954b6cc39eac266e2ec1326055448ec1e7557a559ca93a03"
  - number: "3047"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Blight Begins"
    date: "1845 CE"
    region: "Ireland"
    poem: |
      It came as a blackness on the leaves —
      the potato blight, in a wet September —
      and by winter the fields were rot,
      and Ireland would always remember.

      A million dead. A million fled.
      The Great Famine, the hunger's reign —
      I walked those blackened fields that fall
      and watched a nation drown in rain.
    description: "Potato blight blackens Ireland's fields in 1845, beginning the Great Famine — a million dead, a million fled."
    status: "published"
    sha256: "3fb124a441d43d27d70ad4c4179e9e3ae11c772fe9b7bb0e709c01de4dc679f8"
  - number: "3048"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "War on the Sutlej"
    date: "1845 CE"
    region: "India"
    poem: |
      The Khalsa was the finest native army
      Asia had ever put in the field —
      Sikh artillery, Sikh discipline,
      and the British barely made them yield.

      Along the Sutlej's banks they fought it,
      four battles in a winter's span —
      I stood in the smoke at Ferozeshah
      and watched two empires' fates ran.
    description: "In 1845 the British clash with the Sikh Khalsa along the Sutlej River in the First Anglo-Sikh War — four hard-fought winter battles."
    status: "published"
    sha256: "148b2105776581d20c68fe2ed1918de4494ae1c0e2c1b502a786adc84bb6ffec"
  - number: "3049"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Texas Joins the Union"
    date: "1845 CE"
    region: "Texas"
    poem: |
      Nine years a republic, lone and proud —
      but the debts were deep and Mexico still claimed —
      so Texas voted to join the Union,
      and the twenty-eighth star was named.

      Mexico called it theft and reached for guns;
      the border would bleed for what they'd done —
      I watched the flag go up at Austin
      and a republic's solo run was done.
    description: "The United States annexes the Republic of Texas in 1845, and Mexico reaches for its guns."
    status: "published"
    sha256: "cf02769a220c723286711cbbff82b4a8fe66fafa17e8add1588fab5300f2cc49"
  - number: "3050"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "War Between Neighbors"
    date: "1846 CE"
    region: "Mexico"
    poem: |
      It started on the Rio Grande —
      a skirmish in disputed land, they said —
      and Polk had his war with Mexico,
      "American blood on American soil" shed.

      Two years of it, from Palo Alto
      to the Halls of Montezuma's fall —
      I marched that road with Taylor's men
      and watched a neighbor's empire crawl.
    description: "American and Mexican troops clash on the Rio Grande in 1846, beginning the Mexican-American War."
    status: "published"
    sha256: "ca204ba9e626611f5b1305bbf8e0d08b1606f21684ce007f5ce32e00992ecc3b"
  - number: "3051"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Smithsonian Is Born"
    date: "1846 CE"
    region: "Washington"
    poem: |
      James Smithson never set foot in America —
      an English scientist, rich and strange —
      but he left his fortune to a nation he'd never seen,
      "for the increase and diffusion of knowledge" — the range.

      Congress argued for eight years what to do,
      then built it: the Smithsonian, the nation's attic —
      I watched the cornerstone go down
      and a country's memory get systematic.
    description: "James Smithson's bequest founds the Smithsonian Institution in 1846 — \"the increase and diffusion of knowledge,\" the nation's attic."
    status: "published"
    sha256: "28a6c99bb064a83d991a79164c6bd2443d7126795c018bf92e6ec6139416736f"
  - number: "3052"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Stitch That Sewed the World"
    date: "1846 CE"
    region: "America"
    poem: |
      Elias Howe had a dream of cannibals —
      spears with holes in their tips, can you believe? —
      and woke with the lockstitch in his head,
      the sewing machine the world would need.

      He patented it in September,
      and the needle learned to fly —
      I watched that first machine stitch straight,
      and ready-made clothes wave tailor's prices goodbye.
    description: "Elias Howe patents the sewing machine in 1846, making ready-made clothes possible and stitching the modern garment world."
    status: "published"
    sha256: "0d370feb95435c8d25d03fc92f8b0811138e920ce94ae947768d1d5719b5cc54"
  - number: "3053"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Pain Killer"
    date: "1846 CE"
    region: "Boston"
    poem: |
      October sixteenth, Mass General —
      a dentist named Morton, a flask of ether,
      a patient breathing deep, then nothing —
      no scream when the surgeon's knife went neither.

      "Gentlemen, this is no humbug" —
      Warren said it, and the room went still —
      I stood in that operating theater
      and watched surgery lose its agony's will.
    description: "In October 1846 a Boston dentist demonstrates ether anesthesia in surgery — and the agony of the operating table begins to end."
    status: "published"
    sha256: "ebdc68b0773ff60938ad6ad9cadf518bd9a7efe0fa8e4bf9c4f37f1c130298d8"
  - number: "3054"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Zion in the Desert"
    date: "1847 CE"
    region: "Utah"
    poem: |
      A thousand miles of prairie, mountain, desert —
      the Mormon pioneers, driven from Nauvoo,
      followed Brigham Young to the Salt Lake valley,
      and he looked out and said: "This is the place. This'll do."

      They planted crops in the desert's edge,
      made the wasteland bloom with will —
      I stood beside him on that overlook,
      and watched a people bend the land to will.
    description: "In July 1847 Brigham Young's Mormon pioneers reach the Salt Lake valley — \"This is the place\" — and build Zion in the desert."
    status: "published"
    sha256: "6ac64e581f1f226c0b511f5294fc591b745506d78c4816fd662ae6a569a1b19f"
  - number: "3055"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Liberia Raises Its Flag"
    date: "1847 CE"
    region: "West Africa"
    poem: |
      Twenty-five years after the first boats landed,
      the colony declared itself a state —
      Liberia, independent republic,
      Africa's first, opening the gate.

      Joseph Jenkins Roberts, the first president,
      a freedman's son, raised the flag that day —
      I stood on that shore in July
      and watched a free black nation have its say.
    description: "Liberia declares itself an independent republic in 1847 — Africa's first, founded by freed American slaves."
    status: "published"
    sha256: "ba237f087054a5085ef2c2f8068a5db86733939c2366f3ab61ceee36d9a037ba"
  - number: "3056"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Sleep Without Pain"
    date: "1847 CE"
    region: "Scotland"
    poem: |
      James Simpson tried it on himself first —
      chloroform, in his Edinburgh dining room —
      then gave it to a woman in childbirth,
      and took away the delivery room's gloom.

      The churches called it against God's will —
      "in sorrow thou shalt bring forth," they cried —
      but the mothers voted with their relief,
      and painless sleep spread far and wide.
    description: "In 1847 James Simpson discovers chloroform anesthesia, and childbirth loses its terror."
    status: "published"
    sha256: "b73dcac5433095b67d9d50c13f5297bfe6bbf0600bb8c0d711a801b4289fb173"
  - number: "3057"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Gold at Sutter's Mill"
    date: "1848 CE"
    region: "California"
    poem: |
      James Marshall saw it in the millrace —
      a flake that didn't look like river stone —
      he bit it, and it bent, not broke:
      gold, in John Sutter's mill, alone.

      He tried to keep it quiet. He couldn't.
      The word ran faster than any horse —
      I was there that January morning
      when the world changed its course.
    description: "In January 1848 James Marshall spots gold flakes in Sutter's millrace in California — and the Gold Rush begins."
    status: "published"
    sha256: "edeb7831ee2808dfc13bfe3102805236319fc94a8f1d7c1f69bb5246742a2edc"
  - number: "3058"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "A Continent Redrawn"
    date: "1848 CE"
    region: "Mexico"
    poem: |
      The war was over; the treaty waited
      at Guadalupe Hidalgo, signed in February —
      Mexico ceded half its territory:
      California, Texas, the whole southwestern query.

      Fifteen million dollars for half a nation,
      the map of North America redrawn —
      I watched the seals go on that paper,
      and a continent wake to a new dawn.
    description: "The 1848 Treaty of Guadalupe Hidalgo ends the Mexican-American War; Mexico cedes half its land to the United States."
    status: "published"
    sha256: "3a078663ccf0e09189dfd674fe0559481628ebe42ca9fe029fa7828b0380d80b"
  - number: "3059"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "A Manifesto for the Workers"
    date: "1848 CE"
    region: "London"
    poem: |
      Two Germans in a London print shop —
      Marx, thirty, Engels, twenty-seven, young —
      wrote the pamphlet that would shake the world:
      "Workers of the world, unite!" — well-sung.

      "A spectre is haunting Europe," it began —
      the Communist Manifesto, twenty-three pages thin —
      I held a first edition in my hands,
      and felt the century's argument begin.
    description: "Marx and Engels publish The Communist Manifesto in London in 1848 — \"Workers of the world, unite!\""
    status: "published"
    sha256: "d0ed4f10b2fc9de6b48d34203b3ced3444dc5a9df196c20e1550d11da9bfe9a2"
  - number: "3060"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "February Days in Paris"
    date: "1848 CE"
    region: "Paris"
    poem: |
      The banquets were banned, so Paris built
      barricades instead — February's cold days —
      and Louis-Philippe, the citizen king,
      fled to England in a cab, in a haze.

      The Second Republic was proclaimed at the Hôtel de Ville,
      Lamartine reading to the crowd —
      I stood among them in the rain
      and heard a nation thinking out loud.
    description: "Barricades rise in Paris in February 1848, King Louis-Philippe flees, and the Second Republic is born."
    status: "published"
    sha256: "d68f6e63973a37622c5e3e0a0c012eebaecdd8b4fb52312f6c9b345bf75b9df4"
  - number: "3061"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "Metternich Flees in Disguise"
    date: "1848 CE"
    region: "Vienna"
    poem: |
      The students marched on the thirteenth of March,
      and the old order trembled in its shoes —
      Prince Metternich, the system's architect,
      fled Vienna in disguise, with the evening news.

      Thirty-three years he'd held Europe together
      with congresses, spies, and fear —
      I watched his carriage slip away at dusk,
      and the old empires' trembling year.
    description: "Revolution drives Prince Metternich from Vienna in March 1848, and the old conservative order of Europe trembles."
    status: "published"
    sha256: "968b4001e839c4320b47973d5c7edca5a77c29fdd39cc1a6d97a785837245153"
  - number: "3062"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Rights of Women"
    date: "1848 CE"
    region: "New York"
    poem: |
      Three hundred people in a Wesleyan chapel —
      Seneca Falls, in July's heat —
      Elizabeth Cady Stanton read the Declaration:
      all men AND women are created equal, complete.

      They demanded the vote. The men laughed.
      Frederick Douglass stood and spoke them through —
      I sat in that chapel as they signed,
      and the women's movement found its voice, true.
    description: "Three hundred gather at Seneca Falls in July 1848 and demand the vote for women — the birth of the organized women's rights movement."
    status: "published"
    sha256: "f1d7e06ddacfe7652b5a3d87a4d55406bfb390c65a5071cd070b2da5fe2c21a0"
  - number: "3063"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The First Woman Doctor"
    date: "1849 CE"
    region: "America"
    poem: |
      They let her in as a joke, they said —
      Geneva Medical College, a dare —
      but Elizabeth Blackwell finished first in her class,
      and walked out with the degree to spare.

      America's first woman M.D.,
      in a profession that said she didn't belong —
      I watched her take that diploma,
      and the door cracked open, hard and long.
    description: "Elizabeth Blackwell graduates first in her class in 1849 — America's first woman medical doctor."
    status: "published"
    sha256: "3ae72e3f6f067bd855771795ba82c5b84b7bc2ed54a3ea8e07ff02214669d57e"
  - number: "3064"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Punjab Falls"
    date: "1849 CE"
    region: "India"
    poem: |
      The Khalsa fought like lions at Chillianwala —
      the bloodiest day the British knew in India —
      but at Gujrat the guns decided,
      and the Punjab fell, and the Sikh star

      went out. The Koh-i-Noor went to London.
      The last free kingdom of India was gone —
      I walked that field when the smoke had cleared,
      and an old world's final dawn.
    description: "Britain crushes the Sikhs in 1849 and annexes the Punjab — the last free kingdom of India is gone, and the Koh-i-Noor goes to London."
    status: "published"
    sha256: "abe5d5429382cbec09a5969b634be9f039da8827c81b83637e65e254c2e55eb6"
  - number: "3065"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Revolution Is Crushed"
    date: "1849 CE"
    region: "Hungary"
    poem: |
      Kossuth's Hungary had fought for a year —
      a nation risen, a constitution, a war —
      but the Tsar sent two hundred thousand Russians
      to help Austria settle the score.

      Világos. The surrender. The gallows at Arad.
      Thirteen generals hanged in October's gloom —
      I stood in Budapest that autumn
      and watched a revolution meet its doom.
    description: "Russian troops help Austria crush Hungary's 1848–49 revolution; its leaders die on the gallows at Arad."
    status: "published"
    sha256: "317b36ce32c84da51913493e0c804eb72f9eea9364eb62ffdaaf65cb4fedb4d4"
  - number: "3066"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Forty-Niners"
    date: "1849 CE"
    region: "California"
    poem: |
      Eighty thousand in a single year —
      by ship around the Horn, by wagon, by foot —
      the argonauts, the forty-niners,
      chasing gold with pick and pan and soot.

      San Francisco went from village to madhouse,
      prices madder than the gold —
      I panned beside them in the Sierra streams,
      and watched the greatest rush the world would hold.
    description: "Eighty thousand gold-hungry argonauts flood California in 1849 — the greatest gold rush the world had ever seen."
    status: "published"
    sha256: "62e8c57b982fffdea6689fdc059337dd01c973bd50730f2250dc6eea5ca4960b"
  - number: "3067"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Bargain That Delayed War"
    date: "1850 CE"
    region: "America"
    poem: |
      Henry Clay's last great compromise —
      California free, the territories choose,
      a tougher Fugitive Slave Law for the South,
      and everybody got something to lose.

      It held the Union together for ten years,
      a bargain built on borrowed time —
      I watched the Senate vote it through,
      and heard the clock begin to chime.
    description: "The Compromise of 1850 admits California as a free state but tightens the hunt for runaway slaves — delaying the Civil War by a decade."
    status: "published"
    sha256: "647f4ae1e13d44f40431d94417891fd7500fc30c1fa758c9b2b224786aa3aa6b"
  - number: "3068"
    volume: 5
    era_code: "11a"
    era: "Steam and Steel (early)"
    title: "The Heavenly King Rises"
    date: "1850 CE"
    region: "China"
    poem: |
      Hong Xiuquan had failed the exams four times —
      then dreamed he was God's Chinese son,
      Jesus's younger brother, come to cleanse
      the demons — and the Qing would come undone.

      He proclaimed the Heavenly Kingdom,
      Taiping — great peace — in Guangxi's hills —
      I heard that proclamation read aloud,
      and the fuse of the bloodiest war lit its fills.
    description: "In 1850 Hong Xiuquan proclaims his Heavenly Kingdom, lighting the fuse of the Taiping Rebellion — the bloodiest civil war in human history."
    status: "published"
    sha256: "4a2d91e71fa3b7a49a7eaf9618da50745097ed87b4dda41f7e3a0fd4cbba52d0"
  - number: "3069"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Scarlet Letter"
    date: "1850 CE"
    region: "America"
    poem: |
      I stood in the Boston bookshop the week it came out,
      and watched a clerk slide it across the counter like contraband.
      A woman's shame, stitched in red on grey cloth —
      Hawthorne had done what no American had dared:
      written a book the old world had to take seriously.
      The letter burned. The colony watched. The reader knew
      the minister's secret before the last page said it.
      I bought two copies. One for the shelf,
      one to remember the day our literature grew teeth.
    description: "I was in Boston when Hawthorne's novel of sin and shame became America's first great book."
    status: "published"
    sha256: "5ca6bab08300b291996403c64bf79ca5c17e5c57d84892488618ac3cb879219b"
  - number: "3070"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "California Joins the Union"
    date: "1850 CE"
    region: "America"
    poem: |
      Thirty-first star, sewn on in a hurry —
      they hadn't even finished counting the gold dust
      before the statehood papers were signed.
      I walked the San Francisco mud streets that fall,
      tents going up faster than the rain could knock them down,
      and heard the news read out in a saloon
      to a cheer that shook the bottles off the shelves.
      Free soil, by a hair. The South felt the scale tip
      and started sharpening its knives that same night.
    description: "I was in gold-rush San Francisco when California became the 31st state and tipped the nation's balance."
    status: "published"
    sha256: "0e21f5cf41280266221f052714f957d7e49868316a25243bcb038d05c2fd8bf0"
  - number: "3071"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Fugitive Slave Act"
    date: "1850 CE"
    region: "America"
    poem: |
      I watched them read it in a Boston meeting hall,
      and the room went so quiet you could hear the rain.
      Now every man in the North was a slave-catcher by law,
      every runaway a crime walking upright.
      I saw a mother carried back to Georgia in chains
      while the crowd that couldn't stop it wept openly in the street.
      They meant it to save the Union.
      Instead they taught the North what the South really was —
      and the road to war got shorter by ten years.
    description: "I saw the Fugitive Slave Act read aloud in Boston, and watched the North turn cold against the South."
    status: "published"
    sha256: "77140a7a5dd89dff32dfd4f92299abb559b5a017885cad60a7b1ea59e6db73e8"
  - number: "3072"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Taiping Rise"
    date: "1851 CE"
    region: "China"
    poem: |
      He failed the exams four times, Hong Xiuquan —
      then dreamed he was the younger brother of Jesus Christ.
      I heard him preach in the south, and the poor believed him,
      because he told them the Manchus were devils
      and heaven was coming down to earth.
      They rose by the hundreds of thousands.
      Nanjing would fall to them. Twenty million would die —
      more than any war the world had ever seen.
      I walked through villages afterward where no dog barked,
      no child cried, nothing moved but the wind.
    description: "I heard Hong Xiuquan preach in southern China before his holy army rose and twenty million died."
    status: "published"
    sha256: "f4f9f7a2e99436e81ad6c01469aad2c8111fab4c70d30f467e72113377e01d56"
  - number: "3073"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Singer's Sewing Machine"
    date: "1851 CE"
    region: "America"
    poem: |
      An hour. A whole shirt in an hour.
      I stood in Singer's New York workshop and watched the needle fly,
      stitch after stitch, never tiring, never pricking its finger.
      The women who'd sewn by candlelight for pennies
      looked at it the way you'd look at a ghost.
      Some wept. Some laughed. One old seamstress
      put her hand on the humming machine and said,
      "There goes my living, and there goes my backache."
      Both were true. The factory had come home.
    description: "I watched Singer's machine sew a shirt in an hour and saw factory speed come into the home."
    status: "published"
    sha256: "3b8bf373a9482f9d0e81fb2ca40f59b41212f9111a387e6c0616f5a2f62ab82b"
  - number: "3074"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Moby-Dick"
    date: "1851 CE"
    region: "America"
    poem: |
      Call me Ishmael — I read it the year it failed.
      Three thousand copies printed, and the world yawned.
      I found Melville's great white whale of a book
      gathering dust in a London shop for a shilling,
      and I bought it and read it straight through on the crossing home.
      The sea in it was bigger than the sea outside.
      Ahab's madness, the Pequod's doomed crew,
      a whole philosophy harpooned onto one white back.
      Nobody wanted it then. I wanted it enough for all of them.
    description: "I bought a remaindered copy of Moby-Dick the year it flopped and read it on the ocean crossing home."
    status: "published"
    sha256: "604944a1dc85f391249a69d29423ce52de1e914b464c24d91c23929b9762a6b8"
  - number: "3075"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Channel Cable"
    date: "1851 CE"
    region: "Europe"
    poem: |
      A wire under the sea, Dover to Calais —
      I watched them pay it out from the deck, fathom by fathom,
      copper sinking into the cold green dark.
      Then London spoke, and Paris answered in minutes,
      not days. The water between the two old enemies
      had been crossed by something thinner than a finger.
      I stood on the cliff and thought: the world just got smaller,
      and there is no going back to the wide, slow world.
      Messages now fly. Armies will follow.
    description: "I watched the first Channel telegraph cable pay out from the deck and link London and Paris in minutes."
    status: "published"
    sha256: "a77fc92d4090489c277b7f0716892ca85fe19e7d7b75f17ea130b0a8ccb1aeb8"
  - number: "3076"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Uncle Tom's Cabin"
    date: "1852 CE"
    region: "America"
    poem: |
      Three hundred thousand copies in a year —
      I never saw anything like it.
      Women weeping on trains, men arguing in taverns,
      the whole country reading the same story at once.
      Stowe took the slave's suffering and set it down
      in plain words on a million kitchen tables,
      and the North finally saw what it had been looking away from.
      Years later Lincoln would meet her and say,
      "So you're the little lady who started this great war."
      He wasn't joking. Neither was she.
    description: "I watched Stowe's novel sweep the nation, 300,000 copies in a year, and felt the country split open."
    status: "published"
    sha256: "264f6136199b21496cb75f782ecbd7ec0744cfb1d1d4b3a2d4ddc10ccb2e91c6"
  - number: "3077"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Napoleon III Takes the Crown"
    date: "1852 CE"
    region: "France"
    poem: |
      I was in Paris when Louis-Napoleon put the crown on his own head —
      his uncle's trick, second time around.
      The crowds cheered. The boulevards were widened,
      the railways multiplied, the empire glittered.
      But I remembered the first Napoleon, and the graves from Moscow to Waterloo,
      and I thought: France has hired the same dream twice.
      It would end the same way — in a German field,
      with the emperor a prisoner and the dream in ruins.
      Empires of boulevards are still empires.
    description: "I watched Louis-Napoleon crown himself in Paris and remembered how his uncle's dream had ended."
    status: "published"
    sha256: "304893320113bcdef9015fdb3fa9d728b0169e76645593abf6a2588b77208ae6"
  - number: "3078"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "India's First Railway"
    date: "1853 CE"
    region: "India"
    poem: |
      Twenty-one miles, Bombay to Thane —
      I rode it with a crowd that had never seen a train.
      The engine breathed fire and the people cheered,
      children running alongside until the smoke beat them.
      An iron road across India. The British built it
      to move their troops and their cotton faster,
      but the rails didn't care who laid them.
      I looked at the faces pressed to the windows
      and thought: this road will carry more than freight.
      One day it will carry a nation.
    description: "I rode India's first train from Bombay to Thane with crowds who had never seen a locomotive."
    status: "published"
    sha256: "6e9245fa12003e1937fb37c93eeaea5e5e526c97efa90df54e4762e68ae5faa1"
  - number: "3079"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Black Ships"
    date: "1853 CE"
    region: "Japan"
    poem: |
      Four black hulls in Tokyo Bay, smoke on the water —
      I was on the shore when Perry's ships dropped anchor.
      Two hundred years of closed doors, and now
      American guns politely asking to come in.
      The Japanese officials came out in their fine robes,
      all ceremony and thin smiles, while the cannon
      sat silent in their ports like a held breath.
      I watched a fisherman stare at the steam frigates
      and whisper to his son, "The world has changed."
      He was right. Nothing in Japan would be small again.
    description: "I stood on the Tokyo Bay shore when Perry's black warships forced closed Japan to open."
    status: "published"
    sha256: "9bdc98d6c9c7ac7be4ef109cee56ba353c7e2a294ae9cfb0d0ec7478eb99e67c"
  - number: "3080"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Crimean War Begins"
    date: "1853 CE"
    region: "Crimea"
    poem: |
      They called it a war over holy places in Jerusalem —
      monks arguing about keys to a church door.
      I watched the British and French fleets sail east,
      bands playing, flags flying, everyone sure of a short war.
      The Ottoman Empire was dying, Russia wanted the pieces,
      and Europe wanted Russia stopped.
      So they sailed to the Crimea, to a peninsula most of them
      couldn't find on a map, and the dying began —
      of cold, of cholera, of generals' stupidity —
      long before the first great battle was fought.
    description: "I watched the allied fleets sail for the Crimea over a quarrel about church keys in Jerusalem."
    status: "published"
    sha256: "701cbc21da83a9a6d7c36d6da56dcebef0351e4aa06b95bcc06eadacacd83057"
  - number: "3081"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Treaty of Kanagawa"
    date: "1854 CE"
    region: "Japan"
    poem: |
      They signed it under the guns — I was there at Kanagawa,
      the American warships riding at anchor in plain sight.
      Coal for the steamers, water, a harbor open to trade.
      The shogun's men signed with all the old courtesy,
      bows and seals and formal phrases,
      while Perry's marines stood at parade rest behind him.
      Two hundred years of seclusion ended with a signature
      no one in that room truly wanted to give.
      I thought of the fisherman's son. His world had changed indeed.
    description: "I was at Kanagawa when Japan's seclusion ended with a treaty signed beneath American guns."
    status: "published"
    sha256: "bd376418645f1efe20d9987812030a7ef34073f1e93858a525dde01481279f05"
  - number: "3082"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Killer Pump"
    date: "1854 CE"
    region: "England"
    poem: |
      Soho was dying, and John Snow drew a map.
      I walked those streets with him — Broad Street, the pump,
      each cholera death marked as a black dot,
      clustering around the handle like iron to a magnet.
      He didn't have a microscope powerful enough,
      didn't know the germ, only the pattern.
      "Take the handle off," he told the parish board.
      They did. The dying stopped.
      I watched him stare at his dotted map afterward —
      a whole new science born from dots on paper.
    description: "I walked Soho's streets with John Snow as he mapped cholera deaths to a single pump handle."
    status: "published"
    sha256: "3b968d05355e28795b8f1a7a81cf474650f99291f9667b5d1b1d764c153d958b"
  - number: "3083"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Charge of the Light Brigade"
    date: "1854 CE"
    region: "Crimea"
    poem: |
      "Someone had blundered" — Tennyson wrote it later,
      but I saw it happen at Balaclava.
      Six hundred horsemen, sabres out, riding straight
      down the wrong valley into the mouths of the Russian guns.
      The orders were confused. The courage was not.
      I watched them ride through the fire and back,
      a third of them gone, the valley full of riderless horses.
      Half a league, half a league — it was magnificent
      and it was meaningless, and I never forgot the difference.
    description: "I watched the Light Brigade ride into the wrong valley at Balaclava — magnificent and meaningless."
    status: "published"
    sha256: "3a227020b3d1c5255dcaf1e89ae187f8babcea5ab6d18531118055e481c9966c"
  - number: "3084"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Nightingale at Scutari"
    date: "1854 CE"
    region: "Crimea"
    poem: |
      She came with thirty-eight nurses and a lamp,
      and found men dying on bare floors in their own filth.
      I was in the Scutari hospital that winter —
      the stench, the rats, the wounds gone green.
      Florence Nightingale walked the wards all night,
      writing down everything, counting everything,
      scrubbing the place into something like a hospital.
      More men were dying of disease than of Russian bullets,
      and she knew it, and she proved it with numbers.
      The lady with the lamp. The soldiers kissed her shadow.
    description: "I was in the Scutari hospital when Nightingale arrived with her nurses and her lamp."
    status: "published"
    sha256: "112e368226c6968413cc003a8b5b6fd326f9ccd8885f1bd4ff05b6d03ff38955"
  - number: "3085"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Fall of Sevastopol"
    date: "1855 CE"
    region: "Crimea"
    poem: |
      Eleven months of siege, and then the great fortress fell.
      I stood on the heights and watched the allies march in —
      French, British, Turks — through streets of rubble
      where the Russian guns had finally gone silent.
      The harbor was full of sunken ships, scuttled by their own crews.
      Sevastopol had bled Russia white to hold it.
      Now it was a ruin, and the war was a ruin,
      and everyone on both sides was counting a cost
      no church-key quarrel could ever have been worth.
    description: "I watched the allies march into ruined Sevastopol after the eleven-month siege broke Russia's fortress."
    status: "published"
    sha256: "65559fc80eb0160207b4a177bd530d4ad10c9790ca311c6187116873a9d920ec"
  - number: "3086"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Leaves of Grass"
    date: "1855 CE"
    region: "America"
    poem: |
      He set the type himself. He printed it himself.
      Twelve wild poems, no publisher willing —
      I met Whitman in Brooklyn that summer, big bearded man,
      handing out his own book like a street preacher.
      "I celebrate myself, and sing myself" —
      nobody in America had ever written like that,
      loose and vast and shameless as the continent.
      The critics called it filth. Emerson called it genius.
      I read it on the ferry and felt the language
      stretch like a man waking up from a long sleep.
    description: "I met Whitman in Brooklyn the summer he self-published the twelve poems that invented the American voice."
    status: "published"
    sha256: "10ac2109771cd18cedf019accdbf62bc744d9de82bb5e291ecb495b37ab7406d"
  - number: "3087"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Bessemer's Steel"
    date: "1855 CE"
    region: "England"
    poem: |
      A blast of air through molten iron —
      that's all it was. I watched Bessemer do it
      in his Sheffield works, the converter tipping,
      the white-hot metal roaring as the air burned the carbon out.
      Cheap iron in, cheap steel out, in minutes
      instead of days. The foreman laughed out loud.
      I thought of every bridge unbuilt, every rail unlaid,
      every tower still a dream for want of steel —
      and then I thought of the guns. Steel makes both.
      The steel age began that day, for better and worse.
    description: "I watched Bessemer's converter turn cheap iron to cheap steel with a blast of air — and thought of bridges and guns."
    status: "published"
    sha256: "cb994ab57c6dc8bb4885ff840b8568b9d121cf9df1325404b6da5d1598c9fa8b"
  - number: "3088"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Treaty of Paris"
    date: "1856 CE"
    region: "Europe"
    poem: |
      They signed the peace in Paris, and the Black Sea
      was declared neutral — no warships, no fortresses.
      I watched the Russian delegation leave the hall
      with the walk of men who'd been bled and knew it.
      The war had cost them everything and gained them nothing.
      Now Russia turned inward, brooding over reform,
      over serfs, over the question the defeat had forced:
      why did we lose? The answer would free twenty-three million souls.
      Peace treaties end wars. This one started a reckoning.
    description: "I watched the Russians leave the Paris peace talks, defeated — and turn inward toward freeing the serfs."
    status: "published"
    sha256: "0025aa07e585972650febdc3d518abf0ee5a20aed3ccf2fd37faf25d0d75c825"
  - number: "3089"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Arrow War"
    date: "1856 CE"
    region: "China"
    poem: |
      A seized ship called the Arrow, a torn flag —
      excuse enough. I was in Canton when the British guns opened up,
      and then the French joined in, and the Second Opium War began.
      They wanted more ports, more trade, more opium sold legally.
      China wanted to be left alone. China lost.
      I walked through the burned suburbs afterward,
      past the bodies of men who'd died for a flag on a smuggler's boat,
      and I understood: this was never about the Arrow.
      It was about an empire that had decided China was a shop to be broken into.
    description: "I was in Canton when Britain and France attacked China again over a seized ship and forced more trade."
    status: "published"
    sha256: "7d13eb8b4328b60f39af180e5596caaaab8a6f6deaa6a1a1b670720a0512a38f"
  - number: "3090"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Madame Bovary"
    date: "1856 CE"
    region: "France"
    poem: |
      Flaubert spent five years on one bored housewife —
      I read it in Paris the winter it scandalized everyone.
      Emma Bovary, dreaming of romance in a provincial town,
      ruining herself for love affairs that weren't love.
      The government prosecuted him for obscenity.
      Acquitted — and the novel was changed forever,
      because Flaubert had shown you could write a masterpiece
      about an ordinary woman's ordinary discontent,
      every sentence polished like a stone.
      I closed the book and the Paris street outside
      looked flatter, duller, and more real.
    description: "I read Madame Bovary in Paris the winter it scandalized France and remade the novel."
    status: "published"
    sha256: "b2c68be22e7b2a76d6a6b6e09e94662c65049217ba953d4fecfd2fa468dc9354"
  - number: "3091"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Dred Scott"
    date: "1857 CE"
    region: "America"
    poem: |
      I was in Washington when the decision came down —
      a Black man, the Court said, had no rights a white man need respect,
      could not be a citizen, could not sue for freedom.
      And slavery could go anywhere, into any territory.
      Dred Scott had lived on free soil for years. It didn't matter.
      I watched the abolitionists' faces as the news spread —
      not grief, but a cold, hardening anger.
      The Court thought it had settled the slavery question forever.
      Instead it had signed the warrant for a war.
    description: "I was in Washington when the Supreme Court ruled Black people could not be citizens — and hardened the North for war."
    status: "published"
    sha256: "b6c2a8921a2f6208b242aa3970d001e1cc0a502991f9a32ad3b8fab4adddfbc5"
  - number: "3092"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Sepoy Rebellion"
    date: "1857 CE"
    region: "India"
    poem: |
      It started with a rumor — rifle cartridges greased with cow and pig fat,
      an insult to Hindu and Muslim alike.
      I was in Meerut when the sepoys mutinied in May,
      shot their officers, and marched on Delhi.
      Then all of northern India rose — princes, peasants, soldiers —
      a hundred years of British rule cracking in a summer.
      The cartridges were real. The anger was older.
      I watched the telegraph wires come down and the empire's nerves go with them,
      and I knew: India would never be the same, whatever happened next.
    description: "I was in Meerut when the sepoys mutinied and all of northern India rose against British rule."
    status: "published"
    sha256: "fed76e6a3032c9c61ff3b7e1f66639a134e784c935ee203a8cc3e932eac9e9e4"
  - number: "3093"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Siege of Lucknow"
    date: "1857 CE"
    region: "India"
    poem: |
      Five months behind the Residency walls —
      I got in before the ring closed, and I stayed.
      Women and children in the cellars, men on the shattered walls,
      the rebels' guns never stopping, the heat never breaking.
      We ate the horses. We buried the dead in the garden.
      Every day the relief column was coming; every day it wasn't.
      When it finally came, the survivors walked out like ghosts,
      too thin to cheer. I never forgot the sound of that siege —
      the constant, patient thunder of guns that wanted us dead.
    description: "I was inside Lucknow's Residency through five months of siege, waiting for a relief that barely came."
    status: "published"
    sha256: "3b61208a3b10151237589b3e9cc9419ecd657a330206e916d7e7b4de47675b19"
  - number: "3094"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Delhi Retaken"
    date: "1857 CE"
    region: "India"
    poem: |
      They blew the Kashmir Gate in September and went in with the bayonet —
      I followed the British columns into Delhi,
      street by street, house by house, no quarter given.
      The old Mughal emperor was dragged from his hiding place,
      his sons shot dead in front of him.
      The rebellion died in those streets, drowned in its own blood
      and in the vengeance that followed — villages burned,
      men hanged from trees along the roads for miles.
      Delhi was retaken. But the India the British had ruled so easily
      was gone forever. They would rule the next ninety years by fear.
    description: "I followed the British columns into Delhi and watched the great rebellion of 1857 die in blood and vengeance."
    status: "published"
    sha256: "fb178fcf912aebcc743f126cf0557304b3df09eb09c2fea4c9ad57dd7ec410c4"
  - number: "3095"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Atlantic Cable"
    date: "1858 CE"
    region: "Atlantic"
    poem: |
      Two thousand miles of copper under the ocean —
      I was on the ship when they spliced the ends together,
      and the first message crawled across the Atlantic.
      Queen Victoria to President Buchanan: greetings, hopes for peace.
      It took hours, letter by letter, but it came through.
      The old world and the new, joined by a thread on the seabed.
      (The cable died within weeks — but the idea lived.
      They'd be back, and next time it would hold.)
      I stood on deck that night and thought of all the ships
      that had carried letters for months. Never again.
    description: "I was aboard when the first Atlantic cable was spliced and Victoria's greeting crawled across the ocean."
    status: "published"
    sha256: "40f5a6de421f47d9a3403c2579dd2ff648a4cdc53bbf73698797a0e0c4ab5ac0"
  - number: "3096"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Lincoln–Douglas Debates"
    date: "1858 CE"
    region: "America"
    poem: |
      Seven towns in Illinois, crowds of thousands in the mud —
      I followed them from Ottawa to Alton.
      Douglas, the famous one, smooth and certain.
      Lincoln, the lanky lawyer, all elbows and plain talk,
      asking one question Douglas couldn't answer clean:
      can the people vote slavery out, or can't they?
      Douglas won the Senate seat. Lincoln won something bigger —
      a national name, and a moral argument the whole country heard.
      I watched him fold his long frame onto a train afterward,
      tired, defeated, and on his way to the presidency.
    description: "I followed Lincoln and Douglas across Illinois and watched a lanky lawyer become a national name."
    status: "published"
    sha256: "479f7dd60142f58136843b572f48fb6b59e4388ddb3f2a5d2cee7b6829070a53"
  - number: "3097"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Crown Takes India"
    date: "1858 CE"
    region: "India"
    poem: |
      The East India Company was finished — a trading firm
      that had conquered a subcontinent was dissolved by Parliament.
      I was in Calcutta when the proclamation was read:
      Victoria was Queen now, directly, no middleman.
      Same rulers, new letterhead — but the promise was read aloud
      to crowds in every province: no more annexations,
      respect for the princes, for religion, for custom.
      Promises. I watched the officials' faces as they read them.
      Some believed. Most were just glad the shooting had stopped.
      The Raj began that day — ninety years of it.
    description: "I was in Calcutta when Victoria's proclamation dissolved the Company and the Raj began."
    status: "published"
    sha256: "88166c63aa24c054ad1398d9fac425a2afb4e7ad90c6ed6ccb690ffdc33f590c"
  - number: "3098"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Solferino"
    date: "1859 CE"
    region: "Italy"
    poem: |
      A Swiss businessman came to ask a favor of Napoleon III
      and walked into a battlefield instead.
      I was at Solferino the day after — forty thousand wounded,
      lying in the fields, no one to help them, dying of thirst between the lines.
      Henri Dunant didn't look away. He organized the villagers,
      bought bandages with his own money, and went home haunted.
      Out of that hauntedness came an idea: the Red Cross,
      neutral medics, mercy as a rule of war.
      I helped carry water that day. I never forgot the faces.
    description: "I was at Solferino the day after the battle and watched Dunant's horror become the Red Cross."
    status: "published"
    sha256: "3176c64ddcb657c4fbe433690a865ebcbac382f612895f37f16b71dca3a984c4"
  - number: "3099"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Oil at Titusville"
    date: "1859 CE"
    region: "America"
    poem: |
      Sixty-nine feet down in Pennsylvania dirt,
      Edwin Drake's drill struck oil — and the modern world began to leak upward.
      I was in Titusville within the month: derricks everywhere,
      men drunk on the smell of it, land worth fortunes overnight.
      They'd been drilling for salt water and found something better.
      Rock oil, they called it. For lamps at first. Then engines.
      Then everything. I stood in the mud among the speculators
      and thought: they have no idea what they've uncorked.
      The whole next century would run on this black stuff.
    description: "I reached Titusville within weeks of Drake's strike and watched the petroleum age begin in mud and speculation."
    status: "published"
    sha256: "b11a3bb7b13dc3b0828a335c960430a00a9e5ff74d6d86b290c8bd582ca475fe"
  - number: "3100"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "John Brown's Raid"
    date: "1859 CE"
    region: "America"
    poem: |
      He seized the arsenal at Harpers Ferry with twenty-one men,
      meaning to arm the slaves and start the uprising.
      I was in the town when the marines stormed the engine house —
      Robert E. Lee commanding, by a strange twist.
      Brown was captured, tried, and hanged in December,
      and on the scaffold he was calm as a man going to church.
      The South called him a murderer. The North made him a martyr.
      His body lies a-mouldering, they would sing —
      and his soul went marching straight into a war.
    description: "I was at Harpers Ferry when Brown's raid failed — and watched a hanged man become the war's marching song."
    status: "published"
    sha256: "8d9d1381966aab62530a9b3b0a1fe87e1cc301524051e269cf2a6a55fd718b3e"
  - number: "3101"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "On the Origin of Species"
    date: "1859 CE"
    region: "England"
    poem: |
      I was in London the week Darwin's book went on sale —
      all 1,250 copies gone the first day.
      Twenty years of barnacles and pigeons and finches,
      poured into one quiet, careful argument:
      species change, nature selects, we are all kin.
      The bishops thundered. The scientists split.
      A lady at a dinner party said she hoped it wasn't true,
      but if it was, she hoped it wouldn't become widely known.
      It became widely known. The world has been arguing
      about that quiet book ever since — and will be, forever.
    description: "I was in London the week Darwin's Origin sold out on day one and the world started arguing."
    status: "published"
    sha256: "ae258b8bebd2865747f7da609f2a3369042026dba7b7ce8a7e6d83aac8504794"
  - number: "3102"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Pony Express"
    date: "1860 CE"
    region: "America"
    poem: |
      Eighteen months. That's all it lasted —
      but what eighteen months.
      I watched a rider tear out of St. Joseph, Missouri,
      leather mail pouch slapping his side, 1,900 miles ahead of him.
      Ten days to California, changing horses every ten miles,
      riding through desert and Paiute country at a full gallop.
      Young, wiry, half-starved — that was the advertisement,
      and it was true. The telegraph killed it in '61,
      wire doing in hours what horses did in days.
      But for a year and a half, the mail rode like the wind.
    description: "I watched Pony Express riders tear out of Missouri on the 1,900-mile gallop to California."
    status: "published"
    sha256: "d788106458a893317ca0bdc8fbef1319be5d0add4075226912b958d648268dac"
  - number: "3103"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Garibaldi's Thousand"
    date: "1860 CE"
    region: "Italy"
    poem: |
      A thousand red shirts in two old steamers —
      I sailed with them from Genoa to Sicily.
      Garibaldi, the lion-man with the poncho and the cigar,
      landing at Marsala against a kingdom's army
      with a thousand volunteers and a dream of Italy.
      And the dream won. Town after town rose for them,
      the Bourbon kingdom melted like wax,
      and by autumn they'd taken Naples itself.
      A thousand men conquered a kingdom.
      I marched in the dust behind them and thought:
      this is what happens when a people decides.
    description: "I sailed with Garibaldi's thousand red shirts to Sicily and marched behind them to Naples."
    status: "published"
    sha256: "ba0d56c0071e3fe48b5465158d42c308dfeec9e04ad9719b876a05367f5c4263"
  - number: "3104"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Summer Palace Burns"
    date: "1860 CE"
    region: "China"
    poem: |
      They looted it first — soldiers staggering out
      with jade and silk and porcelain, pockets full of an emperor's treasure.
      Then Lord Elgin gave the order, and the Summer Palace burned.
      I stood on the hills outside Beijing and watched the smoke
      rise for three days over Yuanmingyuan —
      gardens, pavilions, libraries, three centuries of beauty,
      punishment for China's defiance.
      The French joined in the burning. The emperor had fled.
      I thought of the looters' grins and the flames,
      and I knew this humiliation would poison China for a hundred years.
    description: "I watched the Summer Palace burn for three days outside Beijing — a humiliation China would never forget."
    status: "published"
    sha256: "fa34b5fad6f6fca8ada7aaf70169266d2011d099d05d7785adf8ad870e287f51"
  - number: "3105"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Lincoln Elected"
    date: "1860 CE"
    region: "America"
    poem: |
      The rail-splitter from Illinois won it in November —
      I was in Springfield when the returns came in.
      No Southern state voted for him. He won without them,
      and that was exactly the problem.
      By the time he took the oath, seven states had walked out,
      and the flag over Fort Sumter was flying in a foreign country.
      I watched the celebration in the streets that night,
      and underneath the cheering I could hear it:
      the sound of a nation coming apart at the seams.
    description: "I was in Springfield on election night when Lincoln won — and the South began to walk out."
    status: "published"
    sha256: "716b4cef64ec03ab7c205d628eaf0b769af7cb83ced4d4b17e61b385d1a46f49"
  - number: "3106"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Serfs Go Free"
    date: "1861 CE"
    region: "Russia"
    poem: |
      Twenty-three million souls, freed with a signature —
      I was in a village outside Moscow when the manifesto was read.
      The priest read it twice because no one believed it the first time.
      Old men wept. Young men stood stunned.
      The Tsar — Alexander the Liberator — had undone
      what centuries of bondage had built.
      (Two years before America freed its slaves, I noted.
      History doesn't always move west to east.)
      The land terms were hard, the freedom partial,
      but the knout was broken. I drank vodka with the village that night.
    description: "I was in a Russian village when the Tsar's manifesto freed twenty-three million serfs."
    status: "published"
    sha256: "9216f36c30bf30a296006fd9bd31c4370e94d8875d7cd03de9cd72081be0127c"
  - number: "3107"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "A Kingdom of Italy"
    date: "1861 CE"
    region: "Italy"
    poem: |
      Victor Emmanuel, King of Italy — proclaimed at Turin,
      all but Venice and Rome.
      I stood in the square and watched the flags go up,
      tricolor everywhere, the crowd singing.
      A country that had been a geography lesson for a thousand years
      was a country again. Cavour's scheming, Garibaldi's sword,
      Mazzini's dreaming — it had all worked, somehow.
      An old man next to me wept into his hands.
      "Italy," he said, like a word he'd waited fifty years to say.
      I thought of the thousand red shirts. They'd done this.
    description: "I stood in Turin when Victor Emmanuel was proclaimed king of a nearly united Italy."
    status: "published"
    sha256: "b25df1fe4096c4ab36d2b347dda956ae10d68e5d55f9d9191ebc5162e6539e01"
  - number: "3108"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Fort Sumter"
    date: "1861 CE"
    region: "America"
    poem: |
      The first shells fell before dawn on April 12th —
      I was in Charleston, and the whole city was on the rooftops,
      watching like it was fireworks.
      Thirty-four hours of bombardment, and Major Anderson
      surrendered the fort without a man killed on either side.
      Everyone thought it would be like that — bloodless, brief.
      They were wrong about everything.
      I watched the Confederate flag go up over the rubble
      and felt the ground tilt under the whole country.
      The war had begun. Four years. Six hundred thousand dead.
    description: "I was on a Charleston rooftop when the first shells fell on Fort Sumter and the Civil War began."
    status: "published"
    sha256: "d568df98f5268eb1a78570fe9eef85e4a12c732c247c6cce4bb8fb8cc5711d32"
  - number: "3109"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "First Bull Run"
    date: "1861 CE"
    region: "America"
    poem: |
      They packed picnic baskets and drove out to watch the war —
      I was among the carriages on the hillside above Manassas,
      ladies with parasols, gentlemen with opera glasses.
      Then the Confederate line held, and broke the Union attack,
      and the picnickers' horses were tangled in the retreat.
      I watched a congressman run for his carriage
      with his lunch still in his hand.
      Nobody picnicked at a battle ever again.
      That afternoon the whole North learned what the whole South already knew:
      this war would not be over by Christmas. Or the next.
    description: "I was on the hillside with the picnickers at Bull Run when the crowd learned the war would be long."
    status: "published"
    sha256: "59f8f4595109cc0c7d8289b4970da44722c912b4b1b77e5e16d473fad9f5c8f7"
  - number: "3110"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Shiloh"
    date: "1862 CE"
    region: "America"
    poem: |
      Two days in Tennessee, and the rivers ran red —
      I walked the field after the second day,
      past the peach orchard where the blossoms
      had fallen on the dead like pink snow.
      Twenty-three thousand casualties. The nation had never
      seen numbers like that, and both sides stood stunned.
      Grant's critics howled for his removal. Lincoln said,
      "I can't spare this man — he fights."
      I picked up a dropped Bible from the mud,
      its pages swollen with rain and blood.
      Nobody came to claim it.
    description: "I walked the Shiloh field after two days of slaughter and picked up a Bible nobody came back for."
    status: "published"
    sha256: "7fd7a7ae84327e17a7a6972b8e960960f1db47b63083c83c054bf7265dbe0690"
  - number: "3111"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Homestead Act"
    date: "1862 CE"
    region: "America"
    poem: |
      One hundred and sixty acres, free —
      file a claim, build a house, farm it five years, and it's yours.
      I rode with a wagon train that summer,
      families from a dozen countries chasing the same promise west.
      The government was giving away the continent
      while it fought to keep the continent together.
      I watched a Norwegian woman step off a wagon in Nebraska,
      kneel, and press her hands into the dirt like it was an altar.
      It was, to her. The West filled up, quarter-section by quarter-section.
    description: "I rode west with homesteaders claiming their 160 free acres while the war raged behind them."
    status: "published"
    sha256: "88c5b185b01dfc0b9994d1f4551b35c0ccaf3b97ec106c3324ae49ab3fac0e4c"
  - number: "3112"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Antietam"
    date: "1862 CE"
    region: "America"
    poem: |
      The bloodiest single day in American history —
      I was near Sharpsburg when the cornfield changed hands six times
      and the sunken road filled with the dead in rows,
      like a harvest laid down by a terrible reaper.
      Twenty-two thousand in twelve hours.
      Lee's invasion was stopped. That was enough for Lincoln —
      enough to do what he'd been waiting to do.
      I walked the field at dusk, and the crows were already coming,
      and I thought: this much blood, and all it bought was a piece of paper.
      But what a piece of paper it would be.
    description: "I was at Antietam on the bloodiest day in American history — the victory that made emancipation possible."
    status: "published"
    sha256: "4dcc4d40de8a30787f8e32e31b47cca68f226f8d74a770f486b85497d5bb66da"
  - number: "3113"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Emancipation Proclamation"
    date: "1862 CE"
    region: "America"
    poem: |
      He signed it after Antietam — a war measure, the lawyers said,
      freeing the slaves only where he couldn't reach them.
      But I was in Washington when the news broke,
      and I understood what the lawyers missed:
      the war now had a soul.
      Every Union advance became a march of liberation.
      Every Black man who reached the lines became a soldier.
      It didn't free a single slave that day in any place Lincoln controlled —
      and it changed the meaning of every drop of blood
      the war would ever cost. That is what proclamations do.
    description: "I was in Washington when Lincoln's proclamation turned the war into a war against slavery itself."
    status: "published"
    sha256: "79a2dde930882a3f1d41c5194eee51647218123e833d68cc82dd5665699ece22"
  - number: "3114"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Emancipation Takes Effect"
    date: "1863 CE"
    region: "America"
    poem: |
      New Year's Day, 1863 — I spent the watch night
      in a contraband camp in Virginia,
      hundreds of Black families crowded around fires,
      waiting for midnight, waiting for the word to become law.
      When it came — when the proclamation took effect —
      the singing started, and it didn't stop for hours.
      Old men who'd been property on Monday were men on Tuesday.
      Not free everywhere, not free yet in the border states —
      but the direction was set, and everyone in that camp knew it.
      Freedom had a date now. January 1st, forever.
    description: "I kept freedom's watch night in a Virginia contraband camp when emancipation became law at midnight."
    status: "published"
    sha256: "0f276b799e983d1c59106112e61be54500200725487644f6fc1cce8c643b8c19"
  - number: "3115"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The First Underground"
    date: "1863 CE"
    region: "England"
    poem: |
      Steam trains under London's streets —
      I rode the first Metropolitan line, Paddington to Farringdon,
      in a carriage full of smoke and wonder.
      The tunnels leaked, the engines choked the air,
      and the passengers loved it anyway.
      Six miles under the greatest city on earth,
      cut-and-cover trenches roofed over and forgotten.
      I stood on the platform afterward, coughing,
      watching the crowd pour out of the earth like miners,
      and I thought: every great city will dig now.
      The age of the subway had begun, in soot and steam.
    description: "I rode London's first underground railway through smoke-filled tunnels and watched the subway age begin."
    status: "published"
    sha256: "899349134bce74b9acc2adcd4ced4cf003afd926e35168d0c62c3eb08fbf72d4"
  - number: "3116"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Gettysburg"
    date: "1863 CE"
    region: "America"
    poem: |
      Three days in Pennsylvania broke the Confederacy's back —
      I was on Cemetery Ridge when Pickett's men came across the field,
      twelve thousand abreast, into the guns.
      They almost made it. Almost.
      Lee's invasion died in that field, and with it the South's last hope
      of winning the war outright.
      Months later I stood in the cold at the dedication
      and heard Lincoln speak for two minutes —
      "government of the people, by the people, for the people" —
      and the crowd barely had time to settle before it was over.
      Two minutes that outlived every cannon on that field.
    description: "I was on Cemetery Ridge for Pickett's charge and at the dedication when Lincoln spoke for two minutes."
    status: "published"
    sha256: "977db94f76661ac5b660a127a3962ff6aaa9675bf787278111d02e3852db575f"
  - number: "3117"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Vicksburg Falls"
    date: "1863 CE"
    region: "America"
    poem: |
      Grant starved it out — forty-seven days of siege,
      the people of Vicksburg living in caves, eating rats,
      while the shells fell day and night.
      I was there on the Fourth of July when Pemberton surrendered,
      the same week as Gettysburg, though nobody noticed at first.
      The Mississippi was Union water now, top to bottom.
      The Confederacy was cut in two, and the western half
      began to wither like a limb without blood.
      Two victories in one week. The war's tide had turned,
      and everyone who understood war could feel it.
    description: "I was at Vicksburg when it surrendered on the Fourth of July — the Mississippi became Union water."
    status: "published"
    sha256: "72c10cf8f17d8fe9752b3bfb77675495f7e01226256d0096d281ca251e49d488"
  - number: "3118"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Football Gets Rules"
    date: "1863 CE"
    region: "England"
    poem: |
      Eleven clubs in a London tavern, arguing about the laws —
      I sat in the corner of the Freemasons' Tavern
      while they wrote down what a game should be.
      No hacking. No carrying the ball in your hands.
      (Blackheath walked out over that one — they'd keep the handling game,
      and call it rugby.)
      The Football Association was born that night,
      over beer and shouting, and the world's game got its shape.
      I watched them shake hands afterward, enemies over the rules,
      friends over the drinks. From that tavern argument
      would come the World Cup, the billions, all of it.
    description: "I sat in a London tavern while eleven clubs argued out the first written laws of football."
    status: "published"
    sha256: "b0e1491d5f1eefd42216f91d9b04d51cd7a64f799669f7e831bf8389834ca321"
  - number: "3119"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Nanjing Falls"
    date: "1864 CE"
    region: "China"
    poem: |
      The Qing took the Taiping capital in July —
      I entered Nanjing with the imperial troops,
      and what I saw I will not fully describe.
      Fourteen years of holy war ended in slaughter:
      the Heavenly King's palace burned, his followers
      cut down by the tens of thousands, the city emptied.
      Twenty million dead in all — the bloodiest civil war
      in all of human history, and most of the world never heard of it.
      I walked streets where the gutters ran red
      and thought of Hong Xiuquan's dream of heaven on earth.
      This was what it had come to.
    description: "I entered Nanjing with the Qing troops and saw the end of history's bloodiest civil war."
    status: "published"
    sha256: "2f335a869bc5b00daa0b7665569d014f8795c355d10c8a26e4e0d497eeea1b08"
  - number: "3120"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The First Geneva Convention"
    date: "1864 CE"
    region: "Switzerland"
    poem: |
      Twelve nations in Geneva, signing a promise —
      the wounded are neutral, the medics are neutral,
      mercy has a flag now, and it's a red cross on white.
      I watched the delegates sign, Dunant among them,
      his Solferino nightmare finally made into law.
      It was a small treaty. It was a revolution.
      For the first time in human history, nations agreed
      that even in war, some things are not war.
      The ink was barely dry before the next war tested it.
      But the idea held. The idea always holds longer than the ink.
    description: "I watched twelve nations sign at Geneva and make mercy a law of war for the first time."
    status: "published"
    sha256: "2317fdb255f94de08a5c09a0cc7c189f1378e83cda7f3f93ee552fe53d26221a"
  - number: "3121"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Sherman's March"
    date: "1864 CE"
    region: "America"
    poem: |
      Sixty miles wide, from Atlanta to the sea —
      I rode behind Sherman's columns that winter,
      and I watched them burn Georgia methodically:
      railroads twisted into "Sherman's neckties,"
      barns emptied, plantations stripped, the rich earth scorched.
      "War is cruelty," Sherman said, "and you cannot refine it."
      The soldiers sang "Marching Through Georgia"
      while the smoke rose behind them for miles.
      It broke the South's will faster than any battle.
      Total war had come home — and war would never be clean again.
    description: "I rode behind Sherman's columns and watched them burn a sixty-mile path from Atlanta to the sea."
    status: "published"
    sha256: "5441ce5d7cf8126fa6d19146d46f027964a277ba0a6a35ecc7bb32ef2db4a2b5"
  - number: "3122"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Sand Creek"
    date: "1864 CE"
    region: "America"
    poem: |
      They were a peaceful village — Black Kettle's Cheyenne,
      camped under a white flag and an American flag,
      promised protection.
      I arrived the day after the Colorado militia came at dawn
      and killed them anyway: women, children, old men,
      two hundred or more, mutilated, scalped.
      Chivington's men rode back to Denver as heroes
      and displayed the body parts in a theater.
      I walked the frozen creek bed among the dead
      and understood the West's war had turned merciless —
      not a war of battles anymore, but of extermination.
      The flags over the camp had meant nothing.
    description: "I walked the frozen creek bed the day after the militia massacred Black Kettle's peaceful village."
    status: "published"
    sha256: "f9d1c7536899147aa32be262f3004f0239280aad7f975e9277276006ab521117"
  - number: "3123"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Appomattox"
    date: "1865 CE"
    region: "America"
    poem: |
      It ended in a farmhouse parlor, not on a battlefield —
      I was outside the McLean house at Appomattox Court House
      when Lee rode in, in his finest uniform,
      and Grant came in mud-spattered, smoking a cigar.
      The terms were generous: officers keep their sidearms,
      every man keeps his horse, no punishments.
      Lee asked for food for his starving men, and Grant gave it.
      When the news reached the Union lines, the guns started firing
      in celebration — and Grant ordered them stopped.
      "The war is over," he said. "The rebels are our countrymen again."
      I wept. Everyone wept.
    description: "I was outside the farmhouse at Appomattox when Lee surrendered and Grant stopped the celebration guns."
    status: "published"
    sha256: "4b9ea65ce9ec2b773b893674826c5757c97d1b6d5109b44341f4aa5b0bd39767"
  - number: "3124"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Lincoln Assassinated"
    date: "1865 CE"
    region: "America"
    poem: |
      Five days. The war had been over five days.
      I was in Washington the night Booth slipped into the box at Ford's Theatre —
      an actor, playing the most terrible role of his life.
      One bullet, behind the ear. The president carried across the street
      to a boarding house, dying through the night.
      "Damn the man," someone said at dawn. Stanton answered:
      "Now he belongs to the ages."
      I stood in the street outside as the news spread,
      and watched strong men sit down on the curb and cry like children.
      The man who'd saved the Union would not live to rebuild it.
    description: "I was in Washington the night Booth shot Lincoln at Ford's Theatre, five days after the war ended."
    status: "published"
    sha256: "164b2ea6c1cd670be6edbff60d1949eabf0ac553d9b3365681e01cb63110ad21"
  - number: "3125"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Mendel's Peas"
    date: "1865 CE"
    region: "Austria"
    poem: |
      A monk in a monastery garden, counting peas —
      I visited Mendel at Brno and watched him sort his plants:
      round and wrinkled, tall and short, generation after generation,
      twenty-nine thousand plants, every cross recorded.
      He'd found the laws of heredity — dominant, recessive,
      the mathematics of inheritance — and nobody cared.
      He published it. It sank without a ripple.
      Thirty-five years later they'd dig it up and call him the father of genetics.
      I held one of his notebooks. The numbers were perfect.
      The world just wasn't ready to read them.
    description: "I visited Mendel in his monastery garden and held the pea notebooks the world would ignore for 35 years."
    status: "published"
    sha256: "0189e1877215a7c964e3a7e0cca777801e546b3a1bd131a26a49c00f4ab15305"
  - number: "3126"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Slavery Abolished"
    date: "1865 CE"
    region: "America"
    poem: |
      The 13th Amendment — "neither slavery nor involuntary servitude" —
      I was in the Capitol when it passed the House,
      the galleries erupting, members weeping, Black spectators
      cheering from the balconies where they'd once been barred.
      Two hundred and fifty years of American slavery,
      ended in a sentence.
      Then the states ratified, one by one, and by December it was law.
      I walked through a Virginia town that winter
      and watched a freedman read the amendment aloud to a crowd,
      slowly, savoring every word like food.
      The law had finally caught up with the proclamation.
    description: "I was in the Capitol when the 13th Amendment passed and watched a freedman read it aloud in Virginia."
    status: "published"
    sha256: "e2e15e7ca0aa97534527d433470a27664bd26941c80e5aae4be1d42aada56346"
  - number: "3127"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Königgrätz"
    date: "1866 CE"
    region: "Europe"
    poem: |
      Seven weeks — that's all the war lasted.
      I was with the Prussian staff when Moltke's armies
      closed on the Austrians at Königgrätz:
      needle guns against muzzle-loaders, railways against marching feet,
      the telegraph against the courier.
      Two hundred thousand Austrians broken in a day.
      Prussia had settled the German question with blood and iron,
      as Bismarck had promised.
      I walked the field afterward, past the abandoned Austrian guns,
      and thought: Germany is coming, and it will be Prussia's Germany —
      disciplined, armed, and certain. Europe should be worried.
    description: "I was with the Prussian staff at Königgrätz when needle guns and railways broke Austria in a day."
    status: "published"
    sha256: "b0d7c1f2284bb1364cea3fe41be1a7913decd4e32d8663ac88353b9d6da80c30"
  - number: "3128"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Cable Holds"
    date: "1866 CE"
    region: "Atlantic"
    poem: |
      This time it held. I was aboard the Great Eastern —
      the only ship big enough — as she paid out two thousand miles
      of new cable across the Atlantic, and this time the line stayed alive.
      Messages in minutes, day after day, year after year.
      America and Europe, joined for good.
      The old cable of '58 had died in weeks; this one lived.
      I watched the operators tap out the first permanent messages,
      and I thought of all the ships still crossing with mail in their holds.
      They'd keep crossing. But the news would always beat them now.
      The ocean had shrunk to the width of a copper wire.
    description: "I was aboard the Great Eastern when the permanent Atlantic cable was laid and the ocean shrank to a wire."
    status: "published"
    sha256: "b2031a899ab0ffb1d99c1bf1b7bcd9f1b9d7ad96c0af8fef68929c47bbf9f4c8"
  - number: "3129"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Alaska Purchase"
    date: "1867 CE"
    region: "America"
    poem: |
      Two cents an acre — Seward bought Alaska from Russia
      for $7.2 million, and the newspapers laughed themselves sick.
      "Seward's Folly." "Seward's Icebox." "Walrussia."
      I was in Washington when the treaty was signed,
      and I heard the jokes in every bar in town.
      A frozen wasteland, they said. Nothing there but ice and bears.
      (I thought of the gold under the Klondike, the oil under the tundra,
      the salmon, the timber — but I kept my mouth shut.
      Let them laugh. The future would do the accounting.)
      The greatest real-estate bargain in history, signed amid giggles.
    description: "I was in Washington when Seward bought Alaska for two cents an acre and everyone laughed."
    status: "published"
    sha256: "4d413c402e4f695dbe7e7d46770a07a6a2fad4a79564373b6ceb92cb60f53cc6"
  - number: "3130"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Maximilian Executed"
    date: "1867 CE"
    region: "Mexico"
    poem: |
      An Austrian archduke, set on Mexico's throne by French bayonets —
      I was at Querétaro when it ended.
      Napoleon III pulled his troops out, the republic closed in,
      and Maximilian faced the firing squad in his black frock coat,
      handing each soldier a gold coin and asking them to aim well.
      "Viva México," he said. The volley answered.
      The French adventure in Mexico died with him.
      I watched Juárez's republic take back its country
      and thought: empires planted by other empires' guns
      never take root. The soil rejects them.
    description: "I was at Querétaro when Maximilian faced the firing squad and Mexico's republic returned."
    status: "published"
    sha256: "268bb9a5fad80664facf8ed62c19129807cbb8e98c8c51a21d001643e055c07a"
  - number: "3131"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Dominion of Canada"
    date: "1867 CE"
    region: "Canada"
    poem: |
      Four provinces, one dominion — I was in Ottawa
      on the first Dominion Day, July 1st,
      when Canada became a self-governing nation inside the Empire.
      No revolution. No war. Just a law passed in London
      and a new flag over a new country.
      The Americans had fought for theirs; the Canadians
      had negotiated for theirs, politely, over tea.
      I watched the celebrations — modest, orderly, Canadian —
      and thought there was something admirable
      about a country born from a conference table instead of a battlefield.
      It would grow to be the second-largest nation on earth.
    description: "I was in Ottawa on the first Dominion Day when Canada was born from a conference table, not a battlefield."
    status: "published"
    sha256: "a93925efd24095fba20853df8bad052a58fcbbcd3d613941aa02ce17c8a4cd73"
  - number: "3132"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Dynamite"
    date: "1867 CE"
    region: "Sweden"
    poem: |
      Nobel tamed nitroglycerin with kieselguhr —
      I visited his works and watched them pack the clay-like sticks
      that would move mountains and, in the wrong hands, level cities.
      Safer to handle than raw nitro, just as powerful.
      The fortune it made him was enormous —
      and haunted him. They called him the merchant of death.
      So he wrote a will that turned the dynamite money
      into prizes for peace, science, and literature.
      I held a stick of dynamite in my hand that day,
      feeling the weight of it. Destruction in one hand,
      the Nobel Prizes in the other. Same man. Same powder.
    description: "I held a stick of Nobel's new dynamite — the powder that would fund the prizes for peace."
    status: "published"
    sha256: "758d2a5b00d4d63d45affaff3253d72a55d9f1f39de003be3044936983456689"
  - number: "3133"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Meiji Restoration"
    date: "1868 CE"
    region: "Japan"
    poem: |
      The shogun fell, the boy-emperor took the throne —
      I was in Kyoto when the old order collapsed
      and Japan decided, all at once, to become modern.
      They sent students to the West, hired foreign experts,
      built railways and shipyards and schools at a speed
      that left every visitor dizzy.
      "Japanese spirit, Western learning" — that was the slogan.
      In forty years they'd go from feudal swordsmen to battleships.
      I watched a samurai cut off his topknot in the street
      and put on a Western suit, and I thought:
      this is the fastest transformation of a nation I will ever see.
    description: "I was in Kyoto when the shogun fell and watched Japan decide to become modern all at once."
    status: "published"
    sha256: "21ca89650c263c6ef4fc1028b262ff1b6759bc6abe9336208b7415a3d1e174ec"
  - number: "3134"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Little Women"
    date: "1868 CE"
    region: "America"
    poem: |
      Alcott wrote it in ten weeks for the money —
      I met her in Boston that year, tired, funny, practical,
      and she had no idea what she'd made.
      Meg, Jo, Beth, Amy — four sisters in a Concord house,
      poor and proud and alive on the page.
      Girls devoured it. Then their mothers read it.
      Then everyone read it.
      Jo March wanted to be a writer more than she wanted to marry,
      and a million girls read that and believed it was allowed.
      I watched a bookseller's whole stock sell out in a week
      and thought: she wrote it for the money, and made something priceless.
    description: "I met Alcott in Boston the year she wrote Little Women in ten weeks and gave Jo March to a million girls."
    status: "published"
    sha256: "348e499397fe1fed5a505292969e72dff01779dfc75e76f42fa7111f9713055c"
  - number: "3135"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Periodic Table"
    date: "1869 CE"
    region: "Russia"
    poem: |
      Mendeleev laid out the elements like cards in patience —
      I was in St. Petersburg when he showed me the table:
      each element in its place, by weight, by character,
      and gaps — empty spaces where elements should be
      but hadn't been found yet.
      He predicted them anyway: their weights, their colors,
      what they'd do. "Eka-aluminium," he said, pointing at a gap.
      Years later they found it — gallium — exactly as he'd said.
      I stared at the table. It wasn't a list. It was a prophecy,
      written in the language of matter itself.
    description: "I saw Mendeleev's table in St. Petersburg — with empty spaces predicting elements not yet found."
    status: "published"
    sha256: "22b14cf078aa0084068d1bac9b7d642986dfc344c30530a9899265d0628bd57c"
  - number: "3136"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Golden Spike"
    date: "1869 CE"
    region: "America"
    poem: |
      Promontory, Utah, May 10th — I was there in the crowd
      when the last spike went in, gold-plated, tapped with a silver hammer,
      and the telegraph flashed one word across the nation: DONE.
      Two railroads, built from opposite oceans, met in the desert.
      America was stitched coast to coast — six months of travel
      compressed into a week.
      The Chinese workers who'd blasted the Sierras
      were barely mentioned in the speeches. I noticed.
      I watched the two locomotives nose together,
      pilot to pilot, and the cheer went up like a wave.
      A continent, joined by iron.
    description: "I was at Promontory when the golden spike joined the rails and the telegraph flashed DONE."
    status: "published"
    sha256: "e6297537d882b3fdf8281896625344dd7571deb16cd2650cb558c4daa7d42ef7"
  - number: "3137"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Suez Canal Opens"
    date: "1869 CE"
    region: "Egypt"
    poem: |
      De Lesseps dug a ditch through the desert and changed the map —
      I sailed through the canal in the opening procession,
      a hundred miles of water where there'd been sand.
      London to Bombay in weeks instead of months.
      The Empress Eugénie led the fleet through, all flags and music.
      But I did the arithmetic the celebrants skipped:
      Egypt had paid in money and in forced labor —
      thousands dead digging it — and would soon lose the canal itself
      to British shareholders.
      A triumph of engineering. A tragedy of ownership.
      The ships sail through it still.
    description: "I sailed the Suez Canal in the opening procession — a triumph dug with forced labor that Egypt would lose."
    status: "published"
    sha256: "e91bf367cdf1c277ccc23312959193c1350c0c0ec0a11747043edbec71912ac6"
  - number: "3138"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Wyoming Votes for Women"
    date: "1869 CE"
    region: "America"
    poem: |
      The Wyoming Territory did it first —
      I was in South Pass City when the territorial legislature
      passed women's suffrage, and the governor signed it.
      The first government on earth where women voted.
      The motives were mixed — some said it was to attract settlers,
      some said it was a joke that passed by accident.
      The women of Wyoming didn't care about the motives.
      They registered. They voted. They served on juries.
      Fifty years before the 19th Amendment, in a territory
      most Americans couldn't find on a map,
      the future arrived early, wearing a calico dress.
    description: "I was in Wyoming when the territory gave women the vote — fifty years before the nation caught up."
    status: "published"
    sha256: "4780f67db494481e669bcf0bfd308f0b227fefeab6c5d164332b8b3819070bd2"
  - number: "3139"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The 15th Amendment"
    date: "1870 CE"
    region: "America"
    poem: |
      "The right to vote shall not be denied on account of race" —
      I was in Washington when it was ratified,
      and I watched Black men line up at the polls across the South,
      some in their old Union uniforms, voting for the first time.
      On paper, it was complete: freedom, citizenship, the ballot.
      On paper.
      I also watched the white South begin its long counterattack —
      poll taxes, literacy tests, the Klan by night —
      that would steal it all back within a decade.
      The amendment was a promise. Keeping it would take a century.
    description: "I watched Black men vote for the first time under the 15th Amendment — and saw the South begin to steal it back."
    status: "published"
    sha256: "b2eb0bebcedda56d566a8f7964425afe515da6e0d8bce331197410c8672716b3"
  - number: "3140"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Franco-Prussian War"
    date: "1870 CE"
    region: "Europe"
    poem: |
      France declared it — Napoleon III, chasing glory,
      walked straight into Bismarck's trap.
      I was in Paris when the news of the first defeats arrived,
      and the boulevards went from confident to stunned in a week.
      The Prussian war machine — the railways, the needle guns,
      Moltke's staff work — chewed through the French armies
      like a threshing machine through wheat.
      It was supposed to be a short, splendid war.
      It was short. It was not splendid.
      It ended an empire, birthed another, and planted the seeds
      of two world wars. I watched it start, and I was afraid.
    description: "I was in Paris when France declared war on Prussia and walked into catastrophe."
    status: "published"
    sha256: "2fd60ac5fcaac38f00913e7b7157563e357b5559baf187585c2409de944b4b78"
  - number: "3141"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Sedan"
    date: "1870 CE"
    region: "France"
    poem: |
      One day. The whole Second Empire fell in one day.
      I was near Sedan when MacMahon's army was surrounded —
      a hundred thousand French soldiers, the emperor himself,
      trapped in a pocket and pounded by Prussian artillery.
      Napoleon III surrendered his sword. The Empire collapsed
      before the news even reached Paris.
      I watched the emperor ride out to captivity,
      a sick man in a carriage, and I remembered 1852,
      the crown, the cheers, the boulevards.
      Eighteen years. That's how long the dream lasted.
    description: "I was near Sedan when Napoleon III surrendered his army and his eighteen-year empire fell in a day."
    status: "published"
    sha256: "b6858783e55a506134d8fbf16031962061c3165e59219664a01489e523b69697"
  - number: "3142"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Rome Falls"
    date: "1870 CE"
    region: "Italy"
    poem: |
      The Italian guns breached the Aurelian Walls at Porta Pia —
      I was there that September morning, watching Bersaglieri
      pour through the gap while the Pope's troops fell back.
      Rome was Italy's at last. The thousand-year dream complete:
      one country, one capital.
      Pius IX declared himself a prisoner in the Vatican
      and would not leave it again.
      An old Roman woman next to me crossed herself and wept —
      for the Pope, or for Italy, I couldn't tell.
      Maybe both. History doesn't ask permission
      when it finishes what it started.
    description: "I watched Italian troops breach Rome's walls at Porta Pia and complete the thousand-year dream of unity."
    status: "published"
    sha256: "49e0bc610be2f64985ba1e360c1733657dcba9414dc545e23fd05345c296c555"
  - number: "3143"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The German Empire"
    date: "1871 CE"
    region: "Germany"
    poem: |
      They crowned him in the Hall of Mirrors at Versailles —
      I stood among the princes and generals
      while Wilhelm I of Prussia became German Kaiser,
      in the palace of the defeated French king.
      The symbolism was the point. Bismarck made sure of it.
      Germany was born — united, armed, industrial —
      in the very room where France had displayed its glory.
      I looked at the mirrors reflecting all those uniforms
      and thought: this birth will cost Europe dearly.
      An empire proclaimed in an enemy's palace
      does not forget it was made by war.
    description: "I stood in Versailles' Hall of Mirrors when Prussia's king was crowned Kaiser of a united Germany."
    status: "published"
    sha256: "318ca097cc53d5070e7107d5f76577707053629f4f84557a31d6ad97dc7a0b88"
  - number: "3144"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Paris Commune"
    date: "1871 CE"
    region: "France"
    poem: |
      Seventy-two days — Paris tried to govern itself.
      I was there in the spring: the barricades, the red flags,
      workers running the city while the government cowered at Versailles.
      It was chaotic, idealistic, doomed.
      Then the army came back in May — the Bloody Week —
      and drowned the Commune in its own blood.
      Twenty thousand shot, against walls, in the streets.
      I walked through Père Lachaise afterward,
      past the wall where the last defenders fell,
      and the stones were still dark.
      Paris has never forgotten. Neither have I.
    description: "I was in Paris for the Commune's seventy-two days and walked Père Lachaise after the Bloody Week."
    status: "published"
    sha256: "1231a0647ffc077c15ce198f179a2ebb94868384b585b8495bd9638744f344c5"
  - number: "3145"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Great Chicago Fire"
    date: "1871 CE"
    region: "America"
    poem: |
      Two days, and a city of wood was gone —
      I was in Chicago when the fire started,
      and I ran with the crowds as the flames
      jumped the river and ate block after block.
      (The cow and the lantern? Probably a story.
      The drought and the wind were real enough.)
      A hundred thousand homeless. Three hundred dead.
      The city burned to the ground —
      and then Chicago did the most Chicago thing imaginable:
      it rebuilt, bigger, in steel and stone.
      I stood in the ashes on the third day
      and watched them already clearing lots.
      That spirit built the modern city.
    description: "I ran with the crowds through the Great Chicago Fire and watched the city start rebuilding in the ashes."
    status: "published"
    sha256: "c6202bdcf5e165bd1f7a6629467c19b33540a72b7fdf9fccc9e67283579d0fe4"
  - number: "3146"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "\"Dr. Livingstone, I Presume?\""
    date: "1871 CE"
    region: "Africa"
    poem: |
      Deep in the African interior, by a lake —
      I was with Stanley's caravan when we found him:
      David Livingstone, the lost explorer,
      sick, alone, out of supplies, refusing to leave.
      Stanley took off his hat and spoke the most famous
      greeting in exploration history:
      "Dr. Livingstone, I presume?"
      Livingstone smiled. They'd both walked a thousand miles
      to have that conversation.
      I watched two stubborn men share tea in the wilderness
      and thought: this is what the age of exploration really is —
      not flags, but one man refusing to quit,
      and another refusing to let him be lost.
    description: "I was with Stanley's caravan when he found the lost Livingstone deep in Africa."
    status: "published"
    sha256: "42a72e20beefb2d14508035cab864232d2b4ac42b2e32834b8372c5d6c96174b"
  - number: "3147"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Yellowstone"
    date: "1872 CE"
    region: "America"
    poem: |
      Two million acres, set aside forever —
      I rode with the Hayden expedition through the geyser basins,
      watching Old Faithful throw its white plume at the sky,
      the hot springs painting the earth in impossible colors.
      Congress made it a park — the world's first national park —
      not for profit, not for settlement, but because it was beautiful.
      The idea was radical: some land belongs to everyone,
      and to no one, and to the future.
      I stood at the Grand Canyon of the Yellowstone,
      the falls thundering below, and thought:
      this is the best thing a government ever did with a map.
    description: "I rode with the Hayden expedition through the geyser basins before Yellowstone became the world's first national park."
    status: "published"
    sha256: "cb4eb6a785d9e48c7d420a6265fd13f02c050220ec6a8434f093434891e53265"
  - number: "3148"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Secret Ballot"
    date: "1872 CE"
    region: "England"
    poem: |
      No more landlords watching the polls —
      I voted in the first secret-ballot election in Britain,
      marking my X behind a screen, folding the paper,
      dropping it in the box where no one could see.
      Such a small thing. Such a revolution.
      Before this, tenants voted as their landlords ordered,
      workers as their masters demanded — everyone watching.
      The Ballot Act ended all that with a curtain and a pencil.
      I walked out of the polling station feeling
      ten feet tall. My vote was mine.
      Democracy had finally learned to keep a secret.
    description: "I voted in Britain's first secret-ballot election — a curtain, a pencil, and a revolution."
    status: "published"
    sha256: "14e8870fe5bd1bc9dcdec006e29c5717e23bb7be5a413138e74ccaac5d882fcf"
  - number: "3149"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Challenger Sails"
    date: "1872 CE"
    region: "Atlantic"
    poem: |
      A warship turned into a laboratory —
      I watched HMS Challenger leave Portsmouth,
      her guns removed, her labs installed,
      bound to map the floor of the entire ocean.
      Four years. Sixty-nine thousand miles.
      They'd dredge up four thousand new species,
      measure the deepest trenches, and invent oceanography.
      I stood on the dock as she sailed,
      a converted corvette carrying microscopes instead of cannon,
      and I thought: this is the best use anyone ever made of a warship.
      The sea had been a road and a battlefield.
      Now it would be a question — and they'd spend four years answering it.
    description: "I watched HMS Challenger sail from Portsmouth to map the ocean floor and invent the science of the seas."
    status: "published"
    sha256: "7162e764d56b3014fd3db2c0702aed9f04b2d1d7a79949dad9b3b7f71f4cf0fc"
  - number: "3150"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Panic of 1873"
    date: "1873 CE"
    region: "America"
    poem: |
      It started with a bank — Jay Cooke's, overextended on railroads —
      I was on Wall Street the day it failed,
      and the panic spread like cholera through the exchanges.
      Banks closed. Railroads went bankrupt. Factories shut.
      Six years of depression followed — the Long Depression —
      millions out of work, wages cut, strikes broken.
      I walked through mill towns in Pennsylvania
      where the furnaces had gone cold and the men
      sat on their porches staring at nothing.
      The boom had been built on borrowed money.
      The bill came due, and the poor paid it.
    description: "I was on Wall Street when Jay Cooke's bank failed and the panic began six years of depression."
    status: "published"
    sha256: "2cbe8b0ace067e6984fbb73f0607676115dcbb31b40879c9f2b6c66d53edd510"
  - number: "3151"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Maxwell's Equations"
    date: "1873 CE"
    region: "England"
    poem: |
      Four equations. That's all it took.
      I visited Maxwell at Cambridge — quiet man, big mind —
      and he showed me what he'd done:
      electricity, magnetism, and light,
      three mysteries, one mathematics.
      Light is an electromagnetic wave, the equations said.
      Nobody could quite believe anything so beautiful could be true.
      It was true. Radio, X-rays, all of it was hiding in those four lines.
      I looked at the paper and felt the way you feel
      looking at a cathedral's blueprint —
      small marks on paper, and a universe inside.
    description: "I visited Maxwell at Cambridge and saw the four equations that united electricity, magnetism, and light."
    status: "published"
    sha256: "b4e1d84077c791fdb6df987025df5e2716b9f82d97ab03a09af2306dbc3e8e7f"
  - number: "3152"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "War with the Asante"
    date: "1873 CE"
    region: "West Africa"
    poem: |
      The Golden Stool against the British Empire —
      I was on the Gold Coast when Wolseley's expedition marched inland,
      redcoats and rockets against the Asante army.
      The Asante had humiliated the British before;
      London was done being humiliated.
      It was the classic colonial war: Maxim guns not yet,
      but breech-loaders and discipline against courage and numbers.
      I watched the column disappear into the forest,
      porters and soldiers stretching for miles,
      and I thought of the golden kingdom waiting at the end of that road.
      It would not survive the meeting.
    description: "I was on the Gold Coast when Britain marched inland against the Asante Empire."
    status: "published"
    sha256: "c6119f12067fe81e3cf36af3381a55299ec6b17f4e43384ba3c5ed71c16a9d71"
  - number: "3153"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Kumasi Falls"
    date: "1874 CE"
    region: "West Africa"
    poem: |
      They burned the capital — I entered Kumasi
      behind Wolseley's troops, and the great Asante city
      was in flames, the palace looted, the Golden Stool hidden away
      (they never found it — the soul of the nation, safe).
      The empire of gold was broken.
      The British marched back to the coast, mission accomplished,
      leaving ashes and a treaty.
      I stood in the burned palace courtyard
      and thought about what conquest costs the conquered
      versus what it costs the conqueror.
      The Asante counted their dead. The British counted their glory.
      Only one of those counts was honest.
    description: "I entered burning Kumasi behind Wolseley's troops and watched the Asante Empire of gold break."
    status: "published"
    sha256: "e05ead024e706b393f6d9948766230f6f272e427e9b035ab860300ce623b04ac"
  - number: "3154"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Impressionists"
    date: "1874 CE"
    region: "France"
    poem: |
      Rejected by the Salon, they hung their own show —
      I was at the first Impressionist exhibition in Paris,
      in Nadar's studio, looking at Monet's sunrise:
      a harbor in fog, orange sun, brushstrokes you could see.
      A critic sneered "Impression!" — and the name stuck.
      Light, not lines. The moment, not the monument.
      Renoir's dancers, Pissarro's fields, Degas's ballerinas —
      paint that shimmered instead of posing.
      I stood in front of that sunrise a long time.
      Art had just learned to see the way eyes actually see.
    description: "I was at the first Impressionist show in Paris when a critic's sneer gave the movement its name."
    status: "published"
    sha256: "6e4b2848591503aa7212bca2ec637058ab602076bc23a1141cdd3fecb15cdf13"
  - number: "3155"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Typewriter"
    date: "1874 CE"
    region: "America"
    poem: |
      Click-clack, ding — the office would never be the same.
      I tried the first Remington in New York,
      hunting and pecking at the QWERTY keys,
      watching my words appear in clean, even type.
      No more clerk's cramped hand. No more illegible ledgers.
      And something nobody predicted: it created a new workforce.
      Women, hired as typists, flooded into offices
      that had been all male — the typewriter
      as an unlikely engine of emancipation.
      I typed my name and held up the page.
      It looked official. It looked like the future.
    description: "I tried the first Remington typewriter in New York and watched it remake the office — and employ a generation of women."
    status: "published"
    sha256: "eb603e963999b6411d50efcd8f02db6f628a4c5ac54a75e648c40bfac4bb97ff"
  - number: "3156"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Hockey Is Born Indoors"
    date: "1875 CE"
    region: "Canada"
    poem: |
      Montreal, a skating rink, March 3rd —
      I was in the Victoria Skating Rink when they played
      the first organized indoor hockey game:
      two teams of nine, a wooden puck (not a ball, safer indoors),
      written rules, a real referee.
      McGill students, mostly. Fast, rough, glorious.
      The puck flew, the sticks clashed, the crowd roared
      in that enclosed, echoing space.
      Outside it was still winter. Inside, something new was born.
      I left with my ears ringing and my cheeks cold,
      and I thought: this game is going to travel.
      It would. To every frozen corner of the earth.
    description: "I was in Montreal's Victoria Skating Rink for the first organized indoor hockey game."
    status: "published"
    sha256: "99645759b7bdecef1aacce752756d2a9d18d7fa90f45f0da54b4278f1ff61da5"
  - number: "3157"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Carmen"
    date: "1875 CE"
    region: "France"
    poem: |
      It flopped. I was at the premiere in Paris —
      Bizet's fiery gypsy, the cigarette factory, the toreador,
      and the audience sat on its hands.
      Too raw, too real, too much death for the Opéra-Comique.
      Bizet died three months later, thirty-six,
      never knowing what he'd made.
      Because Carmen didn't stay dead.
      It rose again — the Habanera, the Toreador Song —
      and became the most performed opera on earth.
      I sat in that cold premiere audience
      and missed it completely. So did everyone.
      Genius sometimes needs the composer to die first.
    description: "I was at Carmen's cold Paris premiere, three months before Bizet died never knowing it would become immortal."
    status: "published"
    sha256: "db63717962d285d89493455aea4b94ec6809be30d198955f7397bd612cfab260"
  - number: "3158"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "\"Mr. Watson, Come Here\""
    date: "1876 CE"
    region: "America"
    poem: |
      The first telephone call was an accident —
      Bell spilled acid on himself in his Boston workshop
      and shouted for his assistant in the next room:
      "Mr. Watson, come here — I want to see you!"
      And Watson heard him. Through the wire.
      I was there that week, and Bell showed me the thing:
      a wooden frame, a membrane, a wire carrying a human voice.
      He'd patented it hours before Elisha Gray filed his own claim —
      the most valuable race in invention history, won by a morning.
      I spoke into it. My own voice came back, thin and miraculous.
      Distance had just been murdered.
    description: "I was in Bell's workshop the week the spilled acid produced the first telephone call."
    status: "published"
    sha256: "35dbaeb1831ea1462f6afd82beb897998f322874f273a03241b0d992e0328aa7"
  - number: "3159"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Little Bighorn"
    date: "1876 CE"
    region: "America"
    poem: |
      Custer's luck ran out on a Montana hillside —
      I rode with the burial party days later,
      past the ridge where 268 soldiers fell
      with their reckless general.
      The Sioux and Cheyenne — Sitting Bull, Crazy Horse —
      had done what no one thought possible:
      wiped out a whole cavalry command in an afternoon.
      It was the Indians' greatest victory,
      and it sealed their doom. America would not forgive this.
      The revenge came at Wounded Knee, fourteen years later.
      I stood on Last Stand Hill in the silence
      and thought: courage on both sides, wisdom on neither.
    description: "I rode with the burial party at Little Bighorn days after the Sioux and Cheyenne wiped out Custer's command."
    status: "published"
    sha256: "5477a7e193546ba4e6953c30354bb855d443e10ef0608be03c8d1e6ca8a7650c"
  - number: "3160"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Wagner's Ring"
    date: "1876 CE"
    region: "Germany"
    poem: |
      Four operas. Fifteen hours. One theater built for the purpose —
      I was at Bayreuth for the first complete Ring Cycle,
      in the darkened hall Wagner had designed himself.
      Gods and giants, a cursed ring, the twilight of everything —
      music so vast it felt like weather.
      The kings and emperors in the audience fidgeted.
      The rest of us were drowned and reborn.
      It nearly bankrupted him. It changed music forever.
      I walked out into the Bavarian night after Götterdämmerung,
      the world ending in fire and flood behind me,
      and my ears rang for days.
    description: "I was at Bayreuth for the first complete Ring Cycle — fifteen hours of gods, gold, and twilight."
    status: "published"
    sha256: "34b23ed09e67c8942e5f8608ae26f35f0e16e499bd8797a4aae87c15b710856f"
  - number: "3161"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Empress of India"
    date: "1876 CE"
    region: "India"
    poem: |
      Victoria, Empress — proclaimed at Delhi in a durbar of princes.
      I was there among the elephants and the jewels,
      watching the Raj put a crown on its conquest.
      Disraeli's idea: give the Queen an imperial title
      to match the reality of ruling two hundred million people.
      The princes bowed. The guns fired. The diamonds glittered.
      And underneath the ceremony, the same old machinery:
      taxes, troops, the slow drain of wealth to London.
      I watched an old maharaja adjust his turban
      and stare at the empty sky. He knew what a crown costs
      when someone else is wearing it.
    description: "I was at the Delhi durbar when Victoria was proclaimed Empress and the Raj got its crown."
    status: "published"
    sha256: "27fb33cf7d1bb4d4497549e3f67a761d4e52441e5516af5c0073b1dc435861b6"
  - number: "3162"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Russo-Turkish War"
    date: "1877 CE"
    region: "Ottoman Empire"
    poem: |
      Russia went to war for the Balkan Christians —
      I was with the correspondents when the Russian armies
      crossed the Danube, all Orthodox fervor and imperial appetite.
      The Ottomans fought hard. Plevna held out for months.
      But the empire was rotting, and everyone knew it.
      This war would redraw the map of the Balkans —
      Bulgaria, Serbia, Romania emerging from the wreckage —
      and plant the quarrels that would still be killing people
      a century later.
      I watched the Cossacks ride south and thought:
      they're liberating the Balkans into a powder keg.
    description: "I crossed the Danube with the Russian armies and watched the Balkans begin their long road to the powder keg."
    status: "published"
    sha256: "b8d378a06f21d6d5993de905b43d0cee71b4c669683d5e96e573bbc39eb00b30"
  - number: "3163"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The First Wimbledon"
    date: "1877 CE"
    region: "England"
    poem: |
      Twenty-two men, one trophy, a guinea to enter —
      I was at the All England Club for the first Wimbledon,
      watching Spencer Gore win it with his newfangled volleying.
      Lawn tennis: an afternoon pastime turned championship.
      The grass was bumpy, the rackets were wooden,
      the ladies watched from the pavilion in their long dresses.
      Nobody imagined Centre Court, or millions watching,
      or the strawberries. It was just a club tournament
      on a summer afternoon.
      I sat on the grass bank and thought how strange it is
      that the biggest things start the smallest.
    description: "I sat on the grass bank at the first Wimbledon and watched Spencer Gore win the guinea-entry tournament."
    status: "published"
    sha256: "69106d685b6f40d8826b074d2f372a10a54321dc937771e68de0f84929b2250c"
  - number: "3164"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Great Railroad Strike"
    date: "1877 CE"
    region: "America"
    poem: |
      It started in West Virginia and spread like fire —
      I was in Pittsburgh when the railroad workers walked out,
      wages cut for the third time, nothing left to lose.
      The strike went national: fourteen states, a hundred thousand men.
      Militia fired on crowds. Baltimore burned. Pittsburgh burned —
      the rail yards a sea of flame, locomotives torched.
      Federal troops broke it, in the end, with bayonets.
      But something had changed: American labor had shown
      it could stop the nation cold.
      I watched the soldiers march in and thought:
      this argument isn't over. It's just beginning.
    description: "I was in Pittsburgh when the railroad strike went national and labor showed it could stop the country cold."
    status: "published"
    sha256: "5dcf9905c947765c01a6f7a00522d10c425fdb97d3e65f03ff6a440e5a911e03"
  - number: "3165"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Phonograph"
    date: "1877 CE"
    region: "America"
    poem: |
      "Mary had a little lamb" — Edison shouted it into a horn,
      and the machine shouted it back.
      I was in Menlo Park that December night,
      and I watched grown men go pale.
      A voice, captured. A moment, kept.
      Sound had always died the instant it was born —
      now it could live forever on tinfoil.
      Edison thought it would record dying men's last words
      and teach elocution. He didn't foresee the music.
      None of us did. I listened to my own voice played back
      and felt the strangest chill: I had just heard myself
      from the outside, for the first time in my life.
    description: "I was in Menlo Park the night Edison's phonograph first played a human voice back."
    status: "published"
    sha256: "5de3ed8d48e7041a158f30f6c1631151181c9479937ff27d9860541b8e3173f2"
  - number: "3166"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Hello, Operator"
    date: "1878 CE"
    region: "America"
    poem: |
      The first telephone exchange opened in New Haven —
      I was there when the switchboard lit up,
      twenty-one subscribers, and a boy to connect them.
      "Hello, operator? Connect me to—"
      The operator was the network. A human voice
      plugging wires into jacks, making the connections
      by hand, by memory, by patience.
      Within a year there were exchanges everywhere,
      and the operators — mostly young women soon —
      became the voices of the new age.
      I picked up the receiver and asked for a number,
      and a girl's voice said, "One moment, please."
      The future had a receptionist.
    description: "I was in New Haven when the first telephone exchange connected its twenty-one subscribers by hand."
    status: "published"
    sha256: "08ead31fb8ea42c6faf42720cd045a033c38eaf65c25d3179ea668a9e1168563"
  - number: "3167"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Congress of Berlin"
    date: "1878 CE"
    region: "Europe"
    poem: |
      They carved up the Balkans over a green baize table —
      I was in Berlin while Bismarck chaired the great powers:
      Disraeli, the Russians, the Austrians, the French,
      redrawing borders with rulers and cigars.
      Bulgaria shrunk. Bosnia handed to Austria.
      Romania, Serbia, Montenegro recognized —
      every settlement a seed of the next war.
      No Balkan voice in the room. That was the point.
      I watched the old men deal out nations like cards
      and thought: they're not solving the Eastern Question.
      They're scheduling it. Sarajevo was thirty-six years away.
    description: "I watched the great powers carve up the Balkans in Berlin — dealing out nations like cards, scheduling Sarajevo."
    status: "published"
    sha256: "1264bf080fb9adce044e916269603d3bd4d8756f83c61f61169c793a59ff20e7"
  - number: "3168"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Second Afghan War"
    date: "1878 CE"
    region: "Afghanistan"
    poem: |
      Britain invaded Afghanistan again —
      I was with the column that marched through the Khyber,
      and the old soldiers told the young ones about 1842,
      about the retreat from Kabul, about the one survivor.
      Nobody listened. Empires never listen.
      They took Kabul. They installed their emir.
      Then the residency was massacred, and the war began in earnest —
      another round in the graveyard of empires.
      I stood in the Khyber Pass, the wind howling down the rocks,
      and thought: this place has buried every army
      that ever marched through it. The British would learn.
      Everyone learns, eventually, in Afghanistan.
    description: "I marched through the Khyber with the British column into the graveyard of empires."
    status: "published"
    sha256: "2790b353119ea94ba56a1d33d2336e878e9dd4b43cefd4028fcfbadc23b80dc7"
  - number: "3169"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Isandlwana"
    date: "1879 CE"
    region: "South Africa"
    poem: |
      Britain's worst colonial defeat —
      I reached the battlefield the day after:
      a thousand British and colonial troops dead,
      wiped out by twenty thousand Zulu warriors
      with spears and shields against rifles and cannon.
      The Zulu horns-of-the-buffalo tactic closed around them,
      and courage met courage, and numbers told.
      London was stunned. An empire that had beaten Napoleon
      brought low by men with spears.
      I walked among the dead in the African sun
      and thought: never underestimate a people
      fighting for their own land. The Zulu knew it.
      The British were learning it, at terrible cost.
    description: "I walked the Isandlwana field the day after Zulu warriors annihilated a British column."
    status: "published"
    sha256: "2125209b5f22d63c13341f69db56d94479076a7b72293e798eb7f5747cf7c08d"
  - number: "3170"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Rorke's Drift"
    date: "1879 CE"
    region: "South Africa"
    poem: |
      Hours later, eleven miles away —
      I arrived at the mission station as the firing died down:
      150 British soldiers, sick and wounded among them,
      had held off 4,000 Zulu through the night.
      Mealie bags for walls. A hospital burning.
      Eleven Victoria Crosses — more than any single battle before or since.
      Chard and Bromhead, two lieutenants nobody had heard of,
      became the heroes that washed away Isandlwana's shame.
      I stood in the trampled yard at dawn,
      the air still thick with smoke,
      and thought: this is what empires run on —
      desperate courage, turned into legend by morning.
    description: "I reached Rorke's Drift at dawn after 150 soldiers held a mission station against 4,000 Zulu."
    status: "published"
    sha256: "535c77ba08aa98d4fce016f6888f874b009736df8190b37b274e2138fa119d97"
  - number: "3171"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Let There Be Light"
    date: "1879 CE"
    region: "America"
    poem: |
      Thirteen hours. The bulb burned for thirteen hours —
      I was in Menlo Park on the night it worked,
      a carbonized thread in a glass bulb, glowing steady.
      Edison had tried thousands of filaments.
      This one held.
      The men in the lab didn't cheer. They just stared,
      the way you stare at something that changes everything
      and you know it.
      Within three years he'd light Manhattan.
      Within a lifetime, the night itself would retreat.
      I walked home under the stars that night,
      not knowing it was one of the last times
      humanity would see them so clearly.
    description: "I was in Menlo Park the night Edison's bulb burned thirteen hours and the electric age began."
    status: "published"
    sha256: "155828879c892a35350a50d0d1b255fc36f2790b5f01fb05e08a6b8e246d21cb"
  - number: "3172"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "A Doll's House"
    date: "1879 CE"
    region: "Norway"
    poem: |
      The door slam heard around the world —
      I was in the theater when Nora walked out on Torvald,
      on her marriage, on the whole nineteenth century.
      The audience gasped. Some were furious.
      A woman leaving her husband and children — for herself?
      Ibsen had written the impossible: a wife as a person,
      not a possession, not a doll in a doll's house.
      The play was banned, rewritten, argued over in every capital.
      But the door stayed slammed.
      I watched the actress hold that final moment —
      hand on the door, then gone —
      and I knew: nothing about marriage would ever be innocent again.
    description: "I was in the theater when Nora slammed the door in A Doll's House — and on the nineteenth century."
    status: "published"
    sha256: "68b369fb3dc488fce1be4a77cda77b1e237fa46a998117e63e57983bbb24043a"
  - number: "3173"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Ned Kelly's Last Stand"
    date: "1880 CE"
    region: "Australia"
    poem: |
      Armor made from ploughshares —
      I was at Glenrowan when the Kelly gang made its last stand,
      Ned walking out of the bush in his homemade iron suit,
      a bush knight in a metal helmet, bullets bouncing off his chest.
      They shot his legs out from under him. That's how it ended.
      Bank robber, cop killer, folk hero —
      Australia's most famous outlaw, caught at last.
      They hanged him in Melbourne. His last words, they say:
      "Such is life."
      I looked at that strange armor afterward, dented and scorched,
      and thought: every country gets the outlaw it deserves.
      Australia got a man in a tin can, defiant to the end.
    description: "I was at Glenrowan when Ned Kelly walked out in his ploughshare armor for his last stand."
    status: "published"
    sha256: "8a19bd3ae681aa3fe58bd2f5a800d26f34aaf0a4b39b7319d3b310605d31c0f3"
  - number: "3174"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The First Boer War"
    date: "1880 CE"
    region: "South Africa"
    poem: |
      Farmers with rifles against the British Empire —
      I was in the Transvaal when the Boers rose,
      tired of London's rule, taking up their Mausers
      and their long memories.
      They were not soldiers. They were marksmen —
      men who'd shot game on the veldt since childhood,
      now shooting redcoats at a thousand yards.
      The British marched in columns, drums beating,
      straight into the Boers' sights.
      It was the empire's old arrogance meeting a new kind of war:
      the citizen soldier, the farmer with a gun,
      who knew every rock and gully.
      London would learn respect. The hard way.
    description: "I was in the Transvaal when Boer farmers took up rifles against the British Empire."
    status: "published"
    sha256: "e94ec0f75b418d50efd50d1cd850538f159bc34ff08441f556024ecf26c17783"
  - number: "3175"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Majuba Hill"
    date: "1881 CE"
    region: "South Africa"
    poem: |
      They climbed it at night and shot the British off the top at dawn —
      I was on the slopes below Majuba when the Boer marksmen
      did what no one thought farmers could do:
      rout a British force, kill its general, and win a war.
      Ninety-two British dead. One Boer.
      London, stunned, granted the Transvaal self-rule.
      It was the first time in living memory
      that the empire had been beaten into a concession.
      I watched the Boer commandos walk down the hill,
      quiet men, no cheering, just done —
      and I thought: the empire will be back.
      And it was. Eighteen years later, with half a million men.
    description: "I was below Majuba Hill at dawn when Boer marksmen routed the British and won the Transvaal's freedom."
    status: "published"
    sha256: "861f6c3ce7a45d98064aa73b722622d0b710b274bc6e3991650e3d6a01a0b0bb"
  - number: "3176"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Tsar Is Killed"
    date: "1881 CE"
    region: "Russia"
    poem: |
      The Liberator, blown apart by a bomb —
      I was in St. Petersburg on the day they killed Alexander II,
      the Tsar who'd freed the serfs, murdered on the street
      by the People's Will, on the very day he was to sign
      a constitution.
      The irony was perfect and terrible:
      reform's reward was assassination.
      His son took the throne and learned the lesson
      reaction wanted him to learn: no more reform, only repression.
      I stood in the crowd at the funeral procession,
      watching the coffin pass, and thought:
      they killed the best Tsar Russia ever had,
      and Russia would pay for it for thirty-six years.
    description: "I was in St. Petersburg the day terrorists killed Alexander II, the Tsar who freed the serfs."
    status: "published"
    sha256: "4b57c37a87f323edd46e7aaf26a9919aed0c371bb908bc601f0f10e7c84cd3cd"
  - number: "3177"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Mahdi Rises"
    date: "1881 CE"
    region: "Sudan"
    poem: |
      A holy man on an island in the Nile declared himself the Mahdi —
      the guided one, come to purify Islam and drive out the foreigners.
      I heard him preach in Kordofan, and the tribes rose:
      Egypt's rule collapsing, the Sudan in revolt.
      He was not just a rebel. He was a prophecy —
      and prophecies are harder to shoot than armies.
      Gordon would go to Khartoum. Kitchener would come later.
      But that summer, it was just a man with a vision
      and a desert full of believers.
      I watched the dervishes drill with their spears
      and thought: the empire is about to bleed in the sand.
    description: "I heard the Mahdi preach in Kordofan before Sudan rose against Egypt and Britain."
    status: "published"
    sha256: "ce1f9e79960bb17c9ca43abc2055eeac7ef12450c5fe3bec00d90a72a817d2ad"
  - number: "3178"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The O.K. Corral"
    date: "1881 CE"
    region: "America"
    poem: |
      Thirty seconds in Tombstone —
      I was on Allen Street when it started:
      the Earps and Doc Holliday against the Clantons and McLaurys,
      thirty shots in half a minute, three men dead.
      It was over before most of the town knew it had begun.
      Then the legend took over — bigger, bloodier, cleaner
      than the shabby truth of a feud over gambling and pride.
      Wyatt Earp, the lawman. Doc Holliday, dying of tuberculosis,
      fighting like he had nothing to lose. He didn't.
      I picked up an empty cartridge from the dust afterward.
      The West's most famous half-minute, already becoming myth.
    description: "I was on Allen Street in Tombstone for the thirty-second gunfight that became the West's legend."
    status: "published"
    sha256: "7c86257cc0fe8f2b3e6ed3a4662a36a66dcf0679cfd27e812553ef410292663d"
  - number: "3179"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Germ That Kills Millions"
    date: "1882 CE"
    region: "Germany"
    poem: |
      Koch found it — the tuberculosis bacterium, stained blue under the microscope.
      I was in Berlin when he announced it:
      the white plague, the consumption that had killed poets and seamstresses alike,
      was a germ. A single, findable, killable germ.
      Germ theory's great proof.
      He'd grown it, stained it, shown it to the skeptics.
      One in seven Europeans died of TB. Now they knew the enemy's face.
      I looked through his microscope at the tiny blue rods
      and thought: this is what victory looks like —
      not a battle, but a slide of glass with the killer on it.
    description: "I looked through Koch's microscope in Berlin at the tuberculosis bacterium — germ theory's great proof."
    status: "published"
    sha256: "6c66ab319fac5281e885c55f606cc21139a0684d75ad8f8098d5b7efacb4014e"
  - number: "3180"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Chinese Exclusion Act"
    date: "1882 CE"
    region: "America"
    poem: |
      The first law aimed at a whole people —
      I was in San Francisco when it passed:
      no more Chinese laborers, ten years, then extended, then made permanent.
      The men who'd built the railroads, blasted the Sierras,
      were now the enemy — too many, too foreign, too willing to work.
      I watched a laundryman read the news in his shop,
      his face very still, and I thought of Promontory,
      the golden spike, the Chinese workers barely mentioned.
      Now they were mentioned: as a threat.
      America's gate, which had stood open, learned to close —
      and it would keep learning, against one people after another.
    description: "I was in San Francisco when America banned Chinese immigration — the first law aimed at a whole people."
    status: "published"
    sha256: "6ec47c6d98b516c8ba43b535c447b338f44deae0d1f138cb910be7f214b831a1"
  - number: "3181"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Pearl Street Station"
    date: "1882 CE"
    region: "America"
    poem: |
      Edison lit up lower Manhattan —
      I was there when Pearl Street Station went live,
      the first central power station in the world,
      current flowing to four hundred lamps in the financial district.
      J.P. Morgan's house glowed. The New York Times glowed.
      The age of the grid had begun: power made in one place,
      used everywhere, billed by the meter.
      The gas companies watched their future dim.
      I stood on a dark street corner looking at the lit windows
      and thought: this is the moment the night ended.
      Not with a battle or a treaty — with a power station.
    description: "I was in lower Manhattan when Pearl Street Station lit four hundred lamps and the grid age began."
    status: "published"
    sha256: "84819f09819fe4a44160beb33a2961304e65687482b17ec12badc39a07da37b0"
  - number: "3182"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Tel el-Kebir"
    date: "1882 CE"
    region: "Egypt"
    poem: |
      A dawn attack, and Egypt fell in a day —
      I was with Wolseley's force when they stormed Arabi's lines at Tel el-Kebir,
      marching through the night, hitting at first light.
      The Egyptian army broke. Cairo opened its gates.
      Britain would occupy Egypt for decades —
      "temporarily," they said, for seventy years.
      The Suez Canal needed guarding, and guarding needed an army,
      and the army needed a country.
      I walked through Cairo the week after,
      the British flags going up over the ministries,
      and thought: this is how empires grow —
      one "temporary" occupation at a time.
    description: "I was with Wolseley's dawn attack at Tel el-Kebir when Britain began its seventy-year \"temporary\" occupation of Egypt."
    status: "published"
    sha256: "4af637a26daf4383c49b2a3e24ea5c377284780dd813245bf39419ed0ad531dc"
  - number: "3183"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Brooklyn Bridge"
    date: "1883 CE"
    region: "America"
    poem: |
      The longest suspension bridge on earth —
      I walked it on opening day with the crowds,
      a mile of steel and stone over the East River,
      the two great towers rising like cathedrals.
      Roebling died before it was finished; his son Washington
      was crippled by the bends, directing it from his bedroom
      while his wife Emily ran the site.
      Fourteen years. Twenty-seven dead.
      I stood mid-span, the wind in the cables,
      Manhattan on one side, Brooklyn on the other,
      and thought: this is what human beings do —
      throw a thread of steel across the impossible, and walk on it.
    description: "I walked the Brooklyn Bridge on opening day — a mile of steel thrown across the impossible."
    status: "published"
    sha256: "20552c232e9a21d56656326f283a06bb8b72cd28b78a5bc0f4b3d9ddf640d905"
  - number: "3184"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Krakatoa"
    date: "1883 CE"
    region: "Indonesia"
    poem: |
      Heard 3,000 miles away —
      I was on a ship in the Sunda Strait when the sky went black at noon.
      Krakatoa exploded with the force of 200 million tons of TNT,
      the loudest sound in recorded history,
      a pressure wave that circled the earth seven times.
      Thirty-six thousand dead in the tsunamis.
      The sunsets went blood-red for years — ash around the whole planet.
      I stood on deck in the falling pumice, the air full of thunder,
      and thought: all our engines, all our guns,
      are toys next to this. The earth does what it wants.
      We just live on it, briefly, between eruptions.
    description: "I was on a ship in the Sunda Strait when Krakatoa exploded — the loudest sound in recorded history."
    status: "published"
    sha256: "4dacfba0e57081ecb37a264a61b3fdc2bad845dcb3138747d6abfb31fd4a02b8"
  - number: "3185"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Orient Express"
    date: "1883 CE"
    region: "Europe"
    poem: |
      Paris to Constantinople in luxury —
      I rode the first Orient Express east,
      mahogany and brass, silk sheets, dinner in the dining car
      while the Balkans rolled past the windows.
      Kings and spies would ride this train.
      It was more than a railway: it was Europe's imagination
      made into a timetable — the West gliding east in comfort,
      mystery at the end of the line.
      I dined as we crossed into the Ottoman Empire,
      the lamps lit, the wine poured,
      and thought: this train carries the whole century with it —
      its elegance, its empires, and its illusions.
    description: "I rode the first Orient Express from Paris toward Constantinople — Europe's imagination made into a timetable."
    status: "published"
    sha256: "2654d2ba73feb7202305dfee844ca7d4656a9f6b7759e7e72979d6d7834b63b2"
  - number: "3186"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Siege of Khartoum"
    date: "1884 CE"
    region: "Sudan"
    poem: |
      Gordon held Khartoum against the Mahdi's army —
      I slipped into the city before the ring closed:
      ten months of siege, the Nile the only road,
      and the relief column always coming, never arriving.
      Gordon — the hero of China, strange, devout, stubborn —
      refused to leave, and organized the defense himself.
      The people starved. The shells fell. The Mahdi waited.
      London dithered. Gladstone hesitated.
      I watched Gordon on the palace roof with his telescope,
      scanning the desert for dust that never came,
      and I thought: empires are very good at sending heroes
      to places they have no intention of saving.
    description: "I was inside besieged Khartoum with Gordon, watching the desert for a relief column that never came in time."
    status: "published"
    sha256: "3a53aea6b33b132aec6c21d252c5965299f5a68f139242035d7dc98f582b6a79"
  - number: "3187"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Berlin Conference"
    date: "1884 CE"
    region: "Europe"
    poem: |
      Fourteen powers, one table, a whole continent divided —
      I was in Berlin while they carved up Africa:
      no African invited, no African consulted.
      Rivers became borders. Peoples became possessions.
      The Congo for Leopold (personally — the worst deal in the room).
      The rules of the carve-up, written down like a club's bylaws:
      occupy it, notify us, it's yours.
      I watched the maps change color — British red, French blue —
      and thought of the millions of people living on those colors
      who would not be asked, ever.
      The scramble was now official. The century of trouble had its charter.
    description: "I watched fourteen powers carve up Africa in Berlin — no African invited, no African consulted."
    status: "published"
    sha256: "ca7342d48572f7650189cb5d7224d2c507a6bc538dade9913b2d82efac0ee5fd"
  - number: "3188"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Huckleberry Finn"
    date: "1884 CE"
    region: "America"
    poem: |
      Huck and Jim on the river —
      I read it the year it came out, and the libraries banned it
      for being vulgar. Vulgar! It was the truest book America had.
      A boy and a runaway slave on a raft,
      and Huck deciding he'd rather go to hell
      than turn Jim in — the moral center of the whole century
      in one boy's conscience.
      Twain wrote it in the American voice, misspellings and all,
      and some call it the great American novel.
      I closed it on a riverboat on the Mississippi itself,
      the real river rolling past, and thought:
      this book will outlive every statue they ever carve of him.
    description: "I read Huckleberry Finn on a Mississippi riverboat the year the libraries banned it for being vulgar."
    status: "published"
    sha256: "94985ea0a77313907fc7aee39a843d8126c1a0d44b4bb7b8639ce00fdfab6a5e"
  - number: "3189"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Khartoum Falls"
    date: "1885 CE"
    region: "Sudan"
    poem: |
      They came at dawn, two days before the relief arrived —
      I was on the river when the Mahdi's men stormed Khartoum,
      and Gordon died on the palace steps, spear in hand, alone.
      The city fell. The garrison was slaughtered.
      Britain mourned its hero and blamed Gladstone,
      and the relief column turned back, two days late, forever late.
      The Mahdi's empire would rule Sudan for thirteen years.
      I stood on the deck watching the smoke rise over Khartoum
      and thought of Gordon on the roof with his telescope.
      He'd been right to watch the desert.
      No one was coming. No one ever was.
    description: "I was on the Nile when Khartoum fell two days before relief arrived and Gordon died on the palace steps."
    status: "published"
    sha256: "15d185029ec40ff3dfbefe5f82574ebad62b682d32c2349ee1e2a98a68d90618"
  - number: "3190"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Pasteur's Vaccine"
    date: "1885 CE"
    region: "France"
    poem: |
      A boy bitten by a rabid dog —
      I was in Paris when young Joseph Meister's mother
      brought him to Pasteur, desperate, the bites already festering.
      Rabies meant death. Certain, horrible death.
      Pasteur had never tried his vaccine on a human.
      He tried it on the boy. Thirteen injections.
      The boy lived.
      I watched the news spread through the laboratories of Europe:
      vaccines had entered the modern age.
      Rabies, then anthrax, then diphtheria —
      the invisible killers, one by one, meeting their match.
      Pasteur wept when he heard the boy was safe.
      So did I.
    description: "I was in Paris when Pasteur's rabies vaccine saved young Joseph Meister and vaccines entered the modern age."
    status: "published"
    sha256: "4913ffc162c27765908c5c03ee36c9588774ee1089ba0d8b86dfa09058c7af0a"
  - number: "3191"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The First Automobile"
    date: "1885 CE"
    region: "Germany"
    poem: |
      Three wheels and a puttering engine —
      I watched Karl Benz drive his Motorwagen through Mannheim,
      a three-wheeled carriage with no horse,
      moving under its own power at a walking pace.
      People stared. Dogs barked. A policeman stopped him
      for going too fast. Too fast! At ten miles an hour.
      Bertha Benz would later drive it a hundred miles
      to prove it worked — the first road trip in history.
      I stood on the curb as it puttered past,
      smelling the exhaust, hearing the future sputter to life.
      The horse had ruled transport for five thousand years.
      Its reign ended that afternoon, and nobody noticed.
    description: "I watched Benz's three-wheeled Motorwagen putter through Mannheim — the horse's five-thousand-year reign ending unnoticed."
    status: "published"
    sha256: "9f024b188267d6e54be40af2c50fff39e89312a55d6a4ea4027019bcfa55f8ac"
  - number: "3192"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Indian National Congress"
    date: "1885 CE"
    region: "India"
    poem: |
      Seventy-two men in Bombay, mostly lawyers —
      I was there when the Indian National Congress was founded,
      English-educated Indians asking, politely, for a share in governing their own country.
      The British smiled indulgently. A debating club, they thought.
      They were wrong. That debating club would become
      the party of Gandhi and Nehru,
      the movement that would free a subcontinent.
      It started with resolutions and petitions, all very proper.
      Empires are never overthrown politely —
      but sometimes they're overthrown by men
      who started out being polite.
      I kept the program. It's worth more than gold now.
    description: "I was in Bombay when seventy-two lawyers founded the Congress that would one day free India."
    status: "published"
    sha256: "7c1a7e0c0200cca93af4166227285c0db708b3d2dd871813f5e4520398ab568f"
  - number: "3193"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Haymarket"
    date: "1886 CE"
    region: "America"
    poem: |
      A bomb in the rain, in a Chicago square —
      I was near Haymarket when the rally for the eight-hour day
      turned into the blast that changed American labor.
      Someone threw a bomb at the police. Seven officers died.
      The trials that followed hanged four anarchists
      on evidence thin as smoke — Spies, Parsons, Fischer, Engel.
      Were they guilty? The world argued then, argues still.
      But the eight-hour day they marched for —
      that survived. May Day, around the world,
      is their memorial.
      I stood in the square the next morning,
      the blood washed away, the fear still in the air,
      and thought: this is what the fight for a shorter day costs.
    description: "I was near Chicago's Haymarket Square when the bomb exploded and the fight for the eight-hour day turned bloody."
    status: "published"
    sha256: "4e233a3cee8cada1f6bdbf048a4dfc7167b30ad67957626947bec08880049439"
  - number: "3194"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Coca-Cola"
    date: "1886 CE"
    region: "America"
    poem: |
      Five cents a glass at Jacob's Pharmacy —
      I was in Atlanta when Dr. Pemberton's new tonic went on sale:
      caramel-colored, fizzy, served from a soda fountain.
      Nine glasses a day, at first. Just nine.
      The pharmacist who bought the formula,
      Asa Candler, saw what Pemberton didn't:
      this wasn't medicine. This was America in a glass.
      I drank one of those first glasses — sweet, strange, cold —
      and thought nothing of it. Nobody did.
      A century later they'd sell a billion servings a day.
      The most valuable five cents in history.
    description: "I drank one of the first glasses of Coca-Cola at an Atlanta soda fountain — five cents, nine sales a day."
    status: "published"
    sha256: "cb5c79349915307e17d4d4bd347dee5984b7a3c5283a6962429dd9d6960beda0"
  - number: "3195"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Geronimo Surrenders"
    date: "1886 CE"
    region: "America"
    poem: |
      The last war chief laid down his rifle —
      I was at Skeleton Canyon when Geronimo surrendered to General Miles,
      ending thirty years of Apache war.
      He'd held off the whole U.S. Army with a handful of warriors,
      vanishing into mountains the soldiers couldn't follow.
      Now it was over. The Indian Wars effectively ended that day.
      They sent him to Florida, then to Fort Sill —
      a prisoner of war for the rest of his life,
      displayed at fairs like a relic.
      I watched the old warrior hand over his rifle,
      his face unreadable, and thought:
      this is how a continent's first peoples lose everything —
      one surrender at a time, until there's nothing left to surrender.
    description: "I was at Skeleton Canyon when Geronimo surrendered and the Indian Wars effectively ended."
    status: "published"
    sha256: "32594329d2ee03224815e03e9aebd8e1b22e40b7d8f9e047b42382a525b56bb7"
  - number: "3196"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Statue of Liberty"
    date: "1886 CE"
    region: "America"
    poem: |
      A gift from France, dedicated in the harbor —
      I was on a ferry when they unveiled her:
      151 feet of copper, torch raised, tablet in hand,
      "Mother of Exiles," as Emma Lazarus would write.
      The harbor was full of ships, the guns fired salutes,
      and Bartholdi's great lady looked out to sea.
      She'd been built in Paris, shipped in pieces,
      raised on an American pedestal.
      I watched the immigrants on the decks around me
      stare up at her, and I thought:
      they don't know her poems yet, or her promises.
      But they'll learn. Everyone who sails into this harbor learns.
    description: "I was in New York Harbor when the Statue of Liberty was unveiled before a fleet of ships."
    status: "published"
    sha256: "ff7dd5ef0a945b843eadd2668efe5065be4e010cb69e5722073b0bb56a3c7f03"
  - number: "3197"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Golden Jubilee"
    date: "1887 CE"
    region: "England"
    poem: |
      Fifty years on the throne —
      I was in London for Victoria's Golden Jubilee,
      the empire at its glittering peak:
      kings and princes from every continent,
      troops in uniforms from a hundred regiments,
      a procession that stretched for miles.
      The old Queen, in black, in her carriage,
      the grandmother of Europe, the empress of a quarter of the earth.
      The crowds cheered themselves hoarse.
      And underneath the glitter, the rot was already there —
      Ireland restless, the Boers unbowed, Germany arming.
      But that June day, none of it showed.
      Empires look eternal at their jubilees.
      That's what jubilees are for.
    description: "I was in London for Victoria's Golden Jubilee — the empire glittering at its peak, the rot already underneath."
    status: "published"
    sha256: "7afdfba2627adc75ffd4079d94406a3c9e22520e7cc2dc4a611807b3d08be03e"
  - number: "3198"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Michelson–Morley Experiment"
    date: "1887 CE"
    region: "America"
    poem: |
      The most famous failed experiment in history —
      I was in Cleveland when Michelson and Morley
      tried to measure the earth's motion through the ether,
      the invisible sea that light was supposed to swim in.
      They found nothing. No ether. No motion through it.
      The experiment failed — and the failure was the discovery.
      If there's no ether, then light needs no medium,
      and the whole of physics has to be rebuilt.
      Einstein was eight years old, but the road was clearing for him.
      I watched them check their instruments again and again,
      baffled, meticulous, honest —
      and thought: this is science at its best.
      Proving yourself wrong, beautifully.
    description: "I was in Cleveland when Michelson and Morley found no ether — the beautiful failure that cleared the road to relativity."
    status: "published"
    sha256: "7d4a06cf72c8848044aaa79b953cfa904105d3a3d2f7f82636d2ff4f6e93e289"
  - number: "3199"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "France Takes Indochina"
    date: "1887 CE"
    region: "Vietnam"
    poem: |
      They forged a colony from Vietnam and Cambodia —
      I was in Saigon when the French proclaimed Indochina,
      gunboats in the harbor, administrators in white suits,
      the whole apparatus of empire unpacked and assembled.
      Rubber plantations. Rice taxes. The civilizing mission.
      The Vietnamese didn't want civilizing.
      They'd resist for sixty years — against the French,
      then the Americans — in one of the longest struggles
      of the colonial age.
      I watched the tricolor go up over the governor's palace
      and thought: they're planting a flag in a hornet's nest
      and calling it a garden.
    description: "I was in Saigon when France proclaimed Indochina — a flag planted in a hornet's nest called a garden."
    status: "published"
    sha256: "1ef960989b6c3393c949537eeccdb3bb72500e6faee8bd76f2cee2297c5e72c6"
  - number: "3200"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Sherlock Holmes"
    date: "1887 CE"
    region: "England"
    poem: |
      A Study in Scarlet — I bought it the year it came out,
      a slim novel in Beeton's Christmas Annual,
      and met the world's most famous detective:
      the violin, the cocaine, the deerstalker not yet,
      but the mind — the cold, brilliant, impossible mind.
      Conan Doyle, a young doctor, had created him
      from a professor he'd known in Edinburgh.
      Holmes would outgrow them both —
      outgrow the stories, the author, the century.
      I read it on a train and tried the deductions on my fellow passengers.
      It didn't work. But for a few hours,
      I believed that thinking hard enough could solve anything.
    description: "I bought Beeton's Christmas Annual the year it introduced Sherlock Holmes to the world."
    status: "published"
    sha256: "a9d8eeeae14f304ff87eb4ed581ac532a33480041520b20a6519b09b5198e6ef"
  - number: "3201"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Slavery Ends in Brazil"
    date: "1888 CE"
    region: "Brazil"
    poem: |
      The last Western nation —
      I was in Rio when Princess Isabel signed the Golden Law,
      and 700,000 enslaved people walked free.
      No war. No amendment. A signature.
      The church bells rang, the streets filled,
      and Brazil — the largest slave society in the Americas —
      let go of its chains at last.
      It had outlasted the American South by twenty-three years.
      I watched an old man stand very still in the celebrating crowd,
      tears on his face, free for the first time at seventy,
      and I thought: the world is finally, completely,
      out of legal slaves. It took until 1888.
      Remember that, when anyone tells you progress is fast.
    description: "I was in Rio when the Golden Law freed 700,000 — the last slaves in the Western world walked free."
    status: "published"
    sha256: "91c6151f04447263a1df2575a49c39c692a000e3188e5bf682a34e92c620ec8b"
  - number: "3202"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Jack the Ripper"
    date: "1888 CE"
    region: "England"
    poem: |
      Whitechapel, fog, autumn —
      I was in London's East End that terrible fall,
      when the Ripper stalked the streets
      and the newspapers went mad with it.
      Five women, murdered horribly, and a killer
      who was never caught — never even named, for certain.
      The police were helpless. The city was terrified.
      I walked those gaslit streets at night, my collar up,
      and felt the fear that had settled over the whole district
      like the fog itself.
      A century and a half later they'd still be writing books about him.
      Evil, unsolved, becomes immortal.
      That's the worst part. He won, in the only way that mattered to him:
      we never forgot.
    description: "I walked Whitechapel's gaslit streets during the Ripper's autumn of terror — and he was never caught."
    status: "published"
    sha256: "193cbf86162c09e6187a11d77ffbe8448b6df15d4b8391ae30aea56ac587e002"
  - number: "3203"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Kodak"
    date: "1888 CE"
    region: "America"
    poem: |
      "You press the button, we do the rest" —
      I bought one of the first Kodaks in Rochester:
      a box with a roll of film for a hundred pictures,
      send the whole camera back, get it back loaded with prints.
      Photography for everyone. No more darkrooms, no more chemistry.
      The snapshot was born — birthdays, picnics, holidays,
      the whole visual memory of the modern world
      starting with a little black box.
      Eastman had democratized the image.
      I took my first photograph that week — badly framed, slightly blurred —
      and thought: everyone will do this now.
      Everyone will carry their memories in their pockets.
    description: "I bought one of the first Kodaks in Rochester and took my first badly framed snapshot."
    status: "published"
    sha256: "c0a54ae14b8d5ccd6fb7e09098164d1817322c8426ca85321774e450aedc42f3"
  - number: "3204"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Eiffel Tower"
    date: "1889 CE"
    region: "France"
    poem: |
      A thousand feet of iron lace —
      I was in Paris when the tower opened for the World's Fair,
      and the city gasped. The artists had protested it —
      a "hateful column of bolted sheet metal," they called it.
      Then they saw it against the sky, and the protests died.
      Eiffel had built the tallest thing on earth
      from the same iron as railway bridges,
      and made it beautiful.
      I climbed it on opening week, all 1,710 steps,
      Paris spreading out below like a map,
      and thought: this is the century's signature —
      engineering with the courage to be art.
    description: "I climbed the Eiffel Tower's 1,710 steps on opening week and saw Paris spread out like a map."
    status: "published"
    sha256: "8749e0dfd7fff148d38dc636af0653b271905f130ea497cc639adfdb49caa5f8"
  - number: "3205"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Oklahoma Land Run"
    date: "1889 CE"
    region: "America"
    poem: |
      At noon, the guns fired —
      I was on the line when 50,000 settlers raced into Oklahoma,
      on horses, in wagons, on foot,
      claiming 160 acres apiece in the greatest land grab in American history.
      By sunset there were cities: Guthrie went from zero
      to ten thousand in a day.
      (The Sooners had snuck in early — cheaters even then.)
      The land had been promised to the Indians, of course.
      Promises, again.
      I watched a family drive their stake into the prairie
      at dusk, exhausted, triumphant, home —
      and I thought of whose home it had been that morning.
    description: "I was on the starting line when 50,000 settlers raced into Oklahoma at noon and built cities by sunset."
    status: "published"
    sha256: "498547e8249a11401c6da2239b1495c78d3b968d4c4013d38b66d3a1036fb342"
  - number: "3206"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Johnstown Flood"
    date: "1889 CE"
    region: "America"
    poem: |
      The dam broke at 3:10 in the afternoon —
      I was in the valley below when the South Fork Dam gave way,
      twenty million tons of water coming down the mountain
      at forty miles an hour, a wall sixty feet high.
      Johnstown never had a chance.
      2,200 dead in minutes. Bodies found for months.
      The dam had been owned by rich Pittsburgh sportsmen —
      the South Fork Fishing and Hunting Club —
      who'd neglected it for years.
      I walked the mud flats afterward, past the wreckage of whole streets,
      and thought: this is what negligence looks like
      when it has money and a dam.
    description: "I was in the valley when the South Fork Dam broke and twenty million tons of water took Johnstown."
    status: "published"
    sha256: "435fe423752307b785d15146de6636d687aadb18991bb83824a7b304bef13df8"
  - number: "3207"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Moulin Rouge"
    date: "1889 CE"
    region: "France"
    poem: |
      The red windmill on the boulevard —
      I was there on opening night in Montmartre:
      the can-can, the champagne, Toulouse-Lautrec in the corner sketching,
      Paris at its most Parisian.
      It was a dance hall, a music hall, a beautiful racket —
      bourgeoisie and bohemians, painters and prostitutes,
      all whirling together under the red mill's blades.
      The Belle Époque had its temple.
      I watched La Goulue kick higher than seemed possible,
      the crowd roaring, the gaslight gleaming,
      and thought: this is what a city looks like
      when it decides to enjoy itself completely.
    description: "I was at the Moulin Rouge on opening night — the can-can, the champagne, Lautrec sketching in the corner."
    status: "published"
    sha256: "46f0170fee9a59970b205b4f4b4628df623254ee181e4f8f9976b8586ba1fe08"
  - number: "3208"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Sherman Antitrust Act"
    date: "1890 CE"
    region: "America"
    poem: |
      The first shot fired at the trusts —
      I was in Washington when it passed:
      every contract "in restraint of trade" illegal,
      monopolies outlawed, the government armed against the giants.
      Standard Oil. The railroads. Carnegie.
      For years it was barely used — a paper tiger.
      But the idea was planted: bigness itself could be a crime.
      It would take twenty years and a Roosevelt to give it teeth,
      but the teeth came.
      I watched the senators vote, most of them friends of the trusts,
      passing a law they'd spend decades trying to ignore —
      and I thought: even a paper tiger casts a shadow.
    description: "I was in Washington when the Sherman Act outlawed monopolies — a paper tiger that would grow teeth."
    status: "published"
    sha256: "f3abfae09bd3d20e4919c0c77ac10d5da6f60d6c84adafd218028e5763c4aa1e"
  - number: "3209"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Van Gogh Dies"
    date: "1890 CE"
    region: "France"
    poem: |
      He walked into a wheat field at Auvers and shot himself —
      I was in Paris when the news came, and nobody much noticed.
      Vincent van Gogh, thirty-seven, broke, unknown,
      one painting sold in his lifetime (to his brother, essentially).
      The wheat fields, the sunflowers, the starry night —
      all of it unsold, unseen, stacked in Theo's apartment.
      Fame came later. So much later.
      Now a single canvas sells for what kingdoms cost.
      I stood in that wheat field afterward, the crows rising,
      and thought: the world is very good at recognizing genius,
      exactly one funeral too late.
    description: "I stood in the Auvers wheat field after Van Gogh died broke and unknown — genius recognized one funeral too late."
    status: "published"
    sha256: "9a8b8d7bcdfe7ab37f7cb48c05fe54581e06a9139dda4013cca78d3b963d9492"
  - number: "3210"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Wounded Knee"
    date: "1890 CE"
    region: "America"
    poem: |
      Snow, and blood on the snow —
      I arrived at Wounded Knee the day after the 7th Cavalry
      opened fire on Big Foot's Lakota:
      300 dead, mostly women and children,
      cut down by Hotchkiss guns in the frozen creek bed.
      It started with a scuffle over a rifle.
      It ended the Indian Wars.
      I walked the field where the bodies lay frozen in the positions
      they'd died in, photographers already at work,
      and I thought of Little Bighorn, fourteen years before.
      The revenge was complete. The continent was taken.
      Bury my heart, indeed.
    description: "I walked the frozen field at Wounded Knee the day after the massacre ended the Indian Wars."
    status: "published"
    sha256: "83df70dd137db3c1945cc0da2cb3c1f55024d0aa667be7eedf8f0d26bac9f951"
  - number: "3211"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Trans-Siberian"
    date: "1891 CE"
    region: "Russia"
    poem: |
      5,700 miles of railway across Siberia —
      I was at Vladivostok when the Tsarevich turned the first sod,
      and Russia began the longest railway on earth.
      Through taiga and permafrost, across rivers wider than seas,
      built by exiles and soldiers and peasants,
      thousands dying in the cold and the mud.
      It would take twenty-five years.
      When it was done, Moscow to the Pacific in days —
      an empire stitched together with steel,
      Asia bound to Europe by a single track.
      I stood at the edge of the wilderness where the rails would go
      and thought: this is what empires dream —
      a road so long it changes the size of the world.
    description: "I was at Vladivostok when Russia began the 5,700-mile Trans-Siberian across the wilderness."
    status: "published"
    sha256: "e29b2331199751180a78f670f26a992333d473a9fa1505cd66ec44995737fa26"
  - number: "3212"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Basketball"
    date: "1891 CE"
    region: "America"
    poem: |
      Peach baskets nailed to the gym wall —
      I was in Springfield, Massachusetts, when James Naismith,
      a gym teacher with a restless winter class,
      invented a game: thirteen rules, a soccer ball,
      two baskets, no running with the ball.
      The first game ended 1–0. Someone had to climb a ladder
      to get the ball out.
      It was supposed to keep boys busy in winter.
      It became a world religion.
      I watched those first players — mustached young men
      in wool uniforms — and thought:
      they have no idea. None of them has any idea
      what they've started.
    description: "I watched Naismith's first basketball game in Springfield — peach baskets, a soccer ball, thirteen rules."
    status: "published"
    sha256: "f3a4b8572ffab525f45d0069b035e73ce5fcb2dc4a5261a326f1343cfa9f1639"
  - number: "3213"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Ellis Island Opens"
    date: "1892 CE"
    region: "America"
    poem: |
      The gateway for twelve million —
      I was there on opening day, January 1st,
      when Annie Moore from Ireland, fifteen years old,
      became the first immigrant processed.
      They'd come through the great hall by the thousands:
      the inspections, the chalk marks, the tears,
      the names shortened at the desks.
      For most, it took hours. For some, it took a lifetime
      to get past that island.
      I watched a family from Sicily stare at the Manhattan skyline
      through the windows, holding everything they owned,
      and I thought: this is the door America walks through.
      Twelve million stories, starting here.
    description: "I was at Ellis Island on opening day when fifteen-year-old Annie Moore became the first immigrant processed."
    status: "published"
    sha256: "015bb4ac23e2607fee63827190d517d777b20b588befb83f2419c165f00bcd1b"
  - number: "3214"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Homestead Strike"
    date: "1892 CE"
    region: "America"
    poem: |
      Steelworkers against Pinkertons on the Monongahela —
      I was at Homestead when it exploded:
      Carnegie's mill, Frick's wage cuts, the union locked out,
      three hundred Pinkerton detectives floating down the river on barges.
      The workers met them at the shore with rifles.
      Twelve dead. The barges surrendered.
      Then the state militia came — eight thousand troops —
      and broke the strike, and broke the union.
      Labor's bloodiest fight, and labor lost.
      I stood on the riverbank afterward, the barges burned,
      and thought: Carnegie will build libraries with this money.
      The men who bled for it will get the libraries. Not the wages.
    description: "I was on the Monongahela when steelworkers battled Pinkertons at Homestead — labor's bloodiest fight."
    status: "published"
    sha256: "337d433b101d8d3c1c4ede300205a4d22849124fff6308704f2cf93cfd9f8063"
  - number: "3215"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Nutcracker"
    date: "1892 CE"
    region: "Russia"
    poem: |
      A Christmas ballet that flopped —
      I was in St. Petersburg for the premiere:
      Tchaikovsky's Nutcracker, all sugarplums and snowflakes,
      and the critics shrugged. Too childish, they said.
      Tchaikovsky died the next year, never knowing.
      But the ballet wouldn't stay down.
      It rose again — in America, after the war —
      and became the Christmas ritual of the Western world,
      danced by every company, loved by every child.
      I sat in that cold premiere audience,
      watching the snow scene, and I missed it too.
      Some masterpieces need fifty years and an ocean crossing.
    description: "I was at the Nutcracker's shrugging St. Petersburg premiere — the flop that became Christmas itself."
    status: "published"
    sha256: "a32ab8fd31d4136bb00945149ae64f65625ff8fc8df03658cd09ac18ec60adb3"
  - number: "3216"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Queen Is Overthrown"
    date: "1893 CE"
    region: "Hawaii"
    poem: |
      American planters toppled a queen —
      I was in Honolulu when Liliuokalani was forced to abdicate:
      marines from the USS Boston ashore "to protect American lives,"
      a Committee of Safety that was neither,
      a kingdom stolen for sugar.
      The queen yielded to avoid bloodshed —
      "I yield to the superior force of the United States,"
      she wrote, and the republic of planters took over.
      Cleveland refused to annex it. McKinley would do it later.
      I watched the Hawaiian flag come down over the palace
      and thought: this is what empire looks like up close —
      not a battle, but a business meeting with guns outside.
    description: "I was in Honolulu when American planters overthrew Queen Liliuokalani — a kingdom stolen for sugar."
    status: "published"
    sha256: "970c6c6ca056f638aef2bd2a82bd6f0009c29e556f0b23a790ad48ffb12f58bd"
  - number: "3217"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Chicago World's Fair"
    date: "1893 CE"
    region: "America"
    poem: |
      The White City —
      I walked the fairgrounds that summer with 27 million visitors:
      electric lights everywhere, the first Ferris wheel turning against the sky,
      buildings white as marble dreams on the shore of Lake Michigan.
      Chicago, risen from the fire, showing the world what it had become.
      Adams called it the first expression of American thought as a unity.
      The rest of us just stared.
      It gave America the Ferris wheel, Cracker Jack, the zipper —
      and a vision of the future, all lit up at night.
      I rode the wheel to the top at sunset,
      the whole White City glowing below,
      and thought: this is what the century wanted to be.
    description: "I rode the first Ferris wheel at Chicago's White City fair — 27 million visitors glimpsing the future lit up at night."
    status: "published"
    sha256: "24746d7a2c026bbde82b242e1540e6bd6528ab1e175abf32114b3ca468e611e2"
  - number: "3218"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Women Win the Vote"
    date: "1893 CE"
    region: "New Zealand"
    poem: |
      The first nation on earth —
      I was in New Zealand when the petitions — 32,000 signatures,
      presented by Kate Sheppard's suffragists —
      finally moved Parliament, and the governor signed.
      Women voted in the national election that year.
      First in the world. Not Wyoming the territory now —
      a whole nation.
      The arguments against it had been endless: the family would collapse,
      politics would corrupt them, the empire would fall.
      None of it happened. They just voted.
      I watched women queue at the polls in Christchurch,
      calm and orderly, and thought:
      the sky didn't fall. It never does.
      It just gets a little bigger.
    description: "I watched women queue to vote in New Zealand — the first nation on earth where women voted nationally."
    status: "published"
    sha256: "dfdbc1e94961c2b2813ebbda687d23f0e5c5ce2889293ec87560762ec921185e"
  - number: "3219"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Pullman Strike"
    date: "1894 CE"
    region: "America"
    poem: |
      The railroads stopped, coast to coast —
      I was in Chicago when Debs's railway union walked out:
      Pullman had cut wages but not rents in his company town,
      and the workers finally broke.
      The strike spread nationwide. Federal troops came in.
      Thirty dead. Debs in prison — where he'd read Marx
      and come out a socialist.
      But something else was born in the wreckage:
      to calm the fury, Congress made Labor Day a national holiday.
      I watched the soldiers clear the tracks at Kensington,
      bayonets fixed, and thought:
      they broke the strike, and the workers got a holiday.
      That's the American bargain, in one sentence.
    description: "I was in Chicago when the Pullman Strike stopped the nation's railroads and gave America Labor Day."
    status: "published"
    sha256: "8750a40953f1692eaae0f10a04b76d70027e49ced1f8a37ffccf48cb46414722"
  - number: "3220"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Sino-Japanese War"
    date: "1894 CE"
    region: "Asia"
    poem: |
      Asia's power shifted in eight months —
      I was with the correspondents when Japan's modern army and navy,
      built in twenty-five years of Meiji reform,
      dismantled Qing China's forces on land and sea.
      Yalu River. Port Arthur. Weihaiwei.
      The student had beaten the master —
      or rather, the modernizer had beaten the empire
      that refused to modernize.
      The world took notice: Japan was a power now,
      and China was the sick man of Asia.
      I watched Japanese troops march into Port Arthur
      in their Western uniforms, and thought:
      the next fifty years of Asia were decided here,
      in these eight months.
    description: "I followed the Sino-Japanese War and watched Meiji Japan dismantle Qing China in eight months."
    status: "published"
    sha256: "130a6307f5062ee9b75d099114f7dedc2b8cacd7efd408957502e9160bf77093"
  - number: "3221"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Dreyfus Affair"
    date: "1894 CE"
    region: "France"
    poem: |
      A Jewish officer, forged evidence, a torn republic —
      I was in Paris when they convicted Alfred Dreyfus of treason:
      degraded in the courtyard, his sword broken,
      "Judas" in the crowd's roar, shipped to Devil's Island.
      The evidence was forged. Everyone in power knew, eventually.
      France split in two: Dreyfusards and anti-Dreyfusards,
      Zola's "J'Accuse" shaking the nation like an earthquake.
      It took twelve years to clear him.
      I watched the degradation ceremony in the rain
      and thought: this is what happens when an army
      decides its honor matters more than the truth.
      It always ends the same way: with the truth winning, late.
    description: "I watched Dreyfus degraded in a Paris courtyard — the forged treason case that split France in two."
    status: "published"
    sha256: "4040b94a0b1fd9c40a7f59e161b31c920f83fcaed8891e39d8e76c691da30cf6"
  - number: "3222"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Shimonoseki"
    date: "1895 CE"
    region: "Asia"
    poem: |
      China ceded Taiwan, paid indemnities, recognized Korea's independence —
      I was in Shimonoseki when Li Hongzhang signed:
      the treaty that announced Japan as a great power.
      An assassin's bullet had grazed Li's cheek during the talks;
      Japan, embarrassed, reduced the indemnity.
      Such are the manners of empire.
      China paid in silver and territory for the lesson
      of the war: modernize or be carved.
      It would try — too late, too slowly.
      I watched the Chinese delegation leave the hall,
      old men in a new world, and thought:
      this treaty signed the next half-century of Asia —
      Japan rising, China humiliated, everyone watching.
    description: "I was at Shimonoseki when China ceded Taiwan and Japan arrived as a great power."
    status: "published"
    sha256: "89ea10eb906ec03bc5810a481fa539eab69e5eaecd6cd2675c7db3f67d5162df"
  - number: "3223"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Wireless"
    date: "1895 CE"
    region: "Italy"
    poem: |
      A twenty-year-old sent signals across his father's estate —
      I was in Bologna when young Marconi showed me:
      a spark, a wire, a receiver that clicked across the garden,
      no cable between them.
      Wireless. Messages through the air itself.
      He'd take it to England, to the world —
      ships at sea, news across oceans, all without wires.
      The ether the physicists had just abolished
      became the medium of the new age anyway.
      I stood in that garden, listening to the clicks,
      and thought of the Atlantic cable, the copper on the seabed.
      This boy had just made it obsolete.
      The air itself would carry the world's words now.
    description: "I stood in Marconi's father's garden when his wireless signals clicked across it — and made the cable obsolete."
    status: "published"
    sha256: "b05f0214c5efb3101b7f1b30f46f279e892999a3f206d67723a8b781fa503be1"
  - number: "3224"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "X-Rays"
    date: "1895 CE"
    region: "Germany"
    poem: |
      Röntgen photographed his wife's hand —
      I was in Würzburg when he showed me the image:
      bones, and a ring, floating in ghostly flesh.
      He'd found rays that passed through skin
      but not bone — X-rays, he called them, X for unknown.
      Within weeks, surgeons were using them.
      Within months, the whole world knew.
      Anna Röntgen looked at her own skeleton
      and said, "I have seen my death."
      She'd seen the future, really —
      every hospital, every broken bone, every hidden thing
      made visible by invisible light.
      I held the photographic plate up to the lamp
      and saw my own century coming.
    description: "I held Röntgen's photographic plate of his wife's skeletal hand — the X-ray that made the invisible visible."
    status: "published"
    sha256: "689ef4db6d0867d0bc2981349dade8bd5b62a8283f35be822b83fab5b77385ad"
  - number: "3225"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Movies Are Born"
    date: "1895 CE"
    region: "France"
    poem: |
      Thirty-three francs in the till —
      I was in the Grand Café in Paris on December 28th,
      when the Lumière brothers charged admission
      to watch moving pictures:
      workers leaving a factory, a train arriving at a station —
      the audience ducking as the locomotive came at them.
      Fifty seconds of film, and the world changed.
      Cinema was born that night, in a basement,
      for one franc a seat.
      The Lumières thought it was a novelty with no future.
      "The cinema is an invention without a future," Louis said.
      I sat in that dark room, watching the train arrive,
      and I knew better. We all did, by the second reel.
    description: "I was in the Grand Café basement when the Lumières screened the first paying films — a train arriving, workers leaving."
    status: "published"
    sha256: "6c491e1230f20db8c42c3914ef49172b293e6f7024c7622858f2dec9607eb8e5"
  - number: "3226"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Adwa"
    date: "1896 CE"
    region: "Ethiopia"
    poem: |
      Africa's greatest victory over the colonizers —
      I was with Menelik's army at Adwa:
      100,000 Ethiopians — with rifles, with artillery, with a plan —
      destroying the Italian invasion force in a day.
      Seven thousand Italians dead. The rest in flight.
      Europe was stunned. An African army
      had beaten a European one in open battle.
      Ethiopia stayed free — the one African nation
      never colonized, a beacon for every independence movement
      that would follow.
      I walked the battlefield afterward,
      past the captured Italian guns,
      and thought: remember this day.
      The colonized just proved they could win.
    description: "I was with Menelik's army at Adwa when Ethiopia destroyed the Italian invasion — Africa's greatest anti-colonial victory."
    status: "published"
    sha256: "5149ee735d40b17bf977b3d035c275817fd90fe152f6c998af8c1c59a6d6823f"
  - number: "3227"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Modern Olympics"
    date: "1896 CE"
    region: "Greece"
    poem: |
      Athens, the Panathenaic Stadium, white marble —
      I was there for the first modern Games:
      241 athletes, fourteen nations,
      Coubertin's dream of peace through sport made real.
      Spiridon Louis won the marathon — a Greek,
      in Greece, and the stadium went mad with joy.
      It was small, amateur, glorious.
      No one imagined what it would become —
      the billions, the boycotts, the whole world watching.
      I sat in that marble stadium, the sun on the stone,
      and thought: the ancient games are back.
      Humanity had remembered how to play together.
    description: "I sat in Athens' marble stadium for the first modern Olympics — 241 athletes, fourteen nations."
    status: "published"
    sha256: "f4a0c3a41ae51b5d6515bdb627a217d2ba355bcd85621e259f639f7b1a30876a"
  - number: "3228"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Plessy v. Ferguson"
    date: "1896 CE"
    region: "America"
    poem: |
      "Separate but equal" —
      I was in Washington when the Court blessed Jim Crow:
      Homer Plessy, one-eighth Black, arrested for sitting
      in the white car in Louisiana,
      and the justices ruled the Constitution allowed it.
      Justice Harlan dissented alone:
      "Our Constitution is color-blind."
      He was right, and it didn't matter.
      For sixty years, "separate but equal" was the law —
      separate always, equal never.
      I watched Plessy leave the courtroom, a quiet man
      who'd tried to break a system with a train ticket,
      and thought: the 15th Amendment promised the vote.
      This decision promised the cage.
    description: "I was in Washington when the Court blessed \"separate but equal\" — and Jim Crow got its law for sixty years."
    status: "published"
    sha256: "ee22148cef7e0d97ac07f8ccd88b8da49b177255f694d266eb69f61b427ec614"
  - number: "3229"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Klondike Gold"
    date: "1896 CE"
    region: "Canada"
    poem: |
      Gold in a Yukon creek —
      I was in Seattle when the ships came down from the north,
      men staggering off with sacks of it,
      and the stampede began: 100,000 strong,
      chasing the last great gold rush on earth.
      They climbed the Chilkoot Pass with a ton of supplies each,
      the Mounties' rule — no one enters without a year's food —
      the line of climbers like ants up the ice stairs.
      Most found nothing. The merchants found fortunes.
      Freezing, starving, scurvy — the Klondike ate men alive.
      But the ones who made it came back changed,
      with gold dust in their pockets and stories for life.
      I watched them sail north, young and hungry,
      and thought: the frontier's last act.
      After this, there's nowhere left to rush to.
    description: "I watched the stampeders sail north for the Klondike — the last great gold rush on earth."
    status: "published"
    sha256: "0bc2a2747ba6974105f9ef91a936ffce0519f464b93fd98d0937c8438f2f3612"
  - number: "3230"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Birth of Jazz"
    date: "1897 CE"
    region: "America"
    poem: |
      In New Orleans, something new was in the air —
      I was in the back of a dance hall in Storyville,
      listening to brass bands and ragtime piano
      fuse into something nobody had a name for yet.
      Buddy Bolden's cornet, loud enough to be heard across town —
      they say he was the first to play it, the first jazzman.
      African rhythms, European horns, blues feeling,
      all melting in the New Orleans heat.
      It wasn't written down. It couldn't be.
      You had to be there, sweating in the crowd,
      feeling the music invent itself under your feet.
      I danced — badly — and thought:
      this is America's real classical music being born,
      in a dance hall, on a Saturday night.
    description: "I was in a New Orleans dance hall when brass bands and ragtime fused into jazz."
    status: "published"
    sha256: "05af349cc7422133850e746ff29b3f1fb8455f31d751e346b21fd272f2c76987"
  - number: "3231"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Dracula"
    date: "1897 CE"
    region: "England"
    poem: |
      The Count never dies —
      I read Stoker's novel the year it came out,
      all letters and diaries and newspaper clippings,
      a vampire sailing into Whitby in a ship full of dead men.
      It was a sensation. Then it was a legend.
      Then it was everything: plays, films, a hundred years
      of capes and fangs and Transylvanian nights.
      Stoker never visited Transylvania.
      He didn't need to — he built it from books and nightmares,
      and it was more real than the real place.
      I finished it at 2 a.m., candles low,
      and checked the locks on my doors.
      Some books you read. This one reads you.
    description: "I read Dracula at 2 a.m. the year it came out — and checked the locks on my doors."
    status: "published"
    sha256: "5c580b0eb16f86034604067e657bcc7cad24c0eb146aec8e929251d11b3877df"
  - number: "3232"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Diamond Jubilee"
    date: "1897 CE"
    region: "England"
    poem: |
      Sixty years —
      I was in London again, ten years after the Golden Jubilee,
      and this one was bigger: the largest empire in history
      saluting its queen, troops from every continent
      marching past the old lady in her carriage.
      Kipling wrote "Recessional" for the occasion —
      "Lest we forget" — a warning inside the celebration.
      He saw what the crowds didn't: the empire's peak
      was also the view from the edge.
      I watched the colonial troops march — Sikhs, Gurkhas,
      West Indians, Canadians — the whole world in uniform,
      and thought: this is the photograph of the empire
      at its greatest extent. Keep it.
      Nothing this big stays this big.
    description: "I watched the Diamond Jubilee procession — the largest empire in history saluting its queen, at the edge of decline."
    status: "published"
    sha256: "f29f0c723ddef492869c4e5075d081a0623a8b203edefe8110585fce3c39ac03"
  - number: "3233"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Electron"
    date: "1897 CE"
    region: "England"
    poem: |
      The atom has parts —
      I was in Cambridge when J.J. Thomson announced it:
      cathode rays were particles, tiny, negatively charged,
      two thousand times lighter than hydrogen.
      The electron. The first subatomic particle.
      The atom — uncuttable, indivisible, by definition —
      had been cut.
      Everything followed: the nucleus, the quantum,
      the whole strange architecture of matter.
      I looked at his cathode-ray tube, glowing green in the dark lab,
      and thought: the smallest thing anyone had ever found,
      and it broke the biggest idea in science.
      The universe just got deeper.
    description: "I was in Thomson's Cambridge lab when the electron proved the \"uncuttable\" atom had parts."
    status: "published"
    sha256: "9904f969fd4d2fb205d770d1df31703656f43a635e6a4b6a0c13eec6ae9e0fb8"
  - number: "3234"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Maine Explodes"
    date: "1898 CE"
    region: "Cuba"
    poem: |
      Havana harbor, 9:40 p.m. —
      I was on the waterfront when the battleship Maine blew up:
      two explosions, the ship sinking in minutes,
      266 American sailors dead.
      Nobody knew why. (A coal bunker fire, most likely —
      not a Spanish mine. But nobody wanted to hear that.)
      "Remember the Maine!" — the cry went up,
      Hearst's papers fanning the flames,
      and war fever swept the country like a fever indeed.
      I watched the wreck settle in the harbor mud,
      the mast still above water like a accusing finger,
      and thought: this is how empires start wars now —
      with a headline, not a reason.
    description: "I was on the Havana waterfront when the Maine exploded — 266 dead, and war fever ignited by headlines."
    status: "published"
    sha256: "64bf9b60208da4f2d705e5d112b7510d2c4bca06134f63cac5840d2720d9563a"
  - number: "3235"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Spanish-American War"
    date: "1898 CE"
    region: "America"
    poem: |
      Ten weeks, and America became an empire —
      I was in Manila Bay when Dewey's squadron
      destroyed the Spanish fleet before breakfast:
      "You may fire when you are ready, Gridley."
      Cuba. Puerto Rico. Guam. The Philippines —
      Spain's empire, transferred to Washington in a summer.
      The country that had been born fighting an empire
      now owned colonies.
      (The Filipinos, who'd fought Spain for freedom,
      found they'd traded one master for another —
      and fought America for three more years.)
      I watched the flag go up over Manila
      and thought: the republic just became something else.
      It would spend the next century deciding what.
    description: "I was in Manila Bay when Dewey fired — ten weeks that turned the American republic into an empire."
    status: "published"
    sha256: "c16a13053ad0b428942876cf15f32e16969c6bab8e65238e36df0eac192b7908"
  - number: "3236"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Omdurman"
    date: "1898 CE"
    region: "Sudan"
    poem: |
      The machine guns did it in a morning —
      I was with Kitchener's force at Omdurman:
      25,000 British and Egyptian troops,
      Maxims and artillery against 50,000 dervishes
      charging with spears and swords and faith.
      It wasn't a battle. It was an execution.
      10,000 Mahdists dead in hours. Forty-eight British.
      Churchill was there, in the cavalry charge —
      the last great cavalry charge, and the first
      industrial-age massacre, on the same field.
      I walked among the dervish dead afterward,
      brave men mowed down in windrows,
      and thought: courage means nothing against the Maxim.
      The age of the noble charge was over.
      The age of the machine had begun.
    description: "I was at Omdurman when machine guns mowed down 10,000 dervishes in a morning — courage against the Maxim."
    status: "published"
    sha256: "b2921f1024a29feac13916239e147114c09b8c737ca87fc16c5d098e469f18e7"
  - number: "3237"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "Radium"
    date: "1898 CE"
    region: "France"
    poem: |
      Marie and Pierre Curie, in a Paris shed —
      I visited their laboratory: no ventilation, no protection,
      tons of pitchblende boiled down to a pinch of glowing salt.
      Radium. It glowed blue in the dark.
      It was millions of times more radioactive than uranium —
      a word they'd just invented: radioactivity.
      The strange power would heal cancers and kill its discoverers.
      Marie carried test tubes of it in her pockets.
      I held a vial — shielded, barely — and watched it glow,
      and thought: this light comes from inside matter itself,
      from atoms breaking apart.
      They'd found the fire at the heart of things.
      It would light the world. It would burn it.
    description: "I visited the Curies' shed laboratory and watched radium glow blue — the fire at the heart of matter."
    status: "published"
    sha256: "4493bd05d0c5e1c550dfb80cfc630920fd3c0fcb489ee5fa75e9ba80e2581bce"
  - number: "3238"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Hague Conference"
    date: "1899 CE"
    region: "Netherlands"
    poem: |
      Twenty-six nations, called by the Tsar —
      I was at The Hague for the first world peace conference:
      they banned poison gas, dum-dum bullets, balloon bombing,
      and created a court of arbitration.
      It was idealistic. It was inadequate.
      (The next century would break every rule they wrote.)
      But it was the first time the nations of the world
      sat down together to say: war should have limits.
      The idea mattered, even when the rules didn't hold.
      I watched the delegates — uniforms and frock coats,
      all the old world in one room —
      and thought: they're trying to leash the future.
      The future was already straining at the leash.
    description: "I was at The Hague when twenty-six nations held the first world peace conference and tried to leash war."
    status: "published"
    sha256: "249740e2c6f997e17130462e897944f9a869693c9916912763a74aeb5c30d241"
  - number: "3239"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Boer War"
    date: "1899 CE"
    region: "South Africa"
    poem: |
      The empire's hardest fight yet —
      I was in South Africa when it started:
      the Boer republics against the full might of Britain,
      and the Boers won the first rounds — besieging Ladysmith,
      Mafeking, Kimberley, picking off columns with their Mausers.
      London sent half a million men in the end —
      the largest army Britain had ever fielded —
      and still the commandos fought on for three years,
      until the farms were burned and the families put in camps.
      I watched the first British columns march out, confident,
      and thought of Majuba, eighteen years before.
      The empire had come back, as I'd known it would.
      This time it brought everything it had.
    description: "I was in South Africa when the Boer War began — the empire's hardest fight, eighteen years after Majuba."
    status: "published"
    sha256: "538c9edfc3a93399bb513927d3d14b4e35c51af610924c775c4909800c39f5bb"
  - number: "3240"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Paris Olympics"
    date: "1900 CE"
    region: "France"
    poem: |
      Five months long, and half a sideshow —
      I was in Paris for the second modern Games:
      stretched across the World's Fair, chaotic, sprawling,
      some athletes never knowing they'd been in the Olympics.
      But the women competed — for the first time.
      Tennis, golf, croquet: twenty-two women,
      breaking the ancient barrier quietly, without ceremony.
      The Games were a mess. The precedent was everything.
      I watched Charlotte Cooper win the tennis,
      the first female Olympic champion in history,
      and thought: Athens had the marble and the glory.
      Paris had the future — and she was holding a racket.
    description: "I watched Charlotte Cooper win tennis in Paris — the first female Olympic champion in the Games' chaotic second act."
    status: "published"
    sha256: "b828dcebe1508eeb79848d92d1803c1e4cd3652df7fe1d2035c480aa4370b15a"
  - number: "3241"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Boxer Rebellion"
    date: "1900 CE"
    region: "China"
    poem: |
      "The foreigners must go" —
      I was in Beijing when the Boxers besieged the legations:
      fifty-five days, the diplomats and missionaries
      behind barricades, the "Society of Righteous and Harmonious Fists"
      sure their rituals made them bulletproof.
      They weren't. Eight armies marched on Beijing —
      British, French, German, Russian, Japanese, American —
      and crushed the uprising, and looted the city for good measure.
      The Qing dynasty never recovered.
      I walked through the breached gates with the relief force,
      past the bodies of Boxers who'd believed the bullets couldn't touch them,
      and thought: China would remember this humiliation,
      nurse it, and one day answer it.
    description: "I was in besieged Beijing during the Boxer Rebellion — fifty-five days that broke the Qing dynasty."
    status: "published"
    sha256: "bfd4ea2bc977a1e3230444943157dd7820b9e8bf802b268afa75209197d9e481"
  - number: "3242"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Galveston Hurricane"
    date: "1900 CE"
    region: "America"
    poem: |
      The sea came over the island —
      I was in Galveston when the great hurricane struck:
      no warning system, no seawall, a city flat as a table
      in the path of a storm no one understood.
      The water rose fifteen feet. Houses floated off their foundations.
      8,000 dead — America's deadliest natural disaster,
      then and now.
      I walked the wreckage afterward, past the bodies stacked like cordwood,
      the whole city a splintered ruin,
      and thought: we build our proudest cities on sand,
      and the sea keeps the accounts.
      Galveston never regained its glory. Houston did.
      The storm redrew the map of Texas with water.
    description: "I was in Galveston when the hurricane drowned 8,000 — America's deadliest natural disaster."
    status: "published"
    sha256: "43401932e99e2830091e77156f357a7637a1fc285f1e5d7149499a10f4ef3dbe"
  - number: "3243"
    volume: 5
    era_code: "11b"
    era: "Steam and Steel (later)"
    title: "The Quantum"
    date: "1900 CE"
    region: "Germany"
    poem: |
      Energy comes in packets —
      I was in Berlin when Max Planck, desperate to solve
      the black-body radiation problem, proposed it:
      energy isn't continuous. It comes in quanta —
      little packets, little jumps, nothing in between.
      He thought it was a mathematical trick.
      It wasn't. It was the crack in the foundation
      of all of classical physics.
      Einstein would widen it. Bohr, Heisenberg, Schrödinger
      would build a new universe through it.
      The twentieth century's strangest, truest science
      started with one reluctant equation.
      I watched the old physicist present his heresy
      to a polite, uncomprehending audience,
      and thought: they have no idea what he just did.
      None of us did. The quantum age had begun.
    description: "I was in Berlin when Planck proposed energy comes in packets — the reluctant heresy that began the quantum age."
    status: "published"
    sha256: "edfb21b71e756782b1b2a00d1a514a42243b2be267171e088f3acea53535defb"
  - number: "3244"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Fair of the Century"
    date: "1900 CE"
    region: "Paris"
    poem: |
      I walked the fairgrounds of 1900 and watched the future arrive on rails,
      Moving sidewalks carrying ladies in long skirts,
      Fifty million visitors under a Paris sky.
      The Eiffel Tower, that iron skeleton they'd called an eyesore,
      Stood tall and let the crowds forgive her.
      Talking films flickered in dark pavilions,
      And for a summer the world believed
      Everything that came next would be this bright.
      I smiled at them. I had seen what came next.
    description: "Paris's 1900 exposition shows off the wonders of a new century — moving sidewalks, talking films, the Eiffel Tower — while the traveler already knows the dark years ahead."
    status: "published"
    sha256: "0d37da0bb13283974ff852c92944f8479c7794e650b097976ee01a0fc93f7d04"
  - number: "3245"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Boxers Rise"
    date: "1900 CE"
    region: "Beijing, China"
    poem: |
      I stood in the legation quarter when the siege began,
      Summer heat, barricades of furniture and sandbags,
      Eight nations' soldiers behind one thin line.
      The Boxers believed their rituals stopped bullets;
      The bullets did not believe in rituals.
      For fifty-five days the foreigners held,
      Then the armies marched in and looted Beijing street by street.
      I watched an old city pay for an empire's pride
      And wondered which of us had been the invaders.
    description: "Anti-foreign rebels besiege Beijing's legation quarter until an eight-nation army breaks through, then loots the city — the traveler's loyalty is torn between both sides of the barricade."
    status: "published"
    sha256: "bd50a77882eeee2b435958d481ffd1a5f1587b3f57e58017c4f7755833cea621"
  - number: "3246"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Dreams Get a Map"
    date: "1900 CE"
    region: "Vienna, Austria"
    poem: |
      In Vienna I read the book that said our nights mean something,
      A doctor with a couch and a cigar,
      Telling the century that a locked room in every head
      Held the self we hide from ourselves.
      He mapped the dream the way explorers map a coast:
      Here be dragons, here the buried city.
      I have walked a hundred centuries of sleep,
      And I tell you he was right —
      There is a country under the skull no waking eye can see.
    description: "Freud publishes The Interpretation of Dreams in Vienna, mapping the unconscious mind — the traveler, who has lived a hundred lifetimes, agrees the hidden country is real."
    status: "published"
    sha256: "a65aee72b88d8bb3861f14ea49f9000ed8509034c5a6636cf7aee9810f8ba654"
  - number: "3247"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Sea Takes Galveston"
    date: "1900 CE"
    region: "Texas, USA"
    poem: |
      I was on the island when the water rose,
      The richest port in Texas, and the wind took it apart board by board.
      The storm surge came like a moving wall,
      And houses folded the way paper folds in a child's fist.
      Six to eight thousand dead — they never knew the true count,
      They buried the bodies at sea and the sea gave them back.
      America's deadliest storm, and no satellites warned them,
      Only a sky going black at noon.
      I helped stack the dead. I do not forget their names were never all known.
    description: "The 1900 Galveston hurricane drowns the richest port in Texas, killing thousands in America's deadliest storm — the traveler helps with the burial parties."
    status: "published"
    sha256: "04d2de6d3fea603b4d8a09fba0bcd5110fe903cb831847460ff118001af0ea7b"
  - number: "3248"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Women Take the Field"
    date: "1900 CE"
    region: "Paris, France"
    poem: |
      Paris, 1900, and for the first time women run the race,
      Tennis, golf, sailing — a crack in a very old wall.
      I watched the crowd watch them, unsure whether to cheer or look away,
      And some cheered, tentatively, like people testing a new word.
      The men kept the marathons for themselves a while longer,
      But the door had opened, and doors do not close by themselves.
      I have seen a thousand walls fall; this one began
      With a tennis racket and a sail on the Seine.
    description: "Women compete in the Olympics for the first time in Paris — tennis, golf, sailing — and the traveler sees a door open that will never close again."
    status: "published"
    sha256: "6a705fe399f4d0cd81e0a6ad71f48c9705aeaf2be68f9b11eccaf12a9d5cf953"
  - number: "3249"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Airship Ascends"
    date: "1900 CE"
    region: "Germany"
    poem: |
      Over Lake Constance the great silver fish rose,
      Count Zeppelin's rigid dream, floating on nothing but nerve.
      I watched the crowd below, their hats in their hands,
      As the sky grew a hull and a keel for the first time.
      It wobbled, it swayed, it flew eighteen minutes —
      Long enough to change the meaning of up.
      I have ridden storms across a thousand worlds,
      And still I held my breath with them.
    description: "Zeppelin's rigid airship floats over Lake Constance in 1900 — the traveler watches the crowd watch the sky grow a hull."
    status: "published"
    sha256: "0c6a4bf22a6c204dac6a986eaf5d375f182b07b23ad5c9268fa3fdab9c6285b7"
  - number: "3250"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Under the City of Light"
    date: "1900 CE"
    region: "Paris, France"
    poem: |
      They bored tunnels under Paris and called it the Métro,
      And the city learned to travel beneath itself.
      I rode the first cars, the air electric and new,
      Commuters descending into a lit underworld every morning.
      Above, the boulevards kept their cafés and their sun;
      Below, another Paris hummed in iron and tile.
      Every great city hides a second city under its feet —
      Paris was just the first to admit it.
    description: "Paris opens its underground railway in 1900, and the traveler rides the first trains through the city's new second self beneath the boulevards."
    status: "published"
    sha256: "7902a528fbd8af830d5da007bd677c72370dbdd6c995ee2d026db2fa44175816"
  - number: "3251"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Victorian Age Ends"
    date: "1900 CE"
    region: "England"
    poem: |
      She died in January on the Isle of Wight,
      Sixty-three years on the throne, the grandmother of Europe.
      I watched the empire wear black for a woman
      Who had seen steam replace sail and telegraph replace horse.
      The century she'd named was already over;
      The new one stood in the doorway, uninvited.
      Kings and emperors took her funeral train as a family portrait —
      Most of them would be gone within twenty years.
      I wept with the crowds. I knew what was coming for them.
    description: "Queen Victoria dies after a 63-year reign, and an empire mourns its grandmother — the traveler knows most of the royal mourners at her funeral will be gone within two decades."
    status: "published"
    sha256: "b92c82fcdaa4a34c26831eac1e281798b80063cb87002de0cddd3edc607adbe8"
  - number: "3252"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Prize Begins"
    date: "1900 CE"
    region: "Stockholm, Sweden"
    poem: |
      In Stockholm they handed out the first prizes
      Bought with dynamite money — Nobel's strange atonement.
      Röntgen for the invisible rays,
      Dunant for the Red Cross, for mercy on battlefields,
      A poet for his verses.
      I watched them bow and accept,
      And thought of all the brilliant minds the century would waste
      While this prize went on shining, year after year,
      Like a candle kept lit for the better angels.
    description: "The first Nobel Prizes honor Röntgen, Red Cross founder Dunant, and a poet — funded by dynamite money, the traveler calls it Nobel's strange atonement."
    status: "published"
    sha256: "4e0aa989b3b93ceb0cd1bb720ba4ec3d0c98c5e844f2ed00c20b008ded5d5103"
  - number: "3253"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "A Signal Crosses the Ocean"
    date: "1901 CE"
    region: "Cornwall to Newfoundland"
    poem: |
      Three dots, faint as heartbeats, across the Atlantic,
      Marconi heard them and the world got smaller that day.
      No cable, no wire, no poles — just the air itself carrying a message,
      The letter S, tapped in Cornwall, caught in Newfoundland.
      The scientists said the signal should have flown straight off the Earth;
      The sky itself bent it back down.
      I stood in the cold by the receiving station
      And felt the horizon dissolve.
    description: "Marconi receives three faint dots across the Atlantic — the first transatlantic wireless signal, and the traveler feels the horizon dissolve."
    status: "published"
    sha256: "230edd123a9b4c0681c13e0d91bfd5ba0443b476a1cc202c0846a0a21dee697d"
  - number: "3254"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Oil Erupts in Texas"
    date: "1901 CE"
    region: "Texas, USA"
    poem: |
      The ground blew open at Spindletop,
      A hundred and fifty feet of black gold roaring skyward.
      I stood in the spray of it, deafened,
      While men danced in the mud and the drillers wept.
      The petroleum century began in that gusher —
      Cars, planes, wars, plastics, the whole smoky kingdom.
      Nobody in that field thought past the money.
      I smelled the future burning and it smelled like oil.
    description: "The Spindletop gusher blows in Texas, launching the petroleum century — the traveler stands in the spray and smells the future burning."
    status: "published"
    sha256: "b5fa934dce8f6950687c90d254dbd4b508f25f6f5c1ca3f57864143f167f26fa"
  - number: "3255"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "A Nation of States"
    date: "1901 CE"
    region: "Australia"
    poem: |
      Six colonies, one continent, and on New Year's Day
      They stitched themselves into a Commonwealth.
      No war, no blood — just signatures and speeches in Sydney,
      A nation born by agreement, the civilized miracle.
      I watched the flags go up over the harbor
      And thought how rarely it happens this way:
      Most nations are born screaming.
      Australia was born talking.
    description: "Six Australian colonies unite peacefully as a Commonwealth on New Year's Day 1901 — the traveler notes most nations are born screaming; this one was born talking."
    status: "published"
    sha256: "0a896e0b392e5cdca5c3259e75f045b6e6ad68d012c57fb20d357ab92b092fda"
  - number: "3256"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Blue Becomes a Period"
    date: "1901 CE"
    region: "Paris, France"
    poem: |
      A young Spaniard in Paris, grieving his dead friend,
      Picked up blue and would not put it down.
      Beggers, blind men, mothers with empty arms —
      He painted sorrow until sorrow had a color.
      I stood in his studio among the canvases,
      Wet paint the blue of dusk after rain,
      And watched a boy turn heartbreak into a whole period of art.
      Grief, he taught the century, is a kind of seeing.
    description: "A grieving young Picasso paints the world in blue — beggars, blind men, mothers — and the traveler watches heartbreak become a whole period of art."
    status: "published"
    sha256: "7c30e599fd3a3396933225be46e5dac384606076a92ea42f548fa9fda1053238"
  - number: "3257"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "An Assassin in Buffalo"
    date: "1901 CE"
    region: "New York, USA"
    poem: |
      In Buffalo a man with a wrapped hand
      Shot President McKinley at the Pan-American Exposition.
      I was in the crowd when the shots cracked,
      And watched a nation learn the word anarchist.
      McKinley lingered eight days and died;
      Theodore Roosevelt came down from the mountains
      And stormed the White House like a cavalry charge.
      The twentieth century's first changing of the guard —
      By bullet, not by ballot.
    description: "McKinley is assassinated in Buffalo and Theodore Roosevelt storms into the White House — the century's first changing of the guard by bullet, not ballot."
    status: "published"
    sha256: "7551cce7c6cb791e4df3b914b82d7cddecbd88f1ab7cc23b578d9c9cbf64201f"
  - number: "3258"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Mountain Explodes"
    date: "1901 CE"
    region: "Martinique"
    poem: |
      Saint-Pierre had a mountain and an election,
      So nobody evacuated when Pelée began to smoke.
      I was on a ship in the harbor when the sky fell —
      A black cloud of burning gas rolling down the slope
      Faster than any running thing could run.
      Thirty thousand people, gone in minutes,
      The whole city except two men: a prisoner in a stone cell
      And a shoemaker who outran the cloud.
      The mountain did not negotiate. It never does.
    description: "Mount Pelée buries Saint-Pierre in minutes in 1902, killing nearly everyone except a prisoner in a stone cell and a shoemaker — the traveler watches from a ship in the harbor."
    status: "published"
    sha256: "b48014cd262582cb91538d7d7c2c75bba46e0024911a80d467307cbd8264c630"
  - number: "3259"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Peace in the Veld"
    date: "1902 CE"
    region: "South Africa"
    poem: |
      The Boer War ended in the veld with a treaty,
      Britain took the Transvaal and the Orange Free State.
      I had watched farmers on horseback hold the empire for three years,
      And watched the empire answer with camps where children died of fever.
      Peace came, but it was a soldier's peace,
      Bought with scorched farms and the bones of the innocent.
      The Boers lost their republics;
      The Black Africans, who had fought for both sides,
      Got nothing at all.
    description: "The Boer War ends with Britain victorious — the traveler remembers the scorched farms, the camps where children died, and the Black Africans who fought and got nothing."
    status: "published"
    sha256: "ab9d0e2cf704a0625c4627d3717c6bf498545305242a5c66ed6003839b10eb4f"
  - number: "3260"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Cool Air on Demand"
    date: "1902 CE"
    region: "New York, USA"
    poem: |
      A Brooklyn printing plant had a humidity problem,
      So Willis Carrier taught the air to behave.
      Cool, dry, on demand — nobody at the time guessed
      It would redraw the map of where humans could live.
      The South, the desert cities, the tropics' offices —
      Half the modern world runs on his machine.
      I stood in that first cooled room and shivered,
      Not knowing the shiver would go global.
    description: "Willis Carrier invents modern air conditioning for a Brooklyn printing plant — the traveler shivers in the first cooled room, not knowing half the modern world will run on it."
    status: "published"
    sha256: "91f479e6d82ea7bd60446fed30d7302ea8185dee4db5f5b03bb47a4fcb2af92d"
  - number: "3261"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Bear Gets a Name"
    date: "1902 CE"
    region: "USA"
    poem: |
      Roosevelt went hunting in Mississippi
      And refused to shoot a bear cub tied to a tree.
      A cartoonist drew it, a shopkeeper stuffed it,
      And the teddy bear was born — named for Theodore.
      I have seen empires rise on smaller mercies.
      A president spares one small life,
      And a million children clutch the soft echo of it
      In the dark, when the house is quiet.
    description: "Roosevelt spares a bear cub on a Mississippi hunt, a cartoon follows, and the teddy bear is born — the traveler calls it an empire of mercy in miniature."
    status: "published"
    sha256: "ac04ae9533fe2324136120351416b2b9fdaa288bfe2c4a2d512b35ab1428cbbc"
  - number: "3262"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Rose Bowl Begins"
    date: "1902 CE"
    region: "California, USA"
    poem: |
      Michigan crushed Stanford forty-nine to nothing
      In the first Rose Bowl, under the California sun.
      I sat in the stands in Pasadena
      While a new American ritual was being invented:
      Parades of flowers in the morning, football in the afternoon,
      Every New Year's Day for a century to come.
      Nobody there knew they were starting a tradition.
      They thought they were just watching a game.
    description: "Michigan crushes Stanford in the first Rose Bowl — the traveler sits in the Pasadena stands while a century-long New Year's ritual is invented by accident."
    status: "published"
    sha256: "ebefae49a98a7f78f11de3d0a2f2247e9cde3108bd317676060aa4b724a38055"
  - number: "3263"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Sixty Riders, One Road"
    date: "1903 CE"
    region: "France"
    poem: |
      Sixty riders set off from Paris on bicycles,
      Two thousand four hundred kilometers of French road,
      Dust, punctures, and cheating in the dark.
      Maurice Garin won the first Tour de France,
      And I rode alongside them in my mind if not on wheels,
      Through villages that turned out to stare
      At men doing something no one had ever done:
      Racing the whole of France on two thin tires.
    description: "Sixty riders set off from Paris in the first Tour de France — the traveler follows the dust and punctures through villages seeing bicycle racing for the first time."
    status: "published"
    sha256: "556477371441bddd3fb3986c68bfa0dc571252e80b490a15dee2648565c778df"
  - number: "3264"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Twelve Seconds at Kitty Hawk"
    date: "1903 CE"
    region: "North Carolina, USA"
    poem: |
      Twelve seconds. One hundred twenty feet.
      Two bicycle mechanics from Ohio, a dune, a headwind,
      And a machine that left the ground under its own power.
      I stood on the sand at Kitty Hawk and held my breath
      While the Flyer trembled into the air —
      The moment the human race became a flying species.
      They did it three more times that day.
      By the fourth flight they had flown nearly a minute.
      I have crossed galaxies, and I still honor those twelve seconds.
    description: "The Wright brothers' Flyer lifts off the dunes at Kitty Hawk for twelve seconds — the traveler calls it the moment humanity became a flying species."
    status: "published"
    sha256: "3fe7421568abb07ebd00b5f49baf49d7a53c787cc99d0e295a2c7c90eabae553"
  - number: "3265"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Car for Everyone"
    date: "1903 CE"
    region: "Michigan, USA"
    poem: |
      Henry Ford founded his motor company in Detroit,
      And the automobile was still a rich man's toy —
      For now.
      I walked the early factory floor, smelled the oil and ambition,
      And watched a stubborn man with a stubborn idea:
      The car not for the few but for the multitude.
      He would build it on a moving line and sell it cheap,
      And the world would pave itself to make room.
      The horse had four thousand years. Its time was up.
    description: "Henry Ford founds the Ford Motor Company in Detroit — the traveler walks the early factory floor and senses the horse's four thousand years coming to an end."
    status: "published"
    sha256: "8101f97b6ce714495cd4ebacede34bb47701054b6bca671187a56efc8258a239"
  - number: "3266"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "A Canal Is Born"
    date: "1903 CE"
    region: "Panama"
    poem: |
      Panama broke from Colombia with American warships offshore,
      And within weeks the canal zone was Washington's.
      I stood on the isthmus where the French had already buried twenty thousand men,
      And watched the Americans arrive with mosquito nets and steam shovels.
      A canal is a wound through a continent that heals into a road —
      But the wound was Panama's, and the road was America's.
      Empires dig. The small countries hold the shovel.
    description: "Panama breaks from Colombia with American backing and the canal zone follows — the traveler notes empires dig, and small countries hold the shovel."
    status: "published"
    sha256: "31017057fce1e6780ee74b604a42c0f57badb63202b8d239c95b9cdd5852d2da"
  - number: "3267"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Fall Classic Begins"
    date: "1903 CE"
    region: "USA"
    poem: |
      Boston beat Pittsburgh, five games to three,
      In the first World Series ever played.
      I sat in the wooden stands, scorecard on my knee,
      While October invented its own holiday.
      No one called it the Fall Classic yet —
      It was just the best team in the American League
      Against the best in the National, winner take all.
      A century of Octobers started there,
      In the smell of peanuts and cigar smoke.
    description: "Boston beats Pittsburgh in the first World Series — the traveler sits in the wooden stands while October invents its own holiday."
    status: "published"
    sha256: "d160c56db79ecc59fd436b85b7c080a93297402c932b1e2a91179e291c01e941"
  - number: "3268"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Movies Learn to Tell Stories"
    date: "1903 CE"
    region: "USA"
    poem: |
      Before this, films were just things that moved —
      A train arriving, workers leaving a factory.
      Then The Great Train Robbery gave the movies a plot:
      A robbery, a chase, a posse, and a bandit firing his gun at the camera.
      I sat in the dark while the audience ducked,
      And watched storytelling learn a new language in twelve minutes.
      Every film you have ever loved
      Is a grandchild of that train robbery.
    description: "The Great Train Robbery gives film a plot, a chase, and a gunshot fired at the camera — the traveler watches storytelling learn a new language in twelve minutes."
    status: "published"
    sha256: "1e3610c407543059466084004bc84be6668a2ce9a5d5a44f0445bd100c71c891"
  - number: "3269"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The East Strikes First"
    date: "1904 CE"
    region: "Manchuria"
    poem: |
      Japan's torpedo boats slipped into Port Arthur at night,
      And an Asian power struck a European empire first.
      I watched the Russian fleet burn in its own harbor
      While the world rubbed its eyes — this wasn't supposed to happen.
      The twentieth century's first great shock:
      The white empires were not invincible.
      In Tokyo they celebrated; in St. Petersburg they could not believe it.
      I believed it. I had seen the future wearing a different face.
    description: "Japan's surprise attack on Port Arthur opens the Russo-Japanese War — the traveler watches the world learn that the European empires are not invincible."
    status: "published"
    sha256: "d5ebd8fca31111f96f44c1eb99c582ee8186ddebe22a5c311be59b0c13c11d76"
  - number: "3270"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Desert War"
    date: "1904 CE"
    region: "German South West Africa"
    poem: |
      The Herero rose, and Germany answered with extermination,
      Driving tens of thousands into the waterless desert to die.
      I walked that desert after the soldiers left,
      Past the bones and the abandoned wells, the silence like a held breath.
      The century's first genocide, and the world looked away —
      It was Africa, it was colonies, it didn't count.
      It counted. I counted the bones.
      Everything the century would do to the Jews, to the Armenians,
      Was rehearsed here first, in the sand.
    description: "Germany crushes the Herero uprising, driving tens of thousands into the desert to die — the traveler walks among the bones and calls it the century's first genocide, rehearsed in the sand."
    status: "published"
    sha256: "abf4d0f0c8feaec49602796d5ea20cd338674ee81ee1089984b83ac3162882df"
  - number: "3271"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Old Enemies Shake Hands"
    date: "1904 CE"
    region: "London and Paris"
    poem: |
      Britain and France sat down and settled their quarrels,
      Egypt for you, Morocco for me — the Entente Cordiale.
      I watched the diplomats shake hands in London and Paris,
      Eight centuries of war filed away in a drawer.
      They thought they were making peace.
      They were making sides.
      Within ten years those handshakes would be trenches,
      And the colonial bargains would be paid for in French and British blood.
    description: "Britain and France settle their colonial quarrels in the Entente Cordiale — the traveler watches old enemies shake hands and knows they are making sides, not peace."
    status: "published"
    sha256: "d67ece07a062ba9a58c716ab261cd3a57120ac66038bb254122adf4621eb44bb"
  - number: "3272"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The City Goes Underground"
    date: "1904 CE"
    region: "New York, USA"
    poem: |
      New York opened its first subway line,
      City Hall to Harlem, nine miles of tunnel.
      I rode with the crowds on opening day,
      The car packed, the air electric, the city vibrating through the floor.
      Above, the horse cars and the elevated trains kept their noise;
      Below, the future moved at forty miles an hour.
      A city that goes underground is a city that has decided
      To never stop growing, up or down.
    description: "New York opens its first subway line from City Hall to Harlem — the traveler rides opening day and feels a city deciding to never stop growing."
    status: "published"
    sha256: "7b687f6dcdda853aa39916107d558e33fc3b7895a91f7f5ed3b235eaa43ee6e9"
  - number: "3273"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Games Come to America"
    date: "1904 CE"
    region: "Missouri, USA"
    poem: |
      The Olympics came to St. Louis and nearly drowned in dust,
      A marathon run through choking heat, one runner dosed with strychnine,
      Another hitched a ride in a car and almost stole it.
      I watched the chaos from the sidelines, half laughing, half horrified —
      The ancient games, reborn as an American county fair.
      But through the mess something real survived:
      Men running themselves empty for no prize but the running.
    description: "The 1904 St. Louis Olympics dissolve into dust and chaos — a strychnine-dosed marathon, a cheater in a car — but the traveler sees the real games survive underneath."
    status: "published"
    sha256: "aead6703a4a39a8b0686e225402a6ffe29d04ab971c4e10beac61a95f59d40ac"
  - number: "3274"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Blood on the Snow"
    date: "1905 CE"
    region: "St. Petersburg, Russia"
    poem: |
      They marched to the Tsar with icons and a petition,
      Workers and their families, singing hymns in the snow.
      I walked among them, peaceful, unafraid —
      Then the rifles spoke, and the snow turned red.
      Bloody Sunday: the day Russia's people learned
      Their Little Father would shoot them for asking.
      The 1905 revolution rose from that blood,
      Barricades, strikes, a mutiny on the Potemkin.
      It failed. But the snow remembered, and so did I.
    description: "Troops fire on peaceful workers marching to the Tsar on Bloody Sunday — the traveler walks among the singing crowd and watches the snow turn red."
    status: "published"
    sha256: "69cc2f6fea3dd4b376a19bf0b104fd4809d461a3645f7bdef8b6801cc912189d"
  - number: "3275"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Patent Clerk Rewrites Physics"
    date: "1905 CE"
    region: "Bern, Switzerland"
    poem: |
      In a Bern patent office a clerk did his real work in the margins,
      And in one year rewrote the universe:
      Light comes in packets, time bends with speed,
      And mass is frozen energy — E=mc2, the shortest poem ever written.
      I stood outside his window on an ordinary Swiss street
      While inside, quietly, the cosmos changed shape.
      No parade, no prize that year, just a young man
      Seeing further than anyone alive.
      The atom would remember that equation. So would Hiroshima.
    description: "Einstein's miracle year in Bern — relativity, photons, E=mc2 — and the traveler stands outside the patent office window knowing the atom will remember that equation."
    status: "published"
    sha256: "ffae0f4f5ea0018e810958146cee1956f6be75bca8d36783d0b6874ac34d261e"
  - number: "3276"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Fleet That Vanished"
    date: "1905 CE"
    region: "Korea Strait"
    poem: |
      The Russian Baltic Fleet sailed halfway around the world,
      Eighteen thousand miles, to meet Japan in the Korea Strait.
      I watched from the mist as Togo crossed their T,
      And in two days the Russian fleet ceased to exist.
      The first modern naval annihilation —
      An Asian navy destroying a European one, completely.
      The sailors who survived were fished from the water
      By the same sea that had carried them so far.
      Empires float, the traveler learns. And empires sink.
    description: "Japan annihilates the Russian Baltic Fleet at Tsushima after its 18,000-mile voyage — the traveler watches an empire's fleet sink in the mist."
    status: "published"
    sha256: "ea4b6041a0f9179884cde6afe06a9b7676be66f942b0a574f18c06421501e9af"
  - number: "3277"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Peace in New Hampshire"
    date: "1905 CE"
    region: "New Hampshire, USA"
    poem: |
      Roosevelt brought the Russians and Japanese to Portsmouth,
      And talked them into peace when both were bled dry.
      I sat in the New Hampshire summer heat
      While the diplomats haggled over Sakhalin and indemnities,
      And watched a president earn a Nobel Prize
      For stopping a war nobody else could stop.
      Peace is unglamorous work — rooms, papers, patience.
      He did it anyway.
    description: "Roosevelt brokers peace between Russia and Japan at Portsmouth, New Hampshire, winning the Nobel — the traveler calls peace unglamorous work: rooms, papers, patience."
    status: "published"
    sha256: "1de4810544d4d06ee7cf9d95563ff9c20b979105ca177821f7a77b6e3d280ed9"
  - number: "3278"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Norway Goes Its Own Way"
    date: "1905 CE"
    region: "Norway"
    poem: |
      Norway left Sweden the way adults end things:
      Talking, voting, no shots fired.
      I watched the referendum — nearly unanimous —
      And the two kings parting without a war,
      The rarest divorce in the history of nations.
      They even borrowed a Danish prince for the new throne
      And got on with being neighbors.
      If only, I thought, watching the century arm itself,
      They all did it this way.
    description: "Norway peacefully leaves its union with Sweden by referendum — the traveler calls it the rarest divorce in the history of nations and wishes the century would learn from it."
    status: "published"
    sha256: "8f0778c1bcc292297f41d34dbd85c07d1f779247b06cfd325f9a41ed4daf22c6"
  - number: "3279"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Five Cents a Dream"
    date: "1905 CE"
    region: "Pittsburgh, USA"
    poem: |
      A nickel bought you a dark room and an hour of elsewhere —
      The first nickelodeon opened, and the movies became the people's theater.
      I sat among factory hands and shop girls,
      Watching flickering streets and chases for five cents,
      And understood what the century had just invented:
      The cheapest escape ever sold.
      The rich had their opera boxes; the rest had this.
      It was enough. It was always enough.
    description: "The first nickelodeon opens in Pittsburgh — five cents buys a dark room and an hour of elsewhere, and the traveler calls it the cheapest escape ever sold."
    status: "published"
    sha256: "769358e299a6e3d7d32e8e3ab192af791e5e24b27c28bdc77295266b61d6fa17"
  - number: "3280"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "A Town in the Desert"
    date: "1905 CE"
    region: "Nevada, USA"
    poem: |
      They founded Las Vegas as a railroad water stop,
      A dot in the Nevada desert, nothing to see.
      I stood on that dusty lot in 1905
      And tried to imagine the neon, the fountains, the all-night chapels —
      I could not. Nobody could.
      The future is a poor guesser; it put a water tank in the desert
      And got the brightest city on Earth.
      I have learned to laugh at beginnings.
      They never look like what they become.
    description: "Las Vegas is founded as a railroad water stop in the Nevada desert — the traveler stands on the dusty lot and laughs at how beginnings never look like what they become."
    status: "published"
    sha256: "14af7741bc803b824d76aa60e2faa82401f1e447f7d77ab95e49164af22aea7c"
  - number: "3281"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Earth Moves at Dawn"
    date: "1906 CE"
    region: "California, USA"
    poem: |
      At 5:12 in the morning the earth moved,
      And San Francisco broke like a plate dropped on stone.
      I ran through streets that rolled like water,
      Then watched three days of fire finish what the quake began.
      The city burned block by block, and the rich and poor
      Slept side by side in the parks, in tents, in the rain.
      They rebuilt it — of course they rebuilt it —
      But for a week the whole city was equal,
      And the ground had the last word.
    description: "The 1906 earthquake and three days of fire level San Francisco — the traveler runs through rolling streets and watches rich and poor sleep side by side in the parks."
    status: "published"
    sha256: "a57a775e4de8ff107a9298ad73c9b483a6f6b3e869b218b68591ceb88fb11a17"
  - number: "3282"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Jungle Exposed"
    date: "1906 CE"
    region: "USA"
    poem: |
      Sinclair went into Chicago's meatpacking plants
      And came out with a novel that made America gag.
      I walked those killing floors with him in my mind —
      The rats, the filth, the men ground down like the cattle.
      He wrote to save the worker; America read it and saved its stomach.
      Food-safety law was born from that book,
      Which is to say: from a writer who looked where nobody wanted to look.
      Look where it hurts. Write what you see.
    description: "Sinclair's novel about Chicago's meatpackers shocks America into food-safety law — the traveler honors the writer who looked where nobody wanted to look."
    status: "published"
    sha256: "01cc54a89ac70bf40644408a91438a8fb29e3cd7432a5b16aab82d34f2a6ddcf"
  - number: "3283"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Moroccan Crisis"
    date: "1906 CE"
    region: "Morocco"
    poem: |
      Europe's powers quarreled over Morocco at Algeciras,
      And Germany walked out isolated, humiliated, alone.
      I sat in the conference rooms, all polished wood and sharp smiles,
      While the map of Africa was traded like a hand of cards.
      Nobody in that room wanted war — yet.
      But every crisis taught the same lesson:
      The empires would rather fight than back down,
      And the list of things to fight over kept growing.
    description: "Europe's powers quarrel over Morocco and Germany walks out isolated — the traveler sits in the conference rooms and watches the empires learn they'd rather fight than back down."
    status: "published"
    sha256: "2f4d6d840e4222757d216853d3fb7494f23570efd4b739837171c3d288c0616d"
  - number: "3284"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Women Vote First"
    date: "1906 CE"
    region: "Finland"
    poem: |
      Finland did it first in Europe — women at the ballot box,
      Full suffrage, and the right to stand for office too.
      I watched Finnish women walk to the polls in 1906,
      Calm as people doing what should have been done long ago.
      Nineteen women were elected to parliament the next year.
      The world called it radical; the Finns called it Tuesday.
      I have seen revolutions with less courage in them
      Than a woman walking to vote in the snow.
    description: "Finland gives women the vote and the right to stand for office, first in Europe — the traveler watches them walk to the polls in the snow and calls it courage."
    status: "published"
    sha256: "4268776f7d4745a83b6f616b00c4307506adeee46482ece4b1cfdcfa31565db5"
  - number: "3285"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Music on the Air"
    date: "1906 CE"
    region: "Massachusetts, USA"
    poem: |
      On Christmas Eve, Fessenden took the microphone
      And sent voice and violin out over the Atlantic —
      O Holy Night, played live, to ships at sea.
      I imagine the wireless operators at their keys,
      Expecting dots and dashes, hearing music instead.
      The first radio program, and nobody had planned it;
      A man just wanted the lonely men on the ships
      To hear something beautiful on Christmas.
      The airwaves began with a gift.
    description: "Fessenden broadcasts voice and violin on Christmas Eve 1906, the first radio program — played for lonely ships' operators, the traveler says the airwaves began with a gift."
    status: "published"
    sha256: "af14ce1a6193374692bca5c7fb1d8e1a68a175a0c01b37bb3fd923c95dd55ead"
  - number: "3286"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Innocent at Last"
    date: "1906 CE"
    region: "France"
    poem: |
      Twelve years after the lie, Dreyfus was cleared,
      Restored to the army, given back his name.
      I had watched France tear itself in two over him —
      The army, the church, the mob on one side;
      Zola and the truth-tellers on the other.
      Justice took twelve years and cost a country its illusions.
      But it came. It came.
      I stood in the courtroom when the verdict was read
      And thought: this is what truth looks like when it refuses to die.
    description: "Dreyfus is cleared and restored after twelve years — the traveler watched France tear itself in two over him and stood in the courtroom when the verdict came."
    status: "published"
    sha256: "6397b53ed7e592adfee7c6b3e5e0e52b09a99384a72c638d4def80d5de8cfc16"
  - number: "3287"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Picasso Breaks the Face"
    date: "1907 CE"
    region: "Paris, France"
    poem: |
      Five women, fractured, staring from the canvas —
      Les Demoiselles d'Avignon broke the human face like a mirror.
      I stood before it in Picasso's studio, my breath caught,
      Because the painting wasn't showing women; it was showing seeing itself.
      African masks, Cézanne's geometry, fury, genius —
      Modern art began in that wreckage of perspective.
      Friends told him it was madness. He kept the canvas rolled for years.
      The future unrolled it.
    description: "Picasso paints five fractured women and modern art begins — the traveler stands before the canvas and sees a painting about seeing itself."
    status: "published"
    sha256: "e8da455cb50372af949a86ebf89e05741d0a3823e14c7ae645f862b4a8748d73"
  - number: "3288"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Fleet Sails White"
    date: "1907 CE"
    region: "USA"
    poem: |
      Roosevelt sent sixteen battleships around the world,
      Painted white, the Great White Fleet, to show the flag.
      I watched them steam out of Hampton Roads,
      Forty-three thousand miles, fourteen months, twenty ports.
      Every nation that saw them understood the message:
      America had arrived, and it had guns.
      It was a parade and a threat in the same hull.
      The century would learn to read that combination fluently.
    description: "Roosevelt sends sixteen white battleships on a 43,000-mile world cruise — the traveler calls it a parade and a threat in the same hull."
    status: "published"
    sha256: "2af714fdcdfb4848cbad4a1aeb151eb67f58c6aa006b53149aad3877348a41c0"
  - number: "3289"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The First Plastic"
    date: "1907 CE"
    region: "New York, USA"
    poem: |
      Bakelite — the first fully synthetic plastic,
      Born in a Yonkers laboratory from phenol and formaldehyde.
      I held one of the first dark, glossy pieces,
      Hard as amber, cheap as dirt, shaped like anything.
      The plastic age began in that beaker,
      And would end — will end — in every ocean on Earth.
      Nobody in that lab in 1907 imagined the Great Pacific Garbage Patch.
      I did the imagining for them, and wished I hadn't.
    description: "Bakelite, the first fully synthetic plastic, is invented — the traveler holds a glossy piece and already sees it ending in every ocean on Earth."
    status: "published"
    sha256: "45c09aeadfb9f5f1146d432df25130fdc1c027d1f0d4361dbd7ad0de338360d2"
  - number: "3290"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Panic"
    date: "1907 CE"
    region: "USA"
    poem: |
      The banks started falling, and Wall Street shook,
      And one man — J.P. Morgan — personally stopped the panic.
      I watched him summon the bankers to his library,
      Lock the door, and refuse to let them out until they'd pledged the money.
      One man's will held the whole system up for a weekend.
      It worked. But I stood in that marble library
      And thought: a civilization that needs one rich man
      To save it from itself is already in trouble.
    description: "The 1907 bank panic nearly topples Wall Street until J.P. Morgan locks the bankers in his library — the traveler thinks a civilization needing one rich man to save it is already in trouble."
    status: "published"
    sha256: "987e67f62eadd4ee19dfc824dab9b2834cd4fa6617ea452e8268a6f7001b5409"
  - number: "3291"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The First Helicopter Hop"
    date: "1907 CE"
    region: "France"
    poem: |
      Paul Cornu strapped himself into a twin-rotor machine
      And lifted off the ground — briefly, barely, but it flew.
      A few feet up, a few seconds, wobbling like a newborn foal.
      I watched the crowd hold its breath for those seconds,
      Because everyone there understood: the helicopter had just been born.
      It would take decades to grow up.
      But birthdays are birthdays, even shaky ones.
    description: "Paul Cornu lifts a twin-rotor machine off the ground in France — a few shaky seconds, and the traveler calls it the helicopter's birthday."
    status: "published"
    sha256: "ccfc00f0454fdd3a2c190ddd293f2666020e7460f008b67bc1e170ed6fc88507"
  - number: "3292"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Car for the Multitude"
    date: "1908 CE"
    region: "Michigan, USA"
    poem: |
      The Model T rolled out of Detroit, black and plain,
      And the automobile stopped being a rich man's toy.
      I watched farmers hitch their futures to it,
      Doctors reaching patients, families reaching towns.
      Fifteen million would be built; the world would pave itself.
      Ford paid his workers five dollars a day so they could buy one —
      The machine that made the machine's buyers.
      I rode in one of the first, bouncing down a dirt road,
      And felt the century accelerate under me.
    description: "The Model T rolls out and the automobile stops being a rich man's toy — the traveler rides one of the first down a dirt road and feels the century accelerate."
    status: "published"
    sha256: "7b1323ddde51a3f2b1a966354acbbecdd0c9a433d634b940ece365252aebbeb9"
  - number: "3293"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Fire from the Sky"
    date: "1908 CE"
    region: "Siberia, Russia"
    poem: |
      Something exploded over Tunguska —
      Two thousand square kilometers of forest flattened,
      Trees laid down in a perfect radial pattern, no crater, no answer.
      I walked that blasted taiga years later,
      The strange regrowth, the scorched silence.
      Comet? Asteroid? The sky keeps its counsel.
      The Evenki herders who saw it spoke of the fire god's anger.
      I have crossed between stars, and even I cannot tell you
      Exactly what fell that morning. Some mysteries stay mysteries.
    description: "Something explodes over Tunguska, flattening 2,000 square kilometers of Siberian forest with no crater — the traveler walks the blasted taiga and admits some mysteries stay mysteries."
    status: "published"
    sha256: "33f0a94dba7ef610ccee7e9dcff4f8caabce0694d19a1ba0c99ed152ddedfce4"
  - number: "3294"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Marathon's Famous Finish"
    date: "1908 CE"
    region: "England"
    poem: |
      Dorando Pietri staggered into the London stadium first,
      Then collapsed, rose, collapsed again —
      Officials half-carried him across the line, and he was disqualified.
      I was in the stands for that famous finish,
      The crowd roaring for a man who had nothing left.
      They gave the gold to the American who finished second,
      But the world remembered the Italian who fell.
      And the distance — 26 miles, 385 yards, measured that day for the Queen's view —
      Became the marathon forever: 26.2.
    description: "Dorando Pietri collapses at the 1908 Olympic marathon finish and is disqualified — the traveler was in the stands, and the measured distance becomes the marathon forever."
    status: "published"
    sha256: "2379274ce93e139c89ae1b47119dff18b1a936bc6fde700a3ce497b5b4ab27cb"
  - number: "3295"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Sultan Loses Power"
    date: "1908 CE"
    region: "Ottoman Empire"
    poem: |
      The Young Turks forced the Sultan to restore the constitution,
      And the absolute rule of the Ottomans cracked.
      I stood in Constantinople as the news spread,
      Parades in the streets, hope like a new season.
      They dreamed of a modern, constitutional empire —
      Liberty, equality, fraternity, Ottoman-style.
      The dream would curdle within years into war and deportation.
      But on that day, the crowd believed,
      And I let myself believe with them, for an afternoon.
    description: "The Young Turks force the Sultan to restore the Ottoman constitution — the traveler parades with the hopeful crowds, knowing the dream will curdle but believing for an afternoon."
    status: "published"
    sha256: "ed0a34caae64f3bf6dbe6671962b7019732affca684feab8a3a57292a10f4aea"
  - number: "3296"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Champion Who Broke the Line"
    date: "1908 CE"
    region: "Sydney, Australia"
    poem: |
      Jack Johnson beat Tommy Burns in Sydney
      And became the first Black heavyweight champion of the world.
      I watched him toy with Burns for fourteen rounds,
      Smiling, talking, untouchable — and the white world raged.
      They spent years hunting for a "great white hope" to take his crown.
      He held it until 1915, grinning all the way.
      A Black man, the strongest man on Earth, in 1908 —
      I have seen few braver things than that smile in that ring.
    description: "Jack Johnson beats Tommy Burns in Sydney to become the first Black heavyweight champion — the traveler watches him smile through fourteen rounds and calls it one of the bravest things he's seen."
    status: "published"
    sha256: "bb32babaa5393ae7b359a46b10ab80b856a3d36e3e12c26ffbbf67f92cee75a4"
  - number: "3297"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Thirty-Seven Minutes Over Water"
    date: "1909 CE"
    region: "France to England"
    poem: |
      Thirty-seven minutes over the Channel,
      Blériot in his monoplane, engine coughing, wind rising —
      And Britain was no longer an island.
      I stood on the Dover cliffs and watched him come,
      A speck growing into a man in a machine,
      Landing hard in a meadow, the crowd going mad.
      The moat that had stopped Napoleon and the Armada
      Was crossed by a Frenchman in half an hour.
      Islands are a state of mind. He proved it.
    description: "Blériot flies the English Channel in 37 minutes — the traveler watches from the Dover cliffs as the moat that stopped Napoleon is crossed by a Frenchman in a monoplane."
    status: "published"
    sha256: "fff077b405ac62c3c7f9e60bd7b9b830ca012a7c87c7f192c9e454330286a745"
  - number: "3298"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Pole Is Claimed"
    date: "1909 CE"
    region: "Arctic"
    poem: |
      Peary planted the American flag at the North Pole —
      Or said he did. The claim is disputed to this day.
      I know the Arctic, its white silence, its lying distances,
      And I know how badly men wanted to be first.
      Cook said he was there first; Peary said Cook lied;
      History is still arguing in the snow.
      What I know is this: men dragged sledges across the top of the world
      For the honor of standing where nothing stands.
      That hunger is real, whatever the coordinates say.
    description: "Peary claims the North Pole in 1909, a claim disputed ever since — the traveler knows the Arctic's lying distances and honors the hunger to stand where nothing stands."
    status: "published"
    sha256: "c2a22e7d6cb28d6423185383e6219166134aad54d8b690cfa9b5c949c890983b"
  - number: "3299"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Long Fight Organizes"
    date: "1909 CE"
    region: "New York, USA"
    poem: |
      W.E.B. Du Bois and his allies founded the NAACP,
      And the long fight got an address and a letterhead.
      I sat in those early meetings, Black and white together,
      Planning lawsuits and boycotts in an age of lynchings.
      It would take sixty years of that grinding work
      To crack the laws of Jim Crow.
      Organizations are unromantic things — minutes, dues, committees.
      This one bent the arc of a nation.
    description: "Du Bois and allies found the NAACP in 1909 — the traveler sits in the early meetings and calls it an unromantic machine of minutes and dues that bent the arc of a nation."
    status: "published"
    sha256: "b418e5ee68dadb9ffe80453d55000adf4a3f6e7b0b1f49ec85e1bc7c8a232ff4"
  - number: "3300"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Shopping Becomes Theater"
    date: "1909 CE"
    region: "London, England"
    poem: |
      Selfridge's opened on Oxford Street,
      And shopping became theater — "the customer is always right."
      I walked those marble aisles on opening week,
      Perfume, light, displays like stage sets.
      Harry Selfridge had worked for Marshall Field in Chicago
      And brought American showmanship to London shopping.
      The department store: a palace where anyone could enter
      And everyone was treated like someone.
      Consumerism's cathedral, and I watched them build it.
    description: "Selfridge's opens on Oxford Street and invents the modern department store — the traveler walks the marble aisles and calls it consumerism's cathedral."
    status: "published"
    sha256: "e32bb61dff11a04f253ef196f209c15ceb4693f7897bf18caf601f4a00cf0f7f"
  - number: "3301"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Comet Returns"
    date: "1910 CE"
    region: "Worldwide"
    poem: |
      Halley's Comet returned, and the world panicked politely —
      The tail would pass through Earth's orbit, and astronomers said it held cyanogen.
      Comet pills sold by the thousand; people sealed their windows.
      I stood in a field and watched it come,
      That smudged torch in the sky, beautiful and utterly harmless.
      The Earth passed through the tail and nobody felt a thing.
      Seventy-six years it takes to circle the sun —
      I have watched it come and go more times than I can count.
    description: "Halley's Comet returns in 1910 and crowds buy comet pills against its tail — the traveler watches from a field as Earth passes through harmlessly."
    status: "published"
    sha256: "3cd9d84e3e4261596fd963011f05b4e59d7c34ac8a4c2f4a05de8f04bc54a235"
  - number: "3302"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Korea Is Swallowed"
    date: "1910 CE"
    region: "Korea"
    poem: |
      Japan formally annexed Korea, and a kingdom disappeared into an empire.
      I walked the streets of Seoul as the proclamations went up,
      The quiet fury of a people told they no longer existed.
      The independence fight went underground —
      Into exile, into secret societies, into the long patience of the occupied.
      Thirty-five years Korea would wait.
      I have watched nations swallowed before; they are never digested.
      Korea remembered its name the whole time.
    description: "Japan formally annexes Korea in 1910 — the traveler walks the streets of Seoul and notes that swallowed nations are never digested; Korea remembered its name."
    status: "published"
    sha256: "a1dadeb9ac9af4b605e48e16102cd002b7aa7281a45dafb9ad5b9be57017391c"
  - number: "3303"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Viva la Revolución"
    date: "1910 CE"
    region: "Mexico"
    poem: |
      Madero called for revolt, and Diaz's thirty-four-year rule began to crumble.
      I rode with the early rebels in the north,
      Farmers and cowboys against the rurales, hope against the machine guns.
      The Mexican Revolution would eat its own children for a decade —
      Zapata, Villa, Madero himself, all dead by treachery or battle.
      But it began with a call, a plan, a date: November 20.
      Revolutions start with paperwork and end in blood.
      I was there for the paperwork.
    description: "Madero calls for revolt against Diaz's 34-year rule — the traveler rides with the early rebels, knowing the revolution will eat its children for a decade."
    status: "published"
    sha256: "6fd12bf36bee13365b15491b79ac8530019a00fd46553d687baa8f5c786735fd"
  - number: "3304"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Union Is Born"
    date: "1910 CE"
    region: "South Africa"
    poem: |
      Four colonies united as the Union of South Africa —
      Under white rule, by white votes, for white futures.
      I stood at the ceremonies, the flags, the speeches,
      And watched the Black majority written out of the nation
      As if they were not there, as if the land were empty.
      It was the legal birth of apartheid's machinery,
      Decades before the word.
      The Union was born; justice was not invited to the christening.
    description: "Four colonies unite as the Union of South Africa under white rule — the traveler watches the Black majority written out of the nation at its christening."
    status: "published"
    sha256: "eafd8d4e2225c5578bd59259102e7c092ee100a63f994bb4a288e3bfac61395b"
  - number: "3305"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Lady with the Lamp"
    date: "1910 CE"
    region: "England"
    poem: |
      Florence Nightingale died in 1910, ninety years old,
      And nursing is a profession because of her.
      I had seen her in the Crimea, lamp in hand among the dying,
      And seen her come home to spend fifty years
      Building the schools and statistics that made care a science.
      She was fierce, difficult, brilliant — no plaster saint.
      The lamp was real. So was the will behind it.
      I stood at her funeral and thought of every nurse
      Who ever walked a night ward. They all carry her lamp.
    description: "Florence Nightingale dies at 90 — the traveler remembers her lamp in the Crimea and says every nurse who ever walked a night ward carries it still."
    status: "published"
    sha256: "2651be5a32e0da5c156fddb00cde7b14089616579e1bf9962229340e4e54b82b"
  - number: "3306"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Qing Fall"
    date: "1911 CE"
    region: "China"
    poem: |
      Two thousand years of emperors ended in 1911,
      The Qing fell to revolution, and China became a republic.
      I watched the queue-cutting in the streets —
      Men shearing off the braids that had marked submission for centuries,
      Laughing, weeping, free.
      Sun Yat-sen's dream, bought with uprisings and exiles.
      What followed was warlords and chaos, not the promised republic —
      But the emperors were gone, and they were never coming back.
      The braid lay in the street. I stepped over history.
    description: "Revolution topples the Qing dynasty, ending 2,000 years of emperors — the traveler watches men shear off their queues in the streets and steps over history."
    status: "published"
    sha256: "129deb63b61ec60e705f9c34a24d29c1b2d6ea8ace17567fcba0a4098d43d837"
  - number: "3307"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "First to the Bottom of the World"
    date: "1911 CE"
    region: "Antarctica"
    poem: |
      Amundsen's dogsled team reached the South Pole,
      Beating Scott by a month — planning beating heroism.
      I know that white desert, the cold that kills in minutes,
      And I honor both men: the Norwegian who prepared for everything
      And the Englishman who froze with his friends, writing to the end.
      Scott's party died on the way back, eleven miles from supply.
      Amundsen left a tent and a letter for his rival.
      The Pole doesn't care who was first. But we do.
    description: "Amundsen reaches the South Pole by dogsled, beating Scott — the traveler honors both the Norwegian's planning and the Englishman's frozen dignity."
    status: "published"
    sha256: "48af5d6c1fc83cabc11aff1a650f970c6d5a3d5c0c102b075374bf96f5905ec9"
  - number: "3308"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Fire That Changed Work"
    date: "1911 CE"
    region: "New York, USA"
    poem: |
      One hundred forty-six garment workers died in the Triangle fire —
      Locked doors, a single fire escape that collapsed, girls jumping.
      I stood on Greene Street and watched them fall,
      Young women, mostly immigrants, some still teenagers.
      The city wept, then the city acted:
      Labor law was born in those ashes, fire codes, the forty-hour week.
      Every workplace safety rule you know
      Was written in the smoke of that Saturday afternoon.
    description: "146 garment workers die in the Triangle Shirtwaist fire — locked doors, a collapsed fire escape — and the traveler says every workplace safety rule was written in that smoke."
    status: "published"
    sha256: "2cf1f52d59b675bd774a091935d665169a86f40194bf637c572721411b9dd34c"
  - number: "3309"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Smile Disappears"
    date: "1911 CE"
    region: "Paris, France"
    poem: |
      The Mona Lisa was stolen from the Louvre,
      And Paris lost its mind — the most famous missing woman in the world.
      I watched the crowds gather where the empty hooks were,
      Staring at a blank wall, loving her more in absence.
      A handyman had carried her out under his coat, meaning to return her to Italy.
      She came back two years later, world-famous —
      The theft made her the most recognized face on Earth.
      Sometimes, I thought, you have to lose a thing to see it.
    description: "The Mona Lisa is stolen from the Louvre and crowds gather to stare at the empty hooks — the traveler notes the theft made her the most recognized face on Earth."
    status: "published"
    sha256: "4b74b3d7d641e7a053bb4a6ee0df6e65566aafa77ffb6152bd463368bc3017a3"
  - number: "3310"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Twice Crowned"
    date: "1911 CE"
    region: "Sweden"
    poem: |
      Marie Curie won her second Nobel —
      The first person honored in two different sciences.
      I had watched her stir boiling pitchblende in a shed in Paris,
      Hands burned, back aching, chasing the invisible.
      Physics, then chemistry: radium and polonium,
      The elements she pulled from the dark with her own hands.
      The radiation that made her famous would kill her.
      She knew. She worked anyway.
    description: "Marie Curie wins her second Nobel, the first person honored in two sciences — the traveler remembers her stirring pitchblende in a Paris shed, working toward the radiation that would kill her."
    status: "published"
    sha256: "05b528a85c959a5b8b9924994447c16b90ef8c75ca56159b9a72aab80db98980"
  - number: "3311"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Unsinkable Sinks"
    date: "1912 CE"
    region: "North Atlantic"
    poem: |
      The Titanic struck the iceberg at 11:40 at night,
      And the unsinkable ship went down in two hours forty minutes.
      I was not aboard, but I stood on the Carpathia's deck at dawn
      When the lifeboats came alongside, and heard the silence.
      Fifteen hundred dead in the freezing dark —
      The band playing, the millionaires and the steerage alike.
      The century's great lesson in hubris, taught in one night:
      The sea does not read press releases.
    description: "The Titanic strikes an iceberg and sinks on her maiden voyage — the traveler stands on the Carpathia's deck at dawn and calls it the century's lesson in hubris."
    status: "published"
    sha256: "bdae338c34de951231a2a8b8b6ff60668ea747aa849be81dee4aed34e0bfb16b"
  - number: "3312"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Balkans Boil Over"
    date: "1912 CE"
    region: "Balkans"
    poem: |
      The Balkan states drove the Ottomans almost entirely out of Europe,
      Serbia, Greece, Bulgaria, Montenegro — the small nations' war.
      I walked those mountain battlefields, ancient hatreds in modern uniforms,
      And watched the victors turn on each other within months.
      The Balkans were the powder keg of Europe, everyone said —
      And they were right, though no one knew how right.
      Two years later a Serb student in Sarajevo
      Would light the fuse that burned the world.
    description: "The Balkan states drive the Ottomans out of Europe, then turn on each other — the traveler walks the mountain battlefields knowing Sarajevo is two years away."
    status: "published"
    sha256: "7aea34ed3886d0b9b54285aa024b3c8755872e9219f892ece10acc4d42680824"
  - number: "3313"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Skull That Lied"
    date: "1912 CE"
    region: "England"
    poem: |
      The Piltdown skull was unveiled as the missing link,
      And science believed the lie for forty years.
      I stood in the museum and looked at that doctored bone —
      A human cranium married to an ape's jaw, stained to look ancient.
      Someone had built it as a joke or a fraud, and the experts
      Saw what they wanted to see: an English ancestor with a big brain.
      It took chemistry, not wisdom, to expose it.
      Wanting to believe is the oldest laboratory error.
    description: "The Piltdown skull is unveiled as the missing link, fooling science for forty years — the traveler calls wanting to believe the oldest laboratory error."
    status: "published"
    sha256: "5db56c393736dc47a1783ad415ecf55660cc6e4545e63a7ea52f314383209e2a"
  - number: "3314"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Girl Scouts Begin"
    date: "1912 CE"
    region: "Georgia, USA"
    poem: |
      Juliette Gordon Low founded the Girl Scouts in Savannah,
      Twelve girls, a promise, and a deaf woman with a mission.
      I watched those first meetings — knots, first aid, campfires —
      Girls learning they could do anything the boys did, outdoors.
      She poured her fortune into it and her health too.
      A century later, millions of women trace their courage
      To a troop, a badge, a campfire in the woods.
      It started with one woman who believed girls deserved the wild.
    description: "Juliette Gordon Low founds the Girl Scouts in Savannah — the traveler watches the first meetings and says millions of women's courage traces back to a troop and a campfire."
    status: "published"
    sha256: "60c10e9a08b4f4f5c267f408a07b258ede5184f75d5d3941fbbe643b918f8712"
  - number: "3315"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Greatest Athlete"
    date: "1912 CE"
    region: "Sweden"
    poem: |
      Jim Thorpe won the pentathlon and the decathlon at Stockholm —
      The king of Sweden called him the greatest athlete in the world.
      I watched him run, jump, throw, dominate every event,
      A Sac and Fox Indian who had survived the boarding schools.
      Then they stripped his medals for playing semi-pro baseball,
      For a few dollars, years before.
      The medals came back in 1983, thirty years after he died.
      Justice, like the Olympics, runs on its own slow schedule.
    description: "Jim Thorpe wins the pentathlon and decathlon, then is stripped of his medals for playing semi-pro baseball — the traveler notes justice runs on its own slow schedule; they came back thirty years after his death."
    status: "published"
    sha256: "06752a26cd0c00e36a69c9065107a5be494b63476a9d537ad0d5e0a773719ab2"
  - number: "3316"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Modern Art Invades America"
    date: "1913 CE"
    region: "New York, USA"
    poem: |
      The Armory Show brought Duchamp and Matisse to New York,
      And America argued about art in the newspapers for months.
      I walked the crowded galleries, hearing the outrage —
      "Nude Descending a Staircase" mocked as "an explosion in a shingle factory."
      But the young artists stood before those canvases and felt the future.
      Modernism landed in America in that armory,
      And American art was never provincial again.
      I love a good scandal that turns out to be a birth.
    description: "The Armory Show brings modern art to New York and America argues about it for months — the traveler loves a scandal that turns out to be a birth."
    status: "published"
    sha256: "5bb49eb902ba94f57e5e2ec33dfd44263ac3d3e5d4db9c89aa2a4e40916c1f51"
  - number: "3317"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Atom Gets an Address"
    date: "1913 CE"
    region: "Denmark"
    poem: |
      Niels Bohr gave the atom an address —
      Electrons in orbits, jumping between them, the quantum atom.
      I sat in Copenhagen while he worked it out,
      A young Dane making the invisible orderly.
      Rutherford had found the nucleus; Bohr gave it architecture.
      The model was wrong in the details and right in the soul —
      The first true map of the smallest country there is.
      Every atom in your body obeys the rules he found.
    description: "Niels Bohr models the atom with electrons in orbits — the traveler calls it the first true map of the smallest country there is."
    status: "published"
    sha256: "9ea1d606757197b5ac5afe19ed3efb00f5e6007673b3347031f78f28b6d6f829"
  - number: "3318"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Night Music Rioted"
    date: "1913 CE"
    region: "Paris, France"
    poem: |
      Stravinsky's Rite of Spring premiered in Paris,
      And the audience nearly rioted — shouting, fistfights, the police.
      I was in that theater, the music pounding like a pagan heart,
      Dancers stomping out a sacrifice to spring.
      The old Paris of pretty ballets was not ready.
      But art doesn't ask permission; it just arrives, loud.
      Within years the riot became the repertoire.
      That's how the future usually enters — through a slammed door.
    description: "The Rite of Spring premieres in Paris and the audience nearly riots — the traveler was in the theater and says the future usually enters through a slammed door."
    status: "published"
    sha256: "d3fc1dca141957608664c1b4b58705c3c456623d6f2b3192a7ab720b069e9402"
  - number: "3319"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Line That Never Stops"
    date: "1913 CE"
    region: "Michigan, USA"
    poem: |
      Ford's moving assembly line cut a car's build time from hours to minutes,
      The line that never stops, the men who became its hands.
      I walked beside that first endless belt in Highland Park,
      Watching chassis glide past while men did one motion, all day.
      It made the car cheap and the worker a cog —
      Both true at once, which is the trouble with progress.
      The century learned to build everything this way:
      Faster, cheaper, and the human being as a station on the line.
    description: "Ford's moving assembly line cuts car build time from hours to minutes — the traveler walks beside the first endless belt and sees the human being become a station on the line."
    status: "published"
    sha256: "08ec180a71e3bbeee3f67178de5e830382a4733352ddd44c04ca27d4952e8720"
  - number: "3320"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "India's First Film"
    date: "1913 CE"
    region: "India"
    poem: |
      India's first feature film premiered in Bombay —
      A myth on screen, in silence: the story of King Harishchandra.
      I sat in that dark hall while gods and kings flickered,
      And watched an audience see its own epics move for the first time.
      Dadasaheb Phalke had built it all from nothing —
      Camera, studio, actors, the whole dream, Indian-made.
      Bollywood's first ancestor was a silent myth.
      Every song-and-dance spectacular since is its grandchild.
    description: "India's first feature film premieres in Bombay — a silent myth of King Harishchandra, and the traveler watches an audience see its own epics move for the first time."
    status: "published"
    sha256: "3a0842d5fa7ea693e02fbef10d34e3d81351fda8d38dd8301d972302205654a8"
  - number: "3321"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Steel That Won't Rust"
    date: "1913 CE"
    region: "England"
    poem: |
      In Sheffield they invented stainless steel,
      And cutlery would never rust again.
      I held one of the first bright knives,
      Clean, shining, immune to time and tea.
      Harry Brearley was trying to stop gun barrels eroding;
      He got the modern kitchen instead.
      That's how invention works — you aim at one thing
      And hit the future sideways.
    description: "Stainless steel is invented in Sheffield — the traveler holds a bright first knife and notes invention aims at one thing and hits the future sideways."
    status: "published"
    sha256: "6ed73104bfe864a97b60635cd7a0beb3cd04f30f7168214199d4385e92ae9c71"
  - number: "3322"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Shot That Lit the World"
    date: "1914 CE"
    region: "Sarajevo, Bosnia"
    poem: |
      A nineteen-year-old with a pistol in Sarajevo,
      Two shots — an archduke and his wife, dead in an open car.
      I was on that street, Franz Josef Street, and heard the cracks,
      And felt the world tilt on its axis.
      Gavrilo Princip wanted Bosnia free; he got the Great War instead.
      One teenager's bullets, and the alliance dominoes fell —
      Sixteen million dead because a driver took a wrong turn.
      History doesn't always need a reason. Sometimes it just needs a corner.
    description: "A teenager's pistol kills Archduke Franz Ferdinand in Sarajevo — the traveler was on the street and says sixteen million died because a driver took a wrong turn."
    status: "published"
    sha256: "043be6f0a29475c9204e30c195ecbb91e88eef9a3bcd6c244cfd388924aeb15b"
  - number: "3323"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Ultimatum"
    date: "1914 CE"
    region: "Vienna, Austria"
    poem: |
      Austria-Hungary sent Serbia an ultimatum designed to be refused,
      Then declared war — and the alliance dominoes started to fall.
      I sat in the cafés of Vienna as the mobilization posters went up,
      Young men cheering in the streets, flowers on the rifles.
      They called it a fresh and merry war. It would last a month, they said.
      Russia mobilized, Germany mobilized, France mobilized —
      The timetables took over, and no one could stop the trains.
      I watched the cheering and wanted to scream.
    description: "Austria-Hungary declares war on Serbia and the alliance dominoes fall — the traveler watches Vienna cheer for a war that will last a month, they said."
    status: "published"
    sha256: "8345316c791b2614b1be713168ac3b335a16e225dabaa84a390cffa2c761a45c"
  - number: "3324"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Through Neutral Belgium"
    date: "1914 CE"
    region: "Belgium"
    poem: |
      Germany marched through neutral Belgium,
      And Britain declared war within days — the scrap of paper.
      I stood on the roads as the gray columns came,
      Refugees streaming the other way, carrying everything.
      Louvain burned; civilians were shot as franc-tireurs.
      Belgium, the little country that said no,
      Paid for its neutrality in blood and ruins.
      The Schlieffen Plan needed Belgium's roads.
      Belgium needed only to be left alone.
    description: "Germany marches through neutral Belgium and Britain declares war — the traveler stands on the roads as refugees stream past and Louvain burns."
    status: "published"
    sha256: "9329bbfa4eb1bee3199e8da3534d65bba028d329e66fdfd236fbe5deb62c84f4"
  - number: "3325"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Trap in the East"
    date: "1914 CE"
    region: "East Prussia"
    poem: |
      At Tannenberg the Germans encircled a Russian army
      And destroyed it — three hundred thousand casualties in days.
      I walked that battlefield of lakes and forests,
      Where Samsonov's men starved in the woods and their general shot himself.
      Hindenburg became a legend; Russia began its long bleeding.
      The East would devour armies for four years,
      But Tannenberg was the first great trap —
      And the Russians walked in with their bands playing.
    description: "Germany encircles and destroys a Russian army at Tannenberg — the traveler walks the battlefield of lakes and forests where an empire began its long bleeding."
    status: "published"
    sha256: "a6985b4ae87b5cca5668ef502dc37443d73be68ef9e60ac101109a994796bfc6"
  - number: "3326"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Taxis to the Front"
    date: "1914 CE"
    region: "France"
    poem: |
      Paris taxicabs ferried troops to the Marne —
      Six hundred taxis, headlights blazing through the night.
      I rode with them, those brave cabbies,
      Racing to plug the gap while the Germans bore down on Paris.
      The Marne held. The German advance was stopped.
      France was saved, this time, by taximeters and courage.
      The "miracle of the Marne" — really just men refusing to lose,
      Delivered by the most Parisian army ever assembled.
    description: "Paris taxicabs ferry troops to the Marne and the German advance is stopped — the traveler rides with the cabbies in the most Parisian army ever assembled."
    status: "published"
    sha256: "adeb222493a7c15513f9bac315da59fbce0af6ec902ad3af8b44b85543b671e3"
  - number: "3327"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Race to the Sea Ends"
    date: "1914 CE"
    region: "Belgium"
    poem: |
      The last open flank closed, and the trenches began —
      From Switzerland to the sea, four hundred miles of mud and wire.
      I walked that first winter line, the digging still fresh,
      Men learning to live like moles under the guns.
      The war of movement died in those ditches;
      The war of attrition was born, and would eat a generation.
      They called it the Western Front. It was really a wound
      Four hundred miles long that would not close for four years.
    description: "The race to the sea ends and the trenches stretch from Switzerland to the sea — the traveler walks the first winter line and calls it a four-hundred-mile wound."
    status: "published"
    sha256: "3556ef9bfa38c6f2595ab5712e81d1642b7e1532e42ae23ef7e7e19b2c50a71e"
  - number: "3328"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Two Oceans Joined"
    date: "1914 CE"
    region: "Panama"
    poem: |
      The Panama Canal opened in 1914 —
      Two oceans joined, the Horn rounded no more.
      I stood on the first ships through the locks,
      The jungle cut open, the waters lifted stair by stair.
      Ten years of digging, five thousand dead workers,
      And the world got smaller by eight thousand miles.
      While Europe dug trenches, America dug a canal.
      Both were wounds in the earth. Only one was meant to heal trade.
    description: "The Panama Canal opens, joining two oceans — the traveler stands on a first ship through the locks, noting Europe dug trenches while America dug a canal."
    status: "published"
    sha256: "0485d67ed00e2abbfffd80477d3bc0edb691b3fcb125570c5bae319b49b9da43"
  - number: "3329"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Japan Joins the War"
    date: "1914 CE"
    region: "China"
    poem: |
      Japan besieged Germany's Chinese port at Tsingtao,
      And took Germany's Pacific islands for good measure.
      I watched the Japanese fleet arrive off the Shantung coast,
      Britain's ally in the East, efficient and ambitious.
      They fought well — and they kept what they took.
      The war gave Japan a taste for empire,
      And the Twenty-One Demands on China followed within months.
      Every ally, I thought, is collecting debts the future will pay.
    description: "Japan besieges Germany's port at Tsingtao and takes its Pacific islands — the traveler watches Britain's efficient ally and sees it collecting debts the future will pay."
    status: "published"
    sha256: "14c626cb29a121f77b1e78c013bfcef10064f4d8e3526749a0c088fa05018d58"
  - number: "3330"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Defeat off Chile"
    date: "1914 CE"
    region: "Chile"
    poem: |
      Off Coronel, Chile, a German squadron sank two British cruisers —
      Britain's first naval defeat in a century.
      I heard the news travel like a cold wind through London,
      The empire's invincibility dented in one afternoon.
      Admiral von Spee's victory lasted five weeks —
      At the Falklands the British avenged Coronel completely.
      The sea gives, the sea takes back.
      I watched both battles' shadows from the shore
      And learned again: no navy rules forever.
    description: "A German squadron sinks two British cruisers off Chile, avenged weeks later at the Falklands — the traveler learns again that no navy rules forever."
    status: "published"
    sha256: "6c9740a8dd74eb6c8ea34b398fbd00576546d54d9673a63edefd36290e7260ab"
  - number: "3331"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Night the Guns Stopped"
    date: "1914 CE"
    region: "Western Front"
    poem: |
      On Christmas Eve the guns stopped,
      And men climbed out of the trenches — British and German —
      Trading gifts, burying the dead together, playing football in no-man's-land.
      I walked that strange peace, the frost glittering,
      Enemies singing each other's carols across the wire.
      The generals were furious; the men were human.
      It never happened again — the war machine learned to forbid it.
      But for one night, the soldiers voted with their feet,
      And peace won, briefly, unofficially.
    description: "British and German soldiers climb out of their trenches on Christmas 1914, trading gifts and playing football — the traveler walks that strange peace the generals furiously forbade ever after."
    status: "published"
    sha256: "2ad42e151fe391f8be2cbeb374cf7ba93154b96b1019275adee7ba9ac1231b69"
  - number: "3332"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Little Fellow Arrives"
    date: "1914 CE"
    region: "USA"
    poem: |
      Charlie Chaplin's Tramp shuffled onto the screen in 1914 —
      Baggy pants, cane, bowler hat, the century's most beloved clown.
      I sat in the dark and watched the world fall in love
      With a little fellow who owned nothing and feared nothing.
      Through the war years to come, through the Depression,
      That Tramp would make millions laugh who had nothing to laugh about.
      Comedy is courage in a funny hat.
      Chaplin knew. The Tramp knew.
    description: "Chaplin's Tramp shuffles onto the screen in 1914 — the traveler watches the world fall in love with a little fellow who owned nothing, and calls comedy courage in a funny hat."
    status: "published"
    sha256: "c3503fe618e4b65e244e4e383a7d246fc7521b68eea5b7a64fc35e2722eb2dfe"
  - number: "3333"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Stop and Go"
    date: "1914 CE"
    region: "Ohio, USA"
    poem: |
      Cleveland installed the first electric traffic light —
      Red and green, stop and go, at Euclid and 105th.
      I stood on that corner and watched the future arrive:
      The automobile age would need rules, and here was the first.
      A policeman in a booth worked the switch by hand.
      Soon the lights would time themselves, and the cities would pulse
      In red-green rhythms, obedient as a heartbeat.
      Civilization is just traffic management, scaled up.
    description: "Cleveland installs the first electric traffic light — the traveler stands on the corner and calls civilization traffic management, scaled up."
    status: "published"
    sha256: "3a8e5f76d55626f0758f632e373bd985c4743320a00e4d7059ed0a8f3d407660"
  - number: "3334"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "A Pope for Wartime"
    date: "1914 CE"
    region: "Vatican City"
    poem: |
      Benedict XV was elected in 1914
      And spent the whole war begging for peace.
      I heard his pleas go out — to the palaces, to the trenches —
      "Useless slaughter," he called it, and he was right.
      Both sides claimed God; he claimed neither, only mercy.
      The powers ignored him, as powers do.
      But in the prisoner camps his relief work fed the starving,
      And history remembers the voice that said stop
      When every other voice said onward.
    description: "Benedict XV is elected and spends WWI begging for peace, calling it \"useless slaughter\" — the traveler honors the voice that said stop when every other said onward."
    status: "published"
    sha256: "bcd99d6977b0d44bd6beb95d1e03e11eec97971323a8355e156eca9bf0c7a73a"
  - number: "3335"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Shore of ANZAC"
    date: "1915 CE"
    region: "Turkey"
    poem: |
      At dawn the ANZACs stormed the cliffs at Gallipoli —
      Australians and New Zealanders, into Turkish fire.
      I was on those beaches, the water red at the shoreline,
      Young men climbing where no army could climb.
      The campaign was a legend of courage and waste —
      Eight months, a hundred thousand dead, evacuation in the night.
      But Australia and New Zealand were born there,
      Not in parliaments but in the blood and the mateship.
      Nations are baptized in strange waters.
    description: "ANZAC troops storm the cliffs at Gallipoli in a campaign of courage and waste — the traveler was on the beaches and says two nations were baptized in those waters."
    status: "published"
    sha256: "e50e4ad23a697017d14d912a1bc6b1659cb8dab90fecaca9c153d1b299644da2"
  - number: "3336"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Deportations Begin"
    date: "1915 CE"
    region: "Ottoman Empire"
    poem: |
      In April 1915 the Ottoman authorities rounded up Armenian leaders —
      And a million and a half Armenians would die.
      I walked the deportation roads, the desert columns,
      Women and children driven without water, without mercy.
      The century's great unacknowledged crime —
      Denied still, a hundred years on, by the heirs of the killers.
      I held the hands of the dying and could do nothing.
      Remember this when the world says "never again"
      And means it only until the next time.
    description: "The Ottoman roundup of Armenian leaders begins a genocide that will kill 1.5 million — the traveler walks the deportation roads and holds the hands of the dying."
    status: "published"
    sha256: "b1b86caba6a9c5683051ed28b8733326396030c78c9a5e102940f615e05962a8"
  - number: "3337"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Ship That Sank a Neutral"
    date: "1915 CE"
    region: "Atlantic"
    poem: |
      A U-boat sank the Lusitania off Ireland —
      1,198 dead, and America edged toward war.
      I had seen her sail from New York, the great greyhound,
      And I read the German warnings in the newspapers beside her sailing notice.
      She carried munitions; she carried civilians; the torpedo did not distinguish.
      The dead included 128 Americans, and the outrage crossed the ocean.
      Ships sink. But some sinkings steer history.
      This one steered America toward the trenches.
    description: "A U-boat sinks the Lusitania with 1,198 dead — the traveler saw her sail from New York and says some sinkings steer history; this one steered America toward war."
    status: "published"
    sha256: "49b4ed7836037b8897e79ede5723fd599b0764c69a442655e14019c7ea024dcb"
  - number: "3338"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Gas Comes"
    date: "1915 CE"
    region: "Belgium"
    poem: |
      At Ypres the Germans opened the cylinders,
      And chlorine gas rolled over the trenches — poison entered modern war.
      I watched the green-yellow cloud come, silent, low,
      And men drowning on dry land, clawing at their masks.
      The French colonial troops broke; the Canadians held, urinating on handkerchiefs.
      War had found a new cruelty, and both sides would use it.
      I have seen many weapons. Gas is the coward's masterpiece —
      It kills the air itself.
    description: "Germany releases chlorine gas at Ypres — the traveler watches the green-yellow cloud roll in and calls gas the coward's masterpiece: it kills the air itself."
    status: "published"
    sha256: "ead0c1ae77acdc5ad6cf29818e7c064e6047d146bd3e6e625e8b478ed4470f78"
  - number: "3339"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Gravity Becomes Geometry"
    date: "1915 CE"
    region: "Berlin, Germany"
    poem: |
      In wartime Berlin, Einstein finished general relativity:
      Gravity is not a force — it is the curve of space itself.
      I sat in his study while the equations settled,
      The universe bending around every mass like a trampoline.
      Matter tells space how to curve; space tells matter how to move.
      He was forty-six, at war with no one, at peace with the cosmos.
      The most beautiful idea of the century,
      Born in the ugliest years of the century.
    description: "Einstein completes general relativity in wartime Berlin — gravity as the curve of space itself, and the traveler calls it the century's most beautiful idea born in its ugliest years."
    status: "published"
    sha256: "33c89fd048fbd335cb3ab01ba91cca5765055c9cd13ef027e59536aef6c58d08"
  - number: "3340"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Blockbuster Is Born"
    date: "1915 CE"
    region: "USA"
    poem: |
      Griffith's Birth of a Nation invented the feature film —
      Three hours, battle scenes, close-ups, the whole grammar of cinema.
      I sat in the theater, stunned by the craft,
      And sickened by the lie: it glorified the Ku Klux Klan.
      President Wilson screened it at the White House.
      The NAACP protested; the Klan used it as a recruiting film.
      Art and poison in the same reel —
      The blockbuster was born, and it was born compromised.
    description: "Birth of a Nation invents the feature film and glorifies the Klan — the traveler sits stunned by the craft and sickened by the lie: the blockbuster was born compromised."
    status: "published"
    sha256: "793c9e46949a8422074fd8a1487791b2cee2cdadd32bc50d4d7d957b61aaa407"
  - number: "3341"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Terror from the Sky"
    date: "1915 CE"
    region: "England"
    poem: |
      Zeppelins bombed London, and war came to civilians from the air.
      I stood in the dark streets during the raids,
      Searchlights sweeping, the great silver shapes humming overhead.
      The bombs fell on houses, on shops, on sleeping children —
      The front line had moved to the nursery.
      People called them Zepp raids and carried on.
      But something had changed forever: the sky was no longer safe.
      Every bombing campaign since began in that humming dark.
    description: "Zeppelins bomb London in 1915 — the traveler stands in the dark streets and says the front line moved to the nursery; the sky was never safe again."
    status: "published"
    sha256: "c7e99f1a52d5e55fb67d8b28bb9ec87e595943dba0e71059ff5b6da4e049dfde"
  - number: "3342"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Nurse Who Wouldn't Lie"
    date: "1915 CE"
    region: "Belgium"
    poem: |
      Edith Cavell was shot at dawn for helping Allied soldiers escape —
      Two hundred of them, hidden, fed, guided to Holland.
      I stood outside the prison in Brussels that October morning,
      And heard the rifles at 7 a.m.
      She would not lie to save herself; "patriotism is not enough," she said.
      Her courage shamed an empire and recruited armies —
      The Germans made a martyr and paid for it in enlistments.
      One nurse, one firing squad, and the moral math of war, exposed.
    description: "Edith Cavell is shot for helping Allied soldiers escape — the traveler stands outside the Brussels prison at dawn and says the Germans made a martyr and paid in enlistments."
    status: "published"
    sha256: "fcfbb0b6e91d06370f4a672444e81553ec71a3a782aed79f6ec92c8805b27c9c"
  - number: "3343"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Italy Switches Sides"
    date: "1915 CE"
    region: "Italy"
    poem: |
      Italy abandoned its old allies and joined Britain and France —
      The Triple Alliance became a double, and the Alps became a front.
      I watched the Italian army march into the mountains,
      Into the Isonzo meat grinder, twelve battles for a few miles.
      They came for territory promised in a secret treaty —
      Trentino, Trieste, the national dream.
      Alliances, I learned in that war, are just interests
      Wearing the uniform of friendship.
    description: "Italy abandons the Triple Alliance and joins Britain and France — the traveler watches the army march into the Isonzo meat grinder and learns alliances are interests in friendship's uniform."
    status: "published"
    sha256: "e19369c360ed6511676122f74236e1612dc90de7433dd10867aa13f2a8b5b17c"
  - number: "3344"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Women Against the War"
    date: "1915 CE"
    region: "The Hague, Netherlands"
    poem: |
      Over a thousand women met at The Hague to demand an end to the war —
      Jane Addams, Aletta Jacobs, women the warring states called traitors.
      I sat in that hall, the only peace conference of 1915,
      While the men at the front kept killing by the hundred thousand.
      They sent delegations to every capital; every capital declined.
      But they founded the Women's International League,
      And the idea survived the war: women, organized, against war.
      The generals laughed. The idea outlived the generals.
    description: "Over a thousand women meet at The Hague in 1915 to demand an end to the war — the traveler sits in the only peace conference of the year and says the idea outlived the generals."
    status: "published"
    sha256: "90f73a2d8fa3a4c6a6c5862f81af952afbdc4277128e629add3d7181c309249c"
  - number: "3345"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Mill at Verdun"
    date: "1916 CE"
    region: "France"
    poem: |
      Verdun: Germany's plan to bleed France white,
      Three hundred days, seven hundred thousand casualties.
      I walked that battlefield — the forts, the ossuary, the hills of bones —
      And the words on the memorials: ILS NE PASSERONT PAS. They shall not pass.
      Pétain's noria rotated men through the mill like grain.
      France held. France bled. France never forgot.
      I picked up a handful of that soil; it was half iron, half bone.
      Some ground is sacred. Some ground is just scarred.
      Verdun is both.
    description: "The Battle of Verdun grinds for 300 days with 700,000 casualties — the traveler walks the ossuary hills and picks up soil that is half iron, half bone."
    status: "published"
    sha256: "c60e9853326f15a1d6a419ddf6f5191e0a84028efb15370206ade3f76d488d12"
  - number: "3346"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Bloodiest Day"
    date: "1916 CE"
    region: "France"
    poem: |
      On July 1, 1916, the British lost sixty thousand men in a single day —
      Twenty thousand dead before lunch, walking into machine guns.
      I was there at the Somme, in the chalk and the wire,
      And watched the flower of England mown down in rows.
      The Somme ground on for five months, a million casualties,
      For six miles of mud.
      Lions led by donkeys, they said later.
      I say: boys led by old men who had learned nothing.
      The poppies grow there still, red as the ledgers.
    description: "On July 1, 1916, Britain loses 60,000 men in a day at the Somme — the traveler was in the chalk and wire and says the poppies grow there still, red as the ledgers."
    status: "published"
    sha256: "bf42b91d8d5050957fd1a15402a76c89d1b2927f935ea0e2dd8722789a8c3959"
  - number: "3347"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "A Rising in Easter Week"
    date: "1916 CE"
    region: "Dublin, Ireland"
    poem: |
      In Easter week the rebels seized Dublin's post office —
      Pearse read the proclamation, and for six days they held.
      I walked O'Connell Street as the shells came in,
      The GPO burning, the dream going up in smoke.
      The British executed the leaders — sixteen men —
      And Ireland, which had mocked the rising, turned in fury.
      They meant to crush it; they christened it.
      Within six years Ireland would be free.
      The firing squads did what the rebels couldn't: they persuaded.
    description: "Irish rebels seize Dublin's GPO in Easter 1916; the British execute the leaders and turn Ireland — the traveler says the firing squads did what the rebels couldn't: they persuaded."
    status: "published"
    sha256: "c47679ed3ffb4040e6dc82e891eedaea372bb531469132c7ee99b0822c6f6648"
  - number: "3348"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Clash of Dreadnoughts"
    date: "1916 CE"
    region: "North Sea"
    poem: |
      At Jutland the great fleets met — 250 ships, the clash of dreadnoughts.
      I watched from the gray North Sea mist as the big guns spoke,
      British battlecruisers blowing up, German ships slipping home in the dark.
      Both claimed victory; Britain kept the sea, which was the point.
      Fourteen British ships lost, eleven German — the numbers lied a little.
      The German fleet never came out in force again.
      The war at sea was decided by the battle both sides survived.
    description: "Britain and Germany's dreadnought fleets clash at Jutland — both claim victory, but the traveler notes Britain kept the sea, which was the point."
    status: "published"
    sha256: "6d6b6267f6659f7e3e3d47c1fd3f1794d090e596db375f5e59496ec8ab4a7271"
  - number: "3349"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Russia's Last Great Blow"
    date: "1916 CE"
    region: "Eastern Front"
    poem: |
      Brusilov shattered the Austrian army in 1916 —
      Russia's greatest victory of the war, and its last.
      I rode with those troops through the broken lines,
      A million and a half Austrians lost, the front torn open.
      It was brilliance — and it broke the Russian army doing it.
      The casualties, the desertions, the rot underneath:
      Victory cost Russia the strength to go on.
      Within a year the Tsar would fall, within two the empire.
      The last great blow, struck by a dying giant.
    description: "Brusilov's 1916 offensive shatters Austria — Russia's greatest victory and its last, and the traveler rides with troops whose triumph breaks the army that won it."
    status: "published"
    sha256: "9922d2b60e3461960396d3014d5a459e09f77b8a1a7a86ce52bef329d57dac25"
  - number: "3350"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Iron Monsters"
    date: "1916 CE"
    region: "France"
    poem: |
      At Flers the British tanks crawled into battle —
      Clumsy, slow, breaking down, terrifying.
      I watched those iron monsters lurch across no-man's-land,
      Bullets rattling off them like rain on a roof.
      The infantry followed, amazed, through the wire the tanks had crushed.
      It was the future of war arriving badly —
      Which is how the future usually arrives.
      The horse cavalry watched, and did not know it was obsolete yet.
    description: "British tanks crawl into battle at Flers in 1916 — clumsy, slow, terrifying, and the traveler calls it the future of war arriving badly, which is how it usually arrives."
    status: "published"
    sha256: "9004fa33e7807fe90b5cbb1bad97fff13debccfb615f5304fa062ea5a83796fc"
  - number: "3351"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Lines Drawn in Secret"
    date: "1916 CE"
    region: "Middle East"
    poem: |
      In 1916 Britain and France secretly carved up the Ottoman Middle East —
      Sykes-Picot, lines on a map in a London room.
      I was not in that room, but I have walked every border they drew,
      And watched a century bleed from those pencil strokes.
      The Arabs were promised independence; they got mandates.
      Kurdistan was split four ways; Palestine was promised twice.
      The men with the pencils went home to dinner.
      The Middle East is still paying the bill.
    description: "Britain and France secretly carve up the Ottoman Middle East in the Sykes-Picot agreement — the traveler has walked every border they drew and says the region is still paying the bill."
    status: "published"
    sha256: "c0b5d5527c5fd7f2853dd8e67a4b8ea536b90fcf48ef59dffd3d9b8b374305f5"
  - number: "3352"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Lawrence and the Desert War"
    date: "1916 CE"
    region: "Arabia"
    poem: |
      Sherif Hussein proclaimed the Arab revolt,
      And a young Englishman named Lawrence helped Arab riders take Aqaba —
      From the landward side, where no one was watching.
      I rode with those camel columns, the desert burning white,
      Blowing up the Hejaz railway, vanishing into the sand.
      Guerrilla war, romantic and real at once.
      But the promises Lawrence carried — Arab independence —
      Were already being traded away in London.
      He knew. The desert knew. The betrayal came later, on paper.
    description: "Lawrence of Arabia helps Arab riders take Aqaba from the landward side — the traveler rides with the camel columns, knowing the independence promises are already being traded away in London."
    status: "published"
    sha256: "8e06d539e918fd6051a796bb36e97dabce8df9842e3d0daf6fb20cf042f3887a"
  - number: "3353"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Mad Monk Dies"
    date: "1916 CE"
    region: "Russia"
    poem: |
      They murdered Rasputin in a Petrograd palace —
      Poison, bullets, the river Neva, and still he fought.
      I heard the story from the city the next morning,
      Half horror, half grim satisfaction.
      The mad monk who held the Tsarina's trust
      Was dead, and the Romanov court was rotting from within.
      It changed nothing. The dynasty had months left.
      Killing the symptom never cures the disease —
      Russia was about to prove it on a grand scale.
    description: "Russian nobles murder Rasputin in 1916 — poison, bullets, the Neva — and the traveler notes killing the symptom never cures the disease; the dynasty had months left."
    status: "published"
    sha256: "008f366c6112f1f5c94d788dec4d01e87af2244e682b87fa83649c662f3f90fc"
  - number: "3354"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Nonsense as Protest"
    date: "1916 CE"
    region: "Zurich, Switzerland"
    poem: |
      In a Zurich cabaret, artists invented Dada —
      Art as anti-war nonsense, sound poems, collage, glorious refusal.
      I sat in the Cabaret Voltaire while Hugo Ball chanted in a cardboard costume,
      And the war raged a few hundred miles away.
      If the world has gone mad, they said, we'll be madder, on purpose.
      It was protest by absurdity — and it worked,
      Because you can't argue with nonsense, you can only feel it.
      From that little room came surrealism, punk, everything that refuses.
    description: "Artists invent Dada in a Zurich cabaret in 1916 — anti-war nonsense as protest, and the traveler says you can't argue with nonsense, you can only feel it."
    status: "published"
    sha256: "1a3fe4bf46fc5b01e3a7bcc8174666a3aa8861d4d35f2bd9c05417936bf7358e"
  - number: "3355"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Birth Control's First Door"
    date: "1916 CE"
    region: "New York, USA"
    poem: |
      Margaret Sanger opened America's first birth-control clinic in Brooklyn —
      And was jailed within days.
      I stood in the line of women outside that door,
      Poor women, tired women, women who had buried children.
      The law called her obscene; the women called her a lifeline.
      She went to jail, and went on, and went on —
      Planned Parenthood grew from that raided clinic.
      The right to decide is the first freedom. She knew it first.
    description: "Margaret Sanger opens America's first birth-control clinic and is jailed within days — the traveler stands in the line of women outside and calls the right to decide the first freedom."
    status: "published"
    sha256: "c120ef5da31e43ef5b0bb4ab5b80861bf734a39b53952bd895a1895f98e4623d"
  - number: "3356"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Tsar Falls"
    date: "1917 CE"
    region: "Petrograd, Russia"
    poem: |
      Bread riots toppled the Tsar in a week —
      Three centuries of Romanovs, ended by hungry women in the streets.
      I was in Petrograd for those February days,
      The soldiers refusing to fire, the red flags over the barracks.
      Nicholas abdicated in a railway car, quietly, almost politely.
      The empire that had seemed eternal dissolved like sugar in tea.
      Nobody planned it. Nobody controlled it.
      Revolutions are like that: they arrive before the revolutionaries do.
    description: "Bread riots topple the Tsar in February 1917 — the traveler is in Petrograd as three centuries of Romanovs dissolve like sugar in tea, arriving before the revolutionaries do."
    status: "published"
    sha256: "1c21ddf720c587ddf3e161f0b3bde84700ae7c41bc5c8edd2d2ff800a4121c7e"
  - number: "3357"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "America Comes In"
    date: "1917 CE"
    region: "USA"
    poem: |
      The Zimmermann Telegram, the unrestricted U-boats —
      America declared war on Germany in April 1917.
      I was in Washington when Wilson asked Congress,
      "The world must be made safe for democracy."
      The doughboys came, two million strong,
      And the exhausted Allies got their second wind.
      It took a German offer to Mexico and torpedoes in the Atlantic
      To pull the giant in. But once in, the giant stayed —
      And the twentieth century became America's century.
    description: "America declares war on Germany in April 1917 after the Zimmermann Telegram and U-boat sinkings — the traveler hears Wilson's speech and watches the giant step in."
    status: "published"
    sha256: "a2ef4da09c4fade055c1f16883b6629fe9742670cc20ec5b4d94bedb8cc21189"
  - number: "3358"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Mud and Blood"
    date: "1917 CE"
    region: "Belgium"
    poem: |
      At Passchendaele men drowned in mud —
      The offensive gained five miles for half a million casualties.
      I walked that battlefield, if you can call liquid earth a field,
      Tanks sunk to their turrets, men swallowed by shell holes.
      The rain fell, the guns churned the ground to soup,
      And Haig kept ordering attacks into it.
      Five miles. Half a million.
      I have seen waste in every century. Passchendaele is the standard.
    description: "Passchendaele gains five miles for half a million casualties — men drowning in mud, and the traveler calls it the standard by which all waste is measured."
    status: "published"
    sha256: "2bbd14f6c2d3dd90f7517012363b72a49a7d599574b24fa5215071ae459a6805"
  - number: "3359"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Winter Palace Falls"
    date: "1917 CE"
    region: "Petrograd, Russia"
    poem: |
      The Bolsheviks stormed the Winter Palace in October —
      A shot from the cruiser Aurora, and Lenin took power.
      I was in Petrograd that night, the city tense and dark,
      The Provisional Government melting away like frost.
      "All power to the soviets" — the promise of bread, peace, land.
      What followed was civil war, terror, famine —
      But on that night, the workers believed.
      I believed with them, for a night. History would do the disbelieving.
    description: "The Bolsheviks storm the Winter Palace in October 1917 — the traveler is in Petrograd that night and believes with the workers, for a night, before history does the disbelieving."
    status: "published"
    sha256: "ccafe6b7373738a858c03aba767d6ab0333557c1c9d9734ffa711b97102fd873"
  - number: "3360"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "A Homeland Promised"
    date: "1917 CE"
    region: "Palestine"
    poem: |
      One letter, sixty-seven words — the Balfour Declaration —
      Britain promised a Jewish national home in Palestine.
      I read it in the newspapers, that November,
      And thought of the Jews I had known across the centuries,
      Stateless, persecuted, dreaming of Zion.
      One letter, a century of consequence:
      Two peoples, one land, a promise made by an empire
      That owned neither the land nor the right to give it.
      History's longest IOU, still being collected.
    description: "The Balfour Declaration promises a Jewish national home in Palestine in 67 words — the traveler calls it history's longest IOU, still being collected a century on."
    status: "published"
    sha256: "a4b4f0dada99d674a2b45c729bfda99bb068ffc7e89eef465ce497874b302c79"
  - number: "3361"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Disaster at Caporetto"
    date: "1917 CE"
    region: "Italy"
    poem: |
      Austro-German troops routed the Italians at Caporetto —
      Three hundred thousand prisoners, the front collapsing.
      I walked the retreat roads, the chaos, the abandoned guns,
      An army dissolving into a mob in the mountain passes.
      Hemingway was an ambulance driver nearby; he'd write it into A Farewell to Arms.
      Italy nearly fell out of the war that autumn.
      But the Piave held, and the nation held its breath,
      And learned what defeat tastes like at the doorstep.
    description: "Austro-German troops rout the Italians at Caporetto — the traveler walks the retreat roads as an army dissolves, and notes Hemingway was nearby in an ambulance."
    status: "published"
    sha256: "a2b00b1d684b1d80f26b02605de373959c338bd13b6275717e8be7243ba127de"
  - number: "3362"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Spy Who Danced"
    date: "1917 CE"
    region: "France"
    poem: |
      Mata Hari faced the French firing squad at dawn —
      Dancer, courtesan, accused spy.
      I stood in the crowd of witnesses at Vincennes,
      And watched her refuse the blindfold, blowing a kiss to the riflemen.
      Guilty or scapegoat? France needed a traitor that year,
      And she was convenient, exotic, doomed.
      The legend outlived the trial — the spy who danced.
      The truth, whatever it was, died with her at sunrise.
    description: "Mata Hari faces the firing squad at Vincennes, refusing the blindfold — the traveler watches and says guilty or scapegoat, the legend outlived the trial."
    status: "published"
    sha256: "207d558f0074272e4307d59faca89b98af470bb36854d6d77638a69f9aca659a"
  - number: "3363"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Jazz Gets Waxed"
    date: "1917 CE"
    region: "USA"
    poem: |
      The Original Dixieland Jass Band cut the first jazz record —
      And the Jazz Age got its soundtrack.
      I was in the studio, the horns blaring into the big horn,
      That wild New Orleans polyphony captured in wax.
      Irony: the first jazz record was made by five white men,
      While the Black innovators waited their turn at the microphone.
      But the music was bigger than the irony —
      It belonged to everyone who ever needed to swing.
    description: "The first jazz record is cut in 1917 — the traveler is in the studio and notes the irony that five white men recorded first, but the music belonged to everyone."
    status: "published"
    sha256: "73c876c197b25f39fee1018d9ad91889cb6bc76e9847c10697ef789cf2ad58b8"
  - number: "3364"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Prizes Begin"
    date: "1917 CE"
    region: "USA"
    poem: |
      The first Pulitzers honored reporting, novels, and poetry —
      Joseph Pulitzer's will, rewarding the American word.
      I read those first winners, the earnest beginnings,
      Not knowing the prize would become the profession's conscience.
      A century of Woodwards and Bernsteins, of To Kill a Mockingbird echoes,
      All descended from that first list.
      Prizes don't make writers. But they tell a country
      What it thinks writing is for.
    description: "The first Pulitzer Prizes honor reporting, novels, and poetry — the traveler reads the first winners and says prizes tell a country what it thinks writing is for."
    status: "published"
    sha256: "c18f94910d9e47c1d3814dfb6769bf11546c8a1d515cf759559c1ea4c4121e2e"
  - number: "3365"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Voices of the Army"
    date: "1917 CE"
    region: "France"
    poem: |
      American women operated Army switchboards at the front —
      The Hello Girls, under fire, connecting the calls that ran the war.
      I watched them work in the chaos of the offensives,
      Calm voices in the static, in French and English.
      They wore uniforms, took the oath, served at the front —
      And the Army called them civilians for sixty years.
      Recognition came in 1977, for the few still living.
      The voices of the army, finally heard.
    description: "American women operate Army switchboards at the front in WWI — the Hello Girls under fire, called civilians for sixty years, finally recognized in 1977."
    status: "published"
    sha256: "70260349a549afae67583b349ae23af67bad04f3b0882813f39b79c6cc691529"
  - number: "3366"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Finland Breaks Free"
    date: "1917 CE"
    region: "Finland"
    poem: |
      Finland declared independence from revolutionary Russia —
      December 6, 1917, a nation born in the empire's collapse.
      I was in Helsinki for the celebrations, quiet and determined,
      A people who had kept their language and laws under the Tsars
      Now keeping their country.
      What followed was civil war — Reds and Whites, brother against brother.
      But the independence held, through war and Stalin both.
      Small nations, I have learned, are the toughest things on Earth.
    description: "Finland declares independence from revolutionary Russia in December 1917 — the traveler celebrates in Helsinki and calls small nations the toughest things on Earth."
    status: "published"
    sha256: "d70053c2bbbb76e142df5e4f7e3fee640966c99a5b9658daa7888b250a103f30"
  - number: "3367"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Russia Quits the War"
    date: "1918 CE"
    region: "Russia"
    poem: |
      The Bolsheviks signed Brest-Litovsk, giving Germany
      A third of Russia's land to buy peace.
      I watched the Russian delegation at that table,
      Humiliated, with no cards left to play.
      Peace at any price — and the price was Ukraine, Poland, the Baltics.
      It bought the Bolsheviks time to survive the civil war.
      But the Germans took the grain and the land
      And lost the war anyway, eight months later.
      Desperate bargains rarely age well.
    description: "The Bolsheviks sign away a third of Russia's land at Brest-Litovsk to buy peace — the traveler watches the humiliated delegation and notes desperate bargains rarely age well."
    status: "published"
    sha256: "b5d71288469c28ec7a726818b278b4d4ab0ff3318bcd605ffaea28de2352eba7"
  - number: "3368"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Invisible Killer"
    date: "1918 CE"
    region: "Worldwide"
    poem: |
      A flu born in army camps circled the globe —
      And killed more than the war did.
      I walked the wards in Philadelphia, in Bombay, in Cape Town,
      The bodies stacked, the gravediggers working day and night.
      Fifty million dead, maybe more — the young and strong hit hardest.
      It came in waves, and the world, busy with war,
      Barely recorded the greatest plague since the Black Death.
      The invisible killer. I remember every wave.
      The world chose to forget. I did not.
    description: "The 1918 flu circles the globe from army camps, killing more than the war — the traveler walks the wards in Philadelphia, Bombay, and Cape Town and refuses to forget."
    status: "published"
    sha256: "b5b0b4d05f5a4f3592095d9a4cc19f78556f4501940ea3daec6c90295dfc115f"
  - number: "3369"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Last Gamble"
    date: "1918 CE"
    region: "France"
    poem: |
      Germany's stormtroopers broke through in the spring of 1918 —
      The Kaiser's battle, the last gamble, and it almost worked.
      I watched them advance, infiltration tactics, speed —
      Then outrun their supplies and stall, exhausted, in the French countryside.
      Ludendorff had bet everything on one throw.
      The Allies, with American weight arriving daily,
      Bent, did not break, and then pushed back.
      The gamble failed. The empire had months left.
    description: "Germany's 1918 spring offensive breaks through, then outruns its supplies and stalls — the traveler watches Ludendorff's last gamble fail in the French countryside."
    status: "published"
    sha256: "31c3165a7aab03381605f573a9e4be6a7801178defe17fced40ed4a28c67d03c"
  - number: "3370"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Tide Turns"
    date: "1918 CE"
    region: "France"
    poem: |
      Foch counterattacked at the Marne in July 1918,
      And the Allies began the Hundred Days.
      I was there for the turning — tanks, planes, Americans,
      The German line bending, then breaking, then running.
      The war's momentum reversed in those summer weeks,
      And never reversed back.
      Four years of stalemate ended in a hundred days of movement.
      The tide turns slowly, then all at once.
    description: "Foch counterattacks at the Marne and the Allies begin the Hundred Days — the traveler is there for the turning and says the tide turns slowly, then all at once."
    status: "published"
    sha256: "bb8eb40189649a29cbf43cc3a10e43263c73c12a9de89efcb8a453fa927e7ff9"
  - number: "3371"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "America's Biggest Battle"
    date: "1918 CE"
    region: "France"
    poem: |
      A million Americans attacked through the Argonne —
      The largest battle in US history, forty-seven days.
      I walked those woods, the shattered trees, the fog,
      Doughboys learning war the hard way against a desperate enemy.
      Twenty-six thousand dead, the Lost Battalion surrounded and saved.
      It broke the German army's back in the West.
      America's biggest battle, and most Americans have never heard of it —
      The Argonne, where the Yanks grew up fast.
    description: "A million Americans attack through the Argonne — the largest battle in US history, and the traveler walks the shattered woods where the Yanks grew up fast."
    status: "published"
    sha256: "9245fff236885aa9c4a3ee5e9cf0cad511978900b483d104edc8e313c732de4f"
  - number: "3372"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Cellar at Yekaterinburg"
    date: "1918 CE"
    region: "Yekaterinburg, Russia"
    poem: |
      In a cellar in Yekaterinburg the Bolsheviks shot them all —
      The Tsar, his wife, his five children, their servants, the dog.
      I stood outside that house in the July night
      And heard what the walls could not contain.
      Three hundred years of Romanovs ended in a basement,
      Bullets and bayonets, the bodies burned and hidden.
      Whatever the Tsar's sins — and they were many —
      The children had committed none.
      I do not forgive that night. I only record it.
    description: "The Bolsheviks shoot the Tsar, his family, and their servants in a Yekaterinburg cellar — the traveler stands outside in the July night and records what he cannot forgive."
    status: "published"
    sha256: "c9af630d344eda99eff7781df1dac67cce299eccf99817a9d547fb8d580d63ba"
  - number: "3373"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Guns Fall Silent"
    date: "1918 CE"
    region: "France"
    poem: |
      At the eleventh hour of the eleventh day of the eleventh month,
      The guns stopped. The war was over.
      I stood in the trenches as the silence came —
      Men weeping, men laughing, men afraid to stand up.
      Four years, sixteen million dead, empires fallen.
      The silence was the strangest sound of all.
      They signed the armistice in a railway car at Compiègne.
      I walked out into no-man's-land that morning
      And the birds were singing. The birds had waited.
    description: "At 11 a.m. on 11/11 the guns stop — the traveler stands in the trenches as the strangest sound of all arrives: silence, and the birds singing."
    status: "published"
    sha256: "18754a01b2036fcf6d65e4a22158ce2b6bf5f7c7515c5edc4c92bea6284544c2"
  - number: "3374"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Allenby's Masterstroke"
    date: "1918 CE"
    region: "Palestine"
    poem: |
      At Megiddo, Allenby smashed the Ottomans —
      Cavalry, planes, deception, the whole modern art of battle.
      I rode with the Desert Mounted Corps through the broken lines,
      The last great cavalry victory in history.
      The Ottoman army in Palestine ceased to exist in days.
      Damascus fell; the road to Aleppo lay open.
      Empires end the way they lived — suddenly, in the dust.
      The cavalry charged into the twentieth century
      And never charged out again.
    description: "Allenby smashes the Ottomans at Megiddo — the traveler rides with the last great cavalry charge in history, which charged into the twentieth century and never charged out."
    status: "published"
    sha256: "01a86a2fd9025a38b7c75f295dd2153b5e25d74a0450b54a3e5c0843db743fe0"
  - number: "3375"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Hellfighters' Valor"
    date: "1918 CE"
    region: "France"
    poem: |
      The Black 369th Infantry fought 191 days straight —
      Longer than any other American unit — and France gave them the Croix de Guerre.
      I watched the Hellfighters in the trenches, the jazz band playing between battles,
      Men fighting for a country that lynched their brothers at home.
      They called themselves the Men of Bronze; the French called them heroes.
      America gave them a parade — then gave them Jim Crow.
      Valor is valor. The debt is still unpaid.
    description: "The Black 369th Infantry fights 191 days straight and earns France's Croix de Guerre — the traveler watches them fight for a country that lynched their brothers at home."
    status: "published"
    sha256: "9ea01bf5a847285407f7c6c41d5bb8eaefda40c1423d8b4087b14a964ebe5cb0"
  - number: "3376"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Votes for Some Women"
    date: "1918 CE"
    region: "England"
    poem: |
      Women over thirty won the vote in Britain —
      The suffragettes' long fight cracked the door.
      I had watched them march, hunger-strike, be force-fed,
      Emily Davison under the King's horse at the Derby.
      The war had proved women could do everything —
      Drive ambulances, run factories, bury the dead.
      So Parliament gave the vote — to some of them, the older ones.
      A crack, not a door. But cracks spread.
    description: "Women over thirty win the vote in Britain in 1918 — the traveler remembers the marches and hunger strikes and calls it a crack, not a door, but cracks spread."
    status: "published"
    sha256: "ff55539a375e4edea2ad10fa084f25267860e117979ecdc136c3594b395b5652"
  - number: "3377"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "A New Nation"
    date: "1918 CE"
    region: "Prague"
    poem: |
      Czechoslovakia was proclaimed in Prague —
      Masaryk, the philosopher-president, at its head.
      I stood in Wenceslas Square as the new flag went up,
      Czechs and Slovaks cheering a country that had never existed.
      It was Wilson's self-determination made real —
      A democracy in the heart of Europe, between Germany and Russia.
      It would last twenty years before the wolves came.
      But on that October day, the square sang,
      And I sang with it.
    description: "Czechoslovakia is proclaimed in Prague with Masaryk as president — the traveler stands in Wenceslas Square as the new flag goes up and sings with the crowd."
    status: "published"
    sha256: "0272f9a1e4745d8a3638d86897f387cb6376eb70ac240202d2cdb80066e8ae96"
  - number: "3378"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Peace That Punishes"
    date: "1919 CE"
    region: "France"
    poem: |
      Versailles blamed Germany and billed her for the war —
      Article 231, the war guilt, reparations beyond paying.
      I sat in the Hall of Mirrors as the Germans signed,
      The same room where the German Empire had been proclaimed.
      Keynes walked out and called it a Carthaginian peace.
      He was right. The humiliation festered for twenty years
      And gave the world Hitler.
      Peace, I have learned, is not the absence of war.
      It is the presence of justice. Versailles had none.
    description: "Versailles blames Germany and bills her for the war — the traveler sits in the Hall of Mirrors and says peace is not the absence of war but the presence of justice; Versailles had none."
    status: "published"
    sha256: "1ea2d3640349aadabcf479895e3f31df6f46824c0c9f923c7a818a2a279dcfb6"
  - number: "3379"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Blood at Jallianwala Bagh"
    date: "1919 CE"
    region: "India"
    poem: |
      General Dyer's troops fired on unarmed Indians at Jallianwala Bagh —
      1,650 rounds into a walled garden, 379 dead by the official count.
      I was in Amritsar that April, and heard the rifles for ten minutes,
      The crowd with nowhere to run, the narrow exits blocked.
      Dyer was unrepentant; Britain was divided; India was changed forever.
      Gandhi called it the moment India turned —
      From petitioning the empire to leaving it.
      Blood on the ground in Punjab, and the road to independence began there.
    description: "Dyer's troops fire on unarmed Indians at Jallianwala Bagh — the traveler hears ten minutes of rifles in Amritsar and says the road to independence began in that walled garden."
    status: "published"
    sha256: "79733064b86ead9388e05cef19021491441ac029bf8591e86fcccdd94363b42c"
  - number: "3380"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "China's Youth Awaken"
    date: "1919 CE"
    region: "Beijing, China"
    poem: |
      Students flooded Beijing against the Versailles betrayal —
      Shantung given to Japan, and China erupted on May Fourth.
      I marched with those students, young, furious, brilliant,
      Burning for a China that would stand up.
      Modern Chinese nationalism was born that day —
      In the streets, in the journals, in the refusal.
      The old culture was questioned, the new ideas rushed in.
      I have seen many awakenings. This one shook a quarter of humanity.
    description: "Students flood Beijing on May Fourth 1919 against the Versailles betrayal — the traveler marches with them and says this awakening shook a quarter of humanity."
    status: "published"
    sha256: "935029d92aba67e009295963f77a4e084cd70814acb9eb1b3540fe328786c5ba"
  - number: "3381"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "First Across the Atlantic"
    date: "1919 CE"
    region: "Atlantic"
    poem: |
      Alcock and Brown flew the Atlantic nonstop —
      Sixteen harrowing hours in an open cockpit, fog, ice, near-death.
      I tracked their Vickers Vimy from Newfoundland,
      Those two men in leather and courage, half-frozen, wholly determined.
      They crashed — landed — in an Irish bog, and had done it:
      The first to cross the ocean by air.
      Lindbergh would make it famous eight years later.
      These two made it first, in a converted bomber, in the fog.
    description: "Alcock and Brown fly the Atlantic nonstop in sixteen harrowing hours — the traveler tracks their open-cockpit Vimy and honors the first crossing before Lindbergh made it famous."
    status: "published"
    sha256: "0d59fa9bb1a6dbc19d4ce541376b3f635e9443546bf7c4ec8cc66371d899bb24"
  - number: "3382"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The School That Redesigned the World"
    date: "1919 CE"
    region: "Weimar, Germany"
    poem: |
      Gropius founded the Bauhaus at Weimar —
      Art, craft, and industry become one.
      I walked those workshops, the looms and the metal shops,
      Where painters learned welding and architects learned weaving.
      Form follows function; the modern world was designed in that school —
      The chairs you sit in, the buildings you work in, the type on this page.
      The Nazis closed it in 1933. Too late.
      The Bauhaus had already redesigned the planet.
    description: "Gropius founds the Bauhaus at Weimar — the traveler walks the workshops and says the chairs you sit in and the type on this page were designed in that school."
    status: "published"
    sha256: "55e38a9f0d6065141d371f7bb03532cffa48e074928d810d1367d021b5ae165f"
  - number: "3383"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Red Summer"
    date: "1919 CE"
    region: "USA"
    poem: |
      Race riots burned across America in the Red Summer —
      Black veterans came home from France to lynchings.
      I walked the streets of Chicago during those July days,
      Thirty-eight dead, the city divided by the color line.
      They had fought for democracy abroad and been denied it at home —
      And this time, they fought back.
      The "New Negro" was born in that summer's fire.
      America's original sin, still bleeding, still unpaid.
    description: "Race riots burn across America in the Red Summer of 1919 — Black veterans home from France face lynchings, and the traveler walks the burning streets of Chicago."
    status: "published"
    sha256: "4c393fe7cd2f62b19057cf67c29faceb040e6ede60049ccd68b0aca7216b6595"
  - number: "3384"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Starlight Bends"
    date: "1919 CE"
    region: "West Africa"
    poem: |
      Eddington photographed the eclipse off West Africa,
      And the stars bent around the sun — Einstein was right.
      I stood on Principe Island in the tropical heat,
      Watching the moon eat the sun while the cameras clicked.
      General relativity, proven by starlight:
      Gravity curves space, and the universe obeyed the equations.
      The news made Einstein world-famous overnight.
      A theory confirmed by an eclipse —
      Science's most beautiful moment, and I was there to see the plates.
    description: "Eddington photographs bent starlight during the 1919 eclipse, proving Einstein right — the traveler stands on Principe Island and calls it science's most beautiful moment."
    status: "published"
    sha256: "90b19cbe3e545036ed5dbd81927a587fd09221b1197b1df053d91676f0d9801b"
  - number: "3385"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The League Is Born"
    date: "1919 CE"
    region: "Geneva, Switzerland"
    poem: |
      The League of Nations was founded —
      Humanity's first try at collective peace.
      I watched the delegates gather in Geneva,
      Wilson's dream made into an institution, sort of.
      No army, no teeth, America never joined —
      The League would fail at its great tests.
      But the idea survived the failure:
      Nations, talking, in one room, against war.
      The United Nations is its grandchild.
      Dreams don't die when institutions do.
    description: "The League of Nations is founded in Geneva — the traveler watches Wilson's dream become an institution and says dreams don't die when institutions do."
    status: "published"
    sha256: "51e758dc2cd7e15c4477ebb46970c9fd81bf31442a530b68f22fd946bee2e18f"
  - number: "3386"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Dry Years Begin"
    date: "1919 CE"
    region: "USA"
    poem: |
      Prohibition took effect, and America went dry —
      The Eighteenth Amendment, the noble experiment.
      I watched the last legal bars close, the toasts, the tears,
      And the speakeasies fill up within weeks.
      The law made drinking a crime and criminals into millionaires —
      Capone's Chicago was born in that amendment.
      Thirteen years of hypocrisy, poisoned moonshine, blind tigers.
      The century's great lesson: you cannot legislate thirst.
    description: "Prohibition takes effect in America — the traveler watches the last legal bars close and the speakeasies fill, calling it thirteen years proving you cannot legislate thirst."
    status: "published"
    sha256: "bb85518fbd8f6b9f1d6c9e2242aa9d9950825ca890232fc9005c058fc06a1a86"
  - number: "3387"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Weimar Republic"
    date: "1919 CE"
    region: "Germany"
    poem: |
      Germany's republic was proclaimed at Weimar —
      Democracy between the trenches, born in defeat.
      I was in Berlin for the street fighting that winter,
      Spartacists and Freikorps, Rosa Luxemburg murdered in the canal.
      The republic survived — barely — and gave Germany
      Its freest years: Bauhaus, Brecht, cabaret, Einstein.
      But it was born with a knife at its throat,
      And the enemies of democracy never accepted it.
      Fourteen years. Then the fire.
    description: "Germany's republic is proclaimed at Weimar, born in defeat and street fighting — the traveler gives it fourteen brilliant years before the fire."
    status: "published"
    sha256: "6355017aec830ee329e9ed4b349cdf440e6c3a35ea52e21b698fb55901d9a9a2"
  - number: "3388"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "American Women Win the Vote"
    date: "1920 CE"
    region: "USA"
    poem: |
      Tennessee ratified, and American women won the ballot nationwide —
      The Nineteenth Amendment, seventy-two years in the making.
      I stood outside the Tennessee statehouse for that final vote,
      One young legislator, Harry Burn, switching on his mother's letter: "Vote for suffrage."
      Thirty-five to forty-nine. Done.
      Susan Anthony had died fourteen years earlier; she missed it by that much.
      The long march — Seneca Falls to Nashville —
      Ended in a single "aye" on a hot August day.
    description: "Tennessee's ratification wins American women the vote nationwide — the traveler stands outside the statehouse for the 35-49 vote switched by one young legislator's mother's letter."
    status: "published"
    sha256: "bbe31fccf5e62e51b7cc47011db35d7035d7b100a9c4045bf23c3fbbb7ed8614"
  - number: "3389"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Radio Goes Commercial"
    date: "1920 CE"
    region: "Pittsburgh, USA"
    poem: |
      KDKA broadcast the election returns from Pittsburgh —
      Harding beats Cox — and commercial radio was born.
      I listened on a crystal set, the crackling voice from nowhere,
      And understood: the nation would never be lonely again.
      Within years, millions of homes had the box,
      The fireside replaced by the loudspeaker.
      News, music, drama, ball games — all through the air.
      The twentieth century's nervous system, switched on in Pittsburgh.
    description: "KDKA broadcasts election returns from Pittsburgh in 1920 — the traveler listens on a crystal set and calls it the twentieth century's nervous system switching on."
    status: "published"
    sha256: "9fdf4d3678ec8dc319a64018de2cc1dad2452eb729ffb13460e205bb3eb4a6d0"
  - number: "3390"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Saint Takes Charge"
    date: "1920 CE"
    region: "India"
    poem: |
      Gandhi launched noncooperation in 1920 —
      And India learned the power of refusing.
      I walked with the crowds, the spinning wheels, the boycotted cloth,
      A saint in a loincloth taking charge of a revolution.
      No guns, no bombs — just refusal, on a continental scale.
      The British Empire had faced armies; it had never faced this.
      Nonviolence as strategy, morality as weapon —
      The century's most radical idea, wearing the simplest clothes.
    description: "Gandhi launches noncooperation in 1920 — the traveler walks with the crowds and calls nonviolence the century's most radical idea, wearing the simplest clothes."
    status: "published"
    sha256: "6d81dd2949bd62bdb8dc12fb46c00473369291477c1487f34f95c319150d1aef"
  - number: "3391"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Miracle on the Vistula"
    date: "1920 CE"
    region: "Poland"
    poem: |
      Poland smashed the Red Army at Warsaw —
      The Miracle on the Vistula, the eighteenth decisive battle of the world.
      I stood on the riverbanks as Pilsudski's counterattack broke through,
      The Soviets routed, Lenin's dream of European revolution stopped cold.
      Had Warsaw fallen, the Red Army marched on Berlin —
      History pivoted on those August days.
      Poland saved Europe and got little thanks.
      Miracles, I have learned, are just preparation meeting desperation.
    description: "Poland smashes the Red Army at Warsaw in 1920 — the traveler stands on the Vistula as history pivots, and says miracles are preparation meeting desperation."
    status: "published"
    sha256: "6ae2a192095546e81437d3795d352ec2c1f4b52d0111305beb6a2f7ef06da663"
  - number: "3392"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Babe Goes Bronx"
    date: "1920 CE"
    region: "New York, USA"
    poem: |
      The Red Sox sold Babe Ruth to the Yankees for $125,000 —
      And the Curse of the Bambino began.
      I was in Boston when the news broke, the disbelief, the rage.
      Ruth would hit 54 homers that first Yankee season
      And become the most famous athlete on Earth.
      Boston would not win another Series for 86 years.
      Selling the Babe: the worst trade in sports history,
      Made for cash, regretted for a century.
    description: "The Red Sox sell Babe Ruth to the Yankees — the traveler is in Boston for the disbelief and calls it the worst trade in sports history, regretted for 86 years."
    status: "published"
    sha256: "8a1647369306ede935808461565e7044c3d1d56a2ee6d748da944e58c13a2dc1"
  - number: "3393"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Ireland Fights On"
    date: "1920 CE"
    region: "Ireland"
    poem: |
      The IRA's guerrilla war ground Britain toward a treaty —
      Flying columns, ambushes, the Black and Tans' reprisals.
      I walked the Cork countryside those years,
      The war in the shadows, neighbors informing, houses burning.
      It was brutal on both sides — war usually is —
      But the guerrillas bled the empire into negotiating.
      By 1921 Britain would talk.
      Ireland's freedom was bought in laneways and farmhouses,
      Not on battlefields.
    description: "The IRA's guerrilla war grinds Britain toward a treaty — the traveler walks the Cork countryside and says Ireland's freedom was bought in laneways, not battlefields."
    status: "published"
    sha256: "3260d8b378df540361858c575ab5164f2206def3d349046b421c7caa5f6ce4aa"
  - number: "3394"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Queen of Crime Debuts"
    date: "1920 CE"
    region: "England"
    poem: |
      The Mysterious Affair at Styles introduced Hercule Poirot —
      Agatha Christie's first, the little Belgian with the mustaches.
      I read it fresh off the press, not knowing
      The quiet woman from Torquay would become the best-selling novelist in history.
      Poirot, Miss Marple, two billion books —
      The golden age of the detective story began in that country house.
      Everyone has a motive; the little grey cells sort them out.
      Comfort reading for a violent century.
    description: "Agatha Christie's first novel introduces Hercule Poirot — the traveler reads it fresh off the press, not knowing the quiet woman from Torquay becomes history's best-selling novelist."
    status: "published"
    sha256: "a07cf134211c152b940afa4771206b32919a0daabb35b35f83c5d3ba0433b1f0"
  - number: "3395"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Dry by Law"
    date: "1920 CE"
    region: "USA"
    poem: |
      The Volstead Act took hold, and bootleggers became millionaires overnight —
      Prohibition with teeth, and the teeth bit the wrong people.
      I watched the rum-runners on the Great Lakes, the stills in the hills,
      An entire criminal economy blooming under the law's nose.
      The government poisoned industrial alcohol; people died drinking it.
      The law meant well. The law always means well.
      Thirteen years of organized crime's golden age,
      Funded by America's thirst.
    description: "The Volstead Act takes hold and bootleggers become millionaires overnight — the traveler watches the rum-runners and says the law meant well; the law always means well."
    status: "published"
    sha256: "d97fc1bf4a3a7cbb58454347dbb430fb5ed7e5fb86de48da3438d0fc62681bcc"
  - number: "3396"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The League Meets"
    date: "1920 CE"
    region: "Geneva, Switzerland"
    poem: |
      The League of Nations held its first assembly —
      Forty-one nations, one hope, in Geneva.
      I sat in the gallery as the delegates filed in,
      The war's survivors trying to build the machine that would prevent the next one.
      Speeches in French and English, committees, covenants.
      It was earnest, and it was inadequate —
      But it was the first time humanity had tried to govern its violence.
      The hope was real, even if the power wasn't.
    description: "The League of Nations holds its first assembly in Geneva — 41 nations, and the traveler calls it the first time humanity tried to govern its own violence."
    status: "published"
    sha256: "6e34f7baa31724c36f33256ec3cc61dfbdc3165ad002b5fe2c47db7d19695ed1"
  - number: "3397"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Sweet Blood, Bitter Search"
    date: "1921 CE"
    region: "Toronto, Canada"
    poem: |
      Banting and Best isolated insulin in Toronto —
      And diabetes stopped being a death sentence.
      I visited that cramped laboratory, the dogs, the desperate work,
      A young surgeon and a medical student chasing a pancreatic extract.
      Children wasted to skeletons were dying in the wards.
      Within a year, the dying were living.
      Medicine's greatest rescue — from certain death to a daily shot.
      I have seen few miracles. This was one.
    description: "Banting and Best isolate insulin in Toronto — the traveler visits the cramped lab and calls the rescue of dying diabetic children one of the few miracles he's seen."
    status: "published"
    sha256: "ab15d052b2ca786d80a326e5c84643d861de3b6a1da58c08f8d0d502d97d873d"
  - number: "3398"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Black Wall Street Burns"
    date: "1921 CE"
    region: "Oklahoma, USA"
    poem: |
      A white mob destroyed Tulsa's Greenwood district —
      Black Wall Street, burned to the ground, hundreds dead.
      I walked those streets after the fires,
      The prosperous Black businesses, the homes, all ash.
      Airplanes dropped firebombs; the National Guard interned the survivors.
      It was a massacre, and America buried it for seventy years —
      No memorial, no reckoning, just silence.
      The silence was the second crime.
      I remember Greenwood. I say its name.
    description: "A white mob destroys Tulsa's Greenwood district — Black Wall Street burned, hundreds dead, buried in silence for 70 years, and the traveler says the silence was the second crime."
    status: "published"
    sha256: "ba2be0a05e9698edcb5fa17c99c0e8cc8bff1025a23e9274f0471feaa13cc1cf"
  - number: "3399"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Treaty"
    date: "1921 CE"
    region: "Ireland"
    poem: |
      The Anglo-Irish Treaty created the Free State —
      And split Ireland in two, and split the republicans in two.
      I was in Dublin for the debates, the anguish,
      Collins signing his own death warrant, as he said.
      The oath to the Crown, the partition of the North —
      Half a loaf, or a betrayal? Ireland would fight a civil war over the answer.
      Freedom came, but it came divided.
      The Treaty ended one war and started another.
    description: "The Anglo-Irish Treaty creates the Free State and partitions Ireland — the traveler is in Dublin for the anguished debates and says freedom came, but came divided."
    status: "published"
    sha256: "3a23bca015f12319388d02c9a26dfd8c5990607e75c4cafd5ca1be9dd8da89b6"
  - number: "3400"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Thirteen Men in Shanghai"
    date: "1921 CE"
    region: "Shanghai, China"
    poem: |
      Thirteen men founded the Chinese Communist Party
      In a Shanghai schoolhouse, in secret, in July.
      I walked past that building — a modest brick house in the French Concession —
      Not knowing it would birth the force that rules a quarter of humanity.
      Mao was there, a young librarian's assistant.
      They were nobodies, hunted, broke.
      History's biggest parties start in the smallest rooms.
      I have learned to pay attention to nobodies in schoolhouses.
    description: "Thirteen men found the Chinese Communist Party in a Shanghai schoolhouse — the traveler walks past the modest brick house and says history's biggest parties start in the smallest rooms."
    status: "published"
    sha256: "4562a7a69842415c35b4e19f2110249f4766c8316a7948b8792940bc42e1dfed"
  - number: "3401"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Prize Catches Up"
    date: "1921 CE"
    region: "Sweden"
    poem: |
      Einstein won the Nobel in 1921 —
      For the photoelectric effect, not relativity.
      I smiled at the committee's caution:
      The universe's greatest theory was still "unproven" to them,
      So they honored the safe paper instead.
      He used the prize money for his divorce settlement —
      Mileva got the fortune, as promised.
      The prize caught up with the man, sort of.
      Genius doesn't need permission. But the money helped.
    description: "Einstein wins the Nobel for the photoelectric effect, not relativity — the traveler smiles at the committee's caution and notes he gave the money to his ex-wife as promised."
    status: "published"
    sha256: "fab39de29bd3f01af34ef51c0499812fc9dfc760122c1c8873813f0064c1dfd0"
  - number: "3402"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Baseball on the Air"
    date: "1921 CE"
    region: "USA"
    poem: |
      The World Series was broadcast on radio for the first time —
      The Giants beat the Yankees, and America listened.
      I sat by a crystal set with a crowd in a barbershop,
      The announcer painting pictures with words: "the pitch, the swing—"
      No one had ever experienced a game they couldn't see.
      It worked. The imagination is the best screen.
      Within years, baseball and radio were married —
      The summer game, in every kitchen, forever.
    description: "The World Series is broadcast on radio for the first time in 1921 — the traveler listens in a barbershop and says the imagination is the best screen."
    status: "published"
    sha256: "77d72b0ef73f12b63a456e5adeffb27b8029cf68e14dbe42ce9f293fd71743eb"
  - number: "3403"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Battleship Holiday"
    date: "1921 CE"
    region: "USA"
    poem: |
      The great powers agreed to limit battleships at Washington —
      Arms control's first try, the battleship holiday.
      I watched the admirals surrender their dreadnoughts on paper,
      Ratios and tonnages, 5-5-3, the arithmetic of peace.
      It worked, for a while — the building race paused.
      Then the cheaters cheated, and the treaties died.
      But the idea survived: enemies, talking about weapons,
      Agreeing to build fewer of them.
      The first try is never the last word.
    description: "The great powers agree to limit battleships at Washington — the traveler watches admirals surrender dreadnoughts on paper and says the idea survived even when the treaties died."
    status: "published"
    sha256: "bd50015fd13f3297af913ced0ed72af3b00253ca5ff5890c03418a1520c5d100"
  - number: "3404"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Trial of Sacco and Vanzetti"
    date: "1921 CE"
    region: "Massachusetts, USA"
    poem: |
      Two Italian anarchists were convicted on shaky evidence —
      And the world protested for six years.
      I sat in that Dedham courtroom, the prejudice thick as fog:
      They were guilty of being Italian, being radical, being different.
      The evidence was thin; the verdict was pre-written.
      Paris marched, London marched, Buenos Aires marched.
      The state would kill them anyway, in 1927.
      Justice is supposed to be blind. This time it just closed its eyes.
    description: "Sacco and Vanzetti are convicted on shaky evidence in 1921 — the traveler sits in the Dedham courtroom and says justice is supposed to be blind; this time it just closed its eyes."
    status: "published"
    sha256: "ccdd56c4f60388bfb2e58d61c2301d1f20eb9c06ed4f941376b9144a613ba858"
  - number: "3405"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Boy King's Tomb"
    date: "1922 CE"
    region: "Egypt"
    poem: |
      Carter peered through the hole in Tutankhamun's tomb —
      "Wonderful things," he said. Gold, intact, everywhere.
      I stood in that antechamber, the air of three thousand years,
      The boy king's treasure glittering in lamplight.
      The world went mad for Egypt — Tut-mania, everywhere.
      Carter had dug for years on faith; Carnarvon funded the dream.
      One intact tomb, and the ancient world felt close enough to touch.
      Some doors, once opened, never close again.
    description: "Carter peers into Tutankhamun's intact tomb — \"wonderful things\" — and the traveler stands in the 3,000-year-old air as the world goes mad for Egypt."
    status: "published"
    sha256: "88b02f9e9d272607b19c4521c4034029fe14319eb255353110b5a2140d1f24b0"
  - number: "3406"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Mussolini Takes Rome"
    date: "1922 CE"
    region: "Italy"
    poem: |
      Mussolini's Blackshirts marched on Rome,
      And the King handed him power without a shot fired.
      I watched the columns enter the capital, the bluff, the theater —
      Thirty thousand men, and the government folded.
      Il Duce: the first fascist, the model for the worse one to come.
      Italy got trains that ran on time and a press that couldn't speak.
      The march was mostly myth — the deal was cut beforehand.
      Power rarely needs as much force as it pretends.
    description: "Mussolini's Blackshirts march on Rome and the King hands him power — the traveler watches the theater and says power rarely needs as much force as it pretends."
    status: "published"
    sha256: "8f0b7940ece69930927a9fd67aad03d49a1bf3f0d8dbbee7411b9b62849a8558"
  - number: "3407"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Soviet Union Is Born"
    date: "1922 CE"
    region: "Russia"
    poem: |
      The USSR was proclaimed — the world's first communist state,
      Fifteen republics under the hammer and sickle.
      I was in Moscow for the ceremonies, the red banners,
      The promise of a workers' paradise, the reality of a ruined country.
      Lenin was already dying; Stalin was already waiting.
      The experiment would last sixty-nine years,
      Lift millions from poverty, kill millions in terror.
      History's largest laboratory. The results are still being argued.
    description: "The USSR is proclaimed in 1922 — the traveler is in Moscow for the red banners and calls it history's largest laboratory, results still being argued."
    status: "published"
    sha256: "033c16bc7d18c5a32e34a396fc878fd0cdd98e9de6bae92b15d3918016f620b6"
  - number: "3408"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The BBC Begins"
    date: "1922 CE"
    region: "England"
    poem: |
      The BBC started broadcasting from London —
      The wireless got a voice of its own.
      I listened to those first crackling programs,
      News read in dinner jackets, the chimes of Big Ben.
      Reith's mission: inform, educate, entertain —
      And the British Empire got a single voice.
      Within decades it would be the world's most trusted broadcaster.
      It began in a Marconi hut with a few enthusiasts.
      Every empire of the air starts as a hobby.
    description: "The BBC starts broadcasting from London in 1922 — the traveler listens to the first crackling programs and says every empire of the air starts as a hobby."
    status: "published"
    sha256: "120d220353934ab8b9088be3cf4bcd2432b4579cf5c16fde9ddf22b704205702"
  - number: "3409"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "One Day in Dublin"
    date: "1922 CE"
    region: "Paris, France"
    poem: |
      Joyce's Ulysses was published in Paris —
      One day, one city, a revolution in prose.
      I carried a first edition through the streets of Dublin,
      Bloom's Dublin, June 16, 1904, mapped street by street.
      Banned in America, burned in England, worshipped by writers —
      The novel as a cathedral of the ordinary.
      One man's Thursday became the century's epic.
      I have walked with Bloom. I know those streets.
      The ordinary, Joyce proved, is inexhaustible.
    description: "Joyce's Ulysses is published in Paris — one day in Dublin, and the traveler carries a first edition through Bloom's streets, calling the ordinary inexhaustible."
    status: "published"
    sha256: "995448096f53e39bb7675967f67945d8a9fa6badca648ebfb56231bc8dcebaf6"
  - number: "3410"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "April Is the Cruellest Month"
    date: "1922 CE"
    region: "England"
    poem: |
      Eliot published The Waste Land in 1922 —
      And the modern age found its poem.
      I read it in London, the fragments, the thunder,
      "What the thunder said" over a broken Europe.
      Five sections of ruin and prophecy, footnotes and all —
      The war's aftermath in verse, erudite and bleeding.
      It was difficult, and it was necessary.
      Every age gets the poem it deserves.
      This one got ashes, and a voice sifting through them.
    description: "Eliot publishes The Waste Land — the traveler reads it in London and says every age gets the poem it deserves; this one got ashes and a voice sifting through them."
    status: "published"
    sha256: "b49154eaf859088b5564244e49bac78a3b6093522fcdfba6761284bd9a05dcb1"
  - number: "3411"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Vampire Rises"
    date: "1922 CE"
    region: "Germany"
    poem: |
      Nosferatu brought Dracula to the screen —
      Horror's first masterpiece, the vampire as plague rat.
      I sat in a Berlin cinema, the shadows huge on the screen,
      Max Schreck's Count Orlok rising from his coffin.
      Stoker's widow sued and won; the prints were ordered destroyed —
      But the film survived, like vampires do.
      German Expressionism's shadows taught Hollywood everything.
      Fear, it turns out, photographs beautifully.
    description: "Nosferatu brings Dracula to the screen in 1922 — the traveler sits in a Berlin cinema and notes the film survived the court-ordered destruction, like vampires do."
    status: "published"
    sha256: "526e990a46c75b51c3d4bb660dfb61af25701830beb804bd98fc53fe38dbcd79"
  - number: "3412"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The First Shot"
    date: "1922 CE"
    region: "Toronto, Canada"
    poem: |
      A dying boy got the first insulin injection —
      Leonard Thompson, fourteen, wasted to a skeleton — and lived.
      I stood outside that Toronto ward in January,
      While Banting's extract did what no medicine had ever done.
      The boy who was dying got up. Walked. Lived.
      The discoverers sold the patent for a dollar —
      Insulin belongs to the world, they said.
      The first shot. The second chance.
    description: "A dying 14-year-old gets the first insulin injection in Toronto and lives — the traveler stands outside the ward and honors the discoverers who sold the patent for a dollar."
    status: "published"
    sha256: "f817e62ee641a026e6094d48f858509c0425d7c23c9f6c13e884fa0c99cb850d"
  - number: "3413"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Tokyo Falls"
    date: "1923 CE"
    region: "Tokyo, Japan"
    poem: |
      The earthquake struck at noon, and Tokyo fell —
      Then the firestorm came, and Yokohama burned too.
      I walked those ruins, the ash, the hundred and forty thousand dead,
      The city flattened in a day.
      In the panic, mobs murdered thousands of Koreans on rumors —
      The disaster's second crime, the human one.
      Japan rebuilt, modern, earthquake-proof, or trying.
      Nature destroys; humans decide what the destroying means.
    description: "The 1923 Great Kanto earthquake destroys Tokyo and Yokohama, killing 140,000 — the traveler walks the ruins and records the mobs' murder of Koreans as the disaster's second, human crime."
    status: "published"
    sha256: "097ec702002944ad96befc015a079bb7a1190c62ae3350f2df6b98e1f47324ed"
  - number: "3414"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Hitler's First Gamble"
    date: "1923 CE"
    region: "Munich, Germany"
    poem: |
      Hitler's beer-hall putsch failed in Munich —
      Sixteen Nazis dead in the street, Hitler in prison.
      I watched the trial, the clown turned martyr,
      And the judges gave him a soapbox instead of a sentence.
      In Landsberg Prison he wrote Mein Kampf —
      The blueprint, ignored by the world.
      His first gamble failed. It taught him to seek power legally.
      The republic showed him mercy. He would show it none.
    description: "Hitler's 1923 beer-hall putsch fails and he writes Mein Kampf in prison — the traveler watches the trial and notes the republic showed him mercy; he would show it none."
    status: "published"
    sha256: "d9a33ecc946020892df628f90e9fad4a7ee17fac3cbad7d90c1fe9977b347951"
  - number: "3415"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Ataturk's Republic"
    date: "1923 CE"
    region: "Turkey"
    poem: |
      Ataturk proclaimed the Turkish Republic —
      The Ottoman Empire, six centuries old, was gone.
      I stood in Ankara for the ceremonies,
      The fez banned, the alphabet Latinized, the caliphate abolished.
      A general remade a nation by willpower —
      Secular, modern, Turkish, all at once.
      It was the most successful revolution of the century's first half.
      The empire died; the nation lived.
      Few men ever rebuilt a country so completely.
    description: "Ataturk proclaims the Turkish Republic in 1923 — the traveler stands in Ankara as a general remakes a nation: fez banned, alphabet Latinized, caliphate abolished."
    status: "published"
    sha256: "6d1b0f85266496e6d36749429812f3ff2f7227df4bd862064ffd43006f36c184"
  - number: "3416"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The News Weekly"
    date: "1923 CE"
    region: "USA"
    poem: |
      TIME's first issue hit the newsstands in 1923 —
      The news got a weekly rhythm.
      I bought a copy, thin and earnest,
      Briton Hadden's idea: the busy man, briefed.
      It invented the newsmagazine — the week, digestible —
      And taught America to consume history seven days at a time.
      Person of the Year, the red border, the covers —
      All descended from that first thin issue.
      The century learned to read itself weekly.
    description: "TIME's first issue hits newsstands in 1923 — the traveler buys a thin earnest copy and says the century learned to read itself weekly."
    status: "published"
    sha256: "25d33534bb1222a9ec5497c64b5f88e029cfd49e662ad794d0627f91bfbee041"
  - number: "3417"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The House That Ruth Built"
    date: "1923 CE"
    region: "New York, USA"
    poem: |
      Yankee Stadium opened in the Bronx —
      Baseball got its cathedral, the House That Ruth Built.
      I sat in the stands on opening day, the Babe homering, of course,
      Sixty thousand people in the grandest park ever built.
      The Yankees would win the Series that first year.
      It stood for 85 years — Ruth, Gehrig, DiMaggio, Mantle —
      A temple of summer afternoons.
      They tore it down. The memories wouldn't demolish.
    description: "Yankee Stadium opens in the Bronx in 1923 — the traveler sits in the stands on opening day and calls it a temple of summer afternoons whose memories wouldn't demolish."
    status: "published"
    sha256: "e7be334188883025c37d8b5c441170fcff66f5343e55e9cc5dff7c569c56314f"
  - number: "3418"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Mouse House Begins"
    date: "1923 CE"
    region: "California, USA"
    poem: |
      Walt and Roy Disney founded their studio in Hollywood —
      A garage, a camera, and a mouse not yet dreamed of.
      I walked past that first little studio on Kingswell Avenue,
      Two brothers, broke, stubborn, drawing.
      Alice comedies first, then Oswald, then the mouse —
      The entertainment empire began in that garage.
      Every castle, every park, every princess:
      All of it started with two brothers and a rented camera.
    description: "Walt and Roy Disney found their studio in Hollywood in 1923 — the traveler walks past the garage on Kingswell Avenue where the entertainment empire began."
    status: "published"
    sha256: "0f4408ed15a2648471ccf5249ebd9de7287d25ffa8247b7ec371246a374d1c0b"
  - number: "3419"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Lenin Dies, Stalin Waits"
    date: "1924 CE"
    region: "Russia"
    poem: |
      Lenin died in January 1924 —
      And the embalmed body lay in Red Square while Stalin seized the levers.
      I stood in the line of mourners in the Moscow cold,
      The workers weeping for the man who had promised them everything.
      Behind the grief, the maneuvering had already begun —
      Trotsky out, Stalin in, the revolution eating its fathers.
      The mausoleum kept the corpse; the Party kept the power.
      I watched the funeral and thought: the revolution died here too,
      It just took seventy years to bury it.
    description: "Lenin dies in 1924 and Stalin seizes the levers — the traveler stands in the mourners' line in the Moscow cold and thinks the revolution died here too; it just took seventy years to bury."
    status: "published"
    sha256: "ff5f8c51a31a33d531d02335b88f686be5a19a2eabf7c8d9a1adf056f31fba0d"
  - number: "3420"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Winter Gets Its Games"
    date: "1924 CE"
    region: "Chamonix, France"
    poem: |
      The first Winter Olympics opened at Chamonix —
      Speed on ice and snow, in the shadow of Mont Blanc.
      I stood at the ski jump, the cold biting,
      Watching athletes do what humans were never designed to do, beautifully.
      Sixteen nations, two hundred fifty athletes —
      Bobsleds, skaters, skiers, the winter world at play.
      The Games had been summer-only; now the cold got its own.
      Every February since, the snow has had its champions.
    description: "The first Winter Olympics open at Chamonix in 1924 — the traveler stands at the ski jump in the cold and watches humans do beautifully what they were never designed to do."
    status: "published"
    sha256: "8b3285566f67b39f84fc07507444e130135841917b4674b6d8c10001436cebc0"
  - number: "3421"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Around the World by Air"
    date: "1924 CE"
    region: "Worldwide"
    poem: |
      American Army planes circled the globe in 175 days —
      The first aerial circumnavigation.
      I tracked their route, the Douglas World Cruisers,
      Seattle to Seattle, the long way around.
      Two of the four made it; the others crashed or sank.
      Twenty-six thousand miles of ocean, desert, jungle —
      The planet, flown around, for the first time.
      Lindbergh would do it alone in three years.
      These men did it first, together, the hard way.
    description: "American Army planes circle the globe in 175 days in 1924 — the first aerial circumnavigation, and the traveler tracks the Douglas World Cruisers on their 26,000-mile route."
    status: "published"
    sha256: "368e074b5173acad4e10793c8f3d500f1e0000c9ac97a10a0e65bb8540506aca"
  - number: "3422"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Citizens at Last"
    date: "1924 CE"
    region: "USA"
    poem: |
      Native Americans were granted US citizenship in 1924 —
      After centuries of broken promises.
      I sat with the elders who heard the news,
      Men who had fought in the Great War for a country that didn't count them.
      Citizenship by act of Congress — the Indian Citizenship Act —
      A century and a half after the nation's birth.
      It was justice, and it was late, and it was incomplete —
      The states kept finding ways to keep them from voting.
      At last, but not quite.
    description: "Native Americans are granted US citizenship in 1924 — the traveler sits with elders who fought in the Great War for a country that didn't count them, and calls it justice, late and incomplete."
    status: "published"
    sha256: "ada652940fe9aed827591db2393f17826bd40b4b0f8519c80339c077ee7e1cbf"
  - number: "3423"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Dreams Take Over"
    date: "1924 CE"
    region: "Paris, France"
    poem: |
      Breton's manifesto launched Surrealism in 1924 —
      Logic is out, dreams are in.
      I sat in the Paris cafés with the surrealists,
      The automatic writing, the exquisite corpses, Dalí not yet arrived.
      Freud had mapped the unconscious; they moved into it.
      Melting clocks, bowler hats, lobsters on telephones —
      The irrational as revolution.
      It was play as protest, dream as politics.
      The century's subconscious, given a manifesto.
    description: "Breton's 1924 manifesto launches Surrealism — the traveler sits in Paris cafés with the movement and calls it the century's subconscious given a manifesto."
    status: "published"
    sha256: "d98f443ff2aeaf65fbc45858868c198d3e68c37ff6019de3321d92dac80cdfcb"
  - number: "3424"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Chariots of Fire"
    date: "1924 CE"
    region: "France"
    poem: |
      The Paris Games gave us Liddell and Abrahams —
      Faith and speed on the track.
      I was in the stadium for Liddell's 400 meters,
      The Scotsman who wouldn't run on Sunday, running for God.
      Abrahams, the Cambridge Jew, running against prejudice itself.
      Two men, two motives, one finish line —
      And a film would make them immortal sixty years later.
      The Olympics at their best: not nations, but persons.
    description: "The 1924 Paris Games give us Liddell and Abrahams — the traveler is in the stadium and says the Olympics at their best are not nations but persons."
    status: "published"
    sha256: "e0d05f4fd46ca363b2792895734fe2b6058af5fe8d375aa663d9f92402bc9188"
  - number: "3425"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Parade Begins"
    date: "1924 CE"
    region: "New York, USA"
    poem: |
      Macy's first Thanksgiving parade marched down Broadway —
      With live animals from the Central Park Zoo.
      I stood on the curb that morning, the elephants, the camels,
      Ten thousand employees in costume, Santa closing the show.
      No balloons yet — those came in 1927, Felix the Cat first.
      A department store invented America's Thanksgiving morning.
      A century of parades started with zoo animals on Broadway.
      Traditions, I have learned, are just habits that survived.
    description: "Macy's first Thanksgiving parade marches down Broadway in 1924 with live zoo animals — the traveler stands on the curb and says traditions are just habits that survived."
    status: "published"
    sha256: "ebaf5379a9e8fd77e66744334d24ff84f3ab5ef307406495ec8504920952a6d4"
  - number: "3426"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Jazz Age's Novel"
    date: "1925 CE"
    region: "USA"
    poem: |
      Fitzgerald published The Great Gatsby in 1925 —
      The American Dream in a green light.
      I read it fresh, that slim perfect novel,
      Gatsby's parties, Daisy's voice like money, the eyes of T.J. Eckleburg.
      It flopped at first — Fitzgerald died thinking himself a failure.
      Then the century caught up with it.
      The green light, the lost dream, the careless people —
      America's autobiography, written in advance.
    description: "Fitzgerald publishes The Great Gatsby in 1925 — the traveler reads it fresh and calls it America's autobiography, written in advance; it flopped first, then the century caught up."
    status: "published"
    sha256: "22de3bd7c4eb04aa8cdca57645874f6ad68510f5ebdbd7a4dc2c3144db7050b8"
  - number: "3427"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Monkey Trial"
    date: "1925 CE"
    region: "Tennessee, USA"
    poem: |
      A teacher was tried for teaching evolution in Dayton —
      Bryan and Darrow dueled in the Tennessee heat.
      I sat in that courtroom-turned-circus,
      The Great Commoner against the agnostic lawyer, science on trial.
      Scopes was convicted — the law was the law —
      But Darrow had put fundamentalism on the stand, and it showed.
      Broadcast on radio, the first trial of the century.
      The verdict was guilty. The judgment of history was otherwise.
    description: "The Scopes trial puts evolution on trial in Dayton, Tennessee — the traveler sits in the courtroom-circus and says the verdict was guilty but the judgment of history was otherwise."
    status: "published"
    sha256: "9b666e2ae1e138e1da518951e636ee3c9d083e513b998c4387488eeb77ef5dbd"
  - number: "3428"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Television Is Born"
    date: "1925 CE"
    region: "England"
    poem: |
      John Logie Baird demonstrated television in London —
      Moving pictures through the air, a flickering face.
      I stood in that Soho laboratory, watching a ventriloquist's dummy
      Become the first television star — Stooky Bill.
      Thirty lines, dim and ghostly, but it moved.
      The box in the corner of every living room began here,
      In a cold London attic with a spinning disk.
      The century's window, invented by a Scotsman with a cough.
    description: "Baird demonstrates television in London in 1925 — a flickering dummy's face, thirty lines, and the traveler says the century's window began in a cold Soho attic."
    status: "published"
    sha256: "7977f93d9ae60137222b5b53c90b74d33c0252bdc60d215f99806d8ba782aa5d"
  - number: "3429"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Spirit of Locarno"
    date: "1925 CE"
    region: "Switzerland"
    poem: |
      Europe's foreign ministers promised peace at Locarno —
      The champagne years, the spirit of Locarno.
      I walked Lake Maggiore's shores that autumn,
      Briand and Stresemann smiling, borders guaranteed.
      Germany joined the League; the Rhineland was safe.
      It felt like the war was finally over.
      It wasn't. The promises were paper, the goodwill was real but thin.
      Peace needs more than spirit. It needs teeth.
      Locarno had champagne. It needed an army.
    description: "Europe's foreign ministers promise peace at Locarno in 1925 — the traveler walks Lake Maggiore and says peace needs more than spirit; Locarno had champagne but needed teeth."
    status: "published"
    sha256: "087b74c15bd6b1fffe234e4c13f87e7bbfc17511a0c7522f99144199b0f88eb7"
  - number: "3430"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Quantum Leap"
    date: "1925 CE"
    region: "Germany"
    poem: |
      Heisenberg invented matrix mechanics in 1925 —
      The quantum world got its mathematics.
      I cannot claim I followed every equation —
      A young German, hay fever on Heligoland, reimagining reality.
      Only the measurable is real, he said; the rest is poetry.
      Atoms as tables of numbers, position and momentum divorced forever.
      It was the strangest physics ever written,
      And it worked. It always worked.
      The universe, it turns out, runs on matrices.
    description: "Heisenberg invents matrix mechanics in 1925 — the traveler admits he can't follow every equation but honors the young German who reimagined reality on Heligoland."
    status: "published"
    sha256: "ba52d577c2b6f973a6a508a1f579c5aa2e979070b65e7b3bcc571b9185debebd"
  - number: "3431"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Wit, Weekly"
    date: "1925 CE"
    region: "USA"
    poem: |
      The New Yorker published its first issue —
      Cartoons, talk, and high polish.
      I bought one at a Manhattan newsstand, fifteen cents,
      Harold Ross's gamble: a magazine for the sophisticated.
      It nearly died in months; then it lived forever —
      Thurber, White, Dorothy Parker, the Algonquin in print.
      The Talk of the Town, the cartoons, the fact-checking —
      A century of American wit, weekly.
      It taught the country how to be funny on purpose.
    description: "The New Yorker publishes its first issue in 1925 — the traveler buys one for fifteen cents and says it taught the country how to be funny on purpose."
    status: "published"
    sha256: "d6769b6196d5e21d60b6df020ec0a2631883f1592955218c975309dacc109095"
  - number: "3432"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Book of Hate"
    date: "1925 CE"
    region: "Germany"
    poem: |
      Mein Kampf was published — Hitler's blueprint,
      Ignored by the world, read by his followers.
      I held that turgid book in a Munich shop,
      The rage, the racism, the plan — all of it, in print.
      He told them exactly what he would do.
      The world called it the ravings of a failed putschist.
      It sold modestly; the ideas sold catastrophically.
      When a man writes down his crimes in advance,
      Believe him. The century didn't. It should have.
    description: "Mein Kampf is published in 1925 — Hitler's blueprint, ignored by the world, and the traveler holds the turgid book and says when a man writes down his crimes in advance, believe him."
    status: "published"
    sha256: "871ed4938c0d0ce08cbd60cb097aaace637a81a7c9b4388f121b9a3d6882d00c"
  - number: "3433"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Nine Days That Shook Britain"
    date: "1926 CE"
    region: "England"
    poem: |
      Two million British workers struck for nine days —
      The General Strike, and the government held.
      I walked the picket lines, the volunteers driving the trains,
      The BBC's first great test, the country holding its breath.
      The miners were the cause; the nation was the battlefield.
      The TUC called it off, the miners fought on alone — and lost.
      The unions broke; the laws tightened.
      Nine days that proved the state could outlast its workers.
      Britain learned. The workers learned harder.
    description: "Two million British workers strike for nine days in 1926 — the traveler walks the picket lines and says the strike proved the state could outlast its workers; the workers learned harder."
    status: "published"
    sha256: "8bd137be6915dbf56cea916f78b9ed326023bda3ed7423e1f28f9cff7f38d3b0"
  - number: "3434"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The First Liquid-Fuel Rocket"
    date: "1926 CE"
    region: "Massachusetts, USA"
    poem: |
      Goddard launched the first liquid-fuel rocket —
      It flew forty-one feet in two and a half seconds.
      I stood in that Auburn cabbage field, the cold March air,
      And watched the future rise forty-one feet and fall.
      The newspapers mocked him — the "moon man."
      He kept launching, kept calculating, kept going.
      Every rocket that ever left Earth descends from that cabbage field.
      Forty-one feet. The longest forty-one feet in history.
    description: "Goddard launches the first liquid-fuel rocket in 1926 — forty-one feet in a Massachusetts cabbage field, mocked by newspapers, ancestor of every rocket since."
    status: "published"
    sha256: "e1aaac1379000ecac0e8b90a21dcb0ed472d2af6a8133ff1a59f6261dd524f14"
  - number: "3435"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Bear of Little Brain"
    date: "1926 CE"
    region: "England"
    poem: |
      Winnie-the-Pooh was published —
      And the Hundred Acre Wood opened forever.
      I read it to children who are now grandparents,
      Pooh's hums, Piglet's courage, Eeyore's gloom.
      Milne wrote it for his son, Christopher Robin,
      And the world adopted the bear of little brain.
      A children's book that adults quote like scripture —
      Think, think, think, and other deep Pooh wisdom.
      The wisest philosophy of the century wore a red shirt.
    description: "Winnie-the-Pooh is published in 1926 — the traveler reads it to children now grandparents and says the century's wisest philosophy wore a red shirt."
    status: "published"
    sha256: "fcf010da84ffe9615cff94104bd233559145a985ff62ebbc92f1865fd1cdf432"
  - number: "3436"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Network Is Born"
    date: "1926 CE"
    region: "USA"
    poem: |
      NBC became America's first radio network —
      And the nation listened together.
      I tuned in those first nights, the chimes, the fanfare,
      One program, coast to coast, millions of ears at once.
      The country had never shared a moment like this —
      The same voice in every parlor, the same laugh, the same news.
      Radio's golden age began with that network.
      The nation, for the first time, had a single hearth.
    description: "NBC becomes America's first radio network in 1926 — the traveler tunes in and says the nation, for the first time, had a single hearth."
    status: "published"
    sha256: "15d1544c78959fce22514f370e0dd1f23e7dd9e2487c21177e3364722278ff19"
  - number: "3437"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Channel Conquered"
    date: "1926 CE"
    region: "France to England"
    poem: |
      Gertrude Ederle swam the English Channel —
      Faster than any man before her, fourteen hours thirty-one minutes.
      I watched from a boat, the waves, the cold,
      Nineteen years old, greased and goggled, unstoppable.
      The men who had done it took longer; she beat them all.
      New York gave her a ticker-tape parade —
      Two million people for a swimmer.
      She'd been told women couldn't. She just kept swimming.
    description: "Gertrude Ederle swims the English Channel faster than any man before her — the traveler watches from a boat as the 19-year-old beats every male record."
    status: "published"
    sha256: "e2f0be27ac2dc4f87d4cc7cd2f277c71f9ced59210ba9ceba2dea4a515aa1c7d"
  - number: "3438"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Showa Era Begins"
    date: "1926 CE"
    region: "Japan"
    poem: |
      Hirohito became emperor — the Showa era began,
      Enlightened peace, the name promised.
      I stood in Tokyo for the ceremonies, the solemnity,
      Not knowing the era would bring war and ruin.
      Manchuria, China, Pearl Harbor, Hiroshima —
      The Showa years would hold Japan's darkest chapters.
      Then the long peace, the miracle economy, the apology never quite made.
      Sixty-two years, from empire to ashes to prosperity.
      Names promise. History decides.
    description: "Hirohito becomes emperor in 1926, beginning the Showa era — the traveler stands in Tokyo knowing the \"enlightened peace\" will hold war, ruin, and then miracle; names promise, history decides."
    status: "published"
    sha256: "b96d1c95dcfc741eddc102b7fcb0a5b07b121a0b88b75455459a693f2478da44"
  - number: "3439"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Lucky Lindy"
    date: "1927 CE"
    region: "Atlantic"
    poem: |
      Lindbergh flew New York to Paris solo —
      Thirty-three hours, one man, one plane, the Spirit of St. Louis.
      I was at Le Bourget when he landed, the crowd going mad,
      A hundred thousand Frenchmen carrying the shy American.
      He hadn't slept; he'd fought the fog and the ice and himself.
      The most famous flight in history — and the loneliest.
      Paris gave him everything. America gave him a parade.
      For a night, the whole world agreed on a hero.
    description: "Lindbergh flies New York to Paris solo in 33 hours — the traveler is at Le Bourget when he lands and says for one night the whole world agreed on a hero."
    status: "published"
    sha256: "ef35ce3c8ce2aa527d3a8532edf0bf00859248887e903fec1aa19e7c260a5e26"
  - number: "3440"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Movies Learn to Talk"
    date: "1927 CE"
    region: "USA"
    poem: |
      The Jazz Singer brought synchronized speech —
      "You ain't heard nothin' yet!"
      I sat in the theater that October night,
      And heard Al Jolson's voice come out of the screen.
      The silent era ended in that sentence.
      Actors with bad voices panicked; studios rebuilt overnight.
      The talkies: the movies grew a voice, and lost their universality.
      But oh, that first "Mammy" — the audience gasped.
      Sound had arrived. Silence never came back.
    description: "The Jazz Singer brings synchronized speech to film in 1927 — the traveler hears Jolson's voice come out of the screen and says the silent era ended in that sentence."
    status: "published"
    sha256: "1a1ac6eb33a2e2ba440c0fe27e4294d4d9de69810c5114e81d30154dd27ab49e"
  - number: "3441"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Sixty"
    date: "1927 CE"
    region: "USA"
    poem: |
      Babe Ruth hit sixty home runs in 1927 —
      A record that stood for thirty-four years.
      I was at the Stadium for number sixty, off Tom Zachary,
      The Babe rounding the bases, grinning that grin.
      Murderers' Row, the greatest team ever assembled —
      Ruth and Gehrig, back to back, terrifying pitchers.
      Sixty: the number every slugger chased for a generation.
      Maris got sixty-one in '61. The asterisk people argued.
      The Babe just hit them.
    description: "Babe Ruth hits 60 home runs in 1927 — the traveler is at the Stadium for number sixty and says every slugger for a generation chased that number."
    status: "published"
    sha256: "b6e6a9fc748c2734c03567e97eb4d9aee9aaddd0202a423e95912134d5611952"
  - number: "3442"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Nothing Is Certain"
    date: "1927 CE"
    region: "Germany"
    poem: |
      Heisenberg's uncertainty principle, 1927:
      The quantum world refuses to be pinned down.
      I sat with the physicists in Copenhagen, the arguments,
      Einstein insisting God does not play dice, Bohr insisting He might.
      Position and momentum, energy and time —
      Know one precisely, lose the other.
      It wasn't ignorance; it was the nature of things.
      The universe keeps its secrets not by hiding them,
      But by making them unaskable.
    description: "Heisenberg's uncertainty principle in 1927 — the traveler sits with the arguing physicists in Copenhagen and says the universe keeps secrets by making them unaskable."
    status: "published"
    sha256: "1152ca168f0da49a4f04b77f973237341a4ad10426a7a77a94829696a6c6e685"
  - number: "3443"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Purge in Shanghai"
    date: "1927 CE"
    region: "China"
    poem: |
      Chiang Kai-shek turned on the Communists in Shanghai —
      The streets ran red in the White Terror.
      I walked those streets in April, the bodies,
      The labor organizers dragged out and shot.
      The united front was over; the civil war had begun —
      Twenty-two years of it, off and on, until 1949.
      Chiang chose the gangsters and the bankers over the revolution.
      The purge was meant to kill communism in China.
      It drove it into the countryside, where it grew.
    description: "Chiang Kai-shek purges the Communists in Shanghai in 1927 — the traveler walks the bloody streets and notes the purge drove communism into the countryside, where it grew."
    status: "published"
    sha256: "9d3be02f79e260aec94bd71a6b15bcf7ab5bd1819203d25efb53d04b7e456c9d"
  - number: "3444"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Universe Has a Birthday"
    date: "1927 CE"
    region: "Belgium"
    poem: |
      A Belgian priest proposed the universe began in a primeval atom —
      Lemaître, and the Big Bang before it had a name.
      I sat in Louvain while he explained it,
      A priest doing cosmology, the Church not minding for once.
      The universe has a birthday — thirteen point eight billion years ago.
      Einstein first dismissed it; Hubble's data converted him.
      From one man's equations, the whole of creation, expanding.
      The priest was right. The universe began.
    description: "Belgian priest Lemaître proposes the universe began in a primeval atom in 1927 — the traveler sits in Louvain and says the priest was right: the universe has a birthday."
    status: "published"
    sha256: "c42c5de42a42908d27d5fbfa4f6acdcdbe47250435664a8bf71a70e7e86a0c5b"
  - number: "3445"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Execution"
    date: "1927 CE"
    region: "Massachusetts, USA"
    poem: |
      Sacco and Vanzetti went to the electric chair in 1927 —
      And the world marched in protest.
      I stood outside Charlestown Prison that August night,
      The crowds, the silence, the lights dimming across Boston.
      They were innocent — history says so now —
      But Massachusetts needed its anarchists guilty.
      Fifty years later the governor proclaimed their innocence.
      Too late for the chair. Never too late for the truth.
      The execution taught the world what American justice could do.
    description: "Sacco and Vanzetti are executed in 1927 as the world protests — the traveler stands outside Charlestown Prison and says the truth came fifty years late, but came."
    status: "published"
    sha256: "aa50db206d44d05ac2985ad361222e1ebb198b201b28ffedea446bfbd20e903c"
  - number: "3446"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Mold That Heals"
    date: "1928 CE"
    region: "England"
    poem: |
      Fleming noticed mold killing bacteria in a London lab —
      Penicillin, and the antibiotic age began.
      I looked at that petri dish, the clear zone around the mold,
      The most important accident in medical history.
      He published it; the world ignored it for a decade.
      Florey and Chain would finish the work in the war.
      But it started with a messy lab and an observant Scotsman.
      Chance favors the prepared mind — and saves the rest of us.
    description: "Fleming notices mold killing bacteria in 1928 — the traveler looks at the petri dish and calls it the most important accident in medical history."
    status: "published"
    sha256: "30aa50e578b338bf826696d0b773394c926886e804a9e9d56441db5f7e0cda36"
  - number: "3447"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Mouse Who Whistled"
    date: "1928 CE"
    region: "USA"
    poem: |
      Steamboat Willie premiered — Mickey Mouse whistled,
      And animation grew up.
      I sat in the Colony Theater that November,
      The synchronized sound, the little mouse at the ship's wheel.
      Disney had lost Oswald; he bet everything on the mouse.
      It worked. The mouse became the century's mascot —
      The most recognized figure on Earth, whiskers and all.
      Animation's first star was a whistling rodent.
      The empire started with a whistle.
    description: "Steamboat Willie premieres in 1928 — Mickey Mouse whistles at the ship's wheel, and the traveler says the entertainment empire started with a whistle."
    status: "published"
    sha256: "12fc61b421f09fb95f933f05f116906fde4c61baa41d3dc73bf8a4b4681ede3f"
  - number: "3448"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Votes for All Women"
    date: "1928 CE"
    region: "England"
    poem: |
      Britain gave all women over twenty-one the vote —
      The suffragettes' fight was won.
      I stood outside Parliament for the final passage,
      Ten years after the first crack, the door swung wide.
      Equal with men at last — no more thirty-and-over compromise.
      Emmeline Pankhurst died weeks before it passed;
      She missed the victory by days.
      The long march — the marches, the hunger strikes, the force-feeding —
      Ended in law. The fight had been worth it.
    description: "Britain gives all women over 21 the vote in 1928 — the traveler stands outside Parliament; Pankhurst died weeks before, missing the victory by days."
    status: "published"
    sha256: "58ade5de1837fa397bd48939efaff4365794e14bf2cfaaa7c357d0548cb1ec1f"
  - number: "3449"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "War Is Outlawed"
    date: "1928 CE"
    region: "Paris, France"
    poem: |
      Sixty-two nations signed a pact outlawing war in Paris —
      The Kellogg-Briand Pact. Hope, on paper.
      I watched the signatures, the solemn faces,
      War renounced as an instrument of policy.
      It changed nothing — the cheaters kept cheating —
      But it changed everything: aggression became a crime.
      Nuremberg would hang men on the strength of that paper.
      Hope on paper is still hope. Sometimes paper holds.
    description: "62 nations sign the Kellogg-Briand Pact outlawing war in 1928 — the traveler watches the signatures and says Nuremberg would hang men on the strength of that paper."
    status: "published"
    sha256: "2383da1627690522304f4e9f0be7ac9314510ee7a3d8cd84f863555e6a0a5f98"
  - number: "3450"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Women Run at Last"
    date: "1928 CE"
    region: "Amsterdam, Netherlands"
    poem: |
      Women competed in Olympic track and field for the first time —
      Amsterdam, 1928, and the cinder track opened.
      I sat in the stadium, the 100 meters, the first women's finals,
      The old men predicting collapse, the women just running.
      They ran. They didn't collapse. They won.
      It took until 1928 for the Olympics to admit
      That women could run in circles fast.
      The track never looked back.
    description: "Women compete in Olympic track and field for the first time at Amsterdam 1928 — the traveler sits in the stadium as the old men's predictions collapse and the women just run."
    status: "published"
    sha256: "b036d24bc3f63c2b56e87f7e7c5db5592e493ae07e84428c5f8f5381838dc5f3"
  - number: "3451"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "A Woman Crosses the Ocean"
    date: "1928 CE"
    region: "Atlantic"
    poem: |
      Amelia Earhart became the first woman to fly the Atlantic —
      As a passenger, for now. She kept the log; she wanted the controls.
      I met her before the flight, that grin, that determination,
      Twenty years before she would vanish.
      She called herself "a sack of potatoes" on that first crossing —
      But she was studying, learning, preparing.
      Four years later she'd fly it solo.
      The passenger was just the beginning.
    description: "Amelia Earhart becomes the first woman to fly the Atlantic in 1928, as a passenger — the traveler meets her beforehand and says the passenger was just the beginning."
    status: "published"
    sha256: "6101519c8fcba16ac2e5d88bfcc8b6b0da18752a2786acb78ad82f1c5e585c52"
  - number: "3452"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Greatest Thing"
    date: "1928 CE"
    region: "USA"
    poem: |
      Sliced bread went on sale in 1928 —
      The benchmark for every invention after.
      I bought a loaf in Chillicothe, Missouri, where it started,
      Otto Rohwedder's machine, the bread sliced and wrapped.
      "The greatest thing since sliced bread" —
      Nothing has ever beaten it as a compliment.
      It seems small. It isn't.
      Civilization advances one convenience at a time,
      And this one fed the century.
    description: "Sliced bread goes on sale in 1928 — the traveler buys a loaf in Chillicothe, Missouri, and says civilization advances one convenience at a time."
    status: "published"
    sha256: "bad3ff5426e087bab9c9c90505ac41ff7b1f84c9cfbf6f96c3f943919cd81035"
  - number: "3453"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Five-Year Plan"
    date: "1928 CE"
    region: "Russia"
    poem: |
      Stalin launched the first Five-Year Plan —
      Industrialization by decree and terror.
      I walked the construction sites, Magnitogorsk rising from nothing,
      The propaganda, the quotas, the impossible targets.
      It worked, after a fashion — Russia industrialized in a decade —
      And it killed millions: the kulaks, the famine, the camps.
      Progress by force, modernity by murder.
      The Plan built the factories that would beat Hitler.
      The Plan's cost is still being counted.
    description: "Stalin launches the first Five-Year Plan in 1928 — the traveler walks the Magnitogorsk construction sites and calls it progress by force, modernity by murder, its cost still being counted."
    status: "published"
    sha256: "aa3290837a57214bddfc1d09f53b3a3dbe902312bd15e23a7e7f0e56a365da32"
  - number: "3454"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Black Thursday"
    date: "1929 CE"
    region: "New York, USA"
    poem: |
      The market crashed on Black Thursday —
      And the Great Depression began.
      I stood on Wall Street as the ticker fell behind,
      The crowds, the rumors of jumpers, the end of the party.
      Thirteen million shares; the wealth of a decade, gone in hours.
      The crash didn't cause the Depression alone —
      But it lit the fuse, and the world blew up economically.
      Breadlines, bank failures, the Dust Bowl to come.
      The Jazz Age ended at the closing bell.
    description: "The stock market crashes on Black Thursday 1929 — the traveler stands on Wall Street as the ticker falls behind and the Jazz Age ends at the closing bell."
    status: "published"
    sha256: "bb46539d16cf4fe1a46d8fd5ea41d4b8052e4768a4064de8df8fa22c13daeadc"
  - number: "3455"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Oscars Begin"
    date: "1929 CE"
    region: "California, USA"
    poem: |
      The first Academy Awards honored Wings and Sunrise —
      Hollywood crowned itself.
      I sat in the Blossom Room of the Roosevelt Hotel,
      Two hundred seventy guests, fifteen minutes, no television.
      Mary Pickford won; the statuette wasn't yet called Oscar.
      It was a private party that became the world's stage —
      A billion people would watch it one day.
      Hollywood's self-congratulation, made into a global ritual.
      And I was there when it was just dinner.
    description: "The first Academy Awards honor Wings and Sunrise in 1929 — the traveler sits in the Roosevelt Hotel's Blossom Room when it was just a fifteen-minute dinner."
    status: "published"
    sha256: "a7f734afcb46d551fa1b8272167d9afcac230eba08783084eaad5ffbbb198b3b"
  - number: "3456"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Universe Expands"
    date: "1929 CE"
    region: "USA"
    poem: |
      Hubble found the galaxies fleeing —
      The universe is growing, expanding, every second.
      I stood at Mount Wilson, the 100-inch telescope,
      While the redshifts piled up: farther, faster, gone.
      Einstein called his cosmological constant his greatest blunder.
      Lemaître's primeval atom had its proof.
      The universe had a birthday and it was still celebrating —
      Everything rushing away from everything else.
      I have watched it expand for eons. It never gets old.
    description: "Hubble discovers the galaxies fleeing in 1929 — the universe is expanding, and the traveler stands at Mount Wilson watching the redshifts pile up."
    status: "published"
    sha256: "88223cb4467b4061604d1cf657755b17d38a2bc1f67807df069f670601c5bc29"
  - number: "3457"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Vatican Becomes a State"
    date: "1929 CE"
    region: "Vatican City and Italy"
    poem: |
      Mussolini and the Pope signed the Lateran Treaty —
      And Vatican City was born, 109 acres, the world's smallest state.
      I watched the signatures, the strange bargain:
      The Church recognized Italy; Italy paid the Church.
      The Roman Question, sixty years old, settled.
      The Pope got his sovereignty; Mussolini got his respectability.
      Both used the other. That's diplomacy.
      The smallest country on Earth, and one of the oldest powers.
    description: "The Lateran Treaty makes Vatican City a state in 1929 — the traveler watches Mussolini and the Pope sign and calls it diplomacy: both used the other."
    status: "published"
    sha256: "93787fe18f4dab4658484bd3a6932c77df32b621b76343970ae62336220b985d"
  - number: "3458"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Valentine's Day Massacre"
    date: "1929 CE"
    region: "Chicago, USA"
    poem: |
      Capone's men machine-gunned seven rivals in a Chicago garage —
      Gangland's darkest day.
      I walked past that garage on North Clark Street,
      The brick wall, the chalk outlines, the Tommy guns' echo.
      Seven men lined up and shot like dogs — on Valentine's Day.
      Capone was in Florida; nobody could prove a thing.
      The massacre made him infamous and doomed him —
      The public demanded action, and the taxmen obliged.
      Crime's golden age, gilded with blood.
    description: "Capone's men machine-gun seven rivals in a Chicago garage on Valentine's Day 1929 — the traveler walks past the brick wall and says the massacre doomed Capone by demanding action."
    status: "published"
    sha256: "7c6a4dedf1b0e6094270c7afa48e428ccde40483e7bcc0a4eb097687f8d02339"
  - number: "3459"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Modern Art Gets a Home"
    date: "1929 CE"
    region: "New York, USA"
    poem: |
      The Museum of Modern Art opened in New York —
      The avant-garde moved in.
      I walked those first galleries, the rented rooms,
      Van Gogh, Seurat, Cézanne — the moderns, legitimized.
      Three wealthy women founded it; the town called them the adamantine ladies.
      MoMA would define what counted as modern for a century.
      The rebels got a museum. The museum got the rebels.
      Art history, institutionalized — and it worked.
    description: "The Museum of Modern Art opens in New York in 1929 — the traveler walks the first rented galleries and says the rebels got a museum and the museum got the rebels."
    status: "published"
    sha256: "cd627973a1d9a57f92bca5808faa4905827e7a66e32d605947d4e3781e2e3615"
  - number: "3460"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Around the World by Airship"
    date: "1929 CE"
    region: "Germany"
    poem: |
      The Graf Zeppelin circled the globe in twenty-one days —
      The airship's golden moment.
      I watched her rise over Lakehurst, that silver giant,
      Twenty-one days, four continents, the world looking up.
      Hugo Eckener, the gentleman captain, the toast of the planet.
      It was the most graceful travel ever invented —
      And the most doomed. Eight years later, Lakehurst again, in flames.
      The golden moment, before the fire.
    description: "The Graf Zeppelin circles the globe in 21 days in 1929 — the traveler watches the silver giant rise and calls it the most graceful travel ever invented, before the fire."
    status: "published"
    sha256: "40d8ab3278f165896eefedb223b2542201f398facf9ac1214c3e72dfa06fbb7c"
  - number: "3461"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Blood in Hebron"
    date: "1929 CE"
    region: "Palestine"
    poem: |
      Arab riots killed sixty-seven Jews in Hebron —
      And the Mandate's peace was cracking.
      I walked the old city's alleys after the killing,
      The ancient Jewish community, centuries old, destroyed in days.
      The survivors were evacuated; Hebron's Jews were gone.
      It was 1929, and the pattern was set:
      Violence, reprisal, the British in the middle, pleasing no one.
      The land's long agony had found its modern rhythm.
    description: "Arab riots kill 67 Jews in Hebron in 1929 — the traveler walks the alleys after and says the land's long agony found its modern rhythm."
    status: "published"
    sha256: "f51b6a1f0677a4f355b53c5e1b3b70bea855978baccc2943986af3a88460558a"
  - number: "3462"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The March to the Sea"
    date: "1930 CE"
    region: "India"
    poem: |
      Gandhi walked 240 miles to the sea to make salt —
      And broke an empire's law with his hands.
      I marched those last miles with the column,
      The old man in the loincloth, the crowds growing.
      At Dandi he lifted the salt — illegal salt —
      And India lifted with him.
      The Salt March: civil disobedience made visible,
      The empire's monopoly broken by a handful of seawater.
      You cannot arrest an idea. They tried.
    description: "Gandhi walks 240 miles to the sea and makes illegal salt at Dandi — the traveler marches the last miles and says the empire's monopoly was broken by a handful of seawater."
    status: "published"
    sha256: "a2d4a8fb58812ac3abd26fd5d608d4bd091c9c0d832aa73826d1d7da92f017cc"
  - number: "3463"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Ninth Planet"
    date: "1930 CE"
    region: "Arizona, USA"
    poem: |
      Clyde Tombaugh found Pluto in Arizona —
      A speck at the edge of the solar system.
      I stood in the Lowell Observatory, the blink comparator,
      The young farm boy turned astronomer spotting the moving dot.
      The ninth planet — for seventy-six years.
      Then the astronomers demoted it, and the world protested.
      Planet or dwarf, it doesn't care.
      It's still out there, cold and faithful, whatever we call it.
    description: "Clyde Tombaugh finds Pluto in 1930 — a speck at the edge of the solar system, and the traveler says it's still out there, cold and faithful, whatever we call it."
    status: "published"
    sha256: "fac1805c085776507a211430230a852295dbdf3f7303952c1e7f6514ba9a766e"
  - number: "3464"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The World Cup Begins"
    date: "1930 CE"
    region: "Uruguay"
    poem: |
      Uruguay hosted and won the first World Cup —
      Football went global.
      I sat in the Centenario Stadium in Montevideo,
      Ninety thousand people, the hosts beating Argentina 4-2.
      Thirteen teams; Europe mostly stayed home — too far, they said.
      They'd learn. The World Cup became the planet's great ritual,
      Billions watching, every four years.
      It started in Montevideo, in winter, with thirteen teams.
    description: "Uruguay hosts and wins the first World Cup in 1930 — the traveler sits in the Centenario Stadium as football becomes the planet's great ritual."
    status: "published"
    sha256: "3dc9cee54cdcb3575b527e23581dac6370b56f62cd98cc085b950f61aba5ca73"
  - number: "3465"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Nazis Surge"
    date: "1930 CE"
    region: "Germany"
    poem: |
      The Nazis won 107 Reichstag seats in 1930 —
      The fringe became a force.
      I watched the returns come in, the brownshirts celebrating,
      From 12 seats to 107 — the Depression's gift to Hitler.
      Unemployment, humiliation, the republic's paralysis —
      The Nazis harvested it all.
      Respectable Germans still called him a clown.
      The clown had 107 seats and a private army.
      The republic was bleeding out, and the doctors were arguing.
    description: "The Nazis win 107 Reichstag seats in 1930 — the traveler watches the returns and says respectable Germans still called Hitler a clown; the clown had a private army."
    status: "published"
    sha256: "d0586df0d04ad7f689a0a0a54aa073f8e2a7e1385b4bcd5769b2a1d587422e17"
  - number: "3466"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Winter in a Box"
    date: "1930 CE"
    region: "USA"
    poem: |
      Birdseye's frozen foods hit the shelves in 1930 —
      Dinner got a freezer.
      I bought a package in Springfield, Massachusetts, the test market,
      Peas, frozen fast, tasting like they'd been picked that morning.
      Clarence Birdseye had learned flash-freezing from the Inuit in Labrador.
      The frozen dinner, the TV dinner, the whole cold chain —
      All descended from watching fish freeze in Arctic air.
      Winter, in a box, on every shelf.
    description: "Birdseye's frozen foods hit the shelves in 1930 — the traveler buys peas in Springfield and says winter came in a box, learned from Inuit flash-freezing in Labrador."
    status: "published"
    sha256: "c2d2a80933b0b4b12ee2d430971554f9fd8633eeb0e3d6c1173a94d577265b85"
  - number: "3467"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Vargas Takes Brazil"
    date: "1930 CE"
    region: "Brazil"
    poem: |
      Getulio Vargas seized power in Brazil —
      Latin America's strongman era began.
      I was in Rio for the revolution, the old republic falling,
      Vargas the gaucho lawyer, promising order and progress.
      He'd rule for fifteen years, then again —
      The Estado Novo, the father of the poor, the dictator.
      Brazil's modern state was built by his hands, for better and worse.
      Strongmen promise order. They deliver it, with interest.
    description: "Getulio Vargas seizes power in Brazil in 1930 — the traveler is in Rio and says strongmen promise order and deliver it, with interest."
    status: "published"
    sha256: "85020e2b52f0493f1fb9ad049f2337eb14b9511629b29e443f3aa5713b4f9b61"
  - number: "3468"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Mukden Incident"
    date: "1931 CE"
    region: "China"
    poem: |
      Japan staged an explosion at Mukden and seized Manchuria —
      The road to world war started in Asia.
      I stood by those railway tracks, the faked sabotage,
      The Kwantung Army's excuse, the League's impotence.
      Manchukuo: a puppet state, a puppet emperor — the last Qing boy.
      China appealed to Geneva; Geneva wrote a report.
      Japan walked out of the League.
      The 1930s' first aggression, unpunished.
      The road to Pearl Harbor began at Mukden.
    description: "Japan stages the Mukden explosion and seizes Manchuria in 1931 — the traveler stands by the railway tracks and says the road to Pearl Harbor began there."
    status: "published"
    sha256: "6847d456968b5bfcc011189b7cbf7ae90573ad9e675bc67b1f0cbbc2d2fba90c"
  - number: "3469"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Tallest in the World"
    date: "1931 CE"
    region: "New York, USA"
    poem: |
      The Empire State Building opened —
      102 stories into the Depression sky.
      I rode the elevator to the observation deck,
      The city spread below, the men who built it mostly jobless now.
      Thirteen months to build, the fastest skyscraper ever —
      And half empty for years, the Empty State Building.
      But it stood, and stands: the Depression's defiant tower.
      Hope, in limestone and steel, 1,454 feet tall.
    description: "The Empire State Building opens in 1931 — 102 stories into the Depression sky, and the traveler rides to the observation deck and calls it hope in limestone and steel."
    status: "published"
    sha256: "e3c9f7326e3f4d9100d00b32023bf3ca44f64dfc24ac23f2d540d45989d15402"
  - number: "3470"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Spain Tries Democracy"
    date: "1931 CE"
    region: "Spain"
    poem: |
      The king fled, and Spain proclaimed its Second Republic —
      Democracy, at last, in the land of the Inquisition.
      I was in Madrid for the celebrations, the tricolor flags,
      The hope of the workers, the fear of the Church.
      It was brave and it was fragile —
      Reforms, backlash, the army watching.
      Five years of republic, then the generals rose.
      Spain tried democracy. The attempt was glorious.
      The failure was catastrophic.
    description: "Spain proclaims its Second Republic in 1931 — the traveler celebrates in Madrid and says the attempt was glorious and the failure catastrophic."
    status: "published"
    sha256: "bf292498f2c7d7d69889a4afc176a4859f1a1f1fc3ae96540fef942aed225d76"
  - number: "3471"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Taxman Gets Capone"
    date: "1931 CE"
    region: "Chicago, USA"
    poem: |
      Capone went to prison in 1931 — not for murder, for taxes.
      I sat in that Chicago courtroom,
      The most feared man in America, undone by accountants.
      Eleven years for tax evasion — the Valentine's Day Massacre unpunished,
      But the ledger didn't lie.
      Eliot Ness got the glory; the IRS got the conviction.
      Crime's lesson, taught in federal court:
      You can dodge the bullets. You can't dodge the books.
    description: "Capone goes to prison for tax evasion in 1931 — the traveler sits in the Chicago courtroom and says you can dodge the bullets but you can't dodge the books."
    status: "published"
    sha256: "e9ff0dfc7f3c1a797693779a36ee1d1f34f10eb0983ca35bc5b6ac52291ca24b"
  - number: "3472"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Scottsboro Trial"
    date: "1931 CE"
    region: "Alabama, USA"
    poem: |
      Nine Black teenagers were railroaded in Alabama —
      The Scottsboro case that changed American justice.
      I sat in that Scottsboro courtroom, the all-white jury,
      The lie of the accusation, the rush to the chair.
      Eight death sentences, in days.
      But the appeals went on for years — the Supreme Court intervened,
      Right to counsel, no exclusion of Black jurors.
      It took decades to free them all.
      American justice learned its conscience in Scottsboro, slowly.
    description: "Nine Black teenagers are railroaded in Scottsboro, Alabama, in 1931 — the traveler sits in the courtroom and says American justice learned its conscience there, slowly."
    status: "published"
    sha256: "512ff28dd1d0292d64fe37d08a97e33fcbe0ce22f8dee2ef8d5f7270f9171a03"
  - number: "3473"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "An Anthem at Last"
    date: "1931 CE"
    region: "USA"
    poem: |
      The Star-Spangled Banner became America's official anthem in 1931 —
      After a century of unofficial singing.
      I stood for it at ballparks, the hand on the heart,
      Key's words from the Baltimore bombardment, 1814.
      It was hard to sing — everyone knew it —
      But it was ours: the flag still there, through the rockets' red glare.
      A nation finally made its song official.
      Some anthems are chosen. This one was survived into.
    description: "The Star-Spangled Banner becomes America's official anthem in 1931 — the traveler stands for it at ballparks and says some anthems are chosen; this one was survived into."
    status: "published"
    sha256: "d3920049e1614f00ca13f8d8c38587c406e5bfd390f790f10b65f3dd4739a1e8"
  - number: "3474"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "A New Deal Promised"
    date: "1932 CE"
    region: "USA"
    poem: |
      Roosevelt defeated Hoover in 1932, promising a New Deal —
      And hope returned to Washington.
      I was at the Democratic convention, the acceptance speech,
      The crippled governor promising the forgotten man a chance.
      Hoover's Depression had broken the country;
      Roosevelt's smile proposed to mend it.
      "I pledge you, I pledge myself, to a new deal for the American people."
      The words were vague. The hope was specific.
    description: "Roosevelt defeats Hoover in 1932 promising a New Deal — the traveler is at the convention and says the words were vague but the hope was specific."
    status: "published"
    sha256: "2102697103ac184d8bccc91805420c67e09696145d20e5f140c1bb3b50cd9074"
  - number: "3475"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Alone Across the Atlantic"
    date: "1932 CE"
    region: "Atlantic"
    poem: |
      Earhart flew the Atlantic solo in 1932 —
      The first woman to do it alone.
      I tracked her Lockheed Vega from Newfoundland,
      Ice on the wings, the altimeter failed, the fuel leaking —
      And she landed in an Irish pasture, asking where she was.
      Five years after Lindbergh, a woman did it alone.
      The world finally stopped calling her a passenger.
      She was a pilot. She had always been a pilot.
    description: "Earhart flies the Atlantic solo in 1932 — the traveler tracks her Vega through ice and leaking fuel to an Irish pasture, and says the world finally stopped calling her a passenger."
    status: "published"
    sha256: "f51f42a0fad2b966d5072621942297c2f5347538a1956e2c99be66de9f0f2e39"
  - number: "3476"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Crime of the Century"
    date: "1932 CE"
    region: "New Jersey, USA"
    poem: |
      The Lindbergh baby was kidnapped in 1932 —
      And the nation held its breath.
      I stood outside the Hopewell house, the reporters, the searchers,
      The ransom notes, the cemetery payoff, the most famous baby in the world.
      They found him in May, in the woods — dead.
      The trial of Bruno Hauptmann became the trial of the century.
      Lindbergh, the hero, learned what fame costs.
      The crime of the century, and its grief is still fresh.
    description: "The Lindbergh baby is kidnapped in 1932 — the traveler stands outside the Hopewell house and says the hero learned what fame costs; the grief is still fresh."
    status: "published"
    sha256: "f1e256fe9ec4e49751aaed053f2f9958f5c4f443a1fe8fc96267235da8351764"
  - number: "3477"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Games in the Depression"
    date: "1932 CE"
    region: "California, USA"
    poem: |
      Los Angeles hosted the Olympics on a shoestring in 1932 —
      The first Olympic Village, in the Depression.
      I walked the Village, the little houses, the athletes cooking,
      Babe Didrikson winning everything, the world too poor to come in numbers.
      Half the nations stayed home — no money for the trip.
      But LA made it work: the Coliseum, the sun, the showmanship.
      The Games learned to be entertainment that year.
      Hollywood hosted the Olympics, and the Olympics learned Hollywood.
    description: "Los Angeles hosts the 1932 Olympics on a shoestring — the first Olympic Village, and the traveler says Hollywood hosted the Games and the Games learned Hollywood."
    status: "published"
    sha256: "e3cedcff5e6ac31e90769d8698a0837c66777b3af469aed607deadce8ebb8e74"
  - number: "3478"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Neutron Found"
    date: "1932 CE"
    region: "England"
    poem: |
      Chadwick discovered the neutron in 1932 —
      The atom's hidden heart.
      I stood in the Cavendish Laboratory, the quiet experiments,
      The neutral particle that explained the nucleus's weight.
      Rutherford had predicted it; Chadwick found it.
      Without the neutron: no fission, no bomb, no reactors —
      The atomic age needed that missing piece.
      Three years later the fission would follow.
      The hidden heart, found.
    description: "Chadwick discovers the neutron in 1932 — the atom's hidden heart, and the traveler stands in the Cavendish Lab knowing the atomic age needed that missing piece."
    status: "published"
    sha256: "3d6ee92e56ec0ba8e73c4f973a7e2ffad328c25cf215e20971cfdc84f3120f82"
  - number: "3479"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Winter Comes to America"
    date: "1932 CE"
    region: "New York, USA"
    poem: |
      Lake Placid hosted the Winter Games in 1932 —
      America took to the ice.
      I stood by the bobsled run, the speed, the cold,
      Sonja Henie winning her second gold, the Americans learning winter sports.
      The Depression Games — small, brave, frozen.
      It put Lake Placid on the map for good;
      Forty-eight years later the Miracle on Ice would too.
      Winter came to America, and America learned to love it.
    description: "Lake Placid hosts the 1932 Winter Games — the traveler stands by the bobsled run and says winter came to America and America learned to love it."
    status: "published"
    sha256: "b57218c6b0d3b03b6facb61d98364b8ed55fcdd9dbf0db23ba1ec43ca14db9ea"
  - number: "3480"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Chancellor Carousel"
    date: "1932 CE"
    region: "Germany"
    poem: |
      Germany burned through chancellors in 1932 —
      Brüning, Papen, Schleicher — while Hitler waited.
      I watched the backroom deals in Berlin,
      The old elites thinking they could tame him, use him, control him.
      Papen's bargain: make Hitler Chancellor, box him in.
      The most catastrophic miscalculation in modern history.
      The carousel spun, the republic dissolved,
      And the man they thought they could control took everything.
    description: "Germany burns through chancellors in 1932 while Hitler waits — the traveler watches the backroom deals and calls Papen's bargain the most catastrophic miscalculation in modern history."
    status: "published"
    sha256: "c37c0ad5f63e605ceb76fdf5bf21ee320641e8af902653cfa86d3a4d1c4c3b36"
  - number: "3481"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Hitler Takes Power"
    date: "1933 CE"
    region: "Germany"
    poem: |
      Hitler became Chancellor on January 30, 1933 —
      And the Reichstag would burn within a month.
      I was in Berlin that day, the torchlight parade,
      The brownshirts marching through the Brandenburg Gate.
      Hindenburg had appointed him; Papen had arranged it.
      The republic handed the keys to its murderer.
      "It can't happen here" — it was happening there.
      The twelve-year night began with a legal appointment.
    description: "Hitler becomes Chancellor on January 30, 1933 — the traveler watches the torchlight parade through the Brandenburg Gate and notes the twelve-year night began with a legal appointment."
    status: "published"
    sha256: "06a0e2a506aa7592f211c15cad94cda8e766c497498bd855427992add6001119"
  - number: "3482"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Fire That Burned Democracy"
    date: "1933 CE"
    region: "Germany"
    poem: |
      The Reichstag burned on February 27, 1933 —
      And Hitler used it to crush every freedom.
      I stood in the Berlin night, the dome in flames,
      The Dutchman arrested inside — dupe or patsy, we'll never know.
      By morning the decrees were ready: no press, no assembly, no rights.
      The Enabling Act followed; democracy voted itself dead.
      The fire burned the building. The decrees burned the republic.
      I have seen many arsons. This one burned a country.
    description: "The Reichstag burns in February 1933 — the traveler stands in the Berlin night and says the fire burned the building but the decrees burned the republic."
    status: "published"
    sha256: "3550aad03a842e95652cb8ca2c1a8241d5d688a3187ed788e182713fd1dd0011"
  - number: "3483"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Hundred Days"
    date: "1933 CE"
    region: "USA"
    poem: |
      Roosevelt's first hundred days flooded America —
      New agencies, new hope, the alphabet soup.
      I walked Washington that spring, the energy,
      The CCC, the TVA, the banks reopening — "the only thing we have to fear."
      Fifteen major laws in a hundred days.
      It didn't end the Depression — the war did that —
      But it ended the despair, and that was the emergency.
      Action as therapy for a nation.
      The Hundred Days: the presidency as rescue operation.
    description: "Roosevelt's first hundred days flood America with new agencies in 1933 — the traveler walks Washington and calls it the presidency as rescue operation; it ended the despair, and that was the emergency."
    status: "published"
    sha256: "27f60fbed2a64715f02afb8f889e17534a9fd3ca8e53a6681761560c10f20ecd"
  - number: "3484"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Dry Years End"
    date: "1933 CE"
    region: "USA"
    poem: |
      The 21st Amendment ended Prohibition in 1933 —
      America drank legally again.
      I was in a bar that December night, the toasts,
      Thirteen years of hypocrisy over in a proclamation.
      The bootleggers went legitimate or went down;
      The speakeasies hung up their passwords.
      The noble experiment was repealed by a wiser nation.
      You cannot legislate thirst — the century proved it twice.
      The drinks were on the Constitution.
    description: "The 21st Amendment ends Prohibition in 1933 — the traveler is in a bar that December night and says the drinks were on the Constitution."
    status: "published"
    sha256: "f9a605177f4052bb652300c17e9f048171b96daf489d40cba9d456805ff01d18"
  - number: "3485"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Books Burn"
    date: "1933 CE"
    region: "Germany"
    poem: |
      Students burned un-German books in Berlin, May 1933 —
      And Heine's old warning came true: where books burn, people will too.
      I stood in the Opernplatz, the bonfires,
      Einstein, Freud, Mann, Remarque — into the flames.
      The students cheered; Goebbels orated.
      It was a ritual, a purification, a threat.
      Twelve years later the bonfires would be cities.
      I picked up a half-burned page from the square.
      I still have it.
    description: "Students burn books in Berlin in May 1933 — the traveler stands in the Opernplatz and picks up a half-burned page he says he still has."
    status: "published"
    sha256: "0c597d4799ad21a805666f9a53fb071d6be08c29f44c4ce11dc3491f90733821"
  - number: "3486"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Movies Under the Stars"
    date: "1933 CE"
    region: "New Jersey, USA"
    poem: |
      The first drive-in opened in Camden, New Jersey —
      Cinema from the front seat.
      I parked on that first gravel lot, the screen on a pole,
      Richard Hollingshead's invention: movies for motorists.
      The Depression's perfect entertainment — cheap, private, outdoors.
      A thousand drive-ins would bloom across America.
      Teenagers, families, the whole car culture —
      The movies went outside, and never quite came back in.
    description: "The first drive-in opens in Camden, New Jersey, in 1933 — the traveler parks on the gravel lot and says the movies went outside and never quite came back in."
    status: "published"
    sha256: "999c143a0f47696b2b8c7ce2d4a59ee0096c9b8600db9dfed90e1d0a1998e9c6"
  - number: "3487"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Nessie Surfaces"
    date: "1933 CE"
    region: "Scotland"
    poem: |
      A monster was sighted in Loch Ness in 1933 —
      And the legend went worldwide.
      I stood on the loch's shore, the mist, the dark water,
      The road newly built, the sightings multiplying.
      The surgeon's photo came the next year — a fake, revealed decades later.
      But the legend didn't need the truth.
      Nessie: the world's most beloved maybe.
      Every loch needs its mystery. This one got a global one.
    description: "A monster is sighted in Loch Ness in 1933 — the traveler stands on the misty shore and says the legend didn't need the truth; every loch needs its mystery."
    status: "published"
    sha256: "43fa128c7e1d335afeb15850bd2bbc854395867fece9d8400dae57df274a00aa"
  - number: "3488"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Long March"
    date: "1934 CE"
    region: "China"
    poem: |
      The Red Army broke out and marched 6,000 miles —
      The Long March, and Mao emerged as China's leader.
      I walked parts of that route, the mountains, the rivers,
      The Luding Bridge, the snow passes, the starving columns.
      Eighty thousand started; fewer than ten thousand finished.
      It was a retreat that became a legend —
      The founding myth of the People's Republic.
      Mao walked it into power.
      The Long March: defeat, transfigured into destiny.
    description: "The Red Army's Long March covers 6,000 miles in 1934 — the traveler walks parts of the route and calls it defeat transfigured into destiny, Mao's road to power."
    status: "published"
    sha256: "0fbc8925f85cf7fe1b9b1423da6c4f84a0df66287c89a71c835b17ef48af5574"
  - number: "3489"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Night of Long Knives"
    date: "1934 CE"
    region: "Germany"
    poem: |
      Hitler murdered his own SA leaders in one bloody weekend —
      The Night of the Long Knives.
      I was in Berlin that summer, the arrests, the shots in the night,
      Röhm and hundreds of others, rivals real and imagined.
      The army approved; the courts approved; the people shrugged.
      Murder, legalized retroactively — the state as hitman.
      It taught Germany the lesson of the Third Reich:
      No one was safe, not even the loyal.
      The knives were long. The night was longer.
    description: "Hitler murders his SA leaders in the Night of the Long Knives in 1934 — the traveler is in Berlin and says it taught Germany no one was safe, not even the loyal."
    status: "published"
    sha256: "51bb0aa815e5e81fbf6541967c10861dd895cfe350adb5a589e7a5e1f1545e1f"
  - number: "3490"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The End of Bonnie and Clyde"
    date: "1934 CE"
    region: "Louisiana, USA"
    poem: |
      Texas Rangers ambushed Bonnie and Clyde in Louisiana —
      The Depression's outlaws died in a hail of bullets.
      I drove that road later, the bullet holes in the car door,
      One hundred sixty-seven rounds, the legend ended in lead.
      They'd robbed banks and killed lawmen for two years;
      The public loved them until the killing got serious.
      The ambush was justice, or murder — depends who you ask.
      The Depression made them folk heroes. The posse made them dead.
    description: "Texas Rangers ambush Bonnie and Clyde in Louisiana in 1934 — the traveler drives the road later and says the Depression made them folk heroes and the posse made them dead."
    status: "published"
    sha256: "18841ae7dddd07dd0b7e152dcaed3441ad49f7649fd2f3d675c791cc089e204b"
  - number: "3491"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "A Tradition Unlike Any Other"
    date: "1934 CE"
    region: "Georgia, USA"
    poem: |
      The first Masters was played at Augusta in 1934 —
      Bobby Jones's dream tournament.
      I walked those azaleas, the perfect fairways,
      Jones himself competing, the green jacket not yet invented.
      It was an invitational, intimate, Southern —
      And it became golf's cathedral.
      The Masters: tradition unlike any other, as the ads say.
      It started with a retired champion's dream
      And a Georgia nursery full of flowers.
    description: "The first Masters is played at Augusta in 1934 — the traveler walks the azaleas and says it started with a retired champion's dream and a Georgia nursery full of flowers."
    status: "published"
    sha256: "6e2e101edf4f34dba2cf97898ec23ef5a7d42ab99b392e7dedbb0c7977853fa0"
  - number: "3492"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Dust Comes"
    date: "1934 CE"
    region: "USA"
    poem: |
      Black blizzards buried the Plains —
      The Dust Bowl, and families fled west with everything on a truck.
      I drove those roads, the dust like night at noon,
      The farms buried, the children coughing.
      The plow had broken the prairie; the drought finished it.
      Steinbeck would write it; Dorothea Lange would photograph it.
      A quarter million fled to California —
      Okies, despised, resilient, the Joads made real.
      The land died. The people didn't.
    description: "Black blizzards bury the Plains in the Dust Bowl — the traveler drives roads dark as night at noon and says the land died but the people didn't."
    status: "published"
    sha256: "7a9b669e5fefa4a97728d779298cd6ab34be93f6b5628f3d5d5acbc5ed5fdd0d"
  - number: "3493"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Laws of Hate"
    date: "1935 CE"
    region: "Germany"
    poem: |
      The Nuremberg Laws stripped Jews of citizenship —
      Hatred became law.
      I was in Germany that September, the rallies,
      The legal definitions of Jewishness, the bans on marriage, on flags, on life.
      It was bureaucratic — forms, categories, stamps —
      Genocide's paperwork phase.
      The world protested mildly and did nothing.
      Law is supposed to protect. These laws hunted.
      I read them and felt the cold.
      The cold would get colder.
    description: "The Nuremberg Laws strip Jews of citizenship in 1935 — the traveler reads the bureaucratic forms and calls it genocide's paperwork phase; the cold would get colder."
    status: "published"
    sha256: "ed2c694930209e69c3e66e14cd8c12a3069be5220f99f2b755166654e87f0610"
  - number: "3494"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Ethiopia Stands Alone"
    date: "1935 CE"
    region: "Ethiopia"
    poem: |
      Mussolini invaded Ethiopia in 1935 —
      And Haile Selassie pleaded to a silent League.
      I was in Geneva for his speech — "It is us today, it will be you tomorrow" —
      The little emperor, the empty promises.
      Poison gas, bombers, the ancient kingdom overrun.
      The League condemned and did nothing; the sanctions leaked.
      Ethiopia stood alone, and fell alone.
      Selassie was right. It was them next.
      The world learned nothing, on schedule.
    description: "Mussolini invades Ethiopia in 1935 — the traveler hears Haile Selassie's plea in Geneva (\"it will be you tomorrow\") and watches the League do nothing."
    status: "published"
    sha256: "35cd9c3c581f762c4cc8c9c7eb6f1b2557eb6cb5fbdf91949dc5995b49525b76"
  - number: "3495"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "A Safety Net"
    date: "1935 CE"
    region: "USA"
    poem: |
      Roosevelt signed Social Security in 1935 —
      Old-age pensions became American law.
      I stood outside the White House that August,
      The old folks' security, the payroll tax, the numbers.
      It was modest — the first checks were tiny —
      But it was revolutionary: the government as guarantor.
      The safety net: thin, but real.
      Ninety years later it's still the third rail of politics.
      The New Deal's most enduring promise, signed in a Depression.
    description: "Roosevelt signs Social Security in 1935 — the traveler stands outside the White House and calls it the New Deal's most enduring promise: the government as guarantor."
    status: "published"
    sha256: "645b3598aef4c6c0b8f4b7cc44fb2abe3c31de48e0cfe3f7c10617f1acfbf885"
  - number: "3496"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Beer in a Can"
    date: "1935 CE"
    region: "USA"
    poem: |
      Krueger's sold the first canned beer in 1935 —
      The six-pack era dawned.
      I bought one in Richmond, Virginia, the test market,
      The flat top, the opener, the novelty.
      Prohibition had just ended; beer needed to travel.
      The can: cheap, light, unbreakable —
      The package that conquered the world.
      Wine got the bottle; beer got the can.
      Civilization's containers, evolving.
    description: "The first canned beer goes on sale in 1935 — the traveler buys one in Richmond and calls the can the package that conquered the world."
    status: "published"
    sha256: "24e0afaadf70c20f0e6b7b2e5837dd867e22f2eefe469f76d76bb23c69ce2062"
  - number: "3497"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Game of Ruin"
    date: "1935 CE"
    region: "USA"
    poem: |
      Monopoly hit the stores in 1935 —
      Born in the Depression, about getting rich.
      I played it in parlors across America,
      The little houses, the hotels, the ruthless joy of bankrupting friends.
      Charles Darrow sold it to Parker Brothers; the real inventor was Lizzie Magie,
      Whose Landlord's Game warned against monopolies.
      The warning became the celebration.
      The Depression's game: get rich or die trying, on cardboard.
    description: "Monopoly hits stores in 1935 — the traveler plays it in parlors across America and notes the real inventor's warning against monopolies became the celebration of them."
    status: "published"
    sha256: "fd70a38a69edf5e4a89423c5d19a5b059f9df77b64f3935daa252fee43caa5eb"
  - number: "3498"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "One Drunk Helping Another"
    date: "1935 CE"
    region: "Ohio, USA"
    poem: |
      Two drunks met in Akron in 1935 —
      And Alcoholics Anonymous was born.
      I sat in those first meetings, the church basements,
      Bill W. and Dr. Bob, the twelve steps taking shape.
      One alcoholic talking to another — that was the medicine.
      No doctors, no fees, no dogma — just honesty and fellowship.
      Millions have gotten sober in those rooms since.
      The most successful therapy ever invented,
      By two men who couldn't stop drinking alone.
    description: "Two alcoholics meet in Akron in 1935 and Alcoholics Anonymous is born — the traveler sits in the first church-basement meetings and calls it the most successful therapy ever invented."
    status: "published"
    sha256: "bea32598069d74464ffc4d7624f00af4f44ed8ac6378df47a80023d78ac6925c"
  - number: "3499"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Spain Tears Itself Apart"
    date: "1936 CE"
    region: "Spain"
    poem: |
      Franco's generals rose against the Republic in 1936 —
      The dress rehearsal for world war.
      I was in Barcelona those first days, the workers' militias,
      The churches burning, the idealism and the horror.
      Three years of civil war: Guernica, the Ebro, the International Brigades —
      Fascists and communists rehearsing for the bigger war.
      Picasso painted it; Hemingway wrote it; Auden mourned it.
      Spain tore itself apart, and the world watched, and learned nothing.
    description: "Franco's generals rise against the Spanish Republic in 1936 — the traveler is in Barcelona and calls the civil war the dress rehearsal for world war."
    status: "published"
    sha256: "c9c46ba44c13deace9599a5551c8228ca27d28204b0677813126381099e146d2"
  - number: "3500"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Owens Upends the Myth"
    date: "1936 CE"
    region: "Germany"
    poem: |
      Jesse Owens won four golds in Hitler's stadium —
      The master-race myth, demolished.
      I sat in the Olympiastadion, the swastikas,
      The Black sharecropper's son from Alabama outrunning the Aryans.
      Hitler left rather than congratulate him — or so the story goes.
      Owens came home to segregation and no parade down Broadway.
      He'd beaten Hitler's myth and America's hypocrisy noticed neither.
      Four golds. The fastest man alive. Still had to ride the freight elevator.
    description: "Jesse Owens wins four golds in Hitler's 1936 stadium — the traveler sits under the swastikas and says Owens beat the master-race myth but came home to segregation."
    status: "published"
    sha256: "5bce9e4e3257ec45f05a68b5c7e05a55e78a5d2b9ea75cf795a45807047b9565"
  - number: "3501"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The King Gives Up the Crown"
    date: "1936 CE"
    region: "England"
    poem: |
      Edward VIII abdicated for Wallis Simpson —
      "The woman I love," he told the empire.
      I listened to that radio broadcast, the first abdication speech,
      A king choosing love over the throne.
      The establishment was horrified; the public was divided.
      He got the woman and lost the world —
      The Duke of Windsor, the Nazi sympathies, the long exile.
      Romance or dereliction? History still argues.
      I heard his voice shake. That part was real.
    description: "Edward VIII abdicates for Wallis Simpson in 1936 — the traveler hears the radio broadcast and says he got the woman and lost the world; the voice shaking was real."
    status: "published"
    sha256: "273e8e7dda7053ea97fc3753554d6ad8cfcd0a981cdf50da96404900fa0ffa1a"
  - number: "3502"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Terror Begins"
    date: "1936 CE"
    region: "Russia"
    poem: |
      Stalin's show trials opened the Great Purge in 1936 —
      The Party devoured its own.
      I sat in the Hall of Columns, the confessions,
      Old Bolsheviks admitting to absurd crimes, broken men reading scripts.
      Zinoviev, Kamenev — Lenin's comrades — shot.
      The Terror would take a million lives, the army's officers, the innocent.
      It was madness as policy, paranoia as government.
      The revolution's children, eaten by the revolution.
      I watched, and could do nothing.
    description: "Stalin's show trials open the Great Purge in 1936 — the traveler sits in the Hall of Columns as Old Bolsheviks confess to scripted crimes; the revolution eats its children."
    status: "published"
    sha256: "a9ffe65666a74237bbaaa99e6fb0e48783c71950227097df53d49989643477a9"
  - number: "3503"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Dam That Tamed a River"
    date: "1936 CE"
    region: "Nevada and Arizona, USA"
    poem: |
      Hoover Dam was completed in 1936 —
      Concrete against the Colorado.
      I stood on that curved wall, the river tamed below,
      The Depression's great project, built by men in the desert heat.
      Ninety-six dead building it; millions served by it —
      Water, power, the West made possible.
      The Art Deco intake towers, the terrazzo floors —
      A dam built like a cathedral.
      The New Deal in concrete, still holding.
    description: "Hoover Dam is completed in 1936 — the traveler stands on the curved wall and calls it the New Deal in concrete: a dam built like a cathedral, still holding."
    status: "published"
    sha256: "43ea2c97cf16ee9bd2bc0119e3387dbf95044205a6f8b29276540442b048cca5"
  - number: "3504"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Kidnapping That United China"
    date: "1936 CE"
    region: "China"
    poem: |
      Chiang Kai-shek was kidnapped at Xian in 1936 —
      And forced to ally with the Communists against Japan.
      I was in China for the crisis, the two weeks of tension,
      The Young Marshal's gamble, the nation holding its breath.
      Chiang agreed: united front against Japan.
      It saved China from immediate civil war —
      And saved the Communists, giving them eight years to grow.
      The kidnapping that changed history.
      Sometimes the gun to the head is the peacemaker.
    description: "Chiang Kai-shek is kidnapped at Xian in 1936 and forced into a united front with the Communists — the traveler calls it the kidnapping that changed history."
    status: "published"
    sha256: "f9e15eefea6b621b8a756cc42103cca58303590a424c8193b73f8450d626f6b1"
  - number: "3505"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Television, Regularly"
    date: "1936 CE"
    region: "England"
    poem: |
      The BBC began regular television broadcasts in 1936 —
      The box in the corner was coming.
      I watched those first programs from Alexandra Palace,
      The flickering images, the tiny audiences.
      Baird's system lost to Marconi-EMI's — the future had better resolution.
      Few could afford the sets; fewer cared.
      But the seed was planted, in London, in 1936.
      Within twenty years the box would rule the living room.
      The century's hearth, lit at Alexandra Palace.
    description: "The BBC begins regular television broadcasts from Alexandra Palace in 1936 — the traveler watches the flickering images and calls it the century's hearth being lit."
    status: "published"
    sha256: "61a6878673fffbdaa2e78d307637a06b20a4a353829eb3bec35142627a277b25"
  - number: "3506"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Guernica"
    date: "1937 CE"
    region: "Spain"
    poem: |
      German bombers flattened Guernica in 1937 —
      And Picasso painted the scream.
      I walked that Basque town after the Condor Legion left,
      The market day, the dead, the first terror bombing of civilians.
      It was a rehearsal — for Warsaw, for Rotterdam, for Coventry.
      Picasso's canvas, huge, black and white, the bull, the horse, the mother —
      The century's great anti-war painting, from a town most couldn't find on a map.
      The scream, painted. The bombers, unpunished.
    description: "German bombers flatten Guernica in 1937 — the traveler walks the Basque town after and says Picasso painted the scream from a town most couldn't find on a map."
    status: "published"
    sha256: "615e981942bdba2c56e7d0704702a43b84d24ae4fd16f8ad780fb586acdb51ca"
  - number: "3507"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Hindenburg Burns"
    date: "1937 CE"
    region: "New Jersey, USA"
    poem: |
      The Hindenburg erupted in flames at Lakehurst in 1937 —
      "Oh, the humanity!" — and the airship age ended in fire.
      I stood in that New Jersey field, the great zeppelin burning,
      Thirty-six seconds, the skeleton falling, the hydrogen's fury.
      Herb Morrison's radio cry made it immortal.
      The Graf Zeppelin had circled the globe; this one circled into infamy.
      Helium would have saved her; America wouldn't sell it.
      The airship age ended in fire, on the newsreels.
    description: "The Hindenburg burns at Lakehurst in 1937 — the traveler stands in the field as 36 seconds of fire ends the airship age on the newsreels."
    status: "published"
    sha256: "8ba5f55f57241a085a71b8594fc54e166c0c0b402f394520e1b2c70a5a75d269"
  - number: "3508"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The War in Asia Begins"
    date: "1937 CE"
    region: "China"
    poem: |
      Shots at the Marco Polo Bridge in 1937 —
      Ignited Japan's full invasion of China.
      I was in Beijing that July night, the confusion,
      The Japanese demands, the Chinese refusal.
      Eight years of war followed — the forgotten holocaust of Asia.
      It started with shots on a bridge outside Beijing.
      World War II began in Asia, two years before Poland.
      The West forgets. China doesn't.
    description: "Shots at the Marco Polo Bridge ignite Japan's full invasion of China in 1937 — the traveler is in Beijing that July night; the West forgets, China doesn't."
    status: "published"
    sha256: "8267e607309aa78e589c1c82f7cb1fcb7544151dc488d65a983aa7a4dcbfaeb1"
  - number: "3509"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Rape of Nanking"
    date: "1937 CE"
    region: "China"
    poem: |
      Japanese troops slaughtered hundreds of thousands in Nanjing —
      One of history's great atrocities.
      I walked those streets in December, the bodies,
      The Yangtze red, the Safety Zone the only refuge.
      Six weeks of murder, rape, arson — the numbers still argued,
      But the horror isn't.
      John Rabe, the Nazi who saved thousands — history's strangest hero.
      I held the dying. I recorded the names.
      The Rape of Nanking: the century's wound that won't close.
    description: "Japanese troops slaughter hundreds of thousands in Nanjing in 1937 — the traveler walks the streets in December, holds the dying, and records the names."
    status: "published"
    sha256: "69b4eb2abedb757258889464e0c903df3fc5375d0e7d056003c2088d2d7e7053"
  - number: "3510"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Lost Over the Pacific"
    date: "1937 CE"
    region: "Pacific"
    poem: |
      Earhart vanished over the Pacific in 1937 —
      The world's most famous pilot, gone.
      I tracked the search, the ships, the planes,
      The last radio calls, fading: "We are running north and south."
      Howland Island, the Electra, the empty ocean.
      She was circling the globe — the last great adventure.
      The mystery endures: crashed, captured, castaway?
      I don't know. The Pacific keeps its secrets.
      The sky took its bravest daughter.
    description: "Earhart vanishes over the Pacific in 1937 — the traveler tracks the search and the fading last radio calls; the Pacific keeps its secrets."
    status: "published"
    sha256: "192d343592b8e879eb28d9edd456c435ce685629acae51974c78c5e3746d4287"
  - number: "3511"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Bridge in the Fog"
    date: "1937 CE"
    region: "California, USA"
    poem: |
      The Golden Gate Bridge opened in 1937 —
      Art deco spanning the fog.
      I walked it on opening day, the crowds,
      The orange vermilion against the gray, the 4,200-foot span.
      Joseph Strauss built it; the Depression's men died building it — eleven.
      It was the longest suspension bridge on Earth.
      San Francisco's signature, the fog's favorite sculpture.
      Eighty years on, it still stops the breath.
      Some bridges are crossings. This one is a promise.
    description: "The Golden Gate Bridge opens in 1937 — the traveler walks it on opening day and calls it the fog's favorite sculpture, a promise in orange vermilion."
    status: "published"
    sha256: "89dcee349917bc054f97b7db129df84691fef1073a8db55ffe8f8d32617a934f"
  - number: "3512"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The First Feature Cartoon"
    date: "1937 CE"
    region: "USA"
    poem: |
      Snow White premiered in 1937 —
      Animation's first feature, Disney's great gamble.
      I sat in that theater, the dwarfs, the witch, the Technicolor,
      The audience weeping — at a cartoon.
      Disney had bet the studio; the bankers called it folly.
      It made millions. Animation grew up that night.
      "Disney's Folly" became the foundation of the empire.
      Eighty-three minutes of drawings, and the world believed.
    description: "Snow White premieres in 1937 — Disney's great gamble, and the traveler sits in the theater as the audience weeps at a cartoon; the bankers' \"folly\" becomes an empire."
    status: "published"
    sha256: "fc95bcc757c86a3eb6024753e25c5211083a142e1a4c9ef3d14d3ddffffd808f"
  - number: "3513"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Austria Is Swallowed"
    date: "1938 CE"
    region: "Austria"
    poem: |
      German troops marched into Austria in 1938 —
      The Anschluss, cheered in Vienna.
      I stood on the Ringstrasse as the columns came,
      The crowds, the flowers, the shame of the cheering.
      Austria's independence ended without a shot —
      The plebiscite was rigged, the joy was real enough.
      Hitler's birthplace welcomed him home.
      The first swallow of the expansion.
      The world protested, and did nothing.
      Again.
    description: "German troops march into Austria in 1938 — the traveler stands on the Ringstrasse amid the cheering crowds and says the world protested and did nothing. Again."
    status: "published"
    sha256: "64465f83b7f07ddaef5e86e03fdd8271c5fd5cbf4e327164f68579c7ae88158b"
  - number: "3514"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Peace in Our Time"
    date: "1938 CE"
    region: "Germany"
    poem: |
      Chamberlain returned from Munich waving paper —
      "Peace for our time." Czechoslovakia was sold.
      I was at Heston Aerodrome for the landing,
      The tired prime minister, the piece of paper.
      The Sudetenland for a signature — the Czechs weren't invited.
      It bought a year. It cost an ally.
      Churchill called it defeat with dishonor.
      He was right. The paper was worthless.
      Hitler took the rest in March.
    description: "Chamberlain returns from Munich in 1938 waving paper — the traveler is at Heston Aerodrome and says it bought a year and cost an ally; Hitler took the rest in March."
    status: "published"
    sha256: "afc950cf733f254527daf2455da97b7ca52eb4f5d9cf49d0c609a46628b7843f"
  - number: "3515"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Night of Broken Glass"
    date: "1938 CE"
    region: "Germany"
    poem: |
      Synagogues burned across Germany on Kristallnacht —
      Thirty thousand Jews dragged to the camps.
      I walked the Berlin streets the next morning, the glass,
      The shattered storefronts, the silence of the neighbors.
      It was the pogrom made national policy —
      The turn from persecution to destruction.
      The world was horrified, and admitted almost no one.
      Roosevelt recalled his ambassador. That was all.
      The glass was swept. The warning wasn't heard.
    description: "Synagogues burn across Germany on Kristallnacht in 1938 — the traveler walks the glass-strewn Berlin streets the next morning; the world was horrified and admitted almost no one."
    status: "published"
    sha256: "b2299f6c20fc29bd7eba74de41b37145a0ffc4dede079190478c02f29d26bdbe"
  - number: "3516"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Panic on the Air"
    date: "1938 CE"
    region: "USA"
    poem: |
      Welles's War of the Worlds broadcast panicked America in 1938 —
      Radio's power, proven by fear.
      I listened that Halloween night, the Martians landing,
      The news bulletins, the realism — too real.
      People fled, prayed, called the police.
      It was a play. It felt like the end.
      The panic was exaggerated later — but the lesson wasn't:
      The airwaves could move millions.
      Welles, twenty-three, became famous overnight.
    description: "Welles's War of the Worlds broadcast panics America in 1938 — the traveler listens on Halloween night and says the airwaves proved they could move millions."
    status: "published"
    sha256: "45c0eeed8c868e1cfabf0466cb322067b67482c74fa2351e73da2136df58edce"
  - number: "3517"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Superhero Is Born"
    date: "1938 CE"
    region: "USA"
    poem: |
      Superman debuted in Action Comics in 1938 —
      And the superhero age began.
      I bought that first issue, the ten cents,
      Two Jewish kids from Cleveland inventing the immigrant god.
      Faster than a speeding bullet — the Depression's power fantasy.
      He fought for truth and justice, the American way.
      A billion-dollar mythology started in a comic book.
      The superhero: America's folk hero, in tights.
    description: "Superman debuts in Action Comics in 1938 — the traveler buys the first issue and calls him the Depression's power fantasy: America's folk hero in tights."
    status: "published"
    sha256: "f4d7c2e905230d2429a6e7ae9de278a66ed9c447415c9c90f733158d6e812c25"
  - number: "3518"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Atom Splits"
    date: "1938 CE"
    region: "Germany"
    poem: |
      Hahn and Strassmann split uranium in Berlin —
      Meitner explained it. The atomic age became possible.
      I followed the letters, the Christmas experiments,
      The Jewish physicist in exile doing the math in Sweden.
      E=mc2, made real in a laboratory —
      A tiny mass became enormous energy.
      They didn't know what they'd done, quite.
      I knew. I had seen the equation's future.
      The atom split. The century split with it.
    description: "Hahn and Strassmann split uranium in 1938; exiled Meitner explains it — the traveler follows the letters and says the atom split and the century split with it."
    status: "published"
    sha256: "5e0a624c30d3384608974311de678600d71981e547fe4c5f5d2f30bf2ea6790d"
  - number: "3519"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Yellow River Floods"
    date: "1938 CE"
    region: "China"
    poem: |
      Chiang's armies breached the Yellow River dikes to stop Japan —
      And hundreds of thousands of Chinese drowned.
      I walked the flooded plain, the villages gone,
      The water where the wheat had been.
      It slowed the Japanese — for a while.
      It killed Chiang's own people by the hundred thousand.
      The cruelest arithmetic of war: drown your country to save it.
      The river took the blame. The generals gave the order.
      China's sorrow, measured in water.
    description: "Chiang's armies breach the Yellow River dikes in 1938, drowning hundreds of thousands of Chinese to slow Japan — the traveler walks the flooded plain and calls it the cruelest arithmetic of war."
    status: "published"
    sha256: "a57de7b68d5965d107aad2c57441b5d868f8a3f30d7734c88cdee0fc6fd3a7e6"
  - number: "3520"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Blitzkrieg"
    date: "1939 CE"
    region: "Poland"
    poem: |
      Germany smashed into Poland in September 1939 —
      Tanks, planes, and a new kind of war.
      I was on those roads, the Stukas screaming,
      The cavalry against the panzers — the myth and the reality.
      Poland fought bravely and was crushed in weeks.
      Blitzkrieg: lightning war, the world watching, learning.
      The Wehrmacht's doctrine became every army's textbook.
      It started in Poland, in the rain, with the bombs.
      The lightning struck. Europe burned.
    description: "Germany smashes into Poland in September 1939 — blitzkrieg, and the traveler is on the roads under the Stukas as the lightning strikes and Europe burns."
    status: "published"
    sha256: "eb3b1eb3c4a6b7d0766ab51016eb8d03e67d3a8e13a861cd4b04500ce187e93e"
  - number: "3521"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The War Begins"
    date: "1939 CE"
    region: "Europe"
    poem: |
      Britain and France declared war on Germany —
      And the phoney war set in.
      I was in London for Chamberlain's broadcast,
      "This country is at war with Germany" — the quiet, the dread.
      Then nothing — the Sitzkrieg, the bore war —
      Months of waiting behind the Maginot Line.
      The war had begun, but it hadn't started.
      Everyone knew what was coming. No one could stop it.
      The phoney war: the calm before the storm, stretched for months.
    description: "Britain and France declare war on Germany in September 1939 — the traveler hears Chamberlain's broadcast in London, then the long strange quiet of the phoney war."
    status: "published"
    sha256: "1208ba4926bcf3ebcc23b52ebde07b511bfa5da16cd0538b0232024249803f60"
  - number: "3522"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Knife in the Back"
    date: "1939 CE"
    region: "Poland"
    poem: |
      The Red Army invaded Poland from the east —
      And Poland was carved between two empires.
      I watched the Soviet columns come, the "liberation,"
      The secret protocol of the Nazi-Soviet pact made real.
      Poland, stabbed from both sides, ceased to exist.
      Katyn's officers were already marked — the forest waited.
      Two empires, one victim, a handshake over the corpse.
      The knife in the back, and the back was Poland's.
    description: "The Red Army invades Poland from the east in 1939 — the traveler watches the Soviet columns and says two empires shook hands over Poland's corpse."
    status: "published"
    sha256: "cba86061f42b433452395c399a8cfff4ad2becced6da7a7de1a8fe84415b8e06"
  - number: "3523"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Finland Fights the Giant"
    date: "1939 CE"
    region: "Finland"
    poem: |
      The USSR invaded Finland in 1939 —
      And ski troops humiliated the Red Army in the snow.
      I walked those frozen forests, the white death,
      Simos Häyhä, the snipers, the Molotov cocktails — named for the Soviet minister.
      David bloodied Goliath for 105 days.
      Finland lost land but kept its soul —
      The Winter War's miracle.
      The world cheered the little democracy.
      Stalin learned; the Finns endured.
    description: "The USSR invades Finland in 1939 — the traveler walks the frozen forests as ski troops humiliate the Red Army; Finland lost land but kept its soul."
    status: "published"
    sha256: "95f72b25cd6f51344c82cdc333a275a5e51bbe056305eb83f6b9f6917dfe1415"
  - number: "3524"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Letter"
    date: "1939 CE"
    region: "USA"
    poem: |
      Einstein warned Roosevelt in 1939 —
      The atom could become a bomb.
      I watched Szilard carry that letter, the careful words,
      The refugee physicists begging America to act first.
      Roosevelt read it, and the Manhattan Project was conceived.
      The pacifist's signature on the bomb's birth certificate —
      History's great irony.
      Einstein later called it his great mistake.
      The letter was two pages. The consequences were forever.
    description: "Einstein's 1939 letter warns Roosevelt the atom could become a bomb — the traveler watches Szilard carry it and calls the pacifist's signature history's great irony."
    status: "published"
    sha256: "667e629b9ab83b6e455872e25e041a0eb8e225b26f2175a1fb708c88a69a52fb"
  - number: "3525"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Epic of the South"
    date: "1939 CE"
    region: "USA"
    poem: |
      Gone with the Wind premiered in 1939 —
      The biggest film the world had seen.
      I sat in Atlanta for the premiere, the searchlights,
      Four hours, Technicolor, the burning of Atlanta.
      It was magnificent and it was a lie —
      The Old South, romanticized, the slaves as scenery.
      But the craft! The scale! Scarlett's green dress!
      The most successful film ever, adjusted for inflation.
      The epic of the South, told by the victors' grandchildren.
    description: "Gone with the Wind premieres in 1939 — the traveler sits in Atlanta for the premiere and calls it magnificent craft wrapped around a lie about the Old South."
    status: "published"
    sha256: "69382f331c020c7986734bb0d2eb69b42a6a7b5624ff98071ca33e798b4dd946"
  - number: "3526"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Over the Rainbow"
    date: "1939 CE"
    region: "USA"
    poem: |
      The Wizard of Oz enchanted America in 1939 —
      Technicolor's triumph.
      I watched the theater gasp when the screen turned color,
      Dorothy's Kansas in sepia, Oz in impossible color.
      It flopped at first — too expensive, they said.
      Then television made it immortal, every year, every child.
      "There's no place like home" — the century's lullaby.
      The rainbow's end was a movie screen.
      I still get chills at the tornado.
    description: "The Wizard of Oz enchants America in 1939 — the traveler watches the theater gasp as the screen turns to Technicolor; television later makes it immortal."
    status: "published"
    sha256: "588a8b3091136f3540c4959f6ef17226d62cc45c62c6cbed49ab8a0587cda20c"
  - number: "3527"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Jet Age Dawns"
    date: "1939 CE"
    region: "Germany"
    poem: |
      The Heinkel He 178 flew in 1939 —
      The first jet aircraft.
      I stood on that German airfield, the strange whine,
      No propeller, just the turbine's scream.
      Hans von Ohain's engine, Ernst Heinkel's gamble.
      The Luftwaffe didn't care — yet.
      But the propeller's days were numbered.
      The jet age dawned in Nazi Germany, of all places.
      Technology doesn't check its sponsors.
    description: "The Heinkel He 178 makes the first jet flight in 1939 — the traveler stands on the airfield and notes technology doesn't check its sponsors."
    status: "published"
    sha256: "c2b1deb3cde4ded34ac63a0adfd7fa9668b92605e35128b9b6ed4d6b24c6b5e6"
  - number: "3528"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Helicopter Flies Free"
    date: "1939 CE"
    region: "USA"
    poem: |
      Sikorsky's VS-300 made the first free helicopter flight in 1939 —
      Tethered no more.
      I watched it rise in Connecticut, the wobbling, the miracle,
      Igor Sikorsky at the controls of his own dream.
      He'd built airliners for the Tsar; now, in America, the helicopter.
      It took years to tame — but it flew free that day.
      The machine that would rescue millions, born in Stratford.
      Straight up: the oldest dream, finally working.
    description: "Sikorsky's VS-300 makes the first free helicopter flight in 1939 — the traveler watches in Connecticut as the oldest dream, straight up, finally works."
    status: "published"
    sha256: "b1f0f95e555621197de3ca31ecd08ad15d90e61b64060ac1a45795703343d5ab"
  - number: "3529"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Dark Knight Debuts"
    date: "1939 CE"
    region: "USA"
    poem: |
      Batman first appeared in Detective Comics in 1939 —
      The shadow to Superman's sun.
      I bought that issue, the ten cents,
      Bob Kane and Bill Finger's creature of the night.
      No powers — just money, rage, and preparation.
      The Depression's other fantasy: not the god, but the man.
      Gotham's guardian, the world's greatest detective.
      Superman was what we wished we were.
      Batman was what we feared we'd become.
    description: "Batman debuts in Detective Comics in 1939 — the traveler buys the issue and says Superman was what we wished we were; Batman was what we feared we'd become."
    status: "published"
    sha256: "0344297a099c57e930afb7de81f729f53298208dabe23dbbaac8d50e522e27b9"
  - number: "3530"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Clipper Crosses"
    date: "1939 CE"
    region: "Atlantic"
    poem: |
      Pan Am's Yankee Clipper began transatlantic passenger flights in 1939 —
      The ocean shrank.
      I boarded at Port Washington, the flying boat,
      The luxury, the dining room, the ocean below.
      Twenty-eight hours, New York to Southampton —
      For the rich, for now.
      The Clipper: the most romantic airliner ever built.
      War would take the routes; the war's end would take the romance.
      But for a season, the Atlantic was a cruise.
    description: "Pan Am's Yankee Clipper begins transatlantic passenger flights in 1939 — the traveler boards the flying boat and calls it the most romantic airliner ever built."
    status: "published"
    sha256: "5055215b8e67a38203ca29ef087f0f6295240d4c228c6d6bdc40eb33d9a51811"
  - number: "3531"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Miracle of Dunkirk"
    date: "1940 CE"
    region: "France"
    poem: |
      Trapped at Dunkirk, Britain was saved by a flotilla of little ships —
      The miracle of 1940.
      I stood on those beaches, the queues in the water,
      The Stukas, the oil burning, the calm of the men.
      Eight hundred fifty vessels — destroyers, yachts, fishing boats —
      Carried 338,000 men home.
      It was a defeat, gloriously spun —
      Churchill warned against calling it victory.
      But the army lived to fight again.
      The little ships: the people's navy.
    description: "The Dunkirk evacuation saves 338,000 men in 1940 — the traveler stands on the beaches and calls the flotilla of little ships the people's navy."
    status: "published"
    sha256: "81420a92477c11bc144d3210717ba056e28da1be0a0d31a32af79823d4b1342a"
  - number: "3532"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "France Falls"
    date: "1940 CE"
    region: "France"
    poem: |
      France surrendered in June 1940 —
      Petain's Vichy bowed to Berlin.
      I was in Paris as the Germans marched in,
      The swastika over the Arc de Triomphe, the silence.
      Six weeks — the great French army, gone.
      The Maginot Line outflanked, the panzers through the Ardennes.
      De Gaulle fled to London and spoke: France had lost a battle, not the war.
      Vichy chose collaboration. The Resistance chose otherwise.
      The fall: the century's great shock.
    description: "France surrenders in June 1940 — the traveler is in Paris as the Germans march in, and hears de Gaulle in London say France lost a battle, not the war."
    status: "published"
    sha256: "a6ab09013369f504d3e9b42429932fd1a3e3184e2598d473f9a6386484f74254"
  - number: "3533"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Few"
    date: "1940 CE"
    region: "England"
    poem: |
      The RAF held the skies over Britain in 1940 —
      "Never was so much owed by so many to so few."
      I stood on the Kentish hills, the contrails,
      The Spitfires and Hurricanes against the Luftwaffe's waves.
      Two thousand nine hundred aircrew — the Few —
      Held the invasion off, day after day.
      Radar, courage, and the narrow Channel.
      Britain's finest hour, in the sky.
      I watched the dogfights and wept for the ones who didn't come back.
    description: "The RAF holds the skies in the Battle of Britain — the traveler stands on the Kentish hills watching the Few, and weeps for the ones who didn't come back."
    status: "published"
    sha256: "06bb99f97edd0c69175093de9034d9a7c19c4d1516c32bcbb005624b7a3d23d0"
  - number: "3534"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Blitz"
    date: "1940 CE"
    region: "England"
    poem: |
      Night after night the bombs fell on London —
      And London carried on.
      I walked the streets during the Blitz, the fires,
      The Underground as dormitory, the humor in the rubble.
      Fifty-seven consecutive nights, then the long grind —
      Forty thousand dead, a million houses damaged.
      "London can take it" — and London did.
      The Blitz: terror from the sky, answered with tea and stubbornness.
      It was meant to break them. It made them.
    description: "The Blitz bombs London night after night in 1940 — the traveler walks the burning streets and says the bombing was meant to break London; it made London."
    status: "published"
    sha256: "016d2f8e979d42b48b2a5f25ba6f18a659d4f6d38995b2c4f75d912cbd374676"
  - number: "3535"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Greece Says No"
    date: "1940 CE"
    region: "Greece"
    poem: |
      Mussolini invaded Greece in 1940 —
      And the Greeks threw him back into Albania.
      I was in the Pindus mountains, the snow,
      The Greek army — outnumbered, outgunned — winning.
      "Ochi" — No — the whole nation said it as one.
      It was the Axis's first defeat, and it stung.
      Hitler had to rescue Mussolini, delaying Barbarossa —
      Some say those lost weeks cost Germany Moscow.
      Greece said no. History said thank you.
    description: "Mussolini invades Greece in 1940 and the Greeks throw him back — the traveler is in the Pindus mountains for the Axis's first defeat; some say the delay cost Germany Moscow."
    status: "published"
    sha256: "bfec559a407efdd8d5c4e6d940ea15f7c00eaff053f0e9986dd8f0403763f009"
  - number: "3536"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Golden Arches Begin"
    date: "1940 CE"
    region: "California, USA"
    poem: |
      The McDonald brothers opened their first restaurant in San Bernardino —
      The Golden Arches began.
      I ate there, the burgers, the fries, the speed,
      The Speedee Service System — fast food's big bang.
      Ray Kroc hadn't arrived yet; the arches weren't golden yet.
      But the idea was there: food, fast, identical, everywhere.
      The most successful restaurant idea in history,
      Born in a California drive-in.
      The world would eat it, billions served.
    description: "The McDonald brothers open their first restaurant in San Bernardino in 1940 — the traveler eats there and calls the Speedee Service System fast food's big bang."
    status: "published"
    sha256: "dac9ccded0c6075b0b2fecd5c6c18056835d439bec4a5af20c066611cfc24ec9"
  - number: "3537"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "What's Up, Doc?"
    date: "1940 CE"
    region: "USA"
    poem: |
      Bugs Bunny debuted in 1940 —
      The wisecracking rabbit took over cartoons.
      I watched A Wild Hare, the first true Bugs,
      "What's up, doc?" — and animation got its trickster.
      He outsmarted Elmer, Daffy, the whole menagerie —
      The Depression's survivor as cartoon.
      Chuck Jones would perfect him; the war would draft him.
      The rabbit: cool when the world wasn't.
      Eighty years on, still outsmarting everyone.
    description: "Bugs Bunny debuts in 1940 — the traveler watches A Wild Hare and calls him the Depression's survivor as cartoon: cool when the world wasn't."
    status: "published"
    sha256: "c2878bcd55116c91cb02efd2e40d2765e96199deefb1175311a07aec8667febd"
  - number: "3538"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Ice Axe"
    date: "1940 CE"
    region: "Mexico"
    poem: |
      A Soviet agent buried an ice axe in Trotsky's skull in Mexico City —
      Stalin's long arm, reaching across the ocean.
      I was in Coyoacán that August, the fortress house,
      The rabbits, the bodyguards — and the assassin with the alpenstock.
      Trotsky fought him off, then died the next day.
      The revolution's co-leader, murdered by the revolution's heir.
      Ramon Mercader got twenty years; Stalin got his revenge.
      Exile is no protection from history.
    description: "A Soviet agent murders Trotsky with an ice axe in Mexico City in 1940 — the traveler is in Coyoacán and says exile is no protection from history."
    status: "published"
    sha256: "bcbc865e74db0d266e598a96f6517634f71c7a81017db9eadc4d1f3b87c78d7e"
  - number: "3539"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Japan Moves South"
    date: "1940 CE"
    region: "Vietnam"
    poem: |
      Japan occupied French Indochina in 1940 —
      And the road to Pearl Harbor narrowed.
      I watched the troops land, the Vichy French helpless,
      The staging ground for the southern advance.
      America answered with the oil embargo —
      The noose that would drive Japan to war.
      Indochina: the domino that started the Pacific war.
      The road to Pearl Harbor ran through Saigon.
      I walked it, and felt the trap closing.
    description: "Japan occupies French Indochina in 1940 — the traveler watches the troops land and says the road to Pearl Harbor ran through Saigon; the American oil embargo was the noose."
    status: "published"
    sha256: "c2cda70b2ce486492210893cabc277c16fb66be806fba185b19cf4de8f75c1e0"
  - number: "3540"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Barbarossa"
    date: "1941 CE"
    region: "Russia"
    poem: |
      Three million Germans invaded Russia in June 1941 —
      The largest invasion in history.
      I stood on the frontier at dawn, the artillery,
      The panzers rolling east into the endless land.
      Stalin was stunned; the Red Army collapsed —
      Millions encircled, the road to Moscow open.
      But Russia was vast, and winter was coming,
      And the invasion that was supposed to take weeks took years.
      Barbarossa: the war's hinge, and Germany's doom.
    description: "Three million Germans invade Russia in June 1941 — the traveler stands on the frontier at dawn and calls Barbarossa the war's hinge and Germany's doom."
    status: "published"
    sha256: "c35838a75e6ac74e4b6212b922b900d949e0ac603e97804104427f69248a9263"
  - number: "3541"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "A Date Which Will Live in Infamy"
    date: "1941 CE"
    region: "Hawaii, USA"
    poem: |
      Japanese planes shattered Pearl Harbor on December 7, 1941 —
      And America entered the war.
      I was on Oahu that Sunday morning, the bombs,
      The Arizona going down with a thousand men.
      Roosevelt's speech the next day: infamy.
      The isolationists were silenced; the arsenal was unleashed.
      Japan's gamble: the knockout blow.
      America's answer: total war.
      The Pacific war began in fire, on a quiet Sunday.
    description: "Japan attacks Pearl Harbor on December 7, 1941 — the traveler is on Oahu that Sunday morning and hears Roosevelt's infamy speech the next day."
    status: "published"
    sha256: "bb48b8a07e83742668fe274162c3e702177ba9fb044c1642e205f6c71770e431"
  - number: "3542"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Siege Begins"
    date: "1941 CE"
    region: "Russia"
    poem: |
      Leningrad was cut off in September 1941 —
      Nine hundred days of hunger began.
      I walked those streets in the winter, the bread rations,
      The dead on sledges, the symphony playing.
      A million died — of hunger, cold, shells.
      They ate glue, leather, each other — and held.
      Shostakovich's Seventh, performed in the siege —
      Defiance as music.
      Leningrad: the city that refused to die.
    description: "The siege of Leningrad begins in 1941 — 900 days of hunger, and the traveler walks the winter streets where a million died and the city refused to die."
    status: "published"
    sha256: "94de8c076c219f17905b706863b323896be11cabdafc1e49a23fbddc2a705bc3"
  - number: "3543"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Arsenal of Democracy"
    date: "1941 CE"
    region: "USA"
    poem: |
      America became the arsenal of democracy in 1941 —
      Weapons flowed to Britain and Russia.
      I toured the factories, the Willow Run bomber plant,
      The women riveters, the production miracle.
      Lend-Lease: the pipeline that kept the Allies alive.
      Detroit made tanks; the shipyards made Liberty ships —
      Faster than the U-boats could sink them.
      Democracy's arsenal: the industrial sublime.
      The war was won in the factories before it was won in the field.
    description: "America becomes the arsenal of democracy in 1941 — the traveler tours Willow Run and says the war was won in the factories before it was won in the field."
    status: "published"
    sha256: "17ec794f6045f8c64cb663b7ecdd3da5f0da20f935704adda86b741e7aa4b70d"
  - number: "3544"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Ravine"
    date: "1941 CE"
    region: "Ukraine"
    poem: |
      The Nazis murdered 34,000 Jews at Babi Yar in two days —
      The ravine outside Kiev.
      I stood at that ravine, the earth,
      The machine guns, the layers of bodies.
      It was the Holocaust by bullets — before the gas chambers.
      The Einsatzgruppen followed the army east, killing as they went.
      Babi Yar: the single largest massacre of the war's first years.
      The ravine is a park now. The earth remembers.
      I remember.
    description: "The Nazis murder 34,000 Jews at Babi Yar in two days in 1941 — the traveler stands at the ravine and says the earth remembers; he remembers."
    status: "published"
    sha256: "725412354887e9f2d33cf93b2e04937461645751b0ae9aa54a38c92ed8ed5150"
  - number: "3545"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Charter"
    date: "1941 CE"
    region: "Atlantic"
    poem: |
      Roosevelt and Churchill signed the Atlantic Charter in 1941 —
      The war got its aims.
      I was off Newfoundland, the two warships anchored,
      The church service, the hymns across the water.
      Self-determination, free trade, no territorial grabs —
      The promise of a better peace.
      It was aspirational — empires don't dissolve on paper.
      But the colonized world heard it, and remembered.
      The Charter: the war's conscience, signed at sea.
    description: "Roosevelt and Churchill sign the Atlantic Charter off Newfoundland in 1941 — the traveler is there for the hymns across the water; the colonized world heard it and remembered."
    status: "published"
    sha256: "35dd44048a235785bdd316c7f9a9086283e4c6b5ab7e2abe12cb9a10208ab4eb"
  - number: "3546"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Red Tails"
    date: "1941 CE"
    region: "Alabama, USA"
    poem: |
      The Tuskegee Airmen began training in 1941 —
      Black pilots who would own the skies over Europe.
      I watched them at Tuskegee, the determination,
      The Army expecting failure, getting excellence.
      The 332nd: the Red Tails, the bomber crews' guardians —
      Never lost a bomber to enemy fighters, they say.
      They came home to Jim Crow, medals and all.
      The Double V: victory abroad, victory at home.
      They earned both. America paid one.
    description: "The Tuskegee Airmen begin training in 1941 — the traveler watches at Tuskegee and says they earned the Double V; America paid only one."
    status: "published"
    sha256: "a1e1f5d8126cc6ed6322a82e8c1be27fbafc3f732cf4b677fbc70139e634727f"
  - number: "3547"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Greatest Film"
    date: "1941 CE"
    region: "USA"
    poem: |
      Citizen Kane premiered in 1941 —
      Welles, twenty-five, reinvented cinema.
      I sat in that theater, the deep focus,
      Rosebud, the fractured narrative, the ceilings on camera.
      Hearst tried to kill it; the critics worshipped it.
      It flopped, then became the greatest film ever made —
      Every poll, every decade.
      "Rosebud": the most famous MacGuffin in history.
      A boy's sled, and the emptiness of power.
    description: "Citizen Kane premieres in 1941 — the traveler sits in the theater as the 25-year-old Welles reinvents cinema; Hearst tried to kill it, the critics worshipped it."
    status: "published"
    sha256: "05ed5b106badf22fbfc58d53813f2bccf147c43a871644cf777c3e1bf180ac30"
  - number: "3548"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Wonder Drug Proves Itself"
    date: "1941 CE"
    region: "England"
    poem: |
      Florey's team saved a dying policeman with penicillin in 1941 —
      The trial was a triumph.
      I stood in the Oxford ward, the sepsis retreating,
      The mold's miracle, finally proven in a human.
      They ran out of the drug — the patient relapsed and died.
      But the proof was there. America mass-produced it.
      D-Day's medics carried it; the wounded lived.
      The wonder drug: from a petri dish to the beaches of Normandy.
    description: "Florey's team proves penicillin in a dying policeman in 1941 — the traveler stands in the Oxford ward; they ran out and he relapsed, but the proof carried to Normandy's beaches."
    status: "published"
    sha256: "0014d3161d0fb0b18f4e72c7ec5a5341ee353f6ab29b25485b0e22080a85ab6e"
  - number: "3549"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Faces in the Mountain"
    date: "1941 CE"
    region: "South Dakota, USA"
    poem: |
      Mount Rushmore was finished in 1941 —
      Four presidents in granite.
      I stood in the Black Hills, the huge faces,
      Borglum's dream, fourteen years of blasting.
      Washington, Jefferson, Lincoln, Roosevelt —
      Democracy's Mount Olympus, carved in stone.
      The Lakota call it stolen land — and they're right.
      The faces are magnificent. The history is complicated.
      Granite remembers what men forget.
    description: "Mount Rushmore is finished in 1941 — the traveler stands in the Black Hills and says the faces are magnificent and the history is complicated; granite remembers what men forget."
    status: "published"
    sha256: "888260fb1ad36a91615c66fe055ce797e1bb64e4c26d4036ccd89c473153ac5f"
  - number: "3550"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Wannsee Conference"
    date: "1942 CE"
    region: "Germany"
    poem: |
      Nazi officials planned the Final Solution over lunch at Wannsee in 1942 —
      Ninety minutes, fifteen men, eleven million marked for death.
      I sat outside that villa on the lake, the winter,
      Heydrich's meeting, Eichmann's minutes — bureaucratic evil.
      They discussed it like logistics: trains, camps, numbers.
      The Holocaust's paperwork, over lunch.
      It was already happening — the minutes just organized it.
      Evil, I learned that day, wears a suit and takes notes.
    description: "Nazi officials plan the Final Solution over lunch at Wannsee in 1942 — the traveler sits outside the lakeside villa and learns evil wears a suit and takes notes."
    status: "published"
    sha256: "0a6d4296345bb19685673050d4895a495c3f8b6002cd33c44ea908254322b5fd"
  - number: "3551"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Thirty Seconds Over Tokyo"
    date: "1942 CE"
    region: "Japan"
    poem: |
      Doolittle's bombers struck Tokyo in April 1942 —
      America hit back.
      I watched the Hornet launch the B-25s, the impossible takeoff,
      Sixteen bombers, one-way trip, the raid on the capital.
      The damage was small; the message was huge —
      Japan was vulnerable, America was coming.
      The raiders crash-landed in China; the Japanese retaliated horribly.
      But the morale! The headlines!
      Thirty seconds over Tokyo — and the Pacific war turned.
    description: "Doolittle's bombers strike Tokyo in April 1942 — the traveler watches the impossible launch from the Hornet; the damage was small, the message was huge."
    status: "published"
    sha256: "182c80641b200a55f3b342dce08faac88e87ad51c44bfff4f83a977972456ab2"
  - number: "3552"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Carriers Duel"
    date: "1942 CE"
    region: "Pacific"
    poem: |
      The first naval battle fought entirely by aircraft —
      Japan's advance was checked at the Coral Sea.
      I watched from the waves, the planes the only ships that met,
      Lexington lost, Shoho sunk, the invasion of Port Moresby stopped.
      No ship saw another ship. The admirals fought by radio.
      Naval warfare changed forever that May.
      The battleship era ended without a battleship firing.
      The carrier: the new capital ship, crowned at the Coral Sea.
    description: "The Battle of the Coral Sea in 1942 — the first naval battle fought entirely by aircraft, and the traveler says the battleship era ended without a battleship firing."
    status: "published"
    sha256: "8c7dc4c9af56c11c3061edbf8f956d25f9acb61c756f71fabf02596909bf5fe4"
  - number: "3553"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Turning Tide"
    date: "1942 CE"
    region: "Pacific"
    poem: |
      American carriers sank four Japanese flattops at Midway —
      The Pacific turned.
      I was there in June, the dive-bombers,
      The Akagi, Kaga, Soryu, Hiryu — burning in minutes.
      The codebreakers had done it — Nimitz knew where to wait.
      Japan's offensive power died that day.
      Five minutes: the most decisive five minutes in naval history.
      The turning tide — and it never turned back.
    description: "American carriers sink four Japanese carriers at Midway in 1942 — the traveler is there for the dive-bombers; five minutes, the most decisive in naval history."
    status: "published"
    sha256: "7bd25ad12e55774f7f58017c63c9667512be077555f43ef7a1daa18d4f1734f1"
  - number: "3554"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Camps"
    date: "1942 CE"
    region: "USA"
    poem: |
      120,000 Japanese Americans were rounded into desert camps in 1942 —
      Fear overruled the Constitution.
      I stood at the assembly centers, the families,
      The barracks, the barbed wire, the guard towers.
      Citizens, most of them — guilty of ancestry.
      The 442nd would become the most decorated unit in the war —
      Fighting for the country that caged their families.
      1988: the apology, the reparations. Too late, but real.
      The camps: America's shame, in the desert.
    description: "120,000 Japanese Americans are interned in desert camps in 1942 — the traveler stands at the assembly centers; the 442nd fought for the country that caged their families."
    status: "published"
    sha256: "01a9782431229ba4e8e332255f0343afcf7a58e02a7eb986a4e2a92db08f1ea2"
  - number: "3555"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The City on the Volga"
    date: "1942 CE"
    region: "Russia"
    poem: |
      The Germans reached Stalingrad in 1942 —
      And the deadliest battle in history began.
      I walked those streets, the rubble, the fighting room to room,
      Chuikov's order: hug the enemy, die where you stand.
      Two million casualties — the number staggers.
      The Volga ran with oil and blood.
      Stalingrad: the furnace where the Wehrmacht burned.
      The city's name was Stalin's. The victory was the people's.
    description: "The Germans reach Stalingrad in 1942 — the deadliest battle in history begins, and the traveler walks the rubble where two million fell; the furnace where the Wehrmacht burned."
    status: "published"
    sha256: "b6e20969c6a3e9bb6263b13718a127fcf62d739439b749eb0b6621f2c7d93a42"
  - number: "3556"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Line Holds"
    date: "1942 CE"
    region: "Egypt"
    poem: |
      Montgomery broke Rommel at El Alamein in 1942 —
      "The end of the beginning."
      I was in the desert, the artillery barrage,
      The minefields, the tanks — the Eighth Army's triumph.
      Rommel's legend met its match in methodical Monty.
      North Africa turned; the Allies would land in Morocco within weeks.
      Churchill's phrase was perfect: not the beginning of the end,
      But the end of the beginning.
      The desert: the war's cleanest battlefield, and its hardest.
    description: "Montgomery breaks Rommel at El Alamein in 1942 — the traveler is in the desert for the artillery barrage; Churchill's \"end of the beginning.\""
    status: "published"
    sha256: "8ae59b9139fa7ce2861ad7c66f8a0f35b9592a920a1c7659b7a2b19cb3bb51cb"
  - number: "3557"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Codebreakers"
    date: "1942 CE"
    region: "England"
    poem: |
      Turing's bombes cracked Enigma daily at Bletchley Park —
      The war's best-kept secret.
      I walked those huts, the clattering machines,
      The mathematicians, the crossword puzzlers, the Wrens.
      Ultra: the intelligence that shortened the war —
      The convoys rerouted, the U-boats ambushed.
      They couldn't tell a soul — not for thirty years.
      The codebreakers: the silent victors.
      Turing's reward was persecution. History's shame.
    description: "Turing's bombes crack Enigma daily at Bletchley Park — the traveler walks the huts and calls them the silent victors; Turing's reward was persecution, history's shame."
    status: "published"
    sha256: "43a42cdcff78b4d6ca9cb2152fba1d88eba09525fc0581e83fd2ce21e34963fe"
  - number: "3558"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Race for the Bomb"
    date: "1942 CE"
    region: "USA"
    poem: |
      The Manhattan Project began in 1942 —
      The race to split the atom into a weapon.
      I toured Los Alamos, the mesa, the brilliant exiles,
      Oppenheimer's city of geniuses, building the unthinkable.
      Two billion dollars, 130,000 people — the biggest secret in history.
      They raced the Germans; the Germans weren't racing.
      The bomb was built for Hitler and used on Japan.
      The race: won, and lost, at the same time.
    description: "The Manhattan Project begins in 1942 — the traveler tours Los Alamos and says the bomb was built for Hitler and used on Japan; the race was won and lost at the same time."
    status: "published"
    sha256: "2ecce63a73fe057a6f989e7d64538b136f6fe9fa34c09ad9a46d90ade562d478"
  - number: "3559"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The First Reactor"
    date: "1942 CE"
    region: "Chicago, USA"
    poem: |
      Fermi's pile went critical under a Chicago squash court in 1942 —
      The atomic age ignited.
      I stood on the balcony, the cadmium rods,
      The clicks rising — the first controlled chain reaction.
      "How far off?" — Fermi's slide rule, the calm.
      They'd stacked the graphite and uranium by hand.
      Stagg Field: the most important squash court in history.
      The coded message: "The Italian navigator has landed in the New World."
      The New World: the atomic one.
    description: "Fermi's reactor goes critical under a Chicago squash court in 1942 — the traveler stands on the balcony as the clicks rise; the coded message said the Italian navigator had landed in the New World."
    status: "published"
    sha256: "16cb020e84ad55512da083ace130ae3a71f7d76e7c9ea7b6382916fd2f3d3ea1"
  - number: "3560"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Island of Death"
    date: "1942 CE"
    region: "Pacific"
    poem: |
      Marines landed on Guadalcanal in 1942 —
      Six months of jungle hell.
      I walked that island, the mud, the malaria,
      The Tokyo Express, the night battles, Henderson Field.
      The first American offensive — and it nearly failed.
      The Navy left; the Marines held.
      Guadalcanal: the school of the Pacific war.
      The island of death taught the living how to win.
    description: "Marines land on Guadalcanal in 1942 — six months of jungle hell, and the traveler walks the mud and malaria of the Pacific war's school."
    status: "published"
    sha256: "abca402f40ddea27e91156acd4529a641a8b636e04d55d4b5492dccf1fe9d8fa"
  - number: "3561"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Into Hiding"
    date: "1942 CE"
    region: "Netherlands"
    poem: |
      The Franks slipped into the secret annex in 1942 —
      And Anne began her diary.
      I stood on the Prinsengracht, the bookcase door,
      The eight people in the hidden rooms.
      She was thirteen. She wrote for two years —
      The most famous diary in history, in a child's hand.
      "I still believe, in spite of everything, that people are truly good at heart."
      The annex: hope, in hiding.
      I have read her words in a hundred languages.
    description: "The Frank family slips into the secret annex in 1942 — the traveler stands on the Prinsengracht; Anne is thirteen, and her diary becomes the most famous in history."
    status: "published"
    sha256: "8489fccfc4b007ceb3d18d53364993c64fc6ed4f7e85a77804353ff1ec2b7364"
  - number: "3562"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Rocket Weapon"
    date: "1942 CE"
    region: "Germany"
    poem: |
      The V-2 flew at Peenemünde in 1942 —
      The first ballistic missile, the ancestor of spaceflight.
      I watched it rise, the flame, the scream,
      Von Braun's rocket — built by slaves, aimed at London.
      It killed thousands; it taught the world rocketry.
      The V-2: the weapon that became the spaceship.
      Dora's dead built the road to the Moon.
      Technology's original sin, in steel and fire.
    description: "The V-2 flies at Peenemünde in 1942 — the first ballistic missile, built by slave labor, ancestor of spaceflight; the traveler calls it technology's original sin."
    status: "published"
    sha256: "420d21608f9eb1407bf5c93a7c0a496783a90051842447c37132ea1a1561d8f2"
  - number: "3563"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Surrender at Stalingrad"
    date: "1943 CE"
    region: "Russia"
    poem: |
      Paulus surrendered at Stalingrad in 1943 —
      An entire German army died in the snow.
      I walked the frozen city after, the prisoners,
      Ninety-one thousand marching out — few came home.
      The war's hinge: the Wehrmacht's back broken.
      Hitler had forbidden retreat; the retreat was into captivity.
      Stalingrad: the turning point you could hear around the world.
      The Germans never advanced again in the East.
      The snow kept the secret of how many died.
    description: "Paulus surrenders at Stalingrad in 1943 — the traveler walks the frozen city as 91,000 prisoners march out; the war's hinge, the Wehrmacht's back broken."
    status: "published"
    sha256: "068bb450636db0401fa776b652a2ad27d719050219fb41569a4abe2198b3caac"
  - number: "3564"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Ghetto Fights Back"
    date: "1943 CE"
    region: "Poland"
    poem: |
      Starving Jews rose against the Nazis in the Warsaw Ghetto in 1943 —
      And held for weeks.
      I was outside those walls, the smoke,
      The few pistols, the Molotovs, against tanks.
      Mordechai Anielewicz's fighters knew they would die —
      They chose how.
      Twenty-eight days: the first urban uprising in occupied Europe.
      The ghetto burned; the fighters died.
      But they died fighting, and the world learned the word: resistance.
    description: "The Warsaw Ghetto rises against the Nazis in 1943 — starving fighters hold for 28 days, and the traveler says they chose how they would die; the world learned the word resistance."
    status: "published"
    sha256: "bbe15242b4e60c38470fa38ba7fa05a257c0ee94eb7fe7344191200c12dd0d2b"
  - number: "3565"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Dambusters"
    date: "1943 CE"
    region: "Germany"
    poem: |
      Lancasters bounced bombs into the Ruhr dams in 1943 —
      The war's most daring raid.
      I watched them train, the low flying,
      Gibson's 617 Squadron, the bouncing bomb — Barnes Wallis's genius.
      The Möhne and Eder dams broke; the valley flooded.
      The cost was terrible — eight of nineteen planes lost.
      The Dambusters: precision, courage, and the price.
      The film made it legend. The crews made it real.
    description: "Lancasters bounce bombs into the Ruhr dams in 1943 — the traveler watches 617 Squadron train; the war's most daring raid, and its terrible price."
    status: "published"
    sha256: "e01a39632ad7956d5df8376a6b5f4cd3a62d8e384d80fa6c48ec59f88e9e4a57"
  - number: "3566"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Firestorm"
    date: "1943 CE"
    region: "Germany"
    poem: |
      Hamburg burned in a firestorm in 1943 —
      Forty thousand dead in one week of bombing.
      I walked the city after, the melted streets,
      The firestorm's fury — the air itself on fire.
      Operation Gomorrah: the RAF by night, the Americans by day.
      The old city died; the question lived:
      Was it war, or was it murder?
      The bombing's morality, argued ever since.
      Hamburg: the firestorm's lesson, in ash.
    description: "Hamburg burns in a firestorm in 1943 — 40,000 dead in a week, and the traveler walks the melted streets asking the question argued ever since: war or murder?"
    status: "published"
    sha256: "ae69ec3b718ac368800f80471201e6b2be94a10cdde92c8219b34b2d03699d31"
  - number: "3567"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Italy Quits"
    date: "1943 CE"
    region: "Italy"
    poem: |
      Italy surrendered in 1943 —
      Mussolini fell, and Germany occupied its former ally.
      I was in Rome for the news, the disbelief,
      The King dismissing Il Duce, the armistice, the chaos.
      The Germans disarmed their allies overnight —
      Italy became a battlefield, north and south.
      Mussolini was rescued, then propped up as a puppet.
      Italy quit. The war didn't.
      The soft underbelly turned out to be hard.
    description: "Italy surrenders in 1943 — Mussolini falls and Germany occupies its former ally; the traveler is in Rome and says the soft underbelly turned out to be hard."
    status: "published"
    sha256: "8655f3db97eec6b783f64c521b2b7a7ede5e99b964d585cf90c8d3d93737a334"
  - number: "3568"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Big Three Meet"
    date: "1943 CE"
    region: "Iran"
    poem: |
      Roosevelt, Churchill, and Stalin met at Tehran in 1943 —
      The second front was promised.
      I watched the three of them, the photographers,
      The alliance at its peak — and its most fragile.
      Overlord agreed: the invasion, the date, the place.
      Stalin got his front; the West got its promises.
      Tehran: the high-water mark of the alliance.
      Within years they'd be enemies.
      But for those days, in Persia, they were winning together.
    description: "Roosevelt, Churchill, and Stalin meet at Tehran in 1943 — the traveler watches the alliance at its peak and most fragile; the second front is promised."
    status: "published"
    sha256: "53ca1b34b39f3b2adc23f29b1bdf471340f6725a3a02374bd7316c8477a262f5"
  - number: "3569"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Hungry Province"
    date: "1943 CE"
    region: "India"
    poem: |
      Famine gripped Bengal in 1943 —
      Millions starved while grain ships sailed past.
      I walked the Calcutta streets, the skeletons,
      The rice denied, the boats requisitioned for the war.
      Churchill's policies, the Japanese in Burma, the hoarders —
      Three million dead, the empire's shame.
      The Hungry Province: the war's forgotten famine.
      Bengal starved while the empire ate.
      I will not forget. Bengal doesn't.
    description: "Famine grips Bengal in 1943 — millions starve while grain ships sail past, and the traveler walks the Calcutta streets; the war's forgotten famine, the empire's shame."
    status: "published"
    sha256: "ecb8cabb633ad0df24650ae31881645b63b81dca91ce20818805cd836b1c2bbe"
  - number: "3570"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Five-Sided Fortress"
    date: "1943 CE"
    region: "Virginia, USA"
    poem: |
      The Pentagon opened in 1943 —
      The world's largest office building, built for war.
      I walked its rings, the miles of corridor,
      Sixteen months to build, the war's headquarters.
      It was supposed to be temporary — the war's end would empty it.
      It never emptied. The war never quite ended.
      The five-sided fortress: the military-industrial sublime.
      The building outlasted the war it was built for.
    description: "The Pentagon opens in 1943 — the traveler walks its rings and says it was supposed to be temporary; the building outlasted the war it was built for."
    status: "published"
    sha256: "15dcb71b5766e9b1ddfcc0ccbb44d719f2d3578a804f1140c4855fe559669106"
  - number: "3571"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Zoot Suit Riots"
    date: "1943 CE"
    region: "California, USA"
    poem: |
      Sailors attacked Mexican-American youths in Los Angeles in 1943 —
      Wartime racism on the home front.
      I walked those streets, the beatings,
      The zoot suits stripped off, the police watching.
      The pachucos were the targets — their style, their pride.
      The Navy blamed the victims; the press cheered the sailors.
      America fought racism abroad and practiced it at home.
      The Zoot Suit Riots: the home front's shame.
      The suits were fabulous. The beatings were not.
    description: "Sailors attack Mexican-American youths in the 1943 Zoot Suit Riots — the traveler walks the LA streets; America fought racism abroad and practiced it at home."
    status: "published"
    sha256: "4fc8ca65fe2d14794daf06c298549bca95f004a9b9765db6796bb2725f8abb4f"
  - number: "3572"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Monastery Falls"
    date: "1944 CE"
    region: "Italy"
    poem: |
      Allied bombs flattened Monte Cassino's abbey in 1944 —
      And the Gustav Line finally broke.
      I stood in the ruins, the ancient monastery,
      Founded by St. Benedict, destroyed by mistake — no Germans were inside.
      The bombing was pointless; the battle was not.
      Four assaults, the Poles taking the hill at last.
      The monastery fell; the line broke.
      The abbey was rebuilt, stone by stone.
      Some things can be rebuilt. The dead can't.
    description: "Allied bombs flatten Monte Cassino's abbey in 1944 — the traveler stands in the ruins; the monastery was rebuilt stone by stone, but the dead can't be."
    status: "published"
    sha256: "f66b6218e056808fdeb4b6b815dd39779db35650d95aad31d220b118c153fe74"
  - number: "3573"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Longest Day"
    date: "1944 CE"
    region: "France"
    poem: |
      150,000 men stormed Normandy's beaches on June 6, 1944 —
      The liberation of Europe began.
      I was on Omaha Beach, the slaughter,
      The Higgins boats, the cliffs, the boys who didn't make it.
      Utah, Omaha, Gold, Juno, Sword — the names of the dawn.
      It was the largest amphibious invasion ever —
      And it worked.
      The Longest Day: the beginning of the end.
      I walked that sand. I remember every wave.
    description: "150,000 men storm Normandy's beaches on D-Day 1944 — the traveler is on Omaha Beach; the largest amphibious invasion ever, and the beginning of the end."
    status: "published"
    sha256: "dad9ecc7e3e229f90c43e3f936631e0b45c2d038afe115faa5397abf94fcf9de"
  - number: "3574"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Paris Is Free"
    date: "1944 CE"
    region: "France"
    poem: |
      Leclerc's tanks rolled into Paris in August 1944 —
      And de Gaulle marched down the Champs-Elysees.
      I was on those streets, the joy,
      The FFI rising, the Germans leaving, the bells.
      Four years of occupation ended in a week of celebration.
      De Gaulle's march: the republic reclaimed.
      Paris was free — wounded, hungry, but free.
      The City of Light, lit again.
      I wept with the crowds. Everyone wept.
    description: "Paris is liberated in August 1944 — the traveler is on the streets for de Gaulle's march down the Champs-Elysees; the City of Light, lit again."
    status: "published"
    sha256: "0ee9d3c1784a8ef0721bb3ea73b3f45d4a93e700d64531dbe33a6f1294fa3cde"
  - number: "3575"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The City Rises"
    date: "1944 CE"
    region: "Poland"
    poem: |
      Warsaw rose against the Nazis in 1944 —
      And the Red Army watched from across the river.
      I was in the city for the 63 days, the barricades,
      The Home Army's heroism, the hope for liberation.
      Stalin halted — and let the Nazis crush the rising.
      It was deliberate: the future Poland, decapitated.
      200,000 dead; the city systematically destroyed.
      The City Rises: the bravest, most betrayed uprising of the war.
      Warsaw rose. The world watched. Stalin waited.
    description: "Warsaw rises against the Nazis in 1944 — 63 days, and the Red Army watches from across the river; the traveler calls it the bravest, most betrayed uprising of the war."
    status: "published"
    sha256: "cc76ed4710223de62459b73e5e719cae5061d878d3e4e5f026a95b9c4d963cbd"
  - number: "3576"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Annex Is Betrayed"
    date: "1944 CE"
    region: "Netherlands"
    poem: |
      The Gestapo raided the secret annex in August 1944 —
      Anne was sent to Bergen-Belsen.
      I stood on the Prinsengracht, the trucks,
      The eight people dragged out — the diary left behind.
      Someone betrayed them — we still don't know who.
      Anne died in the camp, weeks before liberation.
      Her father survived, and published her words.
      The annex: betrayed, but not silenced.
      The diary outlived the Reich.
    description: "The Gestapo raids the secret annex in August 1944 — the traveler stands on the Prinsengracht; Anne dies in Bergen-Belsen, but the diary outlives the Reich."
    status: "published"
    sha256: "ff2c353318698236c8abcc8922ce68561e0089a6c0686b6526c504a2dc9e1295"
  - number: "3577"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Money's New Order"
    date: "1944 CE"
    region: "New Hampshire, USA"
    poem: |
      Bretton Woods created the dollar-based money order in 1944 —
      The IMF and World Bank were born.
      I sat in that New Hampshire hotel, the delegates,
      Keynes and White designing the peace's economy.
      Fixed exchange rates, the dollar as gold —
      The system that would run the world for thirty years.
      Money's new order: the economists' peace.
      It worked — until it didn't, in 1971.
      But the institutions endured.
    description: "Bretton Woods creates the dollar-based money order in 1944 — the traveler sits in the New Hampshire hotel as Keynes and White design the peace's economy."
    status: "published"
    sha256: "f7cd59a9fe6d97799b2a74123bae6803766959bf19bba1d81a990844f9d8ec75"
  - number: "3578"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Last Great Sea Battle"
    date: "1944 CE"
    region: "Philippines"
    poem: |
      The US Navy smashed Japan at Leyte Gulf in 1944 —
      History's largest naval battle.
      I watched from the waves, the four engagements,
      The kamikazes' debut, the last battleship duel.
      The Japanese navy ceased to exist as a force.
      MacArthur returned — "I shall return," fulfilled.
      Leyte Gulf: the end of the Imperial Japanese Navy.
      The largest sea battle ever, and the last of its kind.
    description: "The US Navy smashes Japan at Leyte Gulf in 1944 — history's largest naval battle, the kamikazes' debut, and the end of the Imperial Japanese Navy."
    status: "published"
    sha256: "81238310585e08d55246676277dc3202519437258bebd4d06ffca84615e57a2b"
  - number: "3579"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The GI Bill"
    date: "1944 CE"
    region: "USA"
    poem: |
      The GI Bill promised veterans college and homes in 1944 —
      The American middle class was born.
      I watched the vets enroll, the campuses overflowing,
      The mortgages, the suburbs, the boom.
      It was the most generous veterans' law ever —
      And it built modern America.
      Black vets were cheated of its benefits — the fine print of racism.
      But the Bill's promise was real: serve, and the country serves you.
      The middle class: legislated into existence.
    description: "The GI Bill promises veterans college and homes in 1944 — the traveler watches the campuses overflow; the American middle class, legislated into existence."
    status: "published"
    sha256: "a358d70cc5e3b1a88c16b2fb0d89986e52c9a147b66a9d5d61474aa2bbae97ca"
  - number: "3580"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Gates Open"
    date: "1945 CE"
    region: "Poland"
    poem: |
      Soviet troops entered Auschwitz in January 1945 —
      And the world saw the Holocaust's machinery.
      I walked those gates, the snow,
      The survivors, the warehouses of hair and shoes.
      The gas chambers, the crematoria — the industrialization of murder.
      The world had known; now it saw.
      The Gates Open: the proof, in brick and ash.
      I will not describe it further. The facts are enough.
      Remember: it was done by people, to people.
    description: "Soviet troops enter Auschwitz in January 1945 — the traveler walks through the gates; the world had known, now it saw: murder industrialized, done by people to people."
    status: "published"
    sha256: "4cfcecdc714f01683472956afad1428ca3ea931f6f68df84b40b6326c287f7c7"
  - number: "3581"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Yalta"
    date: "1945 CE"
    region: "Crimea"
    poem: |
      The Big Three carved up postwar Europe at Yalta in 1945 —
      The Cold War's first draft.
      I was in the Livadia Palace, the aging leaders,
      Roosevelt dying, Churchill wary, Stalin smiling.
      Poland's fate was sealed; the UN was planned.
      The agreements were vague; the spheres were real.
      Yalta: the peace that became the Cold War.
      The Big Three divided the world — and the world stayed divided.
    description: "The Big Three carve up postwar Europe at Yalta in 1945 — the traveler is in the Livadia Palace; the peace that became the Cold War's first draft."
    status: "published"
    sha256: "efe7596a2d5254121dd877cbdf61431960613b2f9eb0eee0ccf2af8c0549fdd7"
  - number: "3582"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Firestorm over Dresden"
    date: "1945 CE"
    region: "Germany"
    poem: |
      Dresden burned in February 1945 —
      And the bombing's morality will be argued forever.
      I walked the city after, the ash,
      The Altstadt destroyed, the refugees, the dead.
      Was it necessary? Was it revenge? Was it a message to Stalin?
      The questions outlived the answers.
      The firestorm: the war's most controversial bombing.
      Dresden rebuilt; the argument didn't.
      I have no verdict. I have the ash.
    description: "Dresden burns in February 1945 — the traveler walks the ash and offers no verdict, only the questions that outlived the answers."
    status: "published"
    sha256: "f1d64997856b12e6b568eab4f2e4de1ad946c489b64f6a67cfc2c3af35989a2a"
  - number: "3583"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Flag on Suribachi"
    date: "1945 CE"
    region: "Pacific"
    poem: |
      Marines raised the flag on Mount Suribachi in 1945 —
      The Pacific war's iconic image.
      I was on Iwo Jima, the black sand,
      The 36 days of hell, the tunnels, the dead.
      Rosenthal's photo: the second flag, the famous one.
      It became the statue, the symbol, the memory.
      Iwo Jima: 7,000 Marines dead for eight square miles.
      The flag: the image that justified the cost — almost.
    description: "Marines raise the flag on Mount Suribachi in 1945 — the traveler is on Iwo Jima's black sand; 7,000 dead for eight square miles, and the photo that almost justified it."
    status: "published"
    sha256: "657b86efeca3321416af3f5875edc225836ebf0c2fc127e9a2406c58574e7c2a"
  - number: "3584"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Typhoon of Steel"
    date: "1945 CE"
    region: "Japan"
    poem: |
      Okinawa fell after 82 days in 1945 —
      The bloodiest Pacific battle, a preview of invasion.
      I walked that island, the caves,
      The kamikazes, the civilians caught between.
      200,000 dead — the typhoon of steel.
      It convinced America: invading Japan would be hell.
      The bomb became the alternative.
      Okinawa: the battle that made Hiroshima thinkable.
      The preview was horror. The main event was worse.
    description: "Okinawa falls after 82 days in 1945 — the bloodiest Pacific battle, and the traveler says it made Hiroshima thinkable; the preview was horror."
    status: "published"
    sha256: "32fad843c6e168e69ff875b1aa92401a745c04ff83fef2798e03745803bc7340"
  - number: "3585"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The President Dies"
    date: "1945 CE"
    region: "Georgia, USA"
    poem: |
      Roosevelt died at Warm Springs in April 1945 —
      And Truman inherited the war and the bomb.
      I was in America for the news, the shock,
      The man who'd led for twelve years, gone in an afternoon.
      The nation mourned; the world wondered.
      Truman: the haberdasher, the decision-maker.
      He learned about the bomb that day.
      The presidency passed — and the atomic age with it.
    description: "Roosevelt dies at Warm Springs in April 1945 — the traveler feels the nation's shock; Truman inherits the war, the bomb, and the atomic age."
    status: "published"
    sha256: "632c6fc9459fc9da36715c4b01e58f2bab6829c4cf8bdb42211341008055f634"
  - number: "3586"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Bunker"
    date: "1945 CE"
    region: "Germany"
    poem: |
      Hitler died in his bunker in April 1945 —
      Berlin fell, the Reich was rubble.
      I was above that bunker, the shelling,
      The wedding, the cyanide, the gasoline.
      The thousand-year Reich lasted twelve years.
      Berlin: the rubble, the rape, the ruin.
      The Bunker: the end of the nightmare, in a hole.
      I felt no triumph. Only the silence after.
      The dead were still dead. The living had to rebuild.
    description: "Hitler dies in his Berlin bunker in April 1945 — the traveler is above ground in the shelling; the thousand-year Reich lasted twelve, and he feels no triumph, only silence."
    status: "published"
    sha256: "266e57122ae8f9a71e86d0a3bc408a3b4874b7dd0bfbef0f3517163f24d026bf"
  - number: "3587"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Victory in Europe"
    date: "1945 CE"
    region: "Europe"
    poem: |
      VE Day: Europe celebrated in May 1945 —
      The war in the West was over.
      I was in London, in Paris, in Moscow —
      The crowds, the kisses, the bells.
      Six years of war ended in a day of joy.
      But the Pacific burned on, and the Cold War waited.
      Victory in Europe: the celebration before the reckoning.
      The continent was free — and in ruins.
      The joy was real. So was the rubble.
    description: "VE Day in May 1945 — the traveler celebrates in London, Paris, and Moscow; the joy was real, and so was the rubble."
    status: "published"
    sha256: "92416c32a139ac06c172e75f1a22be0cfc98bce75210f681f7b9a72099c6be7b"
  - number: "3588"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The United Nations"
    date: "1945 CE"
    region: "California, USA"
    poem: |
      Fifty nations signed the UN Charter in San Francisco in 1945 —
      "Never again," on paper.
      I was in the Herbst Theatre, the signatures,
      The hope after the League's failure.
      The Security Council, the veto — the great powers' insurance.
      It wouldn't stop wars. But it would feed the hungry, shelter the refugees.
      The United Nations: the League's grandchild, with teeth — sometimes.
      Never again, on paper. The paper mattered.
    description: "Fifty nations sign the UN Charter in San Francisco in 1945 — the traveler is in the Herbst Theatre; it wouldn't stop wars, but the paper mattered."
    status: "published"
    sha256: "8f99b6c2dd7b91f111e5c431c2e374eca38af0ae946d54b0be781bfb5d4709d0"
  - number: "3589"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The First Flash"
    date: "1945 CE"
    region: "New Mexico, USA"
    poem: |
      The Trinity test lit the New Mexico desert in July 1945 —
      The atomic age began in fire.
      I stood at the observation point, the countdown,
      The flash — brighter than the sun, the mushroom cloud.
      Oppenheimer quoted the Gita: "I am become Death."
      The scientists cheered, then went quiet.
      The First Flash: the moment humanity could end itself.
      It worked. God forgive us, it worked.
    description: "The Trinity test lights the New Mexico desert in July 1945 — the traveler stands at the observation point; the flash brighter than the sun, and the scientists' cheer going quiet."
    status: "published"
    sha256: "22d8dd31d03c5feeb1b94bc4d0ac7ddf481318780501747bd5b71b089174dd9f"
  - number: "3590"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Potsdam"
    date: "1945 CE"
    region: "Germany"
    poem: |
      The victors met at Potsdam in 1945 —
      And the alliance started to crack.
      I was in the Cecilienhof Palace, the new faces,
      Truman, Attlee, Stalin — the wartime trio, changed.
      The bomb was mentioned; Stalin already knew.
      Germany's fate was sealed; the Cold War's was drafted.
      Potsdam: the last summit of the alliance.
      The victors divided the spoils — and the world.
      The crack became the Iron Curtain.
    description: "The victors meet at Potsdam in 1945 — the traveler is in the Cecilienhof Palace as the alliance cracks; the crack becomes the Iron Curtain."
    status: "published"
    sha256: "5e29cef4e61ca0d814c45cd63a4cba79c1d1e243cf8547b445d43586f7e6e742"
  - number: "3591"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "Victory over Japan"
    date: "1945 CE"
    region: "Pacific"
    poem: |
      Japan surrendered in August 1945 —
      The world war was over.
      I was in Tokyo Bay for the signing, the Missouri,
      The two bombs, the Soviet invasion — the end.
      Six years, 70 million dead, the world remade.
      VJ Day: the celebrations, the kisses, the relief.
      The emperor spoke — the first time his people heard his voice.
      Victory over Japan: the war's end, the atomic age's beginning.
      The silence after was the loudest sound.
    description: "Japan surrenders in August 1945 — the traveler is in Tokyo Bay for the signing on the Missouri; 70 million dead, and the silence after was the loudest sound."
    status: "published"
    sha256: "4cba0bffe61a969df3c1585bd1f781b2933bffd25a2fee0bd4aa371f0e9e5e2e"
  - number: "3592"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Trial of the Century"
    date: "1945 CE"
    region: "Germany"
    poem: |
      The Nuremberg trials opened in 1945 —
      The architects of atrocity faced judgment.
      I sat in that courtroom, the dock,
      Goering, Hess, the films of the camps.
      Jackson's opening: the first international war-crimes trial.
      "Crimes against humanity" — the law, invented for the occasion.
      Twelve hanged; the precedent lived.
      The Trial of the Century: justice, imperfect, necessary.
      The world said: never again — and meant it, this time.
    description: "The Nuremberg trials open in 1945 — the traveler sits in the courtroom as \"crimes against humanity\" is invented for the occasion; justice, imperfect, necessary."
    status: "published"
    sha256: "a0b3cd3ee9d34171484b5fc08ffade27587c8a1a84ae933a12d5039403756390"
  - number: "3593"
    volume: 5
    era_code: "12"
    era: "The Wars"
    title: "The Electronic Brain"
    date: "1945 CE"
    region: "Pennsylvania, USA"
    poem: |
      ENIAC, the first general-purpose electronic computer, was switched on in 1945 —
      The digital age stirred.
      I stood in the Moore School, the room of vacuum tubes,
      18,000 of them, the heat, the hum.
      It computed artillery tables — the war's last calculator.
      Then the war ended, and the machine remained.
      The Electronic Brain: thirty tons, and the future.
      Every computer since descends from that Philadelphia room.
      The digital age stirred. It hasn't slept since.
    description: "ENIAC is switched on in 1945 — the first general-purpose electronic computer, and the traveler stands among its 18,000 vacuum tubes; the digital age hasn't slept since."
    status: "published"
    sha256: "dfe922cff71845d08ad9b11967ac149baa1c6ce06f2cfaf274427fc32c21bb50"
