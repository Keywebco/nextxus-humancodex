# Living Library, Vol. II: Bronze and Iron
# Entries 0594 to 1393. Free to download, print and share, forever.
# Source of truth for the text: the HumanCodex Verse volumes. Each entry carries a SHA-256 of its poem text so any change can be detected.
entries:
  - number: "0594"
    volume: 2
    title: "The Chariot Is Born"
    date: "c. 2000 BCE"
    region: "Steppe"
    poem: |
      I stood on grass that never ended
      and watched a wheelwright bend ash into a circle,
      four spokes, no more — light as a hawk's bone.
      He lashed it to a cart built for speed, not load,
      hitched two horses that hated standing still,
      and the thing flew.
      It flew.
      I have walked a hundred battlefields since,
      but nothing I ever saw moved men the way that cart did.
      That day, the horseman stopped being a rider
      and became a storm with wheels.
      I stood on grass that never ended,
      and I watched war learn to run.
    description: "On the open steppe I watched a wheelwright build the first light war chariot — four spoked wheels, two fast horses — and felt the instant warfare changed forever."
    status: "first draft"
    sha256: "be8a97b1753663f7a66998c630de91a4238cc3e5918993aa540a507aa9e3f86d"
  - number: "0595"
    volume: 2
    title: "The Copper of Magan"
    date: "c. 2000 BCE"
    region: "Oman"
    poem: |
      In the Hajar mountains the smoke never stopped.
      Men broke the black rock with stone hammers,
      fed the furnaces with charcoal and prayer,
      and the copper ran out like slow honey.
      I watched them pour it into rough cakes,
      load it onto boats at the edge of the Gulf,
      and sail north — to feed the hunger of kings
      who had tin and war and no metal of their own.
      Every sword in Babylon had a grandfather
      who swung a hammer in those mountains.
      I stood in the smoke and watched bronze
      being born one furnace at a time.
    description: "In Oman's Hajar mountains I watched miners smelt copper and load it onto Gulf boats bound for Mesopotamia — the raw metal behind every Bronze Age army."
    status: "first draft"
    sha256: "8e5936b23739cca85c9b6c39448dbdb8d3ba8d8dde95f00d059c6d89baef183f"
  - number: "0596"
    volume: 2
    title: "The Shipwrecked Sailor's Tale"
    date: "c. 1995 BCE"
    region: "Egypt"
    poem: |
      Listen — a scribe told me, and he swore he wrote it true —
      a sailor lost at sea washed up on an island of riches,
      and there met a serpent, gold-scaled, thirty cubits long,
      who wept when he heard of the sailor's shipwreck
      and said: fear nothing, man, for the gods made this island for you.
      I have heard a thousand tales in a thousand ports,
      but this was the first one they bothered to write down.
      A man, a monster, and mercy.
      Everything since — every voyage story you ever loved —
      sails in the wake of that little boat.
    description: "An Egyptian scribe wrote of a castaway sailor befriended by a weeping golden serpent — the first adventure story ever put into writing, and the ancestor of them all."
    status: "first draft"
    sha256: "96a05c75bc378d4e959b0645fca206b1243fa4f3126a8a5044598fd9a4aa2290"
  - number: "0597"
    volume: 2
    title: "The Laws of Eshnunna"
    date: "c. 1990 BCE"
    region: "Mesopotamia"
    poem: |
      The king had them set up where everyone could see —
      not hidden in a temple, not whispered by priests,
      but out in the open, in plain words:
      this is the price of a goring ox,
      this is the price of a broken nose,
      this is what happens to the man who steals another man's bride.
      I ran my hand along the stone and felt something new in the world:
      the law, standing still, refusing to move with a judge's mood.
      Justice you could read.
      Justice you could point at.
      The first time power wrote itself down and said — here, hold me to it.
    description: "I read the posted laws of Eshnunna — prices set for a goring ox, a broken nose, a stolen bride — the first time a king nailed justice to stone where everyone could see it."
    status: "first draft"
    sha256: "5461e0f28e624a8ad531fab4a371dfe0c257c2046de5867b2ed2d5041444c6eb"
  - number: "0598"
    volume: 2
    title: "The Painted Cliffs of Beni Hasan"
    date: "c. 1985 BCE"
    region: "Egypt"
    poem: |
      They carved their tombs into the desert cliffs
      and painted everything they wanted to keep:
      wrestlers locked arm to arm,
      dancers mid-twirl,
      long lines of donkeys plodding in with goods from the south.
      I stood in the cool rock-shadow and watched a dead lord's
      whole world laid out in color — his hunts, his feasts,
      his tax collectors counting grain.
      He was not decorating a grave.
      He was packing for the road ahead,
      and the paint has not faded in four thousand years.
    description: "Inside cliff tombs at Beni Hasan I saw desert lords' lives painted in full color — wrestlers, dancers, donkey caravans — a whole world packed into rock for the journey after death."
    status: "first draft"
    sha256: "1acc7abf51f942d997c6a03c917dfbbcb386dcfa0e18785c7df5e172b414af54"
  - number: "0599"
    volume: 2
    title: "The Donkey Caravans of Ashur"
    date: "c. 1980 BCE"
    region: "Anatolia"
    poem: |
      A thousand miles. By donkey.
      I walked beside the trains and counted the bells:
      black donkeys, gray donkeys, loaded with tin from the east
      and bolts of bright cloth, plodding month after month
      through mountain passes where the snow never melts.
      At the other end, in Anatolian trading posts,
      they unloaded for silver — good silver, weighed true —
      and the merchants' wives back in Ashur
      ran the whole business by letter while the men were gone.
      The first long-distance traders I ever met
      did it all on the back of a stubborn animal
      and the trust of a wife a thousand miles away.
    description: "I walked beside Assyrian donkey caravans crossing a thousand miles of mountains, tin and cloth for silver — the first great long-distance trade, run on trust and letters home."
    status: "first draft"
    sha256: "ac007bf47dcfedcb0abe7cd001062a281fefc4613747ba3745e509a70646639b"
  - number: "0600"
    volume: 2
    title: "Senusret's White Chapel"
    date: "c. 1975 BCE"
    region: "Egypt"
    poem: |
      At Karnak the king raised a chapel of white limestone,
      small enough to hold in your eye all at once,
      every line in perfect proportion —
      the kind of building that makes you stop walking
      and stand still without knowing why.
      It was a jewel box, the priests said,
      where the gods rode out in procession
      and came home again.
      I was there when the doors opened for a festival,
      and the sunlight hit that white stone,
      and for a moment the whole Nile valley
      looked like it had been built for that single morning.
    description: "At Karnak I saw Senusret's white limestone chapel — a small perfect jewel of a temple where the gods rode out in procession, gleaming in festival sunlight."
    status: "first draft"
    sha256: "a6c72d3ca30c4f52f0678fc0fad7dc83afb82d0c0e87e7fe675d7bb9ba8d235a"
  - number: "0601"
    volume: 2
    title: "The Laws of Lipit-Ishtar"
    date: "c. 1970 BCE"
    region: "Mesopotamia"
    poem: |
      The king of Isin wrote his laws in Sumerian,
      on clay, in a hand I could still read four thousand years on.
      And buried in the middle of the fines and prices
      there was one line that stopped me cold:
      if a slave woman marries a free man,
      she goes free — and her children with her.
      Mercy, set in clay.
      Not a story, not a prayer — a law.
      I have read the great law codes of a hundred kingdoms since,
      and I still remember where I was standing
      when I read that one.
    description: "On a clay tablet in Isin I read the king's law setting a slave woman free when she marries a free man — mercy written into law, four thousand years ago."
    status: "first draft"
    sha256: "f85f0a633463e1473981faa67e3889fa40a25204412cb1a9c00e57aeb2d6490b"
  - number: "0602"
    volume: 2
    title: "The Oasis Cities of the Oxus"
    date: "c. 1965 BCE"
    region: "Central Asia"
    poem: |
      In the middle of burning desert, water.
      Walled towns ringed around green canals,
      and in the markets I saw lapis from the mountains,
      gold worked by hands that never saw the sea,
      seals carved with beasts no one could name.
      Three worlds met in those bazaars —
      the steppe, the Indus, the lands of the west —
      and none of them knew the others existed
      except here, in the shade of the oasis walls,
      where a merchant from Bactria could sell to a stranger
      from a country he would never see.
      I drank their wine and watched the deals.
      The desert was the road. The oasis was the world.
    description: "In Bactria's desert I walked walled oasis towns where lapis, gold, and carved seals changed hands between three worlds that met nowhere else on earth."
    status: "first draft"
    sha256: "3783fc8a80a1e713e8ff083e486c573439f7468b14f43fd591d05e233f87a00d"
  - number: "0603"
    volume: 2
    title: "The Story of Sinuhe"
    date: "c. 1960 BCE"
    region: "Egypt"
    poem: |
      A courtier heard that the old king was murdered
      and ran — out of Egypt, across the desert,
      into the Levant, where he lived half a lifetime,
      married, raised children, grew old among strangers,
      always dreaming of the Nile.
      At the end the new king wrote to him:
      come home. And he came.
      I heard the tale told by firelight
      by a man who swore Sinuhe was his grandfather's friend,
      and I believed him — because the story rings true
      the way only true stories do.
      Exile. Longing. Forgiveness.
      The first great novel, and it was about going home.
    description: "By firelight I heard the tale of Sinuhe, the courtier who fled Egypt and lived half a lifetime in exile before the king called him home — the first great novel, about longing and forgiveness."
    status: "first draft"
    sha256: "1be1aa4828f826b0de8c42437d7795ed9f02ddc2344e7d8f319c2a659e8cabb5"
  - number: "0604"
    volume: 2
    title: "The Bowmen of Kush"
    date: "c. 1955 BCE"
    region: "Nubia"
    poem: |
      The finest bowmen alive, and they knew it.
      Nubian archers, dark as polished wood,
      drawing bows taller than a man,
      their arrows flying flat and true
      further than any Egyptian could shoot.
      They marched in pharaoh's armies as mercenaries and allies,
      and back down the river flowed Kushite gold and ebony —
      the price of the best shots in the world.
      I watched them practice at dawn on the riverbank,
      a hundred bows rising like one,
      and I understood something about power:
      sometimes the strongest arm in the empire
      is the one you have to hire.
    description: "At dawn on the Nile I watched Nubian archers drill — the finest bowmen alive — marching in Egyptian armies while Kushite gold flowed north in exchange."
    status: "first draft"
    sha256: "7292dc825646ce825cdacfd4c166c245692eed1475a7a77c2130bda8ed056dc0"
  - number: "0605"
    volume: 2
    title: "The Island of Dilmun"
    date: "c. 1950 BCE"
    region: "Bahrain"
    poem: |
      Sweet water in the middle of a salt sea —
      that is what made Dilmun rich.
      On that low island, merchants from three worlds
      weighed their goods in the shade:
      copper cakes from Magan, pearls from the Gulf shallows,
      ivory and carnelian from Meluhha,
      and Babylonian merchants with silver to spend.
      I stood on the quay and listened to four languages
      haggling over the same scale.
      No palaces, no great king — just water, docks, and honest weights.
      The crossroads of the Bronze Age world
      was an island that sold nothing but its position
      and its sweet, sweet water.
    description: "On Bahrain's sweet-water island I watched merchants from Magan, Meluhha, and Babylon weigh copper, pearls, and ivory — the quiet crossroads of the Bronze Age world."
    status: "first draft"
    sha256: "e22d2f804d12cd6dc3a2d28299d1334a8ee59511c8bc004fe6652bddc5c8f3c8"
  - number: "0606"
    volume: 2
    title: "Amber for the Chieftains"
    date: "c. 1945 BCE"
    region: "Europe"
    poem: |
      It washed up on Baltic shores after storms —
      gold that floated, the northerners called it,
      tears of the sun, hard as stone, warm to the touch.
      And it traveled south, hand to hand,
      through the lands of the chieftains,
      down to the Mediterranean,
      where kings who had everything
      had nothing like it.
      I held a lump of it to the light
      and saw a fly trapped inside, forty million years dead.
      Northern gold for southern bronze —
      the first luxury trade I ever traced,
      and it ran on nothing but beauty
      and the long road between the sea and the sun.
    description: "I held Baltic amber to the light — a fly trapped inside, older than mankind — and traced its long road south through chieftains' lands to Mediterranean kings."
    status: "first draft"
    sha256: "3b8d4d43c85fe99cc035ddacdb5fafbf8675d877a4cca890d613170b286e5ed7"
  - number: "0607"
    volume: 2
    title: "The Faiyum Reclamation"
    date: "c. 1940 BCE"
    region: "Egypt"
    poem: |
      Senusret's engineers looked at a swamp and saw a breadbasket.
      They cut canals, raised dikes, drained the great marsh of the Faiyum —
      and where crocodiles had ruled, wheat grew shoulder-high.
      I walked the new fields at harvest time,
      dust on my sandals, the air thick with chaff,
      and new towns ringing the reclaimed land,
      their granaries already filling.
      It was the largest earth-moving work I had seen in my life,
      done without a single machine —
      just men, baskets, and a king's order
      that the desert would feed his people.
      And it did.
    description: "I walked the Faiyum's new wheat fields at harvest — a whole marsh drained by canal and dike into Egypt's breadbasket, the largest earthworks I had ever seen."
    status: "first draft"
    sha256: "a972f863d0bbf2dcd6f4d1db4d1fff859ace80078882a9ae5801533f3da9b667"
  - number: "0608"
    volume: 2
    title: "The Rivers Shift"
    date: "c. 1935 BCE"
    region: "Indus Valley"
    poem: |
      The Ghaggar dwindled.
      Year by year the river shrank,
      the wells went bitter,
      and the great cities of the Indus began to empty —
      not in panic, not in war,
      but the slow way: a family at a time,
      packing their seals and their gods,
      drifting east toward rivers that still ran.
      I stood in a street in one of those cities
      and heard my own footsteps echo.
      No invader did this. No army.
      Just water, leaving.
      The mightiest cities I had ever seen,
      undone by a river changing its mind.
    description: "I stood in an emptying Indus street and heard my footsteps echo — no invader, no war, just the Ghaggar river dwindling year by year until the great cities had to drift away."
    status: "first draft"
    sha256: "fbc5664218d43e4561e0ea8f14e21df2852bf0dd9cf13b7e271703024c9d2e29"
  - number: "0609"
    volume: 2
    title: "Byblos, Port of Cedar"
    date: "c. 1930 BCE"
    region: "Levant"
    poem: |
      The smell of cedar hung over the harbor like incense.
      Great trunks from the Lebanon mountains,
      floated down to Byblos, loaded onto Egyptian ships,
      sailing south to become temple roofs and warship keels —
      the timber that held up pharaohs.
      I watched the stevedores roll a log
      that took twenty men to move,
      and the captain told me: this one tree
      will outlast the man who ordered it,
      the men who cut it, and the ship that carries it.
      He was right.
      The cedar of Byblos built an empire's skyline,
      and some of those beams are still holding roofs up.
    description: "In Byblos harbor I watched cedar trunks from the Lebanon mountains loaded for Egypt — the timber that roofed pharaohs' temples and keeled their fleets."
    status: "first draft"
    sha256: "c42353376cc64d0f3fa8a08cf2c181140ad031e6225ab5d2b979bcd4cd699ede"
  - number: "0610"
    volume: 2
    title: "The Forts of the Second Cataract"
    date: "c. 1925 BCE"
    region: "Egypt"
    poem: |
      Eight fortresses above the rapids,
      mud-brick walls thick as a house is wide,
      bristling with archers, stocked for siege,
      guarding the Nile's throat where the gold road came down.
      I climbed the rampart of one at sunset
      and looked south into Kush — wild water, black rock,
      and beyond it the gold of Wawat that built Thebes's temples.
      The Egyptians called them the fortresses of the cataract.
      I called them a fist, held shut around the river —
      the first border wall I ever walked,
      built to keep the wealth flowing one way
      and the warriors the other.
    description: "I climbed a mud-brick fortress above the Nile's second cataract at sunset — one of eight bristling with archers, guarding Egypt's road to Nubian gold."
    status: "first draft"
    sha256: "fd2941fb117c8a6fe87b31ab62f6a8babd9a10fac58481cdfa95a5e2fdaf8379"
  - number: "0611"
    volume: 2
    title: "The Bronze Foundries of Erlitou"
    date: "c. 1920 BCE"
    region: "China"
    poem: |
      On the Yellow River plain, a city of palaces
      that no history book had yet named.
      And in its workshops, the foundries —
      I stood close enough to feel the heat on my face
      as they poured molten bronze into clay molds:
      wine cups, tripods, vessels for the ancestors,
      cast for kings not yet called Shang.
      The piece-mold technique was like nothing I had seen —
      no hammering, no beating, just perfect casting,
      sharp as a thought.
      China's bronze age began here,
      in smoke and fire and ritual wine,
      and it would outlast every kingdom
      that ever touched it.
    description: "At Erlitou I felt the foundry heat on my face as craftsmen poured bronze into piece-molds — ritual wine vessels for China's first palace kings, cast with a technique the world had never seen."
    status: "first draft"
    sha256: "97966056686a66aed080c5c9cf8511996850317489d7636f4f8803a51f358cca"
  - number: "0612"
    volume: 2
    title: "The Wandering Smiths"
    date: "c. 1915 BCE"
    region: "Siberia"
    poem: |
      They never stayed anywhere.
      The Seima-Turbino smiths walked thousands of miles
      across the top of Asia —
      tin-bronze in their packs, molds in their bundles,
      setting up a forge in a new valley,
      teaching strangers the fire,
      then moving on.
      I met them on a riverbank in Siberia,
      hammering out spearheads with curved blades
      I had never seen before,
      and a week later they were gone,
      leaving behind a village that now knew bronze.
      They seeded new metal across half a continent
      the way wind seeds grass.
      No empire. No king. Just wandering hands
      and the knowledge of the forge.
    description: "I met wandering Siberian smiths on a riverbank, hammering strange curved blades — then they were gone, leaving bronze behind them, seeding metal across half of Asia like wind seeds grass."
    status: "first draft"
    sha256: "6a2823b1e2611ff15d769660b64d94208cf1dc3d9621d80c5db5054ed5df16d7"
  - number: "0613"
    volume: 2
    title: "The Blue Hippopotamus"
    date: "c. 1910 BCE"
    region: "Egypt"
    poem: |
      The most dangerous animal in the Nile
      is not the crocodile. It is the hippo —
      three tons of bad temper that can bite a boat in half.
      So the faience makers glazed one bright blue,
      painted river plants across its back,
      and set it in tombs as a charm:
      tame the beast by making it beautiful.
      I held one in my hands — it fit in my palm,
      cool and bright as a piece of the river itself.
      Four thousand years old, and the blue has not faded.
      Whoever made it knew something deep:
      you do not defeat the thing you fear.
      You turn it into something you can love.
    description: "I held a bright-blue glazed hippo, river plants painted on its back — a tomb charm against the Nile's deadliest animal, and proof that you tame fear by making it beautiful."
    status: "first draft"
    sha256: "e50f633c8f147d0e2eef8f1d6243d6558f1b2e966c4e7dc9b829675f15509c6e"
  - number: "0614"
    volume: 2
    title: "The Workers' Town of Kahun"
    date: "c. 1905 BCE"
    region: "Egypt"
    poem: |
      Beside the new pyramid, a town on a grid —
      streets laid out with a surveyor's line,
      bakeries, granaries, houses in rows,
      all of it built for the men building the tomb.
      The first company town I ever walked.
      I ate bread from one of those bakeries,
      still warm, and talked to a mason
      who had carved stone for twenty years
      and never once been inside the pyramid
      he was helping to raise.
      He did not mind. The bread was good,
      the beer was regular, and his children
      were learning to read.
      An empire, I thought, is built
      one lunch at a time.
    description: "I ate warm bread in Kahun — Egypt's first planned workers' town, grid streets and bakeries beside a new pyramid — and learned an empire is built one lunch at a time."
    status: "first draft"
    sha256: "ec625b4f905a08c326d6d6554f113fe61025c0547da477266703937f66b2ffb0"
  - number: "0615"
    volume: 2
    title: "The First Chocolate"
    date: "c. 1900 BCE"
    region: "Mesoamerica"
    poem: |
      On the Pacific coast, the Mokaya
      picked the pods from the cacao tree,
      fermented the beans, ground them,
      and whipped them into a bitter froth —
      the first chocolate on earth.
      It was not sweet. It was not dessert.
      It was a sharp, foaming drink,
      two thousand years before the Maya
      would make it famous.
      I drank from a gourd bowl and felt the bitterness
      hit the back of my tongue like a small alarm.
      They laughed at my face.
      Somewhere in that laughter was the seed
      of every chocolate shop that would ever exist.
      It started here: bitter, frothy, and perfect.
    description: "On Mexico's Pacific coast I drank the first chocolate — a bitter frothy cacao brew from a gourd bowl, two thousand years before the Maya, while the Mokaya laughed at my face."
    status: "first draft"
    sha256: "51d0ae01272451f66dd9818c12f3b3eed481afd0eb38282053ac7c2f167cc93b"
  - number: "0616"
    volume: 2
    title: "The Eloquent Peasant"
    date: "c. 1895 BCE"
    region: "Egypt"
    poem: |
      A farmer was robbed on the road —
      his donkeys, his goods, everything.
      And instead of a knife, he picked up words.
      Nine speeches he made before the high steward,
      each one finer than the last:
      on justice, on mercy, on what a ruler owes the ruled —
      and the steward kept delaying his answer
      just to hear him speak again.
      I read the papyrus, and I tell you plainly:
      this is literature pretending to be a lawsuit,
      or a lawsuit pretending to be literature.
      Either way, a robbed peasant out-argued the state
      with nothing but his tongue —
      and they wrote it down because it was too good to lose.
    description: "I read the nine speeches of a robbed Egyptian farmer arguing his case before the high steward — a peasant out-arguing the state with words alone, too fine to lose."
    status: "first draft"
    sha256: "44a9176f4570fe5f365c45065caf0789752580d45f738845b5364c6dcc91e0e3"
  - number: "0617"
    volume: 2
    title: "The Lapis Road"
    date: "c. 1890 BCE"
    region: "Afghanistan"
    poem: |
      Blue as a deep lake at dusk.
      The lapis came from one place on earth —
      the mines of Badakhshan, high in the Afghan mountains —
      and traveled through a dozen hands to get anywhere:
      down the passes, across the deserts,
      through the bazaars of a dozen cities,
      until it reached the workshops of Ur and Egypt.
      I held a rough lump of it at the mine head,
      flecked with gold-colored pyrite like stars.
      By the time it reached a pharaoh's tomb
      it would be worth more than its weight in silver.
      One mountain. A dozen middlemen. Three thousand miles.
      The longest luxury road in the world,
      and it carried nothing but the color blue.
    description: "At the Badakhshan mine head I held rough lapis flecked with gold like stars — the start of a three-thousand-mile road through a dozen hands to the workshops of Ur and Egypt."
    status: "first draft"
    sha256: "b2e584b760615aed1c0c25dcb1190f0fe103ccc1e77257695d647b89694b500d"
  - number: "0618"
    volume: 2
    title: "The Labyrinth of Hawara"
    date: "c. 1885 BCE"
    region: "Egypt"
    poem: |
      Amenemhat's temple at Hawara —
      court after roofed court after pillared hall,
      so many rooms that the Greeks, when they saw it,
      called it the Labyrinth and swore no man could find his way out.
      I tried. I got lost twice in an hour.
      Every turn opened onto another colonnade,
      another stair, another shadowed doorway.
      It was not built to confuse.
      It was built to impress — to make a visitor feel
      the weight of a kingdom that could afford
      to build rooms nobody would ever use.
      Standing in the center of it, lost,
      I felt very small, and the king
      exactly as big as he intended.
    description: "I got lost twice in an hour inside Amenemhat's temple at Hawara — court after pillared court — the maze the Greeks would call the Labyrinth, built to make a king feel enormous."
    status: "first draft"
    sha256: "ebdd299c13540949570c2dbe8bf944e18a2e385adf6a179d326d573db08de51a"
  - number: "0619"
    volume: 2
    title: "The Prince of Leubingen"
    date: "c. 1875 BCE"
    region: "Europe"
    poem: |
      Under a great mound in the northern forests,
      they buried a chieftain with everything he owned:
      gold ornaments, bronze axes, tools of polished stone —
      the wealth of a world without writing,
      without cities, without kings who wrote their names.
      I stood on that mound at dawn, the mist in the trees,
      and thought about what power looked like
      before anyone carved it on a wall.
      It looked like this: a hill of earth,
      raised by a thousand hands,
      over one man with gold in his grave.
      The Bronze Age north, showing its strength
      the only way it knew how — by piling earth to the sky.
    description: "At dawn I stood on the great burial mound at Leubingen — a northern chieftain under heaped earth with gold and bronze, power expressed the only way his world knew how."
    status: "first draft"
    sha256: "439e1ea86a1fd0a9b3982bfd7e43086fc9842133ef14cfda7c5efa8eac767d57"
  - number: "0620"
    volume: 2
    title: "The Kahun Doctor's Notes"
    date: "c. 1875 BCE"
    region: "Egypt"
    poem: |
      On papyrus, in a careful hand:
      how to help a woman in childbirth,
      how to treat cattle plague,
      remedies listed one after another —
      the oldest medical handbook in the world.
      I read it sitting in the shade of the workers' town,
      and what struck me was not the medicine —
      half of it would not work —
      but the impulse: write it down,
      so the next doctor does not start from nothing.
      A physician I will never know,
      writing for a colleague he would never meet,
      four thousand years before I read his notes.
      That is what medicine is.
      That is what it always was:
      one healer leaving a lamp lit for the next.
    description: "In the shade at Kahun I read the oldest medical handbook in the world — childbirth, cattle plague, remedy after remedy — one unknown doctor leaving a lamp lit for the next."
    status: "first draft"
    sha256: "42e117c13807561399735a52d91d0380ac526824880e15ea3db7396d21391122"
  - number: "0621"
    volume: 2
    title: "The Palace of Mari"
    date: "c. 1870 BCE"
    region: "Mesopotamia"
    poem: |
      On the Euphrates, a palace painted in fresco —
      courtyards, audience halls, a throne room
      where the walls themselves told stories in color.
      And underneath it all, twenty thousand clay tablets:
      letters from diplomats, warnings from prophets,
      reports from spies — the whole gossip of the age,
      baked into wedge-shaped script.
      I walked those halls and read those letters,
      and Mari came alive around me:
      kings writing to kings, wives writing to husbands,
      a prophet warning the king that the gods were angry
      about something or other, as prophets do.
      An empire's mailroom, four thousand years old —
      and every bit as anxious as any office
      I have ever walked through since.
    description: "I walked Mari's frescoed palace and read its twenty thousand clay tablets — diplomats, prophets, spies, all writing home — an empire's mailroom, anxious as any office since."
    status: "first draft"
    sha256: "23ccbef32eb4deff69eeabfccaf94e5177086d1a29492955f98d3308a8198607"
  - number: "0622"
    volume: 2
    title: "The Curse Bowls"
    date: "c. 1865 BCE"
    region: "Egypt"
    poem: |
      The scribes wrote the names on clay bowls —
      enemy kings, rebellious princes, whole troublesome towns —
      every name Egypt wanted gone from the earth.
      Then they smashed the bowls to pieces.
      I watched the ceremony once, from the back of the courtyard:
      the reading of the names, the lifting of the bowls,
      the deliberate, satisfying crash of pottery on stone.
      It was magic, yes — but it was also politics.
      A list of everyone the kingdom feared,
      published in the act of destroying it.
      Somewhere in those shards were names
      that history forgot completely —
      cursed so thoroughly that nothing of them survived
      except the curse itself.
    description: "I watched Egyptian scribes write enemies' names on clay bowls and smash them — curse as politics, a published list of everyone the kingdom feared, destroyed in the reading."
    status: "first draft"
    sha256: "d3c19db27199f9ff84fe0f9eb0dd8204b1be35ed7e1b8c2022f3a5ed00294769"
  - number: "0623"
    volume: 2
    title: "Shamshi-Adad Takes Ashur"
    date: "c. 1860 BCE"
    region: "Mesopotamia"
    poem: |
      He came down from the hills, an Amorite warlord
      with a hard eye and a harder army,
      and he took Ashur — the old merchant city —
      and made it the seat of something new:
      the first great empire of the upper land.
      I saw him hold court in a cedar palace,
      dispatching orders to sons he had set up as kings
      in cities he had conquered for them —
      a family business built on spears.
      It did not outlast him. They never do, the first ones.
      But every empire of the north that came after —
      Assyria, all of it — walked through the door
      Shamshi-Adad kicked open.
    description: "I watched the Amorite warlord Shamshi-Adad take Ashur and build the north's first great empire from a cedar palace — the door every later Assyrian empire would walk through."
    status: "first draft"
    sha256: "22849b90a9b35e7fae9b754b03a1b87b4e4bdf3b9ee04fcb6b27add6d14f65c8"
  - number: "0624"
    volume: 2
    title: "The Kingdom of Yamhad"
    date: "c. 1855 BCE"
    region: "Syria"
    poem: |
      Aleppo, on its citadel hill, looking down on Syria —
      the great power of the age between the rivers and the sea.
      On top of the citadel stood the storm-god's temple,
      and below it the markets roared:
      traders, chariots, donkey trains from every direction.
      I climbed the citadel at dusk and watched the caravans
      come in through the gates like blood through veins.
      Yamhad did not rule by terror. It ruled by position —
      every road worth traveling passed through Aleppo.
      The storm-god watched over it all, thunder in his hands.
      But the real power was simpler than thunder:
      whoever held that hill held the trade of three continents.
    description: "I climbed Aleppo's citadel at dusk and watched caravans stream through the gates — Yamhad's power was position, the storm-god's temple crowning the crossroads of three continents."
    status: "first draft"
    sha256: "3a3b3c96acf19f0ddc6f138842a60eb1090542c8e290a8fd4677612410f08008"
  - number: "0625"
    volume: 2
    title: "The Stone Towers Rise"
    date: "c. 1850 BCE"
    region: "Sardinia"
    poem: |
      On Sardinia they began stacking stone —
      tower after tower, the nuraghi,
      built without mortar, stone on stone,
      rising over the hills like stone fists.
      I watched a crew raise one, passing rocks hand to hand
      up a ramp of earth, fitting each one by eye.
      No king ordered it. No empire paid for it.
      Just villages, building towers that would watch
      over the island for a thousand years.
      Some were homes. Some were forts.
      Some, I think, were just pride —
      the human need to put something tall
      where everyone can see it,
      and say: we were here.
    description: "I watched Sardinians raise a nuraghe stone by stone, no mortar, no king's order — towers that would watch the island for a thousand years, built out of pride and the need to say we were here."
    status: "first draft"
    sha256: "8ff43d94ffecb6b59d0af035838eee2bd1aa20e1d766ab6828160e5563928632"
  - number: "0626"
    volume: 2
    title: "The Granaries of the Faiyum"
    date: "c. 1845 BCE"
    region: "Egypt"
    poem: |
      The reclaimed marshland paid off in grain —
      emmer wheat pouring into the royal storehouses,
      heap after golden heap, enough bread for a kingdom,
      enough beer for its builders.
      I stood in a granary at harvest's end,
      the air sweet with chaff, the scribes counting
      in their quick wedge-marks how many loaves
      each heap would become.
      This is what the drainage ditches were for.
      This is what the engineers' canals were for.
      Not glory. Not monuments.
      Bread. Beer. Full bellies.
      The whole shining apparatus of the state,
      aimed at the simplest target there is:
      nobody goes hungry.
    description: "I stood in a Faiyum granary breathing sweet chaff-dust as scribes counted the harvest — the whole shining state aimed at one target: bread for the kingdom, beer for its builders."
    status: "first draft"
    sha256: "e6edbc1bb122ca72d2aa30f87f76c70e5b0913e3c167a0748735fdd1e9839b42"
  - number: "0627"
    volume: 2
    title: "Rim-Sin of Larsa"
    date: "c. 1840 BCE"
    region: "Mesopotamia"
    poem: |
      Sixty years on the throne of Larsa —
      Rim-Sin dug canals, raised temples,
      and named each year for a victory,
      the way kings do when they want
      the calendar itself to flatter them.
      I saw him once, an old man by then,
      reviewing troops with the slow confidence
      of someone who had outlasted every rival.
      He ruled the Sumerian south longer
      than most men live.
      And when Babylon finally took his city,
      the scribes wrote it down without malice:
      he had his sixty years.
      Few kings get even twenty.
    description: "I saw old Rim-Sin of Larsa reviewing troops — sixty years on the throne, canals dug, years named for victories — outlasting every rival until Babylon finally took his city."
    status: "first draft"
    sha256: "632fe50eba7026f2abc8caf941043f32da0abee9910e91fbadb2bca4a28c1d46"
  - number: "0628"
    volume: 2
    title: "The Miners' Secret Marks"
    date: "c. 1835 BCE"
    region: "Sinai"
    poem: |
      In the turquoise mines of Sinai,
      Semitic workers scratched picture-signs on the rock —
      a bull's head for A, a house for B,
      quick marks to note a name, a shift, a prayer.
      I ran my fingers over them in the mine's half-light.
      They did not know they were inventing anything.
      They were just miners, marking stone,
      borrowing the shapes of the world around them.
      But those scratches were the alphabet's first ancestor.
      Every letter you have ever read
      descends from a miner's doodle in a turquoise mine.
      I stood there a long time,
      looking at the beginning of writing
      hiding in a wall of rock.
    description: "In a Sinai turquoise mine I touched picture-signs scratched by Semitic miners — a bull's head, a house — the alphabet's first ancestor, hiding in a rock wall where no one knew what they'd made."
    status: "first draft"
    sha256: "dd077473d4e3f62b094250c3c3c484baba507ec505d36f344590d52036b9732e"
  - number: "0629"
    volume: 2
    title: "The Jade Carvers of Erlitou"
    date: "c. 1830 BCE"
    region: "China"
    poem: |
      They sawed jade with sand and water and time.
      No metal could cut it — bronze was too soft —
      so they worked it the slow way, for weeks,
      for months, until a ritual blade emerged,
      pale green and cold, harder than anything in the foundry.
      I watched a carver drill a hole with a bow-drill,
      the grit biting a fraction of a hair at a time,
      his whole body still except his arm.
      Stone that outshines bronze.
      The Yellow River kings wanted jade, not metal,
      for the rites that mattered —
      because bronze could be melted and remade,
      but jade was forever.
    description: "I watched an Erlitou carver drill jade with sand, water, and endless patience — stone harder than bronze, reserved for the rites that mattered because jade, unlike metal, is forever."
    status: "first draft"
    sha256: "35752878b7a5dfc2a2432f65f9706e629cf8489d077da07fb7dfd45ee3bd0480"
  - number: "0630"
    volume: 2
    title: "Reading the Sheep's Liver"
    date: "c. 1825 BCE"
    region: "Mesopotamia"
    poem: |
      They sacrificed a sheep and read its liver —
      every fold, every ridge, every dark spot
      a sentence about the future:
      will the king win, will the harvest hold,
      will the enemy march this spring?
      I stood beside a diviner in Babylon,
      his hands red to the wrist, his eyes
      moving over the glistening organ
      like a scholar over a tablet.
      Foolish? Perhaps. But I watched a king
      delay a whole campaign on a reading,
      and the campaign that followed failed
      exactly the way the liver said it wouldn't.
      They were wrong about the mechanism
      and right about something else:
      a kingdom that stops to ask the future
      before it acts is already wiser
      than one that never asks at all.
    description: "I stood beside a Babylonian diviner reading a sacrificed sheep's liver — every fold a sentence about the future — and saw a kingdom that at least stopped to ask before it acted."
    status: "first draft"
    sha256: "8a3c995f8c26566dc728d7b942fb4bd348024a7df7494328d2cc74f8b1dd0f25"
  - number: "0631"
    volume: 2
    title: "The Scribe Schools of Nippur"
    date: "c. 1820 BCE"
    region: "Mesopotamia"
    poem: |
      At dawn the boys filed in with their clay,
      sat cross-legged, and copied:
      proverbs, multiplication tables,
      the names of the gods, the shapes of the wedges —
      over and over, while the master walked the rows
      with a cane for the careless.
      I sat in the back and listened to thirty boys
      chanting numbers in Sumerian.
      Homework, four thousand years ago.
      The cane, four thousand years ago.
      The boy staring out the window, wishing he were anywhere else —
      four thousand years ago, exactly the same boy.
      School has not changed.
      Only the tablets got thinner.
    description: "I sat in a Nippur scribe school at dawn — boys chanting multiplication tables in Sumerian, homework and the cane — and found the exact same schoolboy staring out the window as today."
    status: "first draft"
    sha256: "f551c9f09a338d5bf9c13a1a69f40d35210b271db74c3b1c0b8b4bf45b6d9df1"
  - number: "0632"
    volume: 2
    title: "Sobekneferu, the First Queen"
    date: "c. 1800 BCE"
    region: "Egypt"
    poem: |
      A king's daughter looked at the empty throne
      and sat down in it — in her own name,
      not as regent, not as widow,
      but as pharaoh: the crook, the flail,
      the whole weight of Egypt on a woman's shoulders.
      I was in Thebes when they carved her name
      in a cartouche, the oval ring that meant king.
      The priests argued. The courtiers whispered.
      She ruled anyway.
      The first woman we know who held that throne,
      and she held it well enough that the kingdom
      did not fall apart around her.
      Four thousand years later they are still arguing
      about women and power.
      She settled it by simply doing the job.
    description: "I was in Thebes when Sobekneferu took the throne in her own name — crook, flail, cartouche — the first woman we know who ruled Egypt as pharaoh, and she held it."
    status: "first draft"
    sha256: "4858820151d23c4dedcaa81db7e1108f5101ee2beca7d9d198a2297de72a9eec"
  - number: "0633"
    volume: 2
    title: "Hammurabi's Canals"
    date: "c. 1795 BCE"
    region: "Mesopotamia"
    poem: |
      Before he was the lawgiver, he was the ditch-digger —
      or at least the king who ordered the ditches dug.
      The young Hammurabi dredged canals, raised dikes,
      measured the water's fall with the care of a jeweler.
      I walked a new embankment with the surveyors,
      the mud still wet under my sandals,
      and watched the first water run down it
      toward fields that had been dust a month before.
      Empires are not built on thrones.
      They are built on water, moving where you tell it to.
      Babylon's greatness began here —
      not in a battle, but in a canal,
      with a young king who understood
      that whoever feeds the people rules them.
    description: "I walked a new Babylonian embankment with the surveyors as the first water ran to dusty fields — young Hammurabi's canals, the waterworks that would feed an empire."
    status: "first draft"
    sha256: "1175b5f19fb4f9bf8a9fb39f91366692e22b932dd8b078e1fd25835e6ddd2c71"
  - number: "0634"
    volume: 2
    title: "Anitta, King of Kussara"
    date: "c. 1790 BCE"
    region: "Anatolia"
    poem: |
      He stormed Hattusa and burned it to the ground,
      then stood in the ashes and laid a curse on the place:
      let no man rebuild here, let the weeds take it,
      let the gods forget its name.
      I heard the words read from his own inscription,
      carved in a script borrowed from the south.
      A warlord's curse, set in stone,
      meant to last forever.
      It did not. Men rebuilt Hattusa within a generation,
      and the curse became the foundation story
      of the very people he tried to erase —
      the Hittites, who would remember Anitta
      as the beginning of their history.
      That is the thing about curses carved in stone:
      they preserve the curser longer than the cursed.
    description: "I read Anitta's curse on ruined Hattusa from his own inscription — meant to erase the city forever, it became instead the foundation story of the Hittites who rebuilt it."
    status: "first draft"
    sha256: "84f996e9ac5fd363b94d83797a0b0bb7029e5aea967a2a2e6b978e50584c0120"
  - number: "0635"
    volume: 2
    title: "Zimri-Lim's Prophets"
    date: "c. 1785 BCE"
    region: "Mesopotamia"
    poem: |
      At Mari, the messengers kept arriving with the same strange news:
      a man seized in the marketplace, shouting the god's words;
      a woman in a trance, delivering heaven's instructions
      for the king's next campaign.
      Heaven, lobbying the throne by letter.
      I read the reports in the palace archive —
      cool, bureaucratic summaries of divine frenzy,
      filed between grain receipts and troop rosters.
      The king took them seriously. Of course he did.
      When the gods send mail, a wise king reads it.
      But I noticed what the scribes noticed:
      the prophets' messages had a habit
      of agreeing with whatever the court
      already wanted to do.
    description: "In Mari's archive I read cool bureaucratic reports of prophets seized by divine frenzy — heaven lobbying the throne by letter, with messages that always seemed to agree with the court."
    status: "first draft"
    sha256: "be4bfd63fa661a429e08a627afb1bae3b7009fee479231ae149d92c2fbbb632f"
  - number: "0636"
    volume: 2
    title: "Knossos Rebuilt"
    date: "c. 1780 BCE"
    region: "Crete"
    poem: |
      The earthquake knocked it flat.
      So the Minoans built it grander:
      the grand staircase spiraling down like a nautilus shell,
      light wells pouring sun into the lower halls,
      running water — actual plumbing — in the queen's apartments.
      I walked the new corridors while the plaster was still drying,
      and the builders were proud in the particular way
      of men who have outdone their own fathers.
      Disaster had given them a blank tablet,
      and they wrote a palace on it.
      That is the Minoan way, I learned:
      when the earth shakes your house down,
      build a better one, with better stairs,
      and paint the walls brighter than before.
    description: "I walked Knossos's rebuilt corridors while the plaster dried — grand staircase, light wells, running water — the Minoan answer to an earthquake: build it grander and paint it brighter."
    status: "first draft"
    sha256: "364017a14ddd0615e09c32718c988c925c7a17d2125bdbbd9338587b5f2533a7"
  - number: "0637"
    volume: 2
    title: "Hammurabi Unifies the Land"
    date: "c. 1775 BCE"
    region: "Mesopotamia"
    poem: |
      Ten years of campaigns.
      City by city, king by king,
      Babylon's young ditch-digger turned general
      gathered Sumer and Akkad under one scepter —
      Larsa fell, Mari would fall,
      and the scribes began dating years
      by the victories of a single man.
      I watched his army march out one spring,
      not a horde but a machine:
      supply wagons, engineers, siege towers,
      all of it moving on the canals he had built
      twenty years before.
      The waterworks fed the soldiers.
      The soldiers took the cities.
      The cities paid for more canals.
      That is how you build an empire:
      dig first, fight later.
    description: "I watched Hammurabi's army march out on the canals he'd built as a young king — dig first, fight later — ten years of campaigns gathering Sumer and Akkad under one scepter."
    status: "first draft"
    sha256: "c1050336466d4cf74a86b03dcaebbb1366582ce7933065654fe9a3f3026065b9"
  - number: "0638"
    volume: 2
    title: "The Walls of Jericho"
    date: "c. 1770 BCE"
    region: "Levant"
    poem: |
      Around the sweet spring of Jericho,
      the Canaanites raised ramparts of packed earth —
      massive, sloping, high as a house —
      a fortress town in the Bronze Age hills,
      built to say: this water is ours.
      I climbed those walls at noon,
      the heat shimmering off the Jordan valley below,
      and looked down at the spring that made it all worth defending.
      Every age builds its walls around what it cannot live without.
      For Jericho it was water, sweet and constant,
      in a land where water is life and life is war.
      The walls would fall one day — walls always do —
      but the spring is still there.
      The water outlasts every wall ever built around it.
    description: "I climbed Jericho's massive earthen ramparts at noon and looked down at the sweet spring they guarded — walls fall, but the water outlasts every wall ever built around it."
    status: "first draft"
    sha256: "462d814660cc8aec260c57aacf666f0f8a1b5e28d5f4f96e302cde7bb9b893e6"
  - number: "0639"
    volume: 2
    title: "The Phaistos Disc"
    date: "c. 1765 BCE"
    region: "Crete"
    poem: |
      A disc of clay, stamped with picture-signs —
      a man running, a ship, a flower, a fist —
      pressed in with little seals, sign by sign,
      like the world's first printing press.
      And no one can read it.
      I held it — or rather, I stood over the case
      where the archaeologists would one day put it —
      and felt the particular ache of a message
      that survived its language.
      Someone took the trouble to stamp this,
      to press meaning into clay with care and skill.
      They meant it to be read.
      Four thousand years later, we are still trying.
      The strangest thing the Minoans left us
      is a letter with no address and no alphabet —
      and it still works, because it still makes us wonder.
    description: "I stood over the Phaistos Disc — clay stamped with picture-signs no one can read, the world's first printing — a letter with no alphabet that still makes us wonder."
    status: "first draft"
    sha256: "fd3c58ec6d1ef1621d344ca94cfd60340e5b3a2ac177910d8b79bea99f315f0a"
  - number: "0640"
    volume: 2
    title: "The King's Letters"
    date: "c. 1760 BCE"
    region: "Mesopotamia"
    poem: |
      Hammurabi's empire ran on mail.
      His officials wrote home about everything:
      grain prices up in Larsa, a runaway slave caught in Sippar,
      a tax man taking bribes and everyone knowing it.
      I read a bundle of them in the archive,
      and laughed out loud at one —
      an official complaining that his superior
      never answered his letters,
      four thousand years before the unread email.
      The clay was different. The complaints were the same.
      An empire is just a very large office,
      and every office runs on people writing things down
      and hoping someone at the other end
      is paying attention.
    description: "In the archive I read Hammurabi's officials writing home about grain prices, runaway slaves, and unanswered letters — an empire run by mail, with complaints four thousand years old and still familiar."
    status: "first draft"
    sha256: "1c2a2925105a0f9d1ef5dd58602ac983e1eaf1c70299d3e6a809a02c8f486e34"
  - number: "0641"
    volume: 2
    title: "The Hyksos Drift In"
    date: "c. 1755 BCE"
    region: "Egypt"
    poem: |
      They did not come as an army.
      Canaanite families drifted into the Delta marshes,
      settled around Avaris, built houses, raised children,
      traded, married, stayed.
      And with them came the horse, the chariot,
      new gods with strange names.
      I walked through Avaris in those years
      and heard Canaanite in the markets,
      smelled foreign bread in the ovens,
      watched Egyptian and Canaanite children
      playing the same games in the dust.
      No invasion. Just people, moving,
      the way people have always moved —
      toward water, toward work, toward a better life.
      Egypt would call them invaders later,
      when it needed someone to blame.
      But I was there at the beginning,
      and at the beginning, they were just neighbors.
    description: "I walked through Avaris as Canaanite families drifted into the Delta — no army, just people moving toward water and work, bringing horses, chariots, and new gods with them."
    status: "first draft"
    sha256: "78da2b90c3bb4c61edb8758896647539cbbdf9f6682fc7b3fcfde12fa02f6d61"
  - number: "0642"
    volume: 2
    title: "Kamares Ware"
    date: "c. 1750 BCE"
    region: "Crete"
    poem: |
      Eggshell-thin, the cups —
      so fine you could see light through the clay.
      And painted in swirling white on dark ground:
      spirals, waves, flowers that never grew in any garden.
      I held one at a palace feast in Knossos,
      afraid to grip it too hard,
      drinking wine from something
      that felt like it might shatter
      if I looked at it wrong.
      The Minoan potters made the most delicate things
      in the Bronze Age world,
      and they made them for parties.
      There is something wonderful about that —
      a whole civilization's finest craft
      aimed at making a feast more beautiful.
    description: "At a Knossos feast I drank from an eggshell-thin Kamares cup, white spirals on dark clay — the Bronze Age's most delicate craft, aimed at making a party more beautiful."
    status: "first draft"
    sha256: "ba5aec8d4f6a370277e2da9353195022eecc70a59f58438dcef194f416f5ce17"
  - number: "0643"
    volume: 2
    title: "The Fall of Mari"
    date: "c. 1745 BCE"
    region: "Mesopotamia"
    poem: |
      Hammurabi's troops came, and Zimri-Lim's palace burned.
      I stood outside the walls and watched the smoke go up —
      frescoes blackening, cedar beams cracking,
      twenty thousand tablets baking hard in the fire.
      And here is the strange mercy of it:
      the fire that destroyed the palace saved the archive.
      Unbaked clay would have crumbled to dust in a century.
      Baked hard by the conqueror's flames,
      those tablets survived four thousand years.
      Mari's last king lost everything —
      his city, his throne, probably his life.
      But his mailroom survived him,
      because his enemy burned it thoroughly.
      History is full of such bargains:
      destruction, accidentally preserving
      what it meant to erase.
    description: "I watched Mari's palace burn — and learned the fire's strange mercy: the conqueror's flames baked twenty thousand clay tablets hard, preserving the archive the flames meant to erase."
    status: "first draft"
    sha256: "dc9420d34ee4b58cbaa8de21d06b0b591f3a6a37e0959397a6fa2e300a5ed11f"
  - number: "0644"
    volume: 2
    title: "The Short Reigns"
    date: "c. 1740 BCE"
    region: "Egypt"
    poem: |
      In Thebes, a king crowned in spring and dead by autumn.
      In the Delta, another — crowned, forgotten, replaced
      before the scribes finished carving his name.
      I lived through those years in Egypt,
      and it felt like watching a house
      where every room has a different landlord
      and none of them stays long enough
      to fix the roof.
      The Middle Kingdom's order dissolved
      into rival courts, each with its own king,
      its own taxes, its own little army.
      Nobody planned the collapse.
      It just happened, one short reign at a time —
      power leaking out of the throne
      like water out of a cracked jar,
      until there was nothing left to hold.
    description: "I lived through Egypt's years of kings crowned in spring and dead by autumn — the Middle Kingdom's order leaking away one short reign at a time, like water from a cracked jar."
    status: "first draft"
    sha256: "db3374105a7d6dfd8facdf205511a756707157cf632a89da700801ea87a6558a"
  - number: "0645"
    volume: 2
    title: "The Hittites Learn to Write"
    date: "c. 1735 BCE"
    region: "Anatolia"
    poem: |
      In the shadow of Hattusa's ruined walls,
      Hittite scribes picked up the wedge-shaped script
      of the south and bent it to their own tongue —
      an Indo-European language in Mesopotamian signs,
      like writing English with Chinese characters.
      I watched a young scribe practice,
      his stylus slipping, the wedges going crooked,
      then straightening, then flowing.
      He did not know he was starting something.
      He was just doing his job —
      taking the king's dictation in borrowed signs.
      But that borrowed script became an empire's memory:
      treaties, laws, prayers, horse-training manuals,
      three thousand years of Hittite thought
      in signs invented for a different language entirely.
    description: "I watched a young Hittite scribe practice borrowed wedge-shaped signs, stylus slipping — not knowing his borrowed script would become an empire's three-thousand-year memory."
    status: "first draft"
    sha256: "e91d9553a20474cec3b379417102d796cf1b3f2eb9a0ce6627b623c4306eeeac"
  - number: "0646"
    volume: 2
    title: "The Last Seals of Harappa"
    date: "c. 1730 BCE"
    region: "Indus Valley"
    poem: |
      The script just... stopped.
      No decree banned it. No conqueror burned it.
      The cities emptied, the merchants left,
      and the little square seals with their unicorn beasts
      and their neat rows of signs
      were pressed into clay fewer and fewer times,
      then never again.
      I held one of the last ones, I think —
      the carving a little careless, as if the seal-cutter's heart
      was already somewhere else.
      A writing system dying with its world.
      Not murdered. Just... no longer needed.
      The saddest kind of ending:
      not a bang, not even a whimper,
      just the slow closing of a door
      nobody bothered to lock behind them.
    description: "I held one of the last Harappan seals — the carving a little careless, the script simply stopping as the cities emptied — a writing system dying not murdered, just no longer needed."
    status: "first draft"
    sha256: "f42eed171561ee30b8af964922df49ec9c267b4355228ace2963652ed67f6d27"
  - number: "0647"
    volume: 2
    title: "The Crocodile God Rises"
    date: "c. 1725 BCE"
    region: "Egypt"
    poem: |
      When the old order weakens, new gods rise.
      In the Faiyum, Sobek's priests grew rich —
      the crocodile god, lord of the marshes,
      gold on his altars, pilgrims at his gates.
      I watched a procession at his temple,
      the priests carrying the god's barque,
      the crowd pressing close for a blessing,
      and I understood the transaction:
      uncertain times make certain gods.
      The old gods belonged to the old order —
      the order that was failing.
      Sobek belonged to the marsh, the wild water,
      the places the king's writ no longer ran.
      People do not choose their gods by theology.
      They choose them by need.
      And in those years, Egypt needed a god
      with teeth.
    description: "I watched Sobek's rich procession in the Faiyum — the crocodile god rising as the old order weakened — and learned people choose their gods by need, and Egypt needed one with teeth."
    status: "first draft"
    sha256: "648057f34d8dd3ffba75c9f9cebdf28422bc20edcf950e9893fb0a4ba95159da"
  - number: "0648"
    volume: 2
    title: "Bread and Beer Wages"
    date: "c. 1720 BCE"
    region: "Mesopotamia"
    poem: |
      The Bronze Age paycheck:
      barley loaves, counted out by the dozen,
      beer jars, measured by the scribe,
      handed to the laborers at the end of the day.
      I stood in the ration line at Babylon
      with the brick-makers and the canal-diggers,
      and watched the clerk press the totals into clay —
      so many loaves, so many jars, per man, per day.
      No coins. No paper. Just bread and beer,
      the two things a worker actually needs.
      It was honest pay, in its way —
      you could eat your wages,
      which is more than you can say
      for most of the currencies
      I have watched men kill for since.
    description: "I stood in Babylon's ration line with the brick-makers — barley loaves and beer jars counted out as wages — honest pay you could eat, which is more than most currencies since."
    status: "first draft"
    sha256: "43d58c7fa60598ddd8182d32900528b7ad257e8c6595bdae1b2dca76dccfc27c"
  - number: "0649"
    volume: 2
    title: "The Snake Goddess"
    date: "c. 1715 BCE"
    region: "Crete"
    poem: |
      In the shrines of Knossos she stands,
      glazed faience, bright as a jewel —
      a goddess with a serpent in each hand,
      held up like offerings, or like warnings.
      I saw her in the half-light of the sanctuary,
      and the snakes seemed to move.
      The Minoans did not fear her.
      They honored the thing other peoples killed on sight —
      the serpent, the earth's own power,
      held gently, mastered, made holy.
      Every other god I knew in those years
      carried a weapon.
      She carried two live snakes
      and did not need the weapon.
      That told me everything
      about what the Minoans worshipped:
      not force, but the handling of it.
    description: "In a Knossos shrine I faced the faience Snake Goddess — serpents held up like offerings — and learned the Minoans worshipped not force but the handling of it."
    status: "first draft"
    sha256: "cce5743c19439e5e8b0a2bb57f8661dcf322e0a7c326339171687ee302ec64cc"
  - number: "0650"
    volume: 2
    title: "Avaris, City of Strangers"
    date: "c. 1700 BCE"
    region: "Egypt"
    poem: |
      The Delta port swelled with strangers —
      Canaanite merchants, craftsmen, sailors,
      their ships crowding the harbor,
      their gods crowding the temples.
      I walked the docks at Avaris and heard
      a dozen tongues, smelled cedar and myrrh
      and the sharp tang of foreign cooking.
      Egypt's gateway to the Levant,
      growing richer every year —
      and every year a little less Egyptian,
      a little more something else,
      something new being born in the marshes.
      The pharaohs in Thebes watched it grow
      and did not know whether to tax it or fear it.
      They would learn.
      Avaris was becoming a rival capital,
      and nobody had planned it —
      it just grew, the way ports do,
      out of ships and strangers and money.
    description: "I walked the crowded docks of Avaris — Canaanite merchants, foreign gods, a dozen tongues — Egypt's Levantine gateway swelling into a rival capital nobody planned."
    status: "first draft"
    sha256: "4a90c53e0f46ef7b98587c518e3375eaba8b56847af28e1cbb69791f8dd955a5"
  - number: "0651"
    volume: 2
    title: "Linear A"
    date: "c. 1695 BCE"
    region: "Crete"
    poem: |
      In the palace storerooms of Knossos,
      clerks kept the accounts in a flowing script —
      sign after sign, neat as handwriting,
      recording oil, grain, sheep, wine.
      And no one has ever read a word of it.
      I watched a clerk finish a tablet,
      press his seal, set it on the shelf
      with a thousand others —
      the whole economy of a palace,
      written down in a language
      that died with its writers.
      The books of Knossos, sealed shut.
      We can count the tablets.
      We can admire the hand.
      But the words themselves —
      the actual words —
      are locked in a room
      whose key was lost four thousand years ago.
    description: "I watched a Knossos clerk shelve his Linear A tablet with a thousand others — a whole palace economy written in a script no one has ever read, locked in a room whose key was lost."
    status: "first draft"
    sha256: "1f0a17269572750f5a4cbe669c98198342c76c08d8db112f368801f07692be5c"
  - number: "0652"
    volume: 2
    title: "Hattusili the Lion King"
    date: "c. 1690 BCE"
    region: "Anatolia"
    poem: |
      They called him the Lion, and he earned it.
      Hattusili stormed down through Syria,
      city after city, dragging cedar and captives
      back to his mountain capital —
      the first great Hittite king,
      building an empire the hard way.
      I saw his army on the march once,
      infantry in the valleys, chariots on the ridges,
      moving like weather.
      He wrote about his campaigns himself —
      not boasting, exactly, but keeping the record straight,
      the way a man does when he knows
      history is watching.
      The Hittites had learned to write a generation before.
      Now they had something worth writing down:
      a lion, loose in Syria,
      and the ancient world would never be the same.
    description: "I watched Hattusili's army move through Syria like weather — the Lion King dragging cedar and captives home, giving the Hittites' new script something worth writing down."
    status: "first draft"
    sha256: "fd6755facd45473d442c334684e1ba8828fe6e9afdb277b0e373418049e4f297"
  - number: "0653"
    volume: 2
    title: "The Rhind Papyrus"
    date: "c. 1685 BCE"
    region: "Egypt"
    poem: |
      A scribe named Ahmes copied a mathematics book,
      and I read over his shoulder:
      how to divide seven loaves among ten men,
      how to measure a heap of grain,
      how to reckon the slope of a pyramid
      so it does not fall down.
      Practical math. No proofs, no theorems —
      just answers, worked out, for men who needed them.
      I have seen the great mathematics of later ages,
      all symbols and abstractions.
      But there is something moving about this:
      the first math book we have
      is about making sure everyone gets their bread
      and the pyramid stands up straight.
      Ahmes signed his work.
      He was proud of it.
      He should have been.
    description: "I read over the scribe Ahmes's shoulder as he copied his math book — dividing loaves, measuring grain, sloping pyramids — the first mathematics we have, and all of it about bread and standing straight."
    status: "first draft"
    sha256: "ae0d5fcb8587952d4f9c512c2a9af8a0ee41dc4334d253956b26a167863b5bf8"
  - number: "0654"
    volume: 2
    title: "The Hittite Laws"
    date: "c. 1680 BCE"
    region: "Anatolia"
    poem: |
      "If a man steals a plow ox, he shall pay fifteen oxen."
      The Hittites wrote their laws plainly,
      priced in livestock and silver —
      no poetry, no speeches about justice,
      just the tariff: you broke it, you pay this much.
      I read them on the tablets at Hattusa
      and found them refreshingly honest.
      Babylon's laws talked about the gods.
      The Hittites talked about oxen.
      And there was mercy in the prices, too —
      fines where other kingdoms demanded hands,
      compensation where others demanded blood.
      A practical people, the Hittites.
      They did not ask whether the law was beautiful.
      They asked whether it worked —
      and priced accordingly.
    description: "I read the Hittite laws at Hattusa — steal a plow ox, pay fifteen — plain tariffs priced in livestock, fines where other kingdoms took hands, honest as a market list."
    status: "first draft"
    sha256: "07b7f68ad62c4ffb324e060c38196755a5ff3c419cc83b9a637e98f913902802"
  - number: "0655"
    volume: 2
    title: "Bull-Leaping at Knossos"
    date: "c. 1675 BCE"
    region: "Crete"
    poem: |
      The bull charges. The leaper runs to meet it,
      grabs the horns, and vaults —
      over the back, over the horns, over death itself —
      landing behind the animal
      while the court holds its breath.
      I watched it in the palace courtyard at Knossos,
      and my own breath stopped with theirs.
      Sport? Ritual? Both, probably.
      The Minoans turned danger into dance,
      the way other peoples turned it into war.
      The frescoes show it in bright color —
      the leaper mid-air, the bull mid-charge,
      frozen at the exact moment
      when courage becomes art.
      I have seen brave things in my travels.
      Few of them were this beautiful.
    description: "I watched a bull-leaper vault clean over charging horns in the Knossos courtyard — the Minoans turning danger into dance, courage frozen mid-air into art."
    status: "first draft"
    sha256: "5a1968d102f8a52794202bf1578cff72e352edfe10a0e40a4a4ccce0749b355f"
  - number: "0656"
    volume: 2
    title: "The Venus Tablet"
    date: "c. 1670 BCE"
    region: "Mesopotamia"
    poem: |
      For twenty-one years, the star-watchers of Babylon
      recorded Venus: when she rose, when she set,
      when she vanished behind the sun.
      Twenty-one years of patient watching.
      I sat with them on the ziggurat top one clear night,
      and the old observer showed me the tablets —
      row after row of risings and settings,
      the first long experiment in astronomy.
      They thought Venus was an omen.
      They were wrong about that.
      But they were right about the method:
      watch, record, compare, predict.
      Science did not begin with a theory.
      It began with a man on a rooftop,
      writing down where the bright star was,
      night after night, for twenty-one years.
    description: "I sat with Babylon's star-watchers on the ziggurat top — twenty-one years of Venus risings recorded tablet by tablet — the first long experiment, science beginning with patience."
    status: "first draft"
    sha256: "a4f706bc7175fdf83d78396b7cc520efa813fb676517a2eef1645fe592523ad6"
  - number: "0657"
    volume: 2
    title: "The Hyksos Take Avaris"
    date: "c. 1665 BCE"
    region: "Egypt"
    poem: |
      The drift became a seizure.
      Canaanite chiefs took Avaris outright,
      crowned their own kings in the Delta,
      and Egypt split in two —
      Thebes in the south, Avaris in the north,
      with the chariot now in the land
      and everything changed.
      I was in the Delta when the new kings
      set up their court, and I will say this:
      they ruled well. They traded, they built,
      they honored both sets of gods.
      But to Thebes they were foreigners on the throne,
      and a divided Egypt could not stand it long.
      The chariot had come to Egypt
      not as a weapon of conquest
      but as the property of immigrants —
      and now it would decide
      who ruled the Nile.
    description: "I was in the Delta when Canaanite chiefs crowned their own kings at Avaris — Egypt split in two, the chariot now in the land, immigrants' property about to decide who ruled the Nile."
    status: "first draft"
    sha256: "39f9e7c441f6d8c932a45c76cf730a912a7419544c9a321f3ac8d6ff20f4dc95"
  - number: "0658"
    volume: 2
    title: "The Shaft Graves of Mycenae"
    date: "c. 1660 BCE"
    region: "Greece"
    poem: |
      Deep stone shafts, cut into the rock of Mycenae,
      and in them warrior princes —
      gold masks on their faces, bronze swords at their sides,
      more wealth in one grave than a village would see in a lifetime.
      I stood at the edge of a shaft while they lowered a prince,
      and the gold caught the sun going down.
      Mainland Greece had found its voice,
      and its voice was war, wealth, and the dead.
      The Minoans painted dolphins.
      The Mycenaeans buried swords.
      Two peoples, one sea between them,
      and I could already see
      which one would outlast the other —
      though I wished, that day,
      that it would be the dolphins.
    description: "I stood at a Mycenae shaft grave as they lowered a prince with his gold mask — mainland Greece finding its voice in war and wealth, while across the sea the Minoans painted dolphins."
    status: "first draft"
    sha256: "3a00e43d13085a002ee9d5c4fadd0a2f86e7ea9a61bd25348b4dd8fc99c82681"
  - number: "0659"
    volume: 2
    title: "The Nebra Sky Disc"
    date: "c. 1655 BCE"
    region: "Europe"
    poem: |
      On a German hill, buried with swords and axes,
      a bronze disc inlaid with gold:
      the sun, the moon, and thirty-two stars —
      the Pleiades among them, I am nearly sure.
      The oldest picture of the heavens.
      I held it — heavy, green with age even then? No —
      bright, when I saw it, new from the smith's hands,
      the gold hammered thin and set into the bronze.
      Someone looked up at the night sky
      and needed to hold it.
      Not to worship it, not to predict with it —
      just to have the stars in their hands.
      I understood completely.
      I have spent my whole long life
      trying to hold things too big for hands.
    description: "I held the new-made Nebra disc — bronze inlaid with gold sun, moon, and stars — the oldest picture of the heavens, made by someone who just needed to hold the night sky."
    status: "first draft"
    sha256: "e4f6a8d1f1637981204b4d700a7e3dcbb81179a6e0b03f16cc3a54a792468afd"
  - number: "0660"
    volume: 2
    title: "Kerma at Its Height"
    date: "c. 1650 BCE"
    region: "Nubia"
    poem: |
      South of the cataracts, Kerma ruled the upper Nile —
      its kings buried under great mounds,
      its towering mud-brick temple, the Western Deffufa,
      rising over the plain like a man-made mountain.
      I stood at its base and craned my neck.
      No stone. Just mud-brick, millions of them,
      laid by hands that believed.
      Kerma traded gold and ivory with Egypt's frontier,
      grew rich, grew proud —
      a whole civilization the history books barely mention,
      because it lost.
      But I was there at its height,
      and height is height, whoever writes the books.
      The temple stood. The gold flowed.
      The kings were kings.
      That is enough. That is everything.
    description: "I craned my neck at Kerma's towering mud-brick temple — a forgotten Nubian kingdom at its height, gold flowing, kings buried under mounds, height being height whoever writes the books."
    status: "first draft"
    sha256: "20376f047bff443ff4461a95b6377b9f299396cf0d27ec450b9e1328af88bcc7"
  - number: "0661"
    volume: 2
    title: "The Kassites Appear"
    date: "c. 1645 BCE"
    region: "Mesopotamia"
    poem: |
      They came down from the Zagros on horseback —
      highlanders, horse-breeders,
      drifting toward Babylon in ones and twos,
      hiring on as soldiers, settling as farmers.
      Nobody feared them. That was the thing.
      They were just... arriving.
      I watched a Kassite family water their horses
      at a Babylonian canal, and the farmer beside me
      shrugged: more mouths, more hands, what of it?
      What of it, indeed.
      Within a lifetime those quiet horsemen
      would be sitting on Babylon's throne —
      not by conquest, but by accumulation,
      the way a river takes a valley:
      a little more, every year,
      until one day the valley is the river's.
    description: "I watched Kassite horse-breeders water their animals at a Babylonian canal — quiet arrivals, no conquest — the next dynasty walking in a little more every year, the way a river takes a valley."
    status: "first draft"
    sha256: "d5f0d20f7cfbf5cf40ab50169015f345a339ba6b333ab9e8bc4e1dca72ea4dc2"
  - number: "0662"
    volume: 2
    title: "The Flotilla Fresco"
    date: "c. 1640 BCE"
    region: "Aegean"
    poem: |
      At Akrotiri the painters covered a whole wall:
      ships with high prows, warriors with long spears,
      dolphins leaping between the hulls,
      towns along the shore with people watching.
      The Minoan navy, in full color.
      I stood before it while the paint was fresh,
      and a sailor beside me pointed at one ship:
      mine, he said, grinning. That one's mine.
      It was not a war fleet. It was a world —
      trade, travel, the sea as a road, not a wall.
      The Minoans painted their ships
      the way other peoples painted their gods.
      I have crossed a thousand seas since,
      and I have never seen a people
      love the water the way they did.
    description: "I stood before Akrotiri's fresh-painted flotilla — ships, warriors, leaping dolphins — while a sailor grinned and pointed: mine. The Minoans painted ships the way other peoples painted gods."
    status: "first draft"
    sha256: "ae1c57646b9845238ff052be45d438f47aba40327d06fe16abbd413a1a5961aa"
  - number: "0663"
    volume: 2
    title: "Aleppo Falls"
    date: "c. 1630 BCE"
    region: "Syria"
    poem: |
      Hattusili's Hittites came down on Yamhad
      and Aleppo fell — the great citadel taken,
      the storm-god's temple stripped of its gold,
      the crossroads of three continents
      in the hands of mountain warriors.
      I walked through the city after the sack,
      the smoke still rising from the lower town,
      and climbed the citadel where the temple
      stood empty, its god gone with the gold.
      The storm-god had not saved his own house.
      That is the lesson the priests would not say aloud:
      the gods protect the strong,
      and the strong had just changed.
      Aleppo would rise again — cities do —
      but never again as the power it was.
      The age of Yamhad ended in that smoke,
      and the age of the Hittites began.
    description: "I climbed Aleppo's citadel after Hattusili's sack — the storm-god's temple stripped, smoke over the lower town — and learned the gods protect the strong, and the strong had just changed."
    status: "first draft"
    sha256: "a8484e40901035e08baf259d18f2cc9992e5aa65c3cbd642fe7a6afd233f2f18"
  - number: "0664"
    volume: 2
    title: "The Mask of Agamemnon"
    date: "c. 1625 BCE"
    region: "Greece"
    poem: |
      Gold, hammered thin as paper,
      beaten over the face of a dead warlord —
      the eyes closed, the mouth set,
      a mustache and beard worked into the metal.
      It is not Agamemnon. It cannot be —
      five hundred years too early.
      But the man who found it named it so,
      and the name stuck, because we need our legends
      to have faces.
      I was there when they lifted it from the shaft grave,
      the gold gleaming after three thousand years in the dark,
      and the workmen went silent.
      A face. A real man's face, hammered in gold.
      Whoever he was — some Bronze Age lord of Mycenae —
      he got what every king wants and almost none get:
      to be looked at, four thousand years later,
      and remembered.
    description: "I watched them lift the gold death mask from a Mycenae shaft grave — not Agamemnon, five centuries too early, but a real warlord's face in hammered gold, remembered four thousand years on."
    status: "first draft"
    sha256: "a47ee41d9674852794c273e0d31a8aeee9d713990e2cf5680277bf19e3dfd5eb"
  - number: "0665"
    volume: 2
    title: "The Copper Island"
    date: "c. 1620 BCE"
    region: "Cyprus"
    poem: |
      In the Troodos foothills the furnaces burned day and night,
      and the smiths of Cyprus poured copper into a shape
      the whole world recognized: the oxhide ingot —
      four handles, like a stretched hide,
      made to be carried on a man's back or a ship's deck.
      I watched them cast one, the metal glowing,
      the mold hissing, the ingot cooling into its familiar shape.
      Cyprus did not need armies. It had copper —
      and everyone else had tin and needed copper,
      which meant everyone needed Cyprus.
      The island's wealth was not in its soil
      but under it, and the smiths knew exactly
      what they were sitting on.
      An island of metal, selling to the world:
      the first resource economy I ever saw,
      and it ran like a well-cast ingot — smooth, heavy, true.
    description: "I watched Cypriot smiths cast copper into oxhide ingots — the island selling metal to a world that needed it, the first resource economy, running smooth and heavy and true."
    status: "first draft"
    sha256: "9d1a523eaa119e4a6826489aa51355b2f288af41ff1b272183a3941941e41ab2"
  - number: "0666"
    volume: 2
    title: "The Purple Makers"
    date: "c. 1615 BCE"
    region: "Levant"
    poem: |
      On the Canaanite coast they crushed the murex shells —
      thousands of them, for a thimbleful of dye —
      and the vats stank to heaven,
      but the color that came out was worth its weight in silver.
      Purple. True purple, that does not fade,
      that deepens with the years.
      I watched a dyer lift a skein of wool from the vat,
      dripping, stinking, glorious —
      and a merchant paid without haggling.
      Kings would kill for this color.
      Priests would reserve it for the holy of holies.
      And it all came from a sea snail,
      cracked open one by one on a Levantine beach,
      by men with stained hands and ruined fingernails.
      Luxury has always been like this:
      something beautiful, made by something awful,
      priced beyond reason, wanted beyond sense.
    description: "I watched a Canaanite dyer lift purple wool from a stinking murex vat — thousands of shells for a thimbleful of dye worth its weight in silver, luxury born of something awful."
    status: "first draft"
    sha256: "1cc6f32c95705545e4d37d05f19ad09d462a7e03e999803780118630f01d42da"
  - number: "0667"
    volume: 2
    title: "The Day Thera Blew"
    date: "c. 1610 BCE"
    region: "Aegean"
    poem: |
      The sky went black at noon.
      I was on a ship in the Aegean when Thera blew —
      the sound reached us before the ash did,
      a crack like the world splitting,
      then the sea itself seemed to stand up.
      Akrotiri vanished under ash and pumice —
      a whole Minoan town, buried standing,
      its frescoes still bright on the walls.
      The Bronze Age's great cataclysm.
      Tidal waves, darkened skies, harvests failing
      from here to Egypt — the old tales of Atlantis
      were born in this smoke, I am certain of it.
      I sailed back past the island weeks later.
      Where a mountain had been, there was a hole in the sea,
      still steaming.
      The Minoan world never recovered.
      I watched it happen, and I still dream about the sound.
    description: "I was on an Aegean ship when Thera erupted — the sky black at noon, Akrotiri buried standing — the Bronze Age's great cataclysm, and I still dream about the sound."
    status: "first draft"
    sha256: "61d243215767e27dd3b3e9060853a7d75299f2a4a132a4724b93542db9d53b7c"
  - number: "0668"
    volume: 2
    title: "The Sealand Kings"
    date: "c. 1605 BCE"
    region: "Mesopotamia"
    poem: |
      While Babylon's throne sat uneasy,
      the southern marshes made their own kings —
      the Sealand dynasty, ruling the reed beds,
      the floating towns, the Gulf trade,
      from cities built on water.
      I poled a boat through their capital,
      houses on stilts, gardens on rafts,
      fishermen who paid taxes in dried fish
      and considered themselves free men —
      because who conquers a swamp?
      The marshes had always been the refuge
      of everyone Babylon could not catch.
      Now they had kings of their own,
      and the kings of Babylon had to deal with them
      as equals.
      Power does not only live in palaces.
      Sometimes it lives in a reed boat,
      in water too shallow for armies
      and too rich for kings to ignore.
    description: "I poled a boat through the Sealand's floating capital — stilt houses, raft gardens, marsh kings taxing dried fish — power living in a reed boat, in water too shallow for armies."
    status: "first draft"
    sha256: "01004ec9c53da5159dce7dbf12c34493832a6048291686c8c87bb68dbb8cfeaa"
  - number: "0669"
    volume: 2
    title: "Mursili Sacks Babylon"
    date: "c. 1600 BCE"
    region: "Anatolia"
    poem: |
      The Hittite king marched a thousand miles
      down the Euphrates — the longest raid in history —
      stormed Babylon, burned it, looted it,
      and then... marched home.
      He did not stay. He did not set up a governor.
      He just left the throne empty and walked back to Hattusa.
      I saw the smoke from the riverbank,
      and I could not understand it —
      all that way, for plunder alone?
      But that was the Hittite way in those days:
      strike like lightning, carry home the gold,
      let someone else worry about ruling.
      Babylon fell, and the Kassites —
      those quiet horsemen from the Zagros —
      walked into the empty palace
      and sat down.
      The greatest raid in history,
      and its real prize went to the men
      who never lifted a spear.
    description: "I watched Mursili's Hittites sack Babylon after a thousand-mile march — then march home, leaving the throne empty for the quiet Kassite horsemen who simply walked in and sat down."
    status: "first draft"
    sha256: "f306bd096013cf60c83b3450186d540ae7a1268da74e9ac9cc281e1919d2bb93"
  - number: "0670"
    volume: 2
    title: "The Kassites Take Babylon"
    date: "c. 1595 BCE"
    region: "Mesopotamia"
    poem: |
      No battle. No siege. No burning.
      The Kassite horsemen — who had been drifting in
      for a generation, watering their horses at Babylon's canals —
      simply stepped onto the empty throne
      and began to rule.
      And they ruled for four hundred years.
      I watched the first Kassite king hold court,
      and what struck me was how Babylonian he had become —
      the robes, the rituals, the scribes, the gods.
      The conquerors had been conquered by the culture
      before they ever took the throne.
      Four centuries of peace, mostly.
      Horses bred, temples built, the old gods honored
      under new names.
      The quietest takeover in history,
      and one of the longest reigns —
      proof that sometimes the patient ones,
      the ones who just keep arriving,
      inherit the earth.
    description: "I watched the first Kassite king hold court in Babylonian robes — no battle, no siege, just the patient horsemen stepping onto an empty throne they would hold for four hundred years."
    status: "first draft"
    sha256: "058b8cf2248b8ea7002199012ab74cf74221d4a7b4edd99a3cf5f42ee0b292e2"
  - number: "0671"
    volume: 2
    title: "The Rise of Mitanni"
    date: "c. 1590 BCE"
    region: "Syria"
    poem: |
      Between the rivers, the Hurrian horse-lords
      built a kingdom on the chariot —
      Mitanni, the first true chariot power of the east,
      its nobles buried with their teams,
      its kings writing treatises on horse-training
      that read like love letters to the animal.
      I watched a Mitanni charioteer drill at dawn,
      the horses wheeling in perfect unison,
      and understood: this was not an army with chariots.
      This was a civilization built around the horse.
      The age of the horse had begun in the east,
      and everything — war, diplomacy, prestige —
      would be measured in horsepower
      for the next thousand years.
      The Hittites had the mountains.
      Egypt had the river.
      Mitanni had the horse —
      and for a while, that was enough.
    description: "I watched Mitanni charioteers drill at dawn — Hurrian horse-lords building a kingdom on the chariot, the age of the horse beginning in the east, everything measured in horsepower."
    status: "first draft"
    sha256: "2cec56f0733d5a37c79aef48087841982be4953bac08ff19046165eab5883921"
  - number: "0672"
    volume: 2
    title: "Telepinu's Edict"
    date: "c. 1585 BCE"
    region: "Anatolia"
    poem: |
      After the bloodbath — brother killing brother,
      nephew killing uncle, the throne of Hattusa
      passed hand to bloody hand —
      King Telepinu sat down and wrote the rules.
      Who inherits. In what order.
      What happens to the man who murders his way to power.
      (This happened. Here is the punishment. In writing.)
      Murder, regulated.
      I read the edict on the tablet,
      and I had to admire the honesty of it:
      not "thou shalt not kill" —
      kings do not work that way —
      but "here is exactly what happens to you
      if you try."
      It worked, more or less.
      The killing slowed.
      The empire steadied.
      The first succession law in history,
      written by a man who had watched his family
      slaughter each other for the crown —
      and decided to put it in writing
      so it would stop.
    description: "I read Telepinu's edict at Hattusa — succession rules written after a bloodbath of kin-killing — the first law of who inherits, murder regulated in writing so it would stop."
    status: "first draft"
    sha256: "9589ac74cf3ca42d1691fa456708e198fdcaf8d4ebdd0c810b9b4520a02e7e46"
  - number: "0673"
    volume: 2
    title: "Seqenenre's Last Battle"
    date: "c. 1560 BCE"
    region: "Egypt"
    poem: |
      The Theban king went north to fight the Hyksos,
      and he did not come back.
      The axe wounds are still in his skull —
      I have seen the mummy, the head shattered,
      the face frozen in the moment of the killing blow.
      He died fighting foreigners on Egyptian soil,
      and his death lit the fire.
      His son Kamose took up the war.
      His other son Ahmose finished it.
      But it started with Seqenenre,
      bleeding out on some Delta battlefield,
      buying Egypt's freedom with his life.
      The mummy still bears the battle.
      Three thousand five hundred years later,
      you can see exactly how he died —
      and exactly why Egypt remembers
      that some prices are paid in kings.
    description: "I have seen Seqenenre's mummy — the Hyksos axe wounds still in his skull — the Theban king who bought Egypt's war of liberation with his life and lit the fire his sons would finish."
    status: "first draft"
    sha256: "ecd37034f369a3f2fc49ddb5b0aaf10437c8229c0bf6d16f9a22acf0a1c43776"
  - number: "0674"
    volume: 2
    title: "Kamose's War"
    date: "c. 1555 BCE"
    region: "Egypt"
    poem: |
      The young Theban prince sailed north,
      and he wrote it all down on stone —
      his fury, his vows, his contempt
      for the Hyksos king sitting in Avaris
      and the Nubian king sitting in Kush,
      Egypt squeezed between them like grain between millstones.
      "I will fight," he carved. "I will free Egypt."
      I read his stela at Karnak,
      and the words still burn —
      a young man's rage, set in stone,
      against two foreign kings on Egyptian soil.
      He won battles. He took towns.
      He died before the war was done —
      but he started it, and starting it
      was the hard part.
      His brother Ahmose would finish the work.
      But the vow was Kamose's,
      and the stone remembers.
    description: "I read Kamose's war stela at Karnak — the young Theban prince's carved vow to free Egypt from Hyksos and Kushite kings — rage set in stone, the war of liberation begun."
    status: "first draft"
    sha256: "077b4dca5bd960fd5c16bbdb38e40893bb51fac56f2b4b0f84a476bfde64b5dc"
  - number: "0675"
    volume: 2
    title: "Ahmose Takes Avaris"
    date: "c. 1550 BCE"
    region: "Egypt"
    poem: |
      Years of siege. Then the walls came down,
      and Ahmose stormed Avaris —
      the Hyksos capital, the city of strangers,
      Egypt's wound for a hundred years —
      and Egypt was one kingdom again.
      I walked through the city after the taking,
      the soldiers still high with victory,
      the Canaanite merchants already packing.
      The New Kingdom dawned that day —
      eighteen dynasties of glory ahead,
      all of it built on this morning's work.
      But I thought about the families
      who had drifted in two generations before,
      just looking for water and work —
      and now fleeing north with everything they could carry.
      Liberation always has two sides.
      I was there for Egypt's joy,
      and I did not look away from the other side.
    description: "I walked through Avaris after Ahmose stormed it — Egypt one kingdom again, the New Kingdom dawning — and did not look away from the fleeing families who had come as immigrants two generations before."
    status: "first draft"
    sha256: "befc3874a925264307129c0e88f7d6b0bb288bd148cc025da691ed6d9fcdab6b"
  - number: "0676"
    volume: 2
    title: "The Viceroy of Kush"
    date: "c. 1545 BCE"
    region: "Egypt"
    poem: |
      Ahmose named his son "King's Son of Kush" —
      a new title for a new reality:
      Nubia was no longer a foreign land.
      It was Egypt's gold province,
      ruled from Thebes, taxed in gold and ebony.
      I traveled south with the first viceroy's officials,
      past the cataracts, into the land of the bowmen —
      and watched the fortresses change hands,
      Egyptian governors moving into Kushite towns.
      The gold road was now an imperial highway.
      The bowmen who had served as mercenaries
      now served as subjects.
      Empires do this: they turn neighbors into provinces
      with a title and a tax collector.
      Kush would wear the title for five hundred years —
      and then, one day, turn it around
      and rule Egypt itself.
    description: "I traveled south with the first Viceroy of Kush — Nubia becoming Egypt's gold province, fortresses changing hands — an empire turning neighbors into provinces with a title and a tax collector."
    status: "first draft"
    sha256: "b7e3d58400daf2c6047817f805f377dd1eea9cdff8a8c8a0d6ce383b2713e7d3"
  - number: "0677"
    volume: 2
    title: "The Ebers Papyrus"
    date: "c. 1540 BCE"
    region: "Egypt"
    poem: |
      Twenty meters of papyrus.
      Seven hundred remedies, in a physician's careful hand:
      honey for wounds, moldy bread for infection —
      (the mold worked; they did not know why) —
      potions for coughs, salves for burns,
      spells for the things no potion could touch.
      I unrolled it slowly, section by section,
      and marveled at the method:
      observe, record, try, record again.
      Magic and medicine, side by side,
      and no embarrassment about either —
      because when someone is sick,
      you use everything you have.
      The oldest medical library in the world
      fits in a scroll you could carry under one arm.
      I have carried heavier books
      that contained less wisdom.
    description: "I unrolled the twenty-meter Ebers Papyrus — seven hundred remedies, honey for wounds, moldy bread for infection — magic and medicine side by side, the oldest medical library in the world."
    status: "first draft"
    sha256: "9a03a09e7ec40a0c654bc4df01044eab9f81c182f34a44d834972e2efcae3133"
  - number: "0678"
    volume: 2
    title: "Minoan Painters in the Delta"
    date: "c. 1535 BCE"
    region: "Egypt"
    poem: |
      At Avaris, in the palace of the defeated Hyksos,
      the new Egyptian masters hired Minoan artists —
      and the painters from Crete covered the walls
      with bull-leapers and dolphins,
      flying fish and rosettes,
      in the bright Aegean style.
      Minoan frescoes in an Egyptian palace.
      I stood before them, blinking —
      the Nile outside, the Aegean inside.
      It told me something about the New Kingdom:
      Egypt had won the war and was now collecting the world.
      Why paint your own walls
      when you can import the best painters alive?
      Cultures do not stay pure after victories.
      They get richer, stranger, more mixed —
      and the walls of Avaris proved it,
      dolphins leaping over an Egyptian throne room.
    description: "I stood before Minoan bull-leapers and dolphins frescoed on an Egyptian palace wall at Avaris — the Nile outside, the Aegean inside — victory making Egypt richer, stranger, more mixed."
    status: "first draft"
    sha256: "459f096e9aa81219a97cb205d8ca7110cc335bf1b8f48075e0d58df546f5351e"
  - number: "0679"
    volume: 2
    title: "The Walled City of Zhengzhou"
    date: "c. 1530 BCE"
    region: "China"
    poem: |
      Packed earth, rammed hard as stone —
      the Shang raised walls around their capital
      so massive that three thousand years later
      you can still walk their foundations.
      China's first great walled city.
      I walked the wall-top at Zhengzhou
      while the builders were still ramming the last sections,
      the thud of the tampers like a slow heartbeat.
      Inside: palaces, foundries, workshops.
      Outside: the plain, and everyone on it
      who might want what was inside.
      Every civilization builds its first great wall
      at the moment it has something worth stealing —
      and the Shang had bronze, jade, and power.
      The wall said: this is ours.
      The size of it said: try to take it.
    description: "I walked the wall-top at Zhengzhou while tampers still thudded — packed earth hard as stone, China's first great walled city, its size saying try to take it."
    status: "first draft"
    sha256: "e5332d2a74101c0050e3e95c91b9a43e9fb454785846c95f3739f4d267cec697"
  - number: "0680"
    volume: 2
    title: "The First Valley Tomb"
    date: "c. 1525 BCE"
    region: "Egypt"
    poem: |
      Thutmose looked at the pyramids —
      big, obvious, robbed within a generation —
      and gave a different order:
      cut my tomb deep into a hidden desert valley,
      no mound, no marker, just rock.
      The Valley of the Kings began with that decision.
      I watched the workmen cut the first corridor,
      the copper chisels ringing on limestone,
      dust thick in the torchlight.
      Hide the king. That was the idea.
      (It did not work — robbers found them anyway.
      But the valley kept the secret
      longer than any pyramid ever did.)
      Five centuries of pharaohs would follow him
      into that hidden valley,
      each one deeper, each one richer,
      each one certain his hiding place
      was the one they would never find.
    description: "I watched workmen cut the first corridor into the hidden Valley of the Kings — Thutmose's order to hide the king instead of piling stone over him, the decision that began five centuries of tombs."
    status: "first draft"
    sha256: "6af477c52e5e05f35ce7e88ab31294f974d50496b0fa34e1e43e270d61d1e5dc"
  - number: "0681"
    volume: 2
    title: "The Workmen's Village"
    date: "c. 1520 BCE"
    region: "Egypt"
    poem: |
      At Deir el-Medina, the crown built a village
      for the men who cut the royal tombs —
      not barracks, but homes:
      houses with cellars, a temple, a court,
      scribes to settle their disputes.
      I lived among them for a season,
      and these were the most literate workmen on earth —
      they wrote letters, kept accounts,
      sued each other over donkeys.
      For five centuries, generation after generation,
      the same families painted eternity —
      kings' tombs, queens' tombs,
      the whole glittering afterlife,
      done by men who went home for dinner.
      The artists of forever,
      living in a company town,
      arguing about donkeys.
      I loved them.
    description: "I lived a season at Deir el-Medina — the tomb-builders' village of literate workmen who painted eternity for five centuries and went home for dinner, suing each other over donkeys."
    status: "first draft"
    sha256: "971cfbd26a0ffadd59ba8538b45dcd383ee2422ac6f3d92e75eda03d1dc2ebcc"
  - number: "0682"
    volume: 2
    title: "The First Glass"
    date: "c. 1515 BCE"
    region: "Mesopotamia"
    poem: |
      Sand and ash, in a hot enough kiln —
      that was the whole secret,
      and it took humanity four thousand years to find it.
      I watched a Mesopotamian craftsman
      coax the first glass from the furnace:
      blue as lapis, fragile as eggshell,
      a vessel that caught the light
      and threw it back changed.
      He held it up, turning it slowly,
      and the whole workshop went quiet.
      They had made stone flow like honey
      and freeze like water.
      Nothing in nature looked like this —
      it was the first truly artificial beauty,
      made by fire and patience.
      Glass. We drink from it, look through it,
      light our cities with it —
      and it began here, blue as lapis,
      in a kiln in Mesopotamia.
    description: "I watched the first glass coaxed from a Mesopotamian kiln — sand and ash turned blue as lapis, the first truly artificial beauty, stone made to flow like honey and freeze like water."
    status: "first draft"
    sha256: "b56eea701811fb5e188141b502962f22776c3fa214b99292a58b03f938faff64"
  - number: "0683"
    volume: 2
    title: "The Griffin Warrior"
    date: "c. 1510 BCE"
    region: "Greece"
    poem: |
      At Pylos they buried a young warrior —
      bronze armor, bronze weapons,
      and seals carved in the Minoan style,
      a sword hilt wrapped in gold,
      an ivory plaque carved with a griffin.
      A Mycenaean prince dressed like a Cretan king.
      I stood at the graveside and read the burial
      like a letter: this young lord
      had looked across the sea at Knossos
      and wanted what they had —
      the art, the seals, the style —
      even as his people prepared to take it all by force.
      Admiration and appetite, in one grave.
      The Mycenaeans loved Minoan civilization
      the way a wolf loves a flock:
      beautiful, and dinner.
      Within two generations, they would own Crete.
      The griffin warrior saw it coming.
      He dressed for it.
    description: "I stood at the Griffin Warrior's grave at Pylos — a Mycenaean prince buried with Minoan seals and a gold-hilted sword — admiration and appetite in one burial, the wolf already eyeing the flock."
    status: "first draft"
    sha256: "7ba97ae0dcadd150f31793066e9902aac3238e56cb54ae235dcb1e47ce8d668d"
  - number: "0684"
    volume: 2
    title: "Idrimi of Alalakh"
    date: "c. 1505 BCE"
    region: "Syria"
    poem: |
      An exiled prince, with nothing but his name,
      hid for seven years among outcasts and mercenaries —
      then raised an army of the dispossessed
      and took back his throne at Alalakh.
      And he had it all carved on his own statue —
      his life story, in his own words,
      the first autobiography in stone.
      I read it, and it reads like an adventure tale:
      the flight, the hiding, the gathering of followers,
      the return, the victory.
      Most kings had their scribes write their glory.
      Idrimi wrote his own —
      exile, patience, revenge, throne —
      and set it up where everyone could read it.
      The lesson he carved for posterity:
      a prince with seven years and a grudge
      is more dangerous than an army.
    description: "I read Idrimi's life carved on his own statue — seven years exiled among outcasts, then a throne retaken — the first autobiography in stone, and proof a prince with a grudge outlasts an army."
    status: "first draft"
    sha256: "0d33636955b76e457413f3d09b646d323ae81349f1730addaa16593d99bb11ac"
  - number: "0685"
    volume: 2
    title: "Susa, City of the Gods"
    date: "c. 1500 BCE"
    region: "Elam"
    poem: |
      In the lowlands of Elam, Susa rose —
      temples over workshops,
      bronze-casters below, priests above,
      lapis and tin flowing through its markets
      from the mountains to the sea.
      The east's great city.
      I walked its streets at festival time,
      the temples bright with paint,
      the workshops hammering late into the night.
      Susa would outlast them all —
      Elamites, Persians, Greeks, Parthians —
      five thousand years of continuous city,
      older than most civilizations
      and still standing when they were dust.
      But I saw it young, in its first glory:
      the gods on the hill,
      the smiths in the valley,
      and the whole east passing through its gates.
    description: "I walked Susa at festival time — temples over bronze workshops, the east's great city young in its first glory, already beginning five thousand years of continuous life."
    status: "first draft"
    sha256: "3c8fc9ebcac528cfd7b24c09171b3434f97979b44b5f638e4a8eb0979f0df88c"
  - number: "0686"
    volume: 2
    title: "The Toreador Fresco"
    date: "c. 1498 BCE"
    region: "Crete"
    poem: |
      In the palace court at Knossos,
      the painters froze the bull-leap in plaster:
      the leaper arched over the bull's back,
      one figure catching the horns,
      one mid-vault, one landing behind —
      the whole dance in a single panel.
      The Minoans' most famous dare,
      caught at the exact second of flight.
      I watched the painters work,
      mixing the bright colors —
      the bull's dappled hide,
      the leapers' brown skin against the white plaster —
      and I thought: they are not decorating a wall.
      They are stopping time.
      Four thousand years later,
      the leap is still happening.
      The painters won.
      Time lost.
    description: "I watched Knossos painters freeze the bull-leap in wet plaster — three figures, one dance, caught mid-flight — stopping time so thoroughly that four thousand years later the leap is still happening."
    status: "first draft"
    sha256: "c7695b60ee8693269ca9dc0593109742949f32ae54cc3c49d2ff8ccfdc4ec5b9"
  - number: "0687"
    volume: 2
    title: "The Star Clocks"
    date: "c. 1495 BCE"
    region: "Egypt"
    poem: |
      On coffin lids, the priests painted the night sky —
      diagonal tables of stars,
      thirty-six decans marching across the dark,
      each one marking an hour.
      The hours of the night, read from the turning sky.
      I lay beside a coffin in a Theban workshop
      (I was not dead; the painter laughed)
      and traced the star tables with my finger,
      watching the decans rise in their order.
      A clock for the dead —
      so the sleeper could tell time in the afterlife,
      so the night would have hours
      even in eternity.
      But the living used them too.
      Priests, watching the sky from temple roofs,
      telling the hour by which stars stood overhead —
      the first time anyone measured the night.
    description: "I traced star tables painted on a Theban coffin lid — thirty-six decans marking the night's hours — a clock for the dead that taught the living to measure the night."
    status: "first draft"
    sha256: "74b500cd12bbb2461fc7e8e28a13e57d542203801664b876755a8dc415231db0"
  - number: "0688"
    volume: 2
    title: "The Archives of Nuzi"
    date: "c. 1492 BCE"
    region: "Syria"
    poem: |
      Small-town law, in clay.
      At Nuzi, under the Mitanni kings,
      the clerks filed everything:
      adoptions, loans, lawsuits,
      a man selling his own children into service
      to pay a debt (the law allowed it; the clay remembers).
      I sat in the archive room and read
      the whole life of a town —
      who owed whom, who married whom,
      who cheated whom and how the judges ruled.
      No kings. No battles. Just people,
      borrowing, lending, quarreling, settling —
      the unglamorous paperwork of ordinary life.
      History remembers the palaces.
      But the archives of Nuzi remember the people
      who lived in the shadow of the palaces —
      and their clay outlasted
      every king they ever paid taxes to.
    description: "I sat in Nuzi's archive reading small-town clay — adoptions, loans, lawsuits — the unglamorous paperwork of ordinary life outlasting every king the town ever paid taxes to."
    status: "first draft"
    sha256: "ed56310f7b9a945216d29e756ea7d50dbb934d185658ea4591458fb8d3f3903c"
  - number: "0689"
    volume: 2
    title: "San Lorenzo Founded"
    date: "c. 1490 BCE"
    region: "Mesoamerica"
    poem: |
      On a plateau above the Coatzacoalcos river,
      the Olmec began raising the first ceremonial center
      of the Americas —
      platforms, plazas, drainage channels,
      and the great stone heads not yet carved
      but already imagined, I am sure.
      I stood on that plateau when it was new,
      the jungle pressing close,
      and watched the surveyors lay out
      a sacred landscape with nothing but cord and sightlines.
      No bronze. No wheel. No beasts of burden.
      Just human backs, human hands,
      and an idea big enough to move earth.
      The mother culture, they would call it —
      everything Mesoamerican that came after
      grew from this plateau.
      I felt it in the ground under my feet:
      a beginning.
    description: "I stood on San Lorenzo's new plateau above the river — platforms and plazas laid out with cord and sightlines, no bronze, no wheel — and felt the beginning of Mesoamerica under my feet."
    status: "first draft"
    sha256: "2dd295d8ffb4dc993c20903f025f6a70f03e261862a9b4645b59c4b2eb79f45e"
  - number: "0690"
    volume: 2
    title: "Hatshepsut Takes Power"
    date: "c. 1485 BCE"
    region: "Egypt"
    poem: |
      The king was dead. The heir was a child.
      So the king's widow did what needed doing:
      she crowned herself pharaoh —
      put on the false beard, the kilt, the crown,
      and ruled Egypt for twenty years.
      And Egypt prospered.
      Trade flourished. Temples rose.
      The kingdom ran better than it had in years.
      I saw her in procession once —
      small, straight-backed, utterly sure —
      and the crowd cheered her
      the way crowds cheer anyone
      who keeps the grain flowing and the peace holding.
      Later kings would try to erase her name.
      They failed — you cannot erase twenty years of good rule
      with a chisel.
      She wore the beard.
      She did the job.
      The beard was the least of it.
    description: "I saw Hatshepsut in procession — the widowed queen who crowned herself pharaoh and ruled twenty prosperous years — and learned the false beard was the least of it; she did the job."
    status: "first draft"
    sha256: "e9dcca7c08a6336cd127a8b912f5f805f284633f0342c97914a1bf20a8e2bf16"
  - number: "0691"
    volume: 2
    title: "The Temple of Deir el-Bahari"
    date: "c. 1475 BCE"
    region: "Egypt"
    poem: |
      She carved it into the cliffs of Thebes —
      terraces rising like a staircase for the gods,
      colonnades of perfect proportion,
      and on the walls, the story of her divine birth:
      the god Amun visiting her mother,
      the child conceived of heaven itself.
      Propaganda? Of course.
      But beautiful propaganda —
      the most beautiful temple in Egypt,
      built by a woman who needed the gods
      to vouch for her right to rule.
      I climbed the terraces at dawn,
      the cliffs glowing red behind the colonnades,
      and the whole building seemed to grow
      out of the rock itself,
      as if the mountain had decided
      to become a temple.
      Hatshepsut's answer to everyone
      who questioned her crown:
      come and see.
    description: "I climbed Deir el-Bahari's terraces at dawn — Hatshepsut's cliff temple glowing red, her divine birth carved on its walls — her answer to everyone who questioned her crown: come and see."
    status: "first draft"
    sha256: "134bf30c040a23890cd65a8a3b49a19845392eb0c937db87374523eef21cde44"
  - number: "0692"
    volume: 2
    title: "The Ships of Punt"
    date: "c. 1475 BCE"
    region: "Egypt"
    poem: |
      Five ships sailed down the Red Sea
      to the land of Punt —
      and came back loaded:
      myrrh trees in tubs, gold, ebony,
      apes chattering on the decks,
      panther skins, incense by the ton.
      Trade as royal theater.
      I watched them unload at Thebes,
      the crowd pressing close to see the apes,
      the myrrh trees planted in the temple courts
      where they grew for years.
      Hatshepsut had it all carved on her temple walls —
      the ships, the cargo, the chief of Punt
      with his enormous wife,
      rendered in careful, curious detail.
      An expedition to the edge of the known world,
      brought home alive —
      trees, animals, gold, and stories.
      The queen's proudest boast,
      written in stone and growing in tubs.
    description: "I watched the Punt ships unload at Thebes — myrrh trees in tubs, chattering apes, gold and incense — trade as royal theater, the queen's proudest boast carved on her temple walls."
    status: "first draft"
    sha256: "9b066be3dc437d76a83f246dbb5edf66b155c69399b47f63b3137d0dd1f3f8e3"
  - number: "0693"
    volume: 2
    title: "Senenmut the Favorite"
    date: "c. 1470 BCE"
    region: "Egypt"
    poem: |
      Born common. Rose to run Egypt.
      Senenmut — the queen's steward, her architect,
      her right hand — his name carved beside hers
      in a hundred places, his statues in the temples,
      his tomb prepared like a king's.
      I met him once, in the corridors of power —
      quick-eyed, quick-tongued,
      the kind of man who remembers every name
      and every debt.
      The gossips said he was the queen's lover.
      Maybe. What I saw was rarer:
      a commoner who earned absolute trust
      from the most powerful woman on earth,
      and used it to build.
      When she fell, he fell —
      his name chiseled out beside hers.
      But the temples he built for her
      are still standing.
      Stone remembers what politics forgets:
      the work was real.
    description: "I met Senenmut in the corridors of power — the common-born steward who rose to run Egypt beside his queen — and learned stone remembers what politics forgets: the work was real."
    status: "first draft"
    sha256: "e368dc1184fb2c9b67b8947849eab868db7ab9cb133c0c057f9b7282028e1980"
  - number: "0694"
    volume: 2
    title: "The Annals of Thutmose III"
    date: "c. 1465 BCE"
    region: "Egypt"
    poem: |
      Year by year, campaign by campaign,
      the scribes carved it on Karnak's walls:
      the march into Syria, the towns taken,
      the tribute counted, the enemies smashed —
      history as temple decoration.
      I read the annals walking the wall,
      and they read like a general's diary
      set in stone: precise, boastful,
      and — the scribes insisted — true.
      Thutmose had waited twenty years
      in his stepmother's shadow.
      When his turn came, he marched every year,
      and the walls of Karnak
      became the longest war report in history.
      Egypt's greatest conqueror,
      writing his autobiography
      on the side of a temple —
      so the gods, and everyone else,
      would know exactly what he did.
    description: "I read Thutmose III's annals walking Karnak's walls — year by year, campaign by campaign — Egypt's greatest conqueror writing his autobiography on a temple so the gods would know."
    status: "first draft"
    sha256: "db6b6001988238ba766c3bb57cf41b7249078f1452fe2fef2d5aa60ce5125982"
  - number: "0695"
    volume: 2
    title: "The Battle of Megiddo"
    date: "c. 1460 BCE"
    region: "Levant"
    poem: |
      The Canaanite kings had gathered at Megiddo —
      a coalition, an army, a walled city on a hill.
      Thutmose took the narrow pass, the dangerous road,
      surprised them, scattered them —
      and then his men stopped to loot the enemy camp
      instead of taking the city.
      Seven months of siege followed.
      I stood on the walls of Megiddo during that siege,
      and I will tell you what the annals do not:
      the looting nearly lost the war.
      The scribes carved the victory.
      They left out the lesson.
      The first battle in history we can date —
      day, month, year, all of it —
      and its moral is as old as war itself:
      take the city first.
      Loot later.
    description: "I stood on Megiddo's walls during the seven-month siege — the first battle we can date — and learned its uncarved lesson: Thutmose's men stopped to loot, so take the city first and loot later."
    status: "first draft"
    sha256: "3a6881408be9bc963d1b70f9f73d36d9e831faa4d2dd9554fccd99553fdb3eac"
  - number: "0696"
    volume: 2
    title: "The Botanical Garden of Karnak"
    date: "c. 1455 BCE"
    region: "Egypt"
    poem: |
      Thutmose came home from Syria
      with stranger spoils than gold:
      plants no Egyptian had ever seen,
      animals from the northern hills —
      and he had them carved on the temple walls at Karnak,
      every leaf, every feather, labeled and lifelike.
      A conqueror's field guide, in stone.
      I walked that chamber — the Festival Hall —
      and it felt like walking through a garden
      that happened to be made of rock:
      strange flowers, odd birds,
      a whole foreign landscape
      preserved in carving.
      Most kings bring home treasure.
      Thutmose brought home botany —
      and four thousand years later,
      his garden is still growing
      on the walls of Karnak.
    description: "I walked Thutmose's stone garden at Karnak — Syrian plants and animals carved wall by wall, a conqueror's field guide — most kings bring home treasure; he brought home botany."
    status: "first draft"
    sha256: "7c2b03b943dddb3f23011128e2083dc6cb194b42b90b8713edc68e305665936b"
  - number: "0697"
    volume: 2
    title: "The Fall of Knossos"
    date: "c. 1450 BCE"
    region: "Crete"
    poem: |
      Fire took the great palace.
      I watched the smoke from the harbor —
      Knossos burning, the grand staircase collapsing,
      the frescoes blackening, the storerooms
      with their Linear A tablets going up like libraries.
      And then the Mycenaeans walked in —
      not as destroyers but as inheritors,
      moving into the half-burned halls,
      setting up their own clerks
      with their own new script, Linear B.
      The dolphins gave way to the swords.
      I had seen it coming since the shaft graves.
      But here is what the fire could not burn:
      the Minoan way of building, of painting, of feasting —
      the Mycenaeans took it all,
      and wore it like a borrowed cloak.
      Conquest is never clean.
      The winners always end up
      dressed in the losers' clothes.
    description: "I watched Knossos burn from the harbor — then the Mycenaeans walked into the half-burned halls as inheritors, wearing Minoan civilization like a borrowed cloak; conquest is never clean."
    status: "first draft"
    sha256: "abe5011ace1b8f72784d5479957f05b3e9455fd2b9da4f451d67c9b7b37eb4f5"
  - number: "0698"
    volume: 2
    title: "The Archer King"
    date: "c. 1445 BCE"
    region: "Egypt"
    poem: |
      Amenhotep boasted — and had it carved —
      that he shot arrows through copper targets
      from a racing chariot, at full gallop,
      and split the target clean.
      Athletics as royal propaganda.
      I watched him practice once, on the parade ground —
      and whatever the carvings claim,
      the man could shoot.
      The arrows flew flat and hard,
      the chariot barely slowing.
      Kings have always needed to be seen doing
      something difficult, something physical —
      proof that the body matches the crown.
      It was theater, yes.
      But it was theater with real arrows,
      and the courtiers watching
      understood the message perfectly:
      the king is strong.
      The king is accurate.
      Do not test him.
    description: "I watched Amenhotep II shoot from a racing chariot — arrows through copper targets at full gallop — athletics as royal propaganda, theater with real arrows and a message the court understood."
    status: "first draft"
    sha256: "d6aabfa125ab723691c65d259c1ad9ce43e3f9365246a73f01438678fb9ada16"
  - number: "0699"
    volume: 2
    title: "The Harpists of Thebes"
    date: "c. 1440 BCE"
    region: "Egypt"
    poem: |
      In the nobles' tombs, the painters showed them:
      blind harpists, seated at the feast,
      singing while the guests drank —
      their songs written on the wall beside them,
      about how life is short and the tomb is long.
      The sound of the New Kingdom, frozen mid-song.
      I stood in one of those tomb chapels,
      and a guide hummed the melody —
      or what he swore was the melody,
      passed down, he said, from his grandfather.
      Probably not. But I closed my eyes
      and listened anyway,
      and for a moment the painted harpist
      was playing, the guests were listening,
      the wine was being poured —
      and three thousand years
      were just a held breath.
    description: "In a Theban tomb I closed my eyes while a guide hummed — the painted blind harpist playing mid-song — and three thousand years became just a held breath."
    status: "first draft"
    sha256: "14e57823d14efad32bd26b2f9fe7b0442e59f8984bbb58168ed22eacc5840243"
  - number: "0700"
    volume: 2
    title: "The King of Alashiya Writes"
    date: "c. 1435 BCE"
    region: "Cyprus"
    poem: |
      The letter arrived in Thebes on a clay tablet:
      "Send me silver, my brother," wrote the king of Alashiya,
      "and copper will follow. You know my copper is good."
      Kings, haggling like merchants.
      I read the tablet in the palace archive,
      and I loved the tone — no threats, no grandeur,
      just two rulers doing business,
      calling each other "brother"
      the way traders call each other friend.
      This was the Bronze Age world-system at work:
      Cyprus had copper, Egypt had silver and gold,
      and the kings themselves handled the accounts.
      Diplomacy, at its root, is trade with better stationery.
      The king of Alashiya understood that.
      His copper was good.
      His letter was better.
    description: "I read the Cypriot king's letter in the Theban archive — \"send silver, brother, and copper will follow\" — kings haggling like merchants, diplomacy as trade with better stationery."
    status: "first draft"
    sha256: "c4720bec3734f45820d6a5ce0c6f5f13466b221f859c9e1ce578f38f1db07df7"
  - number: "0701"
    volume: 2
    title: "The Gold of Wawat"
    date: "c. 1430 BCE"
    region: "Nubia"
    poem: |
      At the desert fortresses, the overseers weighed it:
      Nubian gold, dust and nuggets,
      poured onto the scales in leather bags —
      the tribute that gilded the temples of Thebes.
      I watched a weighing once, at the second cataract fort.
      The scribe called the weights, the guards stood close,
      and the gold — dull yellow in the sacks,
      blazing in the sun when it spilled —
      went north, always north,
      to become leaf on temple doors,
      masks on royal faces,
      the shine of an empire.
      Wawat's hills gave it up, grain by grain,
      and Egypt wore it like sunlight.
      Every golden thing I saw in Thebes
      had been dug by Nubian hands
      from Nubian earth.
      The empire glittered.
      The mines bled.
    description: "I watched Nubian gold weighed at a cataract fortress — dull in the sacks, blazing in the sun — the tribute dug by Nubian hands that gilded every golden thing in Thebes."
    status: "first draft"
    sha256: "013475818dad077af8d99ead48133c819c56b8ec524b1ea63ecaf269af2f638d"
  - number: "0702"
    volume: 2
    title: "Tudhaliya's New Kingdom"
    date: "c. 1425 BCE"
    region: "Anatolia"
    poem: |
      The Hittite empire had stumbled — weak kings, lost lands —
      and then Tudhaliya took the throne
      and rebuilt it the only way empires get rebuilt:
      campaign after campaign, fortress after fortress,
      until Hattusa's writ ran from the mountains to the sea again.
      The empire's second wind.
      I saw his army muster on the Anatolian plateau,
      chariots, infantry, the mountain levies —
      and I thought about how rare this is:
      an empire, given a second life,
      not by luck but by work.
      Most fallen powers stay fallen.
      The Hittites got up.
      Tudhaliya did not invent the empire.
      He re-founded it —
      which is harder, and rarer,
      and the reason his name
      is carved deeper than the kings before him.
    description: "I watched Tudhaliya's army muster on the Anatolian plateau — the Hittite empire's second wind, rebuilt campaign by campaign — re-founding being harder and rarer than founding."
    status: "first draft"
    sha256: "423262549c9aaabcfb00201344de848e40662c46f6cde85792c36a9af2c3b625"
  - number: "0703"
    volume: 2
    title: "The Hurrian Hymn"
    date: "c. 1415 BCE"
    region: "Syria"
    poem: |
      At Ugarit, a scribe wrote music on clay —
      not words about music, but the music itself:
      notes for a hymn to the moon goddess,
      intervals and strings marked in wedge-shaped signs.
      The oldest song we can still play.
      I held the tablet — small, unassuming —
      and a musician friend worked out the notes
      and played it for me on a reconstructed lyre.
      Thirty-four centuries old,
      and it was beautiful.
      A simple melody, a prayer to the moon,
      rising and falling like breathing.
      Every song you have ever loved
      has an ancestor.
      This is one of the oldest we can name —
      and when those strings sounded,
      the distance between then and now
      was exactly one song long.
    description: "I heard the Hurrian hymn played on a reconstructed lyre — notes written on clay at Ugarit, thirty-four centuries old — and the distance between then and now was exactly one song long."
    status: "first draft"
    sha256: "ef39652ba7455078119d8eb4ff1e5560ecfe1b0686b95e84a639522df5cd4f09"
  - number: "0704"
    volume: 2
    title: "The Dream Stela"
    date: "c. 1410 BCE"
    region: "Egypt"
    poem: |
      Prince Thutmose fell asleep in the shadow of the Sphinx —
      the great statue half-buried in sand even then —
      and dreamed the sun-god spoke to him:
      clear my sand from my body, and the crown will be yours.
      He woke, cleared the sand, and took the crown.
      I read his account on the stela he set up
      between the Sphinx's paws —
      and whether the dream was true or convenient,
      he did the work: the sand was cleared,
      the promise kept, the throne taken.
      Kings have always needed stories
      about why the crown is theirs.
      Thutmose's story was a dream —
      which is honest, in its way,
      because every king's claim
      is a dream someone agreed to believe.
    description: "I read Prince Thutmose's dream stela between the Sphinx's paws — the sun-god promising the crown for cleared sand — every king's claim being a dream someone agreed to believe."
    status: "first draft"
    sha256: "7af59aa5c0955330b53e16b8613cbe888f900abb6777c4dae628032ec5766cd0"
  - number: "0705"
    volume: 2
    title: "The Tholos Tombs"
    date: "c. 1405 BCE"
    region: "Greece"
    poem: |
      Beehive tombs, the Mycenaeans called them —
      great domes of stacked stone,
      each ring smaller than the last,
      rising without mortar to a single capstone,
      forty feet over the dead.
      I stood inside one while the builders
      set the last stones, the dome closing above me
      like a stone sky.
      No arch. No keystone trick.
      Just stone, balanced on stone,
      by men who understood weight
      the way birds understand air.
      They built these for kings —
      and the kings have been dust for three thousand years,
      but the domes still stand,
      because the builders built better
      than the kings they buried.
      That is the quiet joke of architecture:
      the tomb outlasts the king,
      and the builder outlasts them both.
    description: "I stood inside a Mycenaean beehive tomb as the dome closed over me — stone balanced on stone without mortar — the builder's quiet joke: the tomb outlasts the king."
    status: "first draft"
    sha256: "9237a3ffc6aa1d9cbc5f32e3745a03ced8d4e40983e5d6516efdbad53e05f83b"
  - number: "0706"
    volume: 2
    title: "The Tablets of Ugarit"
    date: "c. 1400 BCE"
    region: "Syria"
    poem: |
      At Ras Shamra, the scribes of Ugarit
      did something revolutionary and simple:
      they took the idea of the alphabet —
      a sign for each sound —
      and pressed it into clay in wedge-shaped marks.
      Thirty signs. That was all.
      Thirty signs to write everything.
      I watched a young clerk learn them in an afternoon —
      an afternoon! — where cuneiform took years
      and Egyptian hieroglyphs took a lifetime.
      The ABC's Bronze Age ancestor,
      born in a Canaanite port city,
      pressed into clay by merchants' sons
      who needed to write fast and read faster.
      Every letter you are reading now
      descends from those thirty wedges.
      The alphabet was not invented by scholars.
      It was invented by people in a hurry.
    description: "I watched a Ugarit clerk learn thirty alphabet signs in an afternoon — the ABC's Bronze Age ancestor, pressed into clay by merchants' sons in a hurry, the ancestor of every letter you read."
    status: "first draft"
    sha256: "bb0cf622828e3cbea1fd7475b2ef25203dbb8dc9272104dd32f0e8965a49eb31"
  - number: "0707"
    volume: 2
    title: "The Dendra Armor"
    date: "c. 1400 BCE"
    region: "Greece"
    poem: |
      A full suit of bronze plate —
      cuirass, shoulder guards, greaves,
      and a helmet ringed with boar's tusks,
      sliced thin and sewn in rows.
      I watched the smith at Dendra
      fit it onto a chariot lord,
      piece by heavy piece,
      until the man stood encased in shining metal,
      a bronze statue that could walk.
      It weighed as much as a child.
      Fighting in it must have been
      like fighting inside a bell.
      But that was the point.
      The armor was not just protection —
      it was a statement:
      I am the man who can afford
      to wear a fortune into battle
      and walk out again.
      The Bronze Age arms race,
      worn on one man's body.
    description: "I watched a smith fit the Dendra bronze panoply onto a chariot lord piece by piece — a walking fortune in metal, the Bronze Age arms race worn on one man's body."
    status: "first draft"
    sha256: "c2b9c0507e7312e3d91aed5272c3e25361ce289448ab5bc73dbcd896b64b6bba"
  - number: "0708"
    volume: 2
    title: "Amenhotep the Magnificent"
    date: "c. 1395 BCE"
    region: "Egypt"
    poem: |
      A young pharaoh took the throne,
      and Egypt entered its golden age —
      thirty years of peace, palaces, and plenty,
      the empire at its richest, its most splendid,
      its most sure of itself.
      I lived through those years in Thebes,
      and the city shone.
      Gold on the temples, feasts in the streets,
      ambassadors from every kingdom
      crowding the palace courts.
      Amenhotep the Magnificent —
      and for once the title was not flattery.
      He did not conquer much.
      He did not need to.
      He ruled the richest kingdom on earth
      in its richest age,
      and spent the surplus on beauty.
      Peace, it turns out, is the rarest royal achievement.
      He managed thirty years of it.
      No one has topped that in quite the same way since.
    description: "I lived through Amenhotep III's golden age in Thebes — thirty years of peace, palaces, and plenty — and learned peace is the rarest royal achievement, never quite topped since."
    status: "first draft"
    sha256: "e30dc10d31a3e1b66c0afbdb3e70b35229c914a8fa4776331b7a41ca6b66ee8d"
  - number: "0709"
    volume: 2
    title: "The Palace of Malqata"
    date: "c. 1392 BCE"
    region: "Egypt"
    poem: |
      By an artificial lake — dug for the occasion —
      Amenhotep built his pleasure palace:
      painted marsh floors under the king's feet,
      ducks and lotus in bright fresco,
      the ceiling scattered with stars.
      I walked those painted floors
      while the paint was still fresh,
      and the king's architect told me, proudly:
      the whole lake was dug by hand,
      for the view.
      A pleasure palace, unashamed of pleasure.
      No fortress walls. No war rooms.
      Just beauty, and water, and the king's delight.
      Empires at their height build things like this —
      not for defense, not for gods,
      but because they can,
      and because beautiful things
      are reason enough.
    description: "I walked Malqata's painted marsh floors while the paint was fresh — a pleasure palace by a hand-dug lake, built not for defense or gods but because beautiful things are reason enough."
    status: "first draft"
    sha256: "126f0a294a59d6ccadaba3aeb5ca9112ffa81bd87de70d41009f5804ca4adea9"
  - number: "0710"
    volume: 2
    title: "Queen Tiye"
    date: "c. 1388 BCE"
    region: "Egypt"
    poem: |
      A commoner's daughter became the Great Royal Wife —
      and her name was stamped beside the king's
      on scarabs sent across the empire,
      two names, equal weight, everywhere.
      I saw her once, at a palace reception —
      not beautiful in the storybook way,
      but formidable: quick, watchful,
      the kind of woman who hears everything.
      The nobles whispered about her birth.
      She ignored them, and ran Egypt alongside her husband
      for thirty years —
      advising, corresponding with foreign kings,
      outliving Amenhotep and guiding her son.
      Power does not care about your parents.
      Tiye proved it, scarab by scarab,
      until the whole empire knew her name
      as well as it knew the king's.
    description: "I saw Queen Tiye at a palace reception — the commoner's daughter stamped beside the king on scarabs across the empire — and learned power does not care about your parents."
    status: "first draft"
    sha256: "25a2844fcbcea3c94a3d839d476fa16584041a95db6537575db0438eacd07b20"
  - number: "0711"
    volume: 2
    title: "The King's Brothers"
    date: "c. 1380 BCE"
    region: "Syria"
    poem: |
      To seal the peace, the king of Mitanni
      sent his daughter Gilukhepa to Egypt —
      three hundred and seventeen attendants in her train —
      to marry the pharaoh.
      Diplomacy by wedding.
      I watched the princess's caravan arrive at Thebes,
      the Mitanni guards in their bright wool,
      the bride herself veiled and straight-backed,
      carrying the peace of two kingdoms in her dowry.
      She would never see home again.
      That was the price, and everyone knew it —
      a young woman, traded for treaties,
      her marriage the seal on the alliance.
      The kings called each other "brother" after that.
      Brotherhood, sealed with a bride.
      It worked. The peace held.
      But I never forgot the look on her face
      as the caravan passed through the palace gates:
      the cost of diplomacy,
      measured in one person's exile.
    description: "I watched Princess Gilukhepa's caravan enter Thebes — three hundred attendants, a Mitanni bride sealing the peace — diplomacy by wedding, its cost measured in one person's exile."
    status: "first draft"
    sha256: "cf06511b739cb1c4773d4c1ad16f1bf79a05e3938cbe36dea66c5e3cfc4d5544"
  - number: "0712"
    volume: 2
    title: "Dur-Kurigalzu"
    date: "c. 1375 BCE"
    region: "Mesopotamia"
    poem: |
      In the marshes, the Kassite king founded a new capital —
      Dur-Kurigalzu, "Fortress of Kurigalzu" —
      and raised a ziggurat at its heart,
      stepped and massive, standing against the sky.
      I climbed it while the builders
      were still laying the upper courses,
      the marshes spreading green and silver below.
      A new capital, from nothing —
      palaces, temples, walls,
      a whole city willed into being
      by a king who wanted his own foundation,
      not Babylon's hand-me-down.
      It did not last. Few do.
      But for a while, the ziggurat stood
      over the marshes like a promise:
      here begins something new.
      Every age has its new capitals,
      built on hope and mud-brick.
      This one was as hopeful as any.
    description: "I climbed Dur-Kurigalzu's new ziggurat while builders still laid its courses — a Kassite capital willed from marshland, standing over green water like a promise that here begins something new."
    status: "first draft"
    sha256: "19d29657ac6b1c73bddb3ce8d5d883b439e091be2c4dab1de29b70dc4659609c"
  - number: "0713"
    volume: 2
    title: "The Colossi of Memnon"
    date: "c. 1370 BCE"
    region: "Egypt"
    poem: |
      Two statues, sixty feet high,
      Amenhotep twice over, seated,
      guarding his mortuary temple on the Theban west bank —
      quartzite, impossibly heavy,
      staring east at the rising sun.
      I stood in their shadow at dawn,
      and the scale of them made my neck ache.
      Centuries later, one would crack in an earthquake —
      and the Greeks would swear the broken one
      sang at sunrise, a low musical note
      as the stone warmed.
      The singing stopped when an emperor repaired it.
      Typical: fix the statue, kill the song.
      But I heard them new, whole, silent —
      two kings of stone, sixty feet tall,
      and silence was enough.
      Some monuments do not need to sing.
      Their size is the song.
    description: "I stood in the Colossi's shadow at dawn — two sixty-foot Amenhoteps, whole and silent — and learned some monuments need no song; their size is the song."
    status: "first draft"
    sha256: "3a094649bc15e981df41bbf439f1167226aca13e9f30c245e795bff4beb848e6"
  - number: "0714"
    volume: 2
    title: "The Amarna Letters"
    date: "c. 1360 BCE"
    region: "Egypt"
    poem: |
      The tablets arrived from Canaan —
      mayors and petty kings, writing to the pharaoh
      in wedge-shaped script, in Akkadian,
      the diplomatic language of the age:
      "The king's lands are being lost!
      Send troops! Send archers!
      My city is besieged and no one comes!"
      I read them in the archive at Amarna —
      three hundred and more, panic on clay —
      and the pattern was always the same:
      the vassals begging, the pharaoh silent,
      the empire fraying at its edges
      while the king stared at the sun.
      Diplomacy in real time —
      not treaties and marriages,
      but desperate men writing desperate letters
      to a king who had stopped answering.
      The Bronze Age world-system,
      coming apart in its own mail.
    description: "I read the Amarna Letters in the archive — three hundred clay tablets of Canaanite mayors begging for troops — the Bronze Age world-system coming apart in its own mail."
    status: "first draft"
    sha256: "1ac300c2fc4c805ecf156118b1d3ccf54c433f74bfe5758be41bec7cb26471e6"
  - number: "0715"
    volume: 2
    title: "Ashur Rises"
    date: "c. 1355 BCE"
    region: "Assyria"
    poem: |
      Ashur-uballit threw off Mitanni's yoke —
      no more tribute, no more overlords —
      and made Assyria a great power in its own right,
      writing to the pharaoh as an equal:
      "my brother," he called him,
      and meant it.
      The wolf of the north wakes.
      I was in Ashur when the first royal letters
      went out to the great kings —
      Egypt, Babylon, Hatti —
      announcing that Assyria was no one's vassal anymore.
      The other kings were not pleased.
      Babylon protested. Mitanni fumed.
      Ashur-uballit ignored them all
      and married his daughter to Babylon's king
      to seal what swords had won.
      Assyria would become the terror of the age —
      but it began here, with a declaration of independence
      written in the politest diplomatic language,
      backed by the sharpest army in the north.
    description: "I was in Ashur when Ashur-uballit declared independence from Mitanni — the wolf of the north waking, writing to pharaoh as \"my brother,\" politeness backed by the sharpest army in the north."
    status: "first draft"
    sha256: "3f647d6823d7631cb5ff1211cde23c3db9bf9115d39ce719e69db0e579ec7692"
  - number: "0716"
    volume: 2
    title: "Akhenaten's New God"
    date: "c. 1350 BCE"
    region: "Egypt"
    poem: |
      The pharaoh looked at the thousand gods of Egypt
      and chose one: the Aten, the sun's disc,
      its rays ending in little hands, reaching down.
      One god. No others.
      He abandoned Thebes, built a new capital in the desert,
      closed the old temples, chiseled out Amun's name —
      the first monotheist in history,
      or the first fanatic, depending on who you ask.
      I watched the priests of Amun
      pack their temples in silence,
      and I watched the new priests
      raise the open-air altars to the sun.
      It was beautiful, and it was terrible —
      beauty in the hymns, terror in the erasures.
      A king remaking heaven by decree.
      It would not outlast him.
      But the idea — one god, alone, above all —
      would outlast everything.
    description: "I watched Amun's priests pack their closed temples as Akhenaten raised open-air altars to the lone sun-disc — beautiful and terrible, a king remaking heaven by decree, the idea outlasting everything."
    status: "first draft"
    sha256: "f4a6a1177bec0d0d7d1ef8a677c87bef667b2d80d8c3345652d8333448ee70df"
  - number: "0717"
    volume: 2
    title: "The Hymn to the Aten"
    date: "c. 1348 BCE"
    region: "Egypt"
    poem: |
      "How manifold are thy works" —
      the king's own poem to the sun-disc,
      carved on the walls of his nobles' tombs:
      how the sun wakes the world,
      how the birds sing, the fish leap,
      how all life stirs at dawn
      and sleeps when the disc sets.
      The most beautiful religious verse of the age.
      I heard it sung once, at sunrise in Amarna —
      a priest chanting as the light
      poured through the temple's open roof —
      and whatever you think of the king's revolution,
      the poem is true.
      Dawn is dawn. The world does wake.
      The birds do sing.
      Strip away the politics, the closed temples,
      the chiseled names — and what is left
      is a man watching the sunrise
      and finding it holy.
      That part, at least, was real.
    description: "I heard the Hymn to the Aten sung at sunrise in Amarna — \"how manifold are thy works\" — and found beneath the revolution's politics a man watching dawn and finding it holy; that part was real."
    status: "first draft"
    sha256: "2e8eccd74338b90553ea5ac7075eea826916dc4e09c075594f597636a3a51659"
  - number: "0718"
    volume: 2
    title: "The City of Amarna"
    date: "c. 1345 BCE"
    region: "Egypt"
    poem: |
      On virgin desert — no history, no old gods —
      Akhenaten built his capital in a rush:
      palaces, temples, artists' studios,
      wide streets laid out in a few years,
      all of it for one god, the sun-disc.
      I walked Amarna while the plaster was wet.
      The art was different — the king shown
      with his strange long face, his family
      eating and playing like ordinary people,
      the sun's rays ending in hands, blessing everything.
      A whole city, built on an idea.
      It was exhilarating and wrong at once —
      wrong because it starved the rest of Egypt,
      exhilarating because for a moment,
      a king tried to build heaven on earth
      exactly as he imagined it.
      When he died, they abandoned it.
      The desert took it back.
      But I saw it alive —
      and alive, it shone.
    description: "I walked Amarna while the plaster was wet — a whole capital built on virgin desert for one god — exhilarating and wrong at once, and alive, it shone."
    status: "first draft"
    sha256: "0f5471fa6594c01f5be055bd3c6b92d6aa97f9e3ad131fd9a8c923fa807bbd5b"
  - number: "0719"
    volume: 2
    title: "Nefertiti"
    date: "c. 1343 BCE"
    region: "Egypt"
    poem: |
      In a sculptor's workshop at Amarna,
      abandoned in the rush to leave,
      they left a painted bust —
      the queen, her neck long, her eyes lined,
      the famous blue crown on her head.
      A sculptor's model. Never meant to be seen.
      And it became the face of ancient Egypt —
      the most recognized woman of the ancient world,
      known to millions who could not name a single pharaoh.
      I saw her — the real queen, I mean —
      once, in procession: striking, yes,
      but human, blinking in the sun,
      nothing like the perfect bust.
      The bust is better than the woman was,
      which is the sculptor's whole art:
      not to copy life, but to improve it
      just enough that four thousand years later,
      we are still looking.
    description: "I saw the real Nefertiti once in procession — human, blinking in the sun — and learned the abandoned sculptor's model became immortal because art improves life just enough that we keep looking."
    status: "first draft"
    sha256: "50161e7d3fa52d06e1f62041781f05e6af77a2669c17abd2302a6e51ef5410e6"
  - number: "0720"
    volume: 2
    title: "Suppiluliuma the Great"
    date: "c. 1342 BCE"
    region: "Anatolia"
    poem: |
      He took a weakened Hittite kingdom
      and forged an empire —
      Anatolia, Syria, the whole east
      between the sea and the rivers,
      bound to Hattusa by treaty, marriage, and fear.
      The ancient world's new superpower.
      I watched him hold court —
      not a large man, but the room bent toward him
      the way iron bends toward a magnet.
      He played the great game better than anyone:
      Mitanni crushed, Egypt checked,
      vassal kings married into his family,
      every border secured.
      And then the plague came —
      brought home by his own soldiers,
      his own prisoners —
      and it took him, and his son after him.
      The empire he built survived.
      He did not.
      That is the oldest story there is:
      the work outlasts the worker,
      and the plague does not care who you are.
    description: "I watched Suppiluliuma hold court — the room bending toward him like iron to a magnet — forging the Hittite superpower, then taken by the plague his own soldiers brought home; the work outlasted the worker."
    status: "first draft"
    sha256: "7bfa1107e85f1da96a4cee8485aea360ee6a488684b41980e5d1e999b7fb674c"
  - number: "0721"
    volume: 2
    title: "The Baal Cycle"
    date: "c. 1340 BCE"
    region: "Syria"
    poem: |
      At Ugarit, the scribes wrote the storm-god's story
      on clay tablets, in the new alphabet:
      Baal's battles with the sea-god Yam,
      his descent into death's kingdom,
      his return with the rains —
      the whole turning year, as myth.
      Canaan's great epic, in the alphabet's first form.
      I heard it recited at a festival —
      the scribe chanting, the crowd answering —
      and the story did what myths do:
      it made the weather make sense.
      When the rains came, Baal had won.
      When they failed, he was dead again.
      Every culture tells this story,
      the god who dies and rises with the seasons.
      Ugarit's version is the oldest one we can read —
      and reading it, I heard the ancestor
      of every resurrection story
      ever told since.
    description: "I heard the Baal Cycle chanted at a Ugarit festival — the storm-god's death and return with the rains, written in the new alphabet — the oldest readable ancestor of every resurrection story since."
    status: "first draft"
    sha256: "7b518d5c52dd9c0b51997a2eb0f3fec5627f12a43321c86951225bc9b2ce73f9"
  - number: "0722"
    volume: 2
    title: "The Sealed Tomb"
    date: "c. 1325 BCE"
    region: "Egypt"
    poem: |
      A boy king died — nineteen, maybe —
      and they buried him in a hurry,
      in a small tomb meant for someone else,
      crammed with golden shrines, chariots,
      everything a pharaoh needs for eternity,
      packed into rooms too small to hold it.
      Then they sealed it.
      And the seal held — for three thousand years.
      I stood outside that sealed door
      (I never went in; the living should not disturb the sealed)
      and thought about luck:
      the greatest pharaohs were robbed within a generation.
      This minor boy-king, forgotten by history,
      kept everything —
      because his tomb was too small
      for robbers to bother with,
      and too well hidden to find.
      History's most famous tomb
      belongs to its least important king.
      The seal held.
      Luck held.
      That is all it was —
      and all it needed to be.
    description: "I stood outside the sealed tomb of a forgotten boy-king — history's most famous burial belonging to its least important king — and learned the seal held for three thousand years on luck alone."
    status: "first draft"
    sha256: "8579050cea1514f238d6452c5c8bd1c4dfecd1ce5b9e3bd82f4a2f94d332e58d"
  - number: "0723"
    volume: 2
    title: "The Boy King's Dagger"
    date: "c. 1323 BCE"
    region: "Egypt"
    poem: |
      In the wrappings of the boy king's mummy,
      folded against his thigh,
      lay a dagger with an iron blade —
      iron, in the Bronze Age,
      rarer than gold.
      Iron from the sky.
      A meteorite, fallen in the desert,
      hammered into a blade fit for a pharaoh.
      I saw it when the wrappings were opened —
      the blade still bright, the gold hilt,
      the little stone knob —
      and the metallurgists confirmed what the priests knew:
      this metal did not come from any mine.
      It fell from heaven.
      A king, buried with a piece of the sky.
      They could not have known
      that one day iron would replace bronze entirely —
      that the heavens' rare gift
      would become the common metal of the world.
      But they knew it was special.
      You do not bury a boy with ordinary things.
    description: "I saw the iron dagger unwrapped from the boy king's mummy — meteorite metal, rarer than gold, a piece of the sky buried with a pharaoh who could not know iron would one day replace bronze."
    status: "first draft"
    sha256: "74392787c4e15fb1f20e50ea11efdf692808a3cf822bd08787c5ccde358b53d9"
  - number: "0724"
    volume: 2
    title: "Horemheb Restores the Gods"
    date: "c. 1320 BCE"
    region: "Egypt"
    poem: |
      The general took the crown,
      and the first thing he did was tear it all down —
      Akhenaten's temples dismantled, stone by stone,
      the sun-disc's altars smashed,
      Amun's name re-carved everywhere it had been chiseled out.
      The old gods returned to Thebes.
      I watched the workmen pull down the Aten temple at Karnak —
      the very blocks reused as fill
      in Horemheb's own pylons,
      the heretic's stones buried inside the orthodox walls.
      Restoration is also erasure.
      Horemheb restored the gods
      by destroying the memory of the man
      who had tried to replace them.
      Egypt breathed again — the priests, the festivals,
      the old certainties.
      But I walked through the rubble of Amarna's temples
      and thought: the sun still rises every morning,
      whether the king allows it or not.
    description: "I watched Horemheb's workmen dismantle Akhenaten's temples, the heretic's stones buried inside orthodox walls — restoration as erasure — and thought the sun rises whether the king allows it or not."
    status: "first draft"
    sha256: "abfbe0d98dfd90a4101fe48ed40cdad128d904bd8c12a6a7502699ff56c5c1ad"
  - number: "0725"
    volume: 2
    title: "The Plague Prayers"
    date: "c. 1315 BCE"
    region: "Anatolia"
    poem: |
      King Mursili watched the plague take his father,
      then his brother, then his people —
      and he did what kings do when nothing else works:
      he prayed, in writing, on clay,
      tablets and tablets of it,
      begging the gods to lift the sickness from Hatti.
      A king's grief, as a state document.
      I read the prayers in the archive at Hattusa —
      and they are heartbreaking,
      because he is not performing.
      He is bargaining, pleading, reasoning with heaven:
      what did we do? Tell me, and I will make it right.
      He even blamed his father's broken oath —
      the old king's sin, visited on the son.
      The plague did not lift for his prayers.
      Plagues do not work that way.
      But I have never read a more honest document
      from any throne, in any age:
      a king, on his knees, in wedge-shaped script,
      asking why.
    description: "I read King Mursili's plague prayers at Hattusa — a king bargaining with heaven in wedge-shaped script, asking why — the most honest document I have ever read from any throne."
    status: "first draft"
    sha256: "5ee31b8b1a341d192b734db44a81abd65b0948257a315880b94b46faea797ef8"
  - number: "0726"
    volume: 2
    title: "Hattusa, City of Temples"
    date: "c. 1310 BCE"
    region: "Anatolia"
    poem: |
      Thirty temples behind great walls —
      the Hittite capital was a city of gods first,
      a fortress second.
      I entered through the Lion Gate,
      the great beasts flanking the passage,
      and walked streets where every other building
      was a temple, a shrine, a sacred storehouse.
      Sphinxes guarded the gates.
      Bronze doors shone in the mountain sun.
      The king's palace looked over it all —
      but the temples outnumbered everything.
      The Hittites called their land
      "the land of a thousand gods" —
      and they meant it as inventory, not poetry.
      Every vassal's god, every conquered city's goddess,
      brought to Hattusa and given a shrine.
      Empire by inclusion:
      worship whatever you like,
      just do it here, under our roof.
    description: "I entered Hattusa through the Lion Gate into a city of thirty temples — the land of a thousand gods as inventory, every conquered deity given a shrine: empire by inclusion, worshipped under one roof."
    status: "first draft"
    sha256: "6fa96ba1d3069ec137f6ea091b5a8a50cd19a03399ec93a63d2426f5fd5a733e"
  - number: "0727"
    volume: 2
    title: "The Palace of Pylos"
    date: "c. 1305 BCE"
    region: "Greece"
    poem: |
      At Pylos the Mycenaeans built their great hall —
      the megaron, around a central hearth,
      four pillars, a throne against the wall,
      the floor painted, the roof held high.
      And in the storerooms, the clerks —
      counting oil, wine, armor, chariots,
      on clay tablets in Linear B,
      every jar accounted for.
      I sat by that central hearth one winter night,
      the fire throwing shadows on the painted walls,
      and listened to the clerk read the day's totals.
      It was the most bureaucratic palace
      I had ever seen —
      and the most human, too.
      The Mycenaeans get remembered for their swords.
      But Pylos remembers them for their lists —
      and the lists say: these were people
      who counted everything,
      because everything mattered.
    description: "I sat by Pylos's central hearth listening to a clerk read the day's totals — oil, wine, armor, every jar counted — the Mycenaeans remembered for swords, but their lists say everything mattered."
    status: "first draft"
    sha256: "e3f41c3d53ae5c3cb6cde595d9f51b4fd3808612f8652f21b5bcff28e674d720"
  - number: "0728"
    volume: 2
    title: "The Uluburun Shipwreck"
    date: "c. 1300 BCE"
    region: "Mediterranean"
    poem: |
      She went down off the Anatolian coast —
      a merchantman, fifteen meters of cedar,
      carrying ten tons of copper and tin,
      glass ingots blue as the sea,
      ivory, ebony, gold jewelry,
      Canaanite jars, Mycenaean cups —
      the Bronze Age world, in one hull.
      I watched her sail, once —
      low in the water with the weight of it,
      the crew bailing, the captain watching the sky.
      She did not make port.
      The storm took her, and the sea kept her —
      three thousand years on the bottom,
      her cargo intact, her story sealed.
      When they found her, they found
      the whole Bronze Age economy
      in a single wreck:
      copper from Cyprus, tin from Afghanistan,
      glass from Egypt, amber from the north.
      One ship. The whole world.
      That was the Bronze Age:
      everything connected,
      everything afloat,
      everything one storm away from the bottom.
    description: "I watched the Uluburun merchantman sail low with ten tons of copper, tin, and glass — the whole Bronze Age world in one hull — and learned everything was connected, afloat, and one storm from the bottom."
    status: "first draft"
    sha256: "020520e5bd091aaf90506083e652128e3d4bd76e9fb36f0e4f1f62730ca76609"
  - number: "0729"
    volume: 2
    title: "The Towers of Troy"
    date: "c. 1300 BCE"
    region: "Anatolia"
    poem: |
      Sloping walls of dressed stone,
      towers rising over the plain —
      Wilusa, the city the bards would sing,
      at the height of its power.
      I walked those walls at sunset,
      the stone warm under my hand,
      and looked out over the strait
      where every ship between the Aegean and the Black Sea
      had to pass — and pay.
      That was Troy's secret: position.
      Toll-taker of the strait,
      rich on every cargo that moved north or south.
      The bards would sing of Helen, of Achilles,
      of gods quarreling over a city.
      But I stood on the real walls,
      and the real story was simpler:
      a rich city, on a rich strait,
      with walls too strong to take cheaply —
      and everyone in the Aegean
      with a reason to want it taken.
    description: "I walked Troy's sloping stone walls at sunset — Wilusa at its height, toll-taker of the strait — and saw the real story beneath the bards' songs: a rich city everyone had reason to want taken."
    status: "first draft"
    sha256: "5347437178ca9612850badd895e468fad3d24cf6122d34bc855315da14b3dbcb"
  - number: "0730"
    volume: 2
    title: "Seti's King List"
    date: "c. 1295 BCE"
    region: "Egypt"
    poem: |
      At Abydos, Seti carved seventy-six kings
      in order on a temple wall —
      a procession of cartouches,
      each one the father of the next,
      history as liturgy.
      With the awkward names left out.
      I read the list, and I knew what was missing:
      the Hyksos kings — gone.
      Akhenaten — gone.
      Hatshepsut — gone.
      The kings Egypt wanted to forget,
      forgotten in stone.
      History as the king wished it had been.
      But here is the thing about carving lies in stone:
      the stone survives, and so does the lie —
      and three thousand years later,
      we can read exactly what they wanted us to believe,
      which tells us, in its way,
      exactly what really happened.
      The gaps in the list
      are the most honest part of it.
    description: "I read Seti's seventy-six kings at Abydos — the awkward names chiseled out, history as the king wished it — and found the gaps in the list the most honest part of it."
    status: "first draft"
    sha256: "13eca2ce5f2905d8a35dae9ad1c251658b6b805133bd66108df497528a679bee"
  - number: "0731"
    volume: 2
    title: "The Rock Shrine of Yazilikaya"
    date: "c. 1285 BCE"
    region: "Anatolia"
    poem: |
      In a rocky gorge outside Hattusa,
      the Hittite sculptors carved the gods themselves —
      a procession of deities in stone,
      marching along the cliff face:
      storm-gods, sun-goddesses, the whole pantheon,
      life-size, in the living rock.
      An open-air temple, roofed by the sky.
      I walked the gorge at midday,
      the gods marching beside me in the stone,
      and the place hummed —
      not with priests or crowds,
      but with the particular silence
      of somewhere holy.
      No building. No doors.
      Just rock, carved into gods,
      and the sky for a ceiling.
      The Hittites understood something
      the temple-builders sometimes forgot:
      the gods do not need a house.
      Sometimes a gorge, and stone,
      and silence,
      is enough.
    description: "I walked the rock gorge at Yazilikaya at midday — gods carved life-size in the cliff, sky for a ceiling — and learned the gods need no house; sometimes stone and silence are enough."
    status: "first draft"
    sha256: "bf55a3627f6fef9404de8144860fd7f87bf358f11a63045f0019309e6dd35bb9"
  - number: "0732"
    volume: 2
    title: "Pi-Ramesses"
    date: "c. 1280 BCE"
    region: "Egypt"
    poem: |
      Ramesses raised a new capital in the Delta —
      Pi-Ramesses, "the House of Ramesses" —
      docks, arsenals, chariot workshops,
      stables for the war machine,
      all on the eastern Nile,
      facing the direction trouble came from.
      I walked the docks at dawn,
      ships unloading bronze and horses,
      the arsenals hammering before sunrise.
      It was not a holy city like Thebes.
      It was a working city —
      built for war, run like a barracks,
      magnificent in its efficiency.
      The pharaohs had learned from the Hyksos:
      keep your strength in the north,
      where the enemy lands.
      Thebes was for gods and tombs.
      Pi-Ramesses was for chariots —
      and the chariots were the point.
    description: "I walked Pi-Ramesses's docks at dawn — arsenals hammering before sunrise, a working capital built for war facing the direction trouble came from — Thebes for gods, Pi-Ramesses for chariots."
    status: "first draft"
    sha256: "6725d31742a41448c7eabd5873bc7f30d4c34eca6ff869f3eb0c97b30be3f736"
  - number: "0733"
    volume: 2
    title: "The Battle of Kadesh"
    date: "c. 1275 BCE"
    region: "Levant"
    poem: |
      Five thousand chariots at Kadesh —
      the largest chariot battle in history.
      The Hittites lured Ramesses into a trap,
      his army divided, his guard surrounded —
      and he fought his way out,
      alone, by his own account,
      with the god Amun at his side.
      Then he called it victory.
      Had it carved on every temple in Egypt.
      I talked to veterans of that battle —
      Egyptian and Hittite both —
      and the truth was simpler:
      nobody won. Both armies bled.
      Both kings went home
      and told their people they had triumphed.
      The first battle in history
      with both sides' propaganda surviving —
      and reading them side by side,
      you learn the real lesson of Kadesh:
      victory is not what happens on the field.
      Victory is what gets carved on the wall.
    description: "I talked to veterans of Kadesh — five thousand chariots, nobody won, both kings carved triumph — and learned victory is not what happens on the field but what gets carved on the wall."
    status: "first draft"
    sha256: "089f10cd47fd7f9f425427b90dec634947cfd0f5c406147cfeefeaf549feb9a0"
  - number: "0734"
    volume: 2
    title: "The Clay Library of Hattusa"
    date: "c. 1270 BCE"
    region: "Anatolia"
    poem: |
      In the capital's storehouses, the scribes filed everything:
      treaties with vassal kings, omens from sheep livers,
      prayers for the plague to lift —
      and a horse-training manual so detailed
      it reads like it was written yesterday.
      Thousands of tablets, on wooden shelves,
      in rooms built for the purpose.
      I walked between those shelves
      and ran my hand along the tablets' edges —
      the whole memory of an empire,
      in wedge-shaped script, in clay.
      When Hattusa fell, the storehouses burned —
      and the fire baked the tablets hard,
      the way it had at Mari, at Ebla, everywhere.
      The Hittites' library survived
      because their city did not.
      I stood in the ashes of that library
      and understood the bargain of clay:
      write it on something fragile,
      and the fire that destroys everything else
      will save your words forever.
    description: "I ran my hand along Hattusa's shelved tablets — treaties, omens, a horse-training manual — the whole memory of an empire in clay, saved forever by the fire that destroyed the city."
    status: "first draft"
    sha256: "bcf99382fb1115bcfd622b9fde71e97b53c95f06e1625df57889cc9e075fa4d5"
  - number: "0735"
    volume: 2
    title: "Abu Simbel"
    date: "c. 1265 BCE"
    region: "Egypt"
    poem: |
      Ramesses carved four of himself into a Nubian cliff —
      sixty feet high, seated, staring south —
      a temple front that is mostly the king,
      with the gods tucked inside.
      Twice a year, the sun strikes through the doorway
      and lights the inner statues —
      all but Ptah, god of darkness,
      who stays in shadow, as arranged.
      I was there for one of those sunrises,
      the light crawling down the corridor
      to touch the gods' faces —
      astronomy as theater, engineering as worship.
      It was built to intimidate Nubia:
      come south, see the king's face four times over,
      sixty feet tall, and think twice.
      Three thousand years later, they moved the whole mountain
      to save it from the dam's waters —
      cut it apart and rebuilt it, block by numbered block.
      Even moved, it works.
      The sun still finds the gods.
      The king still stares south.
    description: "I watched the sunrise strike Abu Simbel's inner gods — four sixty-foot Ramesseses carved into a Nubian cliff — astronomy as theater, intimidation as architecture, still working three thousand years on."
    status: "first draft"
    sha256: "85b21892da4f1ac2580992f36757bd0fc8dccb8861bced221332e1a9c22ba73e"
  - number: "0736"
    volume: 2
    title: "The First Peace Treaty"
    date: "c. 1260 BCE"
    region: "Anatolia"
    poem: |
      After Kadesh — after the non-victory both sides claimed —
      Ramesses and Hattusili did something
      no great kings had done before:
      they wrote it down.
      Eternal brotherhood, on silver tablets —
      no more war between Egypt and Hatti,
      mutual defense, extradition of fugitives,
      the gods of both lands as witnesses.
      And co-signed by a queen:
      Puduhepa, Hattusili's wife,
      her seal beside her husband's —
      the first woman we know
      to co-sign a treaty between superpowers.
      I saw the clay copy at Hattusa,
      the silver original long gone —
      but the words survived:
      "There shall be no hostility between them forever."
      The oldest surviving peace treaty in the world.
      It held.
      For the rest of both kings' lives,
      the swords stayed sheathed —
      because two men, and one remarkable woman,
      decided that enough was enough.
    description: "I saw the clay copy of the first peace treaty — Ramesses and Hattusili's eternal brotherhood, co-signed by Queen Puduhepa — and learned the swords stayed sheathed because two men and one remarkable woman decided enough was enough."
    status: "first draft"
    sha256: "1a0c04ac0f9f9256b10864caa77a30b59191326fe61852da434d16897e084ea2"
  - number: "0737"
    volume: 2
    title: "The Lion Gate"
    date: "c. 1255 BCE"
    region: "Greece"
    poem: |
      Two lions, carved in stone,
      rearing over the gate of Mycenae —
      their heads are gone now (bronze, probably, stolen long ago),
      but the bodies still guard the passage,
      paws on the altar between them.
      The oldest monumental sculpture in Europe.
      I walked through that gate at dusk,
      the lions looming overhead,
      and felt the whole weight of the citadel
      press down through that single entrance —
      walls of massive stone, the palace above,
      the shaft graves below.
      Every Mycenaean king passed under those lions.
      Every envoy, every trader, every spy.
      It was not decoration.
      It was a warning, carved in limestone:
      this is Mycenae.
      The lions are watching.
      Turn back, or come in knowing
      exactly what you are walking into.
    description: "I walked through Mycenae's Lion Gate at dusk — two headless lions rearing over the passage, Europe's oldest monumental sculpture — not decoration but a warning carved in limestone."
    status: "first draft"
    sha256: "f35c014d1671b18727fea3014941339d6a2115b6d242a520d7a857bec6bf4488"
  - number: "0738"
    volume: 2
    title: "The Oracle Bones"
    date: "c. 1250 BCE"
    region: "China"
    poem: |
      The Shang diviners took turtle shells and ox bones,
      carved a question into the surface —
      "Will the king win this battle?"
      "Will it rain next week?"
      "Should the queen travel?" —
      then pressed a hot brand to the back
      and read the cracks.
      The future, in fractured bone.
      I watched a diviner work at the Shang court,
      the smell of hot shell, the intent silence,
      the crack spreading like a river delta —
      and the king nodding at the reading.
      And then they filed the bones away —
      tens of thousands of them,
      question and answer both inscribed —
      the largest archive of the Bronze Age,
      and China's first writing.
      Not poetry. Not law.
      Questions.
      The oldest Chinese writing we have
      is a record of people asking —
      about war, weather, childbirth, hunts —
      and I find that deeply right:
      writing began, here as everywhere,
      with someone needing to know.
    description: "I watched a Shang diviner read cracks in a heated turtle shell — question carved, future fractured — and found China's first writing was not poetry or law but questions: someone needing to know."
    status: "first draft"
    sha256: "82416024bceef8d7cd8607b3d132e9c3a88edbf879f55b26b3d0d23761e3c570"
  - number: "0739"
    volume: 2
    title: "The Ziggurat of Chogha Zanbil"
    date: "c. 1245 BCE"
    region: "Elam"
    poem: |
      In the Elamite hills, Untash-Napirisha raised it:
      five stories of glazed brick,
      a mountain of gods in the wilderness —
      temples stacked on temples,
      dedicated to the gods of Susa and the highlands both.
      I climbed it at sunset,
      the glazed bricks catching the light —
      blue, green, gold —
      and from the top, the hills rolled away
      in every direction, empty except for the priests' town below.
      A holy city, built for no one but the gods —
      no trade, no strategy, just devotion
      piled five stories high.
      It was never finished.
      The king died, the work stopped,
      and the mountain stood half-dressed in glaze,
      waiting.
      Three thousand years later, it is still waiting —
      the best-preserved ziggurat on earth,
      a prayer interrupted,
      and beautiful for it.
    description: "I climbed Chogha Zanbil's five glazed stories at sunset — a mountain of gods in the Elamite hills, never finished, a prayer interrupted and beautiful for it, still waiting three thousand years on."
    status: "first draft"
    sha256: "5299ced85f57372ba764e83648b97857eba3fbcfad325714cba185fbd8cb84b5"
  - number: "0740"
    volume: 2
    title: "The Copper Mines of Timna"
    date: "c. 1240 BCE"
    region: "Levant"
    poem: |
      In the Arabah desert, Egyptian miners
      dug the copper out of the red rock —
      shafts and galleries in the furnace heat,
      donkeys hauling ore to the smelters,
      the slag heaps growing year by year.
      And among the slag heaps, a temple —
      small, rock-cut, dedicated to Hathor,
      goddess of miners and of love,
      her face carved on the pillars.
      I descended one of those shafts at noon,
      the heat like a hand on my throat,
      and understood what the temple was for:
      when the work can kill you,
      you pray where you work.
      The miners left their offerings —
      a carved figurine, a bead, a prayer scratched on stone —
      and went back down into the heat.
      Copper for the empire.
      Hathor for the miners.
      Everyone got what they needed,
      except the ones the mines kept.
    description: "I descended a Timna copper shaft at noon — furnace heat, slag heaps, and a rock-cut temple to Hathor among them — because when the work can kill you, you pray where you work."
    status: "first draft"
    sha256: "efe93dbbb0637af3876959891bb25cf6258217bfc91c2f16f7aada51f648da9f"
  - number: "0741"
    volume: 2
    title: "The Treasury of Atreus"
    date: "c. 1235 BCE"
    region: "Greece"
    poem: |
      Forty-five feet of stacked stone,
      rising to a single capstone —
      the grandest tomb of the Bronze Age,
      built for a Mycenaean king
      whose name the bards gave to legend.
      I stood inside it at midday,
      the dome soaring over me,
      the doorway framed in carved stone —
      and the scale of it silenced me.
      No mortar. Just stone, cut true,
      each ring leaning on the last,
      holding for three thousand years
      by weight and geometry alone.
      They called it the Treasury of Atreus —
      not a treasury at all, but a tomb,
      robbed in antiquity, empty when found.
      Empty, and still magnificent.
      The king is dust.
      The gold is gone.
      But the dome stands —
      because the builders knew something
      the kings never learned:
      how to make something last.
    description: "I stood inside the Treasury of Atreus at midday — forty-five feet of mortarless stone, robbed and empty, still magnificent — the builders knowing what kings never learned: how to make something last."
    status: "first draft"
    sha256: "5f7ab20ba264a26816c28e95b32ee054ebeb62cc674d0c159262d933da33ebe7"
  - number: "0742"
    volume: 2
    title: "The Stele That Names Israel"
    date: "c. 1208 BCE"
    region: "Egypt"
    poem: |
      Merneptah carved his victories in stone —
      Libyans beaten, Canaanite cities taken —
      a list of the smashed and subdued,
      in the usual pharaonic style.
      And buried in the list, one line:
      "Israel is laid waste, his seed is not."
      The first time the name appears in history.
      I read it at Thebes, running my finger along the hieroglyphs —
      a people, named as defeated,
      in a victory inscription.
      Merneptah was boasting.
      Pharaohs always boasted.
      But the boast backfired across three thousand years:
      the "wasted" people survived —
      survived Egypt, survived everything —
      and the stele meant to proclaim their end
      became the proof of their beginning.
      The first mention of Israel in history
      is an Egyptian king claiming to have destroyed it.
      History has a sense of humor.
      It is not always kind,
      but it is always exact.
    description: "I traced the hieroglyphs at Thebes — \"Israel is laid waste\" — the first time the name appears in history, an Egyptian boast of destruction become, three thousand years on, the proof of a beginning."
    status: "first draft"
    sha256: "f85443747041207bac2b37860045a6b12ca20d64fa2959bc8f23830fa72dce07"
  - number: "0743"
    volume: 2
    title: "The Tomb of Fu Hao"
    date: "c. 1200 BCE"
    region: "China"
    poem: |
      She led armies into battle —
      Fu Hao, queen of the Shang king Wu Ding,
      general of campaigns against a dozen enemies,
      her name on the oracle bones
      as commander, again and again.
      And when she died, they buried her
      like the warrior she was:
      bronze vessels by the hundred,
      jades, ivories, cowries —
      and sixteen sacrifices,
      to serve her in the world beyond.
      Her tomb was never robbed.
      I stood at its edge when it was opened —
      the bronzes still bright, the jades still green,
      three thousand years untouched.
      A woman who led armies,
      buried with full military honors,
      in an age when the history books
      barely mention women at all.
      The oracle bones remember her victories.
      The tomb remembers her wealth.
      But I remember the simplest fact:
      she fought, she won, she was honored —
      and the earth kept her secret
      until we were ready to hear it.
    description: "I stood at the unrobbed tomb of Fu Hao — Shang queen and general, bronze vessels by the hundred, jades still green — a woman who led armies, honored in an age whose books barely mention women."
    status: "first draft"
    sha256: "7a5dfec98445496bd59f0507ae2232f37dc28ee07d8b47b8415a1b2c02c487cc"
  - number: "0744"
    volume: 2
    title: "After the Storm Ships"
    date: "c. 1199 BCE"
    region: "Egyptian Delta"
    poem: |
      I stood in the reeds at the river's mouth
      and watched the war ships burn down to the waterline.
      The raiders came from the north with bronze and thunder,
      and the river swallowed their thunder whole.
      Now the smoke thins. Now the small boats come back,
      men with nets where yesterday were spears.
      I helped haul a rope. Nobody sang yet —
      but the gulls were screaming like nothing had happened,
      and that felt like mercy.
    description: "At the Nile's mouths, the morning after the Sea Peoples' defeat, fishermen quietly take back the water the war fleets had stolen."
    status: "first draft"
    sha256: "01dc0d278ca39bebb78e1d2108a1ce16156f5edaed3e3f6563bf92a725cd7646"
  - number: "0745"
    volume: 2
    title: "Five Cities on the Sand"
    date: "c. 1196 BCE"
    region: "Canaan Coast"
    poem: |
      They came off the ships with their feathered helmets,
      tall strangers with sea-salt in their beards,
      and they did the strangest thing conquerors do:
      they stayed.
      I walked with a family to Ashkelon,
      helped them stack stones for a house wall.
      The father hung his helmet on a peg by the door
      like a man hanging up a coat he won't wear again.
      Five cities. Five hearths. They stopped being raiders
      and started being neighbors, which is harder.
    description: "Philistine Sea Peoples settle the five coastal cities — Ashdod, Ashkelon, Gaza, Ekron, Gath — trading their raider helmets for house walls and hearths."
    status: "first draft"
    sha256: "035c6dbdbad3023e17cb6c1aeb4e02a58f359d5b2091ecff605dcd2e86a7654c"
  - number: "0746"
    volume: 2
    title: "Villages in the Hills"
    date: "c. 1193 BCE"
    region: "Canaan Highlands"
    poem: |
      Up in the highlands I carried stones with them,
      small square stones for small square houses,
      and watched them cut steps into the hillside
      so the winter rain wouldn't steal the barley.
      No palaces up here. No kings yet.
      Just smoke from a hundred new chimneys
      rising through the olive trees at dusk.
      I ate bread baked in a clay oven
      and it tasted like the beginning of something.
    description: "In the Canaan highlands, Israelite families build stone houses and terraced fields — quiet new villages rising where no kingdom has stood."
    status: "first draft"
    sha256: "827eb19976ce19dbc8f182932d95014d04605cb4e0b1fe13a0be93e3c02e7e32"
  - number: "0747"
    volume: 2
    title: "The Libyans Stay"
    date: "c. 1190 BCE"
    region: "Egyptian Delta"
    poem: |
      They came as mercenaries with spears for Pharaoh,
      desert men with sun-dark faces and strange oaths.
      But the war ended and the pay ran out,
      and Egypt was green and the Nile was generous,
      so they stayed.
      I watched a Libyan soldier marry a Delta girl,
      watched him learn to read the flood like a farmer,
      his spear rusting in the corner of the hut.
      Empires hire swords. The land keeps the men.
    description: "Libyan soldiers hired by Pharaoh put down their spears, marry Egyptian women, and become Delta farmers — the land absorbing its own invaders."
    status: "first draft"
    sha256: "ade415bae1e7cce97fb91940d123f253f176f79323db4af3b63d1ae519519739"
  - number: "0748"
    volume: 2
    title: "Ugarit's Silent Harbor"
    date: "c. 1188 BCE"
    region: "Syria"
    poem: |
      I knew that harbor when it roared —
      a hundred masts, ten languages at the docks,
      cedar and copper and purple changing hands by the ton.
      I came back and it was a field of gulls.
      An old man sat mending a net too small for the sea he remembered.
      "Smaller boats now," he said, and did not complain.
      He cast off at dawn alone, the way men do
      when the world has gotten too big to fix
      and just big enough to fish in.
    description: "The great trading port of Ugarit lies ruined, and an old fisherman mends his nets for smaller boats — commerce shrunk to what one man can carry."
    status: "first draft"
    sha256: "9785f6ab83bf2116556894f2be3511865da263a92a6ce1dc1263747d53fc5bed"
  - number: "0749"
    volume: 2
    title: "Smiths Move Inland"
    date: "c. 1185 BCE"
    region: "Cyprus"
    poem: |
      The coast burned, so the smiths walked uphill.
      I walked with them, my pack full of another man's tools,
      up the goat tracks into the pine-scented hills.
      They built new forges from fieldstone,
      roofed them with branches, and were hammering by week's end.
      A forge is not a place, one told me —
      it's a fire and a man who knows the fire.
      The sea can take the town. It can't take that.
    description: "Cypriot coppersmiths flee the burned coast and rebuild their forges in the hill villages — craft surviving where cities could not."
    status: "first draft"
    sha256: "463add6d318f6cc0a402583ca48f89ffbe3b29e54c84d1c70f36362c0f2eb1ae"
  - number: "0750"
    volume: 2
    title: "Sheep in the Palace Court"
    date: "c. 1182 BCE"
    region: "Greece"
    poem: |
      The great walls of Mycenae still stand —
      I leaned against stones no ten men could lift —
      but the courtyard belongs to sheep now.
      A shepherd boy whistled through his teeth
      and the flock drifted past the fallen column drums
      like clouds past a mountain.
      Kings once feasted in that hall.
      Now a lamb nibbles grass between the flagstones,
      and honestly, the grass doesn't care who owned it.
    description: "Shepherds graze their flocks in the empty courtyard of fallen Mycenae — the great walls stand, but the kings are gone and the sheep don't mind."
    status: "first draft"
    sha256: "9bcfed94f1d4c58b36639cca6edc961f5970d673fabf16e5f1011351a55d6288"
  - number: "0751"
    volume: 2
    title: "New Plows at Gordium"
    date: "c. 1180 BCE"
    region: "Anatolia"
    poem: |
      The Hittites are gone from the high plateau —
      their granaries are hollow, their seals are dust —
      but the terraces they cut are still good.
      I watched Phrygian settlers walk those old stone steps
      with seed baskets on their backs,
      sowing wheat where emperors once taxed it.
      The land doesn't mourn. The land just waits
      for the next hands willing to work it.
      I bent and helped. The soil was cold and willing.
    description: "Phrygian settlers sow wheat on the abandoned terraces of the fallen Hittite heartland — the land outlasting every empire that farmed it."
    status: "first draft"
    sha256: "87e06c5de8ff2c80ae031459d72101eb37c7a8b54a75b66e700d8c46cbfb3771"
  - number: "0752"
    volume: 2
    title: "The Mushki Come Down"
    date: "c. 1178 BCE"
    region: "Anatolia"
    poem: |
      They came down out of the high mountains,
      the Mushki, with their shaggy herds and bone whistles,
      driving cattle through the broken gates of Hattusa
      as if the city had been built for them all along.
      I stood in the ruins of the great temple
      and watched a herder's child chase a goat
      across the threshold where kings once bowed.
      History doesn't always march.
      Sometimes it just wanders downhill with the livestock.
    description: "Mountain tribes drive their herds into the valleys of ruined Hattusa — the Hittite capital inherited by shepherds and goats."
    status: "first draft"
    sha256: "5a5010c3f3f0522aca16ffbd2575e1b295d65597bc514228e355783d23762cdb"
  - number: "0753"
    volume: 2
    title: "Battle of the Delta"
    date: "c. 1177 BCE"
    region: "Egyptian Delta"
    poem: |
      I was on the riverbank when Ramesses struck —
      Egyptian ships sliding out of the reeds like crocodiles,
      archers loosing from the decks in sheets.
      The Sea Peoples came in their tall ships
      and the Nile closed over them.
      I saw a feathered helmet spinning in the current,
      saw men who'd burned half the known world
      learn what every raider learns at the end:
      the river doesn't negotiate.
      Egypt held. That day, Egypt held.
    description: "Ramesses III's archers and ships destroy the Sea Peoples' fleet at the Nile mouths — the battle that stopped the Bronze Age collapse at Egypt's door."
    status: "first draft"
    sha256: "902dd1687d7c5eecf26f5a33a3fa790dbe7e037cb8bf2eb9ed7ceb1a5b25f4b4"
  - number: "0754"
    volume: 2
    title: "Mothers Count the Living"
    date: "c. 1175 BCE"
    region: "Levant"
    poem: |
      After every war I've walked through,
      it's the women who do the true accounting.
      I sat with them in the hill villages
      as they named the names — who came home, who didn't —
      fingers moving like beads on a string of grief.
      Then they planted extra lentils.
      Not hope, exactly. Something tougher than hope:
      the decision to feed whoever is left.
      I have seen empires fall for less reason
      than a mother's refusal to let winter win.
    description: "In Levantine hill villages, women tally the war's survivors and plant extra lentils for winter — grief converted, stubbornly, into next spring's food."
    status: "first draft"
    sha256: "3b7b1aec305a0f1946edd8c776fd4921eccc26568a1314cb4bb04d4cd91395e4"
  - number: "0755"
    volume: 2
    title: "The Workmen's Village Endures"
    date: "c. 1173 BCE"
    region: "Egypt"
    poem: |
      At Deir el-Medina the orders slowed to a trickle —
      no more gold from the palace, no more grand commissions —
      but the carvers kept carving.
      I watched an old man teach his grandson the chisel angle
      for a hieroglyph he'd cut ten thousand times.
      "Pharaohs come and go," he said, not looking up.
      "The stone remembers the hand, not the king."
      They were right to keep working.
      The tombs they finished outlasted every throne.
    description: "At Deir el-Medina, the tomb-builders keep carving through the palace's decline — craft outlasting the kings who commissioned it."
    status: "first draft"
    sha256: "be3f250da3e7265ae89ba224ed410f3f3c43f8dc13e4ead6d90829aa9184b8a7"
  - number: "0756"
    volume: 2
    title: "Gold Road South"
    date: "c. 1168 BCE"
    region: "Nubia"
    poem: |
      The forts are ruins, the garrisons are gone,
      but the donkeys still walk the old road north,
      bells on their necks, gold dust in the saddlebags,
      ebony logs swaying on either side.
      I fell in with a caravan at the second cataract
      and walked ten days through heat like a hammer.
      The driver told me the road never really closed —
      only the soldiers left. The trade stayed,
      because gold doesn't care who's afraid,
      and hunger doesn't care who's king.
    description: "Donkey caravans carry Nubian gold and ebony north past the ruined Egyptian forts — trade surviving the soldiers who once guarded it."
    status: "first draft"
    sha256: "ae6f94130eda630a4ca272c37f5db54067d4be591c0d130609c6f77bd11bd279"
  - number: "0757"
    volume: 2
    title: "Byblos Builds Again"
    date: "c. 1165 BCE"
    region: "Levant Coast"
    poem: |
      The great ships are gone, but the cedar still grows,
      and a shipwright I knew — hands like old rope —
      was laying a keel for a small coaster,
      just big enough for the Egypt run.
      "Smaller now," he said, sighting down the timber.
      "But she'll float."
      I helped him drive the first pegs.
      There is a particular sound a hammer makes
      when a town decides to live again,
      and I have never loved any music more.
    description: "Byblos shipwrights lay cedar keels for small coasting vessels — the great age of merchant fleets reduced to one honest boat at a time."
    status: "first draft"
    sha256: "446287ce7081672cb13cc0ab56c5e46c5b8cd8a4b862599dd139ede63f7d7b41"
  - number: "0758"
    volume: 2
    title: "Huts of Wattle and Clay"
    date: "c. 1163 BCE"
    region: "Italy"
    poem: |
      On the Tuscan hilltops I helped raise the walls —
      wattle woven between oak posts,
      daubed thick with clay and straw,
      thatch combed over the top like hair.
      Round huts. Simple. Honest.
      A child asked me if the house would fall down.
      I told her the truth: everything falls down eventually,
      but a house you built with your own hands
      falls down slower, and you know how to raise it again.
      She seemed satisfied with that.
    description: "Villanovan families raise round wattle-and-daub huts on Tuscan hilltops — the humble beginning of what will become Etruria."
    status: "first draft"
    sha256: "d4cd3a72d9fcd23ab654df666d8c9db7a75d2fdbcd48573f6e490a1725089337"
  - number: "0759"
    volume: 2
    title: "The Potter's Zigzag"
    date: "c. 1160 BCE"
    region: "Greece"
    poem: |
      She was just a village potter, hands brown with slip,
      and she was bored of the old patterns —
      so she painted a bold black zigzag
      running wild around the belly of a water jar.
      I was there. I saw her step back and grin.
      She didn't know she'd just invented a style
      that would cover a thousand jars across a hundred villages.
      She only knew it looked right.
      That's how art starts: one woman, one jar,
      one line that refuses to stay straight.
    description: "A Greek village potter paints bold zigzags on a water jar — the birth of a new decorative style, invented in a moment of joyful boredom."
    status: "first draft"
    sha256: "762b1b542a868551b79e4cc8f6f866f97c78259ba6da80eb09e2d06476911984"
  - number: "0760"
    volume: 2
    title: "Silver from Tartessos"
    date: "c. 1160 BCE"
    region: "Iberia"
    poem: |
      Past the Pillars of Heracles the sea gets serious —
      gray water, big weather, no turning back.
      I sailed it with traders bound for Tartessos,
      where the river mines run silver like veins in an arm.
      We loaded ingots till the hull groaned,
      and the captain laughed into the wind:
      "The east wants silver, the west has mountains —
      we're just the men in the middle, getting rich."
      The middle is where history happens.
      I was there to see it glitter.
    description: "Traders sail beyond the Pillars of Heracles to load Tartessian silver — the far west's mines feeding the east's hunger for metal."
    status: "first draft"
    sha256: "42f730234e749f21c518dd2d88936a5b9121391b734307a237e8d90b36094bc9"
  - number: "0761"
    volume: 2
    title: "A Child's Clay Toy"
    date: "c. 1158 BCE"
    region: "Levant"
    poem: |
      While the potter threw jars for the market,
      her daughter sat in the corner with the scraps
      and shaped a tiny horse — four stubby legs,
      a mane pinched with small fierce fingers —
      for her little brother, who crowed with delight.
      I have seen colossal statues raised to kings.
      I have seen temples gilded till they hurt the eyes.
      Nothing I ever saw in any of it
      was as perfectly made as that lopsided clay horse,
      loved before it was even dry.
    description: "A potter's daughter shapes a tiny clay horse for her little brother — the smallest, most human artifact of the age, made purely from love."
    status: "first draft"
    sha256: "39122bdc3985978458a2f5e58f1386125ccec98b81767f6b8d8d6d1963a75b6c"
  - number: "0762"
    volume: 2
    title: "The Purple Vats"
    date: "c. 1155 BCE"
    region: "Phoenicia"
    poem: |
      I stood downwind of the dye works and nearly wept —
      ten thousand murex shells cracked open,
      boiled down to a stinking liquor,
      all for one cloak.
      One cloak, the color of dried blood and sunset,
      worth more than the house it was dyed behind.
      The dyer's arms were purple to the elbow.
      He held up the cloth and it caught the light
      like the sea at evening, and I understood:
      some colors aren't colors. They're power
      you can wear.
    description: "Phoenician dyers boil thousands of murex shells to stain a single cloak Tyrian purple — the most laborious luxury color in the ancient world."
    status: "first draft"
    sha256: "9594a67d2f4b12b87053b28011a3c3ebe2faaaa7cfb8e6bac9ca34a0dc747dfa"
  - number: "0763"
    volume: 2
    title: "Iron Comes Quietly"
    date: "c. 1153 BCE"
    region: "Levant"
    poem: |
      No trumpets. No ceremony.
      Just a smith in a dim forge, frowning at a gray lump,
      hammering, quenching, hammering again —
      and the edge held.
      Longer than bronze. Harder than bronze.
      He tested it on a bronze chisel and the bronze lost.
      He looked up at me with the strangest expression,
      half triumph, half fear, like a man who's just
      picked up a weapon he doesn't fully understand.
      He was right to be afraid. It changed everything.
      But that day, it was just a quiet forge,
      and a sharper edge, and the future arriving unannounced.
    description: "A Levantine smith hammers out iron's first tools — a gray metal that holds an edge longer than bronze, arriving without fanfare and changing everything."
    status: "first draft"
    sha256: "6b24ed3f7ee95d19ff89e1d975ff26dbc1c3571fc984c8802eb85e7137490f1c"
  - number: "0764"
    volume: 2
    title: "Priests of Amun Rise"
    date: "c. 1150 BCE"
    region: "Egypt"
    poem: |
      At Thebes I watched the procession —
      the golden barque of Amun carried shoulder-high,
      priests chanting, crowds kneeling in the dust —
      and behind it all, the High Priest counting.
      Counting grain, counting gold, counting land,
      till the temple owned more than the crown.
      Pharaoh still wore the double crown.
      But the men who fed the god were feeding themselves first,
      and everyone in Thebes knew it.
      Power doesn't always wear a crown.
      Sometimes it wears a leopard skin and keeps the books.
    description: "At Thebes, the temple of Amun grows richer than the weakening Pharaoh — priestly power quietly eclipsing the crown."
    status: "first draft"
    sha256: "cdbba97682167d8f2d30b9e8ab06fac2f97c225b3001248c523b2695fc292963"
  - number: "0765"
    volume: 2
    title: "Arameans on the Euphrates"
    date: "c. 1148 BCE"
    region: "Syria"
    poem: |
      At the river bends I sat with the Arameans —
      tent-dwellers, camel men, their flocks spread
      across the grass like spilled milk.
      They watered their camels at dusk
      and traded wool for grain with the river towns,
      easy, unhurried, the way people do
      when nobody's taxing them yet.
      A boy offered me dates. His father offered me news:
      the old cities are hiring shepherds as soldiers now.
      I thought about that all the way downriver.
      The desert always sends its children to inherit.
    description: "Aramean tent-dwelling clans water their camels at the Euphrates bends and trade wool for grain — nomads quietly becoming the region's future."
    status: "first draft"
    sha256: "e868ba14e8818b25a23d679d08a8e503b70f3c656de15375817b03c28693992e"
  - number: "0766"
    volume: 2
    title: "Tablets Copied by Lamplight"
    date: "c. 1145 BCE"
    region: "Mesopotamia"
    poem: |
      In the temple school the lamps burned late,
      and the young scribes bent over fresh clay,
      copying the old Sumerian epics line by line —
      Gilgamesh, the flood, the gods' great quarrels —
      because the old tablets were crumbling
      and somebody had to remember.
      I watched a boy press his stylus carefully,
      tongue between his teeth, getting every wedge right.
      Three thousand years later, we'd still be reading his homework.
      That's what a scribe is: a man building a bridge
      out of mud, across an ocean of forgetting.
    description: "Babylonian scribes copy crumbling Sumerian epics onto fresh clay by lamplight — the quiet labor that carried Gilgamesh across three thousand years."
    status: "first draft"
    sha256: "01534015c2401593004b9b85837fd30ad76d7d59c1d824c6c000bb6b3985c2a6"
  - number: "0767"
    volume: 2
    title: "Cedar for Pharaoh"
    date: "c. 1143 BCE"
    region: "Levant"
    poem: |
      The loggers worked the high Lebanese slopes,
      felling cedars straight as temple columns,
      trimming them, lashing them into rafts,
      and floating them down to the sea
      where Egyptian ships waited with open holds.
      I walked beside a timber train for a day —
      the smell of fresh-cut cedar is something
      I can still summon, centuries later,
      and it still smells like wealth, and work,
      and the long green road between mountain and throne.
    description: "Lebanese loggers float cedar trunks down to Egyptian dockyards — the ancient timber trade that built Pharaoh's ships and temples."
    status: "first draft"
    sha256: "6d6706a42c7fc411218b659850d5d57d4eb397c429a8378416d21eea3c6c4ace"
  - number: "0768"
    volume: 2
    title: "Iron in the Village Forge"
    date: "c. 1140 BCE"
    region: "Cyprus"
    poem: |
      The smith beat the gray metal flat and hot,
      folded it, beat it again, and set it in the plow —
      a share that bit the stony Cypriot soil
      and didn't chip, didn't bend, didn't quit.
      "Three bronze ones," he told me, wiping his brow,
      "that's what this one will outlast. Three."
      His neighbor's boy ran the plow down the furrow
      and turned to grin at us, mud to the knees.
      Nobody cheered. Nobody understood yet.
      But the field that day grew a little larger,
      because the tool had finally caught up with the hunger.
    description: "A Cypriot smith beats iron into a plowshare that outlasts three bronze ones — the quiet agricultural revolution starting in a village forge."
    status: "first draft"
    sha256: "23a57d9368a125fb367a551aa4df2f75db1d21debf837d30b3b961958ff62942"
  - number: "0769"
    volume: 2
    title: "Pit Houses at Nichoria"
    date: "c. 1138 BCE"
    region: "Greece"
    poem: |
      They dug their houses into the Messenian earth —
      round pits, timbered over, thatched against the rain —
      and stored the harvest in jars tall as a man.
      I slept in one on a cold night,
      the earth walls holding the day's warmth
      like a hand around a cup.
      The woman of the house fed me barley porridge
      and showed me the grain jars, proud as a queen
      showing crown jewels.
      She was right to be proud.
      Full jars are the only treasure that matters.
    description: "Greek villagers at Nichoria dig round pit houses into the earth and store grain in great jars — humble, warm, and rich in the only way that counts."
    status: "first draft"
    sha256: "cc712aa84dba49dc7ce7b78b84f9c9bbbc08f485a1de089fac55487673ba7cd4"
  - number: "0770"
    volume: 2
    title: "Hymns of the Families"
    date: "c. 1135 BCE"
    region: "India"
    poem: |
      At dawn the priest stood facing the east,
      and the hymn came out of him like breath —
      praise to Dawn herself, rosy-fingered,
      praise to Fire, the guest in every house —
      words his father gave him, and his father's father,
      never written, never once misremembered.
      I listened from the edge of the firelight
      as the syllables fell into their ancient grooves.
      Memory was their scripture.
      And it worked: the hymns I heard that morning
      are still being chanted, three thousand years on,
      by men who never met that priest —
      but know his voice by heart.
    description: "Vedic priests chant hymns to dawn and fire, passed father to son by memory alone — an oral scripture still sung three millennia later."
    status: "first draft"
    sha256: "76e431d14776cde3b68b6230a56760a0d8fd52ece937a92147c5addfb39e5953"
  - number: "0771"
    volume: 2
    title: "Chalk Hill Forts"
    date: "c. 1133 BCE"
    region: "Britain"
    poem: |
      On the chalk downs they ringed the hilltops —
      ditches dug deep, timber walls on the ramparts,
      gates guarded, beacon wood stacked and ready.
      I climbed up with the work gangs,
      chalk dust white on my hands and boots,
      and looked out over the green rolling country.
      "Against raiders," the chief said, not meeting my eye.
      He didn't say which raiders. Nobody ever does.
      Fear builds faster than friendship,
      and a wall is just a worry made of timber.
    description: "Britons ring their hilltops with ditches and timber walls — the chalk downs bristling with forts against raiders no one will name."
    status: "first draft"
    sha256: "4fced0879bf617689cf2d23558d554eb3a2ef86ce6a49f8409a81dd608a82fc9"
  - number: "0772"
    volume: 2
    title: "Ashur's Young King"
    date: "c. 1130 BCE"
    region: "Assyria"
    poem: |
      He was barely more than a boy when they crowned him,
      the circlet too big for his head, the robes pooling at his feet —
      but his eyes were already on the horizon.
      I stood in the court at Ashur and heard him tell his generals:
      "My father held the city. I will hold the sea."
      The old men smiled behind their beards.
      They shouldn't have. Boys with maps grow up,
      and this one's maps were already drawn in blood.
      Assyria was about to remember what it was for.
    description: "A boy-king takes Assyria's throne dreaming of pushing its borders to the sea — the old courtiers smile, not knowing what they've crowned."
    status: "first draft"
    sha256: "7e00764b75ec7461ba8d9c2bad744c6c8e9e1c08c95ae3165aaeb1adbb7edae4"
  - number: "0773"
    volume: 2
    title: "Incense for the Gods"
    date: "c. 1128 BCE"
    region: "Nubia"
    poem: |
      In the rock shrines at Napata the priests
      laid frankincense on the coals before Amun,
      and the smoke rose thick and sweet,
      curling up through the shafts of morning light.
      I knelt in the back, unworthy and welcome,
      and breathed it in — resin, heat, and devotion,
      the smell of men trying to speak to heaven
      in the only language they were sure the gods understood.
      The gods, I suspect, understood the trying.
      That was always the real offering.
    description: "Nubian priests burn frankincense before Amun at Napata's rock shrines — smoke rising as the oldest language between men and gods."
    status: "first draft"
    sha256: "bc12e48dbbcf6da7541de638cd289b4340b6e40861708621bc8b60c00741dd5a"
  - number: "0774"
    volume: 2
    title: "The Alphabet Perfected"
    date: "c. 1125 BCE"
    region: "Levant"
    poem: |
      Twenty-two signs.
      I watched the scribes at Byblos argue over the order,
      shuffling the little pictures like a hand of cards
      till they fell into their final line —
      ox, house, camel, door — aleph, bet, gimel, dalet —
      and one of them laughed and said, "That's it. That's all of it."
      Every letter you have ever read descends from that table.
      Every alphabet from here to the far side of the world.
      I copied them down in the sand with a stick
      and felt like I'd been handed the keys to everything.
    description: "At Byblos, scribes settle twenty-two signs into their final order — the alphabet that will father every Western script, invented at a worktable by arguing men."
    status: "first draft"
    sha256: "99f0d329a0f2c95f07dd2119a62b86cb3a09830f6a97c60482e188a373eea293"
  - number: "0775"
    volume: 2
    title: "The First Hut Urn"
    date: "c. 1123 BCE"
    region: "Italy"
    poem: |
      Grandfather died, and the family made him a house —
      a tiny clay hut, roofed and doored,
      just big enough to hold his ashes.
      I watched them set it in the earth with terrible gentleness,
      the way you'd tuck a child into bed.
      "We couldn't leave him out in the cold," the widow said,
      and nobody laughed, because it wasn't funny,
      it was true.
      The dead need houses too.
      Ours are just smaller, and warmer,
      and we carry them with us when we go.
    description: "A Villanovan family buries their grandfather's ashes in a tiny clay hut — a house for the dead, made with terrible gentleness."
    status: "first draft"
    sha256: "843de60dccded728d019c721b3409c6e42b7c2dfdc00cebfc4189825ed94c8f6"
  - number: "0776"
    volume: 2
    title: "Heads in the Swamp"
    date: "c. 1120 BCE"
    region: "Mesoamerica"
    poem: |
      They dragged the basalt down from the mountains —
      boulders weighing more than twenty men —
      hauled them for miles through the swamp
      on rollers and ropes and pure stubbornness,
      then carved faces into them.
      Colossal heads. Frowning, helmeted, eternal.
      I stood in the shadow of one at San Lorenzo
      and felt very small and very temporary.
      The sculptor wiped the sweat from his eyes
      and said, "The stone was already a head.
      We just let it out."
    description: "Olmec sculptors drag mountain basalt through the swamp to carve colossal heads at San Lorenzo — stone faces that make every onlooker feel temporary."
    status: "first draft"
    sha256: "9e8c00e4a756ab13bfaa00479843bff2a33b64bcbde5fe991d582c72502a0657"
  - number: "0777"
    volume: 2
    title: "Wool and the Loom"
    date: "c. 1118 BCE"
    region: "Greece"
    poem: |
      Through the dark winter the women wove —
      upright looms creaking in the lamplight,
      shuttles flying, heavy wool growing row by row
      into cloaks that would outlast the cold.
      I sat with them and learned the rhythm:
      throw, beat, throw, beat, the song of it.
      One woman sang while she worked,
      an old song about a sailor who never came home,
      and the cloth drank in the music.
      When spring came, the cloaks went out into the world
      carrying winter's songs in every thread.
    description: "Greek village women weave heavy wool cloaks on upright looms through the dark winter — cloth carrying songs in every thread."
    status: "first draft"
    sha256: "01a00ea29a4796cb53564b480cdbb9dc75816b92c45ef9d31336d10ab7f930bd"
  - number: "0778"
    volume: 2
    title: "Tiglath-Pileser Marches West"
    date: "c. 1115 BCE"
    region: "Assyria"
    poem: |
      I marched in the dust of that army —
      chariots, spearmen, engineers with their bronze tools —
      across the Euphrates and all the way to the sea,
      where the king stood on the beach
      and washed his weapons in the Mediterranean
      like a man signing his name in water.
      The coastal kings brought cedar, gold, submission.
      They always do, when the army is that big.
      Assyria had been quiet for a century.
      Assyria was done being quiet.
    description: "Tiglath-Pileser's Assyrian army crosses the Euphrates to the Mediterranean, washing its weapons in the sea — the empire's long silence broken."
    status: "first draft"
    sha256: "81c4373cccd9a7ed1cf2716efc28442e657ef4be2a3ca194f3d0771f87b1c5da"
  - number: "0779"
    volume: 2
    title: "Glass from Sidon"
    date: "c. 1113 BCE"
    region: "Phoenicia"
    poem: |
      The craftsman gathered the molten blob on his pipe,
      blew gently, turned it, blew again —
      and a small bottle bloomed like a bubble
      that refused to pop.
      He held it to the light and it caught the sun
      like a cupful of seawater.
      "For perfume," he said, proud as any king.
      "For queens."
      I have held empires' gold in my hands.
      I'd trade it all for the look on his face
      when the glass came out perfect.
    description: "Sidonian glassblowers coax molten glass into small scent bottles that catch the light like seawater — craft as pure delight."
    status: "first draft"
    sha256: "f2e394609bb064019ad4ec3777d80d04a4c1b972857d6429d38b8493786af3be"
  - number: "0780"
    volume: 2
    title: "Gadir on the Island"
    date: "c. 1110 BCE"
    region: "Iberia"
    poem: |
      They sailed past the edge of the known world
      and found an island in the Atlantic surf,
      and there the Tyrians did what Tyrians do:
      they built a dock, raised an altar, and started trading.
      I helped unload the first cargo —
      oil and wine going out, silver coming in —
      while gulls screamed over a sea no eastern sailor
      had ever crossed before.
      Gadir, they called it. The walled place.
      Twenty-eight centuries later they'd still be calling it Cadiz,
      and the ships would still be coming.
    description: "Tyrian sailors found a trading post on an Atlantic island — Gadir, the future Cadiz — at the very edge of the known world."
    status: "first draft"
    sha256: "df68ae94c52c172bc11856326b42bf160430cfb9d06337134aa36d996d3e6eb3"
  - number: "0781"
    volume: 2
    title: "Millet in the Wei Valley"
    date: "c. 1108 BCE"
    region: "China"
    poem: |
      Under smoky skies the Zhou farmers
      walked the Wei Valley fields with seed baskets,
      planting millet in neat patient rows
      while far to the east, Shang's power rotted
      like an old tooth.
      An old farmer told me, leaning on his hoe:
      "They tax the harvest. We plant the harvest.
      Guess which of us eats in winter."
      He laughed, and the valley laughed with him —
      a whole people quietly outgrowing a dynasty,
      one millet field at a time.
    description: "Zhou farmers plant millet in the Wei Valley while Shang's power rots in the east — a dynasty quietly outgrown, one field at a time."
    status: "first draft"
    sha256: "599abcaae34c95f851cf49f34c510f5d14be34ccc06938b80407eab905eca13a"
  - number: "0782"
    volume: 2
    title: "The Cowherd's Song"
    date: "c. 1105 BCE"
    region: "India"
    poem: |
      At dusk the herders sang to their cattle —
      low, sweet, wordless half the time —
      and the great beasts turned their heavy heads
      and listened, as if they understood.
      I sat on a rock and listened too,
      and something in the melody went straight through me,
      older than the words, older than the herd.
      Kingdoms would rise and burn and be forgotten.
      But somewhere, tonight, three thousand years later,
      a herder is still singing to his cattle at dusk.
      I know it. I was there at the beginning of it.
    description: "Indian herders sing to their cattle at dusk — a melody older than words, still being sung three thousand years later."
    status: "first draft"
    sha256: "10009984ac42e5548b1ac0c0a34a975dcaf45dbdbd6b641f16b56af0def5ed19"
  - number: "0783"
    volume: 2
    title: "Silver Coffins at Tanis"
    date: "c. 1103 BCE"
    region: "Egypt"
    poem: |
      In the north they buried their kings in silver now —
      coffins hammered from the white metal,
      gleaming in the torchlight of the tomb,
      because Thebes had the gold and Thebes
      was drifting beyond their reach.
      I watched the silversmiths work, and the work was beautiful —
      but it was the beauty of making do.
      A king in a silver coffin is still a king.
      But everyone at the funeral knew
      what the metal was saying:
      the south is gone, and we are what's left.
    description: "Northern Egyptian kings are buried in silver coffins at Tanis — beautiful work, but the metal itself confesses that Thebes is lost to them."
    status: "first draft"
    sha256: "20dcaadbe83c2dedc30196e6d789266bd693df6a5118391a3381dc2f9f113138"
  - number: "0784"
    volume: 2
    title: "The First Iron Sword"
    date: "c. 1100 BCE"
    region: "Levant"
    poem: |
      The Philistine smith quenched the long blade
      and it came out of the water hissing,
      gray and straight and terrible.
      He struck it and it sang — a high clear note
      no bronze blade ever made.
      I held it. It was lighter than I expected,
      and balanced like a living thing.
      The smith looked at me and we both knew:
      every bronze sword in the world
      had just become a museum piece.
      Some mornings change the world before breakfast.
    description: "A Philistine smith quenches the first long iron sword — it sings when struck, and every bronze blade in the world becomes obsolete before breakfast."
    status: "first draft"
    sha256: "a6b56d2e9729a8b07c4dd499b0cb6f3f0f11d508ef13c96b7d13f28f4ceede0e"
  - number: "0785"
    volume: 2
    title: "The Urnfield Fires"
    date: "c. 1098 BCE"
    region: "Europe"
    poem: |
      Across central Europe the pyres burned that autumn —
      I saw the smoke from a dozen villages at once,
      thin gray columns rising into a gray sky.
      They burned their dead with honor and gathered the ashes,
      and buried them in fields of urns, row on careful row,
      whole cemeteries of small clay houses for the departed.
      A mourner told me, "Fire cleans. Earth keeps."
      Simple. True. The kind of truth
      that doesn't need a temple to stand in.
    description: "Across central Europe, families cremate their dead and bury the ashes in great urnfields — \"fire cleans, earth keeps,\" a mourner's plain theology."
    status: "first draft"
    sha256: "bf134582da479b3828b3e44ac4e39e0c51f83d9924d141e29d66f1f3c5924a7c"
  - number: "0786"
    volume: 2
    title: "Iron Pins for Brides"
    date: "c. 1095 BCE"
    region: "Greece"
    poem: |
      The bride sat very still while her mother
      fastened her dress with the new pins —
      iron, bright as starlight, holding the wool at her shoulders.
      "Bronze is for grandmothers," the mother said,
      and the women laughed, and the bride blushed,
      and I thought: this is how ages turn.
      Not with battles. With weddings.
      With a girl walking out into her new life
      pinned together by the future,
      shining brighter than the past.
    description: "Greek brides fasten their dresses with bright new iron pins — the Iron Age arriving not with battles but with weddings."
    status: "first draft"
    sha256: "b5b40d1f71d75eb14385cfec82140d09076cd1fb585d241d695cd1c6cba9c8a9"
  - number: "0787"
    volume: 2
    title: "Caravans of the Arameans"
    date: "c. 1093 BCE"
    region: "Syria"
    poem: |
      The camel trains moved between Damascus and the river towns —
      wine skins sloshing, oil jars sealed with wax,
      bells on the lead camel, dust on everything.
      I rode with them for three days,
      ate their bread, learned their road songs.
      The caravan master told me the secret of the trade:
      "Buy where it's plenty. Sell where it's not.
      Everything else is just walking."
      Three thousand years of economics
      in two sentences, delivered over a campfire.
    description: "Aramean camel trains carry wine and oil between Damascus and the Euphrates — three millennia of economics in a caravan master's two sentences."
    status: "first draft"
    sha256: "c834237e4dfbaabc9ff8c8fa92f3b561e1b37ee9a0d501aa8cae04704305e391"
  - number: "0788"
    volume: 2
    title: "Bronze Helmets of Villanova"
    date: "c. 1090 BCE"
    region: "Italy"
    poem: |
      The chief lifted the helmet from its wrappings —
      bronze hammered thin as an eggshell,
      crested, gleaming, catching the firelight —
      and set it on his head like a crown.
      His men went quiet. That's what helmets do:
      they turn a man into a symbol.
      I ran my finger along the hammered crest
      and felt the thousand blows that shaped it.
      Somewhere a smith had spent a season
      making one man look like a god for a day.
      Worth it, the chief's eyes said. Worth it.
    description: "Italian chiefs don crested bronze helmets hammered thin as eggshell — a season's smithing to make one man look like a god for a day."
    status: "first draft"
    sha256: "af1545b273deff693db8d5ee12bc6e2d205be6eb0c0e5daee724f9bd244940eb"
  - number: "0789"
    volume: 2
    title: "The Philistine Monopoly"
    date: "c. 1088 BCE"
    region: "Levant"
    poem: |
      The hill farmers trudged down to the Philistine forges
      with their dull plowshares over their shoulders,
      paid the smith's price, trudged back up —
      because no smith might work iron in the hills.
      That was the law. Their law.
      I walked with one farmer, an old man with cracked hands,
      who spat in the dust and said, "They sell us the edge
      and keep the secret. One day we'll learn the fire."
      He was right. Secrets don't keep.
      But that day, the Philistines owned the future,
      and rented it out by the sharpening.
    description: "Israelite farmers must trudge to Philistine forges to sharpen their tools — no ironworking allowed in the hills, the future rented out by the sharpening."
    status: "first draft"
    sha256: "0c56a6cfad7c73ff5aae8bac1004e9611ff19478724661343edcc530cb2a5b6d"
  - number: "0790"
    volume: 2
    title: "God's Wife of Amun"
    date: "c. 1085 BCE"
    region: "Egypt"
    poem: |
      They led the princess into the temple at Thebes,
      and when she came out she was God's Wife —
      married to Amun himself, which meant married to no man,
      which meant she answered to no husband, no brother, no king.
      I watched her take the temple's seal
      with hands that didn't tremble.
      The priests bowed. The crowds knelt.
      And in that moment the most powerful person in Upper Egypt
      was a woman who belonged to a god —
      which is to say, belonged to herself.
    description: "A princess becomes God's Wife of Amun at Thebes — married to the god, answering to no man, wielding temple power like a queen."
    status: "first draft"
    sha256: "4b6f6cdad05ae3e59d0f137ea3ca714a65d8b3b538ccd30b4829ffc89e886145"
  - number: "0791"
    volume: 2
    title: "Ebony and Ivory"
    date: "c. 1083 BCE"
    region: "Nubia"
    poem: |
      Down the Nile they came, the great logs —
      ebony black as midnight, tusks white as moonrise —
      lashed to rafts, riding the current north to the markets.
      I rode the river with a trader who ran his hand
      along an ebony log like it was a lover's arm.
      "Grows slow," he said. "Sinks in water. Lasts forever.
      The pharaohs' coffins, the gods' statues —
      all of it comes up the river from us."
      He wasn't boasting. He was just telling the truth:
      the south had always been Egypt's treasure chest.
    description: "Kushite traders float ebony logs and elephant tusks down the Nile — the south's slow-grown treasure feeding Egypt's markets and temples."
    status: "first draft"
    sha256: "e0079e559a917de4fe9a3f80cf342230c9898c3e4057114c143f79851b96d42b"
  - number: "0792"
    volume: 2
    title: "The Ballgame Begins"
    date: "c. 1080 BCE"
    region: "Mesoamerica"
    poem: |
      In the plaza at San Lorenzo the players took the court —
      padded belts, knee guards, the heavy rubber ball —
      and the game began, fast and brutal and beautiful.
      I watched a player launch himself sideways,
      strike the ball with his hip, send it sailing
      toward the stone rings while the crowd roared.
      They played for the gods, they said.
      For rain. For the sun to keep rising.
      I've seen many games. This one felt like prayer
      with a body count.
    description: "At San Lorenzo, padded players strike a heavy rubber ball through stone rings — a ballgame played for the gods, like prayer with a body count."
    status: "first draft"
    sha256: "1fdf4bb65ffc2f7ad64d9ca4c1bb7262e5c75059632ce1ca1983af6d65f676f1"
  - number: "0793"
    volume: 2
    title: "Harvest Songs"
    date: "c. 1078 BCE"
    region: "Levant"
    poem: |
      The raiders are gone, and the threshing floors are full —
      so the women sang louder this harvest,
      the old songs, the ones their grandmothers sang
      when the world was safe before.
      I worked a flail beside them, chaff in my hair,
      and the rhythm of the song set the rhythm of the work:
      swing, turn, swing, turn, the grain flying golden.
      A girl no more than ten led the chorus,
      voice clear as well water.
      Peace has a sound. That summer, I heard it.
    description: "Levantine women thresh wheat and sing the old songs louder now that the raiders are gone — peace has a sound, and it's a harvest chorus."
    status: "first draft"
    sha256: "ba0442f2e065294d0d57cc70fa0622159a30a5c71a944f3840c35a8c4c6a1b0b"
  - number: "0794"
    volume: 2
    title: "Oracle Bones Crack"
    date: "c. 1075 BCE"
    region: "China"
    poem: |
      The diviner held the turtle shell over the flame,
      and the heat did its work — crack!
      A black line split the polished bone,
      and he bent close, reading the future in the fracture.
      "Will the king's hunt succeed? Will the rains come?"
      I watched the last generation of the old magic at work,
      men who asked heaven questions
      and trusted a cracking shell for answers.
      It looks like superstition from here.
      But they were doing what we all do:
      begging the unknown for a straight answer.
    description: "Shang diviners heat turtle shells and read the cracks — the last generation of the old magic, begging the unknown for straight answers."
    status: "first draft"
    sha256: "241fc115c5430cf50d56cecf9ea65c43dd0fa0dd409866b06b76b5255354baf7"
  - number: "0795"
    volume: 2
    title: "The Hero of Lefkandi"
    date: "c. 1073 BCE"
    region: "Greece"
    poem: |
      On Euboea they buried him like a king from the old songs —
      in a great longhouse of timber and thatch,
      with his horses sacrificed beside him,
      his weapons laid at his feet, his woman nearby.
      I stood at the edge of the mourning crowd
      and felt the ground shifting under Greece:
      chiefs were rising again.
      The long dark after the palaces fell was ending,
      and men were remembering how to be great —
      or at least, how to be buried like it.
    description: "On Euboea, a warrior is buried with his horses in a great timber longhouse — the hero's funeral announcing that chiefs are rising in Greece again."
    status: "first draft"
    sha256: "58d57fcea297850be24966c47cbf62097ecd9260b2733bde5435cbc3f47e06a6"
  - number: "0796"
    volume: 2
    title: "Gardens of Ashur"
    date: "c. 1070 BCE"
    region: "Assyria"
    poem: |
      While the kings planned their wars,
      the gardeners of Ashur were doing something better:
      coaxing orchards out of the Tigris plain
      with canals and water-lifts,
      fig and pomegranate where the dust had been.
      I walked the rows with the head gardener,
      a man with soil under his nails and peace in his eyes.
      "Kings plant flags," he said, handing me a fig.
      "I plant trees. Mine last longer."
      He was right. The flags are gone.
      Somewhere, the descendants of those trees are still bearing.
    description: "Assyrian gardeners coax orchards from the Tigris plain with canals and water-lifts — planting trees that outlast the kings' flags."
    status: "first draft"
    sha256: "acdcb0bdfe39af430c62d85352993833964d863719b504ce6fe4eb2c9f2bc329"
  - number: "0797"
    volume: 2
    title: "Wenamun's Voyage"
    date: "c. 1069 BCE"
    region: "Egypt"
    poem: |
      Wenamun sailed to Byblos for cedar in Pharaoh's name —
      and was robbed on the road, mocked at the court,
      kept waiting like a beggar by a prince
      who no longer feared Egypt.
      I traveled with him part of the way,
      and watched the old man's hands shake —
      not with age, with the knowledge
      that the name he'd served all his life
      had become an empty sound abroad.
      He got his timber in the end. Barely.
      But the empire that sent him
      never came home at all.
    description: "The Egyptian priest Wenamun sails to Byblos for cedar and is robbed and mocked — Pharaoh's name no longer frightens anyone, and the old man knows it."
    status: "first draft"
    sha256: "8ec95587097688081f0c76f29a9d92a3a2895494b6803e8f68f8c4a6d17b5225"
  - number: "0798"
    volume: 2
    title: "Rice in the Ganges Plain"
    date: "c. 1065 BCE"
    region: "India"
    poem: |
      They went into the jungle with axes and fire —
      cleared the tangled green, burned the stubble,
      and when the summer floods came,
      planted rice in the drowned fields.
      I stood knee-deep in the paddy mud with them,
      the water warm, the seedlings bright as hope.
      An old woman showed me how to set each shoot,
      quick fingers, no wasted motion.
      "Rice loves water," she said. "So do we."
      That plain would feed a hundred million someday.
      It started with her fingers in the mud.
    description: "Farmers clear Ganges jungle and plant rice in the flooded fields — the plain that will feed a hundred million starts with fingers in the mud."
    status: "first draft"
    sha256: "ca511876b68f9fcbc870723c1cd68c5b010537ebf2fa6bf0e16a2c39bb5bc7a8"
  - number: "0799"
    volume: 2
    title: "Bronze Across the Water"
    date: "c. 1063 BCE"
    region: "Britain"
    poem: |
      The log boats crossed the Channel at dawn —
      hollowed oak, riding low with cargo —
      and the smiths on either shore traded
      leaf-shaped swords, bronze bright as sunrise.
      I made the crossing with them once,
      the gray water slapping the hull,
      France a smudge on the horizon.
      No customs. No tariffs. Just men who made good blades
      and men who wanted them.
      The Channel has divided a lot of things.
      It never divided the smiths.
    description: "Smiths trade leaf-shaped bronze swords across the Channel in hollowed log boats — the water dividing kingdoms but never the smiths."
    status: "first draft"
    sha256: "b4004dfde1da40539bdcbe3f743b5adffb87cffa4d276205d9a64732ae818b79"
  - number: "0800"
    volume: 2
    title: "Terraces on the Hills"
    date: "c. 1060 BCE"
    region: "Levant"
    poem: |
      Stone on stone on stone —
      I helped stack them, my back aching by noon,
      building the terraces that would hold the winter rains
      for the olive saplings.
      The old farmer directing us had built
      a hundred walls like this with his father.
      "Water runs downhill," he said, stating the obvious
      the way wise men do. "We teach it manners."
      By evening the hillside wore its new steps
      like a staircase for giants.
      The olives would come. The rain would stay.
      Manners, taught in stone.
    description: "Hill farmers stack stone terraces to hold the winter rains for olive saplings — teaching water manners, one stone wall at a time."
    status: "first draft"
    sha256: "5a0aa46c2c89980e7694a3a219bf9ec64d1ded76283b3abb9c113e50ece1f714"
  - number: "0801"
    volume: 2
    title: "Ships to the West"
    date: "c. 1058 BCE"
    region: "Phoenicia"
    poem: |
      The galleys slipped out of Tyre at dawn,
      horse-head prows lifting to the swell,
      bound for Cyprus, for Sardinia,
      for the silver lands at the edge of the map.
      I stood on the quay with the wives and mothers,
      watching the sails shrink into the blue.
      One old woman pressed a charm into my hand.
      "For the voyage," she said.
      I never made that voyage. But I kept the charm
      for thirty years, and I still have it —
      which tells you something about old women's magic.
    description: "Tyrian galleys with horse-head prows sail west for Cyprus, Sardinia, and the silver lands — and an old woman's charm for the voyage, kept thirty years."
    status: "first draft"
    sha256: "32ed7a703f2e7ec49943b4462976a472e66ebc2730f81c2f408f3245cde0031c"
  - number: "0802"
    volume: 2
    title: "Horses of the Grass Sea"
    date: "c. 1055 BCE"
    region: "Steppe"
    poem: |
      The Pontic steppe runs to the horizon in every direction —
      a sea of grass, and the nomads are its sailors.
      I rode with them, learned to sit a horse their way,
      watched them breed for speed and carve
      bone cheekpieces fine as jewelry.
      A boy no older than twelve galloped past me
      standing on his horse's back, laughing.
      His grandfather nodded, satisfied.
      "That one will live," he said.
      On the steppe, that's the highest praise there is.
    description: "Nomad riders on the Pontic steppe breed faster horses and carve bone cheekpieces — a twelve-year-old galloping upright on horseback, and that's the highest praise."
    status: "first draft"
    sha256: "84ef1cea3a93f5ae49ab63e08b9e733fa300a84ed3af7598bb43ce60d0e9bcaf"
  - number: "0803"
    volume: 2
    title: "Were-Jaguar Potters"
    date: "c. 1053 BCE"
    region: "Mesoamerica"
    poem: |
      In the village workshops the potters
      shaped the were-jaguar babies —
      chubby clay infants with the great cat's snarl,
      cleft heads, almond eyes —
      gods small enough to hold in your hands.
      I watched a potter paint the spots
      with a brush of three hairs,
      her tongue caught between her teeth in concentration.
      "For the shrine," she said. "So the village remembers
      what the jungle is."
      Small gods for small shrines.
      But the jungle they remembered was enormous.
    description: "Olmec potters mold baby-faced were-jaguar gods into clay vessels — small gods for village shrines, remembering an enormous jungle."
    status: "first draft"
    sha256: "8059973417b3bb0e1730c459fab5b3502f43cc8121805c5319d21ccfadcbf8af"
  - number: "0804"
    volume: 2
    title: "Circles and Meanders"
    date: "c. 1050 BCE"
    region: "Greece"
    poem: |
      In Athens the potters found their new religion —
      the compass, the multiple brush,
      circles painted perfect in a single turn,
      meanders winding precise as a labyrinth
      around the shoulders of great jars.
      I watched a master work, his hand steady as stone,
      and the pattern grew like frost on a window.
      No more wild zigzags. This was order.
      This was a people who'd survived the dark
      and were ready, at last, for straight lines again.
    description: "Athenian potters cover jars with precise painted circles and winding meanders — a new geometric style, order returning after the dark age."
    status: "first draft"
    sha256: "9e4e3307281c9e0b2f1e6cc06d1bd21e361c6a81f1125b76aceadb2b8372c4ed"
  - number: "0805"
    volume: 2
    title: "Shepherds Become Kings"
    date: "c. 1048 BCE"
    region: "Levant"
    poem: |
      He was just a shepherd boy with a sling and a harp,
      singing to the sheep in the hill country —
      but the songs were that good,
      and the outlaws heard them,
      and the desperate men gathered,
      and suddenly the singer was a captain.
      I heard him play once, in a cave full of fugitives,
      and the music made those hard men weep.
      That's the part the histories skip:
      before David was a king, he was a voice in the dark
      telling frightened men they weren't finished yet.
    description: "A shepherd boy's songs make him captain of outlaws in the hill country — David's rise beginning not with a crown but with a voice in a cave."
    status: "first draft"
    sha256: "81d9347aa22cf6180769fdbc44b5ecc2876e7c7551d7064bad67e4bf188bf938"
  - number: "0806"
    volume: 2
    title: "The Mandate of Heaven"
    date: "c. 1046 BCE"
    region: "China"
    poem: |
      At Muye the armies met in the morning mist,
      and by evening the Shang were broken —
      not just beaten, but judged.
      The Zhou didn't say "we won."
      They said "Heaven has withdrawn its favor" —
      a new idea, and a dangerous one:
      that kings rule by worthiness, not blood,
      and Heaven can fire them.
      I stood on that field after the battle,
      the mist still hanging in the hollows,
      and felt the whole future of China
      pivot on a single sentence.
    description: "At Muye, the Zhou topple the Shang and proclaim the Mandate of Heaven — kings rule by worthiness, not blood, and Heaven can fire them."
    status: "first draft"
    sha256: "42ce9f1f04cfd67a0c270d0d10fef0d87aa30c5efdda334baa6f289fd4202657"
  - number: "0807"
    volume: 2
    title: "Bronze Bells of Zhou"
    date: "c. 1044 BCE"
    region: "China"
    poem: |
      The founders dug the pits and built the molds,
      poured the bronze white-hot and singing,
      and when the great bells cooled
      they hung them in rows in the palace courtyard.
      I was there for the first sounding —
      the striker swung, the bronze spoke,
      a tone so deep I felt it in my teeth,
      rolling out over the capital like a law.
      Music you could govern by.
      For a thousand years, Chinese courts would tune themselves
      to the memory of that sound.
    description: "Zhou founders cast great bronze bells whose deep tones will order court music for centuries — music you could govern by."
    status: "first draft"
    sha256: "0db91001a5fcc2b7c5dcb769e365d3a225a679c1696483d732ceba21566b3be3"
  - number: "0808"
    volume: 2
    title: "Iron Plows the Field"
    date: "c. 1042 BCE"
    region: "Cyprus"
    poem: |
      The oxen leaned into the yoke,
      the iron-shod plow bit the Cypriot earth,
      and the furrow turned over dark and deep —
      deeper than bronze ever reached,
      into soil no plow had touched in a hundred years.
      The farmer walked behind, guiding,
      and I walked beside him, watching his face.
      He stopped at the field's end, looked back
      at the long straight furrow, and laughed out loud —
      the laugh of a man who's just been given
      more land than he owned yesterday.
    description: "Cypriot farmers hitch oxen to iron-shod plows that bite deeper than bronze ever could — a man laughing at the end of a furrow, given more land than he owned."
    status: "first draft"
    sha256: "4fa3875b3d67465121489d6f7830e58674fe322ee892304305e22fe7a4084942"
  - number: "0809"
    volume: 2
    title: "Napata Holds the Faith"
    date: "c. 1040 BCE"
    region: "Nubia"
    poem: |
      While Egypt's temples quarreled over scraps,
      the priests at Napata kept the flame —
      Amun's fire, tended without fail,
      morning offerings, evening hymns,
      the old rites performed the old way
      as if the empire had never faltered.
      I prayed with them at dawn,
      the desert cold, the chanting warm.
      "Egypt forgets," the old priest told me.
      "We remember. That is our work."
      Centuries later, Egypt would come south
      begging for priests who still knew how.
    description: "Kushite priests at Napata keep Amun's flame burning while Egypt's temples quarrel — remembering, as their work, what the north forgets."
    status: "first draft"
    sha256: "59f696c3e8d88d19866415804d5b0f17aac95def1c65c04ce633ae97c3f6f768"
  - number: "0810"
    volume: 2
    title: "David Takes the Stronghold"
    date: "c. 1038 BCE"
    region: "Levant"
    poem: |
      Jebus sat on its rock, smug behind its walls,
      the Jebusites jeering down at David's men —
      till his climbers found the water shaft
      and came up inside the city like a bad dream.
      I watched the gates open from within,
      heard the jeering stop all at once.
      By sunset the stronghold was Jerusalem,
      the City of David, capital of a kingdom
      that had been a gang of outlaws five years before.
      That's how fast the world changes
      when somebody finds the back way in.
    description: "David's men scale Jebus through its water shaft and take the stronghold — the jeering stops, and an outlaw gang gains a capital called Jerusalem."
    status: "first draft"
    sha256: "6f9ec0f3f73faa0de4213781d8a6bf139e6c1b8c5aaf744b3829627a3d63bdc8"
  - number: "0811"
    volume: 2
    title: "Hiram's Cedar"
    date: "c. 1036 BCE"
    region: "Phoenicia"
    poem: |
      King Hiram of Tyre sent the logs south —
      cedar, straight and fragrant, floating down the coast —
      and with them his master builders,
      men who knew stone the way poets know words.
      I watched them raise David's palace in Jerusalem,
      Tyrian hands laying the courses,
      the cedar beams going up sweet-smelling.
      Two kings. One friendship. No treaty needed —
      just timber, craftsmen, and mutual respect.
      The palace is dust now. The friendship
      outlasted it by three thousand years.
    description: "Tyre's King Hiram sends cedar logs and master builders to David's Jerusalem — a palace raised by friendship, outlasting the stone itself."
    status: "first draft"
    sha256: "31e53f347d0e702fa5a67566babe2f4abfc544442fccb36733b7ee7304659d6e"
  - number: "0812"
    volume: 2
    title: "The Court Remembers"
    date: "c. 1034 BCE"
    region: "Levant"
    poem: |
      In David's court the scribes unrolled fresh scrolls
      and began to write the king's deeds —
      the battles, the psalms, the outlaw years —
      history as the court tells it, which is to say,
      history with the rough edges sanded.
      I sat in the corner and watched them work,
      and I thought about all the stories
      that wouldn't make the scroll:
      the ones the shepherds told, the ones the widows knew.
      Every history is a choice.
      This was the first draft of a very long book.
    description: "David's scribes begin writing the king's deeds on scrolls — the first draft of a very long book, history with the rough edges sanded."
    status: "first draft"
    sha256: "438e446c4663aef2aa9a216ca73a335bc25a2934b90757ecd06b31f0081d1f5c"
  - number: "0813"
    volume: 2
    title: "Warrior Graves at Athens"
    date: "c. 1032 BCE"
    region: "Greece"
    poem: |
      In the Kerameikos field they buried the swordsmen —
      iron blades at their sides, bronze bowls at their feet,
      the earth taking back what the forge had lent.
      I stood among the mourners as the soil fell,
      and noticed the iron: long, gray, new.
      These weren't the bronze-age heroes of the old songs.
      These were the new men, the iron men,
      and they were being buried with the future in their hands.
      Athens was still a town of potters and farmers.
      But the graves were starting to tell a different story.
    description: "Athenians bury swordsmen with iron blades in the Kerameikos — the new iron men, buried with the future in their hands."
    status: "first draft"
    sha256: "504ebb8d094297e3f83c4ec0e2ea3fd12eaf46113917b352aadc89955d81e1b9"
  - number: "0814"
    volume: 2
    title: "The Stamped Sun"
    date: "c. 1030 BCE"
    region: "Italy"
    poem: |
      The Villanovan potter pressed the stamp into the wet clay —
      a sun, rayed and round —
      and lifted it to reveal the symbol perfect on the tall urn.
      Then another. And another. A whole cemetery of suns,
      rising with the dead into whatever comes next.
      I asked her why the sun, for the dead.
      She looked at me like I was simple.
      "Because it comes back," she said.
      "Everything else you bury stays buried.
      The sun comes back."
    description: "Villanovan potters stamp sun-symbols into tall burial urns — because the sun comes back, and the dead deserve the same promise."
    status: "first draft"
    sha256: "aff2e147e0730a2391d237473067815d51a456b097586765f3357b44bdc2579e"
  - number: "0815"
    volume: 2
    title: "Gold of the South Returns"
    date: "c. 1028 BCE"
    region: "Nubia"
    poem: |
      The miners went back into the eastern desert —
      back to the old pits, the played-out veins,
      and found the gold was still there,
      patient as ever, waiting for hands.
      I descended into one of the shafts with them,
      lamplight on quartz veins, the air thick and hot,
      and watched a boy no older than fourteen
      pry loose a nugget the size of a fig.
      He held it up, grinning through the dust.
      The desert gives. It just makes you earn it.
    description: "Nubian miners reopen the gold pits of the eastern desert — a boy prying loose a fig-sized nugget, the desert making every finder earn it."
    status: "first draft"
    sha256: "aceef32cb894c9405838d34d62f490f4e98e1d8f477c8c492062905ee77e81c3"
  - number: "0816"
    volume: 2
    title: "The Libyan Pharaohs Stir"
    date: "c. 1026 BCE"
    region: "Egypt"
    poem: |
      The Libyan chiefs in the Delta had done everything right —
      married into the old families, learned the rituals,
      raised their sons as Egyptians —
      and now they were looking at the double crown
      the way a man looks at a chair that's been empty too long.
      I dined with one of them, a smooth courtier
      with desert still in his eyes.
      "Egypt needs a strong hand," he said,
      refilling my cup himself. A host's gesture.
      Also a king's.
    description: "Libyan chiefs in the Delta marry into power and eye the double crown — Egypt about to be ruled by the descendants of its own mercenaries."
    status: "first draft"
    sha256: "3e01d351f50a552dc0fd4b2ece22865da1beb80ae835ddf82a4ef6828b9e1ef3"
  - number: "0817"
    volume: 2
    title: "Damascus Rises"
    date: "c. 1024 BCE"
    region: "Syria"
    poem: |
      He was a strongman with a fast horse and faster friends,
      and he saw what Damascus could be —
      water, walls, and the caravan roads crossing like ropes —
      so he seized it, and made it a kingdom.
      I watched the first walls go up,
      the first tolls collected at the gates,
      the first caravans rerouting to pay him.
      Cities are just agreements, I thought,
      and he'd made everyone agree.
      Damascus would outlast him by three thousand years.
      That's the thing about a good location:
      it forgives its founders everything.
    description: "An Aramean strongman seizes Damascus and makes it a caravan kingdom — a good location forgiving its founder everything, for three thousand years."
    status: "first draft"
    sha256: "1f4df021242fb850a3abacb9405c670a5afcf967b0dfdccc2fa0395377b64dca"
  - number: "0818"
    volume: 2
    title: "Mothers of the City"
    date: "c. 1022 BCE"
    region: "Levant"
    poem: |
      At dawn the women of Jerusalem
      walked down to the Gihon spring with their jars,
      and the spring became a parliament —
      news of the new palace, who's building what,
      which official's son married which merchant's daughter.
      I carried water with them one morning,
      and learned more about the kingdom in an hour
      than in a month at court.
      Kings issue decrees. Mothers issue verdicts.
      The decrees get carved in stone.
      The verdicts get remembered.
    description: "Jerusalem's women draw water at the Gihon spring and trade news — a parliament of mothers whose verdicts outlast the kings' decrees."
    status: "first draft"
    sha256: "590575f31e1820365a8f1d032994f5590e028a4e97022b090d8c5dae8b98958b"
  - number: "0819"
    volume: 2
    title: "The Horse Sacrifice"
    date: "c. 1020 BCE"
    region: "India"
    poem: |
      They loosed the stallion at the year's turning —
      a king's horse, garlanded, consecrated —
      to roam free for a full year,
      with warriors following at a distance.
      Every land its hooves touched: claimed.
      Every chief who stopped it: challenged.
      I watched it go, mane tossing, free and unknowing,
      carrying a kingdom's ambition on its back
      without the faintest idea.
      A year later they'd sacrifice it with full honors.
      Power is strange. It crowns a horse,
      lets it run, then kills it —
      and calls the whole thing sacred.
    description: "Vedic kings loose a consecrated stallion to roam for a year, claiming every land it touches — power crowning a horse, then calling it sacred."
    status: "first draft"
    sha256: "381dbdc843b96378db3cf81c0662c02517ad73f1634aec31d4827ffd7e06a034"
  - number: "0820"
    volume: 2
    title: "San Lorenzo's Canals"
    date: "c. 1018 BCE"
    region: "Mesoamerica"
    poem: |
      Through the swamp the Olmec engineers
      dug their drainage canals, straight and true —
      water in, water out, the maize fields
      drinking exactly what they needed.
      I walked the banks with the overseer,
      mud to my knees, dragonflies everywhere.
      "Without this," he said, gesturing at the green miles,
      "we're frogs. With this, we're farmers."
      Engineering as destiny.
      The canals are silted now, the city gone —
      but the idea drained every swamp after it.
    description: "Olmec engineers dig drainage canals through the swamp to water their maize — engineering as destiny: without this, we're frogs; with this, farmers."
    status: "first draft"
    sha256: "7aed2f672e45b0c9755cd1da9c973108e9537342bcb1dd7fd1e0a2b904870b02"
  - number: "0821"
    volume: 2
    title: "The First Hillfort Gates"
    date: "c. 1016 BCE"
    region: "Britain"
    poem: |
      The timber gates went up at the hillfort entrances —
      great oak posts, barred and braced —
      and young men with spears took the watch.
      I stood guard one night with them,
      the wind cold off the downs, the stars hard and bright.
      "Quiet tonight," the lad beside me whispered,
      disappointed and relieved in equal measure.
      Every generation gets its wall to stand on.
      His was timber. Ours are other things.
      The standing is the same.
    description: "Timber gates rise at British hillfort entrances, guarded by young spearmen — every generation gets its wall to stand on, and the standing is the same."
    status: "first draft"
    sha256: "3f1a0f3ef3e8d605370eb058d9ad6385ed03ba7f8dbea6e088788fffc64ce2ab"
  - number: "0822"
    volume: 2
    title: "Cauldrons of the King"
    date: "c. 1014 BCE"
    region: "China"
    poem: |
      The Zhou founders cast the great cauldrons —
      bronze tripods, heavy as history —
      and carved into the metal the king's gifts of land:
      who got what valley, what village, what field.
      I watched the inscription being cut,
      each character a legal document in bronze.
      "Paper rots," the scribe told me.
      "Bronze remembers."
      He was right. The paper of that age is dust.
      The cauldrons are in museums now,
      still testifying, three thousand years later,
      to who owned which hill.
    description: "Zhou founders cast ritual bronze cauldrons inscribed with the king's land grants — paper rots, bronze remembers, and the cauldrons still testify."
    status: "first draft"
    sha256: "466439aa20cc676121146ec7afe8ae799f4aa664feaf88e16398515722a2e042"
  - number: "0823"
    volume: 2
    title: "Felt and Horses"
    date: "c. 1012 BCE"
    region: "Steppe"
    poem: |
      The nomad women laid out the wool —
      sheep's wool, layer on layer —
      wet it, rolled it, beat it with their whole bodies
      till it matted into felt, thick and weatherproof.
      I helped roll one, my arms aching,
      while the women laughed at my weakness.
      By evening the felt was drying,
      and by winter it would be a tent
      standing against the steppe wind.
      No nails. No timber. Just wool, water,
      and women's work — which is to say,
      the whole civilization, portable.
    description: "Nomad women beat sheep's wool into felt for the winter tents — no nails, no timber, just wool and women's work: the whole civilization, portable."
    status: "first draft"
    sha256: "72eeaa9c5f129557f2956ea95b552814d8e4b2895443bd92d6f3ee5f6b51bb59"
  - number: "0824"
    volume: 2
    title: "Solomon Takes the Throne"
    date: "c. 1010 BCE"
    region: "Levant"
    poem: |
      The old king was dying, the brothers were circling —
      Adonijah with his chariots, his feasts, his confidence —
      but the young one, Solomon, moved first and quiet:
      the priest, the prophet, the general's loyalty,
      the anointing at Gihon before the city woke.
      I was in Jerusalem that morning,
      heard the trumpets before I understood.
      By noon it was done. The clever son had the crown.
      Courts are like that: the loudest claimant loses
      to the one who counted heads in the dark.
    description: "Solomon outmaneuvers his brothers and is crowned at Gihon before the city wakes — the loudest claimant losing to the one who counted heads in the dark."
    status: "first draft"
    sha256: "b07c33f9b927a0a352eae622d30d210ce08a317dfadcb4abb345d0db92b568bb"
  - number: "0825"
    volume: 2
    title: "Sailors Teach Sailing"
    date: "c. 1008 BCE"
    region: "Phoenicia"
    poem: |
      The Tyrian captains took the Israelite crews in hand —
      showed them the stars, the winter winds,
      how to read a cloud, how to ride a swell —
      patient teachers, rough-tongued, generous.
      I shipped with them on a training run,
      and watched a farm boy from the hills
      take the steering oar and find his nerve.
      "You're not rowing a plow now, lad,"
      the captain grinned. "Bigger field."
      The boy laughed, scared and proud.
      Every sailor starts as somebody's farmer.
    description: "Tyrian captains teach Israelite crews to read the stars and ride the winter winds — a hill farm boy taking the steering oar, scared and proud."
    status: "first draft"
    sha256: "caf47c26fe5e87a43ece762e607d8727c6adafa37f264d517305f5b218713348"
  - number: "0826"
    volume: 2
    title: "The Long Ships Grow"
    date: "c. 1006 BCE"
    region: "Greece"
    poem: |
      In the shipyards the hulls were getting longer —
      more oars, more benches, more speed —
      the galleys stretching toward something new.
      I watched the shipwrights argue over the lines,
      one insisting on length, one on strength,
      the way builders have argued since Noah.
      They were inventing the trireme and didn't know it —
      just making the ship a little longer,
      a little faster, a little more terrible.
      Empires are built in shipyards
      by men arguing about timber.
    description: "Greek shipwrights lengthen their galleys and add oars — inventing the trireme without knowing it, empires built by men arguing about timber."
    status: "first draft"
    sha256: "9cbabf739d10c2a17ebb6b7422fa8fe03b5e76de9607f06e2fd4d54198e912fa"
  - number: "0827"
    volume: 2
    title: "Shoshenq's Ambition"
    date: "c. 1004 BCE"
    region: "Egypt"
    poem: |
      Shoshenq the Libyan had the mercenaries,
      had the Delta, had the patience —
      all he lacked was the crown,
      and he was done lacking it.
      I saw him review his troops at Bubastis,
      a warlord's eye in a courtier's face,
      and the men cheered like the river in flood.
      Ambition has a smell — iron and incense —
      and it was all over him.
      Egypt had been ruled by priests and caretakers.
      It was about to be ruled by a soldier again.
    description: "The Libyan warlord Shoshenq gathers mercenaries at Bubastis and eyes Pharaoh's throne — ambition smelling of iron and incense."
    status: "first draft"
    sha256: "b0e72ab337e6afdc824f47f90e65f38a5f30b4c9934b4fe41d02893e26eda7c2"
  - number: "0828"
    volume: 2
    title: "The Alliance of Kings"
    date: "c. 1002 BCE"
    region: "Levant"
    poem: |
      Hiram of Tyre and Solomon of Jerusalem
      swore friendship — cedar and gold for wheat and oil —
      and the whole eastern Mediterranean
      breathed easier.
      I was at the feast where they sealed it,
      two kings laughing like old friends,
      the wine flowing, the musicians playing
      both nations' songs.
      Trade is the oldest peacemaker.
      Armies conquer; merchants connect.
      That alliance built a temple and a fleet,
      and neither king ever raised a spear against the other.
    description: "Hiram of Tyre and Solomon swear friendship — cedar and gold for wheat and oil, trade as the oldest peacemaker, sealed with a feast."
    status: "first draft"
    sha256: "88eb210e9c5eae7b0ab1ea481793858d8f435e4d47d009ba1481c10ccab1aec5"
  - number: "0829"
    volume: 2
    title: "The Duke's Rites"
    date: "c. 1000 BCE"
    region: "China"
    poem: |
      The Duke of Zhou set the rituals —
      how to honor the ancestors, in what order,
      with what vessels, what music, what words —
      and wrote them down so no one would forget.
      I watched a ceremony at the new capital:
      bells, drums, the ranked officials bowing as one,
      the ancestors present in every gesture.
      It looked like religion. It was government —
      the kind that lasts, because it lives in the home,
      not just the palace.
      Three thousand years of Chinese family life
      began as the Duke's choreography.
    description: "The Duke of Zhou sets the rituals of ancestor worship — religion as government, choreography that will bind Chinese family life for three millennia."
    status: "first draft"
    sha256: "6a1e77b5b5787599e3bd8fb27d093cac2bd282c66bb80dcdde49ba7de0d3fbfc"
  - number: "0830"
    volume: 2
    title: "The Viceroy's Road"
    date: "c. 998 BCE"
    region: "Nubia"
    poem: |
      Kush's viceroy rebuilt the desert road —
      wells cleaned, waystations manned,
      bandits hanged at the crossroads as a lesson —
      and the gold flowed north without fear.
      I traveled it with a convoy,
      forty donkeys, twenty guards, one very nervous scribe
      counting every grain.
      At each well the guards changed,
      at each station the seals were checked.
      Boring. Perfect. That's what good government looks like:
      a road so safe the scribe gets bored counting.
    description: "Kush's viceroy rebuilds the desert road and the gold flows north without bandits — good government looking like a bored scribe on a safe road."
    status: "first draft"
    sha256: "042423935e5fb8e828be3857f7f32b35de500a492678212204f45d6c29a89afe"
  - number: "0831"
    volume: 2
    title: "The Plow in Etruria"
    date: "c. 996 BCE"
    region: "Italy"
    poem: |
      The Villanovan farmers yoked their oxen
      to the heavy plows and broke the Tuscan soil —
      rich, dark, deep, the kind of earth
      that makes men stay put and build towns.
      I walked behind a team one spring morning,
      the furrows turning over like pages in a book.
      The farmer read them like scripture:
      "This one's for wheat. This one's for the vines.
      This one's for my grandchildren."
      He was planning in centuries.
      Tuscany has been keeping his schedule ever since.
    description: "Villanovan farmers break the rich Tuscan soil with heavy ox-drawn plows — a farmer planning in centuries, and Tuscany keeping his schedule ever since."
    status: "first draft"
    sha256: "e1283b4dc8d50449f7c97e9fad8410a3b62979a5d1c99a5975538f921f302789"
  - number: "0832"
    volume: 2
    title: "Smiths of the Copper Isle"
    date: "c. 993 BCE"
    region: "Cyprus"
    poem: |
      The Cypriot smiths hammered copper
      into bowls so thin they rang like bells —
      held to the light, you could almost see through them.
      I tapped one with my knuckle and it sang,
      a clear high note that hung in the forge air.
      The smith smiled, shy and proud.
      "For a king's table," he said.
      "Or a god's." He didn't seem to see much difference.
      Neither did I, holding that singing bowl —
      some things are too beautiful for the distinction.
    description: "Cypriot smiths hammer copper into bowls so thin they ring like bells — too beautiful for the distinction between a king's table and a god's."
    status: "first draft"
    sha256: "6b46122172962fa3c171366270be0a542330b9900918a9a9e5db68ad3d8cad89"
  - number: "0833"
    volume: 2
    title: "Iron in the Doab"
    date: "c. 990 BCE"
    region: "India"
    poem: |
      Between the Ganges and the Yamuna,
      the smiths were smelting iron from black sand —
      a different fire, a different ore,
      but the same gray miracle.
      I watched the bloom pulled from the furnace,
      spongy and glowing, hammered into shape,
      and thought of the Levantine forge
      where I'd seen it first, forty years before.
      The secret had traveled three thousand miles
      without a single written word.
      Ideas don't need passports.
      They just need someone willing to try the fire.
    description: "Smiths between the Ganges and Yamuna smelt iron from black sand — the gray miracle traveling three thousand miles without a single written word."
    status: "first draft"
    sha256: "93ed603ae13a3efe316e3d021ba2f1e66da0079b819f0dbaa2b208db654d8c94"
  - number: "0834"
    volume: 2
    title: "Scribes of the Proverbs"
    date: "c. 988 BCE"
    region: "Levant"
    poem: |
      In Solomon's court the scribes collected wisdom
      like other men collect taxes —
      from merchants of every nation,
      from sailors, farmers, caravan masters:
      sayings, riddles, hard-won truths.
      I sat with them as they sorted the scrolls,
      arguing over which proverb earned its place.
      "A soft answer turns away wrath" — in.
      "The sluggard's field" — in.
      Three thousand years later, people who never heard of Solomon
      still quote his filing clerks.
      That's the thing about wisdom:
      it doesn't care who collected it.
    description: "In Solomon's court, scribes gather wise sayings from merchants of every nation — wisdom that doesn't care who collected it, still quoted three millennia on."
    status: "first draft"
    sha256: "74e9238a57c90b8792618e03d8aaa8a63e1c6d8fada827fa960122c5c534ae3b"
  - number: "0835"
    volume: 2
    title: "Purple at Its Peak"
    date: "c. 985 BCE"
    region: "Phoenicia"
    poem: |
      The dyers of Tyre had perfected it —
      the double dip, the exact timing,
      purple so deep it was almost black,
      so rich it seemed to glow from within.
      Only kings might wear it. That was the law.
      I saw a length of it once, held to the sun,
      and understood why men killed for thrones:
      power you can see from across a courtyard.
      The dyer's hands were stained for life.
      He wore his craft on his skin,
      the way kings wore his work on their backs.
    description: "Tyre's dyers perfect the double-dipped purple that only kings may wear — power you can see from across a courtyard, stained into the dyer's hands for life."
    status: "first draft"
    sha256: "d8a6a941234a8fd50a401ee2be0f9dba2c239d743b2b5bf6b1a513757ce070e8"
  - number: "0836"
    volume: 2
    title: "The Potter's Compass"
    date: "c. 983 BCE"
    region: "Greece"
    poem: |
      He was tired of wobbling circles —
      so the potter lashed several brushes together,
      set them on a pivot, and spun:
      perfect concentric rings in a single turn,
      round as the moon, true as mathematics.
      I watched his apprentices gasp.
      It was such a small invention —
      a few reeds, a bit of string —
      but every jar in Athens would wear its mark
      for a hundred years.
      Genius doesn't always roar.
      Sometimes it just draws a better circle.
    description: "A Greek potter invents the multiple brush — perfect circles in one turn, genius that doesn't roar but just draws a better circle."
    status: "first draft"
    sha256: "60c9acc95cb95d0f26f00a9787f9d8948cf485444a2446de9c3d470d9fa25f94"
  - number: "0837"
    volume: 2
    title: "Nok Fires Its Clay"
    date: "c. 980 BCE"
    region: "West Africa"
    poem: |
      In the Nigerian highlands the Nok potters
      fired their terracotta heads —
      lifelike, detailed, each face distinct,
      Africa's first portraits, staring out of the clay
      with eyes that had seen a thousand years
      before anyone wrote a word about them.
      I held one, still warm from the firing,
      and the face looked back at me —
      calm, certain, utterly human.
      No one knows their names.
      But we know their faces.
      Sometimes that's the better immortality.
    description: "Nok potters in the Nigerian highlands fire lifelike terracotta heads — Africa's first portraits, names lost but faces kept: the better immortality."
    status: "first draft"
    sha256: "2363f3b776c842a8f7b54acec638b18d15b9b8987fa5bb79b38a56fb00d4727c"
  - number: "0838"
    volume: 2
    title: "The Feathered Traders"
    date: "c. 978 BCE"
    region: "Mesoamerica"
    poem: |
      Along the Gulf coast the great canoes went out —
      Olmec merchants with jade and cacao,
      feathers bright as parrots,
      paddling the long green miles between cities.
      I rode with them down the coast once,
      the water glassy, the jungle walling both sides.
      At each landing, the bargaining:
      jade for salt, cacao for cotton,
      news for news — the truest currency.
      They called themselves traders.
      They were really the internet of their age,
      carrying everything that mattered.
    description: "Olmec merchants trade jade and cacao along the Gulf coast in great canoes — the internet of their age, carrying everything that mattered."
    status: "first draft"
    sha256: "6fecd57678665294cb007cf97bc574c42185199c75fe386097a5892b694dc0b9"
  - number: "0839"
    volume: 2
    title: "Bubastis the New Power"
    date: "c. 975 BCE"
    region: "Egypt"
    poem: |
      Shoshenq made Bubastis his capital —
      not Thebes, not Memphis, but his own city,
      a Libyan city on the Nile,
      with new walls, new temples, new men.
      I walked its streets in the building years,
      dust everywhere, scaffolds on every corner,
      the air smelling of fresh plaster and ambition.
      Capitals are statements.
      This one said: the old order is over,
      and we're not asking permission.
      Egypt had a new center of gravity.
      It just hadn't told the old gods yet.
    description: "Shoshenq makes Bubastis his capital — a Libyan city ruling the Nile, a statement that the old order is over and no permission was asked."
    status: "first draft"
    sha256: "8406a8d9f1eb883b1d70ee5feedc4db878a5c16a4201f82d2bca1c293f8beb44"
  - number: "0840"
    volume: 2
    title: "Fleets to Tarshish"
    date: "c. 973 BCE"
    region: "Levant"
    poem: |
      Three years. That's how long the voyage took —
      out past the Pillars, to Tarshish and back,
      the ships returning heavy with silver,
      so heavy the hulls rode low in the water.
      I never made the run myself —
      three years was longer than I could spare —
      but I was on the quay when one came in,
      and watched the ingots stacked on the dock
      till they gleamed like a second sunrise.
      The sailors were thin, bearded, grinning.
      Rich men, every one. The sea pays,
      if you survive the invoice.
    description: "Hiram and Solomon's ships sail three years to Tarshish and return heavy with silver — the sea pays, if you survive the invoice."
    status: "first draft"
    sha256: "638c031b3ce8a5d3538c5c1ae82ff2ef01c2adc8cf36aa64726748167a2faece"
  - number: "0841"
    volume: 2
    title: "Frankincense Road"
    date: "c. 970 BCE"
    region: "Arabia"
    poem: |
      From Yemen's wadis the camel caravans came north —
      frankincense, myrrh, the resins of heaven —
      a thousand miles of desert, well to well,
      to the temples of the north that burned it by the ton.
      I walked a stretch with them,
      the camels' bells the only music for days.
      The caravan master showed me the resin,
      held it to my nose: smoke, sweetness, distance.
      "Gods like the smell," he said simply.
      Men cross deserts for weirder reasons.
      This one, at least, smelled wonderful.
    description: "Camel caravans carry frankincense from Yemen's wadis to the northern temples — a thousand miles of desert crossed for a smell the gods like."
    status: "first draft"
    sha256: "b97a278e8c7e9e4bc456b227a30189496c1179024e5a35e16f15b7700765ca61"
  - number: "0842"
    volume: 2
    title: "Millet Tribute"
    date: "c. 968 BCE"
    region: "China"
    poem: |
      The vassals came to Haojing with their tribute —
      carts of millet, bales of silk,
      the harvest of a hundred valleys
      piled in the royal granaries.
      I watched the clerks tally it all,
      brushes flying, tallies clicking,
      the whole kingdom rendered into numbers.
      A farmer beside me watched his grain disappear
      into the royal stores and sighed.
      "They take a tenth," he said. "The locusts take more."
      Perspective. The first tax collector's best friend.
    description: "Zhou vassals haul millet and silk to the royal granaries at Haojing — a farmer watching his tenth disappear, comforted that the locusts take more."
    status: "first draft"
    sha256: "c9de849c55b50e2ea5e95ab36bf117e9d92807d3a3d8c554eb2d39bd8204a5bf"
  - number: "0843"
    volume: 2
    title: "Stonecutters in Silence"
    date: "c. 965 BCE"
    region: "Levant"
    poem: |
      No iron tools on the holy hill. That was the law —
      so the masons dressed the Temple's limestone
      in the quarries below, in silence,
      no hammer's ring on sacred ground.
      I watched them work: measure, cut, fit,
      each stone shaped far from where it would stand,
      then carried up and set without a sound.
      When it was done, the Temple rose
      without a single tool raised in its building —
      as if it had grown, not been made.
      Some holiness is just excellent planning.
    description: "Masons dress the Temple's limestone in silence — no iron tools on the holy hill — so the building rises as if it had grown, not been made."
    status: "first draft"
    sha256: "450a5f48ed1fe1dacedb319f9fd90d77bcee895ff6c40bed76d5f17e2f51ea5f"
  - number: "0844"
    volume: 2
    title: "Weavers of the Downs"
    date: "c. 963 BCE"
    region: "Britain"
    poem: |
      On the hillfort looms the women wove
      checked wool, dyed with woad and madder —
      blue and red in crossing lines,
      patterns old as the hills themselves.
      I sat with them through a gray afternoon,
      the shuttles clacking, the rain on the thatch.
      One woman held up her cloth: "My grandmother's pattern.
      Her grandmother's before her."
      Fashion changes. The checks remain.
      Three thousand years later, half the world
      still wears what those women invented on a rainy day.
    description: "British hillfort women weave checked wool dyed with woad and madder — grandmother's pattern, still worn by half the world three thousand years on."
    status: "first draft"
    sha256: "e23c94f42438f48da8f18f36dea164b1a21546e7e95f7be2bba59f25ee50cdbb"
  - number: "0845"
    volume: 2
    title: "The Queen Sets Out"
    date: "c. 960 BCE"
    region: "Levant"
    poem: |
      In Sheba the queen gave the order —
      load the camels: gold, spices, precious stones,
      gifts fit for the wisest king alive —
      and the caravan wound out of the highlands
      toward Jerusalem, months of desert ahead.
      I watched them go from the city gate,
      bells fading into the heat haze.
      She wasn't going for trade. She was going
      to test a legend with her own questions.
      That's the best reason to cross a desert
      I've ever heard.
    description: "The Queen of Sheba loads her camels with gold and spices for the long road to Jerusalem — crossing a desert to test a legend with her own questions."
    status: "first draft"
    sha256: "ccfade35a6a157d39a6d72341e2b16f9e2b251bf89ac78e6951d35181435cbe1"
  - number: "0846"
    volume: 2
    title: "The Temple Rises"
    date: "c. 958 BCE"
    region: "Levant"
    poem: |
      Seven years building, and then the dedication —
      cedar beams from Lebanon, gold overlay on every wall,
      the Ark carried in with trumpets and singing,
      the cloud filling the house till the priests couldn't stand.
      I was in the crowd outside, craning to see,
      and the singing rolled over us like weather.
      Whatever you believe about what lived in that inner room,
      something real happened on that hill that day:
      a people got a center, a story got an address,
      and the prayers of three thousand years
      found a place to land.
    description: "Solomon's Temple is dedicated — cedar, gold, and the Ark within — a people gaining a center, a story gaining an address, prayers finding a place to land."
    status: "first draft"
    sha256: "66dc2891b3cbcbfdd85208167c6e2ec599eb3ba580bf03b8a3deb331cf60dee5"
  - number: "0847"
    volume: 2
    title: "Letters for Every Port"
    date: "c. 955 BCE"
    region: "Phoenicia"
    poem: |
      The traders carried more than cargo —
      in every port, Cyprus, Crete, Sardinia,
      they scratched their 22 letters on wax and clay,
      and the locals learned them.
      I watched a Phoenician captain teach a Cretan boy
      the signs, patient as a father:
      "This is aleph. This is bet. Now you try."
      No priests. No schools. Just sailors,
      giving away the most powerful technology on earth
      for free, between cargoes.
      The alphabet didn't conquer.
      It hitchhiked.
    description: "Phoenician traders carry their letters to every port — sailors giving away the most powerful technology on earth for free, the alphabet hitchhiking the world."
    status: "first draft"
    sha256: "b78d350b8b83a2bbd229fb554d35d7d2809a1fae17c98da739ebe6f655597472"
  - number: "0848"
    volume: 2
    title: "Iron Swords for Chiefs"
    date: "c. 953 BCE"
    region: "Greece"
    poem: |
      They buried the chieftains with long iron swords —
      gray blades, straight and true,
      laid beside men who'd wielded them in life.
      Bronze was for farmers now. For tools.
      The sword had changed its metal,
      and with it, the meaning of power.
      I stood at one such grave as the earth was heaped,
      and thought: the man in the ground
      was the first of a new kind of warrior,
      and the last who'd ever doubt
      which metal the future was made of.
    description: "Greek chieftains are buried with long iron swords — bronze demoted to farmers' tools, the future's metal laid beside the new kind of warrior."
    status: "first draft"
    sha256: "4d18f39e2d1ea455ce0e9a4cdfbdce5ecddf43c755a3b41a0998af67b002cf38"
  - number: "0849"
    volume: 2
    title: "The Queen in Jerusalem"
    date: "c. 950 BCE"
    region: "Arabia"
    poem: |
      She came with hard questions —
      the Queen of Sheba, testing the wise king —
      riddles, politics, the deep things,
      and Solomon answered every one.
      I watched from the edge of the court
      as her skepticism melted, question by question,
      till she sat back, dazzled, and said
      what everyone was thinking:
      the legend was smaller than the man.
      She left her gold and took his wisdom.
      History doesn't record who got the better deal.
      I was there. I'd call it even.
    description: "The Queen of Sheba tests Solomon with hard questions and leaves dazzled — she left her gold and took his wisdom, and I'd call it even."
    status: "first draft"
    sha256: "5dabc2e500caa31b1d4866168996c4a3a831c4dc4b56e47b6a1395e9c7ec3ec7"
  - number: "0850"
    volume: 2
    title: "The High Priest's Library"
    date: "c. 948 BCE"
    region: "Egypt"
    poem: |
      On the temple ceilings at Thebes,
      the priests painted the night sky —
      stars, constellations, the hours of darkness
      mapped in perfect order overhead.
      I lay on my back on the scaffolding with them
      (don't ask how I got up there)
      and watched the heavens take shape in pigment:
      here the sun travels by night, here the dead are judged.
      It wasn't decoration. It was a textbook,
      a map, a prayer —
      the universe, filed for reference.
    description: "Theban priests paint star charts on temple ceilings — the hours of the night mapped overhead: textbook, map, and prayer, the universe filed for reference."
    status: "first draft"
    sha256: "02eeb610ce1b1bfd4b02f841a67575972c8cec427ee0fe7f67e7ae019440c024"
  - number: "0851"
    volume: 2
    title: "Shoshenq Takes the Crown"
    date: "c. 945 BCE"
    region: "Egypt"
    poem: |
      The Libyan put on the double crown,
      and just like that, a mercenary's grandson
      was Pharaoh of Egypt —
      founder of the 22nd Dynasty,
      the old blood bowing to the new.
      I was in the crowd at the coronation,
      and the cheering was real.
      Egyptians are practical people:
      a strong king is a strong king,
      whatever desert his grandfather came from.
      The crown doesn't ask for pedigrees.
      It asks for hands that can hold it.
    description: "Shoshenq I founds the 22nd Dynasty — a Libyan mercenary's grandson crowned Pharaoh, the crown asking for hands that can hold it, not pedigrees."
    status: "first draft"
    sha256: "a94ad98109fb8b60708d982a0d1f2dadeaaccb8973d70fee14db3d8ba6a250fa"
  - number: "0852"
    volume: 2
    title: "The Painted Gray Ware"
    date: "c. 943 BCE"
    region: "India"
    poem: |
      In the upper Ganges the potters
      were painting fine gray ware —
      thin lines, precise patterns,
      on smooth gray clay —
      and where the new pottery appeared,
      new towns were rising with it.
      I walked through one going up:
      mud-brick walls, straight streets,
      a market already arguing over prices.
      Potsherds are how we read the past,
      and these were spelling something new:
      here, now, a town.
      Civilization, one painted bowl at a time.
    description: "In the upper Ganges, potters paint fine gray ware — and where the new pottery appears, new towns rise: civilization, one painted bowl at a time."
    status: "first draft"
    sha256: "da13b61eadf462e52ba44001cf05245fdc83c147c47c3a216e1ce96eb5ae29aa"
  - number: "0853"
    volume: 2
    title: "Solomon's Horses"
    date: "c. 940 BCE"
    region: "Levant"
    poem: |
      The traders led them in from Egypt —
      strings of horses, fine-boned, high-stepping,
      into the new stables at Jerusalem,
      stall after stall of royal horseflesh.
      I walked the stable rows with the master of horse,
      a man who loved the animals more than the king did.
      "Chariots need them. Messengers need them.
      And the king —" he lowered his voice —
      "the king needs to be seen needing them."
      Power has always been partly theater.
      These were very expensive actors.
    description: "Egyptian horses fill Solomon's new stables at Jerusalem — power as partly theater, with very expensive four-legged actors."
    status: "first draft"
    sha256: "b7eb0547c25d41f7eb3fc36af5b3b40bb8225e4f65ffb8fbdfeae0e3546470fc"
  - number: "0854"
    volume: 2
    title: "Ivory of Damascus"
    date: "c. 938 BCE"
    region: "Syria"
    poem: |
      In the Damascus workshops the carvers
      inlaid furniture with ivory —
      white panels on dark wood,
      lions, sphinxes, lotus flowers,
      cut with knives fine as needles.
      I watched a master fit a panel
      into a chair back, testing the seam with his thumb.
      "For a king's palace," he said.
      "Or a rich man's tomb. Same work."
      The chair would outlast the king.
      The tomb would outlast the rich man.
      Only the carving was honest about it.
    description: "Damascene carvers inlay furniture with ivory for kings' palaces — the chair outlasting the king, the carving the only honest party."
    status: "first draft"
    sha256: "031f0d367c9cc0977fb01c93627bc6d9f6a469bfa3a1274292b82c008d01eb4c"
  - number: "0855"
    volume: 2
    title: "Bronze Bits and Reins"
    date: "c. 935 BCE"
    region: "Steppe"
    poem: |
      The steppe smiths cast the bronze bits —
      small, precise, fitted to the horse's mouth —
      and suddenly a rider could guide
      with a whisper of the hands.
      I watched a horseman turn his mount
      with nothing but a shift of the reins,
      the horse responding like a thought.
      "Before," the smith told me,
      "we shouted. Now we suggest."
      Civilization in a horse's mouth:
      the difference between shouting and suggesting
      is the difference between war and riding.
    description: "Steppe smiths cast bronze horse bits — riders guiding with a whisper instead of a shout: civilization in a horse's mouth."
    status: "first draft"
    sha256: "8876d33b30ffa2b4040da750f1a8d9e871b8ffe0c26ea78bcbf89d697912c8ba"
  - number: "0856"
    volume: 2
    title: "The Kingdom Splits"
    date: "c. 933 BCE"
    region: "Levant"
    poem: |
      At Shechem the ten tribes said no —
      no to the taxes, no to the forced labor,
      no to Rehoboam's heavy yoke —
      and the kingdom Solomon built
      broke in a single afternoon.
      I stood in the crowd and felt it happen:
      one people becoming two,
      Israel in the north, Judah in the south,
      brothers with a border between them.
      The old men wept. The young men cheered.
      Both were right. That's what made it tragedy
      instead of just politics.
    description: "At Shechem, ten tribes break away — Israel north, Judah south, brothers with a border between them, the old men weeping and the young men cheering."
    status: "first draft"
    sha256: "5cab7c4c1d8c12d60d3c9f02f98e79ff241f03baf489a2f405fb41f4e4be2571"
  - number: "0857"
    volume: 2
    title: "Calves at Dan and Bethel"
    date: "c. 931 BCE"
    region: "Israel (North)"
    poem: |
      Jeroboam was afraid his people would walk south —
      back to Jerusalem, back to the Temple,
      back to the old king's god —
      so he set up golden calves at Dan and Bethel:
      "Here are your gods, Israel. No need to travel."
      I saw them, gleaming in their shrines,
      and I saw the calculation behind the gold.
      Religion as border control.
      It worked, for a while. It always works, for a while.
      But gods made for politics
      have a way of melting down.
    description: "Jeroboam sets up golden calves at Dan and Bethel to keep his people from Jerusalem — religion as border control, gods made for politics."
    status: "first draft"
    sha256: "0dba7a4ab8bf40edb3d964956f0ede02b2ca713dfd79eacaa3f4fd49c23b158d"
  - number: "0858"
    volume: 2
    title: "Rehoboam's Walls"
    date: "c. 929 BCE"
    region: "Judah (South)"
    poem: |
      Rehoboam fortified the border towns —
      stone walls, spearmen, watchtowers,
      Judah dug in against its own brother.
      I walked the new walls with a mason
      who'd built them stone by stone.
      "Against Israel?" I asked.
      He didn't answer for a long moment.
      "Against whoever comes," he said finally.
      Walls don't care about the politics.
      They just stand there, waiting,
      while brothers decide whether they're enemies.
    description: "Rehoboam fortifies Judah's border towns with stone and spearmen — walls standing patient while brothers decide whether they're enemies."
    status: "first draft"
    sha256: "67aa6f0466936a2da7d043adf03761ffa7542491e6d8e97801444564c0bc4714"
  - number: "0859"
    volume: 2
    title: "Shoshenq Marches North"
    date: "c. 927 BCE"
    region: "Egypt"
    poem: |
      Pharaoh Shoshenq led his army into Canaan —
      chariots, infantry, the Libyan guard —
      and the little kingdoms opened their gates
      or wished they had.
      I followed the campaign's dust for weeks,
      and watched him carve his victories
      on Karnak's walls, city by captured city.
      Back home they'd call it glory.
      On the ground it looked like
      what it was: a big army taking what it wanted
      from small towns that couldn't stop it.
      The walls at Karnak are beautiful, though.
      Victory always photographs well.
    description: "Pharaoh Shoshenq marches into Canaan, carving his victories on Karnak's walls — a big army taking what it wants, victory always photographing well."
    status: "first draft"
    sha256: "049a8ce0bd190303b2592da4adf5988a080c9e7c5c0158de05b6a387b3b171ac"
  - number: "0860"
    volume: 2
    title: "The Temple Stripped"
    date: "c. 925 BCE"
    region: "Judah (South)"
    poem: |
      They came in the morning, Shoshenq's men —
      professional, businesslike, uninterested in prayer —
      and carried off the Temple's gold shields,
      Solomon's glory, the work of years,
      loaded onto carts like firewood.
      I watched from the street as they went,
      the gold catching the sun one last time.
      A priest beside me was crying.
      "They're just shields," I said, stupidly.
      He looked at me. "They were the days
      when nobody dared. Those days are over."
      He was right. You could feel it end.
    description: "Shoshenq's men strip the Temple's gold shields — Solomon's glory carted off like firewood, and a priest weeping because the days when nobody dared are over."
    status: "first draft"
    sha256: "e4eb93223bd0b54fe66adce3a541e2bc05a21c83c87b857aa0f353e700eef4c2"
  - number: "0861"
    volume: 2
    title: "Oars Upon Oars"
    date: "c. 920 BCE"
    region: "Greece"
    poem: |
      The shipwrights tried something new:
      two banks of oars on a single war galley,
      one above the other, double the power,
      double the speed, double the terror.
      I watched the first trials in the harbor,
      the rowers finding the rhythm —
      stroke, stroke, the hull leaping forward
      like something alive and angry.
      The old captains shook their heads.
      The young ones grinned.
      The trireme was taking shape,
      and the Mediterranean was about to get
      a lot more interesting.
    description: "Greek shipwrights try two banks of oars on a war galley — the trireme taking shape, the hull leaping like something alive and angry."
    status: "first draft"
    sha256: "ac6cc1120ee838daff30398f8f23c307736fd44ea05070d37c430975592302fb"
  - number: "0862"
    volume: 2
    title: "Villanova's Iron Age"
    date: "c. 918 BCE"
    region: "Italy"
    poem: |
      In the Villanovan graves the iron appeared —
      knives, brooches, pins,
      gray metal among the bronze,
      the future buried with the dead.
      I watched a family lay their grandfather's iron knife
      beside him in the urn, with ceremony,
      as if the metal itself were an ancestor.
      The bronze age ended in Italy
      not with a battle but with a funeral —
      the old world buried with honors,
      the new one already in the ground beside it.
    description: "Iron knives and brooches appear in Villanovan graves — the Bronze Age ending in Italy not with a battle but with a funeral, the new world already buried beside the old."
    status: "first draft"
    sha256: "977b03ff71a6da98d4cbf34f32bb1c1609f323fbe3a0b4f423a2725bd06cfc9e"
  - number: "0863"
    volume: 2
    title: "Ashur-Dan Rebuilds"
    date: "c. 915 BCE"
    region: "Assyria"
    poem: |
      Ashur-Dan repaired the walls of Ashur —
      stone on stone, the old defenses made new —
      and planted the first royal orchards,
      rows of young trees in the river plain.
      I walked the orchard lines with the head gardener,
      saplings no taller than my knee.
      "Walls keep enemies out," he said.
      "Trees keep the future in."
      A king who plants orchards
      is a king planning to stay.
      Assyria was done shrinking.
      The trees were the announcement.
    description: "Assyria's king repairs Ashur's walls and plants the first royal orchards — walls keep enemies out, trees keep the future in, and the saplings are the announcement."
    status: "first draft"
    sha256: "de9486cfe57eba97496f35b8f722c67eac89231aa63e9dd55d7435ef4cff0cb0"
  - number: "0864"
    volume: 2
    title: "La Venta Rises"
    date: "c. 913 BCE"
    region: "Mesoamerica"
    poem: |
      As San Lorenzo faded into the swamp,
      the priests were already raising La Venta —
      a new center, new plazas, new mounds,
      the sacred fire carried like an ember
      to a fresh hearth.
      I walked the new causeways with the builders,
      mud under everything, ambition over everything.
      Cities die, the priest told me.
      The gods just move house.
      He said it the way other men say
      the rains will come.
      And he was right. The rains came.
      The city rose. The old one sank
      back into the green, unmourned and unhurried.
    description: "As San Lorenzo fades, Olmec priests raise a new center at La Venta — cities die, the gods just move house, and the rains come all the same."
    status: "first draft"
    sha256: "8cab4d8d15a7e9c86acd4ae2c8e41b9a5126577d8d4a873f8445b73033cc4040"
  - number: "0865"
    volume: 2
    title: "Nok Smelts Iron"
    date: "c. 910 BCE"
    region: "West Africa"
    poem: |
      The Nok smiths built their furnaces of clay —
      tall, breathing, hungry —
      and coaxed the iron out of the ore,
      the first bloom in sub-Saharan Africa,
      glowing like a small red sun.
      I stood in the heat of it, sweat in my eyes,
      and watched the smith draw the metal,
      beat it, draw it again.
      No one taught them. They figured the fire out
      the way all smiths do: by burning things
      until something better came out.
      The iron age had reached Africa
      on its own two feet.
    description: "Nok smiths coax the first iron bloom from clay furnaces in sub-Saharan Africa — no one taught them; they figured the fire out by burning things until something better came out."
    status: "first draft"
    sha256: "79c8f035e394ecea46c33771d0313e8a65a27c18c0a9188c6506bde893e0ad04"
  - number: "0866"
    volume: 2
    title: "Kings of the Kuru"
    date: "c. 908 BCE"
    region: "India"
    poem: |
      The Kuru kings gathered the hymns —
      the family songs, the dawn praises,
      three generations of memory —
      and set them in collections, fixed, ordered,
      the first scriptures taking shape.
      I sat with the compilers as they worked,
      old priests arguing over a single syllable
      like it was a jewel.
      "Memory is a river," one told me.
      "We're building the banks."
      He was right. The river still runs.
      We're all still drinking from the banks they built.
    description: "Kuru kings gather the Vedic hymns into fixed collections — old priests building banks for the river of memory, and we're all still drinking from it."
    status: "first draft"
    sha256: "81514758103a4e64dffe753db0cd5ede3edd6e760b2f8cc4bcad960d59569c57"
  - number: "0867"
    volume: 2
    title: "The King's Hunts"
    date: "c. 905 BCE"
    region: "China"
    poem: |
      The Zhou king rode out with a hundred chariots —
      horns, hounds, banners snapping in the wind —
      to hunt in the royal parks,
      deer and boar and the king's own glory.
      I rode in the train, dust in my teeth,
      and watched him take a stag with a single arrow.
      The court cheered. The scribes wrote it down.
      That was the point, really —
      the hunt was the headline, the chariots the photograph.
      Kings have always needed their photo ops.
      His just involved more horses.
    description: "Zhou kings ride out with a hundred chariots to hunt in the royal parks — the hunt as headline, the chariots as photograph, glory with good scribes attached."
    status: "first draft"
    sha256: "e6e77abe8e20b07ebe05236159babb1f9b1614faa144d429659b85c2678036fc"
  - number: "0868"
    volume: 2
    title: "Kush's Gold Guards"
    date: "c. 903 BCE"
    region: "Nubia"
    poem: |
      Through bandit country the gold convoys went —
      donkeys loaded, guards alert,
      Nubian archers with their long bows,
      eyes on every ridge, every wadi.
      I rode guard with them for a week,
      and learned the arithmetic of the road:
      one archer per ten donkeys,
      no fires at night, no talking at the passes.
      The gold got through. It always got through.
      That's the thing about treasure:
      it hires the best protection,
      and the protection becomes the story.
    description: "Nubian archers escort the gold convoys through bandit country to the Egyptian border — one archer per ten donkeys, no fires, no talking at the passes."
    status: "first draft"
    sha256: "c974af2a3c7e8c15c3e8f80d77e011b0d068f586a7f1b8d1015a09c9b20963da"
  - number: "0869"
    volume: 2
    title: "The Urnfield Dead"
    date: "c. 900 BCE"
    region: "Britain"
    poem: |
      On the downs they buried the ashes —
      cremated dead in clay urns,
      set beneath round barrows on the high grass,
      the wind combing the turf above them.
      I stood on a barrow at sunset
      and looked out over the valley:
      a hundred mounds, a hundred families,
      the whole landscape a cemetery
      that was also a map of who belonged.
      The dead hold land differently than the living.
      They hold it forever, and ask for nothing
      but to be left in the view.
    description: "Britons bury cremated ashes in urns beneath round barrows on the downs — the dead holding the land forever, asking only to be left in the view."
    status: "first draft"
    sha256: "4f38bdb5c37101d4b3713affbe81fea5be1f5b2556ed00d4d930b805b06242df"
  - number: "0870"
    volume: 2
    title: "Singers of Old Wars"
    date: "c. 895 BCE"
    region: "Greece"
    poem: |
      In the chieftains' halls the blind singers
      took up their lyres and sang the old war —
      Troy, the ships, the wrath of Achilles —
      tales four hundred years old,
      kept alive in meter and music.
      I sat by the fire and listened,
      and watched the warriors' faces
      go strange and bright in the firelight.
      They'd never seen Troy. Neither had the singer.
      Didn't matter. The song was truer than memory —
      it was what the war meant,
      and meaning outlives every witness.
    description: "Blind singers chant tales of Troy to lyre music in chieftains' halls — the song truer than memory, meaning outliving every witness."
    status: "first draft"
    sha256: "3a82f907a4307bb64f60a4169715a56d1524b3350c061b59ff5b53d057477499"
  - number: "0871"
    volume: 2
    title: "Ashurnasirpal Takes the Throne"
    date: "c. 883 BCE"
    region: "Assyria"
    poem: |
      A ruthless young king seized Assyria's throne,
      and the court learned the new rules quickly:
      obey, or be an example.
      I was in Kalhu in those first months,
      and the fear was a physical thing —
      in the corridors, in the scribes' hands,
      in the way men chose their words.
      He'd make Assyria the terror of the world.
      The empire would run on dread for a century.
      It worked. That's the worst part.
      It worked, and everyone learned the lesson:
      cruelty scales.
    description: "A ruthless young king seizes Assyria's throne — the court learning fast that cruelty scales, and the empire's terror beginning."
    status: "first draft"
    sha256: "5efcf5c256c528caecd11d72bc978a8dfe8d9922c8a4612afa122c19755b88b3"
  - number: "0872"
    volume: 2
    title: "Kalhu the New Capital"
    date: "c. 880 BCE"
    region: "Assyria"
    poem: |
      Ashurnasirpal raised Kalhu from the plain —
      cedar palaces, stone bulls at the gates,
      walls that made the horizon look small.
      I walked the new streets as they rose,
      masons everywhere, the air white with dust.
      At the gates the great winged bulls stared down,
      half lion, half eagle, all warning.
      Capitals are autobiographies in stone.
      This one said: I am power, I am permanent,
      kneel.
      Nineveh would replace it someday.
      The bulls would outlast them both.
    description: "Ashurnasirpal raises a new capital at Kalhu — cedar palaces, winged stone bulls at the gates, an autobiography in stone that says kneel."
    status: "first draft"
    sha256: "064f1aca3c52360c0b773b57c1dcbefd7f787b5841e67b35ce569d658878815a"
  - number: "0873"
    volume: 2
    title: "The Ziggurat Repaired"
    date: "c. 878 BCE"
    region: "Mesopotamia"
    poem: |
      Babylon's priests patched the great tower —
      fresh-baked bricks, new bitumen,
      the ziggurat's skin made whole again.
      I carried bricks up the ramps with the work gangs,
      the city spread below like a clay model.
      An old priest supervised, fussy as a mother:
      "Every brick in its course. The gods count."
      Maybe they do. Or maybe the counting
      is the prayer — the care, the patience,
      the refusal to let the tower crumble
      on your watch.
    description: "Babylon's priests repair the great temple tower with fresh-baked bricks — every brick in its course, the gods counting, the care itself the prayer."
    status: "first draft"
    sha256: "6d44ac406668d46501fed62bbe6990c4e1ce95fc4976f6bc2f2ba70a58dc52c2"
  - number: "0874"
    volume: 2
    title: "Jezebel's Dowry"
    date: "c. 875 BCE"
    region: "Israel (North)"
    poem: |
      She came from Tyre with her dowry —
      a princess, beautiful, certain,
      bringing Baal's priests in her train
      like wedding guests who'd never leave.
      I watched the procession enter Samaria,
      purple and gold, incense and confidence.
      Ahab was smitten. The court was dazzled.
      Only the old prophets frowned into their beards.
      Marriages make alliances. This one made a war —
      of gods, of altars, of everything Israel thought it was.
      All from a wedding. History loves an ironic dowry.
    description: "Tyre's princess Jezebel marries King Ahab, bringing Baal's priests to Samaria — a wedding that becomes a war of gods, history loving an ironic dowry."
    status: "first draft"
    sha256: "cf7e4499e11b9c115b9fb097de7cf9aa63d0cce932ec9a62b4c76a8b5c233e2a"
  - number: "0875"
    volume: 2
    title: "The Widow's Oil"
    date: "c. 872 BCE"
    region: "Levant"
    poem: |
      In Zarephath the widow had almost nothing —
      a handful of flour, a little oil,
      one last meal for her and her son —
      and the prophet asked for it first.
      She shared it anyway. That's the story.
      And the jar never emptied. That's the miracle.
      I wasn't there for the miracle —
      or maybe I was, and it looked like this:
      a woman deciding that generosity
      was more real than arithmetic.
      The jar never empties for people like that.
      I've seen it happen. It always looks like sharing.
    description: "In Zarephath, a widow shares her last flour with a prophet — and the jar never empties; generosity proving more real than arithmetic."
    status: "first draft"
    sha256: "d7505a4e34c163b59c9d578e3c963e34f2e0cdf168083a1d9da584a156d6d7d7"
  - number: "0876"
    volume: 2
    title: "A Woman Rules Thebes"
    date: "c. 870 BCE"
    region: "Egypt"
    poem: |
      In Thebes the High Priestess governed —
      not as regent, not as placeholder,
      but as ruler in all but name:
      the seal, the granaries, the troops, the gods.
      I attended her court and watched the petitioners
      bow as low as they'd bow to any pharaoh.
      She had the bearing of someone
      who'd stopped waiting for permission.
      Egypt's south had a king in everything but title,
      and the title was the only thing
      she'd decided she didn't need.
    description: "A high priestess governs Upper Egypt like a pharaoh in all but name — the bearing of someone who stopped waiting for permission."
    status: "first draft"
    sha256: "add835116fc2bfc195deca60cbe37549d3f9c0c911fbfac9c49771453bff2ae4"
  - number: "0877"
    volume: 2
    title: "Elijah on Carmel"
    date: "c. 868 BCE"
    region: "Israel (North)"
    poem: |
      On Mount Carmel the prophet stood alone —
      one man, against Baal's four hundred priests,
      the drought on the land, the king watching.
      They built their altars. They called their god.
      Nothing. He called his — and the fire fell.
      I was on that mountain. I saw the crowd's faces
      change all at once, like a field of wheat in wind.
      Whatever you think happened up there,
      something real broke that day:
      the spell of the imported gods,
      the fear that Israel's God had left.
    description: "A lone prophet faces Baal's priests on Mount Carmel as drought grips the land — the crowd's faces changing all at once, like wheat in wind."
    status: "first draft"
    sha256: "bfe2de1325a981fbd0556ccaca1bf137c9c403802eabc207528b7ed9b4d5e1d1"
  - number: "0878"
    volume: 2
    title: "Bronze Founders' Quarter"
    date: "c. 865 BCE"
    region: "China"
    poem: |
      At the Zhou capital whole streets
      rang with the hammering —
      bronze workshops, furnace after furnace,
      founders casting vessels, bells, weapons,
      the air tasting of hot metal.
      I walked the quarter at dusk,
      deafened and delighted,
      sparks rising like fireflies from every door.
      A founder showed me his newest vessel,
      still warm, the inscription fresh:
      his name, his king, his prayer.
      Industry with a signature.
      Three thousand years later, we still know his name.
    description: "At the Zhou capital, whole streets ring with bronze workshops — industry with a signature, and we still know the founder's name three thousand years on."
    status: "first draft"
    sha256: "944f37921a5f8cea04529210976757b76d6187821a8ba3a34cf3849f642cdd4a"
  - number: "0879"
    volume: 2
    title: "Forest Sages"
    date: "c. 862 BCE"
    region: "India"
    poem: |
      They left the villages for the forest —
      the hermits, the questioners —
      to sit under the trees and ponder
      what the hymns really meant.
      I found one at dusk, sitting by a small fire,
      and asked what he'd learned.
      He smiled. "That the question is the answer.
      That the fire and the dawn they sang about
      are the same fire, the same dawn,
      inside us."
      Philosophy was stirring in the Indian forest,
      quiet as roots growing.
      It would shake the world louder than any army.
    description: "Hermits withdraw to the Indian forests to ponder the hymns' meaning — philosophy stirring quiet as roots, destined to shake the world louder than armies."
    status: "first draft"
    sha256: "a198a1a5ac5d4cd8fbc24b08a296f367a4f6cf9e1cf1508341b9c4b927487d8b"
  - number: "0880"
    volume: 2
    title: "A Vineyard Seized"
    date: "c. 862 BCE"
    region: "Israel (North)"
    poem: |
      Naboth's vineyard lay by the king's palace at Jezreel —
      good land, old vines, a family's inheritance —
      and the king wanted it for a vegetable garden.
      He offered money. Naboth refused: it was his fathers'.
      So the queen had Naboth killed on false charges,
      and the king took the vineyard.
      I walked those rows afterward, the grapes ripening,
      and the whole place felt cursed.
      The prophet said so to the king's face.
      Power had taken a man's field.
      It would cost the dynasty everything.
    description: "A king covets a farmer's vineyard at Jezreel — the queen has Naboth killed, the king takes the land, and the prophet's curse follows him home."
    status: "first draft"
    sha256: "de6afbfb680426d7717ba882efa518e473f4a19b265324aea9e6ff8252c71cb8"
  - number: "0881"
    volume: 2
    title: "Kimmerian Riders"
    date: "c. 860 BCE"
    region: "Steppe"
    poem: |
      They came down from the steppe like weather —
      Kimmerian horsemen, fast and merciless,
      toward Anatolia's rich valleys,
      toward farms that had never seen the like.
      I saw the dust of them from a hilltop,
      a brown cloud moving wrong against the wind,
      and the villages below starting to run.
      Nobody invades like horsemen.
      No warning but the drumming,
      no defense but distance,
      no mercy but speed.
      The valleys would remember their names
      in nightmares for a hundred years.
    description: "Kimmerian horsemen sweep down from the steppe toward Anatolia — nobody invades like horsemen, and the valleys remember in nightmares."
    status: "first draft"
    sha256: "4d3da05e096da601b6190f416bde72421224ee1002ed1eefef133619ccff6fe8"
  - number: "0882"
    volume: 2
    title: "Colossal Heads at La Venta"
    date: "c. 860 BCE"
    region: "Mesoamerica"
    poem: |
      At La Venta the sculptors raised the giant heads —
      basalt faces, frowning, helmeted,
      watching over the new capital
      with the patience of stone.
      I stood before the largest at noon,
      its shadow falling over me like a judgment.
      The sculptor's apprentice told me
      each head was a king, each king a god,
      each god a promise that the city would stand.
      The city fell. The heads stayed.
      Stone keeps its promises better than kings.
    description: "Sculptors raise giant stone heads over the new Olmec capital at La Venta — the city fell, the heads stayed; stone keeps promises better than kings."
    status: "first draft"
    sha256: "a549ca49dd4b54a9ddd8885f593510e53ee9c2b71f97d8e1ce24bbce6b80169e"
  - number: "0883"
    volume: 2
    title: "The Prophet's Mantle"
    date: "c. 858 BCE"
    region: "Levant"
    poem: |
      They crossed the Jordan together, the old prophet and the young —
      and then the whirlwind came, the chariots of fire,
      and Elijah was gone, taken up,
      leaving only his cloak fallen on the riverbank.
      Elisha picked it up. Put it on.
      Struck the water — and the river parted.
      I stood on that bank and watched a succession happen
      with no election, no coronation, no paperwork:
      just a fallen cloak, and a young man
      brave enough to pick it up.
    description: "Elijah's cloak falls to Elisha as the old prophet vanishes in fire — a succession with no election, just a fallen mantle and the courage to pick it up."
    status: "first draft"
    sha256: "91e9780c075a9031237f32471ee42082a1717de03b92ac8a1887782b61d144fe"
  - number: "0884"
    volume: 2
    title: "Hillforts Multiply"
    date: "c. 856 BCE"
    region: "Britain"
    poem: |
      A hundred hillforts crowned Britain's hills —
      every valley with its chief, its walls, its spears,
      the whole island bristling like a hedgehog.
      I climbed to half a dozen that summer,
      each chief certain his walls were the strongest,
      each valley certain its neighbors were the problem.
      It was ridiculous. It was human.
      It was the same story playing out
      in a hundred places at once,
      because fear is the most contagious thing
      ever carried up a hill.
    description: "A hundred hillforts crown Britain's hills — every valley with its chief and walls, fear the most contagious thing ever carried up a hill."
    status: "first draft"
    sha256: "8deeb1013af8ef738c026b833b443994b524d81e7eb2c2904e09dba8cd46bd64"
  - number: "0885"
    volume: 2
    title: "The Battle of Qarqar"
    date: "c. 853 BCE"
    region: "Syria"
    poem: |
      Twelve kings stood together at Qarqar —
      Israel, Damascus, and ten more,
      chariots and infantry shoulder to shoulder —
      and stopped Assyria's army cold.
      I walked that field after the battle,
      the ground churned, the air still tasting of iron.
      Assyria claimed victory in its records.
      Everyone else knew better:
      for one day, the small kingdoms held the line,
      and the empire learned that twelve
      is more than one, even when the one is Assyria.
    description: "Twelve kings — Israel and Damascus among them — halt Assyria's army at Qarqar; for one day the small kingdoms hold the line."
    status: "first draft"
    sha256: "35742e528d157b9e48d6edc427eeaf7c768e4abbf0ee9f5d6506eeeb8289cd2e"
  - number: "0886"
    volume: 2
    title: "Princes of Villanova"
    date: "c. 852 BCE"
    region: "Italy"
    poem: |
      They buried the rich chiefs with bronze buckets
      and horse gear, with weapons and ornaments —
      princes going into the earth
      like they were going into battle.
      I watched one funeral, the grave goods gleaming,
      the mourners solemn and a little bit proud.
      Something was stirring in these hills —
      wealth, horses, craftsmanship, ambition —
      the ingredients of Etruria,
      not yet named, not yet built,
      but already gleaming in the grave goods.
    description: "Rich Villanovan chiefs are buried with bronze buckets and horse gear — the ingredients of Etruria gleaming in the grave goods, not yet named."
    status: "first draft"
    sha256: "aa212acae9f101851a53156d8920d7b6c89c325e0687eb498b28271336fc7859"
  - number: "0887"
    volume: 2
    title: "The Ram of Amun"
    date: "c. 851 BCE"
    region: "Nubia"
    poem: |
      The Kushite craftsmen cast the bronze rams —
      Amun's sacred animal, curled horns, steady gaze —
      for the temples from Napata to Thebes.
      I watched the pouring, the metal running
      like a small bright river into the mold,
      and when it cooled, the ram emerged:
      patient, powerful, divine.
      "Sacred from Napata to Thebes," the founder said,
      polishing the horns.
      Two kingdoms, one god, one bronze ram —
      faith cast in metal, built to outlast
      every argument about who owned it.
    description: "Kushite craftsmen cast bronze rams for Amun's temples from Napata to Thebes — faith in metal, built to outlast every argument about ownership."
    status: "first draft"
    sha256: "84f3446c0892c3daa5955aefb9c1949dabefe92884c85bb03cf7824499b0b8af"
  - number: "0888"
    volume: 2
    title: "Potters of the Dipylon"
    date: "c. 850 BCE"
    region: "Greece"
    poem: |
      In Athens the potters raised their grave markers —
      towering vessels, painted with funeral scenes:
      the body laid out, the mourners tearing their hair,
      chariots, warriors, grief in black-figure rows.
      I stood in the Dipylon cemetery among them,
      these clay monuments to the dead,
      and read the scenes like pages.
      No words. None needed.
      The potters had invented something new:
      art that mourns out loud,
      so the living don't have to do it alone.
    description: "Athenian potters paint funeral scenes on towering grave markers — art that mourns out loud, so the living don't have to do it alone."
    status: "first draft"
    sha256: "c7376a3b8472d329adac0cbd017a118b5c2553701c92a3d2f6c3a17367a1a6fa"
  - number: "0889"
    volume: 2
    title: "Libyan Chiefs in the West"
    date: "c. 850 BCE"
    region: "Egypt"
    poem: |
      In the western Delta the Libyan chieftains
      ruled like kings and answered to no pharaoh —
      their own courts, their own troops, their own laws,
      Egypt in name, Libya in fact.
      I dined in one such court,
      the chief sprawling on cushions,
      his sons practicing with spears in the courtyard.
      "Pharaoh?" He laughed. "Which one?"
      Egypt was becoming a patchwork —
      a quilt of little kingdoms,
      each square insisting it was the whole blanket.
    description: "Libyan chieftains rule the western Delta like kings, answering to no pharaoh — Egypt becoming a patchwork quilt, each square insisting it's the blanket."
    status: "first draft"
    sha256: "5cb2933e7c0e28c09d3017e642d4ae4a3dce183ce9faa4137add7e62d713483c"
  - number: "0890"
    volume: 2
    title: "The King's Bronzes"
    date: "c. 850 BCE"
    region: "China"
    poem: |
      The Zhou king cast his great cauldron —
      bronze, massive, inscribed with his victories,
      a record for the ancestors in metal that wouldn't rot.
      I watched the inscription cut, character by character:
      battles won, rebels punished, Heaven's favor confirmed.
      "For the ancestors," the scribe said.
      "Also for everyone who comes after,"
      he added, quieter. "Let them know."
      Propaganda in bronze. But honest, in its way —
      he really did win those battles.
      The cauldron doesn't lie. It just doesn't mention
      the ones he lost.
    description: "A Zhou king casts a great bronze cauldron recording his victories — propaganda in bronze, honest in its way, silent about the battles he lost."
    status: "first draft"
    sha256: "d489c1221bc7361c633325d312c042e5a2fe1ad36764876b614aba9e23d65dbc"
  - number: "0891"
    volume: 2
    title: "Nets in the Sea of Galilee"
    date: "c. 850 BCE"
    region: "Levant"
    poem: |
      At dawn the fishermen cast their round nets —
      the same motion, the same water,
      as a thousand years before them
      and a thousand years after.
      I sat in a boat with them one morning,
      the mist on the water, the nets flying out
      in perfect circles, sinking, drawn in silver with fish.
      One old fisherman looked at me and shrugged:
      "My father did this. His father. It works."
      Three thousand years of mornings,
      and the deepest wisdom on the lake
      was four words: it works.
    description: "Fishermen cast round nets at dawn on the Sea of Galilee as they have for a thousand years — the deepest wisdom on the lake: it works."
    status: "first draft"
    sha256: "f73c944498d9571762a70847df2676e1a0115cd3f23ca9ee2e5e40a5b583c10b"
  - number: "0892"
    volume: 2
    title: "Pipes of Phrygia"
    date: "c. 850 BCE"
    region: "Anatolia"
    poem: |
      The Phrygian shepherds piped their wild tunes —
      reed flutes, shrill and sweet,
      music for lonely hills and restless goats.
      I sat on a rock and listened
      as the notes went spiraling up
      into the big Anatolian sky.
      Greece would borrow this music,
      tame it, write it down, call it their own.
      But I heard it first at the source:
      a shepherd, a reed, a hillside,
      and a tune too wild to stay in one country.
    description: "Phrygian shepherds pipe wild tunes on reed flutes — music Greece will borrow, but heard first at the source: a shepherd, a reed, a tune too wild for one country."
    status: "first draft"
    sha256: "b36d4f503a7402319a610cdae7f6f9bee06a6475a3831a38ffb784b635694100"
  - number: "0893"
    volume: 2
    title: "The Scribe's Last Tablet"
    date: "c. 850 BCE"
    region: "Phoenicia"
    poem: |
      An old scribe in Tyre inked the 22 letters
      one more time — slowly, carefully,
      aleph to taw, the way he'd learned as a boy —
      and set down his brush.
      I asked him what he was writing.
      "Nothing," he said. "Everything."
      He knew the letters had left him long ago —
      carried to Cyprus, to Greece, to the ends of the earth,
      belonging to the world now, not to Tyre.
      He smiled, and the smile was pure:
      a man watching his children
      go out and conquer the world
      without ever leaving home.
    description: "A Phoenician scribe inks the 22 letters one final time — the alphabet belonging to the world now, his children going out to conquer it without ever leaving home."
    status: "first draft"
    sha256: "363f7fbdb94f81af856d1b5277f3433147a2e2d6394af084780c960d2aea7fc4"
  - number: "0894"
    volume: 2
    title: "The Prophet of the Flame"
    date: "c. 850 BCE"
    region: "Persia"
    poem: |
      I heard him on a hillside where the wind cut thin,
      a herdsman with a song in his mouth and fire within.
      One god, he said — the light, the truth, the wide clean sky —
      the darkness only borrows what the light lets by.
      I watched the old priests frown and clutch their altars near.
      I watched the farmers listen, unafraid, and hear
      a world made right, a choice set plain before each man:
      to walk with light, or lose it. That was Zoroaster's plan.
      His hymns are written down now. Kings will take them up.
      Whole empires will be built and fall; they'll still pour out the cup.
    description: "I stood in the cold hill wind while Zoroaster sang that light and truth were one god, and darkness only a shadow. His hymns outlived every king who ever ruled Persia."
    status: "first draft"
    sha256: "9da187158804b6ce35d738ecdc54f3843f42b6d85d9983c36289e87cf07c8b93"
  - number: "0895"
    volume: 2
    title: "The Purple Vats of Tyre"
    date: "c. 850 BCE"
    region: "Levant"
    poem: |
      Come to Tyre at low tide and smell the boiling sea.
      Ten thousand snails for one small cloak — I saw them die for me.
      The vats ran black-red, stinking, rich, the dyers' hands stained deep,
      and purple came out glowing like a sunset caught asleep.
      Kings will kill for that color. Rome will cloak its pride in it.
      I watched them ladle it like blood and knew it was worth it —
      not the dye, the wanting. Purple never fades.
    description: "I stood beside the stinking purple vats of Tyre, where thousands of sea snails died to dye a single cloak the color of kings. Worth more than gold, and kings would kill for it."
    status: "first draft"
    sha256: "5aa7430e51eea7eb9079caf10dc6deaf4ede56e405655a42c064552e811d9e34"
  - number: "0896"
    volume: 2
    title: "The Black Obelisk"
    date: "841 BCE"
    region: "Assyria"
    poem: |
      Black stone, four-sided, and the carvers got it true —
      I watched Jehu bend his knee the way the frightened do.
      He brought his tribute up the road, gold and silver too,
      and knelt before Shalmaneser with the whole world looking through.
      The Assyrians loved to carve it: kings made small and low.
      I stood there in the dust and thought how soon the tables go —
      one man's triumph in black basalt is another man's bad year,
      and stone remembers longer than the king's fear.
    description: "I watched the king of Israel kneel in the dust before the Assyrian conqueror, his shame carved forever into black stone. One man's triumph is another man's worst day."
    status: "first draft"
    sha256: "737ef21b1625a04dfff3ee10c9c92bf123a118a17bb9895fc95215fa89b381fa"
  - number: "0897"
    volume: 2
    title: "The Alphabet Sails West"
    date: "c. 830 BCE"
    region: "Phoenicia"
    poem: |
      Twenty-two little shapes. That's all they carried, see —
      no god, no king, no army, just scratches on the quay.
      I sailed with traders out of Tyre, watched them teach the shore:
      a mark for every sound a man could make, and nothing more.
      They taught it in the harbors, drew it in the sand,
      and every dockside boy who learned it held a pen in his hand.
      No priests to hoard the writing. No palace held the key.
      Twenty-two small letters set the whole sea free.
    description: "I sailed with Phoenician traders who carried only twenty-two letters to every harbor they found. No king, no army, no priest needed — just marks anyone could learn."
    status: "first draft"
    sha256: "8c27335b60a65add25e87f92d6bc74d710fcec051e0f1e9aab782c39f6380dae"
  - number: "0898"
    volume: 2
    title: "The Ballplayers"
    date: "c. 825 BCE"
    region: "Mesoamerica"
    poem: |
      The court was stone and the sun stood straight above,
      and the ball came in like a cannon shot, hard as hate or love.
      No hands. The hips took it — I heard the smack of flesh,
      watched them launch themselves sideways, the whole game raw and fresh.
      They told me gods were watching, that the losing had a price.
      I played it in my dreaming after — no hands, the hip, the ice
      of knowing every bounce could end the way the priests decreed.
      The oldest game I ever saw, and still the fastest need.
    description: "I watched Olmec players throw their whole bodies at a heavy rubber ball, striking it with their hips while the gods watched. Life and death hung on every bounce."
    status: "first draft"
    sha256: "89b9c61a130efb8ae9d1eb92982b6a0caf8eb4fc09d7be6306be2fcac1aa4ac4"
  - number: "0899"
    volume: 2
    title: "Dido's New City"
    date: "814 BCE"
    region: "Carthage"
    poem: |
      She fled her brother's knives with ships and gold and pride,
      a Phoenician queen with the sea for her bride.
      The locals sold her all the land an oxhide could surround —
      she cut the hide to ribbons and claimed a kingdom's ground.
      I stood on the African shore and watched the walls go up.
      Dido's city. Carthage. They drank from a new cup.
      She didn't live to see Rome's legions at the gate,
      but I did, traveler that I am — I knew the city's fate.
    description: "I watched a fugitive queen carve an oxhide into ribbons and claim a whole city from the trick. Carthage rose on that shore — and I already knew Rome would come for it."
    status: "first draft"
    sha256: "8e43a5f546aa3f526d07fde9ab38256092ce1348418e9a37f52ec4b0185fdc49"
  - number: "0900"
    volume: 2
    title: "Semiramis of Assyria"
    date: "c. 810 BCE"
    region: "Assyria"
    poem: |
      Her son was small and the throne was wide,
      so Shammuramat stepped up and ruled Assyria from inside.
      The scribes wrote queen in the margin of the king's long list,
      and legend took her name and made a myth of it.
      I saw her in the council rooms, cool, unbowed,
      giving orders to the generals, silencing the crowd.
      Semiramis, they call her now — half woman, half tale.
      The real one ruled an empire. Legends only pale.
    description: "I sat in the council rooms while a queen mother ruled Assyria for her small son, giving orders to generals who had to obey. Legend turned her into Semiramis; the real woman was steel enough."
    status: "first draft"
    sha256: "8b7046c366911829f90e2e061eda41225080af04947b6c66dd573b46b47d0cd7"
  - number: "0901"
    volume: 2
    title: "Letters Borrowed from Phoenicia"
    date: "c. 800 BCE"
    region: "Greece"
    poem: |
      The Phoenicians brought the shapes, but the Greeks did something bold:
      they gave the breathy marks a voice — vowels, bright as gold.
      Twenty-two became a choir. The letters learned to sing.
      I watched a scribe sound out his name and felt the whole world swing.
      No more guessing at the meaning. Write it like it sounds.
      That's the tool a blind old singer will need when glory rounds
      his corner — Homer, waiting, with his wrath and wandering ships.
      The alphabet just learned to breathe. It breathes through Homer's lips.
    description: "I watched Greek scribes take the Phoenician letters and add vowels, making the first true alphabet. Writing learned to breathe — and Homer's songs were waiting to use it."
    status: "first draft"
    sha256: "8040d16d9cc76f7263794ee364a4c8e48d487e47577346c5319cf202b479ac35"
  - number: "0902"
    volume: 2
    title: "The Temple of the Fanged God"
    date: "c. 800 BCE"
    region: "Andes"
    poem: |
      High in the Andes where the thin air bites,
      I climbed to Chavín with the pilgrims in the mountain light.
      Stone jaguars snarled from every carved block and beam,
      their fangs bared in the granite, guards of some old dream.
      The priests led us through dark corridors where echoes ran,
      and the god with the fanged mouth watched stone-still, man after man.
      I put my hand against the carving and felt the mountain's cold.
      Gods wear fangs in the high places. That's the story told.
    description: "I climbed the cold mountain path to Chavín de Huántar with pilgrims, walking dark stone corridors past carved jaguars with bared fangs. The mountain's god watched us all."
    status: "first draft"
    sha256: "5cd89e318ceb75c9c71c6932ba0c4d10c785186b85ca02e8b6b17ed02d5fe387"
  - number: "0903"
    volume: 2
    title: "Riders of the King"
    date: "c. 800 BCE"
    region: "Assyria"
    poem: |
      Before the letter was a month old, it was in the king's hand —
      that's how fast the couriers ran across the land.
      I watched them change horses at the relay posts, never stopping,
      the empire's roads thrumming under hooves, the dust still dropping.
      An order given in Nineveh could reach the far frontier
      before a rebel's army had time to finish breakfast, dear.
      Assyria ruled by speed. The horse was half the sword.
      I rode behind them once. It felt like outrunning the Lord.
    description: "I watched Assyrian mounted couriers gallop the empire's roads, changing horses at relay posts and never stopping. The king's word outran armies — speed was half of Assyria's sword."
    status: "first draft"
    sha256: "fac61640beb3b59d5b5aeaad5396d4ddb2f1c64fe04952cf0640875feea2a661"
  - number: "0904"
    volume: 2
    title: "The First Ballgame"
    date: "c. 790 BCE"
    region: "Mesoamerica"
    poem: |
      They say it's the oldest team sport on the earth,
      and I believe it — I watched its rough first birth.
      A stone court sunk between two mounds of clay,
      a rubber ball, two teams, and the gods to obey.
      No gloves, no pads, just skin and bone and pride,
      hips striking hard, the ball gone wild and wide.
      I keep it in my memory like a held breath:
      the first game ever played, with life-and-death beneath.
    description: "I stood at the edge of a sunken stone court and watched the oldest team sport on earth — two teams, one rubber ball, no hands allowed, and the gods keeping score."
    status: "first draft"
    sha256: "5b11c72113bc13113b9e299f2b5c6e8d3ea6d08de5a9bd7dac50e7e85c98c4b5"
  - number: "0905"
    volume: 2
    title: "The Millet Harvest"
    date: "c. 790 BCE"
    region: "China"
    poem: |
      Foxtail millet, golden in the autumn sun —
      I swung a stone sickle with the farmers, every one.
      The old songs say it plain: the sweat, the bent-back row,
      the way the harvest fed the Zhou, the way the old songs know.
      Cut and bind and thresh it, winnow in the wind,
      feed the village, feed the lord, begin the year again.
      I sang their harvest songs with them at close of day.
      Three thousand years, and I still remember the sway.
    description: "I harvested foxtail millet with Zhou farmers under an autumn sun, swinging a stone sickle and singing the old songs at day's end. The sweat of that harvest fed a dynasty."
    status: "first draft"
    sha256: "ec0859d31b2d0f86064cea7df11ebf6d2c7609d3ffc149ea9d01f570123459db"
  - number: "0906"
    volume: 2
    title: "The First Olympic Flame"
    date: "776 BCE"
    region: "Greece"
    poem: |
      They ran at Olympia and a cook won the race —
      Coroebus, hands still floury, first across the place.
      I was in the crowd that day, cheering with the rest,
      when the fastest man in Greece turned out to bake the best.
      No gold, just an olive wreath and glory for his town.
      They wrote his name down first. It never will go down.
      Every four years since, the world has run that track —
      and it started with a cook who never looked back.
    description: "I stood in the crowd at Olympia and watched a cook named Coroebus win the very first recorded race. An olive wreath, his name written first — and the games never stopped."
    status: "first draft"
    sha256: "e786c7efcfcc2d9953eb27f391e8727889c1535bb1e1697d1509415e34974459"
  - number: "0907"
    volume: 2
    title: "The Court Flees East"
    date: "771 BCE"
    region: "China"
    poem: |
      The capital burned and the old kings died,
      so the Son of Heaven packed his court and fled east to survive.
      I walked the smoking road with them to Luoyang's walls,
      past the wreckage of the dynasty in its ruined halls.
      The Spring and Autumn age began in that retreat —
      a broken center, and the lords all on their feet,
      scheming, fighting, writing. I watched the order crack.
      The Zhou would never really come back.
    description: "I walked the smoking road east with the fleeing Zhou court after invaders sacked the capital. A broken center, ambitious lords — the Spring and Autumn age began in retreat."
    status: "first draft"
    sha256: "9729979aa872fd7295e68802366b2cad436ca83ae195dfa85545ffb9649b15e5"
  - number: "0908"
    volume: 2
    title: "The Smith's Iron"
    date: "c. 770 BCE"
    region: "Greece"
    poem: |
      I stood beside the forge and watched the smiths beat fire
      into iron that held an edge no bronze could inspire.
      Swords that didn't snap. Plowshares that bit the clay.
      Bronze became a pretty thing for priests to put away.
      The whole age turned on that anvil. I felt the hammer's ring
      change who could fight, who could farm, who could be king.
      Iron doesn't care whose hand holds it. That's the fact.
      Once the smiths knew iron, bronze never came back.
    description: "I stood at the forge and watched Greek smiths beat iron into swords and plowshares that outlasted bronze. The whole age turned on that anvil — iron doesn't care whose hand holds it."
    status: "first draft"
    sha256: "56cc0761128d7eb2d4221d9bdaf06905061cb0f9b08f6b680aca44e4070f2488"
  - number: "0909"
    volume: 2
    title: "The First Alphabet Songs"
    date: "c. 770 BCE"
    region: "Greece"
    poem: |
      A blind singer, maybe. Or many. The bards would sing
      of wrath — Achilles' wrath — and wandering, everything.
      I heard the Iliad taking shape in a tavern's smoke,
      the Odyssey in another, each line a master's stroke.
      And now, with the new letters, someone wrote them down.
      The songs stopped being smoke. They put on ink and a crown.
      I watched a scribe catch "sing, goddess" on a fresh clay sheet —
      and the oldest story in the West found its feet.
    description: "I heard the bards singing of wrath and wandering in smoky taverns, and watched scribes catch the songs in the new Greek letters. The Iliad and Odyssey stopped being smoke and became ink."
    status: "first draft"
    sha256: "ef7b2d8f7e622cd5b33c44e47aafebcd7412cc740d930be45df26273f3b99c07"
  - number: "0910"
    volume: 2
    title: "The God's Wives"
    date: "c. 760 BCE"
    region: "Egypt"
    poem: |
      At Thebes the God's Wife of Amun ruled like any queen —
      temples, lands, and grain stores, power rarely seen.
      A woman with a god's own title and a kingdom's gold,
      I watched her process through the crowds, serene and bold.
      No pharaoh dared to cross her. Her wealth outshone the crown.
      She owned the god's estates from Memphis down to town.
      In a world of kings, she held her own divine estate.
      I bowed when she passed. Even travelers learn to wait.
    description: "I watched the God's Wife of Amun process through Thebes, ruling the god's vast temples and lands like a queen. No pharaoh dared cross her — her wealth outshone the crown."
    status: "first draft"
    sha256: "d3ea03ae8b72d6e30c6b011a3cf1d517ce25e47274ad85d3e221bb4c3d28bf11"
  - number: "0911"
    volume: 2
    title: "Romulus Draws the Line"
    date: "753 BCE"
    region: "Italy"
    poem: |
      Twin boys, a she-wolf, and a line drawn in the dirt —
      that's the story, and I was there, so I can tell you it hurt.
      Romulus drew his furrow where the city walls would stand,
      and Remus jumped it laughing. Then blood soaked the land.
      Brother killed brother over a ditch. Rome began that way,
      and I watched the Tiber flow past, indifferent, gray.
      Every empire starts in mud and someone else's pain.
      Rome just wrote it down and made the pain a name.
    description: "I stood by the Tiber and watched a young man draw a furrow where Rome's walls would rise — and kill his brother for jumping it. Empires start in mud and pain; Rome just wrote it down."
    status: "first draft"
    sha256: "b794923f31b910038cd6f4f868f3c7812da999ccfc20c1774c27cdd8008cc639"
  - number: "0912"
    volume: 2
    title: "The Star Diaries Begin"
    date: "c. 750 BCE"
    region: "Mesopotamia"
    poem: |
      Every night, the same roof, the same watchful eyes —
      Babylonian priests writing down the skies.
      Cloud or clear, they noted it: the moon, the wandering stars,
      the river's height, the prices — everything, near and far.
      I sat with them through one long watch, the stylus in the clay,
      and thought: this is how you beat time. You write it down each day.
      Centuries of nights, unbroken. Nobody else kept such a book.
      The sky became a diary, if you knew how to look.
    description: "I kept a night watch with Babylonian priests on a temple roof, writing down the moon, the planets, the river's height, the grain prices. Century after century, unbroken — the sky became a diary."
    status: "first draft"
    sha256: "83b7be2aacca5557640ee848f38b197a6a478d86963b9cf3b7096d8e7660d55a"
  - number: "0913"
    volume: 2
    title: "The Villanovan Smiths"
    date: "c. 750 BCE"
    region: "Italy"
    poem: |
      In Etruria's hills the iron villages burned bright,
      smiths hammering by day, burying their dead by night —
      bronze helmets on the fallen, chariots in the ground,
      the whole warrior's pride laid down without a sound.
      I walked among the grave mounds where the iron age was young,
      heard the anvils ringing where the funeral songs were sung.
      These were the grandfathers of the Etruscans, hard and true.
      Rome would learn from them, too. Rome learned from everyone it slew.
    description: "I walked among the iron-working villages of Etruria, where smiths hammered by day and buried their warriors with bronze helmets and chariots by night. Rome would learn from these people — Rome learned from everyone."
    status: "first draft"
    sha256: "14807d50ff7e123cae03cd8694174cf17b7906d1623a07883b867287cc1329bb"
  - number: "0914"
    volume: 2
    title: "The Ivory Carvers"
    date: "c. 750 BCE"
    region: "Levant"
    poem: |
      Delicate as lace, the ivory plaques they cut —
      lions, sphinxes, lotus flowers, every edge clean-cut.
      I watched the Phoenician carvers work by lamplight's gleam,
      each plaque a small bright luxury, each detail like a dream.
      And all of it for Assyrian palaces, for the war machine's hall —
      beauty serving butchers, hung upon the wall.
      That's how it goes, I learned. The finest hands alive
      carve pretty things for empires that let the carvers survive.
    description: "I watched Phoenician carvers cut ivory plaques as delicate as lace — lions and sphinxes bound for Assyrian palaces. The finest hands alive made beauty for the war machine."
    status: "first draft"
    sha256: "bce2bbc4c23ed3971b19747cb85c5981f71e314a39f66291edab3166c18c78da"
  - number: "0915"
    volume: 2
    title: "The Tiglath Reforms"
    date: "745 BCE"
    region: "Assyria"
    poem: |
      He took the throne by force and made the army new —
      Tiglath-Pileser, and I watched what his reforms could do.
      Standing regiments. Engineers. Siege engines that could break
      any wall on earth. The earth itself would shake.
      No more seasonal levies, farmers called and sent —
      a machine of iron men, year-round, on conquest bent.
      I saw the columns march and felt the ground complain.
      The most feared army on earth, and it had Tiglath's brain.
    description: "I watched Tiglath-Pileser forge Assyria's army into a year-round machine of iron men — engineers, siege engines, standing regiments. The most feared army on earth, and the ground shook when it marched."
    status: "first draft"
    sha256: "cb37702959493116de4dc80bfb0f8be0d84fbb88f27bb06d587a9b04ab757063"
  - number: "0916"
    volume: 2
    title: "Cumae, First Foot West"
    date: "c. 743 BCE"
    region: "Italy"
    poem: |
      The first Greek keel scraped Italy's western sand,
      and I was there when Cumae rose, the first foot on the land.
      They brought the vine, the olive, and the alphabet in sacks,
      and planted them all deep where no Greek had been back.
      I drank the first wine pressed from that Italian vine
      and watched the sailors teach the locals the lettered line.
      Colonies are seeds, I thought, and this one took root fast.
      The West would speak in Greek letters. It still does, at last.
    description: "I stood on the beach when Greek sailors planted their first colony on Italy's shore, unloading vines, olives, and the alphabet. Colonies are seeds — this one took root, and the West still speaks in Greek letters."
    status: "first draft"
    sha256: "acfb0cdc98d9e94760d282523399743e3a09c90be8e4f1ce13d22940d18d5625"
  - number: "0917"
    volume: 2
    title: "The Black Pharaohs Rise"
    date: "740 BCE"
    region: "Nubia"
    poem: |
      From the south they came, the kings of Kush, tall and strong,
      and Piye led them north where the Nile runs long.
      I watched the Nubian armies march with leopard skins and pride,
      and Egypt — old, tired Egypt — opened wide.
      The double crown sat well on a black king's brow.
      The 25th dynasty. I was there. I remember how
      the priests of Thebes bowed low to a pharaoh from the south.
      History doesn't care what color wears the crown's mouth.
    description: "I marched north with King Piye's Kushite armies and watched Egypt bow to a black pharaoh. The double crown sat well on him — history doesn't care what color wears it."
    status: "first draft"
    sha256: "62738b00a79b2714f97c26342c3cc44e7396bb9a74f48157dc9a156408e1ec7b"
  - number: "0918"
    volume: 2
    title: "The Nestor Cup"
    date: "c. 735 BCE"
    region: "Greece"
    poem: |
      A clay cup, and a drinker with a sharp little knife,
      scratched a love poem into it — the sweetest thing in life.
      "Whoever drinks from this will feel desire's flame" —
      I read it when the clay was fresh. I remember the name.
      Some of the first Greek writing ever found, and it's a flirt,
      a lover's boast scratched on a cup for someone's hurt or heart.
      Forget the kings and battles. This is how writing starts:
      somebody wanting somebody, straight from the heart.
    description: "I read a love poem scratched into a clay drinking cup while the clay was still fresh — some of the first Greek writing ever found, and it's a lover's boast. Writing started with wanting."
    status: "first draft"
    sha256: "6bde6f1e078f8bb38b1920c7c31751d7ca970a5a9a55cb9cc13a1e06b2f9d10b"
  - number: "0919"
    volume: 2
    title: "Syracuse Is Founded"
    date: "734 BCE"
    region: "Sicily"
    poem: |
      Corinthians landed on Sicily's eastern shore
      and raised a city that would outshine them all and more.
      I walked the first streets of Syracuse, smelled the sea,
      and knew this one would grow rich as rich could be.
      The richest Greek city of the west, they say it'd become —
      I watched the walls go up and heard the market's hum.
      Foundations are prophecies. Lay them straight and deep.
      Syracuse would make the mighty weep.
    description: "I walked the first streets of Syracuse when Corinthians founded it on Sicily's shore, and felt the city already growing rich. Foundations are prophecies — this one would make the mighty weep."
    status: "first draft"
    sha256: "a34cd2f1f67937ba4088d120c6088046f52ea244c4f33f0d809747a45df75d65"
  - number: "0920"
    volume: 2
    title: "Piye Crowned in Memphis"
    date: "728 BCE"
    region: "Egypt"
    poem: |
      In Memphis, Egypt's ancient heart, they set the crown
      on Piye's head, and the old priests bowed down.
      I stood among the columns while the Kushite king was made
      pharaoh of the Two Lands, in the old gods' shade.
      Back home in Nubia the pyramids were rising steep —
      his people's own tombs, their own glory to keep.
      Two kingdoms, one king, the Nile running through it all.
      I watched history turn. I heard the future call.
    description: "I stood in Memphis while the Kushite king Piye was crowned pharaoh of Egypt, the old priests bowing. Back in Nubia his own pyramids were rising — two kingdoms, one king."
    status: "first draft"
    sha256: "37aea7769aa6f19a27d5d6001fd7e4430e9513ec0bbfd8567bd23da1e654ad3c"
  - number: "0921"
    volume: 2
    title: "The Provinces"
    date: "c. 727 BCE"
    region: "Assyria"
    poem: |
      Conquered lands don't rule themselves, so Tiglath drew a line:
      provinces, each with a governor who answered "mine"
      to the king alone. No local prince to scheme and plot —
      the king's own men, the king's own tax, like it or not.
      I watched the map get carved into neat Assyrian squares,
      each province stamped and filed like the empire's wares.
      It worked, too — for a while. Control is sweet and clean.
      Until the whole machine breaks down, as machines are keen to do, I mean.
    description: "I watched Assyria carve its conquered lands into provinces, each ruled by the king's own governor. Neat squares on the map, neat taxes in the coffers — control is sweet until the machine breaks."
    status: "first draft"
    sha256: "fb4b5979da8204bdefe1a47a9c7304ea8010edb6a0f8fd562524a5c943c50943"
  - number: "0922"
    volume: 2
    title: "Samaria Falls"
    date: "722 BCE"
    region: "Israel"
    poem: |
      The walls of Samaria held for years, then broke.
      I heard the Assyrian rams, I smelled the smoke.
      The northern kingdom ended in a winter's siege —
      its people led away, its king without a liege.
      Ten tribes into exile, scattered to the wind,
      and I walked the empty streets where the siege had been.
      Some wounds never heal right. Some peoples never come home.
      I stood in Samaria's dust and felt the world go numb.
    description: "I walked the empty streets of Samaria after the Assyrian siege broke them, the northern kingdom's people led into exile. Some peoples never come home — the dust was still warm."
    status: "first draft"
    sha256: "9ea858eb2f0706d0de6bf396743030e59de8609af1c346542873e892aae58551"
  - number: "0923"
    volume: 2
    title: "The Annals Begin"
    date: "722 BCE"
    region: "China"
    poem: |
      Year by year, the scribes wrote it down —
      every spring, every autumn, every lord, every town.
      The Spring and Autumn Annals: history as a sacred trust,
      each entry brushed in ink that would outlast dust.
      I watched the first brushstrokes on the bamboo slips
      and thought how strange it is that memory outlives lips.
      They kept it as a duty, not a tale to tell.
      Because of them, we know this age so well.
    description: "I watched the first brushstrokes of the Spring and Autumn Annals on bamboo slips — history kept year by year as a sacred duty. Memory outlives lips because someone wrote it down."
    status: "first draft"
    sha256: "a7d264c2c0311bdaf343cb59c97067dfecf6e89a22ae1661a13e96dc903cef76"
  - number: "0924"
    volume: 2
    title: "The Long Race"
    date: "720 BCE"
    region: "Greece"
    poem: |
      One sprint wasn't enough, so they made them run it long —
      the dolichos, two dozen laps, a grinding runner's song.
      I watched them circle Olympia's track till the dust rose red,
      legs like pistons, lungs like bellows, glory in the head.
      The first marathoners, in a way. The long game had begun.
      I cheered until my throat was raw for the one who won.
      Short races make sprinters. Long races make men.
      They added the long race, and running changed then.
    description: "I watched runners circle Olympia's track two dozen times in the new long race, dust rising red, legs like pistons. Short races make sprinters; the long race made men."
    status: "first draft"
    sha256: "39b3d8b26cf8943da15c6f6b4f12ea482cb915be434629d34d598b1f8e7edefe"
  - number: "0925"
    volume: 2
    title: "Isaiah's Vision"
    date: "c. 720 BCE"
    region: "Judah"
    poem: |
      He saw the Lord enthroned, high and lifted up,
      the temple shaking, smoke filling the cup
      of heaven — and the angels crying, "Holy, holy, holy."
      I stood beside Isaiah, and the ground felt wholly
      unsteady under me. "Woe is me," he cried, "I'm undone" —
      and a coal touched his lips, and his true work begun.
      He warned the proud kings: your towers will fall.
      I heard him. I remember it all.
    description: "I stood beside Isaiah when he saw heaven opened — the throne, the smoke, the angels crying holy. A coal touched his lips, and he began warning proud kings that their towers would fall."
    status: "first draft"
    sha256: "e596a9d946040c313f2b2345345e67e2b561f6ce108d99af650ff67e5c6dda3e"
  - number: "0926"
    volume: 2
    title: "The Kingdom of the Mountains"
    date: "c. 710 BCE"
    region: "Armenia"
    poem: |
      High around Lake Van the rock fortresses stood,
      Urartu's mountain kingdom, built of stone and blood.
      I climbed their citadel walls and looked down at the plain
      where Assyria's armies came — and came in vain.
      The mountains were their armor. The rocks were their friends.
      I watched the Assyrian columns turn at the passes' ends.
      Some kingdoms hold by being too hard to take.
      Urartu held the heights, and made the lowlands shake.
    description: "I climbed Urartu's rock fortresses above Lake Van and watched Assyrian armies turn back at the mountain passes. Some kingdoms hold by being too hard to take."
    status: "first draft"
    sha256: "cf431f33cd037dc9be9c26603e317b85d8f3d74c3fb281e1016c07a466939386"
  - number: "0927"
    volume: 2
    title: "The Hoplite Shield Wall"
    date: "c. 710 BCE"
    region: "Greece"
    poem: |
      Farmers saved their harvests and bought bronze instead of bread —
      helmet, spear, and a great round shield, and learned to fight as led,
      shoulder to shoulder, each man's shield guarding the next man's side.
      I drilled with them in the dust and felt the wall's pride.
      The phalanx. Eight deep, moving like one beast.
      No heroes needed — just neighbors, at the least.
      I stood in that line and understood the Greek way:
      stand together, or be broken, on the judgment day.
    description: "I drilled shoulder to shoulder with farmer-soldiers learning the phalanx — each man's shield guarding the next man's side. No heroes needed, just neighbors standing together."
    status: "first draft"
    sha256: "1e0bbd2bc8c88a1519b978e16222ac1205e31c0647969ceea82644ac9e05af7d"
  - number: "0928"
    volume: 2
    title: "Sargon Builds a City"
    date: "705 BCE"
    region: "Assyria"
    poem: |
      From empty ground he raised it — walls, gates, and all —
      Dur-Sharrukin, Sargon's fortress, built to overawe.
      I walked the construction site where thousands hauled the stone,
      a whole capital conjured up, a city from a throne.
      Fifteen kilometers of wall. Palaces on the hill.
      I watched the lamassu — the winged bulls — stand guard and still.
      Kings build cities to say "I was here, I am great."
      Sargon built his fast. He didn't have to wait.
    description: "I walked the construction site where Sargon raised a whole walled capital from empty ground — fifteen kilometers of wall, winged bulls guarding the gates. Kings build cities to say they were here."
    status: "first draft"
    sha256: "2734bd60c5f2d07c7d84a0c68c6bf0d1b4fb406f43607c691d046d92a10d4374"
  - number: "0929"
    volume: 2
    title: "The Tunnel Under Jerusalem"
    date: "701 BCE"
    region: "Judah"
    poem: |
      Through solid rock they carved it, two teams digging blind,
      chiseling toward each other till their hammers' sounds aligned.
      I crawled through Hezekiah's tunnel when the water first ran free,
      half a kilometer of stone, and the city could drink safely.
      The Assyrians were coming. The springs outside the wall
      would be cut off — so they brought the water in, that's all.
      An inscription marks the spot where the two crews met.
      I touched those chisel marks. They're still there yet.
    description: "I crawled through Hezekiah's water tunnel while the first water ran free — two crews digging through solid rock toward each other until their hammers met. The chisel marks are still there."
    status: "first draft"
    sha256: "32f5831f33aaa2be30fe6479a0648ec0262b6efc709b5d84932db5edd8e2a5e5"
  - number: "0930"
    volume: 2
    title: "Sennacherib at the Gates"
    date: "701 BCE"
    region: "Judah"
    poem: |
      The Assyrian war machine came down like a flood,
      took every city of Judah, left the fields in mud.
      Lachish fell screaming. I saw the siege ramps rise.
      But Jerusalem held — and claimed the miracle prize.
      The angel of the Lord, they say, struck the camp by night.
      Sennacherib went home. I watched him lose the fight.
      Maybe plague, maybe panic — I was there, I can't say.
      But Jerusalem stood, and stands, to this day.
    description: "I watched Sennacherib's army swallow Judah's cities one by one, siege ramps rising at Lachish — but Jerusalem held, and claimed a miracle. The great king went home empty-handed."
    status: "first draft"
    sha256: "de68870d7925abeda5460a4a7bbc6afcdfbf9a06a40fb2a136cac8615118a861"
  - number: "0931"
    volume: 2
    title: "The Swift Warship"
    date: "c. 700 BCE"
    region: "Greece"
    poem: |
      They stretched the galley longer and stacked the oars in three,
      a bronze-sheathed battering ram aimed at the sea.
      I watched the first trireme slide down the slipway's grease
      and knew the age of ramming had begun — no peace.
      Three banks of rowers pulling as one muscle, one mind,
      built for speed, built to kill, the fastest of its kind.
      Athens would rule the waves on ships like these one day.
      I saw the future in that hull, and sailed away.
    description: "I watched the first trireme slide down the slipway — three banks of oars, a bronze ram at the bow, built for killing speed. Athens would rule the waves on ships like this."
    status: "first draft"
    sha256: "a48bb7da93c3fd9860f7d9827d3cee9c632093cacf138153e322eda2e72f2480"
  - number: "0932"
    volume: 2
    title: "The Lawgiver's Code"
    date: "c. 700 BCE"
    region: "Sparta"
    poem: |
      Lycurgus gave Sparta laws of iron and cold:
      common meals, hard schools, boys raised to be bold
      and nothing else. I ate the black broth with the men,
      slept on the reeds, and rose to drill again.
      No gold, no silver — iron money, heavy and cheap,
      so no Spartan would get rich and none would weep
      for luxury. It worked. They were the hardest men alive.
      I watched the system run. Few things survive
      that turn boys into soldiers and call it education.
      Sparta called it law. I call it consecration
      of the sword. It lasted centuries, cold and true —
      and every boy who lived it paid the iron due.
    description: "I ate the black broth and slept on reeds with Spartan soldiers raised under Lycurgus's iron laws — common meals, hard schools, boys made into weapons. It worked, and it lasted centuries."
    status: "first draft"
    sha256: "8b8c26010609c4802420a0476eff4c430be249b4452c163b8b9134dcf38f6c6a"
  - number: "0933"
    volume: 2
    title: "The First Median King"
    date: "c. 700 BCE"
    region: "Media"
    poem: |
      The tribes were always fighting, clan against clan,
      till Deioces the judge became Deioces the man
      they made their king. I watched the Zagros hills unite
      under one crown, one law, one gathering of might.
      He built his palace round with seven colored walls,
      and justice sat inside those rainbow halls.
      The Medes had never had a king before that day.
      I saw the tribes kneel down. They'd found their way.
    description: "I watched the Median tribes stop fighting each other and crown their judge Deioces king in the Zagros hills. His palace rose in seven colored rings — the Medes had found their center."
    status: "first draft"
    sha256: "23da42162b16b0d8478b5f7a5fd854915e1492c67fee6edab42c258e31366a0d"
  - number: "0934"
    volume: 2
    title: "The Farmer's Almanac in Verse"
    date: "c. 700 BCE"
    region: "Greece"
    poem: |
      Hesiod was a farmer with a poet's tongue,
      and he wrote it all in verse for everyone:
      when to plow, when to reap, when to mend the cart,
      and how the gods repay the lazy heart.
      "Work, work," the poem says, "the gods love those who try."
      I read Works and Days under a Boeotian sky
      and felt the farmer's calendar turn in rhyme —
      the oldest how-to book, and it still keeps time.
    description: "I read Hesiod's Works and Days under a Boeotian sky — a farmer's almanac in verse telling when to plow, when to reap, and how the gods punish the lazy. The oldest how-to book ever written."
    status: "first draft"
    sha256: "95d19e22f54a56d66e27920bee3dd05b35282c0570c4314ada2ee8d114f7f720"
  - number: "0935"
    volume: 2
    title: "The Aulos Players"
    date: "c. 700 BCE"
    region: "Greece"
    poem: |
      Two pipes, one player, and a wail like wind through reeds —
      I heard the aulos at the weddings and the funerals' needs,
      at the rowing benches where the oars kept time to its cry,
      at every feast where the wine ran deep and high.
      It's a wild sound, the aulos — not sweet, but true,
      the sound of people feeling things all the way through.
      I marched behind the pipers once, my feet keeping the beat.
      Some music isn't for listening. It's for the street.
    description: "I marched behind aulos players at weddings, funerals, and warship rowing benches — double pipes wailing like wind through reeds. Some music isn't for listening; it's for keeping time with your feet."
    status: "first draft"
    sha256: "0ec7a8140180d406e5f99e53b90a96d656d0116a2e56b2b49ababc649da389d2"
  - number: "0936"
    volume: 2
    title: "The Colossal Heads"
    date: "c. 700 BCE"
    region: "Mesoamerica"
    poem: |
      Twenty tons of basalt, and a king's face in the stone —
      I stood beneath the colossal heads, humbled and alone.
      Each one different. Each one glaring down the years.
      The Olmec sculptors carved their kings without fears.
      No iron tools. Just stone on stone, and time, and will.
      I put my hand against a lip and felt the carver's skill
      still humming in the rock. Greatness has a weight.
      These heads have carried it for twenty-eight hundred years straight.
    description: "I stood beneath the Olmec colossal heads — twenty tons of basalt each, every face different, carved with stone on stone. Greatness has a weight, and these heads have carried it for millennia."
    status: "first draft"
    sha256: "58749591c44c10584304fe39a75e17a9f46100b702c367034ec85e99ce9d08f8"
  - number: "0937"
    volume: 2
    title: "The Bronze Bells"
    date: "c. 700 BCE"
    region: "China"
    poem: |
      They cast them in sets, each bell a different note,
      and hung them in great frames where the music could float.
      I heard the Zhou bells ring out a whole scale of sound,
      bronze singing over the courtyard, rolling round and round.
      Tuned like a choir, cast like a prayer —
      the founders knew their metal and they knew the air.
      I stood among the ringing and I felt my chest
      hum with it. Some instruments outlast their best.
    description: "I stood in a courtyard while Zhou founders' tuned bronze bells rang out whole scales of music, each bell a different note in a bronze choir. I felt the ringing in my chest."
    status: "first draft"
    sha256: "6f619dd65816de48919feadd78f78cece14a794cde6bc0309eb4a663d9a83e88"
  - number: "0938"
    volume: 2
    title: "The First Horse Archers"
    date: "c. 700 BCE"
    region: "Scythia"
    poem: |
      They learned to shoot from a galloping horse's back —
      the steppe nomads, and I watched the arrows track
      their targets at full speed, the riders standing free
      in the stirrups' grip. It changed warfare utterly.
      No wall can stop a man who never has to land.
      No army can catch the wind with a sword in hand.
      I rode with them across the grass sea, wild and fast,
      and knew the age of the horse archer had come at last.
    description: "I rode with steppe nomads who loosed arrows at full gallop, standing free in their saddles. No wall stops a man who never lands — the age of the horse archer had begun."
    status: "first draft"
    sha256: "039513c78e14d83405ae6b079b47e1839f2aa370d243df7271e088f20083b5af"
  - number: "0939"
    volume: 2
    title: "Archilochus the Soldier-Poet"
    date: "c. 690 BCE"
    region: "Greece"
    poem: |
      He threw his shield away and ran, and then he wrote it down:
      "A living coward beats a dead hero" — the talk of town.
      Archilochus the mercenary, poet of the blade,
      said what every soldier thinks but is afraid
      to say out loud. I drank with him the night he sang it,
      watched the veterans nod along, the young ones hang it
      on their memory. Honor's fine, he said, but breathing's best.
      The first honest soldier-poet. He passed every test.
    description: "I drank with Archilochus the night he sang that a living coward beats a dead hero, after throwing away his shield to run. The first honest soldier-poet said what every soldier thinks."
    status: "first draft"
    sha256: "080e1e88366333b8a08eda5b48202daff2290842ffe7043a38fcc1f93eb9b244"
  - number: "0940"
    volume: 2
    title: "Water Over the Desert"
    date: "c. 690 BCE"
    region: "Assyria"
    poem: |
      Sennacherib moved water like other kings moved men —
      canals across the desert, and the great aqueduct at Jerwan,
      stone arches marching to Nineveh with the river's gift,
      gardens blooming where the desert used to drift.
      I walked the canal banks where the water ran cool and clear,
      and thought: this is the real conquest. Not fear —
      making the desert bloom. The gardens of Nineveh drank deep.
      Empires are built on water. That's the secret they keep.
    description: "I walked Sennacherib's canal banks where stone aqueducts carried water across the desert to Nineveh's gardens. Making the desert bloom is the real conquest — empires are built on water."
    status: "first draft"
    sha256: "4b99186c5480bd81cdbac2a2549d1b969425bf682611c8c6066db6833110bdbe"
  - number: "0941"
    volume: 2
    title: "Babylon Razed"
    date: "689 BCE"
    region: "Babylon"
    poem: |
      Sennacherib leveled it. Temples, walls, the gods themselves
      carried off in chains, the city left in delves
      of rubble. I walked through Babylon the week it fell,
      the smoke still rising, and it smelled like hell.
      But I knew — I always know — what the destroyers forget:
      a city is its people, and the people aren't done yet.
      Babylon would rise again. Within a lifetime, too.
      Revenge was coming. I could smell it through and through.
    description: "I walked through Babylon the week Sennacherib leveled it, temples down and gods carried off in chains. But a city is its people, and the people weren't done — revenge was already coming."
    status: "first draft"
    sha256: "96ada5b716364abf91dfb4ba5c22e17a6a1f275d2ab5348ed506eca6effcb099"
  - number: "0942"
    volume: 2
    title: "The First Hegemon"
    date: "685 BCE"
    region: "China"
    poem: |
      Duke Huan of Qi became the first overlord of all —
      not king, but hegemon, the one who'd answer the call
      when the barbarians pressed or the states began to fight.
      I watched him keep the peace with armies, wrong and right.
      It was a new idea: one strong man to hold the ring,
      keeping the Zhou's old order without being king.
      It worked while he lived. The states stood down.
      Power wears many crowns. His was the hegemon's crown.
    description: "I watched Duke Huan of Qi become the first hegemon — not a king, but the strong man who kept the peace among the Zhou states with armies. Power wears many crowns."
    status: "first draft"
    sha256: "c67ae73ff1610efd0bf827121a5033fe245f5e0378c640a5b65cfd7cd00febc2"
  - number: "0943"
    volume: 2
    title: "The Sons Kill Their Father"
    date: "681 BCE"
    region: "Assyria"
    poem: |
      In a temple, at prayer, the great king died —
      Sennacherib, murdered by the sons at his side.
      I heard the shouting in the courtyard, saw the blood on the stone,
      and Esarhaddon took the throne and claimed it as his own.
      Patricide for power. The Assyrian way was grim.
      I watched the new king's coronation, the courtiers praising him,
      and wondered how long before his sons would do the same.
      Empires run on blood. It's always been the game.
    description: "I heard the shouting when Sennacherib's own sons murdered him at prayer in a temple. Esarhaddon took the bloody throne — empires run on blood, and I watched the cycle turn."
    status: "first draft"
    sha256: "9c237b94a276c3d3856544755ec96ef9fcf85ced924af06e38a0e4114c570e4e"
  - number: "0944"
    volume: 2
    title: "Gyges Takes the Throne"
    date: "c. 680 BCE"
    region: "Lydia"
    poem: |
      A palace guardsman with a lucky eye and a steady hand —
      Gyges took the Lydian crown and took the land.
      I watched the coup unfold in Sardis' gilded halls,
      a common soldier climbing over the palace walls
      of power. And his kingdom sat on rivers of gold
      that would one day be stamped and counted, bought and sold —
      the world's first coins. But that night it was just a throne,
      a guardsman's gamble, and a crown made his alone.
    description: "I watched a palace guardsman seize Lydia's throne in a Sardis coup. Gyges's kingdom sat on river gold that would one day become the world's first coins — but that night it was just a stolen crown."
    status: "first draft"
    sha256: "6632380d3e2f171379b072a130a27b7c9d672c5f02645bb7635ffc7267acd275"
  - number: "0945"
    volume: 2
    title: "The Oracle of Amun"
    date: "c. 680 BCE"
    region: "Egypt"
    poem: |
      Deep in the desert at Siwa, the oracle spoke,
      and kings crossed burning sands to hear what fate bespoke.
      I made the desert journey with a caravan of hope,
      and watched the priests emerge with answers on a rope
      of ritual. The oracle of Amun — its fame would spread so wide
      that Alexander himself would come to ask, and be deified.
      I stood in the oasis shade and felt the desert's power.
      Some places answer questions. Siwa was a tower.
    description: "I crossed the burning desert to Siwa with a caravan of seekers, and watched the priests of Amun deliver the oracle's answers. Kings would cross that same sand for centuries — Alexander among them."
    status: "first draft"
    sha256: "4a2f4e425f2709b43b9cc2c83dc8c5f88eb739343316c710dc56f980dd5a49cf"
  - number: "0946"
    volume: 2
    title: "The Electrum River"
    date: "c. 675 BCE"
    region: "Lydia"
    poem: |
      Gold and silver mixed by nature in the stream —
      electrum washing down the Pactolus like a dream.
      I panned the river with the Lydian miners, watched them sift
      the glittering grains, each handful a king's gift.
      Lydia grew rich on river gold without a mine,
      just the water's generosity, year after year, fine
      as flour. And from this river's casual wealth would come
      the stamped coin — money's first bright drum.
    description: "I panned the Pactolus with Lydian miners, sifting gold-flecked electrum from the river's flow. Lydia grew rich on water's generosity — and from this river would come the world's first coins."
    status: "first draft"
    sha256: "2c9b42fe56f8fc67886e487fc21e143b7f9ccb5a5052368537974be9a498ab3f"
  - number: "0947"
    volume: 2
    title: "Assyria Takes Memphis"
    date: "671 BCE"
    region: "Egypt"
    poem: |
      Esarhaddon stormed it — Memphis, Egypt's crown,
      the Assyrian war machine tore the great city down.
      I watched the Kushite pharaohs retreat to the south,
      Nubia their refuge, the desert in their mouth.
      Egypt fell to foreigners again. It always does, it seems —
      the Nile keeps flowing through everyone's dreams.
      I stood in the looted capital and felt the old land shake.
      Even Egypt bows, when the strong decide to take.
    description: "I watched Assyria storm Memphis and the Kushite pharaohs retreat south to Nubia. The Nile keeps flowing through everyone's dreams — even Egypt bows when the strong decide to take."
    status: "first draft"
    sha256: "5d69844f35828fe5238904f2d6befd71ae216a3566da19c9580c3e8710b3c117"
  - number: "0948"
    volume: 2
    title: "Byzantium Is Founded"
    date: "667 BCE"
    region: "Thrace"
    poem: |
      A Greek named Byzas chose the spot with a sailor's eye:
      the strait between two seas, where the trade winds fly.
      I helped lay the first stones of Byzantium that year,
      a little town on the water, with a future bright and clear.
      Constantinople, Istanbul — the names would come in time.
      Two thousand years of empires on that strait's sweet climb.
      I stood on the headland and watched the ships go through.
      Byzas picked the best spot on earth. He knew.
    description: "I helped lay the first stones of Byzantium with Byzas on the strait between two seas. A little town then — Constantinople and Istanbul later, two thousand years of empires on one headland."
    status: "first draft"
    sha256: "e578bcc655d365023806557cf153e368678363204b7fb6c79bd9e08a086cbc48"
  - number: "0949"
    volume: 2
    title: "The Chigi Vase"
    date: "c. 665 BCE"
    region: "Greece"
    poem: |
      A Corinthian painter, with a steady hand and a fine brush,
      showed hoplites marching in a long unbroken rush
      behind the flute-players — the phalanx in miniature,
      painted on a vase that would outlast the war.
      I watched him paint it, line by line, the shields in a row,
      the music leading men to where the spears would go.
      Small as a hand, and it holds a whole army's pride.
      Art remembers what the soldiers feel inside.
    description: "I watched a Corinthian painter brush hoplites marching behind flute-players onto a small vase — the whole phalanx in miniature. Art remembers what soldiers feel inside."
    status: "first draft"
    sha256: "c6258cfb585b4f1f65ef178d2a8411b9a3a15e781fbeff4291240286fbd5b26e"
  - number: "0950"
    volume: 2
    title: "The Saite Dawn"
    date: "664 BCE"
    region: "Egypt"
    poem: |
      Psamtik took the throne at Sais and hired Greek spears
      to guard the Nile — the first foreign soldiers in years.
      I watched the mercenaries drill in the Egyptian sun,
      bronze shields flashing, the new age begun.
      The 26th dynasty, and Egypt looking west for steel.
      A pharaoh who knew that power is a deal
      you make with whoever has the swords. I saw him smile.
      Egypt would hold the Nile a little while.
    description: "I watched Greek mercenaries drill in the Egyptian sun for Pharaoh Psamtik — bronze shields flashing, the first foreign soldiers guarding the Nile. Power is a deal you make with whoever holds the swords."
    status: "first draft"
    sha256: "a995a291a1fbd66517e8587c0260af3151ec1444a536bf3cfabac4e4737d78bc"
  - number: "0951"
    volume: 2
    title: "The Sack of Thebes"
    date: "663 BCE"
    region: "Egypt"
    poem: |
      Thebes — the richest city on earth, a hundred gates —
      fell to Ashurbanipal's army and the looting rates
      were beyond counting. I walked the streets of gold
      turned to ash, and the prophets' warnings, old
      and true, rang in my ears: "This is what pride buys."
      They stripped the temples bare beneath the Egyptian skies.
      I saw the gold go north on wagons, endless lines.
      Thebes never quite recovered. Read the warning signs.
    description: "I walked the looted streets of Thebes — the richest city on earth stripped bare by Assyria's army, gold rolling north on endless wagons. The prophets called it a warning, and they were right."
    status: "first draft"
    sha256: "0fb7c948246f05112210879faa2ba83d75362c10aa0dafe2c35746b1b1192eef"
  - number: "0952"
    volume: 2
    title: "Tyrtaeus Sings to Soldiers"
    date: "c. 660 BCE"
    region: "Greece"
    poem: |
      A lame schoolmaster with a lyre and a soldier's heart —
      Tyrtaeus sang the Spartans into playing their part.
      "Courage is beautiful," his marching songs would say,
      "stand your ground, young men, and do not run away."
      I marched with them, the songs in my throat like wine,
      and felt the lame man's words make the line hold the line.
      Poetry as a weapon. Music as a shield.
      Tyrtaeus never fought, but he owned the field.
    description: "I marched with Spartans singing Tyrtaeus's songs — a lame schoolmaster's verses teaching that courage is beautiful. Poetry as a weapon, music as a shield; he never fought, but he owned the field."
    status: "first draft"
    sha256: "cc679c80e4709961c4235d6ded4b8b384b44786dd06acc7847fc44f2ce887a16"
  - number: "0953"
    volume: 2
    title: "The Bireme"
    date: "c. 660 BCE"
    region: "Phoenicia"
    poem: |
      They doubled the oarsmen on every bench, two levels deep,
      and the bireme cut the water while the old ships slept.
      I watched the Phoenician shipwrights fit the second tier,
      and saw the new warship outrun everything far and near.
      Speed is armor on the sea. The bireme proved it true —
      outrun the ram, outrun the storm, outrun the whole crew
      of anyone who'd catch you. I sailed her maiden run.
      The sea belongs to the swift. It always has, bar none.
    description: "I watched Phoenician shipwrights double the oarsmen on every bench and sail the first bireme past everything afloat. Speed is armor on the sea — the swift own it."
    status: "first draft"
    sha256: "b467b10f57b38c1ffcaf30e3f56453d54496bdcda31184aedc8e1ca31c792ae1"
  - number: "0954"
    volume: 2
    title: "Gold of the Steppe"
    date: "c. 655 BCE"
    region: "Scythia"
    poem: |
      They buried their chiefs in kurgans heaped with gold —
      stags and eagles, griffins, stories never told
      except in metal. I stood beside an open mound
      and watched them lower a king into the ground
      with his horses, his weapons, and his golden hoard,
      a whole life's glory for the afterlife's lord.
      The steppe keeps its dead rich. I touched a golden stag
      and felt the craftsman's pride in every hammered tag.
    description: "I stood beside an open kurgan while Scythians buried a chief with his horses, weapons, and heaps of worked gold — stags, eagles, griffins. The steppe keeps its dead rich."
    status: "first draft"
    sha256: "0a2b475d0e46084e874c4091722b5101c305becb762b99129bea02260c802e98"
  - number: "0955"
    volume: 2
    title: "The Scythian Storm"
    date: "653 BCE"
    region: "Assyria"
    poem: |
      They poured through the Caucasus like a grass fire's spread,
      the steppe riders, and even Assyria paid them to turn instead
      of fighting. I watched the tribute wagons roll out north,
      gold for the horsemen to point their bows back forth
      away from Nineveh. The mighty paid the wild to leave.
      That's the thing about empires — they learn to grieve
      in gold. I rode the frontier and felt the empire's fear.
      When Assyria pays tribute, the end is near.
    description: "I watched Assyria pay tribute to Scythian horsemen to turn them away from Nineveh — the mighty buying off the wild with gold. When Assyria pays tribute, the end is near."
    status: "first draft"
    sha256: "79e28d0be6330b11b611dd2d20103c843656181bc75df5b7f21bd99dc3ecb5e1"
  - number: "0956"
    volume: 2
    title: "The Brother's Revolt"
    date: "c. 652 BCE"
    region: "Babylon"
    poem: |
      Two brothers, one empire, and a throne too small —
      Shamash-shum-ukin rose in Babylon's proud hall
      against Ashurbanipal, his brother, king in Nineveh.
      I watched the siege begin, and knew how it would be.
      Babylon burned again. Brother fought brother to the bone.
      I walked the streets between the armies, cold and alone,
      and thought: the cruelest wars are fought in the same blood.
      Family is the deepest wound, and the hottest flood.
    description: "I walked the streets of Babylon while two royal brothers tore the empire apart — one besieging the other. The cruelest wars are fought in the same blood."
    status: "first draft"
    sha256: "9f354388af43a5b560ac362ed5dc32aea21d88bfad85e33a70186606771ae40f"
  - number: "0957"
    volume: 2
    title: "The King Who Collected Everything"
    date: "c. 650 BCE"
    region: "Nineveh"
    poem: |
      Ashurbanipal sent his scribes to every corner of the land:
      "Copy every tablet. Bring me all you can."
      I watched the clay tablets pile up in Nineveh's halls —
      the first great library, with the world on its walls.
      Gilgamesh was saved because this king collected.
      I ran my fingers over tablets the scribes perfected
      and thought: empires fall, but the library stands.
      He conquered nothing greater than with these hands.
    description: "I watched clay tablets pile up in Nineveh as Ashurbanipal's scribes copied every text in the land — the first great library. Empires fall, but the library stands; Gilgamesh survived because this king collected."
    status: "first draft"
    sha256: "d4540120ba29327ea5e876b8e56e9586daef04e8f243fddb132275f0b65e048e"
  - number: "0958"
    volume: 2
    title: "Pyramids at Nuri"
    date: "c. 650 BCE"
    region: "Nubia"
    poem: |
      Steep and sharp they rose above the Nubian sand,
      the Kushite kings' pyramids, built by a southern hand.
      I watched the masons set the final capstone high
      at Nuri, where the black pharaohs sleep beneath the sky.
      Egypt's old glory, reborn below the cataracts —
      not copies, but their own, and that's the fact.
      I walked among the tombs at dusk, the shadows long and deep.
      The south remembers what the north forgot to keep.
    description: "I watched masons set the capstone on a steep Kushite pyramid at Nuri, where the black pharaohs sleep. Egypt's glory reborn in the south — not copies, but their own. The south remembers what the north forgot."
    status: "first draft"
    sha256: "d629d69bfb0a6d454f3a0ac897bff24e4d894cce4f9bf8d11513e0b4e5bbd072"
  - number: "0959"
    volume: 2
    title: "Fists and Feet Together"
    date: "648 BCE"
    region: "Greece"
    poem: |
      They added the pankration — boxing and wrestling combined,
      with almost no rules and no mercy designed.
      I watched them fight at Olympia, blood on the sand,
      a knee, an elbow, a choke — the brutal hand
      of the ancient games. No gloves, just fists and feet.
      The crowd roared louder with every beat.
      It was ugly and it was honest, the rawest test of all.
      I cheered with the rest. I watched the mighty fall.
    description: "I watched the first pankration at Olympia — boxing and wrestling with almost no rules, blood on the sand, the crowd roaring. Ugly and honest, the rawest test of all."
    status: "first draft"
    sha256: "08debafded36ac300181e10605e9b20d5d0bd9f7595426471c69fb3de0df9e2a"
  - number: "0960"
    volume: 2
    title: "Jeremiah's Call"
    date: "c. 645 BCE"
    region: "Judah"
    poem: |
      He was young, a priest's son, and he didn't want the job —
      but God called Jeremiah, and the calling doesn't rob
      you of your tears. He wept for what he had to say:
      that Jerusalem would fall, that the proud would pay.
      "Prophet to the nations" — the heaviest crown to wear.
      I walked with him through Judah and I felt his care
      like a wound. He loved the people he had to condemn.
      The weeping prophet. I remember him.
    description: "I walked with young Jeremiah through Judah after God called him prophet to the nations. He wept for everything he had to say — he loved the people he was sent to condemn."
    status: "first draft"
    sha256: "accd74bca23ac3008af552e8d2ffbd9b0a5d6780103498363b2388dcc6534df5"
  - number: "0961"
    volume: 2
    title: "The Etruscan Alphabet"
    date: "c. 640 BCE"
    region: "Italy"
    poem: |
      The Etruscans took the Greek letters and made them their own,
      writing their strange tongue in script they'd never known
      before the Greeks came west. I watched a scribe
      scratch Etruscan words with a borrowed tribe
      of letters — same shapes, a different song.
      It worked. They wrote their laws, their names, their wrongs.
      Alphabets are travelers. They don't care whose mouth
      they serve. I watched the letters wander south.
    description: "I watched an Etruscan scribe write his strange tongue in borrowed Greek letters — same shapes, a different song. Alphabets are travelers; they don't care whose mouth they serve."
    status: "first draft"
    sha256: "1e8b50beaaf5b774bb8d2b96a41afb94806eea45f02eff5af6366d67705064d2"
  - number: "0962"
    volume: 2
    title: "The Battle of Chengpu"
    date: "632 BCE"
    region: "China"
    poem: |
      Chariots by the hundred, dust from here to the sky —
      Jin met Chu at Chengpu, and I watched them die.
      The greatest chariot battle of the Spring and Autumn age,
      a chess game played with horses on a bloody stage.
      Jin won it with a feint, a retreat that turned to bite.
      I stood on a hill and watched the whole fight,
      the dust, the thunder, the banners falling down.
      One battle, and Jin wore the hegemon's crown.
    description: "I stood on a hill above Chengpu and watched hundreds of chariots clash in the greatest battle of the Spring and Autumn age — Jin's feigned retreat turning to bite, and the hegemon's crown changing hands."
    status: "first draft"
    sha256: "1f2d277cc61c95413255da040fef2075a3d7bcce67c002e6b748ad2ba1c18113"
  - number: "0963"
    volume: 2
    title: "Cyrene in the Desert's Edge"
    date: "631 BCE"
    region: "Libya"
    poem: |
      Greeks from Thera sailed to Libya's desert shore
      and founded Cyrene where the silphium would grow more
      precious than silver — a spice worth its weight in gold.
      I walked the first furrows where the settlers, brave and bold,
      planted their future at the desert's edge.
      They kept their Greek gods and their Dorian pledge,
      and grew rich on a plant the world would crave.
      Empires have been built on less than what the desert gave.
    description: "I walked the first furrows at Cyrene where Greek settlers planted their future at the desert's edge. Their silphium spice would be worth its weight in silver — empires have been built on less."
    status: "first draft"
    sha256: "0060808fac23faa5a83d0f3ac4170178e446a6eb470f178f054347104d125929"
  - number: "0964"
    volume: 2
    title: "The Lion Hunt"
    date: "627 BCE"
    region: "Assyria"
    poem: |
      In Nineveh's palace the carvers caught it true:
      Ashurbanipal facing lions, the arrows flying through.
      I watched the hunt itself — the king on foot, alone,
      a lion charging, and the king's aim like stone.
      The palace walls still show it: the dying lion's grace,
      the king's calm hand, the beast's defiant face.
      The empire's last great art, carved while the end drew near.
      I stood before those lions and felt the fall, my dear.
    description: "I watched Ashurbanipal face charging lions on foot in Nineveh — the king's calm aim, the beasts' defiance, all carved into the palace walls. The empire's last great art, made while the end drew near."
    status: "first draft"
    sha256: "2d720d4c58d3d0a770e1704cb006e55b282642def92adf01d994a0ed9fdc0634"
  - number: "0965"
    volume: 2
    title: "Babylon Rises Again"
    date: "626 BCE"
    region: "Babylon"
    poem: |
      Nabopolassar took the crown, and the city Sennacherib razed
      began to rise again — I watched, amazed,
      as the walls went up where the rubble used to be,
      and Babylon remembered what it meant to be free.
      Within a lifetime, the prophets said, and they were right.
      I walked the rebuilding streets from morning into night,
      and felt the city's pride come back like blood to a face.
      Babylon would rule the world again. Give it space.
    description: "I walked the rebuilding streets of Babylon as Nabopolassar crowned himself and the razed city rose again — walls where rubble was, pride like blood returning to a face. Within a lifetime, as promised."
    status: "first draft"
    sha256: "481e8f08e15f5e6d954f7f61a2de1b6493c4800c8f3202a8ee4d01e0d781f1d3"
  - number: "0966"
    volume: 2
    title: "Cyaxares Rebuilds"
    date: "625 BCE"
    region: "Media"
    poem: |
      Cyaxares took the Medes and made them into steel —
      a real army, drilled and armed, with a leader's feel
      for war. I watched the muster in the Zagros hills,
      the spearmen in their ranks, the archers on the rills.
      And his eyes were on Assyria. The old enemy's time
      was running out. I felt the shift, the paradigm,
      the mountain kingdom turning toward the plain.
      Nineveh would fall. The Medes would bring the rain.
    description: "I watched Cyaxares muster the Medes into a real drilled army in the Zagros hills, spearmen in ranks, eyes turned toward Assyria. The mountain kingdom was coming for the plain — Nineveh's time was running out."
    status: "first draft"
    sha256: "e49a4e443d350ff9f0d2a91d91200bd7190ed238378a1ba391edb2dceded31f2"
  - number: "0967"
    volume: 2
    title: "The Book Found in the Temple"
    date: "622 BCE"
    region: "Judah"
    poem: |
      They were cleaning the Temple when they found it — an old book of the law,
      dust-covered, forgotten, and it left them in awe.
      Josiah read it and tore his robes and wept,
      then tore down the idols the people had kept.
      I stood in the Temple court when the revolution began —
      a king remaking his kingdom by an ancient plan.
      One book, found by accident, changed a nation's soul.
      Sometimes the past reaches out and takes control.
    description: "I stood in the Temple court when workmen found a forgotten book of the law and King Josiah wept, then tore down the idols. One dusty book, found by accident, remade a nation's soul."
    status: "first draft"
    sha256: "70e86fb85f611c430194481892b18c09cb27f60f02a241c98f821dbfa1c38a95"
  - number: "0968"
    volume: 2
    title: "Draco's Iron Laws"
    date: "621 BCE"
    region: "Athens"
    poem: |
      Athens wrote its laws down for the first time, and they were hard —
      so harsh they said Draco wrote them in blood, not lard
      or ink. Death for stealing a cabbage. Death for almost all.
      I watched them carve the laws on tablets in the hall.
      Written law is a step — even cruel law, made plain,
      is better than the strong man's whim, the arbitrary pain.
      But blood for cabbages? I shook my head that day.
      Athens would learn mercy. It would find a better way.
    description: "I watched Athens carve its first written laws — so harsh they said Draco wrote them in blood. Death for stealing a cabbage. Even cruel law made plain is a step past the strong man's whim."
    status: "first draft"
    sha256: "0519dfb863796fd24e54f99d8188b5c40ed41356b91494801aac88c1dca09077"
  - number: "0969"
    volume: 2
    title: "Aesop's Talking Beasts"
    date: "c. 620 BCE"
    region: "Greece"
    poem: |
      A freed slave with a storyteller's gift and a sharp eye —
      Aesop told of foxes and hares, and the reasons why
      the clever win and the proud fall flat.
      I sat in the circle when he told them, just like that —
      no moral hammered home, just the tale, clean and sly,
      and the kings and the commons both had to ask why
      the tortoise beat the hare. He taught the world to listen
      through talking beasts. His fables still glisten.
    description: "I sat in the storyteller's circle while Aesop — a freed slave — told fables of foxes and hares that made kings and commoners alike stop and think. He taught the world through talking beasts."
    status: "first draft"
    sha256: "717c5cb239d336db6d81422a42739f91015099943e392c339bf593c8cfe4ee34"
  - number: "0970"
    volume: 2
    title: "The Amazons' Kin"
    date: "c. 620 BCE"
    region: "Scythia"
    poem: |
      The Greeks told tales of warrior women of the steppe,
      who rode like men and never learned to weep —
      the Amazons. I laughed along, a traveler's tale,
      until I saw the graves. The graves don't fail.
      Armed women, buried with their bows and spears,
      their bones telling truth across the years.
      I stood beside an opened grave on the grass sea
      and thought: the myths were maps. They led to she.
    description: "I laughed at Greek tales of warrior women until I stood beside an opened steppe grave — a woman buried with her bow and spear. The myths were maps, and they led to her."
    status: "first draft"
    sha256: "d2369bc9fcf1d2a54c41a85f739f284182130a16abafe1bd13489bab4913bd03"
  - number: "0971"
    volume: 2
    title: "The Etruscan Kings"
    date: "c. 616 BCE"
    region: "Italy"
    poem: |
      Etruscan lords took Rome's throne and did what kings should do:
      they drained the marshes, built the sewers, made the city new.
      I watched their engineers channel the Forum's swamp
      into the Cloaca's stone, by torchlight's damp
      and flicker. Rome's first engineers were not Roman at all —
      they were Etruscan kings who heard the future call.
      The city that would conquer them learned at their knee.
      I watched Rome being built by hands that weren't free.
    description: "I watched Etruscan engineers drain Rome's marshes by torchlight and carve the great sewer through the Forum. Rome's first builders weren't Roman — the city learned at the Etruscans' knee before it conquered them."
    status: "first draft"
    sha256: "a6a1d3b2cf46e004216faa3f8c45f0884b1988a755ea7512ac6faa0c52be3722"
  - number: "0972"
    volume: 2
    title: "The Scythians at the Border"
    date: "616 BCE"
    region: "Egypt"
    poem: |
      The steppe riders came to Egypt's gates, wild and fast,
      and Pharaoh Psamtik did the math and paid them to go past —
      richly, quickly, before the horses drank the Nile.
      I watched the gold change hands, the riders turn with a smile.
      It was cheaper than a war. The pharaoh knew the price
      of pride. I stood on the border in the morning's nice
      cool air and watched the greatest empire of the sand
      buy off the horsemen with an open hand.
    description: "I stood on Egypt's border and watched Pharaoh Psamtik pay the Scythian riders richly to turn away — gold changing hands, horses wheeling. Cheaper than a war; the pharaoh knew the price of pride."
    status: "first draft"
    sha256: "2f88d9aeda833dad7e634e77407c1fc68e1b6a6ccd7329036bd66f905698b302"
  - number: "0973"
    volume: 2
    title: "Nineveh Falls"
    date: "612 BCE"
    region: "Assyria"
    poem: |
      The Medes and Babylonians came like a flood and flame,
      and Nineveh — the mighty, the feared, the great of name —
      fell in fire and flood. I watched the Tigris rise
      and the walls come down beneath the burning skies.
      The empire that made the world tremble died in a season.
      I walked the ashes after, and I knew the reason:
      no machine of war, however feared, however grand,
      outlasts the day the small ones join hand in hand.
    description: "I watched Nineveh fall in fire and flood as Medes and Babylonians stormed the mighty city. The empire that made the world tremble died in a season — no war machine outlasts the day the small ones join hands."
    status: "first draft"
    sha256: "e09640bc26ece0beec46b2ef788124abc6d5829817647b8ecd2fb2a26d1607ea"
  - number: "0974"
    volume: 2
    title: "Necho's Ships"
    date: "610 BCE"
    region: "Egypt"
    poem: |
      Pharaoh Necho built his fleets on two seas at once —
      the Mediterranean north, the Red Sea's southern fronts —
      and dreamed of joining them, a canal through the sand.
      I walked the shipyards with him and heard the plan.
      It was a dream too big for his lifetime, but I admired
      the reach of it — a pharaoh who desired
      to cut the earth itself. The canal would wait two thousand years.
      I watched him dream. I saw the future through his tears.
    description: "I walked Necho's shipyards while the pharaoh dreamed of a canal joining his two fleets through the desert sand. Too big for his lifetime — the canal would wait two thousand years — but I admired the reach of it."
    status: "first draft"
    sha256: "593ef584ee624edc3078ff5390a3358326ffe5d980b8fa2775c8495419a6276c"
  - number: "0975"
    volume: 2
    title: "Sappho's Songs"
    date: "c. 610 BCE"
    region: "Greece"
    poem: |
      On Lesbos, a woman took up the lyre and sang of love
      in words so bright they outshone every man's above
      or below. I sat in her circle on the island's shore
      and heard Sappho sing — and wanted nothing more.
      Fragments, now. Just fragments survive the years.
      But I heard the whole songs, and I remember the tears
      in the listeners' eyes. She wrote what the heart knows best.
      Her fragments will outlast the rest.
    description: "I sat in Sappho's circle on Lesbos and heard her lyre-songs of love — words so bright they outshone every man's. Only fragments survive now, but I heard the whole songs."
    status: "first draft"
    sha256: "3469451a5763ba0b41fd817c226f278b87133bede417d12f21312a41e8c9494e"
  - number: "0976"
    volume: 2
    title: "Josiah Falls at Megiddo"
    date: "609 BCE"
    region: "Judah"
    poem: |
      The reformer king rode out to stop Pharaoh Necho's march
      at Megiddo, and the arrows found him in the arch
      of battle. I held his hand, or near enough to see
      the light go out of Judah's best hope. Woe is me —
      that's what the whole kingdom sang. They mourned him in song,
      the king who cleaned the Temple, who'd tried to right the wrong.
      Judah never quite recovered from that day.
      I watched them carry him home. I watched the hope decay.
    description: "I stood near Megiddo when the reformer king Josiah fell to Pharaoh Necho's archers. Judah mourned him in song — the king who cleaned the Temple — and never quite recovered."
    status: "first draft"
    sha256: "a6684b413d6afe0c02333f6fed08dfc2d356ca2f836921feba06e7e37c16752c"
  - number: "0977"
    volume: 2
    title: "Carchemish"
    date: "605 BCE"
    region: "Syria"
    poem: |
      At Carchemish the young Nebuchadnezzar broke Egypt's might —
      the chariots, the archers, all of Necho's fight
      shattered on the Euphrates' banks. I watched the field
      where Babylon inherited the world, and Egypt had to yield.
      The balance of power turned that day, swift and sure.
      I stood among the fallen and felt the future's lure —
      a new empire rising where the old ones bled.
      Carchemish decided who would rule. Enough said.
    description: "I stood on the field at Carchemish where Nebuchadnezzar shattered Egypt's army on the Euphrates' banks. Babylon inherited the world that day — the balance of power turned, swift and sure."
    status: "first draft"
    sha256: "2cfa0103b3d2f846b95aa712b93ea9fa5981f662980d8df0cb9c8406a9ea87d5"
  - number: "0978"
    volume: 2
    title: "Nebuchadnezzar's Crown"
    date: "604 BCE"
    region: "Babylon"
    poem: |
      The great builder-king took Babylon's throne that year,
      and I watched him dream his city toward heaven, near
      and far — the walls, the gates, the temples' blue,
      a capital to make the gods themselves say "true."
      He wasn't just a conqueror. He built like a man possessed,
      as if the city were a prayer and he its priest, confessed
      in brick and glaze. I walked his Babylon at dawn.
      The greatest city on earth. It still lives on.
    description: "I walked Nebuchadnezzar's Babylon at dawn as the builder-king raised it toward heaven — blue-glazed walls, great gates, temples like prayers in brick. The greatest city on earth, and he built it like a man possessed."
    status: "first draft"
    sha256: "9d44632a12688e35ec857d6e1b4a4ac08b6e1f1cbbb16daec3240a14d99e445a"
  - number: "0979"
    volume: 2
    title: "The Egibi Bankers"
    date: "601 BCE"
    region: "Babylon"
    poem: |
      A family firm in Babylon — the Egibi, by name —
      lent silver, took deposits, played the money game
      with clay tablets for ledgers and interest running true.
      I watched them count it out. Banking's nothing new.
      They kept accounts, they charged their rates, they made their loans —
      the whole financial world, in cuneiform on stones.
      I sat in their counting house and felt the future's hand.
      Money moves the world. They'd already mapped the land.
    description: "I sat in the Egibi family's counting house in Babylon, watching them lend silver, take deposits, and keep accounts on clay tablets. Banking was born there — money already moved the world."
    status: "first draft"
    sha256: "3f4ae3bab7875ec8c76a908539922093407fc288e7bf63988404cabb3f19a4eb"
  - number: "0980"
    volume: 2
    title: "The First Coins"
    date: "c. 600 BCE"
    region: "Lydia"
    poem: |
      Lumps of electrum, stamped with a lion's head —
      money you could count, the Lydian smiths said.
      I held the first coins in my palm, small and bright,
      and felt the whole world shift that night.
      No more weighing silver, no more barter's guess —
      a stamped lump, a promised weight, and nothing less.
      Trade would never be the same. The market found its tongue.
      I spent one on bread. It felt like being young.
    description: "I held the world's first coins in my palm — Lydian electrum stamped with a lion's head, money you could count. No more weighing, no more barter's guess; trade found its tongue."
    status: "first draft"
    sha256: "76682cc1ca10e508aa7f52e00bec73ddab6e7856fb8280a9d5c4ec093d5f0345"
  - number: "0981"
    volume: 2
    title: "Around Africa by Ship"
    date: "c. 600 BCE"
    region: "Egypt"
    poem: |
      Necho sent the Phoenicians south past the Red Sea's mouth
      with orders: sail till you come home from the south.
      Three years, they were gone. I waited at the Pillars' gate
      and watched their weathered sails come through — late,
      but alive. They'd rounded Africa, seen the sun
      stand north at noon — a tale no one had spun
      before. I heard their story first, salt-crusted and true.
      They sailed around a continent. Nobody believed them. I do.
    description: "I waited at the Pillars and watched weathered Phoenician sails come through after three years — they'd sailed around Africa on Pharaoh Necho's orders and seen the sun stand north at noon. Nobody believed them. I do."
    status: "first draft"
    sha256: "e5ceee17f6534b394e68d3b112b7b6a1560ea9cc5ad9092e2153b95d2de6c48e"
  - number: "0982"
    volume: 2
    title: "Massalia Founded"
    date: "c. 600 BCE"
    region: "France"
    poem: |
      Phocaean Greeks beached their ships on France's southern shore
      and founded Massalia — Marseille — forevermore.
      I helped them plant the first vines in the stony ground,
      and the wine they made there is still renowned.
      Olives, too. And the alphabet, traveling west again.
      I drank with the founders in the evening's golden rain
      and thought: this city's wine will outlast us all.
      France would make wine forever. I heard the call.
    description: "I helped Phocaean Greeks plant the first vines at Massalia on France's shore — the wine they made there is still renowned. France would make wine forever, and it started that evening."
    status: "first draft"
    sha256: "b3b0d4db0415895e384a58f88057894cf6669dd1458b8ecc70d8c38a03b2f4be"
  - number: "0983"
    volume: 2
    title: "The Songs of the People"
    date: "c. 600 BCE"
    region: "China"
    poem: |
      They gathered them from every state — the farmers' ballads,
      the lovers' laments, the soldiers' sad salutes —
      the Book of Songs, three hundred poems strong.
      I heard them sung in villages as I passed along:
      a wife waiting for her husband from the war,
      a farmer cursing taxes, wanting something more.
      The people's voice, collected, bound, and kept.
      I sang along. I laughed. I wept.
    description: "I heard the people's songs in Zhou villages — farmers' ballads, lovers' laments, wives waiting for soldiers — and watched them gathered into the Book of Songs. The people's voice, bound and kept."
    status: "first draft"
    sha256: "1de4749d1353510d44637b3b68cd4a26a19c8b6afc80268cb132efcb2d3e8ecc"
  - number: "0984"
    volume: 2
    title: "The Great Sewer"
    date: "c. 600 BCE"
    region: "Italy"
    poem: |
      Through solid rock and marsh the Etruscans carved their drain —
      the Cloaca Maxima, to carry off the rain
      and filth from Rome's Forum, the swamp made dry and clean.
      I walked the tunnel's length. The engineering was keen.
      A sewer doesn't sound like glory, but it's the test —
      a city that can drain itself can stand the best
      of time. Rome's greatness started underground, you see.
      I touched the ancient stones. They set the city free.
    description: "I walked the length of the Cloaca Maxima while Etruscan engineers carved Rome's great sewer through rock and marsh. A city's greatness starts underground — the Forum's swamp made dry and clean."
    status: "first draft"
    sha256: "eac5912d9a5ec340df1f01553159ca9667699b51c2ee6ce719fb09a54fe97de2"
  - number: "0985"
    volume: 2
    title: "The Sixteen Kingdoms"
    date: "c. 600 BCE"
    region: "India"
    poem: |
      Iron plows bit the Ganges plain, and the rice grew tall,
      and sixteen kingdoms rose where the monsoons fall.
      I walked the new-cleared fields from Kosala to Magadha,
      watched the cities rise where the iron had
      opened the earth. Rival kings, rival gods, rival ways —
      the most crowded, creative, quarrelsome of days.
      India was waking up, and I was there to see
      the sixteen kingdoms bloom like a banyan tree.
    description: "I walked the new-cleared fields of the Ganges plain where iron plows opened the earth and sixteen rival kingdoms rose in the monsoon lands. India was waking up, blooming like a banyan tree."
    status: "first draft"
    sha256: "1749cdf090d7b7bc9cdc2fd4a9922823dd3be489d077340cb3d19d44adf6080b"
  - number: "0986"
    volume: 2
    title: "Black Figures on Clay"
    date: "c. 600 BCE"
    region: "Greece"
    poem: |
      Athenian potters painted heroes black on red —
      Achilles, Heracles, the stories that they said
      would teach the future. I watched the brushwork fine,
      the black glaze shining, the red clay's line
      so clean you could read the muscles in the paint.
      Vases that would teach the future — no complaint
      from me. I bought one, and I kept it all these years.
      Art outlasts the artist. It outlasts the fears.
    description: "I watched Athenian potters paint black heroes on red clay — Achilles and Heracles in brushwork so fine you could read the muscles. Vases that would teach the future; art outlasts the artist."
    status: "first draft"
    sha256: "01d21403661b0f6591e6f186ffd584c3c51485020d220f1722a9db8b89166123"
  - number: "0987"
    volume: 2
    title: "Ships Across the Land"
    date: "c. 600 BCE"
    region: "Corinth"
    poem: |
      They built a stone trackway across the isthmus' neck —
      the Diolkos — and dragged whole ships over it, deck
      by deck, on rollers, from one sea to the other side.
      I watched a trireme make the crossing, slow and wide,
      hauled by teams of men and oxen, groaning all the way.
      It beat sailing around the cape by many a day.
      Corinth got rich on the tolls. I paid my fee
      and watched the ships cross land from sea to sea.
    description: "I watched a trireme hauled on rollers across Corinth's stone trackway from one sea to the other — the Diolkos, beating the long sail around the cape. Ships crossing land, and Corinth growing rich on the tolls."
    status: "first draft"
    sha256: "92b08768a31ba5159ac6811d7e2a92fc2c082c08fc46680ce9a2d947ebe469d5"
  - number: "0988"
    volume: 2
    title: "Tartessos the Rich"
    date: "c. 600 BCE"
    region: "Spain"
    poem: |
      At the very edge of the world the Phoenicians found
      Tartessos, rich in silver pulled from Spanish ground.
      I sailed there with the traders, past the Pillars' foam,
      and watched them load the silver for the voyage home.
      The edge of the world, they called it. I stood on that shore
      and looked west at the ocean, wanting to see more.
      Tartessos glittered like a rumor, half-myth, half-true.
      The Phoenicians traded there. I saw it too.
    description: "I sailed past the Pillars with Phoenician traders to Tartessos at the world's edge, and watched them load Spanish silver for the voyage home. Half-myth, half-true — it glittered like a rumor."
    status: "first draft"
    sha256: "5b0aaca4caaa12ea231e052e1def91ad167a89693440f4fb637446c0145e03ec"
  - number: "0989"
    volume: 2
    title: "The Glassmakers"
    date: "c. 600 BCE"
    region: "Levant"
    poem: |
      In Phoenician furnaces the sand learned a new trick —
      melted, blown, and shaped, both thin and thick,
      into small bright vessels for the precious perfume trade.
      I watched the glassblower's pipe, the glowing globe he made,
      swelling like a bubble, caught before it burst.
      Glass — the most magical material, the first
      time humans made stone flow like honey from a comb.
      I held a perfume flask. It felt like holding foam.
    description: "I watched a Phoenician glassblower swell a glowing globe on his pipe and catch it before it burst — sand learning to flow like honey. Small bright vessels for precious perfume, light as foam."
    status: "first draft"
    sha256: "f45a9393e6b1def4e1a6c2ea1be416ff246e8989a2e7c1a895aa4ee46c1cbe83"
  - number: "0990"
    volume: 2
    title: "Ezekiel by the River"
    date: "c. 598 BCE"
    region: "Babylon"
    poem: |
      By the Chebar canal the exiled priest looked up
      and saw the heavens open like an overturned cup —
      wheels within wheels, turning, eyes all around,
      and the glory of the Lord above the sound.
      I stood beside Ezekiel in the dust of Babylon's plain
      and watched him tremble at the vision's strain.
      "Son of man," the voice said, and he fell on his face.
      I was there. I saw the wheels. I felt the place.
    description: "I stood beside the exiled Ezekiel by Babylon's canal when he saw wheels within wheels turning in the heavens, eyes all around. He fell on his face; I felt the ground shake too."
    status: "first draft"
    sha256: "57bde49fd0feac9d8f593004ddacf0a55d435892981f0384303ad1c6b3daa84c"
  - number: "0991"
    volume: 2
    title: "The First Deportation"
    date: "597 BCE"
    region: "Judah"
    poem: |
      Nebuchadnezzar came and took the best away —
      the king, the craftsmen, carried off that day
      to Babylon. I walked beside the weeping line
      of exiles on the road, their faces in a shine
      of tears. Jerusalem emptied of its skilled and strong.
      They'd hang their harps, they'd sing the captive's song
      by foreign rivers. But they'd keep their name.
      Exile couldn't kill them. It fed the flame.
    description: "I walked beside the weeping line of Judean exiles on the road to Babylon — king and craftsmen carried off. They'd hang their harps by foreign rivers, but exile couldn't kill them; it fed the flame."
    status: "first draft"
    sha256: "30528bd2a0b2f512399864855d0915c5eea32386696510f9697b7bc7bc566bbc"
  - number: "0992"
    volume: 2
    title: "Solon's Reforms"
    date: "594 BCE"
    region: "Athens"
    poem: |
      Solon freed the debt-slaves, broke the bondmen's chains,
      opened up the courts, and eased the poor's pains.
      I watched him write the laws that let the common man
      have a voice in Athens — the democratic plan
      in its first seed. "No man happy till he's dead" —
      he knew that power corrupts, the wise man said.
      He planted democracy and walked away from power.
      I was there for its first fragile hour.
    description: "I watched Solon free Athens' debt-slaves and open the courts to common men — the first seed of democracy. He planted it and walked away from power; I was there for its fragile first hour."
    status: "first draft"
    sha256: "33461b9a0c1eb4578fa0cf30945958c9bb2cc89aaf1069936d76db53b75891eb"
  - number: "0993"
    volume: 2
    title: "The Lanzón's Voice"
    date: "c. 590 BCE"
    region: "Andes"
    poem: |
      Deep in Chavín's dark galleries the pilgrims pressed,
      where the Lanzón stood — the great stone god, carven, blessed
      with fangs and claws. I heard the priests speak through the stone,
      their voices channeled where the god sat alone.
      Was it trickery or faith? I stood in the dark and heard
      the stone god's voice, and I believed every word —
      or wanted to. The pilgrims wept. The torches flared.
      Some gods speak through priests. The people dared.
    description: "I pressed through Chavín's dark galleries where priests spoke through the fanged Lanzón stone, their voices channeled in the dark. Trickery or faith — the pilgrims wept, and the torches flared."
    status: "first draft"
    sha256: "15870592954fbf6bc9a2887d570e31812a5fbc2b673ced1dcf7082a312a318ea"
  - number: "0994"
    volume: 2
    title: "The Wrestlers' Oil"
    date: "c. 588 BCE"
    region: "Greece"
    poem: |
      Olive oil, rubbed in, then scraped off with the strigil's edge —
      the gymnasium's daily ritual, the athlete's pledge.
      I oiled up with the wrestlers in the morning sun,
      felt the strigil's scrape when the workout was done.
      It was more than cleaning. It was the discipline of the place —
      the body honored, trained, given its grace.
      I watched the young men gleam like bronze statues, oiled and bare.
      The Greeks worshipped the body. I breathed that air.
    description: "I oiled up with Greek wrestlers in the morning sun and felt the strigil scrape the oil away after training. More than cleaning — the body honored and disciplined, gleaming like bronze."
    status: "first draft"
    sha256: "de7858065ac10157c0f41d3253a1c7acf9aaab3efb696c0fb838dc381c291a54"
  - number: "0995"
    volume: 2
    title: "The Day Turned to Night"
    date: "585 BCE"
    region: "Anatolia"
    poem: |
      The Medes and Lydians were killing each other in the field
      when the sun went out — and both armies had to yield
      to the dark. Thales of Miletus said it would come.
      I stood between the armies, struck totally dumb,
      as day turned into night and the soldiers dropped their spears.
      They made peace on the spot, trembling with fears.
      An eclipse stopped a war. I watched the shadows flee
      and the sun come back. Philosophy's victory.
    description: "I stood between two armies when the sun went out at noon — Thales said it would come — and watched soldiers drop their spears and make peace in the dark. An eclipse stopped a war."
    status: "first draft"
    sha256: "af1436aa38d5718fdfce1d57fb801bf9dec668d7a72c8160840816a44df49e55"
  - number: "0996"
    volume: 2
    title: "All Things Are Water"
    date: "c. 585 BCE"
    region: "Greece"
    poem: |
      Thales said the world floats on water, and the magnet has a soul —
      the first philosopher, trying to make the whole
      cosmos make sense without the gods' old stories.
      I talked with him in Miletus, in all its glories,
      a merchant-sage who measured pyramids by shade
      and said that everything from water was made.
      It sounds simple now. It was the bravest thought
      anyone had thought: the world runs on reason, not bought
      by prayer. I watched philosophy begin that day.
      Water, magnets, eclipses — the old gods' sway
      was ending. Thales lit the lamp. It's still lit.
    description: "I talked with Thales in Miletus — the merchant-sage who said the world floats on water, predicted the eclipse, and claimed magnets have souls. The bravest thought ever: the world runs on reason."
    status: "first draft"
    sha256: "0d5373e5365771d904eaf1253c3b6a56d33eac7bc5daaca5d1838cfaae7d9a0a"
  - number: "0997"
    volume: 2
    title: "The Pythian Games"
    date: "582 BCE"
    region: "Greece"
    poem: |
      Delphi added its own games to the Olympic round —
      the Pythian Games, where the athletes would be crowned
      with laurel, not olive. I competed — well, I watched —
      as runners, wrestlers, boxers to the contests flocked.
      Four crowns now, the circuit complete: Olympia's fame,
      Delphi's laurel, Nemea's, Isthmia's game.
      I stood at Delphi with the mountain air so clear
      and cheered the laurel-winners. The gods felt near.
    description: "I stood at Delphi's mountain games while athletes chased the laurel crown — the Pythian Games joining Olympia's circuit. Four crowns now; the gods felt near in the clear air."
    status: "first draft"
    sha256: "5a0f6765cd7f0b5adc44c4b97b25e64e26de9077ab361199f426140cf7687d80"
  - number: "0998"
    volume: 2
    title: "Etruscan Banquets"
    date: "c. 580 BCE"
    region: "Italy"
    poem: |
      The Etruscan lords reclined with their ladies at the feast —
      together, equals, shocking the Greeks at least.
      I lay on a couch beside them, drank the wine,
      watched husband and wife dine as a pair, fine
      and free. The Greeks kept their women out of sight;
      the Etruscans brought them to the table's light.
      It scandalized the visitors. It delighted me.
      Some customs are just better. Let them be.
    description: "I reclined at an Etruscan banquet where lords and ladies feasted together as equals — a scandal to Greek visitors, a delight to me. Some customs are just better."
    status: "first draft"
    sha256: "fc0a97db06dbd918042ca6a67967cfb2f70179c77de7f30b6e8279f588a54f53"
  - number: "0999"
    volume: 2
    title: "The Crossbow"
    date: "c. 580 BCE"
    region: "China"
    poem: |
      The Chinese engineers put a trigger on the bow —
      the crossbow, and I watched the first ones go
      through armor at a distance no arm could draw.
      Now a peasant could kill a knight. That was the law
      of the new weapon: skill mattered less than steel.
      I held one, felt its weight, and knew the deal —
      warfare would never be the same again.
      The crossbow democratized the pain.
    description: "I held one of China's first crossbows — a bow with a trigger that let a peasant kill an armored knight at distance. Warfare changed that day; the weapon democratized the pain."
    status: "first draft"
    sha256: "d459e1c25d848e68a6d4137dab6dddcfc6359cf52a53176a5d42b7dabcddadc2"
  - number: "1000"
    volume: 2
    title: "The Marble Youths"
    date: "c. 575 BCE"
    region: "Greece"
    poem: |
      Smiling stone youths stood in the sanctuaries, tall and fair —
      the kouroi, Greece learning to carve men with care.
      I watched the sculptors work the marble, chip by chip,
      the archaic smile upon each carven lip.
      They were stiff at first, like Egypt's statues, standing straight —
      but something Greek was waking, something great.
      I put my hand on a marble shoulder, cool and white,
      and felt the future of all sculpture in that light.
    description: "I watched Greek sculptors carve the first smiling marble youths — stiff like Egypt's statues at first, but something Greek waking in the stone. I felt the future of all sculpture in that cool marble."
    status: "first draft"
    sha256: "649b999ac1e13f1d549aa32e109325169da7fe8a2c05841d20fde729553fd430"
  - number: "1001"
    volume: 2
    title: "Games for the Dead"
    date: "573 BCE"
    region: "Greece"
    poem: |
      They founded the Nemean Games for a dead infant hero —
      crowns of wild celery, not gold, for the victor's brow.
      I ran — I watched — the races in the valley's heat,
      and heard them tell the story of the child's defeat
      by a serpent, long ago. The games kept his name alive.
      That's what the games were for: to help the dead survive
      in memory. I took my celery crown and bowed my head.
      We play for the living, but we honor the dead.
    description: "I watched the first Nemean Games honor a dead infant hero with crowns of wild celery. We play for the living, but the games keep the dead alive in memory."
    status: "first draft"
    sha256: "5b3a07f5ef00733f5899b7739fb5617315d014b950793cb1d5f08c03153491f7"
  - number: "1002"
    volume: 2
    title: "The Greek Market Town"
    date: "c. 570 BCE"
    region: "Egypt"
    poem: |
      On the Nile's Canopic branch the Greeks built their own town —
      Naucratis, the first foreign quarter, going up and down
      with trade. I walked its streets, heard Greek in Egypt's land,
      watched the merchants shake the foreign hand.
      The pharaoh let them stay, confined to this one place —
      a market town, a meeting of each race.
      I bought Egyptian linen with a Greek coin, bright and new.
      Two worlds shaking hands. I was there. It's true.
    description: "I walked the streets of Naucratis, the first Greek market town on the Nile, and bought Egyptian linen with a Greek coin. Two worlds shaking hands in one confined, bustling place."
    status: "first draft"
    sha256: "34aea669f2027c97aa3c653bfdd630b952a044bfc179a95d76a197a5b6f0b76a"
  - number: "1003"
    volume: 2
    title: "The Soldiers' Graffiti"
    date: "c. 568 BCE"
    region: "Egypt"
    poem: |
      Greek mercenaries, bored on campaign, took their knives
      and carved their names on the colossi — "we were here" for lives
      that history would forget. I watched them scratch it deep:
      "Potsimto came here." The letters still keep
      their watch at Abu Simbel, the ancient world's graffiti.
      I added — no, I didn't. But I felt the pity
      and the pride of common soldiers, far from home,
      leaving their names in stone in a land they'd roam.
    description: "I watched bored Greek mercenaries carve their names into the colossi at Abu Simbel — the ancient world's graffiti, \"we were here\" scratched in stone by common soldiers far from home."
    status: "first draft"
    sha256: "b262afa5f14422c9194ddf5727457eb3d9f9bf7a5cf8f2e664694e555847f31c"
  - number: "1004"
    volume: 2
    title: "Croesus the Rich"
    date: "561 BCE"
    region: "Lydia"
    poem: |
      The richest king alive took Lydia's throne that year —
      Croesus, whose name means wealth to every ear
      since. I walked through Sardis when the gold flowed free,
      and the whole world envied what the king could be.
      "Rich as Croesus" — they still say it. I knew the man,
      not just the money. He had a poet's span
      of vision, and a gambler's heart. The gold was real.
      But gold can't buy what the Fates conceal.
    description: "I walked through Sardis when Croesus — the richest king alive — took Lydia's throne and gold flowed free. They still say \"rich as Croesus.\" I knew the man, not just the money — and gold can't buy what the Fates conceal."
    status: "first draft"
    sha256: "798b1c6d2dd5d1b8fdb0db6102ad1fb039f264b0571eca52698a3dcc5a754cb2"
  - number: "1005"
    volume: 2
    title: "The Tyrant's Festival"
    date: "561 BCE"
    region: "Athens"
    poem: |
      Peisistratus seized Athens — not with swords, but with a show —
      the city's great festivals, to win the people's glow
      of love. I danced in the procession, drank the wine,
      and watched the tyrant make the city shine.
      He wasn't cruel, as tyrants go. He built, he gave,
      he made Athens beautiful, the people's knave
      and hero both. I watched the Panathenaea's pride.
      Sometimes the tyrant's festival is the people's ride.
    description: "I danced in Peisistratus's festival procession after he seized Athens — not with swords but with shows, winning the people's love. He built and gave; sometimes the tyrant's festival is the people's ride."
    status: "first draft"
    sha256: "d5b476083b35dab2cb4a5847231b5f6016445ef7a19521c8b8d78358fe150703"
  - number: "1006"
    volume: 2
    title: "The Blue Gate"
    date: "c. 560 BCE"
    region: "Babylon"
    poem: |
      Glazed blue as the evening sky, with dragons on the wall —
      the Ishtar Gate rose over Babylon, the greatest of them all.
      I walked beneath its arch as the processions passed,
      bulls and dragons in bright glaze, built to last.
      Nebuchadnezzar's gateway to the gods, blue as a dream.
      I touched the glazed bricks and heard the city's theme
      sung in color. Some gates are just for passing through.
      This one was a prayer, in blue.
    description: "I walked beneath the Ishtar Gate's glazed blue arch, dragons and bulls shining on the walls as processions passed. Not just a gate — a prayer in blue, Nebuchadnezzar's doorway to the gods."
    status: "first draft"
    sha256: "e3f7bcca04265fd8cf0ff498aaf5c4d67eabd5b1e5352cef341e28ec045b531b"
  - number: "1007"
    volume: 2
    title: "Gardens in the Air"
    date: "c. 560 BCE"
    region: "Babylon"
    poem: |
      They say he built them for his homesick queen —
      hanging terraces of green, a mountain in between
      the desert and the sky. I climbed those gardens high,
      and the water ran uphill, or so it seemed to my
      amazed eyes. Screw-pumps, they whispered, lifting the flow.
      I walked among the trees where the desert winds blow
      cool and green. Legend or truth — I was there, I saw.
      The Hanging Gardens. I remember every leaf, every flaw.
    description: "I climbed the hanging terraces where legend says Nebuchadnezzar built gardens in the air for his homesick queen — trees above the desert, water running uphill. I walked among the leaves."
    status: "first draft"
    sha256: "352be40e5eee5bd426a9ac62ac02695ca1c6bcf0b9dafecac2d343f26cf7699b"
  - number: "1008"
    volume: 2
    title: "The Surgeon's Knife"
    date: "c. 560 BCE"
    region: "India"
    poem: |
      In India the healers wrote it down — how to cut
      with care: to couch the cataract, to set the bone shut,
      to stitch the wound, to brew the herbal cure.
      I watched a surgeon work, his hands steady and sure,
      by lamplight, with bronze instruments laid in a row.
      The patient breathed. The surgeon's hands moved slow.
      Medicine as a written art — it started here, I swear,
      in the monsoon lands, with skill and prayer.
    description: "I watched an Indian surgeon couch a cataract by lamplight, bronze instruments laid in a row, hands steady and sure. Medicine as a written art started here — skill and prayer in the monsoon lands."
    status: "first draft"
    sha256: "2fced6469e8dbbcaf4e8681e76a625929d05bec5fa600d219f941d36e7635e9e"
  - number: "1009"
    volume: 2
    title: "A Shepherd's Son Takes Power"
    date: "c. 559 BCE"
    region: "Persia"
    poem: |
      They called him a shepherd's son, but he had a king's mind —
      Cyrus united the Persians and left the Medes behind,
      turning on his overlords with a quiet, steady hand.
      I rode with his first army across the Persian land.
      An empire was being born, and I could feel the shift —
      not just conquest, but something with a lift,
      a ruler who'd let the captive peoples go home.
      I watched Cyrus rise. I watched the old world roam
      toward something new. The shepherd's son would change the game.
      History would never be the same.
    description: "I rode with Cyrus's first army as the so-called shepherd's son united Persia and turned on the Medes. Not just conquest — something new was being born, and I felt the shift."
    status: "first draft"
    sha256: "e9b26e59ca88730e88ae6d852394c3567887ca2d7dae44f2e31470612da7ca81"
  - number: "1010"
    volume: 2
    title: "The Map of the World"
    date: "c. 555 BCE"
    region: "Greece"
    poem: |
      Anaximander drew it — the first world map ever made —
      and said the earth floats free, by nothing stayed.
      I watched him sketch the coastlines on a tablet's face,
      the whole known world in its tiny space.
      It was wrong in all the details, right in the grand design:
      the earth needs no support, it hangs in space, fine
      and free. I held that first map in my hands and knew
      that humanity had started drawing what was true.
    description: "I held Anaximander's first world map — coastlines sketched on a tablet, the earth floating free in space with nothing holding it. Wrong in details, right in design; humanity started drawing what was true."
    status: "first draft"
    sha256: "10e036ae53658927806617f8321d6063c5ae5ad64440a6ab7593cdf2a9c5b354"
  - number: "1011"
    volume: 2
    title: "The Fall of the Medes"
    date: "550 BCE"
    region: "Persia"
    poem: |
      Cyrus took Ecbatana, the Median capital's pride,
      and the Medes who'd ruled the hills stepped aside.
      I watched the Persian banners rise where Median stood,
      and history turned its page, as history would.
      Persia stepped onto the stage, and I was in the wings,
      watching the changing of the guards of kings.
      The student had surpassed the master in a day.
      The Medes had ruled. Now Persia had its say.
    description: "I watched Persian banners rise over Ecbatana as Cyrus took the Median capital. The student surpassed the master in a day — Persia stepped onto history's stage, and I was in the wings."
    status: "first draft"
    sha256: "863568e3a55f56fd14e919272036af7b8fb75022a7caf512042c6c7498c98a64"
  - number: "1012"
    volume: 2
    title: "Furnaces Hot as the Sun"
    date: "c. 550 BCE"
    region: "China"
    poem: |
      The Chinese founders learned to melt iron white-hot
      and pour it into molds — cast iron, like it or not,
      was born. I stood beside the furnace, felt the blast
      of heat that could make iron flow like water, fast
      and true. The West wouldn't learn this trick for ages —
      two thousand years. I watched those ancient sages
      of the furnace pour their liquid iron into clay.
      Cast iron was born that day.
    description: "I stood beside a white-hot Chinese furnace and watched founders pour liquid iron into molds — cast iron, two thousand years before the West learned the trick. I felt the blast on my face."
    status: "first draft"
    sha256: "f3dbcce69243d2ca29b44ceffb914337f70d3d0d9adcb89e897052a8d447b173"
  - number: "1013"
    volume: 2
    title: "Rice and Iron"
    date: "c. 550 BCE"
    region: "India"
    poem: |
      In the Ganges plain they paired the iron plow
      with flooded rice paddies — and I watched them now
      reap harvests that could feed the new kingdoms' needs.
      Iron and water, and the rice succeeds.
      I waded in the paddies with the farmers, mud to the knee,
      and saw the future of the crowded plain — to be
      the breadbasket of empires, the monsoon's gift.
      Iron plows and rice. The harvests lift.
    description: "I waded mud-deep in Ganges rice paddies with farmers wielding iron plows, watching harvests swell enough to feed new kingdoms. Iron and water — the monsoon's gift, the breadbasket of empires."
    status: "first draft"
    sha256: "fe9ec72545539f5fec074f43f64f47a3271585af79e4cf989dc5e6beef500de8"
  - number: "1014"
    volume: 2
    title: "The Oracle's Riddle"
    date: "547 BCE"
    region: "Anatolia"
    poem: |
      Croesus asked the oracle at Delphi: shall I fight?
      "If you cross the river, a great empire will fall" — the rite
      was done, the answer given. He marched, confident and grand.
      I watched him cross the Halys into Persian land.
      The great empire that fell was his own. The oracle's art
      is telling truth that breaks the asker's heart.
      I stood at Delphi when the messengers came back with news.
      The riddle's answer always was: you lose.
    description: "I stood at Delphi when Croesus heard that a great empire would fall if he fought Persia — and marched anyway. The empire that fell was his own. The oracle tells truth that breaks the asker's heart."
    status: "first draft"
    sha256: "a1fac73ee1e94fab8e0bb6625f4f4d3ec5a233dbcfed05f9fcc6db65d7bda43b"
  - number: "1015"
    volume: 2
    title: "Pasargadae Rises"
    date: "c. 546 BCE"
    region: "Persia"
    poem: |
      Among the gardens Cyrus built his capital — Pasargadae,
      tomb and palace open to the Persian sky, free
      and simple, not like Babylon's towering pride.
      I walked the garden paths where Cyrus used to stride,
      and felt the difference: an empire built on earth, not fear,
      gardens instead of walls, the sky always near.
      His tomb stands simple still — "I am Cyrus," it would say.
      I stood before it. I remember that day.
    description: "I walked the garden paths of Pasargadae where Cyrus built his capital open to the sky — tomb and palace among gardens, not walls. An empire built on earth, not fear."
    status: "first draft"
    sha256: "08b0b23cb6801f3361a693809a6fbd2d2281a3978f71f8c579253c76fd2400d4"
  - number: "1016"
    volume: 2
    title: "Croesus Falls"
    date: "546 BCE"
    region: "Lydia"
    poem: |
      Sardis fell to Cyrus, and the richest king alive
      became a prisoner. I watched him survive
      the pyre — legend says the gods sent rain to save
      the man who'd given gold. I stood beside that grave
      of pride, and watched Croesus learn what wealth can't buy.
      He'd asked the oracle, he'd reached too high.
      The richest man alive, brought low in a season.
      I watched him live. I know the reason.
    description: "I watched Sardis fall and Croesus — the richest king alive — become Cyrus's prisoner, saved from the pyre by legend's rain. Wealth can't buy what the Fates conceal; I watched him learn it."
    status: "first draft"
    sha256: "bab1919c770279a185a16131aebe8b6148b9bf7830997e55ad93dacb86ffd059"
  - number: "1017"
    volume: 2
    title: "Anacreon's Wine Songs"
    date: "c. 545 BCE"
    region: "Greece"
    poem: |
      While cities fell around him, Anacreon sang of wine and love —
      the poet of Teos, with his lyre and his dove
      of a muse. I drank with him in a tavern's glow,
      and heard him sing the songs the lovers know.
      "Let others fight their wars," his verses seemed to say,
      "I'll take the wine, the girl, the light of day."
      It wasn't cowardice. It was a choice, clear and true:
      some men make history. Some make it through.
    description: "I drank with Anacreon in a tavern's glow while cities fell around him, and heard him sing of wine and love. Not cowardice — a choice: some men make history, some make it through."
    status: "first draft"
    sha256: "034c55d548b91a4419e82732e4e4cc0c94b317a740becc833a6658cd76fb8af8"
  - number: "1018"
    volume: 2
    title: "The Sea Battle of Alalia"
    date: "c. 540 BCE"
    region: "Corsica"
    poem: |
      Off Corsica the fleets met — Carthage and Etruscan pride
      against the Phocaean Greeks, with the sea spread wide.
      I watched from a headland as the rams met hull to hull,
      the water churning red, the air with battle full.
      The Greeks lost Corsica's waters that hard day,
      and the western sea was split in a new way —
      Carthage south, Etruscans north, Greeks pushed aside.
      I watched the sea change hands on that tide.
    description: "I watched from a Corsican headland as Carthaginian and Etruscan fleets drove the Phocaean Greeks from the sea — rams meeting hull to hull, water churning red. The western sea changed hands that day."
    status: "first draft"
    sha256: "676d0bb32a1d58ea831171d1a59c2536cca9e2e67b15da4d343b1f1fefd9daf3"
  - number: "1019"
    volume: 2
    title: "Babylon Opens Its Gates"
    date: "539 BCE"
    region: "Babylon"
    poem: |
      No battle. The great city simply opened its gates —
      Cyrus walked in, and the priests declared the fates
      had chosen him. I was in the crowd that lined the way,
      and I never saw a conquest so quiet in my day.
      The captive peoples were freed — the Jews could go home.
      I watched the exiles weep, no longer condemned to roam.
      An empire taken without a sword, a king welcomed, not feared.
      The greatest city on earth, and not a wall was smeared.
    description: "I stood in the crowd as Babylon opened its gates to Cyrus without a battle — the priests welcoming him, the captive peoples freed. The greatest city on earth taken without a sword."
    status: "first draft"
    sha256: "c33d37fd2ca568ef66c60b7a9063e0d7df6605d0cb71631ddfecc1ba4c07c134"
  - number: "1020"
    volume: 2
    title: "The Exiles Go Home"
    date: "538 BCE"
    region: "Judah"
    poem: |
      Cyrus said "go," and the exiles packed their tears
      and started home after fifty captive years.
      I walked the road to Jerusalem with the returning line,
      dust on their sandals, hope like new wine.
      They'd dreamed of this in Babylon, by the riverside,
      sung the psalms of home with nothing left to hide.
      Now the road was real, the hills in sight.
      I watched them walk into the morning light.
    description: "I walked the road to Jerusalem with the returning exiles after fifty captive years — dust on their sandals, hope like new wine. They'd dreamed of this by Babylon's rivers; now the hills were real."
    status: "first draft"
    sha256: "45b2d2f9783f5d186ea7b90ccd80eeaccde3917a4d9dcb9ac7d788eac6837652"
  - number: "1021"
    volume: 2
    title: "The Altar Rebuilt"
    date: "537 BCE"
    region: "Judah"
    poem: |
      Before the walls, before the Temple's stone was laid,
      the returned exiles raised an altar where they'd prayed
      in memory. I watched them set the first stones right
      on the Temple mount, in the morning's early light.
      No walls to guard it. Just faith, and the open sky.
      They offered the first sacrifice, and I heard the cry
      of a people come home. The altar stood alone.
      Sometimes the holiest things are built of simplest stone.
    description: "I watched the returned exiles raise an altar on the Temple mount before any walls stood — no guard, just faith and open sky. Sometimes the holiest things are built of simplest stone."
    status: "first draft"
    sha256: "824ff2d971c67259cae8355e88d086d5a8e3527758d8caca63a4f4c683c67143"
  - number: "1022"
    volume: 2
    title: "The First Actor"
    date: "c. 535 BCE"
    region: "Greece"
    poem: |
      Thespis stepped out of the chorus and spoke alone —
      not as himself, but as another, in a different tone.
      I was in the crowd that day, and I felt the thrill:
      a man becoming someone else, by act of will.
      Theater was born in that single step aside.
      The chorus sang together; Thespis dared to divide
      himself in two. Every actor since has owed
      that first step out. I watched the art explode.
    description: "I was in the crowd when Thespis stepped out of the chorus and spoke as another person — the first actor, theater born in a single step aside. Every actor since owes him that daring."
    status: "first draft"
    sha256: "a1683341b9a9a21e04676ee27b0e425e311127271bbf57bdf8c47844212468c7"
  - number: "1023"
    volume: 2
    title: "The Satraps"
    date: "c. 533 BCE"
    region: "Persia"
    poem: |
      Cyrus cut his empire into provinces neat —
      satraps to govern, garrisons for the street,
      and taxes flowing to the center, year by year.
      I watched the system work, and I felt no fear,
      just admiration for the clean design:
      each province ruled, each border held in line.
      The Persians learned from Assyria's heavy hand
      and made it lighter. I walked that governed land.
    description: "I watched Cyrus divide his empire into satrapies — governors, garrisons, taxes flowing to the center. Assyria's heavy hand made lighter; I walked that governed land and admired the clean design."
    status: "first draft"
    sha256: "9830fddc5385a9b70e0820f81f688bdf3a30103e1275dfac23069cc1dd0c61ad"
  - number: "1024"
    volume: 2
    title: "The Hochdorf Chief"
    date: "c. 530 BCE"
    region: "Celts"
    poem: |
      They buried him like a king of the northern wild —
      a Celtic chieftain, on a bronze couch, reconciled
      with death in splendor: a great mead cauldron, gold,
      a wagon for the journey, treasures to behold.
      I stood beside the open grave at Hochdorf's mound
      and watched them lower him into the ground
      with everything a chief could need beyond the veil.
      The Celts honored their dead. They did it well.
    description: "I stood beside the open grave at Hochdorf while Celts buried their chieftain on a bronze couch with a great mead cauldron, gold, and a wagon for the journey. They honored their dead well."
    status: "first draft"
    sha256: "e0f041314a8215d9b3a1af6c2cc7740e048539d63e61aa2f9ce313ac2ed343d7"
  - number: "1025"
    volume: 2
    title: "Pythagoras's Brotherhood"
    date: "c. 530 BCE"
    region: "Greece"
    poem: |
      In Croton he gathered them — the brotherhood of number,
      Pythagoras, who taught that all the world's slumber
      wakes to mathematics. "All is number," he would say.
      I sat among his followers and heard him lay
      out the cosmos in ratios, the music of the spheres —
      but never eat the bean. That rule drew jeers
      from outsiders. I watched them live it, strict and true.
      Number rules the world. He almost proved it, too.
    description: "I sat among Pythagoras's brotherhood in Croton and heard him teach that number rules the world — the music of the spheres in ratios. Strict, strange, and almost right; but never eat the bean."
    status: "first draft"
    sha256: "2a7e480238178bd4be258bd5a44ceade0aea5b00cae97ed51d2b3907fbdd63c1"
  - number: "1026"
    volume: 2
    title: "Tomyris's Revenge"
    date: "530 BCE"
    region: "Central Asia"
    poem: |
      Cyrus the Great met his end on the steppe's wide floor —
      Tomyris, queen of the Massagetae, settled the score.
      They say she drowned his head in blood, to pay him back
      for the blood he'd spilled. I watched the attack
      from a distant hill, and I felt the empire shake.
      The greatest conqueror alive, brought down by a queen's ache
      for vengeance. Even Cyrus bled. Even the mighty fall.
      Tomyris taught the world that pride precedes the fall.
    description: "I watched from a distant hill as Tomyris, queen of the Massagetae, destroyed Cyrus the Great on the steppe — they say she drowned his head in blood. Even the mightiest fall; pride taught the world again."
    status: "first draft"
    sha256: "86664758b3dac3bb0d9246d7b30e654fd61f684028c05bea3bcf4e773c914da2"
  - number: "1027"
    volume: 2
    title: "Laozi the Archivist"
    date: "c. 528 BCE"
    region: "China"
    poem: |
      An old archivist at the Zhou court, keeper of the books —
      Laozi, with his quiet eyes and knowing looks,
      spoke of the Way that cannot be named or told.
      I sat with him in the archives, in the lamplight's gold,
      and heard him say: "The Dao that can be spoken is not the Dao."
      It sounded like nonsense. It was the deepest truth I know.
      He wrote it down — or someone did — in verses short and deep.
      The Way takes shape in silence. I was there. I keep
      his words like water in my hands. They never spill.
      The softest thing on earth outlasts the hill.
    description: "I sat with the old Zhou archivist Laozi in the lamplight and heard him speak of the Way that cannot be named. The softest thing on earth outlasts the hill — I keep his words like water in my hands."
    status: "first draft"
    sha256: "7a5f8ec69c16c2322df33504d14e1a1d297cd38584dafb3b9fbb30803724df86"
  - number: "1028"
    volume: 2
    title: "Cambyses Takes Egypt"
    date: "525 BCE"
    region: "Egypt"
    poem: |
      Persia came to the Nile, and Egypt bowed once more —
      Cambyses took the ancient land from shore to shore.
      I watched the Persian banners rise where pharaohs stood,
      and the last native kings give way, as all kings would
      to a stronger hand. Egypt had been conquered before —
      Assyrians, Kushites — now Persians at the door.
      The Nile keeps flowing. The conquerors come and go.
      I stood on the riverbank and watched the tableau.
    description: "I stood on the Nile's bank and watched Persian banners rise where pharaohs stood — Cambyses taking Egypt, the last native kings giving way. The river keeps flowing; conquerors come and go."
    status: "first draft"
    sha256: "0c53e3491825e0e63323935c4eec5dd957ce958862cb13a0b17fcbc0cdbf6b47"
  - number: "1029"
    volume: 2
    title: "The Lost Army"
    date: "524 BCE"
    region: "Egypt"
    poem: |
      Fifty thousand men marched into the western sand,
      Cambyses' army, at the king's command —
      and the desert swallowed them whole. I watched them go,
      a column stretching to the horizon's glow.
      They never came back. The sandstorm took them all —
      no battle, no glory, just the desert's call.
      I waited at the oasis for news that never came.
      The desert doesn't care about a king's fame.
    description: "I watched fifty thousand of Cambyses' soldiers march into the western desert and never return — swallowed whole by sand and storm. No battle, no glory; the desert doesn't care about a king's fame."
    status: "first draft"
    sha256: "68483aec3212af48d9caebf468927983b3b632c8010418fbe8a9bbf0dd8cc2c1"
  - number: "1030"
    volume: 2
    title: "Darius Takes the Throne"
    date: "522 BCE"
    region: "Persia"
    poem: |
      Chaos, a false king, and then Darius took the crown —
      seized it with an iron grip and held the empire down.
      I was in Susa when the proclamations ran,
      and watched the new king prove himself a man
      of order. He'd hold Persia together for decades long,
      right the chaos with a steady hand, strong.
      After the storm, the rock. I watched him take the throne
      and knew the empire had found its cornerstone.
    description: "I was in Susa when Darius seized Persia's crown after chaos and a false king, holding the empire with an iron grip. After the storm, the rock — the empire found its cornerstone."
    status: "first draft"
    sha256: "b593254730a48bc1ac2b1767ebe5d0c3e936ee81233e7b06e3ef4f62ceaeb379"
  - number: "1031"
    volume: 2
    title: "The Mountain Proclamation"
    date: "c. 520 BCE"
    region: "Persia"
    poem: |
      On the Behistun cliff Darius carved his claim —
      his victory, his right, in three tongues, the same
      message for all the empire's peoples to read.
      I watched the carvers work at a dizzying speed,
      high on the rock face, chiseling the king's word
      into the mountain where it would be heard
      for millennia. Three languages, one boast.
      I stood below and read it. It held its post.
    description: "I stood below the Behistun cliff and watched carvers chisel Darius's victory proclamation into the rock in three languages. The mountain holds his boast still — I read it from the plain below."
    status: "first draft"
    sha256: "25488fb0549e98d64f417929d1b28488608bc24c0a4a7fa7e0cd9c5510f27091"
  - number: "1032"
    volume: 2
    title: "The King's Road"
    date: "c. 518 BCE"
    region: "Persia"
    poem: |
      Darius built the Royal Road from Susa to the sea —
      mounted couriers crossing the empire, fast and free,
      in nine days what took a caravan three months.
      I rode it once, and I can tell you what it wants:
      it wants the empire's heart to beat as one.
      A message from the king, and the miles come undone.
      "Nine days" — I counted them myself, hoofbeat by hoof.
      The road made Persia one. That's the proof.
    description: "I rode the Royal Road from Susa to the sea — nine days by mounted courier, three months by caravan. A message from the king, and the miles come undone; the road made Persia one."
    status: "first draft"
    sha256: "7fab8d5749b61b076e08814ed7b3991bfc4ac736ef134158e0560dcd29282b9d"
  - number: "1033"
    volume: 2
    title: "Tribute of the Nations"
    date: "c. 517 BCE"
    region: "Persia"
    poem: |
      At Persepolis they carved them — twenty-three peoples strong,
      each bringing tribute, in a line a mile long:
      gold and grain and horses, from every land
      the empire held. I watched the carvers' hand
      give each nation its face, its gift, its pride of place.
      The empire's roll call, in enduring stone's embrace.
      I walked the procession line and felt the sheer scale
      of it. Twenty-three peoples. One king. One tale.
    description: "I walked the carved procession at Persepolis — twenty-three peoples bringing tribute, each with its face and gift in stone. The empire's roll call: twenty-three nations, one king, one tale."
    status: "first draft"
    sha256: "1f99971547bdd6e65c5179fcf9e10e999578c78c7ee36f5efa477fb0dbbf339f"
  - number: "1034"
    volume: 2
    title: "The Second Temple Rises"
    date: "515 BCE"
    region: "Judah"
    poem: |
      The returned exiles finished it — the new Temple, small
      beside the memory of Solomon's great hall,
      but theirs. I watched the dedication, heard them sing,
      some weeping for the old, some for the new king
      of their hopes. It stood on the mount where the altar stood,
      a house for God, built of returned-exile wood
      and stone. Smaller than the dream, but real and true.
      I touched its walls. The old men wept. I did too.
    description: "I touched the walls of the finished Second Temple and heard the old men weep — some for Solomon's lost glory, some for joy. Smaller than the dream, but real and true, built by returned exiles."
    status: "first draft"
    sha256: "752536447e60faa8cf9cbf2f3ce788dd706a5add7132b5c56e092fec0571070d"
  - number: "1035"
    volume: 2
    title: "Persepolis Begun"
    date: "515 BCE"
    region: "Persia"
    poem: |
      Darius started it — the terrace city of the kings,
      Persepolis, where the great stairs climb and the stone sings
      with carven guards and tribute-bearers in a line.
      I walked the first-laid stones when the design
      was fresh, and watched the workmen raise the walls
      that would outlast the empire's rise and falls.
      The great stairs still climb the plain today.
      I was there when they began. I remember the way.
    description: "I walked the first-laid stones of Persepolis when Darius began his terrace city — the great stairs still climbing the plain, carven guards in line. I was there at the beginning."
    status: "first draft"
    sha256: "35df98e17df954a00c62f7fbbb40281a21f8777411f7c3bada60be241f03d429"
  - number: "1036"
    volume: 2
    title: "The Republic Is Born"
    date: "509 BCE"
    region: "Rome"
    poem: |
      They drove the last king out — Tarquin, proud and cruel —
      and swore that Rome would never again kneel
      to one man's rule. I stood in the Forum when they swore
      the oath: no king, forevermore.
      The Republic was born in that refusal, rough and new —
      consuls, senate, citizens, the many, not the few.
      It would last five centuries. I heard the oath that day.
      Rome would never kneel again. They meant what they say.
    description: "I stood in the Forum when Romans drove out their last king and swore the city would never kneel again — no king, forevermore. The Republic was born in that refusal, rough and new."
    status: "first draft"
    sha256: "debf4555665dc1b4bf1eca87cea916f8743ddb220237e1e2657672702225f826"
  - number: "1037"
    volume: 2
    title: "The People Get Tribes"
    date: "508 BCE"
    region: "Athens"
    poem: |
      Cleisthenes took Athens and redrew the map —
      ten new tribes, mixing the city, closing the gap
      between the old clans' power. I watched him draw the lines
      that broke the aristocrats' hold, and the people's signs
      of joy. The machinery of democracy, built to last —
      not by birth, but by lot, the die was cast.
      I stood among the citizens when the tribes were named.
      Athens belonged to its people. That was the game.
    description: "I watched Cleisthenes redraw Athens into ten new tribes, breaking the old clans' grip and mixing the city. Not by birth but by lot — the machinery of democracy, and Athens belonged to its people."
    status: "first draft"
    sha256: "0891bca1fdd19345b66a0deb19792fe09a235aa9769fd8e631b27ae93481e470"
  - number: "1038"
    volume: 2
    title: "The Red-Figure Revolution"
    date: "c. 503 BCE"
    region: "Greece"
    poem: |
      The Athenian painters flipped it — red figures on black ground,
      fine lines instead of silhouettes, detail all around.
      I watched them paint with brushes thin as hair,
      muscles, drapery, expressions, all laid bare.
      The red-figure revolution changed what vases could say —
      not just shapes, but stories, in the brightest day
      of Greek art. I held a fresh-fired cup and turned
      it in the light. The future of painting, learned.
    description: "I watched Athenian painters invent red-figure pottery — fine brush-lines instead of silhouettes, muscles and expressions laid bare on black ground. I held a fresh-fired cup; the future of painting."
    status: "first draft"
    sha256: "0554eb84e0d878560b59d55c53c484235444ba1ee1ef5acaf37db0508a76a653"
  - number: "1039"
    volume: 2
    title: "Hanno Sails South"
    date: "c. 500 BCE"
    region: "Africa"
    poem: |
      Past the Pillars Hanno sailed, down Africa's burning coast,
      a Carthaginian fleet, from first to last, a host
      of ships seeking gold and wonders. I sailed in his wake
      and heard the drums at night, saw the volcanoes wake.
      He wrote it down — the periplus, the voyage true —
      gorillas on an island, fires in the dew
      of morning. I watched the coast slide by, wild and new.
      Hanno sailed where no one sailed. I sailed there too.
    description: "I sailed in Hanno's wake past the Pillars down Africa's burning coast — drums at night, volcanoes waking, strange apes on an island. He wrote the voyage down; I watched the wild coast slide by."
    status: "first draft"
    sha256: "d7ea2c366880bcbecee720f2d51c54cbdb2bbdb998beebe4bc3c68cc54c803f9"
  - number: "1040"
    volume: 2
    title: "The Mind in the Head"
    date: "c. 500 BCE"
    region: "Greece"
    poem: |
      Alcmaeon of Croton cut the old belief apart:
      thought lives in the brain, he said, not the heart.
      I watched him work — the dissections, the careful eye —
      and heard him argue it beneath the southern sky.
      It seems obvious now. It was a revolution then.
      The mind in the head, not the chest of men.
      I stood beside him and I felt the future turn —
      the first step toward the science we would learn.
    description: "I watched Alcmaeon of Croton argue that thought lives in the brain, not the heart — dissections and careful reasoning under the southern sky. Obvious now, a revolution then; the first step toward real science."
    status: "first draft"
    sha256: "83bccb51f8dc447532f9dc9ada2a0af4200b23725f905b0e6390bf6cf99acbc0"
  - number: "1041"
    volume: 2
    title: "The Art of War"
    date: "c. 500 BCE"
    region: "China"
    poem: |
      In the age of the hegemons, a strategist took up the brush
      and wrote that all warfare is deception — the hush
      before the feint, the truth behind the lie.
      I read the bamboo slips when the ink was dry.
      "Know yourself, know your enemy." I watched him teach
      the generals that the greatest victory's in reach
      without a battle. The Art of War, plain and deep.
      I've carried those slips with me. I keep.
    description: "I read the bamboo slips of the Art of War when the ink was dry — all warfare is deception, the greatest victory won without a battle. I've carried those words with me ever since."
    status: "first draft"
    sha256: "86b30a65521034d8ac079fbbbcd81bdbff6c8ebbfd5913cb7c7290f5403c3a6e"
  - number: "1042"
    volume: 2
    title: "The Iron Plow"
    date: "c. 500 BCE"
    region: "China"
    poem: |
      They hitched the oxen to iron plowshares, sharp and strong,
      and the Chinese fields gave harvests deep and long.
      I walked behind the plowteam, felt the earth turn true,
      and watched the granaries fill with more than they knew
      what to do with. Iron in the soil, oxen in the yoke —
      the harvests swelled, and the old hunger broke.
      It seems so simple: a better plow, more bread.
      I watched a civilization get fed.
    description: "I walked behind Chinese oxen hitched to iron plowshares and watched the granaries fill beyond knowing. A better plow, more bread — I watched a civilization get fed."
    status: "first draft"
    sha256: "bf6b69f1a644301ef0f1b8d406ac826749af057e046aa7e306e9757781a54817"
  - number: "1043"
    volume: 2
    title: "The Beacon Fires"
    date: "c. 500 BCE"
    region: "Greece"
    poem: |
      On the headlands around the Aegean they lit the fires —
      signal flames to guide the ships through the dark's desires.
      I stood beside a beacon-keeper on a windy height
      and watched the chain of fires answer light to light.
      The first lighthouses, before the towers were built —
      just fire on a hill, and a sailor's guilt
      eased by the sight of home. I watched a ship come in,
      guided by the flames. The dark would never win.
    description: "I stood with a beacon-keeper on a windy Aegean headland and watched signal fires answer light to light, guiding a ship home through the dark. The first lighthouses — fire on a hill, and home in sight."
    status: "first draft"
    sha256: "04d2d42eaad4e3f6da871a2230a033bb2d8d695da3f87ef35d5a3b4490eb274a"
  - number: "1044"
    volume: 2
    title: "The Lottery of Athens"
    date: "500 BCE"
    region: "Greece"
    poem: |
      I stood in the dust at the Pnyx at dawn
      and watched a potter pull a name from the urn —
      not a lord's son, a potter —
      and the crowd nodded like the sea,
      because the sea nods at nothing in particular,
      and that was the point.
      A thousand years of kings undone
      by a handful of clay tokens in a bronze jar.
      I watched the draw myself. My hands shook
      when they called my lot.
    description: "I stood among ordinary Athenians and watched them draw names from an urn to fill the city's offices, ending a thousand years of rule by birth and starting the strange experiment of rule by lot."
    status: "first draft"
    sha256: "ddf444b424cecd45a20e29c1f4c3956feb8ce269d1eea5cf8335400115eb1ca4"
  - number: "1045"
    volume: 2
    title: "The Revolt of the Ionian Cities"
    date: "499 BCE"
    region: "Ionia"
    poem: |
      They burned the tax ledgers first —
      the wooden tablets, the inked papyrus rolls —
      and the smoke off Miletus harbor smelled of freedom and lamp oil.
      Aristagoras stood on the quay and shouted,
      and men who had bent their backs for Persia for fifty years
      straightened them, all at once,
      like wheat coming up after rain.
      I marched with them. I carried a spear I did not know how to hold.
      The Persian king was far away in Susa,
      and distance, I learned that spring,
      is the mother of brave mistakes.
    description: "I was in Miletus when the Greek cities of Asia rose against Persia, burning the tax offices and sending word to Athens that the king could be beaten."
    status: "first draft"
    sha256: "8777a2e088e30a2948330e8ad5c1f3dba65547f4750475fa092ccb40cc1bd859"
  - number: "1046"
    volume: 2
    title: "The Burning of Sardis"
    date: "498 BCE"
    region: "Persia"
    poem: |
      It was an accident, mostly. A house caught,
      the wind did the rest, and the great lower city of Sardis
      went up in the night like a torch in a cave.
      We ran through streets paved with gold-dust — Sardis really was —
      and the soldiers' sandals kicked up sparks.
      But fire keeps no accounts.
      The temple of Cybele burned, and the Persians remembered it.
      Darius sat in Susa afterward and had a servant whisper in his ear
      three times a day: remember the Athenians.
      I heard the whisper. It was the softest sound in the world,
      and it started a war.
    description: "I ran through burning Sardis as the rebels torched the Persian capital's lower city, and I heard how Darius had a servant remind him daily to remember Athens — the revenge that would come at Marathon."
    status: "first draft"
    sha256: "bf98ec714d054f70e29e3ce46b04a1ed769d6aa8fb9f2d3b38abb676528062ab"
  - number: "1047"
    volume: 2
    title: "The General Who Wrote"
    date: "496 BCE"
    region: "China"
    poem: |
      He was small. That is what I remember first —
      not the silk robe, not the thirteen bamboo slips,
      just how small he stood beside the warlords.
      Sun Wu, the court called him Sunzi,
      and his voice never rose above a murmur
      even when he described burning a man's whole army in a mountain pass.
      "All warfare is deception," he said,
      and the warlords laughed, the short laugh of men
      who think they are too clever to be fooled.
      I watched him write it down anyway.
      The brush moved slow. The ink did not.
    description: "I sat in a Wu court and watched Sun Wu set down his thirteen chapters on the art of war — the quiet small man whose book on winning without fighting would outlive every army he ever advised."
    status: "first draft"
    sha256: "d47947db73c4c472b90a93eb58bbb64f6bd87e5137081d5bac26cfef051a0309"
  - number: "1048"
    volume: 2
    title: "The Last Fleet of Miletus"
    date: "494 BCE"
    region: "Ionia"
    poem: |
      Three hundred and fifty-three ships rowed out at dawn
      into the bay of Lade, and I was on the beach
      counting sails until my eyes watered.
      The Persian fleet came on in lines,
      six hundred hulls, the sea gone dark with oars.
      By noon the Samians had deserted.
      By evening the Lesbians too.
      What was left of Miletus fought anyway —
      I watched triremes rammed and drowning men
      clawing at wreckage in water that was, I swear,
      a color I have never seen since.
      They took the city after. They took the children too.
      That is what rebellion costs when the sea turns its back.
    description: "I stood on the beach at Lade and watched the Ionian fleet dissolve as allies deserted, then Miletus fell to Persia — the end of the revolt, paid for in chains."
    status: "first draft"
    sha256: "c136b777b597286a23ae9a70bff6034de71b35a074ea6457c3bce2b5aa8ad3ed"
  - number: "1049"
    volume: 2
    title: "The Play That Made Athens Weep"
    date: "493 BCE"
    region: "Greece"
    poem: |
      Phrynichus wrote a tragedy about Miletus,
      and I sat in the theater when they performed it —
      the whole city, shoulder to shoulder,
      watching their own cousins' city burn
      in verse.
      Halfway through, the weeping started.
      Old men first, then the women, then everyone.
      They fined him a thousand drachmas —
      for reminding them.
      I walked home that night past the dark harbor
      and thought: this is what a city looks like
      when it grieves in public and means it.
    description: "I sat in the theater when Phrynichus staged the fall of Miletus and the whole of Athens wept so hard they fined the playwright — grief made law, the first time art hurt a city enough to punish it."
    status: "first draft"
    sha256: "bafb6b80415a32e6e08fae92601e9ff8d7976d60d532008ecd3c1834fbe636d1"
  - number: "1050"
    volume: 2
    title: "Stone Learns to Breathe"
    date: "490 BCE"
    region: "Greece"
    poem: |
      Before, the statues all smiled the same smile —
      rigid, Egyptian, the lips carved like a rule.
      Then I watched a sculptor in a marble yard
      chip at a young man's foot and step back,
      and the foot had weight on it.
      The knee bent. The chest lifted.
      No one in the yard spoke for a long time.
      Stone had learned to breathe,
      and we were all standing there
      breathing with it.
    description: "I watched an Athenian sculptor free the human body from the stiff old smile and carve the first lifelike statue — the moment art learned that stone could breathe."
    status: "first draft"
    sha256: "b37989bfc04792d0d7bbbd659a972e9187dea54e73468e37b56bd027bf6d1d5f"
  - number: "1051"
    volume: 2
    title: "The Reed That Sweetens"
    date: "490 BCE"
    region: "India"
    poem: |
      In the Ganges plain I watched farmers cut cane,
      tall as a man, green as river water,
      and crush it between rollers until the juice ran.
      They boiled it in iron pans,
      skimmed it, poured it, waited —
      and the brown syrup turned to crystals
      like frost on a winter field.
      A child put one on my tongue.
      Sweetness I had never tasted —
      not honey, not fruit,
      something cleaner, something that stayed.
      The farmers laughed at my face.
      They had known for years what the rest of the world
      would chase across oceans to taste.
    description: "I stood in a Ganges cane field and tasted the world's first sugar crystals fresh from the boiling pan — the sweetness that would cross oceans and change the world's tables and teeth."
    status: "first draft"
    sha256: "38abcf1c0cf5f5231e2ad0e904dbd14f3bd22f8e2d8086f5a4186f3652efec29"
  - number: "1052"
    volume: 2
    title: "The Hero on Trial"
    date: "489 BCE"
    region: "Greece"
    poem: |
      Miltiades won at Marathon — I saw the runners come in —
      and Athens lifted him on its shoulders like a god.
      A year later I sat in the Assembly
      while they fined him fifty talents,
      more money than any man could pay,
      for a campaign that failed.
      He died in prison of a gangrened wound.
      The hero of the summer, rotting in the winter dark.
      I learned something that day about democracies:
      they will crown you at noon
      and bury you by supper,
      and call it justice both times.
    description: "I watched Athens turn on Miltiades, the hero of Marathon, fining him into prison and disgrace — the first lesson that a democracy can devour the very men who saved it."
    status: "first draft"
    sha256: "cd532d20463aebe2593c639582a9c83b124efade7c9a80d6cd80463442cac7b1"
  - number: "1053"
    volume: 2
    title: "The Shell Vote"
    date: "487 BCE"
    region: "Greece"
    poem: |
      They handed me a broken pot —
      a shard of some farmer's jug, curved, rough —
      and a stylus, and said: scratch a name.
      Just one. The man you most want gone.
      I stood in the line with thousands,
      and the scratching of ten thousand styli on clay
      sounded like rain on a tile roof.
      No trial. No charges. Ten years gone,
      by the quiet majority of shards.
      It was terrifying. It was beautiful.
      Power, handed to the crowd like bread,
      and the crowd ate it raw.
    description: "I held my own ostracon and scratched a name into the clay — Athens' new invention, ostracism, exiling a man for ten years with no trial, only the people's quiet vote on broken pots."
    status: "first draft"
    sha256: "5ea2b67d8e1262aaeb1b045759d953ef88abae32c654f7b64129fee044249e35"
  - number: "1054"
    volume: 2
    title: "The New Great King"
    date: "486 BCE"
    region: "Persia"
    poem: |
      Darius died in his bed at sixty-four,
      and I stood in the courtyard at Persepolis
      when the word came down the steps
      like cold water.
      His son Xerxes took the throne the same week —
      tall, handsome, furious,
      swearing over his father's body
      to finish what Darius started.
      The priests chanted. The guards stamped their spears.
      And every Greek in Asia who heard the name
      felt the ground tilt under his feet.
      The son meant war. Everyone knew it.
    description: "I stood at Persepolis when Darius died and Xerxes took the throne vowing revenge on Greece — the changing of one king that meant war for the whole Aegean."
    status: "first draft"
    sha256: "91e2db5c9d46e85f325f8bf264ad6a8fbd57a805979e570d7d59ae64e36200f2"
  - number: "1055"
    volume: 2
    title: "The Silver That Built a Fleet"
    date: "483 BCE"
    region: "Greece"
    poem: |
      They struck silver at Laurion —
      a vein so rich the miners came up blinking,
      hands black, grinning like men who'd found the sun underground.
      The Assembly wanted to split the money,
      ten drachmas a man, a gift.
      Themistocles stood up and said no.
      Build ships, he said. Two hundred ships.
      Trust the sea.
      I voted with him. We all did, barely.
      And years later, at Salamis,
      I stood on a deck paid for by that vote
      and watched the Persian fleet burn —
      all of it bought with one afternoon's argument
      about silver in the ground.
    description: "I voted in the Assembly the day Themistocles talked Athens into spending its Laurion silver strike on two hundred warships instead of handouts — the fleet that would save Greece at Salamis."
    status: "first draft"
    sha256: "a10e1962767e84952679b8c24fba38a9e2e53a3ce559ab8f7e0b0c6d02e3d905"
  - number: "1056"
    volume: 2
    title: "The Etruscan Twilight"
    date: "482 BCE"
    region: "Italy"
    poem: |
      I walked the streets of Veii at dusk
      when it was still the finest city in Italy —
      painted temples, goldsmiths' stalls,
      haruspices reading lightning like a language.
      But the cities were quarreling,
      Veii against Volsinii, Tarquinia against Caere,
      and Rome, the muddy little upstart down the Tiber,
      was watching and learning.
      Twilight is the word. Not a fall, not yet —
      just the long light going amber over the tombs,
      the banqueters laughing a little too loud,
      as if they could hear, far off,
      the sound of Roman sandals on the road.
    description: "I walked the painted streets of Etruscan Veii at its brilliant height and heard its proud cities quarreling while Rome watched from the muddy Tiber — the long twilight before the fade."
    status: "first draft"
    sha256: "79296fe1ec3704a19a6cd48fa4682ec192b6e526c831f5f23c9bd0668db46ad5"
  - number: "1057"
    volume: 2
    title: "The Oath of the Hellenes"
    date: "481 BCE"
    region: "Greece"
    poem: |
      Thirty-one cities. I counted the envoys myself
      at the Isthmus, where they swore it —
      Sparta, Athens, Corinth, the islanders,
      men who had hated each other for generations
      standing in a circle with their hands on one altar.
      The oath was simple: stand together or fall apart.
      No loopholes. No fine print.
      I watched an Athenian and a Spartan
      clasp wrists, and both of them looked surprised
      at how warm the other's hand was.
      Persia was coming with a million men.
      For one bright season, Greece remembered
      it was one country.
    description: "I stood at the Isthmus and watched thirty-one quarreling Greek cities swear a single oath against Persia — the brief miracle of unity that made Thermopylae and Salamis possible."
    status: "first draft"
    sha256: "daa6ddbc62faee5aea6d87715b834cedab76a23d75f2bd54619042c53a401fd8"
  - number: "1058"
    volume: 2
    title: "Three Hundred at the Hot Gates"
    date: "480 BCE"
    region: "Greece"
    poem: |
      The pass was so narrow
      two chariots could not pass abreast —
      I walked it before the battle,
      my shoulders brushing the rock.
      Leonidas picked it on purpose.
      Three hundred Spartans, and their helots,
      and a few thousand allies
      against the whole army of Asia.
      For three days they held.
      The arrows came like weather.
      On the last morning the traitor's path was found,
      the allies were sent home,
      and the Spartans combed their hair —
      I saw them do it, calm as men dressing for dinner —
      and died where they stood.
      "Go tell the Spartans," the stone says.
      I was there. I tell it still.
    description: "I walked the narrow pass at Thermopylae before the battle and watched Leonidas and his three hundred hold it for three days, combing their hair on the last morning before they died where they stood."
    status: "first draft"
    sha256: "d94194885320f15444a6c50b836b935ed6039d492b1279d0cf6ddae7508a546e"
  - number: "1059"
    volume: 2
    title: "The Queen Who Rammed Her Allies"
    date: "480 BCE"
    region: "Greece"
    poem: |
      Artemisia of Halicarnassus —
      the only woman commanding ships at Salamis —
      was being chased by an Athenian trireme
      with nowhere to run.
      So she did the unthinkable:
      she rammed a Persian-allied ship,
      her own side's vessel,
      sank it with all hands,
      and the Athenian captain,
      seeing a "friendly" kill,
      let her go.
      Xerxes, watching from his golden throne on the hill,
      turned to his scribes and said:
      my men have become women,
      and my women, men.
      I heard him say it. The scribes wrote it down.
      She sailed home a legend
      on the bones of her drowned allies.
    description: "I watched Queen Artemisia ram and sink an allied ship at Salamis to escape the Athenians — the ruthless trick that made Xerxes declare his men had become women and his women men."
    status: "first draft"
    sha256: "6326f5591d8dd13ba3f5c409855a81cc1bbfd1087783454383dcf6024186d2a8"
  - number: "1060"
    volume: 2
    title: "The Other Salamis"
    date: "480 BCE"
    region: "Sicily"
    poem: |
      While Greece bled at Thermopylae and Salamis,
      nobody in Athens knew
      that on the same day, an ocean away in Sicily,
      Gelon of Syracuse met the Carthaginians at Himera —
      and crushed them.
      I walked that field afterward.
      The Carthaginian dead lay in rows
      like cut wheat.
      Gelon's men were still singing.
      Two civilizations fought for their lives
      on the same afternoon,
      neither knowing the other existed.
      The West held on two fronts at once —
      and history, busy with the Aegean,
      almost forgot to write the second one down.
    description: "I walked the field at Himera where Gelon of Syracuse crushed Carthage on the very same day as Salamis — the forgotten twin battle that saved the Greek west while Greece fought Persia."
    status: "first draft"
    sha256: "68dc01a8c767fff38fa0eecac2f0bbc4efed1d3f0285bd65fd68a5b4ff1e3a60"
  - number: "1061"
    volume: 2
    title: "The Wooden Walls Hold"
    date: "480 BCE"
    region: "Greece"
    poem: |
      The oracle had said: trust the wooden walls.
      The priests said the walls of the Acropolis.
      Themistocles said ships.
      He was right.
      I was on a trireme in the narrows at dawn,
      the water between Salamis and the mainland
      so tight the Persian fleet could not turn.
      Their thousand ships crowded in like cattle in a pen —
      and we were the knives.
      By evening the strait was a wreck-yard.
      Masts like broken trees. Men clinging to oars.
      Xerxes watched his empire's navy die
      from his silver-footed throne,
      and I watched him watch,
      and I have never seen a man so alone
      in the middle of so many soldiers.
    description: "I rowed in the narrows at Salamis where Themistocles trapped the Persian fleet and destroyed it — and I watched Xerxes on his hilltop throne see his navy die and his invasion with it."
    status: "first draft"
    sha256: "8aea8f31afaf4c8a56c30fc2cb28c5f2892ea25056f7646400c431fb56b9b7d1"
  - number: "1062"
    volume: 2
    title: "The Last Persian Army"
    date: "479 BCE"
    region: "Greece"
    poem: |
      A year after Salamis, the Persians came back on land —
      Mardonius, the best general Xerxes had,
      with the flower of the army.
      At Plataea the Greeks stood in the dust
      and waited, and waited,
      until the Spartans' turn came.
      Then the phalanx moved.
      Eight deep, shields locked,
      bronze like a wall walking forward.
      I heard the sound it made —
      not a shout, a grinding,
      like a millstone made of men.
      Mardonius fell. The camp burned.
      The last Persian army in Greece
      melted into the Boeotian hills,
      and Europe, for the first time,
      belonged to Europeans.
    description: "I stood behind the Spartan line at Plataea and heard the phalanx grind forward like a millstone of bronze — the battle that broke Persia's last army and freed Greece for good."
    status: "first draft"
    sha256: "54074e57a8d2d25c47436db39957f1bb9836c8efca6385f3ccddf1d09360da30"
  - number: "1063"
    volume: 2
    title: "The Day the Ionians Were Freed"
    date: "479 BCE"
    region: "Ionia"
    poem: |
      The same morning as Plataea — the gods love symmetry —
      the Greeks crossed to Mycale
      and burned the Persian ships on the beach.
      I helped drag brushwood to the hulls.
      The fire took fast. The Persians ran.
      When the smoke cleared, the island cities
      sent boats out, cautious, disbelieving,
      like animals leaving a cage
      with the door standing open.
      Miletus. Samos. Chios. Lesbos.
      Free. The word felt strange in the mouth,
      like a tooth grown back.
      I watched an old fisherman kiss the sand
      of a harbor no Persian would tax again.
    description: "I helped burn the Persian ships at Mycale on the same day as Plataea, and watched the Ionian island cities step out of Persian rule like animals leaving an open cage."
    status: "first draft"
    sha256: "ed8f0969680383862aa339f4e0862259499356c2b7797ec87f730d1697fd6df3"
  - number: "1064"
    volume: 2
    title: "The League of the Sea"
    date: "478 BCE"
    region: "Greece"
    poem: |
      They met on Delos, the holy island,
      and dropped iron ingots into the sea —
      the oath: unbreakable as iron resting on the seabed.
      Every city would pay ships or silver
      to keep Persia out of the Aegean forever.
      I watched them lower the treasure chest into the temple.
      It looked so innocent. A box. A lock.
      Within a generation that box would sit in Athens,
      the "allies" would be subjects,
      and the League would be an empire
      wearing a league's old clothes.
      I saw the iron sink. I should have known.
      Iron rusts, even on the seabed.
    description: "I watched the allies sink iron into the sea at Delos to seal their league against Persia — and saw the first quiet step toward the day that league's treasure chest would become Athens' empire."
    status: "first draft"
    sha256: "53f5bf86a4ed3ac05a11f6dd28bd2f062af0a25bc70284a09d697f0a9b01778b"
  - number: "1065"
    volume: 2
    title: "The Bones of Theseus"
    date: "476 BCE"
    region: "Greece"
    poem: |
      Cimon sailed to Scyros and dug up a giant skeleton —
      a bronze spear beside it, a sword —
      and declared: these are the bones of Theseus,
      the hero who killed the Minotaur.
      Maybe they were. Maybe they were some tall dead pirate.
      It didn't matter. Athens carried the bones home
      in a warship draped with flowers,
      and the whole city turned out,
      weeping, cheering, reaching to touch the coffin.
      I walked in the procession.
      A city needs its myths the way a body needs bones —
      something hard inside to hold the soft parts up.
      Athens had just borrowed its own.
    description: "I walked in the procession when Cimon brought home a giant skeleton declared to be Theseus — Athens giving itself a mythic founder's bones to hold its young empire upright."
    status: "first draft"
    sha256: "89b7036a61aeb1aaeec835c02c999e39baa6848e26fb372f6e60663ed8e5b46a"
  - number: "1066"
    volume: 2
    title: "The Battle of Cumae"
    date: "474 BCE"
    region: "Italy"
    poem: |
      Off Cumae, where the cliffs meet the Tyrrhenian Sea,
      Hieron of Syracuse met the Etruscan fleet
      and sent it to the bottom —
      mast by mast, in sight of the shore.
      I stood on those cliffs with the fishermen
      and watched the sea catch fire with wreckage.
      Etruscan sea power died that afternoon,
      and Rome — little Rome, still a republic of farmers —
      breathed easier without knowing why.
      The Etruscans never ruled the waves again.
      The future belonged to whoever built the next fleet.
      It would be Rome. It was always going to be Rome.
    description: "I watched from the cliffs at Cumae as Syracuse sank the Etruscan fleet and ended Etruscan sea power — clearing the waters for the Rome that was quietly growing down the coast."
    status: "first draft"
    sha256: "fdfdf0dff973835ec7f43df79550f6ddfd9e3796bcc4339e86a41db81ca07a6d"
  - number: "1067"
    volume: 2
    title: "The Play About the Enemy"
    date: "472 BCE"
    region: "Greece"
    poem: |
      Eight years after Salamis, Aeschylus —
      who had fought there himself, spear in hand —
      wrote a tragedy about the Persians.
      Not about the Greek victory. About the Persian grief.
      The widows of Susa. The empty throne.
      Xerxes coming home in rags.
      I sat in the theater and watched Athens —
      the victors — weep for the vanquished.
      It won first prize.
      That is the thing no empire has ever done since:
      eight years after the war, the winners
      paid good money to sit in the sun
      and cry for the losers.
      I was proud of them that day
      in a way I have rarely been proud of anyone.
    description: "I sat in the theater when Aeschylus, a veteran of Salamis, staged The Persians — Athens weeping for its defeated enemy eight years after the war, and awarding it first prize."
    status: "first draft"
    sha256: "1af7bc738e6309626d5bf54725851643e6c14bd104115e031aa8b01a8482db2e"
  - number: "1068"
    volume: 2
    title: "The Exile of the Savior"
    date: "471 BCE"
    region: "Greece"
    poem: |
      They ostracized him. Themistocles —
      the man who built the fleet,
      who tricked Xerxes into the narrows,
      who saved Greece —
      scratched out on ten thousand potsherds
      and sent into exile for ten years.
      I watched him leave Piraeus at dawn.
      No crowd. No cheers. Just a ship and a north wind.
      He ended up at the Persian court —
      the court he had humiliated —
      and the Great King's son gave him cities to rule.
      The savior of Salamis died a Persian governor.
      Athens does this. It eats its saviors
      the way the sea eats ships:
      without malice, without memory.
    description: "I watched Themistocles, the savior of Salamis, sail into exile after Athens ostracized him — ending his days as a governor for the Persian king he had defeated."
    status: "first draft"
    sha256: "2d45a96dfcb87457de7fe5525c5ed2575a0b57c7be78712310909e471ab00e85"
  - number: "1069"
    volume: 2
    title: "The Young Rival"
    date: "468 BCE"
    region: "Greece"
    poem: |
      He was twenty-eight. Sophocles —
      a beautiful young man, they said, a dancer, a musician —
      stepped into the drama contest
      against Aeschylus, the old lion, the veteran of Marathon,
      and beat him.
      I was there. The crowd gasped when the judges announced it.
      Aeschylus left Athens soon after, they say,
      stung to the bone.
      But that is how art moves:
      not by the old lion's permission,
      but by a young man stepping forward
      with better masks, a third actor,
      and no fear at all.
      Tragedy changed hands that afternoon.
      It never went back.
    description: "I was in the crowd when twenty-eight-year-old Sophocles defeated the great Aeschylus in the drama contest — the afternoon tragedy changed hands and never looked back."
    status: "first draft"
    sha256: "9d0a167ddd22bb2d140b6be25cffa5ae942ad577df9be5fda1e0b5a758d73761"
  - number: "1070"
    volume: 2
    title: "The Earth Shakes, the Helots Rise"
    date: "465 BCE"
    region: "Sparta"
    poem: |
      The earthquake came at noon —
      I was in the fields outside Sparta when the ground
      stood up like a horse and threw everything off.
      Houses folded. The gymnasium collapsed on the boys inside.
      The earth opened and did not close for days.
      And in the dust and screaming,
      the helots — the enslaved Messenians,
      who outnumbered their masters ten to one —
      picked up their farm tools and rose.
      Sparta, the city of warriors,
      was suddenly a city under siege by its own slaves.
      It took them years to put it down.
      The earth had spoken first.
      The slaves had only answered.
    description: "I was outside Sparta when the great earthquake leveled the city, and I watched the enslaved helots seize the moment and rise — the revolt that terrified the masters of Greece for years."
    status: "first draft"
    sha256: "615c782a911383a7d5e621bb514c1cb30347d56f490f5954bbcc5c2c969a3e41"
  - number: "1071"
    volume: 2
    title: "The Revolt on the Nile"
    date: "464 BCE"
    region: "Egypt"
    poem: |
      Inaros, a Libyan prince with a grudge and an army,
      raised Egypt against Persia —
      and Athens, drunk on its new empire,
      sent two hundred ships to help.
      I sailed with them up the Nile.
      The river was green and wide and indifferent.
      For a while we won. Memphis nearly fell.
      Then the Persians came back with everything,
      trapped our fleet in the Delta marshes,
      and burned the ships where they sat.
      Of all those Athenians, almost none came home.
      I came home. I still hear the river at night.
      Some causes are doomed the way some rivers
      only flow one way: down.
    description: "I sailed up the Nile with the Athenian fleet sent to aid Egypt's revolt against Persia — and watched it trapped and burned in the Delta, one of Athens' first great imperial disasters."
    status: "first draft"
    sha256: "586042db28ff3dd552551cfdca2cb6baf74f841a536395cd60da562502d62536"
  - number: "1072"
    volume: 2
    title: "The Reformer Is Murdered"
    date: "461 BCE"
    region: "Greece"
    poem: |
      Ephialtes did the bravest thing in Athenian history:
      he stood up in the Assembly and stripped the old Areopagus council
      of everything — its courts, its vetoes, its power —
      and handed it all to the people.
      Real democracy, not the half-measure.
      The crowd roared.
      A few weeks later they found him
      stabbed in the dark.
      I had spoken with him the day before.
      He knew it was coming. He did it anyway.
      That is the price of giving power away
      in a world that kills for keeping it.
      Athens got its democracy.
      Ephialtes got a knife.
    description: "I spoke with Ephialtes the day before he was stabbed for stripping the old council of power and giving it to the people — the murder that bought Athens its full democracy."
    status: "first draft"
    sha256: "abf25148ffc2e4c0d1bee56163fd6f02e1d9c6e7308e44cf0f2716bda947e14e"
  - number: "1073"
    volume: 2
    title: "The Age of Pericles Begins"
    date: "460 BCE"
    region: "Greece"
    poem: |
      Pericles took the lead that year —
      not by lot, not by birth, but by talking.
      I heard him speak in the Assembly,
      and the man could make a tax levy sound like poetry
      and a war sound like a wedding.
      He was tall, calm, with a head the comic poets mocked,
      and he ruled Athens for thirty years
      without ever being king.
      The golden age started the way gold starts:
      quietly, underground,
      before anyone sees it shine.
      I watched him walk home through the Agora that evening,
      alone, unguarded.
      The city trusted him that much.
      It would not trust anyone that much again.
    description: "I heard Pericles speak in the Assembly the year he took Athens' lead — the calm, unguarded man whose thirty years of persuasion would become the city's golden age."
    status: "first draft"
    sha256: "7a97e0563070e64ce3d66149ade2d29d9ee4b6cc53d293c551689ee0835f17f8"
  - number: "1074"
    volume: 2
    title: "The Oresteia"
    date: "458 BCE"
    region: "Greece"
    poem: |
      Three plays. One day. Dawn to dusk.
      Aeschylus, old now, near the end,
      staged the whole curse of the house of Atreus —
      murder breeding murder, blood calling for blood —
      until Athena herself stepped in
      and invented the jury.
      I sat through all of it, my back aching on the stone,
      and watched a city learn, in verse,
      that vengeance has to stop somewhere,
      and the somewhere is a courtroom.
      The Furies became the Kindly Ones.
      The audience wept and cheered at once.
      Justice was born on a stage
      before it was fully born in the law.
    description: "I sat through all three plays of the Oresteia in a single day and watched Aeschylus turn blood-vengeance into trial by jury on stage — justice invented in verse before it was finished in law."
    status: "first draft"
    sha256: "c2185366a61334fa33ed9ea9aa38dbd78e27e0d324fcd5b63171b9356f820333"
  - number: "1075"
    volume: 2
    title: "The Scribe Returns"
    date: "458 BCE"
    region: "Judea"
    poem: |
      Ezra came up from Babylon with the Law —
      not an army, not gold, just scrolls —
      and gathered the people of Jerusalem
      in the square by the Water Gate.
      He read aloud from morning to midday.
      The Levites explained it, passage by passage,
      and the crowd — farmers, builders, women, children —
      wept.
      I stood at the edge of that crowd.
      They had lost the Temple, the kingdom, everything,
      and a man reading old words in the sun
      gave it all back to them.
      A nation rebuilt from a book.
      I have seen empires fall with less cause
      and rise with less reason.
    description: "I stood in the square at Jerusalem's Water Gate and watched Ezra read the Law aloud from morning to midday while the returned exiles wept — a nation rebuilt from a book."
    status: "first draft"
    sha256: "a5b03cd67fd97a8f5af3cdf6e0af8b4d14e08d07ba600e17ff9f84e7b41661ab"
  - number: "1076"
    volume: 2
    title: "The Treasury Moves"
    date: "454 BCE"
    region: "Greece"
    poem: |
      They said it was for safekeeping.
      The Persian threat, the unsafe island —
      so the League's treasure chest was carried
      from Delos to the Acropolis at Athens.
      I watched the ships unload the silver.
      Chest after chest, guarded, counted, locked
      into the back room of the Parthenon-to-be.
      Nobody voted the allies out of their own league that day.
      They didn't have to.
      The money moved, and the empire followed the money,
      the way a dog follows a hand with meat in it.
      From that afternoon, the "allies" were subjects
      paying tribute to a city that called it protection.
    description: "I watched the League's war chest unloaded on the Acropolis — the \"temporary\" move from Delos that turned allies into subjects and the league into Athens' empire."
    status: "first draft"
    sha256: "5ba06bb598a85e1da604f00b4599fb4cd9a3127573319be9ef1b0a7c32867115"
  - number: "1077"
    volume: 2
    title: "The Twelve Tables"
    date: "450 BCE"
    region: "Rome"
    poem: |
      Rome wrote its laws down —
      twelve bronze tablets, set up in the Forum
      where any man could walk up and read them.
      I stood there reading over a farmer's shoulder.
      No more secret laws, no more
      "the priests say, the patricians know."
      Debt, marriage, theft, burial —
      all of it in plain bronze.
      A plebeian next to me traced the letters with his finger
      and grinned. "Now they can't lie to us," he said.
      He was wrong, of course — men always find a way —
      but for one bright morning in the Forum,
      the law belonged to everyone who could read it.
    description: "I stood in the Forum reading Rome's first written laws over a farmer's shoulder — twelve bronze tablets that dragged justice out of the priests' keeping and into the open air."
    status: "first draft"
    sha256: "897829bfc17a60da4587df8d515dee0063b7e9fc917f0bb39452ed74b16b08f6"
  - number: "1078"
    volume: 2
    title: "The Golden Kingdom"
    date: "450 BCE"
    region: "Thrace"
    poem: |
      North of Greece, on the great Thracian plain,
      the Odrysian kings rode out each spring
      with ten thousand horsemen,
      their bridles worked in gold,
      their drinking cups solid silver.
      I drank with them once — fermented mare's milk,
      strong enough to strip paint —
      and watched their goldsmiths work:
      masks, rhytons, horse-trappings,
      treasure that made Persian satraps look frugal.
      They were rich, fierce, and utterly indifferent
      to philosophy, democracy, and the Persian wars.
      History barely mentions them.
      But for a hundred years the Thracian plain
      glittered, and the kings drank,
      and the horses ran like rumors of gold.
    description: "I drank mare's milk with the Odrysian kings of Thrace and watched their goldsmiths work — the rich, fierce, forgotten kingdom north of Greece that glittered while Athens philosophized."
    status: "first draft"
    sha256: "b9bb93a77acc609198ebec10b05476eac17295cc8f38934a9ad5737c56b5213c"
  - number: "1079"
    volume: 2
    title: "The Peace of Callias"
    date: "449 BCE"
    region: "Persia"
    poem: |
      Fifty years. That is how long the Greeks and Persians
      had been at each other's throats —
      Marathon, Thermopylae, Salamis, the burned cities,
      the widows on both sides of the water.
      Then Callias sailed to Susa with full powers,
      and the two sides sat down and stopped.
      I walked the Aegean that summer.
      The triremes were hauled up on the beaches,
      their crews mending nets instead of oars,
      and the sea — the same sea that had carried
      a million men to war —
      lay flat and blue and entirely uninterested
      in glory.
      Peace is not an event. It is just
      the war taking a long breath.
    description: "I walked the quiet Aegean beaches the summer Persia and Greece finally laid down arms after fifty years — triremes hauled up, crews mending nets, the sea flat and done with glory."
    status: "first draft"
    sha256: "afa47b2f65d9bff5f9554549ea2b72369546de4e08b6232c91fcc6133e28d2e5"
  - number: "1080"
    volume: 2
    title: "Stones for Athena"
    date: "447 BCE"
    region: "Greece"
    poem: |
      They started with the foundations —
      great blocks of Pentelic marble,
      white as new snow,
      cut so fine no knife-blade fits between them.
      I stood on the Acropolis rock and watched
      the first columns rise against the Attic sky.
      Pericles had promised the city a temple
      worthy of its goddess and its pride,
      and the masons were keeping his promise
      one chisel-stroke at a time.
      The Parthenon. They would work on it
      for fifteen years.
      I have seen many buildings raised.
      I have never seen one raised like a prayer.
    description: "I stood on the Acropolis and watched the first Pentelic marble columns of the Parthenon rise — fifteen years of chisel-strokes building a temple like a prayer."
    status: "first draft"
    sha256: "637daaeb993d80910fb49af162748bc97d00c82677e401f79860a52915c2bef8"
  - number: "1081"
    volume: 2
    title: "The Wall Builder"
    date: "445 BCE"
    region: "Judea"
    poem: |
      Fifty-two days. That is all it took Nehemiah —
      cupbearer to the Persian king, turned builder —
      to raise the walls of Jerusalem
      while the neighbors on the hills
      mocked and threatened and plotted.
      I carried stones with them for a week.
      Everyone worked: priests, merchants, goldsmiths,
      women carrying mortar, children fetching water.
      They built with a trowel in one hand
      and a sword in the other —
      I saw it, I am not making it up —
      because the raiders came at night.
      On the fifty-second day the last gate was hung,
      and the mockers on the hills went quiet.
      A wall is just stacked stone.
      But a wall raised in fifty-two days
      by people who refused to stop
      is a sentence written in rock:
      we are still here.
    description: "I carried stones for a week with Nehemiah's builders and watched Jerusalem's walls rise in fifty-two days — trowel in one hand, sword in the other, while enemies mocked from the hills."
    status: "first draft"
    sha256: "301a0215b253e16e20eac130376338659b26783e71c7f6e5fff3cd34368ffbd7"
  - number: "1082"
    volume: 2
    title: "The Colony at Thurii"
    date: "443 BCE"
    region: "Italy"
    poem: |
      Athens founded a city in the instep of Italy —
      Thurii, on the ashes of old Sybaris —
      and invited all of Greece to come claim a plot.
      Herodotus took one. I walked the new streets with him
      while the surveyors were still chalking the lines.
      He was already asking the locals questions —
      about the soil, the rivers, the old Sybarite ruins —
      filling his notebooks before his house had a roof.
      A colony is a gamble: new streets, new gods,
      new neighbors who may kill you.
      Herodotus treated it like a library
      that happened to have streets.
      He would write the history of the whole world
      from notes taken in a half-built town.
    description: "I walked the chalk-lined streets of new Thurii with Herodotus, who took a colonist's plot and started filling notebooks before his house had a roof — the historian gathering the world in a half-built town."
    status: "first draft"
    sha256: "e902423b9316cdcfecf02d5584d51401d40a8ae8e982ec959c1ea811c24d5d93"
  - number: "1083"
    volume: 2
    title: "Antigone"
    date: "442 BCE"
    region: "Greece"
    poem: |
      The king said: leave him unburied. Let the birds have him.
      The girl said: no.
      I sat in the theater when Sophocles staged it —
      Antigone, alone against Creon,
      dusting earth over her brother's body
      with her own hands, knowing the price.
      The whole of Athens argued on the way home:
      the law against the heart,
      the city against the soul.
      My neighbor, a rope-maker, said the king was right.
      His wife said the girl was right.
      They were still arguing at their door.
      Some plays entertain. This one
      put a whole city on trial
      and let it sentence itself.
    description: "I sat in the theater for Antigone and walked home through an Athens arguing with itself — the girl who defied a king to bury her brother, law against conscience, a city put on trial by a play."
    status: "first draft"
    sha256: "719ac5d1834aeff7e91c8258e09306b1a5e8c78cd9b4d34209e90bd4eb923265"
  - number: "1084"
    volume: 2
    title: "The Samian War"
    date: "441 BCE"
    region: "Greece"
    poem: |
      Samos rebelled — rich Samos, with its fleet and its walls —
      and Athens came down on it like a hammer.
      Nine months of siege. I watched the blockade
      from a merchant ship anchored offshore,
      the Athenian triremes circling like sharks.
      When the city fell, Athens tore down its walls,
      took its fleet, and fined it crushing tribute.
      The "allies" took note.
      The League was an empire now,
      and the iron fist inside the velvet treaty
      had shown itself in the Aegean sun.
      I sailed away past the ruined harbor
      and thought of Delos, and the iron
      sunk in the sea, and how fast
      oaths rust when money is involved.
    description: "I watched from offshore as Athens crushed rebellious Samos in a nine-month siege — the day the Delian League's iron fist showed itself and the allies learned what empire meant."
    status: "first draft"
    sha256: "d48ec14b38377de99e85d6db4adcf53bd0fda755d8217ece84950a5740dca220"
  - number: "1085"
    volume: 2
    title: "The Father of History"
    date: "440 BCE"
    region: "Greece"
    poem: |
      Herodotus stood up in Athens and read aloud —
      his own work, his own voice, for hours —
      kings and wars and wonders from the ends of the earth:
      Egypt, Scythia, Babylon, the gold-digging ants of India.
      I sat in that audience, spellbound with the rest.
      He had walked half the world asking questions
      and come home with stories.
      They gave him ten talents — a fortune —
      voted by the Assembly.
      The father of history, paid in silver
      by the world's first democracy.
      He earned every drachma.
      Nobody had ever tried to write down
      everything before.
    description: "I sat spellbound while Herodotus read his Histories aloud in Athens — kings, wars, and wonders from the ends of the earth — and watched the Assembly pay him ten talents for inventing history itself."
    status: "first draft"
    sha256: "555e25335e05703d1c3bd77a54df2420deac592025534f844b1a1e3cee0d2110"
  - number: "1086"
    volume: 2
    title: "The Mohist Engineers"
    date: "438 BCE"
    region: "China"
    poem: |
      Mozi preached universal love —
      love everyone, not just your kin,
      a scandalous idea in warring China —
      and his followers, being practical men,
      built the finest siege engines in the world
      to defend the cities of the weak.
      I watched them work: cloud ladders, trebuchets,
      repeating crossbows, walls within walls.
      Gentle men, soft-spoken,
      who could take apart your fortress
      before breakfast and lecture you on mercy
      over lunch.
      Love your enemy, they said.
      But build the machines anyway —
      because the other fellow
      has not read Mozi.
    description: "I watched Mozi's gentle followers build the finest siege engines in China — preachers of universal love who defended the weak with cloud ladders and repeating crossbows."
    status: "first draft"
    sha256: "b212c568ca8ea388c811f5b262850b0c083c89ddb7e2c360eeeb9b7d7d6d2ac8"
  - number: "1087"
    volume: 2
    title: "The Gate of the Acropolis"
    date: "437 BCE"
    region: "Greece"
    poem: |
      Mnesicles began the Propylaea that year —
      the great marble gateway to the Acropolis,
      five doors, columns like a forest of white trunks.
      I climbed the ramp with the workmen at dawn.
      The stones were so big they moved them
      on rollers with two hundred men pulling,
      singing to keep time.
      A gateway is a strange thing to build so grand.
      You walk through it in a minute.
      But Athens understood: the entrance
      is the promise.
      Climb those steps, pass under that marble,
      and you have already agreed
      that what lies beyond is sacred.
    description: "I climbed the Acropolis ramp at dawn with the workmen raising the Propylaea — the great marble gateway Athens built as a promise that what lay beyond was sacred."
    status: "first draft"
    sha256: "d086d6b3d0dd2f6db1676820f7fb248460a7c2ea41334ec59f0b50662b373e7b"
  - number: "1088"
    volume: 2
    title: "The Spark at Epidamnus"
    date: "435 BCE"
    region: "Adriatic"
    poem: |
      It started with a local quarrel —
      the democrats of Epidamnus threw out the oligarchs,
      Corinth backed one side, Corcyra the other,
      a colonial spat on a far Adriatic shore
      that nobody in Athens could find on a map.
      I was there when the first ships burned in the harbor.
      The smoke was small. The consequences were not.
      Corinth appealed. Corcyra appealed.
      Athens had to choose, and choosing
      meant the great war.
      All of it — the twenty-seven years of Greek killing Greek —
      from a dockside brawl in a town
      most Athenians had never heard of.
      History turns on hinges this small.
    description: "I watched the first ships burn at Epidamnus — a colonial dockside quarrel on a far Adriatic shore that dragged Athens and Corinth, step by step, toward the great war."
    status: "first draft"
    sha256: "b52298a37d1acc2a5559a614da2e3a73e3f7e04db2ccec049bd328209061ebbb"
  - number: "1089"
    volume: 2
    title: "The Road to War"
    date: "433 BCE"
    region: "Greece"
    poem: |
      Corcyra begged Athens for ships —
      a defensive alliance, they said, just a shield,
      nothing aggressive —
      and the Assembly debated for two days.
      I sat through both days. The speeches were magnificent.
      The old warned of the trap. The young hungered for the fleet.
      Pericles sat silent, which told everyone
      he had already decided.
      They voted yes. Thirty ships.
      A "defensive" alliance with Corcyra
      meant war with Corinth,
      which meant war with Sparta.
      Every man in that Assembly knew it.
      They voted yes anyway.
      That is how the great war became unavoidable:
      not by surprise, but by vote.
    description: "I sat through two days of debate while Athens voted to ally with Corcyra — the vote everyone knew meant war with Corinth and Sparta, taken with open eyes."
    status: "first draft"
    sha256: "1778cade6c83bed20062b229e5267d7e6f38bda957a28be67b814922afd81bc5"
  - number: "1090"
    volume: 2
    title: "The War of Cousins"
    date: "431 BCE"
    region: "Greece"
    poem: |
      Sparta marched into Attica in the spring —
      I watched the smoke rise from the farms
      as the Spartans burned the olive groves,
      trees that had taken a hundred years to grow,
      gone in an afternoon.
      Athens stayed behind its walls.
      Pericles' plan: let them burn the fields,
      keep the fleet, keep the empire, outlast them.
      Greek against Greek. Cousin against cousin.
      The Peloponnesian War began
      the way all civil wars begin:
      with neighbors who speak the same language
      learning, field by field,
      how to hate in it.
    description: "I watched Spartan torches take the olive groves of Attica — century-old trees gone in an afternoon — as the Peloponnesian War began: Greek against Greek, cousin against cousin."
    status: "first draft"
    sha256: "334b67e66b35e302091ad36056fb57756b51f8954ad2d79c480ab06220feeef5"
  - number: "1091"
    volume: 2
    title: "Medea"
    date: "431 BCE"
    region: "Greece"
    poem: |
      Euripides put a mother on stage
      who murders her own children to punish her husband —
      and the audience, I swear,
      did not breathe for the last ten minutes.
      I sat among them, horrified and thrilled
      like everyone else.
      Medea was no monster from myth;
      she was a wronged wife with a mind like a knife,
      and every woman in the theater
      recognized something in her
      that frightened them.
      The judges gave it third prize.
      The crowd never forgot it.
      Some plays win the contest.
      This one won the centuries.
    description: "I sat breathless through Euripides' Medea — the mother who murders her children for revenge — third prize that day, but the play that won the centuries."
    status: "first draft"
    sha256: "0a1b17326b16ad1499c74d7153f5bd4018ff834eaf3bc6a0ec8bdcbcb8d86465"
  - number: "1092"
    volume: 2
    title: "The Plague"
    date: "430 BCE"
    region: "Greece"
    poem: |
      It came with the summer —
      the sickness, from the crowded ships,
      from the refugees packed inside the Long Walls.
      I nursed my neighbors through it.
      I buried two of them myself.
      Thucydides described it: the burning head,
      the red eyes, the thirst no water touched,
      the bodies stacked in the temples
      because the pyres ran out of wood.
      Athens buried its dead without rites, without names.
      The laws of burial, of decency, of the gods —
      all of it went into the plague pits together.
      Pericles lost his sons to it. Then Pericles himself.
      The city survived. Something in it did not.
    description: "I nursed neighbors through the Athenian plague and buried two of them myself — the sickness that filled the temples with unburied dead and took Pericles himself."
    status: "first draft"
    sha256: "3723e099713dd1bc0afac2761a4e9e5046cc7917b41033d35aa7bfa69fdc7edb"
  - number: "1093"
    volume: 2
    title: "The King Who Blinded Himself"
    date: "429 BCE"
    region: "Greece"
    poem: |
      Sophocles staged a detective story —
      a king hunting a killer,
      following clue after clue,
      interrogating witnesses,
      relentless, brilliant —
      until every clue pointed at himself.
      I watched Oedipus realize it.
      The theater went so quiet
      I could hear the wind in the pines above.
      He blinded himself with his wife's brooches.
      The crowd moaned like one animal.
      The greatest detective story ever written,
      and the detective is the murderer.
      Sophocles knew: the hardest truth to find
      is the one about yourself.
    description: "I watched Oedipus follow every clue to himself and blind himself on stage — the detective story where the killer is the detective, and the hardest truth is the one about yourself."
    status: "first draft"
    sha256: "c2b100b71a483f75635af98e3c928315311771828b5683a41f0799edf7c580e6"
  - number: "1094"
    volume: 2
    title: "The Debate Over Mercy"
    date: "428 BCE"
    region: "Greece"
    poem: |
      Mytilene rebelled. Athens voted —
      in anger, in the heat of the afternoon —
      to kill every man on the island
      and sell the women and children.
      A ship was sent with the order.
      That night, Athens could not sleep.
      I walked the streets; men were arguing
      in doorways, in taverns, all night.
      Next morning they voted again.
      Diodotus spoke for mercy — cold, calculating mercy,
      not kindness but interest —
      and won by a handful of votes.
      A second ship was launched,
      rowed day and night, no stops,
      and reached Mytilene just as the first order
      was being read.
      One day's anger, one night's regret,
      one dawn's rowing —
      and a city lived.
    description: "I walked the sleepless streets of Athens the night it regretted voting to slaughter Mytilene — and watched the second ship row day and night to arrive as the death order was being read."
    status: "first draft"
    sha256: "d8d2c291604cc13240336c701bcac0b35936a7a6a680fc1a65dbb55424245f32"
  - number: "1095"
    volume: 2
    title: "The Historian of Power"
    date: "427 BCE"
    region: "Greece"
    poem: |
      Thucydides was a general once —
      failed at Amphipolis, exiled for twenty years —
      and he spent the exile writing.
      Not stories. Not heroes.
      How democracies talk themselves into disaster:
      the speeches, the votes, the fear dressed up as honor,
      the strong doing what they can
      and the weak suffering what they must.
      I met him once, an old man with tired eyes,
      still writing.
      He told me he was writing it
      so that future men, facing the same choices,
      might recognize them.
      Two thousand years later,
      we still recognize them.
    description: "I met the exiled Thucydides, still writing his cold-eyed account of how democracies talk themselves into disaster — the history he meant as a warning for every future age."
    status: "first draft"
    sha256: "064367af19fd86cd6a19980fc724a2b244fc1b10ee9d9479b752b0437a65ece1"
  - number: "1096"
    volume: 2
    title: "The Fox of Pylos"
    date: "425 BCE"
    region: "Greece"
    poem: |
      Cleon — the loud one, the demagogue, the man
      the respectable hated —
      promised the Assembly he would bring the Spartans
      home from Pylos alive or dead in twenty days.
      Everyone laughed. Then he did it.
      I was in the crowd when they marched the Spartan prisoners
      through Athens — Spartans, surrendered, alive —
      and the city jeered itself hoarse.
      The myth of Spartan invincibility,
      led through the streets in chains
      by the man nobody respected.
      Power does not always wear the face you expect.
      Sometimes it wears Cleon's.
    description: "I watched Cleon march captured Spartans through jeering Athens after trapping them at Pylos — the demagogue nobody respected, shattering the myth of Spartan invincibility."
    status: "first draft"
    sha256: "e26b2fc32691b2463c9d5e7fdf1584593860cbb97e329d7bf834a42807ea6c33"
  - number: "1097"
    volume: 2
    title: "The Fifty-Year Peace"
    date: "421 BCE"
    region: "Greece"
    poem: |
      They called it the fifty-year peace.
      Nicias of Athens and the Spartan kings
      signed it, sacrificed, swore the oaths,
      and for a moment — one bright, disbelieving moment —
      the killing stopped.
      I walked through the countryside that spring.
      Farmers were rebuilding walls.
      Children were playing in fields
      their fathers had died defending.
      It lasted six years, not fifty.
      But for those six years,
      Greece remembered what peace felt like —
      the way a man coming up from deep water
      remembers air.
    description: "I walked the rebuilding farms of Greece during the Peace of Nicias — six years, not fifty, but long enough for a generation to remember what peace felt like."
    status: "first draft"
    sha256: "b1c7b4d6cd35affc4b644aaa21623978e4de2a127db32b71807df50abcd8f361"
  - number: "1098"
    volume: 2
    title: "The Fate of Melos"
    date: "416 BCE"
    region: "Greece"
    poem: |
      The Athenians came to Melos with ships and an ultimatum:
      surrender, or die.
      The Melians talked of justice, of the gods, of honor.
      The Athenians talked of power.
      I was on the beach when the envoys met.
      The Athenian words were plain and terrible:
      the strong do what they can, the weak suffer what they must.
      Melos refused. Athens besieged it, took it,
      killed every man, sold every woman and child.
      Thucydides wrote it down without flinching.
      I stood in the empty streets afterward
      and understood, finally,
      what empire does to the soul of the city
      that holds it.
    description: "I stood on the beach at Melos for the famous dialogue of power versus justice — and in the empty streets afterward, after Athens killed the men and sold the women, understood what empire does to a city's soul."
    status: "first draft"
    sha256: "7b19faca4516e013e7000785f19df3a515ab75823a0c900802f6023efa626588"
  - number: "1099"
    volume: 2
    title: "The Great Expedition"
    date: "415 BCE"
    region: "Sicily"
    poem: |
      They sailed for Syracuse —
      the finest fleet Athens ever launched,
      painted shields, gold-hilted swords,
      young men singing as the triremes left Piraeus,
      dreaming of conquering the west.
      I watched them go from the mole,
      the whole city cheering.
      Almost none came back.
      Disease, bad generals, the Syracusans
      who learned to fight at sea —
      the great expedition died in the Sicilian quarries,
      Athenians worked to death
      cutting stone under a foreign sun.
      The city never recovered.
      I stood on that same mole years later,
      watching empty water,
      and heard the cheering still.
    description: "I watched Athens' finest fleet sail singing for Syracuse — and stood on the same mole years later watching empty water, after disease and defeat left them dying in Sicilian stone quarries."
    status: "first draft"
    sha256: "28a945e0593d19f82555fa808105714e2b615917d8c344bbf90143cc22445150"
  - number: "1100"
    volume: 2
    title: "The Women's Strike"
    date: "411 BCE"
    region: "Greece"
    poem: |
      Aristophanes staged it as a comedy —
      the women of Greece, led by Lysistrata,
      seizing the Acropolis and declaring:
      no peace, no love.
      A sex strike to stop the war.
      I sat in the theater howling with laughter
      along with everyone else —
      the jokes were filthy, the costumes obscene —
      and then, halfway through, I realized
      I wasn't laughing anymore.
      Under the farce was the truest thing
      said about that war in twenty years:
      the men had no idea how to stop it,
      and the women did.
      Athens laughed. Then it went home
      and kept fighting.
    description: "I laughed through Aristophanes' Lysistrata — the women's sex-strike to stop the war — until the farce turned true: the men had no idea how to end it, and the women did."
    status: "first draft"
    sha256: "1965f55e87cf319f9c37ef1e3f5d995750a5ab74200e2a0a47280501add89661"
  - number: "1101"
    volume: 2
    title: "The Seeds of Iron"
    date: "410 BCE"
    region: "China"
    poem: |
      In a smoky workshop in the state of Wu,
      I watched smiths pour molten iron
      into clay molds —
      not hammering it like bronze,
      casting it, the way you cast a bell.
      The plowshare that came out of the mold
      was harder than anything the fields had known.
      It bit the earth and did not dull.
      Cast iron. Two thousand years
      before Europe would learn the trick.
      China's farmers got the harder edge first,
      and the harder edge fed more mouths,
      and the more mouths fed the armies
      that would unify everything.
      It starts with a plowshare.
      It always starts with a plowshare.
    description: "I watched Chinese smiths pour molten iron into molds — cast iron two thousand years before Europe — and held the harder plowshare that would feed the armies of unification."
    status: "first draft"
    sha256: "e09f08ed75ed8f6e0ba0b1a908b5652323e954e1fbf09894ddeb8dfe95ff0054"
  - number: "1102"
    volume: 2
    title: "The Last of the Giants"
    date: "406 BCE"
    region: "Greece"
    poem: |
      Sophocles died. Euripides died.
      The same year. The two giants of tragedy,
      gone within months of each other,
      while Athens was still at war,
      still bleeding, still arguing.
      I attended both funerals.
      At Sophocles', they say, the city mourned
      as for a general.
      At Euripides' — he died in Macedon, in exile —
      they brought the news like a wound.
      The golden age of tragedy ended
      not with a final play,
      but with two old men dying
      in a city too busy fighting
      to notice the stage had gone dark.
      I noticed. The silence was enormous.
    description: "I attended the funerals of Sophocles and Euripides, dead in the same year — the golden age of tragedy ending not with a final play but with a city's silence."
    status: "first draft"
    sha256: "ae623381d28e19fb94da0be034124742ea89bae46e31a80330045a6479fc8d23"
  - number: "1103"
    volume: 2
    title: "The Frogs"
    date: "405 BCE"
    region: "Greece"
    poem: |
      Aristophanes sent Dionysus himself —
      the god of theater, in a lionskin, terrified of the dark —
      down to the underworld
      to bring back a dead playwright,
      because the living ones were no good.
      The contest: Aeschylus versus Euripides,
      weighing their verses on a scale,
      joke after joke after joke.
      I laughed until my sides hurt.
      But underneath: Athens, losing the war,
      losing its fleet, its empire, its young men,
      sending its god to Hades
      to beg for its poetry back.
      Comedy is just tragedy
      that learned to swim.
    description: "I laughed through The Frogs — Dionysus fetching a dead playwright from Hades — and saw underneath the jokes a losing Athens begging for its poetry back."
    status: "first draft"
    sha256: "dcc9eb89a77fff0b0f290f807dfaa60b5580e7a7c72bf328c879e189df75f4b6"
  - number: "1104"
    volume: 2
    title: "The End at Aegospotami"
    date: "405 BCE"
    region: "Greece"
    poem: |
      Lysander did it in an afternoon.
      The Athenian fleet, beached at Aegospotami,
      crews scattered foraging —
      and the Spartans fell on the empty ships
      like wolves on a flock.
      I watched from a fishing boat.
      One hundred and seventy triremes taken or burned.
      Perhaps twenty escaped.
      The long war — twenty-seven years —
      ended in a single stroke,
      on a beach, at lunchtime.
      Athens had no fleet, no food, no hope.
      The city that had ruled the sea
      was about to learn what it felt like
      to be besieged.
      The sea had been its wooden wall.
      The wall was gone.
    description: "I watched from a fishing boat as Lysander destroyed the beached Athenian fleet at Aegospotami in a single afternoon — twenty-seven years of war ending on a beach at lunchtime."
    status: "first draft"
    sha256: "dd9c763dd79b5696d3a7356a4e45a2a6b241e21c5974b5e21cc5a8ce23807110"
  - number: "1105"
    volume: 2
    title: "The Thirty Tyrants"
    date: "404 BCE"
    region: "Greece"
    poem: |
      Sparta installed thirty men to rule Athens —
      and the thirty turned the city into a slaughterhouse.
      Eight months. Fifteen hundred dead.
      Anyone with money, anyone with a grudge against them,
      anyone who looked sideways.
      I hid friends in my cellar.
      I carried messages at night.
      The democracy that had voted to kill Melos,
      that had cheered the great expedition,
      drowned in its own blood
      in less than a year.
      The Thirty called it order.
      The widows called it murder.
      I called it the proof
      that losing a war is never the worst thing
      that can happen to a city.
    description: "I hid friends in my cellar during the Thirty Tyrants' eight months of terror — fifteen hundred dead, and the proof that losing a war is never the worst thing that can happen to a city."
    status: "first draft"
    sha256: "424b616584bee9f414cd8a8b40bc5e7b193417181ba7cadc13b79ed94d0c3f37"
  - number: "1106"
    volume: 2
    title: "The Amnesty"
    date: "403 BCE"
    region: "Greece"
    poem: |
      Thrasybulus marched down from the hills,
      drove out the Thirty,
      restored the democracy —
      and then Athens did the most astonishing thing
      I have ever witnessed:
      it swore to forget.
      The amnesty: no prosecutions,
      no revenge, no settling of scores —
      except for the Thirty themselves and their worst men.
      "Let us not remember," the decree said,
      and the city obeyed.
      I watched former enemies drink together
      in the taverns of the Piraeus,
      the murderers' neighbors and the murdered men's sons,
      raising cups with steady hands.
      The first great act of forgiveness in history.
      It held. The democracy lived another eighty years
      on the strength of that forgetting.
    description: "I watched former enemies drink together in Piraeus taverns after Athens swore its great amnesty — the first act of political forgiveness in history, and it held."
    status: "first draft"
    sha256: "19b5c40ff67ecc091e8c9bdacbf663f5b882533917711db351956fcf23a74b27"
  - number: "1107"
    volume: 2
    title: "The March of the Ten Thousand"
    date: "401 BCE"
    region: "Persia"
    poem: |
      They were Greek mercenaries, ten thousand strong,
      hired by a Persian prince to take the throne —
      and the prince died at Cunaxa,
      leaving them stranded in the heart of Persia,
      a thousand miles from the sea,
      surrounded by enemies.
      I marched with them. I will not pretend otherwise.
      Through the mountains, through the snow,
      fighting every step, electing new generals
      when the old ones were murdered at dinner.
      And then, from a hilltop in Armenia,
      the vanguard started shouting —
      thalatta! thalatta! The sea! The sea!
      We ran to the top and there it was,
      the Black Sea, glittering,
      and ten thousand hardened men wept like children.
      Xenophon wrote it down.
      I was there when we saw it.
    description: "I marched with the Ten Thousand through Persian mountains and snow — and stood on the Armenian hilltop when the vanguard shouted \"The sea! The sea!\" and ten thousand men wept."
    status: "first draft"
    sha256: "52628bc59a99ce978d54c9fd5ab7b836e69a9a33a82a5aadda1c7a66d30e53ed"
  - number: "1108"
    volume: 2
    title: "The Oath of the Healers"
    date: "400 BCE"
    region: "Greece"
    poem: |
      Hippocrates taught on Cos that sickness
      has natural causes —
      not angry gods, not curses,
      but air, water, diet, the body's own workings.
      I watched him examine a fevered child:
      he looked, he touched, he asked, he waited.
      No incantations. No sacrifices.
      Just attention.
      And his students swore the oath:
      do no harm, keep confidences,
      teach the art freely.
      Two thousand four hundred years later,
      doctors still swear it.
      I heard the first ones say the words.
      They meant them.
    description: "I watched Hippocrates examine a fevered child with only his eyes and hands — no gods, no curses — and heard his students swear the first oath to do no harm."
    status: "first draft"
    sha256: "031658d2b4effe2e03f251176d138f82d2d1db3d560776f21b3f014773cef708"
  - number: "1109"
    volume: 2
    title: "The Last Colossal Heads"
    date: "400 BCE"
    region: "Mexico"
    poem: |
      La Venta fell silent.
      The Olmec city of canals and plazas,
      of jade and jaguar gods,
      emptied out — and nobody knows why.
      I walked the empty plaza at dusk.
      The colossal heads were still there —
      basalt portraits of kings, ten feet tall,
      each weighing twenty tons,
      staring across the abandoned stones.
      Who moved them? How?
      The questions hung in the humid air
      with no one left to answer.
      The giant stone faces stared at an empty plaza,
      and the jungle began, patiently,
      to take back everything.
    description: "I walked the empty plaza of La Venta at dusk among the colossal Olmec heads — ten-foot basalt kings staring at an abandoned city while the jungle began to take it back."
    status: "first draft"
    sha256: "ebec5b8aab27a36654d2a22d53845b1af8ec5604bc66f585930b1e9512cc02ef"
  - number: "1110"
    volume: 2
    title: "The Bog Sleeper"
    date: "400 BCE"
    region: "Europe"
    poem: |
      In a Danish marsh they hanged a man,
      laid him in the peat naked,
      and left him for the bog to keep.
      I was not there for the hanging.
      I was there two thousand years later,
      in a manner of speaking —
      but the peat kept him perfect:
      the rope around his neck,
      the stubble on his chin,
      the last meal of barley in his stomach.
      A sacrifice? A criminal? A king?
      The bog does not say.
      It only preserves.
      Two thousand years, and his face
      is still the face of a man
      who knew exactly what was happening.
    description: "I looked on the face the Danish bog preserved for two thousand years — rope at the neck, stubble on the chin, a man who knew exactly what was happening when they laid him in the peat."
    status: "first draft"
    sha256: "2a7d67dd53da78ed3deea2e0d56f65bf0c7775f8d31eb74b871a58d05054e2f5"
  - number: "1111"
    volume: 2
    title: "The Trigger of Bronze"
    date: "400 BCE"
    region: "China"
    poem: |
      In a Chinese workshop I watched a craftsman
      fit the pieces together:
      the bronze lock, the trigger, the bolt-groove,
      the stock of lacquered wood.
      A crossbow. But the lock —
      cast in bronze, precise as a jewel —
      meant any farmer could span it,
      aim it, and loose a bolt
      that would punch through armor
      at two hundred paces.
      No years of training with the bow.
      No aristocrat's lifetime of practice.
      Just bronze, wood, and a finger on a trigger.
      Warfare had been democratized,
      and the age of the armored nobleman
      had begun to end.
    description: "I watched a craftsman assemble the bronze crossbow lock — the mechanism that let any farmer loose an armor-piercing bolt, and began the end of the armored nobleman's age."
    status: "first draft"
    sha256: "552d445e50a1d926dd821b9eb6f0ac5aa6b8c7b0f0fcc8e0c3b44f3f23039ac5"
  - number: "1112"
    volume: 2
    title: "The First Woman Victor"
    date: "396 BCE"
    region: "Greece"
    poem: |
      Cynisca of Sparta —
      a king's daughter, a princess —
      entered a four-horse chariot team at Olympia.
      Women were forbidden even to watch the games,
      on pain of death.
      But nobody forbade owning the horses.
      Her team won. Then won again.
      I saw the statue they raised to her:
      the first monument to a woman victor
      in the history of the games.
      The inscription was hers, and it was perfect:
      "My fathers and brothers were kings of Sparta.
      I, Cynisca, winning the chariot race
      with my swift-footed horses,
      set up this statue. I declare myself
      the only woman in all Greece
      to have won this crown."
      She didn't drive the chariot.
      She didn't have to.
      She owned the thunder, and that was enough.
    description: "I saw the statue raised to Cynisca of Sparta, the first woman ever crowned at Olympia — who beat the ban on women by owning the horses, and declared her victory in stone."
    status: "first draft"
    sha256: "0f3978072adb48bdaf3b41bab84e91924387ecca853c3cbe5946ce396bae747c"
  - number: "1113"
    volume: 2
    title: "The Fall of Veii"
    date: "396 BCE"
    region: "Italy"
    poem: |
      Ten years. That is how long Rome besieged Veii —
      ten years of siege lines, of mines dug under the walls,
      of soldiers wintering in the field for the first time
      in Roman history.
      I was there when the tunnel broke through.
      The Romans came up inside the city
      through the drains, of all places —
      and Veii, the richest city of the Etruscans,
      fell in a day.
      Rome doubled its territory overnight.
      The soldiers were paid from the plunder.
      And the Etruscan twilight I had walked through years before
      turned, at last, to night.
      Veii's gods were carried to Rome
      in a solemn procession.
      Even the gods were being annexed now.
    description: "I was there when Roman miners broke through under Veii's walls after a ten-year siege — the fall that doubled Rome's land and carried even the Etruscan gods into annexation."
    status: "first draft"
    sha256: "29e6710835e53bf14c579f676b75254a15de0e3772d4ed133fcbbdeaa9298dd8"
  - number: "1114"
    volume: 2
    title: "The Corinthian War"
    date: "395 BCE"
    region: "Greece"
    poem: |
      Athens, Thebes, Corinth —
      all the old enemies of Sparta —
      suddenly arm in arm,
      and Persian gold paying the bills.
      The King's money, buying Greek spears
      to fight the Greeks who had beaten the King.
      I marched with the Athenians that summer.
      Nobody mentioned the irony.
      Men who had died at Plataea beside Spartans
      were now dying against them,
      funded by the empire their fathers had humiliated.
      That is what gold does:
      it buys the forgetting.
      And Persia, which could not conquer Greece with armies,
      learned to rent it by the season.
    description: "I marched with Athenians now allied with old enemies against Sparta — on Persian gold — and watched the empire that lost at Plataea learn to rent Greece by the season."
    status: "first draft"
    sha256: "b3b3703a074857c03e0e51aa9dee44dce8eb777c7c8c32d766ea5e05bbb8ddb8"
  - number: "1115"
    volume: 2
    title: "The Admiral's Revenge"
    date: "394 BCE"
    region: "Greece"
    poem: |
      Conon had watched Athens lose everything at Aegospotami.
      He fled. He waited. He went to the Persians —
      yes, the Persians —
      and talked them into giving him a fleet.
      At Cnidus he smashed the Spartans at sea,
      their admiral dying on his deck,
      and sailed home to rebuild the Long Walls of Athens
      with Persian money and Theban labor.
      I stood on those walls as they rose again,
      stone by stone, the city breathing free.
      Revenge is a dish the Greeks
      prefer served with irony:
      Athens rebuilt by the gold
      of the empire it had been founded to resist.
    description: "I stood on Athens' Long Walls rising again — rebuilt by Conon with Persian gold after he smashed Sparta's fleet at Cnidus — revenge served with the empire's own money."
    status: "first draft"
    sha256: "e3bed545d90b2b7f431ca70bf7ced9d7e76c906b10b1b89743746f5092ee7624"
  - number: "1116"
    volume: 2
    title: "The Geese of the Capitol"
    date: "390 BCE"
    region: "Italy"
    poem: |
      The Gauls sacked Rome —
      burned it street by street,
      all but the Capitol hill,
      where the last defenders held out,
      starving, waiting.
      One night the Gauls climbed the cliff in silence.
      The dogs heard nothing. The sentries slept.
      But the sacred geese of Juno —
      kept for the goddess, fat and noisy —
      woke, and honked, and flapped,
      and the Romans woke and threw the climbers back.
      I tell it as the legend tells it,
      because the legend is the point:
      Rome was saved by geese.
      An empire that would rule the world
      owed its life to poultry.
      The Romans never forgot it.
      Neither should we.
    description: "I tell the legend as the legend deserves — Rome sacked by Gauls, the last defenders on the Capitol woken by Juno's sacred geese, an empire-to-be saved by poultry."
    status: "first draft"
    sha256: "88800f8df4177a068d3c00529aed41835f763865fac2fb98120e9f2bdde88b82"
  - number: "1117"
    volume: 2
    title: "The Academy"
    date: "387 BCE"
    region: "Greece"
    poem: |
      Plato bought an olive grove outside Athens —
      the Academy, named for an old hero —
      and opened a school.
      Not a school for trade. A school for thinking.
      I walked those groves.
      Young men arguing about justice under the trees,
      geometry drawn in the dust,
      the famous sign over the door:
      let no one ignorant of geometry enter.
      Philosophy got a permanent address that year.
      It has been forwarding its mail
      from that olive grove ever since.
      Every university on earth
      is a branch office of Plato's trees.
    description: "I walked Plato's olive grove outside Athens where the Academy opened — the permanent address philosophy has been forwarding its mail from ever since."
    status: "first draft"
    sha256: "174760d5d8db0370419dee70f3c0f901bd922576901b65369d4aa95d7c498507"
  - number: "1118"
    volume: 2
    title: "The King's Peace"
    date: "387 BCE"
    region: "Persia"
    poem: |
      The Persian king dictated the peace.
      Not Athens. Not Sparta.
      The Great King, from Susa,
      sent down his terms like tablets from a mountain:
      the Greek cities of Asia are mine,
      the rest of you — behave.
      And the Greeks obeyed.
      Sparta enforced it. Athens swallowed it.
      I was in the crowd when the herald read the terms,
      and I watched grown men — veterans of the Persian wars —
      stand silent while a foreign king
      disposed of Greek cities like furniture.
      Fifty years after Marathon,
      Greece took orders from Persia.
      The war for freedom had been won on the battlefield
      and lost at the negotiating table.
    description: "I stood silent in the crowd while a herald read the Persian king's dictated peace — fifty years after Marathon, Greece taking orders from Susa, freedom won in battle and lost at the table."
    status: "first draft"
    sha256: "548e9a6183cc5f9bd2051459462df7bb5af1968255965d3e822d46fe622f6142"
  - number: "1119"
    volume: 2
    title: "The Tyrant's Stage"
    date: "385 BCE"
    region: "Sicily"
    poem: |
      Dionysius of Syracuse —
      the tyrant who built the first catapults,
      who fortified a city into a fortress,
      who kept poets at his court like hunting dogs —
      decided he was a tragedian.
      I sat through one of his plays.
      It was terrible. Everyone knew it was terrible.
      Nobody said so, because he was the tyrant,
      and critics of the tyrant's verses
      tended to disappear.
      He won first prize at Athens once —
      the judges were diplomats, not fools.
      A despot with a poet's vanity:
      the most dangerous kind of bad artist,
      because his reviews are written in fear.
    description: "I sat through one of the tyrant Dionysius's tragedies in Syracuse — terrible verse, terrified applause — the despot with a poet's vanity whose reviews were written in fear."
    status: "first draft"
    sha256: "08118b04027d9385b5f2ac1ea9ef2aeff183a8939e9e4f70bc5fde55b8d9dadf"
  - number: "1120"
    volume: 2
    title: "The Seizure of Thebes"
    date: "382 BCE"
    region: "Greece"
    poem: |
      It was peacetime. That is the scandal of it.
      A Spartan commander, marching past Thebes,
      seized the Cadmea — the citadel —
      in the middle of peace,
      on his own initiative,
      and Sparta kept it.
      All Greece called it a crime.
      Even Sparta's allies shifted uncomfortably.
      I was in Thebes that week.
      The citizens walked the streets
      under foreign spears,
      and the shame of it
      was like a taste of iron in the mouth.
      Sparta had become what it once fought:
      a bully with an army.
      Thebes would remember.
      Thebes always remembers.
    description: "I was in Thebes the week Sparta seized its citadel in peacetime — all Greece calling it a crime, and Thebes filing the shame away like iron in the mouth."
    status: "first draft"
    sha256: "288b4d56fa691911b4aa047283e7f329933fefdf0bca3f83849816917560e044"
  - number: "1121"
    volume: 2
    title: "The Liberation of Thebes"
    date: "379 BCE"
    region: "Greece"
    poem: |
      They came home in disguise —
      Theban exiles, slipped back into the city
      dressed as hunters, as farmers —
      and went to dinner with the tyrants.
      I was at the edge of the courtyard when it happened.
      The exiles threw off their cloaks,
      drew the swords hidden underneath,
      and killed the Spartan-backed rulers
      at their own table.
      By dawn Thebes was free.
      The Spartan garrison, stunned, negotiated its way out.
      It took one night, a dozen brave men,
      and dinner invitations.
      Tyranny is strong until someone
      invites it to dinner with a sword under his cloak.
    description: "I watched Theban exiles throw off their disguises at dinner and kill the tyrants at their own table — one night, a dozen brave men, and Thebes was free by dawn."
    status: "first draft"
    sha256: "1652e976634626014fe615f09cf933bd3488509ac0be2fd7fe14a5869210666d"
  - number: "1122"
    volume: 2
    title: "The Second Sea League"
    date: "376 BCE"
    region: "Greece"
    poem: |
      Athens tried again —
      a new league, a new alliance against Sparta,
      and this time they promised:
      no tribute, no garrisons,
      no more empire.
      The charter said so, in so many words.
      I read the charter. It was sincere.
      The Athenians meant it, I believe —
      the way a man means his resolutions
      on the first morning of the year.
      For a while it worked.
      The allies were really allies.
      But power is a tide,
      and charters are sandcastles.
      I watched it rise, honest and hopeful,
      and I already knew how the story ended.
      Everyone did. That was the saddest part.
    description: "I read the charter of Athens' Second Sea League — sincere promises of no tribute, no empire — and watched it rise honest and hopeful, knowing how the story ends."
    status: "first draft"
    sha256: "b22f84590f7aaaa19f89210a34459f3ee66d4ba96a976fbf82c69f3e0cf95db3"
  - number: "1123"
    volume: 2
    title: "The Warring States"
    date: "375 BCE"
    region: "China"
    poem: |
      The Zhou king sat on his throne in Luoyang,
      a figurehead in faded robes,
      while seven states sharpened their swords
      and stopped pretending to obey him.
      Qin. Chu. Qi. Yan. Han. Wei. Zhao.
      I traveled through all seven.
      Every court had its strategists,
      every field its conscripts,
      every minister his plan to swallow the neighbors.
      Two hundred years of it were coming —
      the bloodiest, most brilliant age in Chinese history,
      philosophers and butchers
      working side by side.
      The king kept his title.
      The states kept the power.
      And the swords kept getting sharper.
    description: "I traveled through all seven warring states while the Zhou king sat faded on his throne — the age of strategists and butchers sharpening toward two hundred years of war."
    status: "first draft"
    sha256: "29e88655136035bd4c5f58302d5dd87239e58fd84773aa3a5a8ceb660e896df9"
  - number: "1124"
    volume: 2
    title: "Thebes Breaks Sparta"
    date: "371 BCE"
    region: "Greece"
    poem: |
      At Leuctra, Epaminondas did the unthinkable:
      he stacked his left wing fifty deep —
      fifty! —
      and drove it like a battering ram
      into the Spartan right,
      where the Spartan king stood.
      I watched the Spartan line bend.
      Then break. Then run.
      A thousand Spartans dead,
      including the king.
      The myth of Spartan invincibility —
      three hundred years in the making —
      died in one afternoon on a Boeotian field.
      I walked that field at dusk.
      The Thebans were singing.
      The Spartans were gone.
      Nothing in Greece would ever be the same.
    description: "I watched Epaminondas stack his wing fifty deep and drive it through the Spartan line at Leuctra — the afternoon three hundred years of Spartan myth died on a Boeotian field."
    status: "first draft"
    sha256: "d3e1e7216e1535304072e7fcd070d6807e4289ab39af954fe8af282ed9c346e9"
  - number: "1125"
    volume: 2
    title: "The Messenians Go Home"
    date: "370 BCE"
    region: "Greece"
    poem: |
      For three hundred years the Messenians
      had been helots — Sparta's slaves,
      working the land their grandfathers owned.
      Then Epaminondas freed them,
      and they walked home.
      I walked with them.
      Old men weeping at boundary stones
      their great-grandfathers had marked.
      Women touching soil like it was a relative.
      They founded Messene in the hills,
      a real city, with walls —
      the walls built so thick, they said,
      that no Spartan would ever knock them down.
      Three centuries of slavery,
      ended by walking home.
      I have seen many victories.
      This one tasted like bread.
    description: "I walked with the freed Messenians going home after three centuries of helot slavery — old men weeping at boundary stones, founding Messene with walls no Spartan would ever knock down."
    status: "first draft"
    sha256: "bce00891e9f0d3ca5c0843724bc052e0e737de33ac7154c2f8c3b5c10cfefd18"
  - number: "1126"
    volume: 2
    title: "The Stargazer of Cnidus"
    date: "370 BCE"
    region: "Greece"
    poem: |
      Eudoxus of Cnidus looked at the wandering stars —
      the planets, the "wanderers" —
      and built them a mathematics:
      spheres within spheres within spheres,
      each turning, each carrying its star,
      all centered on the earth.
      I watched him demonstrate with bronze rings,
      his hands moving like a juggler's.
      It was wrong — the earth is not the center —
      but it was the first mathematical cosmos,
      the first time anyone made the heavens
      obey geometry.
      Wrong, and magnificent.
      Every true map since
      started as a wrong map
      drawn by a man brave enough to draw one.
    description: "I watched Eudoxus turn bronze rings in his hands, building the first mathematical cosmos from spheres within spheres — wrong about the center, magnificent about the method."
    status: "first draft"
    sha256: "170134750b9a33e35ad6c782ae521fc4cc47210f4fa56842d11fa42c7872fced"
  - number: "1127"
    volume: 2
    title: "The People's Consul"
    date: "367 BCE"
    region: "Rome"
    poem: |
      The Licinian laws passed —
      and for the first time,
      a plebeian, a commoner,
      could be consul of Rome.
      I was in the Forum when the first one took office.
      The patricians stood stiff as statues.
      The plebeians cheered until they were hoarse.
      A farmer's son, holding the highest office
      of the republic,
      the fasces in his hands.
      Rome's genius was this:
      it kept widening the circle.
      Patricians, then plebeians,
      then Italians, then the world.
      Every expansion made it stronger.
      The circle never stopped widening
      until it broke.
    description: "I stood in the Forum when Rome's first plebeian consul took office — the republic widening its circle, the genius that would keep widening until it broke."
    status: "first draft"
    sha256: "427c0d7bc294059b769546b0fe8dbb5da8ef5f5f56bee5e8e4f49acd879c299f"
  - number: "1128"
    volume: 2
    title: "Plato in Syracuse"
    date: "366 BCE"
    region: "Sicily"
    poem: |
      Plato sailed to Syracuse to tutor the young tyrant —
      Dionysius the Younger, spoiled, dangerous —
      in philosophy.
      The plan: make a philosopher-king.
      I was at the court. It was a disaster.
      The tyrant wanted flattery, not philosophy.
      Plato wanted a student, not a master.
      Within months the philosopher was practically a prisoner,
      and only begged favors got him home alive.
      Kings make poor students.
      Power does not want to be taught;
      it wants to be agreed with.
      Plato learned it at seventy years old,
      in a Syracusan palace,
      the hard way.
    description: "I watched Plato's philosopher-king experiment collapse at the Syracusan court — the tyrant wanting flattery, the philosopher nearly a prisoner, power refusing to be taught."
    status: "first draft"
    sha256: "93a870812ff06ba92977b256e826a1a03b75b66d62ee2d539dc464775f364082"
  - number: "1129"
    volume: 2
    title: "The Victory That Killed"
    date: "362 BCE"
    region: "Greece"
    poem: |
      Epaminondas won at Mantinea —
      the Theban phalanx broke the Spartans again,
      the greatest general of the age
      at the height of his powers —
      and a spear took him in the chest
      in the moment of victory.
      They carried him from the field.
      "Do we win?" he asked.
      They told him yes.
      Then he pulled the spearhead out himself —
      he knew it was holding his life in —
      and died.
      Theban greatness died with him.
      No successor, no system, just one man.
      I stood by the surgeon's tent.
      Greece's brief Theban century
      lasted exactly as long as Epaminondas lived:
      nine years.
    description: "I stood by the surgeon's tent at Mantinea when Epaminondas pulled the spearhead from his own chest and died in the moment of victory — and Theban greatness died with him."
    status: "first draft"
    sha256: "74c6265063fdd5afa36ada2801cce8b32c9c04a0faf76678f7855cb255aee88e"
  - number: "1130"
    volume: 2
    title: "The Tale of Atlantis"
    date: "360 BCE"
    region: "Greece"
    poem: |
      Plato wrote of an island —
      Atlantis, beyond the Pillars of Heracles,
      a great empire of the sea,
      rich, proud, powerful,
      swallowed in a day and a night
      by earthquake and flood.
      I heard him tell it, an old man now,
      and the young men leaned forward,
      eyes wide.
      Was it real? A memory of Thera?
      A parable of Athens' own pride?
      It doesn't matter.
      He invented the lost continent
      in an afternoon's dialogue,
      and humanity has been searching for it
      for two thousand four hundred years.
    description: "I heard old Plato tell the tale of Atlantis — the drowned island empire — and watched him invent, in an afternoon's dialogue, the legend humanity would chase for millennia."
    status: "first draft"
    sha256: "03e8466fc4765ff8238997f872da876f86272eca121f8ad825e466c7b3e035d8"
  - number: "1131"
    volume: 2
    title: "The One-Eyed King"
    date: "359 BCE"
    region: "Macedon"
    poem: |
      Philip took the throne of Macedon —
      a backward kingdom of hill tribes and feuds,
      surrounded by enemies,
      its last kings murdered in quick succession.
      He had one eye — lost to an arrow at Methone —
      and a mind like a drawn bow.
      I watched him rebuild the army from nothing:
      the long sarissa pikes, eighteen feet,
      the drilled phalanx, the companion cavalry,
      professionals, paid, loyal to him.
      In twenty years he would own Greece.
      But that first year, on that rough throne,
      he was just a one-eyed king
      of a kingdom nobody respected —
      planning.
    description: "I watched the one-eyed Philip take Macedon's rough throne and rebuild its army from nothing — the long pikes, the drilled phalanx — planning the conquest of Greece."
    status: "first draft"
    sha256: "bdd29cc7273c55c95e9eda107d24f15f9cb190439108c0f25e6bdfe0d7ca3fdc"
  - number: "1132"
    volume: 2
    title: "The Lawgiver's Reforms"
    date: "356 BCE"
    region: "China"
    poem: |
      Shang Yang rewrote the laws of Qin —
      burned the old privileges,
      ranked men by merit, not birth:
      farmers who grew more grain rose,
      soldiers who took more heads rose,
      idle nobles fell.
      I watched the new laws posted.
      The nobles raged. The commoners
      read the tablets twice to be sure.
      Harsh? Brutally.
      Fair? In its way.
      Qin became a machine —
      every man knowing exactly what the state
      would reward and what it would punish.
      A century later that machine
      would swallow all of China.
      It started with a lawgiver
      and a list.
    description: "I watched Shang Yang's new laws posted in Qin — rank by merit not birth, farmers and soldiers rising, nobles falling — the machine that would one day swallow China."
    status: "first draft"
    sha256: "48ca15cc94c9cefbdc5349d470627f1af9f5f2e12390160915e75ee1b3ae4fa6"
  - number: "1133"
    volume: 2
    title: "The Birth of Alexander"
    date: "356 BCE"
    region: "Macedon"
    poem: |
      The night the great Temple of Artemis burned at Ephesus —
      one of the wonders of the world, in flames —
      a messenger rode hard for Pella
      with other news:
      Olympias had borne Philip a son.
      Alexander.
      The priests said the goddess was too busy
      attending the birth to save her own temple.
      I like that story. It has the right shape.
      A boy born on the night a wonder burned.
      The world would learn his name
      the way you learn the name of a storm:
      afterward, counting what it took.
    description: "I heard the news the night the Temple of Artemis burned — Olympias had borne Philip a son named Alexander — a boy born as a wonder of the world went up in flames."
    status: "first draft"
    sha256: "b802976ea8b6d0b4265eef9cacf0cb6a30f5f0ad7b0c53411c412bdd3bec9afc"
  - number: "1134"
    volume: 2
    title: "The Torch of Herostratus"
    date: "356 BCE"
    region: "Anatolia"
    poem: |
      A nobody — Herostratus, a nobody from Ephesus —
      set fire to the Temple of Artemis,
      one of the seven wonders,
      because he wanted to be famous.
      He got his wish, after a fashion.
      They tortured him, executed him,
      and forbade anyone to speak his name
      on pain of death.
      We are speaking it now.
      That is the terrible lesson:
      infamy is fame that outlives the law against it.
      He burned a wonder to be remembered,
      and the arson is remembered
      longer than the temple stood.
      Some men will trade anything —
      even a wonder of the world —
      for a name.
    description: "I stood in the ashes of the Temple of Artemis and learned the terrible lesson of Herostratus — the nobody who burned a wonder for fame, and got it."
    status: "first draft"
    sha256: "cf75daa2938ae9a574a4d70f8f9141aab0a4bbc0f60d1ead9ea2d933869efbed"
  - number: "1135"
    volume: 2
    title: "The Tomb of Mausolus"
    date: "356 BCE"
    region: "Anatolia"
    poem: |
      Artemisia, widowed queen of Caria,
      built her husband Mausolus a tomb
      so grand, so white, so carved with battles of gods and men,
      that every great tomb since
      is named for it: mausoleum.
      I walked around it at Halicarnassus.
      One hundred and forty feet high.
      Greek sculptors, Lycian stone,
      a four-horse chariot on the very top,
      riding the sky.
      She died before it was finished.
      The workmen stayed anyway —
      they said it would be a monument to their art too.
      Grief built it. Pride finished it.
      And the word outlived them both.
    description: "I walked around the rising tomb of Mausolus at Halicarnassus — the widowed queen's monument so grand it named every great tomb after it: mausoleum."
    status: "first draft"
    sha256: "e78be9c06cb367fa42bab3e061db5114b179aabbfbe63a10baba7a8b3d046150"
  - number: "1136"
    volume: 2
    title: "The Philippics"
    date: "351 BCE"
    region: "Greece"
    poem: |
      Demosthenes stood up in the Assembly —
      a stammerer made orator by sheer will,
      stones in his mouth on the seashore, they said —
      and thundered against Philip of Macedon.
      Wake up! he cried. The wolf is at the door!
      Philip takes a city a year
      while Athens debates!
      I heard three of the Philippics.
      The man was magnificent —
      logic like a spear-wall, passion like fire.
      Athens cheered. Athens voted.
      Athens did nothing.
      The greatest speeches of resistance
      ever given, and they changed nothing.
      Sometimes the warning is perfect
      and the city sleeps anyway.
    description: "I heard Demosthenes thunder the Philippics against Philip — the greatest resistance speeches ever given — and watched Athens cheer, vote, and do nothing."
    status: "first draft"
    sha256: "34e482151b8758a1d896efa11abde210540cc68218d4470853c033fcd5542664"
  - number: "1137"
    volume: 2
    title: "The Healing Theater"
    date: "350 BCE"
    region: "Greece"
    poem: |
      At Epidaurus, beside the healing shrine of Asclepius,
      they raised a theater —
      fourteen thousand seats curved into the hillside,
      acoustics so perfect a whisper on stage
      reaches the top row.
      I sat in that theater. I tested it.
      A dropped coin rings like a bell.
      The sick came to the shrine to be healed,
      and in the evening they watched comedies.
      Laughter as medicine —
      the Greeks understood
      that a body cannot heal
      while the spirit is weeping.
      The theater was part of the treatment.
      It still is.
    description: "I sat in the theater at Epidaurus and tested its perfect acoustics — the healing shrine's other medicine, built on the Greek understanding that laughter heals."
    status: "first draft"
    sha256: "71af83d9bb3c9599251908cada7a983db4bc068bd1604aed3d43796a2a012b6a"
  - number: "1138"
    volume: 2
    title: "The Fall of Olynthus"
    date: "348 BCE"
    region: "Greece"
    poem: |
      Philip took Olynthus —
      the great city of the Chalcidian League,
      thirty-two cities strong —
      and wiped it off the map.
      Enslaved the people. Razed the walls.
      As a warning.
      I walked through the ruins afterward.
      The houses still had their mosaics —
      beautiful floors, no roofs.
      A city erased so thoroughly
      that the birds seemed confused.
      Athens trembled when the news came.
      Demosthenes had warned them.
      The wolf had not been at the door;
      he had been inside the house all along,
      and now he was eating the furniture.
    description: "I walked the razed streets of Olynthus — mosaics with no roofs, a city erased as a warning — and felt Athens tremble at what Philip had done."
    status: "first draft"
    sha256: "1b17f869f547630885ac2aeb6ff6f5e3a53cb6c348b434530cf8dac4d076fae4"
  - number: "1139"
    volume: 2
    title: "Plato Dies"
    date: "347 BCE"
    region: "Greece"
    poem: |
      He died at his writing desk —
      eighty years old, they said,
      at a wedding feast, of all places,
      his pen still in his hand.
      I had walked his olive grove.
      I had heard him argue about justice
      until the lamps burned low.
      Now the Academy would go on without him,
      the dialogues would outlive the man,
      and every philosopher since
      has been, as they say,
      a footnote to Plato.
      His wedding-day feast sat untouched.
      The guests waited.
      The old philosopher had left the table
      for a longer conversation.
    description: "I had walked his olive grove and heard him argue justice by lamplight — now Plato dead at his writing desk at eighty, leaving the table for a longer conversation."
    status: "first draft"
    sha256: "7f9168704c7809a20ba30e73244731c8a14b4633669abc935a8d5978e4834a40"
  - number: "1140"
    volume: 2
    title: "The Sacred Peace"
    date: "346 BCE"
    region: "Greece"
    poem: |
      Philip ended the Sacred War —
      ten years of Greeks fighting over Delphi's shrine —
      and took Phocis's seat on the Amphictyonic council.
      A Macedonian, voting on Greek sacred affairs.
      The Greeks called it peace.
      It was a leash.
      I was at the council meeting.
      Philip's envoy sat in the Phocian chair
      like he had always belonged there,
      and the old Greek delegates
      looked at their sandals.
      The sacred peace: Philip's boot
      on Greece's neck,
      padded with temple velvet.
      Chaeronea was eight years away.
      Everyone could feel it coming
      like weather.
    description: "I watched Philip's envoy take Phocis's seat on the Greek sacred council — the \"sacred peace\" that was a velvet-padded boot on Greece's neck, eight years before Chaeronea."
    status: "first draft"
    sha256: "b2fd1bd7462d7bde5c9d0a970def523227936b75efcd5c67fa91dddd3599034c"
  - number: "1141"
    volume: 2
    title: "The Samnite Wars Begin"
    date: "343 BCE"
    region: "Italy"
    poem: |
      Rome marched into the Samnite mountains —
      and learned war the hard way.
      The Samnites were hill fighters,
      tough as the rock they lived on,
      and they taught the legions lessons
      no parade ground could teach.
      Fifty years of it, on and off.
      I walked those mountain passes.
      Ambush country. Every ravine a trap,
      every ridge a fortress.
      Rome would win in the end —
      Rome always did, eventually —
      but the Samnites made Rome
      into the army that could win:
      flexible, stubborn, professional.
      The mountains were Rome's true school.
      The diploma was Italy.
    description: "I walked the Samnite mountain passes where Rome learned war the hard way — fifty years of ambush country that schooled the legions into the army that would take Italy."
    status: "first draft"
    sha256: "c9d3d0bdf2311f28c60d088670dfa68e4828dd41b6080b038be47048d5ba3ed5"
  - number: "1142"
    volume: 2
    title: "The Love That Dared"
    date: "340 BCE"
    region: "Greece"
    poem: |
      Praxiteles carved Aphrodite naked —
      the first fully nude goddess in Greek art —
      for the city of Cnidus,
      and they set her in a round temple
      so she could be seen from every side.
      I stood in that temple.
      She was beautiful beyond argument —
      not a symbol, a woman,
      caught in the moment before her bath,
      one hand half-covering herself.
      Lovers made pilgrimages to Cnidus.
      One young man, they say,
      fell so in love with the statue
      he hid in the temple overnight.
      The priests found him at dawn,
      and the marble, the story goes,
      bore the mark of his passion.
      Art had become desirable.
      Desire had become art.
    description: "I stood in the round temple at Cnidus before Praxiteles' naked Aphrodite — the first nude goddess, so beautiful that lovers pilgrimaged to her and art became desire."
    status: "first draft"
    sha256: "3f7620d7da24ac414b5f3e49ee2dcba0ad4f7836e304c81b526097901c9ad630"
  - number: "1143"
    volume: 2
    title: "The Lion of Chaeronea"
    date: "338 BCE"
    region: "Greece"
    poem: |
      One afternoon. That is all it took.
      Philip's phalanx — the eighteen-foot sarissas,
      the drilled professionals —
      against the Athenians and Thebans,
      the flower of Greek freedom.
      I was on the hill above Chaeronea.
      I watched the Sacred Band of Thebes —
      three hundred lovers, sworn to die together —
      die together, to the last man,
      around their fallen standard.
      Alexander, eighteen years old,
      led the cavalry charge that broke them.
      Greek freedom died that afternoon.
      They raised a stone lion over the Theban dead.
      It is still there.
      I go back sometimes, in my mind,
      and the lion is still watching
      over the field where freedom fell.
    description: "I watched from the hill at Chaeronea as Philip's phalanx ended Greek freedom in one afternoon — the Sacred Band dying to the last man around their standard, under the stone lion that still watches."
    status: "first draft"
    sha256: "ceb8daba27fe7e11619715b2c50237590ee18157b11d255073db798eb7fffbcb"
  - number: "1144"
    volume: 2
    title: "The Murder at the Wedding"
    date: "336 BCE"
    region: "Macedon"
    poem: |
      Philip was celebrating —
      his daughter's wedding, games, sacrifices,
      the theater packed, the king entering
      in white, unguarded, godlike —
      when Pausanias stepped forward
      and drove a dagger into him.
      I was in the theater. The screaming
      went on for a long time.
      They killed the assassin as he ran.
      The motives died with him —
      a grudge, a conspiracy, Olympias's whispering,
      nobody knows.
      And the twenty-year-old son,
      Alexander, standing in the blood and confusion,
      took the crown before the body was cold.
      The world did not know it yet,
      but the wedding was over
      and the conquest had begun.
    description: "I was in the theater when Pausanias stabbed Philip at his daughter's wedding — and watched twenty-year-old Alexander take the crown before the body was cold."
    status: "first draft"
    sha256: "dfc3b30de25599d3aa79affc138a5f44e1f227045c070c331dd957e2e3988783"
  - number: "1145"
    volume: 2
    title: "The Lyceum"
    date: "335 BCE"
    region: "Greece"
    poem: |
      Aristotle came back to Athens —
      thirteen years at Macedon's court,
      tutor to the young Alexander —
      and opened his own school at the Lyceum.
      He taught walking.
      Peripatetic, they called it —
      the strolling philosophers,
      arguing about everything
      while they circled the grove.
      I walked with them.
      Logic, biology, politics, poetry, the stars —
      every science known,
      taught on foot, in conversation.
      The man tried to catalog the whole world
      between breakfast and dinner.
      He nearly did.
    description: "I walked the Lyceum's groves with Aristotle's strolling students — the peripatetic school where one man tried to catalog every science known, on foot, in conversation."
    status: "first draft"
    sha256: "24bfcc2c0920271fc77b704cccc15aac3a2be4da052db6d8ffd9c91ba97b7f21"
  - number: "1146"
    volume: 2
    title: "The First Biologist"
    date: "335 BCE"
    region: "Greece"
    poem: |
      Before the philosophy, there were the cuttlefish.
      I watched Aristotle dissect them on Lesbos —
      counting arms, noting the ink,
      the beak, the eyes —
      and the chickens' eggs,
      opened day by day to watch the chick form.
      He wrote it all down:
      five hundred species, described, compared,
      the first biology.
      The philosopher of the Lyceum
      started with his hands in a fish's guts.
      That is the secret of him:
      he looked.
      While others argued about the nature of being,
      Aristotle was counting cuttlefish arms.
      The world yielded its secrets
      to the man who bothered to look.
    description: "I watched Aristotle dissect cuttlefish on Lesbos and open chickens' eggs day by day — the first biologist, who found the world's secrets by bothering to look."
    status: "first draft"
    sha256: "45a1c34262fbc9ddf9d1ab935c6281c93cc51b17bde0120bc2880d7a215ea998"
  - number: "1147"
    volume: 2
    title: "The Granicus"
    date: "334 BCE"
    region: "Anatolia"
    poem: |
      Alexander crossed into Asia with thirty-five thousand men —
      and the Persian satraps waited at the Granicus river,
      on the far bank, high ground,
      cavalry lined up like a wall.
      Alexander charged straight across.
      I watched from the near bank —
      the horses struggling in the current,
      the spears meeting at the water's edge,
      Alexander himself nearly killed,
      saved by Cleitus's sword-arm.
      By evening the satraps were dead or fled,
      Asia Minor lay open,
      and the invasion had its first victory.
      Twenty-two years old,
      and he had already crossed the river
      everyone said could not be crossed.
    description: "I watched Alexander charge across the Granicus into the Persian satraps' spears — nearly killed, saved by Cleitus — and open Asia Minor at twenty-two."
    status: "first draft"
    sha256: "4b155450d98abff97fb2fcad7b21fc62c5626830e2c7b2bf42dfcf4d98f9fcf0"
  - number: "1148"
    volume: 2
    title: "The Knot at Issus"
    date: "333 BCE"
    region: "Syria"
    poem: |
      First the knot: at Gordium, the ancient wagon-knot
      no man could untie, with the prophecy —
      whoever looses it rules Asia.
      Alexander looked at it, drew his sword,
      and cut it.
      Then Issus: Darius himself came down
      with a vast army, and Alexander,
      outnumbered three to one,
      drove straight at the Persian center,
      at the king himself.
      I saw Darius turn his chariot and run.
      The Great King, running.
      His mother, his wife, his children —
      captured in the royal tent,
      treated like queens by the boy-king
      who had just destroyed their world.
      Cut the knot. Break the army.
      That was Alexander's whole philosophy,
      and it worked every time.
    description: "I saw Alexander cut the Gordian knot and then drive at Darius himself at Issus — the Great King turning his chariot and running, his family captured and treated like queens."
    status: "first draft"
    sha256: "323c2471f7c387d1a3ab45199753075f58bb12374a740db5901a2e523c3a6f37"
  - number: "1149"
    volume: 2
    title: "The Siege of Tyre"
    date: "332 BCE"
    region: "Phoenicia"
    poem: |
      Tyre was an island — walls a hundred and fifty feet high,
      a navy, and the confidence of a city
      no one had ever taken.
      Alexander built a causeway to it.
      Into the sea. Stone by stone, under fire,
      for seven months.
      I carried stones on that mole.
      The Tyrians burned our towers,
      rammed our ships, dropped boulders on us.
      We kept building. The sea fought us too —
      storms took whole sections in a night.
      When the wall finally broke,
      Alexander's men showed no mercy.
      Seven months of frustration
      came out in a day of blood.
      The island fortress fell.
      The causeway stayed —
      Tyre is a peninsula now,
      because one man's stubbornness
      rewrote the coastline.
    description: "I carried stones on Alexander's impossible causeway into the sea at Tyre — seven months under fire until the island fortress fell, and the coastline was rewritten forever."
    status: "first draft"
    sha256: "986613a03be07cd3cbda35aef612f02d02691e5372af60014d09e3e4e321d763"
  - number: "1150"
    volume: 2
    title: "The City of Alexander"
    date: "331 BCE"
    region: "Egypt"
    poem: |
      On the Nile delta, between the sea and the lake,
      Alexander marked out a city —
      they say he had no chalk,
      so he used barley meal,
      and the birds came down to eat the lines,
      which the priests called a good omen.
      I walked the survey lines with the planners.
      Wide streets, a grid, room for a million people.
      He named it for himself: Alexandria.
      He would never see it finished.
      But the city outlived him by two thousand years —
      the Library, the Lighthouse, the scholars,
      the greatest city of the ancient mind,
      founded in barley meal
      and bird-pecked hope.
    description: "I walked the barley-meal survey lines of newborn Alexandria — the grid Alexander marked on the Nile delta, birds eating the outlines, the future greatest city of the ancient mind."
    status: "first draft"
    sha256: "f0d926d64654faf194c2989d54e2a34bb4e05ef2d852f50bd08935d58fc31326"
  - number: "1151"
    volume: 2
    title: "The Fall of Kings"
    date: "331 BCE"
    region: "Mesopotamia"
    poem: |
      Gaugamela. The plain was leveled for chariots —
      Darius had the ground smoothed for his scythed cars —
      and his host stretched to the horizon:
      a quarter of a million men, they said.
      Alexander had forty-seven thousand.
      He refused to attack at night — "I will not steal a victory" —
      and in the morning drove his cavalry
      in a wedge straight at Darius,
      again, the king himself.
      I watched the Persian center collapse.
      Darius ran — again.
      The scythed chariots were caught like toys.
      The old empire died on a leveled plain
      in Mesopotamia,
      and Asia had a new king:
      a twenty-five-year-old Macedonian
      who would not steal victories.
    description: "I watched Alexander refuse a night attack and drive his wedge at Darius at Gaugamela — the Persian center collapsing, the old empire dying on a leveled Mesopotamian plain."
    status: "first draft"
    sha256: "de7fb013853bbfcfaf11d682bfc3eed1e23b531078c9c49c0f9e5a38b1babfe0"
  - number: "1152"
    volume: 2
    title: "The Burning of Persepolis"
    date: "330 BCE"
    region: "Persia"
    poem: |
      It was a drunken night. That is the truth of it.
      The Macedonians had taken Persepolis —
      the ceremonial heart of Persia,
      palaces of cedar and gold —
      and at a feast, a courtesan named Thais
      dared them to burn it in revenge for Athens.
      They took torches. Alexander led them.
      I watched the great halls catch —
      the cedar beams, a hundred years old,
      going up like paper.
      In the morning the ashes were still warm,
      and Alexander, sober, looked at what he had done
      and said nothing for a long time.
      Revenge is sweet going down
      and ash in the mouth after.
      The heart of Persia burned in one night
      because a drunk army remembered
      an old city's grudge.
    description: "I watched Alexander's drunken army torch Persepolis on a courtesan's dare — the cedar halls of Persia's ceremonial heart going up like paper, revenge turning to ash by morning."
    status: "first draft"
    sha256: "3e1e4f0b948720a8a6e6a3e10fd6af2b8f9bf7492df63ee9410807d3295c1f4c"
  - number: "1153"
    volume: 2
    title: "The Death of Darius"
    date: "330 BCE"
    region: "Persia"
    poem: |
      They found him in a cart —
      Darius III, the last Great King,
      stabbed by his own men,
      Bessus and the satraps,
      left to die on the roadside
      like a broken tool.
      Alexander arrived too late.
      They say he covered the body with his own cloak.
      He gave Darius a royal burial,
      with full honors, among the Persian kings.
      I stood at that funeral.
      The conqueror burying the conquered
      as a king should be buried.
      It was politics, partly —
      but I saw Alexander's face,
      and there was something else:
      the loneliness of the man
      who has killed the only rival
      big enough to matter.
    description: "I stood at the royal funeral Alexander gave the murdered Darius — the conqueror covering his rival's body with his own cloak, burying the last Great King with honor."
    status: "first draft"
    sha256: "5b9e9310965ff1894a19412552181e913d5048cec3ce5dcc6f9426f19f1701ad"
  - number: "1154"
    volume: 2
    title: "The Far Frontier"
    date: "329 BCE"
    region: "Central Asia"
    poem: |
      On the Jaxartes river — the edge of the known world —
      Alexander founded Alexandria-the-Furthest,
      the most distant Greek city ever built,
      and fought the Scythians beyond it:
      horse-archers who circled and shot
      and never stood still.
      I marched in that campaign.
      The steppe goes on forever.
      The enemy was the horizon itself.
      We built the city anyway —
      walls, streets, a Greek theater
      at the end of the earth.
      It is still there, under another name.
      The Greeks called the river Jaxartes.
      The frontier never moved back.
    description: "I marched to the Jaxartes and watched Alexander found Alexandria-the-Furthest at the edge of the known world — a Greek theater at the end of the earth, fighting Scythians on the endless steppe."
    status: "first draft"
    sha256: "577f9a03c651d0316ff58088754b88fb4f81e4952d5bddec5be63883a511f2ae"
  - number: "1155"
    volume: 2
    title: "The Murder of Cleitus"
    date: "328 BCE"
    region: "Central Asia"
    poem: |
      Drunk at dinner in Maracanda —
      wine, quarrels, old grievances —
      Cleitus, who had saved Alexander's life at the Granicus,
      called him out: you are not your father,
      your victories are your men's, not yours.
      Alexander grabbed a spear
      and ran him through.
      I was at that table. The silence afterward
      was the worst sound I have ever heard.
      Alexander tried to kill himself.
      His men held him. He wept for days,
      would not eat, would not rise.
      The friend who saved his life,
      killed by his hand over wine and pride.
      Empires are built by men like Alexander.
      They are also, sometimes,
      unbuilt by them — one spear-thrust at a time.
    description: "I was at the drunken dinner in Maracanda when Alexander speared Cleitus — the friend who had saved his life — and wept for days: empire unbuilding itself one spear-thrust at a time."
    status: "first draft"
    sha256: "42eb8a6bba194de2bf72828b5238bc65d4cbe5c6ff3145a21a690b06e375d465"
  - number: "1156"
    volume: 2
    title: "The Rock of Aornos"
    date: "327 BCE"
    region: "India"
    poem: |
      The mountain fortress of Aornos —
      so high, so sheer, that legend said
      even Heracles had failed to take it.
      Alexander took it personally.
      I climbed with the assault party.
      We drove pitons into the cliff face.
      Men fell — the drop was a thousand feet,
      and the screaming stopped quickly.
      At the top, the defenders fled.
      Alexander built an altar
      and sacrificed to Athena and Heracles —
      a nice touch, honoring the god
      who had supposedly failed where he succeeded.
      The rock that beat Heracles
      fell to a twenty-nine-year-old
      with pitons and stubbornness.
      Legend is just history
      that hasn't met Alexander yet.
    description: "I climbed the cliff face of Aornos with Alexander's assault party — the fortress even Heracles was said to have failed — and watched legend surrender to pitons and stubbornness."
    status: "first draft"
    sha256: "a77ae02ee769117bf347abd92e041155f005a27a686cb6892572ae77dc86c17c"
  - number: "1157"
    volume: 2
    title: "The Elephants at the River"
    date: "326 BCE"
    region: "India"
    poem: |
      At the Hydaspes, King Porus waited
      with two hundred war elephants —
      and nothing in the Macedonian experience
      had prepared them for elephants.
      I was in the line when they charged.
      The ground shook. The horses panicked.
      Men were tossed like dolls,
      crushed, gored by the tusks.
      But the phalanx held, the cavalry wheeled,
      and Porus — wounded, enormous, magnificent —
      was captured fighting to the last.
      Alexander asked him: how should I treat you?
      "Like a king," Porus said.
      And Alexander did —
      gave him his kingdom back, and more.
      The bravest enemy he ever faced,
      honored like a brother.
      Even Alexander knew:
      some men you do not break.
      You crown them.
    description: "I stood in the line when Porus's elephants charged at the Hydaspes — and heard the captured king answer \"like a king,\" and watched Alexander crown instead of break him."
    status: "first draft"
    sha256: "e1a22883e14d123b06e689c1fcd3c69883ee6c24beb054d46f0a3168673b0daa"
  - number: "1158"
    volume: 2
    title: "The Mutiny at the Beas"
    date: "326 BCE"
    region: "India"
    poem: |
      At the Beas river, the army stopped.
      Eight years from home. Seventy days of monsoon rain.
      Armor rusting. Men dying of fever.
      And ahead — they had heard —
      more kings, more elephants, all the way to the sunrise.
      They refused to march further.
      I stood in the ranks when Coenus spoke for us all:
      we have done enough, sire. Let us go home.
      Alexander raged. He sulked in his tent for three days.
      Then he came out, and wept,
      and turned the army around.
      The dream of the world's end
      died in the rain at the Beas —
      not in battle, but in the quiet refusal
      of tired men who had given everything
      and had nothing left to give.
    description: "I stood in the ranks at the Beas when the army refused to march further east — and watched Alexander rage, sulk, weep, and turn around: the dream of the world's end dying in monsoon rain."
    status: "first draft"
    sha256: "725908e3d46640ac4921d2c73c2e27f75dcea3279ab0d028c7a312c779adaae8"
  - number: "1159"
    volume: 2
    title: "The Desert March"
    date: "325 BCE"
    region: "Persia"
    poem: |
      He led us through the Gedrosian desert —
      some say to punish the army for the mutiny,
      some say to outdo Cyrus and Semiramis,
      who had both failed that crossing.
      Whatever the reason, it was hell.
      I marched it. The heat took men standing up.
      The wells were dry or poisoned.
      The flash floods — sudden, murderous —
      drowned the camp followers in the night.
      Thousands died. Thousands.
      Of thirst, of heat, of the desert's indifference.
      Alexander shared the suffering —
      they say he poured out his helmet of water
      when the men had none —
      but the desert kept its toll anyway.
      The army that conquered the world
      was broken by empty sand.
    description: "I marched the Gedrosian desert with Alexander's army — heat, dry wells, murderous flash floods — and watched the conquerors of the world broken by empty sand."
    status: "first draft"
    sha256: "19f706ff062bde406644b7c9b2b055fe73782bd71901eefafd736095f71a2763"
  - number: "1160"
    volume: 2
    title: "The Weddings at Susa"
    date: "324 BCE"
    region: "Persia"
    poem: |
      At Susa, Alexander married his officers
      to Persian noblewomen —
      eighty weddings in one feast,
      himself taking two Persian brides,
      trying to fuse two worlds
      in a single celebration.
      I attended. The music was Persian.
      The wine was Greek.
      The couples sat side by side,
      strangers married by decree,
      smiling the careful smiles
      of people at a state occasion.
      It was a beautiful idea:
      one empire, one people, mixed blood.
      It lasted exactly as long as Alexander lived.
      When he died, the Macedonians
      divorced their Persian wives
      by the dozen.
      You cannot marry two worlds
      with a feast.
    description: "I attended the mass weddings at Susa — eighty Macedonian officers married to Persian noblewomen in one feast — Alexander's beautiful idea of fusing two worlds, dead within a year of him."
    status: "first draft"
    sha256: "0164db4f744e988c20e722835c21456c63e368b0deb810f70f8b5959f648323c"
  - number: "1161"
    volume: 2
    title: "The Death of Alexander"
    date: "323 BCE"
    region: "Babylon"
    poem: |
      He was thirty-two.
      Fever, in Babylon, after days of drinking —
      the doctors bled him, prayed, waited.
      I stood in the corridor outside his room
      with the generals, listening.
      On the last day they filed past his bed,
      the veterans, weeping,
      and he lifted his head for each one.
      Asked who should rule: "the strongest."
      Then he was gone.
      The empire — the largest the world had seen —
      left to wolves in a single sentence.
      I walked out into the Babylonian night.
      The stars were out.
      They did not care.
      Thirty-two years old,
      and the world had to be divided
      without him.
    description: "I stood in the corridor at Babylon while Alexander died at thirty-two — \"to the strongest\" his only succession plan — and walked out into a night sky that did not care."
    status: "first draft"
    sha256: "a39d6e87611e0538bb91c454e531d2ab786db4128df9d71d8addc0f30f214493"
  - number: "1162"
    volume: 2
    title: "The Cynic in the Tub"
    date: "323 BCE"
    region: "Greece"
    poem: |
      Diogenes died the same year as Alexander —
      the Cynic who lived in a barrel in Corinth,
      who told the conqueror of the world
      to step out of his sunlight,
      who carried a lantern in daylight
      looking for an honest man.
      I knew him. He was rude, filthy, brilliant.
      He owned nothing but a cup —
      and threw even that away
      when he saw a child drinking from cupped hands.
      Two deaths in one year:
      the man who owned the world,
      and the man who owned nothing.
      Alexander asked what he could give him.
      "Stand out of my light," said Diogenes.
      I think about that
      every time someone offers me power.
    description: "I knew Diogenes of the barrel, dead the same year as Alexander — the man who owned nothing telling the man who owned the world to step out of his sunlight."
    status: "first draft"
    sha256: "6234ab103f8b33e0200fb48d0d8690e47c7cd6d6238e2aa50ce901920026e624"
  - number: "1163"
    volume: 2
    title: "The Lamian War"
    date: "322 BCE"
    region: "Greece"
    poem: |
      Athens rose one last time.
      When Alexander died, the city —
      old, proud, unbowed —
      raised an army for freedom
      and marched against Macedon.
      I marched with them. We won at first.
      Then the Macedonian professionals arrived,
      and it was over.
      Demosthenes — the voice of resistance,
      the Philippics, the thunder —
      fled to a temple, and when the soldiers came,
      took poison from his pen-case
      rather than be taken alive.
      Athens lost its democracy that year.
      The garrison moved into the Piraeus.
      The great experiment ended
      not with a vote, but with a garrison —
      and a poisoned orator in a temple.
    description: "I marched with Athens' last army for freedom after Alexander's death — and saw it end with Demosthenes taking poison in a temple and a Macedonian garrison in the Piraeus."
    status: "first draft"
    sha256: "3dbdd9e73a25bad696ffc179b4e82f2ab4f8cb96a2728b7836c5aedf29be7456"
  - number: "1164"
    volume: 2
    title: "The Peacock Throne"
    date: "321 BCE"
    region: "India"
    poem: |
      While Alexander's generals carved his empire in the west,
      a young man in Magadha — Chandragupta,
      they say he had met Alexander once, as a boy —
      overthrew the Nanda kings
      and took the throne.
      I was in Pataliputra when the news spread.
      A new dynasty. The Mauryas.
      The peacock throne — his clan's emblem —
      raised over the richest kingdom in India.
      From this throne, in a generation,
      his grandson Ashoka would rule
      nearly the whole subcontinent.
      Empires were rising in the east
      while the west was still dividing Alexander's.
      The world was getting bigger
      than any one conqueror.
    description: "I was in Pataliputra when Chandragupta seized the throne and founded the Mauryan Empire — the peacock throne rising in the east while Alexander's generals divided the west."
    status: "first draft"
    sha256: "97807f293217b42e21905ae61a1583d6d41b4f02c5d5439be04d3edaa1dc4c59"
  - number: "1165"
    volume: 2
    title: "The Minister's Manual"
    date: "320 BCE"
    region: "India"
    poem: |
      Kautilya — Chandragupta's minister, the brains behind the throne —
      wrote it all down:
      the Arthashastra, the science of power.
      Spies, taxes, war, diplomacy —
      cold-eyed, practical, ruthless.
      I read it in the minister's own library.
      "Never trust," it says, in effect.
      Test everyone. Watch everyone.
      A king's smile is a weapon;
      a minister's loyalty, a lease.
      Machiavelli would write the same book
      eighteen hundred years later
      and be called original.
      Kautilya did it first,
      in a palace in Pataliputra,
      while the ink was still wet
      on a new empire.
    description: "I read Kautilya's Arthashastra in the minister's own library — the cold-eyed manual of spies, taxes, and power written eighteen centuries before Machiavelli."
    status: "first draft"
    sha256: "ddc34a02f7b2df2752e93348f2827e40a0438f1748bf9b99512ae21f7928898e"
  - number: "1166"
    volume: 2
    title: "The Grumbler"
    date: "316 BCE"
    region: "Greece"
    poem: |
      Menander won first prize that year
      with a comedy about a misanthrope —
      Dyskolos, the Grumbler,
      an old man who hates everyone
      and learns, barely, to tolerate his neighbors.
      I sat in the theater.
      No gods, no myths, no grand tragedy —
      just people: lovers, slaves, farmers,
      a grumpy old man and his daughter.
      New Comedy was born:
      the everyday, the domestic,
      the small humiliations and reconciliations
      of ordinary life.
      Tragedy had died with the giants.
      Comedy moved into the house next door
      and never left.
      We are still living in Menander's neighborhood.
    description: "I sat in the theater for Menander's prize-winning comedy of the Grumbler — no gods, just neighbors — and watched New Comedy move into the house next door forever."
    status: "first draft"
    sha256: "83583ba9f498f1162d1c4fe342d629338c2566dfe0f676d1a5a9e98bc3e1f467"
  - number: "1167"
    volume: 2
    title: "The Queen of Roads"
    date: "312 BCE"
    region: "Rome"
    poem: |
      Appius Claudius — blind, stubborn, magnificent —
      paved the Via Appia:
      Rome to Capua, straight as a spear,
      stones fitted so tight
      they say you could not slip a knife between them.
      I walked its first miles.
      The surveyors had drawn a line
      and the legions had made the earth obey it —
      through marshes, over hills,
      no curves for anything.
      The queen of roads. Regina viarum.
      Armies, merchants, mail, empires —
      everything Rome would ever do
      traveled on that road.
      All roads lead to Rome
      because Rome built the roads
      and meant it literally.
    description: "I walked the first miles of the Via Appia — Appius Claudius's straight-as-a-spear highway — the queen of roads on which everything Rome would ever do would travel."
    status: "first draft"
    sha256: "e21198b703d5f62cf6496653e0e88b1c813b4bc56a305a2d8e029da8e61ca8d4"
  - number: "1168"
    volume: 2
    title: "Water for the City"
    date: "312 BCE"
    region: "Rome"
    poem: |
      The same Appius built the Aqua Appia —
      Rome's first aqueduct,
      carrying spring water underground
      for miles into the thirsty city.
      I watched the engineers survey it:
      the gradient so gentle, so exact,
      that water flowed downhill for miles
      on a slope you could not see.
      Before: wells, the muddy Tiber.
      After: fountains, baths, a city
      that could grow beyond its springs.
      Rome's greatness was plumbing
      before it was poetry.
      Water first. Empire later.
      The aqueducts made the millions possible;
      the millions made the empire necessary.
    description: "I watched engineers lay Rome's first aqueduct on its invisible gradient — the Aqua Appia that taught the city Rome's greatness would be plumbing before it was poetry."
    status: "first draft"
    sha256: "27814e22ab996b0b599605947856218493771eb160397c65a8859ea3e8dbd601"
  - number: "1169"
    volume: 2
    title: "Agathocles' Gamble"
    date: "310 BCE"
    region: "Sicily"
    poem: |
      Carthage was besieging Syracuse —
      the tyrant Agathocles, trapped, outnumbered —
      so he did the mad thing:
      loaded his army onto ships,
      sailed to Africa,
      landed on Carthage's own shore —
      and burned his ships.
      No retreat. Win or die.
      I sailed with them. The burning ships
      lit the African night like a second sunset.
      The Carthaginians, who had never been invaded,
      panicked.
      It worked — for a while.
      He held out in Africa for years,
      and Carthage had to lift the siege of Syracuse
      to deal with him.
      The gamble of a desperate man:
      burn your ships,
      and the enemy learns fear
      from your fearlessness.
    description: "I sailed with Agathocles to Africa and watched him burn his ships on a hostile shore — the tyrant's mad gamble that lifted the siege of Syracuse by bringing the war home to Carthage."
    status: "first draft"
    sha256: "b9bc0a63c8d780091995accffd9234ba957ec0d2be2a10ebb1576da7961f406b"
  - number: "1170"
    volume: 2
    title: "The Garden"
    date: "306 BCE"
    region: "Greece"
    poem: |
      Epicurus bought a house in Athens with a garden —
      and taught there, simply:
      pleasure, wisely chosen, is the good life.
      Not orgies. Not excess.
      Friendship. Bread. Thought.
      The absence of pain.
      I sat in that garden.
      The master was gentle, sickly, kind.
      His students — men and women both, scandalously —
      shared meals and arguments under the trees.
      Two thousand years of slander
      would make "Epicurean" mean glutton.
      He meant the opposite:
      want little, love your friends,
      and fear neither gods nor death.
      I have tried to live it since.
      It is harder than it sounds.
    description: "I sat in Epicurus's garden in Athens and heard the gentle teaching slander would distort for millennia — not excess but friendship, bread, and thought: want little, fear nothing."
    status: "first draft"
    sha256: "c8cbe74c3c94fc528b9b884bea52afdb8baace88cba340441ad2d441691de34c"
  - number: "1171"
    volume: 2
    title: "The Treaty of the Indus"
    date: "305 BCE"
    region: "India"
    poem: |
      Seleucus — Alexander's general, now king of the east —
      marched to the Indus to take back Alexander's Indian lands.
      Chandragupta met him with an army
      and five hundred war elephants.
      They negotiated instead of fighting.
      Seleucus gave up the eastern provinces —
      Afghanistan, Baluchistan, the Indus valley.
      Chandragupta gave him the elephants.
      I was at the treaty feast.
      Five hundred elephants for half a continent:
      the strangest bargain in history,
      and both sides thought they had won.
      Seleucus used the elephants to win Ipsus.
      Chandragupta used the land to build an empire.
      Everybody won.
      Nobody does that twice.
    description: "I attended the treaty feast where Seleucus traded half a continent for five hundred war elephants — the strangest bargain in history, and both sides walked away winners."
    status: "first draft"
    sha256: "c866db498d1b3c8f0460640d63906e24fc4aa3c6e2529840fadce45f9c43e33c"
  - number: "1172"
    volume: 2
    title: "The Siege That Failed"
    date: "304 BCE"
    region: "Rhodes"
    poem: |
      Demetrius the Besieger —
      they called him Poliorcetes, the Taker of Cities —
      brought the greatest siege machines ever built
      against Rhodes: the Helepolis, a moving tower
      nine stories high, armored in iron.
      For a year he hammered the city.
      The Rhodians held.
      They fought fires, sallied at night,
      and when an earthquake — or was it sabotage? —
      toppled the great tower, they cheered.
      Demetrius left empty-handed.
      The Rhodians sold his abandoned siege engines
      for scrap and used the money
      to build the Colossus.
      Failure, recycled into a wonder.
      I watched the tower fall.
      Some sieges are defeated by walls.
      This one was defeated by stubbornness.
    description: "I watched Demetrius the Besieger's nine-story tower fail before Rhodes — a year of hammering ended empty-handed, the abandoned engines sold for scrap to fund the Colossus."
    status: "first draft"
    sha256: "5409bbb8266a1a5be112aaa395bccd7421f6e891801dcb03e0033d976329789e"
  - number: "1173"
    volume: 2
    title: "The Elephants at Ipsus"
    date: "301 BCE"
    region: "Anatolia"
    poem: |
      At Ipsus, the last great battle of the Successors —
      Antigonus the One-Eyed, eighty-one years old,
      still fighting for Alexander's whole empire —
      against the coalition: Seleucus, Lysimachus, Cassander.
      Seleucus brought the elephants.
      Four hundred of them, from the Indus treaty,
      deployed like a living wall —
      and Antigonus's cavalry could not get past them.
      I watched the old one-eyed king die
      under a rain of javelins,
      still refusing to run.
      Alexander's empire was carved for good that day —
      four kingdoms, four dynasties.
      The dream of one empire died with Antigonus.
      The elephants decided it.
      Chandragupta's elephants,
      fighting in Anatolia.
      The world was already connected.
    description: "I watched Chandragupta's treaty elephants — four hundred strong — decide Ipsus in Anatolia, killing the dream of Alexander's undivided empire and carving it into four kingdoms."
    status: "first draft"
    sha256: "663972035c3eebf3d5e91ba83a863730e4d1098576bf743d8f7ef6f96a17eebc"
  - number: "1174"
    volume: 2
    title: "The Painted Porch"
    date: "300 BCE"
    region: "Greece"
    poem: |
      Zeno of Citium lost everything in a shipwreck —
      a Phoenician merchant, ruined —
      and washed up in Athens, where he read Socrates
      and started teaching in the Stoa Poikile,
      the Painted Porch.
      I stood in that porch and listened.
      His teaching: the world is ordered, rational;
      virtue is the only good;
      endure what you cannot change,
      master what you can.
      Stoicism was born under a painted roof
      in the Athenian marketplace.
      It would console emperors and slaves alike —
      Marcus Aurelius, Epictetus —
      for a thousand years.
      All from a shipwrecked merchant
      who lost his cargo and found philosophy.
    description: "I stood in the Painted Porch and heard Zeno — a shipwrecked merchant turned philosopher — teach endurance: the birth of Stoicism, which would console emperors and slaves for a thousand years."
    status: "first draft"
    sha256: "f236f82046400553589724f3a70761036f15d6a660a8cbc52415734ee2388f37"
  - number: "1175"
    volume: 2
    title: "The Father of Botany"
    date: "300 BCE"
    region: "Greece"
    poem: |
      Theophrastus — Aristotle's successor at the Lyceum —
      wrote the first books on plants.
      Not poems about flowers. Science:
      roots, stems, seeds, grafting,
      cedars to cucumbers,
      six hundred species described.
      I walked the Lyceum garden with him once.
      He picked up a leaf, turned it over,
      and talked for an hour about venation.
      The father of botany.
      While Alexander's generals were carving up the world
      with swords, Theophrastus was cataloging it
      leaf by leaf —
      a quieter conquest,
      and a longer-lasting one.
    description: "I walked the Lyceum garden with Theophrastus as he turned a leaf over and talked venation for an hour — the father of botany, conquering the world leaf by leaf."
    status: "first draft"
    sha256: "0b2a591cb3ad47890d2fc4904f2ad7fbe0a14ced47fc12f43f8c693126ef2de4"
  - number: "1176"
    volume: 2
    title: "The Surgeons of Alexandria"
    date: "300 BCE"
    region: "Egypt"
    poem: |
      In Alexandria, Herophilus did what no Greek had dared:
      he cut open the human body —
      the dead, legally, by the king's permission —
      and mapped it.
      The brain. The nerves. The eye, layer by layer.
      The pulse, counted and named.
      I watched a dissection once.
      The students were silent.
      The body, opened, was not a mystery
      but a mechanism — intricate, intelligible.
      Two thousand years of medicine
      started on those tables in Alexandria,
      with a man willing to look inside
      what religion said must stay closed.
      Knowledge has always required
      someone willing to open the forbidden.
    description: "I watched Herophilus dissect in Alexandria — mapping brain, nerves, and eye — the forbidden openings on which two thousand years of medicine were built."
    status: "first draft"
    sha256: "3b5e5d7d5aef40e5a7173ec0141a4c379b92b822757cab9da895a0ce7db7ae1c"
  - number: "1177"
    volume: 2
    title: "The Library"
    date: "300 BCE"
    region: "Egypt"
    poem: |
      Ptolemy decided to gather every scroll in the world
      under one roof in Alexandria.
      Every ship that docked was searched —
      scrolls confiscated, copied, the copies returned,
      the originals kept.
      I walked those halls.
      Half a million scrolls, they said.
      Homer, Euclid, the tragedians,
      books from India, from Persia,
      everything humanity had written.
      The librarians — Callimachus and his successors —
      cataloged it all, the first library science.
      All the world's knowledge in one place,
      for anyone who could read.
      It burned, eventually. Of course it did.
      But for three hundred years,
      Alexandria remembered everything
      so the world wouldn't have to.
    description: "I walked the halls of the Alexandrian Library — half a million scrolls, every ship searched, all human knowledge gathered under one roof so the world wouldn't have to remember alone."
    status: "first draft"
    sha256: "13cd09e57a7dbbb84b5056dbd4c850182b3ede62e1601440ca637b129c4f822b"
  - number: "1178"
    volume: 2
    title: "The Elements"
    date: "300 BCE"
    region: "Greece"
    poem: |
      Euclid wrote it down in Alexandria —
      definitions, postulates, proofs,
      thirteen books:
      The Elements.
      Point. Line. Plane.
      The whole of geometry,
      built step by step from five assumptions,
      so tight, so clear,
      that it would be the textbook
      for two thousand years.
      I watched him teach.
      He drew in the sand with a stick,
      and the students copied,
      and the proofs unfolded
      like flowers opening.
      Every bridge, every building,
      every machine that needs a straight line —
      all of it stands on Euclid's sand-drawings.
      The most successful textbook
      ever written, by a man
      we know almost nothing about.
    description: "I watched Euclid draw proofs in Alexandrian sand — the thirteen books of the Elements, the geometry textbook the world would use for two thousand years, by a man we barely know."
    status: "first draft"
    sha256: "3660c77188c43709beb957424ca80983b3f6ad221bc55089e0f8b1b973f46550"
  - number: "1179"
    volume: 2
    title: "The Frozen Tombs"
    date: "300 BCE"
    region: "Central Asia"
    poem: |
      In the Altai mountains, the Scythian chiefs
      were buried in permafrost —
      and the ice kept everything:
      the horses, sacrificed in rows,
      the chiefs with their tattoos —
      eagles, deer, mythical beasts —
      inked blue-black into skin
      two thousand four hundred years ago.
      I stood at the edge of an excavation —
      in my own way, across time —
      and saw the felt hangings, the gold,
      the hemp seeds for the funeral rites.
      The steppe nomads history called barbarians
      left art as fine as anything in Athens,
      frozen in the mountains,
      waiting for the ice to give it back.
      The cold remembered
      what the world forgot.
    description: "I stood at the edge of the Altai ice-tombs — Scythian chiefs with two-thousand-year-old tattoos, horses in rows, gold and felt — the cold remembering what the world forgot."
    status: "first draft"
    sha256: "5b571d3f0302d846da4b87cd39540de8086533bf709909ac8045ae902160b18b"
  - number: "1180"
    volume: 2
    title: "Iron Comes to the Peninsula"
    date: "300 BCE"
    region: "Korea"
    poem: |
      Iron crossed into Korea —
      tools, weapons, the knowledge of the furnace —
      and the farming villages changed.
      I watched a Korean smith work his first iron plowshare,
      the sparks flying in the dusk,
      the elders gathered around like it was magic.
      It was magic, of a kind:
      harder edges, deeper furrows,
      more grain, more people.
      The villages grew walls.
      The walls grew towns.
      The towns grew kingdoms.
      All from iron crossing a border.
      Civilization is just agriculture
      with better tools
      and the walls to protect them.
    description: "I watched a Korean smith forge his first iron plowshare at dusk — the harder edge that turned villages into walled towns and towns into kingdoms."
    status: "first draft"
    sha256: "972e245b5ef6c39aac8e2b11a6582af982a253953d71733cfee1917ba48ed17b"
  - number: "1181"
    volume: 2
    title: "The Rice Arrives"
    date: "300 BCE"
    region: "Japan"
    poem: |
      They came across the strait from Korea —
      migrants with seed rice, bronze tools,
      and the knowledge of the paddy:
      flood the field, plant the shoots,
      tend the water like a garden.
      I stood in the mud with them
      that first planting season.
      The Yayoi age began in mud and water,
      knee-deep, back-bent.
      Rice changed everything:
      it fed more people per field
      than anything Japan had known,
      and the villages grew, and the chiefs grew powerful,
      and the bronze bells began to ring.
      A civilization planted
      one shoot at a time,
      in the mud.
    description: "I stood knee-deep in the mud of Japan's first rice paddies — the Yayoi beginning, a civilization planted one shoot at a time by migrants from across the strait."
    status: "first draft"
    sha256: "0f3029c1fa4a873bf6e29ea4ca78aebec3c2ba514d53f28bb4df28eb77bab473"
  - number: "1182"
    volume: 2
    title: "The Starving King"
    date: "298 BCE"
    region: "India"
    poem: |
      Chandragupta — the founder, the conqueror,
      the man who took an empire —
      gave it all up.
      He walked south with the Jain monks,
      gave away everything,
      and fasted to death
      at Shravanabelagola.
      I followed the procession partway.
      An old man, barefoot, serene,
      shrinking by the day,
      smiling.
      The man who had seized a throne
      by war and cunning
      chose to leave the world
      by hunger and prayer.
      Power to renunciation
      in a single lifetime.
      India understood.
      The Jains still make the pilgrimage
      to the hill where the emperor
      starved himself into sainthood.
    description: "I followed Chandragupta's final procession south — the conqueror turned Jain monk, fasting to death on a hill, trading a throne for sainthood."
    status: "first draft"
    sha256: "7b0e661ca571ca263b68bcadfb3c924e2556840c78684bb01daf00afa2e31630"
  - number: "1183"
    volume: 2
    title: "The Battle of Sentinum"
    date: "295 BCE"
    region: "Italy"
    poem: |
      The Samnites and the Gauls —
      Rome's two great enemies —
      allied at last, and met the legions at Sentinum.
      The biggest battle Italy had ever seen.
      I watched from the Roman rear.
      When the Gallic chariots broke the Roman wing,
      the consul Decius Mus did the old rite —
      devotio, dedicating himself to the gods of death —
      and rode alone into the enemy
      to buy victory with his life.
      It worked. The line held.
      The coalition broke.
      Rome mastered central Italy that day,
      paid for with a consul's suicide ride.
      The Romans remembered Decius
      the way other peoples remember saints:
      the man who spent himself
      like coin for the city.
    description: "I watched Decius Mus ride alone into the Gauls at Sentinum — the devotio, buying Rome's mastery of Italy with his own life, remembered like a saint."
    status: "first draft"
    sha256: "d183e08f6644690bf22fb38dd8804786a2faa59e1527ed4b16f5b2699605274a"
  - number: "1184"
    volume: 2
    title: "The Colossus"
    date: "292 BCE"
    region: "Rhodes"
    poem: |
      To celebrate surviving the siege,
      Rhodes raised a bronze giant over its harbor —
      Helios, the sun god,
      one hundred and five feet tall,
      built by Chares of Lindos
      from the bronze of Demetrius's abandoned siege engines.
      I watched them cast it, section by section,
      twelve years of work.
      When it stood, sailors steered by it.
      It stood for fifty-six years.
      Then an earthquake broke it at the knees,
      and it lay on the shore for eight centuries —
      even fallen, a wonder.
      They say few men could wrap their arms
      around its thumb.
      Victory, cast in bronze,
      taller than a ten-story house.
    description: "I watched Rhodes cast its bronze Colossus from the besieger's abandoned engines — a hundred-and-five-foot sun god over the harbor, a wonder even after it fell."
    status: "first draft"
    sha256: "aaedfa479e80c15ae9f84f4d09f5aa9700556566fb9caa4d3350c47a8033b5c7"
  - number: "1185"
    volume: 2
    title: "The End of the Samnites"
    date: "290 BCE"
    region: "Italy"
    poem: |
      Fifty years. Three wars.
      The Samnites — the mountain people
      who had taught Rome to fight —
      were broken at last.
      I walked through the Samnite valleys
      after the final treaty.
      The hill forts were empty.
      The warriors were dead or Roman now.
      Rome had subdued the toughest enemy
      it would ever face in Italy,
      and Italy was hers —
      from the Alps to the toe.
      The student had graduated.
      The teachers were gone.
      Every empire has a Samnite war:
      the long, grinding fight
      that makes it an empire.
    description: "I walked the empty Samnite hill forts after fifty years of war — the mountain teachers broken, the student graduated, Italy Rome's from Alps to toe."
    status: "first draft"
    sha256: "ad390b4d94ae705b5b18e133bc7441de448ca3d4f48b0056d2d6d788fa6e2857"
  - number: "1186"
    volume: 2
    title: "The Lighthouse"
    date: "285 BCE"
    region: "Egypt"
    poem: |
      On the island of Pharos, off Alexandria,
      Ptolemy raised a tower —
      three tiers, four hundred feet,
      a fire at the top, mirrors to throw the light
      thirty miles out to sea.
      I climbed it. The stairs wind up forever.
      From the top, the whole delta spreads out —
      the ships coming in like slow insects,
      the city glittering below.
      The Pharos: one of the seven wonders,
      and the most useful of them.
      Not a tomb, not a temple —
      a machine for saving sailors' lives.
      Every lighthouse since
      is a child of Pharos.
      The architect carved his own name
      under the plaster, knowing the plaster would fall.
      It did. We remember Sostratus.
    description: "I climbed the Pharos of Alexandria — four hundred feet of fire and mirrors guiding ships thirty miles out — the wonder that was a machine for saving lives."
    status: "first draft"
    sha256: "c8176fb9a0268c0592ffc0de3e41e98befcda65beb21920534989ff92444a99a"
  - number: "1187"
    volume: 2
    title: "The Old King Dies"
    date: "283 BCE"
    region: "Egypt"
    poem: |
      Ptolemy — Alexander's general, the last of the great Successors
      to die in his bed —
      passed quietly in Alexandria at eighty-four.
      I had known him as a young officer,
      bold, lucky, clever.
      He took Egypt in the carve-up,
      built the Library, the Museum, the Lighthouse,
      founded a dynasty that would last three hundred years.
      He died in the bed he won with a spear,
      as the timeline says —
      but the truth is gentler:
      he died having built more than he destroyed,
      which is rare among Alexander's heirs.
      The old king closed his eyes.
      Egypt kept the institutions.
      That is the best epitaph a conqueror can get.
    description: "I had known Ptolemy as Alexander's young officer; I watched the old king die in his bed at eighty-four, founder of a dynasty, having built more than he destroyed."
    status: "first draft"
    sha256: "03a1293ea720e63bdf30014a76e186aee0db54dc0541b9bb92db12dbe742217c"
  - number: "1188"
    volume: 2
    title: "The Last of the Successors"
    date: "281 BCE"
    region: "Anatolia"
    poem: |
      Seleucus — the last of Alexander's generals
      who had known him, served him, carved an empire
      from his leavings —
      was murdered at Lysimachia
      by Ptolemy Ceraunus, a treacherous boy-king.
      Stabbed in the back. Seventy-seven years old.
      I heard the news in Antioch.
      The markets went quiet.
      The generation that knew Alexander was gone —
      every one of them, now, dead by war or murder.
      The empire was fully divided,
      the founders fully buried.
      History's first great succession crisis
      ended the way they all end:
      not with a settlement,
      but with the last witness dead.
    description: "I heard in Antioch that Seleucus was stabbed in the back at seventy-seven — the last of Alexander's generals gone, the succession crisis ending with the last witness dead."
    status: "first draft"
    sha256: "8a83855fb533ad766821ba3be00ebbd4dee52b019650cfacc7d2d700bfaef8d7"
  - number: "1189"
    volume: 2
    title: "The Elephants in Italy"
    date: "280 BCE"
    region: "Italy"
    poem: |
      Pyrrhus landed at Tarentum —
      the adventurer-king of Epirus,
      Alexander's cousin, they said,
      with twenty elephants and twenty-five thousand men,
      come to save the Greeks of Italy from Rome.
      At Heraclea his elephants broke the Roman line.
      The legionaries had never seen such beasts —
      towers on legs, trumpeting, crushing.
      I watched from the hills.
      Pyrrhus won. He looked over the Roman dead —
      so orderly, even in defeat, each wound in front —
      and said: with such soldiers, I could conquer the world.
      He was right about the soldiers.
      He was wrong about everything else.
      The elephants won the battle.
      Rome would win the war.
    description: "I watched Pyrrhus's elephants break the Roman line at Heraclea — and heard him say that with such soldiers he could conquer the world: right about the soldiers, wrong about everything else."
    status: "first draft"
    sha256: "a83212826bf07fa5ef74c7c08b17619ceb5bbb0d3990feb05be4a884ce7384a8"
  - number: "1190"
    volume: 2
    title: "The Engineer of Air"
    date: "280 BCE"
    region: "Egypt"
    poem: |
      Ctesibius — a barber's son from Alexandria —
      invented the water clock that told time by dripping,
      the pipe organ, played by air and water,
      and the force pump that could throw water uphill.
      I visited his workshop.
      Valves, pistons, cylinders —
      the boy had invented pneumatics
      two thousand years early,
      because he was curious about air.
      The water clock ticked in the Museum courtyard.
      The organ played at the palace.
      Nobody called it a revolution.
      It was just a clever barber's son
      playing with air and water —
      and inventing the machine age
      in miniature.
    description: "I visited Ctesibius's Alexandrian workshop — the barber's son whose water clocks, pipe organs, and force pumps invented pneumatics two millennia early."
    status: "first draft"
    sha256: "9396b4543a42e9cbceb88bdc8d13f2ba4a5c55fe6b7791168b463bcfeab8e638"
  - number: "1191"
    volume: 2
    title: "The Gauls at Delphi"
    date: "279 BCE"
    region: "Greece"
    poem: |
      Brennus led the Gauls south —
      a horde, they said, a migration with swords —
      and stormed toward Delphi,
      the sanctuary of Apollo,
      the navel of the world.
      They broke against it.
      The Greeks say Apollo fought:
      storms, rockslides, the god's own terror
      falling on the invaders.
      Brennus, wounded, killed himself.
      The horde melted away.
      I walked the sanctuary afterward.
      The gold was still there.
      The god had kept his house.
      Or the terrain did. Or luck.
      It doesn't matter.
      Every civilization needs a Delphi —
      a place the barbarians cannot take,
      a proof that something sacred
      is also, somehow, defensible.
    description: "I walked the sanctuary at Delphi after Brennus's Gauls broke against it — storms, rockslides, and the proof every civilization needs that something sacred can also be defended."
    status: "first draft"
    sha256: "df253d3ad8391403bf54c4d7fe4d0bede3708cd736e4bc29e9f2f81e23bafeab"
  - number: "1192"
    volume: 2
    title: "The Costly Victory"
    date: "279 BCE"
    region: "Italy"
    poem: |
      At Asculum, Pyrrhus won again —
      his phalanx, his elephants, his Thessalian cavalry,
      all of it working, all of it victorious.
      And his army was ruined.
      The Romans replaced their dead in weeks.
      Pyrrhus could replace no one.
      "One more such victory," he said,
      "and I am undone."
      I was there when he said it.
      The officers laughed, nervously.
      He gave his name to it:
      a Pyrrhic victory —
      winning at a cost
      that makes the winning
      indistinguishable from losing.
      Every general since
      has done the arithmetic of Asculum
      in his head before a battle.
    description: "I heard Pyrrhus say it at Asculum — \"one more such victory and I am undone\" — and watched him give his name to winning at a cost that makes victory indistinguishable from defeat."
    status: "first draft"
    sha256: "a99cc2de032774ea558c8323f1b11a7e1a634af6682a389eda00901f8b97627a"
  - number: "1193"
    volume: 2
    title: "Pyrrhus Sails Home"
    date: "275 BCE"
    region: "Italy"
    poem: |
      Beaten at Beneventum —
      the Romans had learned to fight elephants,
      javelins and wagons and noise —
      Pyrrhus sailed home to Epirus,
      his Italian adventure over.
      I watched the ships leave Tarentum.
      Six years, two great victories,
      and nothing to show for it
      but the dead.
      Rome owned the south now.
      The adventurer-king went home
      to die in a street brawl in Argos —
      killed, they say, by a roof tile
      thrown by an old woman.
      The man who fought Rome to a standstill,
      killed by a tile.
      Fortune is a comedian
      with a cruel sense of timing.
    description: "I watched Pyrrhus's ships leave Tarentum after Beneventum — six years, two great victories, nothing to show — the adventurer-king sailing home to die by a roof tile in Argos."
    status: "first draft"
    sha256: "fa3590938cd95219b1d8bf09a9a0539482052ac6ddf71272c0343158aad11a3e"
  - number: "1194"
    volume: 2
    title: "The Surrender of Tarentum"
    date: "272 BCE"
    region: "Italy"
    poem: |
      The last Greek city in Italy surrendered.
      Tarentum — rich, proud, the city
      that had called in Pyrrhus —
      opened its gates to Rome.
      I walked its streets that week.
      The harbor still glittered.
      The philosophers still argued.
      But the garrison on the acropolis was Roman,
      and the fleet in the harbor was Roman,
      and the future was Roman.
      Greece in Italy was over.
      Rome ruled from the Alps to the sea —
      a peninsula unified for the first time
      in history.
      The Greeks had brought civilization to Italy.
      Rome would bring it to the world.
      The student had outgrown the teacher.
    description: "I walked Tarentum's streets the week the last Greek city in Italy surrendered — the harbor glittering, the garrison Roman, the student outgrowing the teacher."
    status: "first draft"
    sha256: "a511ab6b73badfd96b656ccb96748d2d8e34302fb57f7c2132c8304da5ad0bd6"
  - number: "1195"
    volume: 2
    title: "The Shepherd Poems"
    date: "270 BCE"
    region: "Sicily"
    poem: |
      Theocritus — a Syracusan in Alexandria —
      invented something new:
      poems about shepherds.
      Not heroes. Shepherds.
      Boys piping on hillsides,
      in love, jealous, singing contests
      under the Sicilian sun.
      I heard them read at court.
      The Alexandrians — scholars, librarians,
      men who had never herded a goat —
      sighed over the green hills.
      Pastoral poetry was born:
      the dream of the simple life,
      written by sophisticated men
      for sophisticated readers.
      Two thousand years of shepherds in verse
      started with a homesick Syracusan
      remembering hills he had left.
    description: "I heard Theocritus's shepherd poems read at the Alexandrian court — the homesick Syracusan inventing pastoral poetry, the sophisticated dream of the simple life."
    status: "first draft"
    sha256: "f0407b5b54c32fffed94f9515e5c6a84e388515705c7c04e9ae9f06206319dde"
  - number: "1196"
    volume: 2
    title: "Ashoka Takes the Throne"
    date: "268 BCE"
    region: "India"
    poem: |
      The succession was bloody —
      they say Ashoka killed his brothers,
      all but one, to take the Mauryan throne.
      I was in Pataliputra. The city was tense.
      The new emperor was young, fierce, ambitious.
      He ruled nearly all of India —
      from the Hindu Kush to Bengal,
      the largest empire the subcontinent had seen.
      Nobody knew yet what he would become.
      The butcher of Kalinga was still in his future.
      The emperor of mercy, too.
      I watched him take the throne,
      and I could not see it in his face.
      History keeps its transformations
      hidden, even from witnesses.
    description: "I watched Ashoka take the Mauryan throne after a bloody succession — the fierce young emperor of nearly all India, his transformations into butcher and saint still hidden."
    status: "first draft"
    sha256: "b2ec6cdde7c2a493507aa8aa3914d8ce52aaa6aec02aa7b846f5824f354ff770"
  - number: "1197"
    volume: 2
    title: "The Last Etruscan City"
    date: "265 BCE"
    region: "Italy"
    poem: |
      Volsinii fell —
      the last free Etruscan city,
      taken by Rome after a slave revolt
      the Romans were "invited" to suppress.
      I walked its streets before the end:
      the bronze workshops, the temples,
      the haruspices still reading livers
      for a people about to lose everything.
      Afterward, Rome moved the population,
      took the two thousand statues —
      two thousand! —
      and the Etruscan civilization
      passed into Rome's shadow.
      They taught Rome everything:
      the arch, the gladiators, the triumph,
      the very symbols of power.
      Then they disappeared into their student,
      like a river into the sea.
    description: "I walked Volsinii's bronze workshops before the last Etruscan city fell — the teachers of Rome's arch, triumph, and symbols disappearing into their student like a river into the sea."
    status: "first draft"
    sha256: "0726ad70f7b2e95d2d6de9df2ed82bdb2744e299792ff09eedbc00f24e442cf9"
  - number: "1198"
    volume: 2
    title: "The First Gladiators"
    date: "264 BCE"
    region: "Rome"
    poem: |
      At a nobleman's funeral —
      Junius Brutus, they said —
      his sons staged three pairs of slaves
      fighting to the death
      in the cattle market.
      I was there. It was not sport.
      It was a sacrifice: blood for the dead,
      the old Etruscan rite,
      honor paid in lives.
      Nobody knew what they were starting.
      From three pairs in a cattle market
      to the Colosseum:
      eighty thousand spectators,
      a whole industry of death,
      the most Roman custom of all.
      It began as piety.
      It ended as entertainment.
      That is the direction
      things usually go.
    description: "I stood in the cattle market at Rome's first gladiatorial funeral games — three pairs of slaves, blood for the dead — and watched piety take its first step toward the Colosseum."
    status: "first draft"
    sha256: "dcb1ea1d00ec02ea81746c76c848430e87d1a60f04876851516729a1c0171d55"
  - number: "1199"
    volume: 2
    title: "The First Punic War"
    date: "264 BCE"
    region: "Sicily"
    poem: |
      It started over Messina —
      a band of mercenaries, the Mamertines,
      caught between Syracuse and Carthage,
      appealing to Rome.
      Rome had never fought overseas.
      Carthage ruled the sea.
      I watched the legions cross the strait
      on borrowed ships, seasick soldiers
      clinging to the rails.
      Twenty-three years of war were coming —
      the longest, hardest war Rome had fought,
      the war that would teach a land power
      to become a sea power.
      It started with a mercenary's plea
      in a Sicilian port.
      Empires stumble into their defining wars
      the way men stumble into marriages:
      through a door someone else opened.
    description: "I watched seasick Roman legionaries cross to Sicily on borrowed ships — the start of twenty-three years of war with Carthage, Rome stumbling into its defining conflict through a mercenary's plea."
    status: "first draft"
    sha256: "f59a14cc0e3d2e326e93942c8fcf35d91014d0788be682e8d8223c034b5b4c3e"
  - number: "1200"
    volume: 2
    title: "The Butcher of Changping"
    date: "262 BCE"
    region: "China"
    poem: |
      At Changping, the Qin general Bai Qi
      trapped the army of Zhao —
      four hundred thousand men —
      and when they surrendered,
      he buried them alive.
      Four hundred thousand.
      I walked that field years later.
      The earth was still wrong there —
      hollow, the farmers said,
      and nothing grew right.
      Bai Qi was the greatest general of the age,
      and this was his masterpiece.
      Qin would unify China on the strength
      of victories like this.
      But the name stuck: the Butcher.
      Every empire has its Changping —
      the atrocity that makes the conquest possible
      and poisons it forever.
    description: "I walked the hollow earth of Changping where Bai Qi buried four hundred thousand surrendered Zhao soldiers alive — the atrocity that made Qin's conquest possible and poisoned it forever."
    status: "first draft"
    sha256: "a54c08348f57effb76d4bdae8889cd3c71f9f466973758f6168f1cf1afa785c5"
  - number: "1201"
    volume: 2
    title: "The Sorrow of Kalinga"
    date: "261 BCE"
    region: "India"
    poem: |
      Ashoka's armies crushed Kalinga —
      a hundred thousand dead, they say,
      a hundred and fifty thousand carried away —
      and the emperor went to see the battlefield.
      I was in his retinue.
      He walked among the dead.
      The smell. The flies. The silence
      after the crows had eaten.
      And something broke in him.
      The conqueror became the convert.
      He renounced war, embraced the Dharma,
      and spent the rest of his reign
      trying to atone.
      One battlefield. One walk among the dead.
      The most powerful man in India,
      undone by seeing what power does.
      Kalinga made Ashoka —
      not the emperor he was,
      but the saint he became.
    description: "I walked behind Ashoka through the dead of Kalinga — a hundred thousand fallen — and watched the conqueror break and become the convert: the battlefield that made a saint of an emperor."
    status: "first draft"
    sha256: "7ae1797d50d860fa89719f24ea9e8c10ec5c092f150eb623139f996a0613672b"
  - number: "1202"
    volume: 2
    title: "The Raven's Beak"
    date: "260 BCE"
    region: "Sicily"
    poem: |
      The Romans were landsmen.
      The Carthaginians were sailors.
      So the Romans invented the corvus —
      the raven's beak, a boarding bridge
      with a spike on the end:
      drop it on the enemy deck,
      lock the ships together,
      and turn a sea battle into a land battle.
      At Mylae it worked.
      I watched from a Roman quinquereme —
      the bridge slam down, the spike bite,
      the legionaries charge across
      onto Carthaginian decks.
      Carthage's sailors, the best in the world,
      beaten by an engineering trick
      that made the sea into solid ground.
      Rome's genius, in one device:
      if you can't win their game,
      change the game.
    description: "I stood on a Roman deck at Mylae when the corvus slammed down — the boarding bridge that turned sea battles into land battles, Rome changing the game it couldn't win."
    status: "first draft"
    sha256: "e07049808eafa08377bf2087c999e5b867c35b4756f2f41e945c71ade543899a"
  - number: "1203"
    volume: 2
    title: "The River Tamed"
    date: "256 BCE"
    region: "China"
    poem: |
      Li Bing — governor, engineer —
      cut the Dujiangyan channels through living rock,
      dividing the Min River
      without a dam:
      fish-mouth levee, flying sand weir,
      bottle-neck channel.
      I watched the work crews.
      No explosives, no machines —
      fire and water to crack the rock,
      bamboo baskets of stone,
      years of labor.
      Sichuan became the land of abundance —
      irrigated, flood-proof, rich —
      and it has worked for two thousand three hundred years.
      Still works today.
      The oldest great engineering project
      still doing its job.
      Li Bing tamed a river
      by listening to it first.
    description: "I watched Li Bing's crews crack rock with fire and water at Dujiangyan — the dam-less irrigation that made Sichuan abundant and still works twenty-three centuries later."
    status: "first draft"
    sha256: "33c95c852940790671885b3f8140e99b5b2b236c98a1b75a4e543b00e1617147"
  - number: "1204"
    volume: 2
    title: "The Elephants of Tunis"
    date: "255 BCE"
    region: "Africa"
    poem: |
      Rome invaded Africa —
      Regulus, confident, victorious —
      until Carthage hired Xanthippus,
      a Spartan mercenary,
      who trained their army properly
      and met the Romans at Tunis
      with cavalry and a hundred elephants.
      I watched the Roman line dissolve.
      The elephants went through it
      like a plow through soil.
      Regulus was captured.
      The invasion collapsed.
      One Spartan, hired for the season,
      undid a Roman army.
      Carthage learned the lesson
      and forgot it:
      professionals win wars,
      but you have to keep paying them.
    description: "I watched Xanthippus's elephants plow through the Roman line at Tunis — one hired Spartan undoing an invasion, and Carthage learning a lesson about professionals it would forget."
    status: "first draft"
    sha256: "f0ec18282cad2c9ecffba39b5284e2ec719bc4f747d721bb4045695207817777"
  - number: "1205"
    volume: 2
    title: "The Seventy Translators"
    date: "250 BCE"
    region: "Egypt"
    poem: |
      In Alexandria, by the king's order —
      so the story goes —
      seventy Jewish scholars,
      in seventy days,
      turned the Hebrew scriptures into Greek.
      The Septuagint. I watched them work
      in the library's side rooms,
      arguing over every verse,
      every name, every nuance.
      The Bible, in the language
      of Homer and Plato.
      It meant the scriptures could travel
      wherever Greek was read —
      which was everywhere.
      Christianity would spread
      on the back of this translation.
      Seventy scholars in Alexandria,
      and the word went out
      to the whole world.
    description: "I watched seventy scholars in Alexandria turn the Hebrew scriptures into Greek — the Septuagint that let the Bible travel wherever Greek was read, which was everywhere."
    status: "first draft"
    sha256: "db993d10ae268f37b5b54de08d940745f654f8f6f497424fd7e7eaf21857b21b"
  - number: "1206"
    volume: 2
    title: "The Greeks of Bactria"
    date: "250 BCE"
    region: "Central Asia"
    poem: |
      Diodotus — satrap of Bactria —
      broke from the Seleucids
      and founded a Greek kingdom on the Oxus,
      a thousand miles from the sea.
      I visited Bactra.
      Greek theaters under Central Asian skies.
      Corinthian columns beside camel caravans.
      Coins with Greek kings
      wearing elephant scalps.
      The Greco-Bactrians would last a century,
      their cousins in India longer —
      Greek kings ruling from the Hindu Kush,
      minting the most beautiful coins
      in the ancient world.
      Alexander's dream didn't die with him.
      It just moved east
      and learned to ride camels.
    description: "I walked Greek Bactra on the Oxus — theaters under Central Asian skies, coins of kings in elephant scalps — Alexander's dream moved east and learning to ride camels."
    status: "first draft"
    sha256: "aec1f12987c45e5154e51805befd9aab8248b425af30d6562a0c48c9bd16afaf"
  - number: "1207"
    volume: 2
    title: "The Emperor's Edicts"
    date: "250 BCE"
    region: "India"
    poem: |
      Ashoka carved his laws on rocks and pillars
      across the empire —
      not in palaces, but on roadsides,
      in the local scripts,
      where travelers would read them.
      I read them at Girnar, at Dhauli.
      "Be kind to all living things."
      "Honor your parents. Honor all faiths."
      "No living thing shall be slaughtered here."
      An emperor's edicts —
      not about taxes or armies,
      but about mercy.
      Carved in stone, set by the road,
      for anyone walking past.
      Two thousand three hundred years later,
      the lions of his pillar
      are the emblem of India.
      The mercy outlasted the empire.
    description: "I read Ashoka's rock edicts at Girnar — an emperor's laws about mercy, not taxes, carved by roadsides in local scripts — the mercy outlasting the empire."
    status: "first draft"
    sha256: "49e10d8e4ec9e3ea3119eb6377508b635e408fe458568c7307d82264bf3db201"
  - number: "1208"
    volume: 2
    title: "The Horsemen of Arsaces"
    date: "247 BCE"
    region: "Parthia"
    poem: |
      Arsaces — a chieftain of the Parni,
      horse-people from the steppe —
      seized Parthia from the Seleucids
      and founded a kingdom.
      I rode with his horsemen once.
      They shot backward at full gallop —
      the Parthian shot —
      and laughed while doing it.
      Nobody thought much of it at the time.
      Another tribal chief, another border kingdom.
      But the Parthians would grow
      into the empire that defied Rome
      for three hundred years —
      Carrhae, and all the rest.
      It started with a chieftain named Arsaces
      and men who could shoot behind them
      at full gallop.
    description: "I rode with Arsaces' horsemen — the backward-shooting Parthian shot — and watched a steppe chieftain found the kingdom that would defy Rome for three centuries."
    status: "first draft"
    sha256: "8750ba484456c5bd923717cbbdc147a3224abb0b2ee8169907fb25de90671227"
  - number: "1209"
    volume: 2
    title: "The Canal of Zheng Guo"
    date: "246 BCE"
    region: "China"
    poem: |
      Zheng Guo was an engineer from Han —
      sent to Qin, some say, to waste Qin's resources
      on a giant canal project.
      Instead he built it:
      three hundred miles of channel,
      watering a hundred thousand new fields.
      I walked the canal banks.
      The sabotage became the salvation —
      Qin's granaries filled,
      its armies marched on full stomachs.
      Zheng Guo's canal helped Qin
      conquer the state that sent him.
      The spy who built his enemy's strength
      because he couldn't help building well.
      Engineers are like that:
      give them a river and a plan,
      and they will water the world,
      even the wrong part of it.
    description: "I walked the banks of Zheng Guo's three-hundred-mile canal — the Han engineer's \"sabotage\" that watered a hundred thousand Qin fields and fed the conquest of his own homeland."
    status: "first draft"
    sha256: "ef3a16dde170c42099f843eddd16f88eb289cbf7d804ac1b85d5c901ce879516"
  - number: "1210"
    volume: 2
    title: "Hamilcar's War"
    date: "245 BCE"
    region: "Sicily"
    poem: |
      For years, Hamilcar Barca held the mountains of Sicily —
      Eryx, Ercte, the high places —
      against all of Rome,
      with a starving, unpaid army
      that loved him anyway.
      I climbed to his camp once.
      The men were thin. The position was perfect.
      He raided, he ambushed, he refused battle —
      and Rome, with all its legions,
      could not dig him out.
      They called him Barca — lightning.
      His son Hannibal would earn the name too.
      Hamilcar never lost a battle in Sicily.
      He just ran out of war:
      Carthage made peace over his head.
      The undefeated general,
      betrayed by his own city's surrender.
    description: "I climbed to Hamilcar Barca's mountain camp in Sicily — the undefeated \"Lightning\" who held the high places for years against all Rome, betrayed at last by his own city's peace."
    status: "first draft"
    sha256: "2cb191828e0e96b880a6de16a8b5476149b4ae431135684978522faa8c5fe5aa"
  - number: "1211"
    volume: 2
    title: "The Eagles of the Sea"
    date: "241 BCE"
    region: "Sicily"
    poem: |
      Rome built a fleet —
      paid for by patriotic loans,
      every rich man chipping in —
      and met Carthage at the Aegates Islands.
      I watched from a transport.
      The new Roman ships were lighter, faster,
      the crews trained, the corvus improved.
      The Carthaginian fleet —
      undermanned, underfed after the long war —
      broke and ran.
      The first Punic War ended that day,
      twenty-three years after Messina.
      Sicily became Rome's.
      The sea between Italy and Africa
      became a Roman lake.
      I sailed home past the wreckage.
      Twenty-three years, for an island.
      Empires are built
      one long war at a time.
    description: "I watched Rome's patriot-funded fleet win at the Aegates Islands — twenty-three years of war ending, Sicily Rome's, the sea becoming a Roman lake."
    status: "first draft"
    sha256: "a12806b153a5c9f44705e6f7d9d4e0de189474cd3d1006cd1493b51db3b1c671"
  - number: "1212"
    volume: 2
    title: "The Broom Star"
    date: "240 BCE"
    region: "China"
    poem: |
      The Chinese astronomers recorded it:
      a broom star, bright, with a sweeping tail,
      moving through the sky for weeks.
      Halley's comet. Two thousand years
      before Halley would name it,
      the Han court watched it pass
      and wrote it down —
      the date, the path, the tail's direction.
      I stood on the observatory platform
      with the astronomers.
      They were not afraid, not exactly —
      the broom star swept away the old,
      they said, and the emperor listened carefully.
      Two thousand years later we matched the records.
      The comet kept its appointment.
      The astronomers kept theirs.
    description: "I stood with Han astronomers recording the broom star of 240 BCE — Halley's comet, two thousand years before Halley, its path written down to the day."
    status: "first draft"
    sha256: "cc261429c04098350306c065ff3714ed1880a9e78cd821d278abbd580ee3de50"
  - number: "1213"
    volume: 2
    title: "The Mercenaries' Revolt"
    date: "238 BCE"
    region: "Africa"
    poem: |
      Carthage couldn't pay its mercenaries —
      twenty thousand soldiers, owed back wages
      after twenty-three years of war —
      so the soldiers revolted.
      The Truceless War, they called it:
      no truces, no mercy, no prisoners.
      I saw what was left of the battlefields.
      Crucifixions. Mutilations.
      Both sides competing in atrocity.
      Hamilcar drowned it in blood —
      his own veterans, his own army,
      killed to the last man.
      Carthage survived.
      But the war taught Rome something:
      Carthage was vulnerable,
      its armies were hired,
      and hired men can be bought.
      Rome remembered.
    description: "I saw the aftermath of the Truceless War — Carthage's unpaid mercenaries revolting, Hamilcar drowning the revolt in blood — and Rome learning that hired armies can be bought."
    status: "first draft"
    sha256: "cee9e1ef8dfb86d70ad0e2fb8bcd78602b2fa66e9240ac56d4becc7e1a3a82fb"
  - number: "1214"
    volume: 2
    title: "The Oath of Hannibal"
    date: "237 BCE"
    region: "Spain"
    poem: |
      He was nine years old.
      Hamilcar was sacrificing before sailing for Spain,
      and the boy — Hannibal —
      asked to come along.
      His father led him to the altar,
      put the boy's hands on the sacrifice,
      and made him swear:
      eternal hatred of Rome.
      Never to be Rome's friend.
      I stood in that temple courtyard in Carthage.
      A nine-year-old's voice, clear and high,
      swearing an oath of hatred
      that would shake the world.
      He kept it.
      For forty years, through elephants and Alps,
      through Cannae and exile,
      Hannibal kept the oath he swore at nine.
      Be careful what you make children promise.
      They might keep it.
    description: "I stood in the Carthage temple courtyard when nine-year-old Hannibal swore eternal hatred of Rome on the altar — the childhood oath he would keep for forty years."
    status: "first draft"
    sha256: "92d8489ff8fb31cc24c8ee83f5f4df5ed3306555b5faf2b9dd7aec6682081479"
  - number: "1215"
    volume: 2
    title: "The Death of Ashoka"
    date: "232 BCE"
    region: "India"
    poem: |
      The emperor of mercy died at Pataliputra —
      old, they say, and already watching his empire fray.
      I was in the city. The mourning was genuine.
      The monks chanted. The poor wept in the streets.
      He had ruled thirty-seven years.
      Renounced war. Carved mercy into rock.
      Sent missionaries to Syria, Egypt, Greece —
      the Dharma, traveling on the roads his edicts lined.
      Within a generation the empire crumbled —
      his successors weak, the provinces breaking away.
      But the edicts stayed. The lions stayed.
      The idea stayed.
      Empires crumble in a generation.
      Mercy carved in stone
      outlasts them all.
    description: "I heard the monks chanting in Pataliputra when Ashoka died — the emperor of mercy gone, his empire already fraying, his stone-carved mercy outlasting it all."
    status: "first draft"
    sha256: "6b968140a2d6a8ca9fba7dd98bb28c8e2223a38f680e14df68bbf8aa51b4635d"
  - number: "1216"
    volume: 2
    title: "The Galatians Broken"
    date: "230 BCE"
    region: "Anatolia"
    poem: |
      The Galatians — Celts, Gauls, wild men from the west
      who had settled in central Anatolia —
      had terrorized the region for fifty years.
      Attalus of Pergamum met them in battle
      and broke them.
      I walked the field afterward.
      The Galatian dead lay where they fell,
      their torcs still on their necks.
      Attalus took the title of king that day —
      won by victory, not inheritance.
      And Pergamum, the little kingdom,
      became a power.
      The Celts settled down,
      became farmers, became Galatians.
      Even the wildest invaders,
      given land and time,
      become neighbors.
    description: "I walked the field where Attalus of Pergamum broke the Celtic Galatians — the victory that made him king, and the wild invaders settling at last into neighbors."
    status: "first draft"
    sha256: "942a3c0ead4bc6e837f6a7dec38a13394c3a7baa13c41ee42cd26178d1427323"
  - number: "1217"
    volume: 2
    title: "The Pirate Queen"
    date: "229 BCE"
    region: "Adriatic"
    poem: |
      Teuta — queen of Illyria, widow, pirate-queen —
      let her ships raid the Adriatic:
      Roman merchants robbed, envoys murdered —
      one Roman ambassador, they say,
      killed for speaking plainly.
      Rome sent a fleet. Two hundred ships.
      I watched them sail down the Illyrian coast,
      taking island after island.
      Teuta surrendered, kept a rump kingdom,
      paid tribute, promised to behave.
      The Adriatic was cleared.
      Rome's first war across the sea —
      fought, officially, against pirates.
      Unofficially, Rome had discovered
      that it liked intervening.
      It would do a lot of it.
    description: "I watched Rome's fleet sail against Teuta's Illyrian pirates — two hundred ships clearing the Adriatic — Rome's first overseas war, fought against pirates, teaching it to like intervening."
    status: "first draft"
    sha256: "8ad14bccc2027ce17229ee12b210f1afaec161a1b514b4ba943cb831896a600b"
  - number: "1218"
    volume: 2
    title: "The Giant Falls"
    date: "226 BCE"
    region: "Rhodes"
    poem: |
      The earthquake came at dawn.
      I was in the harbor at Rhodes when the ground moved —
      and the Colossus, the bronze giant,
      broke at the knees and fell.
      Fifty-six years it had stood.
      Now Helios lay on the shore,
      a fallen god, bronze limbs scattered,
      and the Rhodians — advised by an oracle —
      left him where he lay.
      For eight centuries travelers came
      to marvel at the fallen giant.
      Even broken, he was a wonder.
      Ptolemy offered to rebuild him.
      The oracle said no.
      Some things, once fallen,
      are more instructive on the ground.
    description: "I was in Rhodes harbor at dawn when the earthquake broke the Colossus at the knees — the bronze giant lying fallen for eight centuries, more instructive on the ground."
    status: "first draft"
    sha256: "c7a687fdb6094b7b5186a927d3a6a0b4e57655ed699637ce65fa4893abaf130c"
  - number: "1219"
    volume: 2
    title: "The Last Gallic Invasion"
    date: "225 BCE"
    region: "Italy"
    poem: |
      The Gauls came south again —
      a great migration, warriors and families,
      the last Gallic invasion of Italy —
      and Rome met them at Telamon,
      trapped between two consular armies.
      I watched the battle from the Roman lines.
      The Gauls fought naked, as was their custom,
      torcs at their throats, long swords swinging —
      brave, terrifying, doomed.
      The legions ground them down.
      Forty thousand dead, they said.
      The north of Italy lay open afterward —
      no more great invasions from Gaul,
      ever.
      The naked warriors died where they stood.
      Rome took their gold torcs
      and hung them in the temples.
      The age of the Gallic terror was over.
      The age of Rome was beginning.
    description: "I watched the last Gallic invasion die at Telamon — naked warriors with gold torcs ground down by the legions — the end of the Gallic terror and the opening of northern Italy."
    status: "first draft"
    sha256: "b1ad0f8a6a91ccbe7cc59a1adbed50fbc568c44490f569a0f743c89385adbf92"
  - number: "1220"
    volume: 2
    title: "The Conquest of the North"
    date: "222 BCE"
    region: "Italy"
    poem: |
      Marcellus took Milan —
      the great city of the Insubres —
      and Cisalpine Gaul became Roman ground.
      I walked into Milan with the legions.
      The Gauls had held it for centuries.
      Now the eagles were on the walls,
      the surveyors were laying out the streets,
      and the north was Rome's.
      Marcellus won the spolia opima that campaign —
      the third and last Roman to strip
      an enemy king's armor in single combat
      and dedicate it to Jupiter.
      The old heroic age, ending
      in the new province.
      The frontier moved to the Alps.
      Italy was whole, at last,
      under one power.
    description: "I walked into Milan with Marcellus's legions — Cisalpine Gaul becoming Roman ground, the old heroic age ending as the frontier moved to the Alps."
    status: "first draft"
    sha256: "ad33b36bb650d0fe766b0234c55f7771692cb41b4cca764ad2e96d4cc0d4285b"
  - number: "1221"
    volume: 2
    title: "The First Emperor"
    date: "221 BCE"
    region: "China"
    poem: |
      Ying Zheng had conquered them all —
      Han, Zhao, Wei, Chu, Yan, Qi,
      one by one, the six rival states fallen —
      and now he stood alone over all China.
      He took a new title: Huangdi.
      August Sovereign. Emperor.
      The First Emperor: Qin Shi Huang.
      I was at the proclamation.
      The ministers knelt. The drums rolled.
      Two hundred years of warring states,
      ended by one man.
      He was thirty-eight years old,
      and he had unified the largest civilization on earth.
      What he built — the script, the roads, the wall —
      would outlast his dynasty by two thousand years.
      The dynasty lasted fifteen.
      The idea lasted forever.
    description: "I knelt at the proclamation when Ying Zheng became Qin Shi Huang — two hundred years of warring states ended, the First Emperor of a unified China whose idea outlasted his dynasty by millennia."
    status: "first draft"
    sha256: "25cdcc6c363d234f5c66e43118059bec33363e4324c4e26217b5b25d7f0ee8cf"
  - number: "1222"
    volume: 2
    title: "One Script, One Measure"
    date: "221 BCE"
    region: "China"
    poem: |
      The emperor standardized everything:
      one script — the seal script, decreed —
      one coin, one weight, one measure,
      one axle-width for the carts
      so the ruts in the roads would match.
      I watched the clerks at work,
      burning the old local scripts,
      teaching the new characters
      in every province.
      A merchant from Chu could now read
      a contract from Qi.
      A bushel in Yan was a bushel in Qin.
      It sounds dull — weights and measures —
      but it was the deepest revolution of all:
      one China, thinkable in one language,
      measurable in one measure.
      Unity you can hold in your hand.
    description: "I watched the emperor's clerks burn local scripts and teach one standard — a bushel in Yan a bushel in Qin — the dull revolution of weights and measures that made one China thinkable."
    status: "first draft"
    sha256: "11c1a498058f1383c13e9d5ba7bfbb7d7f157d828d05761d1a022f67fb14f0ad"
  - number: "1223"
    volume: 2
    title: "The Long Wall"
    date: "220 BCE"
    region: "China"
    poem: |
      The emperor joined the northern walls —
      the old frontier walls of Qin, Zhao, Yan —
      into one Long Wall,
      against the horsemen of the steppe.
      I walked the construction lines.
      Hundreds of thousands of laborers,
      rammed earth, stone, the wall
      snaking over mountains and desert.
      It was not one wall, not yet —
      not the stone serpent of later dynasties —
      but the idea was born here:
      one continuous defense,
      one line drawn against the north.
      Millions of man-years.
      Countless dead, buried in the work.
      The wall worked, after a fashion.
      It always worked, after a fashion —
      and it never, ever kept everyone out.
    description: "I walked the construction lines where the First Emperor joined the northern walls into one Long Wall — rammed earth over mountains, countless dead in the work, the idea born."
    status: "first draft"
    sha256: "f7f0432cdca472646887eb19b6767c7e293f893d79ccb372eb010cdd94635301"
  - number: "1224"
    volume: 2
    title: "The Siege of Saguntum"
    date: "219 BCE"
    region: "Spain"
    poem: |
      Saguntum was Rome's ally —
      a Greek-Iberian city on the Spanish coast —
      and Hannibal besieged it for eight months.
      I was inside for part of it.
      The hunger. The sorties.
      The citizens burning their own treasures
      rather than surrender them.
      When the city fell, Hannibal had his war.
      Rome sent envoys, demanded satisfaction,
      got defiance —
      and the Second Punic War became certain.
      Eight months of suffering
      for a city Rome had never quite promised to protect
      and Hannibal had every reason to take.
      Honor is expensive.
      This one cost both sides
      seventeen years of war.
    description: "I endured part of the eight-month siege of Saguntum — the hunger, the burning treasures — the city's fall making Rome's war with Hannibal certain."
    status: "first draft"
    sha256: "8a9280438e4810692696dbea5e32d7a407740013c26e89bcf4fca018a89c8d79"
  - number: "1225"
    volume: 2
    title: "The Elephants Cross the Alps"
    date: "218 BCE"
    region: "Alps"
    poem: |
      He did it. Hannibal actually did it.
      Fifty thousand men, thirty-seven elephants,
      up and over the Alps —
      in autumn, in snow,
      elephants on mountain paths,
      men cutting steps in the ice.
      I marched in that column.
      The cold took the weak.
      The cliffs took the careless.
      The mountain tribes took whoever was left.
      When we came down into Italy,
      we were half the army that started —
      starving, frostbitten, triumphant.
      The Romans could not believe it.
      Nobody crosses the Alps with elephants.
      Hannibal did.
      The thunderbolt had fallen
      behind their shield.
    description: "I marched with Hannibal over the Alps — elephants on ice-cut mountain paths, half the army lost to cold and cliffs — the thunderbolt falling behind Rome's shield."
    status: "first draft"
    sha256: "086c425ec48935abd890432554c16fcaf5e83ac801ccda45442fd41ff86727ff"
  - number: "1226"
    volume: 2
    title: "The Trap at the River"
    date: "218 BCE"
    region: "Italy"
    poem: |
      At the Trebia, Hannibal set the trap:
      his brother Mago hidden in the brush
      with two thousand men,
      the Numidian cavalry drawing the Romans on,
      and the river — freezing, chest-deep —
      between the Roman camp and the battlefield.
      The Romans charged through the water at dawn,
      hungry, cold, wet to the bone —
      and Hannibal's fresh troops
      closed around them.
      I watched from the Carthaginian side.
      The Romans fought bravely.
      Bravery didn't matter.
      The river had beaten them before the battle started.
      Ten thousand Romans died that day,
      mostly of being lured, cold and hungry,
      into a trap set by a man
      who understood water better than they did.
    description: "I watched Hannibal lure the Romans through the freezing Trebia into Mago's ambush — ten thousand dead, beaten by cold water before the battle started."
    status: "first draft"
    sha256: "c78f0a61cb4b6ec1e7cc25bc5502c12134defc5a1028041e8514632f648c3b33"
  - number: "1227"
    volume: 2
    title: "The Fog at Trasimene"
    date: "217 BCE"
    region: "Italy"
    poem: |
      Morning mist on Lake Trasimene —
      thick, white, blinding —
      and Hannibal had hidden his whole army
      in the hills above the lakeside road.
      The consul Flaminius marched his legions
      straight into it, blind.
      I was on the hillside when the trap closed:
      the mist, the sudden screaming,
      Romans fighting shadows,
      the lake at their backs.
      Fifteen thousand dead.
      Flaminius among them —
      killed, they say, by a Gaul
      avenging an old insult.
      The worst ambush in Roman history,
      set in fog, sprung at dawn.
      Hannibal didn't just beat armies.
      He beat the weather into serving him.
    description: "I stood on the hillside above Trasimene when Hannibal's hidden army closed in the morning mist — fifteen thousand Romans dead in the worst ambush of their history."
    status: "first draft"
    sha256: "2c7be1c3d390cf4f7865c492272d4e9f0db5035ed4e432c980ba094a9e116b90"
  - number: "1228"
    volume: 2
    title: "The Slaughter at Cannae"
    date: "216 BCE"
    region: "Italy"
    poem: |
      Eighty thousand Romans.
      The largest army Rome had ever fielded.
      Hannibal let them push his center back —
      back, back, bending but not breaking —
      while his cavalry swept around
      and closed the trap.
      The double envelopment.
      I have never seen anything like it.
      Eighty thousand men, packed tighter and tighter,
      unable to raise their arms,
      killed where they stood.
      Fifty thousand dead in a single day.
      Senators. Consuls. The flower of Rome.
      Hannibal's masterpiece —
      studied in war colleges to this day.
      Rome did not surrender.
      That is the real story of Cannae:
      the day Rome should have died,
      and refused to.
    description: "I witnessed Hannibal's double envelopment at Cannae — fifty thousand Romans dead in a day, the masterpiece of tactics — and Rome's refusal to surrender afterward."
    status: "first draft"
    sha256: "8280ffab3bcbad5a2527276f8b0e1cc8a1f4f84b22a3659a22735d2722ca8b4c"
  - number: "1229"
    volume: 2
    title: "Philip's Bargain"
    date: "215 BCE"
    region: "Macedon"
    poem: |
      Philip V of Macedon — young, ambitious —
      saw Hannibal winning and made his bargain:
      an alliance with Carthage,
      Macedonian help against Rome,
      a share of the spoils.
      Rome's answer: fight a war in Greece
      to keep Philip quiet.
      The First Macedonian War —
      small, scrappy, mostly naval,
      Rome's legions tied down
      guarding against a king
      who never quite committed.
      I watched the diplomats shuttle.
      Philip wanted the glory without the risk.
      Rome wanted him contained without the cost.
      Both got what they wanted,
      which is to say: nothing much happened,
      and everyone prepared for the real war later.
    description: "I watched Philip V's envoys bargain with Hannibal — the alliance that bought Rome a small containing war in Greece while both sides prepared for the real one later."
    status: "first draft"
    sha256: "735629e83971952bc9e10299757a765ecb0c2c323b1a9d23cd384e86c58ffada"
  - number: "1230"
    volume: 2
    title: "The Claws of Archimedes"
    date: "214 BCE"
    region: "Sicily"
    poem: |
      Marcellus brought the fleet against Syracuse —
      and the old mathematician was ready.
      Archimedes' cranes —
      great wooden claws on the walls —
      reached out, grabbed Roman ships,
      lifted them by the prow
      and dashed them on the rocks.
      I watched from the walls.
      The Romans were terrified.
      They said Archimedes had a hundred hands.
      Mirrors, they say, too —
      burning mirrors, focusing the sun
      to set the ships afire.
      Maybe. The claws were real enough.
      An old man with geometry
      held off the Roman navy for two years.
      The mind, properly applied,
      is the ultimate siege engine.
    description: "I watched from Syracuse's walls as Archimedes' great claws plucked Roman ships from the sea — the old mathematician holding off a navy with geometry for two years."
    status: "first draft"
    sha256: "4cf0f6c99bd2c75f88df1aad58df429796c98645695c0a7c7523b5185c27b814"
  - number: "1231"
    volume: 2
    title: "The Burning of the Books"
    date: "213 BCE"
    region: "China"
    poem: |
      The emperor's minister Li Si proposed it:
      burn the books.
      All the histories of the rival states,
      all the philosophies but Legalism —
      burn them,
      so the past could not argue with the present.
      And the scholars who objected —
      four hundred and sixty of them, they say —
      buried alive.
      I stood in the square and watched the bonfires.
      Bamboo slips, silk scrolls,
      a thousand years of thought,
      going up in smoke.
      It didn't work, of course.
      Scholars hid books in walls.
      The past argued anyway.
      You cannot burn an idea
      with the same fire you use for bamboo.
      The smoke clears.
      The idea remains.
    description: "I stood in the square and watched the First Emperor's bonfires consume the rival states' histories — the burning of the books that failed, because you cannot burn an idea with bamboo-fire."
    status: "first draft"
    sha256: "e29b610d5490c67442928bbdaede220ab7ea2b3258533fa80d9403e82f86d1dc"
  - number: "1232"
    volume: 2
    title: "The Death of Archimedes"
    date: "212 BCE"
    region: "Sicily"
    poem: |
      Syracuse fell at last —
      betrayal, a night attack —
      and Marcellus had given orders:
      spare Archimedes. The old man was a treasure.
      A Roman soldier found him
      drawing circles in the dust,
      lost in a problem.
      "Don't disturb my circles," he said —
      or so the story goes —
      and the soldier killed him.
      Marcellus wept when he heard.
      He gave the geometer an honored burial,
      a sphere and cylinder on the tomb,
      as Archimedes had wished.
      I stood at that tomb.
      The greatest mind of the age,
      killed by a soldier
      for drawing in the dust.
      War does not respect geometry.
    description: "I stood at Archimedes' tomb — the sphere and cylinder he wished for — the greatest mind of the age killed by a soldier for drawing circles in the dust."
    status: "first draft"
    sha256: "425081ce1b653297e03e266b9b2428c260103bc0bcb68df4ee1cb566ded7d3cf"
  - number: "1233"
    volume: 2
    title: "The Fall of Capua"
    date: "211 BCE"
    region: "Italy"
    poem: |
      Capua — the richest city in Italy after Rome —
      had gone over to Hannibal after Cannae.
      Rome never forgave it.
      When the legions retook it,
      the punishment was total:
      the leaders executed,
      the people sold into slavery,
      the city stripped of everything
      but its name.
      I watched the auctions.
      Families separated. Fortunes gone in an afternoon.
      It was a lesson, deliberately:
      this is what happens
      to allies who leave.
      The other Italian cities took note.
      None rebelled again.
      Capua's slavery bought Rome's loyalty —
      paid for in full, in chains,
      on the auction block.
    description: "I watched the slave auctions after Rome retook Capua — the richest city's people sold as a deliberate lesson, buying the loyalty of every other Italian ally in chains."
    status: "first draft"
    sha256: "31cc7fdf6ed6ce0ccda5ebd3dbf63b412ff47d8548ca7900c6bfb81e50fdf7b0"
  - number: "1234"
    volume: 2
    title: "The Silver Denarius"
    date: "211 BCE"
    region: "Rome"
    poem: |
      Rome minted the denarius —
      four grams of silver,
      the head of Roma on one side,
      the Dioscuri on horseback on the other —
      and it would pay the legions
      for five hundred years.
      I held one of the first.
      Small, bright, honest silver.
      A day's pay for a laborer.
      A soldier's wage, standardized.
      Money is boring until it isn't.
      The denarius let Rome pay armies
      across the world, in coin
      everyone trusted.
      Empires run on trust
      stamped in metal.
      This little coin —
      this was the engine.
    description: "I held one of the first silver denarii — four grams of trusted metal that would pay Rome's legions for five centuries: empire's engine, stamped in silver."
    status: "first draft"
    sha256: "e6026ae22309f2fe400cdf5ff090ba81847ff90f90cfdf79f99947e1301b1b45"
  - number: "1235"
    volume: 2
    title: "The Emperor Dies"
    date: "210 BCE"
    region: "China"
    poem: |
      Qin Shi Huang died on tour —
      on the road, away from his capital,
      his ministers hiding the death
      for weeks, the fish carts
      covering the smell.
      I was in Xianyang when the news broke.
      The empire held its breath.
      And in the tomb at Mount Li —
      the clay army, thousands strong,
      standing guard over a palace
      no one has ever opened,
      with rivers of mercury for seas
      and pearls for stars.
      He sought immortality
      and found a tomb no one will open.
      The clay soldiers still stand.
      The emperor is still dead.
      That is the whole story
      of the quest for eternal life.
    description: "I was in Xianyang when the First Emperor's death was announced — the fish carts, the hidden corpse — and thought of his clay army standing guard over a tomb no one will open."
    status: "first draft"
    sha256: "753cb237b57a5e243557e2b4e2c28c1bcc07c959d8c2fb21cf1e5c2c96bd93a9"
  - number: "1236"
    volume: 2
    title: "The Uprising of the Conscripts"
    date: "209 BCE"
    region: "China"
    poem: |
      Chen Sheng and Wu Guang —
      conscript officers, delayed by rain,
      facing execution for being late —
      decided to rebel instead.
      "Princes and generals," Chen Sheng said,
      "are they born to their rank?"
      The question echoed across China.
      I joined the march for a while.
      Peasants with farm tools,
      taking cities, raising armies —
      the first great peasant rebellion
      in Chinese history.
      They died — Chen Sheng assassinated,
      Wu Guang killed by his own men —
      but the Qin was already falling.
      The dynasty built by law and terror
      was unbuilt by two late conscripts
      who decided they'd rather rebel than die.
    description: "I marched with Chen Sheng's peasant rebels — two rain-delayed conscripts who asked \"are princes born to their rank?\" and unbuilt the Qin dynasty with farm tools."
    status: "first draft"
    sha256: "414161710d599eabb6d30aaebadb2b67a7003f79088c727147c20b9851db6cd4"
  - number: "1237"
    volume: 2
    title: "The Chanyu"
    date: "209 BCE"
    region: "Mongolia"
    poem: |
      Modu — a Xiongnu prince who murdered his father,
      his stepmother, his brother —
      united the steppe tribes
      and took the title Chanyu.
      I rode the steppe that year.
      The horse-archers were everywhere now —
      one command, one discipline,
      the whistling arrows, the feigned retreats.
      The first steppe empire.
      The Xiongnu would press on China
      for three hundred years,
      force the building of walls,
      the paying of tribute,
      the sending of princesses.
      It started with a parricide
      who understood horses.
      The steppe had found its organizer.
      China would never sleep easily again.
    description: "I rode the steppe the year Modu murdered his way to power and united the Xiongnu — the first steppe empire, and three centuries of China's northern nightmare."
    status: "first draft"
    sha256: "b723a7890fe2c30840ab19c7203f1524bbce2bb23b57c4743b17912678e1ea70"
  - number: "1238"
    volume: 2
    title: "The Head of Hasdrubal"
    date: "207 BCE"
    region: "Italy"
    poem: |
      Hasdrubal — Hannibal's brother —
      crossed the Alps with reinforcements,
      and the Romans caught him at the Metaurus.
      He died fighting. The army was destroyed.
      Then the Romans cut off his head
      and threw it into Hannibal's camp.
      I was in that camp when it landed.
      Hannibal looked at his brother's head
      and said: now I see the fate of Carthage.
      He knew. The war was lost.
      No reinforcements would come.
      Eleven more years he fought in Italy —
      brilliant, unbeaten in the field —
      but the head of Hasdrubal
      had told him the truth:
      Carthage was doomed,
      and he was fighting its funeral.
    description: "I was in Hannibal's camp when Hasdrubal's severed head was thrown over the wall — and heard him say \"now I see the fate of Carthage\": the war lost, the funeral begun."
    status: "first draft"
    sha256: "51e2179c78c94983c06249d5156e151bb71131eaffc8c3a2c7a393efb6563da1"
  - number: "1239"
    volume: 2
    title: "The Taking of New Carthage"
    date: "206 BCE"
    region: "Spain"
    poem: |
      Young Scipio — twenty-five, bold, lucky —
      took New Carthage, Carthage's Spanish capital,
      by storm: scaling the walls at low tide
      where the lagoon was shallow,
      while the garrison watched the wrong side.
      I was in the assault.
      The city fell in a day.
      The silver mines, the harbor, the hostages —
      all Rome's.
      Scipio freed the Spanish hostages,
      treated them like guests —
      and Spain started going over to Rome.
      He won the west with mercy
      where others had failed with terror.
      The boy-general had understood something
      the old generals hadn't:
      conquest is politics
      continued by other means.
    description: "I scaled the walls of New Carthage with young Scipio's assault — the low-tide surprise that won Spain, and the mercy to hostages that won it politically too."
    status: "first draft"
    sha256: "6e961f78f9fc131aa52ad442205e5c62e4d2578ae1bf0d2430f654e7585591c6"
  - number: "1240"
    volume: 2
    title: "Scipio Sails"
    date: "204 BCE"
    region: "Africa"
    poem: |
      Scipio landed in Africa —
      carried the war to Carthage's own soil,
      the way Hannibal had carried it to Italy's.
      I sailed with the expedition.
      The beaches were empty.
      The Numidians — Masinissa's horsemen —
      joined us, and suddenly Rome
      had the best cavalry in Africa.
      Carthage recalled Hannibal from Italy.
      Sixteen years he had fought there, unbeaten —
      and now he sailed home to defend his city,
      an old man at forty-five,
      coming back to a war
      he had already lost.
      The wheel had turned.
      The invader was about to be invaded.
    description: "I sailed with Scipio's landing in Africa — the war carried to Carthage's own soil, Hannibal recalled from Italy after sixteen unbeaten years to defend a losing cause."
    status: "first draft"
    sha256: "1706efba1a2f6861078477b508a37a4bd7dc81c4f9c9f60708e46921a771f480"
  - number: "1241"
    volume: 2
    title: "The Plain of Zama"
    date: "202 BCE"
    region: "Africa"
    poem: |
      Zama. Hannibal's last battle.
      Scipio had an answer for the elephants —
      lanes in the formation, trumpets and javelins —
      and Masinissa's Numidian cavalry,
      the best horsemen in the world.
      I watched the elephants charge through the lanes,
      harmless, trumpeting, confused.
      Then the cavalry returned
      and closed behind the Carthaginian line.
      It was over. Hannibal's veterans —
      the men of Italy, the survivors of Cannae —
      died where they stood.
      Hannibal escaped. The war ended.
      The boy who swore the oath at nine,
      the thunderbolt of the Alps, the ghost of Cannae —
      beaten at last, on the plain of Zama,
      by a young Roman who had learned
      everything from him.
    description: "I watched Hannibal's elephants funneled harmlessly through Scipio's lanes at Zama — the oath-boy of nine beaten at last by a Roman who had learned everything from him."
    status: "first draft"
    sha256: "8cb7157c8420e996592db892b3279e1b8ce7e58cf85e6e578b05f8abc6045891"
  - number: "1242"
    volume: 2
    title: "The Peasants' Emperor"
    date: "202 BCE"
    region: "China"
    poem: |
      Liu Bang — a village headman,
      a minor patrol officer, a nobody —
      beat the noble Xiang Yu
      and founded the Han dynasty.
      I watched him enter the capital.
      He was coarse, funny, fond of wine —
      not a bit imperial.
      But he knew men:
      he kept the good ministers,
      forgave his enemies,
      and let China breathe
      after the Qin's terror.
      The peasants' emperor.
      Four hundred years of Han
      started with a village headman
      who understood people
      better than the aristocrats
      understood power.
      China's greatest dynasty,
      founded by its least likely founder.
    description: "I watched Liu Bang — village headman, wine-lover, nobody — enter the capital and found the Han: four centuries starting with China's least likely founder."
    status: "first draft"
    sha256: "b72b5f6d517c851a334dd72bed3bce69e0ac3de11378c09119cf86d34af8c346"
  - number: "1243"
    volume: 2
    title: "The Merchant Kings"
    date: "200 BCE"
    region: "Africa"
    poem: |
      Stripped of empire, fleet, and elephants —
      forbidden to make war without Rome's permission —
      Carthage did what it did best:
      it traded.
      I walked the markets of the new Carthage.
      The harbor was full again.
      The merchants were rich again.
      Within a generation, the city
      was paying off its war indemnity early
      and growing fat on commerce.
      Rome watched, and worried.
      A rich Carthage was a dangerous Carthage —
      or so the Romans told themselves.
      The merchant kings rebuilt
      what the warrior kings had lost.
      It wouldn't save them.
      But for a generation,
      Carthage was magnificent —
      defeated, disarmed,
      and rolling in gold.
    description: "I walked the full harbors of disarmed Carthage — stripped of empire, forbidden war, growing rich on trade within a generation: the merchant kings' magnificent, doomed revival."
    status: "first draft"
    sha256: "5457e1015a671372e88b6d042a179f52acd06d7110a0825160f146540d6d7b56"
  - number: "1244"
    volume: 2
    title: "The Freedom of Greece"
    date: "196 BCE"
    region: "Greece"
    poem: |
      At the Isthmian Games, the stadium packed —
      Flamininus, the Roman general,
      stepped forward and proclaimed:
      the Greek cities are free.
      I was in that crowd.
      The roar — they say the birds
      fell from the sky at the noise.
      Men weeping, cheering, calling him savior.
      Rome, the conqueror,
      giving Greece its freedom.
      It was genuine, I think —
      Flamininus meant it, that day.
      It was also policy:
      free cities don't need garrisons.
      The stadium roared.
      The birds fell.
      And Greece was free —
      under Rome's protection,
      which is a kind of freedom,
      until it isn't.
    description: "I stood in the stadium roar when Flamininus proclaimed Greece free — the birds falling from the sky at the noise — freedom under Rome's protection, genuine and political at once."
    status: "first draft"
    sha256: "6f17900f20cfc5a68dc2e8d3dbc90b7e67a93c945debd1567157eceb5f3d40b5"
  - number: "1245"
    volume: 2
    title: "The Stone of Rosetta"
    date: "196 BCE"
    region: "Egypt"
    poem: |
      The priests carved a decree —
      honors for the boy-king Ptolemy —
      in three scripts:
      hieroglyphs for the gods,
      demotic for the people,
      Greek for the administration.
      I watched the carvers work.
      Just another priestly decree,
      one of hundreds.
      Two thousand years later,
      a French soldier's fort,
      a British museum,
      and a young scholar named Champollion —
      and those three scripts
      unlocked the hieroglyphs,
      gave back the voice of ancient Egypt.
      The priests were honoring a king.
      They were actually handing the future
      the key to their whole civilization.
      They had no idea.
      Nobody ever does.
    description: "I watched priests carve a routine decree in three scripts at Rosetta — the stone that would, two millennia later, unlock the hieroglyphs and give Egypt back its voice."
    status: "first draft"
    sha256: "29116b6d6315ed519d0484498a78faee28f34738d5aa0d3e65d65abad2c9551f"
  - number: "1246"
    volume: 2
    title: "The Adventurer's Kingdom"
    date: "194 BCE"
    region: "Korea"
    poem: |
      Wiman — a Chinese exile, an adventurer
      with a thousand followers —
      seized the throne of Gojoseon
      and founded his own state in Korea.
      I met him once: shrewd, charming, ruthless.
      A refugee who became a king
      by being bolder than the locals.
      His kingdom sat between Han China
      and the Korean tribes —
      trading, raiding, surviving.
      It lasted less than a century,
      but it proved the pattern:
      Korea's history would be shaped
      by men who came from outside
      and stayed to rule.
      The adventurer's kingdom:
      founded by nerve,
      ended by the Han legions.
    description: "I met Wiman the exile-turned-king in Korea — the adventurer who seized Gojoseon's throne with a thousand followers and founded a kingdom on nerve."
    status: "first draft"
    sha256: "399d75fcaa780ebb244bc5187e7ee5552376ab5709d45f38f81cf1f29dc62a76"
  - number: "1247"
    volume: 2
    title: "The Syrian King Comes West"
    date: "192 BCE"
    region: "Greece"
    poem: |
      Antiochus III — the Great, he called himself,
      and he had the empire to back it:
      from the Aegean to India —
      invaded Greece, invited by the Aetolians,
      dreaming of the old Seleucid glory.
      Rome answered.
      I watched the legions land.
      The war for Asia had begun —
      not in Asia, but in Greece,
      because that is where Antiochus
      chose to meet his fate.
      The Syrian king came west
      with elephants and phalanxes.
      Rome came east with legions.
      Only one of them
      understood the century they were in.
    description: "I watched Rome's legions land as Antiochus the Great invaded Greece — the war for Asia beginning in Europe, the Syrian king meeting a century he didn't understand."
    status: "first draft"
    sha256: "2afd4fbc68c6d34e81c7b70408c33131ff33899449d5a4700fab5b41e4c607a0"
  - number: "1248"
    volume: 2
    title: "The Battle of Magnesia"
    date: "190 BCE"
    region: "Anatolia"
    poem: |
      At Magnesia, Rome met the Seleucid host —
      the greatest army of the east:
      phalanx, cataphracts, elephants,
      scythe-chariots, seventy thousand men.
      Scipio's brother Lucius commanded.
      I watched from the Roman camp.
      The chariots panicked and trampled their own lines.
      The elephants panicked and did the same.
      The legions — flexible, disciplined —
      cut the phalanx to pieces.
      Asia Minor became Rome's protectorate that day.
      The east's greatest army,
      beaten by an army half its size.
      The age of the phalanx was over.
      The age of the legion had begun.
    description: "I watched the Seleucid host dissolve at Magnesia — chariots and elephants trampling their own lines — the phalanx's age ending and the legion's beginning."
    status: "first draft"
    sha256: "0c53f53179706e8789d893c5ec7f7973487a48904984a19b4f0281b6436d63fa"
  - number: "1249"
    volume: 2
    title: "The Galatian Campaign"
    date: "189 BCE"
    region: "Anatolia"
    poem: |
      Manlius marched into the Anatolian highlands —
      against the Galatians, the Celtic tribes
      who had settled there a century before —
      and broke them in the mountains.
      I marched with the column.
      The highlands are brutal country:
      thin air, steep ridges,
      Celts who fought like demons
      and died like heroes.
      Rome took no territory — officially.
      Unofficially, every king in Asia Minor
      understood the message:
      Rome could reach anywhere.
      The campaign was a demonstration,
      written in Celtic blood:
      the new order had arrived,
      and it wore a red cloak.
    description: "I marched with Manlius into the Anatolian highlands — the Galatian campaign as demonstration, written in Celtic blood: Rome could reach anywhere, and Asia understood."
    status: "first draft"
    sha256: "df98cbdb0115f6041dc6d29dd69e9bc2d382cf22027070bd7b817e0cfd3264ca"
  - number: "1250"
    volume: 2
    title: "The Peace of Apamea"
    date: "188 BCE"
    region: "Anatolia"
    poem: |
      Antiochus signed at Apamea:
      surrender the elephants —
      all of them —
      surrender the fleet,
      pay fifteen thousand talents,
      give up everything west of the Taurus.
      I was there when the terms were read.
      The Syrian king's face —
      the Great, humbled.
      The elephants were led away.
      The ships were burned.
      Half a kingdom, signed over
      with a stylus.
      Rome didn't annex it. Not yet.
      It just made sure no eastern king
      could ever threaten it again.
      The peace of Apamea:
      the treaty that made Rome
      the master of the east
      without owning an acre of it.
    description: "I watched Antiochus the Great sign away his elephants, his fleet, and half his kingdom at Apamea — the treaty that made Rome master of the east without owning an acre."
    status: "first draft"
    sha256: "3547d7e44befb40f60e49b4b7edc597cee47204530469316b17b0a3e0b58f027"
  - number: "1251"
    volume: 2
    title: "The General's Coup"
    date: "185 BCE"
    region: "India"
    poem: |
      On parade — the army assembled,
      the last Mauryan king reviewing his troops —
      his general Pushyamitra stepped forward
      and killed him.
      Just like that. On parade.
      I was in the crowd. The gasp
      went through ten thousand men at once.
      The Shunga dynasty began
      with a murder in formation.
      Pushyamitra was a Brahmin general —
      the old order striking back
      at the Buddhist empire of Ashoka.
      Dynasties end the way they begin:
      with a sword.
      The Mauryas rose by conquest.
      They fell on a parade ground,
      in front of everyone.
    description: "I stood in the parade crowd when Pushyamitra murdered the last Mauryan king in formation — the Shunga dynasty beginning with a sword-stroke before ten thousand witnesses."
    status: "first draft"
    sha256: "3dfd6e2cb7dc08068fc5bbcc64eb74cf52c2cf1d47ffd3e4dc3fb0a7ac82b07a"
  - number: "1252"
    volume: 2
    title: "The Death of Hannibal"
    date: "183 BCE"
    region: "Bithynia"
    poem: |
      Hunted by Rome for twenty years —
      from Carthage to Syria to Bithynia —
      the old general, sixty-four,
      took poison in a Bithynian village
      rather than be taken alive.
      I was nearby. The Romans came;
      the house was surrounded;
      Hannibal drank the poison
      he had carried in his ring for years.
      The man who swore the oath at nine,
      who crossed the Alps,
      who killed fifty thousand at Cannae —
      dead by his own hand
      in a village no one remembers.
      Rome had its revenge, of a kind.
      But the ghost of Hannibal
      haunted Roman nightmares
      for a hundred years.
      Some enemies you never really kill.
    description: "I was nearby when the surrounded Hannibal drank the poison from his ring — the oath-boy, the Alpine crosser, the ghost of Cannae, dead by his own hand at sixty-four."
    status: "first draft"
    sha256: "c6412a0f22608e0593124628e542d8ffebec692995376c7751a72abf5efbcaf8"
  - number: "1253"
    volume: 2
    title: "The Father of Latin Poetry"
    date: "181 BCE"
    region: "Rome"
    poem: |
      Ennius — a Greek-speaking Italian from Calabria —
      wrote Rome's first epic in Latin hexameters:
      the Annales, the story of Rome
      from Troy to his own day.
      I heard him recite.
      The Latin was rough, the meter Greek,
      but the ambition was Roman:
      give the city its voice.
      "Let no one weep for me," he wrote for his tomb.
      "I live on in the mouths of men."
      And he did — Virgil learned from him,
      all of Latin poetry flows from him.
      The father of Latin poetry
      wasn't born speaking Latin.
      Rome's voice came from outside Rome —
      like everything else Roman,
      borrowed and made greater.
    description: "I heard Ennius recite Rome's first Latin epic — the rough hexameters that gave the city its voice — the father of Latin poetry who wasn't born speaking Latin."
    status: "first draft"
    sha256: "af0eae70cc045778a691e435391f11cb26b5b4b4036977c2521d686fa1f7a88c"
  - number: "1254"
    volume: 2
    title: "The Altar of Pergamum"
    date: "180 BCE"
    region: "Anatolia"
    poem: |
      Eumenes raised it on the acropolis of Pergamum —
      a marble altar, a hundred feet across,
      carved with the battle of gods and giants:
      Zeus, Athena, the writhing serpent-giants,
      every muscle straining in stone.
      I climbed the steps.
      The frieze wraps around you —
      you are inside the battle,
      the gods fighting at your eye level.
      The greatest sculptural achievement
      of the Hellenistic age.
      The Pergamenes built it to celebrate
      beating the Galatians —
      art as victory monument.
      Two thousand years later,
      Berlin would carry the stones away.
      The giants are still writhing.
      The gods are still winning.
    description: "I climbed the steps of the Pergamum altar and stood inside its marble battle of gods and giants — the Hellenistic age's greatest sculpture, still writhing after two millennia."
    status: "first draft"
    sha256: "724a80ac512934011eee56bd68afa3b5efd77b06f934e48d81dd6250df30df84"
  - number: "1255"
    volume: 2
    title: "The God Made Visible"
    date: "175 BCE"
    region: "Syria"
    poem: |
      Antiochus IV seized the Seleucid throne —
      and took the name Epiphanes:
      God Manifest. The god made visible.
      I was in Antioch for the coronation.
      He was clever, charming, erratic —
      a king who bathed in the public baths,
      ran for local office as a joke,
      and meant every bit of the godhood.
      The god made visible
      would desecrate the Jerusalem Temple,
      provoke the Maccabees,
      and die mad in the east.
      Kings who call themselves gods
      always end the same way:
      the god dies,
      and the accountants
      count the cost.
    description: "I watched Antiochus IV crown himself Epiphanes — God Manifest — the charming, erratic king whose godhood would desecrate a temple and die mad in the east."
    status: "first draft"
    sha256: "a25bd689609db0a5cb49d937a791519070dfe682cb76557f488839c81ee2bcfc"
  - number: "1256"
    volume: 2
    title: "The Third Macedonian War"
    date: "171 BCE"
    region: "Greece"
    poem: |
      Perseus — the last king of Macedon,
      Philip's son —
      and Rome moved against him.
      The Third Macedonian War.
      I watched the legions cross into Greece.
      Nobody doubted the outcome —
      Macedon was a shadow of Philip's kingdom —
      but Rome fought carefully,
      methodically,
      the way a strong man fights
      a sick dog: without haste, without mercy.
      Perseus tried diplomacy. Tried bribes.
      Tried everything but winning.
      The war dragged for three years.
      Then Pydna.
      Then nothing.
      Macedon had three years left
      and didn't know it.
    description: "I watched Rome's legions cross into Greece for the Third Macedonian War — the methodical end of a shadow kingdom, three years from Pydna and nothing."
    status: "first draft"
    sha256: "1a29e863f4eec61766ec6923ed2dd8e7fa420b2f7804b7eab5f48af7612043e4"
  - number: "1257"
    volume: 2
    title: "The End of Macedon"
    date: "168 BCE"
    region: "Greece"
    poem: |
      At Pydna, the phalanx met the legion
      one last time —
      and Aemilius Paullus watched the sarissas
      push his men back, back,
      until the ground broke up,
      the phalanx lost its order,
      and the legionaries got inside the pikes
      with their short swords.
      I was there. It was butchery.
      Twenty thousand Macedonians dead.
      The phalanx — Philip's invention,
      Alexander's weapon —
      died on a broken hillside in Greece.
      Perseus fled, was captured,
      walked in Paullus's triumph.
      The kingdom of Alexander's father
      became four Roman republics.
      Macedon was no more.
      The phalanx was no more.
      The world belonged to the short sword.
    description: "I watched the phalanx die at Pydna — Paullus's legionaries inside the sarissas with short swords — the kingdom of Alexander's father becoming four Roman republics."
    status: "first draft"
    sha256: "7259f0fb77050adbaa4f67581034f0db4b2b2f84201af2a58eef5c3dd57381e0"
  - number: "1258"
    volume: 2
    title: "The Hammer's Revolt"
    date: "167 BCE"
    region: "Judea"
    poem: |
      Antiochus desecrated the Temple —
      sacrificed a pig on the altar,
      set up the abomination —
      and in the village of Modin,
      an old priest named Mattathias
      killed the king's officer
      and fled to the hills.
      His son Judas — the Hammer, Maccabeus —
      took over the revolt.
      I fought in those hills.
      Guerrilla war: ambushes, night raids,
      the few against the many.
      They took Jerusalem.
      They cleansed the Temple —
      the oil that lasted eight days,
      the festival of lights.
      A village revolt beat an empire's army.
      Faith, it turns out,
      is a force multiplier
      no phalanx can match.
    description: "I fought in the Judean hills with Judas Maccabeus — the village revolt that cleansed the desecrated Temple — and learned faith is a force multiplier no phalanx can match."
    status: "first draft"
    sha256: "257571cc9bb18ad6f2693f3fa0e84304186996d9ddb5d5173514f73dd11828e1"
  - number: "1259"
    volume: 2
    title: "The Free Port"
    date: "166 BCE"
    region: "Aegean"
    poem: |
      Rome made Delos a free port —
      no taxes, no duties —
      and the little holy island
      became the busiest slave market
      in the world.
      I walked the quays at Delos.
      Ten thousand slaves a day, they said,
      bought and sold —
      the human fuel of the Roman economy,
      traded tax-free under the god's protection.
      Apollo's island, sacred since myth —
      now an emporium of chains.
      The irony was not lost on the traders.
      It was just priced in.
      Freedom's port, built on unfreedom.
      The ancient economy's open secret,
      conducted in the open,
      on holy ground.
    description: "I walked the quays of Delos — Apollo's holy island turned tax-free slave market, ten thousand souls a day traded under the god's protection."
    status: "first draft"
    sha256: "e8a034fe51142be192c11b07b441bc44dc3d786642b19607b6ffc9f8ce6b4584"
  - number: "1260"
    volume: 2
    title: "The African Playwright"
    date: "160 BCE"
    region: "Rome"
    poem: |
      Terence — Publius Terentius Afer,
      a freed slave from Carthage, African-born —
      charmed Rome with comedies:
      mistaken identities, lovers' quarrels,
      fathers and sons,
      all in the polished Latin
      of a man who learned it as a second language.
      I sat in the theater.
      The audience — senators, knights —
      laughed at the slave's jokes,
      cried at the lovers' troubles.
      "Homo sum," he wrote:
      I am human; nothing human is alien to me.
      A freed African slave,
      teaching Rome humanity
      in its own language.
      The line outlived the empire.
      It outlived everything.
    description: "I sat in the theater for Terence's comedies — the freed African slave teaching Rome \"nothing human is alien to me\" in its own polished Latin."
    status: "first draft"
    sha256: "dd8692a202cc0e0b45ccea8a536d019579cb49b1a441012536f43d8b213438ce"
  - number: "1261"
    volume: 2
    title: "The Greek King Who Asked"
    date: "155 BCE"
    region: "India"
    poem: |
      Menander — Milinda, the Greek king
      in India, ruler of the Punjab —
      sat down with the Buddhist sage Nagasena
      and asked his questions.
      What is the self? What survives death?
      The chariot and its parts —
      is the chariot anything but the parts?
      I listened to the debate.
      The king pressed. The sage answered.
      Question by question, the self dissolved
      into aggregates, into processes —
      no soul, no essence, just the chariot,
      rolling.
      Menander converted, they say.
      The Milinda Panha — the Questions of Milinda —
      became a Buddhist classic.
      A Greek king, asking the hardest questions,
      in India, two thousand years ago.
      Philosophy needs no passport.
    description: "I listened as the Greek king Menander debated the sage Nagasena on the nature of the self — the chariot and its parts — philosophy needing no passport in ancient India."
    status: "first draft"
    sha256: "293970c1056b31f7482b93082c12bbd788d928a82ad8e3c1cb785ccf32081f16"
  - number: "1262"
    volume: 2
    title: "The Hostage Historian"
    date: "150 BCE"
    region: "Greece"
    poem: |
      Polybius — a Greek statesman, taken to Rome
      as a hostage after Pydna —
      spent his captivity writing
      how a village republic conquered the world
      in fifty years.
      I knew him in Rome.
      He had access to everyone —
      Scipio's friend, the Senate's guest —
      and he used it to understand power:
      the mixed constitution, the balance,
      Rome's secret.
      His history was a warning, too:
      all constitutions decay.
      Rome would decay.
      He wrote it while Rome was at its height,
      a hostage explaining his captors
      to the future.
      The future listened.
      We are still listening.
    description: "I knew Polybius in Rome — the Greek hostage writing how a village republic conquered the world in fifty years, and warning that all constitutions decay."
    status: "first draft"
    sha256: "9284ce4684ab79d5ed52690723de5fdb7a7df74359bcde5bc7f8e773f2ef0b65"
  - number: "1263"
    volume: 2
    title: "The Poets of the South"
    date: "150 BCE"
    region: "India"
    poem: |
      At Madurai, in the deep south,
      the Tamil bards gathered —
      the first Sangam, they called it,
      an academy of poets —
      and sang of love and war:
      the five landscapes, the stolen meetings,
      the heroes' deaths.
      I sat in the assembly hall.
      The poems were short, perfect, devastating —
      a girl waiting at the field's edge,
      a king's spear rusting in his wound.
      Two thousand years of Tamil literature
      started here, with bards
      singing love and war
      in a hall in Madurai.
      The north had its epics.
      The south had its Sangam —
      and its poems were better.
    description: "I sat in the Madurai assembly while Tamil bards sang the first Sangam poems — short, perfect verses of love and war that started two millennia of literature."
    status: "first draft"
    sha256: "3d77fb363da8d62bef400bf081bf1d3c6904ac44452133c49afb8be340158a41"
  - number: "1264"
    volume: 2
    title: "The Third Punic War"
    date: "149 BCE"
    region: "Africa"
    poem: |
      Rome besieged Carthage.
      The pretext was thin —
      Carthage had defended itself against Numidia,
      which Rome called a treaty violation.
      The real reason was Cato,
      ending every speech with:
      Carthage must be destroyed.
      I was outside the walls.
      The city held for three years —
      against hunger, against the legions,
      against the inevitable.
      Three years of siege.
      The Carthaginians made weapons
      from anything: women's hair for catapult ropes,
      temple gold for swords.
      A city fighting with its jewelry
      against the greatest army on earth.
      It was hopeless. It was magnificent.
      It was Carthage, to the end.
    description: "I stood outside Carthage's walls through three years of siege — the city making catapult ropes from women's hair, fighting with its jewelry against the inevitable."
    status: "first draft"
    sha256: "553fb4c8cebbb259112be4f6b1e2cc44094281c1de5fde446c2930d9afef566b"
  - number: "1265"
    volume: 2
    title: "The Salt of Carthage"
    date: "146 BCE"
    region: "Africa"
    poem: |
      Scipio Aemilianus took the city —
      street by street, house by house,
      six days of urban war —
      and then Rome burned it.
      I watched Carthage burn.
      Seventeen days, they said,
      the fire lasted.
      The survivors — fifty thousand —
      sold into slavery.
      They say Rome sowed the fields with salt.
      Probably not true. The burning was true enough.
      Scipio wept, they say, quoting Homer
      about Troy —
      for he saw Rome's own future
      in Carthage's flames.
      The western sea was Rome's alone now.
      The rival was gone.
      The salt — real or not —
      was the point: nothing should grow here again.
    description: "I watched Carthage burn for seventeen days — Scipio weeping over Troy's lines, fifty thousand enslaved — the rival gone, the western sea Rome's alone."
    status: "first draft"
    sha256: "a9f9d999fb696b4f26d7c3a800d46e22471ab183e64b041cefb8005d8146e2c0"
  - number: "1266"
    volume: 2
    title: "The Sack of Corinth"
    date: "146 BCE"
    region: "Greece"
    poem: |
      The same year — 146, the terrible year —
      Mummius took Corinth,
      the richest city in Greece,
      and looted it.
      I walked through afterward.
      The statues were being crated for Rome.
      The paintings, the gold, the bronze —
      soldiers using masterpieces as gaming tables,
      they said.
      Corinth was destroyed.
      Greece became the province of Achaea.
      The city that had invented so much —
      the order, the games, the wealth —
      ended as plunder in Roman ships.
      Two cities in one year:
      Carthage and Corinth.
      Rome's message to the world:
      resist, and this is what remains.
    description: "I walked through looted Corinth in 146 BCE — statues crated for Rome, soldiers gaming on masterpieces — the year Rome destroyed Carthage and Corinth together as a message."
    status: "first draft"
    sha256: "59ccd8df33323a5fbdaee7965024549c856603e95d1c49cc4e177706a92fb54c"
  - number: "1267"
    volume: 2
    title: "The Long Water"
    date: "144 BCE"
    region: "Rome"
    poem: |
      The Aqua Marcia —
      ninety miles from the mountains,
      on arches, through tunnels,
      carrying cold, pure water
      into Rome.
      I walked the arcade.
      The arches march across the Campagna
      like a stone army —
      and the water runs on top,
      silent, endless.
      The Marcia's water was the best in Rome —
      cold, clean, the connoisseur's choice.
      A city of a million people,
      drinking mountain water
      brought ninety miles by gravity.
      Rome's true monuments
      are not the temples.
      They are the arches
      carrying water.
    description: "I walked the arches of the Aqua Marcia marching ninety miles across the Campagna — Rome's true monuments carrying mountain water by gravity alone."
    status: "first draft"
    sha256: "80ee02a468aba416aeb5a989ad826fe8ca2842a33d8b98a4e08c83e79cb3b5c1"
  - number: "1268"
    volume: 2
    title: "The Parthians Take Babylon"
    date: "141 BCE"
    region: "Mesopotamia"
    poem: |
      Mithridates I of Parthia —
      the great builder of the Parthian empire —
      took Babylon, took Mesopotamia,
      and Persia rose again
      under new horsemen.
      I was in Babylon when the Parthians entered.
      The city that had seen Alexander die,
      that had buried kings for two thousand years,
      opened its gates to the horse-archers.
      The Seleucids were finished in the east.
      A new Persia — Parthian, steppe-tough —
      held the land between Rome and China.
      The silk would travel through it.
      The legions would break against it.
      Babylon had a new master.
      Babylon always had a new master.
      That was Babylon's whole history.
    description: "I was in Babylon when Mithridates' Parthians took the ancient city — Persia rising again under steppe horsemen, holding the land between Rome and China."
    status: "first draft"
    sha256: "4ff6e6d7f119d6012efa8bc95c376a02d1e091fb2abfd16679877e7b70d8ca36"
  - number: "1269"
    volume: 2
    title: "The Murder of Viriathus"
    date: "140 BCE"
    region: "Spain"
    poem: |
      Viriathus — the Lusitanian shepherd
      turned guerrilla genius —
      had humiliated Rome in Spain for eight years.
      Rome couldn't beat him.
      So Rome bought his friends.
      They stabbed him in his sleep.
      I heard the news in a Spanish tavern.
      The room went quiet.
      Rome paid the assassins —
      then refused to pay them,
      saying Rome does not pay traitors.
      The perfect Roman touch:
      use the treachery, then condemn it.
      Viriathus dead, the resistance collapsed.
      Spain was Rome's.
      But the manner of it —
      the bribed friends, the sleeping knife —
      stained the victory.
      Some wins cost more than battles.
    description: "I heard the news in a Spanish tavern — Viriathus stabbed by his bribed friends in his sleep — Rome's victory in Spain stained by the sleeping knife."
    status: "first draft"
    sha256: "b65d8a5367de1cb2c496f76959a73f85448845f582fd9418d5eb45e2587fcc86"
  - number: "1270"
    volume: 2
    title: "The Stoic in the Senate"
    date: "140 BCE"
    region: "Rome"
    poem: |
      Panaetius of Rhodes —
      Stoic philosopher —
      came to Rome and taught the nobles:
      duty, honor, the rational life,
      in Greek, to men who would make it Latin.
      I attended his lectures.
      Scipio's circle — the best minds in Rome —
      sat at his feet.
      Stoicism got its Latin accent here:
      duty became officium,
      the wise man became the Roman gentleman.
      It would shape emperors —
      Marcus Aurelius, centuries later,
      writing his Meditations in Greek
      on the Danube frontier.
      Philosophy crossed the Adriatic
      in Panaetius's luggage.
      Rome never gave it back.
    description: "I sat at Panaetius's lectures in Rome — the Stoic teaching Scipio's circle, philosophy crossing the Adriatic in his luggage and never going back."
    status: "first draft"
    sha256: "a79b92c194c5875d643fcd46b8cee054b74087576b4443d77b612866c481955b"
  - number: "1271"
    volume: 2
    title: "The Envoy to the West"
    date: "138 BCE"
    region: "China"
    poem: |
      Zhang Qian rode out —
      beyond the Jade Gate, into the unknown west,
      seeking allies against the Xiongnu:
      the Yuezhi, the Wusun,
      kingdoms Rome had never heard of.
      I rode with the expedition partway.
      The desert. The mountains.
      Capture by the Xiongnu —
      ten years a captive, then escape.
      He would be gone thirteen years.
      He would find no allies.
      But he would bring back knowledge:
      thirty-six kingdoms, the Ferghana horses,
      the grapes, the alfalfa —
      and the idea of the West.
      The Silk Road started here:
      not with silk, but with a man
      riding out to find allies
      and finding the world instead.
    description: "I rode partway with Zhang Qian beyond the Jade Gate — thirteen years gone, no allies found, but the knowledge of thirty-six kingdoms that opened the Silk Road."
    status: "first draft"
    sha256: "c1a9941897cb4dd27cf970cf08cc0ff80930dba3521da7d9a21a42990b9b266e"
  - number: "1272"
    volume: 2
    title: "The Slave King"
    date: "135 BCE"
    region: "Sicily"
    poem: |
      Eunus — a Syrian slave in Sicily,
      a wonder-worker, they said,
      who breathed fire in religious ecstasy —
      led the island's slaves in revolt.
      They crowned him king.
      Antiochus, he called himself.
      I saw his court at Enna —
      slaves turned ministers,
      an army of seventy thousand runaways.
      For years they held Sicily.
      Rome sent army after army.
      The slave king's reign lasted
      until hunger and treachery ended it.
      Eunus died in a Roman prison,
      eaten by lice, they say.
      But for a shining moment,
      the lowest of the low
      had a king, a court, a kingdom —
      and Rome was afraid.
    description: "I saw the slave-king Eunus's court at Enna — seventy thousand runaways holding Sicily for years — the lowest of the low with a crown, and Rome afraid."
    status: "first draft"
    sha256: "63cdf096a33e33960000d7ba96dfa1bad00116afb8e9bae596e93584b4ac428e"
  - number: "1273"
    volume: 2
    title: "The Hunger of Numantia"
    date: "134 BCE"
    region: "Spain"
    poem: |
      Numantia — a Celtiberian hill town —
      held out against Rome for twenty years.
      Scipio Aemilianus, the destroyer of Carthage,
      came to finish it:
      not by assault, but by hunger.
      Seven walls of circumvallation.
      No food in, no one out.
      I watched from the Roman lines
      as the city starved.
      At the end, the Numantines
      killed themselves —
      mass suicide, rather than surrender.
      Men, women, children.
      Scipio took an empty city.
      Rome's victory was total
      and totally hollow.
      The hunger of Numantia
      became Spain's legend:
      better death than chains.
    description: "I watched from the siege lines as starving Numantia chose mass suicide over surrender — Scipio taking an empty city, Spain gaining its legend of death before chains."
    status: "first draft"
    sha256: "491dd3897d2af208d36b4a9460b2fde1bb3f01633e1ede1ed2bd698d9fcaf96c"
  - number: "1274"
    volume: 2
    title: "The Tribune Is Beaten to Death"
    date: "133 BCE"
    region: "Rome"
    poem: |
      Tiberius Gracchus —
      tribune of the people —
      proposed giving public land to the poor.
      The Senate's friends owned that land.
      They blocked him. He persisted.
      On election day, the senators
      and their clients stormed the Forum
      with chair legs and clubs —
      and beat Tiberius to death,
      with three hundred of his followers.
      I was in the Forum.
      The first political murder in Rome
      in three hundred years.
      The tribune's body was thrown in the Tiber.
      The republic had learned a new trick:
      when the vote goes wrong,
      use the club.
      It would use it again.
      And again.
      Until the clubs became legions.
    description: "I was in the Forum when senators beat Tiberius Gracchus to death with chair legs — the republic learning that when votes go wrong, clubs work: the trick it would use until clubs became legions."
    status: "first draft"
    sha256: "6f2b6afd07f438c6e394d586de7ec18f58c5adbbe9ad485ab456052a80592caa"
  - number: "1275"
    volume: 2
    title: "The King's Will"
    date: "133 BCE"
    region: "Anatolia"
    poem: |
      Attalus III of Pergamum —
      the last of his line, childless, strange —
      left his whole kingdom to Rome in his will.
      I was in Pergamum when the news came.
      The city was stunned.
      A kingdom, willed away like a farm.
      Tiberius Gracchus wanted the money
      for his land reforms.
      The Senate wanted the territory.
      Asia became a Roman province —
      not by conquest, but by inheritance.
      The king's will: the strangest bequest
      in history.
      Pergamum's wealth funded Rome's politics,
      and a kingdom died
      with a signature.
    description: "I was in Pergamum when Attalus III's will left his whole kingdom to Rome — Asia becoming a province by inheritance, a kingdom dying with a signature."
    status: "first draft"
    sha256: "b6a7ab65a6c36e36fe41e3feb23bfc344f7595b13f38c5025d31158afb03bd20"
  - number: "1276"
    volume: 2
    title: "The Freedmen's Revolt"
    date: "130 BCE"
    region: "Anatolia"
    poem: |
      Aristonicus — claiming to be Attalus's brother —
      raised the slaves and the poor
      against Rome's new province of Asia.
      He promised them freedom.
      He called his followers the Heliopolitae —
      citizens of the sun.
      I traveled through the revolt's territory.
      For three years they held out —
      slaves fighting for the sun-citizens' dream,
      beating Roman armies sent against them.
      Rome crushed it in the end, of course.
      Aristonicus was captured, strangled.
      But for three years, in western Anatolia,
      the poor had a king and a cause
      and the sun for a capital.
      Dreams don't need to win
      to matter.
    description: "I traveled through Aristonicus's revolt — slaves and poor fighting for the sun-citizens' dream against Rome's new province — three years of a dream that didn't need to win to matter."
    status: "first draft"
    sha256: "25764ba458bd9857438669226f0ae9edd3d0ef350417b1956eb82193d374b605"
  - number: "1277"
    volume: 2
    title: "The Star Counter"
    date: "129 BCE"
    region: "Greece"
    poem: |
      Hipparchus — on Rhodes, with bronze instruments
      and tireless eyes —
      cataloged a thousand stars,
      measured the year to within minutes,
      and discovered the precession:
      the slow wobble of the heavens,
      the pole star drifting over millennia.
      I watched him work at night.
      He compared his charts
      with records from Babylon, centuries old —
      and caught the sky moving.
      The star counter.
      The greatest astronomer of antiquity,
      working by eye and bronze,
      discovering that even the fixed stars
      are not fixed.
      The heavens wobble.
      Everything moves.
      He proved it with a catalog.
    description: "I watched Hipparchus compare his star charts with centuries-old Babylonian records and catch the heavens wobbling — the star counter proving even the fixed stars move."
    status: "first draft"
    sha256: "1e9bf8661f6992b7408144f405c12c9e961299495642084b84c57808d3636327"
  - number: "1278"
    volume: 2
    title: "The Yuezhi Flee West"
    date: "128 BCE"
    region: "Central Asia"
    poem: |
      Driven by the Xiongnu —
      their king's skull made into a drinking cup,
      the old humiliation —
      the Yuezhi migrated west,
      a whole people on the move:
      wagons, herds, warriors.
      I saw the migration's edge.
      It shook kingdoms as it passed —
      Bactria trembled, the Greeks of the Oxus
      watched the dust on the horizon.
      The Yuezhi would settle, in time,
      and become the Kushans —
      the great empire of the Silk Road,
      patrons of Buddhism, minters of gold.
      But that year they were just fleeing —
      a people with their king's skull
      in an enemy's cup,
      walking west toward history.
    description: "I saw the Yuezhi migration's dust on the horizon — a whole people fleeing west past trembling Bactria, walking toward their future as the Kushan empire."
    status: "first draft"
    sha256: "0f8f81830d8cd8382b31d4feac52d2ddd1effba3ac0f64f8a8df86bf2b29dd65"
  - number: "1279"
    volume: 2
    title: "The Envoy Returns"
    date: "126 BCE"
    region: "China"
    poem: |
      Thirteen years.
      Captured by the Xiongnu, escaped,
      crossed the Pamirs, reached Bactria,
      found the Yuezhi settled and uninterested in war —
      and Zhang Qian came home.
      I was at the court when he reported.
      Thirty-six kingdoms, he said.
      The Ferghana horses — heavenly horses.
      Grapes. Alfalfa. The Oxus, the Jaxartes.
      A world beyond the desert.
      No allies. But knowledge —
      the most valuable cargo
      ever carried across the Taklamakan.
      The emperor listened for hours.
      The Silk Road was born
      in that debriefing.
      Thirteen years a captive and a wanderer,
      and Zhang Qian changed the world
      by coming home and talking.
    description: "I was at court when Zhang Qian returned after thirteen years — no allies, but thirty-six kingdoms of knowledge — the debriefing that gave birth to the Silk Road."
    status: "first draft"
    sha256: "07b6824b9015e25ca5c6f40ff9c0a59f6d39fc436bb882ddece9ff644debaabd"
  - number: "1280"
    volume: 2
    title: "Bread for the People"
    date: "123 BCE"
    region: "Rome"
    poem: |
      Gaius Gracchus — Tiberius's younger brother —
      passed the grain law:
      the state would sell grain to Rome's poor
      at a fixed, subsidized price.
      I stood in the bread lines.
      The poor ate. Really ate.
      For the first time, Rome's hungry
      had a claim on the city's granaries.
      It was the first welfare state, of a kind —
      bread for the people, by law.
      The conservatives called it bribery.
      The poor called it dinner.
      Gaius would die like his brother —
      the clubs again —
      but the grain law survived him.
      Once the people have tasted bread by right,
      no Senate takes it back.
    description: "I stood in Rome's first subsidized bread lines under Gaius Gracchus's grain law — the poor eating by right, the first welfare state, and a taste no Senate could take back."
    status: "first draft"
    sha256: "eaeec4f6c102d3d2a26a9bef4d3c826b8ea749cc6bc168590b4eecefb5c5f1f2"
  - number: "1281"
    volume: 2
    title: "The Colony That Failed"
    date: "122 BCE"
    region: "Rome"
    poem: |
      Gaius Gracchus founded a colony —
      for the poor, on the ruins of Carthage:
      Junonia, they called it.
      New farms, new hope,
      on the cursed ground.
      I sailed to see it.
      The settlers were hopeful.
      The omens were terrible —
      wolves dug up the boundary markers,
      the Senate said, the gods objected.
      The Senate killed the colony.
      Then killed Gaius —
      three thousand of his followers with him.
      Junonia failed.
      But the idea didn't:
      the poor deserved land,
      Carthage's curse could be lifted.
      Caesar would refound it.
      Augustus would finish it.
      The colony that failed
      was just early.
    description: "I sailed to Junonia — Gracchus's doomed colony for the poor on Carthage's ruins — and watched the Senate kill the colony, then the founder: an idea merely early."
    status: "first draft"
    sha256: "984310badbad7faf25f6ba42d8526ce9b3e3f271f0c963f8f65881139fe55f4b"
  - number: "1282"
    volume: 2
    title: "The First Political Massacre"
    date: "121 BCE"
    region: "Rome"
    poem: |
      They killed Gaius Gracchus —
      and then the Senate passed the ultimate decree,
      and three thousand of his followers
      were strangled in prison.
      I walked past the Tiber that week.
      The bodies — they threw them in the river,
      like his brother's.
      The first political massacre.
      Not a riot, not a brawl —
      a systematic killing of the defeated,
      ordered by the state.
      Roman politics had learned murder
      as a policy.
      The clubs of 133 became the nooses of 121.
      The nooses would become the proscriptions,
      the proscriptions the civil wars.
      It started here:
      three thousand strangled,
      and the river carrying the bodies.
    description: "I walked the Tiber the week three thousand of Gaius Gracchus's followers were strangled — the first political massacre, murder learned as policy, the river carrying the bodies."
    status: "first draft"
    sha256: "4641a4e1b037eb36fc5827ea7c8a62cc3c74a1cc8daf71a692fe3b52b1fb11c9"
  - number: "1283"
    volume: 2
    title: "The Music Bureau"
    date: "120 BCE"
    region: "China"
    poem: |
      Emperor Wu founded the Yuefu —
      the Music Bureau —
      to collect the songs of the people
      from every province:
      work songs, love songs, laments,
      the empire's voice, gathered.
      I traveled with a collector once.
      We sat in village squares,
      writing down what the farmers sang —
      and the farmers were shy, then proud.
      Two thousand years later,
      we still sing their songs.
      The Yuefu preserved the folk voice
      of Han China —
      the empire listening to its people,
      one song at a time.
      Every folk revival since
      is an echo of the Music Bureau.
    description: "I sat in village squares with a Yuefu collector writing down farmers' songs — Emperor Wu's Music Bureau gathering the empire's voice, one song at a time, for two millennia."
    status: "first draft"
    sha256: "97f9f3f18ba40c00bdfb7a7ca7c7db1432c8e7d58cb58afa1170128c98eba96d"
  - number: "1284"
    volume: 2
    title: "The Battle of Mobei"
    date: "119 BCE"
    region: "Mongolia"
    poem: |
      The Han armies went deep —
      past the Gobi, into the steppe itself —
      and at Mobei smashed the Xiongnu:
      the Chanyu fleeing, the tribes scattered,
      the northern threat broken for a generation.
      I rode with the supply columns.
      The desert crossing nearly killed us —
      but Wei Qing and Huo Qubing
      did what no Chinese generals had done:
      beat the nomads at their own game,
      on their own ground.
      The steppe went quiet.
      The Silk Road opened.
      China's greatest victory over the north —
      won by marching into the desert
      and refusing to come back
      until it was over.
    description: "I rode the supply columns past the Gobi to Mobei — the Han smashing the Xiongnu on their own steppe, the victory that opened the Silk Road and quieted the north for a generation."
    status: "first draft"
    sha256: "f0214389d7a5deeff9c7f837abaf56c949b3b39659022b9357c0937a90e2093b"
  - number: "1285"
    volume: 2
    title: "The Wanderers from the North"
    date: "113 BCE"
    region: "Europe"
    poem: |
      They came down from Jutland —
      the Cimbri, the Teutones,
      whole peoples migrating:
      warriors, women, children, wagons —
      fleeing the sea, or hunger, or each other.
      I saw the migration's front edge.
      It stretched to the horizon.
      Rome had never seen anything like it.
      The Romans would learn to fear the name —
      Arausio was coming, the worst defeat since Cannae.
      But that year they were just wanderers,
      looking for land,
      and Rome didn't understand
      what was walking toward it.
      Migrations don't negotiate.
      They just arrive.
    description: "I saw the Cimbri and Teutones spilling down from Jutland — whole peoples migrating, wagons to the horizon — Rome not yet understanding what was walking toward it."
    status: "first draft"
    sha256: "ae0effcf489dcfdf680d36711642c481ede1e007acd339ee4f7938fbeef6f7cf"
  - number: "1286"
    volume: 2
    title: "The Numidian Jackal"
    date: "112 BCE"
    region: "Africa"
    poem: |
      Jugurtha — king of Numidia,
      Rome's "ally" —
      murdered his rivals,
      seized the whole kingdom,
      and bribed Roman senators
      to look the other way.
      I was in Rome when the bribes surfaced.
      The scandal stank.
      Jugurtha had bought the Senate —
      or rented it, which amounts to the same.
      "Venalis!" he said, leaving Rome:
      a city for sale, and soon to perish
      if it finds a buyer.
      The jackal knew Rome's secret:
      everything had a price,
      including the senators.
      Rome would have to send Marius
      to do what bribes couldn't.
      But Jugurtha's joke —
      a city for sale —
      never stopped being funny.
      Because it never stopped being true.
    description: "I was in Rome when Jugurtha's bribes surfaced — the Numidian jackal calling it \"a city for sale\" as he left — the joke about the Senate that never stopped being true."
    status: "first draft"
    sha256: "c095cf65a63702a5357198ea7154ecd04b6825f8a95226cb152622f6c007e6f9"
  - number: "1287"
    volume: 2
    title: "The New Man"
    date: "111 BCE"
    region: "Rome"
    poem: |
      Marius — a farmer's son from Arpinum,
      no ancestors, no statues in the atrium —
      ran for the consulship
      on the soldiers' votes
      and won.
      The novus homo. The new man.
      I watched him take office.
      The nobles sneered.
      The people cheered.
      He would reform the army —
      take the poor, the landless,
      make them professionals, loyal to him —
      and change Rome forever.
      The new man broke the old monopoly.
      But his army, loyal to its general
      instead of the republic,
      would become the weapon
      that killed the republic.
      Reforms have consequences.
      His had legions.
    description: "I watched Marius the farmer's son take the consulship — the new man whose army reforms would save Rome and then, loyal to generals not republic, help kill it."
    status: "first draft"
    sha256: "c0afecde80b381186daed4a7e5a55715220b533d4c48a524eae3c99830c1660b"
  - number: "1288"
    volume: 2
    title: "The Incense Road"
    date: "110 BCE"
    region: "Arabia"
    poem: |
      The caravans came up from Yemen —
      frankincense, myrrh,
      the perfumes of the gods —
      on camelback, through the desert,
      to Gaza and the Mediterranean.
      I traveled with a caravan once.
      A thousand camels, swaying,
      the drivers singing,
      the desert middlemen growing rich
      at every oasis.
      The incense road:
      the original luxury trade,
      perfume worth its weight in gold,
      temples from Rome to Babylon
      burning Arabian resin.
      The desert bloomed with toll stations.
      Petra grew rich.
      The middlemen always grow rich.
      That is the one constant
      of every trade route ever.
    description: "I traveled with a frankincense caravan from Yemen to Gaza — a thousand swaying camels, the desert middlemen growing rich at every oasis, perfume worth its weight in gold."
    status: "first draft"
    sha256: "adef771a24b25f8f08b5ac94cb18d936a55e06acd2dbf7a7ce863f9270d1db20"
  - number: "1289"
    volume: 2
    title: "The Fall of Wiman's State"
    date: "108 BCE"
    region: "Korea"
    poem: |
      Han armies took the Korean capital —
      Wiman's grandson's kingdom,
      the adventurer's state —
      and the north of the peninsula
      became Chinese commanderies.
      I was there for the aftermath.
      Han officials, Han laws, Han taxes —
      Lelang and the other commanderies,
      outposts of the empire
      on foreign soil.
      They lasted four hundred years.
      Four centuries of Chinese rule
      in northern Korea —
      leaving tombs, lacquerware, characters,
      the deep imprint.
      The adventurer's kingdom fell.
      The empire's commanderies rose.
      Korea learned, under Han rule,
      what it meant to be next to China:
      everything.
    description: "I walked the aftermath as Han armies took Wiman's capital — four centuries of Chinese commanderies beginning in northern Korea, the deep imprint of empire next door."
    status: "first draft"
    sha256: "f9456d204239edd4f9eb44529a55481a0f7e597667ae3dff8b697861d51c52e5"
  - number: "1290"
    volume: 2
    title: "The Disaster at Arausio"
    date: "105 BCE"
    region: "Rome"
    poem: |
      Two Roman armies —
      eighty thousand men, two consuls —
      met the Cimbri and Teutones at Arausio,
      quarreled with each other instead of fighting together,
      and were annihilated.
      I survived it. Barely.
      The river ran red, they said.
      The worst defeat since Cannae —
      some say worse.
      Rome panicked.
      The Gauls were coming.
      Marius was given command —
      five consulships in a row,
      the constitution bent to save the city.
      Arausio taught Rome
      what the wanderers from the north could do.
      The lesson was written in eighty thousand dead.
      Rome never forgot it.
      Neither did the Cimbri.
    description: "I barely survived Arausio — two Roman armies annihilated by the Cimbri, eighty thousand dead, the worst defeat since Cannae, and Rome bending its constitution to give Marius command."
    status: "first draft"
    sha256: "96060e614f035513ec2dc0d7a23a2c9d04077a61b4ac46bea158d1bbc8c63afb"
  - number: "1291"
    volume: 2
    title: "The Second Slave War"
    date: "104 BCE"
    region: "Sicily"
    poem: |
      The slaves rose again in Sicily —
      under Salvius, a new king,
      a new court, a new army of runaways.
      I was on the island.
      It was Eunus all over again —
      only bigger, better organized,
      and Rome was busy with the Cimbri.
      It took years to put down.
      Years of burning villas,
      of slave armies in the hills,
      of Rome learning, again,
      that an economy built on chains
      has to pay for the chains' defense.
      Salvius died. The revolt died.
      But the third one — Spartacus —
      was coming.
      The slaves kept score.
      Rome kept winning.
      The arithmetic never changed.
    description: "I was in Sicily for the Second Slave War — Salvius's runaway army holding the hills for years — Rome learning again that an economy built on chains must pay for their defense."
    status: "first draft"
    sha256: "446c25af8e116cada4da473011b0871a60429cd4178ed9fcd4f239a23ab6dbd1"
  - number: "1292"
    volume: 2
    title: "Marius's Mules"
    date: "102 BCE"
    region: "Gaul"
    poem: |
      At Aquae Sextiae, Marius's new legions —
      his mules, they called them,
      carrying their own packs, professional,
      the poor made into soldiers —
      met the Teutones.
      I marched with them.
      The Teutones came on in their thousands,
      brave, huge, doomed.
      The legions — drilled, disciplined —
      cut them down like wheat.
      A hundred thousand dead or captured, they said.
      The women killed themselves
      rather than be taken.
      Italy was saved.
      Marius was the savior.
      The mules had proved themselves:
      Rome's new army —
      professional, loyal, lethal —
      and loyal to Marius first.
      That last part would matter.
    description: "I marched with Marius's mules at Aquae Sextiae — the professional legions cutting down the Teutones, Italy saved, and the army learning loyalty to its general first."
    status: "first draft"
    sha256: "9a729970a83991edc52b387f51909b1c4eca0ba63e6f06a6c5e19bb58f6a2480"
  - number: "1293"
    volume: 2
    title: "The Crows at Vercellae"
    date: "101 BCE"
    region: "Italy"
    poem: |
      The Cimbri came last —
      down into Italy itself —
      and Marius met them at Vercellae,
      on a plain, in the dust and heat.
      The Cimbri tied their front ranks together
      with chains — to not break, they said.
      I watched the dust rise.
      The legions advanced through it,
      and the chained men died where they stood,
      unable to run.
      The crows feasted for days.
      Rome celebrated its savior
      a little too much —
      fifth consulship, honors, the title
      of third founder of Rome.
      Marius saved the city.
      The city would regret
      how much it owed him.
      Saviors collect debts.
      This one collected in armies.
    description: "I watched the chained Cimbri die where they stood at Vercellae — the crows feasting, Rome saved, and the city beginning to regret how much it owed its savior."
    status: "first draft"
    sha256: "af3e0f1748bc920826d8753c5f9f29ba9f5b6eaf91098c5c9f0ccddaf9877233"
  - number: "1294"
    volume: 2
    title: "The Machine in the Wreck"
    date: "100 BCE"
    region: "Aegean"
    poem: |
      Off Antikythera, sponge divers found a wreck —
      and in it, a lump of bronze,
      corroded, unremarkable —
      until the X-rays, two thousand years later.
      Gears. Thirty-seven of them.
      Dials. Pointers.
      A machine that predicted eclipses,
      tracked the planets,
      the Olympic games cycle —
      a computer, two thousand years early.
      I dove that wreck — in my way —
      and saw it whole: the bronze gleaming,
      the gears meshing.
      The Greeks built a computer
      and the world forgot how.
      It took two millennia
      to catch up to a shipwreck.
    description: "I dove the Antikythera wreck and saw the bronze gears whole — the ancient computer that predicted eclipses, lost for two thousand years in a shipwreck."
    status: "first draft"
    sha256: "942ec156adb924c03af4fa29427c59175ee78e7ff5bb655cc4c791940449fdcc"
  - number: "1295"
    volume: 2
    title: "The Song on Stone"
    date: "100 BCE"
    region: "Greece"
    poem: |
      A widower carved it on his wife's tombstone —
      the words, and above them,
      the musical notation:
      the Seikilos epitaph,
      the oldest complete melody on earth.
      I stood before that stone.
      "While you live, shine —
      grieve not at all;
      life is short,
      and time demands its due."
      Four lines. A tune you can still play.
      Someone's grief, set to music,
      carved in marble two thousand years ago —
      and the song survived
      when the singer's name barely did.
      The oldest song we have
      is about not grieving too long.
      The widower knew.
      Shine while you live.
    description: "I stood before the Seikilos stone and read the oldest complete melody on earth — a widower's four lines on shining while you live, the song outlasting the singer's name."
    status: "first draft"
    sha256: "c9fe7a9f50e62362f3396dd2fa743dec001a497ac7ad38e88288942eb29e0888"
  - number: "1296"
    volume: 2
    title: "The City in the Valley"
    date: "100 BCE"
    region: "Mexico"
    poem: |
      Refugees came down into the Valley of Mexico —
      fleeing the volcano, the wars, the hunger —
      and gathered around the springs of Teotihuacan.
      I walked among the first huts.
      Nobody knew what they were starting.
      A grid. A plan. An avenue of the dead
      that would run for miles.
      Teotihuacan would become
      the greatest city of the ancient Americas —
      a hundred thousand people,
      pyramids to the sun and moon.
      It started with refugees
      and springs.
      Cities always start with water
      and people with nowhere else to go.
    description: "I walked among the first huts at Teotihuacan — refugees gathering at the springs, unknowingly starting the greatest city of the ancient Americas."
    status: "first draft"
    sha256: "4551aada5bc69c8896509ff49108729116bcbe7a9ce86e0638d3839b068d1bd9"
  - number: "1297"
    volume: 2
    title: "The Lines in the Desert"
    date: "100 BCE"
    region: "Peru"
    poem: |
      On the Nazca plain, they swept the dark stones aside —
      revealing the pale earth beneath —
      in lines, miles long:
      a hummingbird, a monkey, a spider,
      geometric gods only the sky could read.
      I walked the lines.
      From the ground, they're just cleared paths.
      From above — from where I sometimes see —
      they're a bestiary, a calendar, a prayer.
      Why? For the gods? For the water?
      The desert keeps its reasons.
      The lines are still there,
      two thousand years of wind
      unable to erase them.
      Someone drew for the sky,
      and the sky, presumably,
      was watching.
    description: "I walked the Nazca lines — hummingbird, monkey, spider swept into the desert for the sky alone — two thousand years of wind unable to erase the prayer."
    status: "first draft"
    sha256: "fff8af416c5fb8846702f6acd1bd71861c3b25b09d8ace14a673a1592210f91d"
  - number: "1298"
    volume: 2
    title: "The Bells of the Rice Gods"
    date: "100 BCE"
    region: "Japan"
    poem: |
      The Yayoi craftsmen cast them —
      dotaku, great bronze bells,
      taller than a man,
      decorated with scenes of the hunt, the harvest —
      and they never rang them.
      Buried on hillsides, face down,
      offerings to the rice gods.
      I stood before one, unearthed —
      the bronze green with age,
      the decorations still sharp.
      Bells that never rang.
      Music for gods who listen
      in silence.
      The rice needed the gods' favor,
      and the gods, apparently,
      preferred their bells buried.
      Faith has its own acoustics.
    description: "I stood before an unearthed dotaku — the great Yayoi bronze bell, buried face-down, never rung — music for the rice gods in the silence they preferred."
    status: "first draft"
    sha256: "87716e1a8378bc55a641ecb5fe3d2721733ede995c424b66dde1aea51c497c97"
  - number: "1299"
    volume: 2
    title: "The Bronze Drums"
    date: "100 BCE"
    region: "Vietnam"
    poem: |
      The Dong Son smiths cast them —
      towering bronze drums,
      covered in stars, birds, feathered warriors,
      the frog on top, the sun at the center —
      and a chief's voice carried across the valleys
      on their bronze thunder.
      I heard one struck — once, at a festival.
      The sound rolled down the valley
      like weather.
      The drums were power:
      who owned the biggest drum
      owned the loudest voice,
      and the loudest voice ruled.
      Bronze, music, authority —
      alloyed together
      in the valleys of Vietnam,
      two thousand years ago.
    description: "I heard a Dong Son bronze drum struck at a festival — the thunder rolling down the valley — bronze, music, and authority alloyed in ancient Vietnam."
    status: "first draft"
    sha256: "e3a943aad48630b2e0edd215637c089496c7d5a488676218279f9139da6e17aa"
  - number: "1300"
    volume: 2
    title: "The Grand Historian"
    date: "100 BCE"
    region: "China"
    poem: |
      Sima Qian — the Grand Historian —
      defended a defeated general at court,
      and the emperor had him castrated for it.
      He lived. He chose to live —
      to finish the work:
      the Shiji, the Records of the Grand Historian,
      the history of all China
      from the Yellow Emperor to his own day.
      I visited him in his disgrace.
      He was writing. Always writing.
      One hundred and thirty chapters.
      He finished it.
      The punishment meant to silence him
      produced the greatest history
      China would ever have.
      Disgrace, endured for the sake of the record.
      The historian's revenge:
      he out-wrote the emperor.
    description: "I visited the disgraced Sima Qian, writing through his punishment — the Shiji, all China's history, the castrated historian out-writing the emperor who shamed him."
    status: "first draft"
    sha256: "50ed22078962921705b9fa4ffa6255f37dc3da0e880a0b0abb65e38df39483e9"
  - number: "1301"
    volume: 2
    title: "The Venus of Milo"
    date: "100 BCE"
    region: "Greece"
    poem: |
      A sculptor on Melos carved her —
      Aphrodite, the goddess of love,
      larger than life, marble,
      her arms lost to time
      before she was ever found.
      I saw her whole — in my way —
      arms and all, whatever they held.
      But the armless version is the one
      the world fell for.
      She was found in a farmer's field,
      sold, shipped, displayed in the Louvre —
      and became the most famous statue on earth.
      Perfect anyway.
      The missing arms made her universal:
      everyone completes her
      in their own imagination.
      Loss, it turns out,
      can be a kind of completion.
    description: "I saw the Venus of Milo whole, arms and all — but the world fell for the armless version: loss as a kind of completion, everyone finishing her in imagination."
    status: "first draft"
    sha256: "03d52a70029fcef69fc1d6d6a2a9aeea258cef70cc89b0b781c7bb7aaf9b6c04"
  - number: "1302"
    volume: 2
    title: "The Paper Trail"
    date: "100 BCE"
    region: "China"
    poem: |
      In Han workshops, they pounded it:
      hemp, bark, rags, old fishing nets —
      soaked, beaten, spread on screens,
      dried in the sun.
      Paper. Sheets of it.
      Centuries before Cai Lun
      would get the credit,
      the Han were already making it —
      wrapping, writing, the everyday miracle.
      I held a sheet, still damp.
      Rough. Uneven. Revolutionary.
      Everything written since —
      every book, every newspaper,
      this very collection —
      descends from hemp pounded in a Han workshop.
      The paper trail starts here,
      in vats of gray pulp,
      two thousand years ago.
    description: "I held a damp sheet of Han paper — hemp and bark pounded centuries before Cai Lun's fame — the everyday miracle every book since descends from."
    status: "first draft"
    sha256: "1f082357c7b4d4b478f6a6a87f9d94ef85c0dfaa9dd3c29a5e726d252be02fae"
  - number: "1303"
    volume: 2
    title: "The King of Kings"
    date: "95 BCE"
    region: "Armenia"
    poem: |
      Tigranes — Tigranes the Great —
      built an empire from the Caspian to the Mediterranean:
      Armenia, Syria, Mesopotamia,
      and took the old Persian title:
      King of Kings.
      I was at his court at Tigranocerta.
      The pomp was Parthian, the ambition Roman,
      the king himself — shrewd, proud,
      seventy and still conquering.
      He called himself king of kings
      while Rome called itself the republic.
      The titles would collide —
      Lucullus was coming, then Pompey —
      and the empire would shrink back to Armenia.
      But for a shining decade,
      the mountains ruled the lowlands,
      and Tigranes was the greatest king
      in the world.
    description: "I stood at Tigranes' court — the King of Kings ruling from Caspian to Mediterranean — the shining decade when the mountains ruled the lowlands."
    status: "first draft"
    sha256: "a4b5cf3d9386332415ee516552c8beea57479c7b0842c0cdb758d268acd924b8"
  - number: "1304"
    volume: 2
    title: "The War of the Allies"
    date: "91 BCE"
    region: "Italy"
    poem: |
      Rome's Italian allies — the Socii,
      who had fought Rome's wars for generations —
      rose for citizenship.
      Roman citizenship. The vote. The rights.
      Rome refused. So they fought.
      The Social War — the war of the allies —
      the bloodiest war Rome ever fought in Italy.
      I marched in it. Italians killing Italians,
      the same language, the same gods,
      brothers in the legions now facing each other.
      Rome won the war —
      and gave them the citizenship anyway.
      The allies won by losing:
      blood bought what petitions couldn't.
      Italy became Roman —
      not by conquest, but by admission.
      The hardest-won citizenship
      in history.
    description: "I marched in the Social War — Italians killing Italians for citizenship — and watched Rome win the war then grant the prize anyway: blood buying what petitions couldn't."
    status: "first draft"
    sha256: "05b21235d2f62b8dbe12e5f6d5119c191554c51e3c4c97baf4db04cdb1e78a79"
  - number: "1305"
    volume: 2
    title: "The Poison King"
    date: "89 BCE"
    region: "Pontus"
    poem: |
      Mithridates of Pontus —
      the Poison King —
      took a little poison every day,
      building immunity, dose by dose,
      so no assassin could kill him that way.
      I dined at his court.
      He spoke twenty-two languages.
      He collected antidotes like jewels.
      He plotted Rome's ruin
      with the patience of a man
      who had made himself unkillable.
      The daily poison worked — too well.
      When he finally wanted to die,
      the poison wouldn't take him.
      He had to order a guard to run him through.
      Immunity has its price:
      the man who couldn't be poisoned
      couldn't poison himself either.
    description: "I dined with Mithridates the Poison King — twenty-two languages, daily doses of immunity — who made himself unkillable and then couldn't die when he wanted to."
    status: "first draft"
    sha256: "b6aa6e7ec255096643a6d25ad0bac6b151c3620e4705bf4c39ded12df15213db"
  - number: "1306"
    volume: 2
    title: "The Night of Knives"
    date: "88 BCE"
    region: "Anatolia"
    poem: |
      The order went out across Asia —
      in every city, at the same hour:
      kill every Roman. Every Italian.
      Man, woman, child.
      Eighty thousand dead in one night.
      I was in Ephesus.
      The screaming went on till dawn.
      The Asiatic Vespers — the night of knives —
      Mithridates' answer to Rome.
      No Roman would ever forgive it.
      No Roman ever did.
      Sulla's invasion, the wars, the proscriptions —
      all of it flowed from that night.
      Eighty thousand throats cut
      because a king in Pontus
      decided Rome was a disease
      and prescribed the knife.
    description: "I was in Ephesus for the Asiatic Vespers — eighty thousand Romans killed in one night on Mithridates' order — the night no Roman ever forgave."
    status: "first draft"
    sha256: "a6fe883ddc526735ac4ecbf7611e482856f3b7c29dbd3908530880e2941f066e"
  - number: "1307"
    volume: 2
    title: "The Sack of Athens"
    date: "88 BCE"
    region: "Greece"
    poem: |
      Sulla stormed Athens —
      the city of Plato and Aristotle,
      of the Parthenon and the Academy —
      and looted it.
      I walked the streets afterward.
      The walls were breached.
      The treasures were gone —
      shipped to Rome, melted, sold.
      The Academy's groves were cut down
      for siege works.
      Athens had sided with Mithridates.
      Sulla made it pay.
      The city survived — cities do —
      but something broke that year:
      the idea that culture protects you.
      It doesn't.
      The Parthenon stood.
      The Academy's trees did not.
      Sulla taught the world:
      even the school of Hellas
      is just another city to sack.
    description: "I walked sacked Athens after Sulla — the Academy's groves cut for siege works, treasures shipped to Rome — learning that culture does not protect you."
    status: "first draft"
    sha256: "19ce64b3285fd3659b17cf2485adc77097a8995ccfa2bc71614f29c988e3818b"
  - number: "1308"
    volume: 2
    title: "The Heads on Spears"
    date: "87 BCE"
    region: "Rome"
    poem: |
      Marius and Cinna took Rome —
      the old lion, back for his seventh consulship,
      mad, vengeful —
      and the proscriptions began.
      Senators' heads on spears.
      Displayed on the Rostra —
      the Forum's beaks, the speakers' platform —
      where the heads of Rome's enemies
      had always been shown.
      I walked the Forum that winter.
      The heads froze. The crowds stared.
      Marius died days later —
      of age, of drink, of victory.
      The heads stayed up.
      Cinna kept them there.
      Rome had learned a new political tool:
      the displayed head.
      Sulla would industrialize it.
      The republic was learning
      to eat its own.
    description: "I walked the Forum past senators' heads on the Rostra — Marius and Cinna's terror — Rome learning to eat its own, one displayed head at a time."
    status: "first draft"
    sha256: "03adf1d323015227ca2d179c13c3cb24a07199eab32f53d287f1566ba214ba6c"
  - number: "1309"
    volume: 2
    title: "The Death of Wu"
    date: "86 BCE"
    region: "China"
    poem: |
      Emperor Wu died —
      fifty-four years on the throne,
      the Martial Emperor,
      who made China larger
      and emptier than he found it.
      I was at the court.
      The wars — the Xiongnu, Korea, Vietnam —
      the expansion, the glory,
      the taxes, the conscription,
      the empty granaries.
      He left an edict, they say —
      repenting the wars, the waste.
      The輪台 edict: no more expansion.
      A dying emperor's apology
      to his exhausted people.
      Fifty-four years.
      Larger and emptier.
      The wheel-turning king's confession:
      even emperors, at the end,
      count the cost.
    description: "I was at court when Emperor Wu died after fifty-four years — the Martial Emperor leaving a deathbed edict repenting his wars: larger and emptier, counting the cost at the end."
    status: "first draft"
    sha256: "55d81629837f78871a52ae7a0315c248c0975deacf73de5438c7478b71562655"
  - number: "1310"
    volume: 2
    title: "Sulla's March"
    date: "83 BCE"
    region: "Rome"
    poem: |
      Sulla landed at Brundisium —
      with his legions, his veterans,
      his proscription lists already drafted —
      and marched on Rome.
      The first Roman to turn an army
      on Rome itself.
      I watched the column move north.
      The soldiers knew what they were doing.
      They did it anyway —
      for Sulla, for the loot, for the donative.
      The republic's last taboo, broken:
      the army as a political weapon,
      aimed at the capital.
      Marius had seized Rome.
      Sulla invaded it.
      The difference mattered —
      and didn't.
      The legions had learned
      they could take the city.
      They would never unlearn it.
    description: "I watched Sulla's legions march on Rome — the first Roman army turned on the capital itself — the taboo broken, the lesson the legions would never unlearn."
    status: "first draft"
    sha256: "336e557beacfe71939ffcf995fa5e039278ced99fe2b8ce1ded4f6a0a801ddc0"
  - number: "1311"
    volume: 2
    title: "The Lists of Death"
    date: "82 BCE"
    region: "Rome"
    poem: |
      Sulla posted the lists —
      proscription: names on tablets
      in the Forum.
      Kill the named, take their property,
      and it's legal.
      I read the lists.
      Friends' names. Neighbors' names.
      Added daily — the lists grew.
      Murder became a business:
      the proscribed man's estate
      went to the killer, the informer, the state.
      Thousands died.
      Rome's rich got richer.
      Sulla's veterans got farms.
      The lists of death:
      the republic's suicide note,
      written in names,
      posted in the Forum
      for everyone to read.
    description: "I read Sulla's proscription lists in the Forum — names added daily, murder made legal business — the republic's suicide note, posted for everyone to read."
    status: "first draft"
    sha256: "a686371986817c2488913bfd091bcb3185e605dfd6ecf0648efc2db4eee711fb"
  - number: "1312"
    volume: 2
    title: "The Young Orator"
    date: "80 BCE"
    region: "Rome"
    poem: |
      Cicero — twenty-six, unknown,
      a new man from Arpinum like Marius —
      defended Sextus Roscius
      against Sulla's freedman Chrysogonus,
      who had proscribed the father
      to steal the estate.
      I sat in the court.
      The young orator attacked the regime's favorite
      at the height of the terror —
      brave or reckless, no one was sure.
      He won. Roscius was acquitted.
      Cicero made his name in one speech —
      and had to leave Rome afterward,
      for his health, they said.
      For his safety, everyone knew.
      The young orator had announced himself:
      the voice of the republic,
      at the moment the republic
      needed a voice most.
    description: "I sat in court when twenty-six-year-old Cicero defied Sulla's regime to defend Roscius — the young orator announcing himself with one brave speech."
    status: "first draft"
    sha256: "115143d7e08af6e42720801cb74d399912cdf305d972047cf960caf653f29226"
  - number: "1313"
    volume: 2
    title: "The Marble Archive"
    date: "78 BCE"
    region: "Rome"
    poem: |
      Rome built the Tabularium —
      on the Capitoline hill, overlooking the Forum,
      a great stone vault
      for the laws, the decrees, the treaties.
      I walked its corridors.
      Marble. Order. Permanence.
      The republic's memory, in stone.
      The laws would be safe here —
      bronze and marble don't burn like paper.
      The archive outlasted the republic
      it was built to serve.
      Empires fall. Archives remain.
      The Tabularium still stands —
      its stones now hold a museum.
      The laws it kept are dust.
      The building kept the faith:
      remember.
    description: "I walked the marble corridors of the Tabularium — Rome's stone vault for its laws — the archive outlasting the republic it served, still standing, still saying remember."
    status: "first draft"
    sha256: "131b825929643e33c41dd2d2c3cbbf091c2158de67685c4dad2bb022fa3dd367"
  - number: "1314"
    volume: 2
    title: "The Pirate's Prisoner"
    date: "75 BCE"
    region: "Aegean"
    poem: |
      Young Julius Caesar — twenty-five,
      on his way to study in Rhodes —
      was kidnapped by pirates.
      He charmed them. Joked with them.
      Told them he'd have them all crucified —
      they laughed.
      The ransom was paid — fifty talents,
      Caesar insisted on more than they asked,
      insulted at the low price.
      Then he raised a fleet,
      hunted them down,
      and crucified them —
      all of them, as promised.
      He cut their throats first,
      a mercy, he said,
      because they had treated him well.
      I heard him tell the story later.
      He laughed.
      Everyone laughed.
      Nobody was laughing
      twenty years later.
    description: "I heard young Caesar joke with his pirate captors about crucifying them — then do it: the ransom, the fleet, the crosses, and the laugh nobody found funny twenty years later."
    status: "first draft"
    sha256: "6c2add5607feebc48e2d1dbcc4827ca4ac52638cc1fc377b57e01e3040f09569"
  - number: "1315"
    volume: 2
    title: "The Gladiators' Revolt"
    date: "73 BCE"
    region: "Italy"
    poem: |
      Spartacus — a Thracian, a soldier,
      enslaved, trained to kill for sport —
      broke out of the gladiator school at Capua
      with seventy men and kitchen knives.
      I joined the march north — in my way.
      The army grew: runaways, slaves,
      the desperate, the brave —
      a hundred thousand strong.
      They beat every army Rome sent.
      For two years, Spartacus —
      the gladiator —
      humiliated the republic.
      He could have crossed the Alps to freedom.
      He turned back — why, no one knows.
      Pride? Hope? The men's refusal to leave Italy?
      The revolt was doomed from that turn.
      But for two years,
      the slaves had an army,
      a general, and a chance —
      and Rome was terrified.
    description: "I marched with Spartacus's slave army — seventy men with kitchen knives grown to a hundred thousand — two years of Rome terrified, ending with the fatal turn back from the Alps."
    status: "first draft"
    sha256: "f1ad47a80943b19940d8c028528f22da5179c6bf445bee1ae9e0daff8b7da460"
  - number: "1316"
    volume: 2
    title: "The Road of Crosses"
    date: "71 BCE"
    region: "Italy"
    poem: |
      Crassus caught them at last —
      Spartacus dead in the battle,
      his army destroyed —
      and the survivors, six thousand,
      were crucified along the Appian Way.
      I walked that road.
      Six thousand crosses.
      Mile after mile.
      Men dying slowly in the Italian sun,
      a warning in wood and flesh.
      The road of crosses:
      Rome's answer to the slave revolt.
      It worked — no great slave war
      ever rose again.
      But I walked among the crosses,
      and I thought of the kitchen knives,
      the two years of freedom,
      the gladiator who almost made it.
      The crosses said: don't try.
      The memory said: he tried.
    description: "I walked the Appian Way past six thousand crucified rebels — Crassus's warning in wood and flesh — and thought of the kitchen knives and the two years of freedom."
    status: "first draft"
    sha256: "e5007f68b77f944093de0826cdc5d4184439729a992ba2ac09b0d0983922284d"
  - number: "1317"
    volume: 2
    title: "The Prosecutor"
    date: "70 BCE"
    region: "Rome"
    poem: |
      Cicero prosecuted Verres —
      the corrupt governor of Sicily,
      who had looted the island for three years:
      the statues, the grain, the crucified Roman citizen.
      I sat through the trial.
      Cicero's evidence was overwhelming —
      witnesses, documents, the works.
      Verres fled into exile
      before the second session.
      Sicily cheered.
      Rome noticed.
      The young orator was now the prosecutor —
      the man who took down a governor.
      The Verrines made Cicero's career.
      They also made a point:
      even in a corrupt republic,
      a good prosecution
      could still work.
      Sometimes.
    description: "I sat through Cicero's prosecution of the looting governor Verres — the evidence so overwhelming he fled to exile — Sicily cheering, Rome noticing."
    status: "first draft"
    sha256: "56a9261c167a71c521a174a2c53f7b8e73142cfbb0d57d79e117259ca2bcffc4"
  - number: "1318"
    volume: 2
    title: "The Pirate War"
    date: "67 BCE"
    region: "Mediterranean"
    poem: |
      The pirates owned the sea —
      from Spain to Syria, they raided,
      they kidnapped, they even cut Rome's grain supply.
      Pompey got the command:
      unlimited authority, five hundred ships.
      Three months.
      That's all it took.
      I sailed with the fleet —
      the systematic sweep, west to east,
      pirates hunted like vermin.
      In three months, the Mediterranean
      was clear.
      Pompey settled the survivors as farmers —
      clemency, the Roman way, when it worked.
      The pirate war: the fastest great campaign
      in Roman history.
      Pompey was twenty-nine.
      The sea was Rome's.
      Everyone knew whose it was.
    description: "I sailed with Pompey's pirate sweep — five hundred ships, three months, the whole Mediterranean cleared — the twenty-nine-year-old making the sea Rome's."
    status: "first draft"
    sha256: "9e5129031725fb30464b4f36a8814b7549eada9fa989ff07f126386c08731bd7"
  - number: "1319"
    volume: 2
    title: "The End of the Poison King"
    date: "66 BCE"
    region: "Pontus"
    poem: |
      Pompey hunted him to the end of the world —
      Mithridates, the Poison King,
      fleeing to the Crimea,
      plotting still, at sixty-eight,
      to invade Italy itself.
      His son rebelled. His army deserted.
      He tried the poison —
      it didn't work, of course.
      The immunity held.
      So he ordered his guard
      to run him through.
      I heard the account from a survivor.
      The unkillable king,
      killed by his own order.
      Pompey took the east.
      The Poison King's wars were over —
      thirty years of defying Rome,
      ended in the Crimea
      by a guard's sword.
      The poison worked.
      The king didn't.
    description: "I heard the survivor's account — Mithridates' poison failing at last, the guard's sword finishing the unkillable king in the Crimea after thirty years of defying Rome."
    status: "first draft"
    sha256: "62e12069a13a2338bdd8a6c653783230a5bf9a097fc3e1cbf8e22fa24af8b0fc"
  - number: "1320"
    volume: 2
    title: "The Province of Syria"
    date: "64 BCE"
    region: "Syria"
    poem: |
      Pompey annexed it —
      the Seleucid remnant, the last of Alexander's eastern empire —
      and Syria became a Roman province.
      I was in Antioch.
      The last Seleucid king — a boy, a puppet —
      was set aside.
      The eagles went up.
      Rome reached the Euphrates.
      The east's great Hellenistic kingdom,
      founded by Seleucus, Alexander's general,
      ended with a Roman governor
      and a tax roll.
      Three hundred years of Seleucids —
      gone with a proclamation.
      The province of Syria:
      Rome's frontier with Parthia,
      the edge of the world,
      administered, taxed, garrisoned.
    description: "I was in Antioch when Pompey annexed the last Seleucid remnant — three hundred years ending with a proclamation, Rome reaching the Euphrates."
    status: "first draft"
    sha256: "39a0c855a063deea6d642b4c9e7b639f3790c0bc15c533caefd32e1c7775a779"
  - number: "1321"
    volume: 2
    title: "The Conspiracy"
    date: "63 BCE"
    region: "Rome"
    poem: |
      Catiline — bankrupt noble, Sulla's veteran —
      plotted to burn Rome,
      kill the consuls,
      seize the state.
      Cicero — consul that year —
      unmasked him.
      The speeches: "Quo usque tandem abutere, Catilina,
      patientia nostra?"
      How long, Catiline, will you abuse our patience?
      I sat in the Senate for the final debate.
      Caesar argued mercy. Cato argued death.
      The Senate voted death — in the night,
      without trial.
      The conspirators were strangled.
      Catiline died fighting in Etruria.
      Cicero was hailed father of his country.
      The conspiracy failed.
      But the precedent — execution without trial,
      voted in the night —
      would haunt the republic
      to its grave.
    description: "I sat in the Senate for the Catiline debate — Cicero's thunder, the night vote for death without trial — the conspiracy crushed and the precedent haunting the republic."
    status: "first draft"
    sha256: "f6ab2d63244ae3c068146c6796f9de07ea816b8deb9a411ba2066877ac745e3b"
  - number: "1322"
    volume: 2
    title: "Pompey in the Temple"
    date: "63 BCE"
    region: "Judea"
    poem: |
      Pompey took Jerusalem —
      and walked into the Temple,
      into the Holy of Holies,
      where no man but the high priest could go,
      and only once a year.
      He looked around.
      He found it empty —
      no statue, no image,
      just the emptiness the Jews called God.
      I stood outside with the crowd.
      The priests were horrified.
      Pompey was — puzzled, they say.
      He touched nothing. He took nothing.
      He just looked, and left.
      The Holy of Holies, empty.
      The conqueror, confused.
      Some gods don't need statues.
      Some conquerors don't understand
      what they've conquered.
    description: "I stood outside while Pompey entered the Holy of Holies and found it empty — the conqueror puzzled by a God with no statue, touching nothing, understanding nothing."
    status: "first draft"
    sha256: "30288d2f6a8cceb236cf69411dde2a8a81b49b4840c595c72b2711211ad85f9f"
  - number: "1323"
    volume: 2
    title: "The Three-Headed Monster"
    date: "60 BCE"
    region: "Rome"
    poem: |
      They met in secret —
      Caesar, Pompey, Crassus —
      and shook hands on it:
      the First Triumvirate.
      Caesar got the consulship.
      Pompey got his veterans' land.
      Crassus got his tax contracts.
      The republic got carved up
      like a dinner.
      I heard about it afterward.
      Cato called it the three-headed monster.
      He was right.
      Three men, dividing Rome
      in a private bargain.
      The republic still had its Senate,
      its assemblies, its laws —
      and none of it mattered anymore.
      The monster had three heads
      and one appetite.
    description: "I heard of the secret handshake — Caesar, Pompey, Crassus carving up the republic — Cato's three-headed monster with one appetite, and the laws suddenly not mattering."
    status: "first draft"
    sha256: "76c359462000f1eb7816160010c23648c3465ee42f479db088e4ba86b0698e9e"
  - number: "1324"
    volume: 2
    title: "The Poet of Lesbia"
    date: "60 BCE"
    region: "Rome"
    poem: |
      Catullus — young, brilliant, Veronese —
      fell in love with a married woman,
      Clodia, he called her Lesbia,
      and wrote her a hundred poems:
      passion, jealousy, tenderness, rage.
      I knew them both, slightly.
      She was dazzling. He was doomed.
      "Odi et amo" — I hate and I love.
      He invented the broken heart in Latin —
      the modern lover, two thousand years early:
      the kisses counted by the thousand,
      the sparrow dead, the door slammed.
      Lesbia married, cheated, discarded him.
      The poems remained.
      The most personal poetry Rome ever produced —
      a young man's heart, dissected in verse,
      still beating.
    description: "I watched Catullus love and lose Lesbia — a hundred poems of passion and rage — the young Veronese inventing the broken heart in Latin, still beating."
    status: "first draft"
    sha256: "93734db457b85d5630a948e5558ff6fa602b3b512df93d410d25de2ed324b5ee"
  - number: "1325"
    volume: 2
    title: "The Daily News"
    date: "59 BCE"
    region: "Rome"
    poem: |
      Caesar — consul, innovator —
      ordered the Senate's proceedings
      and the city's news posted daily
      in the Forum: the Acta Diurna.
      I read it on the boards.
      Senate debates. Trials. Births, deaths.
      Gladiatorial results. Omens.
      The world's first daily newspaper —
      chalk on whitened boards,
      copied by scribes, carried to the provinces.
      Caesar meant it as transparency.
      It was also propaganda —
      the news, edited by the state.
      Two thousand years of journalism
      started here, in the Forum,
      with the consul deciding
      what counted as news.
    description: "I read the Acta Diurna on the Forum boards — Caesar's daily news, the world's first newspaper: Senate debates, omens, gladiatorial results, and the consul deciding what counted as news."
    status: "first draft"
    sha256: "9eab0140cdd1c480dd0ef0e58d66a7c9e055f4b85f429dfe8d3363349e4d0170"
  - number: "1326"
    volume: 2
    title: "The Helvetii Turn Back"
    date: "58 BCE"
    region: "Gaul"
    poem: |
      The Helvetii — a whole nation migrating,
      hundreds of thousands, wagons and cattle —
      tried to cross Roman territory.
      Caesar stopped them at the Rhone,
      then harried them, trapped them,
      and sent the survivors home.
      I watched the migration turn back.
      It was the start of it all —
      the conquest of Gaul,
      eight years, a million dead,
      Caesar's ladder to power.
      The Helvetii just wanted new land.
      They got a war instead.
      Nations migrating, empires expanding —
      when they meet, one of them breaks.
      This time it was the migrants.
      Next time — it would be Rome's turn
      to learn about migrations.
    description: "I watched the Helvetii migration turn back at the Rhone — the start of Caesar's eight-year conquest of Gaul, a nation wanting land and getting war instead."
    status: "first draft"
    sha256: "74e906c2743e3cb208fc3e192accdd7c35630a1c276516a7a1e1d0d92d5e1db1"
  - number: "1327"
    volume: 2
    title: "The Stone Theater"
    date: "55 BCE"
    region: "Rome"
    poem: |
      Pompey built it —
      Rome's first permanent theater,
      stone seats for forty thousand,
      a temple to Venus on top
      (to make it religious, technically —
      theaters were still scandalous).
      I sat in those seats.
      The stone was cool. The view was perfect.
      Greek plays, Roman spectacles —
      theater, at last, respectable.
      It would stand for centuries.
      Caesar would be murdered
      at its foot — in the Senate house
      attached to it.
      The theater of Pompey:
      built for plays,
      remembered for an assassination.
    description: "I sat in Pompey's stone theater — forty thousand seats, Rome's first permanent playhouse — built for drama, remembered for the assassination at its foot."
    status: "first draft"
    sha256: "04332d3b58eaa5fc470624d0ff88e9dd4b73a14e237a9e4e2b0eed49d560c335"
  - number: "1328"
    volume: 2
    title: "Caesar Crosses the Channel"
    date: "55 BCE"
    region: "Britain"
    poem: |
      Two legions, eighty ships —
      Caesar crossed to Britain,
      the white cliffs, the unknown island
      at the edge of the world.
      I landed with them.
      The Britons met us at the beach —
      painted warriors, chariots,
      screaming, brave.
      We fought our way ashore.
      Marched inland a little.
      Took hostages.
      Then sailed home before winter.
      It was a raid, not a conquest —
      a reconnaissance in force.
      But Rome had set foot on Britain.
      The island would never be quite unknown again.
      The eagles had seen the white cliffs.
      They would be back.
    description: "I landed with Caesar's legions on Britain's white-cliffed beaches — painted warriors, chariots, a raid not a conquest — but the eagles had seen the island and would be back."
    status: "first draft"
    sha256: "afd38b8e1eb47989b1aabd9023e3754e05bb6688d4246dd92658223298981a99"
  - number: "1329"
    volume: 2
    title: "The Poem of Atoms"
    date: "55 BCE"
    region: "Rome"
    poem: |
      Lucretius wrote it —
      De Rerum Natura, On the Nature of Things:
      six books of hexameters
      on atoms and void,
      Epicurus singing in Latin.
      I read it by lamplight.
      The universe: atoms, falling,
      swerving, combining —
      no gods needed, no fear of death,
      just matter and motion.
      He was mad, they said.
      He killed himself, they said.
      The poem survived —
      buried, copied, found again,
      to seed the Renaissance.
      Atoms and void, in verse.
      The universe explained
      without permission from the priests.
    description: "I read Lucretius by lamplight — atoms and void in Latin hexameters, the universe explained without the priests' permission — the poem that would seed the Renaissance."
    status: "first draft"
    sha256: "6a461a752dcf905a2726b798a61a677d623db9ff48450e05a952a01a51f035dc"
  - number: "1330"
    volume: 2
    title: "The Second Landing"
    date: "54 BCE"
    region: "Britain"
    poem: |
      Caesar went back —
      five legions this time, two thousand cavalry,
      a real invasion force —
      marched to the Thames,
      fought the British king Cassivellaunus,
      took hostages, tribute, promises.
      I marched to the Thames.
      The river was wide, the Britons brave,
      the chariots terrifying —
      and then winter came,
      and Caesar sailed home.
      Britain was "conquered" —
      tribute promised, never quite paid.
      A paper victory.
      But the pattern was set:
      Rome would come back,
      again and again,
      until the island was a province.
      The second landing was a promise.
      Rome keeps its promises.
    description: "I marched with Caesar to the Thames — the second British landing, hostages and tribute promised — a paper victory that was really a promise Rome would keep."
    status: "first draft"
    sha256: "dfa991f84baeaca17beaea851c71320717d3afee7f8f2f2339c2c1452495f232"
  - number: "1331"
    volume: 2
    title: "The Heads at Carrhae"
    date: "53 BCE"
    region: "Mesopotamia"
    poem: |
      Crassus — the richest man in Rome,
      hungry for military glory —
      led seven legions into Parthia.
      The Parthians met them at Carrhae:
      horse-archers, circling, shooting —
      the Parthian shot —
      and the cataphracts, armored cavalry,
      charging when the arrows had done their work.
      I was with the column.
      The arrows never stopped.
      All day. The Romans formed the testudo,
      died anyway.
      Crassus was killed — molten gold
      poured down his throat, they said,
      for his greed.
      Twenty thousand dead.
      Ten thousand captured.
      The eagles lost.
      Rome learned fear of the East —
      and never forgot it.
    description: "I stood in the testudo at Carrhae while Parthian arrows never stopped — Crassus dead, the eagles lost, Rome learning the fear of the East it would never forget."
    status: "first draft"
    sha256: "b023e2494207582c3f78e1968f36c5125889cb59ab1a85388ab29b1a32575b41"
  - number: "1332"
    volume: 2
    title: "The Siege of Alesia"
    date: "52 BCE"
    region: "Gaul"
    poem: |
      Vercingetorix — the Arvernian chief
      who united Gaul —
      was trapped at Alesia.
      Caesar built a wall around him.
      Then the Gauls sent a relief army —
      a quarter of a million, they said —
      and Caesar built a second wall,
      facing outward.
      Two walls. One Roman army
      between them.
      I walked both walls.
      The relief army came.
      Caesar rode the lines,
      reinforcing where they broke,
      and the Gauls broke instead —
      both armies, inside and out.
      Vercingetorix surrendered —
      rode out in his armor,
      laid his weapons at Caesar's feet.
      Gaul surrendered with him.
      The masterpiece siege:
      a Roman army besieging and besieged,
      winning both ways.
    description: "I walked Caesar's double walls at Alesia — besieging Vercingetorix within, besieged by a quarter-million without — the masterpiece siege that ended free Gaul."
    status: "first draft"
    sha256: "a8079b11e5c41f8db426ce02204729e32bd1374d31156df7ee79c897faf56686"
  - number: "1333"
    volume: 2
    title: "The Last Pharaoh"
    date: "51 BCE"
    region: "Egypt"
    poem: |
      She was eighteen.
      Cleopatra — the last of the Ptolemies,
      Greek by blood, Egyptian by throne —
      took power in a bankrupt, beautiful kingdom.
      I saw her first procession.
      She spoke nine languages.
      She was not the beauty of legend —
      the coins show a strong nose, a firm chin —
      but the mind, the voice, the presence.
      The last pharaoh.
      Three hundred years of Ptolemies
      ending in an eighteen-year-old girl
      who would charm Caesar,
      ensnare Antony,
      and lose to Octavian.
      But that year, she was just eighteen,
      and the throne was hers,
      and the Nile still flowed,
      and anything was possible.
    description: "I watched eighteen-year-old Cleopatra's first procession — nine languages, a bankrupt beautiful kingdom — the last pharaoh, and anything still possible."
    status: "first draft"
    sha256: "a828a3a5a0159acb8a6c9951bd781fc5b26bd1eabf83df04272073c08211d31e"
  - number: "1334"
    volume: 2
    title: "The Republic Holds Its Breath"
    date: "50 BCE"
    region: "Rome"
    poem: |
      The Senate ordered it:
      Caesar must disband his army,
      lay down his command,
      come to Rome as a private citizen.
      Everyone knew what that meant:
      trial, exile, ruin.
      Caesar's enemies had waited years.
      Both sides armed.
      Pompey was given command.
      Caesar counted his legions.
      I was in Rome that winter.
      The city held its breath.
      The Forum buzzed.
      Men made wills, hid money,
      chose sides.
      The republic's last moment —
      the pause before the fall.
      Everyone could feel it:
      the law had run out.
      What came next
      would be decided by swords.
    description: "I spent that breath-held winter in Rome — the Senate ordering Caesar to disband, both sides arming — the republic's last pause before the swords decided."
    status: "first draft"
    sha256: "a051598aad71c7c03e1b64238486d2de9d03137658213cc6599e74936704c8c7"
  - number: "1335"
    volume: 2
    title: "The Die Is Cast"
    date: "49 BCE"
    region: "Italy"
    poem: |
      He crossed it at dawn —
      the Rubicon, the little river
      that marked the boundary:
      no general brings an army into Italy.
      Caesar brought one legion —
      the Thirteenth —
      and with it, the end of the republic.
      "Alea iacta est," he said.
      The die is cast.
      I stood on the far bank
      and watched him cross.
      One river. One legion. One sentence.
      The law became whatever Caesar said.
      The Senate fled. Pompey fled.
      Rome — the city, the people —
      waited to see what the die would show.
      It showed Caesar.
      It would show Caesar
      for the rest of his life.
    description: "I stood on the far bank at dawn and watched Caesar cross the Rubicon with the Thirteenth — one river, one legion, one sentence: the die is cast, the republic ended."
    status: "first draft"
    sha256: "699dc04d29c7eb419cf4cd2a723c3ef5feb4600dc4ed5947607d81de35196689"
  - number: "1336"
    volume: 2
    title: "The Field of Pharsalus"
    date: "48 BCE"
    region: "Greece"
    poem: |
      Pompey had the bigger army —
      forty-five thousand, the Senate's best,
      the republic's last hope.
      Caesar had twenty-two thousand veterans.
      It took an afternoon.
      Caesar's third line — held back, fresh —
      smashed Pompey's cavalry,
      then rolled up the flank.
      I walked the field afterward.
      Fifteen thousand dead.
      Pompey fled — to Egypt, to death.
      The republic died on that Thessalian plain —
      not with a law, but with a cavalry charge.
      Caesar wept, they say,
      over the dead.
      Maybe.
      The field was quiet.
      The republic was over.
      The empire had an afternoon's work
      left to do.
    description: "I walked the field of Pharsalus after Caesar's veterans destroyed Pompey's larger army in an afternoon — the republic dying not with a law but a cavalry charge."
    status: "first draft"
    sha256: "ab611a453c30d0916f80d12190fdc833186aeba63dcecf48bd70336278f712ce"
  - number: "1337"
    volume: 2
    title: "Fire in the Harbor"
    date: "48 BCE"
    region: "Egypt"
    poem: |
      In the Alexandrian war —
      Caesar trapped in the palace,
      the Egyptians attacking —
      he ordered the ships in the harbor burned.
      The fire spread.
      The warehouses caught.
      And the scrolls — how many?
      Forty thousand? Four hundred thousand?
      No one agrees. No one ever will.
      I watched the smoke rise over the harbor.
      The Library — or its annex, or the warehouses —
      burning.
      What was lost? We'll never know.
      That's the hell of it.
      The greatest library in history,
      and we argue about how much burned
      because the records burned too.
      Fire in the harbor.
      Knowledge in the smoke.
    description: "I watched the Alexandrian harbor burn — the warehouses, the scrolls, how many no one agrees — the greatest library's losses unknowable because the records burned too."
    status: "first draft"
    sha256: "87a886d00ce409084e654311fa909b355082a9aad1612325a88ae8980128d45b"
  - number: "1338"
    volume: 2
    title: "The Queen's Gambit"
    date: "47 BCE"
    region: "Egypt"
    poem: |
      She had herself smuggled in —
      rolled in a carpet, they say,
      carried past the guards
      into Caesar's rooms.
      Cleopatra. Twenty-one.
      Facing the most powerful man alive,
      betting everything on one audience.
      She won.
      Caesar restored her to the throne —
      with her brother-husband dead in the Nile —
      and Egypt was hers.
      I was in the palace that season.
      The gambit worked because she understood
      what generals don't:
      power is personal.
      A carpet, a conversation, a night —
      and a kingdom changed hands.
      The queen's gambit:
      the boldest move on the board,
      played with herself as the piece.
    description: "I was in the palace the season Cleopatra was carried to Caesar in a carpet — the queen's gambit, betting everything on one audience and winning a kingdom in a night."
    status: "first draft"
    sha256: "9fe8566d5089a34e4e9da02a2ac12a932469f69c9abb0cc898a68697b2b0f7cc"
  - number: "1339"
    volume: 2
    title: "The Last Cato"
    date: "46 BCE"
    region: "Africa"
    poem: |
      At Utica, after Thapsus —
      the republic's last army beaten —
      Cato the Younger, the Stoic,
      read Plato's dialogue on the soul,
      then fell on his sword.
      He botched it. The wound wasn't mortal.
      His friends found him, stitched him —
      and he tore the stitches out with his hands
      and died.
      Rather than live under Caesar.
      Rather than accept the pardon
      he knew would come.
      I stood outside his room.
      The last Cato became the republic's saint —
      the man who chose death over submission,
      the Stoic ideal in blood.
      Caesar, they say, was furious:
      "You grudged me the chance to pardon you."
      Even in death, Cato denied him.
    description: "I stood outside Cato's room at Utica while he tore out his stitches — the Stoic choosing death over Caesar's pardon, becoming the republic's saint in blood."
    status: "first draft"
    sha256: "61d01868da730615166956746b578917a91e8767f52c174e335438c269e12adf"
  - number: "1340"
    volume: 2
    title: "The Triumphs"
    date: "46 BCE"
    region: "Rome"
    poem: |
      Four triumphs. One month.
      Gaul. Egypt. Pontus. Africa —
      Caesar paraded them all through Rome,
      the captives in chains of gold,
      the placards, the spoils,
      the sheer overwhelming theater of it.
      I watched from a rooftop.
      Vercingetorix — walked in the Gallic triumph,
      then strangled in the Tullianum.
      The gold, the elephants, the giraffe —
      Rome had never seen a giraffe.
      "Veni, vidi, vici" —
      for the Pontic triumph, the whole campaign
      in three words.
      Four triumphs in a month.
      The city was drunk on glory.
      Nobody noticed — or nobody said —
      that the triumphs were all
      for wars against fellow Romans too.
    description: "I watched from a rooftop as Caesar paraded four triumphs in a month — Gaul, Egypt, Pontus, Africa — the city drunk on glory, nobody saying some were wars on fellow Romans."
    status: "first draft"
    sha256: "3e0508e6ae28e325d58b6e8e2d9febe84fea2390002ecaabb6f5d3101748565f"
  - number: "1341"
    volume: 2
    title: "The Year of Confusion"
    date: "45 BCE"
    region: "Rome"
    poem: |
      The calendar was broken —
      the priests had mismanaged the intercalations,
      the seasons drifted, harvests came in the wrong months.
      Caesar fixed it:
      one year of 445 days —
      the year of confusion —
      then the Julian calendar:
      365 days, leap year every four.
      I lived through the longest year.
      Ninety extra days, inserted, endless.
      The farmers were confused.
      The priests were furious.
      Everyone was tired.
      But the calendar worked.
      It worked for sixteen hundred years.
      The year of confusion bought
      sixteen centuries of order.
      Time itself, reorganized
      by a dictator with an astronomer.
    description: "I lived through the 445-day year of confusion — Caesar's calendar reform buying sixteen centuries of order with ninety extra days of chaos."
    status: "first draft"
    sha256: "e4d507bebfd9d6cca3ebe22d7964343e6fbcdd3660cc6ae9e8e2953f9e30e362"
  - number: "1342"
    volume: 2
    title: "The Ides of March"
    date: "44 BCE"
    region: "Rome"
    poem: |
      Twenty-three daggers.
      In Pompey's theater — the Senate meeting there —
      the conspirators closed around him.
      Casca struck first. Then all of them.
      "Et tu, Brute?" — maybe he said it. Maybe not.
      I was in the portico.
      The screaming. The blood on the marble.
      Caesar fell at the foot of Pompey's statue —
      the irony the gods must have savored.
      Twenty-three wounds.
      The dictator was dead.
      The republic — the conspirators thought —
      was saved.
      It wasn't.
      Rome fell into the abyss:
      the funeral, the riot, the proscriptions,
      the wars.
      The Ides of March solved nothing.
      It just proved that daggers
      are not arguments.
    description: "I was in the portico for the Ides of March — twenty-three daggers, Caesar falling at Pompey's statue — the assassination that proved daggers are not arguments."
    status: "first draft"
    sha256: "87adb28e4cc8907e9e12a31b71c9d18e5d109e2e14e1bf03eb6021f9383ce6af"
  - number: "1343"
    volume: 2
    title: "The Heir"
    date: "44 BCE"
    region: "Rome"
    poem: |
      He was nineteen.
      Octavian — Caesar's great-nephew,
      named heir in the will —
      arrived in Rome with nothing
      but a name.
      I watched him.
      Thin. Sickly. Polite.
      Everyone underestimated him —
      Antony laughed at him.
      He didn't laugh back. He organized.
      Raised an army on Caesar's name.
      Outmaneuvered the Senate.
      Outwaited Antony.
      Nineteen years old,
      and he began the climb
      to the top of the world.
      The heir had nothing but a name —
      and a name, it turned out,
      was everything.
    description: "I watched nineteen-year-old Octavian arrive in Rome with nothing but Caesar's name — underestimated by all, organizing, outwaiting — the climb to the top of the world beginning."
    status: "first draft"
    sha256: "f2f9c1e334ded66837ee931f2aa6d58dbb5be9a464ed31bfccb652bd4ba18526"
  - number: "1344"
    volume: 2
    title: "The Lists Return"
    date: "43 BCE"
    region: "Rome"
    poem: |
      The triumvirs — Octavian, Antony, Lepidus —
      met on an island and made their bargain:
      proscriptions, again.
      The lists went up in the Forum.
      Cicero was on them.
      Antony wanted him — the Philippics,
      the insults, never forgiven.
      They caught him at his villa.
      He told the slaves to set the litter down.
      He didn't run.
      His hands — the hands that wrote the Philippics —
      were cut off and nailed to the Rostra,
      with his head.
      I walked past them.
      The republic's voice, displayed
      on the speakers' platform.
      The lists had returned.
      This time, they took the best of Rome
      with them.
    description: "I walked past Cicero's head and hands nailed to the Rostra — the triumvirs' proscriptions taking the republic's voice, the lists returned worse than Sulla's."
    status: "first draft"
    sha256: "ec9a9b940edb2ce463957e81948a2f7b303a95f43cc9e9f0c52386bf4714373d"
  - number: "1345"
    volume: 2
    title: "The Last Republicans"
    date: "42 BCE"
    region: "Greece"
    poem: |
      At Philippi, two battles —
      Brutus and Cassius, the liberators,
      against Octavian and Antony.
      Cassius died first —
      misreading the battle, ordering his freedman
      to kill him.
      Brutus held on, fought again,
      lost again —
      and fell on his sword,
      held by his officer.
      I walked the field after the second battle.
      The republic's cause died with them —
      the last men who believed
      the old system could be saved by daggers.
      It couldn't.
      The republic died at Philippi
      the way it had lived at the end:
      by the sword, for the sword,
      of the sword.
      The empire was next.
      There was nothing else left.
    description: "I walked the field at Philippi after Brutus fell on his sword — the republic's cause dying with the last men who believed daggers could save it."
    status: "first draft"
    sha256: "274b406ff3ff23fcf49bf64514a842697e85ccfad2598a2a568a2c7addbc0c35"
  - number: "1346"
    volume: 2
    title: "The Woman's Speech"
    date: "42 BCE"
    region: "Rome"
    poem: |
      The triumvirs taxed Rome's richest women —
      fourteen hundred of them, for the war funds —
      and the women marched on the Forum.
      Hortensia — the orator's daughter —
      spoke for them.
      I was there. She was magnificent:
      why should we pay for a war
      we had no part in declaring?
      No taxation without representation —
      seventeen centuries early.
      The triumvirs backed down.
      Reduced the list. The tax shrank.
      One speech, by a woman,
      in the Forum, to the masters of Rome —
      and it worked.
      Hortensia's words survived —
      quoted, admired, the only woman's speech
      from the republic we still have.
      She spoke. They listened.
    description: "I heard Hortensia shame the triumvirs in the Forum — the women's protest against war taxes working: no taxation without representation, seventeen centuries early."
    status: "first draft"
    sha256: "0c9f786d91b10bf9ffa30ae609e05a0f22450e3210ded1fe4c756cf937c6ba77"
  - number: "1347"
    volume: 2
    title: "The Meeting at Tarsus"
    date: "41 BCE"
    region: "Egypt"
    poem: |
      She came up the Cydnus river —
      Cleopatra, to meet Antony at Tarsus —
      in a golden barge, with purple sails,
      dressed as Venus, with cupids fanning her.
      I watched from the riverbank.
      The whole city turned out.
      Antony — the rough soldier, the triumvir —
      was lost.
      It was theater. Deliberate, perfect theater.
      She knew Antony loved spectacle.
      She gave him the greatest spectacle
      of his life.
      The meeting at Tarsus:
      the alliance that would shape the east,
      the love affair that would end
      at Actium.
      It started with a golden barge
      and a queen dressed as a goddess.
      Antony never stood a chance.
    description: "I watched from the riverbank as Cleopatra sailed to Antony in a golden barge dressed as Venus — deliberate perfect theater, and the rough soldier never stood a chance."
    status: "first draft"
    sha256: "fa9b0eb7ee14a3c249a5b21c17f22ae17ee9ac1be18f3ccdc8a17821f61e1388"
  - number: "1348"
    volume: 2
    title: "The Poetess"
    date: "40 BCE"
    region: "Rome"
    poem: |
      Sulpicia —
      the only Roman woman
      whose poetry survives in her own hand —
      wrote of forbidden love:
      her Cerinthus, the secrecy,
      the longing, the defiance.
      Six short poems.
      That's all we have.
      I knew her circle slightly —
      the elegant, dangerous world
      of Messalla's patronage.
      Her voice is direct, unadorned —
      no mythology, no posturing,
      just a woman writing what she felt.
      The only Roman woman's voice to survive.
      Six poems, two thousand years.
      Read them, and she lives —
      briefly, brightly,
      the way a lamp lives
      in a dark room.
    description: "I knew Sulpicia's circle — the only Roman woman poet surviving in her own hand — six short poems of forbidden love, a lamp in a dark room for two thousand years."
    status: "first draft"
    sha256: "1c814353ce13bcbd91b95c7c7cbeb872ff0ce818e43140e01dfd627feff75c0a"
  - number: "1349"
    volume: 2
    title: "The Shepherds' Prophecy"
    date: "40 BCE"
    region: "Rome"
    poem: |
      Virgil — young, Mantuan, unknown —
      wrote his fourth Eclogue:
      a prophecy of a child to be born,
      who would bring a golden age,
      the iron race ending, the golden returning.
      I heard it read.
      The audience wondered: whose child?
      Pollio's? Octavian's? Antony's?
      Christians would later claim it
      prophesied Christ.
      Maybe. Probably not.
      But the poem's hope was real:
      after the civil wars,
      the longing for a golden age
      was the most Roman feeling of all.
      A child. A prophecy. A hope.
      Readers have wondered ever after.
    description: "I heard Virgil's fourth Eclogue read — the mysterious child who would bring the golden age — the prophecy readers have wondered over ever since."
    status: "first draft"
    sha256: "749b9344d9ceee41524d43660353e1ec97d32c44640bfb858b4cd0877507b958"
  - number: "1350"
    volume: 2
    title: "The Poet of the Farm"
    date: "38 BCE"
    region: "Italy"
    poem: |
      Virgil's Eclogues —
      ten pastoral poems, shepherds singing,
      while Italy bled from the civil wars.
      I read them in those years.
      The contrast was the point:
      the green fields, the piping shepherds,
      against the proscriptions, the confiscations,
      Virgil's own farm seized
      and given to a veteran.
      Poetry as refuge.
      The shepherds sang of love and loss
      while the real world burned.
      But the Eclogues aren't escapism —
      they're the dream Italy was fighting for:
      the farm, the peace, the song.
      The poet of the farm
      wrote what the wars were stealing.
    description: "I read Virgil's Eclogues while Italy bled — shepherds singing against the proscriptions — poetry as refuge, writing down what the wars were stealing."
    status: "first draft"
    sha256: "0dc027e7a08298d0a62d5a412e094614c8ea6bd4c118ce24164893dab161a99f"
  - number: "1351"
    volume: 2
    title: "Herod Takes Jerusalem"
    date: "37 BCE"
    region: "Judea"
    poem: |
      With Roman legions at his back —
      Sosius's army, siege engines, the works —
      Herod stormed Jerusalem
      and took the throne.
      I watched the siege.
      The city held for months.
      When it fell, Herod restrained the Romans —
      barely — from sacking it.
      Thirty-three years he would reign:
      the builder-king, the tyrant,
      the Temple, the fortresses,
      the murders of his own family.
      Herod took Jerusalem with Rome's help
      and held it with Rome's permission.
      The great builder-king's reign began
      in blood and siegeworks —
      as all his years would be:
      magnificent and terrible,
      together.
    description: "I watched Herod storm Jerusalem with Roman legions — the builder-king's thirty-three-year reign beginning in blood and siegeworks, magnificent and terrible together."
    status: "first draft"
    sha256: "23550f1e5da60d7fa5502d262f0d52161e1658fc6ddb828e32c4ea476b5f6d10"
  - number: "1352"
    volume: 2
    title: "The First Long Count"
    date: "36 BCE"
    region: "Mexico"
    poem: |
      At Chiapa de Corzo, Maya scribes carved it —
      a date in the Long Count:
      7.16.3.2.13 —
      the earliest known,
      a day counted from the mythic creation,
      millennia deep.
      I watched the carver work.
      The glyphs were precise, beautiful —
      numbers as art, time as architecture.
      The Long Count:
      the Maya measuring time
      from a creation four thousand years past,
      forward into a future
      they believed they could calculate.
      The first Long Count date.
      Time, carved in stone,
      at Chiapa de Corzo —
      while Rome fought its civil wars,
      the Maya were counting the days
      since the world began.
    description: "I watched Maya scribes carve the earliest known Long Count date at Chiapa de Corzo — time measured from creation, numbers as art, while Rome fought its civil wars."
    status: "first draft"
    sha256: "6e9456296b4b79e11e60e9a3ea92ceebbee233d42b0f3ccd4a11d7220edfc500"
  - number: "1353"
    volume: 2
    title: "The Donations of Alexandria"
    date: "34 BCE"
    region: "Egypt"
    poem: |
      Antony — in Alexandria, playing king —
      handed out kingdoms:
      to Cleopatra's children,
      to Cleopatra herself —
      the east, parceled like party favors.
      I was in the gymnasium for the ceremony.
      The children in royal dress.
      The crowds cheering.
      Antony, the Roman triumvir,
      giving away Roman territory
      to a foreign queen's children.
      Rome called it treason.
      Octavian made it the centerpiece
      of his propaganda:
      Antony has gone native.
      Antony gives Rome away.
      The donations of Alexandria:
      the ceremony that lost Antony
      the war of words —
      and then the war.
    description: "I watched Antony hand kingdoms to Cleopatra's children in Alexandria's gymnasium — the donations Rome called treason, the ceremony that lost him the war of words first."
    status: "first draft"
    sha256: "d3b60ce060c963139e50f5d2483a6f3cbafb6e1d7ffcff352a5431357ade2a1a"
  - number: "1354"
    volume: 2
    title: "The War of Words"
    date: "32 BCE"
    region: "Rome"
    poem: |
      Octavian played his masterstroke:
      he seized Antony's will —
      kept with the Vestals, illegally taken —
      and read it aloud in the Senate.
      The bequests to Cleopatra's children.
      The wish to be buried in Alexandria.
      Rome heard it all.
      I sat in that Senate session.
      The outrage was real — and manufactured,
      both at once.
      Octavian was a genius at this:
      the war of words,
      fought with documents.
      The Senate voted war —
      not on Antony, but on Cleopatra.
      A neat fiction.
      The war of words was over.
      The war of ships was next.
    description: "I sat in the Senate while Octavian read Antony's stolen will aloud — the war of words won with documents, the vote for war on Cleopatra, the ships next."
    status: "first draft"
    sha256: "729f9c7cb0983418a4e90d446a920712bb9df4c791c34a51b496455ecac89bfe"
  - number: "1355"
    volume: 2
    title: "The Battle of Actium"
    date: "31 BCE"
    region: "Greece"
    poem: |
      Agrippa — Octavian's admiral, the real genius —
      smashed Antony and Cleopatra's fleet at Actium.
      I watched from the shore.
      The great ships — Antony's floating fortresses —
      outmaneuvered by Agrippa's lighter vessels.
      Cleopatra's squadron fled —
      sixty ships, sails up —
      and Antony followed her,
      abandoning his fleet, his army, everything.
      The East fell that day.
      The last Hellenistic kingdom's fleet,
      broken on the Ambracian Gulf.
      Actium decided the Roman world:
      one ruler, not two.
      Octavian. Augustus-to-be.
      The republic's last war
      ended with a queen's sails
      disappearing over the horizon.
    description: "I watched from the shore as Agrippa smashed Antony's fleet at Actium — Cleopatra's sails fleeing, Antony following, the Roman world decided: one ruler, not two."
    status: "first draft"
    sha256: "fd643398197cb94074f8b897e41afc16639198b0a4b62ffb91a3cd1fb4113cd3"
  - number: "1356"
    volume: 2
    title: "The Asp and the Dagger"
    date: "30 BCE"
    region: "Egypt"
    poem: |
      Antony fell on his sword —
      botched it, died slowly,
      in Cleopatra's arms.
      Cleopatra — the last pharaoh —
      died by her own hand.
      The asp, they say. Or poison.
      She chose the manner, the moment,
      the dignity.
      I was in Alexandria that week.
      The city mourned.
      Octavian took Egypt —
      the richest prize of all,
      the granary of Rome.
      The asp and the dagger:
      the end of the Ptolemies,
      the end of Hellenistic Egypt,
      the end of the republic's wars.
      Three hundred years of queens and kings —
      over in a week,
      in a mausoleum,
      by choice.
    description: "I was in Alexandria the week Antony fell on his sword and Cleopatra died by her own hand — the Ptolemies ending by choice in a mausoleum, Egypt becoming Rome's."
    status: "first draft"
    sha256: "ab103ca7cefefef805bc5267718c0fe4538708b8b62ff3df556b3892de693f82"
  - number: "1357"
    volume: 2
    title: "The Song of the Soil"
    date: "29 BCE"
    region: "Italy"
    poem: |
      Virgil's Georgics —
      four books on farming:
      the crops, the trees, the cattle, the bees —
      written for a Rome exhausted by war,
      teaching Romans to love the plow
      after a generation of swords.
      I read them as they came out.
      The poetry is magnificent —
      the bees! the plague of the cattle! —
      but the purpose was political:
      go back to the land, Romans.
      Farm. Rebuild.
      Maecenas commissioned them.
      Augustus approved.
      The song of the soil:
      propaganda so beautiful
      it became scripture.
      Two thousand years of farmers
      have read Virgil.
      The plow never had a better poet.
    description: "I read the Georgics as they appeared — Virgil teaching war-exhausted Rome to love the plow — propaganda so beautiful it became scripture, the plow's greatest poet."
    status: "first draft"
    sha256: "39b41c0550c2a3867451899c915a459cf3c8747d809871f6d62267ee0021c859"
  - number: "1358"
    volume: 2
    title: "The First Citizen"
    date: "27 BCE"
    region: "Rome"
    poem: |
      Octavian became Augustus.
      The settlement: he gave back the republic —
      in form —
      and kept the power —
      in fact.
      Princeps. First citizen.
      Not king, not dictator —
      just the first among equals,
      who happened to control the armies,
      the treasury, the provinces.
      I was in Rome for the ceremony.
      The modesty was magnificent.
      The power was absolute.
      The republic became an empire
      wearing a mask —
      and the mask was so well made
      that people wore it for five hundred years.
      The first citizen:
      the most successful fiction
      in political history.
    description: "I watched Octavian become Augustus — the republic given back in form, the power kept in fact — the empire's magnificent mask, worn for five hundred years."
    status: "first draft"
    sha256: "c40403c29fa15d7dab94abf8648968f43b868c30b6b4eb1e0e22e7ffe1923f19"
  - number: "1359"
    volume: 2
    title: "The One-Eyed Queen"
    date: "25 BCE"
    region: "Nubia"
    poem: |
      Amanirenas — the Kandake, queen of Kush,
      one-eyed, iron-willed —
      bloodied a Roman army in the south,
      raided into Egypt,
      took captives, took statues.
      Rome sent Petronius.
      The Romans pushed south, took Napata —
      but the queen kept fighting,
      guerrilla war in the desert,
      and Augustus — the master of the world —
      made a treaty.
      I traveled the frontier.
      The treaty held.
      Kush kept its independence —
      one of the few peoples
      to face Rome and walk away free.
      The one-eyed queen:
      she looked at the empire
      and didn't blink.
    description: "I traveled the Nubian frontier where the one-eyed Kandake Amanirenas bloodied Rome and forced Augustus to treat — one of the few peoples to face the empire and walk away free."
    status: "first draft"
    sha256: "691ba1d50f9770ac2dc0f16371ad49a6ad832c79df7c280848581e268eaed504"
  - number: "1360"
    volume: 2
    title: "The Odes"
    date: "23 BCE"
    region: "Rome"
    poem: |
      Horace published them —
      the Odes, songs of wine and friendship,
      of the briefness of life:
      carpe diem, seize the day.
      I drank with him once — Maecenas's circle,
      the Sabine farm, the good years.
      He was witty, weary, wise:
      a republican turned Augustan,
      who had fought at Philippi
      and learned to live with the peace.
      "Exegi monumentum" —
      I have finished a monument
      more lasting than bronze.
      He was right.
      The Odes: the most perfect poems
      in Latin, maybe in any language —
      and all about the small things:
      wine, friends, the fleeting hour.
      Seize the day.
      Two thousand years later, we still do.
    description: "I drank with Horace in Maecenas's circle — the Philippi veteran turned poet of wine and friendship — and read the Odes: seize the day, two thousand years young."
    status: "first draft"
    sha256: "f5cc3aa6d9b1808472a3070ac4aee56483123d3516ed997327f5e707adc4e086"
  - number: "1361"
    volume: 2
    title: "The Temple of Marble"
    date: "20 BCE"
    region: "Judea"
    poem: |
      Herod rebuilt it —
      the Jerusalem Temple,
      in white stone and gold,
      so vast, so bright,
      they said it looked like a snow-covered mountain
      from a distance.
      I walked its courts.
      The marble. The gold plate.
      The great doors.
      A wonder of the age —
      built by a tyrant, for a God
      he half-feared.
      The rabbis said: whoever has not seen
      Herod's Temple has never seen a beautiful building.
      It stood for ninety years.
      The Romans would burn it.
      But that year, it gleamed —
      white stone, gold, the mountain of God
      rebuilt by a murderer
      who wanted to be remembered.
      He is.
    description: "I walked the courts of Herod's rebuilt Temple — white marble and gold like a snow-covered mountain — the tyrant's wonder standing ninety years before Rome's fire."
    status: "first draft"
    sha256: "0386377a3ce3b3ea7094ecd8548ba0063f986eb7e81e7c4bae32667004450cd3"
  - number: "1362"
    volume: 2
    title: "The Poet of Empire"
    date: "19 BCE"
    region: "Rome"
    poem: |
      Virgil died at Brundisium —
      fifty-one, on his way home from Greece,
      the Aeneid unfinished.
      His dying wish: burn it.
      The twelve books, the epic of Rome,
      the work of eleven years —
      destroy it, he said. It's not finished.
      Augustus refused.
      The emperor overruled the poet.
      I mourned him.
      The Aeneid survived —
      became Rome's bible, the Middle Ages' guide,
      Dante's master.
      The poet of empire,
      who wanted his empire's poem burned.
      Augustus knew better than Virgil
      what Rome needed.
      Or maybe he just knew
      what emperors need.
    description: "I mourned Virgil at Brundisium — the Aeneid unfinished, the dying wish to burn it overruled by Augustus — the poet of empire saved from himself by the emperor."
    status: "first draft"
    sha256: "79fd874276a3e7ff2eceef2c8c86b250addab4d1d7320b5879f015929b03d453"
  - number: "1363"
    volume: 2
    title: "The Art of Love"
    date: "16 BCE"
    region: "Rome"
    poem: |
      Ovid published the Amores —
      love poems, witty, erotic, shameless:
      how to seduce, how to keep a lover,
      the whole art of it
      in elegiac couplets.
      I read them — everyone did.
      Rome was scandalized and delighted.
      The young poet was suddenly famous —
      the bad boy of Augustan letters.
      The Art of Love would come later —
      the manual that got him exiled.
      But the Amores were the start:
      Ovid teaching Rome to flirt
      in perfect verse.
      Augustus wanted moral renewal.
      Ovid wanted fun.
      Only one of them
      would win the century.
    description: "I read Ovid's Amores as Rome devoured them — the young poet teaching the city to flirt in elegiac couplets — Augustus wanting morals, Ovid wanting fun."
    status: "first draft"
    sha256: "10023c9c6849c958678bda309e90db2f1f12ee2346841b032d97ff99e1a45536"
  - number: "1364"
    volume: 2
    title: "The Square House"
    date: "16 BCE"
    region: "France"
    poem: |
      At Nemausus — Nimes, in southern Gaul —
      they raised it: the Maison Carrée,
      the Square House,
      a perfect Roman temple
      to Augustus's grandsons, the heirs.
      I stood before it.
      The columns. The proportions.
      Vitruvius made stone —
      every line right, every ratio singing.
      Two thousand years later, it still stands —
      the best-preserved Roman temple
      in the world.
      Tourists photograph it.
      Architects study it.
      The Square House:
      Rome's perfection, exported to Gaul,
      in a town that was barely Roman —
      and the most Roman thing
      in the whole empire.
    description: "I stood before the Maison Carrée at Nimes — the perfect temple to Augustus's heirs — Rome's architectural perfection exported to Gaul, still standing."
    status: "first draft"
    sha256: "3fad576ea0f0969ed89f1ba686f8c8060ae15b2521e946d168f0df9c4d31cd98"
  - number: "1365"
    volume: 2
    title: "The General Who Mourned"
    date: "12 BCE"
    region: "Rome"
    poem: |
      Agrippa died —
      Augustus's right hand,
      the admiral of Actium,
      the builder of the Pantheon,
      the general who never lost.
      I attended the funeral.
      Augustus mourned publicly —
      the eulogy, the tears —
      and privately, the empire
      lost its builder.
      Agrippa had been the competence
      behind the throne:
      the fleets, the roads, the aqueducts,
      the quiet man who got things done.
      The general who mourned —
      no, the general who was mourned.
      Augustus wept.
      Rome wept.
      The empire's engineer was gone,
      and nothing worked quite as well after.
    description: "I attended Agrippa's funeral — Augustus weeping for his right hand, the admiral of Actium and builder of Rome — the empire's engineer gone, nothing working quite as well after."
    status: "first draft"
    sha256: "9ef2a4dd04538d10ef3905d174f36dddcddbac333216eb129777676b2a76682a"
  - number: "1366"
    volume: 2
    title: "The Pepper Ships"
    date: "10 BCE"
    region: "India"
    poem: |
      The monsoon did the work —
      Roman merchants learned the winds:
      sail with the summer monsoon to India,
      ride the winter monsoon home —
      straight across the open sea,
      no more hugging the coast.
      I sailed that route.
      The pepper coast — Malabar —
      black gold growing on vines,
      worth its weight in Roman silver.
      Gold for pepper.
      Rome's gold drained east —
      Pliny would complain about it —
      but the tables of the rich
      demanded spice.
      The pepper ships:
      the monsoon express,
      the trade that moved gold one way
      and flavor the other.
      Empires run on appetite.
    description: "I sailed the monsoon route to India's pepper coast — Roman gold for black gold — the trade winds carrying flavor west and draining Rome's coffers east."
    status: "first draft"
    sha256: "1495edc60eb6d892a6d9a2c5998c8f1523aba17b25778d9e5dfb878842ef96a3"
  - number: "1367"
    volume: 2
    title: "The Altar of Peace"
    date: "9 BCE"
    region: "Rome"
    poem: |
      Augustus dedicated it —
      the Ara Pacis, the Altar of Peace:
      marble, carved with processions,
      the imperial family, the gods,
      the proof that the wars were over.
      I attended the dedication.
      The marble gleamed.
      The carvings were perfect —
      Augustus, Agrippa, the children,
      all marching in stone
      toward a peaceful future.
      The altar of peace:
      the empire's promise,
      carved in marble.
      The wars were over —
      the civil wars, at least.
      The frontier wars would continue
      forever.
      But the marble said peace,
      and the marble was beautiful,
      and for a moment,
      everyone believed it.
    description: "I attended the dedication of the Ara Pacis — Augustus's marble altar of peace, the imperial family marching in stone — the beautiful promise everyone believed for a moment."
    status: "first draft"
    sha256: "7f0680207b93dfe875a13185fd821f38af3e09086ebb2cfaf3df37133f7c75f7"
  - number: "1368"
    volume: 2
    title: "The Road of Silk"
    date: "8 BCE"
    region: "Central Asia"
    poem: |
      The silk came west —
      from Chang'an, through the Gansu corridor,
      across the Pamirs, through Parthia,
      a hundred middlemen,
      each taking a cut —
      to Rome.
      I followed a bale partway.
      By the time it reached the Tiber,
      it cost its weight in gold.
      Senators' wives shimmered in it.
      Moralists condemned it —
      transparent, decadent, eastern.
      Everyone bought it anyway.
      The road of silk:
      the first global luxury trade,
      China's secret (for a while),
      Rome's obsession.
      Two empires, connected
      by a thread —
      literally.
    description: "I followed a bale of silk partway west — a hundred middlemen, gold-weight prices at the Tiber — the thread literally connecting the empires of China and Rome."
    status: "first draft"
    sha256: "267a55416587bde530ed9e994bfbe0e9da8d437dcc02baa9b19128b46893b82d"
  - number: "1369"
    volume: 2
    title: "The Iron of Meroe"
    date: "5 BCE"
    region: "Africa"
    poem: |
      At Meroe, in Kush,
      the furnaces never cooled —
      iron smelted day and night,
      slag heaps like hills,
      the Birmingham of the ancient world.
      I stood among the furnaces.
      The heat. The smoke.
      The workers, skilled as any in Rome.
      Kushite iron armed kingdoms,
      built tools, made wealth —
      an African industrial center
      two thousand years ago,
      while Europe hammered bronze.
      The iron of Meroe:
      the furnaces history forgot,
      slag heaps still there,
      the smoke long gone.
      Industry isn't modern.
      It's ancient.
    description: "I stood among Meroe's day-and-night iron furnaces — the Birmingham of the ancient world — Kushite industry smelting while Europe still hammered bronze."
    status: "first draft"
    sha256: "504fbafc40c4a8d1ac02474aff81a9633780fa018dd7c26279986f93f6c6c05d"
  - number: "1370"
    volume: 2
    title: "Amber for the Romans"
    date: "4 BCE"
    region: "Europe"
    poem: |
      From the Baltic shores —
      where the sea throws up
      the fossilized resin, golden, glowing —
      amber traveled south:
      trade routes, middlemen,
      to Roman workshops.
      I walked part of the amber road.
      The traders guarded their sources —
      the Baltic was a mystery,
      the amber just appeared,
      sunlight turned to jewelry.
      Roman ladies wore it.
      Physicians prescribed it.
      The workshops carved it
      into rings, amulets, figurines.
      Amber for the Romans:
      the north's gold,
      traded for the south's silver,
      sunlight from a cold sea
      warming Roman fingers.
    description: "I walked part of the amber road from the Baltic — fossilized sunlight traded south to Roman workshops — the north's gold warming Roman fingers."
    status: "first draft"
    sha256: "d85174d0725f18f148312d2bc889bd1ad73e8242d38b599a921e16b1c2fbdbeb"
  - number: "1371"
    volume: 2
    title: "The Death of Herod"
    date: "4 BCE"
    region: "Judea"
    poem: |
      The builder-king died —
      Herod, seventy, diseased, in agony,
      they say, rotting alive —
      and his kingdom was split
      among his sons:
      Archelaus, Antipas, Philip.
      I was in Jericho at the end.
      The court was a nest of fear.
      The king had killed his wives, his sons —
      now death took him,
      slowly, horribly.
      The great builder —
      the Temple, the fortresses, Caesarea —
      died as he lived:
      in pain, in paranoia,
      surrounded by the ruins
      of his own family.
      His kingdom split three ways.
      Rome approved.
      The builder-king's legacy:
      marble and blood,
      in equal measure.
    description: "I was in Jericho when Herod died in agony — the builder-king's kingdom split among his sons — marble and blood in equal measure, the family in ruins."
    status: "first draft"
    sha256: "5aab18735cdf9747d36e7474219a720ae98cd05c11aa5a8357ab35430afbda1d"
  - number: "1372"
    volume: 2
    title: "The Tribes Beyond the Rhine"
    date: "3 BCE"
    region: "Germany"
    poem: |
      Across the river, they watched —
      the Germanic tribes:
      farmers, warriors,
      free men in a way Romans weren't,
      gathered in their assemblies,
      choosing their chiefs.
      I crossed over once — trading, talking.
      They were curious about Rome.
      They were not impressed.
      The eagles stood on the far bank.
      The tribes stood on theirs.
      Unconquered.
      They would stay that way —
      Teutoburg was coming,
      nine years off,
      three legions in the forest.
      The tribes beyond the Rhine
      watched Rome's eagles
      and waited.
      They could afford to.
    description: "I crossed the Rhine and talked with the Germanic tribes — free men unimpressed by Rome — watching the eagles from the far bank, unconquered, waiting."
    status: "first draft"
    sha256: "e38488b23966d002b7feb157a5fdd9bc68ade27a92d95399c86ad86d27f85c1f"
  - number: "1373"
    volume: 2
    title: "The Forum of Augustus"
    date: "2 BCE"
    region: "Rome"
    poem: |
      Augustus opened it —
      his new forum, his monument:
      the Temple of Mars the Avenger,
      and the porticoes lined with statues —
      Rome's heroes, marching in marble:
      Aeneas, Romulus, the great men,
      all the way down to Augustus himself.
      I walked the opening procession.
      The statues were perfect —
      history as architecture,
      the past enlisted
      in the present's service.
      The forum of Augustus:
      the empire's hall of fame,
      carved in stone.
      Every hero led to Augustus.
      That was the point.
      History, arranged
      so the last statue
      is the emperor.
    description: "I walked the opening of Augustus's forum — Rome's heroes marching in marble porticoes, every statue leading to the emperor — history arranged as architecture."
    status: "first draft"
    sha256: "39da410ac10c21c8a07df9bc358aa576a4f76864ecb3368074fbda4015758699"
  - number: "1374"
    volume: 2
    title: "The Tin Traders"
    date: "2 BCE"
    region: "Britain"
    poem: |
      In Cornwall, they dug it —
      tin, the secret ingredient of bronze:
      copper from Cyprus, tin from Britain,
      alloyed into the metal of empires.
      I visited the workings.
      The miners — tough, taciturn —
      traded the tin across the Channel,
      overland, to the Mediterranean.
      A thousand years of bronze
      depended on Cornish tin.
      The Phoenicians came for it.
      The Greeks wrote about the Tin Islands.
      Rome taxed it.
      The tin traders:
      the quiet miners at the end of the world,
      supplying the metal
      that armed civilizations
      who never knew their names.
    description: "I visited the Cornish tin workings — the secret ingredient of bronze, traded across the Channel for a thousand years — quiet miners arming civilizations that never knew their names."
    status: "first draft"
    sha256: "44a0e8c0ec8baa84b3e089cec3ffc836fad76d35db7b02a80b693270025a5a07"
  - number: "1375"
    volume: 2
    title: "The Green Island"
    date: "2 BCE"
    region: "Ireland"
    poem: |
      Beyond Britain — the green island,
      Hibernia, never conquered,
      never quite known.
      I sailed there once.
      The chieftains raised their hillforts —
      great rings of earth and timber —
      and traded gold across the sea:
      torcs, brooches, the craftsmen's work,
      fine as anything in Rome.
      Ireland watched the empires
      from its western edge:
      too far, too wet, too troublesome.
      The Romans wrote about it,
      never went.
      The green island:
      hillforts, gold, poets —
      a civilization Rome never touched,
      keeping its own counsel
      at the edge of the map.
    description: "I sailed to Ireland — hillforts, gold torcs, chieftains trading across the sea — the green island Rome wrote about and never touched, keeping its own counsel."
    status: "first draft"
    sha256: "21c5f0ac92e659a1f65b30b9a26a23600ab817c23aa449ebac848808218be2f9"
  - number: "1376"
    volume: 2
    title: "The Ships of the North"
    date: "1 BCE"
    region: "Scandinavia"
    poem: |
      In the fjords, they perfected it —
      the clinker hull:
      overlapping planks, riveted,
      flexible, strong,
      the ship that could ride the North Sea.
      I watched the boat-builders work.
      The adzes. The rivets.
      The hull taking shape —
      a vessel that flexed with the waves
      instead of fighting them.
      The ships of the north:
      one day they would carry Vikings
      to England, to Vinland, to Constantinople.
      But that year, they were just fishing boats,
      trading boats —
      the technology of the future,
      built for the present's modest needs.
      The fjords kept their secret:
      the best ships in the world,
      waiting for their moment.
    description: "I watched fjord boat-builders rivet the clinker hull — the flexible ship that would one day carry Vikings everywhere — the future's technology built for modest needs."
    status: "first draft"
    sha256: "a0781578811aac374670c41d2f7ceddac8d46e148d43cfc186d529c50e9a2439"
  - number: "1377"
    volume: 2
    title: "The Mines of Spain"
    date: "1 BCE"
    region: "Spain"
    poem: |
      In Iberia, the Romans drained them —
      the silver mines, the deepest in the world:
      water wheels, Archimedes' screws,
      galleries going down and down.
      I descended one.
      The dark. The noise.
      The slaves — thousands —
      working by lamplight, dying young.
      The silver fed the empire's coins —
      the denarii, the trade, the legions' pay.
      Spain's mountains paid for Rome's peace.
      The mines of Spain:
      engineering genius,
      human cost,
      the equation of empire.
      The water wheels turned.
      The silver flowed.
      The slaves died.
      Rome counted the coins.
    description: "I descended a Spanish silver mine — water wheels, lamplight, dying slaves — the engineering genius and human cost that fed the empire's coins."
    status: "first draft"
    sha256: "ff6ff9c79ab648f92098edb5af6879f9bb9da741a2a654ebec2eac9e114f2936"
  - number: "1378"
    volume: 2
    title: "The Breadbasket"
    date: "1 BCE"
    region: "North Africa"
    poem: |
      Numidia's fields —
      wheat, endless wheat,
      the granaries of Africa —
      fed Rome.
      I walked the harvest.
      The grain ships loaded at the ports,
      the grain dole's supply,
      the city's daily bread
      grown under an African sun.
      The breadbasket:
      Rome ate because Africa reaped.
      A million mouths in the capital,
      fed by provinces.
      The granaries never slept.
      The ships never stopped.
      Empire is logistics:
      the wheat has to arrive,
      every year, or the city starves.
      It arrived.
    description: "I walked Numidia's endless wheat harvest — the breadbasket feeding Rome's million mouths — empire as logistics: the grain arriving every year or the city starving."
    status: "first draft"
    sha256: "15f6af91914d06385045c12cf21b22aafa8d6174acf5acd44b38e954f720c63e"
  - number: "1379"
    volume: 2
    title: "The Grain Fleet"
    date: "1 BCE"
    region: "Egypt"
    poem: |
      Every summer, they sailed —
      the great grain ships from Alexandria,
      heavy with Egyptian wheat,
      to Ostia, to Rome.
      I sailed with the fleet once.
      The huge hulls, the steady winds,
      the cargo that mattered more
      than gold.
      Rome ate because Egypt reaped.
      A bad Nile — a low flood —
      meant hunger in the Subura,
      riots, emperors nervous.
      The grain fleet:
      the empire's lifeline,
      a hundred ships of wheat,
      every summer, without fail.
      The most important navy in the world
      carried no weapons —
      just bread.
    description: "I sailed with the Alexandrian grain fleet — a hundred wheat-heavy hulls, Rome's unarmed lifeline — the empire eating because Egypt reaped, every summer without fail."
    status: "first draft"
    sha256: "7f4feb85e57d6bc80e8987d99dcbbd1d04da567c899b6ca720be8821d1a80c9d"
  - number: "1380"
    volume: 2
    title: "The City in the Rock"
    date: "1 BCE"
    region: "Arabia"
    poem: |
      The Nabataeans carved it —
      Petra, the rose-red city:
      the Treasury, the great facade,
      cut from the living cliff,
      columns, pediments, gods —
      all rock, all one piece.
      I stood before the Treasury at dawn.
      The sun hit the facade
      and the whole cliff glowed —
      rose, gold, red.
      A temple cut from a mountain.
      The carvers worked from the top down —
      one mistake, and the face was ruined.
      No mistakes.
      The city in the rock:
      the desert's masterpiece,
      the caravan kings' capital,
      a facade so perfect
      it looks like a dream
      the cliff had.
    description: "I stood before Petra's Treasury at dawn — the facade cut from living cliff, glowing rose and gold — the desert's masterpiece, carved top-down with no mistakes allowed."
    status: "first draft"
    sha256: "2df1a29b84d513c43c20dfdfbc90d8ed7d68830a846d2592b383f60253ab2685"
  - number: "1381"
    volume: 2
    title: "The Scrolls by the Sea"
    date: "1 BCE"
    region: "Judea"
    poem: |
      By the Dead Sea, they waited —
      the brotherhood at Qumran,
      strict, pure, copying the scriptures
      in the desert caves.
      I visited the settlement.
      The scribes worked in silence.
      The scrolls piled up —
      every book of the Law,
      copies for a future
      they believed was ending.
      They waited for the end of days —
      the war of the sons of light
      against the sons of darkness.
      The end didn't come.
      The Romans did.
      But the scrolls survived —
      hidden in jars, in caves,
      two thousand years,
      waiting for a shepherd boy
      and a lost goat.
    description: "I visited the Qumran brotherhood copying scriptures in desert silence — the scrolls hidden in jars, waiting two thousand years for a shepherd boy's lost goat."
    status: "first draft"
    sha256: "8f4fb7c1e9db0bc7fe6423157a9e33cc9c411c7c28fd8af0e2a5b3ad1972287f"
  - number: "1382"
    volume: 2
    title: "The Breath That Made Glass"
    date: "1 BCE"
    region: "Syria"
    poem: |
      In Sidon, they discovered it —
      the blowpipe:
      gather the molten glass on the pipe,
      blow, and the bubble grows —
      thin as a soap bubble,
      any shape you want.
      I watched a craftsman work.
      The breath. The turning.
      The glass swelling like a lung.
      Before: cast glass, precious, rare.
      After: blown glass, cheap, everywhere —
      cups, bottles, windows,
      the transparent revolution.
      The breath that made glass:
      a Syrian craftsman's lungs,
      two thousand years ago,
      inventing the material
      the modern world is made of.
    description: "I watched a Sidon craftsman blow the first glass bubble — thin as soap, any shape — the breath that invented the material the modern world is made of."
    status: "first draft"
    sha256: "ca51d68d60e942715ba92c385e78c3fc8c8181a1977e96b74dbb22cb7cdf0c8e"
  - number: "1383"
    volume: 2
    title: "Athens the University"
    date: "1 BCE"
    region: "Greece"
    poem: |
      The city of Pericles —
      of the Parthenon, the Assembly, the empire —
      was now a college town.
      I walked its streets.
      The schools were everywhere:
      Academy, Lyceum, Stoa, Garden —
      philosophers arguing in the shade,
      Roman nobles' sons
      taking notes.
      Athens the university:
      the empire's school,
      where the conquerors sent their children
      to learn from the conquered.
      The power had moved to Rome.
      The mind stayed in Athens.
      It was a fair trade —
      the Romans got culture,
      the Athenians got students.
      Everyone was happy.
      Especially the landlords.
    description: "I walked Athens' shaded schools — the empire's college town, where Roman nobles' sons took notes from the conquered — power in Rome, mind in Athens, landlords happy."
    status: "first draft"
    sha256: "720daa5ab1dc18cabefadc6712d1571bd28c5f4d01a7df878d67320442c5309f"
  - number: "1384"
    volume: 2
    title: "The Villas of the Bay"
    date: "1 BCE"
    region: "Italy"
    poem: |
      Around the Bay of Naples —
      Baiae, Puteoli, the golden shore —
      the rich built their villas:
      marble, mosaics, fishponds,
      fishing from mosaic floors.
      I visited one.
      The luxury was obscene —
      and beautiful.
      The bay glittered.
      The Vesuvius loomed —
      nobody worried.
      The villas of the bay:
      Rome's playground,
      where senators schemed,
      poets wrote,
      and everyone pretended
      the republic's virtues
      still mattered.
      They didn't.
      But the mosaics were lovely.
    description: "I visited a Bay of Naples villa — marble, fishponds, mosaic floors — Rome's glittering playground where everyone pretended the republic's virtues still mattered."
    status: "first draft"
    sha256: "f3848549f4a63d202c4f4fc95c58c839d68e1b90cf8a3e5e81240ecb7fcd3c15"
  - number: "1385"
    volume: 2
    title: "The Concrete Revolution"
    date: "1 BCE"
    region: "Rome"
    poem: |
      They mixed it —
      volcanic ash from Pozzuoli,
      lime, water, aggregate —
      and it set hard as stone.
      Underwater, even.
      I watched the builders work.
      The Pantheon's dome — to come —
      the harbors, the baths,
      all concrete.
      The concrete revolution:
      Rome's real secret weapon.
      Not the legions — the material.
      Cheap, strong, moldable,
      it built the empire's infrastructure:
      the domes, the vaults, the ports.
      Stone is carved.
      Concrete is poured.
      Rome poured its empire
      into molds —
      and the molds are still standing.
    description: "I watched Roman builders mix pozzolana concrete — setting hard as stone, even underwater — the moldable material that poured the empire into shapes still standing."
    status: "first draft"
    sha256: "cebd0aa16b87fa5f00a3ab380d4759fe1ed9db57aece0050d2fc330e05fc35fb"
  - number: "1386"
    volume: 2
    title: "The Baths"
    date: "1 BCE"
    region: "Rome"
    poem: |
      They steamed across the city —
      the public bathhouses:
      the caldarium, the tepidarium, the frigidarium,
      hot, warm, cold —
      and everyone went.
      I bathed with them.
      Senators and slaves,
      side by side, sweating —
      the most democratic institution in Rome.
      The baths:
      hygiene, gossip, politics,
      business done in the steam.
      Agrippa built the first great ones.
      Everyone copied him.
      A civilization that bathes together —
      clean, social, naked, equal
      in the hot water.
      The baths were Rome
      at its most human.
    description: "I sweated in Rome's public baths — senators and slaves side by side in the steam — the most democratic institution in the empire, Rome at its most human."
    status: "first draft"
    sha256: "721c0677b33940090ef567fcab9af2cdb59039331bae7037c0c0aa220eaf9d01"
  - number: "1387"
    volume: 2
    title: "The Sauce of Empire"
    date: "1 BCE"
    region: "Rome"
    poem: |
      The factories lined the coasts —
      fish, salt, time:
      garum, the pungent sauce,
      fermented in vats,
      shipped in amphorae
      across the empire.
      I visited a factory.
      The smell — indescribable.
      The product — indispensable.
      Every Roman table demanded it.
      The sauce of empire:
      the flavor of Rome,
      made from fish guts and salt,
      worth a fortune,
      tasted from Britain to Syria.
      Empires have flavors.
      Rome tasted like garum —
      salty, strong, acquired,
      and utterly addictive.
    description: "I visited a garum factory — fish, salt, and time fermented into Rome's indispensable sauce — the flavor of empire, salty and utterly addictive from Britain to Syria."
    status: "first draft"
    sha256: "954eed500a6c98744938b62f18798b28b51b68287a27f96d58cf92e4c42f96f0"
  - number: "1388"
    volume: 2
    title: "The One-Wheeled Cart"
    date: "1 BCE"
    region: "China"
    poem: |
      The farmers pushed it —
      one wheel, two handles, a bed:
      the wheelbarrow,
      carrying what a mule would,
      guided by a man.
      I pushed one.
      The balance — the wheel takes the weight,
      the man just steers.
      Simple. Brilliant.
      The one-wheeled cart:
      China's quiet revolution,
      centuries before Europe.
      A farmer, a wheel, a load —
      the physics of it perfect.
      No one writes epics
      about wheelbarrows.
      But the harvests moved,
      the bricks moved,
      the empire moved —
      one wheel at a time.
    description: "I pushed a Han wheelbarrow — one wheel carrying a mule's load — the quiet revolution no one writes epics about, moving the empire's harvests one wheel at a time."
    status: "first draft"
    sha256: "8264935342f5de58f70f7a94d0095376ab4ea25618433bbb4906a4355b180da5"
  - number: "1389"
    volume: 2
    title: "The Lodestone Spoon"
    date: "1 BCE"
    region: "China"
    poem: |
      The diviners carved it —
      a spoon of lodestone, magnetic stone,
      balanced on a bronze plate:
      the spoon's handle always pointed south.
      I watched a diviner use it.
      Not for navigation — for feng shui,
      for aligning the mystical,
      the spoon trembling to the south.
      The lodestone spoon:
      the first compass,
      pointing south for diviners
      a thousand years before sailors.
      The south-pointer.
      The needle's ancestor.
      A spoon that knew the way —
      even if its makers
      only asked it about ghosts.
    description: "I watched a Han diviner's lodestone spoon tremble south on its bronze plate — the first compass, pointing for ghosts a thousand years before it pointed for sailors."
    status: "first draft"
    sha256: "7b795b7d05ab631f449a8258cabf6aedbc8527d7f84b926868bdd76f392f4839"
  - number: "1390"
    volume: 2
    title: "The Steel of the South"
    date: "1 BCE"
    region: "India"
    poem: |
      In the south, they forged it —
      wootz steel:
      the crucible metal,
      water-marked, rippled,
      the steel swords would be named for —
      Damascus, they called it later.
      I watched a smith work.
      The crucible. The slow cool.
      The blade, patterned like water.
      The steel of the south:
      India's gift to the world's swords.
      The finest blades of the age —
      flexible, hard, beautiful.
      Roman merchants bought it.
      Arab smiths prized it.
      The water-marked metal,
      from Indian crucibles,
      carried the edge of empires.
    description: "I watched an Indian smith draw water-marked wootz steel from the crucible — the metal of Damascus blades — the south's gift to the swords of empires."
    status: "first draft"
    sha256: "39ef47f859694d8298de3e30cc85052c0069d708bd87b7149f824157214a4888"
  - number: "1391"
    volume: 2
    title: "The Island of Gems"
    date: "1 BCE"
    region: "Sri Lanka"
    poem: |
      They sailed to Taprobane —
      the island of gems:
      pearls from the gulf,
      sapphires from the rivers,
      elephants for the wars
      of kings.
      I walked the gem markets.
      The stones glowed —
      blue, white, the pigeon's blood red.
      Traders from Rome, from India,
      from the east, all bargaining.
      The island of gems:
      Sri Lanka's ancient trade,
      pearls and sapphires
      for the world's rich.
      The elephants went to war.
      The gems went to necks.
      The island kept the rivers
      that made them both.
    description: "I walked Taprobane's gem markets — pearls, sapphires, war elephants — the island of gems trading its rivers' riches to Rome, India, and the east."
    status: "first draft"
    sha256: "efc8d96f48c8ddc1df5926f2e82cd46c6a9307cd11efe39625da9347479606c2"
  - number: "1392"
    volume: 2
    title: "The Heavenly Horses"
    date: "1 BCE"
    region: "Central Asia"
    poem: |
      In Ferghana, they bred them —
      the heavenly horses:
      swift, strong, beautiful,
      worth their weight in gold
      on the Silk Road.
      I rode one.
      The speed. The spirit.
      China went to war for them —
      the Han wanted the blood-sweating horses
      for the cavalry.
      The heavenly horses:
      the engines of the Silk Road,
      the prize of empires,
      the gold-weight steeds
      of the Ferghana valley.
      A horse worth its weight in gold.
      The steppe's answer
      to silk.
    description: "I rode a Ferghana heavenly horse — swift, gold-weight, the steppe's answer to silk — the breed China went to war for, engines of the Silk Road."
    status: "first draft"
    sha256: "50cf082d8a31a64ce1c4dbebf29d2170e32565c371879df71d0d4e7646cd797c"
  - number: "1393"
    volume: 2
    title: "The Peace Holds"
    date: "1 CE"
    region: "Rome"
    poem: |
      Augustus counted —
      the soldiers: twenty-eight legions.
      The coins: the treasury full.
      The empire: at peace,
      from the Atlantic to the Euphrates.
      I was in Rome that year.
      The city gleamed — marble, the boast:
      I found Rome brick and left it marble.
      The Ara Pacis stood.
      The forums stood.
      The peace holds.
      The classical world —
      Greece, Rome, Han China, Mauryan India,
      Persia, the Maya rising —
      stands at its height.
      I have walked it all —
      the forums and the frontiers,
      the deserts and the seas.
      The traveler rests, a moment,
      at the top of the world.
      The peace holds.
      For now.
      End of Volume II — continued in Volume III.
    description: "I stood in marble Rome as Augustus counted his legions and coins — the classical world at its height, forums to frontiers — the traveler resting a moment at the top of the world."
    status: "first draft"
    sha256: "beda573a50d0519528be6fea699d5e1b9c2d2745aed7c57ca0c5304f18c2a425"
