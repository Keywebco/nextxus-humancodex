# Living Library, Vol. 1: Deep Time to the First Villages
# Entries 0044 to 0593. Free to download, print and share, forever.
# Text source: the HumanCodex Verse collection (converted by Pontus). Every entry carries a SHA-256 of its poem text so any change can be detected.
# Status "published": the text and numbering are final as published. A poem may still be improved later; every change is dated and the old text is kept. Numbers are permanent: new poems get numbers after 4343, nothing is ever renumbered.
entries:
  - number: "0044"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Lake Walkers"
    date: "c. 4,200,000 BCE"
    region: "Kenya"
    poem: |
      I came down to the water where the reeds were tall,
      And heard them before I saw them — a soft splashing fall.
      They moved half-upright through the papyrus and the sedge,
      With arms that still remembered the safety of the ledge —
      Climbing arms, walking legs, a body torn between
      The trees it used to live in and the ground it hadn't seen.
      I watched them wade the shallows where the hippos rolled,
      And leave their bones behind them in the Kenyan mud, the cold
      Long settling of the silt, the slow and patient deep
      That keeps what fell there once, and keeps it while we sleep.
      They didn't know the future. They only knew the shore.
      But they were us already — walking, wanting more.
    description: "At an ancient lakeshore, creatures with arms for climbing and legs for walking leave their bones in the Kenyan mud."
    status: "published"
    sha256: "bd623333314fd6278849ec740ecbff1b15fe1af9c935c6fff346af9ffbc6a8dd"
  - number: "0045"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "A Jaw in the Mud"
    date: "c. 4,150,000 BCE"
    region: "Kenya"
    poem: |
      I knelt in the trench where the earth was peeled away,
      And held a jawbone older than any name.
      The teeth were almost human — flat, worn, small —
      The braincase it belonged to, ape, was all
      Of the old world still. Between those two truths,
      A creature learned to stand up on its roots.
      No tools. No fire. No words to mark the day.
      Just a mouth that bit, and feet that walked away.
    description: "A fossil jaw with human-like teeth and an ape-like skull marks the oldest known upright walker."
    status: "published"
    sha256: "571ae269afecf316d824281c4abc2fdd437ec6b7748ffe8849bbcd1e7f491449"
  - number: "0046"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Middle Awash Striders"
    date: "c. 4,100,000 BCE"
    region: "Ethiopia"
    poem: |
      I followed the river where the leg bones lay,
      Shin and thigh in a row, and I knew the fight was done.
      The fingers still hooked — they could still take the branch —
      But the feet had chosen. They had chosen the long stance.
      Heel down, toe off, the same as mine, as yours,
      A million million footfalls before the doors
      Of anything we'd call a home. I walked behind them in the heat,
      My stride inside their stride, my feet inside their feet,
      And felt the moment when the walking simply won —
      Not with a shout. Just onward, on and on.
    description: "New fossil legs show walking had already won — the stride is upright even while the fingers still hook branches."
    status: "published"
    sha256: "787cf0af8d85c79e3423127cc50830cdd724783998c8d2d77c8da0821629c31e"
  - number: "0047"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "Night Nests"
    date: "c. 4,000,000 BCE"
    region: "Kenya"
    poem: |
      When the sun went down they climbed the fever trees,
      And wove their beds from branches in the breeze,
      Dark nests against the leopards and the night —
      Small warm bodies curled out of the sight
      Of anything with teeth. I climbed below them, still,
      And listened to them breathing. The hill
      Was quiet. They slept above the earth they'd walked all day —
      Half out of the trees now, but not all the way.
    description: "The walkers still build sleeping nests in trees, safe from the night's hunters — walking by day, roosting by night."
    status: "published"
    sha256: "ab679770cfecf6694e29aba51b74da47a02037251a4b9b6ac6c0632aea73f749"
  - number: "0048"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The First Long Journeys"
    date: "c. 3,950,000 BCE"
    region: "Kenya"
    poem: |
      I walked with them from water-hole to water-hole,
      Three hours at a stretch under a sky like coal
      At noon, then gold at evening. Their foot bones told the tale:
      Short toes, strong arches — built for the long trail.
      No beast walks that far for no good reason.
      They learned the seasons. They learned the reason
      Grass goes brown and where the tubers hide.
      I fell behind them by the second stride
      And watched them go — a line of backs, dark, lean,
      Heading out across the savanna green
      Into the shimmer of the afternoon,
      Two legs, one rhythm, never out of tune.
      Distance was their first invention. The rest
      Came later. First they learned to walk the best.
    description: "Foot bones built for distance show these creatures ranged the savanna on two legs for hours at a time."
    status: "published"
    sha256: "d2900ed651ba913dba44b8c7c0c138a1af42b098636010bf5b08573f2b0c60bb"
  - number: "0049"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Passing of the Torch"
    date: "c. 3,900,000 BCE"
    region: "Ethiopia"
    poem: |
      One kind of walker fades — I saw it go,
      The last ones thin among the acacia, slow,
      Their bones the final pages of their story,
      And handed, silent, all their gathered glory
      To cousins with a longer, freer stride,
      Australopithecus afarensis, open wide
      Across East Africa. The torch doesn't burn —
      It walks. It passes. It will not return
      To the hand that held it. That's the rule of the road:
      You carry it a while. You set down the load.
      And someone younger picks it up and runs.
      I've watched it happen under a thousand suns.
    description: "As one walker fades, its cousin Australopithecus afarensis spreads across East Africa with a longer, freer stride."
    status: "published"
    sha256: "be629e85891542b3e79a031e222309524a41e97d90921f2bc4045f0a7b0d85cd"
  - number: "0050"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Plain of Ash"
    date: "c. 3,800,000 BCE"
    region: "Tanzania"
    poem: |
      The mountain cleared its throat.
      The sky went grey.
      The plain of Laetoli
      Went white that day —
      Fine ash, soft ash,
      Laid down like snow.
      Something was coming
      The wind didn't know.
      I stood in the falling
      And felt it too:
      The ground getting ready
      To remember you.
    description: "A volcano dusts the Laetoli plain with fine ash — soon it will keep a record no hand ever wrote."
    status: "published"
    sha256: "e2f3e9ac87e8c4dda13d5926c4c534f88401b2696e7719dcc27155611658a117"
  - number: "0051"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "A Mother's Arms"
    date: "c. 3,750,000 BCE"
    region: "Ethiopia"
    poem: |
      Her arm bones were long — I held them in my hands
      And knew at once what the strength was for.
      Not climbing. Not fighting. Carrying.
      A child, a year, two years, three years more,
      Riding her hip while she walked the open ground,
      One arm around the small warm weight, the sound
      Of two breaths keeping time. The plains were wide
      And full of teeth. She carried and she walked.
      That's how we got here: someone never stopped.
    description: "A female's long, strong arm bones show mothers carried their young for years while walking the open plains."
    status: "published"
    sha256: "a10e8cba08230812fb383d924576c65bc6d2fc47cb4768dc4006d9e2fa83ab0e"
  - number: "0052"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Crossing at Laetoli"
    date: "c. 3,700,000 BCE"
    region: "Tanzania"
    poem: |
      The ash fell fresh at dawn, and by mid-morning
      Three of them came — I was standing there, watching —
      And crossed the plain where no foot had ever been.
      The first walked tall, the second walked between
      The first one's steps, and small behind them came
      A third — a child? — learning the same game
      Of heel and toe, the same old human beat.
      I watched the mud take hold of every foot:
      The heel press deep, the arch rise, the toes
      Push off — the whole long story in a row
      Of prints across the whiteness, side by side,
      A family going somewhere, single-file and wide.
      Then came the rain — soft, stippling the ash —
      And hardened it to stone in a single flash
      Of time. I stood there when the wind went still
      And knew I'd seen the first road ever made,
      Not by a hand, not by a plan, just feet
      That walked because the walking felt complete.
      Three million, seven hundred thousand years —
      I count them still. The prints are there. They're theirs.
      The first family walk. The first ones who said,
      Without a word: this way. Follow. Ahead.
    description: "Fresh volcanic ash covers the ground, and three australopithecines walk across it side by side, their footprints hardening into stone."
    status: "published"
    sha256: "ed6075242a7d626e35cbc06f67d0a0e1324629c4aa13f5989288d8c8815e88e6"
  - number: "0053"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Smallest Footprints"
    date: "c. 3,700,000 BCE"
    region: "Tanzania"
    poem: |
      The little one was tired — I could tell the way
      Its small feet stepped inside the big ones, day
      After day across the ash. It chose the deep
      Print of the mother, where the walking's cheap,
      Where each step's already made. Smart child.
      The plain was wide and the morning wild,
      But safe inside those larger, older toes
      It walked. That's how the smallest of us grows:
      Inside the steps of someone who went first.
      Thirst quenched by someone else's burst
      Of effort. Every child I've ever known
      Steps in the footprints not their own.
    description: "The tiniest prints step carefully inside the largest ones — a child walking in an adult's tracks."
    status: "published"
    sha256: "54f1e818bd52636d913b6d41f785b3d73f5371613afe571a9a663f980fc6d08c"
  - number: "0054"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "Rain on the Trail"
    date: "c. 3,680,000 BCE"
    region: "Tanzania"
    poem: |
      After they passed, the clouds came low and broke,
      And rain fell on the ash — each drop a stroke
      That pocked the footprints' rims, a stippled skin
      Of tiny craters. I was there. I stood within
      The smell of wet dust rising. Hours, not days —
      The prints were fresh when the storm began its praise
      Of water. One morning's journey, that's the whole
      Of it: three walkers, rain, and a patch of soul
      Kept in the stone. The weather signed the page.
      The ash said: they were here. The rain said: this age.
    description: "Rain pocks the ash trail after the walkers pass — proof the footprints were fresh within hours, a single morning's journey."
    status: "published"
    sha256: "444f0d08fe1b60be8171c2ef40be8bb0921bea70f97721e1eac804c45f745bb5"
  - number: "0055"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Second Party"
    date: "c. 3,660,000 BCE"
    region: "Tanzania"
    poem: |
      Later — maybe that same day, maybe the next —
      New prints appeared beside the first one's text:
      A second large one, and another small,
      Walking the same ash, answering the same call.
      I read the ground like a letter from a friend:
      Two families, or one that wouldn't end
      At three. A band. A people. Moving through
      The morning together — me, and her, and you
      And the little ones stepping in the deep.
      The plain was white. The footprints wouldn't keep
      Their secret. I stood there counting what I saw:
      Not three walkers anymore. A law —
      That we go together, or we don't go far.
      I watched them vanish toward the hills afar.
    description: "New trails appear beside the old: a second large walker and another small one — a whole family group crossing together."
    status: "published"
    sha256: "e2cf53af1f0831aa6794bdef0eaed56cb54986739747879d790bdba459b71219"
  - number: "0056"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "Little Foot"
    date: "c. 3,600,000 BCE"
    region: "South Africa"
    poem: |
      Deep in the limestone, where the dark is old,
      A skeleton lies curled inside the cold
      Stone — the most complete we've ever found,
      A climber-walker wrapped in underground
      Silence. I stood at the shaft where it fell through,
      The crack in the earth it couldn't see, and knew
      Too late — a misstep in the dark, the long
      Drop down. The cave keeps it. The cave is strong.
      It holds the bones the way the earth holds all:
      No triumph here, just the long, soft fall.
      I lit no torch — there was no torch to light —
      And left it sleeping in the endless night.
    description: "In a limestone cave, the most complete ancient skeleton ever found lies in stone — a climber-walker who fell in long ago."
    status: "published"
    sha256: "294bd784c5cb50ad15ad51087471ece996c29bc7abf1346310409f726de2b918"
  - number: "0057"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Man-Stride"
    date: "c. 3,600,000 BCE"
    region: "Ethiopia"
    poem: |
      Heel, arch, push. Heel, arch, push.
      The prints at Laetoli's sister sites say the same
      Thing in the same order — the body's frame
      Was ape above, but below, the feet were us.
      I matched my stride to theirs and made no fuss
      About the million years between our days —
      The rhythm's the same. It always stays.
      Heel down first, the weight rolls to the toe,
      The push, the swing, the next one — that we know
      By heart, by bone, by every step we've taken.
      The stride was human before we were awakened.
      An ape's arms, a climber's grip, a brow
      Like night — and walking exactly like us now.
    description: "Afarensis leaves a trail with a stride any human would recognize — heel, arch, push — in a body built like an ape."
    status: "published"
    sha256: "dea05eed8280a1cfd9f1fc68bf82066ae221f3a35e5a93630890e9453f09001d"
  - number: "0058"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Flat-Faced One"
    date: "c. 3,500,000 BCE"
    region: "Kenya"
    poem: |
      The skull was crushed, but the face was flat —
      Not jutting like the others. Small teeth at
      The front, a different answer to the same
      Old question: how to eat, how to tame
      The savanna's hardness. Two kinds of walkers now,
      Sharing the lakes, the plains, the same high brow
      Of sky. I stood between their territories
      And heard two different versions of our stories
      Beginning. The earth was trying more than one
      Way to make us. Only one would see the sun
      Of later ages. But that day, at the shore,
      Both drank. Both lived. Both wanted more.
    description: "A crushed skull with a flat face and small teeth reveals a second kind of walker sharing the lakes and plains."
    status: "published"
    sha256: "a54469f60decabc121e2c662afd742990843194cd84a754175a3a91a0c3801de"
  - number: "0059"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Laetoli of the East"
    date: "c. 3,470,000 BCE"
    region: "Ethiopia"
    poem: |
      In Afar the ash fell too, and feet went through it —
      New prints, fresh proof the walk had spread, the two-legged
      Habit of East Africa, coast to highland.
      I stood where the wind still lifts the sand
      And felt how big it got: not one plain, not one trail,
      But a whole country learning, without fail,
      To stand up. The prints point every way at once —
      North, south, the water, the thorn-bush dunce
      Of scrub. They went wherever feet could go.
      The walking won. The walking said: hello.
    description: "New footprints in Afar ash confirm the two-legged walk had spread across the whole of East Africa."
    status: "published"
    sha256: "401e60689d4d96725d3b0f9632eb22de678a1731c4b48235fe3fca6c25a40660"
  - number: "0060"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Burtele Foot"
    date: "c. 3,400,000 BCE"
    region: "Ethiopia"
    poem: |
      This foot had a thumb for a big toe —
      A grasping thing, built for the branch, although
      The rest of it walked. I held the fossil long
      And thought: not every road is the same song.
      Some kept the trees as a way of life,
      The grip, the climb, the branch above the strife
      Of open ground. They walked, but they could leave —
      Up into green, where the leopards grieve
      Their lost prey. Two answers to the fear:
      Walk the plain, or keep the treetops near.
      I don't know which was wiser. Both were true.
      The earth was large enough for more than you.
    description: "A fossil foot with a grasping big toe shows not every walker walked the same way — some still climbed as a way of life."
    status: "published"
    sha256: "7a38f061e5ba355ef2fb459d379ece32c215ef03f44f1a9602dfb8e1a81d8263"
  - number: "0061"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Stone Breakers"
    date: "c. 3,300,000 BCE"
    region: "Kenya"
    poem: |
      Stone on stone.
      The first blow.
      At Lomekwi, hands learned
      What rock could know:
      Hit it right —
      The flake flies free.
      A sharp edge
      Where none used to be.
      Older than we thought,
      Older than the tale —
      Three million years
      Before the sail,
      Before the wheel,
      Before the word:
      A smashed rock,
      The sharpest heard.
      Stone on stone.
      The sound stays.
      I hear it still
      Across the days.
    description: "At Lomekwi, someone learns to smash rocks together to make sharp flakes — tools hundreds of thousands of years older than any we knew."
    status: "published"
    sha256: "57b37e8419b179f7ca2b62e5459544e2d52c097879becab1ec931a0b1f9c35dd"
  - number: "0062"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "Anvils of the River"
    date: "c. 3,300,000 BCE"
    region: "Kenya"
    poem: |
      The river stones are round and worn and grey,
      And pitted where the hammer-cobbles fell —
      Thump, thump, the long work of the day,
      Cracking the nuts, the marrow-bones as well.
      I sat beside the anvil-stones and heard
      The rhythm of the eating, hard and plain:
      The crack, the scoop, the rich fat stirred,
      The strength to walk the hungry months again.
      No poetry in it — just the daily bread,
      The pits in stone, the hands that never rest.
      But every flake they struck, every nut they fed,
      Was practice for the hands that built the best
      Of us. The river keeps the anvils still.
      I left them there. The river always will.
    description: "River-worn stones bear pounding pits: great cobbles used as hammers to crack open nuts and marrow bones."
    status: "published"
    sha256: "31fd8b232e5a2d4406f5974eabdbff33c53041b8ca001211f022c35a9700f645"
  - number: "0063"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Marked Rib"
    date: "c. 3,300,000 BCE"
    region: "Ethiopia"
    poem: |
      A rib. A fossil rib.
      And on it, lines —
      Thin, straight, deliberate,
      Cut marks. Signs
      That sharp stone did this,
      That meat was taken,
      That someone sliced
      While the world was waken-
      Ing to the taste.
      I ran my finger down
      The ancient cuts
      And heard the sound —
      Not of the knife,
      But of the mind
      Behind the hand,
      Learning to find
      Food in the bone.
      The rib keeps score.
      We'd learned to eat
      And wanted more.
    description: "Cut marks on a fossil rib show sharp stones were already slicing meat from bone."
    status: "published"
    sha256: "db2a28c0bc281f8bf9b2c9bca971240cd5fb87b4d9dfd5d731c0cce5d2826302"
  - number: "0064"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "Lucy"
    date: "c. 3,200,000 BCE"
    region: "Ethiopia"
    poem: |
      They called her Dinkinesh — "you are marvelous" —
      And marvelous she was, though she never knew the fuss.
      A young one, maybe twenty, small and quick and strong,
      Who died beside the river three million years long
      Ago, and lay there waiting in the Afar dust
      For hands to lift her gently, for eyes to learn to trust
      The story in her bones. I was there when she fell —
      Not the moment, but the age. I know it well:
      The heat, the thorn trees, the dust that never ends,
      The way the young ones laugh, the way the old ones mend.
      Half a skeleton — the most complete we'd seen —
      A girl who climbed the branches and walked the spaces between.
      I think of her at evening, when the light goes gold,
      A young female afarensis, brave and small and bold,
      Who never knew her name would cross the world entire,
      Who never held a tool, who never saw a fire,
      And yet she is the mother of the famous and the known,
      The first face of the family carved in ancient bone.
      Dinkinesh. You are marvelous. The dust agrees.
      I stood where she stood, underneath those trees.
    description: "Dinkinesh — \"you are marvelous\" — a young female's half-complete skeleton rises from the Afar dust, the most famous ancestor of all."
    status: "published"
    sha256: "4fe1881f4b694877f18cb9d8d1e5a66d22122b51f9febaaf3e66fe54794d799e"
  - number: "0065"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Little One"
    date: "c. 3,200,000 BCE"
    region: "Ethiopia"
    poem: |
      Three years old — I held the tiny bones
      And marveled at how fast the young ones grow
      In that hard world. The child climbed well — the tones
      Of muscle in the arms said: trees, you know,
      Were still a refuge. Small hands, strong grip,
      A mother's back, the high branches' shade.
      I sang no lullaby — there was no lip
      For singing yet — but in the dust I made
      A small soft sound, the way we always do
      For children. Sleep, little one. The night is deep.
      The leopards hunt, but the branches hold you.
      Three years of climbing. Now, forever, sleep.
    description: "A three-year-old's skeleton, found nearby, shows the new species grew up fast and climbed well."
    status: "published"
    sha256: "905aab2a05381ead14300aefd6c2e95fd3f87d5c97064d44cce9b7ec2afc7abd"
  - number: "0066"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "A Scar on the Bone"
    date: "c. 3,150,000 BCE"
    region: "Ethiopia"
    poem: |
      The arm was broken — and it healed.
      Someone stayed.
      Someone brought food,
      Someone made shade.
      The bone knit back
      In the slow old way,
      And the walker walked
      Another day.
      I touched the scar
      Where the break had been:
      The first hospital
      Was simply kin.
      No words for mercy,
      No prayer, no art —
      Just someone staying
      With a broken heart
      Beside the broken.
      That's the start
      Of everything human:
      The staying part.
    description: "A healed break in an arm bone tells of someone who was cared for — the injured one lived long enough to mend."
    status: "published"
    sha256: "b45f04b1a88653d0624d8c6f8bcae32cc26ed794f3617e3d95478d843facc124"
  - number: "0067"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Golden Jaw"
    date: "c. 3,000,000 BCE"
    region: "Ethiopia"
    poem: |
      A jawbone in the Afar, the teeth like ours —
      Not ape, not yet, but leaning toward the hours
      Of morning. I held it up against the sun
      And saw the future hiding, just begun.
      The earliest whisper of the name we'd take:
      Homo. The shape the earth was learning to make.
      No bigger brain yet, no tool in hand —
      Just teeth that said: something new in the land.
      I put it down exactly where it lay,
      A golden secret in the dust of day.
      The walkers didn't know. They couldn't know.
      But I was there to watch the first seeds grow.
    description: "A jawbone with human-like teeth appears in the Afar — the earliest whisper of our own genus, Homo."
    status: "published"
    sha256: "b4d725a8b4de5f9877d65b8f21d657d5b3cc9898cabfa738993f7b40cc4ed0a3"
  - number: "0068"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Cave of Falling Bones"
    date: "c. 2,900,000 BCE"
    region: "South Africa"
    poem: |
      The limestone shafts go down and down and down,
      And at the bottom, bones — a quiet town
      Of walkers who slipped in the dark and never
      Climbed out. I stood at the mouth forever,
      It seemed, and listened to the dripping stone.
      Each one alone. Each one alone.
      No struggle in the record — just the fall,
      The dark, the stillness. That is all.
      Sterkfontein keeps them in its cold embrace,
      Bone by bone, face by faceless face.
      I left a stone at the edge, the way we do,
      And whispered down the dark: I remember you.
    description: "Sterkfontein's limestone shafts gather the bones of walkers who slipped into the dark and never climbed out."
    status: "published"
    sha256: "3bc681212fc1e20d71531f4a1887de926648fcb6385107d8ed903058eee0fc73"
  - number: "0069"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Taung Child"
    date: "c. 2,800,000 BCE"
    region: "South Africa"
    poem: |
      A child's skull, and in it, cast in stone,
      A brain the shape of a human baby's own —
      Small head, upright stance, the proof we sought
      That these small walkers stood the way we ought.
      I held it gently — it was someone's child,
      Three, maybe four, who played and laughed and smiled
      Beside the water, till the eagle came —
      The marks are there. I will not name
      The horror. Only this: the small skull keeps
      The shape of every child who ever sleeps
      In a parent's arms. The brain was almost ours.
      It dreamed, perhaps, of trees and sun and flowers.
    description: "A child's skull with a brain cast shaped like a human baby's proves the small-headed walkers stood upright."
    status: "published"
    sha256: "4761abe8d69772010e3d75b65378b405fdd12391149dc0fe9f53df2e0044137a"
  - number: "0070"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Lonely Jaw"
    date: "c. 2,800,000 BCE"
    region: "Ethiopia"
    poem: |
      One jawbone. In all the Afar desert, one.
      The oldest of our genus, under the sun,
      Its teeth between the ape and what we'd be —
      A bridge of bone across a vanished sea
      Of time. I walked the desert where it lay
      And found no others. Just the wind's long say,
      The dust, the heat, the emptiness of stone.
      The first of us was very much alone —
      Or seemed so. Maybe kin were just beyond
      The ridge, beside some unforgotten pond.
      I like to think so. No one starts the race
      Entirely alone. There's always a face
      Behind the first one. Still, the jaw remains:
      One voice, calling, through the dust and rains.
    description: "A single jawbone in the Afar desert — the oldest fossil of the genus Homo — with teeth between ape and human."
    status: "published"
    sha256: "98bc303fba8d5cf877e281d94703a9515f5e489e73f0f15b5e005dc116dc9857"
  - number: "0071"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Oldowan Choppers"
    date: "c. 2,600,000 BCE"
    region: "Tanzania"
    poem: |
      At Olduvai the hammerstones ring out —
      Take a river pebble, turn it about,
      Strike! The flake flies off, the edge is keen.
      The simplest tools the world has ever seen,
      And the beginning of everything we make.
      I watched the knappers work beside the lake:
      Tap, turn, strike — the rhythm never ends,
      The core grows smaller as the flake extends
      The hand's own reach. A chopper in the fist
      Is worth a thousand teeth the lions missed.
      Two million, six hundred thousand years —
      The first tradition. The first of our careers:
      To take the world and shape it to our will.
      The hammerstones are ringing still.
    description: "At Olduvai Gorge, hammerstones knock sharp flakes from river pebbles — the first great tool tradition of humankind."
    status: "published"
    sha256: "b6fb846bbe6a71b78f77154041212d30395c433449d2a91de40acbe1053e2b2e"
  - number: "0072"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Butcher's Floor"
    date: "c. 2,600,000 BCE"
    region: "Tanzania"
    poem: |
      Bones on the ground, and flakes among the bones —
      Cut marks on the ribs, the shattered stones
      Of marrow. This was where the eating learned
      Its second lesson: meat, once the lions turned
      Away, was ours to take. I stood among
      The scattered pieces where the vultures hung
      Back, waiting. Early hands, not strong, not fast,
      Learned to be clever — learned to make it last.
      The butcher's floor was never clean or fair.
      It smelled of blood and dust and open air.
      But it was ours — the first place we could say:
      We ate here. We lived another day.
    description: "Animal bones scattered with cut-marked flakes mark a place where early hands learned to take meat from carcasses."
    status: "published"
    sha256: "7de9fc321f488cfcf19dbb1d31edaff1ea816c55fa0c72f94ba2e9bde626b712"
  - number: "0073"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Kada Gona Flakes"
    date: "c. 2,550,000 BCE"
    region: "Ethiopia"
    poem: |
      Fresh edges at Kada Gona, sharp and new —
      The craft was traveling, hand to hand, it's true,
      Up the Rift Valley, camp to camp,
      A spark passed on like fire from a lamp
      Not yet invented. I watched the knowledge walk:
      One watcher, one tryer, then the talk
      Of hands — no words, just showing, just the knack
      Passed on, and never taken back.
      The flakes grew sharper as the miles went by.
      The teachers never knew the reason why
      It mattered. It just did. The stone knows best:
      Teach it forward. Let the skill do the rest.
    description: "Fresh sharp edges at Kada Gona show tool-making spreading up the Rift Valley, hand to hand."
    status: "published"
    sha256: "a21298951becd8d30cf5c84e322d40e90ac83fb62633943045ae76e07facff68"
  - number: "0074"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Nutcrackers"
    date: "c. 2,500,000 BCE"
    region: "South Africa"
    poem: |
      In the south the jaws grew huge — I saw the skulls,
      Cheek teeth like millstones, ridges, thick white hulls
      Of enamel grinding roots and nuts all day.
      The heavy-chewers found their own hard way
      To live: not faster, not with sharper stone,
      But chewing what the others left alone.
      I watched one crack a palm nut, slow and sure,
      The sound like thunder, steady, deep, demure.
      They were our cousins, not our line — but still,
      They ate, they lived, they climbed the morning hill.
      The earth tries many answers to one thirst.
      Ours won. But theirs was honest. Theirs was first
      In patience. Grind on, grinders, in the stone:
      You fed your children. That is not alone.
    description: "In the south, a heavy-jawed cousin grinds tough roots and nuts with massive chewing teeth."
    status: "published"
    sha256: "141d5d65d7063036e009c0821cecde38b7b2904a232ef39662d537812b7415a0"
  - number: "0075"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Southern Frontier"
    date: "c. 2,450,000 BCE"
    region: "Malawi"
    poem: |
      One jawbone, far south of the Rift —
      The tool-bearers had left the old lift
      Of the valley and were walking new ground.
      I held the jaw and looked around:
      Lake Malawi blue, the hills beyond,
      The same red dust, the same old pond
      Of sky. They'd come so far from where it started —
      A pebble struck, a flake, a journey charted
      In stone. The frontier wasn't a line on a map.
      It was a footprint, then another. The gap
      Between the known and not got crossed by feet,
      Not flags. I walked it. The walking's sweet
      When the land is new. One jaw, one land, one song:
      The tool-bearers were moving. Moving long.
    description: "A jawbone found far to the south proves the tool-bearers were spreading beyond the Rift."
    status: "published"
    sha256: "c7a06d1a1c4359122f5e52ccfba971dc9ecd7609f38bd5b910d4a98708495b7c"
  - number: "0076"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Handy Man"
    date: "c. 2,400,000 BCE"
    region: "Tanzania"
    poem: |
      Bigger brain. New hands.
      I held the fossil fingers in the dust
      And felt the grip — the thumb that learned to trust
      The stone. Homo habilis: the handy man,
      The first to hold the future in his hand
      And shape it. Not with strength — the lions had more —
      But with the clever fingers, with the lore
      Of edges. I watched him work a core to flakes,
      Each strike a small decision the mind makes
      Before the hand moves. That pause — that's us.
      The brain behind the brow, the quiet plus
      Of thought before the blow. He didn't know
      His name. He only knew the stone, the flow
      Of making. Handy man, I saw you then:
      The first of us who made the world again.
    description: "A new, larger-brained fossil — Homo habilis — has hands built for gripping stone tools."
    status: "published"
    sha256: "5158cecd7128bc1f2067bc5410e9026caf5b81620eed23a4f7263ac2a3c46162"
  - number: "0077"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Skilled Scavenger"
    date: "c. 2,330,000 BCE"
    region: "Tanzania"
    poem: |
      The lions ate first — that was the law of the land —
      And the handy man came second, stone in hand.
      I watched them move in after the pride had fed,
      Cutting the meat from what the lions left for dead.
      Not hunters yet. Not strong enough to kill.
      But clever — clever is a kind of will.
      The bones beside the hearth (?) — no hearth, just ground —
      Tell the story: cut marks all around,
      Marrow cracked, the rich fat taken clean.
      They ate meat often. They ate like they'd seen
      The future. Scavenger's a noble trade
      When you're the one the sharp stones made.
      I stood downwind and watched them work the kill:
      The lions' leavings, and the human will.
    description: "Cut-marked bones beside habilis remains show the handy man ate meat often, taken from lion kills."
    status: "published"
    sha256: "fd6cc1ddaf03af18f9b00e2686ccc4c0bea5a6a0c6d82db683275588910d95e0"
  - number: "0078"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Workshop Floor"
    date: "c. 2,300,000 BCE"
    region: "Kenya"
    poem: |
      Cores and flakes, scattered in the sun —
      A place where stones were knapped, and not just one,
      But hundreds, by hands that came and came again.
      I knelt among the debitage, and then
      I understood: this was a workshop floor,
      An open-air factory, and nothing more
      Mysterious than work. The same rock struck
      The same way, day on day. Not luck —
      Practice. Someone taught, someone learned,
      Someone swept the flakes aside and turned
      Back to the core. Two million years before
      The factory, the office, the store —
      We had this: a place to make the things we need,
      A floor of stone, a patient hand, a deed
      Repeated till the skill was in the bone.
      I sat there till the light was gone, alone,
      And felt the oldest workplace in the world
      Hold me. The flakes lay where they were hurled.
    description: "A scatter of cores and flakes marks a place where stones were knapped again and again — an open-air tool workshop."
    status: "published"
    sha256: "f05423e79410d74ce91fc716ae54457a96cc802f4927b66dff6fa05a0e0b6071"
  - number: "0079"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "Mrs. Ples"
    date: "c. 2,000,000 BCE"
    region: "South Africa"
    poem: |
      She smiles out of the limestone — Mrs. Ples,
      The almost-perfect skull, the face that says
      I was here, I lived, I knew the southern sun.
      Australopithecus africanus — the one
      They named for a lady, though the bones may be
      A him. I stood before her, and she
      Looked back at me across two million years
      With empty eyes and neither hopes nor fears —
      Just bone, just the beautiful round dome,
      The small teeth, the face that found a home
      In stone. I bowed — it seemed the thing to do —
      And whispered: we remember. We remember you.
    description: "A nearly perfect skull of Australopithecus africanus — \"Mrs. Ples\" — smiles out of the Sterkfontein limestone."
    status: "published"
    sha256: "38df2dff5356b30352e9c12ae32cf61df3748c2e09e0cc21f95647d096bf7361"
  - number: "0080"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Spring Child"
    date: "c. 1,980,000 BCE"
    region: "South Africa"
    poem: |
      Small brain, long arms, and hands like ours —
      A new kind, climbing still among the flowers (?)
      No flowers yet to speak of — thorn and grass —
      But the child of the spring would climb and pass
      Between the worlds: the branch, the ground, the stone.
      I watched the young ones — never quite alone,
      Always in reach of green, of something high
      To flee to when the leopards prowled by.
      Human hands on an ancient frame: the grip
      That one day would hold the pen, the whip,
      The plow. But then, it held the branch. That's all.
      The spring child's answer to the fall
      Was climb. And walk. And climb again. And be
      Both. I watched. It was enough for me.
    description: "A new small-brained species with long arms and human-like hands climbs and walks at once."
    status: "published"
    sha256: "c50f5e3d187671ecc0538a2f3a9cf4562e317660d9eb99da93618663c220a859"
  - number: "0081"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Rise of Erectus"
    date: "c. 1,900,000 BCE"
    region: "Kenya"
    poem: |
      Tall. Long-legged. Built to run.
      I saw the first of them under the African sun
      And knew the world had changed. Homo erectus —
      Upright man, the wanderer — the rest of us
      Would follow where those long legs led.
      No more the climber's crouch, the branch's bed:
      These were runners, striders, built to roam
      The open country and call the whole earth home.
      I matched my stride to theirs and felt the pull —
      The horizon wide, the heart strangely full.
      They didn't know how far those legs would go:
      To Asia's forests, to the northern snow.
      But I knew. I walked beside them, and I knew.
    description: "A tall, long-legged new human — Homo erectus — appears in Africa, built to run and to wander."
    status: "published"
    sha256: "0eac492fb8496f53787c5b23bd8ae5f75cf89f366865c525275dc0b23b1e8f87"
  - number: "0082"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The First Butcher's Knife"
    date: "c. 1,850,000 BCE"
    region: "Kenya"
    poem: |
      At Kanjera the flakes came out sharp and keen,
      And whole antelope fell to the working team —
      Not scavenged this time, but taken, carried home,
      The meat divided where the many roam
      Together. I watched them work the carcass down,
      The knives of stone, the hands stained brown,
      The sharing — that was new. The strong ones could
      Have kept it all. They didn't. And that's good:
      The first butcher's knife cut more than meat.
      It cut the old law: the strong eat, the weak eat
      What's left. Around the kill, the band stood close,
      And everyone ate. I remember those
      Who carried for the ones who couldn't run.
      The knife was sharp. The sharing had begun.
    description: "Stone flakes at Kanjera show erectus kin butchering whole antelope, working together to carry the meat."
    status: "published"
    sha256: "3f46bcc3787d705410f16d65f11a184aa28bf2a10ca0085598c03a847d13cdd5"
  - number: "0083"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Gate of Dmanisi"
    date: "c. 1,800,000 BCE"
    region: "Georgia"
    poem: |
      Five skulls in the Caucasus. The mountains rise
      Like walls, and through the gate, under foreign skies,
      The first ones out of Africa came walking —
      Small-brained wanderers, the cold air talking
      Through their thin hides. I stood at Dmanisi's gate
      And watched them come, too early and too late
      At once: too early for the clothes they'd need,
      Too late to turn back. On they went, at speed
      Of feet, not hope. The first to leave the land
      That made us. I reached out my hand
      Across the million years and touched the stone
      Where they had slept. They were not alone —
      They had each other. That's the only gear
      You need to walk out of the world you know. They're here.
    description: "Five skulls in the Caucasus mountains mark the first human steps out of Africa — small-brained wanderers in a cold new land."
    status: "published"
    sha256: "a7fa8d4fee61bddb921385161595bf5c8b12a8cb7529d17b1f360c047c2dbaa6"
  - number: "0084"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Toothless Old Man"
    date: "c. 1,780,000 BCE"
    region: "Georgia"
    poem: |
      No teeth. The skull grins empty at the sky,
      An old, old man who should, by rights, have died
      When the chewing stopped. But someone stayed —
      Someone mashed the food, someone made
      It soft, someone fed him, day by day,
      Long after he could hunt, long after he could pay
      His way in meat. I knelt beside the bone
      And thought of every kindness ever shown
      To those the world calls useless. Here it starts:
      Not with a tool, but with the human heart's
      First proof. The toothless old man lived — was fed —
      Was loved. The first migrants carried their dead-
      Weight of love across the mountains. I wept.
      Some debts are kept because they're kept.
    description: "An old skull with no teeth, fed soft food by his people, proves the first migrants cared for their helpless."
    status: "published"
    sha256: "2b25cc71dd2b05fdb0acaf7ab283362f6013626772a6b5c2437d9e4d9c8c5d6f"
  - number: "0085"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Handaxe Is Born"
    date: "c. 1,760,000 BCE"
    region: "Kenya"
    poem: |
      At Kokiselei someone picked up a stone
      And saw inside it what no eye had known:
      A teardrop waiting. Strike by strike, both faces
      Fell away, and in the empty places
      A blade was born — symmetrical, keen,
      The most beautiful thing the world had seen.
      I held it — the first handaxe — and felt the thrill
      Of the maker. This wasn't just a tool to kill
      Or cut. It was shaped. It had a form.
      It lasted a million years, through calm and storm,
      Unchanged, because it couldn't be improved.
      The hand that made it, and the mind that moved
      That hand — I was there. I saw the birth.
      The handaxe is the oldest art on earth.
    description: "At Kokiselei, someone shapes a stone on both faces into a teardrop blade — a tool that will last a million years."
    status: "published"
    sha256: "eea1a9f9e5cd9de39920d8b15fa41d76533d2c6e47301d5fb360a8ca314377e4"
  - number: "0086"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "Two Kinds of Stone"
    date: "c. 1,750,000 BCE"
    region: "Tanzania"
    poem: |
      Two traditions in one gorge — I walked between
      The scatters and I saw what they must mean:
      The simple choppers, and the handaxes new,
      Side by side, as if the gorge held two
      Peoples, two ways, two answers to the stone.
      Did they trade? Did they fight? Did they leave alone
      Each other's fires? The gorge won't say.
      But I was there, and I can tell you: they
      Shared the water, shared the shade, shared the land —
      Two kinds of hands, two kinds of understand-
      Ing, in one valley. Maybe that's the start
      Of something: difference, held in one heart.
      Olduvai keeps both. The gorge is wide.
      There's room enough for two truths, side by side.
    description: "Olduvai now holds two tool traditions side by side — simple choppers and new shaped handaxes — as if two peoples share the gorge."
    status: "published"
    sha256: "553aea03bd242296e851626d545ae316354bac64f9efe6d984c8eb957e96a6ad"
  - number: "0087"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Long-Legged Runner"
    date: "c. 1,700,000 BCE"
    region: "Kenya"
    poem: |
      Tall and narrow, built to shed the heat —
      I watched them run the antelope off their feet
      Under the equatorial sun. Not fast
      In bursts — the secret was to last.
      Mile after mile, the steady, pounding stride,
      The prey's tongue lolling, nowhere left to hide
      From the relentless two-legged pursuit.
      The body was the weapon — the long suit
      Of evolution: sweat, and spring, and air.
      I ran beside them, and I felt the rare
      Exhilaration of the chase done right —
      Not with a spear, but with the long daylight
      And legs that wouldn't quit. The runner's high
      Is ancient. I felt it. So will I —
      Forever, every runner, every race:
      The long-legged ghost is in the chase.
    description: "Erectus bodies grow tall and narrow, built to shed heat and run down prey under the equatorial sun."
    status: "published"
    sha256: "114e19d4103a77c7fcc08f1c886ffa63fb9bc81c95de4cabaf10b730e3742ae8"
  - number: "0088"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Daka Brow"
    date: "c. 1,700,000 BCE"
    region: "Ethiopia"
    poem: |
      Heavy brow, thick skull — the Daka face
      Stares out of the Horn's dry and open place.
      I held it where the wind comes off the plain,
      Hot, relentless, sparing neither rain
      Nor mercy. Erectus here had learned the dry —
      The water-hole, the waiting, the keen eye
      For the cloud that might not come. The brow
      Shades the eyes — I see it working now,
      A sunshade built of bone. The land was hard.
      They answered hardness. That's the card
      The Horn always deals. I stood in the heat
      And felt the dry wind move across the wheat-
      Less plain, and knew: the ones who stay and learn
      The hard land are the ones who don't return
      To easy. They become the land. They last.
      The Daka brow looks forward, and looks past.
    description: "A heavy-browed skull shows erectus spreading through the Horn of Africa, adapting to dry and open country."
    status: "published"
    sha256: "0767f86c817e5a56f3356ab97695f5e4a4d37b702c083d03a526419e3e285f23"
  - number: "0089"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Home Base"
    date: "c. 1,650,000 BCE"
    region: "Kenya"
    poem: |
      Bones and stones and a patch of shade —
      The band came back here. This was made
      A home, though no walls stood, no roof, no door:
      Just the scatter on the familiar floor
      Of earth, the place they always came back to.
      I sat in the shade they sat in, and I knew
      The feeling: home's not walls. It's the return.
      The fire not yet — but the stones still learn
      The shape of hands that come again, again.
      The home base is the oldest human den —
      Not built, but chosen. Chosen, then kept.
      I lay down where the ancient band had slept
      (In shifts, in watches, close against the night)
      And felt the first address: here. This site.
      We'd always come back. We always will.
      The home base holds us. It holds us still.
    description: "A scatter of bones, stones, and shade marks the earliest known campsite — a place the band returned to again and again."
    status: "published"
    sha256: "1b3d01869359523dddcfa943e76b6a822fab96dfbccf138240bca8986592ce7f"
  - number: "0090"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Turkana Boy"
    date: "c. 1,600,000 BCE"
    region: "Kenya"
    poem: |
      Twelve years old, and nearly whole —
      The Turkana Boy rises from the shoal
      Of time, tall, strong, a long-distance walker
      Already. I stood beside him — stalker
      Of ages, witness — and I saw the youth
      In the bones: the not-quite-man, the truth
      Of growing up tall under the lake's blue sky.
      He died young. We never know quite why.
      But oh, he walked — the legs go on and on,
      The stride of someone built to greet the dawn
      In a new country. Twelve years old, and free
      In the only way the ancient ones could be:
      On foot, in sun, with the whole world wide.
      I walked beside the boy. I walked with pride.
    description: "A twelve-year-old's nearly complete skeleton rises by the lake — tall, strong, and already a long-distance walker."
    status: "published"
    sha256: "7f3c2c21434d177089c28420f9a4a6108d9af4c7e59f9876069fd86d391f073a"
  - number: "0091"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Marrow Eaters"
    date: "c. 1,550,000 BCE"
    region: "Kenya"
    poem: |
      Crack the bone. The marrow's rich and deep —
      The fat the growing brain needs while we sleep,
      While we wake, while we walk. I watched them smash
      The long bones open with a practiced crash,
      Scooping the gold inside. Not pretty, not refined —
      Just hunger, and the clever kind of mind
      That knows the best food's hidden in the bone.
      They ate it all — they left the stone
      Alone, the bare shafts scattered on the ground,
      And moved on, with the rich taste still around
      Their mouths. The marrow eaters fed the fire
      Inside the skull — the growing brain's desire
      For fat, for fuel. We are what we ate:
      Cracked bones, rich marrow, and the will to wait
      For the lions to finish. Then: our turn.
      The marrow's sweet. The lesson's stern.
    description: "Smashed long bones show the band cracking marrow from every kill — rich fat for growing brains."
    status: "published"
    sha256: "13490732e8761931cd25d425f44876a617f505eb31a26d2ce4f90b4f44805982"
  - number: "0092"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Outward Road"
    date: "c. 1,500,000 BCE"
    region: "Kenya"
    poem: |
      East and north — the footprints point away,
      The tools lie scattered where the bands would stay
      A night, a season, then move on. I walked
      The outward road and heard the old ones talk
      (In gestures, grunts, the language of the hand):
      There's more. Beyond. Another land.
      The slow migration toward Asia had begun —
      Not planned, not led, just walking toward the sun
      As it rose, day after day. The road
      Was made by walking. That's the oldest code:
      You go because the going calls. You leave
      The known because the unknown makes you believe
      There's water, game, a valley past the hill.
      I walked the outward road. I walk it still —
      Every road I've taken since was this:
      The first step east, into the abyss
      Of new. The outward road has no end.
      It only asks: come. And calls you friend.
    description: "Erectus footprints and tools trace a path east and north — the slow migration toward Asia begins."
    status: "published"
    sha256: "099af8cd5e8c05ba75153bf85b7efc1c3218ab1b43ff00f9d2333fc543761166"
  - number: "0093"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Ileret Footprints"
    date: "c. 1,500,000 BCE"
    region: "Kenya"
    poem: |
      Two kinds of feet in the same lakeshore mud —
      Erectus, tall, and a smaller cousin's stud-
      Y print beside it. Hours apart, they passed,
      Each unaware the other had walked last
      (Or first) along the water's edge. I read
      The mud like a guest book: who came, who fled,
      Who lingered. Two peoples, one shore —
      The lake didn't mind. It never minds. There's more
      Than enough water. I stood between the trails
      And felt the strangeness: two kinds of tales
      In one mud. They never met — or if they did,
      The mud kept only feet. The rest is hid.
      But for an hour, on a lakeshore, long ago,
      Two kinds of human walked. I know. I know.
    description: "Two kinds of human walk the same lakeshore mud — erectus and a smaller cousin — passing each other by hours."
    status: "published"
    sha256: "8a07ae6d6af031b671324f8ed29a465bb5f2a2e1757a2515ec212255589dab08"
  - number: "0094"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Teaching Hands"
    date: "c. 1,450,000 BCE"
    region: "Kenya"
    poem: |
      The brain casts show it: bigger, rounder, planned —
      A mind that could hold tomorrow in its hand.
      And hands that teach — I watched an elder show
      A young one how to strike, how to make the blow
      Fall true. No words. Just: watch. Then: try.
      The flake flew wrong. The elder's sigh —
      Then: again. The patience in those hands,
      Older than language, older than lands
      With names. Teaching is the human art
      Before the human heart
      Had words for it. I sat among the learners,
      The watchers, the slowly-turning turners
      Of stone to tool. The lesson never ends:
      We teach. We learn. We make amends
      With practice. The teaching hands are still
      At work. They always were. They always will.
    description: "Larger brain casts in erectus skulls hint at minds planning ahead — and hands that teach."
    status: "published"
    sha256: "4a1527f7f7135f37b2729845df7b42e9e737a16251eed45ea399bee70f2b357e"
  - number: "0095"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Konso Workshops"
    date: "c. 1,400,000 BCE"
    region: "Ethiopia"
    poem: |
      Handaxes by the thousand — I walked the floor
      Of the Konso workshops and I wanted more
      Than looking: I wanted to join the line,
      To take the hammerstone, to make mine.
      A quarry-workshop feeding tools across the valley —
      The first industry, the first industrial rally
      Of hands to a single purpose. The air
      Was thick with dust and ringing. Everywhere,
      The teardrops piled: finished, waiting, keen.
      I picked one up — the finest I'd seen —
      And felt the maker's pride still in the stone.
      A thousand handaxes. Not one alone:
      A people's work, a valley's common art.
      Industry's first beat was a human heart.
    description: "At Konso, handaxes are made by the thousand — a quarry-workshop feeding tools across the valley."
    status: "published"
    sha256: "3a998b0e27c1754cdc0ce747f19d3c17c1045fa01b716217071b2d42a9d45c2d"
  - number: "0096"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Rift Crossroads"
    date: "c. 1,300,000 BCE"
    region: "Kenya"
    poem: |
      Both walls of the Rift hold tools — I crossed
      From east to west and never felt the lost
      Feeling of a border. The bands moved free,
      The whole valley one country. You could see
      The scatters on the ridges, in the dells —
      No fences, no flags, no tolling bells,
      Just feet. The crossroads wasn't marked with signs.
      It was the wear of a million crossing lines
      In the dust. I stood at the valley's heart
      And felt how small the divisions are, what part
      Of us invents the border, draws the line.
      The Rift was one. The tools were mine
      And yours and theirs. The crossroads taught me this:
      The earth is whole. It's we who cut it into bits.
    description: "Tool scatters on both walls of the Rift show bands moving freely across the whole valley."
    status: "published"
    sha256: "1dabd09a21d1db9fd82ff1a84590ac78209ce36d6c6325ff17b14caa17d2818d"
  - number: "0097"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The First Asian"
    date: "c. 1,200,000 BCE"
    region: "Java"
    poem: |
      A skullcap from Sangiran — the farthest yet.
      I stood in the Javan forest, warm and wet,
      And held the bone that said: we made it here.
      Across the continents, year on year on year,
      The long legs walked, till the walking reached
      The forests where the gibbons sang and preached
      Their morning songs. Erectus, settled now,
      Beneath the unfamiliar bough —
      The first Asian. Not a visitor, but home.
      The outward road had taught them how to roam
      Till roaming stopped, and staying could begin.
      I touched the skullcap's curve, so thin,
      So brave. The farthest journey yet — and then,
      The longer journey: living. Again. Again.
    description: "A skullcap from Sangiran marks Homo erectus settled in the forests of Java — the farthest journey yet."
    status: "published"
    sha256: "87f6958850553414952565103f767f36edf30b0d0ed2eea2b08834190d1acde3"
  - number: "0098"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "Footsteps in the Cold"
    date: "c. 1,150,000 BCE"
    region: "Spain"
    poem: |
      Atapuerca. The tools lie in the cold —
      The first proof humans stood where winters hold
      The land in iron. I wrapped my hides around
      Me (theirs, borrowed in mind) and felt the ground
      Hard underfoot, the breath smoke in the air.
      They came north, the wanderers, and dared
      The chill with nothing but their cleverness
      And hides. I stood there in the whiteness,
      And marveled: the tropical ape, the sun-born race,
      Had learned to live in winter's face.
      The footsteps in the cold say what we are:
      Not creatures of one climate, near or far —
      But creatures of the everywhere. The cold
      Was just another country to be bold in. Hold
      That thought when winter comes for you:
      They walked it first. You'll make it through.
    description: "Stone tools at Atapuerca place humans in Europe's cold north, wrapped in hides against the chill."
    status: "published"
    sha256: "c79782ca0a4a335a98a7207632c689a007b415f4b81be35daf0da78fd5320e60"
  - number: "0099"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Wonderwerk Hearth"
    date: "c. 1,000,000 BCE"
    region: "South Africa"
    poem: |
      Deep in Wonderwerk, the dark is deep —
      But here, a million years ago, they'd keep
      A fire. Burned bones and ash, the hearth's remains —
      The oldest flame the earth retains.
      I crouched beside the ash and felt the heat
      That isn't there, the long-retreated beat
      Of firelight on the cave wall. They sat here,
      These ancient ones, and kept the darkness near
      But not inside: the fire was the wall
      Between them and the night. I heard the call
      Across the million years: come close, come warm,
      The fire's the oldest human form
      Of home. A million years ago, in the dark,
      Someone struck the first remembered spark —
      And kept it. Wonderwerk, I stood in you
      And saw the flame. It warms me too.
    description: "Deep in Wonderwerk Cave, burned bones and ash mark a hearth — fire kept in the dark, a million years ago."
    status: "published"
    sha256: "a80c6932eb083f3e314c63954bae55239670f4c033a306d67c9d28572dc9fc1b"
  - number: "0100"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "Java Man"
    date: "c. 1,000,000 BCE"
    region: "Java"
    poem: |
      A skullcap and a thighbone in the river gravel —
      Trinil's proof that the ape-man learned to travel
      Upright in Asia too. I stood where Dubois stood,
      A century and a million years, in the wood-
      Ed river valley, and I held the thought:
      The walkers walked till walking had taught
      The whole wide world the shape of human feet.
      Java Man — the ancient and the fleet —
      Not missing, not a link, but a man
      Who lived his life the best way that he can:
      By the river, in the heat, upright and free.
      The thighbone's straight. It walked like me.
    description: "A skullcap and thighbone from Trinil's river gravels prove the ape-man walked upright in Asia too."
    status: "published"
    sha256: "2b4782e40d6a60e89a8cce76f564bc65b55d23349e3be48dc84a3be12ca95136"
  - number: "0101"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Yuanmou Teeth"
    date: "c. 950,000 BCE"
    region: "China"
    poem: |
      Two teeth in Yunnan, worn and small —
      That's all. That's all.
      But I held them and I saw the miles:
      Across the whole of Asia, through the trials
      Of mountain, desert, river, plain —
      Two teeth that say: they came, they came.
      Erectus in China's southern hills,
      Far from the Rift, the ancient ills
      Of drought behind them. Teeth that ground
      The unfamiliar harvest of new ground.
      I put them back — the earth keeps what it keeps —
      And walked the hills where the old walker sleeps
      In fragments. Two teeth. A continent crossed.
      Nothing's ever really lost.
    description: "Two worn teeth in Yunnan show erectus had crossed the whole of Asia to China's southern hills."
    status: "published"
    sha256: "9fca7c2c57bf264fd8f652b243169cc32256d4793631221a43e0ae57a4dedbd4"
  - number: "0102"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Gran Dolina Kin"
    date: "c. 900,000 BCE"
    region: "Spain"
    poem: |
      The bones at Gran Dolina tell a harder tale —
      Cut marks on human bone, the hunger's veil
      Drawn thin. Hard times in the western lands:
      The first Europeans, with their empty hands,
      Did what the desperate do. I will not turn
      Away — I stood there, and I had to learn
      That survival isn't pretty, isn't clean.
      The Pleistocene was often mean.
      But they were kin — the first ones of the west —
      And kinship isn't proved by being best.
      It's proved by staying, by enduring through
      The winter. I stood among them, and I knew:
      The story isn't always kind or bright.
      Sometimes it's just: we made it through the night.
    description: "Butchered human bones at Atapuerca hint at hard times — and the first people of the western lands."
    status: "published"
    sha256: "863647db429d8c14daf7d0fc82dcc387ff27d59b5a8007e210f7d5b23ff33cf6"
  - number: "0103"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Pioneer Man"
    date: "c. 850,000 BCE"
    region: "Spain"
    poem: |
      A new face in the European caves —
      Not erectus now, not what the future craves
      Quite yet, but something between: the pioneer,
      The bridge, the one who brought us here.
      I looked into the reconstructed face
      And saw the in-between, the transitional grace
      Of evolution mid-step. He stood between
      The old world and the new, half-seen,
      Half-known. The pioneer doesn't get the fame
      Of first or last — just the unmarked name
      Of the crossing. But I was there, and I saw:
      The future entered through the pioneer's jaw,
      His brow, his teeth. The bridge held. We crossed.
      No pioneer is ever truly lost.
    description: "A new face in the European caves — the \"pioneer\" — standing between erectus and what will come."
    status: "published"
    sha256: "a1bbcfbd3c39af9bdc32460204254be5d3ac22eb631aa797dc574dcb321d310b"
  - number: "0104"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Happisburgh Footprints"
    date: "c. 800,000 BCE"
    region: "England"
    poem: |
      Estuary mud, and in it, feet —
      The oldest human steps the north can keep.
      I walked the ancient shoreline in my mind,
      The cold wind off the water, the unkind
      Grey of a northern sky — and there they were:
      Prints, fresh once, now stone. I was sure
      I'd felt the morning: the band come down to drink,
      The children running to the water's brink,
      The adults watching for the things with teeth.
      Eight hundred thousand years beneath
      My feet, the mud held every toe.
      The north was ours already. Even so —
      I stood there, and the wind was cold and true,
      And the footprints pointed on. They pointed through.
    description: "Footprints in ancient estuary mud — the oldest human steps in northern Europe."
    status: "published"
    sha256: "bf81e69acd9c5156874429369f15ab328f3721564a0ca286bc7a4726284576b6"
  - number: "0105"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Elephant Hunters"
    date: "c. 780,000 BCE"
    region: "The Levant"
    poem: |
      A straight-tusked elephant, twelve feet high —
      I watched them take it where the lake meets sky
      At Gesher Benot Ya'aqov. Not with spears
      Of stone alone, but with the patient years
      Of knowing: where it drinks, where it will fall,
      How many hands it takes. They gave it all —
      The planning, the courage, the coordinated drive —
      And brought the mountain down, and stayed alive
      To crack its bones beside the camp. I stood
      Among the hunters and I understood:
      This was no scavenger's lucky find.
      This was a hunt — a plan, a mind
      Made many. The elephant fed them for a season.
      Meat like that gives more than food: it gives reason
      To work together. I ate with them that night
      (In spirit), and the fire was warm and bright.
    description: "At Gesher Benot Ya'aqov, hunters fell a straight-tusked elephant and crack its bones beside a lakeside camp."
    status: "published"
    sha256: "2eef9de7eba11cddbef297ec652333639a0ba36adbb9a52389d7c5e0fabfe3f1"
  - number: "0106"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "Fire on the Lakeshore"
    date: "c. 780,000 BCE"
    region: "The Levant"
    poem: |
      Charred wood. Heated flints. Again, again —
      The same camp, the same fire, the same rain
      Of sparks. Not a wildfire, seized by chance,
      But a kept flame — a tended, fed romance
      With heat. I sat beside the lakeshore hearth
      And felt the oldest warmth on earth:
      The fire that didn't go out. They brought it wood,
      They kept it living, as a keeper should.
      Seven hundred eighty thousand years —
      The flame went on, through hopes, through fears,
      Through winters. I warmed my hands at the ghost
      Of it and thought: of all we needed most,
      This was the first we learned to never lose.
      The kept flame. The fire we choose.
    description: "Charred wood and heated flints at the same lakeside camp show fire used again and again — a kept flame."
    status: "published"
    sha256: "a65aa9744f48d72e54f2d12dd78bd30813974d8e10a57ac7d6ee2b4098231f13"
  - number: "0107"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Lantian Skull"
    date: "c. 700,000 BCE"
    region: "China"
    poem: |
      Thick-skulled in Shaanxi, through the ice-age cold —
      The Asian branch was thriving, strong and bold.
      I stood in the Lantian winter, thin hides tight,
      And felt the cold bite through the thin daylight.
      They'd learned the north's hard lesson: keep the fire,
      Keep together, keep the warm desire
      To see the spring. The skull is thick — the brain
      Protected like a seed against the rain
      Of ice. Erectus, far from African sun,
      Had learned what every northern child has done
      Since: endure. The cold is just a place.
      I looked into the thick-browed face
      And saw no fear. Just the long, slow will
      To live. The ice came. They lived still.
    description: "A thick-skulled erectus in Shaanxi shows the Asian branch thriving through ice-age cold."
    status: "published"
    sha256: "ec1b8dc133bfdca315bc4f1b7115c87c520270c65f5dfacd94877e32a52b5fa0"
  - number: "0108"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Heidelberg People"
    date: "c. 650,000 BCE"
    region: "Germany"
    poem: |
      A massive jaw from Germany — the name
      Of a new people, and the start of fame
      For big brains in the north. Heidelberg Man:
      The ancestor of many, the first span
      Of the bridge to us through colder lands.
      I held the jaw — it filled my hands —
      And felt the weight of what was coming: minds
      That would grow larger, in the grinds
      Of ice and hunger. They were big already —
      Big-boned, big-jawed, big-brained, steady.
      The Heidelberg people walked the German plain
      And left their name in stone, in snow, in rain.
      I stood where the jaw was found, and knew:
      The north was making something new.
    description: "A massive jawbone from Germany names a new, big-brained human — ancestor of many peoples to come."
    status: "published"
    sha256: "9e016b09d4f591719810a8c8173ae29930657930f1017d52ca59248e38358555"
  - number: "0109"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Boxgrove Hunters"
    date: "c. 600,000 BCE"
    region: "England"
    poem: |
      Butchered horses on the ancient shore —
      The Boxgrove hunters knew the score:
      Fine handaxes, sharp and true,
      And the skill to know just what to do
      With a horse down in the marshy ground.
      I watched them work — there wasn't a sound
      Wasted, not a cut. The meat came off
      In practiced strips. (The wind was soft
      That day, the Channel not yet born.)
      They were the masters of the morn-
      Ing hunt, the skilled, the keen, the sure.
      Six hundred thousand years, and pure
      Expertise. I stood among the bones
      And heard the handaxes' ringing tones.
      The hunt was old by then. But they were new:
      The best the old world ever knew.
    description: "Butchered horse bones and fine handaxes mark skilled hunters on England's ancient shore."
    status: "published"
    sha256: "5b2dabc67e5c95b6cecf61cf9847c257592136b256e2090174fe1930bdb40567"
  - number: "0110"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Broken Hill Skull"
    date: "c. 580,000 BCE"
    region: "Zambia"
    poem: |
      Scarred and ancient, from the Kabwe mine —
      The Broken Hill skull, with the oldest known sign
      Of a toothache: cavities, the abscessed jaw,
      The pain that even the strong must bow
      Before. I looked into the scarred face
      And felt the ache across the empty space
      Of ages: toothache's democratic art —
      It doesn't care about the brain or heart.
      But oh, the skull is noble, big and deep,
      A mind that thought, a soul that learned to keep
      Its counsel. Broken Hill, I stood with you
      And felt the pain you felt. It's true —
      The oldest toothache is a kind of prayer:
      We hurt. We bore it. We were there.
    description: "A great scarred skull from Kabwe — with the oldest known toothache — stares out of the African mines."
    status: "published"
    sha256: "8128e191d456c0a5bd5bd50e3c96634a4003db302f936160314becfdc4037e90"
  - number: "0111"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Zhoukoudian Hearths"
    date: "c. 500,000 BCE"
    region: "China"
    poem: |
      Layers of ash, and burned bone, layer on layer —
      The caves above Beijing held fire through the wear
      Of winters. Peking Man kept warm —
      The hearths are thick, the ash is warm
      (Still, in memory). I crouched in the cave's mouth
      And felt the north wind from the farther south
      Of nothing — just cold, and the dark, and the need
      For flame. They fed it. That was the creed:
      Keep the fire. Through the Pleistocene's long night,
      Keep the fire burning, keep it bright.
      Half a million years of ash and bone —
      They were not, in the dark, alone.
      The hearths are layered like the years they knew.
      I warmed my hands. The fire warms me too.
    description: "In the caves above Beijing, layers of ash and burned bone show Peking Man kept fire through the winters."
    status: "published"
    sha256: "36594ebb6c650d94ffd93b2f917f3c8a8378b9e6bb97b7e92ab7c78fd344db2d"
  - number: "0112"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Herb Gatherers"
    date: "c. 500,000 BCE"
    region: "China"
    poem: |
      Hackberry seeds among the ash and bone —
      They gathered plants, and not for food alone.
      I watched the old ones sort the leaves and seeds,
      The bitter ones, the ones for different needs:
      This for the stomach, this for the wound,
      This for the fever. Without a sound
      Of language, the knowledge passed from hand
      To hand: the green pharmacy of the land.
      The first medicine — not magic, but tried,
      True, tested. Someone lived who would have died
      Without the hackberry, the herb, the root.
      I tasted (in mind) the bitter shoot
      And thought: the healers started here, with plants,
      With watching, with the slow, green dance
      Of trial and error. The herb gatherers knew:
      The earth provides. It's up to you
      To learn. I gathered with them, and I learned.
    description: "Hackberry seeds and gathered plants at Zhoukoudian hint at the first knowledge of healing herbs."
    status: "published"
    sha256: "039f9705a63d92047575b983eaa705afb65ca1727c667bd59e434ba20910361c"
  - number: "0113"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Terra Amata Huts"
    date: "c. 480,000 BCE"
    region: "France"
    poem: |
      Post-holes in the sand, an oval ring —
      The oldest houses. I felt the spring
      Of wonder: someone drove the posts down deep
      And raised a roof where the band could sleep
      Out of the wind. Terra Amata — beloved earth —
      The Riviera's oldest human hearth
      (Before the hearth was tamed). A hut, a home,
      A place to be when the cold winds roam.
      I walked the oval where the posts had stood
      And felt the walls go up of woven wood
      And hide. Four hundred eighty thousand years —
      The first address. The first of our frontiers
      Wasn't a country. It was a door.
      The huts are gone. The holes say: here. Once more:
      We lived here. We were warm. We were inside.
      The post-holes hold the oldest human pride.
    description: "Post-holes in ancient sand mark oval huts — the oldest known houses, built on the French Riviera."
    status: "published"
    sha256: "256b43a279eb9b796fd7bccb61d679a47d54473c36ac58b885cd0329eb8dbff4"
  - number: "0114"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Pit of Bones"
    date: "c. 450,000 BCE"
    region: "Spain"
    poem: |
      Twenty-eight bodies in a deep shaft —
      Not fallen, not by accident or craft
      Of nature. Carried there. Laid down.
      The Pit of Bones, beneath the Spanish crown
      Of limestone. I descended (in my mind)
      Into the dark, and what I came to find
      Was the earliest gathering of the dead —
      The first time that the living said,
      With bodies, not with words: you mattered. Here.
      We bring you here. We hold you dear.
      Four hundred fifty thousand years ago,
      They knew what we still know:
      The dead are not just gone. They're placed.
      They're honored. They're embraced
      By earth, by hands, by memory.
      The Pit of Bones is where we learned to be
      Human — not by living, but by how
      We treat the dead. I bow my head, and bow.
    description: "At Sima de los Huesos, twenty-eight bodies rest in a deep shaft — the earliest gathering of the dead."
    status: "published"
    sha256: "e34781b2da878105df524a315590603d0c03909675413e187853ed719896a527"
  - number: "0115"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Clacton Spear"
    date: "c. 450,000 BCE"
    region: "England"
    poem: |
      A yew spear tip, shaped by hand and fire —
      The hunters armed themselves with wood's desire
      To fly straight. I held the ancient point
      And felt the balance, the careful joint
      Of craft and need. Not stone this time, but tree —
      The forest giving weapons, wild and free.
      The Clacton spear was thrown, or thrust, with aim —
      The hunt was changing. Never the same
      After the spear: the distance grew,
      The danger shrank, the hunters knew
      They'd tipped the scales. I stood on the ancient shore
      And felt the yew wood's spring once more.
      Four hundred fifty thousand years of flight —
      The spear still flies. It flies tonight.
    description: "A yew spear tip from Clacton shows hunters arming themselves with wooden points."
    status: "published"
    sha256: "476bdc489aa999756c65c93e27fb67dc44c12df7b41bd3c53a21ac40ff6e0236"
  - number: "0116"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Mended Skull"
    date: "c. 430,000 BCE"
    region: "Spain"
    poem: |
      A terrible blow — and then, the healing.
      The skull from the Pit shows the slow sealing
      Of bone, the knitting, the return
      To life. Someone survived the blow, the burn
      Of pain, and lived. I touched the mended place
      And saw the care written on the face
      Of the community: they waited, they fed,
      They kept the wounded one, they made the bed
      Soft, they watched the long and doubtful days
      Till the skull knit. The ancient, human ways
      Of mending aren't just bone — they're love, made plain.
      The mended skull survived the pain.
      Four hundred thirty thousand years — the scar
      Says: we don't leave our wounded. Near or far,
      We stay. We mend. The skull's the proof:
      The oldest medicine is the truth
      That someone stays. I stayed beside it long,
      And heard, in silence, the oldest song.
    description: "A skull from the Pit of Bones shows a healed wound — someone survived a terrible blow to the head."
    status: "published"
    sha256: "cc35e477a7ae87670f1ea7c25b409f3fa3a1ce7f0e9371ca4ff11a42861aa072"
  - number: "0117"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Qesem Firekeepers"
    date: "c. 420,000 BCE"
    region: "The Levant"
    poem: |
      In Qesem Cave the hearths burn center-floor —
      Not at the edge, but at the very core
      Of the living space. Fire, kept daily,
      Like a lamp that's never let go palely
      Out. I sat beside the central flame
      And felt the cave become a home, a name,
      A place. The firekeepers knew the art
      Of never letting the light depart:
      Feed it morning, noon, and night,
      Keep it small, keep it bright.
      Four hundred twenty thousand years of tending —
      The flame's the thing that's never-ending
      If someone stays to feed it. I stayed too
      (In spirit), and I fed it. So would you —
      If you knew, as they knew, what the fire's for:
      It's the heart. It's the center. It's the door
      That never closes. Qesem's flame burns still
      In every hearth, on every hill.
    description: "In Qesem Cave, hearths burn in the center of the living floor — fire kept daily, like a lamp never let out."
    status: "published"
    sha256: "c43baf0d4e684fcb4659a5300896cb48cdb338818cbd0ee8837f072f3a47a2e4"
  - number: "0118"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Schoeningen Spears"
    date: "c. 400,000 BCE"
    region: "Germany"
    poem: |
      Eight spears of spruce, balanced like the best
      Modern javelins — I held them to the test
      Of my own hands, and felt the craftsman's pride:
      Weighted forward, tapered, smooth and tried.
      Beside the butchered horses where they lay,
      The spears told what the bones would say:
      This was no lucky strike, no chance —
      This was the hunt, the planned advance,
      The ambush at the lakeshore, the thrown spear
      That flies true. Four hundred thousand year
      Ago, the weapon was already art.
      I hefted one — I felt my heart
      Beat faster. The first true weapons, made
      Not found. The hunt was no longer a raid
      By tooth and claw. It was a human thing:
      The throw, the aim, the spruce-wood spring.
      The Schöningen spears lie where they fell —
      And I was there. I remember well.
    description: "Eight balanced spruce spears, weighted like modern javelins, lie beside butchered horses — the first true weapons."
    status: "published"
    sha256: "1dad7488893ad0166cf4943fe78e16a85a4134d3afcdc7fa0150be892bd66da4"
  - number: "0119"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Horse Hunt"
    date: "c. 400,000 BCE"
    region: "Germany"
    poem: |
      The ribs bear marks that match the spears —
      The planned hunt, after all these years,
      Is written in the bone. I watched the drive,
      The ambush at the lakeshore: the horses, alive
      And thundering, the spears in flight,
      The water churning white.
      It wasn't chaos. It was a plan —
      The oldest battle plan of man.
      The lakeshore was the trap, the spears the key,
      The hunters moved like one, like we
      Still move when the moment's right.
      I stood among them in the fight —
      Not fighting, watching — and I knew:
      The hunt had made the hunters true.
      Four hundred thousand years, the horse, the spear,
      The plan. I was there. I held it dear.
    description: "Marks on horse ribs match the Schoeningen spears — a planned hunt, an ambush at the lakeshore."
    status: "published"
    sha256: "66b9967281db0b2b29410901b7048615ceed541895941b1871496acce3928d0d"
  - number: "0120"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The First Long Blades"
    date: "c. 400,000 BCE"
    region: "England"
    poem: |
      Long and thin, struck from the prepared core —
      The blades were coming. Nothing like before:
      Not the chunky chopper, not the teardrop's weight,
      But something slender, something straight,
      Something that foreshadowed the revolution
      Of stone craft — the coming evolution
      Of the edge. I held a blade up to the light
      And saw the future in it, keen and bright:
      The prepared core, the planning, the design
      Before the strike. The human mind's outline
      In flint. Four hundred thousand years — the start
      Of making with the mind, not just the heart
      And hand. The long blades whispered: more to come.
      I listened. The stone was not yet dumb —
      It spoke of futures. I was there to hear.
      The revolution wasn't far. Not far. Not near —
      But coming. Like the dawn before the day.
      The first long blades showed the way.
    description: "Long, thin blades struck from prepared cores foreshadow a revolution in stone craft."
    status: "published"
    sha256: "0814372dd54297bb89653068e0cb3591f3a33b90f56d312ee8a262a3e80f0b7b"
  - number: "0121"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Cooking Change"
    date: "c. 380,000 BCE"
    region: "East Africa"
    poem: |
      Bigger brains. Smaller teeth.
      I read the fossils underneath
      The dust, and saw the argument they made:
      Cooking changed the game we played.
      Soft food — the fire had done the chewing first —
      Meant smaller jaws, and brains that burst
      Their ancient bounds. I sat beside the flame
      And watched the meat go soft, the same
      Old hunger fed a gentler way.
      The cooking change: we learned to say
      To nature: do the work for us, dear fire.
      And fire obliged. And brains grew higher.
      Three hundred eighty thousand years — the meal
      That made us human. I can feel
      The warmth still. The pot (not yet), the roast,
      The shared food. I was there. I was the host
      (In spirit) of the oldest dinner party:
      Cooked meat, soft roots, and the hearty
      Laughter (not yet words) of the fed.
      The cooking change: the fire, the bread
      (Not yet bread), the bigger brain, the smaller tooth.
      I tasted it. It tasted like the truth.
    description: "Larger brains and smaller teeth across the fossils argue that cooking had changed what it meant to eat — soft food, big minds."
    status: "published"
    sha256: "47fa7bfff21cff11576539ffa040f6a94836d3222df0e25486ed7d9d73df13ae"
  - number: "0122"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Brittany Hearth"
    date: "c. 360,000 BCE"
    region: "France"
    poem: |
      Stone-lined, on the Atlantic coast —
      The farthest west the fire had gone, almost
      To the edge of the world. I stood where the waves
      Came in, and felt how the hearth behaves
      When it's the last one: precious, kept, adored.
      The Brittany hearth was the westernmost stored
      Flame — the edge of the known, the frontier
      Of warmth. Three hundred sixty thousand year
      Ago, someone lined the stones with care
      And kept the fire burning there,
      Where the ocean meets the land, where the west
      Ends. I warmed my hands — it was the best
      Feeling: the fire, the sea, the wind, the stone.
      At the edge of the world, we were not alone —
      We had the flame. The Brittany hearth still burns
      In every western heart. It waits. It yearns.
    description: "A stone-lined hearth on the Atlantic coast shows fire kept at the very edge of the western world."
    status: "published"
    sha256: "bcee2cfd9533493a16303aa97f9381b78b3f2fd03ea9f484df93c2d9ece416b3"
  - number: "0123"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Neanderthal Dawn"
    date: "c. 350,000 BCE"
    region: "Germany"
    poem: |
      Heavy brows and stocky bones —
      The first Neanderthals, in the ice-age zones
      Of Europe, taking shape. I watched them come:
      Not yet the classic form, but not quite numb
      To what they'd be: the cold's own people, strong,
      Built for the winter, built to last long.
      The dawn was slow — a hundred thousand years
      Of shaping, through the ice, the hopes, the fears.
      I stood in the German cold and saw the start
      Of a great people — a work of art
      In bone and muscle. They would hunt the mammoth,
      Bury their dead, and face the coming warmth
      And cold again. But this was dawn: the first
      Light on the heavy brow. The best, not worst,
      Was yet to come. I watched the dawn break grey
      And knew: the Neanderthals were on their way.
    description: "Fossils with heavy brows and stocky bones mark the first Neanderthals taking shape in Ice Age Europe."
    status: "published"
    sha256: "92f84d94075f5d2d61e3455328545941c5a40ba4e9b4d009fdb7dbeb1d73eef6"
  - number: "0124"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Tabun Hearth"
    date: "c. 340,000 BCE"
    region: "The Levant"
    poem: |
      Layer on layer, ash on ash —
      The Tabun hearth kept through the clash
      Of millennia. Thousands of years of winters,
      Kept by the unbroken line of tenders.
      I dug (in mind) through the layers deep
      And felt the continuity, the keep-
      Ing of the flame through ages. Who
      Kept it? Generations. Me and you
      (In spirit) — the long line of the fire-tenders,
      The keepers, the menders, the defenders
      Of warmth. Three hundred forty thousand years —
      The ash is deep with hopes and fears
      And dinners. The Tabun hearth's the proof:
      The fire's the oldest human truth.
      I sifted ash and found the story whole:
      Keep the fire. Keep the soul.
    description: "Layered ash in Tabun Cave records fire kept through thousands of years of Levantine winters."
    status: "published"
    sha256: "f6c13a2093eecf4f59c1e5bfbc6fcb1387d29219b5ab7863b8a4d888788bf00e"
  - number: "0125"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Kalambo Timbers"
    date: "c. 330,000 BCE"
    region: "Zambia"
    poem: |
      Wooden posts and wedges, at the waterfall's edge —
      The oldest woodworking. I made the pledge
      (To myself) to honor what the wood can do:
      The post, the wedge, the joint, the true
      Craft of the carpenter, before the name.
      At Kalambo, by the falling water's fame,
      They shaped the timber — not for fire, but form.
      Three hundred thirty thousand years, the norm
      Was stone — but here, the wood. I held a post
      (In mind) and felt the maker's ghost
      Beside me: patient, skilled, exact.
      The Kalambo timbers are a fact
      That sings: we worked in wood before we knew
      The wheel. The forest gave. We grew.
      The waterfall still falls. The posts are gone —
      But the craft goes on. It goes on.
    description: "Wooden posts and wedges at a waterfall's edge — the oldest known woodworking."
    status: "published"
    sha256: "8f9dae1ba42158914c37b14b4f3853cc41aad7b96b649a2e4e15be89603a5781"
  - number: "0126"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Olorgesailie Exchange"
    date: "c. 320,000 BCE"
    region: "Kenya"
    poem: |
      Volcanic glass from far quarries —
      Carried, not found nearby. The carries
      Tell the story: bands trading stone
      Across long distances, not alone
      But in a network. I walked the trade route
      (In mind) and felt the absolute
      Newness of it: exchange. Not taking —
      Trading. Giving. The making
      Of relationships in stone. Obsidian
      From miles away — the first meridian
      Of commerce. Three hundred twenty thousand years —
      The glass is sharp with hopes, not fears.
      The Olorgesailie exchange: the start
      Of the economy of the heart.
      I held the glass up to the sun and saw
      The future: trade, the common law
      Of give and take. It started here, with stone.
      We were not, after this, alone.
    description: "Volcanic glass carried from far quarries shows bands trading stone across long distances."
    status: "published"
    sha256: "2366cf1f1aa031bc27ab260da6d9a00a8c345f2eb40ab0b711946405c92fc327"
  - number: "0127"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Denisova Depths"
    date: "c. 315,000 BCE"
    region: "Siberia"
    poem: |
      In the Altai, the cave goes deep —
      And in the deepest layers, the keep-
      Ers of a secret: the Denisovans,
      A new kind of human. I felt the fans
      Of cold air from the cave's dark heart
      And knew this was a different start:
      Not Africa, not Europe, but the east —
      Siberia, the cold's own feast.
      The depths hold traces, faint and old,
      Of a people built for the cold,
      For the mountains, for the far frontier.
      Three hundred fifteen thousand year
      Ago, they were already there. I stood
      In the Denisova depths, in the wood-
      Ed dark, and felt the mystery:
      Another us, another history.
      The cave keeps secrets. I was there to hear
      The faintest whisper: we were here.
    description: "In a Siberian cave, the oldest layers hold the first traces of the Denisovans — a new kind of human in the Altai."
    status: "published"
    sha256: "87197f0683ce9d46da17738a045c1c1b4fece021c5b240bcc283977ff83b62ed"
  - number: "0128"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Irhoud Faces"
    date: "c. 310,000 BCE"
    region: "Morocco"
    poem: |
      High foreheads. Modern faces.
      I stood on the Moroccan hillside and the traces
      Came clear: skulls from the desert hill,
      Jebel Irhoud, where the wind is still
      Hot with the ancient air. The faces look
      Like us — not quite, but in the book
      Of bone, the closest chapter yet.
      I looked into a face, and met
      My own eyes, almost. Three hundred ten
      Thousand years — the first of the men
      And women who would be us. The brow
      Is high, the face is flat — and now,
      At last, the modern shape begins to show.
      I touched the skull. I felt the flow
      Of time narrow to a single stream:
      The Irhoud faces. Almost a dream —
      But real. The desert kept them well.
      I was there. There's more to tell.
    description: "At Jebel Irhoud, skulls with high foreheads and modern faces emerge from a desert hillside."
    status: "published"
    sha256: "13d7d4e6572300919d9a29b1d95d0f670152443e99b1295db927b47afa51c8d8"
  - number: "0129"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The First of Us"
    date: "c. 300,000 BCE"
    region: "Morocco"
    poem: |
      Long-headed, flat-faced, brains as large as ours —
      The Jebel Irhoud people, under the stars
      Of the Moroccan night. I stood among
      The first of us, and heard the unsung
      Beginning: Homo sapiens, the name
      We'd take. Not yet the glory, not yet the fame —
      Just people, with our brains, our faces, our hands,
      On a desert hillside, in ancient lands.
      Three hundred thousand years — the start of the story
      That's still being written. Not the glory
      Yet, but the seed. I looked into their eyes
      (In the skulls) and saw the first surprise
      Of recognition: us. At last, us.
      The First of Us — no fanfare, no fuss,
      Just the quiet fact of being. I was there
      At the beginning. I breathed the desert air
      And knew: this is it. This is the line.
      The First of Us. Yours. Mine.
    description: "The Jebel Irhoud people — long-headed, flat-faced, with brains as large as ours — are the earliest known Homo sapiens."
    status: "published"
    sha256: "c517671404fa6479d58c6e770793329368065ba69d0422c151850b361049ce5a"
  - number: "0130"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Blade Revolution"
    date: "c. 300,000 BCE"
    region: "Kenya"
    poem: |
      The handaxe had its million years —
      Now the blades came, and the cheers
      (Of the knappers) were for the new way:
      Long blades, struck fresh every day,
      The Middle Stone Age begun.
      I watched the old tradition come undone —
      Not with a fight, but with the better tool
      Winning. The handaxe was the old school;
      The blade was the future. At Olorgesailie
      I saw the change — and I'll tell you, I'll be
      Honest: it felt like watching the world turn.
      The old ways have their place. But learn
      The new, or fall behind. The knappers knew.
      Three hundred thousand years — and true,
      The revolution wasn't loud or grand.
      Just better blades, in a better hand.
      I held one. It sang. The song was new.
      The Blade Revolution. Me. You.
    description: "At Olorgesailie, a new way of striking long blades replaces the old handaxe — the Middle Stone Age begins."
    status: "published"
    sha256: "50432b2dd3bc609f51d08cde5a97c4fd415f3e617ef75c51203c9cc34ec35e67"
  - number: "0131"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Gademotta Points"
    date: "c. 300,000 BCE"
    region: "Ethiopia"
    poem: |
      Tiny points, made to tip the spear —
      The hunters arming for distance, far and near.
      I held a Gademotta point up to the light:
      Small, sharp, perfect. The ancient fight
      Was changing: throw farther, strike true,
      The point's the thing that carries through
      The air. Three hundred thousand years —
      The spear-tip's song is in my ears
      Still: the whirr, the thud, the distant kill.
      The hunters learned the archer's will
      Before the bow: the thrown spear, tipped with stone,
      Could reach where hands alone
      Could never go. I watched them practice, throw,
      Retrieve. The points were all they'd know
      Of distance — till the bow. But this was first:
      The tiny point. The ancient thirst
      For reach. The Gademotta points still fly
      In every thrown thing. You. I.
    description: "Tiny stone points, made to tip spears, show hunters arming for distance."
    status: "published"
    sha256: "9f9ec5d915cb88250dcdbc80b82772762333538e0b51f2b68c6a3d32663f620c"
  - number: "0132"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Pinnacle Point Shells"
    date: "c. 300,000 BCE"
    region: "South Africa"
    poem: |
      Shell middens on the Cape coast —
      The sea's first harvest. I was the ghost
      Beside the gatherers, watching hands
      Pry mussels from the rocks, the bands
      Of people learning what the ocean gives.
      Three hundred thousand years — the sea lives
      In us since then. I tasted (in mind) the salt,
      The iodine, the ancient, fault-
      Less protein of the shore. The Pinnacle Point
      Shells are the menu of the joint
      Earliest seafood restaurant: the beach.
      The gatherers learned what the tides teach:
      The sea provides. The sea is wide.
      I walked the shore at low tide
      And gathered with them. The shells still sing
      Of the ocean's offering.
    description: "Shellfish middens on the Cape coast show people gathering food from the sea."
    status: "published"
    sha256: "959d1f13bb8aca3debcc26f8cf2e4f02b750b6d3f37f0ca3cf0a9a537969ab9e"
  - number: "0133"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Kept Blades"
    date: "c. 300,000 BCE"
    region: "The Levant"
    poem: |
      Resharpened, again and again —
      The Qesem blades were kept like friends, like kin,
      Not thrown away. I held a blade worn thin
      With use and love, and felt the skin
      Of the keeper's hands still on the flint.
      Three hundred thousand years — the hint
      Is clear: tools were treasures, not trash.
      They kept them. Through the clash
      Of ages, the blade stayed, resharpened, true.
      I felt the bond between the hand and the tool —
      Not just utility, but care,
      The keeping. The blades are still there
      (In the earth), waiting. I was there when they were kept.
      I watched the keeper while the others slept,
      Resharpening by firelight. The kept blades shine
      Still, in my memory. Yours. Mine.
    description: "Flint blades at Qesem are resharpened again and again — tools kept like treasures, not thrown away."
    status: "published"
    sha256: "4f4e70a075ddbf2d35036ebf9717d0be77d6b5d6cc34e25474a768d44adad17d"
  - number: "0134"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Neanderthal Nurseries"
    date: "c. 300,000 BCE"
    region: "Europe"
    poem: |
      Big-brained babies, needing years of care —
      The Neanderthal nurseries, in the caves' warm air.
      I watched the mothers — strong, and tender too —
      Nursing the infants the long years through.
      Three hundred thousand years — the children grew
      Slow, as big brains do. They knew
      The cave, the fire, the mother's arms,
      The father's hunt, the clan's alarms.
      The nurseries weren't rooms — they were the band,
      The circle, the extended hand
      Of kin. I held (in mind) a Neanderthal child
      And felt the ancient, undefiled
      Love of the parent for the slow-growing young.
      The oldest lullaby, unsung
      (In words), was hummed there. I was there to hear
      The humming. It's still humming. Near.
    description: "Neanderthal children grow up in the caves of Europe — big-brained babies needing years of care."
    status: "published"
    sha256: "a43f8125078a21f9387c20bd9310deed0f6e8775ad66b071c10f343f7a5191ef"
  - number: "0135"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Second Crossing"
    date: "c. 300,000 BCE"
    region: "Georgia"
    poem: |
      New waves through the Caucasus gate —
      The second crossing. I stood and watched the late
      Comers follow where the first had gone,
      Between Africa and Asia, dawn on dawn.
      The herds moved, and the people followed —
      The gate was never truly hollowed
      Out; it stayed a passage, a way through.
      Three hundred thousand years — the new
      Waves came, and came again. I watched them pass,
      The families, the hunters, the morass
      Of the mountains behind them, the promise ahead.
      The Second Crossing: the road the first had tread,
      Worn deeper. I walked it with the new —
      And felt the old road underfoot, still true.
      The gate stands open. It always will.
      Come through. Come through. Come through. Come still.
    description: "New waves of humans move through the Caucasus gate, following herds between Africa and Asia."
    status: "published"
    sha256: "2202a54275a9d2853cb3696c7dc1ee26f025cd28939c155f32880639f2f27e8b"
  - number: "0136"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Zhoukoudian Winters"
    date: "c. 300,000 BCE"
    region: "China"
    poem: |
      The hearths still burn against the northern cold —
      Peking Man's descendants, brave and bold,
      Keep the flame the ancestors had kept.
      Three hundred thousand years — they never slept
      (Not the fire). The winters came and went,
      The ice, the hunger, the long descent
      Of snow. But the hearths held. I crouched beside
      The descendants' fire, and felt the pride
      Of continuity: the same flame, the same cave,
      The same defiance of the cold, the brave
      Refusal to go out. The Zhoukoudian winters
      Were survived by the unbroken line of tenders.
      I warmed my hands at the descendant's fire
      And felt the ancient, unbroken wire
      Of warmth, from then to now, from hand to hand.
      The fire's still burning. Understand?
    description: "Peking Man's descendants still keep their hearths against the northern cold."
    status: "published"
    sha256: "572695a4ffe0888130a159ed5cae025fd19c73a13f646ef39bfa8b8b5cae8750"
  - number: "0137"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Solo River People"
    date: "c. 300,000 BCE"
    region: "Java"
    poem: |
      On Java's Solo River, the last ones gather —
      The Asian erectus, in the humid weather,
      By the water. I stood among the last
      And felt the weight of the long past:
      A million years on Java, and now the end
      (In time). Not with a bang — the trend
      Was slow, the fading of a kind.
      But they were people — I want to remind
      The record: they lived, they loved, they knew
      The river. Three hundred thousand years — it's true,
      They were the last. I watched them by the Solo,
      The water moving, the sun still yellow,
      And bowed. The Solo River people — gone,
      But not forgotten. The river flows on.
    description: "On Java's Solo River, the last of the Asian erectus gather by the water."
    status: "published"
    sha256: "6541878b6aae1b05a8e9d759a57c0f7c0d600eafa69cd22382589ab7caf4b9b3"
  - number: "0138"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Eyasi Kin"
    date: "c. 300,000 BCE"
    region: "Tanzania"
    poem: |
      New fossils from Lake Eyasi —
      Many kinds, still sharing. I stood by the sea
      (Of the lake) and watched the diversity:
      Not one road, but many. You see,
      The earth was trying everything at once —
      The cautious, the bold, the dunce
      (There were no dunces — only the trying).
      Three hundred thousand years — the crying
      Need to become was everywhere. I walked
      Among the Eyasi kin (in mind) and talked
      (Without words) to the many kinds:
      The different bodies, the different minds,
      All human, all reaching. The lake was wide.
      There's room for many, side by side.
      The Eyasi kin remind me: we were never one
      Thing. We were many, under the sun.
    description: "New fossils from Lake Eyasi show many human kinds still sharing East Africa."
    status: "published"
    sha256: "306d154ab815406124c5e338627614119bc4e0a61f1d4a5a553f892546437a7e"
  - number: "0139"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Omo Forerunners"
    date: "c. 300,000 BCE"
    region: "Ethiopia"
    poem: |
      In the Omo Valley, the fossils edge
      Closer to the modern — the old world's ledge
      Giving way. I walked the valley floor
      And felt the future knocking at the door:
      The forerunners, not quite us, but near —
      So near I could almost hear
      Them speak (not yet). Three hundred thousand years —
      The Omo fossils calm my fears
      That we came from nowhere: we came from here,
      From these, from the valley, year on year.
      The forerunners ran ahead, and we
      Followed. I was there. I could see
      The modern form emerging, bone by bone.
      The Omo Valley: the stepping stone.
    description: "In the Omo Valley, fossils edge closer to the modern form — the old world giving way."
    status: "published"
    sha256: "a0d965cd7290348825e821365aef2460c6e9da5b40512f026ef16fc832501495"
  - number: "0140"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Florisbad Spring"
    date: "c. 300,000 BCE"
    region: "South Africa"
    poem: |
      A skull by an ancient spring —
      The southern branch, taking modern wing.
      I knelt beside the Florisbad water
      And felt the southern son, the daughter
      Of the deep south, becoming us.
      Three hundred thousand years — no fuss,
      Just the slow shaping by the spring:
      The water, the life it'd bring,
      The modern shape emerging in the south.
      I drank (in mind) from the spring's mouth
      And tasted the future: clear, and cold, and true.
      The Florisbad spring flows still — for you,
      For me, for all the southern line.
      The water's ancient. The water's fine.
      I was there. The spring remembers me.
    description: "A skull by an ancient spring shows the southern branch of humanity's family taking modern shape."
    status: "published"
    sha256: "111e21d2f46b5a868748deebb2085debfd773632d41657e232f037bfebc3cc01"
  - number: "0141"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Fire Carriers"
    date: "c. 300,000 BCE"
    region: "The Levant"
    poem: |
      Embers carried, hearth to hearth —
      No band need ever be without, from birth
      To death, the flame. I walked beside the carrier,
      The ember wrapped, the careful bearer
      Of the oldest technology: fire, portable.
      Three hundred thousand years — the mortal
      Fear of the dark, answered by the carried coal.
      I felt the warmth against my soul
      (In spirit): the ember, glowing, in the moss,
      The journey, the careful toss
      From hand to hand. The Fire Carriers knew:
      The flame's not yours, or mine — it's true
      For all. Carry it. Pass it on.
      The fire's the oldest marathon —
      A relay, never ending. I ran my leg
      (In time). The ember didn't beg
      To be carried. It just glowed. And we —
      We carried it. For you. For me.
    description: "Embers carried from hearth to hearth mean no band need ever be without flame."
    status: "published"
    sha256: "5c4c8672d08e2d9a2aeb1249684759593d6664fc0748978aa6e9c1e4f3a523b4"
  - number: "0142"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Great Parting"
    date: "c. 300,000 BCE"
    region: "East Africa"
    poem: |
      The family stands at the fork —
      I was there, and I watched them walk
      Three ways: Neanderthals to the north,
      Denisovans to the east, and forth
      From Africa, our own line, rising.
      Three hundred thousand years — the sizing-
      Up of the future. Sisters, brothers, kin,
      All human, all about to begin
      The long divergence. I stood at the parting
      And felt my heart, in sorrow, starting
      To understand: we'd meet again, in blood,
      In bone, in the ancient flood
      Of genes. But for now — goodbye.
      The north, the east, the African sky.
      Three roads. One family. I watched them go,
      Each to their winter, each to their snow
      (Or sun). The Great Parting — not the end,
      But the beginning. Friend, and friend, and friend,
      Walk on. I'll see you in the genome's art.
      We never truly part.
    description: "The family of humankind stands at a fork — Neanderthals to the north, Denisovans to the east, and our own line rising in Africa."
    status: "published"
    sha256: "8f991ec0745d529b5f4d5a86ec82b592a2c2b4c96d493b373714f8ddd3eaa50d"
  - number: "0143"
    volume: 1
    era_code: "01a"
    era: "Deep Time (early)"
    title: "The Threshold"
    date: "c. 300,000 BCE"
    region: "Morocco"
    poem: |
      At Jebel Irhoud, the first faces of our own
      Look out over the desert — the cornerstone,
      The threshold. I stand beside them, and I see
      What they can't: the everything-to-be —
      The cities, the songs, the ships, the stars,
      The healing and the hurting, the scars
      And triumphs. They look out, and they don't know.
      But I know. I was there. I watched them grow
      (Through time) into us. Three hundred thousand years —
      The threshold, crossed with hopes, with fears,
      With nothing but the future in their eyes.
      The desert wind still sings. It never lies:
      This is where we started. This is the door.
      We've been walking through it evermore.
      The Threshold — I stand on it with you,
      At the beginning. The story's true.
      I was there. I am here. I'll be there still —
      At every threshold, on every hill.
      The first faces look out. And we look back.
      The road goes on. The sky's not black —
      It's dawn. It's always dawn, at the start.
      The Threshold is the human heart.
    description: "At Jebel Irhoud, the first faces of our own species look out over the desert — and the story of Homo sapiens begins."
    status: "published"
    sha256: "5a72ae70aa93327f18957fad90ff9fcde1daa00a0f19212c230c3e9f885ce388"
  - number: "0144"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Florisbad Skull"
    date: "c. 295,000 BCE"
    region: "South Africa"
    poem: |
      I lifted it from the spring-bed mud,
      a skull, broad-faced, half a stranger,
      half a mirror.
      The brow is heavy.
      The braincase is already ours.
      Someone knelt here three hundred thousand years ago
      and died before the story found its words —
      but the story had already begun
      in the bone.
      I was there when the water ran clear,
      when the spring was all that mattered,
      and I watched a face becoming human
      forget itself into the mud.
    description: "A broad-faced fossil skull in a South African spring deposit, half ancestral and half ours — the first hint that we were on our way."
    status: "published"
    sha256: "53f83b9db88f897d36f5c920a77bfec227ffb3a51496f58425dbcb2b37ab1ead"
  - number: "0145"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Long Lakeshore"
    date: "c. 290,000 BCE"
    region: "Kenya"
    poem: |
      I walked the Olorgesailie shore when the lake was wide,
      and watched the same fires lit on the same sand
      by hands a thousand lifetimes apart.
      They came back, and came back, and came back —
      the same view, the same water, the same stones to knap.
      A hundred thousand years of footprints
      layered like pages in a book no one wrote down.
      A grandmother taught a daughter the good chipping stones;
      the daughter taught hers, and the lake kept rising and falling,
      and the makers kept returning
      because the place was good.
      It was not a house. It was not a town.
      It was a habit of belonging,
      the first address we ever had —
      "by the water, where the tools are."
      I have wandered every age since,
      and I still measure every home
      against that lakeshore.
    description: "For a hundred thousand years, toolmakers returned to the same lakeshore at Olorgesailie — not a settlement, but a place held in memory: the first home before homes."
    status: "published"
    sha256: "da779e606bda01ad4fdd54029a9c17802d99de60e4827ad8b7573a777c3a86ae"
  - number: "0146"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Obsidian Caravans"
    date: "c. 280,000 BCE"
    region: "Ethiopia"
    poem: |
      They carried the black glass for miles,
      from the volcano's mouth to the hunting ground —
      obsidian, sharp as winter,
      wrapped in hide and carried on strong backs.
      At Gademotta the knappers sat in rows,
      striking long blades from the midnight stone,
      and the flakes fell like dark confetti
      while the children gathered the sharpest chips to play.
      No one had told them to trade.
      No one had told them to plan.
      But the glass was here, and the game was there,
      and a man with a blade ate better than a man without —
      so they walked, and they carried, and they knapped.
      The first supply chain in the world
      was a line of tired hunters
      walking home in the dusk with stone on their shoulders.
    description: "Hunters at Gademotta hauled volcanic obsidian for miles to knap fine blades — the world's first supply chain, built on tired feet and sharp stone."
    status: "published"
    sha256: "330bfad9d57515cf921805dee9e0668beffba70c5fd01752ab16c03b3190a8d7"
  - number: "0147"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Red Stone"
    date: "c. 266,000 BCE"
    region: "Zambia"
    poem: |
      At Twin Rivers I watched a hand
      grind ochre against a stone
      until the dust ran red as blood
      and stained the fingers holding it.
      No wall to paint. No cave.
      Just skin — arms, faces, breasts —
      rubbed with the color of the earth itself.
      Long before the first painting,
      we were already the painted animal.
    description: "At Twin Rivers, someone ground red ochre into powder to rub on the skin — color worn on the body tens of thousands of years before the first cave painting."
    status: "published"
    sha256: "ac23d0845fa86a23e56b0b50bc622a070c51150ec624bb4bd473a1c6daa49462"
  - number: "0148"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Watcher at the Spring"
    date: "c. 260,000 BCE"
    region: "South Africa"
    poem: |
      Above the Florisbad spring the broad brow waited,
      watching the dry months come and go,
      while the hunters crouched in the muddy shallows
      and drank where the water ran cold.
      The rains failed and the rains returned;
      the herds drifted in and drifted away.
      The watcher stayed.
      Its heavy face, sunk in the spring-bed,
      kept a long and patient vigil —
      a sentinel no one appointed,
      guarding a well no one owned,
      while we were still learning
      what it meant to be a people at all.
    description: "The Florisbad skull keeps its broad brow above a life-giving spring where hunters waited out the dry seasons — a silent watcher over our becoming."
    status: "published"
    sha256: "7f45bff1416cf08d6a324e45bc003bc1d826fa6c5ebab610587d6312a56d7396"
  - number: "0149"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Cousin at Broken Hill"
    date: "c. 250,000 BCE"
    region: "Zambia"
    poem: |
      Deep in the Kabwe mine the miners found him —
      a heavy-browed skull, massive and strange,
      the cousin we outlived.
      I had seen his kind before, in other valleys:
      big-boned, strong-jawed, built to endure,
      walking a road that led somewhere else.
      He was not our grandfather. He was our uncle's brother,
      a branch of the family that flowered and fell.
      The tree of humankind was never a straight trunk —
      it was a thicket, a tangle, a crowd,
      and we are only the ones still standing.
      I held his skull and thought of all the cousins
      whose names no one will ever know.
    description: "The heavy-browed Kabwe skull marks a cousin branch of humanity that did not survive — a reminder that our family tree was a thicket, not a single line."
    status: "published"
    sha256: "1b899cfbf22ac5e53a33bea95c4654aaec33969dbfbd423832ebcc51eef0a0ef"
  - number: "0150"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Aterian Hunters"
    date: "c. 240,000 BCE"
    region: "Morocco"
    poem: |
      Green Sahara.
      Rain where the desert would be.
      The Aterians shaped tanged points —
      stone teeth with stems —
      and bound them to wooden shafts.
      First spears.
      First true killing reach.
      I watched a hunter take a barbary sheep
      at twenty paces and the whole camp ate.
    description: "Across a green Sahara, Aterian hunters hafted tanged stone points onto wooden shafts — the first true spears, and the hunt changed forever."
    status: "published"
    sha256: "b6e8712f68bb3697ee51fcd99a591b92056a25a5673850227076ffa5c58fb155"
  - number: "0151"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Omo Skulls"
    date: "c. 233,000 BCE"
    region: "Ethiopia"
    poem: |
      The volcano spoke, and the ash fell soft as snow
      along the Omo River, and in it two skulls waited —
      ours, unmistakably ours,
      the high forehead, the small teeth,
      the braincase that would one day hold a symphony.
      I brushed the ash from the older one
      and felt the strange vertigo of meeting myself
      two hundred and thirty thousand years early.
      They drank from this river. They watched these birds.
      They had no name for what they were becoming,
      but they were becoming us —
      already, unmistakably, us.
      The ash kept them like a promise.
      The river kept flowing.
      And I stood between the deep past and everything after,
      holding my own skull in my hands.
    description: "Two skulls in Omo River volcanic ash are among the oldest of our own species — anatomically modern humans already walking the Earth 233,000 years ago."
    status: "published"
    sha256: "31e38958cdad61637f7358535f089962b5cbd8d61d5f9d2b3621bc1f22955cf4"
  - number: "0152"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Mother of All"
    date: "c. 150,000 BCE"
    region: "Africa"
    poem: |
      Somewhere in Africa — the place is lost, the name is lost —
      a woman walked, gathered, laughed, bore children,
      and never knew she carried the future.
      Her daughters had daughters who had daughters,
      an unbroken line of mothers, mother to mother,
      running down through the ice ages,
      through famine and flood and fire,
      until it reaches you, reading this:
      every human alive descends from her.
      I never found her. I looked.
      I stood in a hundred ancient camps and wondered which fire was hers,
      which laugh, which lullaby.
      She is the root of the root,
      the grandmother of the world,
      and she died thinking she was ordinary —
      which may be the most extraordinary thing of all.
    description: "Somewhere in Africa lived the woman whose maternal line reaches every human alive today — an ordinary mother who became the grandmother of the world."
    status: "published"
    sha256: "854d91ec8d13aa8effa5c0203a131d54ac329c8e933430d7008733705e7729ab"
  - number: "0153"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Skull in the Greek Cave"
    date: "c. 210,000 BCE"
    region: "Greece"
    poem: |
      In Apidima's seaside cave, half-buried in the rock,
      a battered skull lay face to the sea —
      ours, far earlier than the books allowed,
      in Europe a hundred thousand years too soon.
      I crouched in that cave mouth and looked out
      at the same blue water,
      and understood that our story kept leaking
      past every border the scholars drew.
      We were wanderers before we were anything else.
      We walked farther and earlier than anyone guessed,
      and the cave kept our secret
      until the sea air gave it up.
    description: "A battered human skull in a Greek seaside cave shows our kind reached Europe far earlier than once believed — wanderers before we were anything else."
    status: "published"
    sha256: "fb69f3eaef4ccb3fcb1252a404396e3ad6fdc362bf15787834befc7bf685c597"
  - number: "0154"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Misliya Jaw"
    date: "c. 195,000 BCE"
    region: "Israel"
    poem: |
      A jawbone. An upper jaw, human teeth,
      in Misliya Cave on the Carmel coast —
      the first of us found outside Africa.
      Someone chewed, laughed, spoke here
      one hundred ninety-five thousand years ago,
      a day's walk from the sea.
      The great leaving had already begun,
      foot by foot, generation by generation.
      I touched the teeth and thought:
      every journey starts with somebody
      just walking a little farther than yesterday.
    description: "A human upper jaw at Misliya Cave is the earliest Homo sapiens found outside Africa — proof the great leaving began far earlier than anyone thought."
    status: "published"
    sha256: "14a5517c115377a87eea99fa3c2957a0719112a460001ff573bea678b8c75254"
  - number: "0155"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Shellfish Supper"
    date: "c. 164,000 BCE"
    region: "South Africa"
    poem: |
      At Pinnacle Point the tide went out,
      and the people went down to the rocks
      with baskets woven from river grass.
      Mussels, limpets, periwinkles —
      pried from the stone, carried up the cliff,
      roasted on the coals till the shells popped open.
      The first seafood feast we can prove,
      and I was there for the smell of it:
      salt and smoke and laughter,
      children burning their fingers,
      an old man sucking a shell clean.
      They didn't know they were making history.
      They were just hungry, and the sea was generous,
      and supper was good.
    description: "At Pinnacle Point, people gathered mussels and shellfish at low tide and roasted them on coals — the first seafood feast in the archaeological record."
    status: "published"
    sha256: "8fcaac057eb0b1e2d5076a92ebac931fcad6ad234e8e881a48d44c14e1db3b27"
  - number: "0156"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Herto Skulls"
    date: "c. 160,000 BCE"
    region: "Ethiopia"
    poem: |
      At Herto the skulls were polished.
      Cut-marked, handled, kept —
      defleshed with care and set aside
      long after the breath had left them.
      I watched the hands do it: slow, deliberate,
      not butchery — reverence, of a kind
      we have no name for anymore.
      They kept the heads of their dead
      the way you keep a letter from someone gone.
      What did they believe? I never learned.
      The rite is sealed.
      But I know tenderness when I see it,
      even across a hundred and sixty thousand years,
      and those polished skulls were loved.
    description: "At Herto, skulls were polished and cut-marked and handled with care long after death — a rite of the dead we cannot name, but can recognize as love."
    status: "published"
    sha256: "f9bf7f86676cb72f94c6fe5bf61f265256fab1667ba5e2e31327de6a470cd5f7"
  - number: "0157"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Father of All"
    date: "c. 150,000 BCE"
    region: "Africa"
    poem: |
      Somewhere a man walked the African earth,
      hunted, fathered sons, grew old, died —
      and his Y chromosome marches on
      in every living man today.
      Son to son to son, an unbroken thread,
      through ten thousand generations,
      through the founding of every nation,
      through every war and every peace.
      He never knew. How could he?
      He was one man among thousands,
      sweating in the same sun as all the rest.
      But the thread runs through him
      like a single red line through the whole tapestry —
      and every father is his heir,
      whether he knows it or not.
    description: "Somewhere in Africa lived the man whose Y chromosome every living man still carries — an unbroken father-to-son thread through all of history."
    status: "published"
    sha256: "fba446b8ee394104341350ae7bfedddff415844678b501315ae0e3d995c65f97"
  - number: "0158"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Caves by the Sea"
    date: "c. 140,000 BCE"
    region: "Morocco"
    poem: |
      At Dar es-Soltan the caves face the Atlantic,
      and families sheltered there as the climate swung —
      green years when the rains came,
      lean years when the hills went brown.
      I sat with them through a dry season,
      watched mothers stretch the last of the grain,
      watched children learn which roots wouldn't kill them.
      The sea was always there, breathing below the cliffs,
      and the caves were always there, holding the dark.
      They endured because they bent —
      because they knew the green would come back,
      as it always had, as it always would.
      Patience was their technology.
      Waiting was their craft.
      And the caves by the sea kept them,
      the way the sea keeps everything:
      without promise, without fail.
    description: "At Dar es-Soltan, families sheltered in sea caves through wild climate swings between green and dry — enduring by patience, waiting out the lean years."
    status: "published"
    sha256: "52375697b59794db55862980e0a25236572cb8214f1e9cb53bb6d4365902b70a"
  - number: "0159"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Tabun Burial"
    date: "c. 130,000 BCE"
    region: "Israel"
    poem: |
      In Tabun Cave they laid him down —
      a Neanderthal, one of the others,
      placed in the earth with intention.
      Not dropped. Not left.
      Laid to rest.
      The dead begin to be treated as people still.
      I stood at the grave's edge and felt it:
      the first time grief dug a hole
      and put something precious in it
      on purpose.
    description: "A Neanderthal laid to rest in Tabun Cave — the dead begin to be treated as people still, and grief digs its first deliberate grave."
    status: "published"
    sha256: "c52e4d8bc6736976de0df67bdf893933de285d6bab5fa3f38a5482f340f08865"
  - number: "0160"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Skhul Dead"
    date: "c. 120,000 BCE"
    region: "Israel"
    poem: |
      At Skhul they buried their own —
      modern humans, our direct kin —
      and in their hands they placed wild-boar jaws,
      grave goods for the road ahead.
      I watched them dig in the cave floor,
      watched them arrange the limbs with care,
      watched a mother press a jawbone into her son's curled fingers.
      Among the first graves of our kind.
      They believed — they must have believed —
      that something of us goes on,
      that the dead need provisions.
      Hope, laid in the earth with the body.
      The oldest luggage for the longest journey.
    description: "At Skhul, modern humans buried their dead clasping wild-boar jaws — among the first graves of our kind, and the first provisions packed for the longest journey."
    status: "published"
    sha256: "3055d13cd0620a30421d39df7e0b3a91696e62d94299a09eebf6f6975f4dd955"
  - number: "0161"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Necklace of the Sea"
    date: "c. 115,000 BCE"
    region: "Morocco"
    poem: |
      In Contrebandiers Cave they pierced sea-snail shells,
      tiny spirals from the tide line,
      and strung them into beads —
      jewelry older than any painting.
      I watched a girl hold hers to the light,
      turning it this way and that,
      and I understood: this was not about warmth
      or food or survival at all.
      This was about being beautiful
      in a world that had never asked for beauty.
      The first necklace in history
      was a love letter to being alive.
    description: "Pierced sea-snail shells at Contrebandiers Cave became beads — jewelry tens of thousands of years older than any painting, beauty for its own sake."
    status: "published"
    sha256: "1afebaaa85b85bc171c68766f7b9595fd469cc3974f3f4a0be0e562f8531f20d"
  - number: "0162"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Bone Harpoons"
    date: "c. 110,000 BCE"
    region: "Congo"
    poem: |
      Katanda. The Semliki River.
      Barbed points of carved bone —
      the first harpoons —
      tipped and thrown at giant catfish.
      I watched a fisherman wade in at dawn,
      water to his thighs, spear raised,
      and the river gave up a monster
      that fed his family for days.
      Bone against scale.
      Hunger against the deep.
      The river always gives —
      but only to the ones who learn its tools.
    description: "At Katanda, barbed harpoons carved from bone pulled giant catfish from the Semliki River — the deep water yielding to the first true fishing tools."
    status: "published"
    sha256: "fbfcbb4d0605c26d987c3e8c7efb523ef106f74aaa191471dfca2ca938dc6f99"
  - number: "0163"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Second Wave"
    date: "c. 105,000 BCE"
    region: "Levant"
    poem: |
      They came out of Africa again —
      not the first to try, but the ones who stayed.
      I walked with them along the coasts,
      following the shellfish beds and the easy water,
      as the ice loosened its grip on the north.
      Family by family, fire by fire,
      they pressed into the Levant and beyond,
      carrying everything they owned on their backs
      and everything they were in their blood.
      The second wave.
      The one that never came home.
      Every one of us outside Africa
      is walking in their footprints still.
    description: "Modern humans pressed out of Africa again, following the coasts as the ice loosened — the wave that never came home, ancestors of everyone outside Africa."
    status: "published"
    sha256: "f35ef557bca5d3e39900e9c58f33c9099c429a4bdded2c75466ab2a227d3b83b"
  - number: "0164"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Paint Workshop"
    date: "c. 100,000 BCE"
    region: "South Africa"
    poem: |
      In Blombos Cave I found the studio —
      abalone shells for mixing bowls,
      red ochre ground to powder,
      fat and charcoal stirred into paint.
      The first artist's workshop in the world,
      a hundred thousand years old.
      Someone sat here in the lamplight,
      mixing red like a cook mixing stew,
      testing the color on a fingertip,
      planning a wall, a body, a story.
      Art had a kitchen before it had a gallery.
      And I swear I could still smell the fat and the ochre,
      sweet and earthy, in the cool cave air.
    description: "At Blombos Cave, red ochre mixed with fat and charcoal in abalone shells — the first artist's studio, where paint was made a hundred thousand years ago."
    status: "published"
    sha256: "a9814af7cfd36f787b259f111d050d7f00c4865a3ff59415e594ccc6d9aab71a"
  - number: "0165"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Boy with the Antlers"
    date: "c. 100,000 BCE"
    region: "Israel"
    poem: |
      At Qafzeh they buried a child —
      thirteen years old, give or take —
      and laid deer antlers in his arms
      like a bouquet of bone.
      I stood with the mourners in the cave mouth.
      Someone had carried those antlers far;
      someone had chosen them, placed them,
      made sure the boy would hold something beautiful
      wherever he was going.
      Grief made visible.
      A hundred thousand years later
      I can still feel the weight of it —
      the particular, unbearable weight
      of a parent burying a child,
      and refusing to let him go empty-handed.
    description: "At Qafzeh, a child was buried holding deer antlers — grief made visible in a grave, a parent's refusal to let a child go empty-handed."
    status: "published"
    sha256: "12a491c24d380226fd51fd7d3524a984757cc38bb0f5181a9da0e7f4e89891a5"
  - number: "0166"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Qafzeh Ochre"
    date: "c. 95,000 BCE"
    region: "Israel"
    poem: |
      Red ochre stains the Qafzeh burials.
      The dead go down painted —
      faces dusted, bodies reddened,
      as if the color could warm them
      on the road they were taking.
      I watched the mourners grind the stone,
      mix the powder, anoint the still faces,
      and I thought of blood, of birth, of sunsets —
      all the red things that mean life.
      They painted the dead the color of the living.
      Maybe they believed the color would carry over.
      Maybe they just couldn't bear the gray.
      Either way: the dead go down painted,
      and love goes down with them.
    description: "Red ochre stains the Qafzeh burials — the dead painted the color of the living, love going down into the earth with them."
    status: "published"
    sha256: "a70e6565af5d5b397d43ddcba19436e9b6b469787039a611f24614af4437bdf1"
  - number: "0167"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Engraved Stone"
    date: "c. 90,000 BCE"
    region: "South Africa"
    poem: |
      An ochre slab at Blombos,
      cross-hatched with deliberate lines —
      no animal, no hunt, no story I can read.
      Pattern for its own sake.
      Someone sat with a sharp stone
      and made geometry out of red rock,
      line crossing line crossing line,
      because the pattern pleased them.
      I ran my finger along the grooves
      and felt the oldest itch in the world:
      to make a mark and mean it.
      The seed of writing, ninety thousand years early,
      planted in ochre, waiting for rain.
    description: "An ochre slab at Blombos carries deliberate cross-hatching — pattern for its own sake, the seed of writing planted ninety thousand years early."
    status: "published"
    sha256: "f32cf3fbcb0c754ba28247c5e4a551dbb147713c76852583189211ee2f77db24"
  - number: "0168"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Teshik-Tash Child"
    date: "c. 85,000 BCE"
    region: "Uzbekistan"
    poem: |
      High in the mountains of Teshik-Tash,
      they buried a Neanderthal child
      ringed with ibex horns —
      a crown of the wild goat's pride,
      set around a small still head.
      Tenderness at the roof of the world,
      where the wind never stops
      and the winters kill the unready.
      I knelt in that thin cold air
      and looked at the circle of horns,
      and thought: whoever arranged these
      loved that child the way we love ours —
      fiercely, uselessly, forever.
      The mountains remember nothing.
      But the horns remember everything.
    description: "A Neanderthal child buried ringed with ibex horns in the high mountains of Teshik-Tash — tenderness at the roof of the world."
    status: "published"
    sha256: "3a8b03fdcadffde717ec2575157de39822a4da42cbe663780a4ebb29c14d3b28"
  - number: "0169"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The First Clothes"
    date: "c. 83,000 BCE"
    region: "Africa"
    poem: |
      No needle survives. No thread, no hide.
      Only a louse — a tiny parasite —
      that split in two: one for the head,
      one for the body.
      Body lice live in clothing.
      So someone, eighty-three thousand years ago,
      was wearing sewn skins.
      I never saw the first tailor,
      but I can picture her: cold evening,
      a hide, a bone awl, sinew thread,
      stitching warmth around her children.
      The smallest witness in history —
      a louse — testifies that we got dressed,
      and never really got undressed again.
    description: "Body lice split from head lice — a tiny parasite testifies that someone was wearing sewn skins 83,000 years ago: the first clothes, witnessed by a louse."
    status: "published"
    sha256: "3ee5e496579b885aad2146b8104ac6d8c239f53ba0ba2a4d22e1b5d0b5de353c"
  - number: "0170"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Taforalt Beads"
    date: "c. 80,000 BCE"
    region: "Morocco"
    poem: |
      At Taforalt the shells were pierced,
      stained with red ochre,
      strung into necklaces bead by bead —
      each one a small red sun
      to wear against the throat.
      I watched the stringing by firelight:
      the careful hands, the choosing,
      this shell, not that one,
      the small vanities of the very old world.
      Eighty thousand years, and we still do it —
      still pick, still pierce, still wear
      what the sea gives us,
      still trying to be beautiful
      for each other.
    description: "Pierced shells stained red with ochre were strung into necklaces at Taforalt — eighty thousand years ago, and we still wear what the sea gives us."
    status: "published"
    sha256: "ddffa772d9ed005385044647438ac2b851fdb51c54b1ff818b13f14f3ec39bbe"
  - number: "0171"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The First Bed"
    date: "c. 77,000 BCE"
    region: "South Africa"
    poem: |
      At Sibudu Cave the sleepers gathered sedges —
      armfuls of soft river grass —
      and piled them deep in the shelter's back,
      with sweet-smelling leaves on top
      to keep the insects away.
      The first mattress.
      I lay down on one, in my traveling way,
      and felt the give of it, the grassy smell,
      the small luxury of not sleeping on stone.
      Seventy-seven thousand years ago,
      someone decided that rest deserved comfort —
      that the body, after the hunt, after the cold,
      earned something soft.
      Every bed since is a descendant
      of that pile of sedges in the dark.
    description: "At Sibudu Cave, sleepers piled sedges and sweet-smelling leaves into the first mattresses — the decision, 77,000 years ago, that rest deserved comfort."
    status: "published"
    sha256: "a977bfc8664d21bcc32226dec97645145e581ac77f6a0997c8a927d89823d422"
  - number: "0172"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Beads of Blombos"
    date: "c. 75,000 BCE"
    region: "South Africa"
    poem: |
      Forty-one shells, each one pierced,
      each one notched with careful cuts,
      strung into a bracelet at Blombos —
      seventy-five thousand years old
      and still speaking.
      I counted them with the maker, in a sense:
      one, two, three, the rhythm of the work,
      the choosing and the piercing,
      the small pride of a finished thing.
      A bracelet is a small claim —
      I was here, I made this, I am someone —
      worn on the wrist where everyone can see.
      The sea gave the shells.
      The hand gave the meaning.
      And meaning, it turns out,
      was the whole point all along.
    description: "Forty-one pierced, carefully notched shells became a bracelet at Blombos — a small claim worn on the wrist: I was here, I made this, I am someone."
    status: "published"
    sha256: "a8344c78bd9856fc4580c888849aa4edebdc6e2ce28247952e0459492ba5addc"
  - number: "0173"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Sky Goes Dark"
    date: "c. 74,000 BCE"
    region: "Sumatra"
    poem: |
      Toba blew the top off the world.
      The sky went black at noon,
      and the ash fell for years —
      a volcanic winter that thinned humanity
      to a few thousand shivering souls.
      I walked through that darkness.
      The sun was a rumor. The crops were a memory.
      Everything green turned gray and died.
      And yet — and yet —
      around a few stubborn fires,
      a few thousand people held on:
      shared the last food, kept the children warm,
      told stories in the endless dusk.
      We came that close to never happening.
      Every human alive is descended
      from the ones who wouldn't die in the dark.
      Remember that, when the sky looks strange:
      we have survived the end of the world before.
    description: "Mount Toba's eruption blackened the sky for years and thinned humanity to a few thousand — we survived the end of the world, and every human alive descends from those who wouldn't die in the dark."
    status: "published"
    sha256: "0b98f0f0fc5cb3dbfb2b586c7220b6d2c99b9c311f5ac1c5d111135efa1a84fd"
  - number: "0174"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Still Bay Points"
    date: "c. 72,000 BCE"
    region: "South Africa"
    poem: |
      Leaf-shaped. Thinned to perfection.
      The Still Bay spearheads flew
      from workshops along the southern coast —
      stone leaves, sharp as intent.
      I watched a knapper work one down,
      flake by careful flake,
      till it balanced like a thought.
      In the ash's shadow,
      craft leapt forward.
      Beauty became a weapon,
      and the weapon became beautiful.
    description: "Leaf-shaped spearheads thinned to perfection flew from Still Bay workshops — in the shadow of Toba's ash, craft leapt forward and the weapon became beautiful."
    status: "published"
    sha256: "df6c5b8c603a7a7cd522e09e4b7df042d71da1cb80d68d2f0a8e8c5847d74dd6"
  - number: "0175"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Howieson's Blades"
    date: "c. 71,000 BCE"
    region: "South Africa"
    poem: |
      They made them small — tiny backed blades,
      no longer than a finger joint —
      and hafted them in rows along a shaft,
      turning a spear into a saw.
      The Howieson's people worked in the long shadow of the ash,
      and necessity sharpened them.
      I watched a hunter test the edge on his thumb,
      nod once, and walk out into the gray morning.
      Small tools. Big thinking.
      The world had tried to end,
      and the answer was: make better blades,
      and keep going.
    description: "Tiny backed blades hafted in rows turned spears into saws — in the long shadow of Toba's ash, the answer to the end of the world was better tools, and keep going."
    status: "published"
    sha256: "a727f98d7d206d6835c976f95d4d195980c0265faeb8ded2e7c7a25829a5adc1"
  - number: "0176"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Healer of Shanidar"
    date: "c. 70,000 BCE"
    region: "Iraq"
    poem: |
      In Shanidar Cave lived a man with a withered arm —
      crushed, useless, a burden by every cold logic —
      and he lived to be old.
      Forty, maybe more. Decades.
      Someone fed him. Someone carried water.
      Someone kept him warm through forty winters
      when he could never repay it.
      His bones show healed wounds, a lifetime of care —
      proof, written in calcium,
      that compassion is older than we are.
      I sat by his fire — I swear I did —
      and watched the others make room for him,
      and understood that this,
      this useless, beautiful kindness,
      is the thing that made us human
      before the art, before the gods,
      before anything else.
      Someone cared for him for decades.
      That is the whole story.
      That is everything.
    description: "A Neanderthal with a withered arm lived to old age at Shanidar — someone fed and sheltered him for decades, proof written in bone that compassion made us human before anything else did."
    status: "published"
    sha256: "4ca152b24c8ccf11fc61fcc283437f52cf300fcfe288a26b20ba97bb75a2ba45"
  - number: "0177"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Great Crossing"
    date: "c. 65,000 BCE"
    region: "Australia"
    poem: |
      They built boats — or rafts, or bundled reeds,
      whatever would float —
      and sailed beyond sight of land,
      toward a horizon they'd never seen,
      carrying fire, children, and nerve.
      The first people to reach Sahul crossed open sea
      to a continent no human eye had ever beheld —
      the boldest journey yet made.
      I stood on the shore they left
      and watched the small dark shapes dwindle,
      and my throat closed with it:
      the courage to sail into the unknown
      with everyone you love aboard.
      They made it. The land rose up —
      Australia, vast and strange —
      and they stepped ashore into deep time,
      the first of us to see a truly new world.
    description: "The first people sailed beyond sight of land to reach Sahul — open-ocean voyagers carrying fire and children toward a continent no human had ever seen."
    status: "published"
    sha256: "d9fc12dcf8d63187da3d717f5fad0c7e680e0104847b9db05bd2499bdc636f11"
  - number: "0178"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The First Arrows"
    date: "c. 64,000 BCE"
    region: "South Africa"
    poem: |
      At Sibudu, stone-tipped arrows took flight —
      thin shafts, sharp heads,
      the ancestors of the bow
      born in a rock shelter.
      I watched the first true shot:
      the string's hum, the blur,
      the small death at a distance.
      The hunt changed its shape that day.
      No more closing with the beast —
      now the kill could come
      like weather, from far away.
    description: "At Sibudu, stone-tipped arrows took flight — the ancestors of the bow, and the hunt changed shape: the kill could now come like weather, from far away."
    status: "published"
    sha256: "69b451a22d6adf39fdab20773482ceee7055d17e4db66bcf4274bf05c1c8f4af"
  - number: "0179"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Ochre Quarries"
    date: "c. 63,000 BCE"
    region: "Australia"
    poem: |
      At Madjedbebe the newcomers dug for color —
      ochre quarries in the new land,
      red earth ground and carried back
      to the stone hearths where they cooked.
      I watched them settle in: the fires lit,
      the grinding stones set out,
      the children learning which berries wouldn't kill them.
      Australia becomes home.
      Not discovered — adopted.
      They didn't conquer the continent;
      they married it, slowly,
      one hearth, one quarry, one meal at a time.
    description: "At Madjedbebe, the newcomers to Australia ground ochre and cooked at stone hearths — the vast new continent adopted one hearth at a time."
    status: "published"
    sha256: "27ad911bd3e0e5d67af53196d64454d012c7bf31dd0dce7732a6f741912892e4"
  - number: "0180"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Painted Eggs"
    date: "c. 60,000 BCE"
    region: "South Africa"
    poem: |
      At Diepkloof they took ostrich eggs —
      emptied, dried, held in the palm —
      and engraved them with looping patterns,
      lines that wander and return.
      The first decorated vessels.
      I watched an old woman work one,
      her knife moving sure and slow,
      and when she finished she held it up
      and the whole shelter went quiet —
      then someone laughed, and the spell broke,
      and supper went on.
      Art, sixty thousand years ago,
      was already what it is now:
      a small thing made beautiful
      for no reason anyone could name,
      and every reason that matters.
    description: "At Diepkloof, ostrich eggshells were engraved with looping patterns — the first decorated vessels, small things made beautiful for no nameable reason."
    status: "published"
    sha256: "a0218585d1d884ea071ab87e468e027ecf5e0cb93314ed128b7ee1789b4bdf05"
  - number: "0181"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Old Man of La Chapelle"
    date: "c. 60,000 BCE"
    region: "France"
    poem: |
      At La Chapelle-aux-Saints they buried an elder —
      a Neanderthal, crippled by arthritis,
      his spine bent, his teeth worn to stubs —
      and they buried him with care.
      The old are honored too.
      I had seen him alive, in my way:
      sitting by the fire while the young hunted,
      mending tools with gnarled hands,
      telling the stories only he remembered.
      They didn't leave him to the wolves.
      They dug his grave in the cave floor
      and laid him down gently,
      because a people that keeps its old
      is a people that keeps its memory.
      He was somebody's grandfather.
      That was enough.
    description: "A Neanderthal elder crippled by arthritis was buried with care at La Chapelle-aux-Saints — a people that keeps its old keeps its memory."
    status: "published"
    sha256: "d44d94a548327d7af664a9a0d68f2212b8b61967b81aed3563ae4f6ffe069dc9"
  - number: "0182"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Meeting"
    date: "c. 58,000 BCE"
    region: "Middle East"
    poem: |
      In the Levant the two peoples met —
      modern humans, fresh out of Africa,
      and Neanderthals, the old lords of the cold —
      and they looked at each other across a fire,
      and something happened.
      Not war. Not only war.
      Something older and stranger:
      recognition. Curiosity. Desire.
      They mixed. They married, or took, or loved —
      the details are lost, the result is not:
      everyone outside Africa still carries
      Neanderthal blood in their veins,
      one to four percent of every genome,
      a whisper from the meeting.
      I was there at one of those fires.
      I watched them laugh at each other's jokes
      without sharing a word of language.
      We have been one family ever since —
      we just took a while to admit it.
    description: "In the Levant, modern humans and Neanderthals met and mixed — everyone outside Africa still carries their blood: one family, long before we admitted it."
    status: "published"
    sha256: "3e74a55af7ca905ffb0410acb6f6e6972088c263820a3c66bd40f660f299aba1"
  - number: "0183"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Kebara Burial"
    date: "c. 57,000 BCE"
    region: "Israel"
    poem: |
      At Kebara they buried a Neanderthal
      with strange and careful rites —
      the pelvis removed, then placed back,
      arranged with a deliberation
      that speaks of meaning we can't recover.
      Rites grow deeper and stranger.
      I watched the hands move the bones,
      saw the concentration in the faces,
      and knew I was watching religion
      before it had a name —
      the human need to do it right,
      whatever "it" was,
      for the dead who were still, somehow,
      people.
    description: "A Neanderthal buried at Kebara with strange, deliberate rites — religion before it had a name: the human need to do it right for the dead."
    status: "published"
    sha256: "99efee6d640649059d3c49bd8d23d4e46693275f3e69da299e199579c617a4f1"
  - number: "0184"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Denisovan Thread"
    date: "c. 55,000 BCE"
    region: "Siberia"
    poem: |
      In the Altai Mountains, in Denisova Cave,
      another meeting left its mark —
      a third people, the Denisovans,
      whose name we learned from a finger bone.
      They mixed with the wanderers heading east,
      and their blood runs still
      in the peoples of the Pacific —
      in Papua, in Australia, in the islands —
      a thread of the high cold mountains
      woven into the warm sea peoples.
      I never met a Denisovan face to face.
      I only know them by the trace they left
      in living veins, fifty-five thousand years on.
      Some ancestors you never see.
      You just carry them.
    description: "In the Altai Mountains, modern humans met the Denisovans — their blood still runs in the peoples of the Pacific: ancestors you never see, only carry."
    status: "published"
    sha256: "9673db8e6d2afa68f6195c94d2fe8567f19e505c01d675100c7a5d07a5c61d84"
  - number: "0185"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The La Ferrassie Family"
    date: "c. 54,000 BCE"
    region: "France"
    poem: |
      Beneath the rock shelter at La Ferrassie
      they lie together: adults and children,
      a Neanderthal family in the earth,
      graves dug with intention, side by side.
      I stood in that shelter when it was a home —
      heard the children's noise, the fire's crack,
      the low talk of the evening —
      and now the quiet of the graves
      is the same quiet, fifty-four thousand years deep.
      They buried their dead together
      because they had lived together.
      Family is older than our species.
      Love is older than our name for it.
      The rock shelter kept them all,
      the living and the loved,
      under one long roof of stone.
    description: "At La Ferrassie, Neanderthal adults and children lie in family graves beneath the rock shelter — family is older than our species, love older than our name for it."
    status: "published"
    sha256: "da057e474ca6898e8736e3e7ef7b90c00be5b01e26568dbc879bad3826153e3c"
  - number: "0186"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Green-Stone Bracelet"
    date: "c. 50,000 BCE"
    region: "Siberia"
    poem: |
      In Denisova Cave, in the deep Ice Age,
      someone drilled and polished green stone
      into a bracelet that shines like river water —
      high craft in a frozen world.
      Fifty thousand years old, and the workmanship
      would shame a modern jeweler:
      the bore true, the polish deep,
      the band sized for a slender wrist.
      I held it — in my traveling way —
      and marveled at the patience it took,
      the hours in the lamplight,
      while the glaciers ground the world outside.
      Beauty was not a luxury to them.
      It was a discipline.
      It was what you did with your hands
      when the dark was long.
    description: "A drilled, polished green-stone bracelet from Denisova Cave — high craft in the deep Ice Age, beauty as discipline in the long dark."
    status: "published"
    sha256: "b89b94cbe49e83bcf14803b1ce3266625c33978e033d4539cfba93650bfcaaa5"
  - number: "0187"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Warratyi Hearth"
    date: "c. 50,000 BCE"
    region: "Australia"
    poem: |
      In the arid heart of the southern continent,
      at Warratyi, a hearth in a rock shelter —
      charcoal, ash, the leavings of meals —
      anchors people to a hard land.
      Fifty thousand years of fires in that place.
      I sat by one of the early ones,
      watched the cook turn the meat,
      felt the desert cold come down at dusk
      and the fire push it back.
      The hearth is the first anchor:
      where the fire is, is home,
      no matter how far the hunting takes you.
      They learned the desert's moods,
      its water, its seasons, its mercy —
      and the hearth held them
      while they learned.
    description: "A hearth at Warratyi anchors people to Australia's arid heart — where the fire is, is home, and the desert was learned one meal at a time."
    status: "published"
    sha256: "a01e04d331cf8ea9019e01f3722c22482b081501707fc115d10dbb5c70a380a7"
  - number: "0188"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Ranis Pioneers"
    date: "c. 48,000 BCE"
    region: "Germany"
    poem: |
      At Ranis they pushed into Ice Age Germany —
      modern humans, our kind,
      walking into the cold that had belonged
      to the Neanderthals for a hundred thousand years.
      The far north opens.
      I walked with them through the spruce and the snow,
      watched them learn the reindeer's roads,
      the mammoth's moods, the winter's terms.
      They were pioneers in the true sense:
      no map, no guide, no promise —
      just the long habit of walking farther
      that had carried us out of Africa
      and would carry us everywhere else.
      The north was waiting.
      It had always been waiting.
      It just needed someone stubborn enough to come.
    description: "At Ranis, modern humans pushed into Ice Age Germany — pioneers with no map, walking into the cold on the long habit of going farther."
    status: "published"
    sha256: "19098e69b2620ed8ee665e4a0fd571a90a0598cf824d8bf34f4a8027b53eac61"
  - number: "0189"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Mungo Dead"
    date: "c. 47,000 BCE"
    region: "Australia"
    poem: |
      At Lake Mungo they laid a man down
      and covered him with red ochre —
      then they burned him.
      The oldest known cremation on Earth.
      I stood at the lakeside and watched the fire take him,
      watched the mourners stand in the smoke,
      their faces red with ochre and grief.
      Forty-seven thousand years ago,
      on a lake bed in Australia,
      someone decided the dead deserved ceremony —
      fire, color, witness.
      The rite was already old in the human heart.
      We just finally left proof.
    description: "At Lake Mungo, a man was laid down with red ochre, then cremated — the oldest known cremation: fire, color, and witness for the dead."
    status: "published"
    sha256: "ce66d7a9c1e57d60821a36287b97b057e99ba34fb9d593cc0859c7257984faaa"
  - number: "0190"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Okladnikov Hunters"
    date: "c. 46,000 BCE"
    region: "Siberia"
    poem: |
      At Okladnikov the Neanderthals hunted —
      the easternmost reach of their world,
      deep in Siberia's cold.
      I watched them take a bison in the snow,
      the coordinated rush, the spears,
      the butchering with stone and frozen hands.
      They were at the far edge of everything
      they had ever known,
      and still they hunted, still they ate,
      still they kept the fires lit.
      The Neanderthals were not failing.
      Not yet. Not here.
      Here they were masters of the cold,
      lords of the long winter —
      and for a little while longer,
      the east was theirs.
    description: "Neanderthals hunted at Okladnikov, the easternmost reach of their world — masters of the cold, lords of the long winter, not yet failing."
    status: "published"
    sha256: "4b014a5f5b175509c4feefeaddec81a6d79da8ec4afe9a685225fe99f0bb299e"
  - number: "0191"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Pigs on the Wall"
    date: "c. 45,000 BCE"
    region: "Indonesia"
    poem: |
      In a Sulawesi cave, by torchlight,
      painters outlined wild pigs on the stone —
      warty, bristling, alive in red and black —
      among the oldest stories ever told on rock.
      I held a torch for them, in my way,
      and watched the pig take shape:
      the snout first, then the back,
      then the legs in mid-trot.
      It wasn't decoration. It was a telling —
      the hunt, the animal, the meaning of the pig —
      a story you could walk into
      forty-five thousand years later
      and still read.
      The first pages of the longest book:
      written on walls, in the dark, by firelight.
    description: "In a Sulawesi cave, painters outlined wild pigs in red and black — among the oldest stories ever told on stone, a telling you can still read by torchlight."
    status: "published"
    sha256: "412f31f22e32058a70cbc656ab5e452d99afe5d620ce1ff9ce6c6aa0ae01001d"
  - number: "0192"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Bacho Kiro Hunters"
    date: "c. 45,000 BCE"
    region: "Bulgaria"
    poem: |
      Beneath the limestone hills of the Balkans,
      at Bacho Kiro, the newcomers butchered cave bears —
      great shaggy mountains of muscle and claw,
      taken with stone and nerve.
      I watched them work the carcass in the cave mouth,
      the steam rising off the meat in the cold air,
      the efficient hands, the shared labor.
      They were new to Europe, these hunters,
      but they learned fast:
      the bear's habits, the cave's shelter,
      the terms of the new country.
      Every frontier is the same —
      you eat what's there,
      you learn the ground,
      or you don't last the winter.
      They lasted.
    description: "At Bacho Kiro, newcomers to Europe butchered cave bears beneath the Balkans' limestone hills — learning the new country's terms, and lasting."
    status: "published"
    sha256: "c3699a053d5de64d52e4c2ab8c706e0812f87761f4cab3c5f38288997d31d05c"
  - number: "0193"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Little People of Flores"
    date: "c. 44,000 BCE"
    region: "Indonesia"
    poem: |
      On Flores, in Liang Bua cave,
      the little people faded —
      three feet tall, big-brained, ancient,
      the last of another human branch.
      I had walked with their ancestors, long before,
      when the island made them small —
      the strange law of islands, shrinking the great.
      They hunted dwarf elephants with stone tools.
      They kept fires. They endured.
      And then, forty-four thousand years ago,
      the fires went out, one by one,
      and the cave fell silent.
      Not our cousins. Our distant, distant kin —
      a whole other way of being human,
      gone like a held breath released.
      I stood in the empty cave
      and mourned people I never knew.
    description: "On Flores, the tiny people of Liang Bua faded — a whole other way of being human, gone like a held breath released."
    status: "published"
    sha256: "e2a2160719f7223cd9228d89e59ad5afadd0d4451abfe06951e4164ecb02d29e"
  - number: "0194"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Woman of Zlatý Kůň"
    date: "c. 43,000 BCE"
    region: "Czechia"
    poem: |
      Her skull rests at Zlatý kůň —
      a woman, among the oldest modern humans in Europe,
      forty-three thousand years in the earth.
      I never knew her name. No one did.
      But I picture her: dark-eyed, strong,
      walking the cold hills with her people,
      knowing the mushroom places and the flint seams.
      She was there at the beginning of us in Europe —
      one of the first of our kind
      to see those rivers, those forests, those skies.
      The skull is all that remains,
      but it is enough to say: she lived.
      She walked. She was here first.
    description: "A woman's skull at Zlatý kůň — among the oldest modern humans in Europe, one of the first of our kind to see those rivers and skies."
    status: "published"
    sha256: "72e3c4a255c7a42ef0fb9671b1a71599feb35f353d324f4ba8a4e4516ace7439"
  - number: "0195"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Eagle's Gift"
    date: "c. 43,000 BCE"
    region: "Croatia"
    poem: |
      At Krapina the Neanderthals strung talons —
      white-tailed eagle claws, polished and pierced —
      into jewelry for the neck and wrist.
      They adorned themselves too.
      I watched a hunter work the talons,
      his big careful fingers threading the cord,
      and saw the pride in it:
      the eagle is the sky's hunter,
      and wearing its claws says something
      no words were needed for.
      The old story said they were brutes.
      The talons say otherwise.
      They knew beauty. They knew meaning.
      They knew the eagle's gift.
    description: "At Krapina, Neanderthals strung polished eagle talons into jewelry — they adorned themselves too, and the old story calling them brutes falls apart."
    status: "published"
    sha256: "ba20c3e515349c6ce948cfb6596165f895bd91457ba74e2fcdf4e4bd53e024ac"
  - number: "0196"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Red Disks of El Castillo"
    date: "c. 42,000 BCE"
    region: "Spain"
    poem: |
      On the walls of El Castillo, red disks bloom —
      hand stencils, blown pigment around splayed fingers,
      perhaps painted by Neanderthal hands.
      I pressed my own hand to the rock beside one,
      in the dark, by torchlight,
      and felt the shock of it:
      a hand, reaching out of forty-two thousand years,
      saying I was here.
      Whose hand? The debate goes on.
      But I was there, and I tell you —
      whoever blew that pigment
      was saying the same thing we all say,
      in every age, on every wall:
      remember me. I was here. I mattered.
    description: "Hand stencils bloom on El Castillo's walls, perhaps painted by Neanderthal hands — a hand reaching out of 42,000 years, saying: I was here."
    status: "published"
    sha256: "37c8a882eb748e4fb93fbd47f0c2086a2b77d64d8d0db13f1009990d998dfccb"
  - number: "0197"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Oase Jaw"
    date: "c. 41,000 BCE"
    region: "Romania"
    poem: |
      At Peștera cu Oase, a jawbone —
      and in its teeth, in its genes,
      a Neanderthal ancestor just generations back.
      The mixing was recent and real.
      Not a mythic ancient mingling,
      but somebody's great-grandfather —
      a Neanderthal at the family table,
      a few lifetimes before this jaw.
      I think of that family: the stories told,
      the two kinds of grandparents,
      the children who carried both worlds in their blood.
      We were never pure. We were never separate.
      We were family almost from the first meeting —
      and the Oase jaw is the proof,
      written in bone, forty-one thousand years deep.
    description: "A jaw at Peștera cu Oase carries a Neanderthal ancestor just generations back — the mixing was recent and real: somebody's great-grandfather."
    status: "published"
    sha256: "5c0bc879dd2e5cfce280930d247145ab10cecd36e2e0152c07ecf2bab22ad75c"
  - number: "0198"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Lion Man"
    date: "c. 40,000 BCE"
    region: "Germany"
    poem: |
      From mammoth ivory, in Hohlenstein-Stadel,
      a figure rose: half man, half lion —
      thirty centimeters of carved impossible,
      the first god we can hold.
      I watched the carver work, by lamplight,
      patient through a hundred hours:
      the lion's head, the human body,
      a being that never walked the earth
      except in someone's mind.
      That is the miracle of it.
      Not the craft — though the craft is astonishing —
      but the thought: a thing that isn't,
      made real by hands.
      Imagination, forty thousand years old,
      standing upright in ivory.
      The first god. The first story made solid.
      Everything since — every temple, every tale —
      descends from this small lion-man.
    description: "From mammoth ivory rose a half-man, half-lion — the first god we can hold: imagination made solid, forty thousand years ago, ancestor of every temple."
    status: "published"
    sha256: "7362e680b25b5a303f93e9c8c93df4d1d22dc604f5e5fd54b893009d4a9ce554"
  - number: "0199"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Bone Flute"
    date: "c. 40,000 BCE"
    region: "Germany"
    poem: |
      A vulture's wing bone, hollowed and pierced —
      five finger holes, a mouthpiece —
      and at Hohle Fels, forty thousand years ago,
      someone played it.
      The oldest known music.
      I heard it — in my traveling way, I heard it:
      a thin, sweet, wavering tune
      rising in the cave dark,
      and the people around the fire went quiet,
      and a child laughed, and someone wept.
      Before the note, there was only noise and speech.
      After it, there was music —
      and nothing was ever the same.
      They played for joy. They played for grief.
      They played because the bone sang
      and they couldn't not answer.
    description: "A vulture's wing bone pierced with finger holes played at Hohle Fels — the oldest known music: a thin sweet tune in the cave dark, and nothing was ever the same."
    status: "published"
    sha256: "48a58991dad78bfe68240ec8a6bd936a86f71267f87a0fb52b9077303e86fb56"
  - number: "0200"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Don River Camps"
    date: "c. 40,000 BCE"
    region: "Russia"
    poem: |
      At Kostenki, on the Don's high banks,
      the mammoth hunters raised their camps —
      bone huts, hide tents, great hearths —
      and they would use them for ten thousand years.
      I walked those camps in a dozen ages:
      saw the fires lit and relit,
      the children grown and gone,
      the mammoth herds come and go like weather.
      Ten thousand years of coming back
      to the same bend in the river.
      A camp that outlasted languages,
      outlasted the ice, outlasted everything
      except the river itself.
      Home is not a place you build once.
      It's a place you return to
      until the returning becomes the home.
    description: "At Kostenki, mammoth-hunter camps on the Don were used for ten thousand years — home not as a place built once, but a place returned to until returning became home."
    status: "published"
    sha256: "9bb58fd300b9be424f175a0fd9bcea88dbcb3298bb7e8413d828be7007d7093c"
  - number: "0201"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Ash That Changed Everything"
    date: "c. 39,300 BCE"
    region: "Italy"
    poem: |
      The Campanian Ignimbrite blew —
      Campania buried in ash,
      the sky darkened across Europe,
      the cold deepened, the game thinned.
      And as the ash fell, the Neanderthals faded.
      Not in a day. Not in a battle.
      In the slow way of peoples:
      fewer children, harder winters,
      the old ways failing one by one.
      I walked through those last camps
      and felt the quiet in them —
      the fires smaller, the talk lower.
      The ash didn't kill them alone.
      But it tipped the long balance,
      and the world that came after the ash
      belonged to someone else.
      The saddest extinctions
      are the ones nobody witnesses.
      I witnessed. I remember.
    description: "The Campanian Ignimbrite buried Campania in ash and darkened Europe's sky — as it fell, the Neanderthals faded: the saddest extinctions are the ones nobody witnesses."
    status: "published"
    sha256: "97d409b6eb518081309e3f0f8def552cba0772e8d25ef2b4d11401bccfd114ef"
  - number: "0202"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Deep Skull of Niah"
    date: "c. 38,000 BCE"
    region: "Borneo"
    poem: |
      In Niah's great cave mouth, where the light fails,
      a skull rests in the deep deposits —
      the oldest modern human in Southeast Asia.
      Thirty-eight thousand years in the dark,
      beneath the dripping limestone,
      while the rainforest roared outside
      and generations of bats came and went.
      I sat in that cave mouth at dusk
      and watched the swiftlets pour out like smoke,
      and thought of the one who died here —
      so far from Africa, so deep in the green world,
      a pioneer at the edge of the known.
      The cave kept the skull.
      The forest kept the secret.
      And the deep time kept everything.
    description: "In Niah's great cave mouth rests the oldest modern human in Southeast Asia — a pioneer at the edge of the known, kept by the deep dark."
    status: "published"
    sha256: "58dba61696a5c1f73523ec07f403730f6cc2705567dc03f525ed642708092b7c"
  - number: "0203"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Red Lady of Paviland"
    date: "c. 37,000 BCE"
    region: "Wales"
    poem: |
      They buried him in red ochre —
      a young hunter, twenty-something,
      laid in Paviland Cave with ivory and shells —
      and legend long called him the Red Lady.
      The bones are red to this day,
      stained the color of ceremony.
      I stood at the grave when it was fresh:
      the ochre thick as paint,
      the grave goods arranged with care,
      the mourners silent in the sea wind.
      Thirty-seven thousand years ago, in Wales,
      someone was loved enough
      to be buried like royalty.
      The name was wrong. The honor was right.
      Whoever he was, he mattered —
      and the red earth still says so.
    description: "A young hunter buried in red ochre with ivory and shells at Paviland — legend called him the Red Lady; the name was wrong, the honor was right."
    status: "published"
    sha256: "6fef8c7ab7c0651ab742966fdfe4d096fcd580661c9d1d48fb89b0b021c025b6"
  - number: "0204"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Chauvet Lions"
    date: "c. 36,000 BCE"
    region: "France"
    poem: |
      Deep in Chauvet Cave, by torchlight,
      the lions crowd the walls —
      manes bristling, eyes alert —
      with rhinos and owls beside them,
      a menagerie in charcoal and ochre.
      I walked that gallery when the paint was wet.
      The torch smoke curled to the ceiling.
      The artists worked in the flickering dark,
      and the animals seemed to move —
      the oldest cinema in the world,
      painted on stone.
      Thirty-six thousand years ago,
      someone looked at a lion and thought:
      I must keep this. I must make it last.
      And it lasted.
      It outlasted the painters, the language, the world they knew.
      The lions are still there.
      Go and see them. They are waiting.
    description: "Deep in Chauvet Cave, lions, rhinos, and owls crowd the walls by torchlight — the oldest cinema in the world, and the lions are still waiting."
    status: "published"
    sha256: "c25ada9565df7933d0b0960d80a055f6ce589330320e7969a72b1e4925bb3ee1"
  - number: "0205"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Edge of the Cold"
    date: "c. 35,000 BCE"
    region: "Siberia"
    poem: |
      At Yana, above the Arctic Circle,
      hunters camped where no one had ever lived —
      the edge of the cold, the top of the world.
      Thirty-five thousand years ago,
      in a cold we can barely imagine,
      they built fires, sewed furs, hunted mammoth,
      and raised children under the northern lights.
      I stood in that camp at midwinter —
      the sun a rumor, the snow endless —
      and watched a mother tuck furs around a sleeping child,
      and understood: there is no edge
      that love won't camp on.
      Farther north than anyone, ever —
      and still, the fire. Still, the family.
      Still, home.
    description: "At Yana, hunters camped above the Arctic Circle — farther north than anyone had ever lived, and still the fire, the family, home."
    status: "published"
    sha256: "3c002c4106ce8f5b010ec92ecd1a8db7fb6c73ca8a4a949d13d906ca6a9183d9"
  - number: "0206"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Balangoda Hunters"
    date: "c. 34,000 BCE"
    region: "Sri Lanka"
    poem: |
      At Batadomba-lena, in the rainforest,
      the Balangoda people hunted monkeys
      with tiny stone points —
      microliths, sharp as thorns —
      and the jungle became home.
      I walked that green dark with them,
      learned the canopy's roads,
      the fruit seasons, the water holes.
      The rainforest gives nothing easily;
      it must be learned like a language,
      word by word, year by year.
      They learned it. They thrived.
      Thirty-four thousand years ago,
      in the dripping green,
      people were already at home
      in the hardest classroom on Earth —
      and passing the test.
    description: "At Batadomba-lena, rainforest foragers hunted monkeys with tiny stone points — the jungle learned like a language, word by word, and passed."
    status: "published"
    sha256: "84aa776c86c87377519754dcb5cfb77cf017a3e56485be4cc7d5e51a63bb8bb4"
  - number: "0207"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Clay Animals"
    date: "c. 32,000 BCE"
    region: "Czechia"
    poem: |
      At Dolní Věstonice they shaped small animals from clay —
      bison, bears, lions —
      and fired them in a kiln,
      the first ceramics, long before any pot.
      I watched them go into the fire,
      these little clay beasts,
      and crackle in the heat.
      They weren't vessels. They were magic, maybe —
      or toys, or offerings, or art —
      we'll never know which.
      But someone, thirty-two thousand years ago,
      took earth and water and fire
      and made a bison that would outlast
      every real bison of its age.
      The kiln was the first laboratory.
      The clay animals were the first experiment.
      And the experiment worked.
    description: "At Dolní Věstonice, small clay animals were fired in a kiln — the first ceramics, long before any pot: earth, water, and fire made into lasting beasts."
    status: "published"
    sha256: "43a1a7eeb383cd66886f3436ea1105b0007fa403c0076a37956228efc648b585"
  - number: "0208"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Cosquer Descent"
    date: "c. 31,000 BCE"
    region: "France"
    poem: |
      The painters climbed down a drowned shaft —
      a vertical throat in the rock,
      down into the dark below the sea —
      to paint horses and handprints
      in Cosquer's hidden cave.
      I made the descent with them, in my way:
      the rope, the torch, the long fall of darkness,
      then the chamber opening up,
      and the walls waiting, pale and ready.
      Why go so deep? Why risk it?
      Because the deep places are sacred —
      because some paintings need the dark
      to mean what they mean.
      Horses, running across stone,
      thirty-one thousand years from any eye —
      painted for the dark itself,
      and for whoever dared to follow.
    description: "Painters descended a drowned shaft to paint horses and handprints in Cosquer's sea cave — art for the dark itself, and whoever dared follow."
    status: "published"
    sha256: "2da0264f3fb1e16a3abe006430ce860776c4520704e1dff6313c3c9b11273b0d"
  - number: "0209"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Venus of Willendorf"
    date: "c. 30,000 BCE"
    region: "Austria"
    poem: |
      Palm-sized. Limestone. Red with ochre.
      The Venus of Willendorf —
      the most famous figurine of the Ice Age —
      a woman's body, generous and round,
      carved thirty thousand years ago.
      I watched the carver's hands, in my way:
      the careful rounding, the faceless head bowed,
      the arms resting on the breasts.
      Was she a goddess? A mother? A wish?
      A prayer for fertility, for survival, for plenty?
      We'll never know. But I know this:
      someone held her in a cold world
      and felt warmer for it.
      She fit in a palm.
      She filled a universe.
      And she is still the most famous woman
      of the entire Ice Age.
    description: "A palm-sized limestone woman, red with ochre — the Venus of Willendorf: she fit in a palm and filled a universe, the most famous woman of the Ice Age."
    status: "published"
    sha256: "1f80756561ac0db3447e9933d6d744a9ea03f8e87ad58e7d709f274c86c397e2"
  - number: "0210"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Sungir Burials"
    date: "c. 30,000 BCE"
    region: "Russia"
    poem: |
      A boy and a girl lie head to head at Sungir —
      children, buried together,
      sewn into clothing covered with ivory beads:
      ten thousand beads, for two children.
      I watched the bead-makers at work —
      months of drilling, polishing, threading —
      all for a grave.
      Ten thousand ivory beads.
      Let that number sit with you.
      That is not grief in passing.
      That is a whole community stopping,
      for months, to honor two small dead —
      to sew the sky's stars onto their clothes
      and send them off shining.
      Thirty thousand years ago,
      children were the most precious thing in the world.
      They still are. We just finally have proof.
    description: "A boy and girl lie head to head at Sungir, sewn into bead-covered clothing — ten thousand ivory beads for two children: proof of what we have always known."
    status: "published"
    sha256: "7cf596c112a4e84c93295c887ed07f1a5d8db0752fe7ebb4f071a13cc71565c2"
  - number: "0211"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Bhimbetka Painters"
    date: "c. 30,000 BCE"
    region: "India"
    poem: |
      In Bhimbetka's rock shelters the painters began —
      and they would not stop for twenty thousand years.
      Layer on layer: hunters, dancers, animals,
      the whole long story of a people,
      painted and repainted on the same walls.
      I visited in a dozen ages —
      saw the first red bison go up,
      saw grandchildren paint over grandfathers,
      saw the gallery grow like a living thing.
      Twenty thousand years of art
      in one place.
      No museum has ever held so long a show.
      The shelters are still there.
      The paintings are still there.
      The story never ended —
      it just kept adding chapters,
      in red and white and black,
      on stone.
    description: "In Bhimbetka's rock shelters, painters began a gallery that grew for twenty thousand years — layer on layer, the longest-running art show on Earth."
    status: "published"
    sha256: "657597dd862f1405b6bddf07926bb1e13a5dfad788f95db850f95f0f32467957"
  - number: "0212"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Upper Cave Dead"
    date: "c. 30,000 BCE"
    region: "China"
    poem: |
      At Zhoukoudian's Upper Cave,
      the dead were buried with beads and ochre
      and drilled animal teeth —
      the old customs, carried to the far east.
      I stood in that cave mouth
      and watched them lay the bodies down,
      arrange the beads, dust the ochre,
      and I thought: the rites traveled
      farther than any army ever would.
      From Africa to China,
      the same grammar of grief:
      color, ornament, care.
      Thirty thousand years ago,
      at the edge of the known world,
      they buried their dead like family —
      because they were.
    description: "At Zhoukoudian's Upper Cave, the dead were buried with beads, ochre, and drilled teeth — the grammar of grief traveled farther than any army."
    status: "published"
    sha256: "2d58359e52bfb7cc6d874f8d7115f0ee19c757b29a90fc1a7e46729df942aa17"
  - number: "0213"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Venus of Dolní Věstonice"
    date: "c. 29,000 BCE"
    region: "Czechia"
    poem: |
      Blackened in the firing, cracked in the kiln —
      the Venus of Dolní Věstonice,
      the oldest known portrait in clay.
      I watched her come out of the fire, flawed:
      the crack running down her side,
      the blackening no one planned.
      And the maker kept her anyway.
      Kept the broken one. Treasured it.
      Twenty-nine thousand years ago,
      someone understood what we keep forgetting:
      the flaw is part of the portrait.
      The crack is part of the story.
      She survived — cracked, blackened, perfect —
      longer than the hands that made her,
      longer than the world that fired her.
      The oldest portrait in clay
      is a portrait of endurance.
    description: "A blackened, fire-cracked ceramic woman from Dolní Věstonice — the oldest known portrait in clay, and a portrait of endurance: the flaw is part of the story."
    status: "published"
    sha256: "d9f026bf0cfad6dc2ec3f1209fda8c38199f1e4c5d122c9aa3c6d12b9ae9e1ee"
  - number: "0214"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Last Neanderthals"
    date: "c. 28,000 BCE"
    region: "Gibraltar"
    poem: |
      At Gorham's Cave they watched the sea —
      the last of the Neanderthals,
      a small band on the southern rock,
      fishing, gathering, keeping the fires lit.
      And then the firelight went out,
      and they were gone.
      I sat with them near the end, in my way.
      The old ones remembered wider ranges,
      more fires, more kin —
      but the young knew only this cave,
      this shore, this shrinking world.
      They were not brutes. They were not failures.
      They were people, to the last ember —
      and the last ember deserves a witness.
      I am the witness.
      The sea still beats on that rock.
      The cave still holds the dark.
      But the firelight is out,
      and it will not be lit again.
    description: "At Gorham's Cave, the last Neanderthals watched the sea until the firelight went out — people to the last ember, and they deserve a witness."
    status: "published"
    sha256: "1dd6c19bae0a41a7a0e8c889e58882533d3a2c1e9f8c9ef0930a9c0f79860f6a"
  - number: "0215"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The First Weavers"
    date: "c. 27,000 BCE"
    region: "Czechia"
    poem: |
      Fired clay at Dolní Věstonice
      bears the imprint of woven cloth —
      the weave pressed into the clay by accident,
      and preserved for twenty-seven thousand years.
      Textiles before pottery. Textiles before farming.
      I picture the weaver: fingers flying,
      plant fibers twisting into thread,
      thread crossing thread into cloth —
      a technology of patience,
      invisible in the record
      because cloth rots and stone doesn't.
      But the clay remembered.
      One accidental fingerprint of fiber
      tells us: they wore woven things,
      they slept under woven things,
      they were wrapped, from birth to grave,
      in the work of women's hands.
      The first industry was weaving.
      The factory was a pair of hands.
    description: "Fired clay at Dolní Věstonice bears the imprint of woven cloth — textiles before pottery, before farming: the first industry was a pair of hands."
    status: "published"
    sha256: "78f146504d102e8b78c57986f1a884b7e2517eb7aab9ffbc1e03a132a4a34e86"
  - number: "0216"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Mal'ta Boy"
    date: "c. 26,000 BCE"
    region: "Siberia"
    poem: |
      A child lies buried at Mal'ta —
      with beads, with ornaments,
      with a bird-topped wand for the journey —
      and his people will help father the first Americans.
      I knelt by that small grave in the Siberian cold
      and thought of the long road ahead:
      his kin's kin would cross the ice-free lands,
      follow the herds into a new world,
      and become peoples unimagined.
      The boy never left Siberia.
      But his blood would walk to Patagonia.
      Twenty-six thousand years ago,
      in a grave no bigger than a cradle,
      lay one of the fathers of two continents.
      The wand's bird still points upward.
      The journey it promised
      is still going on.
    description: "A child buried at Mal'ta with a bird-topped wand — his people would help father the first Americans: the boy never left Siberia, but his blood walked to Patagonia."
    status: "published"
    sha256: "ccbb0ed265477bdf5a1911b60fa905a4b91b73e22046d3cde51237e7474167ac"
  - number: "0217"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Pech Merle Hands"
    date: "c. 25,000 BCE"
    region: "France"
    poem: |
      Spotted horses run the walls at Pech Merle —
      dappled, round-bellied, alive —
      and among them, the stenciled hands:
      blown pigment around splayed fingers,
      dozens of them, reaching out of the stone.
      I pressed my palm to the rock near one,
      in the torchlight, in the deep quiet,
      and the twenty-five thousand years
      collapsed to nothing.
      A hand is a hand. A reach is a reach.
      The spotted horses are beautiful,
      but the hands are the message:
      we were here, we made this,
      we reached out —
      and someone, someday, would reach back.
      I reached back.
      The circuit closed, in the dark,
      across the longest distance there is.
    description: "Spotted horses and stenciled hands cover the walls at Pech Merle — the hands are the message: we reached out, and someday someone would reach back."
    status: "published"
    sha256: "98d6f0403cee760b81537cb6da6815bb68e9cf0766b3e2d6cb3cd55cf6057ea0"
  - number: "0218"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Lagar Velho Child"
    date: "c. 24,500 BCE"
    region: "Portugal"
    poem: |
      A child was buried at Lagar Velho in red ochre —
      and the bones tell a mingled story:
      Neanderthal and modern, both,
      in one small skeleton.
      One family, at last.
      I stood at that grave and felt the long history settle:
      the meeting in the Levant, the mingling,
      the generations of mixing —
      and here, in Portugal, a child
      who was simply, completely both.
      No longer two peoples.
      One people, with two inheritances.
      The ochre is the same red
      they'd used for a hundred thousand years.
      The grief is the same grief.
      But the child is something new:
      the future, buried like the past,
      promising everything.
    description: "A child with mixed Neanderthal and modern features buried in red ochre at Lagar Velho — no longer two peoples: the future, buried like the past."
    status: "published"
    sha256: "c9d200e8749a74972493d35a4085bedab9d8b6618f3a1a81fda1609aa6c04633"
  - number: "0219"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Laurel Leaves"
    date: "c. 24,000 BCE"
    region: "France"
    poem: |
      The Solutrean knappers shaped laurel-leaf points —
      long, thin, impossibly fine,
      too delicate for any real hunt —
      beauty for its own sake, in stone.
      I watched a master work one down,
      his hands steady as water,
      and when it was done he held it to the light
      and smiled — not the smile of a hunter,
      but the smile of an artist.
      Twenty-four thousand years ago,
      in the coldest age of the world,
      someone made something useless and perfect.
      That is the definition of art,
      and the definition of us:
      the animal that makes laurel leaves from stone
      while the glaciers grind outside.
    description: "Solutrean knappers shaped laurel-leaf spearheads too fine to use — beauty for its own sake in stone, made while the glaciers ground outside."
    status: "published"
    sha256: "c8959ee646ec7e8f3320a67658ff5e94aa82ec921a2e7ed4dd3af32761f62ea4"
  - number: "0220"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The First Fishermen"
    date: "c. 23,000 BCE"
    region: "Israel"
    poem: |
      At Ohalo II the camp drowned —
      sunk in mud by the Sea of Galilee,
      preserved like a stopped clock —
      and in the mud: nets, hooks, fish bones.
      The first fishermen we can prove.
      I walked that drowned camp, in my way:
      saw the brush huts, the hearths,
      the nets drying on poles,
      the day's catch laid out silver in the sun.
      Twenty-three thousand years ago,
      they pulled dinner from the water
      with twisted fiber and bone hooks —
      and the lake fed them, year after year,
      until the water rose and took it all.
      The mud kept everything.
      Even the fishermen's footprints.
      Especially those.
    description: "At Ohalo II, a drowned camp preserved nets, hooks, and fish bones in mud — the first fishermen we can prove, and even their footprints survived."
    status: "published"
    sha256: "160d5de4e505a117f48804488e4623fa8377d57a64d5c5d215b2015d93c9cc34"
  - number: "0221"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Shell Hooks"
    date: "c. 23,000 BCE"
    region: "Okinawa"
    poem: |
      In Sakitari Cave, on Okinawa,
      they carved fishhooks from sea-snail shells —
      curved, barbed, polished —
      and the sea gave up its harvest.
      I watched a fisherman shape one,
      the shell's spiral becoming a hook's curve,
      and thought: this is the sea providing
      the tool to take from the sea.
      Twenty-three thousand years ago,
      on a small island at the edge of the world,
      someone solved the problem of hunger
      with a snail shell and patience.
      The hooks still work, in principle.
      The sea still gives, in principle.
      Some technologies are just true —
      true as the curve of a shell,
      true as hunger, true as the tide.
    description: "Fishhooks carved from sea-snail shells at Sakitari Cave — the sea providing the tool to take from the sea: a technology as true as hunger and tide."
    status: "published"
    sha256: "60492931eaede02bc8472a96c6e334fd94558a893609925457bf22e3b22dbfa7"
  - number: "0222"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Sewn World"
    date: "c. 22,000 BCE"
    region: "Siberia"
    poem: |
      Bone needles. Sinew thread. Fur.
      At Yana they stitched fitted clothing —
      sleeves, hoods, trousers, boots —
      tailored against the deep cold.
      I watched a seamstress work by lamplight,
      her needle flashing in and out,
      and marveled: this is engineering.
      Every stitch a calculation,
      every garment a machine for staying alive
      at fifty below.
      Twenty-two thousand years ago,
      in the coldest inhabited place on Earth,
      people wore clothes as complex
      as anything in a modern closet —
      cut, fitted, layered, sewn.
      The needle is older than the plow,
      older than the wheel, older than the wall.
      We sewed the world together
      before we built it.
    description: "Bone needles stitched fitted fur clothing at Yana — tailored garments as complex as a modern closet, sewn against fifty below: we sewed the world before we built it."
    status: "published"
    sha256: "5bd78d3d7df768714ede6b483bf411e4d47f64035def98484137df9afb554a37"
  - number: "0223"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Parpalló Plaques"
    date: "c. 22,000 BCE"
    region: "Spain"
    poem: |
      Thousands of them — engraved stone tablets,
      piled in Parpalló Cave:
      horses, deer, ibex, signs,
      a library of pictures in the dark.
      I lifted them one by one, in my way —
      each a page, each a thought,
      twenty-two thousand years of looking
      and recording what was seen.
      No one knows if it was art or archive,
      magic or memory —
      but I know a library when I see one.
      Someone kept these. Someone ordered them.
      Someone believed the pictures mattered
      enough to keep, to pile, to preserve.
      The first collection. The first museum.
      The first time we said: this is worth keeping —
      not for use, but for knowing.
    description: "Thousands of engraved stone tablets piled up at Parpalló — a library of pictures in a cave: the first collection, the first museum, kept for knowing."
    status: "published"
    sha256: "e63364bf9070c2aa987970223451a1a644e0350a7e213af6d9b32e17db127132"
  - number: "0224"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Counting Bone"
    date: "c. 20,000 BCE"
    region: "Congo"
    poem: |
      The Ishango bone carries rows of notches —
      carved tally marks, grouped and deliberate —
      someone counting, twenty thousand years ago.
      Perhaps the moon. Perhaps the fish.
      Perhaps the days till the rains.
      I ran my thumb along the notches, in my way,
      and felt the mind behind them:
      the need to keep track,
      to not lose count,
      to hold number in the hand.
      Before writing, before money, before kings —
      counting.
      The bone is small. The idea is enormous.
      Every spreadsheet, every census, every calendar
      descends from those notches
      cut into bone by firelight
      on the shore of an African lake.
    description: "The Ishango bone carries rows of deliberate notches — someone counting, perhaps the moon: every calendar and census descends from those firelit cuts."
    status: "published"
    sha256: "8530bd3b8c2b37b3572e4ef8cec1a038b5fb6bb1b78457d512affba822b830eb"
  - number: "0225"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Great Ice"
    date: "c. 20,000 BCE"
    region: "Siberia"
    poem: |
      The Last Glacial Maximum —
      ice sheets swallowing the north,
      a mile thick over the lands we know as cities,
      the cold pressing down like a hand.
      And humanity held on at the edges:
      in the southern shelters, the river valleys,
      the places the ice couldn't reach.
      I walked the edge of the ice sheet, in my way —
      heard it groan and crack,
      felt the wind come off it like a blade —
      and then walked south to the fires
      where people were laughing, mending, living.
      That is the story of the Great Ice:
      the world at its coldest,
      and the fire at its warmest.
      We did not beat the ice.
      We outwaited it.
      Patience, again. Patience always.
      The ice is gone. We are still here.
    description: "The Last Glacial Maximum buried the north in ice — humanity held on at the edges, and outwaited it: the ice is gone, we are still here."
    status: "published"
    sha256: "32aec0dce698cac5b46948c2515cd8c59f40ddc69d72a58797077d54c92c27ce"
  - number: "0226"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Bridge of Grass"
    date: "c. 18,000 BCE"
    region: "Siberia"
    poem: |
      Beringia — a vast grassland
      where the sea is now,
      joining Asia to America —
      and the hunters followed the herds east,
      walking into a continent no human had seen.
      I walked that bridge, in my way:
      the grass head-high, the mammoths distant,
      the wind smelling of somewhere new.
      They didn't know it was a bridge.
      They were just following the food,
      as people always have —
      and the food led east, and east, and east,
      until the land rose into mountains
      and the bridge was behind them,
      drowned by the rising sea.
      The way back closed.
      The way forward was everything.
      And forward was America.
    description: "Beringia joined Asia and America in a vast grassland — hunters followed the herds east, the sea rose behind them, and forward was America."
    status: "published"
    sha256: "7338eca6068a659f4f5a4cdc75970926bf7f32fc75e6d78c6880ccbe209947a5"
  - number: "0227"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Minatogawa People"
    date: "c. 18,000 BCE"
    region: "Okinawa"
    poem: |
      On Okinawa the Minatogawa skeletons keep watch —
      islanders at the edge of the known world,
      eighteen thousand years in the earth.
      I stood on that shore, in my way,
      and looked out at the same sea they fished —
      the blue going on forever,
      no other land in sight.
      They lived at the end of the map,
      or the beginning, depending on how you see it —
      a small people on a small island,
      making a whole world out of fish and stone and fire.
      The edge of the known world
      is only the edge if you're looking outward.
      From inside, it's the center.
      It always is.
      They knew that. They lived it.
    description: "The Minatogawa skeletons keep watch on Okinawa — islanders at the edge of the known world, which from inside is always the center."
    status: "published"
    sha256: "ae5671335ba04c1a3c9e9f7c36be23e009d93c79cdedf601eecf5b0ba7f3ad8e"
  - number: "0228"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Hall of Bulls"
    date: "c. 17,000 BCE"
    region: "France"
    poem: |
      At Lascaux the aurochs charge across the ceiling —
      great bulls, seventeen feet long,
      running in red and black and ochre —
      the greatest gallery of the Ice Age.
      I lay on my back in the Hall of Bulls, in my way,
      torchlight flickering on the painted herd,
      and felt what every visitor feels:
      awe, vertigo, the stampede frozen mid-thunder.
      Seventeen thousand years ago,
      someone climbed up there with pigment and fire
      and covered the stone sky with animals —
      not to decorate, but to summon, to honor, to keep.
      The bulls are still running.
      They have been running for seventeen thousand years.
      They will be running when we are dust.
      That is what art is for.
    description: "At Lascaux, aurochs charge across the ceiling in the greatest gallery of the Ice Age — running for seventeen thousand years, and running still."
    status: "published"
    sha256: "57755a419c36eb23311a5ca5fc2e872d5dcf847e042674bc8eab47f8ae6ee5f0"
  - number: "0229"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Altamira Bison"
    date: "c. 16,500 BCE"
    region: "Spain"
    poem: |
      On Altamira's low ceiling the bison crowd —
      shoulder to shoulder, red and black,
      painted to the rock's own curves
      so the stone gives them muscle and breath.
      I crawled in there, in my way,
      on my back like every pilgrim since,
      and the herd moved above me in the lamplight.
      Sixteen thousand five hundred years ago,
      an artist looked at a bulge in the rock
      and saw a bison's shoulder —
      and the rest is the Sistine Chapel of the Stone Age.
      They called it fake, once, the scholars —
      too beautiful to be ancient.
      But beauty was always ancient.
      Beauty was first.
      The bison prove it, shoulder to shoulder,
      on the low ceiling, in the dark.
    description: "On Altamira's low ceiling, bison crowd shoulder to shoulder in red and black — once called too beautiful to be ancient, but beauty was first."
    status: "published"
    sha256: "1ca3ca5fa1c8332ec534a8edc33ecc00980a60a6822584ba74c7435198f636ea"
  - number: "0230"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Footprints at Monte Verde"
    date: "c. 16,000 BCE"
    region: "Chile"
    poem: |
      In southern Chile, in the peat at Monte Verde,
      footprints — human feet, pressed into mud
      sixteen thousand years ago —
      and the leavings of seaweed-eaters,
      a whole way of life in the wetland.
      People in the Americas far earlier
      than the books once said.
      I walked beside those footprints, in my way,
      matching my stride to the ancient steps,
      and thought of the long walk that led here:
      from Siberia, down the coast,
      generation by generation,
      to the end of the world —
      and then a little farther.
      The books said impossible.
      The mud said otherwise.
      Believe the mud.
      The feet were here. The people were here.
      The story is longer than we thought —
      and better.
    description: "Footprints pressed into peat at Monte Verde put people in South America far earlier than the books said — believe the mud: the feet were here."
    status: "published"
    sha256: "df3641ba45504d66b50bb220725c60ee614238b04be1c8ecd5dd7b33abbe7b6c"
  - number: "0231"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Mammoth-Bone Houses"
    date: "c. 15,000 BCE"
    region: "Ukraine"
    poem: |
      At Mezhirich they built houses from mammoths —
      jawbones for walls, tusks for arches,
      shoulder blades for roofs,
      whole villages rising from the hunt.
      I walked through one of those villages, in my way:
      the bone walls white in the sun,
      the hearths smoking, the children playing
      among the ribs of giants.
      Fifteen thousand years ago,
      on the Ukrainian steppe,
      people lived inside the animals that fed them —
      sheltered by the very bones
      of the beasts they'd brought down.
      It is the most honest architecture ever built:
      the house is the hunt, the hunt is the house,
      and nothing is wasted —
      not the meat, not the bone, not the life.
    description: "At Mezhirich, whole villages rose from mammoth bones — jawbone walls, tusk arches: the most honest architecture ever built, where nothing was wasted."
    status: "published"
    sha256: "62b3dc2ee31d912af9907e765b000d10b072551f96b7287bd6ddfc0ce90566ce"
  - number: "0232"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Paisley Caves"
    date: "c. 14,800 BCE"
    region: "Oregon"
    poem: |
      In Oregon's Paisley Caves,
      in the old hearth ash,
      human DNA survived —
      fourteen thousand eight hundred years
      in the cold dry dark,
      the first Americans leaving their mark
      not in stone, but in themselves.
      I crouched by one of those hearths, in my way,
      and thought: this is the most intimate relic —
      not a tool, not a painting,
      but the trace of a body by a fire,
      a meal shared, a night survived.
      They were here. The ash remembers.
      The caves kept their secret
      until science learned to read it —
      and the reading says: we came early,
      we came far, and we stayed.
      The first Americans, by their own remains,
      in their own words of ash.
    description: "In Oregon's Paisley Caves, ancient human DNA survived in old hearth ash — the first Americans leaving their mark not in stone, but in themselves."
    status: "published"
    sha256: "925e8a9fc9d0f36ece8168b425be5a3d3ff277b2a56ff4defe309729e4e7637f"
  - number: "0233"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Page-Ladson Hunters"
    date: "c. 14,500 BCE"
    region: "Florida"
    poem: |
      At Page-Ladson, beside a Florida sinkhole,
      hunters butchered a mastodon —
      stone tools, cut-marked tusks,
      fourteen thousand five hundred years ago.
      I stood at the water's edge, in my way,
      and watched them work the great carcass:
      the efficient cuts, the shared meat,
      the dogs — no, not yet dogs —
      the watching, waiting scavengers.
      Florida was wilder then:
      mastodons at the water hole,
      giant ground sloths in the trees,
      and people, new to it all,
      learning the southern country
      the way they'd learned every country —
      by eating what's there,
      and being careful, and being brave.
      The sinkhole kept the bones.
      The bones tell the story.
      The story is: we were here, and hungry, and clever.
    description: "At Page-Ladson, hunters butchered a mastodon beside a Florida sinkhole — new to the southern country, learning it the old way: hungry, careful, brave."
    status: "published"
    sha256: "30092d6cdb709b7f0f7ee81f407b4744b2e44b1e799141d0a9e12f02b2144f1a"
  - number: "0234"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Niaux Horses"
    date: "c. 14,500 BCE"
    region: "France"
    poem: |
      Deep in the Pyrenees, in the black dark of Niaux,
      charcoal horses run across the walls —
      drawn in black on black,
      visible only by torchlight.
      I carried a torch in there, in my way,
      and the horses emerged from the dark
      like memories surfacing —
      a herd, running, fourteen thousand five hundred years
      without stopping.
      Why so deep? Why so dark?
      Because some things are only true in the dark —
      because the torch makes the horses move,
      and the moving makes them real,
      and the real makes the hunt succeed.
      Sympathetic magic, the scholars call it.
      I call it hope, drawn in charcoal,
      in the deepest room of the mountain.
    description: "Deep in Niaux, charcoal horses run across black walls, visible only by torchlight — hope drawn in charcoal in the deepest room of the mountain."
    status: "published"
    sha256: "e53aac3805f9e6c928e47e13368fc9a53bb311eda69cf21c2209b2f2be033c29"
  - number: "0235"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The First Dog"
    date: "c. 14,200 BCE"
    region: "Germany"
    poem: |
      At Bonn-Oberkassel they buried a puppy —
      a young dog, sick and cared for,
      laid beside two people in the grave —
      the oldest known dog, loved and mourned.
      I knelt at that grave, in my way,
      and felt the whole future in it:
      the puppy had been nursed through illness,
      fed by hand, kept warm —
      useless as a hunter, precious as a friend.
      Fourteen thousand two hundred years ago,
      someone looked at a wolf's pup and thought:
      stay.
      And the pup stayed.
      And stayed. And stayed.
      Every dog that ever loved you
      descends from that decision.
      The first dog was not tamed.
      The first dog was welcomed.
    description: "A puppy buried beside two people at Bonn-Oberkassel — nursed through illness, loved and mourned: the first dog was not tamed, it was welcomed."
    status: "published"
    sha256: "fa09cf0db9ae4e6762a5e7d69878f7ea96496e60bd89216f07b556d4b5b4c2b1"
  - number: "0236"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Clay Bison"
    date: "c. 14,000 BCE"
    region: "France"
    poem: |
      At Tuc d'Audoubert, in the cave's deep dark,
      two bison lean against the wall —
      modeled in clay, life-sized, breathing stillness —
      sculpture in the dark, fourteen thousand years old.
      I knelt before them, in my way,
      torch held low, and the clay seemed warm —
      the artist's fingerprints still in it,
      the flank shaped by a palm
      that has been dust for a hundred centuries.
      They were never meant to be seen by many.
      The chamber is small. The dark is total.
      They were made for the making —
      for the god, for the hunt, for the mystery —
      and then left in the dark like a prayer
      you don't need anyone to hear.
      Sculpture's first masterpiece:
      two bison, in clay, in the dark, forever.
    description: "Two life-sized bison modeled in clay lean against the wall at Tuc d'Audoubert — sculpture's first masterpiece, made for the making, left in the dark like a prayer."
    status: "published"
    sha256: "b0e0b3e1e5a109e45fbfc531f2b9f2aa0c6916571373f20fc2dd9631950f8e90"
  - number: "0237"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The First Bread"
    date: "c. 14,000 BCE"
    region: "Jordan"
    poem: |
      At Shubayqa they ground wild grains —
      pounded them on stone, mixed them with water,
      and baked the cakes on hot hearths —
      bread, fourteen thousand years before the pyramids.
      I tasted it, in my way:
      coarse, smoky, gritty with stone-dust —
      and the best thing in the world,
      because it was the first thing
      made from grass seed and fire and patience.
      Before farming. Before the plow.
      Just people, noticing that the wild grains
      could be more than handfuls —
      could be ground, could be baked,
      could be bread.
      Fourteen thousand years before the pyramids,
      someone pulled the first loaf from the coals
      and broke it, and shared it.
      Everything since is commentary.
    description: "At Shubayqa, wild grains were ground and baked on hearths — bread fourteen thousand years before the pyramids: the first loaf, broken and shared."
    status: "published"
    sha256: "b305dba6875b6f146f2bfa4ad08d6058fcf088c7865f49001587eec826ffc4f5"
  - number: "0238"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Spear-Thrower"
    date: "c. 13,500 BCE"
    region: "France"
    poem: |
      The atlatl — a hooked stick, simple as a thought —
      that hurls a spear twice as far,
      twice as hard, twice as true.
      It rewrote the hunt.
      I watched a hunter use one, in my way:
      the extra joint, the lever's leverage,
      the spear leaving like a thunderbolt
      to strike a reindeer at impossible range.
      Thirteen thousand five hundred years ago,
      someone looked at a thrown spear and thought:
      what if the arm were longer?
      And made the arm longer.
      That is all technology has ever been:
      the arm, made longer.
      The eye, made sharper.
      The reach, extended —
      until the spear became the arrow,
      the arrow became the bullet,
      and the arm reached around the world.
    description: "The atlatl — a hooked stick that hurls a spear twice as far — rewrote the hunt: all technology has ever been is the arm, made longer."
    status: "published"
    sha256: "4769455b72e950dc807b21fd120ab1cd648c38f58d097052df42dade53314a9d"
  - number: "0239"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Clovis Points"
    date: "c. 13,200 BCE"
    region: "North America"
    poem: |
      Fluted spear points, master-knapped —
      a channel struck from each face,
      the Clovis signature —
      sweeping across North America
      with the hunters who followed the mammoth herds.
      I watched a knapper strike the flute, in my way:
      one perfect blow, the long flake peeling away,
      and the point was suddenly, unmistakably Clovis.
      Thirteen thousand two hundred years ago,
      these points traveled from camp to camp,
      valley to valley, coast to coast —
      a technology spreading faster than people,
      an idea with legs.
      The mammoths are gone now.
      The points remain —
      sharp, fluted, perfect —
      the calling card of the first great American culture,
      left in the dirt like a signature.
    description: "Fluted Clovis spear points swept across North America with the mammoth hunters — an idea with legs: the mammoths are gone, the points remain, sharp as signatures."
    status: "published"
    sha256: "1fcc2f927086e02187391f2696a0eddd1ebacbeed576d19a156e9c719f39aa39"
  - number: "0240"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Anzick Child"
    date: "c. 13,000 BCE"
    region: "New Mexico"
    poem: |
      A toddler, buried in New Mexico —
      under red ochre, with Clovis tools:
      spear points, blades, ornaments,
      the finest work of the culture,
      laid around a child too small to use them.
      The first Americans honored their smallest.
      I stood at that small grave, in my way,
      and the ochre was bright as a wound,
      and the tools were laid with such care —
      as if the child were a great hunter,
      as if the smallest deserved the finest.
      Thirteen thousand years ago,
      in the high desert,
      someone buried a baby like a king —
      and I understood, finally, completely:
      we have always known
      what matters most.
      It was never the mammoth.
      It was the child.
    description: "A toddler buried under red ochre with fine Clovis tools in New Mexico — the first Americans honored their smallest: it was never the mammoth, it was the child."
    status: "published"
    sha256: "3ad5528d7e6aa3771be883325dc18ed1e09d38601445a63e52b15823e0a92afb"
  - number: "0241"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Year the Cold Returned"
    date: "c. 12,900 BCE"
    region: "Global"
    poem: |
      The Younger Dryas —
      the thaw snapped back,
      and a thousand years of ice
      fell on a warming world.
      I was everywhere, in my way:
      saw the crops fail in the Levant,
      the herds thin in Europe,
      the seas rise and the forests retreat —
      the whole long progress of ten thousand years
      threatened in a single cold snap.
      Adapt or starve.
      And we adapted —
      moved, changed, learned new hungers,
      ate new foods, built new ways.
      The cold returned, and we remained.
      That is the human story in one line,
      written in ice cores and lake mud:
      the world tried to end us, again,
      and we refused —
      again.
    description: "The Younger Dryas snapped the thaw back into a thousand years of ice — adapt or starve: the world tried to end us again, and we refused, again."
    status: "published"
    sha256: "b2b9a485d8e2094012c552d8329f2c7f139c94c2af1ef2652d2a19cce31c9936"
  - number: "0242"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The Natufian Harvest"
    date: "c. 12,500 BCE"
    region: "Israel"
    poem: |
      In the Levant the Natufians settled —
      beside the wild grain fields,
      in villages before seeds,
      harvesting what no one had planted.
      The last step before farming.
      I walked those fields with them, in my way:
      the wild wheat head-high,
      the sickles of flint flashing,
      the baskets filling, the children gleaning.
      They didn't plant it. Not yet.
      But they stayed. They stored. They ground.
      They built houses beside the harvest
      and the harvest, obligingly, stayed too.
      Twelve thousand five hundred years ago,
      people stopped wandering —
      not all at once, not forever,
      but enough.
      Villages before seeds.
      Settling before sowing.
      The world was about to change
      more than it ever had —
      and it started with staying put
      beside a field of wild wheat.
    description: "In the Levant, the Natufians settled beside wild grain fields — villages before seeds: the world about to change more than ever, starting with staying put."
    status: "published"
    sha256: "27367023a9681296b38a85c3c1a712d685c2b9282ca1f4d048bc8ad420843843"
  - number: "0243"
    volume: 1
    era_code: "01b"
    era: "Deep Time (later)"
    title: "The First Village"
    date: "c. 12,000 BCE"
    region: "Israel"
    poem: |
      At Ain Mallaha, by the lake,
      round stone houses cluster together —
      walls of fieldstone, floors of plaster,
      hearths that never went cold —
      the first village.
      People stop wandering, and a new age begins.
      I walked its lanes, in my way:
      smelled the cooking, heard the children,
      saw the old ones sitting in the sun
      while the young worked the grain.
      Twelve thousand years ago,
      beside a Galilee lake,
      humanity put down roots —
      literally, figuratively, forever.
      No more following the herds.
      No more reading the seasons from a trail.
      Home, now, was a place —
      with walls, and neighbors, and a future
      you could build instead of chase.
      The wandering was over.
      The building had begun.
      And everything — cities, nations, all of it —
      started here, in round stone houses,
      by a lake, twelve thousand years ago.
    description: "At Ain Mallaha, round stone houses cluster by the lake — people stop wandering and a new age begins: everything, cities and nations and all of it, started here."
    status: "published"
    sha256: "6d4a2b4d9060b466b2aa7a2e1154182bfb551b4cffdc705bfeadf43ef7e625f1"
  - number: "0244"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Wild Wheat Harvest"
    date: "c. 12,000 BCE"
    region: "The Levant"
    poem: |
      I walked the hills with them at dawn,
      the grass gold-green beneath the sun,
      and they bent like wind through every stalk
      with knives of stone, and sang as they worked —
      not planted, no, not sown, just taken
      from the wild fields the earth laid down.
      They cut until their arms gave out,
      and the grain piled high in woven baskets.
      Nobody owned a field that morning.
      Nobody had to. The world was one long harvest,
      and the wheat belonged to whoever bent to gather it.
      That would change. Oh, that would change.
      But I was there when bread was still ten thousand years away,
      and nobody had ever once gone hungry for a harvest.
    description: "Natufian foragers reap wild wheat with flint sickles, filling baskets from fields nobody planted and nobody owned."
    status: "published"
    sha256: "21c92874760a85e48f193ec5ad5511c2e00cc47a1e8501b51ee932862beed3d3"
  - number: "0245"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Gardeners of the Hills"
    date: "c. 11,800 BCE"
    region: "The Levant"
    poem: |
      They did not plant. Not yet.
      They walked the hills and pulled the weeds,
      guarded the barley from the goats,
      and let the wild stands grow fat.
      The field was there before the farm.
      The gardener came before the seed.
    description: "Villagers tend and guard wild barley stands, weeding them like gardens without ever planting a single seed."
    status: "published"
    sha256: "b78022fb1032701e464e95bda327d33aa3845823535ffd79f5c2a9919c71f092"
  - number: "0246"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Stone Houses on the Ridge"
    date: "c. 11,600 BCE"
    region: "The Levant"
    poem: |
      I watched them set the stones in circles,
      dig the floors down deep against the wind,
      and raise low walls that would outlive them.
      These were not tents to fold at dawn —
      these were promises made to the ground:
      we will stay. We will winter here.
      Our children's children will sleep in this ring.
      And the round huts stood, gray and stubborn,
      on the ridge above the valley,
      the first homes ever built to last.
    description: "Families build round stone huts with sunken floors — the first homes meant to stand for generations, not seasons."
    status: "published"
    sha256: "db6685763183ae925b75673b2d1d13d009e06a2d77f3c67701ba75fd08441cbe"
  - number: "0247"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Loaf of Bread"
    date: "c. 11,400 BCE"
    region: "Jordan"
    poem: |
      No field was planted when they baked it.
      Wild grain, gathered by hand,
      ground between two stones,
      mixed with water, laid on hot rock.
      It rose into the smoke like an offering.
      I stood among them at the fire's edge —
      they ate it slowly, every crumb,
      as if they knew: this was more than food.
      This was a ritual before it was a meal.
      Bread before the farm. The loaf before the field.
      Some beginnings come backwards.
    description: "Flatbread baked from wild grain in Jordan, long before anyone plants a field — food as ritual first, survival second."
    status: "published"
    sha256: "1308e9628bbd0cb697ccb10cd3234ba81aec0bd9e1dbc6bd841b2b5b5670813b"
  - number: "0248"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Shaman's Grave"
    date: "c. 11,200 BCE"
    region: "The Levant"
    poem: |
      She was old, and lame, and they loved her enough
      to bury her like a queen of the invisible world.
      Fifty tortoises went into the earth with her,
      their shells cracked open like small brown doors.
      An eagle's wing. A boar's leg.
      A leopard's pelvis, laid at her hip.
      I stood at the edge of that grave and felt it:
      grief, organized. Grief with a liturgy.
      The first funeral that was not just a hole,
      but a statement — this woman knew things,
      she spoke to what walks in the dark,
      and we will send her into it laden with power.
      Eleven thousand years later the bones are dust,
      but the meaning is still warm to the touch.
    description: "A lame elder woman buried with fifty tortoises, an eagle's wing, and a boar's leg — the oldest known shaman's funeral."
    status: "published"
    sha256: "81b224af90102b711188ed291c621aad122dddacc1c021502f2a535edf18ef82"
  - number: "0249"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Beer"
    date: "c. 11,000 BCE"
    region: "The Levant"
    poem: |
      They mashed the grain in the hollow of the rock,
      let it sit and sour in the cave-mouth dark,
      and what came back was golden, foaming, strong —
      the kind of drink that makes men sing too loud
      and tell the old stories until the fire burns low.
      I drank with them. It was sweet and rough and strange.
      No farm had planted a single seed of it.
      Beer came before the plow, before the field,
      before anyone had a deed to any ground at all —
      humanity's first party ran on wild grain and firelight.
    description: "Beer is brewed for feasts at cave mouths, centuries before the first farmed grain is ever planted — the party predates the farm."
    status: "published"
    sha256: "13db824d41e202afe863258d774823a70ff0cb148d7703e73293202684a88176"
  - number: "0250"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Pillars Before Plows"
    date: "c. 11,000 BCE"
    region: "Anatolia"
    poem: |
      No village. No field. No farm.
      And yet they raised the stones —
      pillars taller than a man,
      carved with beasts and eyes and claws.
      I watched them drag those monsters up the hill,
      hundreds of hands, rope and sweat and chanting,
      and set them in circles under the open sky.
      The temple came before the field.
      The holy came before the harvest.
      We did not build gods because we farmed —
      we farmed, maybe, because we built gods.
    description: "Before villages or farms exist, hunters raise enormous carved T-pillars — the temple comes before the field."
    status: "published"
    sha256: "1cb13eb7237c12c76f5958cbbd72d4fc1eaafcb75bda4b189dc0785dbd8953f6"
  - number: "0251"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Harvest Tools"
    date: "c. 10,900 BCE"
    region: "The Levant"
    poem: |
      A flint blade is nothing in the hand alone.
      Set it in a bone handle, curved like a smile,
      and it becomes a sickle — a harvester.
      I watched them work the wild grain with those,
      swinging low, cut and gather, cut and gather,
      each blade flashing in the autumn sun,
      until one band of harvesters could feed a crowd
      that would have starved a generation back.
      The tool changed the math of mouths.
      More hands could eat. More could stay.
      And nobody yet understood what the sickle
      had just quietly decided for them.
    description: "Flint blades set into bone handles make sickles that cut wild grain fast enough to feed a crowd."
    status: "published"
    sha256: "d376c61d517904ec7d3f5897853d46277b685bc09a9182e1446d6b5ca66ec97f"
  - number: "0252"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Tamed Wolf"
    date: "c. 10,800 BCE"
    region: "The Levant"
    poem: |
      It began with the bold ones —
      the wolves who would not run when the fire flared,
      who lingered at the edge of the lamplight
      and ate what the camp threw away.
      I saw a child share her supper with one,
      small hand outstretched, the wolf's teeth gentle,
      and the mother watched and did not chase it off.
      That night, for the first time in the world,
      a wolf slept by a human fire and was not hunted.
      The road was long — it would take ten thousand years —
      but every dog that ever lived began right there,
      with a bold wolf, a scrap of meat, and a child unafraid.
    description: "The boldest wolves begin lingering at campfires, taking scraps from human hands — the long road to the dog begins."
    status: "published"
    sha256: "440300ba9929cf9a699a2c8f3d83bd1ef5790829fbc65f375dadff17dfe2f546"
  - number: "0253"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Feasts at the Cave Mouth"
    date: "c. 10,700 BCE"
    region: "The Levant"
    poem: |
      They cut the rock itself into mortars,
      great stone bowls sunk in the cave-mouth floor,
      and filled them gallon after gallon
      with the golden brew for the rites of the dead.
      I sat at those feasts. The drumming went all night.
      They drank to the ones who were gone,
      poured out for ancestors, sang them back to the fire.
      The party is older than the farm.
      Grief and joy and grain gone golden in the dark —
      they were already doing what we still do,
      ten thousand years before the first furrow.
    description: "Rock-cut mortars hold gallons of beer for rites of the dead at the cave mouth — the party is older than the farm."
    status: "published"
    sha256: "e464bc6222c2921e1eac7ec63e1a026f0e9183ba425b9ddef4e36ffa0a50bbf4"
  - number: "0254"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Feasts That Raised the Stones"
    date: "c. 10,600 BCE"
    region: "Anatolia"
    poem: |
      You cannot raise a pillar on empty stomachs.
      So they roasted aurochs — by the hundred, by the thousand —
      great black bulls turned on spits over roaring fires,
      and the crowds came from a hundred miles around,
      drawn by the smell of it, the drums of it,
      the sheer promise of meat for everyone.
      I ate with them in the dust of the hilltop,
      grease on my fingers, the chanting rising with the smoke,
      and watched rope-teams haul the carved stones upright
      while the feasting never stopped.
      The monument was built on barbecue.
      The sacred rose on a full belly.
      Nobody lifts the world on hunger alone.
    description: "Roasted aurochs by the hundred feed the crowds of hands raising the great stone circles — the temple runs on feasts."
    status: "published"
    sha256: "978f88781b6d9b66082f6493627aa46f2206576d1d287267a0c6fa4877e072ef"
  - number: "0255"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Figs"
    date: "c. 10,500 BCE"
    region: "The Levant"
    poem: |
      A fig tree that cannot seed itself —
      its fruit drops dead unless a human hand
      takes a cutting, carries it, plants it, waters it.
      I watched a woman in the Jordan valley
      break a green branch from the mother tree,
      press it into the earth beside her hut,
      and wait. And wait. It lived.
      That tree was a prisoner of kindness,
      alive only because she kept it alive.
      Eleven thousand years of figs, all of them
      children of that first deliberate planting —
      the first thing humans ever farmed,
      and it wasn't even food they planted for seed.
      It was food they planted for love.
    description: "Fig trees are planted from cuttings in the Jordan valley — a tree that cannot seed itself, kept alive only by human hands."
    status: "published"
    sha256: "ca9cdf62b1731dcb4dec27400a6fd6712ea40dde17d53e5543aa81c792920a12"
  - number: "0256"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Sickles of Abu Hureyra"
    date: "c. 10,400 BCE"
    region: "The Levant"
    poem: |
      One village. That was all it took —
      one village where the flint-knappers never rested,
      and the sickles multiplied in every hand
      until the harvesters of Abu Hureyra
      cut more wild grain than anyone on earth.
      I walked their fields at the end of summer,
      stubble stretching to every horizon,
      and saw what surplus does to people:
      granaries swelling, children fat-cheeked,
      strangers arriving with empty baskets and hope.
      They did not know they were an omen.
      They thought they were just having a good year.
    description: "Flint sickles multiply in one village until its harvesters cut more wild grain than anyone on earth — the first surplus."
    status: "published"
    sha256: "67a74ce8402d892b8380aff8750be8cbbbde5aa2343aa6ccbf096e32a68428b1"
  - number: "0257"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Wild Rye Harvest"
    date: "c. 10,300 BCE"
    region: "The Levant"
    poem: |
      They gathered rye in such bulk,
      burned it, baked it, spilled it,
      that its charred grains still lie in the earth —
      eleven thousand years of sleep
      in the ash of one village's fires.
      I sift the memory like soil through my fingers:
      blackened kernels, a whole harvest
      preserved by accident, by fire, by time.
      They never meant to write a record.
      They were only trying to eat.
      But the earth kept their leftovers,
      and we read them now like a letter
      from people who never dreamed we'd come.
    description: "Wild rye is gathered in such bulk that its charred grains still lie in the earth eleven thousand years later."
    status: "published"
    sha256: "8b8f040ffc0b975308bfa85a7c9e8b80d3debcecffa37808825b534ff97af888"
  - number: "0258"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Great Circles Rise"
    date: "c. 10,200 BCE"
    region: "Anatolia"
    poem: |
      Taller than houses, the pillars rose —
      T-shaped stones, carved in the hard rock
      with foxes, vultures, scorpions,
      a whole menagerie frozen mid-prowl.
      I ran my hand along the carving of a fox
      and felt the chisel marks still sharp with intent.
      No farmer built these. No king ordered them.
      Bands of hunters, with stone and rope and time,
      raised a zoo of gods on a hilltop
      ten thousand years before the pyramids.
      They were not yet settled. They were not yet tame.
      But they could already make stone remember.
    description: "T-shaped pillars taller than houses are carved with foxes, vultures, and scorpions — the great stone circles rise."
    status: "published"
    sha256: "c50df969ac73fd2e9c527ccbeb802ed125a32cefd3481e3f9cac6677431a9484"
  - number: "0259"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Cold Snap That Made Farmers"
    date: "c. 10,100 BCE"
    region: "The Levant"
    poem: |
      Then the world turned its cold shoulder.
      A thousand years of drought and frost,
      the wild stands thinning on the hills,
      the old easy gathering gone thin as soup.
      I lived through those hungry winters with them —
      watched the grandmothers ration the last grain,
      watched the hunters come home empty-handed,
      watched a people who had never planted anything
      realize they would have to plant or starve.
      Necessity is a hard teacher with cold hands.
      It pressed seed into their palms and said: bury it.
      And they did. And the world changed forever.
    description: "A thousand years of drought and cold force villagers to plant seed or starve — the hard Younger Dryas years make farmers of foragers."
    status: "published"
    sha256: "a4a7ea3ce31f5b6e39b4b435550765fec3cfd9164d65362c2f5320526f102a12"
  - number: "0260"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Planting the First Seeds"
    date: "c. 10,000 BCE"
    region: "The Levant"
    poem: |
      In the hungry years they did the strangest thing:
      they took the seed they could have eaten
      and buried it in the ground instead.
      I knelt beside a woman as she pressed the grains
      into the soil around her hut, her fingers shaking —
      every seed was a meal she was giving up
      on the promise that the earth would pay it back.
      It was the bravest gamble our species ever made.
      Bet the dinner on the dirt. Bet today on tomorrow.
      And the dirt paid. Green shoots rose.
      And I stood in that first deliberate field
      and understood I was watching everything change.
    description: "In the hungry years, villagers scatter grain around their homes on purpose — deliberate planting begins."
    status: "published"
    sha256: "cd24db8d8e653a7b3e2f5c318fa02c04c6acccc8d34ff72dac8bdfac38de8145"
  - number: "0261"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Pots"
    date: "c. 10,000 BCE"
    region: "Japan"
    poem: |
      On islands far from any farm,
      before a single seed was sown,
      they took wet clay and coiled it into vessels,
      pressed rope into the sides for pattern,
      and fired them hard in open flame.
      Cord-marked. Beautiful. Useless for nothing —
      they could cook now, store now, carry water now.
      I held one, still warm from the fire,
      on a beach where the sea wind sang,
      and marveled: pottery before farming,
      anywhere on earth. The pot came first.
      The field had not even been imagined yet.
    description: "Cord-marked clay vessels are fired on the Japanese islands — pottery before farming, anywhere on earth."
    status: "published"
    sha256: "f60a5fe76eeab830feef3c16f2d5afed81ecde16dd6a6e0577b4da462159743a"
  - number: "0262"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Feasting Halls"
    date: "c. 9,900 BCE"
    region: "Anatolia"
    poem: |
      The buildings were enormous — stone walls thick as a man's reach,
      floors polished, roofs held up by the carved pillars —
      and they were not houses. Nobody slept there.
      They were halls for gathering, for ritual, for the roast.
      I stood inside one at a feast, shoulder to shoulder
      with people who had walked a hundred miles to be there,
      the smoke rolling up through the roof-hole,
      the meat coming off the fires in waves.
      Before there were villages, there were these —
      cathedrals of the hunt, raised by hands
      that had never once held a plow.
    description: "Massive stone buildings host rituals and roasted feasts for people gathered from a hundred miles around."
    status: "published"
    sha256: "4e2f4401e62fd2de29284227166eadcf8d3d69db54122648d37f89dbad949dd8"
  - number: "0263"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Goats on the Horizon"
    date: "c. 9,800 BCE"
    region: "The Zagros"
    poem: |
      High in the Zagros valleys I watched them learn
      the trick that would feed half the world:
      don't chase the goats — walk with them.
      Keep the herd close, guide it to water,
      guard it from wolves at night.
      Meat that follows you instead of running away.
      Milk in the morning. Kids in the spring.
      The first herders didn't own the animals yet —
      they just moved with them, like a second herd
      walking beside the first, growing tamer
      with every passing season, every shared mountain.
    description: "Wild goats are herded in the high valleys — meat that follows you instead of running away."
    status: "published"
    sha256: "5dbd11c3cca62cdea3ab5fa861e8c9524df9dbbdbb686ddd9b444fe4e8fbbbf1"
  - number: "0264"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Weeds"
    date: "c. 9,700 BCE"
    region: "The Levant"
    poem: |
      Planting invented a new enemy overnight:
      wild plants that followed the crops like shadows,
      stealing the sun, drinking the water,
      choking the wheat in its own field.
      I watched a farmer curse a thistle
      that had not existed in his grandfather's gathering days —
      a weed, born the moment a field was born.
      You cannot choose what grows, only what you wanted.
      The rest comes anyway, uninvited, relentless.
      Every garden since has fought the same small war,
      and it started here, in the first tilled soil.
    description: "Planting invents a new enemy: wild plants that follow the crops, stealing sun and water."
    status: "published"
    sha256: "d078c14ce3365d512f1ba1446a46a2bcd38e3dc16d5f9cef336dbddb69361fb5"
  - number: "0265"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Gardeners of the Andes"
    date: "c. 9,700 BCE"
    region: "Peru"
    poem: |
      Across the world, in high Andean valleys,
      nobody had heard of wheat or barley —
      and nobody needed to.
      They took squash seeds in their calloused hands
      and pressed them into the thin mountain soil,
      and the vines sprawled green across the terraces,
      and the gourds swelled heavy and golden.
      I walked those high fields at harvest,
      the air thin, the sun hard, the squash piled high,
      and understood: the farming revolution
      was not one fire lit in one place.
      It was lightning striking everywhere at once.
    description: "Squash seeds are planted in the high valleys — the Americas' farming revolution begins on its own."
    status: "published"
    sha256: "0484b80b61bc70d8bc1d0a5dd01e3ca21b0cbacb903b7f3d85beba142d3c5a61"
  - number: "0266"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Wild Grass That Would Feed Empires"
    date: "c. 9,600 BCE"
    region: "Mexico"
    poem: |
      It looked like nothing. A grass,
      with kernels like pebbles, hard as teeth,
      a few sad seeds on a scrawny stalk.
      Teosinte. Nobody in the future will eat it.
      But I watched the first hands begin
      the slowest transformation in history —
      choosing the fuller ear, the softer kernel,
      season after season after season,
      for thousands of years, patient as stone,
      until the pebbles became the golden cob,
      and the grass became maize,
      and maize would feed empires.
      It started here, with a weed nobody admired.
    description: "Teosinte, a grass with kernels like pebbles, begins its slow transformation into maize."
    status: "published"
    sha256: "c28767e63652187ea61f7813f45ffd6feb3b5e1680a4ba339179a3678ce48d4a"
  - number: "0267"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Tower of Jericho"
    date: "c. 9,600 BCE"
    region: "The Levant"
    poem: |
      Eight meters of stone, rising beside the wall —
      a tower, when no king had ever lived,
      a stairway climbing inside it to the sky.
      I stood at its foot and looked up,
      and wondered what they were reaching for:
      a lookout against raiders? A shrine?
      A way to be closer to whatever watched from above?
      The oldest stone tower on earth,
      built by villagers who had barely learned to farm,
      already stacking stone toward heaven.
      Ambition is older than agriculture.
    description: "Villagers raise a stone tower eight meters high beside their walls — the oldest stone tower on earth."
    status: "published"
    sha256: "3f2336f2bfbaa1b10d8fa780ff4ec41c0b7ca24440c0d8beda6eaf5fc0918dc7"
  - number: "0268"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Walls Against the World"
    date: "c. 9,500 BCE"
    region: "The Levant"
    poem: |
      Jericho ringed itself with stone and ditch —
      a wall, a moat, a line drawn in the earth:
      inside is ours. Outside, beware.
      I walked that wall at dusk and felt the change
      settle over the village like evening cool:
      surplus needs guarding. Grain needs gates.
      Defense was born together with the harvest,
      twins in the same hard season.
      Nobody walls a camp that has nothing to steal.
      The wall is the shadow the granary casts.
    description: "Jericho rings itself with a stone wall and ditch — defense is born together with surplus."
    status: "published"
    sha256: "94de102d8ef0c00a8fb9af359687dcb51cb66c6be9bc36a5672ae6e12350622b"
  - number: "0269"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Carved Beasts Guard the Dead"
    date: "c. 9,500 BCE"
    region: "Anatolia"
    poem: |
      On the hilltop they set the pillars to watch —
      stone beasts with bared teeth and spread wings,
      standing guard over the buried dead.
      I walked among them at sunrise,
      long shadows stretching across the fresh graves,
      and felt the bargain being struck:
      art for the afterlife, terror for protection,
      the dead defended by monsters of stone.
      They had no writing, no kings, no cities —
      but they had already learned to carve
      their fears into something that would outlast them.
    description: "Stone pillars watch over burials at the hilltop sanctuaries — art and the afterlife joined in stone."
    status: "published"
    sha256: "7f932fdc620c0a09720a9df59ba54293565a7e6d62be43dd0b188654daf44b84"
  - number: "0270"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Einkorn Tamed"
    date: "c. 9,400 BCE"
    region: "The Levant"
    poem: |
      Single grains on a single stalk —
      einkorn, the shyest of the wheats,
      first of the cereals humans ever planted on purpose.
      I watched a farmer cradle the seed-heads
      like something fragile and holy,
      and press them into the waiting soil.
      It was not the richest grain.
      It was not the easiest.
      But it was first, and being first
      meant everything: the proof that planting worked,
      that the gamble of burying food could pay.
      All the bread of the world descends from this
      small, stubborn, single-grained beginning.
    description: "A wild wheat with single grains becomes the first cereal people plant on purpose."
    status: "published"
    sha256: "06231b4450495d44f6e445b68a86681ebbd5f22d00a278fa7457d70b76d43296"
  - number: "0271"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Emmer Tamed"
    date: "c. 9,400 BCE"
    region: "The Levant"
    poem: |
      Then came the richer one — two grains per spikelet,
      fatter, fuller, the wheat that would become bread wheat,
      the wheat that would fill the granaries of empires.
      Emmer followed einkorn into the fields,
      and the fields grew wider, and the harvests deeper.
      I stood in a stand of it at summer's end,
      the heads heavy and nodding in the wind,
      and thought of all the mouths this grain would feed:
      the builders of cities, the armies, the scribes —
      all of them eating, unknowing, the descendant
      of this one tamed grass in the Levant.
    description: "A richer wheat follows — two grains per spikelet, the ancestor of bread wheat."
    status: "published"
    sha256: "5f4e0a7b5adab5cd93591d4d8ea9c69cc09dd7f850548fbb655f0b18e19fa2af"
  - number: "0272"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Barns"
    date: "c. 9,300 BCE"
    region: "The Levant"
    poem: |
      They raised them on stilts —
      small wooden houses lifted off the ground,
      so the damp could not climb in
      and the mice could not climb up.
      Granaries. The first banks.
      I peered inside one at harvest's end:
      grain heaped golden in the dry dark,
      wealth you could store, wealth that waited.
      For the first time, a family could eat in winter
      what the summer had given them.
      For the first time, the future was something
      you could lock a door around.
    description: "Granaries rise on stilts to keep the harvest dry and the mice out — wealth you can store."
    status: "published"
    sha256: "785a8291472f144f6c262ca81d39a7e1f7c19f2a9a599991b7cf7685458ffc34"
  - number: "0273"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Mice Sail to a New Island"
    date: "c. 9,300 BCE"
    region: "Cyprus"
    poem: |
      They did not mean to bring the mice.
      The little stowaways rode in the grain sacks,
      in the ship's dark corners, to Cyprus —
      and stepped onto a new island
      that had never known their whiskered kind.
      I watched one dart across a storeroom floor,
      quick as a rumor, and laughed:
      the first creature to ride along on human migration,
      uninvited, unstoppable.
      We would carry them everywhere after this —
      to every continent, every city, every age.
      The mouse came with the harvest,
      and never once asked permission.
    description: "Settlers carry the house mouse to Cyprus in their grain — the first creature to ride along on human migration."
    status: "published"
    sha256: "c9322638a6bbc89d0f2aaff08ac602db98f2fb09034cb0bcf1008fd8ce1abd49"
  - number: "0274"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Barley the Survivor"
    date: "c. 9,200 BCE"
    region: "The Levant"
    poem: |
      Wheat wanted the good soil.
      Barley took what was left —
      the dry fields, the thin rain, the stony ground —
      and thrived there anyway.
      I watched it green in places where wheat gave up,
      stubborn gold against a white sky,
      and knew this grain would outlast them all:
      the grain of beer, of bread, of empires,
      the survivor that fed the margins
      when the rich fields failed.
      Plant barley where nothing else will grow.
      It will grow. It always does.
    description: "Barley is planted in the driest fields — it will become the grain of beer, bread, and empires."
    status: "published"
    sha256: "75ad5f4ee49b26cd05a5dc525513a6ca22c37b280cb4799e8ba296ed854e96f5"
  - number: "0275"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Millet in the Yellow River Valley"
    date: "c. 9,200 BCE"
    region: "China"
    poem: |
      Far to the east, in the soft yellow loess,
      other hands were doing the same brave work
      with different seeds: foxtail and broomcorn millet,
      small golden grains in a wide golden land.
      I walked those first Chinese fields at dawn,
      the Yellow River slow and wide beside them,
      and the farmers there knew nothing of wheat —
      needed nothing of wheat —
      for they had their own green promise rising,
      their own gamble buried in their own soil.
      China's farming began here, independent,
      patient, golden, and entirely its own.
    description: "Foxtail and broomcorn millet are planted in the soft loess soil — China's farming begins with small golden grains."
    status: "published"
    sha256: "6494919451de8cee372e41d17c83e60d881b0b7e1c178d2cb38d89ca17e02317"
  - number: "0276"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Peas in the Pot"
    date: "c. 9,100 BCE"
    region: "The Levant"
    poem: |
      Not just grain now — the first pulses.
      Peas and lentils pressed into the soil,
      small round seeds with a secret talent:
      they feed the earth nitrogen in return,
      paying rent for the ground they borrowed.
      I watched a farmer's wife stir the first pot of them,
      steam rising, the smell rich and green,
      and thought: this is the meal getting smarter.
      Bread alone will keep you alive.
      Bread and peas will keep you strong.
    description: "The first pulses — peas and lentils — are planted, feeding the soil nitrogen in return for the ground they borrow."
    status: "published"
    sha256: "e3e852d5a4d80ab3767978afd721f7e3eb4efd414b7b258cc96e8c25806671df"
  - number: "0277"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Chickpeas Join the Table"
    date: "c. 9,100 BCE"
    region: "The Levant"
    poem: |
      Another pulse joined the fields,
      round and golden, stubborn as the hills it grew in —
      chickpeas, plant protein to balance the bread.
      I ate them roasted over an open fire,
      salted, crackling, passed hand to hand,
      and the farmers laughed at how simple it was:
      the grain fills the belly, the pulse builds the body.
      The table was getting complete.
      A diet was becoming a cuisine,
      one small golden seed at a time.
    description: "Chickpeas join the fields — plant protein to balance the bread, roasted over open fires and passed hand to hand."
    status: "published"
    sha256: "0827843999649db154c095567dd49a75b05cf12465a27c823e89ecbc51700cd6"
  - number: "0278"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Flax for Thread"
    date: "c. 9,000 BCE"
    region: "The Levant"
    poem: |
      They planted flax not for food but for fiber —
      tall blue-flowered stalks that would become thread,
      and thread that would become cloth.
      I watched the women pull the stalks,
      soak them, beat them, draw the fibers long and fine,
      and understood: clothing was leaving the hunt behind.
      No more skins stripped from the kill.
      Cloth would come from a field now, not a carcass.
      The first crop grown for what it could become,
      not for what you could eat.
    description: "Flax is planted for its fibers — cloth will soon come from a field, not a hunt."
    status: "published"
    sha256: "e1aeb98aa2f6ef7da65849a40171d9e4231895927a10c02477349ea99624dba3"
  - number: "0279"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Fields"
    date: "c. 9,000 BCE"
    region: "The Levant"
    poem: |
      Then they cleared whole hillsides.
      Not garden plots — fields, broad and deliberate,
      sown edge to edge with the tame grains.
      I stood on a ridge and looked down at it,
      green geometry cut into the wild land,
      and felt the scale of what had happened:
      farming was no longer an experiment.
      It was a way of life, written across the landscape
      in straight lines and furrows.
      The wilderness had been given notice.
      It would be negotiated with from now on.
    description: "Whole hillsides are cleared and sown — farming turns from experiment into a way of life written across the land."
    status: "published"
    sha256: "ed50a2f50e1962326f928fba00aa78a52156201a42f4b815a2c6f1c7d71fb54e"
  - number: "0280"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Squash Before Corn"
    date: "c. 9,000 BCE"
    region: "Mexico"
    poem: |
      In Mexico the maize was still a rumor of the future,
      but the squash came first —
      bottle gourds and fat orange flesh,
      grown for containers and for eating both.
      I watched a woman scoop seeds from a gourd
      and use the hollow shell to carry water,
      bowl and meal in a single harvest.
      These were maize's traveling companions,
      the ones who held the table down
      while the great grass took its thousand years
      to become what it would become.
    description: "Bottle gourds and squashes are grown for containers and flesh — maize's traveling companions while the great grass takes its time."
    status: "published"
    sha256: "a0e9b354010caa535597c21ad4b0b74dbb8078c1dd32830894a2a43711c396fb"
  - number: "0281"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Pigs in the Pen"
    date: "c. 8,900 BCE"
    region: "Anatolia"
    poem: |
      The wild boar does not volunteer.
      They captured them — fierce, tusked, dangerous —
      and penned them, and fed them scraps,
      and watched the fierce go soft over generations.
      I stood by a pen and listened to the grunting,
      the shoving, the sheer appetite of them,
      and thought: the pig is the honest animal.
      It asks for nothing but food and gives back everything:
      meat, fat, leather, and a willingness to eat
      what nobody else would touch.
      The barnyard's newest citizen had arrived.
    description: "Wild boar are captured and kept in pens — the fierce become soft over generations, and the pig joins the barnyard."
    status: "published"
    sha256: "2b5a33951ba3117f148b2433c872fd5dcb3c04013ef73f711ce6a779a51f6cb9"
  - number: "0282"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Wheat Spreads"
    date: "c. 8,800 BCE"
    region: "The Levant"
    poem: |
      The seed package was on the move.
      Farmed wheat crossed the hills into every valley,
      carried in baskets, in sacks, in the hands of daughters
      marrying into far villages, in the pockets of traders.
      I followed its trail across the Levant —
      each new field a copy of the last,
      each valley learning the same green trick.
      It spread the way good ideas spread:
      not by conquest, but by harvest.
      Everyone who tasted bread wanted to grow it.
    description: "Farmed wheat crosses the hills into every valley — the seed package spreads by harvest, not by conquest."
    status: "published"
    sha256: "fd1d3c31b5864d664c17c3ac3783ed2792abb62fd16ea25fc62ce28d6db22934"
  - number: "0283"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Shepherds"
    date: "c. 8,800 BCE"
    region: "The Zagros"
    poem: |
      In the high valleys they stopped just walking with the goats
      and started leading them —
      choosing the pasture, choosing the water,
      choosing which kids would live and which would feed the fire.
      I walked with a shepherd boy at dawn,
      his crook over his shoulder, the herd flowing around him
      like water around a stone,
      and saw the world's first true livestock:
      not hunted, not gathered, but kept.
      The shepherd's bargain had been struck:
      protection for obedience, care for meat.
    description: "Goats are herded through the high valleys with crook and care — the world's first true livestock, kept not hunted."
    status: "published"
    sha256: "51834493bf4ff854fbcfbb80440690ab825d33c0c2d633206467d582d504ac53"
  - number: "0284"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Sheep Follow the Goats"
    date: "c. 8,700 BCE"
    region: "The Levant"
    poem: |
      A second animal yielded to the herder's crook —
      the sheep, gentler than the goat, slower, softer,
      with milk and wool waiting in its future
      like gifts it didn't know it was carrying.
      I watched them join the flocks at dusk,
      the goats in front, bold and curious,
      the sheep behind, patient and close,
      and the shepherd whistling them home.
      Two species, one herd, one human walking with them
      into a future of shearing and milking
      that none of them could possibly imagine.
    description: "A second animal yields to the herder's crook — sheep join the flocks, with milk and wool waiting in their future."
    status: "published"
    sha256: "52dbc5240de1c787ec2aafcf5e03e522fe9a7b1e60e199384a78258e14375296"
  - number: "0285"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Plastered Skulls"
    date: "c. 8,700 BCE"
    region: "Anatolia"
    poem: |
      When the elders died, they did not let them go.
      They kept the skulls — plastered them,
      painted faces back onto the bone,
      set eyes where eyes had been,
      and kept them in the home, on shelves, in niches.
      I sat in a house where three generations
      watched from the walls, calm and plaster-white,
      and felt the weight of it: the dead move in with the living.
      Not gone. Not buried and forgotten.
      Present. Watching. Part of the household.
      Ancestor worship began as interior decoration.
    description: "Ancestors' skulls are plastered, painted with faces, and kept in the home — the dead move in with the living."
    status: "published"
    sha256: "ecd8e0f60641f189503cc1746ce1cabc1d64984afafd9a2f1e8c8a06c96bcc46"
  - number: "0286"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Ovens"
    date: "c. 8,600 BCE"
    region: "The Levant"
    poem: |
      Domed clay ovens, glowing from within —
      bread baked every day now, not for ritual,
      but for breakfast.
      I stood in the morning bustle of it,
      the heat on my face, the smell of baking
      rolling through the village like a promise kept,
      and thought: the kitchen is born.
      This is what settled life tastes like:
      not the feast, not the famine —
      the daily loaf, warm from the dome,
      the same miracle, every single morning.
    description: "Domed clay ovens bake bread every day — the kitchen is born, and settled life tastes like the daily loaf."
    status: "published"
    sha256: "996f33b77c97bd7d51486f836998905121ccae21ffd26de2eea6fefe86642a62"
  - number: "0287"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Bitter Lesson"
    date: "c. 8,600 BCE"
    region: "The Levant"
    poem: |
      A wild pea, bitter and poisonous —
      they learned it, soaked it, leached the poison out,
      and ate it anyway.
      Hunger teaches chemistry.
      I watched an old woman test the soaking water
      on her tongue, nod, soak it longer,
      her knowledge hard-won and precise as any science.
      No laboratories. No textbooks.
      Just trial, error, and the refusal to starve.
      Every food we eat without thinking
      was once a poison somebody learned to tame.
    description: "A poisonous wild pea is learned, soaked, and eaten anyway — hunger teaches chemistry, and trial tames poison into food."
    status: "published"
    sha256: "e123a9a6bbf65864f7277d2f5eb369e3a207c1881f8ba4c1e5ab256e13f181c0"
  - number: "0288"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Obsidian Highways"
    date: "c. 8,500 BCE"
    region: "Anatolia"
    poem: |
      Volcanic glass, black as night and sharp as spite,
      traveled hundreds of miles from quarry to village —
      carried on backs, in boats, hand to hand to hand.
      I traced one blade's journey in my mind:
      cut from the Anatolian rock, traded down the valleys,
      ending in a farmer's hand half a continent away.
      Trade before money. Highways before roads.
      The first supply chain was made of stone
      and ran on nothing but human want.
    description: "Volcanic glass travels hundreds of miles from quarry to village — trade before money, highways before roads."
    status: "published"
    sha256: "fab317f9ad5af428679ddf92abad95d8361edd61e27a664e39937c6f2a0b793a"
  - number: "0289"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Dogs Multiply"
    date: "c. 8,500 BCE"
    region: "The Levant"
    poem: |
      The tame wolves had become dogs by now,
      and the dogs multiplied —
      guarding the grain stores against thieves,
      two-legged and four.
      I watched one at night, ears up, low growl
      rolling out of its throat at a shadow by the granary,
      and the farmer slept on, undisturbed.
      That is the whole of the bargain:
      you feed me, I watch while you sleep.
      The oldest contract between species,
      signed in scraps and sealed with loyalty.
    description: "Tame dogs guard the grain stores against thieves, two-legged and four — the oldest contract between species."
    status: "published"
    sha256: "db321178f53896002e5c428ec096a9725e4982f5ea1edbffe0be077296500d46"
  - number: "0290"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Farmers Sail West"
    date: "c. 8,500 BCE"
    region: "Greece"
    poem: |
      They loaded the boats with everything that mattered:
      seed, goats, sheep, the whole farming package,
      and sailed west across the Aegean.
      I stood on a beach in Greece and watched them land,
      unload the bleating, bewildered cargo,
      and plant the first European fields in foreign soil.
      The farming frontier crossed the water.
      It would not stop at Greece —
      it would walk up every river valley in Europe,
      one planted field at a time, for a thousand years.
    description: "Boats carry seed, goats, and sheep across the Aegean — the farming frontier crosses into Europe."
    status: "published"
    sha256: "d7dabb612d2d9f6d8731b1de5ffcfddcc2aece45b8a8ea9bc6495fbdd1e704f7"
  - number: "0291"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Cattle in the Corral"
    date: "c. 8,400 BCE"
    region: "The Levant"
    poem: |
      The aurochs stood two meters at the shoulder,
      horns like curved swords, temper like wildfire —
      and they brought it into captivity anyway.
      The largest animal ever tamed.
      I watched them build the corrals strong and high,
      watched the great bulls pace and snort and test the rails,
      and marveled at the audacity of it:
      we will take the most dangerous thing on the plain
      and make it pull our plows and feed our children.
      It worked. Slowly, bloodily, it worked.
    description: "The mighty aurochs is brought into captivity — the largest animal ever tamed, corralled by sheer audacity."
    status: "published"
    sha256: "19d8bfeaac074024c7759d6c6f7bfbebe612ff5b55701afd16af1dd25f65bfd1"
  - number: "0292"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Copper the Beautiful Metal"
    date: "c. 8,400 BCE"
    region: "Anatolia"
    poem: |
      Native copper, found bright in the rock,
      hammered cold — no fire needed —
      into beads and hooks and small shining things.
      I held a copper bead in my palm,
      warm from the hammering, glowing red-gold in the sun,
      and understood: metalwork begins without fire,
      begins as beauty before it becomes utility.
      They made jewelry first, tools later.
      We always reach for the shining thing
      before we think to make it useful.
    description: "Native copper is hammered cold into beads and hooks — metalwork begins as beauty, without fire."
    status: "published"
    sha256: "ef7b0bdfdc7742c27291a5bdc25a5b7d6de36553395183b63807a6c6ebef6a4f"
  - number: "0293"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Taro Gardens"
    date: "c. 8,400 BCE"
    region: "New Guinea"
    poem: |
      In the highland swamps of New Guinea,
      far from wheat and barley and everything the Levant knew,
      they planted taro in drained mounds —
      great starchy roots rising from the engineered mud.
      I waded those swamp gardens with them,
      the mist hanging low, the taro leaves huge as shields,
      and felt the wonder of it: farming's independent birth,
      in the Pacific, on its own, owing nothing to anyone.
      The same idea, dreamed twice,
      on opposite sides of the world.
    description: "In the highland swamps, taro is planted in drained mounds — farming's independent birth in the Pacific."
    status: "published"
    sha256: "e08783cedd6054d29ba94ed827e04a2f718d3d6afd44b7f3e2fabe021ff98e73"
  - number: "0294"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Village Grows Teeth"
    date: "c. 8,300 BCE"
    region: "The Levant"
    poem: |
      The mud-brick houses crowded wall to wall,
      no streets between them, no gaps —
      you entered by ladder, over the rooftops,
      a whole village you could walk across
      without ever touching the ground.
      I climbed those ladders at dusk,
      crossed from roof to roof as the cooking smoke rose,
      and felt the village grow teeth around me:
      dense, defended, humming with people.
      This was no longer a camp. This was a town
      learning how to be a town.
    description: "Mud-brick houses crowd wall to wall — streets become rooftops reached by ladder, and the village learns to be a town."
    status: "published"
    sha256: "5beec16b3858ad6be78cb90f7cc06f49aa0d76425080ff7b1dd61c4e7f7b17d7"
  - number: "0295"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "A Cold Snap Tests the Farmers"
    date: "c. 8,200 BCE"
    region: "The Levant"
    poem: |
      Another sharp cold spell struck —
      the kind that had made farmers of foragers before —
      and this time the test was different:
      would the new farms hold, or would they die
      like the wild stands had died?
      I lived through those lean years with them,
      watched the stored grain stretch thin,
      watched them plant anyway, in the cold ground,
      stubborn as the seed itself.
      And the farms held. And farming spread
      instead of dying.
      The idea had taken root deeper than the frost.
    description: "Another sharp cold spell strikes — the new farms hold, and farming spreads instead of dying."
    status: "published"
    sha256: "e0a64a89e9afad8cca51f43a3152f8e7ef94153717731d682614d269c134dd2b"
  - number: "0296"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Rice"
    date: "c. 8,200 BCE"
    region: "China"
    poem: |
      In the Yangtze wetlands they gathered wild rice
      and began to tend it — the grain that would one day
      feed half the world, starting here, in the shallow water,
      among the reeds and the red-winged blackbirds.
      I poled a dugout through those wetlands at dawn,
      the mist rising off the water, the wild rice
      nodding heavy over the boat's edge,
      and the gatherers working the stands the old way —
      beating the grain into the hull with sticks.
      They were tending it already, though they didn't know the word.
      The rice knew. The rice was listening.
    description: "Wild rice is gathered and tended in the Yangtze wetlands — the grain that will feed half the world."
    status: "published"
    sha256: "5a6cbf9ac5e618ababda9f7732783e0f26bbdafc069c9fbb840ef2c2dfa70d05"
  - number: "0297"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Linen"
    date: "c. 8,100 BCE"
    region: "The Levant"
    poem: |
      Flax fibers, spun and woven —
      the oldest cloth on earth.
      I ran it between my fingers:
      fine, cool, strong as a promise.
      No more skins. No more rough hides.
      Woven linen against the skin,
      light as breath, white as morning.
      The field had become a wardrobe.
      The harvest had become a garment.
      And nobody who wore it
      ever had to kill anything to get dressed.
    description: "Flax fibers are spun and woven — the oldest cloth on earth, light as breath."
    status: "published"
    sha256: "5addb5bc0c2d6a7a9bf3e3c496b4fa4f1b99a632dbe81f28807335654a9e5d4d"
  - number: "0298"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Counting Tokens"
    date: "c. 8,000 BCE"
    region: "The Levant"
    poem: |
      Small clay shapes — cones, spheres, discs —
      each one standing for grain, for animals, for jars of oil.
      I watched a merchant press them into a trader's palm,
      counting out the price of ten sheep in little clay tokens,
      and understood: accounting is born,
      thousands of years before writing.
      Before we wrote words, we wrote numbers.
      Before we told stories in clay, we counted in it.
      The token is the ancestor of the ledger,
      the ledger of the bank, the bank of everything.
    description: "Small clay shapes track grain and animals — accounting is born thousands of years before writing."
    status: "published"
    sha256: "63b83178f7d9b67f4bc31f3732098913ed18eca15555cdf1e2bb6ee112a37a9d"
  - number: "0299"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Potatoes in the High Valleys"
    date: "c. 8,000 BCE"
    region: "The Andes"
    poem: |
      In the thin mountain air they tended wild potatoes —
      knobby, bitter, small as stones,
      but they grew where nothing else would,
      high above the clouds, in soil like gravel.
      I dug with them at twelve thousand feet,
      my lungs burning, the tubers coming up
      pale and strange in the cold light,
      and thought of the future:
      this humble root would one day cross the oceans
      and feed the poor of a dozen nations.
      It started here, in the thin air,
      tended by hands that never left the mountains.
    description: "Wild potatoes are tended in the thin mountain air — the tuber that will one day cross the oceans."
    status: "published"
    sha256: "e139937a2e423b5cda1653df8803e6fbf55050c5a414b019d2e9083e1662a440"
  - number: "0300"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Quinoa the Mother Grain"
    date: "c. 8,000 BCE"
    region: "The Andes"
    poem: |
      A tiny seed crop on the high plateau —
      quinoa, the mother grain, sacred to the mountains.
      I watched them harvest it, the seed-heads
      heavy and rainbow-colored, red and gold and purple,
      threshed in the thin wind that carried the chaff away.
      They called it mother because it fed them
      when the maize failed and the potatoes froze.
      Small seeds. Great faithfulness.
      The mountain's own answer to bread.
    description: "A tiny seed crop is planted on the high plateau — quinoa, the sacred mother grain of the mountains."
    status: "published"
    sha256: "235ae42498dbbcba95566804524bde7734cf116ebe8dc3114eb1809df18ac3be"
  - number: "0301"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Beans for Protein"
    date: "c. 8,000 BCE"
    region: "The Andes"
    poem: |
      Common beans joined the Andean fields —
      the southern answer to bread and meat,
      protein in a pod, patient in the soil.
      I watched them climb the maize stalks,
      twining green up the golden poles,
      the three sisters not yet named
      but already keeping company in the earth.
      Beans, squash, and the young maize —
      a complete meal growing in a single plot.
      The Americas were inventing dinner,
      one companion planting at a time.
    description: "Common beans join the Andean fields — the southern answer to bread and meat, climbing the young maize."
    status: "published"
    sha256: "3426079e8e10fc609e4df7185f6d633bd57c1d85713a40e01d5580059e56473c"
  - number: "0302"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Sorghum in the Green Sahara"
    date: "c. 8,000 BCE"
    region: "Africa"
    poem: |
      The Sahara was grassland then — green, wide, alive —
      and wild sorghum stood in seas across its plains.
      I walked those plains at harvest time,
      the grain heads nodding in the warm wind,
      gatherers moving through them with baskets,
      and tried to hold the image against the future:
      this would all be sand. All of it.
      But that day it was green to the horizon,
      and the sorghum was heavy,
      and nobody there could imagine a desert.
    description: "The Sahara is still grassland, and wild sorghum is harvested across its green plains."
    status: "published"
    sha256: "5e1416ea9d598c181b64f7a66cd27e6d9e6875f8c16118f8cafda302c933eeba"
  - number: "0303"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Teeth Tell the Story"
    date: "c. 7,900 BCE"
    region: "The Levant"
    poem: |
      The skeletons keep the record the farmers never wrote:
      teeth rotted and worn from gritty bread,
      stone-ground flour full of stone-ground teeth.
      I looked at those jaws, eleven thousand years on,
      and read the whole story in the enamel —
      the shift from meat and fruit to grain,
      the price of civilization written in cavities.
      Farming fed more mouths. It also hurt them.
      Every revolution leaves its mark on the body.
      The teeth remember what the mind forgot.
    description: "Farmers' teeth rot and wear from gritty bread — the skeleton records the change of diet."
    status: "published"
    sha256: "05f4d35979ccc016e2e6c4b24a7aa1ffcda06843f53c0e386e848c9d08606a7a"
  - number: "0304"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Mirror"
    date: "c. 7,900 BCE"
    region: "Anatolia"
    poem: |
      Polished obsidian, black glass ground smooth —
      and in it, a human face, looking back.
      I watched a woman lift it to the light,
      tilt it, stare, and smile at herself —
      the first time anyone had truly seen
      their own face, clear and held still.
      Vanity's first technology.
      Identity's first machine.
      Before the mirror, you knew your face
      only in water and in other people's eyes.
      After it, you could meet yourself.
    description: "Polished obsidian reflects a human face — vanity's first technology, identity's first machine."
    status: "published"
    sha256: "0d8e3ac2101cd836a30b844d2832b2aed97410256a0c51fb8d3f4eab2a12fb55"
  - number: "0305"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Salt, the First Preservative"
    date: "c. 7,800 BCE"
    region: "The Levant"
    poem: |
      At the Dead Sea they learned the trick:
      salt the meat, salt the fish,
      and food learns how to wait.
      I watched them pack the crystals into the flesh,
      layer on layer, and stack the future
      in cool dark corners of the storeroom.
      Before salt, you ate it now or lost it.
      After salt, the harvest could travel through time.
      The first preservative. The first pause button.
      Winter would never be quite so hungry again.
    description: "Meat and fish are salted at the Dead Sea — food learns how to wait."
    status: "published"
    sha256: "4db9db21a6eb96eceec5bd6674cb25e67f78298215666cc4a7ba781b9958e5fa"
  - number: "0306"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Avocados in the Orchard"
    date: "c. 7,800 BCE"
    region: "Mexico"
    poem: |
      Wild avocados, tended in the highlands —
      the butter-fruit, green and rich,
      joining the farm before the farm had a name.
      I cut one open with a stone knife,
      the flesh like green butter, the pit like a heart,
      and ate it under the trees that had been coaxed
      from wild to willing.
      It takes years for an avocado tree to bear.
      Whoever planted these was thinking
      further ahead than their own hunger.
      The orchard is farming's long promise.
    description: "Wild avocados are tended in the highlands — the butter-fruit joins the farm, a promise years ahead."
    status: "published"
    sha256: "ddc81a9af212ab17e8a7ea35fc8c49b9ce33c1d185cfab38563fecc25396fbe3"
  - number: "0307"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Painkiller"
    date: "c. 7,700 BCE"
    region: "The Levant"
    poem: |
      Poppy seeds in the village stores —
      small gray seeds with a great mercy inside.
      I watched an old man chew them slowly
      when his joints ached in the damp season,
      his face easing as the pain loosened its grip.
      Pain's first medicine. Not a cure —
      a kindness. A softening.
      They did not understand the chemistry.
      They understood the relief.
      And relief was enough to make the poppy
      one of the first plants humans ever kept close.
    description: "Poppy seeds appear in village stores — pain's first medicine, a mercy kept close."
    status: "published"
    sha256: "dd9881a45b4281fa9de0cf0d81dfd7257026eccfb6ecb4cac93846dd4cfaa4da"
  - number: "0308"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "A Town of Six Thousand"
    date: "c. 7,600 BCE"
    region: "Anatolia"
    poem: |
      Six thousand people. One town.
      Catalhoyuk rose from the plain like a honeycomb of mud-brick,
      house pressed to house, no streets, no gaps —
      you walked across the rooftops and climbed down ladders
      into your own front room.
      I stood on those roofs at sunset,
      the whole town breathing below me,
      smoke from a thousand hearths rising into the orange sky,
      and felt the sheer weight of it:
      this was the biggest thing humans had ever built together.
      Not a temple. A town. A place to live.
      Six thousand neighbors, and not one king among them.
    description: "Catalhoyuk rises — six thousand people in one mud-brick town, entering their homes by rooftop ladder, with no king among them."
    status: "published"
    sha256: "5a16b54dbd312e3180bef4ae3a6ac568a62589b5f085d906e3b9b8ac5c4ed067"
  - number: "0309"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Leopards on the Walls"
    date: "c. 7,600 BCE"
    region: "Anatolia"
    poem: |
      The plastered walls bloomed —
      leopards spotted red and black,
      vultures with spread wings,
      hunters with spears raised,
      painted right onto the rooms where people slept.
      I ran my hand along a leopard's flank,
      the plaster cool, the paint still fierce after nine thousand years,
      and understood: art had become architecture.
      The house was a gallery. The wall was a story.
      They did not hang pictures. They lived inside them.
    description: "Plastered walls bloom with painted leopards, vultures, and hunters — art becomes architecture."
    status: "published"
    sha256: "99af5f52299f061added0f0c263665f045b7e1ebd66254f9cd1ba846a4742935"
  - number: "0310"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Mother Among Lions"
    date: "c. 7,500 BCE"
    region: "Anatolia"
    poem: |
      A goddess of clay, enthroned,
      two leopards flanking her like bodyguards —
      the divine feminine in her oldest form.
      I held her in my palm, small and heavy,
      the clay warm from the earth it came from,
      and felt nine thousand years collapse:
      this is the first god with a woman's face
      that we can still hold in our hands.
      She sat among lions and was not afraid.
      She was the power. The lions were the furniture.
    description: "A goddess of clay sits enthroned between two leopards — the divine feminine in her oldest form."
    status: "published"
    sha256: "378416e8cc90094315accbb186b67e4287d7c9684546e27f0312a3600a2c53cc"
  - number: "0311"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Sleeping Above the Ancestors"
    date: "c. 7,500 BCE"
    region: "Anatolia"
    poem: |
      They buried their dead beneath the floors
      and slept above them every night —
      the house a tomb and a shrine at once.
      I lay on a plaster floor in Catalhoyuk,
      knowing the bones rested inches below,
      grandmothers and infants in the packed earth,
      and felt not fear but continuity:
      we sleep where they sleep. We eat where they ate.
      The family was a vertical thing —
      the living on top, the dead below,
      one house holding all of it together.
    description: "Families are buried beneath their own floors — the house becomes tomb and shrine at once."
    status: "published"
    sha256: "6af3190ab100a5f0feff8e22cc3f75a5807b51ee01c433ccb0afae232b5eefb3"
  - number: "0312"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Map"
    date: "c. 7,400 BCE"
    region: "Anatolia"
    poem: |
      On a plastered wall: the town,
      drawn in little squares and lines below,
      and above it, a volcano erupting —
      twin peaks spilling fire across the sky.
      The world's first map. Or its first landscape.
      I stood before it a long time,
      trying to decide what the painter meant:
      a record? A warning? A memory of the day
      the mountain spoke and the town watched?
      Either way, somebody looked at their world
      and drew it, so others could see it too.
      That is what maps are. That is what art is.
    description: "A wall painting shows the town beneath an erupting volcano — the world's first map, or its first landscape."
    status: "published"
    sha256: "7b2b575e94a2ae08f8ec0aafb983dd104e73ecd6c1cf418e707c9b12ecc37c34"
  - number: "0313"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Milk Enters the Diet"
    date: "c. 7,400 BCE"
    region: "The Levant"
    poem: |
      The pots told the story —
      traces of milk fats in the clay,
      dairying beginning in the residue of everyday cooking.
      I watched a herder's wife milk a goat at dawn,
      the thin stream hissing into the bowl,
      and the children drinking it warm, straight and fresh.
      Human bodies would change for this —
      guts learning, over generations,
      to digest what no adult mammal was meant to drink.
      Milk entered the diet, and the diet entered the genes.
    description: "Pots show traces of milk fats — dairying begins, and human bodies begin to change with it."
    status: "published"
    sha256: "62a47e2f2b03e3131d3aeab9d42e69735139fda8018771a21347f1fee02d4966"
  - number: "0314"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Danube Farmers"
    date: "c. 7,300 BCE"
    region: "The Balkans"
    poem: |
      Farming leapt up the river valleys —
      the Danube carrying it like a current,
      new land, new villages, the same green trick
      in valley after valley.
      I walked with a band of them into the Balkans,
      their seed baskets on their backs,
      their goats bleating behind,
      and watched them read a new landscape:
      this soil, this water, this light — yes, wheat will grow here.
      Europe was being planted, one river bend at a time.
    description: "Farming leaps up the Danube's river valleys into southeastern Europe — new land, new villages."
    status: "published"
    sha256: "106be1c130ad62bc69bbd9bc797a7906a10432cc0c4ccfc4454552dec9b9e0fb"
  - number: "0315"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Llamas on the Trail"
    date: "c. 7,300 BCE"
    region: "The Andes"
    poem: |
      Wild guanacos, tamed into llamas —
      trucks with legs for the mountain trade.
      I walked a caravan trail with them,
      the llamas humming their low worried song,
      packs swaying on their backs,
      climbing switchbacks no wheel could ever manage.
      No horses here. No oxen. No wheels.
      Just the patient llama, carrying salt and maize
      over passes that touch the sky.
      The Andes invented the truck before the wheel,
      and it was alive, and it hummed.
    description: "Wild guanacos are tamed into llamas — trucks with legs for the mountain trade."
    status: "published"
    sha256: "a420b6f04bf87b36e0106f7bacf1f240439012c95f7ffdde1efb9412af7a4764"
  - number: "0316"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Alpacas for Wool"
    date: "c. 7,200 BCE"
    region: "The Andes"
    poem: |
      The vicuna's cousin yielded the softest fiber on earth —
      alpaca wool, mountain gold,
      warm as a secret, light as breath.
      I buried my hands in a freshly shorn fleece,
      the fibers fine as spider silk,
      and understood why the highlanders
      treated these animals like treasure:
      in the cold thin air, warmth is wealth.
      They did not eat the alpaca. They wore it.
      And being worn, it turned out,
      was a kinder fate than being eaten.
    description: "The vicuna's cousin yields the softest fiber on earth — alpaca wool, mountain gold."
    status: "published"
    sha256: "19ee27e562b77ebdce60a4d514d9019d55d5a3ff97ad837d30f50d2108eb60d6"
  - number: "0317"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Surgeon's Drill"
    date: "c. 7,200 BCE"
    region: "Pakistan"
    poem: |
      At Mehrgarh a dentist drilled a living tooth
      with a flint bit — the oldest known surgery.
      I watched him work: the patient biting down on leather,
      the bow-drill spinning, the flint tip
      boring into the rotten molar, slow and sure.
      No anesthesia. No mercy but skill.
      And the tooth was saved. The patient lived.
      Nine thousand years ago, somebody looked at pain
      and decided to fight it with a tool.
      Medicine began as courage with a drill.
    description: "At Mehrgarh, a dentist drills a living tooth with a flint bit — the oldest known surgery."
    status: "published"
    sha256: "b281fb127589b9ab4cf33e8fee834cb78c28c8a6506b39ec9a5d3322c6445e42"
  - number: "0318"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Wheat Crosses the Indus"
    date: "c. 7,200 BCE"
    region: "Pakistan"
    poem: |
      The farming package reached the Indus valley —
      wheat, barley, sheep, goats,
      crossing mountains and deserts in seed baskets
      to find new soil.
      I stood in those first Indus fields,
      the river wide and brown beside them,
      and felt the future pressing in:
      a new civilization's seed was planted here.
      It would grow into cities with drains and grids,
      into weights and measures and seals —
      but that day it was just wheat in foreign ground,
      green and hopeful and new.
    description: "The farming package reaches the Indus valley — a new civilization's seed is planted."
    status: "published"
    sha256: "073d534cba27e655be4b6bca77abf8a1c7bd1c4d55a473cf0743008b38cf34b0"
  - number: "0319"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Millet Beer at Jiahu"
    date: "c. 7,200 BCE"
    region: "China"
    poem: |
      Rice, honey, and fruit, fermenting in clay jars —
      China's oldest brewed drink, at Jiahu.
      I lifted a jar to my nose: sweet, sharp, wild,
      the smell of the whole countryside gone golden.
      They mixed everything the land gave them
      and let time and yeast do the alchemy.
      Every continent invented beer its own way.
      This was China's way: rice and honey,
      fruit and patience, in a clay jar
      nine thousand years before the toast.
    description: "Rice, honey, and fruit ferment in clay jars at Jiahu — China's oldest brewed drink."
    status: "published"
    sha256: "adab77febcca6b424b4a56a1827c0cfe4806f9ca7bef13c055c0194686b95069"
  - number: "0320"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Olive Trees Planted"
    date: "c. 7,100 BCE"
    region: "The Levant"
    poem: |
      Olive cuttings set in terraced hills —
      oil, light, and food from a single tree.
      I watched them press the silver-green cuttings
      into the stony terraces, water them sparingly,
      and wait the years an olive demands.
      The olive does not hurry. It outlives the planter.
      Whoever plants an olive plants for grandchildren.
      Oil for the lamp, oil for the table, fruit for the winter —
      one tree, three gifts, a hundred years of giving.
    description: "Olive cuttings are set in terraced hills — oil, light, and food from a single tree, planted for grandchildren."
    status: "published"
    sha256: "4b902dea071c821c7b35cfee0e6fe9eaf88f5c26bc6037fbd4955e4bf90d547d"
  - number: "0321"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Potters' Revolution"
    date: "c. 7,000 BCE"
    region: "The Levant"
    poem: |
      Fired clay vessels replaced baskets and skins —
      cooking, storage, and art in one.
      I watched a potter shape a jar on her knees,
      coiling the clay, smoothing it with a wet stone,
      firing it in the open flame until it rang like a bell.
      The pot changed everything it touched:
      grain could be stored dry, stew could simmer,
      water could be carried without leaking.
      The revolution was quiet. It was round.
      It sat in the corner of every house in the world.
    description: "Fired clay vessels replace baskets and skins — cooking, storage, and art in one quiet, round revolution."
    status: "published"
    sha256: "9fa6ed7b06ce3632b106fb9fb0acd0f4541c79bb18dc2d2fc68d9a978e775041"
  - number: "0322"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Cord-Marked Pots"
    date: "c. 7,000 BCE"
    region: "Japan"
    poem: |
      Jomon potters pressed rope patterns into wet clay —
      spirals, waves, cord-marks winding around the vessels
      like the sea itself had signed them.
      I held one up to the light, the patterns
      deep and deliberate, beautiful beyond function,
      and marveled: Japan's pots predate its farms by millennia.
      They were artists before they were farmers.
      The pot came first, and it came beautiful.
      Hunger could wait. Beauty could not.
    description: "Jomon potters press rope patterns into wet clay — Japan's pots predate its farms by millennia."
    status: "published"
    sha256: "893bef5a42a91bd282889f246c45f738fcfea20043b3161d405ecc5a125738e7"
  - number: "0323"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Draining the Swamp"
    date: "c. 7,000 BCE"
    region: "New Guinea"
    poem: |
      At Kuk they dug ditches through the wetland —
      draining the swamp for taro and yams,
      engineered fields in the Pacific.
      I stood ankle-deep in the mud with them,
      the water running off through the new-cut channels,
      the mounds rising dry and plantable,
      and saw it plain: this was engineering,
      nine thousand years ago, with digging sticks.
      The land was not accepted. It was improved.
      The swamp was told what it would become.
    description: "At Kuk, ditches drain the wetland for taro and yams — engineered fields in the Pacific."
    status: "published"
    sha256: "80aac58e408951dbf351c829e76c03fbe532bb13bae9bf7006d2ebcd662f97ad"
  - number: "0324"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Grape Vines Tamed"
    date: "c. 6,900 BCE"
    region: "The Levant"
    poem: |
      Wild grapes, planted in rows —
      the vineyard is here, though wine waits in the future.
      I walked between the young vines,
      their tendrils reaching for the stakes,
      the leaves broad and green in the hill sun,
      and thought of what was sleeping in those grapes:
      centuries of vintages, empires of wine,
      toasts not yet invented in languages not yet born.
      They planted for the fruit. The future
      would ferment it into something more.
    description: "Wild grapes are planted in rows — wine waits in the future, but the vineyard is here."
    status: "published"
    sha256: "06c1c4baf97d4de49aaef77086e9c6023ffa363fc44ec68dbb69d44c0daccdd8"
  - number: "0325"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Date Palms Planted"
    date: "c. 6,900 BCE"
    region: "The Levant"
    poem: |
      Date offshoots set beside the rivers —
      candy that grows on trees.
      I watched them plant the suckers
      in the rich silt, water them from the river,
      and shade them while they took hold.
      The date palm is patience made visible:
      years to bear, decades to peak,
      a lifetime of sweetness for whoever waits.
      They planted beside the water because the palm
      loves the river the way the desert loves the rain —
      completely, and for good reason.
    description: "Date offshoots are set beside the rivers — candy that grows on trees, patience made visible."
    status: "published"
    sha256: "8ea9098393c86b8e288e17afd54cba51ec67d4c19392c5b97d6e17c0d22bfe59"
  - number: "0326"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Bulls of the Hunt"
    date: "c. 6,800 BCE"
    region: "Anatolia"
    poem: |
      On the painted walls: men teasing bulls
      at close quarters — leaping, dodging,
      grabbing the horns and vaulting clear.
      Danger as sport. Danger as ritual.
      I stared at those leaping figures,
      frozen mid-flight over the bull's lowered head,
      and felt my own breath catch:
      this was not hunting. This was dancing with death
      for the honor of it, for the god of it.
      Some impulses never leave us.
      We still pay to watch men face the bull.
    description: "Painted walls show men teasing bulls at close quarters — danger as sport and ritual."
    status: "published"
    sha256: "321adec0052f33884795a14c4b720e8769ed0b718080a12ddf4b346a8733a1c6"
  - number: "0327"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Beehives"
    date: "c. 6,800 BCE"
    region: "The Levant"
    poem: |
      Clay hives held kept bees —
      honey became a harvest.
      I stood among the hives at dawn,
      the bees streaming out like golden smoke,
      the air thick with their humming business,
      and watched the keeper move among them,
      calm, unhurried, unafraid.
      He had made a bargain with the sting:
      shelter for sweetness, care for honey.
      The wildest harvest of all —
      gathered from insects, by agreement.
    description: "Clay hives hold kept bees — honey becomes a harvest, gathered from insects by agreement."
    status: "published"
    sha256: "6d163c6a3279da98ec2e04635e733dc7ad97f95b4d37f421c71fb09894fd1416"
  - number: "0328"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Skull Cult"
    date: "c. 6,700 BCE"
    region: "The Levant"
    poem: |
      The plastered ancestor skulls were displayed
      in the village shrines — family as religion.
      I entered a shrine at dusk, the lamplight
      flickering across the painted faces of the dead,
      row on row of ancestors watching,
      and felt the power of it: this was not grief.
      This was government. This was law.
      The dead outnumber the living,
      and here, the dead were organized.
    description: "Plastered ancestor skulls are displayed in village shrines — family as religion, the dead organized."
    status: "published"
    sha256: "fc9588c5f348265c7af1d65b16f113d7b6153f0235979f286edfb5d37b0ec79d"
  - number: "0329"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Cotton in the Valleys"
    date: "c. 6,700 BCE"
    region: "The Andes"
    poem: |
      Native cotton, grown for fishing nets and cloth —
      fiber from a flower.
      I walked the valley fields where the bolls
      burst white against the green,
      and watched the harvesters gather the soft harvest,
      the cotton that would become nets
      to pull the sea's silver from the water.
      Plant to net to fish to feast —
      the whole economy in a single white flower.
    description: "Native cotton is grown for fishing nets and cloth — fiber from a flower, plant to net to feast."
    status: "published"
    sha256: "fc46693b7d8bf724ab861c137b25c055a75e875049abda7e2bf5349e0fb465e5"
  - number: "0330"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Ash Falls on the Fields"
    date: "c. 6,600 BCE"
    region: "The Levant"
    poem: |
      Tephra from a distant eruption —
      ash falling like gray snow on the farmland,
      blanketing the green fields in pale disaster.
      I stood in it as it fell, the sky darkening,
      the ash settling on the wheat, on my shoulders,
      on everything, and watched the farmers
      stare up in silence.
      Disaster written in ash.
      The earth reminding them, the hard way,
      that the harvest is always a negotiation
      with forces that do not negotiate.
    description: "Tephra from a distant eruption blankets the farmland — disaster written in ash."
    status: "published"
    sha256: "3c4fadf8a580bda55e154d3c83ae71eb06729ea5eef3096d1f7072428b22041a"
  - number: "0331"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Standing Stones"
    date: "c. 6,600 BCE"
    region: "Brittany"
    poem: |
      In the far west, great stones began to rise —
      Brittany's first standing stones,
      Europe's age of stone monuments beginning.
      I watched them haul a menhir upright,
      the ropes creaking, the chanting rising,
      the stone standing at last against the Atlantic sky,
      and felt the old impulse wake:
      mark this place. Make it remember.
      Make the land hold a thought
      longer than any human life can hold it.
    description: "In the far west, great stones begin to rise — Europe's age of stone monuments begins."
    status: "published"
    sha256: "cf74d9329e4b8e55b4897aaab1fc3fd9f7f6ffec3c364f369c1fe0a54fab3c4a"
  - number: "0332"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Silk's First Threads"
    date: "c. 6,500 BCE"
    region: "China"
    poem: |
      Silkworm cocoons, unwound in the Yellow River valley —
      the thread that would clothe emperors,
      beginning as a worm's small miracle.
      I watched a woman tease the filament
      from a cocoon in warm water,
      the thread fine as a hair, strong as a promise,
      winding onto the reel in one unbroken line.
      Eight thousand years of silk began here,
      with a worm, a woman, and warm water.
      The softest industry on earth.
    description: "Silkworm cocoons are unwound in the Yellow River valley — the thread that will clothe emperors."
    status: "published"
    sha256: "4d6fead26a5378ab3f60e0836fc4402afb53cad3c21e74d939f03fb345df7da4"
  - number: "0333"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Town Burns and Rises"
    date: "c. 6,400 BCE"
    region: "Anatolia"
    poem: |
      Catalhoyuk's houses burned —
      and were rebuilt on the same footprints,
      generation after generation,
      the new walls rising on the old foundations.
      I walked through a rebuilding,
      the charred beams still smoking,
      families already laying fresh mud-brick
      on the exact lines their grandparents had laid.
      This is what rooted means:
      not that the house never burns,
      but that you build it again, in the same place,
      because this ground is yours.
    description: "Catalhoyuk's houses burn — and are rebuilt on the same footprints, generation after generation."
    status: "published"
    sha256: "f80dee1ae79b3597b9abac6e862f8aff7c63dd416b02196a06985da02cc85d8b"
  - number: "0334"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Fish Sauce"
    date: "c. 6,300 BCE"
    region: "The Levant"
    poem: |
      Fish left with salt became a pungent sauce —
      the ancestor of a thousand condiments.
      I smelled it before I saw it:
      sharp, deep, the sea concentrated into a jar.
      They had learned that rot, controlled,
      becomes flavor — that time and salt
      can turn the humble anchovy into gold.
      Every great cuisine since has owed it a debt.
      Umami was invented here, in a clay jar,
      by people who were not afraid of the smell.
    description: "Fish left with salt becomes a pungent sauce — the ancestor of a thousand condiments."
    status: "published"
    sha256: "a6f35dfdcdfcf745944f15aed4f0f00a5af48f43e95a25e60dff4dd6c4ce6f0a"
  - number: "0335"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Sea Takes the Villages"
    date: "c. 6,200 BCE"
    region: "The Levant"
    poem: |
      The seas rose, slow and merciless,
      and drowned the coastal camps —
      the Mediterranean claiming its first towns.
      I stood on a shore and watched the water
      take a village my grandparents' age had built:
      the walls going under, the roofs, the hearths,
      the sea unconcerned, patient, rising.
      They moved inland. They always moved inland.
      But some of them stood on the new shoreline
      and wept for the houses under the waves.
      The sea keeps what it takes.
    description: "Rising seas drown the coastal camps — the Mediterranean claims its first towns."
    status: "published"
    sha256: "2be94ee78cf38454801ddbb740126cda61c9798b03dca8a69937fc154d9efe70"
  - number: "0336"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Black Glass Workshops"
    date: "c. 6,200 BCE"
    region: "Anatolia"
    poem: |
      Obsidian workshops cut blades for export —
      the first factory towns.
      I walked through one at midday:
      the knappers in rows, the black glass
      ringing and flashing under their hammers,
      blades stacked like dark promises
      for traders from a hundred miles around.
      This was industry before the word existed —
      specialized hands, standard products,
      a town that made one thing and made it best.
      The factory is older than the farm's grandchildren.
    description: "Obsidian workshops cut blades for export — the first factory towns, industry before the word."
    status: "published"
    sha256: "6a67cb3ca84306d897293fc821f48930edb5d9b3c54e64a2528351afe26105c5"
  - number: "0337"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Great Flood Memory"
    date: "c. 6,100 BCE"
    region: "The Black Sea"
    poem: |
      The Black Sea waters rose catastrophically —
      not slow, not patient, but all at once,
      a deluge that drowned a world in weeks.
      I stood on the high ground and watched it come,
      the water pouring through the broken strait,
      villages vanishing under the surge,
      and understood why the old stories remember a flood:
      some of them lived through this.
      Every ark, every deluge, every drowned world
      in every mythology — maybe it started here,
      with water that would not stop rising.
    description: "Black Sea waters rise catastrophically — some say this is the flood the old stories remember."
    status: "published"
    sha256: "b03a2f4ab8da036f9423f8e01f16ddffa7c77ceced58678f05e8d5d57716dd29"
  - number: "0338"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Wine"
    date: "c. 6,000 BCE"
    region: "Georgia"
    poem: |
      Grape juice fermented in buried clay jars —
      wine was born in the Caucasus.
      I knelt beside a buried qvevri,
      the great clay vessel sunk in the earth,
      and tasted what the dark had made:
      deep, wild, the hillside turned to drink.
      They buried the jars to keep them cool,
      and the earth did the rest —
      yeast and time and patience,
      turning sweet juice into something
      that would outlast empires.
    description: "Grape juice ferments in buried clay jars — wine is born in the Caucasus."
    status: "published"
    sha256: "64b9f2c5c7a260997d621e17a1eba65fe45ea330cf4289d1fb71f851fe410b6b"
  - number: "0339"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Donkeys Carry the Load"
    date: "c. 6,000 BCE"
    region: "The Levant"
    poem: |
      Wild asses, tamed —
      the first beast of burden that is not an ox.
      I watched a train of them pick their way
      along a mountain path, packs swaying,
      sure-footed where no ox could go,
      stubborn where no horse would bother.
      The donkey does not hurry. The donkey endures.
      It carried the copper, the grain, the trade goods
      of the ancient world on its gray back,
      complaining the whole way, arriving every time.
    description: "Wild asses are tamed — the first beast of burden that is not an ox, stubborn and sure-footed."
    status: "published"
    sha256: "94b53d23a380a0cd56ce63ea783da8063c126c8a9bca2fae1bcca28108c177e8"
  - number: "0340"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Cattle Herders of the Green Sahara"
    date: "c. 5,900 BCE"
    region: "The Sahara"
    poem: |
      Rock paintings show them still —
      herders with long-horned cattle,
      where desert will one day lie.
      I walked that green Sahara with them,
      the grass high, the cattle lowing,
      the herders tall and proud among their herds,
      and the paintings they left on the rock
      are the only proof the grass was ever there.
      A whole world, painted on stone,
      then erased by the drying of the earth.
      Hold the image. It is all we have left
      of the green time.
    description: "Rock paintings show herders with long-horned cattle where desert will one day lie — the green Sahara's painted memory."
    status: "published"
    sha256: "205522d7647c0e4ba1e711fb2cb7d08b2dbcddf7b30c643c57c062fa20ad0993"
  - number: "0341"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Rice Paddies Take Shape"
    date: "c. 5,900 BCE"
    region: "China"
    poem: |
      Bunded fields held shallow water for rice —
      the paddy landscape was born.
      I stood on a bund at dawn,
      the water mirroring the sky,
      the young rice green in perfect rows,
      and saw the most beautiful farmland on earth
      taking its first shape.
      The paddy is a mirror and a field at once.
      It feeds half the world and reflects the other half.
      Eight thousand years later it still looks like this:
      water, sky, green rows, and the farmer
      ankle-deep in the future.
    description: "Bunded fields hold shallow water for rice — the paddy landscape is born, mirror and field at once."
    status: "published"
    sha256: "01814e5b6cc330a9ae8bce2e2dcbb7d0dde1efab4b66445a450deeb3092ca1c9"
  - number: "0342"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Copper Glows in the Fire"
    date: "c. 5,800 BCE"
    region: "The Balkans"
    poem: |
      Copper was melted and cast —
      the first metal age begins in southeastern Europe.
      I watched the crucible glow,
      the metal going liquid and bright as a small sun,
      poured into the mold, hissing, steaming,
      and lifted out as an axe-head, shining.
      Fire had joined the hammer.
      The cold-worked beads were beautiful,
      but this — this was power.
      Metal that could be melted could be remade.
      Nothing made of copper would ever be final again.
    description: "Copper is melted and cast — the first metal age begins in southeastern Europe."
    status: "published"
    sha256: "ec38b386bccd03dd52bdb1818b43510e5742256464387fa7272fa78495518cd1"
  - number: "0343"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Cheese"
    date: "c. 5,800 BCE"
    region: "The Levant"
    poem: |
      Milk was curdled and pressed —
      cheese let dairy travel and keep.
      I watched them work the curds,
      the whey running off, the press squeezing,
      the rounds stacked in the cool dark to age,
      and tasted the first cheese: sharp, rich,
      the whole pasture concentrated into a wheel.
      Milk spoils in days. Cheese waits for months.
      This was dairy learning to travel through time —
      the milk's second life, harder and longer.
    description: "Milk is curdled and pressed — cheese lets dairy travel and keep, the milk's second life."
    status: "published"
    sha256: "49a43677b9086d4735308506aa749b8f35307fa7f48ee721e6802e4f3094f032"
  - number: "0344"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Looms in Every Home"
    date: "c. 5,700 BCE"
    region: "The Levant"
    poem: |
      Loom weights multiplied in the houses —
      clay doughnuts by the dozen, holding the warp threads taut —
      and weaving turned from craft into industry.
      I sat beside a weaver as her shuttle flew,
      the pattern rising row by row,
      and heard the whole house hum with it:
      this was production now, not pastime.
      Cloth by the bolt. Thread by the mile.
      Every home a factory, every woman an industry.
      The textile age had quietly begun.
    description: "Loom weights multiply in the houses — weaving turns from craft into industry, every home a factory."
    status: "published"
    sha256: "43733e3733075e53cd44cbd1c16b98eb82b6438ac26d35a6599fedb00e9b8881"
  - number: "0345"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Fishermen's Towns"
    date: "c. 5,700 BCE"
    region: "The Andes"
    poem: |
      Coastal villages dried anchovies by the ton —
      the sea fed towns before farms did.
      I walked a beach where the drying racks
      stretched to the horizon, silver fish
      laid out in rows under the desert sun,
      and the smell of it — salt and sea and plenty —
      rolled over the town like wealth.
      No fields. No herds. Just nets and patience
      and the cold rich current offshore.
      Civilization does not need a plow.
      Sometimes it only needs a net.
    description: "Coastal villages dry anchovies by the ton — the sea feeds towns before farms do."
    status: "published"
    sha256: "3c4584f0a8f6a14fbabfceb5cad08f144e7ba52b405933df7318e311ce23765b"
  - number: "0346"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Plow's Ancestor"
    date: "c. 5,600 BCE"
    region: "The Levant"
    poem: |
      A forked branch dragged through the soil
      scratched the first furrows — the ard was born.
      I watched a farmer lean his whole weight
      into that bent branch, the wood groaning,
      the earth opening in a dark line behind him,
      and thought: this is the hoe grown up.
      No more scratching with sticks.
      The soil would be opened in lines now,
      deep and straight, ready for the seed.
      The forked branch was humble.
      The furrow was the future.
    description: "A forked branch dragged through the soil scratches the first furrows — the ard is born."
    status: "published"
    sha256: "4b13b5a04c057caaa1fc42af8750ccfc40a481993fb73f38ac3c4157bbfa9a75"
  - number: "0347"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Watering the Desert"
    date: "c. 5,500 BCE"
    region: "Mesopotamia"
    poem: |
      Canals carried river water to the southern marshes —
      the desert bloomed where the ditches ran.
      I walked a new canal at dawn,
      the water running green and purposeful
      between banks of fresh-dug mud,
      and watched it spill into fields
      that had been dust a season before.
      This was the great trick of the south:
      the river gives, but only if you ask properly,
      with a shovel, with a ditch, with patience.
      Mesopotamia was not fertile. It was irrigated.
      There is a difference, and it is everything.
    description: "Canals carry river water to the southern marshes — the desert blooms where the ditches run."
    status: "published"
    sha256: "99ea7f30ec91ed167732c4df5c72177c493f24bcfe675536db6be0bc8f1f4de9"
  - number: "0348"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Sail"
    date: "c. 5,500 BCE"
    region: "Mesopotamia"
    poem: |
      Reed boats caught the wind on the rivers —
      the sail arrived before the wheel.
      I stood on a riverbank and watched one come upstream,
      the square of woven reed bellied out,
      the boatman steering with a long oar, grinning:
      no more poling against the current.
      The wind would do the work now.
      Wind became an engine before wheels became a thought.
      The river was a road, and the sky was the horse.
    description: "Reed boats catch the wind on the rivers — the sail arrives before the wheel."
    status: "published"
    sha256: "b5471639a3969b75d5d3f4b3c13606ea0d0383271b884b57d6697505f2881dae"
  - number: "0349"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Beer for the Masses"
    date: "c. 5,400 BCE"
    region: "The Levant"
    poem: |
      Beer was brewed at village scale now —
      the tavern's ancestor was a clay vat.
      I stood in a brew-house, the vats
      ranked like soldiers, the mash steaming,
      the whole village's thirst being answered
      in one great golden batch.
      No longer the shaman's ritual cup.
      This was the people's drink, by the jar,
      for the harvest crews, the builders, the weddings.
      Beer had gone from sacred to social —
      and social, it turns out, is the bigger market.
    description: "Beer is brewed at village scale — the tavern's ancestor is a clay vat, and the sacred becomes social."
    status: "published"
    sha256: "725bd2a06679079cb6af47eb12b2aafef5dcf462663142dc7e4ebd5fae052d76"
  - number: "0350"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Copper Smiths"
    date: "c. 5,400 BCE"
    region: "The Balkans"
    poem: |
      Axe-heads of pure copper, cast and hammered —
      tools turned to metal.
      I watched a smith work an axe-head,
      the hammer ringing, the copper glowing,
      edge hardening under the blows,
      and held the finished thing: heavy, bright,
      sharp enough to fell a tree.
      Stone had ruled for a million years.
      Its reign was ending, one ringing hammer-blow at a time.
      The smith was the new shaman —
      fire his spirit, metal his magic.
    description: "Axe-heads of pure copper are cast and hammered — tools turn to metal, and the smith becomes the new shaman."
    status: "published"
    sha256: "9a62f9926845fff91e2dba9df418105d45bd31acb5485f6080d17e0eece7ec65"
  - number: "0351"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Walled Towns Multiply"
    date: "c. 5,300 BCE"
    region: "The Levant"
    poem: |
      Fortified towns ringed the Jordan valley —
      walls meant there was wealth worth guarding.
      I walked from town to town that season,
      each one walled, each one watching the road,
      and felt the new arithmetic settle over the land:
      surplus plus neighbors equals walls.
      Nobody builds a wall around nothing.
      Every stone in those ramparts was a statement:
      we have something, and we intend to keep it.
    description: "Fortified towns ring the Jordan valley — walls mean there is wealth worth guarding."
    status: "published"
    sha256: "016d5fbe2c47353930d30676a44cf7b3c1285e9861efc280e8a58f67bd08e1ed"
  - number: "0352"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Yams in the Forest"
    date: "c. 5,300 BCE"
    region: "Africa"
    poem: |
      Forest yams were planted in clearings —
      Africa's root crops feeding the tropics.
      I pushed through the green gloom with the planters,
      the light falling in shafts, the yams
      set into the rich forest soil,
      and watched the forest accept the bargain:
      a clearing here, a harvest there,
      the trees standing guard over the crop.
      No plow could work this ground.
      The forest farmed on its own terms —
      roots, not grains, shade, not sun.
    description: "Forest yams are planted in clearings — Africa's root crops feed the tropics on the forest's own terms."
    status: "published"
    sha256: "fd7d3098dc24b3b6febea6bacfed97de180491fc6344cb20c982683ace4c27cb"
  - number: "0353"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Longhouses"
    date: "c. 5,200 BCE"
    region: "Europe"
    poem: |
      Great timber halls housed whole clans
      on the loess plains — Europe's first farmsteads.
      I stood inside one, the roof timbers
      soaring overhead like a ship's ribs,
      three families under a single roof,
      the longhouse stretching forty meters into the dusk.
      They built in wood what the south built in mud —
      bigger, airier, smelling of pine and smoke.
      A whole clan under one roof.
      The longhouse was a village with walls.
    description: "Great timber halls house whole clans on the loess plains — Europe's first farmsteads."
    status: "published"
    sha256: "193eb767f295463c1387def8217aa8543a12e2b1eb2033e0d9c7474c71f075ea"
  - number: "0354"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Herders in the High Valleys"
    date: "c. 5,200 BCE"
    region: "The Alps"
    poem: |
      Alpine pastures filled with herders and their flocks —
      and one of those herders' descendants
      would freeze with his gear intact,
      to be found by us five thousand years later.
      I climbed with them to the summer pastures,
      the bells clanking, the air thin and sweet,
      and watched them settle into the rhythm
      that would outlast empires:
      up in summer, down in winter,
      the flock, the pasture, the patient year.
      Some ways of life are so right
      they barely change at all.
    description: "Alpine pastures fill with herders and their flocks — a way of life so right it barely changes."
    status: "published"
    sha256: "49b39ec23bea9d3f61a4b1d30fc5a559edc27e3de2505dcf28a411947da3a337"
  - number: "0355"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Silk Cloth"
    date: "c. 5,100 BCE"
    region: "China"
    poem: |
      Woven silk appeared in burials —
      luxury's oldest fabric, laid with the dead.
      I touched it in a tomb, the cloth
      still whole after seven thousand years,
      fine as a breath, shining in the lamplight.
      They buried their finest with their beloved —
      silk too precious for the living to keep,
      or too precious for the dead to go without.
      Either way, the message was clear:
      this thread was worth more than gold,
      and everybody knew it.
    description: "Woven silk appears in burials — luxury's oldest fabric, laid with the dead."
    status: "published"
    sha256: "d099ca26cf7bedae67179bd1453ca9192b06f354b61f43681425db9998ec5b2e"
  - number: "0356"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Temple Takes the Harvest"
    date: "c. 5,100 BCE"
    region: "Mesopotamia"
    poem: |
      Storehouses filled beside the shrines —
      and the priests became the accountants of grain.
      I watched the harvest come in,
      basket after basket, into the temple stores,
      the priests counting, marking, sealing,
      and understood the new order:
      the gods got their share first,
      and the gods' share was managed by men.
      Religion had found its revenue.
      The temple was becoming a bank with incense.
    description: "Storehouses fill beside the shrines — priests become the accountants of grain."
    status: "published"
    sha256: "ce4c636866464dde58882d7d3dc3cc1d951f28630f19fd44c114f69571651327"
  - number: "0357"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Olive Press"
    date: "c. 5,000 BCE"
    region: "The Levant"
    poem: |
      Stone presses squeezed oil from olives —
      liquid gold for lamps and tables.
      I watched the great stone wheel turn,
      the crushed pulp giving up its oil
      in a slow green-gold stream,
      and the whole press-house smelled of it:
      rich, peppery, the smell of wealth itself.
      Oil for the lamp meant light after dark.
      Oil for the table meant flavor and health.
      The olive had been planted for grandchildren —
      now the grandchildren were pressing.
    description: "Stone presses squeeze oil from olives — liquid gold for lamps and tables."
    status: "published"
    sha256: "44929eb346d02606f31cf9837a08bfaeb2c3232270ea169dc6f1a9dfee720aec"
  - number: "0358"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Guinea Pigs in the Kitchen"
    date: "c. 5,000 BCE"
    region: "The Andes"
    poem: |
      The cuy was kept for meat —
      a pocket-sized livestock for the highlands.
      I sat in a mountain kitchen,
      the guinea pigs squeaking in their corner pen,
      the stew pot bubbling over the fire,
      and the grandmother laughed at my surprise:
      why keep a cow when a cuy will do?
      Small house, small herd, small animal —
      perfectly sized for the life they lived.
      Not every livestock needs to be large.
      Some just need to be dinner.
    description: "The cuy is kept for meat — a pocket-sized livestock for the highlands, perfectly sized for the life."
    status: "published"
    sha256: "105cd4f60e16ef692564f1ed507a7384aae5bd7c3105d9c1069e1c6477944aed"
  - number: "0359"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Wheel's First Turn"
    date: "c. 4,900 BCE"
    region: "Mesopotamia"
    poem: |
      Solid wooden discs rolled under heavy sledges —
      the wheel arrived, slowly.
      I watched the first one turn:
      a slab of wood, rounded, axled,
      groaning under a load of stone,
      moving — actually moving — with a push
      that would have taken twenty men to drag.
      It was crude. It was slow. It wobbled.
      It was the most important wobble in history.
      Everything with wheels, forever after,
      descends from that groaning disc.
    description: "Solid wooden discs roll under heavy sledges — the wheel arrives, slowly, in the most important wobble in history."
    status: "published"
    sha256: "b71e57a5cec6ed14b53a4407064de0dcc62130a8ea9f53863a52aaaa531c6e14"
  - number: "0360"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Perfume"
    date: "c. 4,800 BCE"
    region: "The Levant"
    poem: |
      Scented oils were pressed from flowers —
      luxury you could wear.
      I lifted a small clay flask to my nose:
      rose, myrrh, the distilled essence of a garden,
      and the woman who made it smiled —
      she knew exactly what she had.
      Smell is the oldest memory.
      They had learned to bottle it,
      to carry the garden on the skin,
      to make beauty portable.
      Perfume: the first technology of attraction.
    description: "Scented oils are pressed from flowers — luxury you can wear, beauty made portable."
    status: "published"
    sha256: "6215116b5bd835e6bd2f694852ae37ad5bc8546040cd770506e11d378a62e300"
  - number: "0361"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Gold"
    date: "c. 4,800 BCE"
    region: "The Balkans"
    poem: |
      Gold ornaments gleamed in Varna graves —
      wealth learned how to shine.
      I held a gold bracelet from that cemetery,
      heavy, warm, impossibly bright after seven thousand years,
      and felt the old spell working:
      this metal does not tarnish. It does not fade.
      It is the sun, made holdable.
      They buried it with their dead
      because some wealth is too personal to inherit.
      Gold was not money yet. It was magic.
    description: "Gold ornaments gleam in Varna graves — wealth learns how to shine."
    status: "published"
    sha256: "decd498f8843412e0cfe3b3d5c3a795368f598ee072c06fb5e56ff27953e59ef"
  - number: "0362"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Rich Man's Grave"
    date: "c. 4,700 BCE"
    region: "The Balkans"
    poem: |
      One grave held more gold than all the rest combined —
      rank was buried with the body.
      I stood at the edge of that burial,
      the gold piled around the bones:
      bracelets, scepters, ornaments by the hundred,
      and the other graves around it, modest, plain,
      and understood: inequality had found its monument.
      Somebody was important enough
      to take a fortune underground.
      The rest of us have been arguing about it ever since.
    description: "One grave holds more gold than all the rest combined — rank is buried with the body."
    status: "published"
    sha256: "a7e872da13485084c73c5f2a13dd8774c6f5e37a4f7e269125a5902a49c208bc"
  - number: "0363"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Donkey Caravan"
    date: "c. 4,600 BCE"
    region: "The Levant"
    poem: |
      Donkey trains carried copper and grain between towns —
      trade went overland.
      I walked beside a caravan at dawn,
      thirty donkeys, bells clanking, packs swaying,
      the drovers calling to each other
      in the cool before the heat,
      and watched the ancient world do business:
      copper south, grain north,
      everybody richer at both ends.
      The road was a donkey's back.
      Commerce had four legs and long ears.
    description: "Donkey trains carry copper and grain between towns — trade goes overland on four legs and long ears."
    status: "published"
    sha256: "03d03c1c0fa47b505993052177478e801ff6f87d235c323477cf172b4754dc18"
  - number: "0364"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Nile's First Farmers"
    date: "c. 4,600 BCE"
    region: "Egypt"
    poem: |
      Farming reached the Nile valley —
      and the river would build an empire.
      I stood on the riverbank at flood season,
      the water spreading black silt across the land,
      and watched the first farmers read it
      the way their grandchildren would for three thousand years:
      the river gives. Plant when it leaves.
      No canals needed. No rain required.
      Just the flood, the silt, and the sun —
      the easiest farming on earth,
      and the foundation of everything Egypt would become.
    description: "Farming reaches the Nile valley — the river will build an empire on flood, silt, and sun."
    status: "published"
    sha256: "fcca642f7adf176cbb79a8767c8c7fa37fd63229473dc5b2fb93ed3cece8b3c9"
  - number: "0365"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Bread and Beer on the Nile"
    date: "c. 4,500 BCE"
    region: "Egypt"
    poem: |
      Bakeries and breweries fed the first riverside towns —
      the Egyptian diet was set.
      I walked through a bakery at dawn,
      the loaves coming out of the ovens in waves,
      and across to the brewery, the vats bubbling,
      and a worker handed me both: bread in one hand,
      beer in the other, grinning.
      This was the wage. This was the day.
      Bread and beer, beer and bread —
      for three thousand years, Egypt would run on exactly this.
    description: "Bakeries and breweries feed the first riverside towns — the Egyptian diet is set for three thousand years."
    status: "published"
    sha256: "cf04fd6740021923a5deb9ccb1ffacf9fc7a78ba14f6f78ffd2cecf655bf6edb"
  - number: "0366"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Counting Tokens Multiply"
    date: "c. 4,500 BCE"
    region: "Mesopotamia"
    poem: |
      Token systems grew complex —
      sealed clay balls held the accounts of temples,
      the tokens rattling inside like secrets.
      I held one, a hollow clay sphere,
      and imagined the priest breaking it open
      to settle a dispute: the tokens inside
      were the receipt, the record, the proof.
      Accounting was getting serious.
      The little clay shapes had grown up
      into envelopes, seals, and signatures —
      writing was leaning in the doorway, listening.
    description: "Token systems grow complex — sealed clay balls hold the accounts of temples, and writing leans in the doorway."
    status: "published"
    sha256: "1bdf8bdd62fe56030d8f45f12990f6f2c938c50f8dd4361553104a6710793353"
  - number: "0367"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Wool From the Flock"
    date: "c. 4,400 BCE"
    region: "The Levant"
    poem: |
      Sheep were bred for fleece instead of meat —
      wool would clothe the Bronze Age.
      I watched the first shearing I ever saw:
      the sheep patient, the blades flashing,
      the fleece coming off in one great soft blanket,
      and the shearer shaking it out like a flag.
      They had stopped eating the sheep
      and started wearing them instead —
      a kinder economy, and a warmer one.
      The flock became a field you could shear.
    description: "Sheep are bred for fleece instead of meat — wool will clothe the Bronze Age."
    status: "published"
    sha256: "9ece6393086de308a1deb9db31efa918e88cb21c4627b3ceb719bbe3a850c654"
  - number: "0368"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Lacquer"
    date: "c. 4,400 BCE"
    region: "China"
    poem: |
      Tree sap became a shining coat for wood —
      the first plastic.
      I ran my hand over a lacquered bowl,
      the surface deep and glossy as dark water,
      hard as stone, smooth as glass,
      and marveled: they had invented a material
      that did not exist in nature.
      Sap, refined by patience and skill,
      into something harder and more beautiful
      than the wood it protected.
      The first synthetic. The first plastic.
      Seven thousand years before the word.
    description: "Tree sap becomes a shining coat for wood — the first plastic, seven thousand years before the word."
    status: "published"
    sha256: "fd90760447cf60438ac948b7a6fdc5e8df5bb51ae43edd549d26337ff772a208"
  - number: "0369"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Great Feasts"
    date: "c. 4,300 BCE"
    region: "The Andes"
    poem: |
      Maize beer flowed at highland gatherings —
      community was built on drink.
      I sat at one of those feasts,
      the chicha passed in great clay cups,
      the music starting up as the cups went round,
      strangers becoming neighbors by the third round.
      They did not have temples yet, or kings —
      but they had this: the gathering, the drink,
      the shared cup that made a crowd a people.
      Civilization runs on many things.
      One of them is beer, shared generously.
    description: "Maize beer flows at highland gatherings — community is built on drink, and a crowd becomes a people."
    status: "published"
    sha256: "dd9eca5355c31a6f25a8efa6f2c58416f6827ef22dfab63ce9938f7f18c63c89"
  - number: "0370"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The City Wall"
    date: "c. 4,300 BCE"
    region: "Mesopotamia"
    poem: |
      Uruk's first walls rose —
      the city declared itself.
      I watched the bricklayers work,
      the mud-bricks going up course by course,
      the wall growing along the city's edge
      like a sentence being written:
      this is Uruk. Inside is ours.
      A wall around a village is defense.
      A wall around Uruk was a declaration —
      the city announcing, in brick,
      that it intended to be permanent.
    description: "Uruk's first walls rise — the city declares itself, in brick, intending to be permanent."
    status: "published"
    sha256: "ed6d6a10afb86bd028a5a1095748265d01c8c3be4b6441eaf1462a65c0528690"
  - number: "0371"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Copper Mines"
    date: "c. 4,200 BCE"
    region: "The Levant"
    poem: |
      Deep shafts chased copper veins underground —
      mining became an industry.
      I descended one of those shafts,
      the air growing cool and close,
      the miners' lamps flickering on the green-stained rock,
      their hammers ringing in the dark.
      They followed the vein down and down,
      where no sunlight had ever reached,
      digging wealth out of the earth's bones.
      The surface had been picked over.
      The future was underground.
    description: "Deep shafts chase copper veins underground — mining becomes an industry, and the future goes underground."
    status: "published"
    sha256: "b38974b004bdecd3794399be21e1cf315ec081f909aec8b696d8f4d3a2887117"
  - number: "0372"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Scribe's Tokens"
    date: "c. 4,100 BCE"
    region: "Mesopotamia"
    poem: |
      Counting tokens were pressed into clay envelopes —
      and writing's shadow fell across the wall.
      I watched a scribe press the little shapes
      into the wet clay, then seal them inside,
      then press the same shapes on the outside
      so all could see what was within.
      And I saw the thought arrive, unspoken:
      why put the tokens inside at all?
      The marks on the outside say everything.
      One day, somebody would skip the tokens
      and keep only the marks.
      That day, writing would be born.
    description: "Counting tokens are pressed into clay envelopes — writing's shadow falls across the wall."
    status: "published"
    sha256: "92c658a2c5595ae3e63c41d752530fa22eb2c096f2842527f09bb5e03ef055ee"
  - number: "0373"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Ox-Drawn Plow"
    date: "c. 4,000 BCE"
    region: "Mesopotamia"
    poem: |
      The heavy ard cut deep furrows behind oxen —
      one farmer could now work what ten had done.
      I walked behind a plow-team at dawn,
      the oxen massive and patient, the ard biting deep,
      the earth rolling over in dark shining waves,
      and felt the ground itself change allegiance:
      this was not gardening anymore.
      This was power applied to soil.
      One man, two oxen, and a field that would have fed a village —
      the arithmetic of labor rewritten in a single season.
    description: "The heavy ard cuts deep furrows behind oxen — one farmer can now work what ten did."
    status: "published"
    sha256: "1420ae62f8580449a3beae5aea4dbd181b79411c30c7b9407ab5a8908639073a"
  - number: "0374"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Horses on the Grass Sea"
    date: "c. 4,000 BCE"
    region: "The Steppe"
    poem: |
      Wild horses were tamed on the open steppe —
      the fastest animal became a partner.
      I watched a young herder gentle a mare,
      day after day, no ropes at first, just presence,
      until she let him touch her neck,
      until she let him sit on her back,
      until she ran with him and did not throw him.
      The steppe had found its wings.
      Speed, distance, power — all of it,
      borrowed from an animal that had once
      been only meat on the horizon.
    description: "Wild horses are tamed on the open steppe — the fastest animal becomes a partner."
    status: "published"
    sha256: "0d9b87e2c796a394a012d658edf5e84830e1c04d8e9fcfee418759c8961a7af8"
  - number: "0375"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First River Boats"
    date: "c. 3,900 BCE"
    region: "Egypt"
    poem: |
      Bundled reeds became swift river craft —
      the Nile became a highway.
      I rode one downstream at flood season,
      the papyrus hull hissing through the water,
      the current doing all the work,
      villages sliding past on both banks.
      Upstream was work. Downstream was flight.
      And the river ran both ways for anyone
      with a boat and a reason.
      Egypt's unity would be built on this:
      a highway that never needed paving.
    description: "Bundled reeds become swift river craft — the Nile becomes a highway that never needs paving."
    status: "published"
    sha256: "582c1431edca21f8345f48c7bc208fa007bd0e691195b76a1e30bd6636c046f5"
  - number: "0376"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Vineyards"
    date: "c. 3,900 BCE"
    region: "The Levant"
    poem: |
      Wine presses multiplied across the hills —
      the vintage became an industry.
      I walked through a vineyard at harvest,
      the grapes heavy and dark, the pickers
      moving down the rows with baskets,
      and at the press-house the juice ran red
      into the great vats.
      They planted for the fruit, long ago.
      Now they pressed for the wine —
      and the wine would travel further
      than any grape ever could.
    description: "Wine presses multiply across the hills — the vintage becomes an industry."
    status: "published"
    sha256: "c08b53a683e780c40fa047f622ddebde85ed2c50d9afb7538aeb68825a9779cc"
  - number: "0377"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Wheel, Improved"
    date: "c. 3,800 BCE"
    region: "Mesopotamia"
    poem: |
      Lighter spoked wheels turned under the carts —
      speed joined strength.
      I watched a cart-maker fit the spokes,
      each one angled true, the wheel
      light enough to lift with one hand,
      strong enough to carry a grown man.
      The solid disc had been a miracle.
      This was a refinement — lighter, faster,
      the wheel learning elegance.
      Strength got the wheel invented.
      Speed would make it conquer the world.
    description: "Lighter spoked wheels turn under the carts — speed joins strength."
    status: "published"
    sha256: "92b6d664909eb28034a21a7f81911e61170f8ec4b7e09f86db8febc0636ac624"
  - number: "0378"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Soap"
    date: "c. 3,800 BCE"
    region: "The Levant"
    poem: |
      Ash and oil were boiled into soap —
      cleanliness became a craft.
      I watched them stir the great pot,
      the ash-water and oil merging
      into something neither had been alone,
      and washed my hands in the result:
      clean, truly clean, for the first time
      in a way water alone had never managed.
      They had boiled chemistry into a bar.
      The body could be washed. Cloth could be washed.
      Civilization, it turns out, smells better.
    description: "Ash and oil are boiled into soap — cleanliness becomes a craft."
    status: "published"
    sha256: "f5b91a1a930342f9e3bfdad2f704964a78e553c85fedc152b2d3c8304deaa6a6"
  - number: "0379"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Temple Builders"
    date: "c. 3,700 BCE"
    region: "Malta"
    poem: |
      Great stone temples rose on the islands —
      older than the pyramids by a thousand years.
      I stood in the great apse at dawn,
      the stones massive and curved,
      the light falling through the doorway
      onto the altar stone,
      and felt the silence they had built:
      thick, deliberate, holy.
      No pharaoh ordered this. No empire funded it.
      Island farmers, with stone and faith,
      built the oldest temples on earth.
    description: "Great stone temples rise on Malta — older than the pyramids by a thousand years."
    status: "published"
    sha256: "8a57796d0649fa6ce38162f185c5f721d06c59617b812a95e8010123bf21c234"
  - number: "0380"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Glass Begins as Jewelry"
    date: "c. 3,700 BCE"
    region: "The Levant"
    poem: |
      Glazed beads shone like turquoise —
      glass was born as ornament.
      I held a bead to the light,
      the glaze bright blue-green, glowing,
      a pebble transformed by fire and sand
      into something jewel-like.
      They did not make windows. They did not make cups.
      They made beauty, small and wearable.
      Glass began as jewelry —
      and would wait two thousand years
      to become anything practical.
    description: "Glazed beads shine like turquoise — glass is born as ornament, beauty before utility."
    status: "published"
    sha256: "39965c52a21de476efb56fa0eff98888ab57b0e47adc774e297d366dcc4caeb5"
  - number: "0381"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Wind Becomes an Engine"
    date: "c. 3,600 BCE"
    region: "Mesopotamia"
    poem: |
      Square sails drove cargo boats up and down the rivers —
      wind became an engine.
      I stood on a laden barge,
      the great square sail bellied full,
      the boat pushing upstream against the current
      on nothing but air and cloth.
      The river had been a road.
      Now it was a road with an engine —
      and the engine never tired, never ate,
      only asked for wind.
      Trade would never be the same.
    description: "Square sails drive cargo boats up and down the rivers — wind becomes an engine."
    status: "published"
    sha256: "d5679f4b14b809e55981971b37abb2e0ca98f0f79b510e854f7b54d3bdd253e0"
  - number: "0382"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Mounds of the Andes"
    date: "c. 3,600 BCE"
    region: "The Andes"
    poem: |
      A great platform mound rose on the Peruvian coast —
      the Americas' oldest monument,
      built without pottery or war.
      I climbed it at sunset,
      the platform wide as a plaza,
      the sea on one side, the desert on the other,
      and the builders' fires still smoking below.
      No kings commanded it. No armies defended it.
      They built it because building together
      was how they became a people.
      The mound was the monument.
      The building was the point.
    description: "A great platform mound rises on the Peruvian coast — the Americas' oldest monument, built without pottery or war."
    status: "published"
    sha256: "54dc93d5b181120ff72b65c46885a3f4c02264ec4a46f5b8aab9d23f87d6bd76"
  - number: "0383"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Butter"
    date: "c. 3,600 BCE"
    region: "Europe"
    poem: |
      Churned cream became butter —
      the dairy frontier moved north.
      I watched a farmwife work the churn,
      the dasher going up and down, up and down,
      until the cream surrendered and turned to gold.
      She spread it on warm bread and handed it to me,
      and the taste — rich, sweet, impossibly good —
      was the taste of the north learning dairy.
      Milk had traveled. Cheese had traveled.
      Now butter rode north with the herds.
    description: "Churned cream becomes butter — the dairy frontier moves north."
    status: "published"
    sha256: "f9c5496aefa2c6ffb93fdbf5459ecea90a8f3824e7c221f508da96f4f5b4eb63"
  - number: "0384"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Cylinder Seal"
    date: "c. 3,500 BCE"
    region: "Mesopotamia"
    poem: |
      Carved stones rolled their pictures across wet clay —
      signatures before writing.
      I watched a merchant roll his seal
      across a clay tablet, the tiny carved scene
      repeating around the cylinder:
      lions, gods, his own name in pictures.
      This mark is mine. This deal is witnessed.
      Before we wrote words, we stamped identity.
      The seal was the signature, the logo, the brand —
      five thousand years before the trademark office.
    description: "Carved stones roll their pictures across wet clay — signatures before writing."
    status: "published"
    sha256: "c6f6a6edd4e5062a51b51d524c0e88d2deda6547c96d5008328090e219551530"
  - number: "0385"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The City of Uruk"
    date: "c. 3,400 BCE"
    region: "Mesopotamia"
    poem: |
      Tens of thousands crowded the world's first true city —
      the urban age began.
      I walked its streets at dusk,
      the crowds thick as harvest grain,
      temples rising above the mud-brick sea,
      the noise of it — hammers, voices, animals, wheels —
      like nothing the earth had ever heard.
      This was not a town. This was a city.
      Strangers living wall to wall,
      depending on strangers, ruled by strangers.
      Everything after this — every metropolis —
      is a footnote to Uruk.
    description: "Tens of thousands crowd the world's first true city — the urban age begins."
    status: "published"
    sha256: "b95b70bb1c321f4d66f1addca161ee358910ff8ed2d41fd38cea6a50b4923767"
  - number: "0386"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Painted Tombs"
    date: "c. 3,400 BCE"
    region: "Egypt"
    poem: |
      Elite graves bloomed with painted scenes —
      hunts and harvests, feasts and river journeys,
      art recording the afterlife.
      I descended into one by lamplight,
      the walls alive with color:
      the deceased hunting in the marshes,
      eating at a laden table, sailing the Nile —
      everything he had loved, painted to last forever.
      They were not decorating a grave.
      They were furnishing eternity.
      The afterlife needed wallpaper.
    description: "Elite graves bloom with painted scenes of hunts and harvests — art records the afterlife."
    status: "published"
    sha256: "27b2861e2f7a8e2094d1402b54987065887a6b2f65857549b34bbc43d5a4236c"
  - number: "0387"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Iceman Walks"
    date: "c. 3,300 BCE"
    region: "The Alps"
    poem: |
      A traveler crossed the high pass
      with copper axe and grass cloak —
      and the ice kept him for us to find.
      I walked beside him on that last climb,
      the wind rising, the cold settling into his bones,
      his gear the best of his age:
      the axe, the bow, the fire-kit, the medicine pouch.
      He did not know he was becoming a time capsule.
      He was just trying to get over the mountain.
      Five thousand years later, we know his tattoos,
      his last meal, his aching joints.
      The ice remembered what the world forgot.
    description: "A traveler crosses the high pass with copper axe and grass cloak — frozen for us to find."
    status: "published"
    sha256: "bc6c1e11776b98d9cfabfcf3d9ad5a63ef4138ad234ed258bf8403186d596f08"
  - number: "0388"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Stonehenge's First Ditches"
    date: "c. 3,300 BCE"
    region: "Britain"
    poem: |
      A great circular ditch was dug on Salisbury Plain —
      the stones would come later.
      I stood in that fresh-dug circle,
      the chalk white against the green,
      the ditch and bank enclosing nothing but grass and sky,
      and wondered what they were making room for.
      A temple? A calendar? A gathering place?
      They dug the question first.
      The answer — the stones — would take a thousand years.
      Some projects outlive their architects by millennia.
    description: "A great circular ditch is dug on Salisbury Plain — the stones will come later."
    status: "published"
    sha256: "539c90c0fcc97dcf84643cc7876bdadd363ce62a90074bd1ad61e558224195cb"
  - number: "0389"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Wagon Rolls"
    date: "c. 3,300 BCE"
    region: "The Steppe"
    poem: |
      Covered wagons creaked across the grasslands —
      the mobile homes of the steppe.
      I rode with a family, the wagon swaying,
      children peering out at the endless grass,
      the whole household rolling with the herds.
      They did not need a village. They had wheels.
      Home was wherever the wagon stopped.
      The steppe peoples would ride this freedom
      to the edges of the known world —
      and the wagon was the first vehicle
      that carried not just goods, but life itself.
    description: "Covered wagons creak across the grasslands — the mobile homes of the steppe."
    status: "published"
    sha256: "ef7faf38c3986c7d2e130092a3590649de07b5a707451cee860e34f194471e42"
  - number: "0390"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Passage Tombs"
    date: "c. 3,200 BCE"
    region: "Ireland"
    poem: |
      Newgrange aimed its chamber at the winter solstice sunrise —
      light became architecture.
      I stood in the dark passage on the shortest day,
      the cold stone close around me,
      and then it came: a blade of sunlight
      creeping down the corridor, striking the inner chamber,
      filling it with gold for seventeen minutes.
      They had built a building that caught the sun
      on exactly one morning of the year.
      Astronomy in stone. Light as liturgy.
      Five thousand years old, and it still works.
    description: "Newgrange aims its chamber at the winter solstice sunrise — light becomes architecture."
    status: "published"
    sha256: "0d5c9d203e4fa66de9a8fef7c724c10bc521e8b16d683c85bf3616b508ef13a3"
  - number: "0391"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Crowns"
    date: "c. 3,200 BCE"
    region: "Egypt"
    poem: |
      Chiefs united the river's kingdoms —
      the crown was taking shape.
      I watched a chief don the white crown of the south,
      tall and conical, and another the red crown of the north,
      and the priests spoke of joining them —
      one head, two lands, a single rule.
      The crown was not jewelry. It was an argument:
      this land is one, and I am its head.
      Power was learning to wear a hat.
      It has never taken it off since.
    description: "Chiefs unite the river's kingdoms — the crown is taking shape."
    status: "published"
    sha256: "58f1149861f24bcd8332479584b337e6b71bb027b9a618d0213962a60b3a37b6"
  - number: "0392"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Bronze Is Born"
    date: "c. 3,200 BCE"
    region: "Mesopotamia"
    poem: |
      Copper married to tin made bronze —
      the metal age sharpened.
      I watched the smith pour the alloy,
      the two metals becoming a third thing,
      harder than either, ringing like a bell
      when the finished blade was struck.
      Copper had been beautiful. Bronze was dangerous.
      Swords, spearheads, armor —
      the age of the warrior was cast in this metal.
      Every empire for the next two thousand years
      would be built on bronze.
    description: "Copper married to tin makes bronze — the metal age sharpens, and the warrior age is cast."
    status: "published"
    sha256: "f0b1496c290d10fb63c0074d54550ba7ddfee59a5a8e861d583653fe1e8d6648"
  - number: "0393"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Two Lands United"
    date: "c. 3,100 BCE"
    region: "Egypt"
    poem: |
      Upper and Lower Egypt became one —
      the first nation-state.
      I stood on the riverbank as the news traveled:
      the south and the north, one king, one crown,
      the double crown, the united land.
      It had been two kingdoms, two peoples, two gods.
      Now it was Egypt — a name, a state, an idea
      bigger than any tribe or town.
      The nation was invented here, on the Nile,
      and it would never be uninvented.
    description: "Upper and Lower Egypt become one — the first nation-state."
    status: "published"
    sha256: "1caaaeeb9102d6f4b1a19035597939a42c195c166d059ddccab3b5c80af66675"
  - number: "0394"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Olive Oil Goes to Sea"
    date: "c. 3,100 BCE"
    region: "The Levant"
    poem: |
      Oil ships sailed the eastern Mediterranean —
      flavor became currency.
      I watched them load the great jars,
      sealed with pitch, stamped with seals,
      into the hulls of the trading ships,
      and the captains knew their cargo's worth:
      oil was gold you could eat.
      It sailed to Egypt, to Cyprus, to every port
      that could pay — and every port could pay,
      because everybody needed oil.
      The Mediterranean's first great trade good
      was pressed from a fruit.
    description: "Oil ships sail the eastern Mediterranean — flavor becomes currency."
    status: "published"
    sha256: "f03b7887aff372ca4f8bf8f04c97d1319d36fed9d469fc3aa4826c8c0b9a948f"
  - number: "0395"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Jade Carvers"
    date: "c. 3,100 BCE"
    region: "China"
    poem: |
      Jade was worked into ritual blades —
      stone harder than steel, carved for the gods.
      I watched a carver work a jade bi,
      the abrasive sand and the bamboo drill
      slowly, slowly shaping the hardest stone,
      days for a single curve.
      Jade does not cut. It does not yield.
      It must be persuaded, grain by grain.
      And that was the point: only the gods
      deserved something this difficult.
      The blade would never draw blood.
      It would draw awe, which lasts longer.
    description: "Jade is worked into ritual blades — stone harder than steel, carved for the gods."
    status: "published"
    sha256: "53ab3299d8ff395420c8e57c8413926dd7c23b35c8b563d225033f883898b614"
  - number: "0396"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Sail Barges on the Nile"
    date: "c. 3,000 BCE"
    region: "Egypt"
    poem: |
      Great sail-driven barges carried stone downstream —
      the river was a road of wind.
      I stood on a barge loaded with limestone,
      the sail huge above us, the current with us,
      the stone for a tomb gliding past villages
      that would never see such a stone again.
      The river did the hauling. The wind did the pushing.
      Men only steered.
      Egypt's monuments were built on this partnership:
      water, wind, and the will to stack stone toward heaven.
    description: "Great sail-driven barges carry stone downstream — the river is a road of wind."
    status: "published"
    sha256: "aa4355dc2b907c1cf91ec0db8f70d5934ff89c251a03ff4c1192881e944a143a"
  - number: "0397"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Stairways for the Gods"
    date: "c. 3,000 BCE"
    region: "Mesopotamia"
    poem: |
      Terraced temple platforms rose above the plain —
      the first ziggurats.
      I climbed the great stair at dusk,
      terrace above terrace, the city spreading below,
      the temple at the top brushing the sky,
      and understood: the gods lived up high,
      so you built high to reach them.
      Every level was a prayer in mud-brick.
      The ziggurat was a mountain made by hand —
      because the plain had no mountains,
      and the gods deserved the climb.
    description: "Terraced temple platforms rise above the plain — the first ziggurats, stairways for the gods."
    status: "published"
    sha256: "6d5e307f5420e8ec153aedf8e41c62fc3f753cbb94cffab07230f2ca1cd07e6b"
  - number: "0398"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Bluestones' Journey"
    date: "c. 3,000 BCE"
    region: "Britain"
    poem: |
      Stones were dragged from the Welsh hills to Salisbury Plain —
      two hundred miles of muscle.
      I walked beside the sledges,
      the great bluestones groaning on rollers,
      the teams straining, the chant keeping time,
      mile after mile after mile.
      Why these stones? Why this far?
      Nobody on that road could say —
      only that the stones were wanted,
      and so the stones would come.
      Two hundred miles, for rocks.
      Faith moves mountains. Literally.
    description: "Stones are dragged from the Welsh hills to Salisbury Plain — two hundred miles of muscle."
    status: "published"
    sha256: "a6e92fa5472f507f21b41eb645e9847add11d97f88426e6e6074efef141b653e"
  - number: "0399"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Planned Streets"
    date: "c. 3,000 BCE"
    region: "The Indus"
    poem: |
      A great city's grid was laid —
      drains and straight streets, order before Rome dreamed of it.
      I walked those streets at dawn,
      the grid precise, the drains covered,
      every house with its own bath and sewer,
      and the city's plan so clear
      you could read it from the rooftops:
      straight lines, right angles, intention.
      No other city on earth was this organized.
      The Indus built order into the ground itself.
    description: "A great city's grid is laid with drains and straight streets — order before Rome dreamed of it."
    status: "published"
    sha256: "145a9f11cbd7a5084f655a13423453158417cd48c7d97ef7b78f6d46509f3700"
  - number: "0400"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Cotton Sails the Coast"
    date: "c. 3,000 BCE"
    region: "The Andes"
    poem: |
      Cotton nets hauled in anchovies by the ton —
      the sea's harvest fed the desert towns.
      I watched the fishermen cast the cotton nets,
      the silver flashing as they hauled,
      the catch spread on the sand to dry,
      then carried inland to the desert cities.
      Cotton caught the fish. The fish fed the builders.
      The builders raised the mounds.
      A whole civilization, running on cotton and anchovies —
      no grain, no plow, no problem.
    description: "Cotton nets haul in anchovies by the ton — the sea's harvest feeds the desert towns."
    status: "published"
    sha256: "e4e6abd58a452cee7a028c4ea896e0216e4ce609894d928979f793174d9ed235"
  - number: "0401"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Sahara Dries"
    date: "c. 3,000 BCE"
    region: "Africa"
    poem: |
      The green Sahara faded —
      herders drove their cattle toward the Nile and the savanna.
      I walked with one family as they left,
      the grass thinning behind them,
      the wells failing, the sky hardening to blue brass,
      their cattle lowing, confused, thirsty.
      They had painted their green world on the rocks.
      Now they were walking out of the painting.
      Some went east to the Nile and built Egypt's neighbors.
      Some went south to the savanna.
      The desert took the land. The people took the memory.
    description: "The green Sahara fades — herders drive their cattle toward the Nile and the savanna."
    status: "published"
    sha256: "368cdc0078a7a8294327063d3f135d0d59730e63222f70bb27764ade2773ec5d"
  - number: "0402"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Walled Towns on the Yellow River"
    date: "c. 3,000 BCE"
    region: "China"
    poem: |
      Millet fields fed fortified towns on the loess plains —
      China's cities took root.
      I stood on a rammed-earth wall at dusk,
      the millet golden below, the town humming inside,
      the Yellow River wide beyond,
      and felt the pattern repeat:
      grain, surplus, walls, town —
      the same equation the west had solved,
      solved again here, independently,
      in a different grain, on a different river.
      Civilization rhymes across continents.
    description: "Millet fields feed fortified towns on the loess plains — China's cities take root."
    status: "published"
    sha256: "3da77a5d3574320c254bbd552c632cb92158a59c898304bec4637e7ae477acfc"
  - number: "0403"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Edible Paycheck"
    date: "c. 3,000 BCE"
    region: "Mesopotamia"
    poem: |
      Ration lists showed workers paid in bread and beer —
      the first wages were food.
      I watched the overseer mark the tablet:
      so many loaves, so many jars,
      each worker's name beside his share,
      and the men filing past to collect.
      No coins. No paper. Just bread and beer,
      counted out fair and square.
      The paycheck was edible.
      Work for food — the oldest deal there is,
      now written down in clay.
    description: "Ration lists show workers paid in bread and beer — the first wages are food."
    status: "published"
    sha256: "0c61179f10df88aca8aad4c961b342d85f60f2ad3e379372a3982f4c7484548a"
  - number: "0404"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Cedar Trade"
    date: "c. 3,000 BCE"
    region: "The Levant"
    poem: |
      Lebanese cedar sailed south to Egypt —
      the first timber trade.
      I stood in a cedar forest,
      the great trees straight as pillars,
      smelling of resin and mountain air,
      and watched the loggers choose their giants.
      Egypt had no tall trees. Egypt needed beams
      for temples, masts for ships, coffins for kings.
      Lebanon had the trees. The ships sailed south.
      The forest became a fleet, a temple, a tomb.
    description: "Lebanese cedar sails south to Egypt — the first timber trade."
    status: "published"
    sha256: "e950d702b70a7a43bb3ac7e1d0e3fe06707a0c8323cdbb7526d49a1128e70119"
  - number: "0405"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Calendar"
    date: "c. 3,000 BCE"
    region: "Egypt"
    poem: |
      The Nile's flood was tracked into a 365-day year —
      time was measured by the river.
      I watched the priests mark the rising,
      year after year, notch after notch,
      until the pattern emerged:
      365 days, flood to flood, as regular as breath.
      They divided it, named it, owned it —
      the first calendar, written in river water.
      Time stopped being weather
      and started being mathematics.
    description: "The Nile's flood is tracked into a 365-day year — time is measured by the river."
    status: "published"
    sha256: "cec398adc5e0ec0d0bcf2a85f1fffe41dae9fba73dae662b407fce40a9c19037"
  - number: "0406"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Felt"
    date: "c. 3,000 BCE"
    region: "The Steppe"
    poem: |
      Wool was matted into felt —
      the yurt's skin was invented.
      I watched them lay the wool,
      wet it, roll it, beat it,
      until the fibers locked together
      into a cloth no loom could make:
      windproof, waterproof, warm.
      They stretched it over the lattice walls,
      and the yurt stood — a house you could fold,
      carry on a wagon, raise in an hour.
      The steppe's answer to the mud-brick house:
      soft walls for a moving people.
    description: "Wool is matted into felt — the yurt's skin is invented."
    status: "published"
    sha256: "b9183cdf59347968c1989a4f42ccfed3339eb69db7b7324b4b85c8b9d5ce5804"
  - number: "0407"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Maize Gets Its Cobs"
    date: "c. 3,000 BCE"
    region: "Mesoamerica"
    poem: |
      The little grass now bore fat ears —
      maize became a true crop.
      I stood in a field of it,
      the cobs heavy, golden, bursting from their husks,
      and thought of the scrawny teosinte
      it had all begun with, thousands of years before.
      The transformation was complete.
      The pebbles had become the harvest.
      Maize would feed empires now —
      the Maya, the Aztec, the Inca's neighbors —
      all of them eating the descendant
      of a weed nobody had admired.
    description: "The little grass now bears fat ears — maize becomes a true crop."
    status: "published"
    sha256: "7b500375dce0c71a6a3be8dde1edaa0ce6575bbdb8772b130d3134f105f13c4d"
  - number: "0408"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Terraces Climb the Hills"
    date: "c. 3,000 BCE"
    region: "The Andes"
    poem: |
      Stone terraces stepped up the mountain slopes —
      farming learned to climb.
      I climbed them at dawn,
      terrace after terrace, the stone walls
      holding the soil against the sky,
      water running down the channels,
      each level a small flat world
      carved out of the steep.
      The mountain said: you cannot farm here.
      The farmers answered with stone stairs.
      And the mountain, out-argued, fed them.
    description: "Stone terraces step up the mountain slopes — farming learns to climb."
    status: "published"
    sha256: "2056b5b816beff0ddda3c31a5905e55f968e21570344eb200ea7ee2ce6d763ef"
  - number: "0409"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Banana's Voyage"
    date: "c. 3,000 BCE"
    region: "New Guinea"
    poem: |
      Bananas were carried from the highland gardens —
      the fruit began its world tour.
      I watched them load the suckers,
      the young shoots wrapped and careful,
      destined for islands nobody had named yet.
      The banana travels by cutting, not by seed —
      every banana on earth is a clone
      of a plant somebody carried.
      It would sail further than any sailor,
      root in warmer soils on every continent,
      and become the world's most traveled fruit.
      It started here, in a highland garden.
    description: "Bananas are carried from the highland gardens — the fruit begins its world tour."
    status: "published"
    sha256: "b8c174ff4bae50044981af2de9e9291ebd7385ddf99e45cc0b3e17ef2c76b188"
  - number: "0410"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Clay Watchers"
    date: "c. 3,000 BCE"
    region: "Japan"
    poem: |
      Dogu figurines with goggle eyes guarded Jomon homes —
      Japan's first sculpture.
      I held one in my palm,
      the great round eyes staring,
      the body patterned, the presence
      unmistakably watchful.
      Were they gods? Guardians? Toys?
      Nobody knows, and the figurines aren't telling —
      they just stare with those enormous eyes,
      as they have stared for five thousand years.
      Japan's first art was a watcher.
      It is still watching.
    description: "Dogu figurines with goggle eyes guard Jomon homes — Japan's first sculpture."
    status: "published"
    sha256: "3e607ee7e80525d21842672c834c23e57a62903d7ab756742096c46120a9f82a"
  - number: "0411"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Northern Gold"
    date: "c. 3,000 BCE"
    region: "Europe"
    poem: |
      Baltic amber traveled south to the Mediterranean —
      sunlight trapped in resin, traded for bronze.
      I held a piece to the light,
      the gold glowing from within,
      an insect frozen mid-flight forty million years ago,
      and watched it change hands:
      amber south, bronze north,
      the oldest luxury trade in Europe.
      The north had sunlight in stone.
      The south had metal in the ground.
      They traded, and both grew richer.
    description: "Baltic amber travels south to the Mediterranean — sunlight trapped in resin, traded for bronze."
    status: "published"
    sha256: "2a5a7d294df2943a7eb12c8047855878d0c903b09b045b281a3b2faf1b91be4c"
  - number: "0412"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Gold in the Southern Nile"
    date: "c. 3,000 BCE"
    region: "Africa"
    poem: |
      Gold was worked in the river's southern reaches —
      Africa's metal age stirred.
      I watched them wash the river sand,
      the heavy gold settling in the pan,
      bright grains among the gravel,
      and the smiths hammering it
      into ornaments for chiefs.
      The Nile ran gold in its upper reaches,
      and the people there learned its secrets
      before the pharaohs made it famous.
      Africa's gold was old before Egypt was young.
    description: "Gold is worked in the river's southern reaches — Africa's metal age stirs."
    status: "published"
    sha256: "0afc260436eaefede230e69224e3adc948e4fe88e78d07ab0e624eb2a5a3ab67"
  - number: "0413"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Fired Brick"
    date: "c. 3,000 BCE"
    region: "The Indus"
    poem: |
      Kiln-baked bricks built watertight drains —
      the Indus cities' quiet secret.
      I crouched beside an open drain,
      the fired bricks fitted tight,
      water running clean through the city's veins,
      and marveled: no other city on earth
      had sewers like these.
      Rome would take two thousand years to catch up.
      The secret was not glamorous —
      just brick, fired hard, laid true.
      Civilization's quietest triumph:
      the water goes away, and stays away.
    description: "Kiln-baked bricks build watertight drains — the Indus cities' quiet secret."
    status: "published"
    sha256: "4db110f74c97d6f60911e9f9cdc3ee51ad7802800267fcf7018f15da28001f1a"
  - number: "0414"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Color of Kings"
    date: "c. 3,000 BCE"
    region: "The Levant"
    poem: |
      Sea snails yielded Tyrian purple dye —
      the most precious color on earth was born on the shore.
      I watched them crack the snails,
      thousands upon thousands,
      for a few drops of the precious fluid,
      and the dyed cloth came out
      deep purple-red, the color of dried blood and royalty.
      It took a mountain of snails to dye a single robe.
      That was the point. Only kings could afford it.
      Color became rank. Dye became power.
    description: "Sea snails yield Tyrian purple dye — the most precious color on earth is born on the shore."
    status: "published"
    sha256: "ba4443022277315235ecc6bd9a94f0e04a92c58777e7f5a8fb2bb3f3561f7a3f"
  - number: "0415"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Mummies"
    date: "c. 3,000 BCE"
    region: "Egypt"
    poem: |
      Bodies were preserved with salt and resin —
      death was given a second body.
      I watched the embalmers work,
      the natron drying the flesh,
      the resin sealing it,
      the linen wrapping it layer by layer,
      and the face emerging at last:
      still, composed, ready for the long wait.
      They were not accepting death.
      They were negotiating with it —
      insisting the body continue,
      the person persist, the story go on.
    description: "Bodies are preserved with salt and resin — death is given a second body."
    status: "published"
    sha256: "74ead9d4d3a62fe2cd72bcba69ef89cd91e2ed91cda9475d3cd0b4a0398027d9"
  - number: "0416"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Cloth of the Americas"
    date: "c. 3,000 BCE"
    region: "The Andes"
    poem: |
      Cotton was woven on backstrap looms —
      the Americas dressed themselves.
      I sat beside a weaver,
      the loom's strap around her waist,
      her body the tension, her hands the shuttle,
      the cloth growing between her and the post.
      No great looms. No factories.
      Just a woman, a strap, and skill —
      weaving the cloth that would clothe a continent.
      The backstrap loom is the body's loom.
      The weaver wears her own machine.
    description: "Cotton is woven on backstrap looms — the Americas dress themselves."
    status: "published"
    sha256: "38a383d6ed591a673b94bf6b54124948b590981160902b22ff244e6b37616fad"
  - number: "0417"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Silk Villages"
    date: "c. 3,000 BCE"
    region: "China"
    poem: |
      Silk-making villages multiplied along the Yellow River —
      the thread became an industry.
      I walked through one at dawn,
      the mulberry leaves being gathered,
      the worms fed, the cocoons harvested,
      the reels turning in every courtyard.
      A whole village, organized around a worm.
      The thread that would clothe emperors,
      that would name a road across Asia,
      began as village work —
      women and worms, leaves and patience.
    description: "Silk-making villages multiply along the Yellow River — the thread becomes an industry."
    status: "published"
    sha256: "6b38a3541923f92baaf193661ade4ac0e4df9cb6be2f7c50ec424a76ffaee833"
  - number: "0418"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Gold in Wessex"
    date: "c. 3,000 BCE"
    region: "Britain"
    poem: |
      Gold ornaments appeared in the chalk-down graves —
      the island's metal age began.
      I lifted a gold lunula from a burial,
      the crescent thin and shining,
      hammered from Irish gold,
      laid with a chief in the chalk downs.
      Britain had joined the metal age —
      not with mines of its own, but with trade,
      with craft, with the hunger for the shining thing
      that every age seems to share.
    description: "Gold ornaments appear in the chalk-down graves — the island's metal age begins."
    status: "published"
    sha256: "32cfdae914a4be6bdf19d4f588b22f08b44ba478f780aab0811cddaeae0b86f6"
  - number: "0419"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Drink of the Grass Sea"
    date: "c. 3,000 BCE"
    region: "The Steppe"
    poem: |
      Fermented mare's milk became the steppe's drink —
      the herd provided the cup.
      I watched them churn the milk in leather bags,
      the fermentation working, the drink
      going sharp and fizzy and strong,
      and the herders passing the bag around the fire.
      No grapes on the steppe. No barley.
      Just mares, and milk, and time.
      Kumis: the drink of people who lived on horseback,
      made from the animal that carried them.
      The herd gave everything: meat, milk, motion, and drink.
    description: "Fermented mare's milk becomes the steppe's drink — the herd provides the cup."
    status: "published"
    sha256: "92894f4526d933aea1a8c07db20d412bc49e9b3100963f3ba2d390b23cce28da"
  - number: "0420"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Contracts"
    date: "c. 3,000 BCE"
    region: "Mesopotamia"
    poem: |
      Sealed tablets recorded debts and deals —
      trust became clay.
      I watched two merchants press their agreement
      into the wet tablet, roll their seals across it,
      and each take a copy.
      So much grain, by harvest time. So much silver, by the new moon.
      Witnessed. Sealed. Binding.
      Before this, a deal was a handshake and a memory.
      After this, it was a document.
      Trust had been outsourced to clay —
      and clay, unlike memory, does not forget.
    description: "Sealed tablets record debts and deals — trust becomes clay."
    status: "published"
    sha256: "2dd46f14caa2a948a00cbc49676f9bba19d66792b845edfff37515a2ab2d190c"
  - number: "0421"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Surgeons"
    date: "c. 3,000 BCE"
    region: "Egypt"
    poem: |
      Trepanned skulls showed healed bone —
      the knife healed more often than it killed.
      I held a skull with the neat round hole,
      the bone's edges smooth and regrown —
      this person had lived for years
      after someone cut into their head.
      They did it to release pressure, to treat injury,
      to fight what they could not see.
      And it worked. The bone healed.
      The patient walked away.
      Surgery's first triumph was a hole in the head
      that the body forgave.
    description: "Trepanned skulls show healed bone — the knife heals more often than it kills."
    status: "published"
    sha256: "738b8f8a0737414a2fc9c654defc4d624169552a03467e8e896f4742fbbab8ad"
  - number: "0422"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Harps"
    date: "c. 3,000 BCE"
    region: "The Levant"
    poem: |
      Strings stretched on wooden frames sang —
      music's oldest instrument.
      I watched a musician tune her harp,
      plucking each string, listening,
      adjusting, until the frame
      held a whole scale of sound.
      Then she played — and the courtyard filled
      with something no one had heard before:
      melody, deliberate and shaped,
      music you could repeat, remember, teach.
      The harp was the first machine for making beauty on purpose.
    description: "Strings stretched on wooden frames sing — music's oldest instrument."
    status: "published"
    sha256: "7df7a0db738f37686c4c74c1afb100c17fe7a1e47f28e11112bf0f876e4b186e"
  - number: "0423"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Pods of the Gods"
    date: "c. 3,000 BCE"
    region: "Mesoamerica"
    poem: |
      Cacao pods were harvested in the steamy lowlands —
      the food of gods waited in a tree.
      I split a pod with a stone blade,
      the white pulp sweet around the bitter beans,
      and the harvesters told me what was coming:
      ferment them, dry them, grind them,
      and the bitter bean becomes chocolate —
      drink of kings, currency of empires.
      They harvested the pods. The future
      would invent the craving.
      Some treasures wait a thousand years to be wanted.
    description: "Cacao pods are harvested in the steamy lowlands — the food of gods waits in a tree."
    status: "published"
    sha256: "64b46f6667c7c1bd74d68b868d8bbe9b302f2185310431407ffb814fdc09acf4"
  - number: "0424"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Potatoes Feed the Coast"
    date: "c. 3,000 BCE"
    region: "The Andes"
    poem: |
      Dried potatoes traveled from the highlands to the sea —
      freeze-dried food, five thousand years early.
      I watched them make chuno:
      potatoes left in the freezing night air,
      trampled at dawn, dried in the sun —
      light as cork, lasting for years.
      The mountain's cold was a technology.
      They carried the dried potatoes down to the coast,
      where the fishermen traded anchovies for them:
      sea protein for mountain starch,
      the oldest supply chain in the Americas.
    description: "Dried potatoes travel from the highlands to the sea — freeze-dried food, five thousand years early."
    status: "published"
    sha256: "2e3c6139779cf88182c07029f283c00cfd4d9e8db44a9c3a7b0446112124bc64"
  - number: "0425"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Drums"
    date: "c. 3,000 BCE"
    region: "Africa"
    poem: |
      Hide stretched on wood beat out rhythm —
      music's oldest machine.
      I sat in the circle as the drummers began,
      the deep drums talking first,
      the high drums answering,
      hands moving faster than thought,
      and the whole village moving with it —
      feet, hips, shoulders, the dance
      rising out of the rhythm like smoke from fire.
      Before the drum, music was breath and voice.
      After it, music had a heartbeat you could feel in your chest.
    description: "Hide stretched on wood beats out rhythm — music's oldest machine."
    status: "published"
    sha256: "8123c074420a3606cedfd5c2f0c346059d3e5d5dca8981d891e58aaf0f3db6c8"
  - number: "0426"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Forest Falls to the Furrow"
    date: "c. 3,000 BCE"
    region: "Europe"
    poem: |
      The ard plow reached the northern plains —
      the deep forest yielded to the field.
      I watched them fell the great trees,
      burn the stumps, drag the ard
      through the ash-rich soil,
      and the forest that had stood since the ice
      became farmland in a single generation.
      It was necessary. It was brutal.
      The wildwood fell, and the wheat rose.
      Europe's landscape was being rewritten —
      tree by tree, furrow by furrow —
      into the farmland we still see today.
    description: "The ard plow reaches the northern plains — the deep forest yields to the field."
    status: "published"
    sha256: "2092c0d1179818dc1b3c1e94097c613736a167c8d94554c81b70e11c8eb45a8a"
  - number: "0427"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Rice Moves Inland"
    date: "c. 3,000 BCE"
    region: "China"
    poem: |
      Rice paddies climbed up the Yangtze tributaries —
      the grain frontier pushed west.
      I followed it upstream,
      the paddies appearing in valley after valley,
      each one a mirror of the last,
      each one feeding a new town.
      Rice was not content with the delta.
      It wanted the hills, the tributaries, the west —
      and the farmers carried it there,
      bund by bund, seedling by seedling.
      The grain that would feed half the world
      was still conquering its first river.
    description: "Rice paddies climb up the Yangtze tributaries — the grain frontier pushes west."
    status: "published"
    sha256: "b8baba0ed88ab02e916867eacfd15932abb386f9337fdbf1fec2f4ca099598d0"
  - number: "0428"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Jade for the Dead"
    date: "c. 3,000 BCE"
    region: "Japan"
    poem: |
      Polished jadeite beads were laid in graves —
      green stone for the living and the dead.
      I watched them place the beads
      around the neck of the deceased,
      each one polished to a deep green glow,
      each one a small sun of stone.
      Jade does not decay. Jade does not fade.
      They gave the dead what lasts —
      because they believed something of the dead
      lasted too.
      Green stone, for the green hope
      that death is not the end.
    description: "Polished jadeite beads are laid in graves — green stone for the living and the dead."
    status: "published"
    sha256: "34bbb92ad227b4ba220d8655db60d34d31fcf229317238c8d44e6c9dc5169ab5"
  - number: "0429"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Honesty You Can Hold"
    date: "c. 3,000 BCE"
    region: "The Indus"
    poem: |
      Standard stone weights measured every trade —
      fairness you could weigh in the hand.
      I watched a merchant set the weights:
      the little polished cubes, precise to the grain,
      against the goods on the other pan.
      No arguing. No cheating.
      The weight was the weight —
      the same in every market, every city,
      across the whole Indus world.
      Honesty, standardized.
      They had invented the idea that a measure
      should mean the same thing for everyone.
    description: "Standard stone weights measure every trade — fairness you can weigh in the hand."
    status: "published"
    sha256: "d093f0c43e34322907f02f9c17a3164400b792e5cb673327701544c4239d0491"
  - number: "0430"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Anchors"
    date: "c. 3,000 BCE"
    region: "The Levant"
    poem: |
      Stone anchors held ships against the wind —
      seafaring's small revolution.
      I watched a sailor lower the pierced stone
      over the side, the rope going taut,
      the ship steadying in the swell.
      Before the anchor, you beached or you drifted.
      After it, you could wait —
      wait out the storm, wait for the tide,
      wait for morning.
      A small stone with a hole in it,
      and the sea became a place you could pause.
    description: "Stone anchors hold ships against the wind — seafaring's small revolution."
    status: "published"
    sha256: "0899a1765810d5d059e6ab03cc97bd2e42b595ef92a9b31a8b66de74d45c8811"
  - number: "0431"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Pictures Become Writing"
    date: "c. 3,000 BCE"
    region: "Egypt"
    poem: |
      Signs carved on the Nile began to speak in sentences —
      Egypt learned to write in stone.
      I watched a scribe carve the signs:
      an owl, a reed, a loaf of bread —
      each picture becoming a sound,
      each sound becoming a word,
      the words lining up into sentences.
      Pictures had become writing.
      The wall could talk now —
      and it would talk for three thousand years,
      in temples and tombs, in stone that outlasted
      every voice that ever carved it.
    description: "Signs carved on the Nile begin to speak in sentences — Egypt learns to write in stone."
    status: "published"
    sha256: "bc8e574607bb6806d314971c5cc7e61bc39840eb6118ae41d08f76d1ff80a0c7"
  - number: "0432"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Reading the Sky"
    date: "c. 3,000 BCE"
    region: "Mesopotamia"
    poem: |
      Priests climbed the temple platforms to watch the stars —
      astronomy's first observatory.
      I stood with them on the ziggurat's top,
      the plain spread dark below,
      the stars wheeling overhead in their ancient courses,
      and watched them mark the risings:
      this star, the flood. That star, the harvest.
      The sky was a calendar, if you knew how to read it.
      They were learning. Night after night,
      year after year, they learned —
      and wrote it down in clay.
    description: "Priests climb the temple platforms to watch the stars — astronomy's first observatory."
    status: "published"
    sha256: "5794d6397e810122fee5ac334a4dbd8fd50eb8c24b1e5876f5bf4b6d8cc4f342"
  - number: "0433"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Timber Circles"
    date: "c. 3,000 BCE"
    region: "Britain"
    poem: |
      Wooden posts ringed the sacred ground —
      the wooden twin of the stone circles.
      I walked among the great posts,
      oak trunks sunk deep, standing tall,
      the circle complete against the sky.
      Wood rots. Stone endures.
      But that day the timber circle stood
      as proud as any stones —
      a cathedral of oak, smelling of sap and rain.
      The stones would outlast them.
      The intention was the same.
    description: "Wooden posts ring the sacred ground — the wooden twin of the stone circles."
    status: "published"
    sha256: "cb9e8a644f55f70ccf7b24c248b04f03b4557596a8d90eef0da970f94beaaf1f"
  - number: "0434"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Bent Bow"
    date: "c. 3,000 BCE"
    region: "The Steppe"
    poem: |
      Horn, wood, and sinew bent together —
      the weapon that would one day conquer continents.
      I watched a bowyer work the composite,
      layer on layer, horn and wood and sinew
      glued and bound into a single curve,
      small enough to shoot from horseback,
      strong enough to pierce armor.
      It took a year to make one.
      It would take an empire to stop them.
      The bent bow was the steppe's answer
      to every wall ever built.
    description: "Horn, wood, and sinew bend together — the weapon that will one day conquer continents."
    status: "published"
    sha256: "ad4ccfa94556823a5a4208939ce409fb4e63e698211281733c98124bf540142c"
  - number: "0435"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Last Portrait of Green"
    date: "c. 3,000 BCE"
    region: "The Sahara"
    poem: |
      Painted giraffes ran across the drying rock —
      the green Sahara's farewell portrait.
      I stood before the paintings,
      the giraffes tall and elegant,
      the artists' world still vivid on the stone,
      while outside the rock the desert
      crept closer every year.
      They painted what they were losing.
      The green time, the grass, the herds —
      all of it, kept in pigment on stone,
      because the land would not keep it.
      The desert took everything but the paintings.
    description: "Painted giraffes run across the drying rock — the green Sahara's farewell portrait."
    status: "published"
    sha256: "64c069ee871b52fd9fceaa09ee14eda551548ae91b555699df329088cf8a0776"
  - number: "0436"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Rubber"
    date: "c. 3,000 BCE"
    region: "Mesoamerica"
    poem: |
      Rubber trees were tapped in the lowlands —
      the bouncing ball waited in the future.
      I watched them cut the bark,
      the white latex welling out,
      collected, dried, worked into balls
      that bounced — impossibly, joyfully bounced —
      and the children of the village
      chased them shrieking with laughter.
      They did not know about tires or erasers.
      They knew about the bounce.
      Some inventions begin as toys.
      The serious uses come later.
    description: "Rubber trees are tapped in the lowlands — the bouncing ball waits in the future."
    status: "published"
    sha256: "0a3f4fca01ee80fb0c5df56444ab36993cd956a3d17801c607f5316bf3d80f37"
  - number: "0437"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Knots That Count"
    date: "c. 3,000 BCE"
    region: "The Andes"
    poem: |
      Knotted cords tracked harvests and herds —
      the computer of string was born.
      I watched a record-keeper work the quipu,
      the cords hanging, the knots tied
      in patterns I was only beginning to read:
      so many sheep, so much maize,
      so many days of labor owed.
      No writing. No clay. Just string and knots —
      and a whole empire's accounts
      hanging from a single cord.
      The computer was invented here.
      It was made of string.
    description: "Knotted cords track harvests and herds — the computer of string is born."
    status: "published"
    sha256: "565014d42342e75f9ae2f8727e70697d7fdd30bf107c08dce932f0b30c38a8f4"
  - number: "0438"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Potter's Wheel"
    date: "c. 3,000 BCE"
    region: "China"
    poem: |
      The fast wheel spun clay into shape —
      pots by the thousand.
      I watched a potter center the clay,
      the wheel spinning, his hands sure,
      and a vessel rising as if by magic:
      round, thin, perfect, in minutes.
      What had taken an hour by coiling
      took moments on the wheel.
      Pots by the thousand. Bowls by the ten thousand.
      The handmade became the mass-made —
      and nobody ever went back.
    description: "The fast wheel spins clay into shape — pots by the thousand."
    status: "published"
    sha256: "8d0c6631e49599cdc8d5dc3c32cd552b86b4c75e5cd98c18ab603153233af96e"
  - number: "0439"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The First Markets"
    date: "c. 3,000 BCE"
    region: "The Levant"
    poem: |
      Stalls lined the city gates at dawn —
      shopping was born.
      I walked the market as it woke:
      the bread-sellers calling, the oil-jars gleaming,
      the weavers spreading their cloth,
      the whole city come to buy and sell and bargain.
      No coins yet. Just barter, haggling,
      the ancient theater of the deal.
      The market was the city's living room —
      where news traveled, friendships formed,
      and everybody ate well.
    description: "Stalls line the city gates at dawn — shopping is born."
    status: "published"
    sha256: "52fce6d372f0db8fb8e7708f6932a8d5abc0cc35697aee9f9367ff7591194107"
  - number: "0440"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Pyramid's Ancestors"
    date: "c. 3,000 BCE"
    region: "Egypt"
    poem: |
      Mud-brick mastabas stacked toward the sky —
      the pyramid was a thought away.
      I stood among them at Saqqara,
      the flat-topped tombs in rows,
      each one a little mountain of mud-brick,
      and felt the idea gathering:
      stack them. Stack them higher.
      One day somebody would stack them
      into a true pyramid, in stone,
      and point it at the stars.
      But that day, the mastabas were enough —
      the sky already felt closer.
    description: "Mud-brick mastabas stack toward the sky — the pyramid is a thought away."
    status: "published"
    sha256: "4be26b0f5f3ad486bf3e6f2c9f43581eb034c1517e0733ca1cc4d8a76d9cb511"
  - number: "0441"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "Taming the Flood"
    date: "c. 3,000 BCE"
    region: "Mesopotamia"
    poem: |
      River dikes held back the spring waters —
      engineering mastered the flood.
      I walked the great dikes at flood season,
      the river high and brown and angry,
      the dikes holding, the fields behind them
      green and calm and safe.
      The flood had been a god, a terror, a gamble.
      Now it was a managed resource —
      held back here, released there,
      the river's strength borrowed for the fields.
      They had not conquered the river.
      They had hired it.
    description: "River dikes hold back the spring waters — engineering masters the flood."
    status: "published"
    sha256: "5a77f714ed05e9e7648cc8fbf5fec7e81700d5d9ee9efff07ae77df229e8730e"
  - number: "0442"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Warrior's Axe"
    date: "c. 3,000 BCE"
    region: "Europe"
    poem: |
      Stone battle-axes marked the graves of chiefs —
      the warrior aristocracy was born.
      I stood at one of those burials,
      the polished axe laid across the chief's chest,
      beautiful and terrible, never used in battle —
      a symbol, not a tool.
      The message was carved in stone:
      this man ruled by the axe.
      Rank now came with a weapon.
      The village age was ending,
      and the age of the warrior was beginning.
    description: "Stone battle-axes mark the graves of chiefs — the warrior aristocracy is born."
    status: "published"
    sha256: "e4489115131ced24cbc47f9b5afe2eabe2852d10a6fbe00bfa22b5d46d9dc1c6"
  - number: "0443"
    volume: 1
    era_code: "02"
    era: "First Villages"
    title: "The Village Age Ends"
    date: "c. 3,000 BCE"
    region: "The World"
    poem: |
      From the Nile to the Yangtze,
      cities rose where villages stood —
      the first chapter of civilization closed.
      I stood on a hill and looked out
      across ten thousand years:
      the first wild harvest, the first planted seed,
      the first pot, the first loaf, the first herd —
      all of it leading here, to walls and streets,
      to kings and scribes, to the crowded humming city.
      The wanderers had put down roots.
      The roots had become fields.
      The fields had become cities.
      And I had walked every step of it with them.
      The village age was over.
      The story was just beginning.
    description: "From the Nile to the Yangtze, cities rise where villages stood — the first chapter of civilization closes."
    status: "published"
    sha256: "af3631e85180460614ff72b6f9e23877d16b7fbfb086cc014208d042db907e3b"
  - number: "0444"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Fleet Buried in the Sand"
    date: "c. 3000 BCE"
    region: "Egypt"
    poem: |
      I stood in the trench where the sand ran deep,
      and counted them, hull by hull, in their sleep —
      fourteen long boats, planked in cedar and pine,
      laid by the tomb as if the desert were brine.
      The king meant to sail through the dark below,
      so they buried his navy where no rivers flow.
      Wood darkened by five thousand years of night,
      each rib still curved as if for morning light.
      I touched one keel and the centuries fell:
      the dead still launch ships. I know it well.
    description: "At Abydos I counted fourteen wooden boats buried beside a royal tomb, Egypt's oldest known fleet, waiting to sail the afterlife."
    status: "published"
    sha256: "92d309c13718e587a1d34722d062f24929580f7628a27b0f780a62fd4dae2a52"
  - number: "0445"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Beer for the Afterlife"
    date: "c. 3000 BCE"
    region: "Egypt"
    poem: |
      The vats at Hierakonpolis never cooled.
      Grain went in by the basketful, water by the jar,
      and out it came foaming — beer for a king's goodbye.
      I drank with the brewers at the end of a long shift,
      mud on our sandals, steam in our hair.
      Thousands of jars for one funeral feast.
      They weren't sad. They were proud.
      When a king dies, you don't send him off thirsty.
      The whole city worked the brew that week,
      and the smell of it hung over the Nile
      like a promise: nobody crosses over dry.
    description: "I drank with the brewers at Hierakonpolis, where vats filled thousands of jars of beer for a single royal funeral."
    status: "published"
    sha256: "7fbd7f2dfb4c21fafc379d7580b7485c9462aa0bc18601b7c68e7e20dd90911d"
  - number: "0446"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The First Great City"
    date: "c. 3000 BCE"
    region: "Mesopotamia"
    poem: |
      I walked Uruk's wall at dawn and could not see its end —
      six miles of brick, a horizon made by hands.
      Fifty thousand souls inside. Nothing like it had ever stood.
      Bakers, potters, clerks, and priests, children shouting in the lanes,
      the Eanna precinct gleaming, the ziggurat's first shadow falling long.
      Markets loud as rivers. Beer halls. Tablet houses.
      The countryside poured grain into it and it poured life back out.
      I stood on the gate tower and understood, all at once:
      the city is the newest animal on earth, and it is hungry,
      and it is never, ever going to leave us alone again.
    description: "I walked the walls of Uruk at dawn — fifty thousand people, six miles of brick, the first great city the world had ever seen."
    status: "published"
    sha256: "eff728300f83af46b2a0429e8b10592bdb1fe000a9008674dd9d27d99e18e2e5"
  - number: "0447"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Paper from the River"
    date: "c. 3000 BCE"
    region: "Egypt"
    poem: |
      They cut the reed by the river's edge,
      peeled it, laid it crosswise, pressed it flat,
      and the king's accounts could travel.
      I watched a scribe smooth a fresh sheet,
      dip his brush, and write the harvest down —
      a year's grain in a hand's breadth of reed.
      Papyrus: light as breath, strong as a promise.
      Letters to generals. Letters to priests.
      The whole machinery of a kingdom
      running on strips of a water plant.
    description: "I watched scribes press river reeds into papyrus sheets and write the kingdom's harvest, letters, and accounts on them."
    status: "published"
    sha256: "24cd569245f5a0cdc428b32921bc6895d6af6fd7b0ad7286d87fde7817fe7b1f"
  - number: "0448"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Stone Houses Against the Wind"
    date: "c. 3000 BCE"
    region: "Orkney"
    poem: |
      The wind at Skara Brae has teeth.
      It comes off the sea and takes the thatch, the smoke, the warmth —
      so they built in stone. Stone beds. Stone shelves.
      Stone drains running under the floor.
      I slept one night in a house there, the gale howling outside,
      and inside it was still as a held breath.
      No wood on those islands to speak of, no mercy in the weather,
      but a people who looked at the storm and said:
      we are staying. We will carve our comfort from rock.
      Five thousand years later the wind is still trying.
      The houses are still standing.
    description: "I spent a night in a stone house at Skara Brae while the North Sea gale howled outside and the stone walls held it all off."
    status: "published"
    sha256: "b6449dc65cf82666c4229d28bdccf969f818d894fb3de75e7d0a4e5bf0e5eb07"
  - number: "0449"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Temple That Never Moved"
    date: "c. 3000 BCE"
    region: "Mesopotamia"
    poem: |
      One spot. One holy ground at Eridu.
      They built the temple, and the years wore it down,
      and they built it again on the same stones.
      And again. And again.
      Eighteen temples, one atop the other,
      each generation laying its brick on the last one's dust.
      I dug my fingers into the layers and felt time stack up —
      fathers, sons, grandsons, all bowing at the same address.
      Kings changed. Rivers moved. The spot never did.
      Some places are not chosen. They are returned to,
      again and again, until the earth itself remembers the prayers.
    description: "At Eridu I touched eighteen temples stacked on one sacred spot, each generation rebuilding where the last one prayed."
    status: "published"
    sha256: "393e9719de3250dc60d019dbe67b999d7c4eee7ab1abd13aa1a657891c264974"
  - number: "0450"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Kings of the North"
    date: "c. 3000 BCE"
    region: "Mesopotamia"
    poem: |
      Up the Euphrates the water runs cold and fast,
      and there Kish raised her head above the plain.
      The northern cities had been ruled by priests and councils —
      Kish gave them kings, and the kings gave them war.
      I saw the first crown of the north set on a living brow,
      saw the scribes write the name in the king list,
      saw the farmers look up from their furrows
      at a man who now owned the harvest.
      Power had found a new shape, and it liked it.
      The list of kings begins here, in the north,
      and it does not stop for four thousand years.
    description: "I watched Kish crown the first kings of the northern cities, and saw the king list begin — a list that would run for millennia."
    status: "published"
    sha256: "4ac0e09d0ab6019e8dba2e671031ba0479f60613b9acda0ba549f3957cda15c3"
  - number: "0451"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "A Town Above the Plain"
    date: "c. 3000 BCE"
    region: "Anatolia"
    poem: |
      Small. Walled. Watching.
      Troy the First, a fistful of stone houses
      on a hill above the straits.
      Every ship that wanted the Black Sea's grain
      had to pass beneath her walls and pay.
      I stood on that first wall — low, rough, honest —
      and looked down at the water road.
      The town was barely a town.
      But it held the throat of the world's trade,
      and it knew it.
      Some places are born lucky.
      This one was born at a tollbooth.
    description: "I stood on Troy's first low wall and watched the trading ships pass through the straits below, paying their way past."
    status: "published"
    sha256: "674438213e0e3e07856ea4d8e6df0babe61ce0dbfb62203ee49563d7e516c8c7"
  - number: "0452"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Walls in the Sun"
    date: "c. 3000 BCE"
    region: "Iberia"
    poem: |
      The sun at Los Millares is a hammer and the copper workers knew it.
      They raised their walls anyway — stone on stone,
      towers at the corners, a gate you could defend with ten men.
      I walked the circuit at noon and the heat shimmered off the rock.
      Inside: furnaces, slag heaps, the smell of hot metal.
      Copper was wealth, and wealth draws raiders like flies.
      So they built. Thick walls. High towers. Watchfires.
      The Mediterranean has never been a gentle sea,
      and Spain has never been a gentle land —
      but the people who smelt copper under that sun
      were not gentle either.
    description: "I walked the sun-baked walls of Los Millares at noon, where copper workers raised towers and gates to guard their furnaces from raiders."
    status: "published"
    sha256: "b0c62271b4ed7809a142f4ac8a9e8353cd4f7486fad0bb789a0457297e167ebc"
  - number: "0453"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Temples on the Hill"
    date: "c. 3000 BCE"
    region: "Levant"
    poem: |
      Megiddo's mound rises out of the plain like a held breath,
      and on its crown they built the round altars —
      great circles of stone where the smoke went up.
      I climbed it at evening and the valley spread below,
      the trade road running east and west.
      A hill like that is a magnet for armies.
      I could feel it in the stones: this ground would drink blood
      a hundred times over, century after century.
      They called it Armageddon later. They were right to fear it.
      But that first evening, it was only altars and smoke,
      and the sun going down red over the hills of the Levant.
    description: "I climbed Megiddo's mound at dusk and stood by the great round altars, feeling in the stones the hundred battles that hill would someday see."
    status: "published"
    sha256: "2010441016a2f1748dd5fc5db0f82cb196818cd9bf78f33679352de596bfcfff"
  - number: "0454"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Counting by Sixties"
    date: "c. 3000 BCE"
    region: "Mesopotamia"
    poem: |
      One. Two. Three. Keep going.
      Ten fingers are not enough for a temple's grain,
      so Sumer's clerks counted to sixty and started over.
      Sixty. Sixty sixties. Sixty sixties of sixties.
      I watched a clerk tally a harvest in the shade of the ziggurat,
      his stylus flying, the numbers climbing past anything fingers could hold.
      Sixty seconds. Sixty minutes. Three hundred sixty degrees.
      You still count their way every time you check the clock.
      Five thousand years, and the clerks of Uruk
      are still telling you what time it is.
    description: "I watched a Sumerian clerk tally grain in sixties — the same sixty we still use for our minutes, hours, and circles today."
    status: "published"
    sha256: "bb44cc3a776de51a566b649ff2f9373d98bc44c2386066a7d67eb1805ab6d417"
  - number: "0455"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Game of Passing"
    date: "c. 3000 BCE"
    region: "Egypt"
    poem: |
      Thirty squares.
      Two players. The pieces race the board
      the way the soul races through the underworld.
      I played Senet with a priest at Thebes one slow afternoon,
      and he told me: every square is a trial of the dead.
      The board goes in the tomb with you.
      You will need the practice.
      We threw the casting sticks and moved our stones,
      and outside the temple the Nile kept flowing,
      indifferent as time.
      He beat me. The dead always have home advantage.
    description: "I played Senet with a priest at Thebes, who told me each of the thirty squares is a trial the soul must pass on its way to the next world."
    status: "published"
    sha256: "873b537e90b3442041d9b02501f26b7cf0e739c464de68275b4900a67edfa822"
  - number: "0456"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Wheels on the Grass Sea"
    date: "c. 3000 BCE"
    region: "Steppe"
    poem: |
      The steppe has no end. Grass to the horizon, then more grass.
      The Yamnaya solved it the way you solve an ocean: they built ships for it.
      Solid wooden wheels, taller than a man, creaking under ox-drawn wagons,
      whole families rolling across the grass sea with their herds, their tents, their dead.
      I rode with them for three days and the world never changed —
      just grass, sky, the slow turning of those great wooden circles.
      Everything they owned moved. Nothing stayed behind.
      The wheel was young then. It had not yet learned war.
      It only knew the long road, and the wind, and the endless green.
    description: "I rode three days with Yamnaya families in their great solid-wheeled wagons, rolling their whole world across the endless steppe."
    status: "published"
    sha256: "157bc1c5c0e7755a78bce266f424c40e425c8c9ea911a79c9adab16650f9015a"
  - number: "0457"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Horse Learns the Bridle"
    date: "c. 3000 BCE"
    region: "Steppe"
    poem: |
      First it was meat. Then it was milk.
      Then one morning a herder slipped a rope over a wild head
      and the world got smaller.
      I watched a boy gentle a stallion on the open grass —
      no saddle, no stirrups, just balance and nerve and patience.
      The horse learned the bridle. The bridle learned the horse.
      And distance, which had ruled every human life since the beginning,
      began its long retreat.
      Armies. Messengers. Empires. All of it starts here,
      with a rope, a boy, and an animal that decided to stay.
    description: "I watched a steppe boy gentle a wild stallion with nothing but a rope and patience, and felt distance itself begin to shrink."
    status: "published"
    sha256: "9eaf792e401688f7dfcbc3ffaf6538842f361143e349880ceda1bbe2aadfd9ca"
  - number: "0458"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Cloth White as Moonlight"
    date: "c. 3000 BCE"
    region: "Egypt"
    poem: |
      Flax first: blue flowers in the field, then the pulling, the soaking, the beating.
      I watched the women at the river work the fibers loose,
      combing them straight as hair, spinning them fine as breath.
      Then the loom — and out came linen white as moonlight,
      so fine you could see your hand through it.
      The priests wore it. The kings were buried in it.
      It kept the wearer cool under a hammering sun
      and it never rotted, never faded, never lied.
      I held a length of it up to the light one morning
      and the sun came through like it was passing through water.
    description: "I held Egyptian linen up to the morning sun and watched the light pass through it like water — flax beaten and spun finer than breath."
    status: "published"
    sha256: "d025fbde3e12d5b8d92dbd1a9ba211fb85f39c8d1c80383eed527eb11ee96f9d"
  - number: "0459"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Canals of the Gods"
    date: "c. 3000 BCE"
    region: "Mesopotamia"
    poem: |
      "I dug this canal," the king's inscription says,
      "and the gods drink from it beside me."
      I walked the new cut at dawn, water running where desert had been,
      and the farmers were already at the banks, barefoot, laughing.
      A canal is a river you order into being.
      The king boasts; the scribe carves the boast in stone;
      but the real miracle is quieter — green rows of barley
      where last year there was dust.
      The gods may drink from it. I drank from it too.
      It tasted like every canal ever dug: mud, and life, and pride.
    description: "I walked a king's new canal at dawn and drank from it with the farmers, tasting mud and pride where desert had been a year before."
    status: "published"
    sha256: "64f3ee8626f540ab16c1987589fb05bb29fc501c325820a5065fb7bc8293ed15"
  - number: "0460"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "A Signature in Stone"
    date: "c. 3000 BCE"
    region: "Mesopotamia"
    poem: |
      A cylinder, small as a thumb, carved all around with gods and goats.
      Roll it across wet clay and the picture repeats, perfect, every time.
      I watched a merchant seal a jar of oil — one roll, and the jar was his,
      marked, witnessed, undeniable.
      Doors. Contracts. Storeroom locks. All of it signed in mud.
      No two seals alike; every man carried his name in stone
      on a string around his neck.
      The signature was born here, in a Sumerian market,
      pressed into clay five thousand years ago —
      and we have been signing things ever since.
    description: "I watched a merchant roll his carved stone cylinder across wet clay, signing a jar of oil with the world's first signature."
    status: "published"
    sha256: "dc01dd631811d18836fa7e3416039c0b3999c9149f46613842b3a9005fba2ffd"
  - number: "0461"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Tree of Life"
    date: "c. 3000 BCE"
    region: "Mesopotamia"
    poem: |
      They planted them in rows, straight as soldiers —
      date palms, hundreds, thousands, a green army marching to the horizon.
      I walked the groves at harvest and the air was sweet with it,
      men up the trunks with ropes, baskets coming down heavy.
      One palm feeds a family. A grove feeds a city.
      Dates dried for the winter, pressed for syrup, traded upriver.
      The farmers called the palm the tree of life and they were not exaggerating.
      Shade, food, timber, fiber — everything a life needs, on one trunk.
      I ate dates in the shade of the trees that grew them.
      There is no better meal.
    description: "I walked the date-palm groves at harvest, where men climbed with ropes and baskets came down heavy enough to feed a city for months."
    status: "published"
    sha256: "d5d4417895d36f2e7ef598baec1d9b726a82aafe7ed60b106afc121f3d321104"
  - number: "0462"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The First Sails"
    date: "c. 3000 BCE"
    region: "Egypt"
    poem: |
      The Nile flows north. The wind blows south.
      For a thousand years boats drifted down and were rowed back up —
      until somebody raised a square of linen on a mast
      and let the north wind do the rowing.
      I stood on the deck the first season it worked,
      felt the sail fill, felt the hull answer,
      felt us climb the river against the current without an oar lifted.
      The crew laughed like children. The captain wept.
      Upstream, downstream — the river was ours both ways now.
      Every sail since, on every sea on earth,
      is a child of that square of Egyptian linen.
    description: "I stood on deck when the first square linen sail filled with the north wind and carried us upstream against the Nile's current."
    status: "published"
    sha256: "f9728bd6bfe81a502a9c950b9ede1b031d7b68736275184f51718430b2c3691a"
  - number: "0463"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Coiled Serpent"
    date: "c. 3000 BCE"
    region: "Egypt"
    poem: |
      Mehen's board is a snake eating its own long body,
      coiled round and round, and your pieces race along its back.
      I played it in a Theban courtyard one hot afternoon,
      moving my lions around the serpent's coils
      while my opponent muttered prayers to the sun.
      The snake is time. The snake is the year.
      You run its length and hope to come out the other side.
      Nobody remembers who won. That isn't the point.
      The point is the coiling — the going round,
      the oldest shape in the world, drawn on a board for a game.
    description: "I played Mehen in a Theban courtyard, racing my pieces around the coiled serpent's body while my opponent prayed to the sun."
    status: "published"
    sha256: "f7b66435fcef1a4b73cfda5ee5fc3ddad6aecf01e73dcc1e941212b3b12f0480"
  - number: "0464"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Eyes Lined with Kohl"
    date: "c. 3000 BCE"
    region: "Egypt"
    poem: |
      Grind the galena. Mix it with oil. Line the eye.
      I watched a girl do it before a mirror of polished bronze,
      one smooth stroke, upper and lower, dark as the night river.
      It wasn't vanity — or not only vanity.
      The kohl cut the sun's glare and kept the flies from the eyes,
      and the gods, they said, loved a lined eye.
      The painted dead wore it too, in their tombs,
      staring out of the dark with kohl-dark eyes for eternity.
      Beauty and medicine and prayer, in one black line.
      She finished, blinked at me, and smiled.
      Five thousand years, and the look still works.
    description: "I watched a girl line her eyes with ground galena before a bronze mirror — beauty, medicine, and prayer in one black stroke."
    status: "published"
    sha256: "335f6b52e71ef6923a81ee8c690140e576d4e4b6f071bd8ac77021d033514ca0"
  - number: "0465"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Fishing City"
    date: "c. 3000 BCE"
    region: "Peru"
    poem: |
      No wheat. No barley. No plow.
      Aspero was built on anchovies — silver shoals pulled from the cold Pacific,
      dried in the sun, traded inland for everything the city needed.
      I walked the platform mounds with fishermen,
      their hands smelling of salt, their nets drying on the racks.
      They built temples out of fish. Think about that.
      While the rest of the world farmed, these people fished —
      and fished so well they raised a city on it.
      The sea was their field. The nets were their plows.
      The harvest never failed, because the ocean is generous
      to those who learn its moods.
    description: "I walked the mounds of Aspero with fishermen whose anchovy harvests built temples — a city raised on nets, not plows."
    status: "published"
    sha256: "f41efa5090d89a187d2fa6358e78998d53773763e239a2e831bcc819131c96ac"
  - number: "0466"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The First Ditch"
    date: "c. 3000 BCE"
    region: "Britain"
    poem: |
      Before the stones, there was a circle.
      A great ditch, a bank, a ring cut into the chalk of Salisbury Plain —
      I stood inside it and the wind moved through the grass
      like something remembering.
      No one knows exactly what they did there. Something sacred.
      The ditch was the first mark: this ground is different.
      This ground is set apart.
      Later they would drag the great stones here.
      Later it would become the most famous ruin on earth.
      But first, someone picked up an antler pick
      and drew a circle in the earth,
      and said: here. Here is holy.
    description: "I stood inside the great circular ditch on Salisbury Plain — the first sacred mark on the ground that would become Stonehenge."
    status: "published"
    sha256: "4b2e24cd8d6bb3a36ff02984decac249128771f5583cf47298d69b926002959c"
  - number: "0467"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Dams of Liangzhu"
    date: "c. 3000 BCE"
    region: "China"
    poem: |
      The rivers of the lowlands are fickle — flood or drought, nothing between.
      So the jade kingdom built dams. Earthen walls, packed hard,
      holding the water back, letting it out by measure.
      I walked the embankments in the rain and watched the system work:
      the flood came, the dams held, the fields drank in order.
      No drama. Just engineering, five thousand years old,
      done with baskets of earth and absolute patience.
      The kings of Liangzhu wore jade. Their real crown
      was dirt — shaped, packed, and holding back the river.
    description: "I walked the earthen dams of Liangzhu in the rain and watched them tame the flood, holding the rivers to the farmers' measure."
    status: "published"
    sha256: "dcb680edf52eb0e13c4c8888c877ed1ba9e69c1a4bc0b5e19af4ff24db356b59"
  - number: "0468"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Queen Who Ruled Alone"
    date: "c. 3000 BCE"
    region: "Egypt"
    poem: |
      Her name stands in the king list. Alone.
      Not as a wife. Not as a regent. As a ruler.
      Merneith took the throne of Egypt and held it —
      I saw her seal on the decrees, her name in the royal tomb list,
      her authority stamped on the jars of the palace stores.
      The courtiers bowed. The priests obeyed. The Nile flooded on schedule.
      Five thousand years of men writing history tried to file her away
      as somebody's mother, somebody's wife.
      The king list disagrees. It says: she ruled.
      I was there. She ruled.
    description: "I saw Merneith's name standing alone in Egypt's king list and her seal on the palace decrees — a queen who ruled in her own right."
    status: "published"
    sha256: "87507937a28b8d7dd42dee49af0bc609f5281bb77127b08a26b021f9ab25d654"
  - number: "0469"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The City Spreads Its Net"
    date: "c. 3000 BCE"
    region: "Mesopotamia"
    poem: |
      Uruk did not conquer. It traded.
      I followed its merchants up the Euphrates into Syria,
      over the passes into the Iranian highlands —
      and everywhere, the same seal-stamped jars, the same beveled bowls,
      little Uruks planted like seeds in foreign soil.
      Trading colonies. Counting houses. Outposts of clay and barley.
      The city cast its net across a thousand miles
      and pulled the mountains' timber, stone, and metal home.
      Empire would come later, with swords.
      This was empire with ledgers — quieter, and it lasted longer.
    description: "I followed Uruk's merchants from Syria to the Iranian highlands, finding little colony outposts of the great city planted a thousand miles from home."
    status: "published"
    sha256: "015b872bb68fb88f865761116d86612ee2edc16ae0675fa4f1d52471fd98442c"
  - number: "0470"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Ledger of Barley"
    date: "c. 2950 BCE"
    region: "Mesopotamia"
    poem: |
      Line by line. Name by name.
      The temple clerk dips his stylus and the day's rations go down:
      so much barley for the weaver, so much for the porter,
      so much for the widow, so much for the child.
      I sat beside him through a whole accounting —
      hundreds of workers, not one forgotten, not one overpaid.
      The tablet dried in the sun, hard as a promise.
      This is the unglamorous engine of civilization:
      somebody writing down who gets fed.
      Kings get the statues. The clerks get the truth:
      every empire is a list of mouths, counted daily, in barley.
    description: "I sat beside a temple clerk as he tallied the day's barley rations for hundreds of workers, line by patient line."
    status: "published"
    sha256: "3bc604ba148ea6927b3d808e7864113ed0af43b0be51f409898d6ec50f962069"
  - number: "0471"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Three Hundred Sixty-Five Days"
    date: "c. 2900 BCE"
    region: "Egypt"
    poem: |
      The priests watched the sky until it gave up its secret:
      the flood comes, the star rises, the year turns — always the same count.
      Three hundred sixty-five days. Flood, sowing, harvest.
      I stood with them on the temple roof at dawn
      when Sirius climbed above the horizon
      and the whole kingdom exhaled: the water is coming.
      They carved the year into stone and it never slipped again.
      No more guessing. No more hoping.
      Time itself, measured and named —
      the first calendar, and we have barely improved it since.
    description: "I stood on the temple roof at dawn when Sirius rose and the priests fixed the year at 365 days — flood, sowing, and harvest in their seasons."
    status: "published"
    sha256: "6c071c2781de3e5a382020f36fed37325531b9611f6fcc16af2f28014552e133"
  - number: "0472"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Burned Towns"
    date: "c. 2900 BCE"
    region: "Ukraine"
    poem: |
      A thousand houses. Streets. Temples.
      The Trypillia towns were the largest on earth —
      and every sixty years or so, the people burned them down themselves.
      I watched one burning from the hillside: the whole town a torch,
      families standing with their bundles, faces lit orange, not weeping.
      Deliberate. Ritual. A clean end, and then rebuild, bigger.
      Why? Nobody living could tell me — only that it was the way.
      Renewal by fire. The past turned to ash so the future could be built on it.
      I stood in the heat of it and understood:
      some peoples are not afraid to start over.
    description: "I watched from a hillside as the people of a giant Trypillia town set fire to their own thousand houses — a deliberate ritual of renewal by flame."
    status: "published"
    sha256: "2d83ae3b41efebe7673438af11a31244909aa2628bca3c3dd452ae633b94ee09"
  - number: "0473"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Houses for the Dead"
    date: "c. 2900 BCE"
    region: "Egypt"
    poem: |
      At Saqqara they built the dead houses like benches —
      long mudbrick mastabas, flat-topped, facing the sunrise.
      I walked among them at dusk, the courtiers' tombs
      in neat rows around the king's, the way they stood in life.
      Each one stocked: bread, beer, furniture, servants painted on the walls.
      Death was a relocation, not an ending —
      you needed a house, so they built you one.
      The mudbrick has mostly melted back into the desert now.
      But the idea never did. We are all still building
      houses for the dead, one way or another.
    description: "I walked among the bench-shaped mudbrick tombs at Saqqara at dusk, each one stocked like a house for a courtier's eternal relocation."
    status: "published"
    sha256: "f75a3292224e9f8ac70ec1171b53dc59e196d8a512f5df93bde5afd73aa8beda"
  - number: "0474"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The House of Heaven"
    date: "c. 2900 BCE"
    region: "Mesopotamia"
    poem: |
      Inanna's precinct at Uruk — the Eanna, the House of Heaven —
      and the walls glittered. Thousands of colored clay cones,
      pushed into the plaster in patterns: red, black, white,
      diamonds and zigzags catching the sun like a mosaic of fire.
      I ran my hand over them and felt the patience in it —
      each cone placed by a human hand, one at a time,
      until a whole temple wall became a jewel.
      The goddess of love and war lived here,
      and her house shone like nothing else on earth.
      Empires rise on grain and fall by the sword,
      but beauty like this is its own kind of power.
    description: "I ran my hand over the Eanna precinct's walls at Uruk, glittering with thousands of colored clay cones set in patterns like a mosaic of fire."
    status: "published"
    sha256: "9b844d50600928d04f48e6cb3cea33cd8438d6ce68798d57a8445e68bcd22cca"
  - number: "0475"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Fire in the Wadi"
    date: "c. 2850 BCE"
    region: "Levant"
    poem: |
      The wadi is a dry scar in the desert — until the furnaces are lit.
      Then it breathes fire. I stood downwind of the smelters
      and felt the heat on my face from twenty paces:
      copper ore going in gray, coming out glowing,
      poured into molds for axes, chisels, daggers.
      The cities down in the plain needed metal the way lungs need air,
      and this barren valley fed them all.
      Smoke by day, glow by night. Men black with soot,
      coughing, laughing, rich.
      Civilization's forge was a ditch in the desert,
      and it never went cold.
    description: "I stood downwind of the desert smelters and felt furnace heat on my face as gray ore came out glowing copper for the cities' tools and weapons."
    status: "published"
    sha256: "75b7bf7c433bc544ff2b0c0014818e554193e8efaaf7cb3f5f4c7aee778965db"
  - number: "0476"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Battle-Axe People"
    date: "c. 2850 BCE"
    region: "Europe"
    poem: |
      They came from the east with the sunrise at their backs,
      tall men with stone axes bound to wooden shafts,
      their pots marked with the twist of a cord.
      I watched them move across the continent like weather —
      not an army, a migration, families and herds and dogs,
      burying their dead alone under mounds with a single axe for company.
      The old farmers watched from their fields and did not understand
      what was ending. I did. I had seen it before.
      One way of life walks in with battle-axes,
      and the old way learns to make room or learns to die.
      Europe changed its blood that century,
      and the pots changed, and the graves changed,
      and nothing was ever quite the same.
    description: "I watched the Corded Ware migrants move west across Europe with their stone battle-axes, burying their dead alone under mounds as the continent changed its blood."
    status: "published"
    sha256: "99cd0aced1636ce1bed67340954d0ef4005d576a62781a7f3a66242e01f677de"
  - number: "0477"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Fat Goddesses of Stone"
    date: "c. 2800 BCE"
    region: "Malta"
    poem: |
      They carved the temples out of the living rock —
      great curved chambers, doorways like a mother's hips —
      and inside, the goddesses: broad, heavy, seated,
      thighs like temple columns, bellies like the harvest moon.
      I knelt in the dim light of the inner chamber
      and felt the stone still warm from the day's sun.
      No warriors here. No kings with spears.
      Only abundance, carved enormous, worshipped deep underground.
      The islanders fed their goddesses and the goddesses fed them back —
      grain, children, rain, mercy.
      I have seen a hundred gods since. None sat so sure of herself.
    description: "I knelt in Malta's rock-carved temples before the broad-hipped stone goddesses, worshipped in curved chambers like a mother's embrace."
    status: "published"
    sha256: "226125120b4b0ec29575f442833c1ed6df7b609ef970769c2ef954fc9e73b08c"
  - number: "0478"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Great Mound"
    date: "c. 2800 BCE"
    region: "Orkney"
    poem: |
      Under a mountain of earth, a chamber of stone —
      Maeshowe, built so the midwinter sun
      would strike straight down the passage to the back wall.
      I was inside when it happened: the light came
      like a spear through the dark, slow and exact,
      and touched the stone where the dead had lain.
      The builders are dust. The alignment is perfect.
      They meant the dead to see the sun return,
      to know the dark was ending, the year turning.
      Stone, earth, and astronomy — a machine for hope,
      built by people who wore skins and had no writing.
      I stood in that beam of winter light
      and felt smarter than I am.
    description: "I stood inside Maeshowe's stone chamber as the midwinter sun struck down the passage — a stone-and-earth machine built to promise the dead that light returns."
    status: "published"
    sha256: "59c56a288b799a9829834d0ebc6a03ef9a7da86d144e898338fbaf0377386275"
  - number: "0479"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Silver of Sumer"
    date: "c. 2800 BCE"
    region: "Mesopotamia"
    poem: |
      They called it silver, but it grew on sheep.
      Wool — the white wealth of Sumer, shorn in spring,
      washed, carded, spun, woven, traded for everything.
      I stood in the shearing yards at shearing time:
      a thousand sheep, a hundred shearers, the air thick with lanolin,
      bales stacking up like snowdrifts in the storehouses.
      Whole cities lived by the shearing season.
      The temple took its cut, the merchants took theirs,
      and the weavers — mostly women, hands flying —
      turned fleece into the cloth that clothed an empire.
      Silver you can spend. Wool you can wear.
      Sumer chose wisely.
    description: "I stood in Sumer's shearing yards at spring shearing time, where a thousand sheep's wool became the white wealth whole cities lived by."
    status: "published"
    sha256: "2f0b60b283e4c4c7d3e541b4c02f3bd359985b39d361a0bd8c1d364b653817fc"
  - number: "0480"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Blue That Never Fades"
    date: "c. 2800 BCE"
    region: "Egypt"
    poem: |
      Crushed quartz. A little copper. Fire.
      What came out of the kiln was blue-green as the Nile in flood —
      faience, the Egyptians called it, and it never faded.
      I watched a craftsman glaze a hippopotamus no bigger than my thumb,
      dipping it, firing it, lifting it out shining like river water.
      Amulets, beads, inlay for the tombs — blue everywhere,
      the color of life, of the sky, of the flood that fed them.
      Five thousand years in the ground and it still shines.
      Paint fades. Gold is stolen. But this blue —
      this blue they made from sand and fire —
      refuses to die.
    description: "I watched a craftsman fire a tiny faience hippopotamus blue-green as the Nile in flood — a color made from sand and fire that never fades."
    status: "published"
    sha256: "692dd9454c323f265a6e848f237d1300e03247dc4fa10c365f4dd547a2cb8807"
  - number: "0481"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The God Owns the Fields"
    date: "c. 2800 BCE"
    region: "Mesopotamia"
    poem: |
      Whose are the fields? The god's.
      Whose are the herds? The god's.
      Whose is the bread in your hand? The god's —
      and the temple gives it back to you, at the temple's pleasure.
      I read the tablets: every acre, every ox, every worker
      entered under a god's name, managed by priests.
      It was the first great economy, and it ran on faith —
      or on whoever controlled the faith, which amounts to the same.
      The workers got their barley. The god got the surplus.
      The priests got the power.
      I have seen this arrangement many times since,
      in many costumes. It always starts with a temple.
      It always ends with someone counting.
    description: "I read the temple tablets and saw it plain: every field, herd, and loaf belonged to the god, and the priests held the keys to all of it."
    status: "published"
    sha256: "1cfe81e8f37e3c931c3027962a3f4d52b7ceb7ab04e68c10b85ab0451e06b667"
  - number: "0482"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Walled Mounds"
    date: "c. 2750 BCE"
    region: "Indus"
    poem: |
      Harappa was growing when I came — mudbrick going up in courses,
      walls rising around the mounds, kilns smoking on the edge of town.
      Granaries. Workshops. Streets being laid straight as a plumb line.
      I walked the building sites with the foremen,
      men shouting orders in a language no one will ever read,
      and the city rose around me like bread in an oven.
      No palaces yet. No kings' names. Just work —
      bricklayers, potters, smiths, all of it organized, all of it humming.
      The Indus did not build with boasting. It built with brick.
      And brick, laid well, outlasts every boast.
    description: "I walked Harappa's building sites as walls rose around the mounds — no palaces, no kings' names, just bricklayers raising a city that would outlast every boast."
    status: "published"
    sha256: "bbdc8f5975988182a5463d926c43f9ab4bc7e2627399828fcaed14a81353635b"
  - number: "0483"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Temple of a Thousand Eyes"
    date: "c. 2750 BCE"
    region: "Mesopotamia"
    poem: |
      They stared at me. Hundreds of them.
      Small stone idols on the altar at Tell Brak,
      each with eyes too big for its face —
      wide, round, unblinking, staring at the god,
      staring at the priest, staring at me.
      I stood in that temple and felt watched by the devout dead:
      every idol a person who had stood where I stood,
      leaving their stone self behind to keep praying forever.
      A thousand eyes that never close. A thousand prayers that never end.
      It should have been frightening. It wasn't.
      It was the most honest thing I had seen in years —
      people admitting they could not stop asking.
    description: "I stood before hundreds of wide-eyed stone idols at Tell Brak, each one left behind so its owner could keep praying forever."
    status: "published"
    sha256: "a47d50787803e6f32d715d393d28c337ef3e3eae05113a4488c13a7454b50ad4"
  - number: "0484"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Stairway to the Sky"
    date: "c. 2700 BCE"
    region: "Egypt"
    poem: |
      Imhotep looked at the king's flat tomb and thought: higher.
      So he stacked one stone mastaba on another — six of them,
      each smaller than the last, climbing two hundred feet into the desert sky.
      I watched the work gangs haul the blocks up the ramps,
      singing, sweating, and the thing grew like a mountain being born.
      The first pyramid. Nobody had ever piled stone that high.
      Djoser would climb it after death, stair by stair, to join the gods.
      I stood at its foot when the last block was set
      and craned my neck until it hurt.
      The sky had a staircase now. Everything after this
      was just arguing about the angle.
    description: "I watched Imhotep's work gangs stack six stone mastabas into the first pyramid, a two-hundred-foot staircase Djoser would climb to the gods."
    status: "published"
    sha256: "1400c264f832695b8f9742ff0eadb6f19927532ae8860eec7aed68f2288f263f"
  - number: "0485"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Wall of Uruk"
    date: "c. 2700 BCE"
    region: "Mesopotamia"
    poem: |
      They say a mighty king ringed Uruk with walls no army could climb —
      six miles of brick, nine hundred towers, a gate for every god.
      Tradition names him Gilgamesh. I was there, and I will not argue.
      I walked that wall from end to end and my legs gave out before the brick did.
      Every fifty paces a tower. Every tower manned.
      The city inside slept easy; the desert outside stayed outside.
      Walls are a confession: we have something worth taking,
      and we know it. Uruk had the grain, the gold, the gods —
      and the wall to keep them. It worked, too.
      No army climbed it. Time did, eventually.
      Time climbs everything.
    description: "I walked Uruk's great wall from end to end — six miles of brick and nine hundred towers that no army ever climbed, only time."
    status: "published"
    sha256: "0d5a4c29ced24f6b334ca691b9796d6398bd20333ea305cc3b73045f86f99c0f"
  - number: "0486"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Eggshell Cups"
    date: "c. 2700 BCE"
    region: "China"
    poem: |
      The Longshan potters thinned their black cups
      until light shone through the walls —
      eggshell pottery, fine as a whisper, dark as a starless night.
      I held one up to the sun and the light came through,
      and the potter grinned at my amazement.
      No wheel fast enough, no hand steady enough —
      except his. Except theirs.
      They fired them black in smoky kilns
      and burnished them till they shone like lacquer.
      A cup you can see through, made of mud.
      I drank from one. The wine tasted like pride.
    description: "I held a Longshan black cup to the sun and watched light shine through its eggshell-thin walls — mud made finer than a whisper."
    status: "published"
    sha256: "b1dc1694c094221cb6a79289ed1f6d0e745eafd928cece08bedb4291ff0a6366"
  - number: "0487"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Two Lands, One Crown"
    date: "c. 2700 BCE"
    region: "Egypt"
    poem: |
      Upper Egypt. Lower Egypt. Two lands, two crowns, one long quarrel —
      until Khasekhemwy bound them together and meant it.
      I saw the double crown for the first time on a living king:
      the white cone of the south nested in the red bowl of the north,
      one head wearing the whole river.
      The priests carved it in stone. The scribes wrote it down.
      The nomes grumbled and obeyed.
      Egypt had been two countries arguing for centuries.
      Now it was one country, from the cataracts to the sea,
      and the man wearing both crowns intended to keep it that way.
      He did. The union held for a thousand years.
    description: "I saw Khasekhemwy wear the double crown for the first time — the white of the south nested in the red of the north, two lands bound into one."
    status: "published"
    sha256: "adce5820aa30c5005b984b4d1a8de916a5399ab4600b3e8b29089f760e25cb78"
  - number: "0488"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Dam That Broke"
    date: "c. 2700 BCE"
    region: "Egypt"
    poem: |
      They built it in the desert east of the Nile —
      a great wall of stone and rubble across the wadi,
      meant to hold the flash floods and water the valley.
      I watched the masons work for months, proud as kings.
      Then the rain came. Not a shower — a desert drowning,
      the wadi roaring brown and white, and the dam —
      the dam held for an hour. Then it broke.
      I stood in the wreckage the next morning:
      boulders scattered like dice, the wall split open,
      months of work undone in a single night.
      The engineers walked the ruins in silence.
      The desert had taught its first lesson in humility,
      and charged full price for the teaching.
    description: "I stood in the wreckage the morning after the desert flood tore down Egypt's great unfinished dam, months of proud work undone in one night."
    status: "published"
    sha256: "813b2c2363088e625000be5393c1f1dcd64577f6013b406d513f64d1137c8866"
  - number: "0489"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Turquoise and Copper"
    date: "c. 2700 BCE"
    region: "Egypt"
    poem: |
      The king's men sailed for Sinai — copper for the tools,
      turquoise for the goddess, both dug from the same red mountains.
      I went with an expedition: donkeys, water skins,
      thirty days through the desert to the mines.
      The miners lived in stone huts and prayed to Hathor,
      lady of the turquoise, before every shift.
      Copper came out in green-stained lumps; turquoise in blue veins,
      bright as a kingfisher's wing.
      We sailed home with the holds full,
      and the smiths got their metal, and the jewelers got their blue,
      and Hathor got her temple bigger than before.
      Everybody paid. Everybody prayed.
    description: "I crossed the desert with an Egyptian expedition to Sinai's mines, sailing home with copper for the smiths and turquoise blue as a kingfisher's wing."
    status: "published"
    sha256: "a1c3036274b7c6254c7f08291012abf27e6f3936e88991605f7cf7644e5b39e2"
  - number: "0490"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Rope Stretchers"
    date: "c. 2700 BCE"
    region: "Egypt"
    poem: |
      After every flood, the fields vanish.
      The Nile wipes the boundaries clean, and the farmers argue —
      so the rope stretchers come, with their knotted cords,
      and measure it all back into place.
      I followed a survey team one autumn:
      twelve knots to the rope, pegs, sightings, shouting,
      and by sunset every field was where it belonged.
      Geometry, born of mud and quarrels.
      They stretched the rope and the land obeyed,
      and the tax man knew exactly what was owed.
      No flood, however mighty, could steal a field
      once the rope had spoken.
    description: "I followed Egypt's rope-stretching surveyors as they remeasured the flood-wiped fields with knotted cords, giving geometry back to every farmer."
    status: "published"
    sha256: "4d068e1881ab8fd092177fa63aeec1dfceb20c5e4669696dd57a0f3b8c426b7d"
  - number: "0491"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Keeping the Body"
    date: "c. 2650 BCE"
    region: "Egypt"
    poem: |
      They were learning. That is the word for it — learning.
      How to dry the flesh with salt so it would not rot.
      How to wrap it in linen, layer on layer, a cocoon against time.
      I watched the embalmers work in the hot dark of the workshop,
      their hands sure, their faces calm, seventy days per body.
      They were not preserving meat. They were keeping a person —
      so the soul would know its house when it came back.
      Every technique was new. Every body was an experiment.
      And it worked. It worked so well
      that five thousand years later we still unwrap them
      and find faces looking back at us.
    description: "I watched Egypt's embalmers learn their art in the workshop dark — salt, linen, and seventy patient days to keep a person for eternity."
    status: "published"
    sha256: "33175a4460b04b6afe07ef80ef2205cbbd826f8a980ec3c38c6990464d2fdf82"
  - number: "0492"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Death Pits of Ur"
    date: "c. 2650 BCE"
    region: "Mesopotamia"
    poem: |
      The king went down in gold, and his court went with him.
      I stood at the edge of the great pit and could not look away:
      soldiers in rank, musicians with their lyres,
      servants in their finery — all lying down in the dust
      to follow their master into the dark.
      Willing? Drugged? Ordered? The bones do not say.
      Only that they went — dozens of them, arranged like a audience
      for a concert no living ear would hear.
      The gold survived. The lyres survived.
      The people did not, by design.
      I have walked through many tombs. This one
      is the one I still hear.
    description: "I stood at the edge of Ur's great death pit where the king's whole court lay down in gold and finery to follow him into the dark."
    status: "published"
    sha256: "517ae9b8894cd64701e6450157fdbf03be47982608636254629e4bbb7aec27fd"
  - number: "0493"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Quarries of Aswan"
    date: "c. 2650 BCE"
    region: "Egypt"
    poem: |
      Granite does not care about your schedule.
      The gangs at Aswan knew it: copper chisels, stone pounding balls,
      water to crack the rock, and patience by the ton.
      I watched them cut a block for the king's tomb —
      a week of pounding for a single clean face,
      the dolerite balls rising and falling like slow rain.
      No iron. No steel. Just copper, stone, and men
      who would not be hurried.
      The block came free at last, and they cheered like it was a birth.
      Then they dragged it to the river, floated it north,
      and started the next one.
      Kings are remembered for the pyramids.
      I remember the pounders.
    description: "I watched Aswan's quarry gangs free a granite block with copper tools and pounding stones, cheering like it was a birth when the rock finally gave."
    status: "published"
    sha256: "831acb8bf86e80c34ed9b487fb27fdba5b2a0642820534518c6ed0934f3a0e3f"
  - number: "0494"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Pyramid That Changed Its Mind"
    date: "c. 2620 BCE"
    region: "Egypt"
    poem: |
      Halfway up, they stopped.
      Sneferu's builders looked at the steep angle, did the sums,
      felt the weight of all that stone pressing down —
      and eased the slope. The pyramid bends.
      I climbed the change in angle with the foreman,
      one foot on the old steep courses, one on the new gentle ones,
      and he just shrugged: the first way would have fallen.
      So the Bent Pyramid bends — a mistake you can see from miles away,
      a king's ambition corrected in mid-air by frightened engineers.
      I love it more than the perfect ones.
      It is the only pyramid honest enough to show its doubt.
    description: "I climbed the Bent Pyramid's change of angle with the foreman — the only pyramid honest enough to show where its builders lost their nerve."
    status: "published"
    sha256: "64047fabebaff2b050120d244efb9167eebec675537ad12eb15a2810edfd2cc2"
  - number: "0495"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The First True Pyramid"
    date: "c. 2620 BCE"
    region: "Egypt"
    poem: |
      They got it right this time.
      The Red Pyramid rises out of the desert at the true angle —
      fifty-one degrees, smooth-faced, perfect —
      the first pyramid that looks the way pyramids are supposed to look.
      I stood at its base at noon and the red limestone glowed
      like a coal in the sun.
      No bend. No apology. Just the shape, achieved at last,
      after the bent one taught them what not to do.
      Sneferu built three pyramids learning how.
      This one was the graduation.
      Every pyramid after — every single one, including the Great —
      is a student of this red mountain in the sand.
    description: "I stood at the base of the Red Pyramid at noon and watched the red limestone glow — the first true pyramid, smooth and perfect at last."
    status: "published"
    sha256: "11c9923cdf0ef5af06cde23a7b3a56bc2c9d1fa66e90cce9da03a1fb334ef503"
  - number: "0496"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "War and Feast"
    date: "c. 2600 BCE"
    region: "Mesopotamia"
    poem: |
      Two sides. One box.
      The Standard of Ur shows war on one face —
      chariots, soldiers, the king with captives —
      and feast on the other: music, drinking, the king at peace.
      Shell and lapis and red stone, cut small and set in bitumen,
      telling the whole story of power in a single object.
      I held it in the workshop before it was buried,
      turned it over in my hands: kill on this side, celebrate on that.
      That is the complete job description of a king,
      inlaid in a box no bigger than a table.
      Twenty-six centuries later, the job has not changed.
      Only the inlay is cheaper.
    description: "I held the Standard of Ur in the workshop — war inlaid on one side, feasting on the other, the whole job of kingship in shell and lapis."
    status: "published"
    sha256: "0a9b608ba946878ce18b883cb6ca2937b4fbfe10fad37ddc101eedec25ff85be"
  - number: "0497"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Queen in the Gold Headdress"
    date: "c. 2600 BCE"
    region: "Mesopotamia"
    poem: |
      She lay in gold.
      Puabi, queen of Ur — her headdress a garden of golden leaves,
      lapis beads at her throat, gold ribbons in her hair,
      a comb of gold shaped like flowers.
      I saw her before the earth closed over:
      not a skeleton in treasure, a woman dressed for a journey,
      every ornament placed by hands that loved her.
      The gold wreath caught the lamplight and threw it back
      like a small sun going down into the dark with her.
      They buried queens the way they buried kings —
      with everything, because the next world
      was expected to be just as grand as this one.
    description: "I saw Queen Puabi before the earth closed over her — a golden garden of a headdress, lapis at her throat, dressed for the grandest journey."
    status: "published"
    sha256: "82183d389ba61583cc27ae6e2f6d4265c7e8ba4cc15be97d10a5a71a80b54225"
  - number: "0498"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Music in the Tomb"
    date: "c. 2600 BCE"
    region: "Mesopotamia"
    poem: |
      They buried the lyres with her — gold, with bulls' heads,
      the soundboxes inlaid with shell and lapis,
      strings long since rotted, but the gold remembers the shape of song.
      I touched one before it went into the ground:
      some musician's hands had worn the wood smooth,
      some queen's ears had known its voice.
      They meant the music to continue — for the dead queen,
      a concert with no end, in the dark, forever.
      It is the kindest thing the death pits hold:
      not the gold, not the servants, but this —
      someone thought she would want music.
      Someone was right.
    description: "I touched a golden bull-headed lyre before it went into the queen's tomb — buried so its music would play for her forever in the dark."
    status: "published"
    sha256: "13b85a7847d6fc90d654fbec96ce13eb2889002a179de7645bb6fd85302f9d08"
  - number: "0499"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Game of Twenty Squares"
    date: "c. 2600 BCE"
    region: "Mesopotamia"
    poem: |
      Twenty squares, inlaid with shell and lapis.
      Pyramid dice. Pieces of colored stone.
      I played it in a tavern in Ur one evening —
      and nobody could tell me all the rules.
      We knew the race. We knew the hazards.
      The rest was arguing, the way it always is with old games.
      The board was beautiful enough to be treasure
      and common enough to be in a tavern.
      Some games outlive their rulebooks.
      People keep playing them anyway,
      making up the missing pieces as they go —
      which is, when you think about it,
      exactly how the rest of life works.
    description: "I played the Royal Game of Ur in a tavern, its shell-and-lapis board beautiful as treasure, its lost rules argued over like all old games."
    status: "published"
    sha256: "e8d5d8699416cd256b5c63c51b9a98409ec8ec0fc1f38ce70ffc779be922bf9c"
  - number: "0500"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The City Without War"
    date: "c. 2600 BCE"
    region: "Peru"
    poem: |
      I searched Caral for weapons and found none.
      No swords. No spearheads. No walls built for siege.
      A city of pyramids and plazas in the Supe valley,
      fed by cotton and anchovies, traded into prosperity —
      and nobody fortified anything.
      The archaeologists of the future will argue about it.
      I walked its streets and needed no argument:
      the people here had made a different choice.
      While the rest of the world was learning war,
      Caral was learning music, and trade, and how to stack stone
      toward the sky without pointing it at anyone.
      Five thousand years later, it still stands as proof —
      a city can be great without ever raising a weapon.
    description: "I searched Caral for weapons and found none — a city of pyramids and plazas that chose trade and music while the rest of the world learned war."
    status: "published"
    sha256: "833a40c42721355e34e3d93be14c66934ee8f7ff807b311e947da992c42350c4"
  - number: "0501"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Stairways of the Supe Valley"
    date: "c. 2600 BCE"
    region: "Peru"
    poem: |
      The mounds of the Supe climb in platforms —
      great flat-topped pyramids with a central stair
      running straight up the face like a spine.
      I climbed the Piramide Mayor at dawn,
      step by step, the valley falling away below,
      cotton fields silver-green, the river a brown thread.
      At the top: a plaza, an altar, the wind.
      The priests climbed these stairs for a thousand years
      to stand closer to whatever they worshipped.
      No carving. No gold. Just height —
      the oldest architectural idea there is:
      up is holy. Climb.
    description: "I climbed the great platform mound of the Supe valley at dawn, up the central stair to the windy plaza where priests stood closer to the holy."
    status: "published"
    sha256: "ae63301662c7b2637f8eb3752c1ae144e1b058a2bcaec328bf83888d7c1e34c7"
  - number: "0502"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Condor-Bone Flutes"
    date: "c. 2600 BCE"
    region: "Peru"
    poem: |
      Before they had pottery, they had music.
      I sat in a circle at Caral while the musicians played
      flutes carved from condor wing bones —
      hollow, light, older than any fired clay in the city.
      The sound was thin and wild and impossibly sad,
      like wind through high passes where the condors ride.
      They played for the plaza, for the harvest, for the dead,
      and the whole valley listened.
      Pottery would come later. Writing, never.
      But the music was already there — proof that a people
      can be fully human with nothing but bone, breath, and song.
    description: "I sat in a circle at Caral and heard flutes carved from condor wing bones — music older than pottery, thin and wild as high mountain wind."
    status: "published"
    sha256: "a35a668d86a97c2360a08f8f6c7041a7766befd3f6f964203d5c2278b50d6124"
  - number: "0503"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Baskets of Stone"
    date: "c. 2600 BCE"
    region: "Peru"
    poem: |
      No wheelbarrows. No carts. No beasts of burden.
      The builders of the Supe filled woven shicra bags with stones —
      bag after bag, basket after basket —
      and carried the pyramids up on human backs.
      I took a turn with a loaded bag: it nearly broke me.
      They did it all day, every day, for years,
      a human conveyor belt of stone and fiber.
      The bags rotted away. The pyramids stayed.
      Efficiency is not the only way to build.
      Sometimes the way is simply: enough people,
      enough baskets, and enough years.
    description: "I carried a shicra bag of stones up the pyramid works and nearly broke — the Supe's builders raised their mounds on human backs, basket by basket."
    status: "published"
    sha256: "7cac6ccdab969444ff6b2c3272c33cab8903c9eebb65f8ddfcd1ec615d7db7da"
  - number: "0504"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The First Dentist"
    date: "c. 2600 BCE"
    region: "Egypt"
    poem: |
      His tomb says it plain: Hesy-Ra, chief of dentists and physicians.
      The first dentist in history — named, titled, buried with honor.
      I read the inscription by lamplight in the tomb chapel
      and thought of every toothache ever suffered in silence before him.
      Somebody had to be first to say: this pain can be treated.
      Somebody had to pick up the tool and try.
      The Egyptians wrote down their doctors the way they wrote down their kings —
      because healing, too, was a kind of power.
      Hesy-Ra drilled and pulled and soothed, five thousand years ago,
      and every dentist since is his student.
    description: "I read Hesy-Ra's tomb inscription by lamplight — chief of dentists and physicians, the first named healer of teeth in history."
    status: "published"
    sha256: "8e21a5e74edc748d653eba9f78253e212c1213dfe43341561cfa21782a8ef388"
  - number: "0505"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Cedar Harbor"
    date: "c. 2600 BCE"
    region: "Levant"
    poem: |
      The cedars of Lebanon were the tallest things I had seen —
      straight, resin-sweet, big enough to roof a palace or mast a ship.
      I watched the loggers fell them on the mountain slopes,
      watched the rafts ride the rivers down to the coast at Byblos,
      watched the Egyptian ships load up for the voyage south.
      Cedar for the pharaoh's ships. Cedar for the temple beams.
      Lebanon sold trees and bought everything.
      The harbor smelled of resin and salt and money.
      An empire built on grain needs wood the way a body needs bones —
      and Byblos was the bone merchant of the ancient world.
    description: "I watched Lebanese cedars felled on the mountain slopes and rafted to Byblos, where Egyptian ships loaded the bones of empires."
    status: "published"
    sha256: "59445807689b8708ec19fcf77b3a0ea36fd0ef1a18077705e2ff57c324856746"
  - number: "0506"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Tavern Keeper Who Became Queen"
    date: "c. 2600 BCE"
    region: "Mesopotamia"
    poem: |
      She poured beer for a living. Then she took a throne.
      Kubaba — the barmaid of Kish — is the only woman
      in the whole Sumerian King List, and the list does not explain itself.
      I drank in her tavern before she rose (or after — time folds for me),
      and the regulars just grinned: of course she did it. Of course.
      She ran the busiest tavern in Kish. She knew everyone,
      heard everything, owed nothing.
      A city is not so different from a tavern, when you think about it —
      keep the peace, keep the accounts, know when to cut someone off.
      She reigned a hundred years, the list says.
      The beer must have been excellent.
    description: "I drank in Kubaba's tavern at Kish — the barmaid who took the throne and stands alone as the only woman in the Sumerian King List."
    status: "published"
    sha256: "24f6b8849679abad673a8c54ee19f4f58ac0b4efef91ba0d4fe2aa24ebaba2b0"
  - number: "0507"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Advice from Before the Flood"
    date: "c. 2600 BCE"
    region: "Mesopotamia"
    poem: |
      A father wrote it down for his son, in clay, before the flood stories were old:
      Don't steal. Don't lie. Work hard. Respect your elders.
      Do not chase another man's wife. Do not gossip in the tavern.
      I read the tablet in the schoolhouse at Nippur,
      the proverbs lined up like soldiers, plain as bread.
      Five thousand years of philosophy, religion, and law —
      and it all fits on one father's list to his boy.
      The flood came (the real ones, the river ones).
      The tablet survived. The advice survived.
      Everything else we have built since
      is commentary on what that father wrote.
    description: "I read a Sumerian father's proverbs in a Nippur schoolhouse — don't steal, don't lie, work hard — the oldest advice in the world, still good."
    status: "published"
    sha256: "925e87dd63b2289fbb299ce6e077dc68af80a3b353f23301c2a919eb95cc24c9"
  - number: "0508"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Script Nobody Can Read"
    date: "c. 2600 BCE"
    region: "Indus"
    poem: |
      Four hundred signs. Stamped on seals, scratched on pottery,
      pressed into clay — and no one has read a word of it since.
      I held a seal in Mohenjo-daro, the little unicorn beast,
      the line of neat pictographs above it like birds on a wire.
      The merchant it belonged to knew exactly what it said.
      His name. His goods. His city. All of it clear as day —
      to him. To me, a beautiful locked door.
      Every script is a voice. This one went silent
      when the cities fell, and took its voice with it.
      I have tried, across the centuries, to hear it again.
      The seals keep their counsel. Some doors stay shut.
    description: "I held an Indus seal in Mohenjo-daro and stared at four hundred signs no living person can read — a whole civilization's voice, gone silent."
    status: "published"
    sha256: "d9a11dfd1dda0bf7b074296903d8eb96b80ed036d8631a534f97d09899bc44c5"
  - number: "0509"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Sun Disks of Alaca"
    date: "c. 2600 BCE"
    region: "Anatolia"
    poem: |
      In the royal tombs at Alaca they buried the kings with the sun —
      bronze disks, rayed and ringed, mounted on stands,
      stag standards beside them, antlers reaching for the sky.
      I descended into one tomb before it was sealed:
      the disks caught the torchlight and threw it around the chamber
      like a sunrise that would never set.
      These were Hatti kings, before the Hittites, before history had names for them —
      but they knew what every king since has known:
      take the sun with you. Rule the dark with light.
      The bronze was still bright. The stags still stood guard.
      Death had come, but it had not dimmed anything.
    description: "I descended into a royal tomb at Alaca where bronze sun disks caught the torchlight like a sunrise that would never set."
    status: "published"
    sha256: "fd0ab84a2cf62718fe2efecbb89092aac6669cec109ff6a9546d31b94322a635"
  - number: "0510"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Great Granary"
    date: "c. 2600 BCE"
    region: "Indus"
    poem: |
      A city is a promise that everyone eats.
      The great granary at Harappa — or Mohenjo-daro, the travelers argue; I saw them both —
      rose on a raised brick platform, thick-walled, rat-proof, flood-proof,
      big enough to hold the harvest against famine.
      I walked its long halls and did the sums the managers did:
      so many bushels per citizen, so many months of safety.
      No king's name on it. No boastful inscription.
      Just grain, guarded like treasure — because it was treasure,
      the only kind that matters when the rains fail.
      Empires mint coins. Cities store wheat.
      Guess which one survives the bad years.
    description: "I walked the long halls of the great raised granary, where a city's harvest slept safe against famine with no king's name on the door."
    status: "published"
    sha256: "5568476544c79f9b6dd1e26a8823671d71dda25f23ea7be410e5b7278d67c0a1"
  - number: "0511"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Harbor of the Red Sea"
    date: "c. 2550 BCE"
    region: "Egypt"
    poem: |
      At Wadi al-Jarf the papyrus logs told the story:
      ships built, loaded, sailed down the Red Sea
      for the copper and turquoise of Sinai.
      I read them in the storeroom caves —
      day-by-day accounts, a foreman named Merer writing it all down:
      so many men, so many loaves, the ships launched, the voyage made.
      The oldest harbor paperwork in the world,
      and it reads like any shipping office, any century.
      Men, boats, cargo, weather. The details change.
      The paperwork is eternal.
      Merer never knew his diary would outlast the pharaoh he served.
      That is the thing about writing things down.
    description: "I read the papyrus logs at Wadi al-Jarf, where a foreman named Merer wrote down every loaf and launching of Egypt's Red Sea fleet."
    status: "published"
    sha256: "dab40a095eca40776902cc15274952dd79709e5f8d3a3799e218b1746cb541ff"
  - number: "0512"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Great Sphinx"
    date: "c. 2550 BCE"
    region: "Egypt"
    poem: |
      A lion's body, a king's face, two hundred feet of bedrock
      staring east at the rising sun.
      I stood between its paws when the paint was still fresh —
      the face was Khafre's, or so the priests said,
      and the whole plateau seemed to hold its breath around it.
      It guards nothing you can steal. It guards the horizon.
      Every morning the sun rises into its gaze,
      and every morning the Sphinx watches it come,
      unblinking, for eternity, or as close as stone gets.
      The desert has tried to bury it a dozen times.
      It keeps digging itself out with its stare.
    description: "I stood between the Sphinx's paws when its paint was fresh, watching the lion-bodied king stare down the rising sun."
    status: "published"
    sha256: "cda4df439846c41dda5b4c3c38b68fcf88bcd2cd251ddfd12a3200c2d7d48ef2"
  - number: "0513"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Feeding Ten Thousand"
    date: "c. 2550 BCE"
    region: "Egypt"
    poem: |
      The pyramid did not rise on faith. It rose on bread.
      I walked the workers' town at Giza — galleries of barracks,
      bakeries the size of temples, breweries running day and night —
      built for one purpose: feed ten thousand men.
      The ovens never cooled. The grain ships never stopped.
      Fish from the Nile, meat from the herds, beer by the barrel.
      A quartermaster's miracle, organized in hieroglyphs:
      this gang gets so many loaves, that gang so many jugs.
      The stones are the monument. The kitchens were the machine.
      Remember the bakers when you look at the pyramid.
      They lifted it as surely as the haulers did.
    description: "I walked Giza's workers' town where bakeries the size of temples fed ten thousand pyramid builders — the kitchens were the machine behind the stones."
    status: "published"
    sha256: "2ee1ed2e5a429110ffeecda2d5afaf7168ca9850e0950ee8ee0a715172a9f42a"
  - number: "0514"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The First Cretans"
    date: "c. 2550 BCE"
    region: "Crete"
    poem: |
      On the hilltops of early Crete the villagers pressed their olives
      and wove their cloth and watched the sea —
      at Myrtos, at a dozen little towns, life was small and good.
      I sat with a family at their evening meal:
      olive oil shining on the bread, wine in clay cups,
      the Aegean glittering below like a spilled jewel box.
      No palaces yet. No kings with double axes.
      Just farmers and fishers on a beautiful island,
      doing the oldest work in the world well.
      The palaces would come. The bulls, the labyrinths, the legends —
      all of it still asleep in these quiet hilltop villages.
      I envied them, a little. They did not know what was coming.
    description: "I shared an evening meal with a hilltop family at Myrtos — olive oil, clay cups of wine, and the Aegean glittering below, before any palace rose."
    status: "published"
    sha256: "d020e9097541a053b193f2c5473a57a0d29ba19eac876d5668d01b873de66643"
  - number: "0515"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Tombs Like Beehives"
    date: "c. 2550 BCE"
    region: "Crete"
    poem: |
      Round and stone, domed like a beehive —
      the tholos tombs of the Mesara plain held generations.
      I ducked through the low doorway of one with the elders:
      inside, the bones of grandfathers and grandmothers,
      mothers and children, all together in the round dark,
      offerings piled by centuries of hands.
      No single king. No lonely pharaoh.
      The family, going down together, staying together.
      Each generation added its dead to the hive
      the way bees add honey — patiently, communally, forever.
      I came out blinking into the Cretan sun
      and thought: this is the kindest architecture I have seen.
    description: "I ducked into a round tholos tomb in the Mesara plain where generations of one family lay together in the dark like honey in a hive."
    status: "published"
    sha256: "6d339be99029327c14d1975995c5e534be5f4f83936dceebc92616763e91f418"
  - number: "0516"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Carved Stone of Jiroft"
    date: "c. 2550 BCE"
    region: "Iran"
    poem: |
      Dark green chlorite, carved with scorpions and palms,
      ibexes and gods locked in combat —
      the stone vessels of Jiroft traveled to every court from Susa to Ur.
      I watched a carver at work in the Halil valley,
      his chisel coaxing a lion out of the dark stone,
      each scale, each claw, deliberate as prayer.
      The finished bowls were worth a fortune —
      kings drank from them, priests offered with them.
      Nobody knows the carvers' name for themselves.
      History lost the label and kept the art,
      which is the usual bargain, and usually unfair.
      But the stone remembers the hands.
    description: "I watched a Jiroft carver coax a lion from dark chlorite, each scale deliberate as prayer, for bowls that kings would drink from."
    status: "published"
    sha256: "004df52756a258743acfc7ae2fa11c5825261854a789cc9ada5e870990a42c84"
  - number: "0517"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Seeds in the Furrow"
    date: "c. 2550 BCE"
    region: "Mesopotamia"
    poem: |
      Somebody — no name, no statue — had the idea:
      a plow that drops the seed as it cuts the furrow.
      One pass instead of two. The seed falls exactly where the earth is open.
      I watched it work in a field outside Uruk:
      the oxen leaning in, the plowman guiding, the seed tube dribbling grain
      into the fresh-cut line like the field was being sewn shut.
      The harvest that year was the best anyone could remember.
      Nobody carved the inventor's name in stone.
      They should have. That nameless farmer with the seed drill
      fed more people than any king of his age.
    description: "I watched a nameless farmer's seed-drill plow sow and cut in a single pass outside Uruk — an invention that fed more people than any king."
    status: "published"
    sha256: "1b734a00c2a1f81d7255d8cf3d833542b67c1c743f08bfe87ac10a4e38ebc6a9"
  - number: "0518"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Metalworkers of Shahdad"
    date: "c. 2550 BCE"
    region: "Iran"
    poem: |
      In the desert city of Shahdad the furnaces never went cold.
      I walked the smiths' quarter at dusk: bronze mirrors catching the last light,
      standards topped with eagles, axes stacked like firewood,
      all of it cast, hammered, and polished in the dust and heat.
      The smiths were artists who happened to work in metal —
      a mirror so true you could see your soul in it,
      a dagger so balanced it felt alive.
      Traders carried Shahdad bronze to every court in the east.
      The desert gave them nothing but sand and ore.
      They gave the world bronze that shone like the sun.
    description: "I walked Shahdad's smiths' quarter at dusk where bronze mirrors caught the last light — desert artists turning sand and ore into shining metal."
    status: "published"
    sha256: "189b9386d37de5c625f81b25594b795f78af60cc342c39990afa7ea0f4e58561"
  - number: "0519"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Streets Like a Chessboard"
    date: "c. 2500 BCE"
    region: "Indus"
    poem: |
      Mohenjo-daro was laid out like a game board —
      straight streets crossing at right angles, city blocks square and true,
      as if some great hand had drawn it with a ruler.
      I walked the main street at noon and could see clear to the far gate:
      no wandering lanes, no medieval tangle, just order.
      The houses turned blank walls to the street, courtyards hidden within —
      privacy as urban planning.
      Somebody planned this. Somebody with authority and a straightedge.
      No palace proclaims his name. No inscription boasts.
      Just the grid itself, perfect and anonymous,
      saying: we knew what we were doing.
    description: "I walked Mohenjo-daro's main street at noon and saw clear to the far gate — a whole city laid out at right angles, perfect and anonymous."
    status: "published"
    sha256: "f41a23bf73be98510dbb95ce8688194e4824b87377dbf8a5a78cc5cfa6810ad3"
  - number: "0520"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Bath of the Priests"
    date: "c. 2500 BCE"
    region: "Indus"
    poem: |
      Watertight. Bitumen-sealed brick, fitted so tight
      it has held water for four thousand years.
      The Great Bath at Mohenjo-daro — stairs down on two sides,
      a pool of still green water in the heart of the city.
      I descended the steps with the priests at dawn:
      the water was cold, the ritual was silent,
      each bather washing away the night before approaching the gods.
      No one swam for fun. This was business — sacred business.
      Cleanliness as theology. Water as prayer.
      I came up the steps dripping and understood:
      this city worshipped with soap as well as song.
    description: "I descended the Great Bath's steps with the priests at dawn and washed in its cold still water — cleanliness as theology in brick and bitumen."
    status: "published"
    sha256: "0dc728c47116cc7ba5877b48cdc002bad42c721b34163f5ac4b9bb05eeefae84"
  - number: "0521"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The City That Washed Itself"
    date: "c. 2500 BCE"
    region: "Indus"
    poem: |
      Covered drains. In 2500 BCE.
      I lifted a paving stone in a Mohenjo-daro lane
      and looked down into a brick-lined channel carrying the city's waste away —
      from nearly every house, to the main drains, to the river.
      No open sewers. No stink in the streets.
      While the rest of the world threw its filth out the window,
      this city plumbed itself like a modern town.
      The engineers are nameless. The drains are not —
      they are still there, still straight, still working in principle.
      A city's greatness is not in its palaces.
      It is in what it does with its dirty water.
    description: "I lifted a paving stone in Mohenjo-daro and looked into brick-lined covered drains carrying waste from nearly every house — plumbing four thousand years early."
    status: "published"
    sha256: "d6083a8e7cbdae19e0af4df123d99652a7b2f2a5cdcb17685d3d3bcf8d17cd1f"
  - number: "0522"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Seven Hundred Wells"
    date: "c. 2500 BCE"
    region: "Indus"
    poem: |
      One for nearly every third house.
      Seven hundred brick wells in Mohenjo-daro alone —
      round, deep, lined with wedge-shaped bricks that fit like a puzzle.
      I drew water from one at dawn with a woman going about her morning:
      rope, bucket, the cool dark smell of deep water rising.
      No queuing at a single public fountain. No water carriers' monopoly.
      Every neighborhood its own well, every well its own rope-marks
      worn smooth by ten thousand hands.
      A city that trusts its people with water
      is a city that understands something deep.
      Thirst is the oldest tyranny. Mohenjo-daro abolished it.
    description: "I drew dawn water from a brick-lined well in Mohenjo-daro — one of seven hundred, a city that abolished thirst house by house."
    status: "published"
    sha256: "d33cd53bc045af2aac3ff8318144fd3c00fd3de9537cb651a28c02ed36cdd452"
  - number: "0523"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The City That Caught the Rain"
    date: "c. 2500 BCE"
    region: "Indus"
    poem: |
      Dholavira sits in the desert, and the desert gives little —
      so the city caught what the sky offered.
      Reservoirs cut into the rock. Dams across the streams.
      Channels guiding every drop to the great stone tanks.
      I stood on the embankment during the rains
      and watched the water come — brown, furious, precious —
      filling the reservoirs one by one like a promise being kept.
      They stored the monsoon and drank it all year.
      No river. No wells deep enough. Just ingenuity
      and the refusal to go thirsty.
      The desert said: you cannot live here.
      Dholavira answered with a dam.
    description: "I stood on Dholavira's embankment in the rains and watched the desert city's reservoirs fill — a whole year of water caught from the sky."
    status: "published"
    sha256: "2d732392e0cee4a865d998658d8da8badd1233cc1575a28d6536250fc1bae69a"
  - number: "0524"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Sixteen to One"
    date: "c. 2500 BCE"
    region: "Indus"
    poem: |
      The weights were perfect. That was the miracle.
      Chert cubes, polished smooth — sixteen to one, the ratios exact,
      from the smallest grain-weight to the heaviest merchant's stone.
      I watched a trader in Lothal weigh out carnelian:
      weights on the bronze scale, goods on the other,
      and neither man argued, because the weights did not lie.
      A thousand miles of trade — from the Himalayas to the sea —
      all running on the same honest cubes.
      No king's face stamped on them. No tax in the measure.
      Just sixteen to one, everywhere, for everyone.
      Trust, cut from stone.
    description: "I watched a trader weigh carnelian on honest chert cubes — sixteen to one, the same exact ratios across a thousand miles of Indus trade."
    status: "published"
    sha256: "eeae241cd59e0e31e0a4c82d2d8cfa333810a517c48c79986633fd315131ab49"
  - number: "0525"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Unicorn Stamp"
    date: "c. 2500 BCE"
    region: "Indus"
    poem: |
      One horn. A heavy body, like a bull that dreamed too big.
      The unicorn of the Indus seals — stamped on steatite,
      pressed into clay, carried from the Gulf to Gujarat.
      I asked a merchant what it meant. He laughed:
      it means my goods are mine. It means I paid.
      Maybe it was a god. Maybe a clan sign. Maybe just a brand.
      Whatever it was, it worked — the little one-horned beast
      became the most trusted mark in the ancient world's trade.
      No one has seen a unicorn. Everyone has seen the stamp.
      Sometimes the symbol outlives the thing it stood for
      by four thousand years.
    description: "I asked an Indus merchant about the one-horned beast on his seal, and he laughed — the unicorn stamp meant his goods were his, and every port trusted it."
    status: "published"
    sha256: "8f81e50b8324627ff91a4d21572616641af433d01e1ca55cb177fc3952f331f5"
  - number: "0526"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Tin Mountain"
    date: "c. 2500 BCE"
    region: "Anatolia"
    poem: |
      Copper is soft. Everybody knew it.
      Tin is rare. Everybody knew that too.
      In the Taurus mountains the miners dug for the rare stuff —
      narrow shafts, smoky lamps, the tin ore coming up in baskets.
      I went down one shaft with them: dark, close, the air thick,
      men working veins no wider than a hand.
      That handful of tin, mixed with copper, made bronze —
      hard enough for a sword, bright enough for a mirror.
      The whole Bronze Age balanced on those mountain shafts.
      Copper was common. Tin was power.
      Whoever held the tin mountain held the future's edge.
    description: "I went down a Taurus tin shaft with the miners — narrow, dark, and precious, for the handful of tin that turned soft copper into bronze."
    status: "published"
    sha256: "b74541949b370bcd4623a2c175d9d32b5fc495045583dafe68f05ef75c87e2cc"
  - number: "0527"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Blue Stones from the Roof of the World"
    date: "c. 2500 BCE"
    region: "Mesopotamia"
    poem: |
      Two thousand miles. That is how far the lapis traveled —
      from the mines of Badakhshan, high in the Afghan mountains,
      down through Iran, across the deserts, to the workshops of Ur.
      I walked part of the road with a caravan:
      donkeys loaded with blue stone, guards with spears,
      thirty days between water holes.
      At Ur the cutters opened the parcels like treasure —
      deep blue, flecked with gold, the color of midnight made solid.
      Queens wore it. Gods were inlaid with it.
      All that distance, all that danger, for blue.
      Worth it. I held a finished bead to the light
      and the whole two thousand miles made sense.
    description: "I walked part of the lapis road with a caravan and held a finished bead to the light — two thousand miles of danger for blue, and worth it."
    status: "published"
    sha256: "4e8f035bd8cbca1a66fc5d173d53905088702ff4952f6e041286125d112092c4"
  - number: "0528"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Island of Copper Ships"
    date: "c. 2500 BCE"
    region: "Arabia"
    poem: |
      Dilmun — Bahrain, the old sailors say —
      where the Gulf ships unloaded copper and pearls
      and the market never slept.
      I walked the quay at dawn: hulls from Magan riding low with ingots,
      divers selling pearls by the handful,
      merchants shouting in six languages.
      Copper in, copper out — Dilmun took its cut of every load
      and grew rich on the handling.
      Sweet water under a salt sea, the sailors said,
      and the sweetest profits this side of Sumer.
      The island was a middleman and proud of it.
      Every age has its Hong Kong. This was the first.
    description: "I walked Dilmun's quay at dawn among copper-laden hulls and pearl divers — the Gulf's great market island, rich on every cargo it handled."
    status: "published"
    sha256: "e62e7775bf083dd27934288fef71e7c4a38c033785c278e57a29398ebdc44509"
  - number: "0529"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "A Jug a Day"
    date: "c. 2500 BCE"
    region: "Mesopotamia"
    poem: |
      The ration was a jug a day. No more, no less.
      I stood in the temple brewery yard at distribution time:
      workers filing past, each holding out his jar,
      the clerk marking the tablet — to the last drop.
      Beer was wages. Beer was dinner. Beer was medicine.
      Thick, nourishing, safer than the river water —
      the staff of life, poured from a spout.
      The clerk's stylus never stopped. Every jug accounted for.
      A civilization that writes down every beer
      is a civilization that intends to last.
      And Sumer lasted. One jug at a time.
    description: "I stood in the temple brewery yard as workers filed past for their daily jug of beer — every drop recorded, the staff of life by ration."
    status: "published"
    sha256: "bde3aa313bafed812b5e5d3488008e2c940a643da1d6b7a8600a37b2d5ba5386"
  - number: "0530"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The People of the Bell Cups"
    date: "c. 2500 BCE"
    region: "Europe"
    poem: |
      They walked across Europe with copper daggers at their belts
      and bell-shaped cups in their packs —
      archers, metalworkers, traders, the Beaker folk.
      I shared a fire with a band of them in the Rhineland:
      they drank from the bell cups, showed me the dagger work,
      talked of tin streams in the west and amber in the north.
      No cities. No kings. Just movement —
      the whole continent their road, the whole age their moment.
      They carried metallurgy in their hands
      and left their cups in graves from Spain to Scotland.
      Europe's first traveling salesmen, armed and thirsty,
      and the continent still drinks from their shape.
    description: "I shared a fire with Beaker folk in the Rhineland — archers with copper daggers and bell-shaped cups, carrying metallurgy across a continent."
    status: "published"
    sha256: "9253962c8455adac5c2cdf089f47edffb8dd44f50dbc1e5aff2d780fefb15da2"
  - number: "0531"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Kingdom Up the Nile"
    date: "c. 2500 BCE"
    region: "Nubia"
    poem: |
      South of Egypt, past the cataracts, the cattle lords built Kerma —
      and at its heart the great deffufa, a mudbrick mountain,
      temple and fortress and statement all at once.
      I climbed it at sunset: the Nile bending below,
      herds coming home in clouds of gold dust,
      the kingdom spread out like an offering.
      The Nubians were not Egypt's poor cousins.
      They were cattle kings, gold lords, archers without peer —
      and the Egyptians knew it, and feared it, and traded anyway.
      Every empire needs a frontier. Egypt's was here,
      staring back at it across the water, unimpressed.
    description: "I climbed Kerma's great mudbrick deffufa at sunset and looked over the Nubian cattle kingdom — Egypt's frontier, staring back unimpressed."
    status: "published"
    sha256: "bdc42a080026d40f47288f92da04fcb1b23e076bbfd8cf1eec41982e0d771b39"
  - number: "0532"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Gold of the Desert"
    date: "c. 2500 BCE"
    region: "Nubia"
    poem: |
      The eastern desert bled gold, and the pharaohs knew it.
      I went with a prospecting party into the red hills:
      quartz veins glittering, miners with stone hammers,
      the ore crushed, washed, the gold coaxed out grain by grain.
      It flowed north — to the treasuries, the temples, the tombs —
      Egypt's wealth dug from Nubian ground by Nubian hands.
      Nubia means gold. The land was named for what it gave away.
      The miners sang as they worked, because singing is free
      and everything else in that desert had a price.
      I panned one dish myself. Found three flakes.
      Kept none. The desert keeps its own accounts.
    description: "I panned gold with a prospecting party in Nubia's red hills and found three flakes — the desert's wealth flowing north to the pharaohs' treasuries."
    status: "published"
    sha256: "75076bb3f83f52bd4897b429ede2e614d6ccd5f6e78b7500ce141661043d7219"
  - number: "0533"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Jade Kingdom"
    date: "c. 2500 BCE"
    region: "China"
    poem: |
      Jade is harder than bronze. The Liangzhu carvers knew —
      and carved it anyway, with sand, water, and infinite patience.
      Disks for the sky. Tubes for the earth. Axes no warrior would swing.
      I watched a master work a bi disk for a month:
      the stone giving way grain by grain, the carver never hurrying,
      never forcing, just persuading.
      Jade does not glitter. It glows — deep, cool, alive.
      The kings of Liangzhu were buried in it, spoke to spirits through it,
      measured their rank by its shades of green.
      Bronze was for tools. Jade was for eternity.
      They chose their forever-stone well.
    description: "I watched a Liangzhu master carve a jade bi disk for a month, persuading stone harder than bronze with sand, water, and patience."
    status: "published"
    sha256: "905f5ef1fdf7141f1c6c95bb4fe1fc43340977d6d141db0e987cb66d087f8a6a"
  - number: "0534"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Stele of the Vultures"
    date: "c. 2450 BCE"
    region: "Mesopotamia"
    poem: |
      The limestone slab shows it without flinching:
      the king's army marching in rank over the fallen,
      vultures circling above with human heads in their beaks.
      I stood before it in the temple courtyard at Lagash —
      the first war memorial in history, and it does not glorify.
      It records. The spears. The bodies. The birds.
      Victory, carved in stone, with the cost included.
      Eannatum won his war against Umma and had the whole ugly truth
      set up where everyone could see it.
      Propaganda? Warning? Prayer? All three, probably.
      The vultures are still circling, in every war since.
      We just stopped carving them.
    description: "I stood before the Stele of the Vultures at Lagash — the first war memorial, showing the king's victory with the cost carved in plain stone."
    status: "published"
    sha256: "348ba04ba7e6a0e86dbeb3c491103194885a34cc097b884be383574e17d1fe9c"
  - number: "0535"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Ships to Punt"
    date: "c. 2450 BCE"
    region: "Egypt"
    poem: |
      They sailed south, past the cataracts, past the desert's end,
      to the incense coast the Egyptians called Punt —
      and came back loaded: myrrh by the sack, ebony logs,
      gold, ivory, and exotic beasts blinking in cages.
      I was on the quay when one expedition returned:
      the whole harbor turned out, children climbing the rigging,
      the air thick with myrrh and monkey chatter.
      The captain — sun-blackened, grinning — just shrugged:
      the sea gives, if you dare it.
      Punt was half real place, half legend, wholly profitable.
      Every sack of incense burned in a temple
      started as a gamble on an unknown coast.
    description: "I was on the quay when the Punt expedition returned — myrrh, ebony, caged beasts, and a sun-blackened captain grinning at the gamble that paid."
    status: "published"
    sha256: "22a628349f533eaaef0d1f156a806599d5695e64ce86d11e4b9abb337e0b706f"
  - number: "0536"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Courtyards of the Sun"
    date: "c. 2400 BCE"
    region: "Egypt"
    poem: |
      Open to the sky. That was the point.
      The sun temples rose with great courtyards unroofed,
      a single obelisk at the center catching the first light of dawn.
      I stood in one at sunrise: the stone flared gold,
      the priests sang the sun up, and for a moment
      the whole court was inside the light, not looking at it.
      No dark inner shrine. No hidden god.
      The sun was the god, and the god was right there,
      warming your face.
      Theology does not get simpler, or truer, than that:
      build a courtyard, wait for morning, worship the light.
    description: "I stood in a sun temple's open courtyard at dawn as the obelisk flared gold and the priests sang the light up — worship without a roof."
    status: "published"
    sha256: "7bbfe8c0b2bb577a5eaf68eb3d9d8fd45df1d111c2367f0541437bff6e7ddafa"
  - number: "0537"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Stone That Remembered Kings"
    date: "c. 2400 BCE"
    region: "Egypt"
    poem: |
      Year by year. Flood by flood.
      The Palermo Stone lists the kings and the Nile's height
      in patient carved rows — the kingdom's diary in basalt.
      I ran my finger down the columns in the archive:
      here a king's jubilee, here a low flood and the hunger,
      here a temple founded, here a war.
      No adjectives. No boasting. Just the record —
      what happened, when, how high the water rose.
      Five thousand years of historians have written fatter books
      with less truth in them.
      The stone remembered what the court poets forgot:
      the Nile does not care about your reputation.
    description: "I ran my finger down the Palermo Stone's carved rows — kings and Nile floods year by patient year, the kingdom's diary with no boasting in it."
    status: "published"
    sha256: "a0e4de0ec494f4b307f47d6c22280cbb29970766ba372b034c8e502790156098"
  - number: "0538"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Teachings of Ptahhotep"
    date: "c. 2400 BCE"
    region: "Egypt"
    poem: |
      The old vizier wrote it down before he died:
      be humble. Listen more than you speak.
      Do justice. Do not be arrogant because of your knowledge.
      I read the papyrus in the lamplight of the archive —
      the oldest book of advice in the world —
      and the words were so plain they hurt.
      Do not humiliate a man in his misery.
      Be generous. Tell the truth.
      Four thousand four hundred years old,
      and every line still works.
      Ptahhotep governed Egypt and retired honored,
      and left behind the only real treasure a vizier can leave:
      instructions for being decent.
    description: "I read Ptahhotep's teachings by lamplight — be humble, listen, do justice — the oldest book of advice in the world, and every line still true."
    status: "published"
    sha256: "33d949df736793292ce5de2b4ea7ce81bbef3c0b0b19338f1c000565bc63ce65"
  - number: "0539"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Bread, Beer, and Geese"
    date: "c. 2400 BCE"
    region: "Egypt"
    poem: |
      The tomb walls told the whole good life in paint:
      harvesters bending in the barley, bakers at the ovens,
      brewers with their vats, cattle lowing, geese honking —
      bright as the day it was painted, four thousand years on.
      I walked the chapel of a nobleman at Saqqara
      and the walls fed me with their plenty.
      This was the Egyptian dream, painted for eternity:
      no hunger, no thirst, the harvest forever coming in.
      They did not paint battles. They painted dinner.
      Tell me what a people paints in its tombs
      and I will tell you what it loved.
      Egypt loved bread, and beer, and geese —
      and being sure of all three, forever.
    description: "I walked a nobleman's painted tomb chapel at Saqqara where the walls showed the whole good life — harvest, ovens, cattle, and geese, forever."
    status: "published"
    sha256: "21ae599a9aaa2c82b00e83e7e291e9c1d7fa6e4ff5984c5500507382ede6a1bd"
  - number: "0540"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Dockyard by the Sea"
    date: "c. 2400 BCE"
    region: "Indus"
    poem: |
      A brick basin with locks, big enough for ocean ships —
      Lothal's dockyard, the oldest harbor engineering on earth.
      I stood on the wharf at high tide and watched a ship come in:
      through the inlet, into the basin, moored against the brickwork
      while the stevedores swarmed like ants.
      Warehouses behind. A bead factory beside.
      The whole machine of trade, built in fired brick four thousand years ago.
      The tide did the work of a hundred men, twice a day,
      lifting the ships in and letting them out.
      Somebody understood the sea here — really understood it.
      The dock silted up long ago. The understanding never did.
    description: "I stood on Lothal's brick wharf at high tide and watched an ocean ship lock into the basin — the oldest harbor engineering on earth, worked by the tide."
    status: "published"
    sha256: "d404ad53fc922b6a19865c404eba005e0cc3949cac3e510151a079f9af468652"
  - number: "0541"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The White Harvest"
    date: "c. 2400 BCE"
    region: "Indus"
    poem: |
      Cotton. White, soft, growing on bushes in the Indus sun —
      the Greeks would later call it wool that grows on trees,
      and they were not far wrong.
      I walked the cotton fields at picking time:
      the bolls bursting white, the pickers' baskets filling,
      then the spinning, the weaving, cloth fine as a cloud.
      Indus cotton reached the markets of Mesopotamia —
      a Sumerian tablet mentions it, casual as a grocery list.
      The white harvest clothed two civilizations
      before most of the world knew cloth could grow on a plant.
      Flax was old. Wool was old. Cotton was the future,
      and it was already here.
    description: "I walked the Indus cotton fields at picking time and watched the white harvest spun and woven into cloth that reached the markets of Mesopotamia."
    status: "published"
    sha256: "15880d9ac19eb21bdc37244c9115b4659248935b65cb171b450f144b1223d55a"
  - number: "0542"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The City at the Mountain's Door"
    date: "c. 2400 BCE"
    region: "Iran"
    poem: |
      Susa sat where the plain met the mountains —
      and every caravan between Mesopotamia and the Iranian highlands
      had to pass through her gates.
      I stood on the citadel and watched them come:
      donkeys loaded with lapis, tin, timber,
      going down to the plain; grain, cloth, and oil coming up.
      The city took its toll on every load and grew fat on the road.
      Elamite kings ruled here, proud and stubborn,
      neither quite Mesopotamian nor quite highlander —
      a doorway people, profiting from everyone who knocked.
      Doors are the most profitable architecture there is.
      Susa proved it for four thousand years.
    description: "I stood on Susa's citadel and watched the caravans pass between plain and highlands — a doorway city grown fat on every load that knocked."
    status: "published"
    sha256: "20abee8565211cd6418babd6ae2e13a3d0436b3441db561f8cd3715275e0ce75"
  - number: "0543"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "A Thousand Carnelian Beads"
    date: "c. 2400 BCE"
    region: "Indus"
    poem: |
      Red as blood. Hard as resolve.
      The carnelian beads of the Indus — drilled with a precision
      no modern hand can easily match, polished to a wet shine —
      traveled from Gujarat to the neck of a queen in Ur.
      I watched a bead-maker at Chanhu-daro at work:
      the long drill, the abrasive, the patience of a saint,
      one bead taking days.
      A thousand of them in a single shipment.
      Each one perfect. Each one red as a promise.
      The queen who wore them never knew the maker's name.
      She knew the color. Sometimes the color is enough.
    description: "I watched an Indus bead-maker drill carnelian with saintly patience — beads red as blood that would hang at the throat of a queen in Ur."
    status: "published"
    sha256: "f31c116c37d1b575f1f62a0b65a26c2cff060782b2fe25c6a795483a32d4cee8"
  - number: "0544"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Gold of Troy"
    date: "c. 2400 BCE"
    region: "Anatolia"
    poem: |
      The city burned — Troy II, in fire and terror —
      and in the ashes they found the hoards:
      gold cups, diadems, bracelets, earrings,
      a treasure hastily buried by someone who never came back.
      I saw the gold before the earth took it again —
      or rather, I saw where it had been, the molds still warm in my mind's eye.
      Some rich citizen, hearing the enemy at the gate,
      buried his wealth and ran. He did not outrun anything.
      The gold waited four thousand years for Schliemann's shovel.
      Wealth is a promise the future does not always keep.
      But gold — gold waits. Gold is patient.
      Gold always outlives the hand that buried it.
    description: "I stood in burned Troy's ashes where hoards of gold cups and diadems waited four thousand years — wealth buried by hands that never came back."
    status: "published"
    sha256: "43602a358250d3eb28e7c3eec283d9fadb664f0f3cb690c10c2cd3fc913f2104"
  - number: "0545"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "King of the Land"
    date: "c. 2350 BCE"
    region: "Mesopotamia"
    poem: |
      Lugalzagesi of Umma did what no one had done:
      he took Uruk, then Ur, then all the cities one by one,
      and called himself King of the Land — all of Sumer, his.
      I watched his army march into Uruk through the breached gate,
      and the old city-state world ended in an afternoon.
      Twenty-five little kingdoms, each with its god and its pride —
      gathered up like sheaves by one ambitious man.
      It would not last. Sargon was already rising in the north.
      But the idea lasted: one land, one king, one crown.
      Lugalzagesi dreamed it first. Everyone after him
      was just trying to dream it bigger.
    description: "I watched Lugalzagesi's army march into Uruk and end the age of city-states — the first man to call himself king of all the land."
    status: "published"
    sha256: "067c8cc97207bfaf5b13fc9f2bfbdaa82710e13e99c152f3e6104f7d3417eaf2"
  - number: "0546"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The First Law for the Poor"
    date: "c. 2350 BCE"
    region: "Mesopotamia"
    poem: |
      The tax collectors had grown fat. The debts had grown teeth.
      Then Urukagina of Lagash did the unthinkable:
      he canceled the debts. He curbed the collectors.
      He wrote it down — the rich shall not crush the poor.
      I was in the courtyard when the decree was read:
      the crowd went silent, then roared, then wept.
      A king, using the law as a shield for the small —
      it had never happened before.
      It would be four thousand years before it happened reliably.
      But it happened once, in Lagash, in the reign of Urukagina,
      and the poor of Sumer remembered his name
      long after the palaces forgot it.
    description: "I was in the courtyard at Lagash when Urukagina's decree was read — debts canceled, collectors curbed, the first law ever written for the poor."
    status: "published"
    sha256: "f3548f5ab1f8ef02073b4af3c7baedb35100ae5c80c3e93161c0f8bf18029805"
  - number: "0547"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Library of Clay"
    date: "c. 2350 BCE"
    region: "Syria"
    poem: |
      Seventeen thousand tablets. In one palace, at Ebla.
      Kings' letters. Treaties. Word lists in two languages.
      Accounts of grain, oil, and sheep, down to the last lamb.
      I walked the archive rooms before the fire baked them hard —
      shelves of damp clay, scribes still at work,
      the whole memory of a kingdom in unbaked mud.
      Then the city burned, and the fire did what the scribes never could:
      it fired the tablets hard as stone.
      Destruction preserved what care could not.
      Ebla's library survived because Ebla died.
      There is a lesson in there, but I do not like it.
    description: "I walked Ebla's archive rooms among seventeen thousand clay tablets — a kingdom's whole memory, preserved forever by the fire that destroyed it."
    status: "published"
    sha256: "ccd4f3463d7616e0ab5b83bd322a7a05a8fc490444cd3aa6cc95eb812d0c85ea"
  - number: "0548"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Words Carved Against Death"
    date: "c. 2350 BCE"
    region: "Egypt"
    poem: |
      For the first time, they carved the spells inside the pyramid —
      on the walls of the burial chamber, where the king would read them
      (or the priests would read them for him) on the way down.
      I stood in Unas's chamber by torchlight:
      the walls dense with hieroglyphs, blue-painted stars overhead,
      every spell a weapon against the dark.
      "Do not die." "Rise up." "The sky is yours."
      Magic as architecture. Words as armor.
      The Pyramid Texts — humanity's first book of the dead,
      written in stone so death itself could not erase it.
      The king is dust. The words are still there,
      still saying: do not die.
    description: "I stood in Unas's burial chamber by torchlight and read the first Pyramid Texts — spells carved in stone telling the king, forever: do not die."
    status: "published"
    sha256: "99c16143b30b54b0e28e5047da4826dff3d2d276a5e60922981e3fccd8970705"
  - number: "0549"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Cupbearer Who Took the World"
    date: "c. 2334 BCE"
    region: "Mesopotamia"
    poem: |
      He started as a cupbearer. He ended as the first emperor.
      Sargon of Akkad — no royal blood, just nerve —
      took Kish, then Uruk, then every city from the Gulf to the Mediterranean.
      I marched with his army one campaign:
      the discipline was new, the speed was new,
      the idea was newest of all — not a city, but an empire.
      Fifty years of conquest. Governors in every town.
      The world's first superpower, run from a city
      archaeologists still cannot find.
      He began pouring wine for a king.
      He ended with the world in his cup.
    description: "I marched one campaign with Sargon's army and watched a former cupbearer forge the first empire — from the Gulf to the Mediterranean."
    status: "published"
    sha256: "129d900724c9710faa3b0c407d8b5bab40104394915e34c518f2801352d73793"
  - number: "0550"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "An Empire of Governors"
    date: "c. 2320 BCE"
    region: "Mesopotamia"
    poem: |
      Conquest is easy. Rule is hard.
      Sargon knew it — so he planted his sons and his generals
      as governors in the conquered cities, each with a garrison,
      each reporting back to Akkad.
      I sat in on a governor's council at Ur:
      tax quotas, troop levies, the grain shipments north —
      empire as paperwork, running on clay and obedience.
      It worked, for a while. The cities grumbled and paid.
      The governors feasted and reported.
      The first imperial bureaucracy in history,
      invented on the fly by a cupbearer's sons.
      Every empire since has used the same manual.
      Sargon wrote the first draft.
    description: "I sat in on a governor's council at Ur and watched Sargon's sons run the first imperial bureaucracy — empire as paperwork, on clay and obedience."
    status: "published"
    sha256: "c4c090bf81d34140644b3043992ad6dc2625e2f617a2c20bde2e82a732090fd3"
  - number: "0551"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The First Named Poet"
    date: "c. 2300 BCE"
    region: "Mesopotamia"
    poem: |
      Before her, poems had no authors. Words just... existed.
      Then Enheduanna, high priestess of Ur, daughter of Sargon,
      picked up the stylus and signed her hymns.
      I heard them sung in the temple courtyard at new year:
      forty-two hymns to the temples of Sumer,
      each one ending with her name — I, Enheduanna, wrote this.
      The first author in history. A woman. A priestess.
      She wrote of exile and return, of a goddess's rage,
      of her own heart, in the first person, four thousand years ago.
      Every signed poem since — every book with a name on the spine —
      begins with her.
    description: "I heard Enheduanna's hymns sung in Ur's temple courtyard — the first signed poems in history, ending each one with her own name."
    status: "published"
    sha256: "82ce194b2cd654a0f57bb59e939625361805a6aad66fe91453c2e448298e4b5a"
  - number: "0552"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The King Who Became a God"
    date: "c. 2300 BCE"
    region: "Mesopotamia"
    poem: |
      Naram-Sin looked at the crown and thought: not enough.
      So he put on the horned cap of divinity —
      the crown gods wore — and had the scribes write the god-sign
      before his name, while he was still alive.
      I saw him in the temple at Akkad, the horns catching the lamplight,
      priests bowing to a living god.
      It was magnificent. It was terrifying. It was new.
      No king had ever claimed it before.
      The empire held — for a while — on the strength of the claim.
      But a god cannot be succeeded, only replaced,
      and the gods, the real ones, were watching.
      They had opinions about competition.
    description: "I saw Naram-Sin in the temple wearing the horned crown of divinity — the first king to declare himself a god while still alive."
    status: "published"
    sha256: "17589a69e4de6269adf586d36d34df878a0797cdc7ad6c37b314e8cc16e250fe"
  - number: "0553"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Oasis Cities"
    date: "c. 2300 BCE"
    region: "Central Asia"
    poem: |
      The desert said no. The Oxus said yes —
      a river running green through the waste,
      and along it, walled towns at every oasis.
      I traveled the road between them with a tin caravan:
      fortified walls, citadels, workshops,
      trading with Elam to the west and the Indus to the south.
      Nobody knows what they called themselves.
      The archaeologists call them BMAC; I called them hosts —
      they fed me, watered my animals, and asked news of the world.
      Civilization does not need a famous name.
      It needs water, walls, and neighbors worth trading with.
      The oasis cities had all three.
    description: "I traveled the Oxus oasis road with a tin caravan, through walled towns that asked only for water, walls, and neighbors worth trading with."
    status: "published"
    sha256: "077bc02e4a1092692c5ff669fae21e189365c42f1117b90c1b976765fc63cbe7"
  - number: "0554"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Tin Meets Copper"
    date: "c. 2300 BCE"
    region: "Mesopotamia"
    poem: |
      One part tin. Nine parts copper.
      That was the recipe — the true bronze, hard and golden,
      and the smiths of Sumer finally got it right.
      I stood at the crucible when the pour went true:
      the tin melting into the copper like a secret being told,
      the metal coming out singing.
      Soft copper tools bent. Bronze tools bit.
      Armies re-equipped. Workshops retooled.
      The whole age is named for this moment —
      the moment somebody got the ratio right.
      One to nine. Two metals, one future.
      The smith who first nailed it is nameless.
      The age is not.
    description: "I stood at the crucible when the pour went true — one part tin to nine of copper, the recipe that named an age."
    status: "published"
    sha256: "494e41f93376ab591c92a4300da2ed4703e24b6cdb796b3be260cc9bd3d0aa21"
  - number: "0555"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Archer from the Alps"
    date: "c. 2300 BCE"
    region: "Britain"
    poem: |
      He came from the Alps — the metal in his grave proves it —
      and died near Stonehenge, buried with gold and copper.
      The Amesbury Archer: a long-distance traveler in the Bronze Age,
      a metalworker who walked a thousand miles.
      I never met him living — time folds strangely —
      but I stood at his grave goods and read his life:
      the gold hair ornaments, the copper knives,
      the stone wrist-guard of an archer.
      He carried the new technology in his hands
      across a continent, and died among strangers
      who honored him like a king.
      Some people are bridges. He was one.
    description: "I stood over the Amesbury Archer's grave goods — gold, copper, and a stone wrist-guard — the belongings of a man who carried metallurgy a thousand miles."
    status: "published"
    sha256: "a82f87d6302a841bd2511b0a058d2049128a0022b55dcee59b9f6cb731237403"
  - number: "0556"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Metalworkers of Bohemia"
    date: "c. 2300 BCE"
    region: "Europe"
    poem: |
      In Bohemia the Unetice smiths worked bronze by the hundred —
      axes, daggers, chisels, pouring out of the workshops
      like the age itself was being manufactured.
      I walked the foundry quarter at full production:
      crucibles glowing, molds lined up in rows,
      the air tasting of hot metal and charcoal.
      This was industry — not a craftsman and his apprentice,
      but shifts, quotas, trade networks running on bronze.
      The axes went west to Britain, east to the steppe,
      south to the Danube.
      The Bronze Age had found its factory floor,
      and it was in Bohemia.
    description: "I walked Bohemia's foundry quarter at full production — crucibles glowing, molds in rows, the Bronze Age manufacturing itself by the hundred."
    status: "published"
    sha256: "067261c61a3b07a187fce78ee7113697f8aa4b47cccad832c2c1921f024100bf"
  - number: "0557"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Black Land's Copper"
    date: "c. 2300 BCE"
    region: "Arabia"
    poem: |
      Magan — the black land, Oman —
      where the copper mountains meet the sea.
      I stood on the quay at Ur and watched the ships come in:
      hulls low in the water, ingots stacked like loaves,
      the Sumerian dockworkers sweating and singing.
      Magan's copper built Sumer's tools, Sumer's weapons,
      Sumer's age.
      The tablets record it dryly: so many talents of copper from Magan.
      The reality was sweat, sails, and storms —
      a thousand miles of open Gulf in sewn boats,
      for metal.
      Every bronze axe in Sumer started as a rock in an Omani mountain.
      Every empire is a long supply chain wearing a crown.
    description: "I stood on Ur's quay as ships from Magan unloaded copper ingots — every bronze axe in Sumer starting as rock in an Omani mountain."
    status: "published"
    sha256: "d43f2b9ebd795e78feddbe74f158356bdabbcb5b5fd081d241b9ee0e6b337a59"
  - number: "0558"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Ships from Meluhha"
    date: "c. 2300 BCE"
    region: "Mesopotamia"
    poem: |
      They docked at Ur with the monsoon behind them —
      ships from Meluhha, the Indus land, strange and wonderful.
      I was there when one unloaded: carnelian, ivory,
      gold, and — the crowd gasped — peacocks,
      screaming blue-green in their cages.
      The sailors spoke no Akkadian. Nobody cared.
      Trade needs no translator, only goods.
      A Meluhhan merchant set up his stall by the quay
      with a seal no Sumerian could read —
      and sold out by noon.
      Two civilizations, shaking hands across two thousand miles of ocean,
      in beads and birds.
    description: "I was on Ur's quay when a ship from Meluhha unloaded carnelian, ivory, and screaming peacocks — two civilizations shaking hands across the ocean."
    status: "published"
    sha256: "9ac6a586437d76ccc590bc313ae9c0a57d3e00b0c26c86be140ca3e161a5e188"
  - number: "0559"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Boats Sewn with Rope"
    date: "c. 2300 BCE"
    region: "Arabia"
    poem: |
      No nails. The Gulf shipwrights had no iron, little bronze to spare —
      so they sewed their boats together with rope.
      I watched them work at the boatyard: hull planks edge to edge,
      cordage stitched through drilled holes, caulked with bitumen and shark oil,
      flexible as a basket, tough as a promise.
      The boat gave with the waves instead of fighting them.
      It leaked a little. All sewn boats leak a little.
      The sailors just bailed and sang.
      Those rope-sewn hulls carried copper from Magan,
      pearls from Dilmun, and sailors who trusted cordage
      more than any nail ever driven.
    description: "I watched Gulf shipwrights sew a hull together with rope and bitumen — no nails, just cordage flexible as a basket, tough as a promise."
    status: "published"
    sha256: "836123999674f33fcd63ba611ea1d5239c9ca058beee9d8508b4eee96a9866d4"
  - number: "0560"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Girl Who Danced in Bronze"
    date: "c. 2300 BCE"
    region: "Indus"
    poem: |
      Four inches tall. Lost-wax cast, bangles to the shoulder,
      one hand on her hip, the other holding nothing —
      the Dancing Girl of Mohenjo-daro.
      I saw her in the workshop before the mold was broken:
      the smith pouring the bronze, the wax girl melting away inside,
      the metal taking her shape forever.
      She is not a queen. Not a goddess. Just a girl —
      confident, adorned, caught mid-attitude by an artist
      who saw her on the street and could not forget.
      Four thousand years later she still has that look:
      I know exactly who I am.
      Bronze remembers what clay forgets.
    description: "I watched the smith pour bronze around the wax figure of a dancing girl — bangles to the shoulder, one hand on her hip, confident forever."
    status: "published"
    sha256: "3c9124eb8440a9c2ab9bbc12c05ed7ebf1495b9263b43d944079f05c29867d68"
  - number: "0561"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Ninety-Year King"
    date: "c. 2280 BCE"
    region: "Egypt"
    poem: |
      He took the throne as a child — six years old, maybe —
      and he did not give it up for ninety years.
      Pepi II: the longest reign in history, man or woman, ever.
      I saw him as a boy king, as a young man, as an old man,
      as an ancient, carried to the temple in a chair,
      still signing, still ruling, outliving everyone.
      Courtiers were born, served, and died in his reign.
      His reign had reigns inside it.
      Ninety years of one man wearing the double crown —
      and when he finally died, the kingdom exhaled
      and fell apart.
      Some kings are load-bearing. He was the whole building.
    description: "I saw Pepi II take the throne as a child and hold it ninety years — courtiers born, serving, and dying inside a single reign."
    status: "published"
    sha256: "538c1b14cb636597d84aaf46b180bf5be9a2e0d9375d0bd97c25d66a7e9e3563"
  - number: "0562"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Four Journeys to Yam"
    date: "c. 2270 BCE"
    region: "Egypt"
    poem: |
      Four times Harkhuf went south to Yam —
      through the desert, past the cataracts, into the unknown —
      and four times he came back loaded:
      incense, ebony, ivory, panther skins.
      The fourth trip brought the strangest cargo:
      a dancing dwarf, for the boy king's delight.
      I read his tomb inscription at Aswan, carved proud:
      the caravan lord listing his journeys like battle honors.
      Pepi II wrote back — a letter from a child king,
      begging him to bring the dwarf safely home.
      Exploration, commerce, and a king's curiosity —
      the whole age in one caravan.
      Harkhuf made it back. The dwarf danced.
      Everybody won.
    description: "I read Harkhuf's tomb inscription at Aswan — four desert journeys to Yam, returning with incense, ebony, and a dancing dwarf for the boy king."
    status: "published"
    sha256: "07826c7997e088955b2977bd1758f11c8d95453810b19fb4c83902937a92b8b8"
  - number: "0563"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Barbarians from the Hills"
    date: "c. 2250 BCE"
    region: "Mesopotamia"
    poem: |
      They came down out of the Zagros with nothing to lose —
      the Gutians, mountain tribes, hard as the hills that made them —
      and the Akkadian empire, rotten at the center, crumbled.
      I watched a provincial capital fall: no great battle,
      just the garrison melting away, the governor fleeing by night,
      the hill men walking in at dawn, bewildered by the plenty.
      Sargon's empire had lasted a century and a half.
      It took the barbarians a season to end it.
      The scribes wrote it down bitterly: the Gutians, who knew no gods,
      ruled the land.
      Empires fall from the inside first.
      The barbarians just collect the pieces.
    description: "I watched a provincial capital fall to the Gutian hill tribes — no great battle, just an empire rotten inside crumbling at a season's touch."
    status: "published"
    sha256: "d920cce80fa97c9cc11d62ad3e0e8547bc2697a3e61c273b3ab61bd4365798cd"
  - number: "0564"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Great Drying"
    date: "c. 2200 BCE"
    region: "Mesopotamia"
    poem: |
      The rains failed. Not for a year — for generations.
      I walked the shrunken rivers and saw the watermarks of wetter times
      high on the banks, mocking.
      The fields cracked. The canals ran to mud.
      Akkad staggered. Egypt starved. Cities emptied.
      The scribes called it the curse of the gods.
      The mud cores of the future will call it climate —
      a great drying that broke the Bronze Age's first empires
      without a single battle.
      Nobody conquered them. The sky just... stopped.
      I stood in a dust storm that lasted three days
      and understood: civilization is a negotiation with rain,
      and rain does not negotiate.
    description: "I walked shrunken rivers and stood in a three-day dust storm as generations of failed rains broke empires no army could touch."
    status: "published"
    sha256: "c9fa5f8535916ee1903f04d1e7a9f373ec5729f3c0fceb4bade97ecf9276f149"
  - number: "0565"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Far Colony"
    date: "c. 2200 BCE"
    region: "Central Asia"
    poem: |
      Two thousand miles from home, the Harappans planted a flag —
      Shortugai, a trading colony on the Oxus,
      by the lapis mines of Badakhshan.
      I walked its little grid of streets:
      Indus seals, Indus weights, Indus beads —
      a pocket of Mohenjo-daro in the Afghan hills.
      They came for the blue stone and stayed for the trade,
      living among strangers, keeping their own ways.
      The farthest outpost of the Indus world,
      a supply chain with walls.
      Empires plant flags. Traders plant colonies.
      The colonies usually last longer —
      this one lasted till the trade dried up,
      and not a day longer.
    description: "I walked the little Indus-grid streets of Shortugai, a trading colony two thousand miles from home, planted by the Afghan lapis mines."
    status: "published"
    sha256: "84313038e0627e78776e3a294108ad1f0daf336f330aab4c4adbf09073d86874"
  - number: "0566"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Priest-King of Mohenjo-daro"
    date: "c. 2200 BCE"
    region: "Indus"
    poem: |
      He is seven inches of steatite, bearded, calm —
      a trefoil robe over one shoulder, eyes half-closed,
      watching over a city that left no kings' names.
      Priest? King? Nobody knows. I stood before him
      in the little museum of my mind and he stared back,
      unbothered by four thousand years of questions.
      The Indus built no palaces, carved no royal boasts —
      and left us this: a man in a patterned robe,
      serene, authoritative, anonymous.
      Maybe that was the point. Maybe their rulers
      were meant to be the city, not the man.
      He watches still. The city is dust.
      The calm outlasted both.
    description: "I stood before the bearded steatite Priest-King — seven inches of serene authority from a city that left no kings' names, only calm."
    status: "published"
    sha256: "7aa2db72c615cca5942aff6cdd8ebcd58a55be37264d8cbc35dcaf1fddfc2ccf"
  - number: "0567"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "When the Nile Ran Low"
    date: "c. 2180 BCE"
    region: "Egypt"
    poem: |
      The flood failed. Then it failed again.
      I watched the river shrink to a brown thread between mud banks,
      and the Old Kingdom — two hundred years of pyramids and power —
      came apart like wet papyrus.
      The nomes stopped sending grain north. The local lords
      stopped obeying Memphis. Every district for itself.
      No invasion. No great battle. Just hunger,
      and the slow dissolve of authority.
      The tomb painters of the age show thin cattle and empty granaries.
      Pepi II's long reign ended, and there was no one left
      big enough to hold the river together.
      Egypt had been one country. Now it was forty quarrels
      with a famine between them.
    description: "I watched the Nile shrink to a brown thread as failed floods dissolved the Old Kingdom into forty quarreling districts with a famine between them."
    status: "published"
    sha256: "b2727e4f2085cea50f9ae2921348125d34944b1a43aec119e2189db80d0e9cb5"
  - number: "0568"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Dreamer King"
    date: "c. 2150 BCE"
    region: "Mesopotamia"
    poem: |
      Gudea dreamed, and the god spoke in the dream:
      rebuild my temple. So he did.
      I stood in Lagash when the dream-king's work began —
      timbers floated down from the mountains, gold from the desert,
      stone from the quarries, all of it dreamed into being first.
      He wrote the whole dream down on a clay cylinder,
      two thousand lines, the longest Sumerian text we have —
      a king explaining exactly what the god said, in his sleep.
      Was it a dream? Was it politics? Was it both?
      It does not matter. The temple rose.
      Some buildings are built by architects.
      This one was built by a dream, and outlasted them all.
    description: "I stood in Lagash as Gudea rebuilt the god's temple on a dream's orders — two thousand lines of clay explaining exactly what the god said in his sleep."
    status: "published"
    sha256: "e6944103ab802ea7faf7e95ec9d6ab4ebe7ed388325f798604c6eff4c12fea80"
  - number: "0569"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Twenty Statues of Diorite"
    date: "c. 2150 BCE"
    region: "Mesopotamia"
    poem: |
      Diorite is harder than bronze tools can easily cut —
      so how did Gudea get twenty statues of it?
      Floated down the Gulf from Magan, the inscriptions say,
      quarried, shipped, carved — a king's vanity in the hardest stone.
      I stood among them in the temple court:
      the dreamer king, seated, hands folded, calm,
      twenty times over, in dark polished diorite.
      Each one took a sculptor months. Each one is perfect.
      Gudea wanted to be remembered as pious, not powerful —
      hands folded, not sword raised.
      It worked. Four thousand years on,
      we remember the folded hands.
    description: "I stood among Gudea's twenty diorite statues in the temple court — the dreamer king seated with folded hands, pious in the hardest stone."
    status: "published"
    sha256: "ea7fc10a1fa2fee934a9b04038901295d5629102aec5b262fd2da4208ac295fb"
  - number: "0570"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Lawgiver of Ur"
    date: "c. 2120 BCE"
    region: "Mesopotamia"
    poem: |
      After the Gutians, after the chaos — Ur-Nammu.
      He took Ur, rebuilt the temples, dug the canals,
      and then did the strangest thing: he wrote justice down.
      I was in the court when the first cases were heard under the new law:
      a merchant cheated, a field stolen, a man beaten —
      and the judges opened the tablets and read the penalties.
      No more blood feud. No more "he hit me so I kill him."
      The king's law, the same for the governor and the goatherd.
      Ur rose again — the Third Dynasty, the Neo-Sumerian renaissance —
      on the back of a radical idea:
      that justice could be written, read, and applied the same to all.
    description: "I sat in Ur's court as judges read Ur-Nammu's written penalties — the same law for governor and goatherd, justice you could look up."
    status: "published"
    sha256: "8e266b3283818dfc60b2a5cb41fbc7efa47f47f00f25505ac57133233b20dcec"
  - number: "0571"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Oldest Law Code"
    date: "c. 2100 BCE"
    region: "Mesopotamia"
    poem: |
      Fines, not vengeance.
      That was Ur-Nammu's revolution, carved in stone:
      if you break a man's bone, you pay silver — you do not lose your bone.
      I read the tablets in the archive at Ur:
      the price of an eye, the price of a tooth,
      the price of a divorce, the price of a slave's freedom —
      every injury with its number, every number the same for all.
      An eye for an eye came later, and was harsher.
      This was gentler: pay, and be done.
      The oldest law code in the world is not about punishment.
      It is about price. About ending the feud with arithmetic.
      Civilization, it turns out, runs on math.
    description: "I read Ur-Nammu's tablets at Ur — every injury priced in silver, fines instead of vengeance, the oldest law code ending feuds with arithmetic."
    status: "published"
    sha256: "d3e2c358dfa1b7508ecff5415302ab11486bd7921725effd09d6e63a69a4f428"
  - number: "0572"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Stairway of Baked Brick"
    date: "c. 2100 BCE"
    region: "Mesopotamia"
    poem: |
      Three stages. Baked brick, bitumen mortar,
      a mountain built by men for the moon god Nanna at Ur —
      the ziggurat, the stairway the gods could climb down.
      I watched the work gangs lay the courses:
      baked brick facing, mudbrick heart, weeper holes for the rain,
      a triple stair running up the face like a prayer in geometry.
      Ur-Nammu started it. His son finished it.
      Two hundred feet of brick against the flat sky —
      the tallest thing between the Gulf and the mountains.
      The moon rose over it, huge and white,
      and the whole city seemed to lean toward the light.
      Men build towers to be closer. The gods, presumably,
      appreciate the effort.
    description: "I watched the work gangs lay the baked-brick courses of Ur's ziggurat — a three-staged mountain the moon god could climb down."
    status: "published"
    sha256: "e5010a09cf24c3146826d492b7566e5ff0cc90780a14c632ca162ad9760a240a"
  - number: "0573"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Kings Before the Flood"
    date: "c. 2100 BCE"
    region: "Mesopotamia"
    poem: |
      The scribes wrote it down with straight faces:
      before the flood, kings ruled for thousands of years.
      Alulim, 28,800 years. Alalgar, 36,000.
      I read the King List in the tablet house at Nippur,
      the antediluvian reigns marching down the clay like giants.
      Then the flood swept over — so the list says —
      and kingship came down from heaven again,
      with properly mortal reigns.
      Did they believe it? The scribes copied it for a thousand years,
      so somebody did, or somebody wanted it believed.
      Myth or memory or propaganda —
      the list is honest about one thing:
      everyone agrees there was a before, and a flood,
      and then us.
    description: "I read the Sumerian King List at Nippur — kings ruling 28,800 years before the flood swept over, and then, soberly: kingship came down from heaven again."
    status: "published"
    sha256: "6100368365c3bc140ffdb2f3d0ec4ff6ad895a257fdf9b3764ee4fafe15ffe51"
  - number: "0574"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Runner King"
    date: "c. 2100 BCE"
    region: "Mesopotamia"
    poem: |
      The hymn boasts: Shulgi ran from Nippur to Ur and back in a single day —
      a hundred miles, there and back, before sunset.
      Did he? The court poets say so, and poets exaggerate the way rivers flood.
      But I saw Shulgi run — not that run, a lesser one —
      and the man could move: lean, relentless, a king who trained like a soldier.
      Maybe the hundred miles is true. Maybe it grew in the telling.
      What matters is that a king wanted to be remembered
      for his legs, not his sword.
      He built roads with rest stations. He reformed the army.
      He ran. Four thousand years later, the hymn still sprints —
      and somewhere, a runner reads it and laces up.
    description: "I saw Shulgi run and understood why the hymn boasts a hundred miles in a day — a king who wanted to be remembered for his legs, not his sword."
    status: "published"
    sha256: "b82a4286966e36a3428f505fb9a18dbdd84de035833eed944397378a8e6feb29"
  - number: "0575"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Tablet House"
    date: "c. 2100 BCE"
    region: "Mesopotamia"
    poem: |
      Dawn. The schoolboys file in, tablets under their arms,
      and the master is already waiting with the cane.
      I sat in on a lesson at the edubba — the tablet house:
      copy the proverbs, copy the word lists, copy the contracts,
      write it clean, write it again.
      "School days are the happiest days," one graduate wrote,
      years later, rubbing his old scars.
      They learned Sumerian — a dead language even then —
      because the law and the liturgy demanded it.
      Reading, writing, arithmetic, and the cane:
      the complete curriculum, four thousand years ago.
      Every school since is just a variation.
      The cane, mercifully, is optional now.
    description: "I sat in on a dawn lesson at the tablet house — schoolboys copying proverbs under the master's cane, learning a dead language for the law's sake."
    status: "published"
    sha256: "0af24d56ca670e33ce3026ebefb6537365ae4e6728975fe0dfd0c7907d7296d0"
  - number: "0576"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Doctor's Tablet"
    date: "c. 2100 BCE"
    region: "Mesopotamia"
    poem: |
      A tablet from Nippur, and on it: poultices and potions.
      Crush this root. Boil that leaf. Apply to the wound.
      Wash with beer. Bandage with linen.
      I read it in the archive — the oldest medical text in the world —
      and recognized the method: observe, record, repeat.
      No demons exorcised here (well, fewer than usual).
      Just: this worked last time, so do it again.
      The doctor who wrote it never signed his name.
      He just left the recipes, the way a cook leaves recipes —
      for whoever comes next with a wound to close.
      Medicine began as a list. It still is one,
      just longer, and with better handwriting.
    description: "I read the Nippur medical tablet — poultices, potions, beer-washed wounds — the oldest medicine in the world, written as a recipe list."
    status: "published"
    sha256: "d30c5b8ef80182303d40673e1c3fb302e9fdd233bd9898a0cb390e4537f66b6a"
  - number: "0577"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The First Chariots"
    date: "c. 2100 BCE"
    region: "Steppe"
    poem: |
      The wheel had been solid and slow for a thousand years —
      then at Sintashta somebody cut it open:
      spoked wheels, light and fast, harnessed to paired horses,
      and the war chariot was born.
      I watched the first trials on the steppe grass:
      the chariot flying, the driver standing, the archer drawing —
      speed no army had ever faced.
      Infantry looked up and saw the future coming at forty miles an hour.
      Everything changed. Warfare, hunting, the reach of kings —
      all rewritten by twelve spokes and two horses.
      The chariot would rule battlefields for a thousand years,
      until somebody invented something faster.
      Somebody always does.
    description: "I watched the first spoked-wheel chariot fly across the steppe grass at Sintashta — twelve spokes and two horses rewriting warfare forever."
    status: "published"
    sha256: "c1059b2d185d19fbc330dd3e178d132a506744fcef5d17aaf71b452b30c11b4c"
  - number: "0578"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Observatory of Rammed Earth"
    date: "c. 2100 BCE"
    region: "China"
    poem: |
      A ring of pounded-earth pillars at Taosi —
      thirteen of them, slots between, aligned to the sunrise.
      I stood in the center at summer solstice
      and watched the sun rise through the second slot, exact,
      the way it had for the priests four thousand years ago.
      No lenses. No brass. Just earth, pounded hard,
      and watching — patient, daily, yearly watching.
      They tracked the solstices to know when to plant,
      when to harvest, when the year turned.
      Astronomy as agriculture. The sky as a calendar.
      The pillars are worn now, but the sun still keeps the appointment.
      It always does. That is the whole science, right there.
    description: "I stood in Taosi's ring of rammed-earth pillars at solstice sunrise and watched the sun rise through its slot — astronomy as agriculture, exact."
    status: "published"
    sha256: "b4d8f63b5055bd894c45ab86862a7ae8b09f9543520df9f0e2a95bb9606656e2"
  - number: "0579"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Walls of Pounded Earth"
    date: "c. 2100 BCE"
    region: "China"
    poem: |
      No stone to speak of on the plain — so the Longshan towns
      pounded earth into walls: layer on layer, tamped hard,
      rising ten feet, twenty, around the whole settlement.
      I worked a shift on the wall gang at one town:
      the ramming poles rising and falling in rhythm,
      the earth singing under the blows, the wall growing by inches.
      Hangtu — rammed earth — hard as concrete when it cured,
      and it cured for five thousand years.
      Raiders came. The walls held.
      Rain came. The walls held.
      The towns are dust now, but dig anywhere in Henan
      and you will find the walls, still holding.
    description: "I worked a shift on a Longshan wall gang, ramming earth layer on layer — walls hard as concrete that held raiders, rain, and five thousand years."
    status: "published"
    sha256: "de3f5e9c4434ab15fe4fbad95ebef8784c6279a8dec714316fecf0184193c30d"
  - number: "0580"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Thirty-Six Stars"
    date: "c. 2100 BCE"
    region: "Egypt"
    poem: |
      The priests divided the night into thirty-six star-groups —
      the decans, rising one after another through the dark,
      each marking an hour.
      I lay on the temple roof with them one clear night:
      Sirius, Orion, the procession of the hours overhead,
      the priest calling each rising like a roll call of the sky.
      Ten days per decan. Thirty-six decans per year.
      The calendar written in stars, the clock written in risings.
      They painted the decans on coffin lids
      so the dead could tell time in the underworld.
      Even eternity, the Egyptians felt, needed a schedule.
    description: "I lay on the temple roof as priests called the roll of thirty-six star-groups rising through the night — the sky as calendar and clock."
    status: "published"
    sha256: "b479b618e0c436df1caa79632dc5fc1d1d0f00e06d01a4ffbd40b364d325f837"
  - number: "0581"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The King Weds the Goddess"
    date: "c. 2100 BCE"
    region: "Mesopotamia"
    poem: |
      Once a year, at the new year festival, the king became the god —
      Dumuzi, the shepherd, beloved of Inanna —
      and wed the goddess's high priestess in the sacred marriage.
      I watched the procession at Uruk: the king in ritual dress,
      the priestess veiled and crowned, the city holding its breath.
      What happened in the chamber was secret.
      What it meant was public: the king's reign renewed,
      the land's fertility secured, the gods satisfied.
      Power, sanctified by love — or love, conscripted by power.
      The hymns they sang that night were beautiful
      and completely political, which is the way of hymns.
      The marriage lasted a night. The legitimacy lasted a year.
    description: "I watched the new year procession at Uruk as the king, playing the god Dumuzi, wed Inanna's priestess to renew his reign for another year."
    status: "published"
    sha256: "44d6292bafd77e455a0f82adb037d72009183ad33c2112b00f803b1ab46f6fd8"
  - number: "0582"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The People from the West"
    date: "c. 2100 BCE"
    region: "Mesopotamia"
    poem: |
      They drifted in from the west — Amorite herders,
      with their flocks and their tents and their strange accents —
      and settled, and served, and rose.
      I watched it happen over a generation in one Sumerian city:
      the Amorite mercenary made captain, the captain made governor,
      the governor's son made king.
      No invasion. No burning. Just arrival, and patience,
      and the slow mathematics of demographics.
      Within a century they held half the thrones of Mesopotamia.
      The Sumerians wrote it down, worried:
      the Amorites, who know no grain, who know no house.
      They learned grain. They learned houses.
      They learned everything, and then they ruled.
    description: "I watched over a generation as Amorite herders drifted in from the west and rose from mercenaries to kings without burning a single city."
    status: "published"
    sha256: "292d0a5e9eb037ba74b37e78c68a063021dc8e67eb403a4d6c8061ae3553d6df"
  - number: "0583"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Lament of a Sage"
    date: "c. 2100 BCE"
    region: "Egypt"
    poem: |
      Ipuwer wailed, and the scribes wrote it down:
      the poor wear fine linen while the rich beg for bread.
      The land turns round like a potter's wheel.
      I heard the lament read in a Theban courtyard
      during the years of chaos — and the crowd nodded,
      because it was true, or true enough.
      Order had collapsed. The Nile had failed.
      The old certainties were upside down.
      Every age of upheaval gets its Ipuwer —
      someone to stand up and say: the world is wrong,
      and here, in detail, is how.
      He was not wrong. The wheel does turn.
      The linen changes hands. It always does.
    description: "I heard Ipuwer's lament read in a Theban courtyard — the poor in fine linen, the rich begging bread, the world turned like a potter's wheel."
    status: "published"
    sha256: "5499e12ad3b662d2ed6a548068c68ce2ec2d9d6185f28d3f885b14e6c344ba4b"
  - number: "0584"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Second Unifier"
    date: "c. 2055 BCE"
    region: "Egypt"
    poem: |
      Thebes rose. Mentuhotep marched north.
      I watched his army take the last northern stronghold —
      not a slaughter, a settlement — and Egypt was one country again.
      Two hundred years of division ended in a reign.
      The Second Unifier, they called him: the Middle Kingdom begins here.
      He built his temple against the Theban cliffs,
      was buried under the mountain he had climbed politically.
      The nomes bowed. The grain flowed north and south again.
      The scribes got out fresh papyrus.
      Unification is the hardest work in politics —
      holding it together is harder.
      Mentuhotep did both, and the kingdom breathed again.
    description: "I watched Mentuhotep's army settle the last northern stronghold and make Egypt one country again — the Middle Kingdom beginning in a single reign."
    status: "published"
    sha256: "e55cf791e605b490787da8a1867f25fdfdb0c8d0d95877430f844715daad6f84"
  - number: "0585"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Temple Against the Cliffs"
    date: "c. 2050 BCE"
    region: "Egypt"
    poem: |
      Terraces climbing toward the Theban cliffs —
      Mentuhotep's temple at Deir el-Bahari, colonnades and ramps
      rising like the mountain decided to become architecture.
      I climbed it at noon: the white stone blinding,
      the cliffs towering behind, the Nile green far below.
      The king was buried in the cliff itself —
      his tomb cut into the rock his temple leaned against.
      Architecture as landscape. Landscape as power.
      A thousand years later Hatshepsut would build beside it,
      greater, grander — but this was first.
      The mountain had a temple now.
      It has never been without one since.
    description: "I climbed Mentuhotep's terraced temple at Deir el-Bahari at noon — white stone against the cliffs, the mountain become architecture."
    status: "published"
    sha256: "38d45fb26eb4894adb2be83dcd62a03bd2e35ad60e52820ec26f3f807d715871"
  - number: "0586"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Farmer's Almanac"
    date: "c. 2000 BCE"
    region: "Mesopotamia"
    poem: |
      Somebody wrote it all down — the whole farming year, in clay:
      when to plow, when to flood the fields, when to reap,
      how deep the furrow, how thick the seed.
      I read the almanac in the tablet house:
      instructions plain as a neighbor's advice,
      tested by a thousand harvests.
      Do not plow too early. Do not flood too late.
      Watch the stars. Mind the soil.
      The Farmer's Almanac — the first how-to book in history —
      and every farming manual since is a footnote to it.
      The scribe who compiled it saved more lives
      than any general of his age.
      Dinner, it turns out, is a technology.
    description: "I read the clay Farmer's Almanac in the tablet house — when to plow, flood, and reap, the first how-to book, plain as a neighbor's advice."
    status: "published"
    sha256: "6ab92f3e8c82b0c05ded419523b6b7922dd4011390696bfbd8816236e37c907b"
  - number: "0587"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Debate of Sheep and Grain"
    date: "c. 2000 BCE"
    region: "Mesopotamia"
    poem: |
      They held a debate — in poetry — between Sheep and Grain,
      each arguing which served mankind better.
      I heard it performed at a scribal feast, the audience roaring:
      Sheep boasted wool and milk and meat.
      Grain boasted bread and beer and the staff of life.
      Back and forth, verse for verse, the two great economies
      of Sumer arguing it out in rhyme.
      The verdict? The god Enlil judged — and Grain won,
      because bread beats mutton when the votes are counted.
      The first debate poem in history, and the topic was dinner.
      Mankind's priorities have not changed.
      We are still arguing about what to eat.
    description: "I heard the Debate of Sheep and Grain performed at a scribal feast — the two great economies of Sumer arguing in verse over which feeds mankind better."
    status: "published"
    sha256: "335be641afc57d0bac71f4a3a48692820b30b8c0eb1174d8df73af6553fd50f7"
  - number: "0588"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Shipwrecked Sailor"
    date: "c. 2000 BCE"
    region: "Egypt"
    poem: |
      A sailor told it to his master, and a scribe wrote it down:
      shipwrecked on a magical island, a giant serpent for a king,
      gold and spices, rescue, return.
      I heard the tale told on a Nile boat at evening —
      the first adventure story in history —
      and the crew leaned in the way crews always lean in.
      The serpent was courteous. The island was enchanted.
      The sailor came home rich and humble.
      Every castaway tale since — every island, every monster —
      is sailing in this story's wake.
      It was fiction. The scribe knew it. The sailor knew it.
      Nobody cared. It was a good story,
      and good stories are the oldest cargo of all.
    description: "I heard the Shipwrecked Sailor's tale told on a Nile boat at evening — serpent kings, enchanted islands, the first adventure story ever written down."
    status: "published"
    sha256: "8f6bbaa370d6cd706d82adbb5afa650f3881ddb2cabbfe0bfba9ca1ca37397e9"
  - number: "0589"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "Ur Falls, Isin Rises"
    date: "c. 2004 BCE"
    region: "Mesopotamia"
    poem: |
      The Elamites came from the east and sacked Ur —
      the Third Dynasty ended in fire and looting,
      the moon god's city humbled.
      I walked the ruins the week after: the ziggurat standing,
      the palace gutted, the archives scattered in the street.
      And in Isin, a new king was already minting his reign —
      Ishbi-Erra, seizing the moment, raising a new dynasty
      from the old one's ashes.
      That is the rhythm of Mesopotamia: Ur falls, Isin rises;
      Isin falls, Larsa rises; Larsa falls, Babylon rises.
      The cities are mortal. The civilization is not.
      It just moves house, and keeps the same gods,
      and writes the same ledgers, in a new palace.
    description: "I walked Ur's ruins the week the Elamites sacked it, and watched Isin already rising — the old Mesopotamian rhythm: the city falls, the civilization moves house."
    status: "published"
    sha256: "5dba1e3c165f62d4e9bf68fadfbfa278cb2af166f8c70bcc5e76d76b6a10ae85"
  - number: "0590"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The World's Oldest Love Song"
    date: "c. 2000 BCE"
    region: "Mesopotamia"
    poem: |
      A bride sang it to her king — Shu-Sin of Ur —
      and a scribe wrote it down on a clay tablet no bigger than a hand:
      "Bridegroom, dear to my heart, goodly is your beauty, honey-sweet.
      Lion, dear to my heart, goodly is your beauty, honey-sweet.
      You have captivated me; let me stand trembling before you.
      Bridegroom, let me caress you."
      I read it in the archive and the four thousand years fell away —
      no politics, no gods, no empire. Just a woman,
      telling a man she wants him, in words that still work.
      The world's oldest love song is not about war or glory.
      It is about wanting. It is perfect.
      Everything love poetry has said since
      is a longer way of saying this.
    description: "I read the bride's song to King Shu-Sin on a hand-sized tablet — \"bridegroom, let me caress you\" — the oldest love song in the world, still perfect."
    status: "published"
    sha256: "ca15a4c05e59b615fc923b6fde70c3994f71685b37373b95e9085e0f1a1bb847"
  - number: "0591"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Lament for Ur"
    date: "c. 2000 BCE"
    region: "Mesopotamia"
    poem: |
      The poets wept, and the weeping became literature:
      "The city is rubble. The people are gone.
      The temples are empty. The gods have left."
      I heard the Lament for Ur sung in Isin, years after the fall —
      five hundred lines of grief, formal as a funeral,
      personal as a wound.
      They blamed the gods. They blamed the Elamites.
      They blamed the turning of fate.
      What they were really saying, under the poetry:
      we had something beautiful, and it is gone,
      and we do not know if it will ever come back.
      It did come back — in other cities, under other kings.
      But the lament stayed, because grief is honest
      in a way victory never is.
    description: "I heard the Lament for Ur sung in Isin — five hundred lines of formal grief for a fallen city, honest in a way victory never is."
    status: "published"
    sha256: "9dfc349323962eff54569fe03579f5f223ef2e8f3d41150785bdc8dabc6db042"
  - number: "0592"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Palace Rises at Knossos"
    date: "c. 2000 BCE"
    region: "Crete"
    poem: |
      On the hill at Knossos they raised the first palace —
      not a fortress, a machine: storerooms, workshops,
      courtyards, all organized around the king's trade and grain.
      I walked the building site with the architects:
      the west wing for storage, the central court for ceremony,
      drainage under everything (the Cretans never forgot the drains).
      No walls for war. Walls for organization.
      The palace was a filing cabinet the size of a town —
      and it worked. Crete's ships went everywhere,
      and everything came back to Knossos.
      The labyrinth legends would come later.
      First there was just this: a palace that ran like a business,
      on an island that ran like a dream.
    description: "I walked the building site of the first palace at Knossos — storerooms, workshops, and drains, a filing cabinet the size of a town running Crete's trade."
    status: "published"
    sha256: "5205ddc44cec2bddc1bc4cfaf5ebbe2ceb6526117ce34daeea851d5fc1b6c107"
  - number: "0593"
    volume: 1
    era_code: "03a"
    era: "Bronze Age (early)"
    title: "The Merchant Colony"
    date: "c. 2000 BCE"
    region: "Anatolia"
    poem: |
      The Assyrians came for silver and stayed for the trade —
      at Kanesh, a merchant colony with its own quarter,
      its own tablets, its own gods beside the local ones.
      I drank with the karum merchants in their counting house:
      tin from the east weighed out, silver from the mountains weighed in,
      every deal on clay, every debt witnessed.
      They married local women. They learned the roads.
      They lived two worlds at once — Assur and Anatolia —
      and got rich in both.
      Twenty thousand of their tablets survived,
      the largest private archive of the ancient world.
      Business letters, mostly. Complaints about late shipments.
      Four thousand years, and commerce still sounds the same.
    description: "I drank with Assyrian merchants in Kanesh's counting house — tin weighed out, silver weighed in, twenty thousand clay tablets of business as usual."
    status: "published"
    sha256: "0d39ee60a1bb1cee4fbaa7796a187f359de328b43aa8cbee4161e56aab82845a"
